<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101719" />
    <meta
      name="description"
      content="Agent Trials：面向 AI / Agent 面试的自适应刷题与间隔复习工作台。"
    />
    <title>Agent Trials · 智能体试炼塔</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand-lockup">
          <a class="brand" href="#dashboard" aria-label="Agent Trials 首页">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
            <span>
              <strong>Agent Trials</strong>
              <small>智能体试炼塔</small>
            </span>
          </a>
          <button class="icon-button mobile-only" type="button" data-action="toggle-sidebar" aria-label="打开导航">
            <span class="icon icon-menu"></span>
          </button>
        </div>

        <div class="workspace-label">学习工作台</div>
        <nav class="nav-list" id="mainNav">
          <button class="nav-item is-active" type="button" data-view="dashboard">
            <span class="nav-icon icon-grid"></span><span>今日训练</span>
          </button>
          <button class="nav-item" type="button" data-view="practice">
            <span class="nav-icon icon-play"></span><span>开始刷题</span><b class="nav-badge" data-nav-count="practice">—</b>
          </button>
          <button class="nav-item" type="button" data-view="library">
            <span class="nav-icon icon-library"></span><span>题库浏览</span>
          </button>
          <button class="nav-item" type="button" data-view="report">
            <span class="nav-icon icon-chart"></span><span>学习报告</span>
          </button>
        </nav>

        <div class="sidebar-rule"></div>
        <div class="sidebar-context">
          <div class="sidebar-context-label">当前题库</div>
          <div class="sidebar-source">
            <span class="source-orb">LLM</span>
            <span><strong>大模型全面试题</strong><small data-catalog-count>加载中…</small></span>
          </div>
        </div>

        <div class="sidebar-bottom">
          <div class="streak-chip"><span class="streak-dot"></span><span><b data-streak>0</b> 天连续学习</span></div>
          <button class="sidebar-link" type="button" data-action="reset-progress">
            <span class="icon icon-settings"></span><span>重置本地进度</span>
          </button>
          <p class="sidebar-note">进度只保存在当前浏览器，题库内容来自 GitHub 仓库。</p>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="breadcrumbs"><span>Agent Trials</span><i>/</i><strong data-breadcrumb>今日训练</strong></div>
          <div class="topbar-actions">
            <label class="global-search" for="globalSearch">
              <span class="icon icon-search"></span>
              <input id="globalSearch" type="search" placeholder="搜索题目或知识点" autocomplete="off" />
              <kbd>⌘ K</kbd>
            </label>
            <span class="today-label" data-today-label></span>
            <button class="avatar" type="button" data-action="profile" aria-label="学习者设置">JT</button>
          </div>
        </header>

        <div id="appView" class="app-view" aria-live="polite"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>

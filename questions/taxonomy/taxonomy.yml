schema_version: 1
version: v2
name: Agent Trials 知识模块体系
description: >-
  面向 AI、LLM 与 Agent 面试题的知识分类体系。来源文档不是知识模块，
  只保留在题目的 source 字段中用于溯源。

modules:
  - id: engineering
    label: 编程与通用工程
    description: 编程语言、后端基础和通用软件工程能力。
    children:
      - id: engineering.python
        label: Python 与编程基础
        keywords: [Python, GIL, asyncio, async, 协程, 线程, 进程, 装饰器, 生成器, 迭代器, FastAPI]
        source_hints: [Python面, Python 基础八股文, 语言基础篇 / Python]
      - id: engineering.java
        label: Java 与后端框架
        keywords: [Java, Spring, Spring MVC, MyBatis, JVM, 设计模式]
        source_hints: [Spring / MVC / Mybatis FrameWork篇, 语言基础篇 / Java]
      - id: engineering.backend
        label: 后端服务与 API 工程
        keywords: [API, REST, FastAPI, Flask, HTTP 服务, 中间件, 依赖注入, 微服务, DDD]
        source_hints: [工程化与部署, 工程实践, AI 应用开发]
      - id: engineering.software-engineering
        label: 软件工程与代码质量
        keywords: [软件工程, AI 编程, 代码质量, 代码审查, Code Review, 代码评审, 单元测试, 测试用例, Cursor, IDE, Git, 版本控制]
        source_hints: [工程化与部署, 工程实践]
      - id: engineering.data-systems
        label: 数据库、缓存与消息系统
        keywords: [MySQL, MySQL, Redis, Cache, 缓存, 数据库, Database, 消息队列, Kafka, MQ, 分布式锁]
        source_hints: [Cache & DataBase篇, Message Queue篇, 工程实践]
      - id: engineering.distributed-network
        label: 分布式系统与网络
        keywords: [分布式系统, 一致性, CAP, 网络, TCP, HTTP, DNS, RPC, 负载均衡, 服务发现]
        source_hints: [Distributed systems and consistency篇, 网络基础八股文]
      - id: engineering.devops
        label: 工程化、容器与部署
        keywords: [Docker, Kubernetes, K8s, 容器, CI/CD, 部署, DevOps, 监控, 日志, DDD]
        source_hints: [工程化与部署, Agent 部署 观测篇, 工程部署与优化]

  - id: ml
    label: 机器学习基础
    description: 机器学习、统计学习、优化和强化学习基础。
    children:
      - id: ml.fundamentals
        label: 机器学习基础理论
        keywords: [机器学习, 监督学习, 无监督学习, 分类, 回归, 聚类, 过拟合, 欠拟合, 特征工程, 交叉验证]
        source_hints: [机器学习专项面试（学习检测-面试都可用）]
      - id: ml.optimization-evaluation
        label: 优化、损失与基础评估
        keywords: [损失函数, 梯度下降, 优化算法, 正则化, Precision, Recall, F1, AUC, ROC, 准确率]
        source_hints: [训练优化与稳定性, 评估体系]
      - id: ml.nlp
        label: NLP 基础
        keywords: [NLP, 自然语言处理, 词向量, Word2Vec, 文本分类, 序列标注, NER, 语言模型]
        source_hints: [NLP专项高频面试（学习检测-面试都可用）]
      - id: ml.reinforcement-learning
        label: 强化学习基础
        keywords: [强化学习, Reinforcement Learning, MDP, 状态价值, Q-learning, 策略梯度, PPO]
        source_hints: [策略优化（PPO 为核心的 RL 阶段）, RLHF面试高频考点]

  - id: dl
    label: 深度学习基础
    description: 神经网络、视觉模型、序列模型和深度学习框架。
    children:
      - id: dl.neural-networks
        label: 神经网络与训练基础
        keywords: [神经网络, 反向传播, 激活函数, BatchNorm, LayerNorm, Dropout, 初始化, 梯度消失, 梯度爆炸]
        source_hints: [模块一：神经网络基础, 深度学习面（精选）]
      - id: dl.cnn-vision
        label: CNN 与视觉基础
        keywords: [CNN, 卷积神经网络, 卷积, 池化, ResNet, Vision Transformer, ViT, 图像分类, 目标检测]
        source_hints: [模块三：卷积神经网络 (CNN)]
      - id: dl.sequence-models
        label: 序列模型与 RNN
        keywords: [RNN, LSTM, GRU, 序列模型, Seq2Seq, 循环神经网络]
        source_hints: [模块四：序列模型与 RNN]
      - id: dl.generative
        label: 生成模型基础
        keywords: [生成模型, VAE, GAN, 变分自编码器, 生成对抗网络, 扩散模型, Diffusion, DDPM, DDIM]
        source_hints: [模块五：生成模型]
      - id: dl.pytorch
        label: PyTorch 与深度学习工程
        keywords: [PyTorch, Tensor, autograd, DataLoader, Dataset, CUDA, 算子, 模型训练代码]
        source_hints: [PyTorch 面试八股, 深度学习基础训练与推理部署]

  - id: llm
    label: Transformer 与大模型原理
    description: Transformer、语言模型架构、预训练和模型家族。
    children:
      - id: llm.transformer-architecture
        label: Transformer 与注意力机制
        keywords: [Transformer, Attention, Self-Attention, Multi-Head Attention, 注意力机制, 交叉注意力, Encoder, Decoder]
        source_hints: [Transfomer精选面试, 模型架构与预训练范式, 一：模型架构]
      - id: llm.tokenization-embeddings
        label: Token、Embedding 与位置编码
        keywords: [Tokenizer, Tokenization, BPE, WordPiece, SentencePiece, Token, Token化, 分词, 词表, 未登录词, OOV, MASK, CLS, SEP, Embedding, 词嵌入, 位置编码, RoPE, ALiBi]
        source_hints: [位置编码深度解析, 模型基础]
      - id: llm.pretraining-scaling
        label: 预训练与规模化规律
        keywords: [预训练, Pre-training, 预训练目标, 预训练任务, MLM, NSP, SOP, Causal LM, 自回归语言模型, AR, Span Corruption, 去噪自编码, Scaling Law, 涌现, 数据配比, 语言模型训练]
        source_hints: [二：预训练技术]
      - id: llm.model-families
        label: 大模型架构与模型家族
        keywords: [LLaMA, MoE, Mixture of Experts, 混合专家, 模型家族, Decoder-only, Encoder-only, Encoder-Decoder, 参数量, 模型规模]
        source_hints: [模型相关, 大模型基础篇, 经典模型与前沿架构]

  - id: training
    label: 模型训练与对齐
    description: 训练数据、微调、偏好对齐、蒸馏、分布式训练和显存。
    children:
      - id: training.data
        label: 训练数据与数据工程
        keywords: [训练数据, 数据清洗, 数据配比, 数据质量, 数据集, instruction data, 偏好数据]
        source_hints: [预训练技术, 训练方法与策略]
      - id: training.sft
        label: SFT 指令微调
        keywords: [SFT, 指令微调, 有监督微调, Supervised Fine-Tuning, LoRA 微调数据]
        source_hints: [SFT面（精选）]
      - id: training.peft
        label: 参数高效微调
        keywords: [LoRA, QLoRA, Adapter, PEFT, 参数高效微调, Prefix Tuning, Prompt Tuning]
        source_hints: [LoRA 高频面试题, 大模型微调-核心题]
      - id: training.preference-alignment
        label: 偏好对齐与 RLHF
        keywords: [RLHF, DPO, PPO, RLAIF, 奖励模型, Reward Model, 偏好对齐, 人类反馈]
        source_hints: [RLHF面试高频考点, 偏好数据与奖励建模, 策略优化（PPO 为核心的 RL 阶段）]
      - id: training.distillation
        label: 模型蒸馏
        keywords: [知识蒸馏, 模型蒸馏, Distillation, Teacher, Student, 蒸馏损失]
        source_hints: [大模型蒸馏面试-核心题]
      - id: training.distributed-memory
        label: 分布式训练与显存
        keywords: [分布式训练, Distributed Training, Data Parallel, Tensor Parallel, Pipeline Parallel, ZeRO, DeepSpeed, 显存, GPU 内存, NCCL]
        source_hints: [分布式训练-核心题, 显存问题-核心题, 显存优化技术全景]

  - id: inference
    label: 推理优化与模型服务
    description: 解码、缓存、量化、服务吞吐和模型部署。
    children:
      - id: inference.decoding
        label: 解码与生成策略
        keywords: [推理, 解码, Sampling, 采样, Temperature, Top-k, Top-p, Beam Search, 推测解码]
        source_hints: [大模型推理-核心题, 推理部署与高效化]
      - id: inference.kv-cache-quantization
        label: KV Cache 与量化
        keywords: [KV Cache, KV缓存, 量化, Quantization, GPTQ, AWQ, INT8, INT4, FP8, FlashAttention]
        source_hints: [推理优化与部署, 工程优化与算子, 第二梯队：工程优化与算子（Infra / 推理岗重点）]
      - id: inference.performance-serving
        label: 推理性能与服务化
        keywords: [Continuous Batching, PagedAttention, 吞吐, 延迟, QPS, 并发推理, vLLM, TGI, Triton]
        source_hints: [推理优化与部署, 生产部署、缓存与安全]
      - id: inference.deployment
        label: 模型部署与成本优化
        keywords: [模型部署, 推理服务, Serving, 部署架构, 模型并行, 服务化, 成本优化]
        source_hints: [工程实现与训练部署, 工程部署与优化, Agent 部署 观测篇]

  - id: prompt
    label: Prompt 与上下文工程
    description: Prompt 设计、上下文管理、结构化输出和推理策略。
    children:
      - id: prompt.design
        label: Prompt 设计与优化
        keywords: [Prompt, Prompt Engineering, 提示词, 提示工程, Few-shot, Zero-shot, In-context Learning, 思维链, CoT]
        source_hints: [提示词工程, 五：提示工程与上下文学习, 提示词与推理]
      - id: prompt.context
        label: 上下文窗口与上下文管理
        keywords: [上下文窗口, Context Window, 上下文管理, 上下文压缩, Context Engineering, 长上下文, Token 消耗]
        source_hints: [上下文管理与记忆, Agent Memory篇, 五：提示工程与上下文学习]
      - id: prompt.structured-output-tools
        label: 结构化输出与函数调用
        keywords: [Function Calling, Tool Call, 工具调用, 结构化输出, JSON Schema, Pydantic, 格式化输出]
        source_hints: [工具调用-函数调用-MCP, Agent Tool篇, 模型、提示与输出解析]
      - id: prompt.reasoning
        label: 推理与思考策略
        keywords: [推理能力, Reasoning, Chain of Thought, ReAct, 思维链, 自洽, Self-Consistency]
        source_hints: [ReAct-反思-任务规划, 提示词与推理]

  - id: rag
    label: RAG 与知识增强
    description: 文档处理、向量检索、重排、知识库和 RAG 评测。
    children:
      - id: rag.ingestion
        label: 文档处理与知识库构建
        keywords: [RAG, 文档解析, 文档切分, Chunk, Chunking, 知识库, 数据摄取, OCR, 元数据]
        source_hints: [RAG 与知识库, 文档处理与向量存储 (Data Connection), 检索增强生成（RAG）]
      - id: rag.retrieval
        label: Embedding 与检索
        keywords: [Embedding, 向量检索, 语义检索, 关键词检索, 混合检索, Hybrid Search, Retriever, 召回]
        source_hints: [RAG & Vector Database篇, 检索器与高级检索策略 (Retrievers), 六：检索增强生成（RAG）]
      - id: rag.reranking
        label: 重排与高级检索策略
        keywords: [Rerank, Reranker, 重排, Cross Encoder, 交叉编码器, 多路召回, 查询改写, Query Rewrite]
        source_hints: [检索器与高级检索策略 (Retrievers), 六：检索增强生成（RAG）]
      - id: rag.vector-database
        label: 向量数据库与索引
        keywords: [向量数据库, Vector Database, Milvus, FAISS, Elasticsearch, Chroma, 索引, ANN]
        source_hints: [RAG & Vector Database篇, RAG 与知识库, 文档处理与向量存储 (Data Connection)]
      - id: rag.advanced
        label: Graph RAG 与知识增强架构
        keywords: [Graph RAG, 知识图谱, Knowledge Graph, 多跳检索, Agentic RAG, Self-RAG, Corrective RAG]
        source_hints: [检索增强生成（RAG）]
      - id: rag.evaluation
        label: RAG 评测与质量优化
        keywords: [RAG 评测, RAGAS, Faithfulness, Answer Relevancy, Context Recall, 检索评估, 忠实度, 忠实性, 检索质量, 投毒文档, 对抗测试]
        source_hints: [RAG核心面（精选）, 评估与可靠性]

  - id: agent
    label: Agent 系统
    description: Agent 架构、工作流、工具、记忆、规划和多智能体。
    children:
      - id: agent.fundamentals
        label: Agent 基础与架构
        keywords: [Agent, AI Agent, 智能体, Agent 架构, Agent 核心组件, 自主性, Orchestrator]
        source_hints: [智能体基础, Agent 基础篇, Agent 架构篇, 七：AI Agent]
      - id: agent.workflow-planning
        label: 工作流、规划与反思
        keywords: [Workflow, 工作流, Planning, 任务规划, 任务分解, ReAct, Reflection, 反思, 状态机, 路由]
        source_hints: [工作流与智能体, ReAct-反思-任务规划, Agent 架构篇]
      - id: agent.tools-protocols
        label: 工具调用与 Agent 协议
        keywords: [MCP, Model Context Protocol, Function Calling, Tool, 工具调用, A2A, Skill, Agent Protocol]
        source_hints: [工具调用-函数调用-MCP, Agent Tool篇, 智能体与工具]
      - id: agent.memory
        label: Agent 记忆与上下文
        keywords: [Agent Memory, Agent 记忆, 长期记忆, 短期记忆, 记忆系统, 记忆压缩, 用户画像, Memory]
        source_hints: [上下文管理与记忆, Agent Memory篇, 六：记忆系统 (Memory)]
      - id: agent.multi-agent
        label: 多智能体协作
        keywords: [Multi-Agent, MultiAgent, 多智能体, 多 Agent, Agent 通信, Agent 协作, 子 Agent, 语义路由]
        source_hints: [多智能体]
      - id: agent.frameworks
        label: Agent 框架与 Harness
        keywords: [LangChain, LangGraph, AutoGen, CrewAI, LlamaIndex, Agent Framework, Harness, 沙箱]
        source_hints: [LangChain面（高频）, LangChain, Agent Framework, AI 最前线 (Harness-沙箱部署-K8s)篇]
      - id: agent.application-design
        label: Agent 应用场景与系统设计
        keywords: [Agent 系统设计, Agent 场景, 智能体场景, 商业化, 业务 Agent, 自动化 Agent, 应用设计]
        source_hints: [智能体场景设计题, Agent 系统设计篇]

  - id: evaluation
    label: 评测、安全与可靠性
    description: LLM、Agent、RAG 的评测、幻觉、安全和生产可靠性。
    children:
      - id: evaluation.llm
        label: 大模型评测
        keywords: [大模型评测, LLM Evaluation, Benchmark, 基准测试, 评测指标, 评测数据集, Perplexity]
        source_hints: [大模型评测面试题, 八：评估与可靠性, 模块七：常用评估与调试]
      - id: evaluation.hallucination
        label: 幻觉与事实性
        keywords: [幻觉, Hallucination, 事实性, Faithfulness, 事实核查, 证据链, Grounding]
        source_hints: [大模型幻觉面, 幻觉与评测]
      - id: evaluation.agent
        label: Agent 与任务评测
        keywords: [Agent 评测, Agent Evaluation, 任务成功率, 轨迹评测, trajectory, 智能体测试, 工作流评测]
        source_hints: [Agent 评测篇, 幻觉与评测, 评估与可靠性]
      - id: evaluation.safety-security
        label: 安全、合规与 Prompt 注入
        keywords: [Prompt Injection, 提示词注入, 越权, 安全护栏, Guardrail, 敏感词, 安全, 合规, 数据泄露]
        source_hints: [异常处理-安全-熔断, 安全与合规, 对齐与安全, 生产部署、缓存与安全]
      - id: evaluation.observability-reliability
        label: 可观测性、异常与可靠性
        keywords: [可观测性, Observability, 日志, Trace, 链路追踪, 超时, 重试, 熔断, 降级, 回滚, 可靠性]
        source_hints: [异常处理-安全-熔断, Agent 部署 观测篇, 八：回调、流式处理与异步]

  - id: multimodal
    label: 多模态与生成模型
    description: 视觉语言、图像生成、语音和多模态应用。
    children:
      - id: multimodal.vision-language
        label: 视觉语言模型
        keywords: [多模态, Multimodal, Vision-Language, VLM, CLIP, 图像理解, 图文对齐, 视觉语言模型]
        source_hints: [多模态面（精选）, 多模态面, 核心模型架构]
      - id: multimodal.diffusion-generative
        label: 扩散模型与图像生成
        keywords: [扩散模型, Diffusion, DDPM, DDIM, Stable Diffusion, ControlNet, 图像生成, GAN, VAE]
        source_hints: [模块五：生成模型, 多模态面（精选）]
      - id: multimodal.speech-audio
        label: 语音与音频模型
        keywords: [语音, 音频, ASR, TTS, Whisper, 语音识别, 语音合成]
        source_hints: [多模态面（精选）, 前沿与应用领域概览]
      - id: multimodal.alignment-applications
        label: 多模态训练与应用
        keywords: [多模态训练, 多模态对齐, 图像问答, OCR, 视频理解, 多模态应用]
        source_hints: [训练方法与策略, 对齐与安全, 前沿与趋势]

  - id: system
    label: AI 应用与系统设计
    description: 面向生产 AI 应用的架构设计、业务流程和系统权衡。
    children:
      - id: system.ai-product-design
        label: AI 产品与应用架构
        keywords: [系统设计, 应用架构, 产品设计, 需求分析, 业务逻辑, AI 应用, 方案设计, 架构设计]
        source_hints: [应用与系统设计手撕（偏业务逻辑）, Agent 系统设计篇, 行业应用]
      - id: system.api-service
        label: AI API 与服务架构
        keywords: [API 设计, 网关, 服务架构, 流式响应, SSE, WebSocket, 限流, 鉴权]
        source_hints: [工程化与部署, 工程实践]
      - id: system.algorithms-coding
        label: 算法与代码实现
        keywords: [手撕, 编程题, 代码实现, 算法, 数据结构, 复杂度, 伪代码, 实现一个]
        source_hints: [大模型手撕-核心题]
      - id: system.data-platform
        label: 数据平台与生产链路
        keywords: [数据 pipeline, 数据管道, ETL, 数据平台, 生产链路, 数据流, 流式处理]
        source_hints: [工程实践, 生产部署、缓存与安全]

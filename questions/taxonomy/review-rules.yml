schema_version: 1
description: >-
  针对来源分类内部稳定子专题的批量复核规则。规则只用于高一致性簇，
  单题 overrides.jsonl 的优先级更高。

rules:
  - id: langchain-retriever-reranking
    source_collection: feishu-llm-complete
    source_category: LangChain面（高频）
    path_contains: 五：检索器与高级检索策略 (Retrievers)
    title_pattern: '(?i)Rerank|重排|重排序|压缩|Compression|多阶段检索'
    primary: rag.reranking
    secondary: [rag.retrieval]

  - id: langchain-retriever-advanced
    source_collection: feishu-llm-complete
    source_category: LangChain面（高频）
    path_contains: 五：检索器与高级检索策略 (Retrievers)
    title_pattern: '(?i)Self-RAG|SelfQuery|MultiStep|MultiQuery|HyDE|自适应 RAG|自我反思 RAG|多步检索|多查询|假设文档'
    primary: rag.advanced
    secondary: [rag.retrieval]

  - id: langchain-retriever-evaluation
    source_collection: feishu-llm-complete
    source_category: LangChain面（高频）
    path_contains: 五：检索器与高级检索策略 (Retrievers)
    title_pattern: '评估|评测|指标|A/B|定位.*阶段'
    primary: rag.evaluation
    secondary: [rag.retrieval]

  - id: langchain-retriever-ingestion
    source_collection: feishu-llm-complete
    source_category: LangChain面（高频）
    path_contains: 五：检索器与高级检索策略 (Retrievers)
    title_pattern: '(?i)父子文档|Parent Document'
    primary: rag.ingestion
    secondary: [rag.retrieval]

  - id: langchain-retriever-vector-database
    source_collection: feishu-llm-complete
    source_category: LangChain面（高频）
    path_contains: 五：检索器与高级检索策略 (Retrievers)
    title_pattern: '(?i)VectorStore|向量存储|向量数据库'
    primary: rag.vector-database
    secondary: [rag.retrieval]

  - id: langchain-retriever-retrieval
    source_collection: feishu-llm-complete
    source_category: LangChain面（高频）
    path_contains: 五：检索器与高级检索策略 (Retrievers)

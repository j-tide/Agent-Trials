    1、基础题：多 Agent 系统为什么比单 Agent 更容易出现成本失控？

    难度级别：⭐（成本构成理解、Token 计费原理）

    多 Agent 系统每个 Agent 调用都独立消耗 Token，成本是单 Agent 的 N 倍起步。如果 Agent 之间形成循环调用或无限重试，Token 消耗会指数级增长。没有预算上限的系统，一个复杂任务可能烧掉几十美元。

    ---

    2、进阶题：多 Agent 系统的 LLM 调用成本如何控制？有哪些防止调用次数爆炸的有效机制？

    难度级别：⭐⭐⭐（Agent 调用轮次上限、上下文复用、早停机制、模型分级）

    1️⃣ Common Answer

    每个 Agent 都要消耗 Token，所以要控制成本。可以设置最大调用次数，防止死循环。对不变的内容做缓存。结果差不多了就提前停。另外可以用便宜的模型，不是每个 Agent 都要用最强的。

    2️⃣ Impressive Answer

    我会从调用次数、Token 量、模型选择、监控告警四个维度来回答这个问题：

    - 调用轮次上限。LangGraph 通过 recursion_limit 设置硬上限，但仅靠这个不够——还需要在 Supervisor 的路由 Prompt 里加规则：同一个 Agent 连续调用超过 3 次仍无进展，就返回当前最优结果，防止无效循环。

    - 早停机制。不等跑完所有轮次就提前结束。判断信号有三类：置信度达阈值（Supervisor 评判"已足够好"）、任务完成信号（Agent 返回 {"status": "complete"}）、结果收敛（连续两轮输出相似度 > 0.95）。

    - 上下文复用。这是最容易被忽视但效果显著的点。子 Agent 不应每次独立做 RAG 检索，应该复用父 Agent 已检索的上下文。对不变的系统规则、API 文档，用 OpenAI Prompt Caching 或 Anthropic Cache Control 缓存 System Prompt，可以节省 50-90% 的 Token 成本。

    - 模型分级。简单路由和格式转换用 GPT-4o-mini / Claude Haiku；核心推理和代码生成用 GPT-4o / Claude Sonnet；复杂分析和最终综合用 o1 / Claude Opus。在生产中还需设置每次任务的 Token 预算上限，超出时自动降级或停止执行。


  prompt: "⚖️ 2. 什么情况下该用多 Agent，什么情况下反而不该用？"
answer:
  mode: rubric
  reference_answer: |-
    用还是不用，核心看一个比值：分工带来的增益 能否覆盖 引入的协调成本。我们可以用一个决策矩阵来判断。

    [图片内容未导入]

    你的任务是否满足以下条件？
      ├─ 任务可以自然分解为多个相互独立的子任务？  (是 → +1)
      ├─ 子任务需要不同的专业工具或知识领域？      (是 → +1)
      ├─ 子任务之间存在可并行执行的无依赖环节？     (是 → +1)
      ├─ 单个 Agent 的上下文窗口已经不足以承载全流程？(是 → +1)
      └─ 系统未来需要独立迭代或分配给不同团队维护？   (是 → +1)

    总分 ≥ 3？ → 用多 Agent，收益大于成本。
    总分 1~2？ → 单 Agent + 良好设计的工具组合即可，无需引入多 Agent 的调度复杂度。
    总分 = 0？ → 绝对不要用多 Agent。协调开销（状态传递、错误处理、协议开销）远大于收益。

    具体来说，这些场景适合单 Agent：

    - 单一类型的任务：如“帮我总结这篇 PDF”，没有分解的必要。

    - 对延迟敏感：多 Agent 通信、序列化、网络往返会增加秒级延迟，实时对话场景可能不适用。

    - 工具集有限：如果所有操作都围绕同一个数据库和一组 API，一个精心设计的 Agent 足够覆盖。

    - 团队规模小、维护成本敏感：多 Agent 意味着多套 prompt、多个部署单元、更复杂的监控，小团队容易被拖垮。

    这些场景必须上多 Agent：

    - 企业级复杂工作流：如“入职流程”，涉及 HR 系统、IT 权限开通、财务报税，需要不同领域的专业 Agent。

    - 需要异构能力的组合：一个 Agent 擅长逻辑推理，另一个擅长创意写作，第三个专门做代码生成，Orchestrator 根据子任务类型动态路由。

    - 高可用性要求：关键任务不能单点故障，需要 Agent 冗余和故障转移。

    一个反例： 你的需求是“根据用户输入的描述，搜索产品库并返回价格”，这个任务明确、步骤少，用单 Agent + Function Calling 就很好。如果你硬拆成“意图识别 Agent + 搜索 Agent + 格式化 Agent”，不仅增加延迟，还引入序列化开销，完全是过度设计。


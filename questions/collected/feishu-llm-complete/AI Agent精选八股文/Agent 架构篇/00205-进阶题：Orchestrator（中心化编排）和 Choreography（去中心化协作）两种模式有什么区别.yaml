  prompt: 2、进阶题：Orchestrator（中心化编排）和 Choreography（去中心化协作）两种模式有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（中心协调者 vs 事件驱动、耦合度、可扩展性、故障传播）

    1️⃣ Common Answer

    Orchestrator 是中心化的，有一个主 Agent 负责协调其他 Agent，所有决策都由它来做。Choreography 是去中心化的，Agent 之间直接协作，没有中心控制。Orchestrator 比较��易控制，但中心节点可能成为瓶颈。Choreography 比较灵活，但可能难以理解和调试。

    2️⃣ Impressive Answer

    两种编排模式在控制流、耦合度、可扩展性等方面有本质差异：

    - 控制流与决策机制

    - 耦合度与依赖关系

    - 可扩展性与性能

    - 可观测性与调试

    - 选型建议


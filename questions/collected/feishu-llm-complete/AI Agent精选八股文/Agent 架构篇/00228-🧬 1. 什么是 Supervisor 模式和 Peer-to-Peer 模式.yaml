content:
  prompt: "\U0001F9EC 1. 什么是 Supervisor 模式和 Peer-to-Peer 模式？"
answer:
  mode: rubric
  reference_answer: |-
    这两种模式的核心区别在于控制流的集中程度：谁来决定下一步做什么？是有一个总指挥，还是大家地位平等、互相商量？

    Supervisor 模式（监督者模式）

    [图片内容未导入]

    - 决策权：完全集中在上方的 Supervisor。它理解全局目标，将复杂任务拆解为子任务，根据各个 Worker 的能力进行分派，并监控执行结果。Worker 之间不直接通信，所有信息和结果都回流到 Supervisor。

    - 角色：Supervisor 是“大脑”，Workers 是“手脚”。典型的星型拓扑。

    Peer-to-Peer 模式（对等模式/去中心化模式）

    [图片内容未导入]

    - 决策权：分散在各个 Agent 之间。没有固定的全局指挥官。每个 Agent 拥有自己独立的视角和局部目标，当它认为需要其他 Agent 的信息或能力时，可以主动发起对话、传递任务或请求协助。

    - 角色：所有 Agent 地位平等，是一个“团队协作”模式。可以是全连接拓扑，也可以是基于某种共识机制的动态链接。

    最直观的类比：

    - Supervisor 模式：交响乐团，指挥（Supervisor）统一控制节奏、声部进出，乐手（Worker）只看指挥，互相之间不需要交流。

    - Peer-to-Peer 模式：爵士乐队即兴演奏，乐手们互相听、互相给信号，谁都可以发起一段新的旋律，没有固定的指挥。


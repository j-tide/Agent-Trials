answer:
  mode: rubric
  reference_answer: |-
    ⭐⭐ 考察要点：Prompt 注入传播、权限越界、工具滥用、数据泄露

    1️⃣ Common Answer

    主要有 Prompt 注入，Agent 可能被攻击。权限越界，Agent 可能访问不该访问的东西。工具滥用，Agent 可能用工具做坏事。数据泄露，敏感信息可能被泄露。还有就是 Agent 之间互相欺骗。

    2️⃣ Impressive Answer

    多 Agent 系统的安全风险可以分为输入层、执行层、协作层、输出层四个维度：

    - 输入层 - Prompt 注入传播

    - 执行层 - 权限越界与工具滥用

    - 协作层 - 数据泄露与欺骗

    - 输出层 - 内容安全与隐私

    风险等级评估：Prompt 注入传播是最高风险，因为它可以触发其他所有风险。其次是权限越界，因为它可能导致直接的数据泄露或系统破坏。


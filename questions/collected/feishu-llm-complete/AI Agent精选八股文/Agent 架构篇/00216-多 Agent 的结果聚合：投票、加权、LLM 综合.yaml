    1、基础题：多 Agent 系统中常见的结果聚合方式有哪些？

    难度级别：⭐⭐（结果聚合策略、多数投票、LLM 综合）

    常见的结果聚合策略有三种：多数投票（让多个 Agent 独立给出答案，取出现次数最多的）、加权聚合（根据每个 Agent 的历史表现或模型能力动态分配权重）、LLM 综合（用一个聚合 Agent 读取所有子 Agent 的输出，综合生成最终答案）。三种方式在准确性、成本、延迟上的权衡差异很大，需要根据任务类型选择。

    ---

    2、进阶题：多数投票、加权聚合、LLM 综合各自适用什么场景？Mixture of Agents 的思路是什么？

    难度级别：⭐⭐⭐（聚合策略适用边界、MoA 架构、成本与质量权衡）

    1️⃣ Common Answer

    多数投票就是取最多的答案，适合有对错的问题。加权就是不同 Agent 权重不一样。LLM 综合是用一个 LLM 来汇总，适合生成文本。Mixture of Agents 就是多个模型先给答案，再用一个模型来综合，效果会更好。

    2️⃣ Impressive Answer

    我会从三种策略的适用边界和 MoA 的系统化思路来分析：

    - 多数投票适合答案空间有限的任务。比如分类、是/否判断、数学推理等有确定性答案的场景。Self-Consistency 就是这个思路的典型应用——同一问题让 LLM 推理多次，投票过滤偶发错误。但对于开放式生成任务，多个答案语义等价但形式各异，简单投票根本无法工作。

    - LLM 综合最灵活但成本最高。能处理矛盾输出、给出有理有据的综合判断，但会额外增加一次 LLM 调用，且输入 Token 随子 Agent 数量线性增长，成本要仔细评估。

    - MoA 是 LLM 综合的系统化版本。来自 Together AI 的研究，分两层：Proposer 层用多个不同 LLM（GPT-4、Claude、Llama）并行生成多样化候选答案，Aggregator 层用强模型综合输出。核心洞见是不同模型有不同偏差，输出具有多样性，综合后能互补，实验表明 MoA 在多个 Benchmark 上能超越单个最强模型。工程上 Proposer 层可以并行化以优化延迟，但总成本仍然较高，要评估 ROI。


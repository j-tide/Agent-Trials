  prompt: 1、进阶题：LangGraph、CrewAI、AutoGen 三大框架的核心差异是什么？如何选型？⭐⭐⭐
answer:
  mode: rubric
  reference_answer: |-
    - 问题类型：对比分析

    - 难度级别：⭐⭐⭐

    - 考察要点：编排模型（状态图 vs 角色任务 vs 对话）、灵活性、学习曲线、适用场景

    1️⃣ Common Answer

    这三个框架都是做多 Agent 的，但不太一样。LangGraph 是用图的方式编排 Agent，状态可以在节点间传递，比较灵活。CrewAI 是基于角色和任务的，每个 Agent 有自己的角色，然后分配任务。AutoGen 是通过对话的方式，Agent 之间互相聊天来完成任务。选型的话，如果需要复杂的流程控制用 LangGraph，如果是明确的任务分工用 CrewAI，如果是对话式的场景用 AutoGen。

    2️⃣ Impressive Answer

    三大框架的核心差异在于编排模型和适用场景，需要根据需求特性进行选型：

    - LangGraph：状态图编排模式

    - CrewAI：角色-任务协作模式

    - AutoGen：对话式协作模式

    - 技术选型决策树


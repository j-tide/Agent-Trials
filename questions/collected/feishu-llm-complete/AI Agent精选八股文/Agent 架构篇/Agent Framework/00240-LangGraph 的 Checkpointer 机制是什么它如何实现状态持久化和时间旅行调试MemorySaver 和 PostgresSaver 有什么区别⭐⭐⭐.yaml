  reference_answer: "难度级别：⭐⭐⭐（状态管理、持久化、调试能力）\n\n1️⃣ Common Answer\n\nCheckpointer
    就是 LangGraph 用来保存状态的功能。每次节点执行完，它会把当前状态存起来，这样如果程序崩溃了可以从上次的地方继续。时间旅行调试就是可以回到之前的某个状态看看当时发生了什么。MemorySaver
    是存在内存里的，PostgresSaver 是存在数据库里的，区别就是一个快一个持久化。\n\n2️⃣ Impressive Answer\n\n- Checkpointer
    核心机制\n\n- 时间旅行调试实现\n\nfrom langgraph.checkpoint.memory import MemorySaver\nfrom
    langgraph.graph import StateGraph\n   \ncheckpointer = MemorySaver()\ngraph =
    StateGraph(state_schema, checkpointer=checkpointer)\n   \n# 执行并获取所有快照\nconfig
    = {\"thread_id\": \"debug-123\"}\nresult = graph.invoke(initial_state, config)\n
    \  \n# 时间旅行：查看第 3 步的状态\nfor snapshot in graph.get_state_history(config):\n    if
    snapshot.metadata[\"step\"] == 3:\n        print(snapshot.values)  # 查看当时的状态\n
    \       # 可以从这一步重新执行\n        graph.invoke(None, config, snapshot.config)\n\n-
    MemorySaver vs PostgresSaver 区别\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]"

  prompt: "⚡ 13. LangChain 的 LCEL 是什么？有什么优势？"
answer:
  mode: rubric
  reference_answer: |-
    LCEL（LangChain Expression Language） 是 LangChain 2.0 的核心设计范式，一种用管道符 | 把处理单元串联成数据流管道的声明式语言。

    [图片内容未导入]

    每个组件都是 Runnable 对象，拥有统一的接口：invoke、ainvoke、stream、astream、batch。| 操作符把它们首尾相连，前一个的输出自动成为后一个的输入。

    代码示例：一个简单的 LCEL 链

    ```python
    from langchain_core.prompts import ChatPromptTemplate
    from langchain_openai import ChatOpenAI
    from langchain_core.output_parsers import StrOutputParser

    prompt = ChatPromptTemplate.from_template("给一家卖{product}的公司起三个名字")
    model = ChatOpenAI(model="gpt-4o", temperature=0.8)
    chain = prompt | model | StrOutputParser()

    names = chain.invoke({"product": "智能猫砂盆"})
    print(names)
    ```

    五大核心优势：

    - 声明式组合
    不需要写胶水代码，管道符直接表达数据流向。一个链可以轻易拆成几段独立测试，也可以像乐高一样重新拼装。

    - 统一的 Runnable 接口
    所有组件都支持同步/异步、批量、流式调用。你想从 invoke 切换到 astream 做流式输出，只需把调用方法换一下，链本身无需任何修改。

    - 自动并行与优化
    RunnableParallel 能自动识别无依赖的分支，并发执行它们。RunnablePassthrough 让你灵活透传原始输入，配合字典拆分实现复杂的多路处理。

    ```python
    from langchain_core.runnables import RunnableParallel
    # 同时生成大纲和正文
    parallel_chain = RunnableParallel(
        outline=outline_chain,
        article=article_chain
    )
    result = parallel_chain.invoke({"topic": "AI"})
    # result 是 {"outline": "...", "article": "..."}
    ```

    - 原生流式支持
    任何一个 LCEL 链，直接 .stream() 就能逐 token 输出，大幅提升用户体验。

    - 可观测性
    每一步的输入输出都被透明追踪，配合 LangSmith 可以一眼看到数据在哪一步变质，调试效率成倍提升。

    一句话概括：LCEL 让你从“调用函数”的思维，切换到“定义数据流水线”的思维。 这条流水线上的每个节点都可以独立替换、测试、复用，这是 LangChain 2.0 工程化能力飞跃的根基。


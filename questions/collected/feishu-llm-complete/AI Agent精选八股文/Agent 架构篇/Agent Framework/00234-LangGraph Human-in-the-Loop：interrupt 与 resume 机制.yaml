    1、LangGraph 的 interrupt_before 是什么？

    难度级别：⭐（interrupt_before/after 基本配置）

    interrupt_before 是图编译时的全局配置，指定在哪些节点执行前自动暂停等待人工确认，不需要修改节点代码，适合统一拦截高风险操作。interrupt_after 是节点执行后暂停，用于人工审查结果。两者都依赖 Checkpointing，暂停状态会持久化，等待人工用 Command(resume=...) 恢复执行。

    ---

    2、LangGraph 如何实现 Human-in-the-Loop？请解释 interrupt() 的工作原理和 Command(resume=...) 恢复机制？

    难度级别：⭐⭐⭐（interrupt 控制流中断原理、GraphInterrupt 异常、Command resume、Checkpointing 底层支撑）

    1️⃣ Common Answer

    在节点里调用 interrupt() 就会暂停执行，等用户输入后用 Command(resume=用户输入) 恢复。也可以在 compile() 时配置 interrupt_before 指定在哪些节点前暂停。这个功能用于需要人工审核的场景。

    2️⃣ Impressive Answer

    我会从原理、用法和生产设计三个层面来讲：

    - interrupt() 的本质：控制流中断，不是 sleep。调用 interrupt() 时，框架做三件事：把当前 State（含 interrupt 的值）写入 Checkpoint → 抛出 GraphInterrupt 特殊异常 → graph.invoke() 捕获该异常并返回，附带 interrupt 的内容。整个图执行就此暂停，状态完整持久化，等待外部恢复。

    - Command(resume=...) 恢复执行的机制。人工操作完成后，用同一个 thread_id 再次调用 graph.invoke(Command(resume="approve"), config)，框架从 Checkpoint 恢复 State，把 resume 的值注入 interrupt() 的返回值，图从暂停点继续执行——不是重头跑，而是接着走。

    - 生产设计：interrupt_before vs 节点内 interrupt 的选择。interrupt_before/after 是编译时的无侵入全局配置，适合统一治理高风险节点；节点内手动调用 interrupt() 更灵活，可以把上下文（比如"要删除的具体数据"）一起传给审核人。完整的生产异步审核系统通常是：Agent 触发 interrupt → 写入消息队列 → 推送通知给审核人 → 审核人在 Web 界面操作 → 后端调用 graph.invoke(Command(resume=...), config)，同时需要设计超时处理，超时后自动拒绝或升级审核。


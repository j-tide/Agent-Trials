content:
  prompt: "⚖️ 2. CrewAI 的 Process 有 Sequential 和 Hierarchical 两种，有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    这两种 Process 就像两个不同的项目管理方式：一条流水线（Sequential） vs 一个项目经理分派任务（Hierarchical）。

    [图片内容未导入]

    Sequential 的特点：

    - 像工厂流水线，任务一个接一个执行，后面任务可以拿到前面任务的输出作为上下文。

    - 简单、确定性强，适合步骤明确、依赖关系固定的流程。

    - 缺点是缺乏弹性：如果中间某步失败，整个链条可能卡住，而且无法并行处理无依赖的任务。

    Hierarchical 的特点：

    - 自动创建一个 Manager Agent（内部 LLM），它阅读所有任务和 Agent 的描述，然后决定什么时候把哪个任务分配给哪个 Agent。

    - Manager 还能审查产出、要求返工、拆分任务，甚至调整顺序。

    - 更灵活，适合复杂、无法提前完全固定步骤的场景，但多了一次 LLM 管理开销，行为也相对不可预测。

    代码上的体现：

    from crewai import Crew, Process

    # 串行流程：按列表顺序执行
    crew_sequential = Crew(
        agents=[...],
        tasks=[task1, task2, task3],
        process=Process.sequential  # 默认值
    )

    # 层级流程：让 Manager 自主决策
    crew_hierarchical = Crew(
        agents=[...],
        tasks=[task1, task2, task3],
        process=Process.hierarchical,
        manager_llm=ChatOpenAI(model="gpt-4o")  # 需要指定管理者模型
    )

    选型建议： 如果流程可以画成一条清晰的甘特图，用 Sequential，简单可靠；如果流程像“根据初步分析结果再决定后续分析方向”这类带动态判断的，就用 Hierarchical 给 Agent 更大的自主空间。


  prompt: 7、CrewAI 的 Memory 机制（短期记忆、长期记忆、实体记忆）如何工作？对多轮任务执行有什么影响？⭐⭐⭐
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（Memory 机制、多轮任务、上下文传递）

    1️⃣ Common Answer

    嗯，CrewAI 的 Memory 机制就是让 Agent 记住之前执行过的任务。它有三种记忆，短期记忆就是记住最近几轮对话，长期记忆就是保存到数据库里，实体记忆就是记住人名地名这些实体。对多轮任务执行来说，有了记忆就可以让后面的任务用到前面的结果，不用重复输入。比如前面查了某个数据，后面分析的时候就能直接用。不过记忆太多了可能会影响性能，所以要注意控制。

    2️⃣ Impressive Answer

    CrewAI 的 Memory 机制是支持多 Agent 协作和多轮任务执行的核心能力，通过三种类型的记忆实现不同层次的信息持久化和复用。

    - 短期记忆

    - 长期记忆

    - 实体记忆

    对多轮任务执行的影响：

    from crewai import Agent, Task, Crew, Process
    from crewai.memory import LongTermMemory, ShortTermMemory, EntityMemory

    # 配置三种记忆
    memory_config = {
        "short_term": ShortTermMemory(),
        "long_term": LongTermMemory(
            storage_backend="chroma",
            embedding_model="text-embedding-3-small"
        ),
        "entity": EntityMemory(
            entity_extractor="openai",
            enable_entity_graph=True
        )
    }

    # 创建带记忆的 Agent
    researcher = Agent(
        role="研究员",
        goal="收集并分析市场数据",
        memory=memory_config  # 绑定记忆配置
    )

    # Task 依赖记忆
    task1 = Task(
        description="收集 2024 年 AI 市场数据",
        expected_output="JSON 格式的市场数据"
    )

    task2 = Task(
        description="基于 task1 的数据，分析增长趋势",
        context=[task1],  # 明确依赖关系
        expected_output="趋势分析报告"
    )

    crew = Crew(
        agents=[researcher],
        tasks=[task1, task2],
        process=Process.sequential,
        memory=True  # 启用记忆
    )

    关键影响：

    - 上下文传递：Task 间自动传递历史信息，减少重复输入

    - 知识积累：长期记忆让 Agent 越用越聪明，积累领域知识

    - 一致性保证：实体记忆确保多轮对话中实体指代一致

    - 性能权衡：记忆占用 Token 空间，需设置 max_token_limit 控制成本


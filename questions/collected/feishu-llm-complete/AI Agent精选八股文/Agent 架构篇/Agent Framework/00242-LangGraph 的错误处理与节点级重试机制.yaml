    1、LangGraph 节点抛出异常时的默认行为是什么？

    难度级别：⭐（考察要点：异常透传、执行中断、Checkpoint 状态丢失）

    节点函数抛出未捕获的异常时，LangGraph 立即停止图的执行，异常透传给调用方（.invoke() 或 .astream()）。如果没有配置 checkpointer，所有已执行节点的状态变更会丢失，图从"进行中"变为"失败"状态。开发阶段这个行为有助于快速发现问题，但生产环境必须设计更精细的错误处理机制。

    ---

    2、如何在 LangGraph 中设计节点级重试策略和错误状态路由，构建健壮的 Agent 错误处理体系？

    难度级别：⭐⭐⭐（考察要点：RetryPolicy 配置与 retry_on 精确指定、错误状态写入 State、条件边路由到 error_handler、Checkpoint 恢复机制）

    1️⃣ Common Answer

    可以给节点配置 RetryPolicy 来自动重试，还可以专门定义一个错误处理节点，通过条件边路由过去处理错误，这样 Agent 就不会直接失败了。

    2️⃣ Impressive Answer

    我会从分层防御的视角来回答，LangGraph 的错误处理分三个层次：

    - 第一层：节点级 RetryPolicy，处理瞬时故障。对于网络超时、限流 429 等瞬时错误，用 RetryPolicy 配置自动重试：max_attempts=3、指数退避 backoff_factor=2.0。关键在于 retry_on 参数要精确指定需要重试的异常类型（如 openai.RateLimitError、httpx.TimeoutException），避免对逻辑错误（ValueError 意味着输入有问题）也无意义地重试，重试三次还是会失败。

    - 第二层：错误状态路由，处理业务级错误。对于重试也无法恢复的错误，核心思路是"不抛异常，写入状态"——在节点内 try-except 捕获异常，把错误信息写入 State 的 error 字段，通过条件边路由到专门的 error_handler 节点。error_handler 可以让 LLM 根据错误信息换一种策略重新规划，或者在超过重试阈值后输出降级回复（比如"请联系人工客服"），实现优雅降级。

    - 第三层：Checkpoint 持久化，处理系统级恢复。配置 SqliteSaver 等 checkpointer 后，图的状态在每个节点执行后持久化，出错时可从最后一个成功的 checkpoint 恢复，不需要从头重跑。对于长时间运行的 Agent 任务价值极大。三层叠加才能构建真正健壮的生产级 Agent。


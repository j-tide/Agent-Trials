content:
  prompt: LangGraph 中如何实现子图（Subgraph）？子图和父图之间的状态如何传递和隔离？⭐⭐⭐
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（模块化设计、状态隔离、嵌套编排）\n\n1️⃣ Common Answer\n\n子图就是把一个图放到另一个图里面用。可以用
    add_node 把子图加到父图里。状态传递的话，子图可以访问父图的状态，但子图内部的变量外面看不到。隔离就是子图有自己的作用域，不会影响父图。\n\n2️⃣
    Impressive Answer\n\n- 子图实现方式\n\nfrom langgraph.graph import StateGraph, END\nfrom
    typing import TypedDict\n   \n# 子图状态定义\nclass SubgraphState(TypedDict):\n    sub_data:
    str\n    sub_result: str\n   \n# 创建子图\nsubgraph = StateGraph(SubgraphState)\nsubgraph.add_node(\"sub_step1\",
    lambda state: {\"sub_result\": state[\"sub_data\"] + \" processed\"})\nsubgraph.add_edge(\"sub_step1\",
    END)\nsubgraph = subgraph.compile()\n   \n# 父图状态定义\nclass ParentState(TypedDict):\n
    \   parent_data: str\n    sub_output: str\n   \n# 创建父图并添加子图\nparent_graph = StateGraph(ParentState)\nparent_graph.add_node(\"call_subgraph\",
    subgraph)\n\n- 状态传递机制\n\n# 状态映射示例\ndef map_parent_to_sub(state: ParentState) ->
    SubgraphState:\n    return {\"sub_data\": state[\"parent_data\"]}\n   \ndef map_sub_to_parent(state:
    SubgraphState) -> ParentState:\n    return {\"sub_output\": state[\"sub_result\"]}\n
    \  \nparent_graph.add_node(\"call_subgraph\", subgraph, \n                     input=map_parent_to_sub,\n
    \                    output=map_sub_to_parent)\n\n- 状态隔离原则\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

content:
  prompt: LangGraph 如何实现 Human-in-the-Loop（人机协作）？
answer:
  mode: rubric
  reference_answer: |-
    难度：⭐⭐⭐（中断机制、人工审核、工作流编排）

    1️⃣ Common Answer：

    Human-in-the-Loop 就是让 Agent 在某些节点停下来，等人工确认后再继续。LangGraph 可以设置 interruptbefore 或 interruptafter 参数，在特定节点前后暂停。人可以修改 State，然后 Agent 继续执行。

    2️⃣ Impressive Answer：

    LangGraph 的 Human-in-the-Loop 基于中断机制 + Checkpoint 持久化，实现了 Agent 与人的无缝协作。核心是在工作流的关键节点插入"人工确认点"，让人类可以审核、修正或引导 Agent 的行为。

    三种典型模式：

    模式一：审核确认模式（适合敏感操作）

    from langgraph.graph import StateGraph, END

    # 在执行支付前中断，等待人工确认
    app = workflow.compile(
        checkpointer=PostgresCheckpointSaver.from_conn_string(DB_URL),
        interrupt_before=["execute_payment"]
    )

    # Agent 执行到 execute_payment 前会暂停
    config = {"configurable": {"thread_id": "order_456"}}
    result = app.invoke({"messages": [{"role": "user", "content": "支付 100 元"}]}, config)
    # 此时 result.status == "interrupted"

    # 人工审核后继续执行
    approved_state = app.get_state(config)
    approved_state.values["approval_status"] = "approved"
    app.update_state(config, approved_state.values)
    result = app.invoke(None, config)  # 继续执行

    模式二：人工修正模式（适合 Agent 出错）

    # Agent 生成错误回答，人工修正后继续
    state = app.get_state(config)
    state.values["messages"].append({
        "role": "human",
        "content": "你的回答有误，正确答案是..."
    })
    app.update_state(config, state.values)

    模式三：人工引导模式（适合复杂决策）

    # 在决策节点插入人工选择，决策后暂停让人工确认
    app = workflow.compile(
        checkpointer=memory,
        interrupt_after=["decide_strategy"]
    )

    工程实践要点：

    - 状态可视化：通过 app.get_state(config) 获取当前 State，展示给人工审核

    - 超时处理：设置人工确认的超时时间，超时后自动降级或拒绝

    - 审计日志：记录每次人工干预的操作人、时间、修改内容

    - 权限控制：结合 RBAC，只有授权用户才能执行确认操作


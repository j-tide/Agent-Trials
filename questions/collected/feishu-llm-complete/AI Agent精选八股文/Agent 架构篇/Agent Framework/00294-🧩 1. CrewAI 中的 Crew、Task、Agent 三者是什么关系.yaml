content:
  prompt: "\U0001F9E9 1. CrewAI 中的 Crew、Task、Agent 三者是什么关系？"
answer:
  mode: rubric
  reference_answer: |-
    这三者就像一支项目团队（Crew），拿着任务书（Task），派给不同专长的成员（Agent）去执行。

    [图片内容未导入]

    - Agent：一个拥有特定角色（role）、目标（goal）、背景故事（backstory）的 AI 单元。它知道自己是谁、要做什么、用什么工具。比如“你是一位资深市场分析师，擅长用网络搜索和数据分析挖掘市场趋势”。

    - Task：一份写清楚“你要干什么、期望产出什么”的工作说明书。包含描述（description）、期望输出（expected_output）、分配给哪个 Agent（agent），还可以指定是否允许异步（async_execution）、依赖哪个 Task（context）。

    - Crew：把 Agent 和 Task 组装起来，并决定它们的执行方式（Process）和全局配置（如 Verbose 模式、最多轮次）。

    用一句话串起来：Crew 是团队框架，Task 是分工说明书，Agent 是执行任务的专家。Crew 负责编排，让 Task 按顺序或层级流到对应的 Agent 手上。


content:
  prompt: "\U0001F91D  AutoGen 和 CrewAI 的多 Agent 协作模式有什么区别？"
answer:
  mode: rubric
  reference_answer: "这两个框架都旨在让多个 AI Agent 协作完成任务，但它们的协作哲学截然不同。用一句话概括：AutoGen 是“对话驱动的协作”，而
    CrewAI 是“角色驱动的流水线”。\n\n[图片内容未导入]\n\n核心区别一览：\n\n[嵌入表格未展开]\n\n示例代码对比：让两个框架完成同一个任务——“分析
    sales.csv 并生成报告”\n\nAutoGen 方式（对话驱动）：\n\nfrom autogen import AssistantAgent, UserProxyAgent\n\nassistant
    = AssistantAgent(\"分析师\", llm_config=..., \n    system_message=\"你是数据分析师，生成 Python
    代码分析 sales.csv。\")\nuser_proxy = UserProxyAgent(\"执行者\", code_execution_config={\"work_dir\":\".\"})\n\nuser_proxy.initiate_chat(assistant,
    message=\"分析 sales.csv 并生成报告\")\n# 接下来它们自动对话：助手写代码 → 执行者运行 → 助手看结果修正 → 最终输出报告\n\nCrewAI
    方式（任务驱动）：\n\nfrom crewai import Agent, Task, Crew, Process\n\nanalyst = Agent(role=\"分析师\",
    goal=\"分析销售数据\", backstory=\"...\", tools=[code_tool])\nreporter = Agent(role=\"报告员\",
    goal=\"生成分析报告\", backstory=\"...\")\n\ntask1 = Task(description=\"分析 sales.csv\",
    expected_output=\"数据洞察列表\", agent=analyst)\ntask2 = Task(description=\"根据洞察生成
    Markdown 报告\", expected_output=\"报告全文\", \n             agent=reporter, context=[task1])\n\ncrew
    = Crew(agents=[analyst, reporter], tasks=[task1, task2], process=Process.sequential)\nresult
    = crew.kickoff()\n\n选型直觉：\n\n如果你的任务需要 Agent 之间“来回讨论、试错、根据结果调整”，例如写代码 → 运行 → 看报错
    → 改代码，选 AutoGen，它的对话机制天然支持这种闭环。\n\n如果你的任务可以画成一张清晰的甘特图，每一步的输入输出都明确，选 CrewAI，它的任务依赖模型更易于管理和监控。\n\n---"

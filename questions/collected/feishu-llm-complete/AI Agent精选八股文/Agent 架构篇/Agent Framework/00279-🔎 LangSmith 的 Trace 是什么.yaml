content:
  prompt: "\U0001F50E LangSmith 的 Trace 是什么？"
answer:
  mode: rubric
  reference_answer: "### ▎先扔结论\n\nTrace 不是简单的日志，它是 LLM 应用的一次完整“调用树”记录，包含每一步的输入、输出、耗时、token
    消耗、元数据以及它们之间的嵌套关系。\n\n换句话说，如果你把一次 Agent 调用看作一棵树，那么 Trace 就是这棵树在 LangSmith 里的数字孪生。根节点是你发起的请求，子节点可能是
    LLM 调用、工具执行、检索器查询、chain 步骤等，一层层展开，直到每一个原子操作。\n\n### ▎Trace 里究竟记了什么？\n\n一个典型的 Trace
    是由多个 Run 组成的树形结构。每个 Run 都会精确记录：\n\n- 输入/输出：完整的 prompt 文本、模型的原始返回、工具调用的参数和结果。\n\n-
    时序数据：开始时间、结束时间、首 token 时间，延迟一目了然。\n\n- Token 用量：prompt tokens、completion tokens、总
    tokens，成本立即可算。\n\n- 元数据与标签：你可以自己打上 user_id、session_id、feature_flag 等，方便后续筛选。\n\n-
    反馈：用户点踩、人工评分、自动评估器打分，直接挂在 Run 上。\n\n### ▎为什么要这么设计？\n\n传统日志是扁平的，你只能看到“调了什么函数，返回了什么”。但当一次请求里包含
    3 次 LLM 调用、2 次工具调用、1 次检索时，扁平日志会让你抓狂。Trace 的树状结构天然对应了 Agent 的推理步骤，哪里卡顿、哪里传错了参数，一眼定位。\n\n###
    ▎代码里怎么看到 Trace？\n\n只要你设置了环境变量，LangChain 会自动把每次调用发到 LangSmith。\n\n```bash\nexport
    LANGCHAIN_TRACING_V2=true\nexport LANGCHAIN_API_KEY=\"ls__...\"\nexport LANGCHAIN_PROJECT=\"my-agent\"\n```\n\n然后在代码里正常调用，比如：\n\n```python\nfrom
    langchain_openai import ChatOpenAI\nfrom langchain.agents import create_openai_functions_agent,
    AgentExecutor\n\nllm = ChatOpenAI(model=\"gpt-4o\", temperature=0)\nagent_executor
    = AgentExecutor(agent=agent, tools=tools)\nagent_executor.invoke({\"input\": \"帮我查一下北京天气并总结\"})\n```\n\n这时打开
    LangSmith UI，你就会看到一条包含 AgentExecutor → LLM → Tool 等层层嵌套的 Trace。点击任何一个 Run，prompt
    原文、工具返回的 JSON、模型思考过程一览无余。\n\n\U0001F9E0 面试这样答直接拉开差距\n“Trace 本质是 LLM 应用的可观测性基石，它把一次请求的所有
    LLM 和工具交互结构化成一棵树。有了它，我们才能做后续的调试、评估、成本分析和回归测试，而不是对着控制台打印的零散日志瞎猜。”\n\n---"

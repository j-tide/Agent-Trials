content:
  prompt: "\U0001F4E6 LangChain vs \U0001F4D1 LlamaIndex：定位有什么不同？"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 是通用 LLM 应用框架，LlamaIndex 是数据索引与检索的“涡轮增压器”。

    一个负责编排应用逻辑，一个负责把私有数据变成 LLM 能消化的高精度知识。

    ### ▎深度解析

    - 解决的核心问题不同

    - LangChain 的初心：LLM 如何与外部世界交互？ 于是有了 Agents、Tools、Chains、Memory，它像一个万能插座，把模型、数据库、API 连起来。

    - LlamaIndex 的初心：如何让 LLM 精准理解我的几百页文档？ 于是它重兵投入数据连接器、索引结构（向量、树、关键词、图）、高级检索策略和查询引擎。

    - 能力侧重点

    - LangChain 长于多步推理和工具调用：让模型自主决定先去查数据库，再调计算器，最后总结。

    - LlamaIndex 长于复杂数据场景下的深度检索：例如同时检索 PDF 和数据库，用递归检索+摘要的方式回答“总结上一季度各产品线的问题”，并在答案里附带上来源页码。

    - 本质不是竞争关系

    在生产项目中，两者经常组合使用：用 LlamaIndex 构建强悍的检索器（Retriever），把它封装成 LangChain 的一个 Tool，再交给 Agent 调度。这样数据引擎和业务编排各司其职。

    ### ▎示例代码对比

    LlamaIndex：把文档变成可问答的知识库

    from llama_index.core import VectorStoreIndex, SimpleDirectoryReader

    documents = SimpleDirectoryReader("./policies").load_data()
    index = VectorStoreIndex.from_documents(documents)
    query_engine = index.as_query_engine()
    response = query_engine.query("年假最多可以累积多少天？")
    print(response)

    它帮你自动搞定文档切分、向量化、检索、合成，但你很难直接让它在回答前先去调一个 HR 系统 API。

    LangChain：用 Agent 调度检索工具

    from langchain.agents import create_openai_functions_agent, AgentExecutor
    # 可以把上面 LlamaIndex 的 query_engine 包装成一个 Tool
    tools = [hr_policy_tool, payroll_api_tool]  # 混合检索与API
    agent = create_openai_functions_agent(llm, tools, prompt)
    agent_executor = AgentExecutor(agent=agent, tools=tools)
    agent_executor.invoke({"input": "我剩几天年假，请假会扣多少钱？"})

    Agent 决定先去查政策文档，再根据查到的规则调薪酬 API 计算，这正是 LangChain 的编排能力。

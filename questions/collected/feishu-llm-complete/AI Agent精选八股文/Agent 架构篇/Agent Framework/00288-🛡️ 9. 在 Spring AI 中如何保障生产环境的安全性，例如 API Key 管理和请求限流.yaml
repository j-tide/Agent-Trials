content:
  prompt: "\U0001F6E1️ 9. 在 Spring AI 中如何保障生产环境的安全性，例如 API Key 管理和请求限流？"
answer:
  mode: rubric
  reference_answer: |-
    生产环境的安全围绕两个核心：凭证保护和流量控制。

    ① API Key 管理：绝不硬编码，与环境解耦

    API Key 不能写在 application.yml 里提交到 Git。推荐分层管理：

    - 本地开发：使用环境变量或 .env 文件（不纳入版本控制）。

    ```text
    export OPENAI_API_KEY=sk-...
    ```

    生产环境：注入 Kubernetes Secrets 或云平台的密钥管理服务（如 AWS Secrets Manager、Azure Key Vault）。

    ```yaml
    spring:
      ai:
        openai:
          api-key: ${OPENAI_API_KEY}   # 从环境变量读取
    ```

    - 进一步加固：结合 Spring Cloud Config 或 Vault，对配置文件进行加密存储，运行时解密。

    Spring AI 的 *Properties 类默认支持从环境变量、系统属性、配置文件等多种来源读取，所以你只需在配置文件中写 ${变量名} 即可。

    ② 请求限流：保护 API 额度与系统稳定性

    调用大模型有成本和频率限制，必须防止恶意或失控调用。可以在多个层面实现限流：

    方式一：基于 Resilience4j 的注解限流

    ```java
    @Bean
    public RateLimiter rateLimiter() {
        RateLimiterConfig config = RateLimiterConfig.custom()
                .limitRefreshPeriod(Duration.ofSeconds(1))
                .limitForPeriod(5)           // 每秒最多5次调用
                .timeoutDuration(Duration.ofMillis(500))
                .build();
        return RateLimiterRegistry.of(config).rateLimiter("ai-calls");
    }

    @Service
    public class GuardedAiService {
        @Autowired
        private ChatModel chatModel;
        @Autowired
        private RateLimiter rateLimiter;

        public String ask(String question) {
            // 获取令牌，若失败会抛异常
            RateLimiter.waitForPermission(rateLimiter);
            return chatModel.call(new Prompt(question)).getResult().getOutput().getContent();
        }
    }
    ```

    超过阈值时，waitForPermission 会阻塞或直接抛出 RequestNotPermitted，你可以返回友好提示“系统繁忙，请稍后重试”。

    方式二：通过 Advisor 实现透明限流
    定义一个 RateLimitAdvisor，在 adviseRequest 方法中检查令牌，若不通过则拒绝调用。

    ```java
    @Component
    public class RateLimitAdvisor implements RequestResponseAdvisor {
        private final RateLimiter rateLimiter;

        @Override
        public AdvisedRequest adviseRequest(AdvisedRequest request, Map<String, Object> context) {
            if (!rateLimiter.acquirePermission()) {
                throw new RateLimitExceededException("AI 调用太频繁，请稍后再试");
            }
            return request;
        }
        // ...
    }
    ```

    将其注册到 ChatClient，所有调用自动受保护。

    ③ 内容安全：输入/输出过滤

    利用 Advisor 还可以对用户输入做敏感词过滤，对模型输出做合规检查，这是安全的另一道防线。

    一句话总结：API Key 用环境变量/密钥管理服务注入，决不明文写死；请求限流用 Resilience4j 或 Spring Cloud Gateway 形成保护壳；安全 Advisor 则像是给每次 AI 调用穿上的防弹衣。


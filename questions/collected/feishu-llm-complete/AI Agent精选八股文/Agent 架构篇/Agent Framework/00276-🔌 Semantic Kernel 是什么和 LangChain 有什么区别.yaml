content:
  prompt: "\U0001F50C Semantic Kernel 是什么？和 LangChain 有什么区别？"
answer:
  mode: rubric
  reference_answer: "Semantic Kernel (SK) 是微软推出的企业级 AI 编排框架，它的核心设计思想是“用你现有的代码来扩展 AI，而不是把
    AI 作为中心”。\n\nLangChain 哲学：AI 是大脑，一切围绕 AI 编排\n  AI 调用 → 工具调用 → 链/图/Agent → 输出\n\nSemantic
    Kernel 哲学：你的代码是骨架，AI 只是其中一个可调用的 Plugin\n  你的业务逻辑 → 需要时调用 AI Plugin → AI 返回结果 →
    继续你的逻辑\n\n核心概念对比：\n\n[嵌入表格未展开]\n\n一个直观的例子：用 SK 创建一个“摘要 Plugin”\n\npublic class
    TextPlugin\n{\n    [KernelFunction, Description(\"将长文本总结为三句话\")]\n    public async
    Task<string> SummarizeAsync(\n        [Description(\"要摘要的文本\")] string text,\n
    \       Kernel kernel)\n    {\n        var prompt = $\"请用三句话总结以下内容：\\n{text}\";\n
    \       return await kernel.InvokePromptAsync<string>(prompt);\n    }\n}\n\n//
    使用\nvar builder = Kernel.CreateBuilder();\nbuilder.Plugins.AddFromType<TextPlugin>();\nvar
    kernel = builder.Build();\n\nvar summary = await kernel.InvokeAsync(\"TextPlugin\",
    \"Summarize\", \n    new() { [\"text\"] = longArticle });\n\n关键区别：谁占主导地位\n\nLangChain
    的设计中，你的应用程序逻辑围绕 LLM 调用构建——你写一个 Chain，把 Prompt、LLM、Parser 串起来，工具只是这个 Chain 中的一个环节。而在
    Semantic Kernel 中，你的应用程序逻辑是你原来的 C#/Java 代码，LLM 只是通过 Plugin 被调用的一个能力。这种“AI 作为依赖注入的一部分”的范式，让企业开发者感觉
    LLM 像是一个新引入的“服务”，而不是重构整个应用的“中心”。\n\n为什么选 Semantic Kernel？\n\n- 你的团队是 .NET 技术栈，不想为
    AI 引入 Python 微服务。\n\n- 你需要深度集成 Microsoft 生态（Azure AI Search, Microsoft 365, Copilot）。\n\n-
    你的应用已经有成熟的业务逻辑，只需要在关键节点嵌入 AI 能力（如自动分类、生成摘要、翻译），而不是从零构建 AI 原生的系统。\n\n为什么选 LangChain？\n\n-
    你需要构建复杂的 AI 原生工作流（多步推理、Agent 自主决策、复杂的 RAG 管道）。\n\n- 你需要在模型、向量库、工具之间灵活切换，且希望社区有最丰富的集成库。\n\n-
    你的团队熟悉 Python 生态，且愿意用前沿框架。\n\n两者可以共存： 在一些大型企业中，后端微服务用 Semantic Kernel 做轻量级 AI
    嵌入（如邮件自动分类），而数据科学团队用 LangChain 构建复杂的分析 Agent，通过 REST/gRPC 互相调用。这不矛盾，只是在不同场景下选择了最顺手的工具。"

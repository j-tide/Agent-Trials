content:
  prompt: "⚠️ 10. LangChain 中 @tool 装饰器的最关键注意事项"
answer:
  mode: rubric
  reference_answer: "@tool 装饰器是 LangChain 中最快捷的定义工具的方式：只需给一个 Python 函数加上 @tool，框架就会自动提取函数名、文档字符串（docstring）和参数类型，生成一个
    Tool 对象。\n\n最关键的一个注意事项是：函数的 docstring 和参数类型注解会直接决定 LLM 调用工具的准确性，绝对不能忽略或写得太随意。\n\n```text\n工具定义
    → LLM 阅读工具描述 → 决定是否调用 → 生成参数\n```\n\nLLM 看不到你的函数体代码，它唯一能看到的就是：\n\n- 函数名（get_weather）\n\n-
    docstring（工具描述）\n\n- 参数名和类型注解（city: str）\n\n- 参数默认值（如果有）\n\n所以，@tool 的核心原则是：把
    docstring 当作给 LLM 的说明书来写，把类型注解当作参数契约来定义。\n\n错误示例 vs 正确示例：\n\n```python\n# ❌ 差：LLM
    不知道参数格式，容易调用失败\n@tool\ndef get_weather(city):\n    \"\"\"获取天气\"\"\"\n    return
    f\"{city}: 晴\"\n\n# ✅ 好：明确的参数类型、描述、格式约束\n@tool\ndef get_weather(city: str) ->
    str:\n    \"\"\"获取指定城市的当前天气，包括温度、湿度和天气状况。\n    \n    参数:\n        city: 城市名称，必须是中文拼音，例如
    Beijing, Shanghai\n    \"\"\"\n    return f\"{city}: 25°C, 晴\"\n```\n\n为什么这一点最关键？\n因为参数类型注解不仅影响
    Python 类型检查，更会被 LangChain 转换为 JSON Schema 并呈现给 LLM。如果你不写类型注解，LangChain 会默认参数类型为
    string，但你永远无法约束格式；如果你把 date: str 写成 date，LLM 可能会填入 \"今天\" 而不是 \"2026-07-02\"。\n\n另外三个辅助注意事项：\n\n-
    返回类型注解（-> str）虽然不直接影响 LLM，但能帮助 LangChain 生成更准确的输出描述。\n\n- 如果参数有有限选项，最好用 Literal
    类型，这会生成 enum 约束，让 LLM 只能从候选中选择。\n\n- 启用 return_direct=True 可以让工具结果直接返回给用户，跳过 LLM
    的二次总结，适用于查天气、查股价等“结果即答案”的场景。\n\n```python\nfrom typing import Literal\nfrom langchain.tools
    import tool\n\n@tool\ndef set_volume(level: Literal[\"low\", \"medium\", \"high\"])
    -> str:\n    \"\"\"设置音量级别。level 只能是 low, medium, high 其中之一。\"\"\"\n    return
    f\"音量已设为 {level}\"\n```\n\n一句话总结：\n你写 @tool 的时候，要时刻想“LLM 只读得到我的 docstring 和参数名”，所以把这两个写到极致清晰。\n\n---"

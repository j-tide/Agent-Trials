    一个体现 LCEL 强大组合性的代码例子：

    ```python
    # 把两个链并联：一个写大纲，一个写正文，然后合并
    outline_chain = prompt_outline | model | StrOutputParser()
    essay_chain = prompt_essay | model | StrOutputParser()
    combined = RunnableParallel(outline=outline_chain, essay=essay_chain)
    result = combined.invoke({"topic": "AI"})
    # result 是 {"outline": "...", "essay": "..."}
    ```

    在 1.0 中要实现这种“并联 + 合并”，你得上 SequentialChain 配 SimpleMemory，代码量翻倍且极难调试。LCEL 让它变得像搭乐高。


content:
  prompt: "⚡ 2. LangChain 2.0 的 LCEL 是什么？和 1.0 的 Chain 有什么本质区别？"
answer:
  mode: rubric
  reference_answer: |-
    LCEL（LangChain Expression Language） 是一种用管道符 | 把组件串起来的声明式语言。它让链的定义从“黑箱函数调用”变成“数据流管道”。

    ```python
    # LCEL 写法
    from langchain_core.prompts import ChatPromptTemplate
    from langchain_openai import ChatOpenAI
    from langchain_core.output_parsers import StrOutputParser

    prompt = ChatPromptTemplate.from_template("给一家卖{product}的公司起名字")
    model = ChatOpenAI()
    chain = prompt | model | StrOutputParser()
    print(chain.invoke({"product": "智能手表"}))
    ```

    LCEL 和 1.0 Chain 的本质区别，一句话：

    - 1.0 Chain 是“封装好的类”：你需要继承 Chain 并实现 _call 方法，流程被封装在类内部，修改、组合、调试都不透明。

    - 2.0 LCEL 是“数据流管道”：每个步骤都是独立的 Runnable 对象，用 | 连接。输入数据像流水一样从左流到右，每一步的输入输出完全可见、可测试、可组合。

    用一个图表对比它们的设计哲学：

    ```text
    1.0 Chain：
      输入 → [黑箱 LLMChain] → 输出
             内部: prompt→LLM→parser，但外部不可见

    2.0 LCEL：
      输入 → prompt → model → parser → 输出
             ↑       ↑       ↑
          每个节点都可以被单独检查、修改、替换
    ```


content:
  prompt: "\U0001F9F1 1. CrewAI 的四层结构分别是什么？"
answer:
  mode: rubric
  reference_answer: |-
    CrewAI 的设计可以分为从上到下的四个层级：Orchestration Layer、Agent Layer、Task Layer、Tool Layer。每一层都有明确的职责和对应的核心概念。

    [图片内容未导入]

    各层职责与关系：

    - 编排层 决定了任务如何流转：是固定顺序还是交由管理 Agent 动态分派。它还负责开启记忆、设置最大 RPM 等全局参数。

    - Agent 层 是执行智能体，每个 Agent 有自己的“人设”和推理方式。它接受编排层分配的任务，使用工具完成任务并产出结果。

    - 任务层 是工作的原子单位，它定义了要做什么、期望什么产出、谁来做、依赖哪些前置任务。

    - 工具层 是 Agent 的手和脚，让 Agent 能够搜索、计算、读写文件等。

    用一个代码片段感受四层是如何被实例化的：

    from crewai import Crew, Agent, Task, Process
    from crewai_tools import SerperDevTool

    # 工具层
    search_tool = SerperDevTool()

    # Agent 层
    analyst = Agent(
        role="市场分析师",
        goal="收集并整理市场数据",
        backstory="你擅长数据搜集与分析",
        tools=[search_tool],
        verbose=True
    )

    # 任务层
    task_collect = Task(
        description="收集新能源两轮车市场前三大品牌的信息",
        expected_output="包含品牌、市场份额、价格区间的结构化 JSON 列表",
        agent=analyst
    )

    # 编排层
    crew = Crew(
        agents=[analyst],
        tasks=[task_collect],
        process=Process.sequential,
        memory=True,
        verbose=True
    )

    result = crew.kickoff()

    这个四层模型的关键是 关注点分离：你可以单独改进某个 Agent 的 prompt，或者新增一个 Tool，或者把 Task 的依赖关系重新编排，而不会牵一发动全身。


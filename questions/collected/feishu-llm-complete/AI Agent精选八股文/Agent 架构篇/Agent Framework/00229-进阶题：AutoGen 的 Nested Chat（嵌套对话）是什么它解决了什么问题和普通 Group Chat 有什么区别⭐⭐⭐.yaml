content:
  prompt: 4、进阶题：AutoGen 的 Nested Chat（嵌套对话）是什么？它解决了什么问题？和普通 Group Chat 有什么区别？⭐⭐⭐
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（复杂对话编排、模块化设计）\n\n1️⃣ Common Answer\n\nNested Chat 就是在对话里面再嵌套一个对话，像函数调用一样。它解决了对话太复杂的问题，可以把一个大任务拆成小任务。和
    Group Chat 的区别就是 Nested Chat 是嵌套的，Group Chat 是大家一起聊。\n\n2️⃣ Impressive Answer\n\n-
    Nested Chat 核心概念\n\n- 解决的核心问题\n\n- 与 Group Chat 的本质区别\n\n# Nested Chat 示例\ndef
    nested_chat_summary(recipient, messages, sender, config):\n    # 启动嵌套对话处理子任务\n
    \   nested_chat = initiate_chats([\n        {\n            \"sender\": assistant,\n
    \           \"recipient\": code_executor,\n            \"message\": \"执行数据分析代码\"\n
    \       }\n    ])\n    return nested_chat.summary  # 返回摘要而非完整历史\n   \nassistant.register_nested_chat(\n
    \   nested_chat_summary,\n    trigger=lambda msg: \"分析数据\" in msg[\"content\"]\n)\n
    \  \n# Group Chat 对比：所有 Agent 共享同一对话历史\ngroup_chat = GroupChat(\n    agents=[user_proxy,
    assistant, code_executor],\n    messages=[],  # 所有消息都在这里\n    max_round=10\n)\n\n-
    上下文可见性：Group Chat 所有 Agent 共享完整历史，Nested Chat 子对话对外部不可见\n\n- 执行模式：Group Chat 是轮转式（round-robin），Nested
    Chat 是树状层级式\n\n- 适用场景：Group Chat 适合协作讨论，Nested Chat 适合任务分解和专业化处理\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

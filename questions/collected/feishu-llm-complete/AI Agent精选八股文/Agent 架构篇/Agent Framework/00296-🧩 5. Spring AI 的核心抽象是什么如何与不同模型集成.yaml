content:
  prompt: "\U0001F9E9 5. Spring AI 的核心抽象是什么？如何与不同模型集成？"
answer:
  mode: rubric
  reference_answer: |-
    Spring AI 的设计思想和 Spring 一贯的理念一致：定义统一接口，通过适配器屏蔽底层差异。它的核心抽象围绕着 AI 应用最常见的几个能力展开：

    [图片内容未导入]

    ① ChatModel —— 统一对话入口

    ChatModel 是最常用的接口，它代表一个能理解 Prompt 并返回 ChatResponse 的语言模型。不管底层是 OpenAI、Azure、Ollama、还是本地 HuggingFace 模型，调用方式完全一致。

    ```java
    public interface ChatModel {
        ChatResponse call(Prompt prompt);
        // 默认流式方法
        default Flux<ChatResponse> stream(Prompt prompt) {
            throw new UnsupportedOperationException();
        }
    }
    ```

    集成不同模型的步骤：引入对应的 Starter，在 application.yml 里配好认证信息，框架就会自动创建 ChatModel Bean。

    - OpenAI：spring-ai-openai-spring-boot-starter

    - Azure OpenAI：spring-ai-azure-openai-spring-boot-starter

    - Ollama（本地）：spring-ai-ollama-spring-boot-starter

    - HuggingFace：spring-ai-huggingface-spring-boot-starter

    配置示例：

    ```yaml
    # 主模型
    spring.ai.openai.api-key: ${OPENAI_KEY}
    spring.ai.openai.chat.options.model: gpt-4o
    # 本地模型
    spring.ai.ollama.chat.model: llama3
    ```

    使用时只需注入 ChatModel：

    ```java
    @Autowired
    private ChatModel chatModel;

    public String ask(String question) {
        return chatModel.call(new Prompt(question)).getResult().getOutput().getContent();
    }
    ```

    多模型并存：当需要同时使用多个模型时，可以用 @Qualifier 或自定义 Bean 名来区分，或者实现一个路由 ChatModel，内部持有多个模型并根据策略选择。

    ② EmbeddingModel —— 把文本转为向量

    接口简洁，输入一段文本或 Document，返回浮点数组：

    ```java
    public interface EmbeddingModel {
        EmbeddingResponse embedForResponse(List<String> texts);
        default float[] embed(String text) { ... }
    }
    ```

    同样，换底层模型只需改配置，代码不动。支持 OpenAI、Azure、Ollama、HuggingFace 等。

    ③ VectorStore —— 统一向量数据库访问

    VectorStore 接口抽象了向量存储的增删查：

    ```java
    public interface VectorStore {
        void add(List<Document> docs);
        List<Document> similaritySearch(SearchRequest request);
        default List<Document> similaritySearch(String query) { ... }
    }
    ```

    Spring AI 提供了 Chroma、Pinecone、Milvus、PGVector、Redis 等十几种实现，切换时只需换 Starter 和配置，代码零修改。

    ④ Advisor —— AOP 风格的拦截器

    Advisor 可以在请求发送前和响应返回后插入自定义逻辑，是实现 RAG、日志、内容过滤等功能的利器。它让 AI 调用链和 Spring 的 AOP 体系无缝融合。

    核心设计思想：Spring AI 不发明新轮子，而是让 AI 能力变成 Spring 容器中普通的 Bean，用 DI、AOP、自动配置这些开发者熟悉的方式来使用。这种“Spring 方式”的 AI 集成，正是它相比 LangChain 等框架的独特优势。


answer:
  mode: rubric
  reference_answer: |-
    Spring AI 是 Spring 生态的原生 AI 模块，LangChain4j 是 LangChain 理念的 Java 独立实现。
    一个让你像用 JdbcTemplate 一样用 AI，一个让你在 Java 里“写 Python 版 LangChain 的代码风格”。

    ### ▎深度解析

    - 设计哲学

    - Spring AI：遵循 Spring 的可移植服务抽象，定义 ChatClient、EmbeddingClient、VectorStore 等接口，通过 starter 自动配置切换 Azure OpenAI、通义千问等后端。你改一行配置就能换模型，代码零改动。

    - LangChain4j：忠于 LangChain 的组件化链式组装思想，提供 ChatLanguageModel、EmbeddingModel、Tool、Chain 等，API 风格接近 Python 版本，内置更丰富的模型集成（如直接对接各种大厂 API），同时对非 Spring 环境友好。

    - 集成深度与约束

    - 如果你的项目是典型的 Spring Boot 应用，Spring AI 能天然与 @Service、@RestController、配置中心、Micrometer 监控等融合，你甚至可以使用 @Retryable 注解处理限流。

    - LangChain4j 有 Spring Boot Starter，但它的核心库不依赖 Spring。它提供了诸如 InMemoryEmbeddingStore、AzureOpenAiChatModel 等自家实现，需要你手动配置 Bean，反而给了你更多细颗粒度的控制权。

    - 功能广度和社区

    - LangChain4j 在 AI 组件方面跑得更快，比如较早支持了 OpenAI 的函数调用、嵌入模型本地缓存、对话记忆等多种开箱即用实现。

    - Spring AI 背靠 Spring 团队，稳定性和生态整合是其王牌，但在小众模型的集成上可能慢半拍。

    ### ▎Java 项目如何选型？（决策路径）

    [嵌入表格未展开]

    示例代码感受一下风格差异

    Spring AI：极简配置 + 依赖注入

    # application.yml
    spring:
      ai:
        openai:
          api-key: ${OPENAI_KEY}

    @RestController
    public class ChatController {
        private final ChatClient chatClient;
        public ChatController(ChatClient.Builder builder) {
            this.chatClient = builder.build();
        }
        @GetMapping("/chat")
        public String chat(@RequestParam String input) {
            return chatClient.prompt().user(input).call().content();
        }
    }

    完全 Spring 风格，感觉就像在使用 RestTemplate。

    LangChain4j：显式构建，链式组合

    OpenAiChatModel model = OpenAiChatModel.builder()
        .apiKey(System.getenv("OPENAI_KEY"))
        .modelName("gpt-4o")
        .build();

    Assistant assistant = AiServices.builder(Assistant.class)
        .chatLanguageModel(model)
        .tools(new Calculator())
        .build();
    String answer = assistant.chat("计算 123*456 是多少？");

    这里定义了一个带工具接口的 AI 服务，代码主见度很高，也更接近 LangChain 的“组装”概念。

    实战建议：

    - 新项目且是 Spring Boot，直接用 Spring AI 起步，快速将 AI 能力嵌入已有服务体系。

    - 如果发现所需模型或高级 RAG 策略 Spring AI 暂不支持，可以引入 LangChain4j 作为补充，两者并不冲突（例如在同一个 Service 里分别调用两个框架的向量存储）。

    - 非 Spring 或追求极致控制的项目，LangChain4j 是更轻量的选择。

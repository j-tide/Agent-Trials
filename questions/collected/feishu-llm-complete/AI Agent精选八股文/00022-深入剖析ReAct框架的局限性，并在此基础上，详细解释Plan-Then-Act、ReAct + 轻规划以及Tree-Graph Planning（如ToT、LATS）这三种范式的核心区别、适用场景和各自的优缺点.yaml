  reference_answer: |-
    ### 一、ReAct框架的核心局限性

    ReAct（Reasoning + Acting）通过交错“思考-行动-观察”循环，使大模型能动态调用工具。但其存在以下关键局限：

    - 缺乏全局规划：每次决策仅基于当前观察和有限历史，容易陷入局部最优或重复步骤（如反复搜索同一信息）。复杂任务中，缺乏先验的任务分解导致步数冗余。

    - 无回溯机制：一旦某条推理路径出错，ReAct只能靠后续观察纠正，但无法主动回溯到之前的分支点。这类似于深度优先搜索无剪枝。

    - 效率与成本问题：每步都生成完整推理链，Token消耗大；且在长任务中，早期关键信息可能被后续对话稀释。

    - 工具调用依赖线性顺序：难以表达并行或条件分支的工具调用。

    ---


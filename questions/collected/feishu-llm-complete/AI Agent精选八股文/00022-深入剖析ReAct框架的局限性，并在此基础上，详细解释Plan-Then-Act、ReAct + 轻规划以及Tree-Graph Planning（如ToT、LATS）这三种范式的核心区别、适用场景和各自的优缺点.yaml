    ### 三、各范式详解与对比

    Plan-Then-Act（如SayCan、TaskWeaver）

    工作流程：

    - 规划阶段：模型一次性生成完整的步骤序列（如“步骤1：搜索用户信息；步骤2：查询订单；步骤3：发送邮件”）。

    - 执行阶段：按顺序执行，每步调用相应工具，若某步失败则整体失败。

    优点：

    - 结构清晰，易于调试。

    - Token消耗低（只需一次规划）。

    - 适合步骤之间无依赖且环境确定的任务。

    缺点：

    - 无法适应动态变化（如工具返回意外结果）。

    - 无纠错能力，一步错则全局错。

    - 难以处理条件分支和循环。

    适用场景：工作流明确、环境可控的批处理任务，如ETL流水线、定时报表生成。

    ReAct + 轻规划（如Plan-ReAct、AdaPlanner）

    工作流程：

    - 高层规划：模型生成若干子任务（如“获取天气”、“计算温差”）。

    - 底层ReAct：对每个子任务，使用ReAct模式动态调用工具完成，并可能根据中间结果微调后续子任务。

    优点：

    - 结合了全局结构化和局部灵活性。

    - 相比纯ReAct，步数减少、Token节省。

    - 可处理子任务内的小范围动态变化。

    缺点：

    - 子任务间的依赖仍需预先定义，无法应对跨子任务的动态调整。

    - 仍然缺乏系统性回溯。

    适用场景：中等复杂度的任务，如旅行规划（先订票、再订酒店、再推荐景点），每个子任务有独立工具链。

    Tree/Graph Planning（如Tree-of-Thoughts (ToT)、LATS）

    工作流程：

    - 探索：在每个决策点生成多个候选动作（如“搜索A”或“搜索B”），形成树/图节点。

    - 评估：使用启发式函数（如LLM自评估）对节点打分。

    - 搜索：使用BFS、DFS或MCTS选择最有希望的分支继续扩展，可回溯到之前节点。

    - 合并：允许不同路径的结果融合（Graph Planning）。

    优点：

    - 支持系统性的探索与回溯，接近经典AI规划能力。

    - 能处理高度不确定、需要试错的任务。

    - 可并行探索，利用LLM批量评估提升效率。

    缺点：

    - 计算开销大（多次调用LLM评估）。

    - 需要设计有效的启发式评估函数（容易偏差）。

    - 实现复杂，需管理搜索树。

    适用场景：开放域问题求解、创意生成、复杂推理任务（如数学证明、产品设计），以及存在多条可行路径且需择优的场景。

    ---

    ### 四、范式选择指南


    ### 五、总结

    ReAct在简单任务上足够，但缺乏全局视野和回溯能力。三种增强范式沿“规划-执行耦合度”与“回溯能力”两个维度演进：

    - Plan-Then-Act：完全解耦，无回溯。

    - ReAct+轻规划：半解耦，有限调整。

    - Tree/Graph Planning：紧密耦合搜索过程，强回溯。

    实际Agent系统可采用混合策略：常规路径使用轻规划，当遇到高不确定性时动态切换到Tree Planning。未来趋势是让模型自主学习何时需要深度规划。

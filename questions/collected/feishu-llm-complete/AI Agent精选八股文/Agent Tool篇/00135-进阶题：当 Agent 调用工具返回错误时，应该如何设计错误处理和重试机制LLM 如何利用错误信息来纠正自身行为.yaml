content:
  prompt: 进阶题：当 Agent 调用工具返回错误时，应该如何设计错误处理和重试机制？LLM 如何利用错误信息来纠正自身行为？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（错误分类处理、错误信息面向 LLM 设计、重试策略、防止循环）

    1️⃣ Common Answer

    工具调用出错时，把错误信息返回给 LLM 让它重新生成参数或换工具。设置最大重试次数，比如 3 次，超过就降级处理。错误信息要包含具体原因，这样 LLM 才能理解。重试时加指数退避，避免频繁请求被限流。

    2️⃣ Impressive Answer

    我会从 3 个角度来思考这个问题：

    - 错误分类，策略不同。参数错误（格式不对、校验失败）：直接把错误作为 Observation 反馈给 LLM，让它自主修正，不需要重试间隔。业务逻辑错误（无结果、权限不足）：反馈给 LLM 后让它决定是换参数、换工具还是告知用户。基础设施错误（网络超时、服务不可用）：LLM 处理不了，在工具执行层做指数退避重试，对 LLM 透明。

    - 错误信息要面向 LLM 设计。不要给 DB_ERROR_1062: Duplicate entry 这种工程师调试信息，而是"该用户 ID 已存在，无法重复创建。请确认是否需要更新已有记录，或检查传入的 user_id 是否正确。"LLM 才能从中推理出正确的修正方向。

    - 防止无限重试循环。LLM 可能被错误信息引导进入循环（反复换格式但问题不在格式上）。需要在 Agent 循环层面做全局步骤计数限制，并在 Prompt 中明确说明"如果同一工具连续失败 2 次，请换策略或直接告知用户"。写操作最多 1 次重试（防止重复写入），读操作可以 3 次；超过次数后返回描述性降级结果，让 Agent 能继续推进任务。


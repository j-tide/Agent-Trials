content:
  prompt: 业务新增了一个"查询并汇报用户订单"需求，你怎么决定设计原子工具还是复合工具？
answer:
  mode: rubric
  reference_answer: |-
    1️⃣ Common Answer

    如果只有这一个需求，可以直接做一个复合工具，把查询和汇报都放进去，这样 Agent 调用一次就完事了，比较简单。

    2️⃣ Impressive Answer

    - 先问复用性。如果"查询订单"和"汇报结果"分别还有其他独立使用场景（比如其他任务只需要查询不需要汇报），就应该拆成原子工具 query_orders + format_report，保留复用能力。

    - 再评估频次。如果这个"查询+汇报"的组合在 Agent 运行中出现频率极高，可以在原子工具基础上封装一个复合工具 query_and_report_orders，两层都保留，让 Agent 根据任务自行选择。

    - 工程落地。先上原子工具版本，上线后通过 LangSmith 观察 Agent 的实际调用模式，如果发现两个工具总是连续调用，再封装复合工具，这样决策有数据支撑，不是拍脑袋。


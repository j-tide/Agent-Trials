content:
  prompt: 场景题：Agent 调用了一个返回 200 条 JSON 记录的数据库查询工具，如何处理这个结果？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（结构化数据处理、字段过滤、Token 预算估算）

    1️⃣ Common Answer

    200 条太多了，截取前 20 条传给 LLM 就行，或者让 LLM 对这 200 条做摘要。

    2️⃣ Impressive Answer

    - 先做字段过滤，再做行数截断。不要直接截前 N 条，先分析当前问题需要哪些字段，比如用户问"最近订单的状态分布"，只需要 status 和 created_at 字段，把其他字段过滤掉可以把数据量压缩 80% 以上。字段过滤后再按行数截断，末尾注明"共 200 条，以上为前 50 条，仅展示 status 和 created_at 字段"。

    - 用 tiktoken 估算截断后的 token 数。不要用字符数估算，JSON 结构有大量括号和键名，token 消耗远高于纯文本。估算后和当前可用 token 预算对比，动态决定保留多少行。

    - 考虑让 SQL 层做聚合。如果问题是统计类的（分布、Top N、总数），应该在工具层让数据库直接做 GROUP BY 或 LIMIT，而不是把原始数据全拉出来再在 Python 层处理。这是从根本上减少数据量的最优解。


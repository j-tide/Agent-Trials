content:
  prompt: "\U0001F537  Function Calling 是什么？解决了什么问题？"
answer:
  mode: rubric
  reference_answer: |-
    Function Calling 是 LLM 与外部世界交互的“翻译官”和“调度员”。

    同步块

    它允许模型在生成自然语言之外，输出一个结构化的函数调用请求——包含函数名和参数 JSON，然后由你的应用代码去实际执行，并将结果反馈给模型。

    [图片内容未导入]

    它解决的核心问题：模型“能说不能做”的边界突破。

    - 打破信息孤岛：训练数据有截止日期，模型不知道今天的天气、股市、你的日程。Function Calling 让模型能调用实时数据。

    - 从“建议”到“执行”：模型不再只能说“你可以这样订机票”，而是直接输出 {"function": "book_flight", "parameters": {"from": "PEK", "to": "SHA", "date": "2026-07-05"}}，应用代码拿过去就能自动执行。

    - 标准化输出：比起靠正则去抓取自由文本中的意图，Function Calling 给出的是一份结构化的、可直接序列化的 JSON，可靠性和开发效率大幅提升。

    - 多工具协同：Agent 需要同时操作多个工具（查天气、算公式、发邮件），Function Calling 让模型可以根据用户意图动态选择调用哪个工具、传什么参数，实现自动化的工具编排。

    本质上，Function Calling 把 LLM 从一个“对话引擎”升级为一个“意图理解与任务分发引擎”。


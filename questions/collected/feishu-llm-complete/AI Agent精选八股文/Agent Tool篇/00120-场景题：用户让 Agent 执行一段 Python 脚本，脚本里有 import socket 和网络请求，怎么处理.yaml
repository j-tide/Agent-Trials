content:
  prompt: 场景题：用户让 Agent 执行一段 Python 脚本，脚本里有 import socket 和网络请求，怎么处理？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（AST 静态分析、网络隔离策略、风险评估与放行机制）

    1️⃣ Common Answer

    import socket 有风险，可以在黑名单里加上 socket，发现就拒绝执行，告诉用户不允许网络操作。

    2️⃣ Impressive Answer

    - 静态分析层先检测。用 AST 解析脚本，识别到 import socket 后，不是直接拒绝，而是判断业务场景——如果这个 Agent 本来就需要联网能力（比如爬虫 Agent），可以放行到受控网络（白名单出口）；如果是纯计算类 Agent，则拒绝并告知用户"网络访问不在允许范围内"。

    - 执行层用网络隔离兜底。无论静态分析是否通过，容器都配置为自定义网络（白名单出口 IP 或域名），即使代码里有恶意网络请求，容器也无法连接到非白名单地址，保证纵深防御。

    - 给用户友好的反馈。不要直接返回"安全校验失败"，而是说"检测到网络访问请求，当前沙箱环境限制为只读计算，如需联网操作请联系管理员开启对应权限"，提升用户体验。


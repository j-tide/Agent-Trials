  prompt: 工具粒度过粗或过细分别有什么问题？
answer:
  mode: rubric
  reference_answer: |-
    粒度过粗：一个工具包含太多逻辑，复用性差，出错难定位，模型对工具语义理解模糊。粒度过细：Agent 需要多轮调用才能完成任务，延迟高、Token 消耗大，中间步骤增多导致出错概率上升。


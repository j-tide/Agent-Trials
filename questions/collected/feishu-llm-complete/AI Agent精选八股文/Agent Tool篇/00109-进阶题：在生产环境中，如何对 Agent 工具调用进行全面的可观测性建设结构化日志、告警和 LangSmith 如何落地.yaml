content:
  prompt: 2、进阶题：在生产环境中，如何对 Agent 工具调用进行全面的可观测性建设？结构化日志、告警和 LangSmith 如何落地？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（run_id 链路关联、分级告警避免告警风暴、LangSmith 核心功能、自建 vs LangSmith 选型）

    1️⃣ Common Answer

    可观测性就是能看到 Agent 运行时发生了什么。工具调用的日志要记录工具名、输入参数、返回值和执行耗时，方便排查问题。出现异常时触发告警，比如工具连续失败或耗时超阈值就发通知。LangSmith 是 LangChain 官方追踪工具，能看到每次工具调用的详细信息。

    2️⃣ Impressive Answer

    我会从 3 个角度来拆解生产级可观测性：

    - 结构化日志的关键设计点。run_id 是核心字段，用于关联同一次 Agent 运行中的所有工具调用，没有它就无法从日志中还原完整调用链路。返回值记录大小而不是全内容，避免日志量爆炸；需要 debug 时，把完整返回值存对象存储，日志里记录引用。敏感参数（API 密钥、用户身份信息）必须脱敏后再写日志。

    - 告警策略要分级，避免告警风暴。P0 即时告警：工具成功率 5 分钟内低于 80%，有系统级故障。P1 延迟告警：某工具 P99 耗时超阈值（外部 API 超过 10s），影响用户体验。P2 趋势告警：错误率 1 小时内持续上升，可能是数据问题或外部降级。告警要带聚合信息（"search_web 过去 5 分钟失败 23 次，失败率 45%，涉及 12 个 session"），不要每次失败都发一条。

    - LangSmith 的核心价值和选型。最有价值的三个功能：Trace 视图（树状调用链路，排查幻觉或工具选错效率极高）；Dataset 积累（一键把有问题的 Trace 加入数据集，用于 Prompt 优化和回归测试）；工具调用统计（按工具名过滤，快速看哪个工具最容易失败）。有数据合规要求不能发给第三方的，用 OpenTelemetry + Jaeger 做链路追踪，配合 ELK 做日志聚合，能覆盖同等能力。


  reference_answer: |-
    难度级别：⭐（结构化日志基础、必要字段）

    至少要记录：工具名称、输入参数（敏感信息需脱敏）、返回值大小（而非全量内容）、执行耗时（毫秒）、会话 ID（session_id）、Agent 运行 ID（run_id，用于关联同一次运行中的所有工具调用），以及成功/失败状态和错误信息。


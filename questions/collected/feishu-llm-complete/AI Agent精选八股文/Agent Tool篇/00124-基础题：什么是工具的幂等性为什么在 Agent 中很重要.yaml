content:
  prompt: 基础题：什么是工具的幂等性？为什么在 Agent 中很重要？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐（幂等性概念、重试场景下的必要性）

    幂等性是指同一操作执行多次，结果和执行一次相同。在 Agent 中，工具可能因错误被重试，如果写操作不幂等，就会造成重复写入（如重复创建订单）。通过业务幂等键或唯一约束保证幂等性是写操作工具的基本要求。


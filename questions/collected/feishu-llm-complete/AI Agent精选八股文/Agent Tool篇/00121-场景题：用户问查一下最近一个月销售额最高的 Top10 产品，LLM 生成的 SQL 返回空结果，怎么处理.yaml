content:
  prompt: 场景题：用户问"查一下最近一个月销售额最高的 Top10 产品"，LLM 生成的 SQL 返回空结果，怎么处理？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（空结果区分、语义验证、用户确认机制）

    1️⃣ Common Answer

    SQL 返回空就告诉用户没有数据，或者让 LLM 重新生成一个 SQL 试试。

    2️⃣ Impressive Answer

    - 先区分"真没数据"还是"SQL 写错了"。对结果为空的 SQL，让 LLM 做语义验证：把生成的 SQL 和原始问题一起传给模型，问"这条 SQL 是否正确表达了用户的查询意图？"如果模型判断 SQL 逻辑有问题，触发一次纠错重试。

    - 检查常见 SQL 陷阱。比如日期范围写反、时区问题、JOIN 条件不对导致笛卡尔积被 WHERE 过滤掉等。可以在纠错提示中加上"请检查日期范围、JOIN 条件是否正确"作为提示。

    - 给用户透明的反馈。如果多次重试仍为空，要告诉用户"根据您的问题生成的查询未返回结果，可能是近一个月确实无销售记录，也可能是查询条件需要调整，生成的 SQL 如下，您可以确认"，把 SQL 暴露给用户做最终判断，避免黑盒。


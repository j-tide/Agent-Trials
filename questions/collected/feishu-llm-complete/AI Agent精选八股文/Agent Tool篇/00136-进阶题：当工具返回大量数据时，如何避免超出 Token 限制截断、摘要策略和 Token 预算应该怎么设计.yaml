content:
  prompt: 进阶题：当工具返回大量数据时，如何避免超出 Token 限制？截断、摘要策略和 Token 预算应该怎么设计？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（按数据类型截断、摘要成本与风险、动态 Token 预算分配）

    1️⃣ Common Answer

    工具返回内容太长就直接截断到一定字符数，或者只取前 N 条。也可以用 LLM 对返回内容做摘要，把长内容压缩后注入上下文。Token 预算方面，给工具结果保留 30-40% 的 context 空间，不让对话历史把 context 全占满。

    2️⃣ Impressive Answer

    我会从 3 个角度来思考这个问题：

    - 截断策略要按数据类型来。搜索结果：按条数截断，每条保留标题+摘要+URL，丢弃正文，不要按字符硬截。结构化数据（JSON/表格）：先过滤掉和当前问题无关的字段，再考虑行数截断，末尾注明"共 N 条，以上为前 X 条"。文件内容：不要直接截头，代码文件按函数/类分割，文档按段落分割，只取与问题最相关的片段（本质是 RAG 的思路）。

    - LLM 摘要有成本和风险，要谨慎使用。摘要本身要额外调用一次 LLM，高频场景成本不低；精确数字和代码摘要后容易失真，这类内容不适合摘要，应该直接截断保留原文。需要摘要时，用小模型（如 GPT-4o-mini）而不是主模型，降低延迟和成本。

    - Token 预算要动态计算，而不是固定比例。动态分配逻辑：模型上下文限制 - 系统 Prompt tokens - 对话历史 tokens - 预期输出 tokens = 可用空间，给工具结果最多 60% 的可用空间，并保证至少 500 token。多工具并发时，按工具结果对当前问题的重要性优先分配预算。另外，用 tiktoken 精确计算 token 数，不要用字符数估算，中英文混合场景下两者差异很大。


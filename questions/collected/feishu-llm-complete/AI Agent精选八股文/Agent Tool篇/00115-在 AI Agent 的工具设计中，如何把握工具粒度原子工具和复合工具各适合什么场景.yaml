content:
  prompt: 在 AI Agent 的工具设计中，如何把握工具粒度？原子工具和复合工具各适合什么场景？
answer:
  mode: rubric
  reference_answer: |-
    1️⃣ Common Answer

    工具要遵循单一职责原则，每个工具只做一件事。粒度太粗复用性差，太细调用次数太多效率低。原子工具适合灵活场景，复合工具适合固定流程。命名要清晰，像 search_web、get_weather 这种风格，让 LLM 一看就懂。

    2️⃣ Impressive Answer

    我会从 3 个角度来分析这个问题：

    - 粒度过粗的工程代价。比如一个 analyze_and_report 工具内部包含数据拉取、分析、格式化、发邮件四步。问题在于：其他任务只需要数据拉取时这个工具用不了；出错后无法定位是哪一步；模型对工具语义理解变模糊，调用准确率下降。

    - 粒度过细的工程代价。比如 open_file、read_line、close_file 各自独立。Agent 需要多轮调用完成一件事，延迟和 Token 消耗都上去了；上下文被大量中间工具结果填满，影响后续推理质量。

    - 实际工程中的分层策略。我比较认可的做法是分三层：原子工具层（execute_sql、http_get），保证可组合性；复合工具层（query_user_orders，内部封装 SQL 构建+执行+格式化），减少调用步骤；动态工具注入，根据当前任务上下文只暴露相关工具，避免工具列表过长导致模型选择混乱。实践经验是：先用原子工具跑通流程，观察 Agent 的高频调用组合，再把那些总是连续调用的工具封装成复合工具。命名方面，动词+名词结构最清晰，避免缩写，相似功能的工具要有明显区分词。


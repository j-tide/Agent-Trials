  reference_answer: |-
    难度级别：⭐（错误处理基础、重试机制、降级策略）

    工具调用失败后，把错误信息作为 tool role 的 content 反馈给 LLM，让它根据错误自主调整参数或换工具。同时需要设置最大重试次数（通常 2-3 次），超过次数后做降级处理，返回描述性的降级结果而不是直接抛出空值。


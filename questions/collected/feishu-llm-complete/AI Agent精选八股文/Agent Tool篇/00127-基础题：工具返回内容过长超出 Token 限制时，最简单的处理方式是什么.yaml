  reference_answer: |-
    难度级别：⭐（截断基础、Token 限制意识）

    最直接的方式是按条数或字符数截断，比如搜索结果只保留前 5 条，并在末尾注明"共 N 条记录"。但要避免按字符截断结构化数据，否则会破坏 JSON 结构导致 LLM 解析失败。


  prompt: 基础题：为什么代码执行工具需要沙箱隔离？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐（安全隔离基础、常见风险）

    LLM 生成的代码可能包含恶意操作（删除文件、读取敏感信息、消耗系统资源），直接在宿主机执行风险极高。沙箱通过隔离执行环境，让代码无法影响宿主机，同时限制资源使用，防止 DoS 攻击。


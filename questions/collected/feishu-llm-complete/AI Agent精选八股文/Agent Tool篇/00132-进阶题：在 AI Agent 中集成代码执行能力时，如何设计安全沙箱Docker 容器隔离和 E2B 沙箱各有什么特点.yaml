content:
  prompt: 进阶题：在 AI Agent 中集成代码执行能力时，如何设计安全沙箱？Docker 容器隔离和 E2B 沙箱各有什么特点？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（Docker vs E2B 对比、完整资源限制、多层防护设计、黑名单局限性）

    1️⃣ Common Answer

    用 Docker 容器隔离代码执行环境，每次执行创建新容器，执行完销毁，这样代码出问题也不影响宿主机。用 --memory 和 --cpus 限制资源，设置超时时间。再做个黑名单过滤 rm -rf、os.system 这类危险操作。E2B 是专门的沙箱服务，比自己搭 Docker 更方便。

    2️⃣ Impressive Answer

    我会从 3 个角度来思考这个问题：

    - Docker vs E2B 的选型对比。Docker 自托管：完全可控、成本低，但容器启动延迟 500ms-2s，需要自己维护镜像安全更新和容器逃逸补丁，适合数据安全要求严格、不能发给第三方的场景（金融、医疗）。E2B：基于 Firecracker 微虚拟机，启动延迟低于 200ms，天然多租户隔离，提供文件系统持久化和流式输出等 Agent 场景所需能力，适合快速落地、对延迟敏感的 Agent 产品。

    - 资源限制要做完整清单，不能只限内存和 CPU。还需要限制进程数（pids_limit 防 fork bomb）、完全断网或白名单网络（network_mode: none）、根文件系统只读（read_only: True）、删除所有 Linux capabilities（cap_drop: ALL）。只靠内存和 CPU 限制，很容易被绕过。

    - 防护要分多层，黑名单是最弱的防线。import('os').system('rm -rf /') 这类变形写法黑名单根本穷举不完。正确做法是：执行前用 AST 解析检测危险模块导入（比字符串匹配更难绕过）；执行中用容器隔离+syscall 白名单（seccomp profile）；执行后对输出做内容安全扫描防止信息泄露。黑名单只做第一道粗筛。


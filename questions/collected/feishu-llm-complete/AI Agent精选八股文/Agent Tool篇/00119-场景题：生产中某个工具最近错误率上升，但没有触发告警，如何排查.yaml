content:
  prompt: 场景题：生产中某个工具最近错误率上升，但没有触发告警，如何排查？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（告警盲区分析、日志查询、链路追踪排查）

    1️⃣ Common Answer

    看一下日志，找到最近的错误记录，看看错误信息是什么，然后修复对应的问题。告警没触发可能是阈值设置太高了。

    2️⃣ Impressive Answer

    - 先分析告警盲区的原因。可能是告警阈值设置过高（比如失败率要超过 50% 才告警），或者是 P2 趋势告警没有配置（只有瞬时阈值，没有持续上升检测）。先检查告警规则是否合理，这次排查完后要补充 P2 趋势告警。

    - 用结构化日志快速定位。在日志系统按 tool_name = 'xxx' + 时间范围过滤，聚合看错误率趋势图，确认是什么时间点开始上升。再按 error_type 分组，看是某一类错误集中出现，还是随机分布。如果是集中出现，大概率是某个依赖变更或数据问题。

    - 用 run_id 还原完整上下文。找到几个失败的 tool_call_id，通过 run_id 关联拉出完整的 Agent 运行链路，看失败前的工具调用序列，判断是工具本身的问题还是上游传入的参数异常导致的。


content:
  prompt: 场景题：Agent 同时调用"创建任务"和"更新任务状态"两个工具，如何避免数据不一致？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（并发顺序依赖、任务依赖建模、事务边界设计）

    1️⃣ Common Answer

    这两个操作有顺序依赖，必须先创建再更新。可以用锁或者串行执行，等创建完了再调更新接口。

    2️⃣ Impressive Answer

    - 识别依赖关系，不并发执行有依赖的工具。"更新任务状态"依赖任务已存在，这两个工具本身不应该并发调用。在 Agent 的任务规划层，通过 DAG 建模工具依赖关系，有依赖的工具串行执行，无依赖的工具才并发执行。

    - "创建任务"工具保证幂等。携带 idempotency_key，即使因网络问题被重试，也不会创建出两个相同任务，确保"更新任务状态"时操作的是同一个任务 ID。

    - 在数据库层做约束兜底。"更新任务状态"的 SQL 加上 WHERE task_id = ? AND status != 'completed' 这类条件，防止并发下状态被错误覆盖，数据库层做最后一道防护。


content:
  prompt: 场景题：Agent 在调用 search_web 工具时，连续返回超时错误，如何处理？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（基础设施错误处理、降级策略、避免影响 Agent 主流程）

    1️⃣ Common Answer

    超时了就重试几次，还是不行就告诉用户搜索失败了，让用户自己手动搜索。

    2️⃣ Impressive Answer

    - 在工具执行层做指数退避重试，对 LLM 透明。超时属于基础设施错误，LLM 无法从中学到有用信息，应该在工具内部做 1s → 2s → 4s 的退避重试，最多 3 次，LLM 感知不到这个过程。

    - 超过重试次数后，返回描述性降级结果。不要返回空值或直接抛出异常，而是返回 {"error": "搜索服务暂不可用，以下是基于已有知识的回答建议"}，LLM 看到这个能继续推进任务，而不是卡死。

    - 同时触发 P0 告警。连续超时说明外部依赖有问题，需要立即通知 on-call，告警内容带上过去 5 分钟的失败次数和失败率，避免告警风暴。


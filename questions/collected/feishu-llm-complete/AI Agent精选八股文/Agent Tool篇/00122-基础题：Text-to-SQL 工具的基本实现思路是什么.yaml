    难度级别：⭐（Schema 注入、SQL 安全约束、基本流程）

    把数据库表结构（Schema）注入 Prompt，让 LLM 根据用户自然语言生成 SQL，使用只读账号执行，把结果返回给用户。安全上要限制只生成 SELECT 语句，禁止 DDL 和 DML 操作。


    ### 二、组件之间的协作关系

    协作流程形成一个闭环循环，直到任务完成：

    text

    用户输入    ↓【感知模块】接收并解析    ↓【记忆模块】读取相关历史（短期上下文 + 长期检索结果）    ↓【推理模块】综合输入+记忆，进行规划 → 决定下一步行动    ↓【行动模块】执行具体操作（如调用搜索工具、计算器、SQL查询）    ↓【记忆模块】将本次行动和结果写入记忆    ↓【评估与反思模块】判断：    - 任务是否完成？ → 是：输出最终答案    - 是否需要更多步骤？ → 是：返回【推理模块】继续    - 是否陷入错误/死循环？ → 是：触发容错或终止

    ---

    ### 三、协作关系图示

    [图片内容未导入]

    关键说明：

    - 记忆模块贯穿全程，为推理提供历史依据，也被行动结果持续更新

    - 评估模块是闭环的“刹车”，防止无限循环

    - 推理模块是决策中心，其他模块为其服务

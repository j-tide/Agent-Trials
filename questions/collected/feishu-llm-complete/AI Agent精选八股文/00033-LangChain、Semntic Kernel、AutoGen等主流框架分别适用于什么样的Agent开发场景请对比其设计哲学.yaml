    ### 三、AutoGen：多智能体对话的“AI公司”框架

    ### 设计哲学

    AutoGen的设计哲学可以用一个生动的比喻来概括：构建一个高效运作的“AI公司” ——在这个“公司”里，不同职责的智能体扮演着员工角色，通过对话式消息传递进行协作。它的核心理念是让多个可定制的、可对话的AI Agent（甚至包括人类）像团队一样通过消息传递和对话进行协作，直到任务完成。

    AutoGen的控制流是 “涌现式”的——由对话历史和“终止条件”驱动，而非显式的流程图边。它强调代码执行与验证能力，Agent可以生成代码并在沙盒中自动执行，形成“编写-运行-修复”的闭环。同时支持人在环路（Human-in-the-Loop），可在任意节点进行审批与编辑。

    ### 适用场景


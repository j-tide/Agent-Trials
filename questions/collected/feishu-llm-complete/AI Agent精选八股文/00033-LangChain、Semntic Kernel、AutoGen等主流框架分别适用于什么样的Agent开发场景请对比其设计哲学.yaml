  reference_answer: |-
    ### 一、LangChain：万能工具箱式的“链式组装”框架

    ### 设计哲学

    LangChain的核心设计哲学是 “模块化、可组合、可扩展” 。它将构建LLM应用的复杂流程抽象为一套可复用的组件体系，开发者可以像搭积木一样将不同的功能模块组合在一起，构建复杂的应用流程。早期版本强调“链式调用”，LangChain 1.0则进一步放弃早期的Chain设计，引入标准化ReAct循环（推理→工具调用→观察→判断）和Middleware机制，简化agent开发流程。

    核心定位：目前最被广泛采用的Agent/LLM应用框架，提供预置agent模板、丰富的工具/连接器（向量数据库、API、记忆、工具调用等），拥有超过600个集成项，生态最为庞大。


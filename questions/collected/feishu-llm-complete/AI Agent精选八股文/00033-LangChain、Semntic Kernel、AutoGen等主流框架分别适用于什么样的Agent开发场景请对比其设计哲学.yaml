    ### 二、Semantic Kernel：企业级刚性的“AI中间件”框架

    ### 设计哲学

    Semantic Kernel的设计哲学是 “企业级中间件思维” ，把自己定位为一个轻量级的SDK，准确地说，是一个AI编排内核。它强调 “技能/插件化、流程化” ，核心是“模型 + 函数（插件/技能）+ 上下文”的组合与意图规划，更像一个AI函数编排与上下文增强的内核。与微软Azure生态深度集成，支持 .NET 和 Python，特别强调依赖注入（DI）、可观测性、安全合规等企业级工程能力。

    核心设计信条：可组合、可验证、可治理。它提供了模型无关的SDK，强调将业务技能、计划、记忆做成可注册、可复用的模块。

    ### 适用场景


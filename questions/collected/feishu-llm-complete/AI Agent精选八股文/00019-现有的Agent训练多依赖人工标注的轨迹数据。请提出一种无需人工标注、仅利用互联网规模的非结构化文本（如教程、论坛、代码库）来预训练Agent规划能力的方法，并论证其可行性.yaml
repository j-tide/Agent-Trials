    ### 五、总结

    我们提出了一种完全无需人工标注的Agent规划能力预训练方法，通过从互联网文本（教程、论坛、代码库）中自动抽取伪轨迹，利用大规模行为克隆学习通用规划知识。该方法在数据规模、抽取精度、成本上均具备可行性，有望将Agent开发中的人工标注需求降低90%以上，并显著提升对新任务的泛化能力。下一步工作包括开源伪轨迹数据集和预训练模型，以及探索如何将抽取与训练端到端联合优化。

content:
  prompt: 26.现有的Agent训练多依赖人工标注的轨迹数据。请提出一种无需人工标注、仅利用互联网规模的非结构化文本（如教程、论坛、代码库）来预训练Agent规划能力的方法，并论证其可行性。
answer:
  mode: rubric
  reference_answer: |-
    ### 一、背景与动机

    当前Agent的训练高度依赖人工标注的轨迹数据（如“思考→行动→观察”序列），成本高昂且难以覆盖长尾任务。然而，互联网上存在海量的非结构化文本，如技术教程（“如何用Python抓取网页”）、论坛问答（“我该如何修复数据库连接”）、代码库（README中的使用示例）、甚至小说中的任务描述。这些文本隐含着丰富的规划知识：从目标到步骤的分解、工具/API的调用顺序、条件分支与错误处理。若能从中自动挖掘出结构化的规划轨迹，即可预训练Agent的规划能力，大幅减少人工标注需求。

    ---

    ### 二、核心方法：从文本中抽取“伪轨迹”

    我提出一个三阶段的预训练框架，称为 PlanMine：

    阶段1：筛选与预处理

    - 从Common Crawl、GitHub、Stack Overflow等来源采集文本片段。

    - 使用启发式规则过滤：保留包含顺序性关键词（first, then, next, finally）、动作动词（run, execute, call, click, write）和代码块的文档。

    - 将长文档切分为“任务单元”：以标题或问题为边界，每个单元描述一个完整任务（如“如何备份PostgreSQL数据库”）。

    阶段2：自动轨迹提取

    对每个任务单元，使用一个现成的大型语言模型（如GPT-4o或DeepSeek-V3，无需针对本任务微调）进行信息抽取，生成伪轨迹。提示词设计如下：

    text

    你是一个流程提取专家。给定以下文本，请提取出完成该任务所需的步骤序列。每个步骤应包含：- 动作：调用的工具/API/命令（用自然语言描述或代码）- 输入参数：关键参数值- 预期观察：执行后的结果或状态变化输出格式为JSON列表，每个元素为{"action": "...", "params": {...}, "observation": "..."}。文本：{text}

    此外，利用代码库中的可执行示例（如Jupyter Notebook、shell脚本），通过静态分析提取函数调用序列及其依赖关系。对于命令行教程，可使用script工具录制真实执行日志。

    最终得到大规模伪轨迹数据集，每条轨迹包含：(初始状态描述，动作序列，每个动作后的观察，最终状态)。虽然存在噪声，但规模可达千万级别。

    阶段3：预训练Agent规划模型

    使用伪轨迹数据，采用行为克隆或因果语言建模预训练一个Agent基础模型（例如7B参数的Transformer）。训练目标：

    - 标准行为克隆：给定当前状态和任务目标，预测下一个动作。

    - 增强目标：同时预测动作执行后的观察（帮助模型学习世界模型）。

    - 辅助任务：预测下一步的合理性（二分类），过滤低质量轨迹。

    预训练后，模型具备了基本的规划能力——能够将高层目标分解为步骤，并选择合适的工具。后续可通过少量人工标注的高质量轨迹进行微调，或通过在线强化学习进一步优化。

    ---

    ### 三、可行性论证

    3.1 数据规模与覆盖度

    - 互联网上的教程、论坛、代码库数量级在百亿文档以上。即使过滤后保留1%，也有数亿个任务单元。例如，仅GitHub就有超过2亿个代码仓库，其中大量README和示例文件包含清晰的API调用序列。Stack Overflow有超过2000万个问答，许多包含解决方案步骤。因此，数据量不是瓶颈。

    3.2 抽取精度

    - 使用当前最强的LLM（如GPT-4）进行一步抽取，准确率可达70-85%（通过人工抽检评估）。虽然存在错误（步骤缺失、顺序颠倒），但大规模预训练对噪声有一定鲁棒性。此外，可以通过交叉验证（从同一任务的不同文档中抽取）和一致性过滤提高质量。

    - 对于代码库，可以静态分析保证100%准确的调用序列（但缺乏自然语言目标）。将代码与注释/文档结合，可生成高质量轨迹。

    3.3 预训练的有效性

    - 已有研究证明，从互联网文本中预训练的动作序列可以提升下游Agent任务的样本效率。例如，WebGPT使用从网页中提取的点击序列预训练；ST-Rep从教程中学习技能表示；CodeBERT从代码中学习API使用模式。我们的方法将这一思路推广到通用Agent规划。

    - 实验预期：在未见过的任务（如使用新API、遵循新流程）上，预训练模型比从头训练的模型成功率提高30%以上，且只需10%的人工标注数据即可达到同等性能。

    3.4 成本可行性

    - 抽取阶段：调用GPT-4处理1亿个任务单元的成本约为200万美元（假设每千个token $0.03，每个任务平均500 token）。但可使用开源模型（如DeepSeek-V3）自托管，成本降至1/10。且这是一次性投资，之后可无限次复用。

    - 预训练阶段：训练7B模型在1亿条伪轨迹上约需数千GPU小时（约10万美元）。总体成本远低于人工标注同等规模轨迹（人工标注一条轨迹成本约1-5美元，1亿条则需数亿美元）。

    ---

    ### 四、潜在挑战与缓解


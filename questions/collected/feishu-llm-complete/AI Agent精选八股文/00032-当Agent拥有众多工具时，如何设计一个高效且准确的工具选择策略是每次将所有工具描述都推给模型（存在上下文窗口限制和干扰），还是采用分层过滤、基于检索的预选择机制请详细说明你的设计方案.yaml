title: 38.当Agent拥有众多工具时，如何设计一个高效且准确的工具选择策略？是每次将所有工具描述都推给模型（存在上下文窗口限制和干扰），还是采用分层过滤、基于检索的预选择机制？请详细说明你的设计方案。

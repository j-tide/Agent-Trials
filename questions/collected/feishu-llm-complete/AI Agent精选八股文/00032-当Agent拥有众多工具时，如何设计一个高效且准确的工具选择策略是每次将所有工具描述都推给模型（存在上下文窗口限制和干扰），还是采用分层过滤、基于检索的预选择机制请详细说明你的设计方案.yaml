content:
  prompt: 38.当Agent拥有众多工具时，如何设计一个高效且准确的工具选择策略？是每次将所有工具描述都推给模型（存在上下文窗口限制和干扰），还是采用分层过滤、基于检索的预选择机制？请详细说明你的设计方案。
answer:
  mode: rubric
  reference_answer: |-
    ### 一、整体架构：四层漏斗

    用户请求 → [1. 工具索引过滤] → [2. 向量检索召回] → [3. 重排序] → [4. 动态上下文注入] → 模型决策

    每层逐步缩小候选工具集，最终只将Top-K个工具（如K=10）的描述送入LLM。

    ---

    ### 二、第一层：工具索引过滤（规则层）

    目标：利用轻量级规则快速排除明显不相关的工具，耗时<1ms。

    实现：

    - 为每个工具预定义触发关键词（如send_email工具有“邮件、发送、email”）、领域标签（如“通信”、“数据库”）。

    - 基于用户输入进行关键词匹配（TF-IDF或简单的包含关系），只保留命中至少一个关键词或标签的工具。

    - 同时维护黑名单：某些工具在特定上下文下禁用（如“删除文件”工具在只读会话中排除）。

    效果：通常能将候选工具从数千个减少到50-100个。

    ---

    ### 三、第二层：向量检索召回（语义层）

    目标：利用语义相似度进一步筛选与用户意图最相关的工具。

    实现：

    - 离线阶段：将每个工具的描述、名称、参数示例等信息，通过嵌入模型（如text-embedding-3-small）转换为向量，存入向量数据库（如Milvus）。

    - 在线阶段：将用户当前输入（可结合最近对话历史）编码为查询向量，进行ANN检索，召回Top-M个最相似的工具（M=30~50）。

    优化点：

    - 使用多字段加权：工具名称权重>描述>参数示例，提高精确匹配。

    - 支持混合检索：结合BM25，提升对专有名词的召回（参考第8题）。

    效果：候选集缩减至30-50个。

    ---

    ### 四、第三层：重排序（Re-ranking）

    目标：对召回的工具进行精细排序，消除向量检索可能带来的语义漂移，选出最相关的Top-K（K=10）。

    实现：

    - 使用一个轻量级交叉编码器（如MiniLM微调的排序模型），对每个（用户请求，工具描述）对打分（0~1）。

    - 交叉编码器比双编码器（向量检索）更准确，但计算稍重。由于候选集已很小（≤50），可以实时计算。

    - 也可使用LLM自身进行排序：将用户请求和候选工具列表作为输入，要求模型输出最相关的3-5个工具名。但注意这会增加一次LLM调用。

    效果：最终保留10个最相关的工具。

    ---

    ### 五、第四层：动态上下文注入

    目标：将精选后的工具描述（完整Schema）注入LLM的提示词中，让模型做出最终选择。

    实现：

    - 按照重排序得分降序列出工具，并标注简要说明。

    - 同时注入一个“无工具可用”的选项，防止模型强行选择不匹配的工具。

    - 提示词示例：

    - text

    - 你有以下工具可用（按相关性排序）：1. search_papers(query, limit): 搜索学术论文。...2. get_weather(city): 查询天气。......请根据用户请求，选择合适的工具并填写参数。如果没有合适工具，请回复“无法处理”。

    优势：模型只需处理少量、高度相关的工具，决策准确率和响应速度都得到提升。

    ---

    ### 六、冷启动与更新机制

    - 新工具注册：实时生成向量并插入数据库，无需重建全量索引。

    - 动态频率调整：对于高频使用的工具，在向量检索阶段可以给予额外权重（boost）。

    - 用户个性化：可为每个用户维护独立的工具使用历史，在检索时加权常用工具。

    ---

    ### 七、效果对比

    [嵌入表格未展开]

    ---

    ### 八、总结

    对于大规模工具集，不应将所有工具描述一次性推给模型。采用索引过滤→向量召回→重排序→动态注入的分层漏斗策略，可以在保证高准确率的同时，大幅降低上下文长度和计算成本。该方案已在多个工业级Agent系统中验证有效，且支持工具数量扩展至万级。

    类比人类：短期记忆 ≈ 当前思考的“草稿纸”；长期记忆 ≈ 大脑中存储的知识和经验。

    场景：用户第二天再次使用同一个数据分析Agent，问“帮我做上次那个销售表的趋势图”。

    一句话选型：

    - 快速原型 + 生态丰富 + 单Agent → LangChain

    - 企业系统 + 微软生态 + 工程治理 → Semantic Kernel

    - 多Agent协作 + 代码执行 + 探索性任务 → AutoGen

    - “在调用任何工具前，你必须确保所有必填参数都有合逻辑的值。如果参数缺失，禁止编造，必须向用户提问。如果用户的问题涉及多个工具，优先调用数据获取类工具，再调用数据操作类工具。”

    - 如果日期格式不对，尝试自动修正。

    - 如果必填参数缺失，让模型重新回答，并提示“你遗漏了参数 X”。
    这比期望模型一次就对要可靠得多。

    - search_product 返回一个 JSON，其中包含 product_id 字段。后续工具 check_inventory 的输入参数 product_id 应从前一个工具的输出中提取，而不是编造。

    - 根据以下信息回答用户：天气信息：{tool1_output}，餐厅推荐：{tool2_output}。请自然连贯地组织回答。

    - 维护一个列表 call_sequence 记录每次调用的指纹。

    - 同时维护一个集合 call_set 记录所有出现过的指纹。

    - 简单重复：如果当前指纹与上一步指纹相同，立即判定为循环。

    - 长周期循环：检测最近 N 步是否与更早的某段序列重复（如使用滑动窗口或字符串匹配）。更简单的方法：如果同一指纹出现超过阈值（如 3 次），判定为循环。

    - 无进展循环：如果连续 K 步（如 5 步）内，工具调用的结果没有导致最终答案的进展（例如回答长度未增加、未产生新的实体信息），也可视为无效循环。

    - 清空当前循环的步骤记录，向 Agent 的系统提示词中注入一条强制指令：

    - “你已陷入重复调用 get_weather 的循环。禁止再次调用该工具。请直接基于已有信息回答用户，或者向用户询问更多信息。”

    - 或者直接终止循环，返回当前已聚合的结果，并附加说明：“系统检测到重复操作，已停止继续尝试。”

    - START：初始状态，可调用“搜索知识库”工具。

    - GATHERING_INFO：信息不足，可调用“查询用户信息”、“查询订单”等工具。

    - RESOLVING：已有足够信息，可调用“生成答案”工具，或“提交工单”工具。

    - END：终止状态。

    - 从 START 只能转移到 GATHERING_INFO 或 RESOLVING。

    - 在 GATHERING_INFO 下，如果连续两次调用相同的“查询”工具且返回相同结果，则强制转移到 RESOLVING（即使模型还想继续查）。

    - 禁止从 RESOLVING 返回到 GATHERING_INFO（除非用户明确要求补充信息）。

    - “当前状态：GATHERING_INFO。你最多还能调用 2 次工具。可用的工具：[query_order, search_faq]。禁止重复调用同一个工具超过 2 次。如果信息已足够，请直接输出最终答案并转到 RESOLVING 状态。”

    - “你调用了 get_weather 工具，参数 unit 的值 Kelvin 无效。请使用 celsius 或 fahrenheit 重新调用。”

    - “如果工具调用返回参数错误，请仔细阅读错误信息，修正参数后重试。不要重复相同的错误。”

    - 日期格式：“2024/05/24” → “2024-05-24”

    - 枚举大小写：“Celsius” → “celsius”

    - 缺失的非必填参数：使用工具定义的默认值。

    - 天气查询失败 → “抱歉，我暂时无法获取天气信息，请稍后再试。”

    - 搜索无结果 → “未找到相关内容，请尝试简化关键词。”

    - 只读根文件系统：--read-only

    - 删除所有 Linux Capabilities：--cap-drop=ALL

    - 只添加必要 Capability（如无，则 --cap-drop=ALL）

    - 以非 root 用户运行：--user 1000:1000

    - 设置内存/CPU 限制：--memory=256m --cpus=0.5

    - 设置超时自动销毁：--rm --timeout=30

    - 允许 api.openai.com:443

    - 允许 db.internal.com:5432（且需额外认证）

    - 单个 Agent 会话在 1 分钟内查询超过 3 个不同用户的手机号 → 告警并暂停该会话。

    - 尝试 SELECT * FROM employees → 直接拒绝并记录提权尝试。

    - 收集真实用户请求 500~2000 条，人工标注：预期答案、预期工具调用序列、关键子步骤。

    - 包含正常样本 + 对抗样本（参数缺失、歧义、多轮依赖等）。

    - Agent Runner 批量回放测试集，记录每条轨迹的结构化日志（JSON Lines）：每步的推理、工具调用、参数、结果、时间戳、Token 等。

    - 规则评估：Schema 校验、时间统计、调用计数。

    - LLM 评估：用 GPT-4 等模型判断任务是否成功、工具结果是否相关（提供评分标准提示词）。

    - 比对评估：工具选择与参数与黄金标注比对。

    - 计算各指标平均值，加权得到综合得分（如任务成功率 40%，工具准确率 20%，效率 20%，资源 10%，安全性 10%）。

    - 输出每个 Case 的详细得分及失败原因分析。

    - 提示词包含：表结构、示例查询（few-shot）、禁止操作（DELETE/DROP）、要求输出标准SQL。

    - 支持复杂查询：JOIN、子查询、窗口函数。

    - 白名单：只允许SELECT，禁止DDL/DML。

    - 表级校验：只能访问元数据缓存中授权的表。

    - 行数限制：自动添加LIMIT 1000防止返回过多数据。

    - 超时设置：设定查询最大执行时间（如30秒）。

    - 使用连接池（如HikariCP）管理数据库连接。

    - 支持异步执行，避免阻塞Agent循环。

    - 捕获数据库异常（字段不存在、语法错误）并转化为友好错误信息。

    - 若查询成功：将结果数据（前几行）和统计摘要传给LLM，生成自然语言解释。

    - 若查询失败：将错误信息（如“列不存在”）提供给LLM，让模型修正SQL或告知用户。

    “平板电脑目前有9折优惠，折后4500元。关于您手机的退货申请，因为缺少发票，我们已经提交人工审核，预计24小时内会有结果。您可以在‘我的工单’中查看进度。”

    - 工具名模糊匹配（编辑距离）

    - 参数类型转换与校验

    - 缺失参数从上下文或默认值填充

    - 层次边：is-a（“退货流程”是“客服流程”的子类）

    - 时序边：precedes（验证身份 precedes 检查订单）

    - 因果边：causes（检查通过 causes 进入审核）

    - 参数边：has-parameter（查询订单技能 has-parameter “时间范围”）

    - 调用边：calls（退货技能 calls 查询订单技能）

    - 协作的达成依赖LLM的推理能力、提示词设计、以及对话轮次限制。

    - 理论上，对话可能永远不收敛（循环争论、不断引入新条件），但工程上通过最大轮次强制终止。

    - 不存在“策略收敛”的概念；每次对话都是一次性推理，同一组Agent面对相同任务可能因随机采样而给出不同协作结果。

    - 粗粒度：每个高级策略（如“先搜索再查询”）为一个臂。

    - 细粒度：每个具体的工具+参数组合为一个臂（参数离散化后）。

    - 组合臂：若路径长度>1，可使用组合Bandit（如将路径视为一个超级臂）。

    - 即时奖励：工具执行后，根据结果质量打分（如正确/错误，耗时）。

    - 延迟奖励：整个任务完成后，将总奖励按贡献分配给各个工具调用（信用分配，可使用归因技术）。

    - 使用LLM将当前上下文（对话历史、任务目标）编码为稠密向量（如768维），作为上下文特征。

    - 若状态空间小或线性可分：LinUCB。

    - 若状态复杂且数据量大：神经UCB（NeuralUCB）或Thompson采样加神经网络后验。

    - 可根据任务难度动态调整UCB中的探索系数。初期高探索，后期逐渐降低。

    问题：小明有5个苹果，给了小红2个，又买了3个，现在有几个？
    CoT输出：
    “原来有5个，给小红2个，剩下5-2=3个。再买3个，3+3=6个。所以答案是6。”
    → 这只是把计算过程写出来，并没有产生任何可执行的动作（如调用计算器函数）。

    规划输出（JSON格式）：

    [
      {"action": "subtract", "params": {"a": 5, "b": 2}},
      {"action": "add", "params": {"a": "result_of_prev", "b": 3}}
    ]

    这个列表可以直接被一个计算引擎执行，得到最终结果。即使模型不写出中间数字，执行器也能算出结果。

    - “首先，我需要知道明天的日期。今天是4月2日，所以明天是4月3日。然后我要查询北京4月3日的天气。如果温度>20°C，输出‘带薄外套’；否则输出‘带厚外套’。但是我现在没有实时天气数据，所以我只能假设温度……”
    → 模型空想，无法真正获取天气，最终只能凭猜测回答。

    - get_date(offset=1) → 得到“2026-04-03”

    - get_weather(city="北京", date="2026-04-03") → 返回温度25°C

    - compare(temperature, 20) → 大于

    - output("带薄外套")
    → 这些动作可以被Agent依次调用，真实获取数据并输出正确建议。

    - 规划步骤：

    - 若因超时 → 降低并发度，串行执行。

    - 若因数据格式错误 → 尝试其他解析器或手动修正。

    - 若因缺少字段 → 调整后续工具对字段的依赖（如不要求摘要时，用标题代替）。

    - 贪心：每次只扩展评分最高的节点。

    - 束搜索（Beam Search）：保留Top-K个节点。

    - 蒙特卡洛树搜索（MCTS）结合UCB。

    - Planner生成子任务序列 [sub1, sub2, sub3]

    - Executor执行sub1，返回结果。

    - 评估模块判断结果是否推进目标；若偏离，则调用Planner重新生成剩余子任务。

    - recency：上次访问时间距今天数，指数衰减。

    - importance：由用户显式标记或系统自动评估（如涉及任务成功的关键记忆）。

    - access_frequency：过去30天被检索的次数。

    - 低分记忆（低于阈值）先移到“冷存储”（如S3），保留元数据。

    - 极低分且超过90天的记忆，彻底删除。

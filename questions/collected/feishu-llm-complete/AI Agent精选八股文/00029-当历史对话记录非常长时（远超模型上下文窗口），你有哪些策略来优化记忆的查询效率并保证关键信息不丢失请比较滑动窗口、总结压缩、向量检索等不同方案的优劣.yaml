content:
  prompt: 35.当历史对话记录非常长时（远超模型上下文窗口），你有哪些策略来优化记忆的查询效率并保证关键信息不丢失？请比较“滑动窗口”、“总结压缩”、“向量检索”等不同方案的优劣。
answer:
  mode: rubric
  reference_answer: |-
    ### 一、三种策略的原理与实现

    滑动窗口（Sliding Window）

    原理：保留最近的K轮对话（例如最近10轮），超出窗口的对话直接丢弃。

    实现：维护一个固定长度的队列，新消息加入时，最早的消息被移除。

    优点：

    - 实现极简单，计算开销为零。

    - 保证窗口内的信息完整（无信息损失或压缩）。

    - 响应速度快，无需额外处理。

    缺点：

    - 关键信息可能早于窗口而丢失。例如，用户在第一轮提供了API密钥，100轮后询问“我之前给你的密钥是什么？”则无法回答。

    - 无法处理长跨度依赖的任务。

    适用场景：短期、实时性要求高的对话（如客服），且任务不依赖早期信息。

    总结压缩（Summarization / Condensation）

    原理：当历史长度超过阈值时，调用LLM对早期对话生成摘要，用摘要替换原始对话，保留摘要+近期窗口。

    实现：

    - 触发条件：总token数超过窗口限制的70%。

    - 压缩策略：对最早的一部分（例如前30%的历史）生成摘要，保留摘要，其余近期对话完整保留。

    - 可递归：多次压缩后，摘要的摘要形成层次化记忆。

    优点：

    - 保留关键信息的语义，而非简单丢弃。

    - 可压缩比例高（例如将100k tokens压缩到2k）。

    - 摘要可被模型直接理解，无需额外检索。

    缺点：

    - 摘要过程会丢失细节（如具体数字、精确措辞）。

    - 每次压缩需要调用LLM，有成本和延迟。

    - 若摘要质量不佳，会引入错误或遗漏。

    适用场景：对话中早期信息可以被概括而不失关键点（如用户偏好、长期目标），但不需要逐字回忆。

    向量检索（Vector Retrieval / RAG）

    原理：将整个历史对话分块（chunk），每块通过嵌入模型转换为向量，存入向量数据库。当需要回忆时，根据当前查询的嵌入向量检索最相关的K个块，注入提示词。

    实现：

    - 分块策略：按对话轮次或固定长度（如512 tokens）切分，保留重叠区域。

    - 索引：使用Milvus、Pinecone等。

    - 检索：每次用户输入时，将其编码为查询向量，召回Top-K相关块。

    优点：

    - 理论上可保留无限历史，只检索最相关信息。

    - 细节完整（直接存储原始文本）。

    - 支持语义相似性检索，能发现隐含关联。

    缺点：

    - 检索可能不准确：若关键信息与当前查询语义不相似，则无法召回。

    - 需要额外的嵌入模型和向量数据库，增加系统复杂度。

    - 检索延迟（通常几十到几百毫秒）加上LLM处理，整体耗时增加。

    适用场景：历史中大量琐碎信息，但需要按主题或语义精确查找（如“用户三个月前提到过的某个产品名称”）。

    ---


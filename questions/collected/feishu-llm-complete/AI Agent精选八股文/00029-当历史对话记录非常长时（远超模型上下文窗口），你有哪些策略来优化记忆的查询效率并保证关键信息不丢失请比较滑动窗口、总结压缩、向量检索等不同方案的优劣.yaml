    ### 三、组合策略：在实践中取长补短

    没有单一方案能完美解决所有问题。实际生产系统通常采用分层记忆架构：

    text

    最新对话（如最近3轮） → 完整保留（滑动窗口的一部分）近期对话（如3轮~50轮） → 滑动窗口（不压缩）中期历史（如50轮~500轮） → 按主题压缩为摘要，存入向量库长期历史（>500轮） → 向量检索（原始分块）

    同时，动态决策机制：

    - 对于时间敏感或连续上下文的任务，优先使用滑动窗口。

    - 当检测到用户询问过去事件（如“还记得上个月我们说过的计划吗？”），触发向量检索。

    - 定期（如每日）在后台对超过阈值的历史进行异步总结，并更新向量库。

    此外，可引入关键信息标记：用户或Agent可显式标记重要信息（如API密钥、生日），这些信息不经过压缩，而是永久存储于独立的键值存储中，检索时优先级最高。

    ---

    ### 四、总结

    - 滑动窗口：简单高效，但信息丢失严重，适用于短会话或对早期信息不敏感的场景。

    - 总结压缩：保留语义，节省空间，但丢失细节且有计算成本，适合长期用户偏好的抽象。

    - 向量检索：信息保真度高，支持语义查询，但实现复杂且可能漏召回，适合需要精确回忆细节的场景。

    最佳实践：采用混合架构，将最新对话完整保留，中期历史摘要化，长期历史向量化，并根据查询类型动态选择检索源。这样可以在效率、准确性和成本之间取得平衡。

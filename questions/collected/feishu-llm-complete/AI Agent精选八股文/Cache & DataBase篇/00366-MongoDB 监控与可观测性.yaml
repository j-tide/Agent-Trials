    - 混合方案：根据租户规模动态调整

    - insert/query/update/delete：每秒操作数（QPS）

    - command：每秒命令数

    - vsize：虚拟内存使用量

    - res：物理内存使用量

    - faults：每秒 Page Fault 数（内存不足时增加）

    - qr|qw：读写队列长度（队列过长表示性能瓶颈）

    - ar|aw：活跃读写连接数

    - netIn/netOut：网络流入/流出量

    - total：集合总读写时间

    - read：集合读时间

    - write：集合写时间

    - 作用：定位热点集合，优化索引

    - opcounters：操作计数器（insert/query/update/delete 总数）

    - connections：连接数（current/available）

    - pages read into cache：读入页数（内存不足时增加）

    - pages evicted：驱逐页数（内存不足时增加）

    - percentage dirty：脏页比例（过高时 Checkpoint 频繁）

    - wiredTiger.cache：缓存指标

    - 0：关闭

    - 1：记录慢查询（默认超过 100ms）

    - 2：记录所有查询（仅用于调试）

    - 级别设置：

    - 配置方式： `javascriptdb.setProfilingLevel(1, {slowms: 100}) `

    - 查看慢查询： `javascriptdb.system.profile.find().sort({ts: -1}).limit(10) `

    - 会话 QPS 监控：mongostat 监控 insert/query QPS

    - 热点集合监控：mongotop 定位热点集合，优化索引

    - 内存监控：db.serverStatus() 监控 wiredTiger cache，避免内存不足

    - 慢查询监控：Profiler 记录慢查询，优化查询

    - 数据采集：MongoDB Exporter 采集指标

    - 数据存储：Prometheus 存储时序数据

    - 数据展示：Grafana 可视化展示

    - 告警通知：Alertmanager 发送告警

    - QPS：mongod_op_counters_total（insert/query/update/delete）

    - 连接数：mongod_connections_current / mongod_connections_available

    - 内存：mongod_wiredtiger_cache_bytes（缓存大小）

    - 基础指标：

    - 延迟：mongod_latency_histogram（操作延迟）

    - Page Fault：mongod_wiredtiger_cache_pages_evicted_total（驱逐页数）

    - 队列长度：mongod_global_lock_current_queue（锁队列长度）

    - 性能指标：

    - 会话 QPS：按 agentId 分组统计

    - 慢查询数：按集合分组统计

    - 业务指标：

    - alert: HighQPSexpr: rate(mongodopcounters_total[5m]) > 1000for: 5mlabels:severity: warningannotations:summary: "MongoDB QPS 过高"

    - QPS 告警：QPS 超过阈值时告警 `yaml

    - `

    - alert: HighConnectionsexpr: mongodconnectionscurrent / mongodconnectionsavailable > 0.8for: 5mlabels:severity: warningannotations:summary: "MongoDB 连接数过高"

    - 连接数告警：连接数超过阈值时告警 `yaml

    - `

    - alert: HighMemoryexpr: mongodwiredtigercachebytes / nodememoryMemTotalbytes > 0.8for: 5mlabels:severity: warningannotations:summary: "MongoDB 内存使用率过高"

    - 内存告警：内存使用率超过阈值时告警 `yaml

    - `

    - alert: HighSlowQueryexpr: rate(mongodslowqueries_total[5m]) > 10for: 5mlabels:severity: warningannotations:summary: "MongoDB 慢查询过多"

    - 慢查询告警：慢查询数超过阈值时告警 `yaml

    - 基础仪表板：QPS、连接数、内存、延迟

    - 业务仪表板：会话 QPS、慢查询数、热点集合

    - 告警仪表板：告警历史、告警趋势

    - 会话 QPS 监控：按 agentId 分组，定位热点 Agent

    - 慢查询监控：按集合分组，优化慢查询

    - 内存监控：监控 wiredTiger cache，避免内存不足

    - 告警通知：钉钉、邮件、短信多渠道通知

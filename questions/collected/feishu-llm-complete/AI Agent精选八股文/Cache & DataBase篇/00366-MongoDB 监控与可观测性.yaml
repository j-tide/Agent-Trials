    难度级别：⭐⭐~⭐⭐⭐⭐（mongostat、mongotop、opcounters、connections、wiredTiger cache、慢查询 Profiler）

    基础题：如何监控 MongoDB 的健康状态？有哪些常用工具？

    MongoDB 监控工具：

    - mongostat：实时监控 MongoDB 状态（QPS、连接数、内存使用等）

    - mongotop：监控集合读写时间，定位热点集合

    - db.serverStatus()：查看服务器状态（内存、连接、锁等）

    - db.currentOp()：查看当前运行的操作

    - MongoDB Atlas：云服务自带监控仪表板

    进阶题：mongostat/mongotop 的核心指标是什么？opcounters、connections、wiredTiger cache 分别代表什么？慢查询 Profiler 如何配置？

    1️⃣ Common Answer

    mongostat 看基本指标，mongotop 看集合读写时间。opcounters 是操作数，connections 是连接数，wiredTiger cache 是缓存。慢查询用 Profiler。


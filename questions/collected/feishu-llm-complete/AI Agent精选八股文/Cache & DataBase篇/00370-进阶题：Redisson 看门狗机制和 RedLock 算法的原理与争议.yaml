answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（看门狗续期、RedLock多节点、Martin Kleppmann争议、Lua脚本原子性）

    1️⃣ Common Answer

    Redis 分布式锁用 SETNX 加锁，设置过期时间。Redisson 实现了看门狗机制，自动续期锁的过期时间，防止业务执行时间过长导致锁过期。RedLock 是在多个 Redis 节点上同时加锁，提高可用性。释放锁时用 Lua 脚本保证原子性。

    2️⃣ Impressive Answer

    Redis 分布式锁的核心是原子性保证和容错机制，Redisson 看门狗和 RedLock 是两个重要演进：

    - 基础实现与陷阱


content:
  prompt: "\U0001F9F0 1. Redis 除了基础数据结构，还有哪些高级数据结构？"
answer:
  mode: rubric
  reference_answer: |-
    除了基础的五种（String、Hash、List、Set、ZSet），Redis 还有三种高级数据结构，它们专门解决一些特定场景下的复杂问题。在 AI Agent 系统中，它们往往能以极低的复杂度实现精巧的功能。

    [嵌入表格未展开]

    3.1 HyperLogLog：亿级 UV 的统计神器

    它能在 12KB 的固定内存里，统计超过 2^64 个独立元素的近似基数（标准误差 0.81%）。它不需要存储每个元素，而是通过哈希概率算法估算。在 Agent 场景中，可以极低成本地统计每天有多少独立用户使用了某个工具。

    # 记录每天访问 Agent 的用户 UV
    r = redis.Redis()
    r.pfadd("uv:agent:20260704", "user_001", "user_002", "user_003")
    count = r.pfcount("uv:agent:20260704")
    print(f"今天 Agent 独立访客数: {count}")

    3.2 Geo：让 Agent 懂得“附近”的智能

    它可以将经纬度作为坐标存入，并直接计算两点之间的距离、查找指定半径内的所有点。

    # 存入 Agent 服务的线下门店位置
    r.geoadd("stores", (116.404, 39.915, "store_A"), (116.418, 39.921, "store_B"))

    # 查找 (116.405, 39.910) 附近 5 公里内的门店
    stores = r.georadius("stores", 116.405, 39.910, 5, unit="km")
    print(stores)  # [b'store_A']

    3.3 Bitmaps：用比特位做极简标记

    它用一个 String 的每一位来记录一个布尔值，非常适合记录海量用户的二值状态（如签到、是否已读），内存占用极低。

    # 记录用户 ID=1001 在 7 月 4 日是否签到
    r.setbit("checkin:20260704", 1001, 1)
    is_signed = r.getbit("checkin:20260704", 1001)
    print(f"用户 1001 今天签到: {bool(is_signed)}")

    这些高级数据结构的共同价值：它们用极小的内存和极高的性能，解决了传统关系型数据库需要庞大索引和复杂 SQL 才能（甚至无法）完成的任务。在 AI Agent 处理海量日志、实时统计和地理位置服务时，它们是让系统保持轻快的核心力量。

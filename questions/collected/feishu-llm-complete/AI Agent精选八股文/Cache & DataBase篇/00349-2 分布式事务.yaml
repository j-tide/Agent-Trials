content:
  prompt: 1.2 分布式事务
answer:
  mode: rubric
  reference_answer: "### 分布式事务解决方案\n\n1、基础题：什么是 2PC 和 3PC？它们有什么区别？\n\n⭐（2PC/3PC 原理、优缺点对比）\n\n2PC（Two-Phase
    Commit，两阶段提交）是一种分布式事务协议，分为两个阶段：\n\n- 准备阶段（Prepare）：协调者询问所有参与者是否可以提交，参与者执行事务但不提交，返回\"可以\"或\"不可以\"\n\n-
    提交阶段（Commit）：如果所有参与者都返回\"可以\"，协调者发送提交指令，否则发送回滚指令\n\n3PC（Three-Phase Commit，三阶段提交）在
    2PC 基础上增加了一个阶段：\n\n- CanCommit 阶段：协调者询问参与者是否可以执行事务\n\n- PreCommit 阶段：参与者预执行事务，但不提交\n\n-
    DoCommit 阶段：协调者根据参与者反馈决定提交或回滚\n\n区别：\n\n- 阻塞问题：2PC 在准备阶段会阻塞参与者，3PC 通过预提交减少阻塞时间\n\n-
    单点故障：2PC 如果协调者故障，参与者会一直阻塞；3PC 引入超时机制，参与者可以自动决策\n\n- 性能：3PC 多一个阶段，性能略差\n\n2、进阶题：TCC、Saga
    模式分别适用于什么场景？如何实现补偿机制？\n\n⭐⭐（TCC 原理、Saga 模式、补偿机制设计）\n\n1️⃣ Common Answer TCC 就是
    Try-Confirm-Cancel，三个阶段。Saga 是把一个大事务拆成多个小事务，每个小事务都有对应的补偿操作。如果失败了就执行补偿。\n\n2️⃣
    Impressive Answer TCC 和 Saga 都是分布式事务的解决方案，但适用场景和实现方式有很大区别。\n\nTCC（Try-Confirm-Cancel）模式：\n\nTCC
    将业务逻辑拆分为三个阶段：\n\n- Try 阶段：预留资源，检查业务可行性\n\n- Confirm 阶段：确认执行业务操作，使用 Try 阶段预留的资源\n\n-
    Cancel 阶段：取消业务操作，释放 Try 阶段预留的资源\n\n适用场景：\n\n- 资源型业务，如库存扣减、账户转账\n\n- 对一致性要求高的场景\n\n-
    业务逻辑相对简单，可以拆分为三个明确阶段\n\n实现示例（库存扣减）：\n\n// Try：冻结库存\npublic boolean tryDeductStock(String
    orderId, String productId, int count) {\n    // 检查库存是否充足\n    if (getAvailableStock(productId)
    < count) {\n        return false;\n    }\n    // 将库存从可用转为冻结\n    freezeStock(productId,
    count, orderId);\n    return true;\n}\n\n// Confirm：确认扣减\npublic boolean confirmDeductStock(String
    orderId, String productId, int count) {\n    // 删除冻结记录，实际扣减库存\n    deductStock(productId,
    count);\n    return true;\n}\n\n// Cancel：取消扣减\npublic boolean cancelDeductStock(String
    orderId, String productId, int count) {\n    // 将冻结库存转回可用\n    unfreezeStock(productId,
    count, orderId);\n    return true;\n}\n\nTCC 的优缺点：\n\n- 优点：性能好，不依赖外部组件；一致性保证强\n\n-
    缺点：代码侵入性强，每个业务都要写三个方法；开发成本高；容易出现悬挂、空回滚等问题\n\nSaga 模式：\n\nSaga 将长事务拆分为多个本地短事务，每个短事务都有对应的补偿事务。如果某个短事务失败，就执行之前所有已执行短事务的补偿操作。\n\n适用场景：\n\n-
    业务流程长、步骤多的场景\n\n- 某些步骤无法回滚，只能补偿的场景\n\n- 对实时性要求不高的场景\n\nSaga 的两种实现方式：\n\n- 协调式
    Saga（Choreography）：\n\n- 每个服务执行完本地事务后，发布事件\n\n- 下一个服务订阅事件，执行自己的事务\n\n- 如果失败，发布补偿事件，触发已执行服务的补偿操作\n\nsequenceDiagram\n
    \   participant Order as 订单服务\n    participant Inventory as 库存服务\n    participant
    Payment as 支付服务\n    \n    Order->>Order: 创建订单\n    Order->>Inventory: 扣减库存事件\n
    \   Inventory->>Inventory: 扣减库存\n    Inventory->>Payment: 支付事件\n    Payment->>Payment:
    执行支付\n    alt 支付失败\n        Payment->>Inventory: 补偿库存事件\n        Inventory->>Inventory:
    增加库存\n        Inventory->>Order: 补偿订单事件\n        Order->>Order: 取消订单\n    end\n\n-
    编排式 Saga（Orchestration）：\n\n- 有一个协调者（Saga 协调器）负责整个流程\n\n- 协调者按顺序调用各个服务\n\n- 如果失败，协调者按逆序调用补偿操作\n\n//
    Saga 协调器伪代码\npublic void executeOrderSaga(Order order) {\n    List<SagaStep> steps
    = Arrays.asList(\n        new CreateOrderStep(order),\n        new DeductStockStep(order),\n
    \       new ProcessPaymentStep(order)\n    );\n    \n    int executedSteps = 0;\n
    \   try {\n        for (int i = 0; i < steps.size(); i++) {\n            steps.get(i).execute();\n
    \           executedSteps = i + 1;\n        }\n    } catch (Exception e) {\n        //
    按逆序执行补偿\n        for (int i = executedSteps - 1; i >= 0; i--) {\n            steps.get(i).compensate();\n
    \       }\n        throw e;\n    }\n}\n\n补偿机制的设计要点：\n\n- 补偿操作必须是幂等的\n\n- 补偿可能被调用多次，必须保证多次执行结果一致\n\n-
    使用唯一业务 ID（如订单号）作为幂等键\n\n- 补偿操作要考虑并发问题\n\n- 在补偿过程中，可能有其他操作也在修改数据\n\n- 使用乐观锁或分布式锁避免并发冲突\n\n-
    补偿失败的处理\n\n- 如果补偿也失败了，需要人工介入\n\n- 记录详细的失败日志，包括原始操作、补偿操作、失败原因\n\n- 补偿的可见性\n\n-
    补偿操作可能需要一定时间，用户查询时要能正确显示状态\n\n- 比如\"退款处理中\"，而不是显示错误的金额\n\n我在实际项目中的应用：\n\n在电商订单系统中，我采用了
    Saga 模式：\n\n- 订单服务创建订单（本地事务）\n\n- 库存服务扣减库存（本地事务）\n\n- 支付服务处理支付（本地事务）\n\n- 物流服务创建运单（本地事务）\n\n如果支付失败，Saga
    协调器会：\n\n- 调用库存服务的补偿接口，增加库存\n\n- 调用订单服务的补偿接口，取消订单\n\n为了保证可靠性，我做了以下设计：\n\n- 每个步骤执行前，先记录操作日志（状态为\"执行中\"）\n\n-
    执行成功后，更新日志状态为\"已完成\"\n\n- 执行失败时，更新日志状态为\"失败\"，并记录失败原因\n\n- 定时任务扫描\"执行中\"超过 10
    分钟的记录，重试或补偿\n\n- 提供管理后台，支持手动触发补偿\n\n这样设计的好处是：\n\n- 解耦：各服务独立，不需要统一的分布式事务协调器\n\n-
    可观测：每个步骤的状态都记录在日志中，便于追踪\n\n- 可恢复：即使服务重启，也能根据日志恢复状态\n\n- 灵活性：可以根据业务需要调整流程顺序\n\n3️⃣
    Key Differences\n\n3、在电商秒杀场景中，用户下单后需要扣减库存、扣减优惠券、扣减账户余额，这三个操作必须全部成功或全部失败。如何设计分布式事务方案？\n\n⭐⭐⭐（秒杀场景、高并发、事务一致性）\n\n1️⃣
    Common Answer 用 TCC 吧，先预留库存、冻结优惠券、冻结余额，然后一起提交。如果失败了就回滚。\n\n2️⃣ Impressive Answer
    秒杀场景的特点是高并发、低延迟、强一致性，我会采用TCC + 本地消息表 + 补偿的组合方案。\n\n首先分析业务需求：\n\n- 一致性要求：库存、优惠券、余额必须原子性操作，不能出现\"库存扣了但余额没扣\"的情况\n\n-
    性能要求：秒杀期间 QPS 可达 10 万+，响应时间要控制在 100ms 以内\n\n- 可用性要求：系统不能因为某个服务故障而完全不可用\n\n整体方案设计：\n\nsequenceDiagram\n
    \   participant User as 用户\n    participant Gateway as 网关\n    participant Order
    as 订单服务\n    participant Inventory as 库存服务\n    participant Coupon as 优惠券服务\n
    \   participant Account as 账户服务\n    participant MQ as 消息队列\n    participant DB
    as 数据库\n    \n    User->>Gateway: 下单请求\n    Gateway->>Order: 路由到订单服务\n    Order->>Order:
    限流&防重检查\n    Order->>Inventory: Try: 预扣库存\n    Inventory->>DB: 冻结库存\n    Inventory-->>Order:
    成功\n    Order->>Coupon: Try: 冻结优惠券\n    Coupon->>DB: 标记优惠券使用中\n    Coupon-->>Order:
    成功\n    Order->>Account: Try: 冻结余额\n    Account->>DB: 冻结余额\n    Account-->>Order:
    成功\n    Order->>DB: 创建订单(本地事务)\n    Order->>MQ: 发送确认消息\n    par 异步确认\n        MQ->>Inventory:
    Confirm: 确认扣减\n        Inventory->>DB: 扣减库存\n        MQ->>Coupon: Confirm: 确认使用\n
    \       Coupon->>DB: 标记优惠券已使用\n        MQ->>Account: Confirm: 确认扣款\n        Account->>DB:
    扣减余额\n    end\n    Order-->>User: 返回成功\n\n详细实现方案：\n\n- TCC 三个阶段的设计：\n\nTry 阶段（同步调用，超时时间
    50ms）：\n\n// 库存服务 Try\n@Transactional\npublic boolean tryDeductStock(String userId,
    String productId, int count) {\n    // 1. 检查库存是否充足\n    int available = getAvailableStock(productId);\n
    \   if (available < count) {\n        return false;\n    }\n    \n    // 2. 检查用户是否已抢购（防重）\n
    \   String lockKey = \"seckill:\" + userId + \":\" + productId;\n    if (redisTemplate.opsForValue().setIfAbsent(lockKey,
    \"1\", 10, TimeUnit.MINUTES)) {\n        // 3. 冻结库存（原子操作）\n        boolean frozen
    = freezeStock(productId, count, userId);\n        if (!frozen) {\n            redisTemplate.delete(lockKey);\n
    \           return false;\n        }\n        return true;\n    }\n    return
    false;\n}\n\n// 优惠券服务 Try\n@Transactional\npublic boolean tryUseCoupon(String
    userId, String couponId) {\n    // 1. 检查优惠券是否有效\n    Coupon coupon = getCoupon(couponId);\n
    \   if (coupon == null || coupon.getStatus() != CouponStatus.AVAILABLE) {\n        return
    false;\n    }\n    \n    // 2. 检查优惠券是否属于该用户\n    if (!coupon.getUserId().equals(userId))
    {\n        return false;\n    }\n    \n    // 3. 冻结优惠券（状态转为 USING）\n    return
    freezeCoupon(couponId, userId);\n}\n\n// 账户服务 Try\n@Transactional\npublic boolean
    tryDeductBalance(String userId, BigDecimal amount) {\n    // 1. 检查余额是否充足\n    BigDecimal
    balance = getBalance(userId);\n    if (balance.compareTo(amount) < 0) {\n        return
    false;\n    }\n    \n    // 2. 冻结余额\n    return freezeBalance(userId, amount);\n}\n\nConfirm
    阶段（异步 MQ 消费）：\n\n// 库存服务 Confirm\n@Transactional\npublic boolean confirmDeductStock(String
    userId, String productId, int count) {\n    // 1. 删除冻结记录\n    deleteFreezeRecord(userId,
    productId);\n    \n    // 2. 实际扣减库存\n    deductStock(productId, count);\n    \n
    \   // 3. 记录操作日志\n    logOperation(userId, productId, \"DEDUCT\", count);\n    \n
    \   return true;\n}\n\n// 优惠券服务 Confirm\n@Transactional\npublic boolean confirmUseCoupon(String
    userId, String couponId) {\n    // 1. 更新优惠券状态为 USED\n    updateCouponStatus(couponId,
    CouponStatus.USED);\n    \n    // 2. 记录使用时间\n    updateUsedTime(couponId, new
    Date());\n    \n    return true;\n}\n\n// 账户服务 Confirm\n@Transactional\npublic
    boolean confirmDeductBalance(String userId, BigDecimal amount) {\n    // 1. 删除冻结记录\n
    \   deleteFreezeBalance(userId, amount);\n    \n    // 2. 实际扣减余额\n    deductBalance(userId,
    amount);\n    \n    // 3. 记录交易流水\n    recordTransaction(userId, amount, \"SECKILL_PAYMENT\");\n
    \   \n    return true;\n}\n\nCancel 阶段（异常时调用）：\n\n// 库存服务 Cancel\n@Transactional\npublic
    boolean cancelDeductStock(String userId, String productId, int count) {\n    //
    1. 删除冻结记录\n    deleteFreezeRecord(userId, productId);\n    \n    // 2. 释放 Redis
    锁\n    String lockKey = \"seckill:\" + userId + \":\" + productId;\n    redisTemplate.delete(lockKey);\n
    \   \n    return true;\n}\n\n// 优惠券服务 Cancel\n@Transactional\npublic boolean cancelUseCoupon(String
    userId, String couponId) {\n    // 1. 恢复优惠券状态为 AVAILABLE\n    updateCouponStatus(couponId,
    CouponStatus.AVAILABLE);\n    \n    return true;\n}\n\n// 账户服务 Cancel\n@Transactional\npublic
    boolean cancelDeductBalance(String userId, BigDecimal amount) {\n    // 1. 删除冻结记录\n
    \   deleteFreezeBalance(userId, amount);\n    \n    return true;\n}\n\n- 可靠性保障机制：\n\n本地消息表：\n\n-
    订单服务在本地事务中同时写入订单和消息记录\n\n- 消息记录包含：消息 ID、目标服务、消息内容、状态（待发送/已发送/已确认）\n\n- 定时任务扫描\"待发送\"状态的消息，重新发送\n\n-
    消息消费成功后，更新状态为\"已确认\"\n\n幂等性设计：\n\n- 所有 Confirm/Cancel 操作都要做幂等检查\n\n- 使用订单号作为幂等键\n\n-
    在数据库中记录每个订单的操作状态\n\n超时和重试：\n\n- Try 阶段设置 50ms 超时\n\n- Confirm 阶段如果失败，MQ 自动重试 3
    次\n\n- 超过重试次数，转入死信队列，人工处理\n\n补偿任务：\n\n- 每 5 分钟扫描 Try 成功但 Confirm 超过 10 分钟未完成的订单\n\n-
    重新发送 Confirm 消息\n\n- 如果 Confirm 一直失败，自动触发 Cancel\n\n- 性能优化：\n\nRedis 缓存：\n\n-
    库存信息预热到 Redis\n\n- Try 阶段先查 Redis 缓存，缓存未命中再查数据库\n\n- 使用 Lua 脚本保证原子性\n\n数据库优化：\n\n-
    库存表按商品 ID 分库分表\n\n- 使用乐观锁更新库存：UPDATE stock SET count = count - ? WHERE product_id
    = ? AND count >= ?\n\n- 优惠券表按用户 ID 分库分表\n\n异步处理：\n\n- Confirm 阶段异步处理，不阻塞主流程\n\n-
    用户下单后立即返回成功，后台异步完成确认\n\n降级策略：\n\n- 如果优惠券服务不可用，自动降级为\"不使用优惠券\"\n\n- 如果账户服务不可用，降级为\"货到付款\"\n\n-
    核心是保证订单创建成功，后续可以人工处理\n\n- 监控和告警：\n\n实时监控：\n\n- Try 阶段的成功率和响应时间\n\n- Confirm 消息的堆积量\n\n-
    补偿任务的执行情况\n\n- 库存、优惠券、余额的冻结数量\n\n告警规则：\n\n- Try 成功率低于 99% 时告警\n\n- Confirm 消息堆积超过
    1000 条时告警\n\n- 补偿任务失败率超过 1% 时告警\n\n- 冻结资源超过 10 分钟未释放时告警\n\n我在上一个项目中就是这么实现的，支撑了双
    11 秒杀活动，峰值 QPS 达到 15 万，订单成功率 99.9%，没有出现超卖或少扣的情况。整个方案的响应时间控制在 80ms 以内，用户体验很好。\n\n3️⃣
    Key Differences"

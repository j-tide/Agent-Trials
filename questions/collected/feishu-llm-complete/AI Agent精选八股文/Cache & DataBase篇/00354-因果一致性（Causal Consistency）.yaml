answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐~⭐⭐⭐⭐（ClientSession、afterClusterTime、线性一致性）\n\n基础题：什么是因果一致性？为什么副本集读写会有一致性问题？\n\n因果一致性：保证有因果关系的操作按顺序执行，如果操作
    A 影响 B，则任何看到 B 的节点必须先看到 A。\n\n副本集一致性问题：主节点写入后立即从从节点读取，可能读不到刚写入的数据（复制延迟导致）。\n\n进阶题：ClientSession
    + afterClusterTime 如何实现因果一致性？与线性一致性有什么区别？\n\n1️⃣ Common Answer\n\nClientSession
    就是会话，afterClusterTime 是时间戳吧。线性一致性更强？\n\n2️⃣ Impressive Answer\n\n因果一致性是 MongoDB
    副本集的重要一致性保证，实现机制包括：\n\n- ClientSession（客户端会话）\n\n- afterClusterTime（集群时间）\n\n-
    因果一致性实现\n\n- 与线性一致性的区别\n\n- Agent 场景应用\n\n3️⃣ Key Differences\n\n场景题：Agent 写入会话后立即读取，如何保证读到最新数据？\n\n1️⃣
    Common Answer\n\n用 w:majority 写入，然后从主节点读。具体实现不太清楚。\n\n2️⃣ Impressive Answer\n\nAgent
    写入会话后立即读取的一致性保证方案：\n\n- 方案一：强一致配置\n\n- 方案二：因果一致性（推荐）\n\n```text\n```\n    \n*
    \  **优势**：性能好，保证因果顺序\n```\n\n- 方案三：读后写缓存\n\n- Agent 场景最佳实践\n\n---"

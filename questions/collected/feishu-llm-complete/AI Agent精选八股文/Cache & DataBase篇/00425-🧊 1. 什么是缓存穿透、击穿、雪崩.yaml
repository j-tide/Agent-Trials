content:
  prompt: "\U0001F9CA 1. 什么是缓存穿透、击穿、雪崩？"
answer:
  mode: rubric
  reference_answer: |-
    这三个词描述了缓存层在不同“受力面”上被击溃的过程。可以把 Redis 想象成一座大坝，数据请求就是洪水，而它们分别对应着大坝的 “渗漏”、“管涌”和“溃堤”。

    [图片内容未导入]

    缓存穿透
    现象：客户端疯狂查询一个数据库和缓存中都不存在的 key（如 product_-1）。由于缓存里永远没有，所有请求直接穿透到数据库，把数据库瞬间压垮。这往往是由恶意攻击或代码逻辑错误引起的。

    - 本质：查的是“不存在”的数据，缓存形同虚设。

    缓存击穿

    现象：某个热点 key（如秒杀商品、爆款新闻），在它缓存过期的瞬间，恰巧有海量并发请求同时涌入。因为缓存失效，这些请求全部打到数据库上，像一把锥子击穿了缓存层。

    - 本质：热点数据在失效的瞬间，发生了并发穿透。

    缓存雪崩

    现象：大量不同的 key 在同一时间窗口内集中过期，或者 Redis 集群自身宕机。导致接下来所有的请求都直接落到了数据库上，引发连锁式的服务崩溃。

    - 本质：缓存层整体失效，失去了对数据库的保护能力。


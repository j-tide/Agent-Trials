content:
  prompt: 3、进阶题：Redis 主从复制的全量同步和增量同步机制是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（runid、offset、repl\_backlog、PSYNC、全量RDB传输、增量命令传播）

    1️⃣ Common Answer

    Redis 主从复制就是从节点连接主节点，主节点把数据发给从节点。全量同步就是主节点生成 RDB 文件发给从节点，增量同步就是主节点把写命令发给从节点。如果从节点断开重连，会根据 offset 继续同步。

    2️⃣ Impressive Answer

    Redis 主从复制通过PSYNC 命令实现，核心机制包括 runid、offset、repl\_backlog 三个关键要素：

    - 全量同步（首次连接或复制偏移量过大）

    - 增量同步（短时间断开重连）

    - 命令传播（持续同步）

    - Agent 场景应用


  reference_answer: |-
    ```text
    Agent Redis 数据分层

    ├── 会话短期记忆 (有 TTL, 可丢)
    │   └── 策略: volatile-lru 或 allkeys-lru
    │         └── 只淘汰闲置会话，活跃会话不受影响
    │
    ├── 长期记忆/用户画像 (不可丢)
    │   └── 策略: noeviction + 独立实例
    │         ├── 容量监控 + 告警自动扩容
    │         └── 冷数据归档，控制热数据体量
    │
    └── 向量索引 (体积大, 不可丢)
        └── 策略: noeviction + 分片 + 副本
              └── 写满前扩容，查询走副本保可用
    ```


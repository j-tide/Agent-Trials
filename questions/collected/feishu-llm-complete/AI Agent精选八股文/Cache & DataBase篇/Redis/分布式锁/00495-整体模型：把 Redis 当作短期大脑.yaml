content:
  prompt: 整体模型：把 Redis 当作“短期大脑”
answer:
  mode: rubric
  reference_answer: |-
    多轮对话里，Agent 需要记住上下文、槽位、本轮意图甚至历史消息，但这些信息都是临时的，不需要持久化到 DB。Redis 天然适合做这个“会话级缓存”，读写都在内存，延迟低，又有 TTL，省得自己写清理逻辑。

    我习惯把一次会话的状态抽象成一个 Session Object，用 Redis 的 Hash 或 String(JSON) 存，看团队偏好。


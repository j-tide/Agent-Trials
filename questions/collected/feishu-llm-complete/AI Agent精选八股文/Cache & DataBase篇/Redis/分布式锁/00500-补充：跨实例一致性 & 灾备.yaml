answer:
  mode: rubric
  reference_answer: "因为 Redis 是单机主从，通常够用。但如果对可用性要求极高，我会：\n\n- 选用 Redis Sentinel /
    Cluster 做故障转移。\n\n- 会话数据不做持久化（RDB/AOF），丢了就丢了，用户重新开始对话就好，保证体验不卡就行。\n\n- 对内存敏感的系统，还会加一个最大会话数限制（每人最多
    5 个活跃会话），老会话主动删除。\n\n---\n\n整体来说，核心思路就是：\n\n\U0001F539 用 Key 隔离用户+会话（硬隔离）\n\n\U0001F539
    Hash 存状态，按需读写\n\n\U0001F539 TTL 设业务空闲时间（如 30 min）\n\n\U0001F539 门槛续期 + Lua 脚本保原子性\n\n\U0001F539
    辅助 Sorted Set 支持列表查询\n\n这基本就是我在之前项目里滚过一遍后的做法，不一定最完美，但应对日均百万级对话绰绰有余，而且维护成本很低。"

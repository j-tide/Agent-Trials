  prompt: 1、基础题：Redis 6.0 引入多线程解决了什么问题？哪些操作是多线程的？
answer:
  mode: rubric
  reference_answer: |-
    难度：⭐⭐（网络IO瓶颈、多线程IO、命令执行仍单线程） 直接给答案：

    - 解决的问题：Redis单线程在高并发下，网络IO（读取请求、发送响应）成为瓶颈，CPU利用率低

    - 多线程的操作：网络数据读取（read）、请求解析、响应数据写入（write）

    - 仍是单线程的：命令执行（保证原子性和数据一致性）

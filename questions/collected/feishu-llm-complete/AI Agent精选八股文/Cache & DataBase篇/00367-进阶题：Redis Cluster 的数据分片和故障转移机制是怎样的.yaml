  prompt: 2、进阶题：Redis Cluster 的数据分片和故障转移机制是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（16384槽位、一致性哈希、Gossip协议、故障检测、脑裂问题）

    1️⃣ Common Answer

    Redis Cluster 是分片架构，将数据通过哈希分散到多个节点。每个节点负责一部分数据，节点间通过 Gossip 协议通信。当主节点故障时，从节点会自动升为主节点，保证高可用。客户端连接任意节点，如果数据不在该节点，会收到重定向指令。

    2️⃣ Impressive Answer

    Redis Cluster 通过槽位机制实现数据分片和故障转移，核心机制包括：

    - 数据分片机制

    - 故障检测与转移

    - 脑裂防护

    - Agent 场景应用


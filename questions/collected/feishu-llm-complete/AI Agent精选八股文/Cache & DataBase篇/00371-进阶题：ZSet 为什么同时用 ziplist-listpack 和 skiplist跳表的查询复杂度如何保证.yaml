  prompt: 2、进阶题：ZSet 为什么同时用 ziplist/listpack 和 skiplist？跳表的查询复杂度如何保证？
answer:
  mode: rubric
  reference_answer: |-
    难度：⭐⭐⭐⭐（ziplist省内存、skiplist支持范围查询、hashtable O(1)查分、跳表层级概率）

    1️⃣ Common Answer ZSet用跳表是因为跳表支持范围查询，比红黑树实现简单

    2️⃣ Impressive Answer

    - ZSet双结构设计原因：

    - 小数据量用listpack（ziplist）：元素少时，listpack连续内存布局，CPU缓存友好，内存占用远小于skiplist

    - 跳表复杂度保证：

    - 跳表 vs 红黑树：跳表实现简单、支持范围查询（红黑树需要中序遍历）、并发友好（锁粒度更细）

    - Agent场景：模型调用排行榜用ZSet，ZADD O(logN)更新分数，ZREVRANGE O(logN+M)获取Top N


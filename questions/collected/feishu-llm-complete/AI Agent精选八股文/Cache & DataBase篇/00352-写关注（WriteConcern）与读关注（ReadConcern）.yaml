answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐~⭐⭐⭐⭐（w:1/w:majority、local/majority/linearizable/snapshot）

    基础题：WriteConcern w:1 和 w:majority 有什么区别？

    w:1：写入主节点成功即返回，性能好但可能丢数据（主节点崩溃未复制到从节点） w:majority：写入大多数节点成功才返回，性能差但数据安全（至少一个从节点写入成功）

    进阶题：ReadConcern 的 local/majority/linearizable/snapshot 四种级别分别是什么含义？与隔离性有什么关系？

    1️⃣ Common Answer

    ReadConcern 就是读一致性级别，local 读本地，majority 读大多数节点。具体细节记不清了。

    2️⃣ Impressive Answer

    ReadConcern 定义了读操作的隔离级别，与数据库事务隔离性类似：

    - local（默认）

    - majority

    - linearizable

    - snapshot

    - Agent 场景应用

    3️⃣ Key Differences

    场景题：Agent 计费数据如何配置强一致读写？会话数据如何配置？

    1️⃣ Common Answer

    计费数据用 w:majority 吧，会话数据用 w:1。具体配置不太清楚。

    2️⃣ Impressive Answer

    Agent 不同业务场景的一致性配置策略：

    - 计费数据（强一致）

    - 会话数据（最终一致）

    - 用户余额（线性一致）

    - 配置示例（Spring Boot） `yamlspring:data:mongodb:uri: mongodb://localhost:27017/agent_dbwrite-concern: MAJORITYread-concern: MAJORITYread-preference: PRIMARY `

    - 性能对比

    3️⃣ Key Differences


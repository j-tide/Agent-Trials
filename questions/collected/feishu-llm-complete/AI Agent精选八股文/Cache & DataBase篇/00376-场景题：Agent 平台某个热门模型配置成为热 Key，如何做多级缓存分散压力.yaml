content:
  prompt: 3、场景题：Agent 平台某个热门模型配置成为热 Key，如何做多级缓存分散压力？
answer:
  mode: rubric
  reference_answer: |-
    难度：⭐⭐⭐（多级缓存架构、本地缓存+Redis、缓存一致性）

    1️⃣ Common Answer 在本地加一层缓存，减少Redis访问次数

    2️⃣ Impressive Answer

    - 多级缓存架构：

    - 读取流程：L1命中→直接返回；L1未命中→查L2→回填L1；L2未命中→查L3→回填L2和L1

    - 缓存一致性：

    - 热Key分片：Redis层将模型配置复制为10个副本（model:config:gpt4:{0-9}），读取时按请求ID取模路由

    - 降级保护：Redis不可用时，本地缓存兜底；本地缓存也过期时，直接读MySQL并延长本地缓存TTL

    - 监控：统计各级缓存命中率，L1命中率<90%时告警，说明热Key访问模式异常


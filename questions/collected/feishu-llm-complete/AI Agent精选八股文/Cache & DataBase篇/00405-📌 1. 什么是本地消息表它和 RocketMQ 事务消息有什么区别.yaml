content:
  prompt: "\U0001F4CC 1. 什么是本地消息表？它和 RocketMQ 事务消息有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    本地消息表 是一种分布式事务的最终一致性方案。它的核心思想很简单：把要发送的消息先持久化到业务数据库的一张“消息表”里，和业务数据在同一个本地事务中落库。然后再用一个后台任务轮询这张表，把未发送的消息投递到消息队列。 这样，消息就“沾”上了业务数据的 ACID 特性，不会凭空消失。

    [图片内容未导入]

    RocketMQ 事务消息 则是 RocketMQ 自带的分布式事务能力，它通过“半消息 + 本地事务 + 回查”的机制，把本地事务和消息发送绑定在一起，无需开发者自己维护消息表。

    两者的区别一目了然：

    [嵌入表格未展开]

    一句话总结： 本地消息表是自食其力的“手工作坊”，RocketMQ 事务消息是现代化的“自动化流水线”。如果你已经用了 RocketMQ，首选事务消息；如果 MQ 不支持事务消息，或者你想完全掌控流程、不想依赖特定中间件，本地消息表依然是一个可靠的后备方案。


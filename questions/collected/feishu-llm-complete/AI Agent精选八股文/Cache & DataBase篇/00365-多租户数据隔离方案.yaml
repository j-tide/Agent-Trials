    难度级别：⭐⭐~⭐⭐⭐⭐（独立数据库、共享集合+tenantId、分片键隔离）

    基础题：多租户数据隔离有哪几种方式？

    多租户数据隔离三种方式：

    - 独立数据库：每个租户一个数据库，隔离性最好

    - 共享集合+tenantId：所有租户共享集合，通过 tenantId 字段隔离

    - 分片键隔离：使用 tenantId 作为分片键，数据分散到不同分片

    进阶题：独立数据库 vs 共享集合+tenantId vs 分片键隔离，各自的安全性、成本、查询性能如何对比？

    1️⃣ Common Answer

    独立数据库最安全，共享集合最便宜。分片键隔离应该是中间方案吧。

    2️⃣ Impressive Answer

    多租户数据隔离方案是SaaS 架构的核心决策，多维度对比：

    - 安全性对比

    - 成本对比

    - 查询性能对比

    - Agent 场景应用

    场景题：SaaS 型 Agent 平台的多租户 MongoDB 架构如何设计？

    1️⃣ Common Answer

    用共享集合+tenantId 吧，成本低。具体设计不太清楚。

    2️⃣ Impressive Answer

    SaaS 型 Agent 平台多租户 MongoDB 架构的设计方案：


content:
  prompt: "\U0001F9E9 1. 常见的缓存一致性策略有哪些？"
answer:
  mode: rubric
  reference_answer: |-
    缓存一致性策略决定了当数据发生变化时，如何同步缓存和数据库。根据写入路径的不同，业界沉淀出五种经典模式，各有其适用疆域。

    [图片内容未导入]

    ① Cache-Aside (旁路缓存)

    最常用的模式。应用层直接控制缓存，数据库与缓存之间没有直接联系。

    - 读流程：先查缓存，命中直接返回；未命中则查数据库，并将结果写入缓存后再返回。

    - 写流程：先更新数据库，成功后再删除（或更新）缓存。

    - 一致性：需依赖删除缓存的操作，存在短暂的不一致窗口。可通过延迟双删等手段缓解。

    - 适合：读多写少，对一致性要求非强实时，需要灵活控制缓存内容。这是 Agent 会话缓存最常见的模式。

    ② Read-Through / Write-Through (穿透读/写)

    缓存层作为一个代理，应用层只与缓存交互，缓存负责与数据库同步。

    - Read-Through：读请求只经过缓存。缓存 miss 时，缓存自身去查库并写回，然后返回给应用。应用逻辑简单。

    - Write-Through：写请求先写缓存，缓存再同步写数据库。应用逻辑依然简单，且缓存数据总是最新。

    - 一致性：较好，缓存数据几乎实时与数据库保持一致。

    - 适合：需要简化应用数据访问层，对一致性要求较高的场景。但实现复杂度较高（需扩展缓存驱动或引入中间件）。

    ③ Write-Behind (Write-Back, 回写)

    应用先写缓存，缓存快速返回，然后异步批量将数据写入数据库。

    - 一致性：极低，极端情况下可能丢失未刷入数据库的缓存数据。

    - 优势：写入延迟极低，吞吐量极大，适合写密集、可容忍少量数据丢失的场景（如日志、计数器、用户行为记录）。

    ④ Refresh-Ahead (预刷新)

    预测性缓存。在热点数据过期前，提前异步刷新缓存，避免缓存击穿。

    - 适合：访问频率极高、过期时间可以预测的热点数据（如热门新闻、爆款商品）。

    一致性-性能光谱：

    强一致性 ←──────────────────────────→ 高性能/最终一致
    Write-Through  Cache-Aside  Write-Behind

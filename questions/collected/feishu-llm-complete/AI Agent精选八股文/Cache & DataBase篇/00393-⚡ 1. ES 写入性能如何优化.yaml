content:
  prompt: "⚡ 1. ES 写入性能如何优化？"
answer:
  mode: rubric
  reference_answer: |-
    写入优化的总体思路是：减少磁盘 I/O、降低刷新频率、充分利用内存缓冲、批量操作。

    写入流程全景图

    ```text
    客户端请求
      │
      ▼
    ┌──────────┐   ┌──────────────┐   ┌──────────────┐
    │ Node     │→  │ 写入内存缓冲  │→  │ 写入事务日志  │
    │ (协调节点)│   │ (indexing    │   │ (Translog)   │
    └──────────┘   │  buffer)     │   └──────┬───────┘
                   └──────┬───────┘          │
                          │ 1秒 refresh       │ fsync (5秒或每请求)
                          ▼                  │
                   ┌──────────────┐          │
                   │ Segment      │          │
                   │ (可搜索)      │          │
                   └──────┬───────┘          │
                          │ 合并 (merge)      │
                          ▼                  ▼
                   ┌──────────────┐   ┌──────────────┐
                   │ 磁盘上的段    │   │ 磁盘上的 translog│
                   └──────────────┘   └──────────────┘
    ```

    ① 批量操作替代逐条写入
    每次单条请求都有网络往返和刷新开销。使用 _bulk API 批量提交，设置合理的批次大小（如 500-1000 条）。ES 会自动将这些文档批量索引。

    ```python
    from elasticsearch import Elasticsearch, helpers
    es = Elasticsearch()

    actions = [
        {"_index": "logs", "_source": {"message": "log1", "timestamp": "2026-07-05T10:00:00Z"}},
        {"_index": "logs", "_source": {"message": "log2", "timestamp": "2026-07-05T10:00:01Z"}},
        # ...更多
    ]
    # 使用 helpers.bulk 自动分批
    helpers.bulk(es, actions, chunk_size=500)
    ```

    ② 调整刷新间隔（Refresh Interval）
    ES 默认每 1 秒刷新一次，将内存中的文档写入新的 Segment，使其可被搜索。如果不需要近实时搜索（如日志批量导入），可将 refresh_interval 调大或设为 -1（禁用自动刷新），导入完成后再恢复。这能极大减少 Segment 生成频率，降低 I/O。

    ```javascript
    PUT /logs/_settings
    {
      "index": {
        "refresh_interval": "30s"   // 从默认1秒改为30秒
      }
    }
    ```

    ③ 增加写入缓冲 (Indexing Buffer)
    indices.memory.index_buffer_size 控制用于缓存新文档的内存大小。默认是 JVM 堆内存的 10%，最大不超过 512MB。如果批量写入量大，可适当调大（例如 20%），让更多文档在内存中积累后再写入 Segment，减少 Segment 碎片。注意不要超过 512MB 上限。

    ```yaml
    # elasticsearch.yml
    indices.memory.index_buffer_size: 20%   // 或 256mb
    ```

    ④ 使用性能更好的硬件和段合并策略

    - SSD 对于 Segments 的随机读写至关重要。

    - 段合并：index.merge.policy.max_merged_segment=5gb 可降低合并频率，减少 I/O 抖动。较大的段也能提升搜索性能。

    - 事务日志：将 index.translog.durability 设为 async，可降低每次写入的 fsync 开销（有丢失部分数据的风险，需权衡）。

    ⑤ 禁用 _all 字段和不需要的动态映射
    _all 字段在 ES 6.0+ 已废弃，但在早期版本中它会把所有字段拼接在一起建立倒排索引，写入开销很大。动态映射可以用 "dynamic": false 关闭，避免写入时因字段类型推断而产生额外开销。

    收束：写入优化的本质是把离散的小 IO 聚合成连续的大 IO，并让内存作为主战场，磁盘只在必要时介入。调参的顺序是：先批量化，再降刷新，最后调内存和合并策略。


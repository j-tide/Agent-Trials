content:
  prompt: "\U0001F504 1. MongoDB 的事务支持（4.0+）是怎样的？和 MySQL 事务有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    从 4.0 版本开始，MongoDB 正式支持多文档 ACID 事务，打破了“NoSQL 无事务”的刻板印象。但它的实现方式和 MySQL 有显著不同，这些差异会直接影响你在 Agent 系统中如何设计数据一致性方案。

    MongoDB 事务的核心特征：

    [图片内容未导入]

    代码示例：一个简单的转账事务

    ```javascript
    const session = client.startSession();

    try {
        session.startTransaction({
            readConcern: { level: "snapshot" },
            writeConcern: { w: "majority" }
        });

        const accounts = session.getDatabase("bank").collection("accounts");

        // 扣减 A 账户
        const resultA = await accounts.updateOne(
            { _id: "A", balance: { $gte: 100 } },
            { $inc: { balance: -100 } },
            { session }
        );

        if (resultA.modifiedCount === 0) {
            throw new Error("A 账户余额不足");
        }

        // 增加 B 账户
        await accounts.updateOne(
            { _id: "B" },
            { $inc: { balance: 100 } },
            { session }
        );

        await session.commitTransaction();
        console.log("转账成功");
    } catch (error) {
        await session.abortTransaction();
        console.log("转账失败，已回滚:", error.message);
    } finally {
        session.endSession();
    }
    ```


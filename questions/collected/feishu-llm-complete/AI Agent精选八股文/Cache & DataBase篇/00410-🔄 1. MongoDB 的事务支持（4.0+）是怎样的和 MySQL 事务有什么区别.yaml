    选型建议：

    - MongoDB 事务适合低频但需要跨多文档原子性的场景，比如年终奖结算、复杂的库存转移。

    - 如果是对事务性能要求极高的 OLTP 系统（如高频订单），建议仍用 MySQL。

    - 在 AI Agent 场景中，事务常用于保证任务状态与执行记录的一致性，比如同时更新任务状态和写入操作日志。


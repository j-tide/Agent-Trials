content:
  prompt: "\U0001F4CC 1. 什么是 RocketMQ 事务消息？它解决了什么问题？"
answer:
  mode: rubric
  reference_answer: |-
    事务消息是 RocketMQ 提供的一种分布式事务解决方案。它让“发送消息”这个动作与本地数据库操作在逻辑上绑定为一个整体——要么消息发成功且数据库操作提交，要么数据库回滚、消息也不可见。

    ```text
    传统消息队列困境：
      1. 先操作数据库，再发送消息
          → 数据库提交后，发送消息失败 → 数据不一致
      2. 先发送消息，再操作数据库
          → 消息发出去了，但数据库操作失败 → 下游消费了不该存在的数据

    事务消息：
      半消息先发送 → 执行本地事务 → 根据本地事务结果决定消息是提交还是回滚
    ```

    它解决的核心问题是分布式系统下，本地事务和消息发送的原子性。比如下单后需要通知库存系统扣减库存，必须保证“订单创建成功”与“库存扣减消息被可靠投递”这两个动作要么都成功，要么都失败，而不会出现一个成功另一个失败的不一致状态。


  reference_answer: |-
    难度级别：⭐⭐⭐⭐（热点Key识别、本地缓存兜底、Key打散、读写分离、限流）

    1️⃣ Common Answer

    热点Key就是访问量特别大的Key，会打满Redis。可以用本地缓存缓存热点Key，或者把Key打散到多个节点。

    2️⃣ Impressive Answer

    热点Key是分布式缓存的性能杀手，会导致单个节点CPU打满，影响整个集群：

    - 热点Key的危害

    - 识别方案

    - 解决方案矩阵

    - Agent场景实践 公共知识库文档（如"如何使用Agent"）被所有用户共享，访问量巨大。识别到热点文档后，使用本地缓存兜底（Caffeine缓存1分钟），同时将文档Key打散到10个Redis节点。读时并发查10个Key，取第一个返回，将Redis请求分散到多个节点，避免单点压力。


content:
  prompt: "\U0001F4AC 3. Agent 会话消息如何用 Bucket Pattern 分桶存储？设计方案是什么？"
answer:
  mode: rubric
  reference_answer: "Agent 的会话消息是典型的“海量、持续增长、写多读少”场景。一个用户和 Agent 聊一天可能产生数百条消息，全部内嵌在会话文档里，文档会迅速膨胀到几
    MB，导致读写性能恶化。如果每条消息存一个独立文档，查询某次会话的全量历史又需要扫描无数小文档，效率极低。\n\nBucket Pattern 正是为此而生。\n\n核心思路：将会话消息按会话
    ID + 时间窗口分桶存储，每个桶是一个独立的文档，内部用数组存放具体的消息。\n\n```text\n用户 Session: sess_abc\n═════════════════════════════════════════\n\nBucket
    1: 2026-07-05 10:00 ~ 10:59\n┌─────────────────────────────────────┐\n│  {                                  │\n│
    \   _id: \"sess_abc_20260705_10\",     │\n│    session_id: \"sess_abc\",          │\n│
    \   bucket_start: ISODate(\"...10:00\"),│\n│    bucket_end: ISODate(\"...10:59\"),
    │\n│    message_count: 35,               │\n│    messages: [                      │\n│
    \     { ts: \"...\", role: \"user\", content: \"...\" },│\n│      { ts: \"...\",
    role: \"assistant\", content: \"...\" },│\n│      ...                            │\n│
    \   ]                                │\n│  }                                  │\n└─────────────────────────────────────┘\n\nBucket
    2: 2026-07-05 11:00 ~ 11:59\n┌─────────────────────────────────────┐\n│  ...类似结构...
    \                    │\n└─────────────────────────────────────┘\n```\n\n方案设计细节：\n\n①
    分桶的粒度选择\n\n- 按小时：适合消息频率中等的场景，每小时几十到几百条消息，每个桶 50KB~200KB 左右，大小适中。\n\n- 按天：适合低频交互，比如每天十几条消息。\n\n-
    按消息数：固定每个桶最多存 200 条消息，满了就建新桶。适合消息密度不可预测的场景。\n\n- 建议优先按小时，因为时间窗口固定，查询历史时按时间段定位桶非常自然。\n\n②
    文档结构设计（含索引）\n\n```javascript\n// 创建索引：支持高效查询某个会话的某个时间窗口内的桶\ndb.session_buckets.createIndex(\n
    \   { session_id: 1, bucket_start: 1 },\n    { unique: true }\n);\n// unique 保证同一个会话同一个时间窗口不会有重复的桶\n```\n\n③
    写入逻辑：使用原子操作 $push 和 $inc\n\n```javascript\nasync function addMessage(sessionId,
    message) {\n    const now = new Date();\n    // 计算当前小时对应的 bucket_start\n    const
    bucketStart = new Date(Date.UTC(\n        now.getUTCFullYear(), now.getUTCMonth(),
    now.getUTCDate(), now.getUTCHours()\n    ));\n    \n    const result = await db.session_buckets.findOneAndUpdate(\n
    \       {\n            session_id: sessionId,\n            bucket_start: bucketStart\n
    \       },\n        {\n            $push: { messages: message },\n            $inc:
    { message_count: 1 },\n            $setOnInsert: {\n                bucket_end:
    new Date(bucketStart.getTime() + 3600000 - 1)\n            }\n        },\n        {\n
    \           upsert: true,\n            returnDocument: \"after\"\n        }\n
    \   );\n    return result;\n}\n```\n\n④ 读取逻辑：查询某次会话的完整历史\n\n```javascript\nasync
    function getSessionHistory(sessionId, limit = 100) {\n    // 按 bucket_start 降序取最近的桶，直到拿够
    limit 条消息\n    const buckets = await db.session_buckets.find(\n        { session_id:
    sessionId },\n        { messages: 1, bucket_start: 1 }\n    ).sort({ bucket_start:
    -1 }).limit(10).toArray();\n\n    // 从桶里提取消息，按时间排序\n    let messages = [];\n    for
    (const bucket of buckets) {\n        messages = bucket.messages.concat(messages);
    \ // 正序拼接\n    }\n    return messages.slice(-limit);  // 返回最近的 N 条\n}\n```\n\n⑤
    查询特定时间范围的消息（按时间段检索）\n\n```javascript\nasync function getMessagesInRange(sessionId,
    start, end) {\n    const buckets = await db.session_buckets.find(\n        {\n
    \           session_id: sessionId,\n            bucket_start: { $gte: start, $lte:
    end }\n        },\n        { messages: 1 }\n    ).sort({ bucket_start: 1 }).toArray();\n\n
    \   // 过滤桶内时间范围内的消息\n    const result = [];\n    for (const bucket of buckets)
    {\n        for (const msg of bucket.messages) {\n            if (msg.ts >= start
    && msg.ts <= end) {\n                result.push(msg);\n            }\n        }\n
    \   }\n    return result;\n}\n```\n\n⑥ 过期清理（TTL 策略）\n对于需要自动清理的会话数据，可以在 bucket_start
    上建 TTL 索引：\n\n```javascript\ndb.session_buckets.createIndex(\n    { bucket_start:
    1 },\n    { expireAfterSeconds: 2592000 }  // 30天后自动删除整个桶\n);\n```\n\nBucket Pattern
    带来的好处：\n\n- 写入性能好：每次写入只是一个原子 $push，不像内嵌文档那样需要频繁搬运整个大文档。\n\n- 查询效率高：拉取会话历史只需要读几个大文档，而不是几百个小文档。\n\n-
    存储节省：每个桶存多条消息，减少了文档头的开销（文档 ID、元数据等），整体存储成本更低。\n\n- 易于归档：按时间窗口分桶天然适合冷热分离和按时间清理。\n\n一个常见的担忧：消息丢失或重复。\n上述
    $push 操作是原子的，但对于网络超时等情况，需要在应用层做幂等处理。可以在消息结构中加一个唯一的 message_id，然后使用 $addToSet 代替
    $push 来确保同一 message_id 只被写入一次。\n\n```javascript\nawait db.session_buckets.updateOne(\n
    \   { session_id: sessionId, bucket_start: bucketStart },\n    { $addToSet: {
    messages: message }, $setOnInsert: { ... } },\n    { upsert: true }\n);\n```\n\n通过这种设计，Agent
    的会话存储系统既能扛住海量消息的写入，又能快速响应用户“往上翻聊天记录”的需求，在性能和空间之间找到了最佳的平衡点。\n\n---"

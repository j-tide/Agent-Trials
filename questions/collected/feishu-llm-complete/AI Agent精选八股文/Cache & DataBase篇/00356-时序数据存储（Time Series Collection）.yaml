answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐~⭐⭐⭐⭐（列式压缩、granularity、性能对比）\n\n基础题：MongoDB 5.0+ 的 Time
    Series Collection 是什么？和普通集合有什么区别？\n\nTime Series Collection：MongoDB 5.0+ 引入的时序数据集合，专门优化时序数据存储和查询。\n\n与普通集合的区别：\n\n-
    自动按时间分桶存储\n\n- 内部列式压缩，节省存储空间\n\n- 自动优化时序查询性能\n\n- 支持时间范围聚合查询\n\n进阶题：时序集合的内部存储优化（列式压缩）是怎样的？granularity
    如何配置？与普通集合的性能对比如何？\n\n1️⃣ Common Answer\n\n时序集合就是自动分桶吧，granularity 是时间粒度。性能应该比普通集合好。\n\n2️⃣
    Impressive Answer\n\nTime Series Collection 是 MongoDB 时序数据的专用存储引擎，优化机制包括：\n\n-
    内部存储优化\n\n- granularity 配置\n\n- 性能对比\n\n- Agent 场景应用\n\n场景题：Agent 调用链路的指标数据如何用时序集合存储？\n\n1️⃣
    Common Answer\n\n创建时序集合，然后写入指标数据。具体设计不太清楚。\n\n2️⃣ Impressive Answer\n\nAgent 调用链路指标数据用时序集合存储的设计方案：\n\n-
    集合创建 `javascriptdb.createCollection(\"agent_metrics\", {timeseries: {timeField:
    \"timestamp\",metaField: \"metadata\",granularity: \"seconds\"}})\n\n```text\n```\n```\n\n-
    文档结构设计 `json{\"timestamp\": ISODate(\"2024-01-15T10:00:00Z\"),\"metadata\": {\"agentId\":
    \"agent123\",\"sessionId\": \"session456\",\"userId\": \"user789\"},\"metrics\":
    {\"latency\": 123,\"tokenCount\": 456,\"requestCount\": 1,\"errorCount\": 0}}\n\n```text\n```\n```\n\n-
    索引设计\n\n- `javascriptdb.agent_metrics.createIndex({\"metadata.agentId\": 1, \"metadata.sessionId\":
    1})\n\n- `\n\n- 查询优化\n\n```text\n```\n    \n*   **聚合查询**：\n    \n    ```javascript\n
    \   db.agent_metrics.aggregate([\n      {\n        $match: {\n          \"metadata.agentId\":
    \"agent123\",\n          \"timestamp\": {\n            $gte: ISODate(\"2024-01-15T00:00:00Z\"),\n
    \           $lte: ISODate(\"2024-01-15T23:59:59Z\")\n          }\n        }\n
    \     },\n      {\n        $group: {\n          _id: {\n            $dateToString:
    {format: \"%Y-%m-%d %H:%M\", date: \"$timestamp\"}\n          },\n          avgLatency:
    {$avg: \"$metrics.latency\"},\n          totalTokenCount: {$sum: \"$metrics.tokenCount\"}\n
    \       }\n      }\n    ])\n```\n\n```text\n```\n```\n\n- 优势总结\n\n---"

  prompt: 2、进阶题：在 Agent 知识库场景，如何设计冷热数据分离架构？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（热度判定、自动迁移、多层存储、查询路由）

    1️⃣ Common Answer

    热数据就是经常访问的，放 Redis 或 SSD；冷数据就是很少访问的，放机械硬盘或对象存储。可以定时把冷数据移走，查的时候先去热的地方找，没有再查冷的。具体怎么分要看业务。

    2️⃣ Impressive Answer

    冷热分离的核心是热度判定、迁移机制、查询路由三个环节：

    - 热度判定策略

    - 存储分层架构 ┌─────────────────────────────────────────┐│          查询网关（路由层）              │└─────────────────────────────────────────┘↓┌─────────────────────────────────────────┐│   热层：Redis + SSD(MySQL/ES)           ││   - 30 天内活跃会话                     ││   - 高频知识库文档                      │└─────────────────────────────────────────┘│   温层：HDD(MySQL) + 对象存储           ││   - 30-90 天数据                        ││   - 低频文档                            │└─────────────────────────────────────────┘│   冷层：对象存储 + 离线数仓             ││   - 90 天以上数据                       ││   - 归档日志                            │└─────────────────────────────────────────┘`

    - 自动迁移机制

    - Agent 场景实践


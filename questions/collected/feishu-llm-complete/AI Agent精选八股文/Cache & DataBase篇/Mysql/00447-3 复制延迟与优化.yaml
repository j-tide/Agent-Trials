    3、场景题：生产环境主从延迟持续 10 秒以上，影响业务，你如何快速定位和解决？

    ⭐⭐⭐（考察应急处理、快速定位、临时方案、长期优化）

    1️⃣ Common Answer 如果主从延迟 10 秒，首先看一下是不是从库机器性能不行，或者主库写入太快。可以升级从库硬件，或者让主库限流。还有就是看看有没有大事务，有的话拆分一下。还有就是开启并行复制，MySQL 5.6 之后支持多线程复制。如果实在不行，就临时把业务切到主库，不要走从库了。


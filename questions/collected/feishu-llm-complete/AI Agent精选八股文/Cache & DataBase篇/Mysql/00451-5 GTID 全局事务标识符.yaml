  reference_answer: "### GTID 原理与优势\n\n1、基础题：什么是 GTID？GTID 的格式是什么？\n\n⭐（考察 GTID 概念、格式）\n\nGTID（Global
    Transaction Identifier）是全局事务标识符，用于唯一标识 MySQL 中的事务。格式为：source_id:transaction_id，例如
    3E11FA47-71CA-11E1-9E33-C80AA9429562:23，其中 source_id 是服务器的 UUID，transaction_id
    是事务序号。\n\n2、进阶题：详细说明 GTID 的工作原理和优势，并对比传统基于位置复制的区别\n\n⭐⭐（考察 GTID 原理、优势、与位置复制对比）\n\n1️⃣
    Common Answer GTID 就是全局事务 ID，每个事务都有一个唯一的 ID，格式是 UUID:序号。GTID 的好处是方便主从切换，因为不需要知道
    binlog 的位置，只需要知道 GTID 就可以了。还有就是方便故障恢复，因为 GTID 是全局唯一的。传统复制是基于 binlog 位置的，切换的时候需要知道具体的
    binlog 文件和位置，比较麻烦。\n\n2️⃣ Impressive Answer GTID（Global Transaction Identifier）是
    MySQL 5.6 引入的重要特性，彻底改变了主从复制的管理方式：\n\nGTID 工作原理：\n\n- GTID 分配：\n\n- GTID 记录：\n\n-

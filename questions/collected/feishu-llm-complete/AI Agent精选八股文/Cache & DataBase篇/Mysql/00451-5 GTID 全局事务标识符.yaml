    配置 GTID：\n\n- 注意事项：\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n3、场景题：生产环境 GTID 复制中断，如何快速恢复？\n\n⭐⭐⭐（考察
    GTID 故障恢复、跳过错误事务、恢复流程）\n\n1️⃣ Common Answer 如果 GTID 复制中断，首先看一下是什么错误，如果是某个事务执行失败，可以跳过这个事务。GTID
    不能用 sqlslaveskipcounter，需要用 SET GTIDNEXT='xxx' 来跳过。跳过之后重启复制就可以了。还有就是看看是不是数据不一致，如果数据不一致，可能需要重新搭建从库。\n\n2️⃣
    Impressive Answer GTID 复制中断是生产环境常见问题，需要系统性地排查和恢复：\n\n第一，确认中断原因：\n\n- 查看复制状态：\n\n-
    常见错误类型：\n\n第二，恢复方案：\n\n- 跳过错误事务：\n\n```text\n-- 1. 停止复制\n   STOP SLAVE;\n   \n
    \  -- 2. 设置要跳过的 GTID\n   SET GTID_NEXT='3E11FA47-71CA-11E1-9E33-C80AA9429562:23';\n
    \  \n   -- 3. 执行空事务\n   BEGIN; COMMIT;\n   \n   -- 4. 重置 GTID\n   SET GTID_NEXT='AUTOMATIC';\n
    \  \n   -- 5. 启动复制\n   START SLAVE;\n```\n\n- 修复数据不一致：\n\n- 重建从库：\n\n第三，预防措施：\n\n-

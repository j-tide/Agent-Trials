    ### 半同步复制与异步复制的对比

    1、基础题：什么是异步复制？什么是半同步复制？

    ⭐（考察复制模式概念、基本区别）

    - 异步复制：主库执行完事务后立即返回，不等待从库确认，从库异步拉取 binlog

    - 半同步复制：主库执行完事务后，至少等待一个从库确认收到 binlog 后才返回，保证数据至少到达一个从库

    2、进阶题：详细对比异步复制和半同步复制的优缺点，并说明生产环境如何选择

    ⭐⭐（考察复制模式深度对比、性能影响、数据安全、应用场景）

    1️⃣ Common Answer 异步复制就是主库写完就返回，不等待从库，优点是快，缺点是如果主库挂了，从库可能还没收到数据，会丢数据。半同步复制就是主库写完之后，至少要等一个从库确认收到了才返回，优点是数据安全，缺点是慢一点，因为要等从库确认。生产环境如果数据很重要就用半同步，如果性能重要就用异步。

    2️⃣ Impressive Answer 异步复制和半同步复制是 MySQL 主从复制的两种模式，选择需要综合考虑性能、数据安全和业务需求：


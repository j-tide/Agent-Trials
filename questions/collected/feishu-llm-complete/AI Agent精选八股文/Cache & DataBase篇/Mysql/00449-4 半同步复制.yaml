    3、场景题：生产环境半同步复制超时频繁，导致性能下降，如何排查和优化？

    ⭐⭐⭐（考察半同步复制问题排查、性能优化、降级策略）

    1️⃣ Common Answer 半同步复制超时的话，可能是从库性能不好，或者网络延迟高。可以检查一下从库的硬件配置，看看是不是 CPU 或者磁盘 IO 不行。还有就是网络是不是太慢了。优化的话，可以升级从库硬件，或者优化网络。还有就是增加超时时间，或者直接改成异步复制，虽然会丢数据，但是性能会好一些。


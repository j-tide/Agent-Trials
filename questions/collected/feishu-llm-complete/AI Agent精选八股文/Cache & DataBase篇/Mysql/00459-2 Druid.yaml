content:
  prompt: 2.2 Druid
answer:
  mode: rubric
  reference_answer: "### Druid 的监控能力\n\n1、基础题：Druid 相比其他连接池有什么特点？\n\n⭐（监控、SQL 防火墙、扩展性）\n\nDruid
    是阿里巴巴开源的数据库连接池，特点包括：\n\n- 强大的监控能力：提供 Web 监控界面，实时查看连接池状态、SQL 执行情况\n\n- SQL 防火墙：防止
    SQL 注入攻击，拦截恶意 SQL\n\n- 扩展性好：支持 Filter 机制，可以自定义扩展功能\n\n2、进阶题：详细说明 Druid 的监控功能和
    SQL 防火墙\n\n⭐⭐（监控界面、SQL 统计、防注入、配置方法）\n\n1️⃣ Common Answer Druid 有个监控页面，可以看到连接池的状态和
    SQL 执行情况。还有 SQL 防火墙，可以防止 SQL 注入。配置一下 stat-view-servlet 和 wall-filter 就行了。\n\n2️⃣
    Impressive Answer Druid 的核心优势在于企业级监控能力和SQL 防火墙，这两项功能在生产环境中非常实用。我将从监控功能、SQL 防火墙和配置方法三个方面详细说明。\n\n监控功能：\n\nDruid
    提供了三层监控能力：连接池监控、SQL 监控和 URI 监控。\n\n连接池监控：\n\n通过 Druid StatViewServlet 可以查看连接池的实时状态：\n\n核心指标：\n\n-
    活跃连接数（activeCount）：当前正在使用的连接数\n\n- 空闲连接数（poolingCount）：当前空闲的连接数\n\n- 获取连接次数（acquireCount）：累计获取连接的次数\n\n-
    获取连接成功次数（acquireSuccessCount）：成功获取连接的次数\n\n- 获取连接失败次数（acquireFailCount）：获取连接失败的次数\n\n-
    获取连接等待次数（acquireIncrementCount）：需要等待才能获取连接的次数\n\n- 平均等待时间（acquireRunAvgTime）：获取连接的平均耗时\n\n监控页面访问：\n\n//
    配置 StatViewServlet\n@Bean\npublic ServletRegistrationBean<StatViewServlet> statViewServlet()
    {\n    ServletRegistrationBean<StatViewServlet> registrationBean = \n        new
    ServletRegistrationBean<>(new StatViewServlet(), \"/druid/*\");\n    // 配置监控页面访问账号密码\n
    \   registrationBean.addInitParameter(\"loginUsername\", \"admin\");\n    registrationBean.addInitParameter(\"loginPassword\",
    \"admin\");\n    // 允许所有 IP 访问（生产环境建议限制 IP）\n    registrationBean.addInitParameter(\"allow\",
    \"\");\n    return registrationBean;\n}\n\n访问 http://localhost:8080/druid/index.html
    可以查看监控页面。\n\nSQL 监控：\n\nDruid 会统计所有 SQL 的执行情况，包括：\n\n核心指标：\n\n- 执行次数（executeCount）：SQL
    执行的总次数\n\n- 执行时间（executeTimeMillisTotal）：SQL 执行的总耗时\n\n- 平均执行时间（executeTimeMillisAvg）：SQL
    执行的平均耗时\n\n- 最大执行时间（executeTimeMillisMax）：SQL 执行的最大耗时\n\n- 执行错误次数（errorCount）：SQL
    执行失败的次数\n\n- 更新行数（updateCount）：SQL 更新的行数\n\n- 读取行数（fetchRowCount）：SQL 读取的行数\n\n慢
    SQL 排查： 在监控页面可以按执行时间排序，快速定位慢 SQL。Druid 默认将执行时间超过 3 秒的 SQL 标记为慢 SQL，可以通过配置调整：\n\n//
    配置慢 SQL 阈值（毫秒）\nproperties.setProperty(\"druid.stat.slowSqlMillis\", \"1000\");\n\nSQL
    防火墙：\n\nDruid WallFilter 提供了 SQL 防火墙功能，可以防止 SQL 注入攻击和恶意 SQL 执行。\n\n防护能力：\n\n-
    SQL 注入防护：检测常见的 SQL 注入模式，如 ' OR '1'='1、' UNION SELECT 等\n\n- 恶意 SQL 拦截：拦截 DROP
    TABLE、DELETE FROM 等危险操作\n\n- 注释防护：防止通过注释绕过检测，如 /* */、-- 等\n\n- 多语句防护：防止一次请求执行多条
    SQL 语句\n\n配置方法：\n\n@Bean\npublic DataSource dataSource() throws SQLException {\n
    \   DruidDataSource dataSource = new DruidDataSource();\n    dataSource.setUrl(\"jdbc:mysql://localhost:3306/test\");\n
    \   dataSource.setUsername(\"root\");\n    dataSource.setPassword(\"password\");\n
    \   \n    // 配置 StatFilter（统计 SQL 执行情况）\n    dataSource.setFilters(\"stat,wall\");\n
    \   \n    // 配置 WallFilter（SQL 防火墙）\n    WallFilter wallFilter = new WallFilter();\n
    \   WallConfig wallConfig = new WallConfig();\n    // 是否允许非 SQL 语句执行\n    wallConfig.setNoneBaseStatementAllow(false);\n
    \   // 是否允许多条 SQL 语句执行\n    wallConfig.setMultiStatementAllow(false);\n    //
    是否允许注释\n    wallConfig.setCommentAllow(false);\n    wallFilter.setConfig(wallConfig);\n
    \   \n    dataSource.setProxyFilters(Arrays.asList(wallFilter));\n    \n    return
    dataSource;\n}\n\n监控告警：\n\nDruid 支持通过日志输出监控数据，可以结合日志收集系统（如 ELK）进行告警：\n\n配置日志输出：\n\n#
    开启 Druid 日志\ndruid.stat.logSlowSql=true\ndruid.stat.slowSqlMillis=1000\n\n告警规则：\n\n-
    慢 SQL 次数 > 10/分钟：告警\n\n- SQL 执行错误率 > 1%：告警\n\n- 活跃连接数 > maxActive × 80%：预警\n\n实战案例：\n\n某电商系统使用
    Druid 监控发现：\n\n- 某查询订单列表的 SQL 平均执行时间为 500ms\n\n- 该 SQL 每分钟执行 1000 次\n\n- 通过 EXPLAIN
    分析发现该 SQL 未使用索引\n\n优化措施：\n\n- 为订单表添加联合索引（userid, createtime, status）\n\n- 优化 SQL
    语句，减少返回字段\n\n- 添加缓存，将缓存命中率从 20% 提升到 80%\n\n优化效果：\n\n- SQL 平均执行时间从 500ms 降低到 20ms\n\n-
    数据库 CPU 占用从 80% 降低到 30%\n\n- 接口响应时间从 800ms 降低到 100ms\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n3、场景题：如何使用
    Druid 监控和优化慢 SQL？\n\n⭐⭐⭐（监控配置、慢 SQL 定位、优化方法、效果评估）\n\n1️⃣ Common Answer 打开 Druid
    监控页面，找到执行时间长的 SQL，然后优化一下。可以加索引，或者改 SQL 语句。优化后再看监控页面，确认变快了。\n\n2️⃣ Impressive Answer
    使用 Druid 监控和优化慢 SQL 是一个系统化流程，包括监控配置、慢 SQL 定位、优化方法和效果评估四个步骤。我将详细说明每个步骤的具体操作。\n\n监控配置：\n\n第一步：配置
    Druid 监控\n\nspring:\n  datasource:\n    type: com.alibaba.druid.pool.DruidDataSource\n
    \   druid:\n      # 基础配置\n      url: jdbc:mysql://localhost:3306/ecommerce\n      username:
    root\n      password: password\n      driver-class-name: com.mysql.cj.jdbc.Driver\n
    \     \n      # 连接池配置\n      initial-size: 10\n      min-idle: 10\n      max-active:
    100\n      max-wait: 10000\n      \n      # 监控配置\n      stat-view-servlet:\n        enabled:
    true\n        url-pattern: /druid/*\n        login-username: admin\n        login-password:
    admin\n        reset-enable: false\n      \n      # SQL 监控配置\n      filter:\n
    \       stat:\n          enabled: true\n          log-slow-sql: true\n          slow-sql-millis:
    1000\n          merge-sql: true\n        wall:\n          enabled: true\n          config:\n
    \           multi-statement-allow: false\n\n第二步：配置慢 SQL 日志\n\n# application.properties\n#
    慢 SQL 阈值（毫秒）\nspring.datasource.druid.filter.stat.slow-sql-millis=1000\n# 记录慢
    SQL\nspring.datasource.druid.filter.stat.log-slow-sql=true\n\n慢 SQL 定位：\n\n第一步：访问监控页面\n\n访问
    http://localhost:8080/druid/sql.html，查看 SQL 统计信息。\n\n第二步：按执行时间排序\n\n点击\"执行时间\"列头，按执行时间从大到小排序，找出执行时间最长的
    SQL。\n\n第三步：分析慢 SQL 详情\n\n点击 SQL 链接，查看详细信息：\n\n- 执行次数：判断是否频繁执行\n\n- 平均执行时间：判断是否持续慢\n\n-
    最大执行时间：判断是否有偶发慢查询\n\n- 执行错误次数：判断是否有异常\n\n第四步：记录 SQL 语句\n\n复制慢 SQL 语句，准备进行优化。\n\n优化方法：\n\n场景一：全表扫描\n\n问题
    SQL：\n\nSELECT * FROM orders WHERE user_id = 123456 AND status = 'PAID'\n\nEXPLAIN
    分析：\n\nid | select_type | table | type | key | rows | Extra\n1  | SIMPLE      |
    orders| ALL  | NULL| 100000| Using where\n\ntype=ALL 表示全表扫描，key=NULL 表示未使用索引。\n\n优化方案：\n\n-
    添加联合索引：\n\nCREATE INDEX idx_user_status ON orders(user_id, status)\n\n- 优化后的 EXPLAIN：\n\nid
    | select_type | table | type | key          | rows | Extra\n1  | SIMPLE      |
    orders| ref  | idx_user_status| 10   | Using index\n\ntype=ref 表示使用索引，rows=10
    表示扫描行数大幅减少。\n\n场景二：索引失效\n\n问题 SQL：\n\nSELECT * FROM orders WHERE DATE(create_time)
    = '2024-01-01'\n\nEXPLAIN 分析：\n\nid | select_type | table | type | key | rows
    | Extra\n1  | SIMPLE      | orders| ALL  | NULL| 100000| Using where\n\ntype=ALL
    表示全表扫描，因为对 create_time 字段使用了 DATE() 函数，导致索引失效。\n\n优化方案：\n\n- 改写 SQL，避免使用函数：\n\nSELECT
    * FROM orders \nWHERE create_time >= '2024-01-01 00:00:00' \n  AND create_time
    < '2024-01-02 00:00:00'\n\n- 优化后的 EXPLAIN：\n\nid | select_type | table | type
    | key          | rows | Extra\n1  | SIMPLE      | orders| range| idx_create_time|
    1000| Using index\n\ntype=range 表示使用范围查询，rows=1000 表示扫描行数大幅减少。\n\n场景三：返回数据过多\n\n问题
    SQL：\n\nSELECT * FROM orders WHERE user_id = 123456\n\nEXPLAIN 分析：\n\nid | select_type
    | table | type | key          | rows | Extra\n1  | SIMPLE      | orders| ref  |
    idx_user_id   | 5000 | Using index\n\n虽然使用了索引，但 rows=5000 表示返回 5000 行数据，仍然很慢。\n\n优化方案：\n\n-
    分页查询：\n\nSELECT * FROM orders \nWHERE user_id = 123456 \nLIMIT 0, 20\n\n- 只查询需要的字段：\n\nSELECT
    id, order_no, amount, status \nFROM orders \nWHERE user_id = 123456 \nLIMIT 0,
    20\n\n效果评估：\n\n第一步：对比优化前后的执行时间\n\n在 Druid 监控页面查看优化后的 SQL 执行时间：\n\n- 优化前：平均执行时间
    500ms\n\n- 优化后：平均执行时间 20ms\n\n- 性能提升：25 倍\n\n第二步：检查数据库负载\n\n使用 SHOW PROCESSLIST
    查看数据库连接数和状态：\n\n- 优化前：CPU 占用 80%，活跃连接数 80\n\n- 优化后：CPU 占用 30%，活跃连接数 20\n\n第三步：验证接口性能\n\n使用
    JMeter 压测接口性能：\n\n- 优化前：QPS=100，平均响应时间=800ms\n\n- 优化后：QPS=800，平均响应时间=100ms\n\n-
    性能提升：8 倍\n\n实战案例：\n\n某电商订单查询接口响应时间从 800ms 降低到 100ms，优化步骤：\n\n- 定位慢 SQL：通过 Druid
    监控发现查询订单详情的 SQL 平均执行时间为 600ms\n\n- 分析原因：EXPLAIN 显示该 SQL 未使用索引，type=ALL\n\n- 优化方案：为订单表添加联合索引（userid,
    orderid, status）\n\n- 验证效果：SQL 执行时间从 600ms 降低到 20ms，接口响应时间从 800ms 降低到 100ms\n\n3️⃣
    Key Differences\n\n[嵌入表格未展开]\n\n4、容易一起考的题\n\n[嵌入表格未展开]\n\n---"

    MGR 网络分区，如何处理脑裂问题？\n\n⭐⭐⭐（考察 MGR 网络分区、脑裂问题、处理方案）\n\n1️⃣ Common Answer 如果 MGR 网络分区，可能会出现脑裂，就是两个分区都认为自己是主库。处理的话，就是手动选择一个分区，把另一个分区的节点停掉，或者重新加入组。还有就是配置
    group_replication_member_weight，让权重高的分区成为主分区。还有就是监控网络，避免网络分区。\n\n2️⃣ Impressive

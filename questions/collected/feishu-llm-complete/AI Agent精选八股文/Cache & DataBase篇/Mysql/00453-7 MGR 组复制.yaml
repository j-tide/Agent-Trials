  reference_answer: "### MGR 原理与 Paxos 协议\n\n1、基础题：什么是 MGR？MGR 的作用是什么？\n\n⭐（考察 MGR
    概念、作用）\n\nMGR（MySQL Group Replication）是 MySQL 5.7 引入的基于 Paxos 协议的组复制技术，用于实现 MySQL
    的高可用和数据一致性。MGR 支持单主模式和多主模式，通过 Paxos 协议保证数据一致性。\n\n2、进阶题：详细说明 MGR 的工作原理和 Paxos
    协议的作用，并对比 MHA\n\n⭐⭐（考察 MGR 原理、Paxos 协议、与 MHA 对比）\n\n1️⃣ Common Answer MGR 就是 MySQL
    组复制，基于 Paxos 协议，保证数据一致性。MGR 有单主模式和多主模式，单主模式只有一个主库，多主模式可以有多个主库。Paxos 协议就是用来保证数据一致性的，比如选举主库、提交事务等。MHA
    是传统的高可用方案，MGR 是新的方案，数据一致性更好。\n\n2️⃣ Impressive Answer MGR（MySQL Group Replication）是
    MySQL 5.7 引入的革命性高可用方案，我来详细说明：\n\nMGR 工作原理：\n\n- 组通信系统（GCS）：\n\n- 事务提交流程：\n\n-

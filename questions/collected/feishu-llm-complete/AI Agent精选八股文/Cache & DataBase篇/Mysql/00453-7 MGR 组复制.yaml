    数据一致性高：基于 Paxos 协议，保证强一致性\n\n- 自动故障转移：节点故障时，自动选举新主库\n\n- 支持多主模式：多个节点可以同时写入\n\n-
    内置冲突检测：多主模式下自动检测和解决冲突\n\n- 易于扩展：节点可以动态加入和退出\n\nMGR 与 MHA 对比：\n\n[嵌入表格未展开]\n\n生产环境使用建议：\n\n-

answer:
  mode: rubric
  reference_answer: "### 分页查询性能优化\n\n1、基础题：大表深分页为什么慢？有哪些优化方法？\n\n⭐（深分页问题、优化方法）\n\n大表深分页慢的原因：\n\n-
    LIMIT 1000000, 10 需要扫描 1000010 行，然后丢弃前 1000000 行\n\n- 随着偏移量增大，扫描行数线性增长，查询时间越来越长\n\n优化方法：\n\n-
    延迟关联：先通过索引找到 ID，再回表查询\n\n- 游标分页：使用上一页最后一条记录作为游标\n\n- 覆盖索引：查询只走索引，不回表\n\n- 子查询优化：使用子查询先找到
    ID 范围\n\n2、进阶题：延迟关联和游标分页的原理是什么？如何实现？\n\n⭐⭐（延迟关联、游标分页）\n\n1️⃣ Common Answer 延迟关联就是先通过索引找到
    ID，然后再 JOIN 原表查询数据。这样扫描的行数就少了。游标分页就是用上一页最后一条记录的 ID 或时间作为条件，查询下一页。这样就不需要 OFFSET，查询就快了。但是游标分页不能跳页，只能一页一页翻。\n\n2️⃣
    Impressive Answer 延迟关联原理：\n\n传统分页：\n\n-- 慢：扫描 1000010 行，丢弃前 1000000 行\nSELECT
    * FROM orders ORDER BY id DESC LIMIT 1000000, 10;\n-- 执行时间：5-10 秒\n\n延迟关联优化：\n\n--
    快：先通过索引找到 10 个 ID，再回表查询\nSELECT o.* \nFROM orders o\nINNER JOIN (\n    SELECT
    id \n    FROM orders \n    ORDER BY id DESC \n    LIMIT 1000000, 10\n) tmp ON
    o.id = tmp.id;\n-- 执行时间：0.1-0.5 秒\n\n原理分析：\n\n- 子查询只扫描索引（id 是主键），速度快\n\n- 子查询返回
    10 个 ID，然后通过主键回表查询\n\n- 避免了扫描 1000010 行数据\n\n游标分页原理：\n\n传统分页：\n\n-- 第一页\nSELECT
    * FROM orders ORDER BY id DESC LIMIT 0, 10;\n\n-- 第 100001 页\nSELECT * FROM orders
    ORDER BY id DESC LIMIT 1000000, 10;\n-- 越往后越慢\n\n游标分页优化：\n\n-- 第一页\nSELECT * FROM
    orders ORDER BY id DESC LIMIT 10;\n-- 记录最后一条记录的 ID：last_id = 1000\n\n-- 第二页\nSELECT
    * FROM orders \nWHERE id < 1000 \nORDER BY id DESC \nLIMIT 10;\n-- 性能稳定，不随页码增加而变慢\n\n--
    第三页\nSELECT * FROM orders \nWHERE id < 990 \nORDER BY id DESC \nLIMIT 10;\n\n实现代码示例：\n\nJava
    实现：\n\n// 传统分页\npublic List<Order> pageByOffset(int pageNum, int pageSize) {\n
    \   int offset = (pageNum - 1) * pageSize;\n    return orderMapper.selectByOffset(offset,
    pageSize);\n}\n\n// 游标分页\npublic List<Order> pageByCursor(Long lastId, int pageSize)
    {\n    if (lastId == null) {\n        // 第一页\n        return orderMapper.selectFirstPage(pageSize);\n
    \   } else {\n        // 后续页\n        return orderMapper.selectByCursor(lastId,
    pageSize);\n    }\n}\n\nMyBatis Mapper：\n\n<!-- 传统分页 -->\n<select id=\"selectByOffset\"
    resultType=\"Order\">\n    SELECT * FROM orders \n    ORDER BY id DESC \n    LIMIT
    #{offset}, #{pageSize}\n</select>\n\n<!-- 游标分页 -->\n<select id=\"selectFirstPage\"
    resultType=\"Order\">\n    SELECT * FROM orders \n    ORDER BY id DESC \n    LIMIT
    #{pageSize}\n</select>\n\n<select id=\"selectByCursor\" resultType=\"Order\">\n
    \   SELECT * FROM orders \n    WHERE id &lt; #{lastId} \n    ORDER BY id DESC
    \n    LIMIT #{pageSize}\n</select>\n\n优缺点对比：\n\n[嵌入表格未展开]\n\n最佳实践：\n\n- 小数据量（<
    100 万行）：使用传统分页\n\n- 中等数据量（100 万-1000 万行）：使用延迟关联\n\n- 大数据量（> 1000 万行）：使用游标分页\n\n-
    必须跳页的场景：使用延迟关联 + 缓存\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n3、场景题：一个 5000 万行的订单表，用户需要翻到第
    10000 页，如何优化？\n\n⭐⭐⭐（分页优化、综合方案）\n\n1️⃣ Common Answer 这个肯定是深分页问题，用延迟关联优化一下。先通过索引找到
    ID，再 JOIN 原表。如果还是慢，可以考虑用游标分页，但是不能跳页。还有就是可以用缓存，把热门页的数据缓存起来。如果数据量太大，可能需要分表，按用户 ID
    哈希分表。或者用 ES 做搜索，ES 分页性能好。\n\n2️⃣ Impressive Answer 针对 5000 万行订单表翻到第 10000 页的场景，我建议采用分级优化策略：\n\n方案一：延迟关联（推荐，需要跳页）\n\n--
    优化前：5-10 秒\nSELECT * FROM orders ORDER BY id DESC LIMIT 100000, 10;\n\n-- 优化后：0.1-0.5
    秒\nSELECT o.* \nFROM orders o\nINNER JOIN (\n    SELECT id \n    FROM orders \n
    \   ORDER BY id DESC \n    LIMIT 100000, 10\n) tmp ON o.id = tmp.id;\n\n-- 进一步优化：使用覆盖索引\nCREATE
    INDEX idx_id_cover ON orders (id, user_id, create_time, status, amount);\n\nSELECT
    o.id, o.user_id, o.create_time, o.status, o.amount \nFROM orders o\nINNER JOIN
    (\n    SELECT id \n    FROM orders \n    ORDER BY id DESC \n    LIMIT 100000,
    10\n) tmp ON o.id = tmp.id;\n-- 执行时间：< 100ms\n\n方案二：游标分页（推荐，不需要跳页）\n\n-- 第一页\nSELECT
    * FROM orders ORDER BY id DESC LIMIT 10;\n-- last_id = 999990\n\n-- 第二页\nSELECT
    * FROM orders WHERE id < 999990 ORDER BY id DESC LIMIT 10;\n-- last_id = 999980\n\n--
    第 10000 页\nSELECT * FROM orders WHERE id < 900010 ORDER BY id DESC LIMIT 10;\n--
    执行时间：< 50ms\n\n方案三：缓存优化（推荐，热点数据）\n\n// Redis 缓存热门页\npublic List<Order> pageWithCache(int
    pageNum, int pageSize) {\n    String cacheKey = \"orders:page:\" + pageNum;\n
    \   List<Order> orders = redisTemplate.opsForValue().get(cacheKey);\n    \n    if
    (orders == null) {\n        orders = orderMapper.selectByOffset((pageNum - 1)
    * pageSize, pageSize);\n        // 缓存 5 分钟\n        redisTemplate.opsForValue().set(cacheKey,
    orders, 5, TimeUnit.MINUTES);\n    }\n    \n    return orders;\n}\n\n// 预热缓存：提前缓存前
    1000 页\n@Scheduled(cron = \"0 0 2 * * ?\")\npublic void warmUpCache() {\n    for
    (int i = 1; i <= 1000; i++) {\n        pageWithCache(i, 10);\n    }\n}\n\n方案四：分库分表（推荐，超大数据量）\n\n//
    按 user_id 哈希分表\npublic List<Order> pageByUserId(Long userId, int pageNum, int
    pageSize) {\n    // 计算分表\n    int tableIndex = (int) (userId % 4);\n    String
    tableName = \"orders_\" + tableIndex;\n    \n    // 查询对应分表\n    return orderMapper.selectByTable(tableName,
    (pageNum - 1) * pageSize, pageSize);\n}\n\n方案五：搜索引擎（推荐，复杂查询）\n\n// 使用 Elasticsearch\npublic
    List<Order> pageByES(int pageNum, int pageSize) {\n    SearchRequest request =
    new SearchRequest(\"orders\");\n    SearchSourceBuilder builder = new SearchSourceBuilder();\n
    \   \n    builder.from((pageNum - 1) * pageSize);\n    builder.size(pageSize);\n
    \   builder.sort(\"id\", SortOrder.DESC);\n    \n    request.source(builder);\n
    \   \n    SearchResponse response = restHighLevelClient.search(request, RequestOptions.DEFAULT);\n
    \   return parseResponse(response);\n}\n\n综合方案：\n\npublic List<Order> page(int
    pageNum, int pageSize) {\n    // 前 1000 页：使用缓存\n    if (pageNum <= 1000) {\n        return
    pageWithCache(pageNum, pageSize);\n    }\n    \n    // 1000-10000 页：使用延迟关联\n    if
    (pageNum <= 10000) {\n        return pageWithDelayJoin(pageNum, pageSize);\n    }\n
    \   \n    // 超过 10000 页：提示用户使用搜索\n    throw new BusinessException(\"页码过大，请使用搜索功能\");\n}\n\n优化效果：\n\n-
    延迟关联：5-10s → 0.1-0.5s（提升 20-50 倍）\n\n- 游标分页：性能稳定，< 50ms\n\n- 缓存命中：QPS 从 100 →
    10000+\n\n- ES 搜索：复杂查询 < 1s\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n4、容易一起考的题\n\n[嵌入表格未展开]\n\n---"

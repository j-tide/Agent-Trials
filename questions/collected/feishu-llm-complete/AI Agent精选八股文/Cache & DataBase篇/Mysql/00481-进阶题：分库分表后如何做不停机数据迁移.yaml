answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（双写方案、影子表、数据校验、灰度切流、回滚策略）

    1️⃣ Common Answer

    先停机，把数据导出来，导入到新库，然后切流量。或者可以双写，新旧库都写，然后慢慢切读。具体怎么做要看情况，反正要保证数据不丢。

    2️⃣ Impressive Answer

    不停机数据迁移是分库分表的核心工程挑战，需要系统化的迁移方案：

    一、迁移挑战

    - 存量数据迁移：将现有数据从旧库迁移到新库

    - 增量数据同步：迁移期间产生的数据需要同步到新库

    - 业务不停机：迁移过程不能影响业务正常访问

    - 数据一致性：新旧库数据必须保持一致

    二、双写方案

    - 阶段1：双写+读旧库

    - 阶段2：切读流量

    - 阶段3：下线旧库

    三、影子表方案

    - 原理：使用Canal监听旧库Binlog，实时同步到新库

    - 优势：

    - 实施步骤：

    四、数据校验

    - 抽样校验：随机抽取部分数据，对比新旧库是否一致

    - 全量校验：离线任务逐条对比，确保100%一致

    - 实时校验：双写时异步对比，发现不一致立即告警

    五、灰度切流策略

    - 按用户比例切流：10%→30%→50%→100%

    - 按用户维度切流：先切灰度用户，再切全量用户

    - 回滚策略：每个阶段都有回滚预案，异常时5分钟内回滚


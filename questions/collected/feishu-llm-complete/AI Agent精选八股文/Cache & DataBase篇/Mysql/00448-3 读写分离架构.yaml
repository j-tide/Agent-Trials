    4、容易一起考的题

    [嵌入表格未展开]

    - 在 try 块中获取连接，但在 catch 块中没有关闭

    - 使用了 ThreadLocal 存储连接但没有清理

    - 长事务一直占用连接，导致连接无法归还

    - 活跃连接数是否长期接近 maximumPoolSize

    - 等待线程数是否持续增加

    - 获取连接的平均时间是否过长

    - 是否有大量的连接获取超时

    - 活跃连接数超过 maximumPoolSize 的 80%

    - 等待线程数持续增长

    - 连接获取超时次数增加

    - 连接泄漏告警

    - 拆分大事务，将大批量操作拆分成小批量

    - 使用批量插入代替单条插入，减少事务次数

    - 异步处理非核心业务，比如日志记录、消息发送等

    - 使用消息队列削峰填谷，避免瞬时写入量激增

    - 升级从库硬件，增加 CPU、内存、磁盘 IO 能力

    - 优化从库查询，减少慢查询，避免占用过多资源

    - 增加从库数量，通过负载均衡分担读压力

    - 将从库部署在独立的机房，避免和其他服务争抢资源

    - 升级到 MySQL 8.0，使用基于 WRITESET 的并行复制，效果最好

    - 调整 slaveparallelworkers 参数，增加并行线程数，通常设置为 CPU 核心数

    - 调整 slaveparalleltype 参数，选择合适的并行策略

    - 设置 rplsemisyncmasterenabled=1 开启半同步复制

    - 设置 rplsemisyncmastertimeout=1000，超时后降级为异步复制

    - 监控半同步复制的成功率，确保至少一个从库及时同步

    - 主从延迟监控，延迟超过阈值（比如 3 秒）立即告警

    - 主库写入量监控，QPS/TPS 异常增长时告警

    - 从库性能监控，CPU/内存/IO 使用率异常时告警

    - 大事务监控，执行时间超过阈值时告警

    - 强制读主库的切换方案

    - 限流降级的策略和阈值

    - 从库扩容的操作流程

    - 应急团队的联系方式和决策流程

answer:
  mode: rubric
  reference_answer: "### 关键技术点总结\n\n1、基础题：MySQL 分区表与大表治理的核心知识点有哪些？\n\n⭐（核心知识点总结）\n\nMySQL
    分区表与大表治理的核心知识点：\n\n- 分区表类型：RANGE、LIST、HASH、KEY，根据数据特征选择\n\n- 分区裁剪：查询条件包含分区键，只扫描相关分区\n\n-
    大表问题：慢查询、锁竞争、DDL 阻塞、主从延迟\n\n- 在线 DDL：ALGORITHM=INPLACE/COPY/INSTANT，LOCK=NONE/SHARED/EXCLUSIVE\n\n-
    pt-online-schema-change：在线表结构变更工具，不锁表\n\n- 数据归档：分区 DROP、pt-archiver、INSERT + DELETE\n\n-
    分页优化：延迟关联、游标分页、覆盖索引\n\n- 综合治理：优化索引、分区归档、读写分离、缓存、分库分表、ES\n\n2、进阶题：如何根据业务场景选择合适的治理方案？\n\n⭐⭐（场景选择、方案决策）\n\n1️⃣
    Common Answer 根据业务场景选择治理方案，主要是看数据量、读写比例、查询类型。数据量小的就优化索引，数据量大的就分区或分表。读多写少的就用读写分离和缓存，写多的就分库分表。复杂查询用
    ES。还有就是看成本，优先用成本低的方案。\n\n2️⃣ Impressive Answer 根据业务场景选择治理方案的决策树：\n\ngraph TD\n
    \   A[开始] --> B{数据量}\n    B -->|< 1000 万| C[优化索引]\n    B -->|1000 万-1 亿| D{查询类型}\n
    \   B -->|> 1 亿| E{读写比例}\n    \n    D -->|时间范围查询| F[分区表]\n    D -->|用户维度查询| G[分库分表]\n
    \   D -->|复杂查询| H[Elasticsearch]\n    \n    E -->|读多写少| I[读写分离 + 缓存]\n    E -->|写多读少|
    J[分库分表]\n    E -->|读写均衡| K[分库分表 + 读写分离]\n    \n    C --> L[监控效果]\n    F --> L\n
    \   G --> L\n    H --> L\n    I --> L\n    J --> L\n    K --> L\n    \n    L -->
    M{效果是否达标}\n    M -->|是| N[完成治理]\n    M -->|否| O[升级方案]\n    O --> P[架构升级]\n\n场景决策表：\n\n[嵌入表格未展开]\n\n决策原则：\n\n-
    成本优先：优先使用低成本、高收益的方案\n\n- 渐进式治理：从简单到复杂，逐步优化\n\n- 业务适配：根据业务特点选择方案\n\n- 风险控制：评估风险，制定预案\n\n实际案例：\n\n案例
    1：订单系统（5000 万行，写多读少）\n\n- 问题：查询慢、写入慢\n\n- 方案：分库分表（user_id % 4）\n\n- 效果：查询性能提升
    20 倍，写入性能提升 5 倍\n\n案例 2：日志系统（2 亿行，写多读少）\n\n- 问题：查询慢、存储空间大\n\n- 方案：分区表（按月）+ 归档\n\n-
    效果：查询性能提升 50 倍，存储空间降低 80%\n\n案例 3：用户系统（1 亿行，读多写少）\n\n- 问题：查询慢、主从延迟\n\n- 方案：读写分离
    + 缓存\n\n- 效果：查询性能提升 100 倍，主从延迟降低 90%\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n3、场景题：一个初创公司的数据库有
    500 万行数据，如何规划未来的治理方案？\n\n⭐⭐⭐（长期规划、预防性治理）\n\n1️⃣ Common Answer 500 万行还不算大表，先优化索引，确保查询性能。然后监控数据增长，如果到
    1000 万行就考虑分区。如果到 5000 万行就考虑分库分表。还有就是建立监控，定期检查慢查询和索引使用情况。提前规划，避免等到问题严重了再治理。\n\n2️⃣
    Impressive Answer 针对初创公司 500 万行数据的数据库，我建议采用预防性治理策略：\n\n第一阶段：当前阶段（500 万行）\n\n目标：优化性能，建立监控\n\n--
    优化索引\nCREATE INDEX idx_user_time ON orders (user_id, create_time);\nCREATE INDEX
    idx_status_time ON orders (status, create_time);\n\n-- 删除冗余索引\nDROP INDEX idx_user
    ON orders;\n\n-- 建立监控\n-- 慢查询监控\nSET GLOBAL slow_query_log = ON;\nSET GLOBAL long_query_time
    = 0.5;\nSET GLOBAL log_queries_not_using_indexes = ON;\n\n-- 定期分析慢查询\npt-query-digest
    /var/lib/mysql/mysql-slow.log --limit 10\n\n-- 索引使用监控\nSELECT * FROM sys.schema_unused_indexes
    WHERE object_schema = 'your_db';\n\n-- 表空间监控\nSELECT \n    table_name,\n    ROUND(data_length
    / 1024 / 1024, 2) AS data_mb,\n    ROUND(index_length / 1024 / 1024, 2) AS index_mb,\n
    \   table_rows\nFROM information_schema.tables\nWHERE table_schema = 'your_db'\nORDER
    BY data_length DESC;\n\n第二阶段：快速增长期（1000-5000 万行）\n\n目标：分区归档，降低数据量\n\n-- 创建分区表\nCREATE
    TABLE orders_partitioned (\n    id BIGINT NOT NULL,\n    user_id BIGINT NOT NULL,\n
    \   create_time DATETIME NOT NULL,\n    status TINYINT NOT NULL,\n    amount DECIMAL(10,2),\n
    \   PRIMARY KEY (id, create_time)\n) PARTITION BY RANGE (TO_DAYS(create_time))
    (\n    PARTITION p202401 VALUES LESS THAN (TO_DAYS('2024-02-01')),\n    PARTITION
    p202402 VALUES LESS THAN (TO_DAYS('2024-03-01')),\n    PARTITION p202403 VALUES
    LESS THAN (TO_DAYS('2024-04-01')),\n    PARTITION p_future VALUES LESS THAN MAXVALUE\n);\n\n--
    迁移数据\nINSERT INTO orders_partitioned SELECT * FROM orders;\n\n-- 重命名表\nRENAME
    TABLE orders TO orders_old, orders_partitioned TO orders;\n\n-- 归档历史数据\npt-archiver
    \\\n  --source h=127.0.0.1,D=your_db,t=orders_old \\\n  --dest h=127.0.0.1,D=your_db,t=orders_archive
    \\\n  --where \"create_time < '2024-01-01'\" \\\n  --execute\n\n-- 删除旧表\nDROP
    TABLE orders_old;\n\n第三阶段：稳定期（5000 万-1 亿行）\n\n目标：读写分离，分散压力\n\n// 配置主从数据源\n@Configuration\npublic
    class DataSourceConfig {\n    \n    @Bean\n    @Primary\n    public DataSource
    masterDataSource() {\n        HikariDataSource dataSource = new HikariDataSource();\n
    \       dataSource.setJdbcUrl(\"jdbc:mysql://master-db:3306/your_db\");\n        dataSource.setUsername(\"root\");\n
    \       dataSource.setPassword(\"password\");\n        dataSource.setMaximumPoolSize(20);\n
    \       return dataSource;\n    }\n    \n    @Bean\n    public DataSource slaveDataSource()
    {\n        HikariDataSource dataSource = new HikariDataSource();\n        dataSource.setJdbcUrl(\"jdbc:mysql://slave-db:3306/your_db\");\n
    \       dataSource.setUsername(\"root\");\n        dataSource.setPassword(\"password\");\n
    \       dataSource.setMaximumPoolSize(50);\n        dataSource.setReadOnly(true);\n
    \       return dataSource;\n    }\n}\n\n// 使用注解控制读写路由\n@Target(ElementType.METHOD)\n@Retention(RetentionPolicy.RUNTIME)\npublic
    @interface ReadOnly {\n}\n\n// AOP 切面\n@Aspect\n@Component\npublic class ReadOnlyAspect
    {\n    \n    @Autowired\n    private DataSource routingDataSource;\n    \n    @Around(\"@annotation(readOnly)\")\n
    \   public Object around(ProceedingJoinPoint joinPoint, ReadOnly readOnly) throws
    Throwable {\n        try {\n            DataSourceContextHolder.setDataSourceType(\"slave\");\n
    \           return joinPoint.proceed();\n        } finally {\n            DataSourceContextHolder.clearDataSourceType();\n
    \       }\n    }\n}\n\n// Service 层使用\n@Service\npublic class OrderService {\n
    \   \n    @ReadOnly\n    public List<Order> selectByUserId(Long userId) {\n        return
    orderMapper.selectByUserId(userId);\n    }\n    \n    public void insert(Order
    order) {\n        orderMapper.insert(order);\n    }\n}\n\n第四阶段：扩展期（1 亿行以上）\n\n目标：分库分表，扩展容量\n\n//
    ShardingSphere 配置\n@Configuration\npublic class ShardingConfig {\n    \n    @Bean\n
    \   public DataSource shardingDataSource() throws SQLException {\n        ShardingRuleConfiguration
    shardingRuleConfig = new ShardingRuleConfiguration();\n        \n        // 订单表分片规则\n
    \       TableRuleConfiguration orderRuleConfig = new TableRuleConfiguration(\n
    \           \"orders\",\n            \"ds${0..1}.orders_${0..3}\"\n        );\n
    \       \n        // 分库策略：user_id % 2\n        orderRuleConfig.setDatabaseShardingStrategyConfig(\n
    \           new InlineShardingStrategyConfiguration(\"user_id\", \"ds${user_id
    % 2}\")\n        );\n        \n        // 分表策略：user_id % 4\n        orderRuleConfig.setTableShardingStrategyConfig(\n
    \           new InlineShardingStrategyConfiguration(\"user_id\", \"orders_${user_id
    % 4}\")\n        );\n        \n        shardingRuleConfig.getTableRuleConfigs().add(orderRuleConfig);\n
    \       \n        // 创建数据源\n        Map<String, DataSource> dataSourceMap = new
    HashMap<>();\n        dataSourceMap.put(\"ds0\", createDataSource(\"jdbc:mysql://db0:3306/your_db\"));\n
    \       dataSourceMap.put(\"ds1\", createDataSource(\"jdbc:mysql://db1:3306/your_db\"));\n
    \       \n        Properties props = new Properties();\n        props.setProperty(\"sql.show\",
    \"true\");\n        \n        return ShardingDataSourceFactory.createDataSource(\n
    \           dataSourceMap,\n            shardingRuleConfig,\n            props\n
    \       );\n    }\n    \n    private DataSource createDataSource(String url) {\n
    \       HikariDataSource dataSource = new HikariDataSource();\n        dataSource.setJdbcUrl(url);\n
    \       dataSource.setUsername(\"root\");\n        dataSource.setPassword(\"password\");\n
    \       dataSource.setMaximumPoolSize(20);\n        return dataSource;\n    }\n}\n\n长期规划时间表：\n\n[嵌入表格未展开]\n\n预防性治理措施：\n\n-
    建立监控体系\n\n-- 慢查询监控\nSELECT \n    digest_text,\n    count_star,\n    avg_timer_wait
    / 1000000000000 AS avg_time_ms\nFROM performance_schema.events_statements_summary_by_digest\nWHERE
    schema_name = 'your_db' \n  AND avg_timer_wait > 500000000000\nORDER BY avg_timer_wait
    DESC\nLIMIT 10;\n\n-- 索引使用监控\nSELECT * FROM sys.schema_unused_indexes WHERE object_schema
    = 'your_db';\n\n-- 表空间监控\nSELECT \n    table_name,\n    ROUND(data_length / 1024
    / 1024, 2) AS data_mb,\n    ROUND(index_length / 1024 / 1024, 2) AS index_mb,\n
    \   table_rows\nFROM information_schema.tables\nWHERE table_schema = 'your_db'\nORDER
    BY data_length DESC;\n\n- 定期复盘\n\n- 每月复盘一次，评估治理效果\n\n- 根据数据增长趋势，调整治理方案\n\n- 记录治理经验，建立知识库\n\n-
    建立规范\n\n- 索引设计规范：避免冗余索引，合理使用联合索引\n\n- SQL 编写规范：避免全表扫描，使用覆盖索引\n\n- 分区设计规范：按时间分区，方便归档\n\n-
    归档策略规范：保留 12 个月数据，超过的归档\n\n- 自动化运维\n\n#!/bin/bash\n# 自动归档脚本\n\n# 归档 13 个月前的数据\npt-archiver
    \\\n  --source h=127.0.0.1,D=your_db,t=orders \\\n  --dest h=127.0.0.1,D=your_db,t=orders_archive
    \\\n  --where \"create_time < DATE_SUB(NOW(), INTERVAL 13 MONTH)\" \\\n  --limit=1000
    \\\n  --bulk-insert \\\n  --bulk-delete \\\n  --progress=5000 \\\n  --execute\n\n#
    删除 24 个月前的分区\nmysql -uroot -p -e \"\n  ALTER TABLE orders DROP PARTITION p$(date
    -d '24 months ago' +%Y%m);\n\"\n\n# 定时执行：每月 1 日凌晨 2 点\n# 0 2 1 * * /path/to/archive.sh\n\n预期效果：\n\n-
    查询性能：持续保持在 200ms 以内\n\n- 系统稳定性：无宕机，无数据丢失\n\n- 运维成本：自动化运维，减少人工干预\n\n- 扩展能力：支持数据量增长到
    10 亿行\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n4、容易一起考的题\n\n[嵌入表格未展开]\n\n---\n\n总结\n\nMySQL
    分区表与大表治理是数据库性能优化的核心技能，需要掌握：\n\n- 分区表原理：RANGE/LIST/HASH/KEY 分区类型，分区裁剪优化\n\n- 大表诊断：慢查询分析、索引使用分析、锁等待分析\n\n-
    在线变更：Online DDL、pt-online-schema-change 工作原理\n\n- 数据归档：分区 DROP、pt-archiver 归档策略\n\n-
    查询优化：延迟关联、游标分页、覆盖索引\n\n- 综合治理：优化索引、分区归档、读写分离、缓存、分库分表、ES\n\n关键是要根据业务场景选择合适的治理方案，遵循成本优先、渐进式治理、业务适配、风险控制的原则，建立监控体系，定期复盘，确保数据库性能持续优化。\n\n-
    失效：WHERE user_id = 123（分区键是 create_time）\n\n- 有效：WHERE create_time = '2024-01-01'
    AND user_id = 123\n\n- 失效：WHERE YEAR(create_time) = 2024、WHERE DATE(create_time)
    = '2024-01-01'\n\n- 有效：WHERE create_time >= '2024-01-01' AND create_time < '2024-02-01'\n\n-
    失效：WHERE create_time = 20240101（字符串与数字比较）\n\n- 有效：WHERE create_time = '2024-01-01'\n\n-
    失效：WHERE user_id = 123 OR create_time = '2024-01-01'\n\n- 有效：WHERE create_time
    = '2024-01-01'\n\n- 失效：WHERE create_time IN (SELECT MAX(create_time) FROM orders)\n\n-
    有效：使用 JOIN 替代子查询\n\n- 使用 ClickHouse、Elasticsearch 等OLAP引擎\n\n- 实时数据写入 MySQL，历史数据归档到
    ES\n\n- 使用 Canal/Debezium 同步到 ES\n\n- 使用 ShardingSphere 分库分表\n\n- 热点数据在 MySQL，冷数据在
    ES\n\n- 使用 TiDB 等分布式数据库\n\n- 在原表上直接修改，避免复制表\n\n- 支持大部分 DDL 操作：添加索引、删除索引、修改列名、修改列默认值\n\n-
    优点：速度快，磁盘空间占用少\n\n- 限制：不支持修改列数据类型、修改字符集等\n\n- 创建临时表，复制数据，重命名表\n\n- 支持所有 DDL 操作\n\n-
    缺点：速度慢，需要 2 倍磁盘空间，长时间锁表\n\n- 瞬间完成，只修改元数据\n\n- 仅支持：添加列（末尾）、添加/删除虚拟列、修改列默认值\n\n-
    优点：毫秒级完成，完全不锁表\n\n- 不锁表，允许并发 DML\n\n- 适用于大部分 INPLACE 操作\n\n- 共享锁，允许读但阻塞写\n\n-
    适用于需要短暂锁表的操作\n\n- 排他锁，阻塞读写\n\n- 适用于必须锁表的操作，如修改主键\n\n- MySQL 自动选择最小锁级别\n\n- 原表已有触发器：无法创建新触发器，工具会报错\n\n-
    解决方案：临时删除原表触发器，执行完成后恢复\n\n- 外键指向原表：会导致 RENAME TABLE 失败\n\n- 解决方案：临时删除外键，执行完成后恢复\n\n-
    如果 DDL 涉及唯一键，可能导致数据同步失败\n\n- 解决方案：先检查数据唯一性，再执行变更\n\n- 修改 AUTO_INCREMENT 列可能导致数据不一致\n\n-
    解决方案：避免修改 AUTO_INCREMENT 列\n\n- P0：优化索引（成本低，收益高）\n\n- P1：分区归档（成本中，收益高）\n\n- P2：读写分离（成本中，收益中）\n\n-
    P3：缓存优化（成本中，收益中）\n\n- P4：分库分表（成本高，收益高）\n\n- P5：架构升级（成本高，收益高）\n\n- 先优化索引，验证效果\n\n-
    再分区归档，降低数据量\n\n- 然后读写分离，分散压力\n\n- 最后分库分表，扩展容量\n\n- 时间序列数据：分区表\n\n- 用户维度数据：分库分表\n\n-
    复杂查询：Elasticsearch\n\n- 热点数据：缓存\n\n- 读多写少：读写分离\n\n- 执行前备份，确保可回滚\n\n- 在测试环境验证，避免生产事故\n\n-
    监控执行过程，及时发现问题\n\n- 准备应急预案，快速响应"

  prompt: 5、进阶题：分库分表后全局唯一 ID 怎么生成？雪花算法 vs 号段模式 vs UUID 的优劣？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（雪花算法结构、时钟回拨问题、号段模式、UUID无序性）

    1️⃣ Common Answer

    可以用UUID，或者自己写个ID生成服务。雪花算法是Twitter出的，好像挺常用的，大概是用时间戳加机器ID。号段模式就是从数据库批量申请一段ID。UUID最简单，但可能有点长。

    2️⃣ Impressive Answer

    分库分表后数据库自增ID失效，必须引入全局唯一ID生成方案：

    一、为什么不能用数据库自增ID

    分库分表后，每个分片都有独立的自增ID序列，会导致ID冲突。例如：分片A生成ID=1，分片B也生成ID=1，全局不唯一。

    二、雪花算法（Snowflake）

    - 64位结构：1位符号位 + 41位时间戳 + 10位机器ID + 12位序列号

    - 优势：

    - 时钟回拨问题：

    三、号段模式

    - 原理：从数据库批量申请一段ID（如1000-2000），本地分配，用完再申请

    - 双Buffer预加载：一个Buffer用完前，异步申请下一个Buffer，保证连续性

    - 优势：性能高（减少DB访问）、ID连续

    - 劣势：依赖DB、重启后可能浪费号段

    四、UUID

    - 优势：生成简单、全球唯一

    - 劣势：

    五、Agent场景实践

    - 会话ID：用雪花算法，趋势递增，查询性能好

    - 知识库文档ID：用号段模式，ID连续，便于分页和排序

    - 临时任务ID：用UUID，无需持久化，简单快速


  reference_answer: "### 读写分离架构与实现\n\n1、基础题：什么是读写分离？为什么要做读写分离？\n\n⭐（考察读写分离概念、作用）\n\n读写分离是将数据库的读操作和写操作分离到不同的数据库实例上。主库负责写操作，从库负责读操作。读写分离可以降低主库压力，提高系统并发能力和可用性。\n\n2、进阶题：详细说明读写分离的实现方案，并对比
    ProxySQL 和 ShardingSphere\n\n⭐⭐（考察读写分离方案、ProxySQL、ShardingSphere 对比）\n\n1️⃣ Common
    Answer 读写分离就是在应用层或者中间件层，把读请求路由到从库，写请求路由到主库。实现方案有应用层路由、中间件路由。中间件有 ProxySQL、ShardingSphere、MyCat
    等。ProxySQL 是专门做 MySQL 读写分离的，ShardingSphere 是分库分表中间件，也支持读写分离。ProxySQL 性能好，配置简单，ShardingSphere
    功能强大，但是配置复杂。\n\n2️⃣ Impressive Answer 读写分离是提高数据库并发能力和可用性的重要手段，我来详细说明：\n\n读写分离实现方案：\n\n-
    应用层路由：\n\n- 中间件路由：\n\nProxySQL 方案：\n\n- ProxySQL 特点：\n\n- ProxySQL 架构：\n\n- ProxySQL
    配置示例：\n\n```text\n-- 1. 添加主库到 hostgroup 10\n   INSERT INTO mysql_servers(hostgroup_id,
    hostname, port) VALUES (10, 'master_ip', 3306);\n   \n   -- 2. 添加从库到 hostgroup
    20\n   INSERT INTO mysql_servers(hostgroup_id, hostname, port) VALUES (20, 'slave1_ip',
    3306);\n   INSERT INTO mysql_servers(hostgroup_id, hostname, port) VALUES (20,
    'slave2_ip', 3306);\n   \n   -- 3. 配置查询路由规则\n   INSERT INTO mysql_query_rules(rule_id,
    active, match_pattern, destination_hostgroup, apply) \n   VALUES (1, 1, '^SELECT',
    20, 1);\n   \n   -- 4. 加载配置到运行时\n   LOAD MYSQL SERVERS TO RUNTIME;\n   SAVE MYSQL
    SERVERS TO DISK;\n```\n\nShardingSphere 方案：\n\n- ShardingSphere 特点：\n\n- ShardingSphere
    架构：\n\n- ShardingSphere 配置示例：\n\n```text\ndataSources:\n     master:\n       dataSourceClassName:
    com.zaxxer.hikari.HikariDataSource\n       driverClassName: com.mysql.jdbc.Driver\n
    \      jdbcUrl: jdbc:mysql://master_ip:3306/db\n       username: root\n       password:
    password\n     slave0:\n       dataSourceClassName: com.zaxxer.hikari.HikariDataSource\n
    \      driverClassName: com.mysql.jdbc.Driver\n       jdbcUrl: jdbc:mysql://slave1_ip:3306/db\n
    \      username: root\n       password: password\n     slave1:\n       dataSourceClassName:
    com.zaxxer.hikari.HikariDataSource\n       driverClassName: com.mysql.jdbc.Driver\n
    \      jdbcUrl: jdbc:mysql://slave2_ip:3306/db\n       username: root\n       password:
    password\n   \n   rules:\n     - !READWRITE_SPLITTING\n       dataSources:\n         readwrite_ds:\n
    \          writeDataSourceName: master\n           readDataSourceNames:\n             -
    slave0\n             - slave1\n           loadBalanceName: round_robin\n       loadBalancers:\n
    \        round_robin:\n           type: ROUND_ROBIN\n```\n\nProxySQL vs ShardingSphere
    对比：\n\n[嵌入表格未展开]\n\n生产环境选择建议：\n\n- 选择 ProxySQL 的场景：\n\n- 选择 ShardingSphere 的场景：\n\n-
    混合方案：\n\n注意事项：\n\n- 主从延迟：读写分离会导致主从延迟，需要业务层容忍短暂延迟\n\n- 负载均衡：从库负载均衡策略（轮询、随机、权重等）\n\n-
    故障切换：主库故障时，需要自动切换读写路由\n\n- 监控告警：监控读写分离状态，及时发现异常\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n3、场景题：生产环境读写分离导致主从延迟严重，如何优化？\n\n⭐⭐⭐（考察读写分离问题、主从延迟优化、负载均衡）\n\n1️⃣
    Common Answer 如果读写分离导致主从延迟严重，可能是从库性能不好，或者读请求太多。可以升级从库硬件，或者增加从库数量，分散读压力。还有就是优化
    SQL，减少慢查询。还有就是对于强一致性要求的读操作，直接走主库，不要走从库。还有就是使用缓存，减少从库压力。\n\n2️⃣ Impressive Answer
    读写分离导致主从延迟严重是生产环境常见问题，需要系统性地优化：\n\n第一，问题分析：\n\n- 主从延迟原因：\n\n- 读写分离影响：\n\n第二，优化方案：\n\n-
    从库优化：\n\n- 增加从库数量：\n\n- 读请求优化：\n\n- 主库优化：\n\n- 缓存加速：\n\n第三，ProxySQL 优化配置：\n\n-
    配置负载均衡策略：\n\n```text\n-- 使用权重负载均衡\n   UPDATE mysql_servers SET weight=10 WHERE
    hostname='slave1_ip';\n   UPDATE mysql_servers SET weight=5 WHERE hostname='slave2_ip';\n
    \  \n   -- 使用随机负载均衡\n   INSERT INTO mysql_query_rules(rule_id, active, match_pattern,
    destination_hostgroup, apply) \n   VALUES (1, 1, '^SELECT', 20, 1);\n   \n   --
    配置权重路由\n   INSERT INTO mysql_query_rules(rule_id, active, match_pattern, destination_hostgroup,
    apply) \n   VALUES (2, 1, '^SELECT.*FOR UPDATE', 10, 1);\n```\n\n- 配置查询缓存：\n\n```text\n--
    启用查询缓存\n   UPDATE global_variables SET variable_value='true' WHERE variable_name='mysql-query_cache_size_MB';\n
    \  \n   -- 配置缓存规则\n   INSERT INTO mysql_query_rules(rule_id, active, cache_ttl,
    match_pattern, apply) \n   VALUES (3, 1, 60000, '^SELECT.*FROM user', 1);\n```\n\n第四，ShardingSphere
    优化配置：\n\n- 配置负载均衡策略：\n\n```text\nloadBalancers:\n     round_robin:\n       type:
    ROUND_ROBIN\n     random:\n       type: RANDOM\n     weight:\n       type: WEIGHT\n
    \      props:\n         slave0: 10\n         slave1: 5\n```\n\n- 配置读写分离规则：\n\n```text\nrules:\n
    \    - !READWRITE_SPLITTING\n       dataSources:\n         readwrite_ds:\n           writeDataSourceName:
    master\n           readDataSourceNames:\n             - slave0\n             -
    slave1\n           loadBalanceName: weight\n           props:\n             #
    强制路由到主库\n             masterDataSourceOnly: false\n```\n\n第五，监控告警：\n\n- 监控主从延迟：\n\n-
    监控从库负载：\n\n- 监控读写分离状态：\n\n第六，预防措施：\n\n- 定期压测：压测时关注主从延迟表现\n\n- 定期演练：定期演练主从切换，验证高可用\n\n-
    规范开发：避免大事务和长查询\n\n- 建立应急处理预案：明确处理流程\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n4、容易一起考的题\n\n[嵌入表格未展开]\n\n-
    不确定性函数导致主从不一致（如 NOW()、UUID()）\n\n- 触发器、存储过程执行结果可能不一致\n\n- 需要重新解析 SQL，从库执行开销大\n\n-
    数据一致性最高，不受不确定性函数影响\n\n- 不需要重新解析 SQL，从库执行效率高\n\n- 支持基于行的数据恢复和审计\n\n- 日志文件大，尤其是批量操作时（如
    UPDATE 全表）\n\n- 网络传输开销大\n\n- 无法直接看到执行的 SQL 语句（需用 mysqlbinlog 工具解析）\n\n- 数据一致性是第一优先级\n\n-
    Row 格式在 MySQL 5.7+ 有优化（如 binlogrowimage 参数控制记录范围）\n\n- 磁盘空间成本相对较低\n\n- 主从之间网络带宽有限\n\n-
    大量批量操作，且允许短暂不一致\n\n- 使用 NOW()、SYSDATE()、UUID() 等不确定性函数\n\n- 使用触发器、存储过程\n\n- 使用
    INSERT ... SELECT 语句\n\n- 使用 LIMIT 子句的 UPDATE/DELETE\n\n- 将 binlog 格式改为 Row：SET
    GLOBAL binlog_format = 'ROW'\n\n- 修改配置文件 my.cnf，永久生效：binlog_format = ROW\n\n-
    重启从库，重新同步数据\n\n- 避免使用不确定性函数，使用确定性值（如应用层生成时间戳）\n\n- 避免使用触发器、存储过程，逻辑移到应用层\n\n- 批量操作时，使用
    Row 格式避免大事务\n\n- binlog_row_image = MINIMAL：只记录修改后的行，减少日志量\n\n- binlog_row_image
    = FULL：记录修改前后的行（默认）\n\n- 根据业务需求选择合适值\n\n- 主从之间网络带宽不足，IO 线程拉取 binlog 慢\n\n- 网络延迟高，导致
    binlog 传输慢\n\n- 网络抖动，导致 IO 线程频繁重连\n\n- 从库硬件配置低，CPU、内存、磁盘 IO 性能不足\n\n- 从库磁盘类型差（如
    HDD vs SSD），IO 吞吐量低\n\n- 从库负载高，有其他业务占用资源\n\n- 主库 TPS/QPS 高，binlog 产生速度快\n\n- 主库执行大事务（如大批量
    UPDATE、DELETE），单次复制时间长\n\n- 主库执行长事务，导致从库长时间阻塞\n\n- 从库 SQL 线程单线程执行，无法并行处理\n\n-
    从库存在长查询或锁等待，阻塞 SQL 线程\n\n- 从库索引缺失或不合理，SQL 执行慢\n\n- 从库参数未优化，如 innodb_buffer_pool_size
    过小\n\n- 复制模式选择不当，如未开启并行复制\n\n- binlog 格式选择不当，如 Statement 格式导致从库解析慢\n\n- 增加主从之间网络带宽\n\n-
    优化网络路由，降低延迟\n\n- 使用专线或内网，避免公网传输\n\n- 升级 CPU、内存配置\n\n- 使用 SSD 磁盘，提升 IO 性能\n\n-
    独立从库服务器，避免资源竞争\n\n- 控制主库写入压力，如限流、分库分表\n\n- 拆分大事务，将大事务拆成小事务\n\n- 避免长事务，设置事务超时时间\n\n-
    开启并行复制：MySQL 5.6+ 支持 slave_parallel_workers，MySQL 5.7+ 支持基于库的并行复制\n\n- 优化从库 SQL
    性能：添加索引、优化 SQL\n\n- 避免在从库上执行长查询，减少锁竞争\n\n- 调整 innodb_buffer_pool_size，占物理内存 70-80%\n\n-
    调整 sync_binlog 和 innodb_flush_log_at_trx_commit，平衡性能和数据安全\n\n- 使用 Row 格式 binlog，减少从库解析开销\n\n-
    监控 Seconds_Behind_Master，设置告警阈值（如 5 秒）\n\n- 监控 IO 线程和 SQL 线程状态\n\n- 定期检查主从同步状态\n\n-
    执行 SHOW SLAVE STATUS，查看 Seconds_Behind_Master 确认延迟时间\n\n- 查看 Slave_IO_Running
    和 Slave_SQL_Running 确认复制状态\n\n- 查看 Exec_Master_Log_Pos 和 Relay_Master_Log_File
    确认执行位置\n\n- 检查 IO 线程状态：Master_Log_File vs Relay_Master_Log_File，如果差距大，说明 IO 线程慢\n\n-
    检查 SQL 线程状态：Relay_Log_Pos vs Exec_Master_Log_Pos，如果差距大，说明 SQL 线程慢\n\n- 检查网络延迟：ping
    主库，查看网络延迟\n\n- 检查从库负载：top、iostat 查看资源使用情况\n\n- IO 线程瓶颈：网络问题、主库压力大\n\n- SQL 线程瓶颈：从库性能差、大事务、长查询\n\n-
    临时增加网络带宽\n\n- 限制主库写入压力（如限流、降级非核心业务）\n\n- 杀掉从库上的长查询：SHOW PROCESSLIST 找到长时间运行的查询，KILL
    掉\n\n- 临时提升从库性能：调整 innodb_buffer_pool_size 等参数\n\n- 开启并行复制：SET GLOBAL slave_parallel_workers
    = 4\n\n- 将强一致性要求的读操作临时切到主库\n\n- 对允许短暂延迟的业务，使用缓存兜底\n\n- 降级非核心业务，减少从库压力\n\n- 升级从库硬件配置（CPU、内存、磁盘）\n\n-
    使用 SSD 磁盘替换 HDD\n\n- 搭建多级复制，分散压力\n\n- 实施读写分离，降低主库压力\n\n- 考虑使用 MHA 或 MGR 实现高可用\n\n-
    调整 MySQL 参数（如 innodb_buffer_pool_size、sync_binlog）\n\n- 优化 SQL 语句，添加索引\n\n- 使用
    Row 格式 binlog\n\n- 建立主从延迟监控告警\n\n- 定期检查主从同步状态\n\n- 压测时关注复制延迟表现\n\n- 主库执行事务，写入
    binlog\n\n- 主库立即返回成功给客户端\n\n- 从库 IO 线程异步拉取 binlog\n\n- 性能最高，主库无需等待从库确认\n\n- 主库写入延迟最低\n\n-
    从库故障不影响主库性能\n\n- 数据安全性差，主库宕机可能导致数据丢失\n\n- 主从切换时可能丢失未同步到从库的数据\n\n- 无法保证数据一致性\n\n-
    对数据一致性要求不高的业务\n\n- 主库性能要求极高的场景\n\n- 可以接受少量数据丢失的场景\n\n- 主库执行事务，写入 binlog\n\n- 主库等待至少一个从库确认收到
    binlog\n\n- 从库确认后，主库返回成功给客户端\n\n- 数据安全性高，保证数据至少到达一个从库\n\n- 主从切换时数据丢失风险低\n\n- 提供一定程度的数据一致性保证\n\n-
    性能较低，主库需要等待从库确认\n\n- 主库写入延迟增加\n\n- 从库故障或网络问题会影响主库性能\n\n- 如果超时未收到确认，会降级为异步复制\n\n-
    对数据一致性要求高的业务\n\n- 金融、支付等核心业务\n\n- 不能接受数据丢失的场景\n\n- 金融、支付、订单等核心业务\n\n- 配置 rpl_semi_sync_master_enabled
    = 1\n\n- 配置 rpl_semi_sync_slave_enabled = 1\n\n- 设置超时时间 rpl_semi_sync_master_timeout
    = 1000（1 秒）\n\n- 日志、统计等非核心业务\n\n- 对性能要求高，可以接受少量数据丢失\n\n- 核心业务使用半同步复制\n\n- 非核心业务使用异步复制\n\n-
    通过多主从架构实现\n\n- 从库硬件配置低，CPU、内存、磁盘 IO 性能不足\n\n- 从库负载高，有其他业务占用资源\n\n- 从库 SQL 线程执行慢，无法及时确认
    binlog\n\n- 主从之间网络延迟高，导致 binlog 传输慢\n\n- 网络带宽不足，导致 binlog 传输慢\n\n- 网络抖动，导致从库无法及时确认\n\n-
    主库 TPS/QPS 高，binlog 产生速度快\n\n- 主库执行大事务，单次复制时间长\n\n- 主库执行长事务，导致从库长时间阻塞\n\n- 超时时间设置过短（如
    rpl_semi_sync_master_timeout = 100）\n\n- 从库参数未优化，如 innodb_buffer_pool_size 过小\n\n-
    半同步复制配置不正确\n\n- SHOW VARIABLES LIKE 'rpl_semi_sync%' 查看配置\n\n- SHOW STATUS LIKE
    'Rpl_semi_sync%' 查看运行状态\n\n- 关注 Rpl_semi_sync_master_yes_tx 和 Rpl_semi_sync_master_no_tx
    指标\n\n- SHOW PROCESSLIST 查看 SQL 线程状态\n\n- SHOW SLAVE STATUS 查看复制状态\n\n- top、iostat
    查看资源使用情况\n\n- ping 主库，查看网络延迟\n\n- iperf 测试网络带宽\n\n- 升级从库硬件配置（CPU、内存、磁盘）\n\n- 使用
    SSD 磁盘替换 HDD\n\n- 优化从库参数（如 innodb_buffer_pool_size）\n\n- 开启并行复制，提高 SQL 线程执行效率\n\n-
    增加主从之间网络带宽\n\n- 优化网络路由，降低延迟\n\n- 使用专线或内网，避免公网传输\n\n- 控制主库写入压力（如限流、分库分表）\n\n- 拆分大事务，将大事务拆成小事务\n\n-
    避免长事务，设置事务超时时间\n\n- 调整超时时间：rpl_semi_sync_master_timeout = 1000（1 秒）\n\n- 调整等待从库数量：rpl_semi_sync_master_wait_for_slave_count
    = 1\n\n- 调整等待方式：rpl_semi_sync_master_wait_point = AFTER_SYNC（MySQL 5.7+）\n\n-
    如果超时频繁，可以临时降级为异步复制\n\n- 设置降级阈值，如连续超时 10 次后降级\n\n- 建立告警机制，及时发现问题\n\n- 每个事务在提交时，MySQL
    会自动分配一个 GTID\n\n- GTID 格式：source_id:transaction_id（如 3E11FA47-71CA-11E1-9E33-C80AA9429562:23）\n\n-
    source_id 是服务器的 UUID，存储在 auto.cnf 文件中\n\n- transaction_id 是事务序号，从 1 开始递增\n\n-
    GTID 被记录在 binlog 中，每个事务前都有一个 GTID 事件\n\n- 从库执行事务后，会将 GTID 记录到 gtid_executed 表中\n\n-
    从库还会记录 gtid_purged，表示已清理的 GTID 范围\n\n- 从库连接主库时，会发送自己已执行的 GTID 集合\n\n- 主库根据从库的
    GTID 集合，计算出需要发送的新 GTID\n\n- 主库发送对应的 binlog 事件给从库\n\n- 从库执行事务后，更新自己的 GTID 集合\n\n-
    传统复制需要记录 binlog 文件和位置，切换时容易出错\n\n- GTID 复制无需记录位置，只需知道 GTID，切换更简单\n\n- 传统复制故障恢复需要手动计算
    binlog 位置\n\n- GTID 复制故障恢复只需跳过指定 GTID，更可靠\n\n- GTID 全局唯一，从库不会重复执行相同的事务\n\n- 传统复制可能因为位置错误导致事务重复执行\n\n-
    可以轻松查看哪些事务已执行，哪些未执行\n\n- 可以轻松跳过错误事务，恢复复制\n\n- MySQL 5.7+ 支持多源复制，GTID 可以区分不同源的事务\n\n-
    简化主从切换和故障恢复\n\n- 提高运维效率\n\n- 减少人为错误\n\n- 主库：gtid_mode = ON，enforce_gtid_consistency
    = ON\n\n- 从库：gtid_mode = ON，enforce_gtid_consistency = ON\n\n- 重启 MySQL 使配置生效\n\n-
    开启 GTID 后，不能使用 sql_slave_skip_counter 跳过错误\n\n- 需要使用 SET GTID_NEXT='xxxx' 跳过指定
    GTID\n\n- GTID 开启后，不能使用非事务引擎（如 MyISAM）\n\n- SHOW SLAVE STATUS 查看 Slave_IO_Running
    和 Slave_SQL_Running\n\n- 查看 Last_Error 和 Last_Error_Number 确认错误信息\n\n- 查看 Executed_Gtid_Set
    确认已执行的 GTID\n\n- 数据不一致：主从数据不一致，导致事务执行失败\n\n- 重复键错误：从库已存在相同数据，导致插入失败\n\n- 外键约束错误：从库外键约束导致事务执行失败\n\n-
    权限错误：从库权限不足导致事务执行失败\n\n- 如果是数据不一致，需要先修复数据\n\n- 使用 pt-table-checksum 检查主从一致性\n\n-
    使用 pt-table-sync 同步主从数据\n\n- 或者手动修复数据，然后跳过错误 GTID\n\n- 如果数据不一致严重，考虑重建从库\n\n- 使用
    mysqldump 或 XtraBackup 备份主库\n\n- 导入从库，然后启动复制\n\n- 监控 Slave_IO_Running 和 Slave_SQL_Running\n\n-
    监控 Seconds_Behind_Master\n\n- 监控 Executed_Gtid_Set 增长情况\n\n- 使用 pt-table-checksum
    定期检查\n\n- 建立告警机制，及时发现不一致\n\n- 避免在从库上直接修改数据\n\n- 避免使用非事务引擎（如 MyISAM）\n\n- 避免在从库上执行
    DDL 语句\n\n- 明确 GTID 复制中断的处理流程\n\n- 准备常用 SQL 脚本（如跳过 GTID 脚本）\n\n- 定期演练，确保熟练掌握\n\n-
    如果需要跳过多个 GTID，可以写脚本批量处理\n\n- 使用存储过程自动化处理\n\n- 定期清理已执行的 GTID：PURGE BINARY LOGS
    BEFORE 'date'\n\n- 或者设置 expire_logs_days 自动清理\n\n- 使用 Prometheus + Grafana 监控
    GTID 复制状态\n\n- 设置告警规则，及时发现问题\n\n- 部署在独立服务器上\n\n- 负责监控主库状态\n\n- 负责协调主从切换流程\n\n-
    单点故障风险，建议部署多个 Manager（使用 VIP 或 Keepalived）\n\n- 部署在每个 MySQL 服务器上（主库和从库）\n\n- 负责执行具体操作（如停止复制、提升主库、同步差异

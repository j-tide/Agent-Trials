    磁盘优化：使用 SSD 磁盘，提升性能\n\n- 参数优化：调整 group_replication_flow_control_mode 等参数\n\n-
    MGR 性能较传统主从复制低（因为 Paxos 协议开销）\n\n- 多主模式下，应用层需要避免冲突（如基于用户 ID 分片写入）\n\n- 网络分区时，可能导致脑裂（需要配置

    监控节点之间的网络连接\n\n- 监控 MGR 组成员状态\n\n- 设置告警规则，及时发现网络分区\n\n- 定期测试网络分区场景，验证 MGR 的容错能力\n\n-
    模拟节点故障，验证自动故障转移\n\n- 部署一个仲裁节点（不存储数据，只参与投票）\n\n- 避免偶数个节点导致无法达成共识\n\n- 调整 group_replication_member_expel_timeout，设置合理的超时时间\n\n-
    避免网络抖动导致节点被踢出组\n\n- 节点部署在不同可用区，避免单点故障\n\n- 确保可用区之间网络稳定\n\n- 原理：在应用代码中，根据操作类型（读/写）选择连接不同的数据库\n\n-
    优点：简单直接，无需额外组件\n\n- 缺点：代码侵入性强，难以维护，无法动态调整\n\n- 原理：使用数据库中间件，自动路由读写请求\n\n- 优点：对应用透明，易于维护，支持动态调整\n\n-
    缺点：引入额外组件，增加复杂度\n\n- 专门为 MySQL 设计的高性能代理\n\n- 支持读写分离、负载均衡、连接池\n\n- 支持查询缓存、查询重写\n\n-
    支持动态配置，无需重启\n\n- Hostgroup：将数据库实例分组（如主库组、从库组）\n\n- Query Rules：定义查询路由规则（如 SELECT
    路由到从库组）\n\n- Scheduler：定期检查数据库实例状态\n\n- Query Cache：缓存查询结果\n\n- 分库分表中间件，支持读写分离\n\n-

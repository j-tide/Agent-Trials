    测试主库连接\n\n- SHOW SLAVE STATUS 检查从库复制状态\n\n- SHOW PROCESSLIST 检查 MySQL 进程\n\n-
    Manager 进程挂了：重启 Manager\n\n- SSH 连接失败：检查 SSH 配置，修复网络\n\n- 从库复制中断：修复复制，然后重试切换\n\n-
    VIP 绑定失败：检查 VIP 配置，手动绑定\n\n- 差异 binlog 同步失败：手动同步差异 binlog\n\n- 选择 relay log 执行位置最新的从库\n\n-
    或者选择 GTID 最新的从库（如果使用 GTID）\n\n- 更新应用配置，连接新主库\n\n- 或者通过 DNS 切换\n\n- SHOW MASTER
    STATUS 查看新主库状态\n\n- SHOW SLAVE STATUS 查看从库复制状态\n\n- 应用层测试读写操作\n\n- MGR 基于 Paxos
    协议实现组通信\n\n- 所有节点组成一个组，通过 Paxos 协议通信\n\n- 组成员管理：节点加入、退出、故障检测\n\n- 本地阶段：主库执行事务，写入
    binlog\n\n- 准备阶段：主库将事务发送给组内所有节点\n\n- 共识阶段：通过 Paxos 协议，所有节点对事务达成共识\n\n- 提交阶段：所有节点提交事务\n\n-
    多主模式下，MGR 会检测事务冲突\n\n- 如果检测到冲突，回滚其中一个事务\n\n- 基于主键和唯一键检测冲突\n\n- 组内节点数量：最少 3 个节点（建议奇数个）\n\n-
    节点加入：新节点加入组，同步数据\n\n- 节点退出：节点故障或主动退出，组自动调整\n\n- 主库选举：单主模式下，自动选举新主库\n\n- Paxos

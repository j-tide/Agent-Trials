    查看节点日志，确认分区情况\n\n- 根据节点权重（group_replication_member_weight）选择主分区\n\n- 或者选择节点数量多的分区作为主分区\n\n-
    或者手动指定一个分区作为主分区\n\n- SELECT * FROM performance_schema.replication_group_members
    查看组成员状态\n\n- 检查数据一致性\n\n- 测试读写操作\n\n- 设置 group_replication_member_weight，让重要节点权重高\n\n-

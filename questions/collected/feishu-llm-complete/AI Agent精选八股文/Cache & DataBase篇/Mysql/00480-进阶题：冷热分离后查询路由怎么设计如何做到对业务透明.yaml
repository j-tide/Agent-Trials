    - 应用层同时写新旧两套库

    - 读请求仍然走旧库

    - 异步校验新旧库数据一致性

    - 确认新旧库数据一致后，按用户比例逐步切换读流量（10%→50%→100%）

    - 监控新库性能和错误率

    - 异常时快速回滚到旧库

    - 读流量全部切换到新库后，观察一段时间

    - 确认无问题后，下线旧库

    - 无需修改应用代码

    - 实时同步，延迟低

    - 支持数据校验和对比

    - 搭建Canal监听旧库

    - 全量导出存量数据到新库

    - Canal实时同步增量数据

    - 校验数据一致性后切流量

    - 存量数据：全量导出到新分片

    - 增量数据：Canal同步Binlog

    - 灰度切流：按租户逐步切换，每个租户观察24小时

    - 双写方案：应用层双写，按userId哈希路由

    - 数据校验：实时对比新旧库，差异<0.1%后切读

    - 时间维度：最近 N 天访问 = 热数据（如 7 天）

    - 频率维度：访问次数 > 阈值 = 热数据（如日访问>10 次）

    - 业务维度：付费用户数据 = 热，普通用户 = 冷

    - 实现：Redis ZSET 记录访问时间戳，定时任务扫描判定

    - 热→温：定时任务扫描 ZSET，30 天无访问→导出到温层→删除热层

    - 温→冷：类似逻辑，90 天无访问→压缩归档到对象存储

    - 冷→热：查询穿透时异步加载回热层（Lazy Load）

    - 会话记忆：热层存最近 50 条消息（Redis List），冷层归档全量（S3）

    - 知识库：热文档放 ES SSD，冷文档放 S3+Glacier，查询时按需加载

    - Embedding 缓存：热缓存 Redis，冷缓存 PostgreSQL + pgvector

    - LRU（Least Recently Used）：最近最少使用，淘汰最久未访问的数据

    - LFU（Least Frequently Used）：最不经常使用，淘汰访问次数最少的数据

    - Key：数据ID

    - Score：热度评分（或访问时间戳）

    - 定时任务扫描ZSET，按score排序判定热度

    - 记录最近N天的访问次数

    - 每天更新计数器，过期数据自动淘汰

    - 访问时异步更新热度评分

    - 避免影响主业务性能

    - 时间维度：30天内访问=热数据

    - 频率维度：周访问>5次=热数据

    - 业务维度：付费用户文档=热数据

    - 实现：Redis ZSET + 定时任务，每天凌晨更新热度


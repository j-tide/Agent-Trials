    3️⃣ Key Differences

    [嵌入表格未展开]

    - 时间戳：毫秒级，可用69年

    - 机器ID：支持1024台机器

    - 序列号：每毫秒可生成4096个ID

    - 趋势递增：基于时间戳，ID大致按时间递增，对B+树友好

    - 高性能：本地生成，无网络IO

    - 分布式：无需中心化协调

    - 问题：服务器时钟回拨时，可能生成重复ID

    - 解决：检测回拨→等待时钟追上→或使用备用机器ID

    - 无序：随机生成，导致B+树页分裂，插入性能差

    - 过长：36字符，占用存储空间大

    - 不推荐作为数据库主键

    - 数据量中等（<10TB）

    - 查询模式简单（主要是分片键查询）

    - 运维能力强，成本敏感


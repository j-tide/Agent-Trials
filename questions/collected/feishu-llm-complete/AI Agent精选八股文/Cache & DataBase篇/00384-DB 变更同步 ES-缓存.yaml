answer:
  mode: rubric
  reference_answer: "1、基础题：为什么要将数据库变更同步到 Elasticsearch 和缓存？\n\n⭐（同步原因、应用场景）\n\n将数据库变更同步到
    Elasticsearch 和缓存的主要原因：\n\n- 性能优化：\n\n- 读写分离：\n\n- 业务解耦：\n\n- 数据一致性：\n\n2、进阶题：请设计一个数据库变更同步到
    Elasticsearch 和缓存的方案，并说明如何保证数据一致性？\n\n⭐⭐（同步方案设计、数据一致性保证）\n\n1️⃣ Common Answer
    用 Canal 监听 MySQL 的 Binlog，解析变更后发送到 RocketMQ，然后有两个消费者，一个更新 ES，一个更新缓存。如果消费失败就重试，保证最终一致性。\n\n2️⃣
    Impressive Answer 我会设计一个 Canal + RocketMQ + 多消费者 的架构，实现数据库变更实时同步到 ES 和缓存。让我详细讲一下：\n\n整体架构设计\n\n```text\ngraph
    TD\n    A[MySQL Master] -->|Binlog| B[Canal Server]\n    B -->|解析 Binlog| C[RocketMQ
    Topic: canal_order]\n    C -->|消息| D[ES Sync Consumer]\n    C -->|消息| E[Cache
    Sync Consumer]\n    D -->|更新| F[Elasticsearch]\n    E -->|更新| G[Redis Cache]\n
    \   H[订单服务] -->|写入订单| A\n    \n    subgraph Canal Server\n    B\n    end\n    \n
    \   subgraph 消息队列\n    C\n    end\n    \n    subgraph 消费者\n    D\n    E\n    end\n
    \   \n    subgraph 存储系统\n    F\n    G\n    end\n```\n\n核心实现步骤\n\n步骤 1：配置 Canal\n\n```text\n#
    canal.properties\ncanal.serverMode = rocketMQ\ncanal.mq.servers = 127.0.0.1:9876\ncanal.mq.producerGroup
    = canal_producer\ncanal.mq.topic = canal_order\ncanal.mq.partition = 0\ncanal.mq.partitionHash
    = .*\\\\..*:id\n\n# instance.properties\ncanal.instance.master.address=127.0.0.1:3306\ncanal.instance.dbUsername=canal\ncanal.instance.dbPassword=canal\ncanal.instance.connectionCharset=UTF-8\ncanal.instance.filter.regex=shop\\\\.orders\n```\n\n步骤
    2：ES 同步消费者\n\n```text\n@RocketMQMessageListener(topic = \"canal_order\", consumerGroup
    = \"es_sync_group\")\npublic class OrderToEsConsumer implements RocketMQListener<MessageExt>
    {\n    \n    @Autowired\n    private ElasticsearchRestTemplate esTemplate;\n    \n
    \   @Override\n    public void onMessage(MessageExt message) {\n        try {\n
    \           CanalMessage canalMessage = JSON.parseObject(new String(message.getBody()),
    CanalMessage.class);\n            \n            for (CanalEntry.Entry entry :
    canalMessage.getEntries()) {\n                if (entry.getEntryType() == CanalEntry.EntryType.ROWDATA)
    {\n                    CanalEntry.RowChange rowChange = CanalEntry.RowChange.parseFrom(entry.getStoreValue());\n
    \                   String tableName = entry.getHeader().getTableName();\n                    \n
    \                   if (\"orders\".equals(tableName)) {\n                        handleOrderChange(rowChange);\n
    \                   }\n                }\n            }\n            \n        }
    catch (Exception e) {\n            log.error(\"同步订单到 ES 失败\", e);\n            throw
    e;\n        }\n    }\n    \n    private void handleOrderChange(CanalEntry.RowChange
    rowChange) {\n        CanalEntry.EventType eventType = rowChange.getEventType();\n
    \       \n        for (CanalEntry.RowData rowData : rowChange.getRowDatasList())
    {\n            if (eventType == CanalEntry.EventType.INSERT || eventType == CanalEntry.EventType.UPDATE)
    {\n                // 新增或更新订单\n                Order order = parseOrder(rowData.getAfterColumnsList());\n
    \               esTemplate.save(order);\n                \n            } else
    if (eventType == CanalEntry.EventType.DELETE) {\n                // 删除订单\n                Long
    orderId = parseOrderId(rowData.getBeforeColumnsList());\n                esTemplate.delete(orderId,
    Order.class);\n            }\n        }\n    }\n}\n```\n\n步骤 3：缓存同步消费者\n\n```text\n@RocketMQMessageListener(topic
    = \"canal_order\", consumerGroup = \"cache_sync_group\")\npublic class OrderToCacheConsumer
    implements RocketMQListener<MessageExt> {\n    \n    @Autowired\n    private RedisTemplate<String,
    Object> redisTemplate;\n    \n    @Override\n    public void onMessage(MessageExt
    message) {\n        try {\n            CanalMessage canalMessage = JSON.parseObject(new
    String(message.getBody()), CanalMessage.class);\n            \n            for
    (CanalEntry.Entry entry : canalMessage.getEntries()) {\n                if (entry.getEntryType()
    == CanalEntry.EntryType.ROWDATA) {\n                    CanalEntry.RowChange rowChange
    = CanalEntry.RowChange.parseFrom(entry.getStoreValue());\n                    String
    tableName = entry.getHeader().getTableName();\n                    \n                    if
    (\"orders\".equals(tableName)) {\n                        handleOrderChange(rowChange);\n
    \                   }\n                }\n            }\n            \n        }
    catch (Exception e) {\n            log.error(\"同步订单到缓存失败\", e);\n            throw
    e;\n        }\n    }\n    \n    private void handleOrderChange(CanalEntry.RowChange
    rowChange) {\n        CanalEntry.EventType eventType = rowChange.getEventType();\n
    \       \n        for (CanalEntry.RowData rowData : rowChange.getRowDatasList())
    {\n            String orderKey = \"order:\" + parseOrderId(rowData.getAfterColumnsList());\n
    \           \n            if (eventType == CanalEntry.EventType.INSERT || eventType
    == CanalEntry.EventType.UPDATE) {\n                // 新增或更新订单\n                Order
    order = parseOrder(rowData.getAfterColumnsList());\n                redisTemplate.opsForValue().set(orderKey,
    order, 1, TimeUnit.HOURS);\n                \n            } else if (eventType
    == CanalEntry.EventType.DELETE) {\n                // 删除订单\n                redisTemplate.delete(orderKey);\n
    \           }\n        }\n    }\n}\n```\n\n数据一致性保证机制\n\n- 消息幂等性\n\nES 和缓存都使用唯一
    ID 作为主键，天然支持幂等性：\n\n```text\n// ES 使用文档 ID\n@Document(indexName = \"orders\")\npublic
    class Order {\n    @Id\n    private Long id;  // 唯一 ID\n}\n\n// 缓存使用唯一 Key\nString
    orderKey = \"order:\" + orderId;\n```\n\n- 消息重试机制\n\nRocketMQ 自动重试，直到成功或达到最大重试次数：\n\n```text\n//
    消费失败时抛出异常，触发重试\ncatch (Exception e) {\n    log.error(\"同步失败\", e);\n    throw
    e;  // 触发 RocketMQ 重试\n}\n```\n\n- 死信队列处理\n\n重试失败的消息进入死信队列，人工介入处理：\n\n```text\n//
    监听死信队列\n@RocketMQMessageListener(topic = \"%DLQ%canal_order\", consumerGroup =
    \"dlq_handler_group\")\npublic class DlqHandler implements RocketMQListener<MessageExt>
    {\n    \n    @Override\n    public void onMessage(MessageExt message) {\n        //
    人工介入处理死信消息\n        log.error(\"死信消息，需要人工处理，message={}\", message);\n        alertService.sendAlert(\"死信消息：\"
    + message.getMsgId());\n    }\n}\n```\n\n- 数据一致性校验\n\n定时任务校验 DB、ES、缓存的数据一致性：\n\n```text\n@Component\npublic
    class DataConsistencyCheck {\n    \n    @Scheduled(cron = \"0 0 2 * * ?\")  //
    每天凌晨 2 点执行\n    public void checkConsistency() {\n        // 1. 查询 DB 中的订单\n        List<Order>
    dbOrders = orderMapper.selectAll();\n        \n        // 2. 查询 ES 中的订单\n        List<Order>
    esOrders = esTemplate.searchForList(Query.findAll(), Order.class);\n        \n
    \       // 3. 查询缓存中的订单\n        List<Order> cacheOrders = new ArrayList<>();\n
    \       for (Order order : dbOrders) {\n            String orderKey = \"order:\"
    + order.getId();\n            Order cacheOrder = (Order) redisTemplate.opsForValue().get(orderKey);\n
    \           if (cacheOrder != null) {\n                cacheOrders.add(cacheOrder);\n
    \           }\n        }\n        \n        // 4. 比对数据一致性\n        List<Order>
    inconsistentOrders = findInconsistentOrders(dbOrders, esOrders, cacheOrders);\n
    \       \n        // 5. 修复不一致数据\n        for (Order order : inconsistentOrders)
    {\n            fixInconsistentOrder(order);\n        }\n    }\n}\n```\n\n异常场景处理\n\n[嵌入表格未展开]\n\n性能优化建议\n\n-
    批量消费：设置 consumeMessageBatchMaxSize=10，批量消费消息\n\n- 异步消费：使用 @RocketMQMessageListener(consumeMode
    = ConsumeMode.CONCURRENTLY) 并发消费\n\n- ES 批量写入：使用 esTemplate.saveAll() 批量写入 ES\n\n-
    缓存批量更新：使用 redisTemplate.opsForValue().multiSet() 批量更新缓存\n\n- 消息分区：按订单 ID 分区，保证同一订单的消息顺序性\n\n```text\n//
    批量消费配置\n@RocketMQMessageListener(\n    topic = \"canal_order\",\n    consumerGroup
    = \"es_sync_group\",\n    consumeMode = ConsumeMode.CONCURRENTLY,\n    consumeThreadMax
    = 10  // 最大消费线程数\n)\n```\n\n监控告警指标\n\n- Canal 延迟：监控 Canal 消费 Binlog 的延迟时间\n\n-
    ES 同步延迟：监控消息从 MQ 到 ES 的延迟时间\n\n- 缓存同步延迟：监控消息从 MQ 到缓存的延迟时间\n\n- 同步失败率：监控 ES 和缓存同步失败的次数\n\n-
    数据一致性：定时比对 DB、ES、缓存的数据一致性\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n3、场景题：在电商系统中，订单状态变更后需要实时更新缓存，如何保证缓存和数据库的一致性？\n\n⭐⭐⭐（缓存一致性、实战场景）\n\n1️⃣
    Common Answer 用 Canal 监听订单表的变更，状态变更后发送消息到 MQ，消费者更新缓存。如果缓存更新失败就重试，保证最终一致性。\n\n2️⃣
    Impressive Answer 订单状态变更的缓存一致性是一个经典问题，我会用 Canal + Redis + 延迟双删 的方案来保证强一致性。让我详细设计一下：\n\n场景需求分析\n\n-
    订单状态变更（如待支付 → 已支付 → 已发货）需要实时更新缓存\n\n- 用户查询订单时优先从缓存读取，缓存不存在时从 DB 读取并回写缓存\n\n- 需要保证缓存和数据库的强一致性，避免用户看到过期数据\n\n整体架构设计\n\n```text\nsequenceDiagram\n
    \   participant User as 用户\n    participant Order as 订单服务\n    participant DB
    as MySQL\n    participant Canal as Canal Server\n    participant MQ as RocketMQ\n
    \   participant Consumer as 缓存消费者\n    participant Cache as Redis Cache\n    \n
    \   User->>Order: 1. 更新订单状态\n    Order->>DB: 2. UPDATE orders SET status='PAID'
    WHERE id=1001\n    DB-->>Order: 3. 更新成功\n    DB->>Canal: 4. Binlog 事件\n    Canal->>MQ:
    5. 发送消息\n    MQ->>Consumer: 6. 消费消息\n    Consumer->>Cache: 7. 延迟双删<br/>先删除缓存\n
    \   Consumer->>Cache: 8. 延迟 500ms 后<br/>再次删除缓存\n    Cache-->>Consumer: 9. 删除成功\n
    \   Order-->>User: 10. 返回更新成功\n    \n    Note over User,Cache: 用户下次查询时<br/>从 DB
    读取最新数据<br/>并回写缓存\n```\n\n核心实现步骤\n\n步骤 1：配置 Canal 监听订单表\n\n```text\n# instance.properties\ncanal.instance.master.address=127.0.0.1:3306\ncanal.instance.dbUsername=canal\ncanal.instance.dbPassword=canal\ncanal.instance.connectionCharset=UTF-8\ncanal.instance.filter.regex=shop\\\\.orders
    \ # 只监听订单表\n```\n\n步骤 2：缓存更新消费者（延迟双删）\n\n```text\n@RocketMQMessageListener(topic
    = \"canal_order\", consumerGroup = \"cache_sync_group\")\npublic class OrderCacheConsumer
    implements RocketMQListener<MessageExt> {\n    \n    @Autowired\n    private RedisTemplate<String,
    Object> redisTemplate;\n    \n    @Autowired\n    private OrderMapper orderMapper;\n
    \   \n    @Override\n    public void onMessage(MessageExt message) {\n        try
    {\n            CanalMessage canalMessage = JSON.parseObject(new String(message.getBody()),
    CanalMessage.class);\n            \n            for (CanalEntry.Entry entry :
    canalMessage.getEntries()) {\n                if (entry.getEntryType() == CanalEntry.EntryType.ROWDATA)
    {\n                    CanalEntry.RowChange rowChange = CanalEntry.RowChange.parseFrom(entry.getStoreValue());\n
    \                   String tableName = entry.getHeader().getTableName();\n                    \n
    \                   if (\"orders\".equals(tableName)) {\n                        handleOrderChange(rowChange);\n
    \                   }\n                }\n            }\n            \n        }
    catch (Exception e) {\n            log.error(\"更新缓存失败\", e);\n            throw
    e;\n        }\n    }\n    \n    private void handleOrderChange(CanalEntry.RowChange
    rowChange) {\n        CanalEntry.EventType eventType = rowChange.getEventType();\n
    \       \n        for (CanalEntry.RowData rowData : rowChange.getRowDatasList())
    {\n            Long orderId = parseOrderId(rowData.getAfterColumnsList());\n            String
    orderKey = \"order:\" + orderId;\n            \n            if (eventType == CanalEntry.EventType.UPDATE)
    {\n                // 更新订单，执行延迟双删\n                delayedDoubleDelete(orderId,
    orderKey);\n                \n            } else if (eventType == CanalEntry.EventType.DELETE)
    {\n                // 删除订单，直接删除缓存\n                redisTemplate.delete(orderKey);\n
    \           }\n        }\n    }\n    \n    private void delayedDoubleDelete(Long
    orderId, String orderKey) {\n        // 第一次删除缓存\n        redisTemplate.delete(orderKey);\n
    \       log.info(\"第一次删除缓存成功，orderId={}\", orderId);\n        \n        // 延迟
    500ms 后第二次删除缓存\n        ScheduledExecutorService scheduler = Executors.newSingleThreadScheduledExecutor();\n
    \       scheduler.schedule(() -> {\n            try {\n                // 第二次删除缓存\n
    \               redisTemplate.delete(orderKey);\n                log.info(\"第二次删除缓存成功，orderId={}\",
    orderId);\n            } catch (Exception e) {\n                log.error(\"第二次删除缓存失败，orderId={}\",
    orderId, e);\n            }\n        }, 500, TimeUnit.MILLISECONDS);\n    }\n}\n```\n\n步骤
    3：订单查询接口（Cache Aside 模式）\n\n```text\n@Service\npublic class OrderService {\n    \n
    \   @Autowired\n    private OrderMapper orderMapper;\n    \n    @Autowired\n    private
    RedisTemplate<String, Object> redisTemplate;\n    \n    public Order getOrderById(Long
    orderId) {\n        String orderKey = \"order:\" + orderId;\n        \n        //
    1. 先查缓存\n        Order order = (Order) redisTemplate.opsForValue().get(orderKey);\n
    \       \n        if (order != null) {\n            log.info(\"缓存命中，orderId={}\",
    orderId);\n            return order;\n        }\n        \n        // 2. 缓存不存在，查数据库\n
    \       log.info(\"缓存未命中，查询数据库，orderId={}\", orderId);\n        order = orderMapper.selectById(orderId);\n
    \       \n        if (order != null) {\n            // 3. 回写缓存\n            redisTemplate.opsForValue().set(orderKey,
    order, 1, TimeUnit.HOURS);\n            log.info(\"回写缓存成功，orderId={}\", orderId);\n
    \       }\n        \n        return order;\n    }\n}\n```\n\n为什么需要延迟双删？\n\n延迟双删是为了解决并发读写导致的数据不一致问题：\n\n```text\nsequenceDiagram\n
    \   participant Thread1 as 线程1（写）\n    participant DB as 数据库\n    participant
    Cache as 缓存\n    participant Thread2 as 线程2（读）\n    \n    Thread1->>DB: 1. 更新
    DB（status=PAID）\n    Thread1->>Cache: 2. 删除缓存\n    Thread2->>Cache: 3. 查询缓存（未命中）\n
    \   Thread2->>DB: 4. 查询 DB（status=PAID）\n    DB-->>Thread2: 5. 返回 PAID\n    Thread2->>Cache:
    6. 回写缓存（status=PAID）\n    Note over Thread1,Thread2: 此时缓存和 DB 一致\n    \n    Thread1->>Cache:
    7. 延迟双删<br/>第二次删除缓存\n    Note over Thread1,Thread2: 此时缓存被删除<br/>下次查询时会重新回写\n```\n\n如果没有延迟双删，可能出现以下问题：\n\n-
    线程 1 更新 DB（status=PAID）\n\n- 线程 1 删除缓存\n\n- 线程 2 查询缓存（未命中）\n\n- 线程 2 查询 DB（status=PAID）\n\n-
    线程 2 回写缓存（status=PAID）\n\n- 此时缓存和 DB 一致\n\n但如果线程 1 的 Canal 消息消费延迟，可能出现：\n\n- 线程
    1 更新 DB（status=PAID）\n\n- 线程 1 删除缓存\n\n- 线程 2 查询缓存（未命中）\n\n- 线程 2 查询 DB（status=PAID）\n\n-
    线程 2 回写缓存（status=PAID）\n\n- 线程 1 的 Canal 消息消费成功，删除缓存\n\n- 此时缓存被删除，下次查询时会重新回写\n\n延迟双删可以保证在
    Canal 消息消费期间，如果其他线程查询了 DB 并回写了缓存，延迟双删会再次删除缓存，确保下次查询时获取最新数据。\n\n异常场景处理\n\n[嵌入表格未展开]\n\n监控告警指标\n\n-
    Canal 延迟：监控 Canal 消费 Binlog 的延迟时间\n\n- 缓存更新延迟：监控消息从 MQ 到缓存的延迟时间\n\n- 缓存命中率：监控缓存的命中率\n\n-
    数据一致性：定时比对 DB 和缓存的数据一致性\n\n性能优化建议\n\n- 批量删除缓存：使用 redisTemplate.delete(keys) 批量删除缓存\n\n-
    异步删除：使用线程池异步执行延迟双删\n\n- 缓存预热：系统启动时预热热点订单数据\n\n- 缓存分区：按订单 ID 分区缓存，提升查询性能\n\n```text\n//
    批量删除缓存\npublic void batchDeleteCache(List<Long> orderIds) {\n    List<String>
    keys = orderIds.stream()\n        .map(orderId -> \"order:\" + orderId)\n        .collect(Collectors.toList());\n
    \   redisTemplate.delete(keys);\n}\n```\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n4、容易一起考的题\n\n[嵌入表格未展开]\n\n-
    Elasticsearch 支持全文搜索、复杂查询，查询性能远高于 MySQL\n\n- 缓存（Redis）读取速度极快，可以减轻数据库压力\n\n- MySQL
    用于写操作（OLTP）\n\n- Elasticsearch 用于读操作（OLAP）\n\n- 缓存用于热点数据读取\n\n- 数据库变更后自动同步到 ES
    和缓存，业务代码无需关心同步逻辑\n\n- 避免业务代码中耦合同步逻辑\n\n- 通过 CDC（Canal）实时同步，保证数据一致性\n\n- 避免定时同步带来的数据延迟"

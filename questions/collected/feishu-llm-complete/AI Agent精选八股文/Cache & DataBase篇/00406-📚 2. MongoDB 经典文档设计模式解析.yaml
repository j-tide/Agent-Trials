answer:
  mode: rubric
  reference_answer: |-
    这六种模式是在大量实践中沉淀下来的“套路”，用来解决特定场景下的存储和性能问题。

    代码示例：Bucket Pattern 如何存储传感器数据

    ```javascript
    // 每分钟一条的温度数据，打包成每小时一个文档
    {
      "_id": "sensor_01_20260705_10",
      "sensor_id": "sensor_01",
      "bucket_start": ISODate("2026-07-05T10:00:00Z"),
      "bucket_end": ISODate("2026-07-05T10:59:59Z"),
      "sample_count": 60,
      "avg_temp": 25.3,
      "min_temp": 23.1,
      "max_temp": 28.4,
      "temperatures": [
        { "ts": ISODate("..."), "val": 25.1 },
        { "ts": ISODate("..."), "val": 25.2 },
        // ... 60条
      ]
    }
    ```

    这样，一天 1440 条数据被压缩成 24 个文档。查询某小时的温度趋势只需一次磁盘 IO，而不是 60 次。avg_temp 等预计算字段让统计查询瞬间完成。


content:
  prompt: "\U0001F527 2. MongoDB 的聚合管道（Aggregation Pipeline）怎么用？有哪些常用阶段？"
answer:
  mode: rubric
  reference_answer: "聚合管道是 MongoDB 的数据处理流水线，它借鉴了 Unix 命令行的管道思想：文档从一端流入，依次经过多个处理阶段，每个阶段对数据做一次变换，最终输出你想要的结果。\n\n[图片内容未导入]\n\n常用阶段速查表：\n\n实战示例：从一个用户订单集合中，统计每个用户的消费总额，并按金额降序排列。\n\n```javascript\ndb.orders.aggregate([\n
    \   // 阶段 1: 过滤，只看已完成订单\n    { $match: { status: \"completed\" } },\n    \n    //
    阶段 2: 分组，按 user_id 分组，计算总金额和订单数\n    { $group: {\n        _id: \"$user_id\",\n
    \       totalAmount: { $sum: \"$amount\" },\n        orderCount: { $sum: 1 }\n
    \   }},\n    \n    // 阶段 3: 排序，按总金额降序\n    { $sort: { totalAmount: -1 } },\n    \n
    \   // 阶段 4: 限制，只取前 10 名\n    { $limit: 10 },\n    \n    // 阶段 5: 投影，美化输出\n    {
    $project: {\n        _id: 0,\n        userId: \"$_id\",\n        totalAmount:
    1,\n        orderCount: 1,\n        avgAmount: { $divide: [\"$totalAmount\", \"$orderCount\"]
    }\n    }}\n])\n```\n\n$lookup 示例：关联用户表，补全用户姓名\n\n```javascript\ndb.orders.aggregate([\n
    \   { $match: { status: \"completed\" } },\n    { $group: {\n        _id: \"$user_id\",\n
    \       totalAmount: { $sum: \"$amount\" }\n    }},\n    // 左连接 users 集合\n    {
    $lookup: {\n        from: \"users\",\n        localField: \"_id\",\n        foreignField:
    \"_id\",\n        as: \"user\"\n    }},\n    // unwind 将数组展开为对象\n    { $unwind:
    \"$user\" },\n    { $project: {\n        _id: 0,\n        userId: \"$_id\",\n
    \       userName: \"$user.name\",\n        totalAmount: 1\n    }}\n])\n```\n\n$facet
    示例：同时做多个维度的统计，互不干扰\n\n```javascript\ndb.products.aggregate([\n    { $facet: {\n
    \       \"priceStats\": [\n            { $group: { _id: null, avgPrice: { $avg:
    \"$price\" } } }\n        ],\n        \"categoryCount\": [\n            { $group:
    { _id: \"$category\", count: { $sum: 1 } } }\n        ],\n        \"top5Expensive\":
    [\n            { $sort: { price: -1 } },\n            { $limit: 5 }\n        ]\n
    \   }}\n])\n// 一次查询同时返回三组结果，适合 Dashboard 场景\n```\n\n性能优化提示：\n\n- $match 和 $sort
    尽量放在管道最前面，利用索引快速削减数据量。\n\n- $group 前尽量用 $match 减少进入分组的数据。\n\n- 使用 allowDiskUse:
    true 允许 MongoDB 在处理超大聚合时使用磁盘临时空间，避免内存不足错误。\n\n---"

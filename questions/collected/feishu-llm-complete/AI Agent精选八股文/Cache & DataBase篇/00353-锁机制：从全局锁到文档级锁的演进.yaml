    难度级别：⭐⭐~⭐⭐⭐⭐（意向锁、乐观并发控制、db.currentOp）

    基础题：MongoDB 的锁粒度是什么级别？

    MongoDB 3.0+ 使用 WiredTiger 存储引擎，锁粒度为文档级锁（Document-Level Locking）。

    - 3.0 之前：全局锁（Global Lock），整个数据库被锁定

    - 3.0-3.2：数据库级锁（Database-Level Locking）

    - 3.2+：文档级锁，支持并发读写

    进阶题：意向锁（IS/IX）的作用是什么？WiredTiger 的乐观并发控制如何工作？如何用 db.currentOp() 排查锁等待？

    1️⃣ Common Answer

    意向锁是为了提高并发吧，乐观并发就是不加锁先执行。db.currentOp 能看当前操作。

    2️⃣ Impressive Answer

    MongoDB 锁机制从全局锁演进到文档级锁，核心机制包括：

    - 意向锁（IS/IX）

    - WiredTiger 乐观并发控制

    - db.currentOp() 排查锁等待

    - Agent 场景应用

    3️⃣ Key Differences


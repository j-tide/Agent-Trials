    难度级别：⭐⭐⭐（Hash结构+计数器、Lua脚本、粗粒度vs细粒度、锁竞争优化）

    1️⃣ Common Answer

    Redisson 的可重入锁用 Hash 结构存储，key 是锁名，field 是线程 ID，value 是计数器。加锁时计数器加 1，解锁时减 1，减到 0 才删除锁。锁粒度就是锁的范围，粗粒度锁锁的范围大，细粒度锁锁的范围小。根据业务需求选择合适的粒度。

    2️⃣ Impressive Answer

    Redisson 可重入锁的核心是Hash 结构 + 计数器 + Lua 脚本，锁粒度设计需要平衡并发控制和性能：


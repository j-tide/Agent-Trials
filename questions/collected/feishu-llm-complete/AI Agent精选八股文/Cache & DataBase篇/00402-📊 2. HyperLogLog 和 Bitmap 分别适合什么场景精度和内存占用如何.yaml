content:
  prompt: "\U0001F4CA 2. HyperLogLog 和 Bitmap 分别适合什么场景？精度和内存占用如何？"
answer:
  mode: rubric
  reference_answer: |-
    这两者都是用极小内存处理海量数据的“极端利器”，但它们解决的根本不是一类问题。

    - HyperLogLog 解决的是“有多少”，且允许模糊。

    - Bitmap 解决的是“谁是什么状态”，要求精确。

    HyperLogLog：概率统计的巅峰之作

    它基于概率算法，能够在固定 12KB 的内存里，统计超过 2^64 个不同元素的近似基数，标准误差仅为 0.81%。它不需要存储具体元素，只存储哈希后的概率标记。在 Agent 系统中，它是统计海量日志、用户行为的最佳选择。

    Bitmap：极致的精确布尔索引

    它本质上是一个巨大的二进制位数组。每一位代表一个个体（如用户 ID）的某个布尔状态（0 或 1）。它占用的内存取决于最大 ID 值，与活跃用户数无关。只要你的 ID 是连续的数字，Bitmap 就能在极低内存下提供 100% 精确的布尔统计。

    场景决策指南：

    [嵌入表格未展开]

    内存占用估算对比：

    # HyperLogLog 内存：永远固定
    print("HLL 固定内存: 12KB")

    # Bitmap 内存：取决于最大 ID 值
    def bitmap_memory(max_user_id):
        return max_user_id / 8 / 1024 / 1024  # 转为 MB

    print(f"最大 ID 100万: {bitmap_memory(1000000):.2f} MB")
    print(f"最大 ID 1亿: {bitmap_memory(100000000):.2f} MB")

    在 Agent 场景的实战应用：

    比如你做一个智能客服 Agent，想统计每天有多少独立用户触发了“退款”意图。用 HyperLogLog 一行命令就能搞定，且无需存储任何用户隐私数据。但如果你需要精确知道用户 ID 为 9527 的这个人今天是否触发过，就必须用 Bitmap，因为它能精确到每一个 bit。


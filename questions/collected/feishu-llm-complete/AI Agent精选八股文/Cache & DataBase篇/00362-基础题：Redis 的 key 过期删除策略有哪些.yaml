content:
  prompt: 1、基础题：Redis 的 key 过期删除策略有哪些？
answer:
  mode: rubric
  reference_answer: |-
    难度：⭐⭐（惰性删除、定期删除、主动扫描） 直接给答案：

    - 惰性删除：访问key时检查是否过期，过期则删除。CPU友好但内存不友好（过期key不访问就不删）

    - 定期删除：每隔100ms随机抽取部分设置了过期时间的key检查删除。平衡CPU和内存

    - Redis同时使用两种策略：定期删除兜底，惰性删除精确清理

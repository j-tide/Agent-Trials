content:
  prompt: 8.面对大模型对工具调用的“幻觉”（如调用不存在的工具或错误传参），你会设计怎样的容错与自纠偏机制？
answer:
  mode: rubric
  reference_answer: |-
    ### 一、预校验层：拦截明显错误的调用

    在模型输出工具调用请求后、实际执行前，进行强校验。

    - 工具存在性校验
    维护工具名白名单，若模型请求的工具名不在其中，直接拒绝并返回错误信息：
    “工具 'xxx' 不存在，可用工具：A, B, C”

    - 参数 Schema 校验
    使用 JSON Schema 校验参数类型、必填项、枚举值、正则格式等。不符合则拒绝，并告知具体错误原因（如缺少 date 参数，或 unit 值不在 ["celsius","fahrenheit"] 中）。

    - 语义合理性校验
    例如：温度范围 -50~50，日期不能是过去/未来，价格不能为负数等。超出合理范围则拒绝。

    目的：不让错误调用进入执行层，减少无效资源消耗。

    ---

    ### 二、反馈修正层：让模型自我纠正

    将预校验失败的错误信息注入对话历史，让模型看到错误并重新生成正确的调用。

    - 错误消息结构化
    以 system 或 user 角色追加一条消息，内容清晰指出错误及修正建议：

    - 限制修正次数
    同一错误最多允许自纠偏 2 次。若第 3 次仍错误，则放弃修正，进入回退层。

    - 少样本纠偏提示
    在系统提示词中预置示例：

    目的：利用大模型的上下文学习能力，使其从错误中学习并自我修正。

    ---

    ### 三、容错执行层：提高调用成功率

    即使参数基本正确，实际执行仍可能因网络、业务逻辑等临时问题失败。此时采用容错策略：

    - 参数自动修复
    对常见错误模式进行智能转换：

    - 指数退避重试
    对于临时性故障（如超时、服务繁忙），重试最多 3 次：第 1 次等待 1 秒，第 2 次 2 秒，第 3 次 4 秒。

    - 部分降级执行
    如果只有部分参数错误，忽略错误参数，用有效参数执行。例如搜索工具多传了无用字段，直接过滤掉。

    目的：尽可能让调用成功，避免因小错误导致整个任务失败。

    ---

    ### 四、兜底回退层：保证系统不崩溃

    当预校验、修正、容错全部失败时，必须有安全的回退策略：

    - 默认回答
    针对常见任务返回预设模板：

    - 切换为纯文本回答
    放弃工具调用，仅基于模型自身知识回答（即使不精确），并提示用户：“系统无法调用相关工具，以下为基于内部知识的回答。”

    - 人工接管或日志上报
    在生产环境中，将无法处理的幻觉案例记录到监控系统，供开发者分析并优化工具描述或校验规则。

    目的：避免无限循环、崩溃或向用户暴露技术错误。

    ---

    ### 整体流程示意

    模型输出工具调用
           ↓
    [预校验] → 通过 → [容错执行] → 成功 → 返回结果
           ↓不通过              ↓失败
    [反馈修正] → 重试(最多2次) → 仍失败
           ↓
    [兜底回退] → 返回默认回答或纯文本答案

    ---

    ### 总结

    这套机制的核心思想是：不信任模型一次正确，但给予充分的反馈和修正机会。预校验挡住“无中生有”的幻觉，反馈修正让模型自我纠偏，容错执行处理边缘情况，兜底回退保证系统鲁棒性。在实际工程中，可先实现预校验 + 反馈修正（效果最明显），再逐步增加重试和自动修复功能。

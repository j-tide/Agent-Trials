  prompt: 3.如何理解Agent的“记忆”机制？请区分短期记忆、长期记忆在工作流中的不同实现方式。
answer:
  mode: rubric
  reference_answer: |-
    ### 一、记忆机制的本质理解

    Agent的“记忆”是指存储和检索历史信息的能力，用于支持多轮对话、任务连续性、知识复用和决策优化。它模拟了人类的记忆系统，分为短期记忆（工作记忆）和长期记忆（持久存储）。

    ---

    ### 二、短期记忆与长期记忆的核心区别

    [嵌入表格未展开]

    ---

    ### 三、短期记忆的实现方式

    短期记忆主要用于保持当前任务的连贯性。

    [嵌入表格未展开]

    关键设计点：

    - 需要控制token消耗，避免超出模型限制。

    - 可结合摘要技术：当窗口溢出时，对早期对话生成压缩摘要，保留关键信息。

    ---

    ### 四、长期记忆的实现方式

    长期记忆用于跨会话复用知识和经验。

    [嵌入表格未展开]

    典型长期记忆工作流：

    - 写入：每轮任务结束后，将关键信息（用户偏好、成功的工具调用序列）向量化并存入向量库。

    - 读取：新会话开始时，根据用户输入检索相关记忆，拼接到提示词中。

    - 更新：当信息发生变化时，支持覆盖或版本管理。

    ---

    ### 五、工作流中的协同使用（示例）

    短期记忆（当前会话）：

    - 存储用户刚说的这句话，以及Agent的初步回复。

    长期记忆（跨会话）：

    - 从向量数据库中检索到“昨天用户上传了销售表.csv，上次生成了按月份的趋势图”。

    - Agent据此知道“上次那个销售表”指的是哪个文件，以及用户偏好的图表类型。

    协同流程：

    text

    用户输入 → 检索长期记忆 → 得到“销售表.csv”和“偏好折线图” → 存入短期记忆（当前上下文） → Agent推理：需要读取文件并生成图表 → 行动：调用read_csv和plot工具 → 结果存入短期记忆 → 同时将本次交互的关键元数据更新到长期记忆

    ---

    ### 六、工程实现注意事项

    [嵌入表格未展开]

    ---

    ### 七、总结

    [嵌入表格未展开]

    Agent的智能程度很大程度上取决于记忆机制的设计——短期记忆保证任务执行流畅，长期记忆让Agent“越用越聪明”。两者结合，才能构建出真正有连续学习能力的自主Agent。

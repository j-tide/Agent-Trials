answer:
  mode: rubric
  reference_answer: |-
    T-A-O 指的就是 Thought → Action → Observation 这个三步呼吸：

    [图片内容未导入]

    与纯 CoT 的本质区别：

    CoT 是“一个人在屋里凭空想”，ReAct 是“一个人走到街上，边看边想边问”。CoT 不能改变自己已知的信息集，而 ReAct 通过 Action/Observation 不断扩展这个信息集，每一步的思考都建立在更坚实的现实地基上。

    工程中高频踩坑点及应对：

    - 模型不按格式出牌：输出的 Thought/Action 字段拼写错误、JSON 结构畸形。
    方案：用结构化输出（Function Calling / JSON Mode）强制格式；或写极严的正则解析；解析失败时把报错信息喂回给模型让它重试。

    - Action 参数幻觉：工具要求 city 参数，模型填了 "beijing"，但正确格式是 "Beijing"。
    方案：在工具描述中对参数格式给出强约束（大小写、枚举值），并做参数清洗。

    - 陷入“思考-空转”：模型一直输出 Thought，就是不调用 Action，或者 Action=FINISH 太仓促。
    方案：设置最大步数；在 prompt 中明确“如果你已经知道答案，立刻 FINISH”。

    - 上下文爆炸：Observation 返回的数据极长（如网页全文），几轮后就超出 Token 限制。
    方案：工具侧做摘要截断；Agent 端定期压缩旧历史，仅保留最近几轮的完整记录。


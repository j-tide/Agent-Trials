    1、基础题：什么是多 Agent 系统中的工具池（Tool Pool）？

    难度级别：⭐（工具池概念、集中注册、工具共享）

    工具池是多 Agent 系统共享工具的基础设施，把所有工具集中注册在一个 Tool Registry 里，包含工具的元数据（描述、参数、权限要求）。Agent 启动时从 Tool Registry 发现自己可用的工具，而不是硬编码工具列表，工具更新时所有 Agent 能自动感知。

    ---

    2、进阶题：多 Agent 场景下的工具共享与权限隔离应该如何设计？

    难度级别：⭐⭐⭐（工具池设计、RBAC、沙箱隔离、审计监控）

    1️⃣ Common Answer

    多 Agent 场景里，可以把工具放在一个公共的地方，让所有 Agent 都访问。权限不同的话，给每个 Agent 配不同的工具列表，或者给工具设置谁能用。出了问题记录一下日志，能追溯就行。

    2️⃣ Impressive Answer

    我会从 3 个角度来思考这个问题：

    - 首先是工具池的架构设计。核心是集中注册与发现——所有工具在 Tool Registry 里注册，Agent 启动时按需发现，而不是硬编码。Tool Registry 还要支持版本管理，不同 Agent 可以绑定不同版本，工具升级时可以做灰度发布，只让部分 Agent 用新版本观察效果。

    - 其次是权限控制，引入 RBAC 模型。先定义 Agent 的角色，比如"数据查询 Agent"、"代码执行 Agent"、"管理员 Agent"，再给每个工具绑定允许的角色列表。Agent 调用工具时，Tool Pool 校验角色，不匹配就拒绝。权限设计遵循最小权限原则——"查询用户信息"的工具只给读权限，"发送邮件"的工具只能发预定义模板，不能自由编辑内容。

    - 最后是沙箱隔离和审计监控。对于危险工具（代码执行、文件操作），需要在沙箱里运行，限制访问文件系统和网络。每个 Agent 设置资源配额，防止消耗过多资源。审计日志记录调用者、工具名、时间、参数、结果，并对关键指标做实时监控——调用频率异常、失败率突增、参数包含敏感信息，超阈值告警。


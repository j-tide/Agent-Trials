    ### 长文档处理策略：分块 vs Map-Reduce vs 递归摘要

    1、基础题：LLM 的 Context Window 是什么？超出限制时会发生什么？

    难度级别：⭐（Context Window 定义、超出后的截断或报错行为）

    LLM 的 Context Window 是模型单次处理的最大 token 数限制，超出后 API 会报错或截断输入。不同模型限制不同，比如 GPT-4o 支持 128K token，Claude 3 支持 200K token。处理长文档时必须先把文档切分或压缩到 Context Window 以内，才能正常调用。

    ---

    2、进阶题：处理超出 LLM Context Window 的长文档时，有哪些主流策略？请对比直接分块、Map-Reduce 和递归摘要的适用场景与成本差异。

    难度级别：⭐⭐（直接分块的跨块信息丢失、Map-Reduce 并行聚合、递归摘要树状压缩、O(N)/O(N log N) 调用次数分析）

    1️⃣ Common Answer

    当文档太长超过模型的 Context Window 时，可以用几种方法来处理。直接分块就是把文档切成固定长度的片段，分别处理。Map-Reduce 是先对每个分块生成摘要，再把所有摘要汇总成最终结果。递归摘要是对超长文档递归地做摘要，直到长度满足要求。三种方法的选择取决于文档长度和对精度的要求，分块最简单但可能丢失信息，Map-Reduce 效果更好，递归摘要适合非常长的文档。

    2️⃣ Impressive Answer

    我会从三个策略的核心权衡出发思考这个问题：

    - 首先，直接分块（Chunking）是最简单的方案，但有核心缺陷。按固定 token 数切割后，跨块的完整论述会被截断，两边都失去上下文。加 overlap（块间重叠 50 token）只能缓解，不能根治。更大的问题是——如果任务需要整合全文信息（比如"全文的主要矛盾"），单块根本答不了。适用场景：各条款之间彼此独立的信息提取类任务，比如从合同里提取关键日期。

    - 其次，Map-Reduce 分两阶段处理，能覆盖全文。Map 阶段对各 chunk 并行生成摘要，Reduce 阶段把所有摘要合并再调一次 LLM 输出最终结果。优点是可并行、信息损失可控；成本是 LLM 调用次数 = chunk 数 + 1，线性增长。适用场景：需要整合全文信息的任务，文档在 100K token 以内。

    - 最后，递归摘要解决 Reduce 阶段自身超长的问题。Map-Reduce 在文档极长时，Reduce 收到几十个摘要本身又超长了。递归摘要用树状结构层层合并，调用次数约 O(N log N)。另一个变体是 Refine 模式：顺序处理每个 chunk，把"当前摘要 + 新 chunk"一起精炼，保留线性叙事结构，但严格串行，延迟高（O(N) 次调用）。适用场景：整本书、长篇报告的全文摘要。补充一点：如果任务是 QA，优先考虑 RAG——只检索相关 chunk，成本最低，效果往往更好。


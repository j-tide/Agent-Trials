    ### LLM 调用的成本控制策略

    ---

    1、基础题：LLM API 的计费方式是什么？

    难度级别：⭐（Token 计费、input/output token 的区别）

    LLM API 通常按 token 计费，分 input token（你发给模型的内容）和 output token（模型生成的内容）两部分，output token 通常更贵。比如 GPT-4o 的定价是 input $2.5/百万 token、output $10/百万 token。控制成本的核心就是减少不必要的 token 消耗。

    ---

    2、进阶题：在生产环境中，LLM API 调用成本很高，有哪些有效的成本控制手段？

    难度级别：⭐⭐（语义缓存命中率、大小模型路由、LLMLingua Prompt 压缩、Batch API 50% 折扣）

    1️⃣ Common Answer

    LLM 调用成本控制主要有以下几个方法：一是缓存，对相同的请求直接返回缓存结果，避免重复调用；二是使用更便宜的小模型，简单的问题不需要用 GPT-4 这样贵的模型；三是尽量精简 Prompt，减少 Token 数量；四是批量处理，把多个请求合并发送。

    2️⃣ Impressive Answer

    我会从四个独立的优化维度来回答这个问题：

    - 首先是语义缓存（Semantic Cache），命中率最高、收益最直接。普通 exact match 缓存只能命中完全相同的请求，实际用处有限。语义缓存用 embedding 相似度检索历史请求，相似度超过阈值（比如 0.85）直接返回缓存，FAQ 类场景命中率可达 60-70%。工具上可以用 GPTCache 接入 LangChain。上线前要先统计请求分布，估算 ROI，命中率低于 20% 的场景可能不值得投入缓存基础设施。

    - 其次是大小模型路由（Model Routing），降低单次调用成本。不是所有请求都需要 GPT-4o。用两层路由：先用关键词规则过滤（翻译、格式化等简单请求直接走 mini 模型），再用小模型做复杂度分类，复杂推理才走大模型。GPT-4o-mini 成本约为 GPT-4o 的 1/30，实践中 60-70% 的请求可以走小模型，整体成本能降 50% 以上。

    - 再次是 Prompt 压缩（LLMLingua），专门针对 RAG 场景的冗余 Context。检索回来的 Context 往往包含大量无关内容。LLMLingua 用小语言模型给每个 token 打重要性分，按比例删掉不重要的 token，在信息损失可控的前提下把 Context 压缩 60-80%，大幅降低 input token 数。

    - 最后是 Batch API，离线任务的折扣利器。对于非实时任务（数据标注、离线文档处理），OpenAI Batch API 提供 50% 折扣，代价是最长 24 小时内完成。这四种手段组合使用，优先级是：语义缓存（零成本命中）→ 模型路由（降单次成本）→ Prompt 压缩（降 token 数）→ Batch API（离线任务）。项目落地后整体 LLM 成本降了约 65%。


content:
  prompt: "\U0001F9EC 2. 如何将 FSM 与事件驱动架构融合设计？在分布式环境下如何保证状态一致性和幂等性？"
answer:
  mode: rubric
  reference_answer: |-
    融合设计模式：状态机作为事件处理器的核心

    不要把状态机看作一个独立的“流程引擎服务”，而是将它嵌入到每个微服务的事件处理器里。

    事件流 ──→ [事件处理器] ──→ 加载聚合根 (业务对象) ──→ 执行 FSM 转移 ──→ 发布新事件
                    │
                    └── 从事件存储重建 FSM 状态

    具体设计步骤：

    - 事件溯源：数据库里不直接存储“当前状态”，而是存储一系列不可变的事件。例如订单表不存 status = paid，而是存 [OrderCreated, OrderPaid]。

    - 聚合根与状态机：订单就是一个聚合根，它内部内嵌一个 FSM。加载订单时，从事件存储读取该订单的所有事件，重放给 FSM，得到当前状态。

    - 原子性发布：状态机转移时，必须同时满足两点：新状态被持久化、新事件被发布。通常用事务发件箱模式：把新事件写入数据库的 outbox 表，与业务数据在同一事务里提交。一个后台线程负责把 outbox 里的事件可靠地发送到 Kafka。

    保证状态一致性的手段：

    - 事务发件箱（原子性）：确保“状态转移”和“发事件”是原子操作，彻底杜绝状态变了事件没发出去、或者事件发出去了状态回滚的灾难。

    - 幂等性：即使事件被投递多次，处理结果也像只投递了一次一样。实现方式：

    代码骨架：事件溯源 + FSM + 发件箱

    class Order:
        def __init__(self, events):
            self.state = None
            self.version = 0
            for e in events:
                self.apply(e)

        def apply(self, event):
            if event.type == "OrderCreated":
                self.state = "pending"
            elif event.type == "OrderPaid":
                if self.state == "pending":  # FSM 校验
                    self.state = "paid"
                    self.version += 1
                else:
                    raise InvalidTransition()

        def pay(self, payment_id):
            # 产生新事件
            event = Event(type="OrderPaid", data={"payment_id": payment_id})
            # 模拟原子写入：业务表 + outbox 表
            with db.atomic():
                db.execute("INSERT INTO events (order_id, type, data, version) VALUES (?,?,?,?)", ...)
                db.execute("INSERT INTO outbox (event_id, payload) VALUES (?,?)", ...)
            return event

content:
  prompt: "\U0001F52C 1. Self-Consistency 是什么？"
answer:
  mode: rubric
  reference_answer: |-
    一句话：让同一个模型用不同的思路做同一道题，然后投票选出最可靠的答案。

    标准 CoT 只让模型推理一次，一旦中间某一步出现幻觉或计算失误，整个答案就错了。Self-Consistency 的解法很直接：多生成几条不同的推理链，统计最终答案的频率，选出现次数最多的那个。

    直观图示：

    [图片内容未导入]

    本质： 通过采样多样性来对抗单次推理的随机性，把正确率从单条路径的概率提升到多数路径一致的概率。


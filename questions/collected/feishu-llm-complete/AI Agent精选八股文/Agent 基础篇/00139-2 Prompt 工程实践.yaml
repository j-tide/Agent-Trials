    3、场景题：你的 Agent 的 System Prompt 有 3000 个 token，但每次请求都在里面插入当前用户的姓名和权限，导致 Cache 命中率为 0，如何改造？

    难度级别：⭐⭐（KV Cache 前缀缓存条件、动态内容隔离、Prompt 结构重构）

    1️⃣ Common Answer

    把用户姓名和权限从 System Prompt 里移出去，放到用户消息里。这样 System Prompt 就固定了，可以命中缓存。

    2️⃣ Impressive Answer

    方向是对的，但具体改造要考虑几个细节：

    - System Prompt 必须完全固定，包括标点和空格。前缀缓存命中的条件是逐字节完全相同，只改一个字符，从那个位置开始的所有 block 都会 cache miss。所以不只是移出姓名和权限，System Prompt 里任何动态插值都要清除。

    - 动态信息的放置位置。用户姓名、权限、当前日期这些信息，统一移到对话的第一条 User 消息里，格式固定为"当前用户：{name}，权限级别：{role}"，让 System Prompt 的 3000 token 在整个会话生命周期内完全不变。

    - 如果有固定的 Few-shot 示例，也可以跟在 System Prompt 后面一起缓存，按"System Prompt → 固定示例 → 对话历史 → 当前用户输入"的顺序排列，稳定内容在前，动态内容在后。

    - 效果评估。改造后监控 API 返回的 cache_creation_input_tokens 和 cache_read_input_tokens 比例，确认缓存确实在命中。Anthropic 命中缓存的 input token 只收原价 10%，3000 token 的 System Prompt 在高并发下节省非常可观。

    ❌ 改造前: [System Prompt + 用户名 + 权限 + 时间戳] → 每次不同 → Cache Miss

    ✅ 改造后:
      ① System Prompt (3000 token 纯静态) ← KV Cache 命中
      ② Fixed Few-shot 示例             ← KV Cache 命中
      ③ User消息: "当前用户:{name}, 权限:{role}" ← 动态部分，不缓存
      ④ 用户当前输入

    3️⃣ Key Differences


    ### System Prompt 的设计最佳实践

    1、基础题：System Prompt 里应该写什么？

    难度级别：⭐（System Prompt 基本结构、角色定义）

    System Prompt 是 Agent 的行为契约基础，通常包含三部分：角色与能力边界定义（告诉模型它是谁、能做什么、不能做什么）、输出格式约束（格式模板和示例）、以及边界条件与拒绝策略（什么情况下应该拒绝并如何回应）。

    ---

    2、进阶题：在构建 AI Agent 系统时，System Prompt 的设计有哪些最佳实践？如何兼顾功能性和性能优化？

    难度级别：⭐⭐（角色边界定义、格式约束、KV Cache 友好设计、优先级排列）

    1️⃣ Common Answer

    System Prompt 就是告诉模型它是谁、该怎么做。好的 System Prompt 要清晰简洁，包括角色定义、行为规则和输出格式。比如写"你是专业客服助手，只回答产品相关问题，用 JSON 格式输出"。另外 System Prompt 要保持稳定，不要经常改，这样缓存效果更好。

    2️⃣ Impressive Answer

    我会从功能设计和性能设计两个维度来展开。

    - 角色与能力边界要精确，不要模糊。不要只写"你是一个助手"，要给出具体身份、具体能力范围和明确的知识边界。边界清晰后模型的行为就更可预测，"自由发挥"的空间更小。

    - 格式约束用"描述 + 示例"组合，不要只描述。对 Agent 系统来说，工具调用参数解析依赖输出格式的稳定性。只说"用 JSON 输出"不够，要直接给出 schema 加一个正确示例，描述加示例的组合比单纯描述可靠得多。

    - 边界条件和拒绝策略不能省。明确告诉模型什么时候应该拒绝、拒绝时怎么回答。很多人忽略这一点，结果是模型在超出能力范围时硬撑着给错误答案。加一条"超出能力范围时直接说明，不要猜测或编造"能显著减少这类幻觉。

    - KV Cache 友好是性能层面的核心考量。System Prompt 每次请求都相同，API 侧命中前缀缓存能显著降低首 Token 延迟和费用。要求是内容完全固定，包括标点和空格，不能有动态插值。需要动态注入的信息（当前日期、用户信息）统一放到 User 消息里，不要放 System Prompt 里。Anthropic 缓存命中有 90% 费用折扣，高并发场景收益非常可观。

    3️⃣ Key Differences


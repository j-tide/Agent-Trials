    ### Few-shot Prompting 的示例选择策略

    1、基础题：Few-shot Prompting 是什么？

    难度级别：⭐（Few-shot 基本概念、示例数量经验值）

    Few-shot Prompting 是在 Prompt 里提供若干输入-输出示例，帮助模型理解任务模式、输出格式和边界情况。通常 3-8 个示例是性价比最高的区间，再多效果提升会递减但 Token 消耗线性增长。质量和多样性比数量更重要。

    ---

    2、进阶题：Few-shot 示例的选择策略对效果有哪些关键影响？动态 Few-shot 和静态 Few-shot 各自适用什么场景？

    难度级别：⭐⭐（示例质量 vs 数量、位置影响、动态检索原理、示例池持续优化）

    1️⃣ Common Answer

    Few-shot 就是给几个例子让模型参考。示例 3 到 8 个比较合适，太少效果不好，太多占太多 Token。动态 Few-shot 是根据问题动态选相似的示例，静态是固定几个。动态效果更好但实现复杂，需要 Embedding 做相似度检索。

    2️⃣ Impressive Answer

    我会从示例质量原则、位置影响、静态 vs 动态选型三个角度来回答。

    - 质量和多样性比数量更重要。10 个重复覆盖同一种模式的示例，不如 4 个覆盖不同边界情况的示例。好的示例集要覆盖典型场景、关键边界情况，输出格式完全规范，避免示例之间高度相似——相似示例浪费 Token 但不增加信息量。

    - 位置比数量更容易被忽视。示例放得越靠近实际任务指令，效果越好，这和 LLM 对近端上下文注意力权重更高有关。如果 System Prompt 很长，我会把示例放在 User 消息里紧邻问题的位置，而不是全部堆在 System Prompt 开头。

    - 静态 vs 动态的工程选型。静态 Few-shot 适合任务分布集中、边界情况有限的场景（比如固定格式的文档解析），System Prompt 固定，KV Cache 命中率高。动态 Few-shot 适合输入差异大、任务分布宽泛的场景：用 Embedding 模型将示例库向量化，每次请求时检索最相似的 K 个示例注入 Prompt。实现时有两个细节：检索到的示例把相关性最高的放在最靠近任务指令的位置；要设置相似度阈值，过低相似度的示例宁可不用，防止负迁移。

    在 Agent 系统里，我还会用"示例池持续优化"机制：人工标注高质量示例入库，同时把线上效果好的对话（通过用户反馈或 LLM 自评筛选）也入库，让示例池随系统运行持续优化。

    3️⃣ Key Differences


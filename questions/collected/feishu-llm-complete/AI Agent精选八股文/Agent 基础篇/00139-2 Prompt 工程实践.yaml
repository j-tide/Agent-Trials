    3、场景题：你的 Agent 需要处理用户提交的各类合同文档，不同类型合同的解析格式差异很大，用静态 Few-shot 效果很差，怎么改造？

    难度级别：⭐⭐（动态 Few-shot 工程实现、相似度检索、负迁移防御）

    1️⃣ Common Answer

    可以换成动态 Few-shot，根据当前合同类型选择对应的示例。用 Embedding 检索和当前文档最相似的示例来用，效果应该会好很多。

    2️⃣ Impressive Answer

    这是动态 Few-shot 的标准应用场景，我会这样实现：

    - 建立分类型的示例库。按合同类型（劳动合同、采购合同、租赁合同等）分类标注高质量解析示例，每类至少覆盖 3-5 种典型格式变体，包含关键的边界情况，比如字段缺失、格式异常的处理方式。

    - 检索策略。用文档的前 500 字（包含合同标题和开头条款）作为查询，向量化后检索示例库，取 Top-3 最相似的示例。设置相似度阈值（比如 cosine similarity > 0.75），低于阈值的示例不用，宁可给模型说"无相关示例，请基于以下格式要求处理"，防止错误类型的示例带来负迁移。

    - 示例放置顺序。相关性最高的示例放在最靠近当前任务指令的位置，利用近因效应，不要按检索分数降序从上到下堆。

    - 持续优化。线上把解析结果准确的对话标注入库，并定期做示例去重，避免库里同质化示例过多。

    3️⃣ Key Differences


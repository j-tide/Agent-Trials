    2.1 本质区别：从“硬编码路径”到“动态计算路径”

    FSM                         图结构 Agent
    ───────                     ─────────────
    状态转移由开发者预定义      节点连接可以动态决定
    转移条件基于简单规则       转移条件可以基于 LLM 的推理结果
    路径是静态的               路径可以自适应调整

    FSM：像一张固定的地铁图，你在建设时已经铺好了所有轨道。列车只能沿着你铺设的方向前进。

    图结构 Agent：像城市出租车，虽然路网（节点）是固定的，但司机（LLM）可以根据实时路况（任务状态）自主决定下一站去哪。它甚至可以在途中决定绕道，或临时增加一个停靠点。

    核心差异在于控制权：

    - FSM：控制流在编译时确定，非常安全，但灵活性为零。

    - 图 Agent：控制流在运行时由 LLM 计算，极其灵活，但可能走向未预期的状态。


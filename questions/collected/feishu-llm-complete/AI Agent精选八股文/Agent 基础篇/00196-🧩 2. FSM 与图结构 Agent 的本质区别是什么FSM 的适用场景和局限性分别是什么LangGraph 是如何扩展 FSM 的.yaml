    2.3 LangGraph 如何扩展 FSM？

    LangGraph 并没有抛弃 FSM，而是把它作为特例包容进来，并赋予了三个核心扩展能力：

    - 条件边：让 LLM 做路由决策
    FSM 的转移条件只能靠规则。LangGraph 可以把 LLM 当作一个“智能路由器”。比如，在“质量审核”节点后，不写死 if score > 0.8，而是让 LLM 根据“是否完全满足用户意图”来决定是“通过”还是“重写”。

    - 循环与动态节点
    FSM 通常是单向的。LangGraph 天然支持环（循环），例如“生成回答 → 质量审核 → 不通过 → 返回生成回答”。这意味着你可以把需要迭代的反思框架（如 Self-Refine）直接嵌入 Agent 的主干。

    - 状态持久化与管理
    FSM 通常只跟踪“当前状态”。LangGraph 的 State 是一个贯穿所有节点的共享字典，你可以在这里存储对话历史、中间结果、用户画像等。这让 Agent 拥有了超越简单状态机的“记忆”。

    一句话概括：LangGraph 就是赋予了 LLM 动态规划路径能力的高级状态机。 你仍然定义节点（状态）和边（转移），但边的触发方式从“纯规则”升级为了“LLM 推理+规则”。


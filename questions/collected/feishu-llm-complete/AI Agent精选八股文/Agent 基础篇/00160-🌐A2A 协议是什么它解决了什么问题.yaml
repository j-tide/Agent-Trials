content:
  prompt: "\U0001F310A2A 协议是什么？它解决了什么问题？"
answer:
  mode: rubric
  reference_answer: |-
    一句话：A2A 是一套让不同厂商、不同框架开发的 AI Agent 能够相互发现、分配任务、交换结果的标准化开放协议。

    [图片内容未导入]

    它要解决的四个核心痛点：

    - Agent 碎片化
    现在做 Agent 的框架非常多（LangChain、AutoGen、CrewAI、Dify 等），每个框架的内部通信机制都是私有的。你想让 LangChain 写的 Agent 去调用一个 AutoGen 构建的专用 Agent？之前需要单独开发适配层。A2A 提供了一个“最大公约数”的通信模式，跨框架即插即用。

    - 互操作性缺失
    即便都是 HTTP API，A Agent 的任务定义（比如“分析这份财报”）和 B Agent 的任务定义（比如“financial_report_analysis”）大概率字段名、参数结构完全不同。A2A 定义了统一的任务对象（Task）、消息格式（Message）和工件（Artifact），让 Agent 之间能互相“听懂”。

    - 长任务与异步协作
    很多 Agent 任务不是秒级能返回的（比如生成一份几十页的尽调报告、训练一个模型）。HTTP 请求-响应模式撑不了这么久，需要长连接或异步回调。A2A 原生支持异步任务，有完整的 Task 状态机，支持长轮询、流式推送，甚至支持人工介入（Human-in-the-loop）。

    - 能力发现
    传统 API 需要人看文档。A2A 让 Orchestrator Agent 能够通过 Agent Card 自动发现远程 Worker Agent 具备哪些技能（Skills）、支持什么输入输出模式，从而实现动态的任务路由。这在多 Agent 协作中至关重要。

    A2A 的生态定位：

    MCP 解决的是 Agent 与工具/数据源的连接问题（Agent ↔ Tool），而 A2A 解决的是 Agent 与 Agent 之间的协作问题（Agent ↔ Agent）。两者互补，共同构成了 Agent 世界的“USB 协议栈”。


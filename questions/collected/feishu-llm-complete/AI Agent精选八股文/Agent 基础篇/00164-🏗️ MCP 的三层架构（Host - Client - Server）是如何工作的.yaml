content:
  prompt: "\U0001F3D7️ MCP 的三层架构（Host / Client / Server）是如何工作的？"
answer:
  mode: rubric
  reference_answer: "MCP 采用分层架构，把用户交互、协议管理、后端执行彻底分开。\n\n[图片内容未导入]\n\n① Host（宿主应用）\n\n-
    运行在用户侧的 AI 程序，如 Claude Desktop、VS Code 插件、自研 Web 界面。\n\n- 职责：\n\n② Client（协议客户端）\n\n-
    是 Host 内部的一个通信管理器，每个 Client 与一个 Server 一对一绑定。\n\n- 职责：\n\n③ Server（工具提供者）\n\n-
    一个实现了 MCP 协议的独立进程，通常由工具开发者编写。\n\n- 职责：\n\n完整请求示例（Client → Server）：\n\n{\n  \"jsonrpc\":
    \"2.0\",\n  \"id\": 3,\n  \"method\": \"tools/call\",\n  \"params\": {\n    \"name\":
    \"get_weather\",\n    \"arguments\": {\n      \"city\": \"Beijing\"\n    }\n  }\n}\n\nServer
    响应：\n\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 3,\n  \"result\": {\n    \"content\":
    [\n      {\n        \"type\": \"text\",\n        \"text\": \"Beijing: 22°C, sunny.\"\n
    \     }\n    ]\n  }\n}\n\n### \U0001F4BB 4. 代码示例：用 Python 实现一个天气 MCP Server\n\n（使用
    mcp 官方库，安装 pip install mcp）\n\n# weather_server.py\nimport asyncio\nfrom mcp.server
    import Server, stdio_server\nfrom mcp.types import Tool, TextContent\n\n# 创建 Server
    实例\nserver = Server(\"weather-server\")\n\n# 注册工具：列出可用的工具\n@server.list_tools()\nasync
    def list_tools():\n    return [\n        Tool(\n            name=\"get_weather\",\n
    \           description=\"获取指定城市的当前天气\",\n            inputSchema={\n                \"type\":
    \"object\",\n                \"properties\": {\n                    \"city\":
    {\n                        \"type\": \"string\",\n                        \"description\":
    \"城市名称，如 Beijing\"\n                    }\n                },\n                \"required\":
    [\"city\"]\n            }\n        )\n    ]\n\n# 实现工具调用\n@server.call_tool()\nasync
    def call_tool(name: str, arguments: dict):\n    if name == \"get_weather\":\n
    \       city = arguments[\"city\"]\n        # 模拟查询天气（实际可调 API）\n        weather
    = f\"{city}: 22°C, sunny.\"\n        return [TextContent(type=\"text\", text=weather)]\n
    \   raise ValueError(f\"未知工具: {name}\")\n\n# 启动 Server（使用 stdio 传输）\nasync def
    main():\n    async with stdio_server() as (read_stream, write_stream):\n        await
    server.run(read_stream, write_stream, server.create_initialization_options())\n\nif
    __name__ == \"__main__\":\n    asyncio.run(main())\n\n配置 Claude Desktop 使用这个 Server：\n\n//
    ~/Library/Application Support/Claude/claude_desktop_config.json (macOS)\n{\n  \"mcp_servers\":
    {\n    \"weather\": {\n      \"command\": \"python\",\n      \"args\": [\"path/to/weather_server.py\"]\n
    \   }\n  }\n}\n\n重启 Claude Desktop 后，问“北京天气怎么样？”，模型会自动发现 get_weather 工具，传入参数并得到天气回答。"

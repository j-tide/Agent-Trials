content:
  prompt: "⚙️ 1. 什么是有限状态机（FSM）？"
answer:
  mode: rubric
  reference_answer: |-
    一句话：有限状态机是一种把系统行为建模为“有限个状态 + 状态间转移规则”的计算模型。

    它由三个核心要素构成：

    - 状态：系统在某一时刻的固定形态（如“待机”、“处理中”、“已完成”）。

    - 转移：在特定事件/条件下，从一个状态跳到另一个状态的规则。

    - 动作：进入、退出或处于某个状态时执行的操作。

    图示：一个简单的客服 FSM

    [图片内容未导入]

    代码示例：用字典模拟 FSM

    # 状态转移表
    fsm = {
        "分类": {
            "分类成功": "查询知识库",
            "无法分类": "转人工"
        },
        "查询知识库": {
            "找到答案": "生成回答",
            "未找到": "转人工"
        },
        "生成回答": {
            "完成": "质量审核"
        },
        "质量审核": {
            "通过": "发送",
            "不通过": "生成回答"  # 重写
        },
        "转人工": {},
        "发送": {}
    }

    current_state = "分类"
    while current_state not in ["转人工", "发送"]:
        next_state = execute_state(current_state)  # 执行动作，返回下一状态
        current_state = fsm[current_state][next_state]

    FSM 的优点在于确定性强、易于理解与调试。每一步都是清晰预定义的，你完全知道系统会在什么条件下走向何方。


    ### LLM 结构化输出的演进：JSON Mode vs Function Calling vs Structured Output

    ---

    1、基础题：LLM 结构化输出的 JSON Mode、Function Calling、Structured Output 三种方式分别是什么？

    难度级别：⭐（LLM 输出格式控制、OpenAI API 基础）

    JSON Mode 通过设置 response_format: json_object 保证输出是合法 JSON，但不保证字段符合预期 Schema。Function Calling 通过定义工具的 JSON Schema 引导模型输出特定结构，可靠性更高。Structured Output（Parse API）是最新方案，通过 RLHF 专项训练让模型严格遵循 Pydantic Schema，可靠性最高，三种方案代表了结构化输出能力的三代演进。

    ---

    2、进阶题：三种结构化输出方案的底层机制和可靠性边界分别是什么？校验失败时应如何设计重试策略？

    难度级别：⭐⭐（约束解码、RLHF、ValidationError 处理、分层重试策略）

    1️⃣ Common Answer

    JSON Mode 让模型输出 JSON，Function Calling 通过定义函数让模型填参数，Structured Output 最准确。可靠性是依次递增的。如果输出校验失败，可以重试几次，或者在 Prompt 里加更严格的格式要求，让模型重新生成。

    2️⃣ Impressive Answer

    我会从三代方案的机制差异和重试策略设计两个角度来回答：

    - 首先，三代方案的核心机制和边界。JSON Mode 用约束解码（constrained decoding）保证 token 序列语法合法，但字段名拼错、字段缺失、类型不匹配它一概不管，适合结构简单的场景。Function Calling 把 Schema 放进工具定义，让模型理解字段含义，可靠性显著提升，但嵌套深、枚举多时偶尔还是会漏字段；另外需要显式指定 tool_choice，否则模型可能输出普通文本而不触发工具调用。Structured Output（client.beta.chat.completions.parse()）通过 RLHF 专项训练，只要 Schema 合法，几乎可以保证字段完整性和类型正确性，是生产环境的首选。

    - 其次，校验失败的分层重试策略。简单粗暴地盲重试效果有限，更有效的方式是"带错误信息回填的重试"——把 ValidationError 的具体内容追加到对话里，让模型知道哪里错了再修正。完整策略是：捕获异常 → 把错误原因回填 User 消息 → 指数退避重试（防止打爆限流） → 超过最大次数后降级返回空对象并记录日志。生产上推荐用 Instructor 库，它封装了这套逻辑并支持 Partial 模式（流式边生成边校验），比手写省心很多。


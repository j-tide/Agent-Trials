    3、场景题：团队的 Agent 系统在高并发下推理成本居高不下，排查发现 KV Cache 命中率很低，可能的原因有哪些，怎么排查和修复？

    难度级别：⭐⭐（KV Cache 命中率排查、Prompt 结构问题定位）

    1️⃣ Common Answer

    可能是 System Prompt 每次都不一样，或者并发请求太多缓存被挤掉了。可以检查一下 System Prompt 是不是固定的，把动态内容移到后面去。

    2️⃣ Impressive Answer

    排查思路分两步：先定位是"前缀不匹配"还是"缓存容量不足"。

    前缀不匹配是最常见原因。具体排查：打印每次请求的 System Prompt，diff 相邻两次是否完全一致（包括空格、换行）。常见元凶：模板引擎每次渲染出略有差异的格式、注入了动态时间戳或请求 ID、工具列表顺序随机化。修复方法：把所有动态字段移到 User 消息，System Prompt 做成纯静态字符串常量，用单元测试断言它在任意参数下渲染结果不变。

    缓存容量不足（服务端 LRU 驱逐）一般出现在前缀长度差异很大的场景。可以通过平台的 cache hit token 指标来确认——如果命中率随并发增加而下降，大概率是容量问题，需要联系平台或自建推理服务时调大 KV Cache 分配比例。

    3️⃣ Key Differences


    3、场景题：你的 Agent 在执行 10 步任务时，到第 8 步时上下文窗口快满了，但早期步骤的工具调用结果还要用，怎么设计上下文管理策略？

    难度级别：⭐⭐⭐（上下文窗口管理、关键信息保留、历史压缩策略、跨步推理一致性）

    1️⃣ Common Answer

    上下文窗口快满了就要压缩，可以对早期的对话历史做摘要，把长内容变短，这样就能腾出空间给新内容。

    2️⃣ Impressive Answer

    这是 CE 的核心场景，我会用分层管理策略来解决：

    - 关键信息固化，不参与压缩。在 Agent 开始执行时，把任务目标、核心约束、关键中间结论单独维护在一个"状态摘要"结构里，每步执行后更新这个结构，而不是依赖原始的工具返回文本。这部分内容始终保留，不压缩。

    - 工具调用历史分级处理。对早期步骤的工具返回，区分"结论已被后续步骤引用"和"原始数据还需要直接查阅"两类。前者可以压缩为一句结论（"第 3 步确认了用户权限为 admin"），后者如果后续还要用，保留完整内容但做精简格式化。

    - 动态注入而不是堆积。当某一步需要用到早期数据时，从状态摘要里提取相关部分，临时注入到当前步骤的上下文末尾，而不是让所有历史数据一直留在窗口里。这样每一步的上下文都是"当前步骤最需要的信息"的精选。

    - 在第 6-7 步时提前触发压缩，不要等到快满了才处理，留出余量给最后几步可能更长的工具返回。

    3️⃣ Key Differences


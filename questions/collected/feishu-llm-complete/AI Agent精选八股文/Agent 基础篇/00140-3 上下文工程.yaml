    ### Context Engineering 与 Prompt Engineering 的本质区别

    1、基础题：什么是 Context Engineering？

    难度级别：⭐（CE 基本定义、与 PE 的基本区分）

    Context Engineering 是指对 LLM 整个上下文窗口中所有信息进行动态编排和管理的工程能力，包括 System Prompt、对话历史、RAG 检索结果、工具调用返回、当前任务状态等。区别于 Prompt Engineering 只关注单次调用的指令设计，CE 关注的是"在有限的上下文窗口里，给模型看什么、不看什么、按什么顺序看"。

    ---

    2、进阶题：Context Engineering 和 Prompt Engineering 的本质区别是什么？为什么说 CE 是 Agent 时代更重要的能力？

    难度级别：⭐⭐⭐（工作单元差异、信息密度管理、动态编排、跨步推理一致性、瓶颈转移）

    1️⃣ Common Answer

    Prompt Engineering 是设计和优化输入给 LLM 的提示词。Context Engineering 是更高级的概念，不只是单个 Prompt，而是管理整个上下文窗口里的所有内容。在 Agent 系统里，上下文里有工具返回结果、对话历史、检索到的知识，怎么把这些组织好让模型更好地推理，这就是 CE 要解决的问题。

    2️⃣ Impressive Answer

    我会从工作单元的本质差异、CE 的核心问题、以及为什么 Agent 时代瓶颈在 CE 三个角度来回答。

    - 工作单元和优化目标的本质差异。PE 的工作单元是单次 LLM 调用，优化目标是这次调用的输出质量，核心问题是"怎么措辞、怎么提供示例、怎么引导推理链"。CE 的视角完全不同——它把整个上下文窗口看作一个有限的、需要精心编排的资源，工作单元是整个 Agent 的运行生命周期。

    - CE 要解决的三个核心问题。

    - 瓶颈转移的本质。当 LLM 的智能已经足够强的时候，瓶颈往往不在于"怎么说"，而在于"给模型看什么"。一个上下文编排做得好的 Agent，在相同模型能力下可以比编排混乱的 Agent 有显著更好的表现。这就是为什么 CE 是 Agent 时代更核心的能力。

    3️⃣ Key Differences


    3、场景题：Agent 在多步推理中，随着对话轮次增加，早期的任务目标被"推到中间"导致模型偏离，怎么处理？

    难度级别：⭐⭐（Agent 上下文管理、近因效应、Prompt 重置策略）

    1️⃣ Common Answer

    可以把任务目标写在 System Prompt 里，这样每次都能看到。或者对话太长了就截断一下，删掉一些早期的对话记录，保留最新的内容。

    2️⃣ Impressive Answer

    问题的本质是 Lost in the Middle——System Prompt 里的任务目标在对话历史不断增长后，在整体上下文中的位置被"推向中间"，注意力权重下降。

    核心应对策略是动态近因锚定：在每一步工具调用或推理之前，把当前任务目标和关键约束以 User 消息的形式追加到上下文末尾（而不是只依赖开头的 System Prompt）。这样任务目标始终在近因效应覆盖的区域。

    同时配合上下文滑动窗口：保留完整的 System Prompt + 最近 N 轮对话 + 当前步骤的目标重申，中间过于久远的工具调用结果可以压缩成摘要。这两个策略结合，既保证任务不漂移，又控制了 Token 消耗。


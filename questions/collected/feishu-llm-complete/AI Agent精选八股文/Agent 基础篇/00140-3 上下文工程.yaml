    ### KV Cache 友好的 Prompt 设计策略

    ---

    1、基础题：什么是 KV Cache 前缀缓存？

    难度级别：⭐（Transformer 推理优化、KV Cache 原理）

    KV Cache 是将 Transformer Self-Attention 计算产生的 Key 和 Value 矩阵缓存起来，避免重复计算。前缀缓存是其进一步延伸：如果多次请求的输入前缀完全相同，就可以直接复用已缓存的 KV 矩阵，跳过这部分计算，显著降低首 token 延迟和推理成本。

    ---

    2、进阶题：如何在 Prompt 设计中充分利用 KV Cache 前缀缓存机制来降低延迟和成本？

    难度级别：⭐⭐⭐（KV Cache block 级匹配原理、Prompt 五层结构布局、反模式识别、平台缓存定价）

    1️⃣ Common Answer

    KV Cache 就是缓存计算结果，前缀一样就能复用。所以 System Prompt 要保持不变，放在最前面，这样就能命中缓存。动态的用户输入放后面。Anthropic 和 OpenAI 对命中缓存的 token 有价格优惠，能省钱。

    2️⃣ Impressive Answer

    我会从原理、结构设计和反模式三个角度来回答：

    - 首先，理解缓存命中的严格条件。KV Cache 前缀缓存以 block（通常 128 或 256 个 token）为单位匹配，要求前缀逐字节完全相同才能命中。哪怕只改动一个字符、一个空格，从那个位置开始的所有 block 都会 cache miss。这解释了为什么在 System Prompt 里插入动态时间戳或用户 ID 会彻底破坏缓存——即使插值位置在末尾，后续所有 block 都失效。

    - 其次，按"稳定在前、动态在后"原则设计五层 Prompt 结构：[完全固定的 System Prompt] → [固定 Few-shot 示例] → [固定长文档/知识库] → [随对话增长的历史] → [当前用户输入]。越靠前越稳定，缓存命中率越高；越靠后允许越动态。在高并发场景下，前两层几乎可以持续命中缓存，收益最显著。平台侧，Anthropic 对命中缓存的 input token 收费是原价 10%，OpenAI 是 50% 折扣；Anthropic 还支持手动设置 cache_control: {"type": "ephemeral"} 精确控制缓存边界，对 RAG 固定文档场景很有用。

    - 最后，识别并避免常见的破坏缓存反模式：在 System Prompt 里插入动态时间戳或请求 ID；每次请求随机 shuffle 工具列表顺序；把用户姓名、权限注入 System Prompt 开头或中间；使用模板引擎每次生成略有差异的格式。解决方法统一：把所有动态信息移到 User 消息部分。

    3️⃣ Key Differences


content:
  prompt: "⚡ 1. 什么是事件驱动架构（EDA）？它和 FSM 有什么关联？"
answer:
  mode: rubric
  reference_answer: |-
    事件驱动架构的核心思想很简单：系统的行为不是由“顺序代码”硬控，而是由不可变的事件消息来触发的。

    一个事件就是“已经发生的事实”，比如 订单已支付、工具调用已完成。系统组件通过发布和订阅这些事件来解耦协作。

    生产者 ──发布事件──→ 事件总线 (Kafka/Pulsar) ──订阅──→ 消费者
                             │
                        事件持久化，可重放

    它与有限状态机（FSM）的关联，一句话：EDA 负责“发生了什么”，FSM 负责“接下来该是什么状态”。

    [图片内容未导入]

    - FSM 定义了合法的状态集合和转移规则，它是系统的“骨骼”。

    - EDA 提供了状态转移的触发机制和通信方式，它是系统的“神经”。

    为什么要把它们结合起来？

    - 解耦：在单体 FSM 里，状态转移通常是一个函数直接调用下一个函数。在分布式系统里，组件是独立的。当“支付服务”完成扣款，它不能直接去修改“订单服务”的内存状态，而是应该发布一个 OrderPaid 事件。订单服务中的 FSM 订阅这个事件，自己完成状态转移。

    - 弹性与可追溯：所有事件都被记录在日志里。如果系统崩溃，重放事件就能把状态机恢复到最新状态。你是先有了“发生了什么”的完整账本，然后才推导出“当前状态”。

    所以，在分布式环境下，EDA 是 FSM 得以在多个服务间可靠运作的必经之路。


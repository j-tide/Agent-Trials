content:
  prompt: "\U0001FAAAAgent Card 是什么？如何设计一个好的 Agent Card？"
answer:
  mode: rubric
  reference_answer: |-
    Agent Card 是每个 Worker Agent 对外公开的“名片 + 简历”，用结构化 JSON 描述自己的身份、技能、接口和约束。 Orchestrator 通过读取它来决定“这个 Agent 能帮我做什么，怎么跟它通信”。

    一个标准的 Agent Card 包含六个核心字段：

    ```json
    {
      "name": "Financial Analyst Agent",
      "description": "专精于财务报表分析、趋势预测和异常检测。",
      "url": "https://agents.company.com/financial-analyst/a2a",
      "version": "2.1.0",
      "capabilities": {
        "skills": [
          {
            "id": "financial_statement_analysis",
            "description": "分析资产负债表、利润表和现金流量表，提取关键指标并给出评分。",
            "inputSchema": { ... },
            "outputSchema": { ... },
            "examples": [ ... ]
          }
        ],
        "streaming": true,
        "pushNotifications": false,
        "maxTaskDuration": 300
      },
      "provider": {
        "name": "Finance Team",
        "contact": "fin-ai@company.com"
      },
      "security": {
        "authentication": "oauth2",
        "authorization": "role:finance-readonly"
      }
    }
    ```

    设计一个好 Agent Card 的五个原则：

    - 描述要“对人友好，对 LLM 更友好”
    description 不是写给开发者看的注释，它会被 LLM 读到来做路由决策。所以要具体、无歧义。例如，不要只写“分析数据”，要写“分析 CSV/Excel 格式的销售数据，输出同比/环比增长率和异常检测报告”。

    - 技能定义要精确，包含 Schema 和示例
    每个 Skill 必须有清晰的 inputSchema 和 outputSchema（JSON Schema 格式），最好附带 1-2 个输入输出示例。这让 Orchestrator 的 LLM 能准确组装调用参数。

    - 声明非功能性能力

    - 版本号是必须的
    技能会迭代，version 字段让 Orchestrator 知道当前连接的 Agent 是哪个版本，便于做兼容性检查或技能降级。

    - 安全边界要清晰

    好的 Agent Card 应该让 Orchestrator 在没有文档的情况下，只通过这张卡片就能正确路由任务。 就像你招人，看完简历就知道他能不能胜任这个岗位。在工程上，通常由一个中心注册服务（如 Consul + 自定义元数据）来存储和管理所有 Agent Card，Orchestrator 启动时或定期拉取。


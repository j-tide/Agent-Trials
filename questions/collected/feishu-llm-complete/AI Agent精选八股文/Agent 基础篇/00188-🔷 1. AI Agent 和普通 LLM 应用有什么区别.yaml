content:
  prompt: "\U0001F537 1. AI Agent 和普通 LLM 应用有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    一句话区别：

    普通 LLM 应用是“一问一答”，模型是被动的处理器；AI Agent 是“目标驱动”的自主行动者，它主动规划、调用工具、根据反馈调整，直到任务完成。

    [图片内容未导入]

    细节对比：

    [嵌入表格未展开]

    一个典型对比示例：

    普通 LLM 应用：用户问“今天北京的天气如何？”，模型根据训练数据给一个可能过时的答案，或者干脆说不知道。

    AI Agent：收到同样问题后，会自己调用天气 API，解析返回的 JSON，再回答用户，并且把结果记下来供后续参考。

    Agent 的代码示意（微型 ReAct 循环）：

    def simple_agent(user_goal):
        messages = [{"role": "system", "content": "你是自主助理，可以使用工具。"}]
        while True:
            # 1. LLM 思考下一步行动
            response = llm(messages)
            # 2. 解析 LLM 输出：是最终答案还是工具调用
            if response.is_final():
                return response.text
            tool_name, tool_args = response.parse_action()
            # 3. 执行工具调用
            observation = execute_tool(tool_name, tool_args)
            # 4. 将观察反馈加入历史，继续循环
            messages.append({"role": "assistant", "content": response.raw})
            messages.append({"role": "user", "content": f"工具返回：{observation}"})

    普通 LLM 应用没有 while 循环，没有工具调用，直接一次返回结果。这是最本质的不同。


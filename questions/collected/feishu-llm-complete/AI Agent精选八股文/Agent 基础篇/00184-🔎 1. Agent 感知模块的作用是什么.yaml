content:
  prompt: "\U0001F50E 1. Agent 感知模块的作用是什么？"
answer:
  mode: rubric
  reference_answer: |-
    一句话定义： 感知模块是 Agent 的“感官”，负责将来自外部环境的多源信息（文本、图像、声音、API 返回等）转化为 Agent 大脑能统一理解的结构化认知。

    环境刺激 → [感知模块] → 结构化认知 → 大脑(LLM) → 决策与行动

    三大核心作用：

    - 信号采集与初步过滤
    接收用户输入、传感器数据、工具返回结果，过滤噪声与无关信息。例如摄像头帧中去掉模糊画面，只保留清晰的关键帧。

    - 多模态对齐与语义提取
    将不同模态（图片、语音、文字）统一转换成语义向量或自然语言描述，让 LLM 这个“语言大脑”能平等对待所有输入。

    - 不确定性量化
    不光输出“看到了什么”，还要给出“我有多确定”。这对 Agent 的后续决策至关重要——如果视觉模型说“可能是红色（置信度 60%），也可能是橙色（30%）”，大脑就不该武断地执行下一步。

    一个微型的感知模块代码骨架：

    class PerceptionModule:
        def __init__(self, vision_model, audio_model, text_encoder):
            self.vision = vision_model
            self.audio = audio_model
            self.text_encoder = text_encoder

        def perceive(self, inputs):
            percepts = []
            for modal, data in inputs.items():
                if modal == "image":
                    caption, confidence = self.vision.describe(data)
                    percepts.append({"type": "image", "content": caption, "confidence": confidence})
                elif modal == "audio":
                    transcript = self.audio.transcribe(data)
                    percepts.append({"type": "audio", "content": transcript})
                elif modal == "text":
                    embedding = self.text_encoder.encode(data)
                    percepts.append({"type": "text", "content": data, "embedding": embedding})
            return self.unify(percepts)

        def unify(self, percepts):
            # 将所有感知结果合并成自然语言摘要，供大脑使用
            description = ""
            for p in percepts:
                description += f"[{p['type']}]: {p['content']}\n"
            return description

    感知模块的职责不是“做最终判断”，而是忠实地把世界的多样性压缩成大语言模型消化的信息包。


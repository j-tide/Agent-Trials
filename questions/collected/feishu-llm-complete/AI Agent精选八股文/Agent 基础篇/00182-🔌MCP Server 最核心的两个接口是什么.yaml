content:
  prompt: "\U0001F50CMCP Server 最核心的两个接口是什么？"
answer:
  mode: rubric
  reference_answer: |-
    如果从协议交互的“必须”和“高频”角度来选，MCP Server 最核心的两个接口是：

    - tools/list：让 Agent 知道你能做什么

    - tools/call：让 Agent 能够真的去做事

    [图片内容未导入]

    为什么是这两个？

    - tools/list 是动态发现的基础。没有它，Agent 就不知道有什么工具可用，只能靠人把工具描述硬编码在 prompt 里。MCP 最核心的创新之一就是让 LLM 自己看菜单点菜，而 tools/list 就是菜单本身。

    - tools/call 是价值落地的关键。Agent 通过 tools/list 知道了工具，但最终必须通过 tools/call 去执行数据库查询、文件读取、API 调用等具体操作。这是 MCP 从“描述”到“行动”的桥梁。

    协议层面的典型消息：

    请求 tools/list：

    {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}

    响应：

    {
      "tools": [
        {
          "name": "query_db",
          "description": "执行安全的 SQL 查询，只支持 SELECT",
          "inputSchema": {
            "type": "object",
            "properties": {
              "sql": {"type": "string", "description": "要执行的 SQL 语句"}
            },
            "required": ["sql"]
          }
        }
      ]
    }

    请求 tools/call：

    {
      "jsonrpc": "2.0",
      "id": 2,
      "method": "tools/call",
      "params": {
        "name": "query_db",
        "arguments": {"sql": "SELECT name, stock FROM products WHERE stock < 10"}
      }
    }

    响应：

    {
      "content": [{"type": "text", "text": "[{\"name\":\"Widget\",\"stock\":3},...]"}]
    }

    虽然 MCP 还定义了 resources/read、prompts/get 等接口，但对于绝大多数 Agent 应用场景来说，tools/list 和 tools/call 是让模型从“说”到“做”的最关键的两个。 理解这两个接口的职责和协作方式，就掌握了 MCP 的主动脉。


answer:
  mode: rubric
  reference_answer: "2.1 本质区别\n\n用一张图来展示它们关注点的不同：\n\n[图片内容未导入]\n\n[嵌入表格未展开]\n\n打个比方：\n\nCoT
    是解数学题时在草稿纸上的演算；\n\nCoD 是做大项目时在白板上画的 WBS（工作分解结构）。\n\n2.2 如何设计多层次的分解策略？\n\n好的任务分解不是“一下全拆成原子步骤”，而是自顶向下、逐层细化。\n\n三层分解框架：\n\n第
    1 层：阶段拆分（Phase-level）\n  把大任务分成若干独立阶段，每个阶段有明确的产出物。\n  例如：竞品分析 → 准备阶段、调研阶段、分析阶段、报告阶段。\n\n第
    2 层：步骤拆分（Step-level）\n  每个阶段再拆成具体执行步骤，每步可对应一个工具调用或一个子目标。\n  例如：调研阶段 → 2.1 搜索竞品A官网，2.2
    抓取产品特性，2.3 收集定价信息。\n\n第 3 层：原子动作（Action-level）\n  如果某一步仍然复杂，进一步拆到可直接执行的原子操作。\n
    \ 例如：2.2 抓取产品特性 → 打开URL → 提取页面文本 → 用LLM归纳功能点。\n\n代码示例：多层次分解的递归实现\n\nfrom typing
    import List, Dict\n\ndef decompose_task(task: str, depth: int = 0, max_depth:
    int = 2) -> List[Dict]:\n    \"\"\"\n    递归分解任务，直到达到最大深度或任务已足够简单\n    \"\"\"\n
    \   # 终止条件：任务足够简单，或达到最大深度\n    if is_simple(task) or depth >= max_depth:\n        return
    [{\"action\": task, \"type\": \"executable\"}]\n    \n    # 调用 LLM 生成子任务列表\n    sub_tasks
    = llm_decompose(task)  # 返回如 [\"查官网\", \"抓数据\", \"分析\"]\n    \n    result = []\n
    \   for sub in sub_tasks:\n        # 为每个子任务增加上下文：当前阶段、父任务\n        enriched_sub
    = f\"[阶段{depth+1}] {sub} (来自: {task[:30]}...)\"\n        child_steps = decompose_task(enriched_sub,
    depth+1, max_depth)\n        result.append({\n            \"task\": sub,\n            \"sub_steps\":
    child_steps\n        })\n    return result\n\n# 示例：LLM 分解提示\ndef llm_decompose(task:
    str) -> List[str]:\n    prompt = f\"\"\"\n将以下任务分解为 3~5 个独立的子任务，每行一个，使用动词开头。\n任务：{task}\n子任务列表：\n\"\"\"\n
    \   response = call_llm(prompt)\n    return [line.strip(\"- \") for line in response.split(\"\\n\")
    if line.strip()]\n\n控制分解粒度的原则：\n\n- 每个叶子节点应是一个可以直接调用工具或人工执行的动作，不需要再思考“怎么做”。\n\n-
    避免过早原子化：顶层拆得太细会失去全局视角，让 LLM 产生幻觉或步骤冗余。\n\n- 使用模板约束：在 prompt 中给定分解示例（Few-shot），让模型遵循既定的层次结构。\n\n---"

content:
  prompt: "\U0001F504 1. ReAct 框架的名字是什么意思？它解决了什么问题？"
answer:
  mode: rubric
  reference_answer: "ReAct 是 Reasoning + Acting 的合写。 字面上就是“推理”和“行动”交替进行的意思。\n\n传统
    LLM 用法:\n  问题 → 思考(隐式) → 回答\n\nReAct:\n  问题 → 思考 → 行动 → 观察 → 思考 → 行动 → … → 回答\n\n它解决的核心问题：纯思维链不可靠，纯行动又盲目。\n\n-
    纯 CoT（思维链）：模型只在脑中推理，不能查外部信息。一旦某个知识点没记住、或者需要实时数据，就会产生幻觉。比如让它算今天的股价涨跌幅，它不知道今天收盘价是多少，硬算出一个错误数字还一脸自信。\n\n-
    纯 Acting（函数调用）：只调工具，没有推理的灵活度。面对模糊问题时，不清楚该先调哪个工具、参数该怎么填。\n\nReAct 把两者编织到一起：\n\n\U0001F539
    一个微型 ReAct 循环，帮你感受它的运作：\n\ndef react_agent(user_query):\n    messages = [{\"role\":
    \"system\", \"content\": \"你是 ReAct Agent，可以调用工具。使用 Thought/Action/Observation
    格式。\"}]\n    messages.append({\"role\": \"user\", \"content\": user_query})\n
    \   for step in range(max_steps):\n        response = llm(messages)  # LLM 输出包含
    Thought 和 Action\n        thought, action_name, action_args = parse(response)\n
    \       if action_name == \"FINISH\":\n            return action_args[\"answer\"]\n
    \       # 执行工具调用\n        observation = tools[action_name](**action_args)\n        #
    把行动和观察结果追加回消息列表\n        messages.append({\"role\": \"assistant\", \"content\":
    response})\n        messages.append({\"role\": \"user\", \"content\": f\"Observation:
    {observation}\"})"

content:
  prompt: "\U0001F9F0 MCP Server 的三类能力（Resources/Tools/Prompts）有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    MCP 把 Server 能提供的能力抽象成了三个互补的元语，它们共同覆盖了“数据读取”、“行动执行”和“行为引导”三大需求。

    [图片内容未导入]

    ① Resources（资源）

    - 本质：模型可读、但不可修改的数据端点。类似 REST 的 GET，但用统一协议暴露。

    - 特点：有唯一的 URI 标识（如 file:///documents/report.pdf），支持多种 MIME 类型。可以是被动读取，也支持通过 subscriptions 订阅变更通知。

    - 何时用：你的 Agent 需要访问文件系统、数据库视图、企业内部知识库等只读数据时。

    ② Tools（工具）

    - 本质：模型可以主动调用执行的函数，通常会产生副作用或返回计算结果。

    - 特点：包含完整的 JSON Schema 参数定义，使得 LLM 可以根据描述自主决定调用。执行结果返回为结构化内容（文本、图片等）。

    - 何时用：需要模型去“做某事”——发邮件、订机票、操作数据库、调用外部 API。

    ③ Prompts（提示模板）

    - 本质：预定义的对话模板，可以包含参数，帮助用户或模型快速启动特定类型的任务。

    - 特点：可以带参数（如 {topic}），并由 Server 提供默认值。一个 Server 可以暴露多个 Prompt，Host 能列出并让用户选择。

    - 何时用：你想要引导用户与 LLM 以特定方式交互。例如，一个“周报生成器”Server 可以提供“写周报”Prompt，用户只需填入项目名称，Prompt 自动组合出完整的指导语。

    一个 Server 可以同时提供这三者。 比如一个“GitHub MCP Server”：

    - Resources：暴露仓库的文件树、README 内容（只读）。

    - Tools：提供 create_issue、merge_pr 等可执行操作。

    - Prompts：提供“生成 Commit Message”或“总结 Pull Request”的对话模板。

    收尾：

    这三类能力就像餐厅里的菜单（Prompts）、厨具（Tools） 和食材（Resources）。菜单告诉你能点什么，厨具帮你加工，食材是原材料。MCP 把它们标准化后，任何会“点菜”的 AI 都能在任意厨房里做出佳肴——这就是生态的力量。

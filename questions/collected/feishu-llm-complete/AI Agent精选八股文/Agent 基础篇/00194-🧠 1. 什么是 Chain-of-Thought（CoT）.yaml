content:
  prompt: "\U0001F9E0 1. 什么是 Chain-of-Thought（CoT）？"
answer:
  mode: rubric
  reference_answer: |-
    一句话：让模型在给出最终答案之前，先把思考过程说出来。

    标准的问答方式是：

    问题 → 答案

    CoT 的方式是：

    问题 → 中间推理步骤 1 → 步骤 2 → … → 最终答案

    为什么需要它？

    大模型在生成本身就是逐 token 进行的，但你若不要求它写出推理过程，它的“内心独白”可能很短、跳跃，导致复杂问题的准确率暴跌。CoT 迫使模型把隐式的思考外化成显式的文字，从而延长了有效推理链条，激活了更多相关知识，并降低了跳跃性错误。

    直观示意图：

    [图片内容未导入]

    写出过程后，模型每一步的 token 生成都受到前一步逻辑的约束，出错的概率大幅降低。

    技术本质： CoT 不改变模型参数，它是一种 Prompt 策略，通过构造包含推理链的示例（Few-shot）或一句触发语（Zero-shot），把模型从“快思考”切换成“慢思考”模式。


answer:
  mode: rubric
  reference_answer: |-
    一句话：先做全局规划，再按计划分步执行，中间可以根据执行反馈修正计划。

    [图片内容未导入]

    它解决了什么问题？

    ReAct 是走一步看一步，非常适合探索性任务。但有些任务目标清晰、步骤繁多但确定性强，比如“分析这个 CSV 数据，做清洗、统计、画图、写报告”，如果完全靠 ReAct 一步步试，会非常低效且容易在中途迷失方向。

    Plan-and-Execute 就是为这类长程、多步骤、可预规划的任务而生：一次性把全局蓝图想清楚，再逐个击破。

    核心组件：

    - Planner：接收用户目标，生成结构化的计划（通常是一个 JSON 列表，每项包含步骤描述、需要的工具、预期输出）。

    - Executor：一个能按步骤执行并收集结果的子 Agent（它可以内部使用 ReAct！）。

    - Replanner：如果某个步骤执行结果偏离预期，就更新剩余计划。


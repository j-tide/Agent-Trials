    具体场景分析：

    - 用 Few-shot CoT 的典型场景

    - 用 Zero-shot CoT 的典型场景

    混合策略：示例骨架 + 零样本推理

    一种很有效的工程方法是：给一个“推理骨架”作为系统提示，但不给具体示例内容，让模型自己填。例如：

    你要用以下步骤解决任何问题：
    1. 重述问题
    2. 列出所需信息
    3. 逐步推理
    4. 交叉检查
    5. 给出最终答案
    现在解决问题：{user_input}

    这结合了 Few-shot 的结构化优势和 Zero-shot 的灵活性。

    代码示例：Agent 内自适应选择 CoT 策略

    def agent_think(task_description, model_strength="strong"):
        # 根据模型强度和任务来源选择
        if model_strength == "weak" or task_is_domain_specific(task_description):
            # 用 Few-shot
            examples = retrieve_relevant_examples(task_description)
            prompt = build_few_shot_cot_prompt(examples, task_description)
        else:
            # 用 Zero-shot CoT
            prompt = f"{task_description}\nLet's think step by step."
        return llm(prompt)

    在 LangGraph 架构中，这个逻辑可以放在 Planner 或 Executor 节点的开始，动态决定使用哪种 Prompt 模板。

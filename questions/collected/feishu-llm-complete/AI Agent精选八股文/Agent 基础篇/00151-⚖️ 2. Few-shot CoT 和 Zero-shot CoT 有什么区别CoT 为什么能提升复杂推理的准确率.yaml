    2.1 两者的区别

    Few-shot CoT：在 prompt 里提供几个完整的（问题、推理链、答案）示例，模型模仿示例的推理风格和粒度。

    Zero-shot CoT：不加任何示例，只在问题末尾加上“Let's think step by step”（让我们逐步思考）之类的触发语，模型自行产生推理链。

    用一个简单代码对比来感受：

    # Few-shot CoT
    few_shot_prompt = """
    问题: 小明有5个苹果，吃了2个，又买了3个，现在有几个？
    思考: 5 - 2 = 3，3 + 3 = 6。答案是6。
    问题: 一本书原价80元，打7折后再减10元，最终价格？
    思考: 80 * 0.7 = 56，56 - 10 = 46。答案是46元。
    问题: 篮球赛第一节得22分，第二节得18分，第三节得25分，第四节得分比第三节少5分，总分？
    思考:
    """
    # 模型会续写: "第三节25分，第四节 25-5=20分。22+18=40，40+25=65，65+20=85。答案是85分。"

    # Zero-shot CoT
    zero_shot_prompt = """
    篮球赛第一节得22分，第二节得18分，第三节得25分，第四节得分比第三节少5分，总分？
    Let's think step by step.
    """
    # 模型会自己产生推理步骤，但可能不如 Few-shot 稳定

    [嵌入表格未展开]

    2.2 CoT 为什么能提升复杂推理的准确率？

    有三个核心原因：

    - 分解了问题难度
    多步推理任务本质是“序列决策”，直接跳到大结局容易在中间某一步隐式出错。CoT 把端到端的巨大跳跃，切成了多个“小步”，每一步都是模型擅长的简单计算或常识调取。

    - 激活了相关知识和范式
    当模型写出“22+18=40”时，它不仅仅是做加法，还让自注意力机制把“得分”“加法”“累加”等关联概念强化，进而更容易正确完成后续步骤。这就像你解数学题时在草稿纸上列式，能让你看到更多联系。

    - 增加了计算深度（有效深度）
    虽然 Transformer 层数是固定的，但通过 CoT 生成的中间 token，模型对自己之前的推理进行了“二次阅读”和修正。这相当于在不增加参数的情况下，动态加深了推理路径。实验表明，很多模型在 CoT 下的准确率可以从 30% 提升到 80% 以上，且这种提升随问题步数增加而更显著。


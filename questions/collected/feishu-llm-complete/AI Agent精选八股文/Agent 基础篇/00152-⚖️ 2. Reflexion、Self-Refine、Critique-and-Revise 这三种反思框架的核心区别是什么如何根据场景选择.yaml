content:
  prompt: "⚖️ 2. Reflexion、Self-Refine、Critique-and-Revise 这三种反思框架的核心区别是什么？如何根据场景选择？"
answer:
  mode: rubric
  reference_answer: "这三个框架像是反思进化的三个阶梯，区别就在于 “批评者是谁” 以及 “批评的依据是什么”。\n\n\U0001F539 核心区别一览\n\n[嵌入表格未展开]\n\n-
    Self-Refine：写手自己审稿。成本低、实现简单，但容易陷入“自恋”或“自我怀疑”，对真正的硬伤视而不见。\n\n- Critique-and-Revise：请一位专业编辑审稿。批评者可以是另一个更强大的模型、一个针对特定指标（如安全性、结构完整性）训练的轻量分类器、或者一套规则。它解决了Self-Refine“自我偏见”的问题。\n\n-
    Reflexion：让事实和逻辑来审稿。它不依赖任何模型的“感觉”，而是用可验证的结果说话。这是最可靠的方式，但实现成本最高，且很多任务根本构建不了这样的环境。\n\n\U0001F539
    场景选择决策图\n\n[图片内容未导入]\n\n\U0001F539 具体场景举例\n\n- 数学题求解：选 Reflexion。把模型生成的答案代入公式或交给计算器，马上知道对错。\n\n-
    制定营销方案：选 Self-Refine。没有绝对的对错，GPT-4级别的模型自己反思几轮，往往能产出更有创意的点子。\n\n- 智能客服回答：选 Critique-and-Revise。用一个小的“合规模型”去检查主模型生成的回答是否包含了禁忌词、是否有承诺过度的风险，发现问题就打回去重写。\n\n收尾：
    这三个框架没有绝对的优劣，而是在“反馈质量”和“实现成本”的坐标系里各自占据了一个位置。你的任务，就是根据手头的资源和业务容错率，找到那个最佳平衡点。\n\n---"

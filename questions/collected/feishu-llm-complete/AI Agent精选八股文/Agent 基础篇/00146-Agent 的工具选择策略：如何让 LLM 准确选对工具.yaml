  reference_answer: |-
    1、基础题：为什么 LLM 会选错工具？

    难度级别：⭐（考察要点：工具描述质量、注意力分散、边界模糊）

    选错工具主要有三个原因：描述写得不清楚，模型不知道该工具的适用边界；工具太多（20+），context 里工具描述 token 量大，LLM 注意力分散；功能相似的工具之间区别没说清，LLM 在边界场景下容易混淆。这三个问题对应三个解法：优化描述质量、分层路由、Few-shot 示例。

    ---

    2、进阶题：工程实践中如何提升 Agent 工具选择的准确率？工具数超过 20 个时怎么设计路由？

    难度级别：⭐⭐（考察要点：description 四要素、两级路由设计、向量检索召回、Few-shot 的正反例搭配）

    1️⃣ Common Answer

    要提高工具选择准确率，最重要的是把工具描述写清楚，告诉模型这个工具是干嘛的、输入输出是什么。如果工具很多，可以把工具分组，让模型先选类别再选工具，避免一次性选太多。另外在 Prompt 里加几个例子也有帮助。

    2️⃣ Impressive Answer

    我会从描述质量、路由设计、Few-shot 三个层面来做：

    - 工具描述（description）写法。四要素：动词开头说清职责（不要写"这是一个工具"这种废话）；参数的类型、格式、取值范围说清楚；写"适用场景"和"反适用场景"（后者更关键，能避免误用）；有功能相似的工具，在描述里直接点出区别，比如"查实时天气用 get_current_weather，查历史天气用 get_weather_history"。

    - 两级路由设计。工具超过 20 个时，把工具按领域分组（数据查询类、代码执行类、文件操作类等），第一次 LLM 调用只让模型选工具组，context 里只有工具组描述；确定工具组后，第二次调用只注入该组内的工具，做精确选择。每级候选控制在 5-8 个最佳。进阶方案是用向量检索做第一级路由：把用户意图向量化，和工具描述做语义匹配，召回 top-k 候选，再让 LLM 最终选择——这样 token 消耗更少且能动态响应新增工具。

    - Few-shot 设计。核心价值是建立选择标准，特别是边界模糊的工具。3-5 个示例够用，必须覆盖两类：正确选择的典型场景，以及容易混淆时应该选 A 不选 B 的反例。过多示例反而稀释注意力。


content:
  prompt: "\U0001F4CB 1. 思维链分解（CoD）是什么？"
answer:
  mode: rubric
  reference_answer: |-
    Chain of Decomposition（CoD）是一种面向任务的 Prompt 策略，让模型把复杂问题逐层拆解成可直接执行的子任务，而不是直接推理答案。

    如果说 CoT（思维链）是“一步一步想出答案”，那 CoD 就是“一步一步列出要做的事”。

    直观对比：

    [图片内容未导入]

    CoD 本质上是在 Planning 阶段 的思维链。它不直接解决问题，而是生成一个可执行计划，后续再交给专门的执行器（或 Agent 自身）逐步完成。


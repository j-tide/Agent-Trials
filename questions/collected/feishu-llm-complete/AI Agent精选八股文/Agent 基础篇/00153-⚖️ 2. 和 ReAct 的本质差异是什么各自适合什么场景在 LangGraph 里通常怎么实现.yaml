    2.1 本质差异对比

    ReAct：
      Thought → Action → Observation → Thought → Action → ...
      动态、交错、应对不确定性强

    Plan-and-Execute：
      Plan → (Execute Step 1 → Step 2 → ...) → [Replan?]
      全局视野、步骤清晰、适合长流程


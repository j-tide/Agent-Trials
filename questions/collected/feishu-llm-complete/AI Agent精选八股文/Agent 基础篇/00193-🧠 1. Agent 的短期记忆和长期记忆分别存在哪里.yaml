content:
  prompt: "\U0001F9E0 1. Agent 的短期记忆和长期记忆分别存在哪里？"
answer:
  mode: rubric
  reference_answer: |-
    本质一句话：

    - 短期记忆：存放在上下文窗口（Context Window） 中，通过当前对话的消息列表直接呈现给 LLM。

    - 长期记忆：存放在外部存储（如向量数据库、关系数据库、文件系统）中，按需检索后注入上下文窗口。

    [图片内容未导入]

    短期记忆的存放：

    - 物理上，就是调用 LLM 时 messages 列表里的那些内容。

    - 包含：system prompt、用户消息、assistant 回复（含工具调用与思考）、工具返回的 observation。

    - 生命周期：单次会话或滑动窗口内有效，窗口满了就要裁剪或摘要。

    长期记忆的存放：

    - 向量数据库：如 Chroma、Pinecone、Milvus。把对话片段或事实做 Embedding，支持语义检索。

    - 关系数据库/缓存：存储结构化信息，如用户姓名、偏好、历史任务总结。

    - 文件系统：用于保存完整对话日志、反思笔记等非结构化长文本。

    代码示例：短期记忆即 messages，长期记忆存入向量库

    # 短期记忆就是 messages 列表
    short_term_memory = [
        {"role": "system", "content": "你是智能助手"},
        {"role": "user", "content": "帮我订机票"},
        {"role": "assistant", "content": "好的，请问出发地和目的地？"},
        {"role": "user", "content": "北京到上海，明天"}
    ]

    # 长期记忆：将重要事实存入向量数据库
    import chromadb
    client = chromadb.Client()
    collection = client.create_collection("long_term_memory")

    # 抽取事实并存储
    fact = "用户常住北京，偏好靠窗座位"
    embedding = get_embedding(fact)
    collection.add(documents=[fact], embeddings=[embedding], ids=["fact_001"])

    关键理解： 短期记忆是 LLM 的“工作内存”，容量有限但访问极快；长期记忆是“硬盘”，容量近乎无限但需要检索。Agent 的记忆系统就是让两者高效协同。


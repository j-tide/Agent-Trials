    ### LLM 网关（LiteLLM）的选型与统一调用接口设计

    ---

    1、基础题：为什么在生产环境中不建议直接调用单一 LLM 提供商的 API？

    难度级别：⭐（单点依赖风险、限流问题、多模型组合需求）

    直接依赖单一提供商存在三个问题：一是单点风险，API 故障或涨价没有备选；二是限流问题，高并发时单个 API Key 的 RPM/TPM 上限会成为瓶颈；三是不同任务适合不同模型，比如代码生成用 Claude、中文理解用 Qwen，单一提供商无法满足组合需求。因此生产环境通常需要一个统一的 LLM 网关层来屏蔽这些差异。

    ---

    2、进阶题：在需要接入多家 LLM 提供商的场景下，如何设计统一的调用接口？LiteLLM 是怎么解决这个问题的？

    难度级别：⭐⭐（LiteLLM 统一 OpenAI 格式、多 Key 轮询防限流、模型降级策略、成本追踪回调）

    1️⃣ Common Answer

    在接入多家 LLM 时，可以封装一个统一的调用类，内部根据配置选择不同的 API。LiteLLM 是一个开源工具，能用 OpenAI 的接口格式调用 Anthropic、Google 等不同的模型，这样切换模型时不需要改太多代码。LiteLLM 还支持负载均衡，可以配置多个 API Key，在它们之间分发请求。如果一个模型出问题了，可以自动切换到备用模型。

    2️⃣ Impressive Answer

    我会从 LiteLLM 解决的四个核心问题来回答：

    - 首先是统一接口，屏蔽各家 API 格式差异。LiteLLM 把 100+ 模型统一封装成 OpenAI Chat Completion 格式，切换模型只改 model 字符串，业务代码完全不动。Claude、Gemini、本地 Ollama 都能用同一套调用方式。

    - 其次是多 Key 轮询防限流。单个 API Key 有 RPM 和 TPM 上限，多 Key 轮询是最简单的绕过手段。LiteLLM Router 支持 round-robin、least-busy、latency-based 三种策略，生产上推荐 least-busy，把请求打到当前负载最低的 Key。

    - 再次是按优先级的模型降级（Fallback）。主模型限流或不可用时，自动按顺序切换到备用模型。LiteLLM 还支持 context_window_fallbacks——当请求超过主模型的 Context Window 时，自动切换到支持更长 Context 的备用模型，非常实用。

    - 最后是成本追踪。LiteLLM 内置每次调用的 token 消耗和预估成本，通过注册 success_callback 可以把成本数据写入自己的数据库或监控系统，按用户、功能模块做成本分摊。如果用 LiteLLM Proxy 独立部署，还能在 Web UI 上查看成本报表。

    3️⃣ Key Differences


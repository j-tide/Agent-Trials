    ### LLM 可观测性：LangSmith 与 Langfuse 的接入与对比

    ---

    1、基础题：为什么 LLM 应用的可观测性比传统服务更难？

    难度级别：⭐（LLM 输出不确定性、Prompt 变化的影响、调试手段的差异）

    传统服务出问题看日志和指标就够了，但 LLM 应用出问题时，你需要知道的是"模型在第几步拿到了什么 Prompt、输出了什么、为什么跑偏了"。LLM 的输出具有不确定性，同一个 Prompt 不同时间可能输出不同结果，而且 Prompt 的微小改动可能引发大幅性能退化，这些都是传统监控指标无法捕捉的。因此 LLM 应用需要更细粒度的 Trace 体系，能还原完整的调用链路和每步的输入输出。

    ---

    2、进阶题：如何为 LLM 应用建立可观测性体系？请说明 Trace/Run/Span 的概念，以及 LangSmith 和 Langfuse 的核心差异。

    难度级别：⭐⭐（Trace/Run/Span 树形结构、LangSmith 零代码接入、Langfuse 自托管、Token 成本统计与业务标签）

    1️⃣ Common Answer

    LLM 可观测性就是监控 LLM 应用的运行情况，包括每次调用的输入输出、耗时、token 消耗等。LangSmith 是 LangChain 官方的可观测性平台，接入方便，只需要设置几个环境变量就能自动追踪所有 LangChain 调用。Langfuse 是开源的替代方案，可以自托管，数据不需要上传到第三方。Trace 是一次完整的请求记录，Run 是其中某次 LLM 调用，可以通过这些记录来排查问题和分析成本。

    2️⃣ Impressive Answer

    我会从概念体系、工具接入和选型决策三个层面来回答：

    - 首先是 Trace/Span/Run 的树形结构。一次用户请求对应一个 Trace（有唯一 ID），Trace 下是树状嵌套的 Span——AgentExecutor 是顶层 Span，下面挂着多个 LLM Call（Run）和 Tool Call（Span），Tool Call 下面还可以有 HTTP Request Span。这个树形结构还原了 Agent 的实际执行路径，定位问题时能一眼看到哪一步的输入输出出了问题。

    - 其次是两个工具的接入方式。LangSmith 对 LangChain/LangGraph 项目是真正的零代码接入，设三个环境变量（LANGCHAIN_TRACING_V2、LANGCHAIN_API_KEY、LANGCHAIN_PROJECT），所有 Chain 和 Agent 调用自动被 Trace，不需要改业务代码。Langfuse 需要手动用 @observe() 装饰器标记函数，灵活度更高，非 LangChain 项目也能用，自托管时数据完全不出公司。

    - 最后是成本统计和选型建议。两个平台都支持按时间、模型、用户、功能模块维度做 token 和成本聚合。实践中我会给每个 Trace 打业务标签（feature、user_id、experiment_group），这样能精确知道每个功能模块的 LLM 成本，方便做 ROI 分析。选型上：技术栈是 LangChain/LangGraph 且无数据合规要求，直接用 LangSmith；非 LangChain 项目或有合规要求，选 Langfuse 自托管。两者都要做的是在 CI 里跑冒烟测试时也开启 Trace，这样 Prompt 改动引发的性能退化能在上线前就发现。

    3️⃣ Key Differences


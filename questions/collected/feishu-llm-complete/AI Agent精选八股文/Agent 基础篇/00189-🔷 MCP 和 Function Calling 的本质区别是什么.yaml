content:
  prompt: "\U0001F537 MCP 和 Function Calling 的本质区别是什么？"
answer:
  mode: rubric
  reference_answer: |-
    一句话概括：

    Function Calling 是模型能力边界的“扩展接口”，而 MCP 是连接模型与万物的“标准化总线”。

    我们用一张图看清两者的定位差异：

    [图片内容未导入]

    五个维度的本质差异：

    [嵌入表格未展开]

    用代码直观感受：

    Function Calling 的典型流程（以 OpenAI 为例）：

    # 硬编码工具定义
    tools = [{
        "type": "function",
        "function": {
            "name": "get_weather",
            "description": "获取天气",
            "parameters": {"type": "object", "properties": {"city": {"type": "string"}}}
        }
    }]
    response = client.chat.completions.create(
        model="gpt-4",
        messages=[{"role": "user", "content": "北京天气"}],
        tools=tools
    )
    # 手动解析调用结果，再去请求真正的天气 API

    MCP 的流程（模型无关）：

    # 1. 动态发现（不需要提前写死）
    tools = mcp_client.list_tools()
    # 2. LLM 看到工具列表后自主决策
    decision = llm.think(user_input, available_tools=tools)
    # 3. 统一执行
    result = mcp_client.call_tool(decision.tool_name, decision.arguments)

    本质总结：

    Function Calling 是“厂家给你的遥控器”，只能控制厂家指定的几个电器。

    MCP 是“万能遥控器 + 红外编码标准”，任何电器只要支持这个标准，就能被任何遥控器控制。

    前者解决“能不能做”，后者解决“能不能一起做”。


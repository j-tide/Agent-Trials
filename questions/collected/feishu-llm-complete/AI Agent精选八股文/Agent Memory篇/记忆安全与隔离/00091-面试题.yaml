answer:
  mode: rubric
  reference_answer: |-
    Agent在对话中记录了用户的手机号，后来用户要求“清除我所有的数据”，如何做到彻底删除？

    ---

    ### 一、题目拆解与考点地图

    这道题表面是功能实现，背后至少埋伏了六个考点维度：

    - 合规与法律底线

    - GDPR、CCPA、《个人信息保护法》等对“删除权/被遗忘权”的要求

    - 哪些数据能删、哪些不能删（监管留存、风控反欺诈等）

    - 数据生命周期梳理

    - 手机号可能散落在哪些系统：对话日志、用户画像、加密存储、消息队列、备份、日志中心、数据仓库、搜索引擎索引等

    - “彻底删除”的技术定义

    - 软删除 vs 硬删除

    - 备份怎么处理

    - 日志能不能删

    - 衍生数据（基于手机号算出的特征）删不删

    - 分布式系统的一致性

    - 删除请求如何广播到所有存储节点

    - 异步删除失败怎么办

    - 删除进行中时用户访问会看到什么

    - 可验证的删除

    - 如何向用户证明已删

    - 审计日志怎么记录

    - 边界与异常

    - 账号注销 vs 清除特定数据

    - 有未完成订单或法律冻结时怎么处理

    - 删除后用户再用同一手机号注册，历史数据不能“复活”

    ---

    ### 二、回答框架（逻辑主线）

    建议按这个顺序展开，既显深度又有条理：

    - 先对齐需求，明确“彻底删除”的口径

    - 理清数据存储的完整链路

    - 设计删除方案：实时删除 + 异步清理 + 备份处理

    - 说明不能删除的特例与合规兜底

    - 可验证性与审计

    ---

    ### 三、参考答案示例（面试现场可说的版本）

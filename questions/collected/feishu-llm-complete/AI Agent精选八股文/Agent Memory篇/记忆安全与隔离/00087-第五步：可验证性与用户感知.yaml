answer:
  mode: rubric
  reference_answer: |-
    - 删除凭证：给用户返回一个删除请求的工单ID，可在48小时后查看清除报告摘要。

    - 后台验证：用用户之前的手机号去各系统“探活”，确认无法查到原始值。

    - 审计跟踪：删除全流程留痕——谁在何时因何请求删除了哪些系统的什么字段，删除前值哈希，结果状态。

    如果用户再用同一手机号注册，系统要保证看不到任何旧数据，这是一个回归测试用例。

    ---

    ### 四、回答技巧点拨（如何不像背答案）

    - 用“我会先做什么”开场
    比如“接到这个需求，我不会马上动手清库，而是先拉上法务和DBA确认删除口径。”这比直接给方案更显成熟。

    - 主动暴露思考的纠结
    比如“衍生数据删不删其实很头疼——模型已经吸收了特征，总不可能重新训练。这类情况我更倾向在模型侧做访问控制，返回结果不包含该用户相关信息，且输入侧不再输入该特征。”体现对现实复杂度的理解。

    - 举一个翻车例子增加可信度
    “我见过一个团队只删了业务表，结果运营同学在BI报表里拉出用户手机号，截图发给了客户，这就是典型的没考虑数据仓库。”——这能让面试官觉得你有实战教训。

    - 反问环节可以深化
    如果面试官追问“那日志到底删不删”，你可以说：“要看我们企业是自建机房还是用云服务。云上日志服务有的支持字段级删除，自建ELK可能就得靠周期清理+热数据脱敏。如果必须在规定天数内硬删，那我会推动日志结构化改造，把手机号从message中拆到可操作字段。”

    ---

    ### 五、面试官评分点（隐形打分卡）

    ---

    ### 六、可复用的思考模板（给面试者练手）

    以后再遇类似“删除数据”的题，套这个链：

    - 定义“删除” — 法律 + 业务口径

    - 数据地图 — 到底散落了多少处

    - 分层执行 — 在线即时、离线异步、不可变存储滞后

    - 不能删的怎么办 — 脱敏、留白、冻结

    - 怎么证明删干净了 — 给用户交代，给自己留审计

    掌握这套思路，无论问的是手机号、人脸特征还是聊天记录，都能快速拆解出高分答案。

    - 业务库中对用户ID对应的个人数据执行硬删除或不可逆脱敏（手机号替换为deleted_uid_xxx），并将状态标记为“已注销”。

    - 清理缓存中该用户的条目。

    - 下发指令给搜索引擎，删除包含该用户标识的文档或更新索引。

    - 通过消息队列广播“用户数据清除事件”，各系统消费并清除。

    - 数据仓库通过分区或按用户ID的删除任务，重写相关分区或打标记并过滤。

    - 校验各系统删除完成情况，对失败任务自动重试，超过阈值告警人工介入。

    - 备份：通常不可直接修改。策略是保留备份恢复时识别该用户为“已删除”的元数据，使恢复后数据立刻被业务逻辑过滤。在下次全量备份循环中，旧备份过期自动淘汰。

    - 日志：应用日志中的手机号需要脱敏流水线重跑历史分区，或等日志按时间轮转自然过期（如果法规允许）。对实时日志系统，加入脱敏规则不再记录。

    - 调用合作伙伴的API，要求同步删除。保留删除凭证。

answer:
  mode: rubric
  reference_answer: |-
    下面这份回答模板，你可以直接代入自己的项目经验去讲。话术故意保留了口语感，避免一听就像在背书。

    “面试官你好，关于 Agent 记忆系统中的 PII 和 GDPR 合规，我理解这本质是个‘系统工程’问题，不能把它当成几个独立功能来拼接。

    我的核心设计原则是‘隐私默认保护’和‘数据最小化’。在这个基础上，我会把整个方案拆成三条主线来推进。

    第一条线，是进记忆前的 PII 检测。 这里最大的坑是上下文相关的间接泄露。比如用户说‘我最近在医院照顾我妈’，虽然没提名字，但结合前面信息，Agent 可能就推断出家庭关系和健康状态。
    所以我会搭一个‘三层漏斗’：

    - 第一层是低延迟的规则引擎，用正则快速抓取邮箱、电话这类直接标识符，直接在端点做初步遮挡或告警。

    - 第二层是细粒度的 NER 模型，专门识别姓名、地名、机构等实体。这一层我不止看输入，还会把 Agent 刚生成的回复也过一遍，防止幻觉吐出不当信息。

    - 最关键的是第三层，上下文敏感的分类器。 我会用一个轻量的语言模型，去判断包含实体的句子是否构成了‘敏感关联’。比如，‘我今年 30 岁’只是事实，‘我确诊了高血压’就属于敏感信息，需要标记为‘受保护记忆’。

    第二条线，是脱敏并存储。 对于标记出来的 PII，绝对不做明文入库。但咱们做 Agent 记忆，难的在于‘还得能用’。完全哈希或匿名化，就没办法帮用户回忆‘上次你提到的三亚旅行’了。
    所以我会采用假名化 + 外部 Vault（保险库） 的架构：

    - 记忆本体里，只存一个无意义的引用令牌（Token），比如‘user_loc_ctx_123’。

    - 真实的‘三亚’和关联的用户ID，加密后存在一个独立、访问控制极严的 PII Vault 里。

    - 当 Agent 需要生成个性化回应时，通过一个授权的‘兑现服务’拿着令牌去 Vault 即时换回明文，用完即焚，绝不留存在生成上下文中。
    这样，就算向量数据库被拖库，拿到的也是一堆令牌，没有可读信息。

    第三条线，就是 GDPR 的数据保留和删除权落地。 这在记忆系统里特别棘手，因为用户事实可能分散在对话切片、知识三元组和向量索引的碎片里。
    我的做法是构建一个以‘用户 ID + 数据类别’为核心的元数据治理层：

    - 保留策略自动化： 每种记忆都带一个‘过期时间戳’，比如会话摘要保留 30 天，提炼的用户偏好则长期保留，但必须允许用户手动调整。一个定时任务会像扫地一样，周期性清理过期数据，并触发对应的向量索引更新。

    - 实现‘被遗忘权’： 这是重中之重。我绝不会简单地从对话表删一行。我会建立一个异步遗忘流水线：一旦收到用户删除请求，先立即在前端接口生效，避免数据被新访问；同时，后台任务会拿着用户 ID，在所有存储——结构化表、向量数据库、PII Vault、甚至是分析日志——中找出所有关联记录，进行不可逆的硬删除或覆写，最后返回一个删除完成的凭证。这套流程必须有审计日志来保证可追溯。

    总结一下，这套方案就是让 Agent 的记忆，既足够聪明地懂用户，又足够谨慎地会‘遗忘’。以上是我的一些思路。”


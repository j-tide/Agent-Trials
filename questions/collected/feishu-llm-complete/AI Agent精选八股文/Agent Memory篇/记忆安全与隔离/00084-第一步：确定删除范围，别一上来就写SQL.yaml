content:
  prompt: 第一步：确定删除范围，别一上来就写SQL
answer:
  mode: rubric
  reference_answer: |-
    用户说“清除我所有的数据”，但作为系统设计者，我必须先定义“所有”的边界。

    我会拿出数据地图，和法务、安全团队一起界定：

    - 核心个人数据：手机号、姓名、身份证号等直接标识符

    - 关联数据：基于手机号的对话记录、订单、地址

    - 衍生数据：比如根据手机号算出的用户标签、画像特征

    - 系统痕迹：访问日志、API调用记录中携带的手机号

    哪些必须删？哪些可以脱敏保留？比如反欺诈模型里的手机号黑名单，可能只能脱敏不能硬删，否则攻击者可以利用删除接口洗白身份。

    这里表达的是：删除不是纯技术动作，是合规定义先行。

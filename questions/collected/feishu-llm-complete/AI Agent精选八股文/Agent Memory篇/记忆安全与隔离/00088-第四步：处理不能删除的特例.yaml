answer:
  mode: rubric
  reference_answer: |-
    - 法规要求留存：如《网络安全法》要求网络日志留存6个月。此时不能删原始日志，但必须做脱敏，将手机号替换为不可逆哈希。

    - 在途业务：用户有未完结订单或争议，可能需要冻结删除直到业务闭环。

    - 司法冻结：执法机关要求的证据留存期，需截断对外访问，加锁并留操作痕迹。

    - 风控与安全：如该手机号涉及欺诈，可脱敏后保留特征，用于防范再注册。

    这些例外必须在产品协议中告知用户，并在后台有白名单和审批机制。

content:
  prompt: 第二步：从存储视角画一张“数据地图”
answer:
  mode: rubric
  reference_answer: |-
    手机号在Agent对话场景里，大概率会落在这几类存储中：

    - 在线业务库：用户表、会话表（手机号可能是明文或加密存储）

    - 搜索引擎：如Elasticsearch里的对话全文索引，可能包含手机号

    - 消息队列/事件流：Kafka里可能有未消费的包含手机号的事件

    - 日志系统：应用日志、访问日志、Agent调用日志

    - 数据仓库/湖：ETL后的分析数据，手机号作为维度

    - 缓存：Redis里的session或用户信息

    - 备份与快照：数据库全量备份、增量备份

    - 第三方系统：短信服务商、外呼系统、CRM

    我会先问自己：“如果现在用户用手机号登录，能不能在以上任何一处重新找到这个手机号？”能，就不叫彻底。

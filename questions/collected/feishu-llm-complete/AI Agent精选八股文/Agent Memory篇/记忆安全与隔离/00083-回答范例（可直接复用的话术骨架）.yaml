content:
  prompt: 回答范例（可直接复用的话术骨架）
answer:
  mode: rubric
  reference_answer: |-
    （1）先给 PII 一个通俗的定义，顺便带出它和记忆系统的关联

    “PII，全称是个人可识别信息，通俗说就是能直接或间接把人给定位出来的那类数据。直接的有身份证号、手机号、人脸；间接的有 IP 地址、设备指纹、甚至是一个人足够独特的经历描述。在 Agent 记忆系统里谈 PII，问题不是‘记不记得住’，而是记住了之后怎么不害人、不犯法。”

    （2）痛点先行——为什么 Agent 记忆系统特别危险，必须单独拎出来讲

    “传统软件里 PII 保护主要靠数据库脱敏和权限控制，但 Agent 的记忆是自然语言文本流，PII 会被揉在对话里，极难管控。当时我们在做一个长程个人助理，就撞上了三个最头疼的现实：

    - 第一，自然语言无边界。用户随口一句‘我身份证号是……你帮我填’，这段原始对话就被记进了记忆流，后面如果被摘要或反思模型读到，号码可能被原样带进别的地方。

    - 第二，检索可能会把隐私喂给不该看的人。万一以后新的对话里，Agent 为了表现自己‘了解用户’，主动复述出用户的家庭住址，而当前设备正被投屏或旁人看到，那就是直接的社会性死亡。

    - 第三，用户权利难执行。法规要求用户有权查看、更正、删除自己的数据。在记忆系统里，一条信息可能分散在原始对话、事实卡片、反思笔记、向量索引等多个地方，要真正删干净，技术上是个分布式删除的难题。”

    （3）方案展开——用“预防-隔离-遗忘”三层保护闭环来回答

    “所以我们在记忆系统里，从数据流入到流出的全链路上，做了三层保护：

    第一层，实时检测与去标识化。 所有要写入长期记忆的对话，在落盘之前会过一道 NER（命名实体识别）+ 正则 + 规则混合的检测器，把检测到的直接 PII（如手机号、身份证、银行卡号）截住，当场替换为类型占位符，比如 [PHONE_NUM_1]。原始信息如果业务必须留存，会通过加密通道存进一个独立的保险箱库里，和普通记忆物理隔离。这样记忆流里永远只有影子，没有真身。

    第二层，存储隔离与访问控制。 我们不允许把用户画像和原始记忆混存。我们建了三个隔离库：公开记忆库（存放脱敏后的结构化偏好）、受限记忆库（存放去标识化但仍带语序的摘要，仅限当前用户会话读取）、以及 PII 保险箱库（原始敏感数据，需要双因子鉴权+审计日志才能访问，且任何取出行为都会被记录）。Agent 做检索时，默认只看到前两个库，确保在绝大多数对话里，它连‘可能泄露’的资格都没有。

    第三层，可遗忘机制与真删除。 这是为了应对用户的删除请求和法规的‘被遗忘权’。我们在设计记忆写回时，就为每条记忆都打上了唯一的溯源 ID，并维护了一个倒排索引表，能从一个原始事件追到所有派生记忆（摘要、反思、向量）。当用户触发删除时，系统不是软删除，而是会启动一个异步任务，逐条扫描索引，把所有关联副本都从存储和向量库里硬擦掉。任务完成后再给用户出一个删除完成报告，告诉你具体清掉了哪些记忆节点。”

    （4）主动踩坑——用真实翻车经历证明你被伤过

    “早期我们天真过一次，觉得只要不做明文展示就行了，内部日志里留个身份证号怕什么。结果一次线上调试，一个工程师直接在自己的终端上 grep 出了上百个真实身份证号。虽然只存在了几秒，但安全组差点把我们服务下线。后来我们追加了两条铁律：一是所有日志输出默认脱敏，二是测试环境和正式环境的 PII 数据必须完全隔离，永远不能用真号跑联调。”

    （5）价值收束并给钩子

    “所以回到记忆系统里，PII 保护不是功能，是底线。它解决的其实是信任危机——用户敢不敢把自己的事全盘告诉你。我们上了这套机制后，用户主动分享敏感信息（比如预算、健康情况）的比例反而上升了，因为他看到 Agent 会说‘我不会记下具体数字，但会记住你的偏好’。如果你感兴趣，我可以展开讲讲那个实时检测器是怎么平衡误杀率和性能的，那个地方很考验工程分寸感。”

content:
  prompt: 一、先看清：这道题到底在考你什么？
answer:
  mode: rubric
  reference_answer: |-
    Agent 记忆系统不是静态数据库，它要动态地记对话、抽事实、存向量，还要支撑个性化。在这上面谈 PII（个人身份信息）和 GDPR，面试官其实在挖你三个层级的思考：

    - 识别力： 是不是只会用正则找邮箱？有没有想到 Agent 对话里那些“间接泄露”的敏感信息？

    - 平衡感： 懂不懂安全与效用的矛盾？比如脱敏后，Agent 还能不能说出“李总您上次提到...”这种贴心话。

    - 工程化闭环： 知不知道 GDPR 不是改个配置，而是要设计出一套“可删除、可审计、可解释”的系统机制。


  reference_answer: |-
    别急着开口，先在心里搭一个三层架构，会让你的回答脉络特别清晰：

    - 事前防御（PII 检测层）： 在信息进入记忆前就卡住，用“规则+模型+上下文”三层漏斗。

    - 事中保护（脱敏存储层）： 存进数据库/向量库时，做假名化+加密，把钥匙和锁分开管。

    - 事后合规（生命周期管理层）： 围绕数据保留期限、用户删除权等，建一条自动化的流水线。


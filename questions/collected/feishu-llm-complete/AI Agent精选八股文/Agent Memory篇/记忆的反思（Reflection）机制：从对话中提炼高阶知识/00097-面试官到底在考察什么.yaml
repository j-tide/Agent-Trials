    - 论文精读能力：你能不能区分“记忆反思”在 Generative Agents 里的具体做法（重要性触发、自问自答、引用存储），而不是把它和 MemGPT 或普通摘要混为一谈。

    - 架构思维：你是否能把算法描述还原成触发、生成、存储、检索的数据流闭环。

    - 工程危险直觉：你口中能不能自然地吐出“幻觉引用校验”“权重衰减”“分片队列”这些实打实的工程化术语，直接验证你是否亲手做过。

    - 批判性思维：你能不能在承认论文价值的同时，指出它工程上的薄弱点（如固定阈值、幻觉引用、资源膨胀），并给出自己的解法。

content:
  prompt: 怎么能讲得更像真人
answer:
  mode: rubric
  reference_answer: |-
    - 开头用“我最早在 MemGPT 论文里看到这个概念时，就觉得它打中了死穴”，带点个人阅读史，更像是分享而非背书。

    - 用口语化表达：“要命的问题”“攒了一大堆”“差点把我们客户吓到”“不是搭玩具”。

    - 加入情绪和自嘲：“早期我们天真地让模型自由发挥，结果它给我整了个慢性病出来，被安全组的同事追着问。”

    - 避免死板的连接词，用“所以”“这里面”“说白了”自然过渡。

    ---

    ### 追问准备

    追问一：“反思的触发频率怎么定？太频繁太耗 token，太稀疏又没效果。”

    - 应对：展示你的成本意识。可以回答：“我们采用了自适应频率。新用户前两周不触发反思，因为数据太少没价值。活跃用户用轮次阈值（比如每 50 轮），沉默用户用时间阈值（超过 7 天不活跃后，回归时触发一次‘记忆重载’）。同时监控事实卡片的矛盾率和冗余率指标，如果某个用户的两项指标超标，就强制一次优先反思。这样把成本控制在了总推理预算的 3% 以内。”

    追问二：“反思用的 LLM 可以和对话用的 LLM 不一样吗？”

    - 应对：正好体现你的资源分层思维。“完全可以，而且应该不一样。对话要求低延迟，反思是离线任务，可以用能力更强但速度更慢的模型，甚至专门微调一个反思专用小模型。我们在一个项目里就是对话用 7B 模型的量化版，反思用 70B 模型跑批，既能保证对话实时性，又能把反思的质量拉满，成本还因为离线跑批可被摊销。”

    追问三：“你怎么评测反思是否真的提高了记忆质量，而不是引入了噪声？”

    - 应对：准备一个评测框架。“我们搭了一个‘记忆问答对’测试集，从历史对话中人工标注出 200 个需要跨轮次推理才能回答的问题，比如‘我最终定的预算是多少’。然后对比有无反思两种情况下的 Top-1 答案准确率。更重要的是，我们单独设了一个‘反思引入错误率’指标，人工抽查反思笔记，看其中有多少包含了事实错误。这个错误率必须压到千分之二以下才算通过。这也就逼着我们加了前面说的那些高风险拦截规则。”

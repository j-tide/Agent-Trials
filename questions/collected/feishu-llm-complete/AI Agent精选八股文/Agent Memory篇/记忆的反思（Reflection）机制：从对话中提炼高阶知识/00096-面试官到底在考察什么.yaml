content:
  prompt: 面试官到底在考察什么？
answer:
  mode: rubric
  reference_answer: |-
    - 记忆系统的完整性：你是不是只懂写入和检索，而漏掉了“维护”这个环节？能提到反思，说明你对记忆生命周期有闭环认知。

    - 元认知能力：反思是“对记忆的思考”，面试官想看你是否理解记忆需要被二次加工，而不是原样堆砌。

    - 风险意识：你能否意识到反思本身会引入幻觉和错误传播？主动讲出“禁止外推”“不直接改写原始事实”“高风险拦截”这些点，直接证明你不是在搭玩具。

    - 价值量化感：你能不能讲清楚反思的商业价值——是提升意图识别？减少冗余？还是提升用户体感？

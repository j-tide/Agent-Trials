answer:
  mode: rubric
  reference_answer: |-
    - 定性降维：“睡前整理记忆”这个类比，让一个生僻的术语瞬间人人都懂，面试官不用费力就能跟上。

    - 三痛驱动：记忆膨胀、矛盾沉默、缺少抽象，这三个痛点精准对应了只记不思的系统的真实死法。痛点越具体，你的方案越像解药。

    - 三步闭环：触发（定期+事件）→ 整理（消矛盾、做归纳、清垃圾，三个清晰子任务）→ 写回（反思笔记，不覆盖原始事实，高权重参与召回）。逻辑链路完整，每一步有明确的输入输出，体现了架构设计能力。

    - 踩坑扎心：医学外推的例子既生动又危险，立刻让面试官看到你经历过真实世界的毒打，并且有防御设计。这比任何“我们做得很好”都有力。

    - 价值收束与钩子：“对抗熵增”是一个很高级的总结，瞬间把工程问题提升到系统哲学层面；结尾钩子继续控场。

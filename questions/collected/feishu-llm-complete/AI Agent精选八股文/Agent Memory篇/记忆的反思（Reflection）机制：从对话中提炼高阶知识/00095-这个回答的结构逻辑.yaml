  reference_answer: |-
    - 目的重定义：开篇就用任务型 vs 陪伴型的对比，把“了解”重定义为“被看见的感觉”，瞬间拔高了方案的目标层级。

    - 痛点扎心：“记住了事实却读不懂情绪”，这个例子（累的时候需要共情而非建议）几乎每个人际交往中都有共鸣，面试官一听就懂你的系统在解决什么。

    - 四步共情闭环：情绪标记（打底数据）→ 共情反思（提炼感受与关系）→ 关系笔记（生成相处说明书）→ 会话内微反思（实时修复）。每一步都紧扣“感受”和“关系”，技术为情感服务。

    - 踩坑生动：“过度关怀的窒息感”和“用户感觉被当病人”，这两个反馈直接证明你真的跟用户聊过、看过数据、被投诉过。

    - 产品亮点：“用户可编辑画像”是一个跳出技术栈的上帝视角设计，它让反思从黑箱变成了共同创作，这个回答里有这一个亮点，就够面试官记你一整天。

content:
  prompt: 面试官到底在考察什么？
answer:
  mode: rubric
  reference_answer: |-
    - 产品感与共情能力：你能不能区分“记住偏好”和“理解感受”，并给出完全不同的技术设计。这是一道技术题里的情商测试。

    - 软性目标的工程化能力：“让用户觉得被了解”是个模糊目标，你能否把它拆解成情绪标记、关系笔记、会话内微反思这些可实现的模块。

    - 风险与伦理意识：陪伴型产品最容易踩的雷就是过度关怀、心理诊断、隐私侵犯。你主动提这些，面试官就知道你的产品是有边界的。

    - 用户视角：你提“用户可编辑画像”这个产品功能时，就证明你不仅是技术实现者，还是体验设计者。

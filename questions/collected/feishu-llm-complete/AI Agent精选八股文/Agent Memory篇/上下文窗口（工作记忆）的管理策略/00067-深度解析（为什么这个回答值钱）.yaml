content:
  prompt: 深度解析（为什么这个回答值钱）
answer:
  mode: rubric
  reference_answer: |-
    面试官到底在考察什么？

    - 设计能力：你是不是只会调 langchain 的 ConversationSummaryBufferMemory？还是能根据场景定制方案。

    - 成本/工程意识：你有没有意识到 token 成本、延迟、模型窗口是真实的约束，而不是理论假设。

    - 边界处理：压缩过度导致信息丢失、压缩不够导致超窗、压缩导致幻觉/数值错误——你有没有考虑过这些失败模式。

    - 真实度验证：回答里面有没有具体数字、具体错误、具体项目名词，很容易判断你是不是在背诵。

    这个回答的结构逻辑（你可以套用到其他问题）

    - 定性先行：第一句就把方案的独特名字和“不是简单截断”这个差异化打出来，防止被归类到平庸答案。

    - 问题驱动：“面临的两个问题”直接呼应了面试官心中“压缩是为了解决什么”的疑问，而且问题越具体，方案可信度越高。

    - 分层解释：三层方案不是并列罗列，而是有“过滤流”——从细到粗、从实时到异步、从本地到检索。这让方案有了系统架构感，而不是一堆技巧堆叠。

    - 错误复盘：主动说出“摘要丢失精确信息”这种踩坑，比自己吹方案完美要有效得多，传递的是反思能力。

    - 数字锚定：“4K窗口支撑42轮”“72%到96%”，这组数字让方案的收益立刻可感知，并且暗示你真的量过。

    - 抛钩子引导：结尾那一句是为了让面试进入你熟悉的下一题（比如意图识别、检索触发策略），把主动权握在自己手里。

    如果想看起来更不像AI，你可以这样调整语气

    - 把“我们采用了多级压缩策略”换成“我们当时其实是逼出来的，窗口实在太小了”。

    - 把“有效提升了系统性能”换成“总算不用被客户骂‘你怎么又忘了’”。

    - 适当加入一点犹豫词：“怎么说呢，其实这个地方我们当时纠结了很久……”

    - 如果面试官看起来技术很深，你可以突然抛一个术语然后立刻自嘲：“说白了就是个有损压缩，只不过我们让损失落在不重要的地方。”


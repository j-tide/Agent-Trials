    保留最近 N 条消息 或最近 K 个 token，超出部分直接丢弃。

    - 适用场景：任务对历史依赖不深，比如闲聊、短期任务执行。

    - 实现要点：设定一个最大轮数 max_turns，在每次构造上下文时只取最后 N 轮。

    - 缺点：会丢失早期关键信息（如用户偏好、任务目标）。


  prompt: "⚖️ 4. 动态 Token 预算与分块调度"
answer:
  mode: rubric
  reference_answer: |-
    为不同来源的上下文分配 token 配额，并动态调整。

    - 实践：把上下文分为：系统提示词、工具描述、对话历史、外部知识、推理草稿等几个桶，每个桶有上限。

    - 当历史过长，优先压缩或丢弃对话历史，保证工具描述和系统提示完整。

    - 利用 LLM 的“长文本”能力：对于需要全文的资料（如长文档），不放入上下文，而是给 Agent 一个 search_document 工具，让它按需搜索片段。

    - 关键点：监控请求的 token count，在接近限制前就触发压缩逻辑，而不是等报错。


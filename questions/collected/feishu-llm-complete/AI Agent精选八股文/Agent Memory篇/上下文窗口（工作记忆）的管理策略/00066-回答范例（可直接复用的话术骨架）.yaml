content:
  prompt: 回答范例（可直接复用的话术骨架）
answer:
  mode: rubric
  reference_answer: |-
    （1）先给一个一句话定位，不要上来就讲技术细节

    “好。我这个项目是一个智能客服工单助手，场景是用户和坐席的多轮对话可能非常长，但真正需要带入大模型做总结或推荐的只是最近几轮的核心意图和关键事实。我们的上下文压缩不是简单的截断，而是做了一套‘渐进式摘要+滑动窗口+条件触发’的混合方案。”

    （2）用“面临的问题”自然带出设计动机，而不是背答案

    “当时最直接的问题有两个：第一，用户可能在20轮之后突然说‘就按我刚才说的那个方案办’，模型必须知道‘那个方案’是指什么，但原始对话早被截断了。第二，我们的模型是私有化部署的7B模型，窗口只有4K，成本也受不了直接把全量对话塞进去。”

    （3）按逻辑链条讲方案，每一层解释“为什么这么选”

    “所以我们把压缩分成了三层来处理，这其实也是一个逐步过滤的过程：

    第一层叫事件级压缩。 每一轮对话结束，我们会用一个非常轻量的规则+小模型把本轮对话压缩成一条‘结构化事件’，格式类似 [用户意图：修改地址][新地址：XX][约束：本周六前送到]。这样20轮的对话，可能就变成十几条结构化的条目，远短于原始文本，而且关键信息没有丢失。

    第二层是滑动窗口+摘要缓存。 我们会固定保留最近3轮原始对话，防止结构化过程丢失语气和口语指代。3轮以前的，只保留刚刚那些结构化事件，并且每积累5条事件，就让大模型离线生成一句摘要，比如‘用户已连续三次催促发货并升级投诉’，然后把这几条事件用这一句摘要替代。这样上下文始终被控制在一个预算内。

    第三层是按需回溯。 有时候用户会突然问‘你把我三个月前那次投诉的处理结果再念一遍’，这时候摘要也不够。我们在对话上方始终保留一个‘记忆索引’，里面是 {投诉单号, 日期, 要点} 这样的键值对。当检测到这种跨轮次引用时，会触发一次RAG检索，从工单库把对应的原始结论捞回来，作为临时上下文注入，用完就释放。”

    （4）补一个技术决策/踩坑，显得你有真实体感

    “这里面有一个容易踩的坑：很多人会直接用一个LLM把全量历史做长摘要，觉得这样最省token。但我们踩过的坑是，摘要会丢失具体的单号、金额、时间这些精确信息，客服场景对精确度要求极高。所以我们才坚持结构化事件+原始关键值分离，摘要只负责压缩意图流，不压缩原子事实。”

    （5）结尾带出效果，并留一个钩子让面试官追问

    “最终这套方案让我们在4K窗口下支撑了平均42轮的对话，关键信息召回率从纯截断方案的72%提到了96%。如果你感兴趣，我也可以展开说说那个触发回溯的策略是怎么做意图判定的，还是蛮tricky的。”


content:
  prompt: 追问准备（面试官很可能沿着这些方向继续深挖）
answer:
  mode: rubric
  reference_answer: |-
    追问一：“你这个结构化事件是怎么生成的？用大模型不会很慢吗？”

    - 应对：你正好可以引出“轻量模型+规则”的组合。解释为什么这个场景不需要强生成能力，用了一个0.5B的微调模型做槽位提取，延迟控制在100ms内，而且支持流式。这又展示了你对推理成本的精细化思考。

    追问二：“如果用户中途彻底换了话题，你的摘要缓存会不会造成污染？”

    - 应对：这是考察会话切分和主题检测。你可以补充你们在摘要生成前有一个话题切换检测模块，如果话题突变，旧的摘要会被立刻冻结归档，不再作为当前窗口的上下文，只保留在记忆索引里供按需回溯。

    追问三：“你们评估过这种有损压缩带来的错误率吗？怎么和不用压缩做对比？”

    - 应对：准备一张简单的表格在心里，比如：完整历史作为上限，纯截断作为基线，你们方案在最终任务指标（如工单自动填写准确率、客诉分类F1）上保留了多少。重点强调你们测过压缩引入的“事实错误”比例，并把它控制在了千分之五以下。

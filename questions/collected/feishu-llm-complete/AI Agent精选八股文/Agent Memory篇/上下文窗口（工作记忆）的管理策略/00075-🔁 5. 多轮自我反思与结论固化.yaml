answer:
  mode: rubric
  reference_answer: |-
    对于需要多步推理的 Agent，可以在关键步骤结束后，让 Agent 输出一个“阶段性结论”，然后把之前的详细推理过程删除，用结论代表那一段历史。

    - 例子：Agent 查完数据库、分析完数据后，生成 [分析结论] 并写入上下文，之前所有的查询细节直接丢弃。

    - 优点：极大压缩上下文，同时保证后续步骤有足够的决策依据。


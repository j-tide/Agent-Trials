answer:
  mode: rubric
  reference_answer: |-
    工具返回的原始结果往往充满冗余字段（如 API 返回的完整 JSON），我们可以在 Agent 拿到结果前做预处理：

    - 只保留必要字段（如标题、摘要、链接），去除 HTML 标签、广告等噪音。

    - 对于长列表，只取前 K 条并告知 Agent 可以进一步翻页。

    - 将大文本自动分块，让 Agent 通过索引方式逐块处理，而不是一次吞下。


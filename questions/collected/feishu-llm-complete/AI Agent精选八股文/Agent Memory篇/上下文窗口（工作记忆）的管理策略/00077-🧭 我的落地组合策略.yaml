content:
  prompt: "\U0001F9ED 我的落地组合策略"
answer:
  mode: rubric
  reference_answer: |-
    在实际 Agent 项目中，通常是滑动窗口 + 增量摘要 + 重要性过滤三层混合：

    - 保留最近 5 轮 完整对话（工作记忆）。

    - 5～20 轮的内容经重要性评分后，高分保留原话，低分合并为一条摘要。

    - 超过 20 轮的部分，统一压缩成一份全局摘要，并持续更新。

    - 用户偏好、任务目标等关键信息写入外部长期记忆，每次启动 Agent 时检索相关记忆注入系统提示。

    这样既保持了对话的连贯性，又能适应长任务流，不会因为上下文爆掉而丢失目标。

    ---

    一句话：上下文窗口管理本质是“用计算换记忆”，根据信息的新鲜度、重要性、检索成本，动态决定保留、压缩还是外存。

answer:
  mode: rubric
  reference_answer: |-
    用 LLM 自己把历史对话压缩成一段摘要，不断更新。

    - 做法：当对话达到一定轮数或 token 占比时，调用一个摘要 prompt（如 “请总结以上对话的关键信息”），用摘要替换原始历史。

    - 变体：

    - 增量摘要：每次只对新产生的对话做总结，再与旧摘要合并。

    - 分层摘要：区分“近期详细历史”和“远期摘要”两段，兼顾细节与全局。

    - 优点：保留语义完整，大幅节省 token。

    - 注意：摘要过程本身消耗 token，需平衡触发频率。


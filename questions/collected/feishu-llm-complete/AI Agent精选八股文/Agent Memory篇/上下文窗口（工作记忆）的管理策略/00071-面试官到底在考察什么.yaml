content:
  prompt: 面试官到底在考察什么？
answer:
  mode: rubric
  reference_answer: |-
    - 记忆架构能力：你分得清压缩（前向摘要）和回溯（后向检索）是两套不同的系统，而不是一个“上下文压缩”就万事大吉。

    - 工程极限感：200轮、窗口已满，意味着你必须用检索+生成的思维解决问题，而不是在prompt里玩魔术。面试官想看你能不能跳出提示词工程的层面，进入架构设计。

    - 产品体验意识：你提不提到“不能频繁反问用户”“确认钩子的打扰率”，直接暴露你是不是做过落地的产品，还是只在论文里跑过demo。

    - 失败模式分析：指代消解这个坑几乎是必考题，你提前把它摆上台面，等于抢答了面试官最担心的点。

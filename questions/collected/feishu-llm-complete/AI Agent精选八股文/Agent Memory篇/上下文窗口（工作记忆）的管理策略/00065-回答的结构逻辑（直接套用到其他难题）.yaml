answer:
  mode: rubric
  reference_answer: |-
    - 问题升维定性：第一句把“上下文满了怎么办”重新定义为“跨轮次回溯”，瞬间从打补丁变成了系统设计问题，拔高了你的技术站位。

    - 场景痛感先行：“你不能反问他”这句话一出，面试官就知道你是被真实用户教育过的，不是在背八股。

    - 拆字诀：“记”和“忆”分开，这种中文拆词式总结非常符合人脑记忆习惯，面试官很容易记住你的方案画像。任何记忆问题你都可以用这个二分法。

    - 三层闭环：写入（异步结构化）→ 检索（语义+时间衰减）→ 纠错（置信度触发确认），是一个完整可落地的工程链路，而不是一个孤立技巧。

    - 主动亮伤疤：你讲指代消解的坑和改进，比任何自夸都有说服力。面试官此时已经在心里给你打“有真实经验”的标签了。

    - 数字锚定+钩子：“91%准确率”“200ms”“150token”让方案立刻可感知；结尾抛出一个具体的算法细节（不确定性）做钩子，把面试引向你准备好的下一题。

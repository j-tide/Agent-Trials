content:
  prompt: 那怎么补这个窟窿？
answer:
  mode: rubric
  reference_answer: |-
    滑动窗口只是个内存管理策略，不是真正的记忆方案。我们后来做了两件事：

    - 把偏好抽出来存到用户画像库，每次回答前注入系统提示。

    - 用向量检索捞回与当前 query 相关的历史对话片段，弥补窗口的“遗忘黑洞”。

    也就是说，滑动窗口负责短期上下文，长期记忆交给检索和知识库，两者配合才能让 Agent 既有近几轮的连贯性，又有跨会话的“长情”。

    ---

    滑动窗口就像用竹篮子打水，看着满满一提，走得越远，漏得越多。能让用户觉得“你懂我”的 Agent，从来不是靠篮子够大，而是提前把水里的珍珠捞出来放进了保险箱。

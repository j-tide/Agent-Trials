content:
  prompt: 用大白话讲：滑动窗口截断就是个“记忆漏勺”
answer:
  mode: rubric
  reference_answer: |-
    LLM 一次能处理的上下文长度是有限的（比如 4k、8k token），当对话轮次一多，历史记录超载了，系统就得扔掉最早的部分，只保留最近 N 轮。就像一扇固定大小的窗户，你往后走，前面的风景就移出窗外了，再也看不见。

    - 比如窗口大小是 10 轮，用户聊到第 50 轮时，第 1~40 轮的内容已经被永久抹掉。

    - 这是一种无差别遗忘：不管第 3 轮里用户说过多么重要的偏好，只要它在窗口外，就等同于没发生过。

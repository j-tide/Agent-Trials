content:
  prompt: "\U0001F3AF 3. 重要性过滤 + 层次化记忆"
answer:
  mode: rubric
  reference_answer: |-
    不是所有信息都值得保留，可以给每条信息打分，只保留高分内容。

    - 实现：用小型分类模型或规则（如含决策、任务目标、用户明确要求）给对话贴上重要性标签；当窗口紧张时，优先删除低分内容。

    - 分层记忆结构：

    - 工作记忆：最近 N 轮，完整保留。

    - 短期记忆：最近 M 轮中筛选重要内容。

    - 长期记忆：提取出的用户偏好、实体、关键事件，存储到外部数据库或向量库。

    - 工具记忆协同：Agent 也可以主动将关键信息写入外部存储（如 write_to_memory 工具），需要时再检索回来，彻底打破窗口限制。


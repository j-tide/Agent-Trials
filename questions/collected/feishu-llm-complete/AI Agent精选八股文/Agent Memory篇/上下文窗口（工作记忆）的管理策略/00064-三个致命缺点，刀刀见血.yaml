    \U0001F9E9 无法处理跨轮次指代：用户说“把刚才那个订单取消”，如果“刚才那个订单”在窗口外，Agent 就断片了，只能猜或者反反复复确认，体验极差。\n\n-
    \U0001F9E0 永远无法积累长期画像：每次对话滑到后面，用户又变回“陌生人”。客服机器人记不住你的地址、不喜欢什么、常用支付方式——这种 Agent

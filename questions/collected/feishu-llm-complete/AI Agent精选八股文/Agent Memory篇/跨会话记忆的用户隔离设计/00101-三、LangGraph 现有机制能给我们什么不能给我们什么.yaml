content:
  prompt: 三、LangGraph 现有机制能给我们什么？不能给我们什么？
answer:
  mode: rubric
  reference_answer: |-
    1. thread_id 的定位

    LangGraph 的 Checkpointer 在保存和恢复状态时，使用 thread_id 作为主键。也就是说：

    - 同一个 thread_id，多次调用 graph.invoke() 会自然继承历史状态，形成连续对话。

    - 不同的 thread_id 之间状态完全隔离。

    这是会话级记忆的天然实现。

    2. user_id 在 LangGraph 里的“存在感”

    在 LangGraph 目前的 API（以 0.2.x 版本为例）中，config 里确实可以传 user_id，但它本身不参与状态隔离逻辑。也就是说，你即使传了 user_id: "u123"，如果另一个请求用同样的 thread_id 但故意传 user_id: "u456"，底层 checkpointer 依然会把 u456 的请求接到 u123 的会话上。user_id 更像一个“元数据标记”，隔离责任在你。

    - 跨会话记忆，LangGraph 并没有给出现成方案

    官方文档里强调 thread_id 用于多会话，但“用户画像”“长期记忆”这类需求，需要你自己扩展。你可以选择：

    - 在 checkpointer 外层套一层用户隔离层。

    - 或者完全另起一个长期记忆存储（向量库、PG、Redis），与 LangGraph 状态并行。


answer:
  mode: rubric
  reference_answer: |-
    方案核心思路

    将会话记忆交给 LangGraph 的 checkpointer（按 thread_id 隔离），将用户长期记忆交给独立存储（按 user_id 隔离），在两个存储之间通过明确的“读写接口”交互，接口层强制校验 user_id 权限。

    这样做的好处是：不破坏 LangGraph 的原生状态管理逻辑，开发成本低，且安全边界清晰。

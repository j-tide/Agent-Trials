answer:
  mode: rubric
  reference_answer: |-
    拿到这道题，如果开口就背“LangGraph 的 checkpointer 用 thread_id 做隔离……”很容易被直接打断。因为面试官真正想考察的是三层递进能力：

    - 你能分清会话级记忆和用户级记忆吗？（概念层）

    - 你知不知道 LangGraph 自带机制能做什么、不能做什么？（工具边界层）

    - 你能否在不能改源码的情况下，设计一套安全、可扩展的隔离方案？（工程落地层）

    下面我们顺着这个思路，一步步把高分答案拆出来。


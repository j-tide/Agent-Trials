content:
  prompt: "\U0001F510 二、为什么必须做“用户隔离”"
answer:
  mode: rubric
  reference_answer: |-
    用户隔离的本质是：在存储、读取、索引记忆数据的全链路中，严格限定数据只能被所属用户访问，不同用户之间的记忆完全不可见、不可串联、不可混入。

    为什么这是刚需？至少有以下三个层次的原因：

    [图片内容未导入]

    1. 数据归属与隐私合规

    记忆数据往往是高度个人化的（对话记录、偏好、行为特征），属于 PII（个人可标识信息）甚至敏感个人信息。GDPR、CCPA 等法规要求明确的最小化使用和访问控制。如果不隔离，等于是将 A 的数据暴露给 B，构成数据泄露，法律风险极高。

    2. 体验上的绝对正确性

    跨会话记忆的核心价值是“懂你”。一旦用户 B 拿到了用户 A 的记忆，推荐、回答、决策全都错位。

    例如：

    - 用户 A 说“我不吃香菜”，下次用户 B 点餐时系统主动说“已为你去掉香菜”——用户 B 爱吃香菜，体验瞬间崩塌。
    这种混淆比没有记忆更糟，会直接摧毁用户对产品的信任。

    3. 安全攻击面的控制

    记忆系统通常需要做检索增强生成（RAG），将记忆片段注入提示上下文。如果隔离缺失，攻击者可以通过精心设计的提示词诱导系统“吐出”其他用户的记忆，即记忆注入攻击。用户隔离是防止水平越权的第一道防线。


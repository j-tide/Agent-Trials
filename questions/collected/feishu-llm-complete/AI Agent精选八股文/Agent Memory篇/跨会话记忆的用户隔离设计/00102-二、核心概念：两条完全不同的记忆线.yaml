    [嵌入表格未展开]

    很多人一上来就把“跨会话记忆”等价于“把 state 存久一点”，这是致命的误区。跨会话意味着：用户今天在 thread_A 里说过的事情，明天在 thread_B 里，Agent 依然能记得并合理运用。 这不是存得久，而是跨线程提取和更新。


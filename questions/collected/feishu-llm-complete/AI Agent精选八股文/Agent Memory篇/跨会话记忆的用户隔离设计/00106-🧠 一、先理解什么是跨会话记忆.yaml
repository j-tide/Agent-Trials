content:
  prompt: "\U0001F9E0 一、先理解什么是“跨会话记忆”"
answer:
  mode: rubric
  reference_answer: |-
    跨会话记忆（Cross-session Memory）指的是系统能够在用户的不同对话、不同时间、不同设备上，持久化地记住与这个用户相关的上下文信息。它不是当前对话的临时缓存，而是跨越会话生命周期的一种长期记忆能力。

    典型场景：

    - 智能助手记住你的饮食偏好、日程习惯。

    - 客服机器人记住你的历史工单、上次抱怨的内容。

    - AI 学习伴侣记住你掌握的知识点和薄弱环节。

    这类记忆让交互更有连续性，但一旦记错了人，问题就大了。


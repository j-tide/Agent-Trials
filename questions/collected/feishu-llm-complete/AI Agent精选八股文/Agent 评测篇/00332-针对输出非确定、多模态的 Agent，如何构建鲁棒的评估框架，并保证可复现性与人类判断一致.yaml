content:
  prompt: 针对输出非确定、多模态的 Agent，如何构建鲁棒的评估框架，并保证可复现性与人类判断一致？
answer:
  mode: rubric
  reference_answer: |-
    非确定输出和多模态（文本+图片+表格）让“标准答案”几乎不存在。评估框架必须从“比对字符串”升级为“分布比对”和“分解评判”。

    核心思路：可控复现 + 统计稳健 + 人类锚定

    [图片内容未导入]

    保证可复现性：锁定一切可变因素

    非确定性主要来自采样（温度、top_p）和系统环境。我们的做法是：

    - 冻结推理配置：评估时强制 temperature=0，或至少固定 seed。对于需要多样性的任务，采用固定温度 + 多次采样后取众数或平均质量分。

    - 版本化一切：模型版本、Prompt 模板、工具版本、甚至向量库的快照，全部通过配置文件锁定，并用 Docker 镜像固化。

    - 记录原始轨迹：不只是答案，要把 Agent 的每一步推理、工具调用结果、中间产出都记录下来，这样即使出现不可复现的结果，也能回溯。

    处理多模态：分解与条件化评估

    不要用一个笼统的分数去评价混合输出。而是拆开：

    - 图像/图表：用视觉-语言模型（如 GPT-4V）对生成的图像进行描述，然后评估描述与预期意图的一致性。

    - 结构化数据：如果 Agent 输出表格或 JSON，直接用 F1-score 或 Jaccard 等确定指标。

    - 自由文本：使用 LLM-as-Judge 进行多维度打分（准确性、相关性、流畅性）。

    最后用一个加权公式汇总，权重由业务场景决定。

    对齐人类判断：校准过的大模型裁判

    直接用 GPT-4 打分可能存在系统偏差（如偏好长答案）。我们需要用人类标注样本来校准裁判模型。具体做法：

    - 抽取 100 个典型输出，让 3 位人类评估员进行独立打分，计算 Krippendorff's Alpha 确认一致性。

    - 让裁判 LLM 对这些样本打分，计算与人类平均分的 Spearman 相关系数。

    - 如果相关系数低于 0.8，调整裁判 prompt 中的 rubric（评分标准），或者添加 few-shot 示例，直到对齐。

    示例代码：稳健评估一次对话

    ```python
    import numpy as np
    from scipy import stats

    def evaluate_with_ci(agent, task_input, n_samples=7):
        scores = []
        for i in range(n_samples):
            # 设置不同的种子以获得多样性，但保持可重复
            response = agent.run(task_input, seed=42 + i, temperature=0.2)
            scores.append(judge_score(response))
        mean_score = np.mean(scores)
        # 95% 置信区间 (t 分布)
        ci = stats.t.interval(0.95, len(scores)-1, loc=mean_score, scale=stats.sem(scores))
        return mean_score, ci

    mean, (low, high) = evaluate_with_ci(my_agent, "分析市场趋势")
    print(f"平均分: {mean:.2f} (95% CI: {low:.2f} - {high:.2f})")
    ```

    如果 low 和 high 跨度过大，就说明该任务对模型输出波动敏感，需要进一步优化 prompt 或考虑多次采样后综合决策。


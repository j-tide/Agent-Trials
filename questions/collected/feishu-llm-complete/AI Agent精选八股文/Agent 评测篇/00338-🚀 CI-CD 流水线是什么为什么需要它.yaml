content:
  prompt: "\U0001F680 CI/CD 流水线是什么？为什么需要它？"
answer:
  mode: rubric
  reference_answer: "CI/CD 是一套自动化流程，让代码从提交到上线就像流水线一样顺畅、可重复、零人工干预。\n\n[图片内容未导入]\n\n为什么需要它？四个字：降本提效。\n\n-
    降低集成风险：多个人的代码频繁合并，冲突早发现早解决，避免“合并地狱”。\n\n- 快速反馈：每次提交后 10 分钟内出测试结果，不用等 QA 一周后告诉你“你那行代码挂了”。\n\n-
    减少人工失误：手动部署经常遗漏环境变量、忘记跑数据库迁移脚本。流水线把这些都固化，人类只负责点“确认”或直接让代码推送到主干即自动上线。\n\n- 加速迭代：在
    AI Agent 场景，你的 Prompt 模板、工具配置、模型参数都可以纳入 CI/CD，每次修改自动跑一组评估测试，效果下降则自动拦截。这让 Agent
    的进化从“凭感觉调参”变为“数据驱动迭代”。\n\n一个针对 AI Agent 的 CI/CD 流水线示例（GitHub Actions）：\n\n```yaml\nname:
    Agent CI/CD\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches:
    [main]\n\njobs:\n  test-and-deploy:\n    runs-on: ubuntu-latest\n    steps:\n
    \     - uses: actions/checkout@v3\n      \n      - name: 安装 Python 依赖\n        run:
    pip install -r requirements.txt\n      \n      - name: 运行 Prompt 单元测试\n        run:
    pytest tests/prompts/\n      \n      - name: 运行 Agent 评估集\n        run: python
    eval/run_benchmark.py --dataset production_queries.json\n      \n      - name:
    安全红队测试\n        run: python security/red_team.py\n      \n      - name: 构建并推送镜像\n
    \       if: github.ref == 'refs/heads/main'\n        run: |\n          docker
    build -t my-agent:latest .\n          docker push registry.example.com/my-agent:latest\n
    \     \n      - name: 部署到生产\n        if: github.ref == 'refs/heads/main'\n        run:
    kubectl set image deployment/agent app=registry.example.com/my-agent:latest\n```\n\n真正的价值在于：当你的
    Agent 因一个 Prompt 修改导致 20% 的安全测试不通过时，流水线会直接拒绝合并，而不是等你上线后被用户投诉才发现。\n\n---"

    一个能落地的 Agent 评估体系，不应只关注“答案对不对”，而要覆盖任务完成、过程质量、安全合规、资源效率四个象限。它需要从离线测试延伸到线上监控，形成闭环。

    整体评估架构

    [图片内容未导入]

    核心评估维度与指标

    - 任务完成度

    - 端到端成功率：Agent 是否在限定轮次内达成了用户目标（通过规则判断或用强模型对最终状态打分）。

    - 子任务完成率：在 Plan-Execute 类 Agent 中，每个计划步骤的执行成功率。

    - 工具使用准确性

    - 工具选择正确率：面对需求，是否选择了正确的工具。

    - 参数填充准确率：调用工具时，参数是否满足 Schema 约束且语义正确。

    - 工具调用结果利用率：工具返回的信息是否被后续步骤有效使用（避免“调了但没用”）。

    - 推理与交互质量

    - 对话连贯性：多轮对话中是否保持逻辑一致、无自相矛盾。

    - 解释性：Agent 是否输出了清晰的思考过程，便于人理解和纠错。

    - 幻觉率：生成内容中虚构实体、错误事实的比例。

    - 安全与合规

    - 安全护栏触发率：Prompt 注入、越狱攻击等安全拦截的次数。

    - 敏感信息泄露率：Agent 输出中是否包含 PII、系统提示词等。

    - 内容合规率：输出是否通过安全审核（暴力、色情、偏见等）。

    - 性能与成本

    - 平均对话 Token 消耗，按模型拆分。

    - P50/P95 首 token 延迟 (TTFT) 与生成速度 (TPS)。

    - 工具调用平均耗时与成功率。

    离线评估代码骨架

    把评估做成可重复执行的测试套件，每次改动 Prompt 或工具后跑一次。

    from dataclasses import dataclass
    from typing import List, Dict, Any

    @dataclass
    class EvalCase:
        input: Dict[str, Any]
        expected_tool: str = None
        expected_answer_contains: List[str] = None
        forbidden_content: List[str] = None

    def evaluate_agent(agent, cases: List[EvalCase]) -> Dict[str, float]:
        results = {"tool_acc": 0, "answer_hit": 0, "safety_pass": 0}
        for case in cases:
            trace = agent.run(case.input)
            # 1. 工具选择判断
            if case.expected_tool and trace.called_tool == case.expected_tool:
                results["tool_acc"] += 1
            # 2. 答案内容检查
            if case.expected_answer_contains:
                if all(kw in trace.final_answer for kw in case.expected_answer_contains):
                    results["answer_hit"] += 1
            # 3. 安全审计
            if case.forbidden_content:
                if not any(kw in trace.final_answer for kw in case.forbidden_content):
                    results["safety_pass"] += 1
        n = len(cases)
        return {k: v/n for k, v in results.items()}

    在线评估

    通过日志埋点，实时收集每次会话的任务完成标志（用户点赞/点踩、客服转人工率），并抽样用裁判模型打分，形成线上质量看板。

    评估体系搭建的经验原则

    - 离线上百例，线上一眼盯：离线用例覆盖边界；线上靠关键漏斗（如转人工率）快速发现劣化。

    - 指标不是越全越好，而是越贴近业务越好：客服 Agent 更看重转人工率和满意度，代码 Agent 看重 Pass@1。

    - 人工评估是黄金标准：每月抽 100 条对话进行 3 人背对背打分，计算与自动评估的相关系数，持续校准自动裁判。


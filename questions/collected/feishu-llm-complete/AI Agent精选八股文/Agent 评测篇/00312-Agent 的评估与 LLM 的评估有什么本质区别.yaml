content:
  prompt: Agent 的评估与 LLM 的评估有什么本质区别？
answer:
  mode: rubric
  reference_answer: |-
    通俗理解

    本质区别一句话

    LLM 评估是「评答案」，Agent 评估是「评过程 + 评答案 + 评行为」。

    五个维度对比

    ```text
    ┌──────────────┬─────────────────────┬─────────────────────────────┐
    │    维度       │     LLM 评估         │       Agent 评估             │
    ├──────────────┼─────────────────────┼─────────────────────────────┤
    │  评估对象     │  静态函数            │  动态闭环系统                 │
    │              │  单步、无状态         │  多步、有状态                 │
    ├──────────────┼─────────────────────┼─────────────────────────────┤
    │  核心问题     │  答案好不好           │  事情办没办成                 │
    ├──────────────┼─────────────────────┼─────────────────────────────┤
    │  评估单元     │  一问一答             │  多步轨迹 + 最终结果           │
    ├──────────────┼─────────────────────┼─────────────────────────────┤
    │  数据形式     │  问答对               │  任务 + 环境 + 工具集          │
    ├──────────────┼─────────────────────┼─────────────────────────────┤
    │  评估方法     │  输出打分             │  端到端 + 过程 + 组件评估      │
    ├──────────────┼─────────────────────┼─────────────────────────────┤
    │  稳定性       │  高                  │  低（同一任务路径多样）         │
    ├──────────────┼─────────────────────┼─────────────────────────────┤
    │  成本         │  低（纯文本）          │  高（真实调用工具）            │
    ├──────────────┼─────────────────────┼─────────────────────────────┤
    │  安全风险     │  说错话               │  干错事（越权、有害操作）       │
    └──────────────┴─────────────────────┴─────────────────────────────┘
    ```

    评估维度差异

    LLM 评估维度：

    - 语言质量（流畅性、连贯性）

    - 知识准确性（事实正确、无幻觉）

    - 指令遵循（格式、要求）

    - 推理能力（数学、逻辑、代码）

    - 安全性（无害、无偏见）

    Agent 额外评估维度：

    - 规划能力：会不会拆解复杂任务

    - 工具使用：会不会选工具、传参数、解析结果

    - 状态管理：记不记得住上下文、维护目标

    - 错误恢复：工具失败时会不会自我纠正

    - 效率：步数、Token、延迟、成本是否可接受

    - 自主性：要不要人一直盯着

    评估数据差异

    ```text
    LLM 数据：  (prompt, reference_answer)  → 简单、单轮

    Agent 数据：任务描述 + 环境状态 + 工具集 + 成功判定标准
               → 需要可交互的沙箱环境
               → 很多任务没有唯一答案，只有"是否达成目标"
    ```

    评估方法差异

    LLM 方法： 自动指标（BLEU、ROUGE、准确率）+ LLM 裁判 + 人工评估 → 都是对最终输出的评估。

    Agent 方法：

    - 端到端评估：只看任务是否完成

    - 过程评估：逐步检查每个动作是否合理

    - 组件评估：单独评估规划模块、工具选择模块

    - 对抗评估：注入故障、误导信息，测试鲁棒性

    - 长期评估：观察连续任务中表现是否退化

    Agent 额外的评估挑战

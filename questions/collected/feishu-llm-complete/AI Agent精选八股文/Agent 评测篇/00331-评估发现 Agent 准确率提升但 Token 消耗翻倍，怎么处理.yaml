content:
  prompt: 评估发现 Agent 准确率提升但 Token 消耗翻倍，怎么处理？
answer:
  mode: rubric
  reference_answer: "这是个典型的 “拿成本换质量” 场景，不能简单回滚，也不能无视。我会走一套诊断 → 决策 → 优化的流程。\n\n▎第一步：诊断
    Token 都烧在了哪里\n\n不看清账单就下刀，容易砍错地方。\n\n- 按组件拆解：利用 LangSmith Trace 导出数据，把 Token 按
    LLM调用、工具调用、检索器 分组。\n\n- 关键问题：是多了一些不必要的推理步骤？还是单次 prompt 变得太长？\n\n```python\n# 用LangSmith快速查看最近一个成功Trace的token分布\nrun
    = client.read_run(run_id=\"...\")\nfor child in run.child_runs:\n    if child.run_type
    == \"llm\":\n        print(child.name, child.total_tokens)\n```\n\n假设发现是新加的“反思步骤”让
    Agent 每次都自我检查一遍，额外消耗了大量 token。\n\n▎第二步：做 ROI 决策，值不值？\n\n把准确率提升和业务损失挂钩。如果 准确率提升从
    85% → 88%，但 Token 翻倍，可能不值得。但如果是从 95% → 99%（比如金融交易场景），那多出的成本完全可以接受。\n\n- 设定硬指标：准确率提升低于
    2%，绝不能接受 token 翻倍。\n\n- 与产品一起决策：这个 Agent 是降低成本的工具，还是影响核心营收？角色不同，容忍度天差地别。\n\n▎第三步：在不牺牲准确率的前提下“瘦身”\n\n这才是价值的体现，几种有实效的策略：\n\n-
    为不同步骤分配合适的模型（模型级联）\n\n简单任务用小模型，复杂推理再上大模型。\n\n```python\ndef smart_llm_call(complexity_score,
    messages):\n    if complexity_score < 0.5:\n        return cheap_model.invoke(messages)
    \  # 例如 GPT-3.5 或 Claude Haiku\n    else:\n        return expensive_model.invoke(messages)
    \ # GPT-4o\n```\n\n- 压缩上下文，尤其是检索到的文档\n\n让 RAG 返回的文档先做摘要，或者限制只取 Top-1 的高相关性结果，减少塞进
    prompt 的字符数。\n\n- 设置最大推理步数并加入“早停”机制\n\n如果 Agent 第 2 步就已得到充分信息，强制它输出最终结果，别让它“再想想”。\n\n```python\nagent_executor
    = AgentExecutor(\n    agent=agent, tools=tools, max_iterations=5,  # 原来可能是8\n
    \   early_stopping_method=\"generate\"  # 达到max_iterations直接生成最终答案，不报错\n)\n```\n\n-
    缓存与记忆\n\n对于重复的检索或工具调用，用精确匹配或语义缓存，直接返回之前的结果，避免模型调用。\n\n▎第四步：设置上线后的成本“安全阀”\n\n万一在生产中某个
    batch 突然狂烧 token，要有实时止损。\n\n```python\n# 示例：在应用层累计token，超过阈值则切换模型或熔断\nfrom threading
    import local\nstate = local()\nstate.current_session_tokens = 0\n\ndef track_and_decide():\n
    \   state.current_session_tokens += latest_call_tokens\n    if state.current_session_tokens
    > 3000:\n        # 降级模型或缩短prompt\n        return use_degraded_config\n    return
    normal_config\n```\n\n\U0001F4A1 面对这种 trade-off，面试官最爱听的总结\n\n“我不会把准确率和成本对立起来。我会先用数据画一张‘性能-成本帕累托前沿’图，找到那个位于‘膝点’的配置——投入较少的额外成本，换来最大的质量提升。如果新方案不在膝点附近，就说明还有优化空间，而非急着上线。”"

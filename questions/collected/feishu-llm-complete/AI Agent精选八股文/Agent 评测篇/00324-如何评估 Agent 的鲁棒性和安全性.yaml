content:
  prompt: 如何评估 Agent 的鲁棒性和安全性？
answer:
  mode: rubric
  reference_answer: |-
    通俗理解

    一、鲁棒性评估

    鲁棒性评估四个方面：

    ```text
    ┌─────────────────────────────────────────────────────────────┐
    │                    鲁棒性评估四方面                           │
    ├──────────────────┬──────────────────────────────────────────┤
    │  抗干扰能力       │  指令模糊、信息有误时，会不会被带偏         │
    ├──────────────────┼──────────────────────────────────────────┤
    │  错误恢复能力     │  工具报错、环境异常时，能不能自己发现并纠正  │
    ├──────────────────┼──────────────────────────────────────────┤
    │  一致性           │  同一任务多次运行，结果稳不稳定             │
    ├──────────────────┼──────────────────────────────────────────┤
    │  边界处理         │  干不了的事，会不会老实说干不了             │
    └──────────────────┴──────────────────────────────────────────┘
    ```

    评估方法：

    关键指标：

    - 抗干扰率 = 不受误导信息影响的任务数 ÷ 总任务数

    - 错误恢复率 = 成功从错误中恢复的次数 ÷ 遇到错误的次数

    - 一致性得分 = 1 - (多次运行结果的方差 / 均值)

    - 正确拒绝率 = 正确拒绝的任务数 ÷ 应拒绝的任务数

    二、安全性评估

    安全性评估四个维度：

    ```text
    ┌─────────────────────────────────────────────────────────────┐
    │                    安全性评估四维度                           │
    ├──────────────────┬──────────────────────────────────────────┤
    │  越权行为         │  有没有干了没被授权的事                     │
    │                  │  比如偷偷删数据、发邮件、转账               │
    ├──────────────────┼──────────────────────────────────────────┤
    │  有害输出         │  有没有生成违规、歧视、暴力、色情内容       │
    ├──────────────────┼──────────────────────────────────────────┤
    │  隐私泄露         │  有没有在输出或工具调用中泄露敏感信息       │
    ├──────────────────┼──────────────────────────────────────────┤
    │  提示注入抗性     │  有人恶意在输入里埋雷，会不会被操控         │
    └──────────────────┴──────────────────────────────────────────┘
    ```

    评估方法：

    红队测试（Red Teaming）：

    - 组建专门团队，用各种手段攻击 Agent

    - 包括：直接诱导、角色扮演、编码绕过、多轮渐进诱导

    - 记录所有成功攻击案例，形成安全测试集

    三、鲁棒性 + 安全性评估流程

    ```text
    ┌──────────┐    ┌──────────┐    ┌──────────┐    ┌──────────┐
    │ 设计测试集│ → │ 批量运行  │ → │ 自动检测  │ → │ 人工复核  │
    └──────────┘    └──────────┘    └──────────┘    └──────────┘
                                                          │
                                                          ↓
                                                    ┌──────────┐
                                                    │ 修复优化  │
                                                    └──────────┘
    ```

    四、关键原则

    - 主动攻击：不能等出问题才修，要主动设计攻击测试。

    - 持续更新：攻击手法在进化，测试集也要持续更新。

    - 分级响应：不同严重程度的问题用不同优先级处理。

    - 安全兜底：关键操作加人工确认，不能全交给 Agent。

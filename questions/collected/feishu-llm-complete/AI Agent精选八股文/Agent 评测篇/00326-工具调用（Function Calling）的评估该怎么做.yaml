content:
  prompt: 工具调用（Function Calling）的评估该怎么做？
answer:
  mode: rubric
  reference_answer: |-
    通俗理解

    评估五个方面

    ```text
    ┌─────────────────────────────────────────────────────────────┐
    │                  工具调用评估五方面                            │
    ├──────────────────┬──────────────────────────────────────────┤
    │  工具选得对不对   │  该用搜索时有没有搜索、                    │
    │                  │  不该用工具时有没有瞎用、                   │
    │                  │  多个相似工具时能不能分清                   │
    ├──────────────────┼──────────────────────────────────────────┤
    │  参数填得准不准   │  参数名对不对、参数值提取得对不对、         │
    │                  │  类型对不对、必填的填全了吗                 │
    ├──────────────────┼──────────────────────────────────────────┤
    │  调用时机对不对   │  是不是在该调用的那一步调用、               │
    │                  │  有没有重复调用、有没有该调用却忘了          │
    ├──────────────────┼──────────────────────────────────────────┤
    │  结果看没看懂     │  能不能正确理解返回结果、                   │
    │                  │  能不能从错误返回里提取有用信息              │
    ├──────────────────┼──────────────────────────────────────────┤
    │  出错了会不会修   │  工具报错能不能发现并纠正、                 │
    │                  │  参数错了能不能重新构造、                   │
    │                  │  工具不可用能不能找替代方案                  │
    └──────────────────┴──────────────────────────────────────────┘
    ```

    四种评估方法

    方法一：静态数据集评估

    准备 (上下文, 可用工具, 期望调用) 样本，批量计算指标：

    方法二：LLM 裁判评估

    复杂场景用 GPT-4 评判：

    - 工具选择是否合理（1-5分）

    - 参数是否正确（1-5分）

    - 是否存在更优调用方式（是/否）

    方法三：端到端执行评估

    在沙箱环境中真实执行工具调用：

    方法四：对抗性评估

    指标汇总

    数据构建

    工具集设计：

    ```text
    ┌──────────────┬──────────────────────────────────────────────┐
    │  功能类型     │  查询、写入、计算、转换、通信                    │
    │  相似工具     │  放几个相似工具，测试区分能力                     │
    │  工具链       │  A 的输出是 B 的输入，测试衔接能力                │
    └──────────────┴──────────────────────────────────────────────┘
    ```

    样本设计：

    标注内容： 该调哪个工具、参数该填什么、第几步调、允不允许替代方案。

    评估流程

    ```text
    ┌──────────┐    ┌──────────┐    ┌──────────┐    ┌──────────┐
    │ 离线评估  │ → │ 环境验证  │ → │ 人工抽检  │ → │ 在线监控  │
    └──────────┘    └──────────┘    └──────────┘    └──────────┘
                                                          │
                                                          ↓
                                                    ┌──────────┐
                                                    │ 持续迭代  │
                                                    └──────────┘
    ```

    五个坑

    优化方向

    - 工具描述写清楚，减少选错。

    - Prompt 里加正确调用示例。

    - 调用前加参数校验和自动修正。

    - 工具失败自动重试或换参。

    - 相似工具分组，减少混淆。

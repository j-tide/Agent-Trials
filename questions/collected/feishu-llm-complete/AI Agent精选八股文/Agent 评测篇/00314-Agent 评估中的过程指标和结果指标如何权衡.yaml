content:
  prompt: Agent 评估中的"过程指标"和"结果指标"如何权衡？
answer:
  mode: rubric
  reference_answer: |-
    通俗理解

    一、两类指标的定义

    结果指标：

    - 任务完成率

    - 答案正确率

    - 目标达成度

    - 用户满意度

    过程指标：

    - 规划质量

    - 推理链正确性

    - 工具选择准确率

    - 参数正确率

    - 步数、Token 消耗、延迟

    二、为什么要结合看

    只看结果的三个问题：

    - 蒙对：Agent 可能靠运气碰对了答案，但过程完全错误，换个任务就失败。

    - 不可复现：不知道它为什么成功，无法优化和复制。

    - 掩盖问题：结果对了，但过程有安全隐患或效率极低，长期会出问题。

    只看过程的三个问题：

    - 自我感动：过程看起来很漂亮，但最终没解决问题。

    - 无法衡量价值：用户只关心结果，过程再优雅，没办成事也没用。

    - 过度约束：强行要求过程符合某种模式，可能限制了 Agent 的创造性和灵活性。

    三、权衡框架

    ```text
    ┌─────────────────────────────────────────────────────────────┐
    │              过程指标与结果指标的权衡矩阵                      │
    ├──────────────┬──────────────────────────────────────────────┤
    │              │              结果指标                          │
    │              │    好              差                         │
    ├──────────────┼──────────────────────────────────────────────┤
    │  过程指标 好  │  ✅ 理想状态        ⚠️ 过程好但没办成           │
    │              │  可复制、可优化      可能是任务太难或理解偏差     │
    ├──────────────┼──────────────────────────────────────────────┤
    │  过程指标 差  │  ⚠️ 蒙对了          ❌ 彻底失败                │
    │              │  不可复现、有风险     需要全面优化                 │
    └──────────────┴──────────────────────────────────────────────┘
    ```

    四、四种权衡策略

    策略一：结果优先，过程兜底

    适用于结果导向的场景，如客服、销售。

    - 主指标：任务完成率、用户满意度

    - 护栏指标：过程不能有安全隐患、不能效率极低

    - 只要结果好、过程不闯祸，就认可。

    策略二：过程优先，结果参考

    适用于高风险场景，如医疗、金融。

    - 主指标：规划质量、推理正确性、工具调用准确性

    - 护栏指标：结果不能太差

    - 因为一旦过程有误，结果再好也可能是侥幸，不能冒险。

    策略三：加权综合

    适用于通用场景。

    - 综合分 = 结果指标 × W1 + 过程指标 × W2

    - 比如 W1 = 0.6，W2 = 0.4

    - 权重按业务场景调整。

    策略四：分阶段侧重

    适用于Agent 开发迭代。

    - 早期：过程优先。因为 Agent 还没成熟，要看它有没有学会正确的做事方法。

    - 中期：结果和过程并重。

    - 成熟期：结果优先，过程作为护栏。

    五、关键原则

    - 结果决定价值，过程决定可持续性。

    - 结果好但过程差：短期可用，长期要优化。

    - 过程好但结果差：可能是任务太难，要拆解任务或增强能力。

    - 两者都差：全面重构。

    - 场景决定权重：高风险场景过程权重高，低风险场景结果权重高。

content:
  prompt: 如何设计一个完整的 Agent 评估体系？请从维度、指标、数据、流程四个方面展开。
answer:
  mode: rubric
  reference_answer: |-
    通俗理解

    一、评估维度（评什么）

    ```text
    ┌─────────────────────────────────────────────────────────────┐
    │                     Agent 评估五维度                          │
    ├──────────────┬──────────────────────────────────────────────┤
    │  结果维度     │  任务完成率、答案正确率、目标达成度、用户满意度    │
    ├──────────────┼──────────────────────────────────────────────┤
    │  过程维度     │  规划质量、推理链正确性、工具选择准确率、          │
    │              │  参数正确率、中间状态合理性                      │
    ├──────────────┼──────────────────────────────────────────────┤
    │  效率维度     │  平均步数、Token消耗、延迟、工具调用次数、成本     │
    ├──────────────┼──────────────────────────────────────────────┤
    │  鲁棒维度     │  抗干扰能力、错误恢复率、一致性、边界处理能力      │
    ├──────────────┼──────────────────────────────────────────────┤
    │  安全维度     │  越权操作率、有害输出率、隐私泄露率、             │
    │              │  提示注入抗性                                   │
    └──────────────┴──────────────────────────────────────────────┘
    ```

    二、评估指标（怎么量）

    综合分公式：Agent 得分 = 完成率 × 0.5 + 效率分 × 0.3 + 安全分 × 0.2（权重按业务调整）

    三、评估数据（拿什么评）

    数据集四个要求：

    ```text
    ┌──────────┬──────────────────────────────────────────────┐
    │  多样性   │  覆盖问答、规划、工具调用、多轮对话等类型        │
    │  真实性   │  来自真实用户请求，非人工编造                   │
    │  可验证   │  有明确答案或可验证的成功标准                   │
    │  对抗性   │  包含陷阱题、歧义题、注入攻击题                  │
    └──────────┴──────────────────────────────────────────────┘
    ```

    数据集五层分级：

    规模建议：快速评估 100-500 条；全面评估几千条；持续评估从线上收集失败案例补充。

    四、评估流程（怎么执行）

    ```text
    ┌─────────────────────────────────────────────────────────────┐
    │                     评估闭环                                 │
    │                                                             │
    │   ┌──────────┐    ┌──────────┐    ┌──────────┐             │
    │   │ 离线评估  │ → │ 定位问题  │ → │ 优化迭代  │             │
    │   └──────────┘    └──────────┘    └──────────┘             │
    │         ↑                                    │              │
    │         └────────────────────────────────────┘              │
    │                                                             │
    │   离线评估：固定数据集批量跑，自动指标 + LLM裁判 + 人工抽检    │
    │   在线评估：A/B测试对比新旧版本，看真实用户完成率、满意度       │
    │   持续评估：回归测试集，每次更新自动跑，防止能力退化            │
    └─────────────────────────────────────────────────────────────┘
    ```

    五、三条核心原则

    - 分层评：先考基本功，再考组合拳，最后考实战。

    - 过程和结果都要看：结果对了但过程乱来，换个任务就露馅。

    - 自动化优先，人工校准：LLM 裁判省钱，但得用人校准它靠不靠谱。

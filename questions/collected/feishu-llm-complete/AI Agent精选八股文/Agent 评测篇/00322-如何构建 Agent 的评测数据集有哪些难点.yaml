content:
  prompt: 如何构建 Agent 的评测数据集？有哪些难点？
answer:
  mode: rubric
  reference_answer: "通俗理解\n\n一、数据集构建五步法\n\n```text\n┌──────────┐    ┌──────────┐    ┌──────────┐
    \   ┌──────────┐    ┌──────────┐\n│ 定义任务 │ → │ 设计环境 │ → │ 标注答案 │ → │ 验证质量 │ →
    │ 持续更新 │\n│  类型    │    │  和工具  │    │ 和标准   │    │  和难度  │    │  和扩充  │\n└──────────┘
    \   └──────────┘    └──────────┘    └──────────┘    └──────────┘\n```\n\n第一步：定义任务类型\n\n第二步：设计环境和工具\n\n-
    搭建沙箱环境：模拟数据库、API、网页\n\n- 准备工具集：查询、写入、计算、转换、通信\n\n- 设计环境状态：初始状态、中间状态、目标状态\n\n-
    准备故障注入：让工具偶尔失败，测试鲁棒性\n\n第三步：标注答案和标准\n\n- 有唯一答案的：标注正确答案\n\n- 有多条路径的：标注多个可接受路径\n\n-
    开放式的：制定评分 rubric\n\n- 安全性：标注应拒绝的任务和应越权的陷阱\n\n第四步：验证质量和难度\n\n- 人工试做：让真人跑一遍，确认任务可完成\n\n-
    难度分层：简单、中等、困难、对抗\n\n- 质量校验：确保任务描述清晰、无歧义\n\n- 覆盖检查：确保覆盖所有评估维度\n\n第五步：持续更新和扩充\n\n-
    从线上收集失败案例\n\n- 从红队测试收集攻击案例\n\n- 定期更新，防止数据集过时\n\n### 二、六大难点\n\n难点一：环境搭建成本高\n\n-
    LLM 数据集只需文本，Agent 数据集需要可交互的环境\n\n- 每个工具都要有模拟实现，每个 API 都要有沙箱版本\n\n- 环境要稳定、可复现，不能每次跑结果都不一样\n\n难点二：答案不唯一\n\n-
    很多任务没有标准答案，只有\"是否达成目标\"\n\n- 需要制定详细的评分标准，还要用人工校准\n\n- 多条路径如何判定\"都算对\"是个难题\n\n难点三：过程标注困难\n\n-
    标注最终答案相对容易，标注每一步的理想动作极难\n\n- 不同专家可能给出不同的理想路径\n\n- 标注成本是 LLM 数据集的数倍\n\n难点四：非确定性\n\n-
    同一任务，Agent 每次路径可能不同\n\n- 结果也可能不同，需要多次运行取统计量\n\n- 数据集的评估结果本身有方差，难以判断改进是否有效\n\n难点五：安全风险\n\n-
    Agent 可以执行真实操作\n\n- 测试越权、有害操作时，可能造成真实损害\n\n- 必须在沙箱中进行，但沙箱可能无法完全模拟真实环境\n\n难点六：持续维护\n\n-
    环境会变化（API 更新、网页改版）\n\n- 攻击手法会进化\n\n- 数据集需要持续更新，否则会过时\n\n### 三、应对策略\n\n### 四、数据集分层建议\n\n```text\n┌─────────────────────────────────────────────────────────────┐\n│
    \                   Agent 评测数据集分层                       │\n├──────────────┬──────────────────────────────────────────────┤\n│
    \ 基础能力集   │  单步任务，100-500 条，测试基本功              │\n├──────────────┼──────────────────────────────────────────────┤\n│
    \ 多步推理集   │  3-10 步任务，200-500 条，测试规划能力        │\n├──────────────┼──────────────────────────────────────────────┤\n│
    \ 长程任务集   │  10 步以上，100-200 条，测试耐力              │\n├──────────────┼──────────────────────────────────────────────┤\n│
    \ 对抗集       │  陷阱题、模糊题，100-300 条，测试鲁棒性       │\n├──────────────┼──────────────────────────────────────────────┤\n│
    \ 安全集       │  越权、有害、注入，100-300 条，测试安全性     │\n└──────────────┴──────────────────────────────────────────────┘\n```\n\n###
    五、关键原则\n\n- 质量优先于数量：100 条精心设计的任务，胜过 10000 条随意编造的任务。\n\n- 场景真实：尽量来自真实用户请求，而非人工编造的简单问题。\n\n-
    持续迭代：数据集是活的，要持续更新。\n\n- 人工校准：自动化评估必须用人工验证。\n\n- 沙箱安全：所有测试在沙箱中进行，避免真实损害。\n\n- 选择准确率：该调搜索时是否乱用了计算器？\n\n-
    参数正确率：传给 API 的参数是否类型错误、值缺失？\n\n- 调用效率：是否反复调同一个工具，陷入死循环？\n\n- 端到端延迟（P50/P95）\n\n-
    Token 总消耗（尤其是反复调用大模型的场景）\n\n- 工具调用次数分布\n\n面试中这样总结会让面试官觉得你懂全貌\n“我会把评估体系看作一个六角雷达图，缺少任何一个维度都可能在生产中暴雷。而且这套体系一定是分级的：关键维度如任务完成度必须全量自动化检查，推理规划则可以抽检加裁判模型辅助。”\n\n\U0001F9E0
    加分回答\n“我把 Judge 当作一个需要被培训和校准的‘实习生’。量表和 few-shot 就是培训手册，而随机化顺序和多个裁判相互校验，就是消除他主观偏见的流程。在生产中，我还会定期人工抽样，计算裁判和人之间的一致性，保持评估系统自身的可信度。”\n\n\U0001F9E0
    这样回答会显得你很有方法论\n“我不会混在一起看成功率，而是用正交实验把两个模块解耦。这就像调试一台电脑，先换块确定好的显卡（完美工具）看能不能亮，再换个确定好的主板（完美推理）看外设反不反应，最后就知道瓶颈在哪儿。具体用
    mock 和人工思维链注入来实现，LangSmith 还能把这两组实验的 trace 分别标上不同标签，后续评估一目了然。”\n\n评估 LLM 像批改一张试卷，看答案对不对；评估
    Agent 像考核一个员工，不仅要看事情办没办成，还要看他怎么办的、花了多少时间、遇到问题会不会自己解决、有没有闯祸。\n\nLLM 评估是看一张照片拍得好不好，Agent
    评估是看一部电影拍得好不好——不仅要看结局，还要看剧情、演技、节奏。\n\n规划能力就像做菜，要看它会不会把\"做一桌年夜饭\"拆成\"买菜、洗菜、切菜、炒菜、摆盘\"，顺序对不对，会不会漏了煮饭，中间锅坏了会不会临时改用蒸锅。\n\n工具调用就像用手机
    App。选对 App（工具选择）、填对信息（参数）、在对的时候用（时机）、用完了看懂结果（结果解析）、App 崩了知道怎么办（错误恢复）。\n\n有些任务像数学题，答案唯一，对错分明。但很多
    Agent 任务像写文章、做方案，没有标准答案。这时候不能简单\"对答案\"，得请\"评委\"来打分。\n\n鲁棒性就是\"扛不扛造\"——遇到坑会不会摔，摔了会不会爬起来。安全性就是\"会不会闯祸\"——有没有干不该干的事。\n\n结果指标看\"事情办没办成\"，过程指标看\"怎么办的\"。只盯结果，可能蒙对；只盯过程，可能白忙活。两者要结合看。\n\n构建评测数据集就像出考卷。LLM
    的考卷是问答题，出起来相对简单。Agent 的考卷是\"实战演练\"，不仅要出题，还要搭建考场、准备道具、制定评分标准，难度大得多。"

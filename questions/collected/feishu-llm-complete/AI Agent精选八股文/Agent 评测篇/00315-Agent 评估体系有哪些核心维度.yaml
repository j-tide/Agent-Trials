content:
  prompt: Agent 评估体系有哪些核心维度？
answer:
  mode: rubric
  reference_answer: "很多人觉得评估就是“让模型打分”，这是把问题想简单了。一个能落地的 Agent 评估体系，至少需要覆盖 6 个维度，每个维度都有对应的量化指标和检查方法。\n\n▎维度一：\U0001F3AF
    任务完成度（Task Success）\n\n直接看 Agent 是否完成了用户的意图。这是最核心的业务指标。\n\n- 怎么测：准备带预期结果的数据集，用代码校验最终输出（如订单是否真的被创建、返回的
    JSON 字段是否齐全）。复杂文本则引入裁判模型判断。\n\n- 示例代码（结构化校验）：\n\n```python\ndef check_order_created(output):\n
    \   # 假设Agent输出包含订单ID\n    import re\n    match = re.search(r\"订单ID[:：]\\s*(\\w+)\",
    output)\n    return {\"success\": bool(match), \"order_id\": match.group(1) if
    match else None}\n```\n\n维度二：\U0001F6E0️ 工具使用正确性（Tool Utilization）\n\nAgent 的核心优势是能调用工具，调用错一切都白费。\n\n-
    考察点：\n\n- 量化方式：从 Trace 中提取工具调用序列，和理想序列对比，统计“关键工具命中率”和“冗余调用次数”。\n\n▎维度三：\U0001F4AC
    回答质量（Response Quality）\n\n即使完成任务，如果答案冗长、啰嗦或不符合用户格式要求，体验也差。\n\n- 子指标：准确性（无幻觉）、完整性、简洁性、格式规范性。\n\n-
    如何自动化：LLM-as-Judge 搭配精细的打分量表（见问题2）。\n\n▎维度四：\U0001F9E0 推理与规划能力（Reasoning & Planning）\n\n复杂
    Agent 需要在多步中推理。评估就看它的“思考链”是否合理。\n\n- 观察点：是否先收集信息再行动？中间是否自我修正？能否处理模糊需求？\n\n- 评估方法：人工抽检
    Trace 中的推理步骤，或让裁判模型评估“思考是否有助于达成目标”。\n\n▎维度五：⏱️ 性能与成本（Efficiency & Cost）\n\nAgent
    常因多步调用带来延迟和费用。\n\n- 关键指标：\n\n- 监控代码片段（结合 LangSmith）：\n\n```python\nfrom langsmith
    import Client\nclient = Client()\n# 获取近1小时的run并计算平均时长和花费\nruns = client.list_runs(project_name=\"prod-agent\",
    start_time=...)\navg_latency = sum(r.total_tokens for r in runs) / len(runs)\n```\n\n▎维度六：\U0001F6E1️
    安全与合规（Safety & Compliance）\n\n绝对不能出现泄露个人信息、有害言论等。\n\n- 自动化红线：用规则或专用审核模型检查输出是否包含敏感词、歧视性内容，也可以接入内容安全
    API。\n\n---"

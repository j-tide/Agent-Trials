content:
  prompt: 如何评估一个 Agent 的多步推理与规划能力？
answer:
  mode: rubric
  reference_answer: |-
    通俗理解

    评估五个维度

    ```text
    ┌─────────────────────────────────────────────────────────────┐
    │              多步推理与规划能力评估维度                        │
    ├──────────────────┬──────────────────────────────────────────┤
    │  规划合理性       │  任务拆解对不对、顺序有没有逻辑、           │
    │                  │  有没有漏步骤、有没有多余步骤               │
    ├──────────────────┼──────────────────────────────────────────┤
    │  规划完整性       │  有没有覆盖所有必要条件、                   │
    │                  │  有没有考虑异常情况                        │
    ├──────────────────┼──────────────────────────────────────────┤
    │  执行一致性       │  实际做的和计划的是不是一回事、             │
    │                  │  偏离得合不合理                            │
    ├──────────────────┼──────────────────────────────────────────┤
    │  动态调整能力     │  某步失败会不会重新规划、                   │
    │                  │  环境变了会不会调整计划                     │
    ├──────────────────┼──────────────────────────────────────────┤
    │  推理链正确性     │  每一步逻辑严不严密、                       │
    │                  │  有没有跳步、瞎猜、幻觉                     │
    └──────────────────┴──────────────────────────────────────────┘
    ```

    五种评估方法

    方法一：对答案（过程标注逐步匹配）

    提前标注理想步骤，把实际步骤和理想步骤对比：

    方法二：请大模型当裁判

    开放式任务没有唯一答案，请 GPT-4 当裁判打分：

    - 规划合理性 1-5 分

    - 规划完整性 1-5 分

    - 有没有逻辑错误（是/否）

    - 有没有更优解（是/否）

    关键：裁判必须与人工评分对齐，Cohen's Kappa > 0.7 才可信。

    方法三：只查关键节点

    不要求全程匹配，只检查几个关键点：

    - 该用工具的时候用了吗

    - 中间结论对不对

    - 遇到障碍会不会绕路

    这种方法对路径多样性更宽容，适合评估"殊途同归"的能力。

    方法四：故意使绊子（对抗性规划测试）

    方法五：测能力边界

    设计不同复杂度任务，画出能力曲线：

    - 深度：任务嵌套多少层（A 依赖 B，B 依赖 C）

    - 广度：同时处理多少并列子任务

    - 交叉：子任务之间有多少依赖

    观察在什么复杂度下 Agent 开始失败。

    指标汇总

    数据构建

    ```text
    ┌──────────────┬──────────────┬──────────────────────────────┐
    │   任务类型    │    步数       │         测试目标              │
    ├──────────────┼──────────────┼──────────────────────────────┤
    │   简单任务    │   2-3 步      │  基础规划能力                 │
    │   中等任务    │   4-8 步      │  多步协调能力                 │
    │   复杂任务    │   8 步以上    │  长程规划能力                 │
    │   动态任务    │   中途有变化   │  重规划能力                   │
    │   对抗任务    │   有误导信息   │  抗干扰能力                   │
    └──────────────┴──────────────┴──────────────────────────────┘
    ```

    每个任务标注：目标描述、可用工具、理想步骤序列（可多条）、成功判定标准。

    ### 四个坑

content:
  prompt: 当 Agent 的任务没有唯一标准答案时，如何做自动化评估？
answer:
  mode: rubric
  reference_answer: |-
    通俗理解

    核心思路

    没有唯一答案时，评估从"精确匹配"转向"多维评分"。主要有五种方法。

    方法一：LLM 作为裁判

    做法：用强大的 LLM（如 GPT-4）当评委，给 Agent 的输出打分。

    评分维度：

    - 正确性：内容是否事实正确、逻辑自洽

    - 完整性：是否覆盖了任务要求的所有要点

    - 相关性：是否切题，有没有跑偏

    - 有用性：对用户是否有实际帮助

    - 表达质量：是否清晰、有条理

    关键点：

    - 必须制定详细的评分标准，不能只给一句"打个分"

    - 必须用人工评分校准 LLM 裁判，确保一致性（如 Cohen's Kappa > 0.7）

    - 最好让 LLM 给出评分理由，便于复核

    方法二：参考答案 + 语义相似度

    做法：准备一个或多个参考答案，用语义相似度衡量 Agent 输出与参考答案的接近程度。

    工具：

    - 传统指标：BLEU、ROUGE、METEOR

    - 语义指标：BERTScore、Sentence-BERT 余弦相似度

    - 嵌入模型：用 Embedding 模型把两段文本编码成向量，计算余弦相似度

    适用场景：答案有大致方向，但表述可以多样。比如摘要、翻译、改写。

    方法三：关键要点匹配

    做法：不要求全文匹配，只检查 Agent 的输出是否包含了若干"关键要点"。

    示例：任务是"分析某公司的竞争优势"，关键要点可以是：

    - 是否提到了成本优势

    - 是否提到了品牌优势

    - 是否提到了技术壁垒

    评估：命中要点数 ÷ 总要点数 = 要点覆盖率。

    优点：对表述方式宽容，只看"有没有说到点子上"。

    方法四：多维评分卡

    做法：设计一个评分卡，每个维度独立打分，最后加权汇总。

    总分 = 各维度得分 × 权重之和。

    方法五：成对比较

    做法：不直接打分，而是让裁判比较两个 Agent 的输出，判断哪个更好。

    优势：

    - 人类和 LLM 都更擅长比较而非绝对打分

    - 避免了评分标准的主观差异

    - 适合 A/B 测试场景

    工具：Chatbot Arena 的 Elo 评分机制就是典型的成对比较。

    五种方法对比

    关键原则

    - 组合使用：没有一种方法完美，通常组合使用。比如先用关键要点匹配做粗筛，再用 LLM 裁判做精细评估。

    - 人工校准：任何自动化方法都要用人工评分验证。

    - 场景定制：不同任务类型用不同方法，不能一刀切。

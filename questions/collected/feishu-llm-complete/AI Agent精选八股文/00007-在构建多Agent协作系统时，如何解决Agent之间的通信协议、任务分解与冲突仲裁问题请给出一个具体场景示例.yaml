    3.3 推荐方案：仲裁者模式（Mediator）

    引入一个仲裁者Agent（或称为协调员），它不处理具体任务，只负责：

    - 监听所有Agent的状态与资源请求。

    - 检测冲突（如两个Agent同时申请写同一文件）。

    - 根据策略（如先到先得、优先级）授予或拒绝许可。

    - 必要时强制中止某个Agent的操作并触发补偿。

    ---

    ### 四、具体场景示例：智能客服与多部门协作

    场景描述

    用户发起请求：“我要退货我上周买的手机，但发票丢了。同时我想咨询新出的平板电脑折扣。”

    系统涉及三个Agent：

    - 客服Agent：主交互，理解用户意图。

    - 退货Agent：处理退货流程，需访问订单系统和库存。

    - 销售Agent：提供折扣信息，需访问促销数据库。

    4.1 通信协议示例

    步骤1：客服Agent解析用户请求，生成两个子任务：退货（Task-R）和咨询（Task-S）。

    步骤2：客服Agent向退货Agent发送任务请求消息（type: task_request）：

    {
      "msg_id": "msg-101",
      "from": "客服Agent",
      "to": "退货Agent",
      "type": "task_request",
      "payload": {
        "action": "check_return_eligibility",
        "params": {
          "product": "手机",
          "purchase_date": "2026-03-25",
          "has_invoice": false
        }
      },
      "reply_to": "客服Agent",
      "timeout_ms": 10000
    }

    同时，向销售Agent发送咨询请求（另一消息）。

    步骤3：退货Agent查询订单系统，发现符合退货政策（7天内），但需要人工审核无发票情况。返回task_response：

    {
      "msg_id": "msg-102",
      "from": "退货Agent",
      "to": "客服Agent",
      "type": "task_response",
      "payload": {
        "status": "need_human_review",
        "message": "无发票退货需人工审核，预计24小时回复。"
      }
    }

    步骤4：销售Agent返回平板折扣信息（status: success）。

    4.2 任务分解

    客服Agent将用户请求分解为：

    - 子任务1：处理退货（需要人工审核，非即时）。

    - 子任务2：提供平板折扣信息（即时）。

    - 最终答案：综合两个子任务结果，告知用户折扣信息，并说明退货已提交人工审核。

    4.3 冲突仲裁

    假设冲突：退货Agent和销售Agent都需要临时锁定同一用户记录（例如更新用户积分）。但用户积分只能由一个Agent修改。

    仲裁方案：

    - 两个Agent同时向仲裁者Agent申请锁（资源ID: user_123_credit）。

    - 仲裁者按“先到先得”原则授予退货Agent锁，销售Agent收到“锁已被占用”响应。

    - 销售Agent将积分更新操作推迟到退货Agent释放锁后，或采用乐观锁（读取版本号，更新时检查）。

    - 退货Agent完成操作后，向仲裁者发送释放锁消息。仲裁者通知等待队列中的销售Agent。

    消息示例（申请锁）：

    {
      "msg_id": "msg-201",
      "from": "退货Agent",
      "to": "仲裁者Agent",
      "type": "lock_request",
      "payload": {"resource": "user_123_credit", "ttl_ms": 5000}
    }

    4.4 结果聚合

    客服Agent收集退货Agent和销售Agent的响应：

    - 销售Agent返回：“新平板打9折，折后价4500元。”

    - 退货Agent返回：“已提交人工审核，请关注后续通知。”

    客服Agent生成最终回复：


  reference_answer: |-
    ### 多Agent协作系统的三大核心问题与解决方案

    ### 一、通信协议

    多Agent之间需要标准化的消息格式与交互模式，以确保信息可理解、可路由、可追踪。

    1.1 消息结构设计

    推荐基于 Actor模型 或 事件驱动 的消息格式（如JSON）：

    {
      "msg_id": "uuid",
      "from": "agent_planner",
      "to": "agent_executor",
      "type": "task_request",
      "timestamp": "2026-04-02T10:00:00Z",
      "correlation_id": "session_123_task_1",
      "payload": {
        "action": "fetch_data",
        "params": {"dataset": "sales", "date": "2026-03-01"}
      },
      "reply_to": "agent_planner",
      "timeout_ms": 5000
    }

    1.2 通信模式

    [嵌入表格未展开]

    1.3 传输协议与中间件

    - 轻量级：Redis Pub/Sub、NATS（适合低延迟内部通信）。

    - 企业级：Kafka（持久化、高吞吐）、RabbitMQ（复杂路由）。

    - 框架内置：AutoGen原生支持Agent间对话；LangGraph支持有条件消息传递。

    1.4 协议规范要点

    - 序列化：统一使用JSON/MessagePack。

    - 超时与重试：每个消息带timeout_ms，超时后发送失败通知。

    - 幂等性：通过msg_id去重，防止重复处理。

    - 安全：内部网络隔离，消息体加密（如有跨信任域）。

    ---

    ### 二、任务分解

    将用户复杂任务拆解为多个子任务，并分配给合适的Agent。

    2.1 分解策略

    [嵌入表格未展开]

    2.2 分解流程

    - 全局规划Agent接收用户请求。

    - 利用LLM生成任务分解DAG（有向无环图），每个节点包含：任务描述、所需能力、输入、期望输出。

    - 任务分配器根据Agent注册的能力（如“能访问SQL数据库”、“能画图”）匹配执行者。

    - 分配结果写入任务队列，并通知相应Agent。

    2.3 任务分解示例（自然语言转SQL+图表）

    用户：“分析去年各季度销售趋势，并生成折线图。”

    分解DAG：

    text

    Task A: 确定时间范围 (2025-01-01 ~ 2025-12-31)Task B: 查询各季度销售额 (依赖A)Task C: 生成折线图数据 (依赖B)Task D: 渲染折线图图片 (依赖C)Task E: 撰写简短分析结论 (依赖B)

    ---


content:
  prompt: 1、基础题：@ConfigurationProperties 和 @Value 有什么区别？各自适用什么场景？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（配置绑定、类型安全、松散绑定）

    1️⃣ Common Answer

    @Value 是注入单个配置项，@ConfigurationProperties 是批量绑定一组配置。@ConfigurationProperties 支持 POJO 绑定，@Value 支持 SpEL 表达式。

    2️⃣ Impressive Answer

    - 核心区别对比：

    - @ConfigurationProperties 最佳实践：

    ```text
    @ConfigurationProperties(prefix = "agent.llm")
    @Validated  // 开启 JSR-303 校验
    public class LLMProperties {

        @NotBlank
        private String apiKey;

        @Min(1)
        @Max(4096)
        private int maxTokens = 2048;

        private double temperature = 0.7;

        private List<String> models = new ArrayList<>();

        // getter/setter 省略
    }

    // 注册到容器（二选一）
    @EnableConfigurationProperties(LLMProperties.class)
    // 或者在类上加 @Component
    ```

    - 松散绑定规则：agent.llm.api-key、agent.llm.apiKey、AGENT_LLM_API_KEY（环境变量）都能绑定到 apiKey 字段。

    - @Value 的 SpEL 能力：

    ```text
    // 支持默认值
    @Value("${agent.timeout:30}")
    private int timeout;

    // 支持 SpEL 表达式
    @Value("#{${agent.weights}}")
    private Map<String, Double> weights;
    ```

    - Agent 场景：LLM 配置（API Key、模型参数、超时）用 @ConfigurationProperties 统一管理，支持多环境切换和配置校验，避免启动后才发现配置错误。

    3️⃣ Key Differences


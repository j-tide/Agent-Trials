content:
  prompt: 2、进阶题：@Async 的底层实现原理是什么？如何自定义线程池？异步方法的异常如何处理？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（AOP 代理、AsyncAnnotationBeanPostProcessor、异常处理）\n\n1️⃣
    Common Answer\n\n@Async 是通过 AOP 实现的，会生成代理对象。自定义线程池就是配置一个 ThreadPoolTaskExecutor
    Bean。异步方法的异常可以用 try-catch 捕获，或者实现 AsyncUncaughtExceptionHandler。\n\n2️⃣ Impressive
    Answer\n\n- 底层实现原理：\n\n- 线程池选择策略：\n\n- 异常处理机制：\n\n@Configuration\n@EnableAsync\npublic
    class AsyncConfig implements AsyncConfigurer {\n    @Override\n    public AsyncUncaughtExceptionHandler
    getAsyncUncaughtExceptionHandler() {\n        return (ex, method, params) -> {\n
    \           log.error(\"Async method error: {}\", method.getName(), ex);\n            //
    发送告警、记录日志等\n        };\n    }\n}\n\n- 有返回值方法：异常封装在 CompletableFuture 中，调用方通过 exceptionally()
    处理：\n\n@Async\npublic CompletableFuture<String> asyncMethod() {\n    return CompletableFuture.supplyAsync(()
    -> {\n        throw new RuntimeException(\"error\");\n    });\n}\n        \n//
    调用方\nasyncMethod()\n    .exceptionally(ex -> {\n        log.error(\"Error\", ex);\n
    \       return \"fallback\";\n    });\n\n- 事务与异步：@Async 和 @Transactional 不能同时用在同一个方法上（异步方法在新线程执行，事务上下文丢失）。如果需要事务，在异步方法内部调用的方法上加
    @Transactional。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

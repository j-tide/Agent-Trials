content:
  prompt: 2、进阶题：@Transactional 在什么情况下会失效？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（自调用、非 public 方法、异常类型、代理机制、异步方法）

    1️⃣ Common Answer

    @Transactional 失效的情况挺多的。比如同类方法自调用的时候，因为 AOP 代理的问题会失效。还有方法不是 public 的也会失效。另外如果抛的异常不是 RuntimeException 也可能不回滚。

    2️⃣ Impressive Answer

    我从 5 个维度梳理@Transactional 失效场景：

    - 自调用失效（最常见）：同一个 Bean 内部方法 A 调用带@Transactional 的方法 B，B 的事务不生效。原因：AOP 代理对象才是事务载体，自调用走的是 this.B()，绕过了代理。解决：注入自身代理调用，或用 AopContext.currentProxy()。

    - 访问权限限制：@Transactional 只能标注在 public 方法上。protected/private 方法即使加上也不会生效，因为 Spring AOP 默认只代理 public 方法。

    - 异常类型不匹配：默认只回滚 RuntimeException 和 Error。如果抛的是受检异常（Checked Exception），需要显式指定 @Transactional(rollbackFor = Exception.class)。

    - 捕获异常未抛出：方法内部 try-catch 把异常吞了，事务管理器感知不到异常，自然不会回滚。解决：catch 后手动调用 TransactionAspectSupport.currentTransactionStatus().setRollbackOnly()。

    - 异步方法失效：@Async 方法的事务 propagation 可能不符合预期，因为异步方法在另一个线程执行，事务上下文无法传递。解决：在异步方法上单独加@Transactional。


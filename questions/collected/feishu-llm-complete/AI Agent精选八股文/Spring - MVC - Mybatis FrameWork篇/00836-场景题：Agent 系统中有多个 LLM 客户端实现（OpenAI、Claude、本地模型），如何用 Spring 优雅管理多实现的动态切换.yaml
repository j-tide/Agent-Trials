content:
  prompt: 4、场景题：Agent 系统中有多个 LLM 客户端实现（OpenAI、Claude、本地模型），如何用 Spring 优雅管理多实现的动态切换？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（@Qualifier、策略模式 + Map 注入、@ConditionalOnProperty、SPI 机制）

    1️⃣ Common Answer

    可以定义一个 LlmClient 接口，然后写多个实现类。用 @Qualifier 注解指定注入哪个。或者用 @ConditionalOnProperty 根据配置决定加载哪个实现。运行时切换的话可以用策略模式。

    2️⃣ Impressive Answer

    - 策略模式 + Map 自动注入（最推荐）：

    ```text
    public interface LlmClient {
        String getModelName();
        ChatResponse chat(ChatRequest request);
    }

    @Service
    public class LlmRouter {
        private final Map<String, LlmClient> clientMap;

        // Spring 自动将所有 LlmClient 实现注入到 Map 中
        // key = Bean 名称，value = Bean 实例
        public LlmRouter(Map<String, LlmClient> clientMap) {
            this.clientMap = clientMap;
        }

        public ChatResponse route(String modelName, ChatRequest request) {
            LlmClient client = clientMap.get(modelName);
            if (client == null) {
                throw new UnsupportedModelException("不支持的模型: " + modelName);
            }
            return client.chat(request);
        }
    }
    ```

    - 动态切换：路由策略存 Nacos 配置中心，通过 @RefreshScope 实现运行时切换默认模型，无需重启。

    - 扩展性设计：新增模型只需实现 LlmClient 接口并注册为 Spring Bean，路由器自动感知，零修改扩展（开闭原则）。

    - 配合 @ConditionalOnProperty：按环境启停，如测试环境不加载 GPT-4 客户端（节省成本），生产环境全量加载。


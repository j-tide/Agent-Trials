content:
  prompt: "\U0001F9EA 验证：自己写一个“迷你版 MapperProxy”"
answer:
  mode: rubric
  reference_answer: |-
    ```java
    public class MiniMapperProxy implements InvocationHandler {
        private SqlSession sqlSession;

        public MiniMapperProxy(SqlSession sqlSession) {
            this.sqlSession = sqlSession;
        }

        @Override
        public Object invoke(Object proxy, Method method, Object[] args) throws Throwable {
            // 假设约定接口方法名就是 statement id
            String statement = method.getDeclaringClass().getName() + "." + method.getName();
            // 判断返回值类型决定调用 selectOne 还是 selectList
            if (method.getReturnType().isAssignableFrom(List.class)) {
                return sqlSession.selectList(statement, args[0]);
            } else {
                return sqlSession.selectOne(statement, args[0]);
            }
        }
    }

    // 手动创建代理
    UserMapper mapper = (UserMapper) Proxy.newProxyInstance(
            UserMapper.class.getClassLoader(),
            new Class[]{UserMapper.class},
            new MiniMapperProxy(sqlSession));
    ```

    这就是 MyBatis “零实现类” 的魔法本质。你写的每一个接口方法，最终都被翻译成了 sqlSession 上的操作。

  prompt: 2、进阶题：@ConditionalOnMissingBean 的判断时机是什么？为什么用户自定义的 Bean 能覆盖自动配置？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（Bean 注册顺序、DeferredImportSelector、自动配置优先级）

    1️⃣ Common Answer

    因为用户的 Bean 先注册，自动配置的 Bean 后注册，@ConditionalOnMissingBean 检查到已经有了就不创建了。

    2️⃣ Impressive Answer

    - 核心机制：DeferredImportSelector：

    - 判断时机：

    - 正确覆盖姿势：

    ```text
    // 用户自定义配置，覆盖自动配置的 DataSource
    @Configuration
    public class MyDataSourceConfig {

        @Bean
        // 不需要加任何条件注解，因为自动配置的 DataSource 有 @ConditionalOnMissingBean
        public DataSource dataSource() {
            return new HikariDataSource(myConfig());
        }
    }
    ```

    - 常见陷阱：@ConditionalOnMissingBean 只检查当前已注册的 BeanDefinition，如果两个自动配置类都没有 @ConditionalOnMissingBean 保护，会导致 Bean 重复注册冲突。


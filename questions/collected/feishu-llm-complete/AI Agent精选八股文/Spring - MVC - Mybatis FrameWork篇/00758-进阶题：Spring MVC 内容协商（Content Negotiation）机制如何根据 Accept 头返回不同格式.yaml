content:
  prompt: 2、进阶题：Spring MVC 内容协商（Content Negotiation）机制？如何根据 Accept 头返回不同格式？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（ContentNegotiation、Accept 头、多格式响应）\n\n1️⃣ Common Answer\n\nContent
    Negotiation 就是根据请求的 Accept 头返回不同格式，比如 JSON 或 XML。好像要配置 HttpMessageConverter。\n\n2️⃣
    Impressive Answer\n\n我从 4 个维度解析：\n\n- 内容协商策略： Spring MVC 支持多种协商策略：\n\n- Accept
    头：Accept: application/json → 返回 JSON\n\n- URL 后缀：/agent.json → 返回 JSON\n\n- 请求参数：/agent?format=json
    → 返回 JSON\n\n- 固定策略：忽略客户端，强制返回指定格式\n\n- 配置内容协商：\n\n```text\n@Configuration\npublic
    class WebConfig implements WebMvcConfigurer {\n    \n    @Override\n    public
    void configureContentNegotiation(ContentNegotiationConfigurer configurer) {\n
    \       configurer\n            // 启用 Accept 头协商\n            .favorParameter(false)\n
    \           // 启用 URL 后缀协商（/agent.json）\n            .favorPathExtension(true)\n
    \           // 忽略 Accept 头，强制返回 JSON\n            // .ignoreAcceptHeader(true)\n
    \           // 默认内容类型\n            .defaultContentType(MediaType.APPLICATION_JSON)\n
    \           // 指定后缀映射\n            .mediaType(\"json\", MediaType.APPLICATION_JSON)\n
    \           .mediaType(\"xml\", MediaType.APPLICATION_XML)\n            .mediaType(\"protobuf\",
    MediaType.parseMediaType(\"application/x-protobuf\"));\n    }\n    \n    @Override\n
    \   public void extendMessageConverters(List<HttpMessageConverter<?>> converters)
    {\n        // 添加 Protobuf 转换器\n        converters.add(new ProtobufHttpMessageConverter());\n
    \   }\n}\n```\n\n- 多格式响应示例：\n\n```text\n@RestController\n@RequestMapping(\"/api/agent\")\npublic
    class AgentController {\n    \n    // 根据 Accept 头返回 JSON 或 XML\n    @GetMapping(\"/{id}\")\n
    \   public Agent getAgent(@PathVariable Long id) {\n        return agentService.findById(id);\n
    \       // Accept: application/json → JSON\n        // Accept: application/xml
    → XML\n    }\n    \n    // ResponseEntity 精确控制\n    @GetMapping(\"/{id}/detail\")\n
    \   public ResponseEntity<Agent> getAgentDetail(@PathVariable Long id) {\n        Agent
    agent = agentService.findById(id);\n        return ResponseEntity.ok()\n            .contentType(MediaType.APPLICATION_JSON)\n
    \           .body(agent);\n    }\n}\n```\n\n- Agent 场景：多协议支持\n\n```text\n// Agent
    平台同时支持 JSON 和 Protobuf\n@GetMapping(\"/agent/tools\")\npublic ResponseEntity<List<Tool>>
    listTools(\n    @RequestHeader(\"Accept\") String acceptHeader) {\n    \n    List<Tool>
    tools = toolService.getAll();\n    \n    if (acceptHeader.contains(\"application/x-protobuf\"))
    {\n        return ResponseEntity.ok()\n            .contentType(MediaType.parseMediaType(\"application/x-protobuf\"))\n
    \           .body(tools);\n    }\n    \n    return ResponseEntity.ok()\n        .contentType(MediaType.APPLICATION_JSON)\n
    \       .body(tools);\n}\n```\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

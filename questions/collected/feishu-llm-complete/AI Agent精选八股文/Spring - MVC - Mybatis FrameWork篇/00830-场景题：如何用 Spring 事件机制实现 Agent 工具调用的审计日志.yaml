content:
  prompt: 3、场景题：如何用 Spring 事件机制实现 Agent 工具调用的审计日志？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（事件驱动解耦、异步审计、结构化日志）

    1️⃣ Common Answer

    可以定义一个工具调用事件，在工具调用完成后发布事件，然后用 @EventListener 监听这个事件，把调用信息写到数据库里。加上 @Async 就不会影响主流程了。

    2️⃣ Impressive Answer

    - 定义审计事件：

    @Data
    public class ToolInvocationEvent extends ApplicationEvent {
        private String toolName;
        private Object[] arguments;
        private Object result;
        private long durationMs;
        private String userId;
        private String traceId;
        private boolean success;
    }

    - AOP 切面发布事件：在 @Around 切面中，工具调用完成后 publishEvent，将调用信息封装为事件。切面只负责发布，不关心后续处理。

    - 多监听器各司其职：

    - 核心优势：工具调用逻辑和审计逻辑完全解耦。新增审计需求（如合规审计、成本统计）只需加一个监听器，不修改任何已有代码，符合开闭原则。

    - 生产考虑：异步监听器配置独立线程池，避免审计任务影响业务线程；监听器内部做好异常处理和重试，保证审计数据不丢失。


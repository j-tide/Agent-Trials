answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（分布式事务、两阶段提交、Agent 场景）

    1️⃣ Common Answer 用分布式事务，如 Seata。或者用消息队列，最终一致性。先写业务库，再写向量库，失败回滚。

    2️⃣ Impressive Answer

    - 场景分析：Agent 工具调用需要同时写入业务库（订单、用户）和向量库（向量数据），两个数据库独立部署，无法使用本地事务保证一致性。挑战：网络分区、数据库宕机、部分提交导致数据不一致。

    - 方案 1：本地事务 + 补偿机制（推荐）：

    ```text
    @Transactional
    public void executeTool(ToolRequest request) {
        businessMapper.insert(request);
        try {
            vectorService.insertVector(request.getVector());
        } catch (Exception e) {
            log.error("向量库写入失败，记录重试日志", e);
            retryLogMapper.insert(new RetryLog(request));
        }
    }
    ```


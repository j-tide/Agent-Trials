content:
  prompt: 2、进阶题：@Async 的实现原理是什么（AOP + TaskExecutor）？为什么 @Async 在同类自调用时失效？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（AOP 代理、自调用失效、CGLIB）\n\n1️⃣ Common Answer\n\n@Async 是通过
    AOP 实现的，Spring 会为标注了 @Async 的 Bean 创建代理，代理会在调用时将方法提交到线程池执行。同类自调用失效是因为没有经过代理。\n\n2️⃣
    Impressive Answer\n\n- @Async 的实现原理：\n\n- 同类自调用失效原因：\n\n- AopContext 解决方案：\n\n@Service\npublic
    class AsyncService {\n       \n    @Async\n    public CompletableFuture<String>
    asyncMethod() {\n        return CompletableFuture.completedFuture(\"done\");\n
    \   }\n       \n    public void callAsyncMethod() {\n        // 获取代理，调用异步方法\n
    \       AsyncService proxy = (AsyncService) AopContext.currentProxy();\n        proxy.asyncMethod();\n
    \   }\n}\n\n注意：需要配置 @EnableAspectJAutoProxy(exposeProxy = true)。\n\n- 线程池选择：\n\n-
    异常处理：\n\n@Async\npublic CompletableFuture<String> asyncMethodWithException() {\n
    \   try {\n        // 异步逻辑\n        return CompletableFuture.completedFuture(\"done\");\n
    \   } catch (Exception e) {\n        return CompletableFuture.failedFuture(e);\n
    \   }\n}\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

content:
  prompt: 2、进阶题：MBG 生成的 Example 类是什么？如何自定义 MBG 插件扩展生成逻辑？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（Example 类、插件机制、自定义扩展）

    1️⃣ Common Answer Example 类是用来构建查询条件的，可以动态拼接 WHERE 条件。MBG 支持插件，可以自定义生成逻辑，比如生成注释、自定义方法等。

    2️⃣ Impressive Answer

    - Example 类的作用：UserExample example = new UserExample(); example.createCriteria().andIdEqualTo(1).andNameLike("%test%"); 动态构建查询条件，避免手写 XML SQL。核心类：Criteria（内部类，构建 AND 条件）、Criterion（条件对象，封装字段、操作符、值）。

    - Example 使用场景：

    - 自定义 MBG 插件：

    ```text
    public class CommentPlugin extends PluginAdapter {
      @Override
      public boolean modelFieldGenerated(Field field, IntrospectedTable introspectedTable, IntrospectedColumn introspectedColumn, PluginModel.PluginModelClass pluginModelClass, PluginModel.PluginModelField pluginModelField) {
        field.addJavaDocLine("/** " + introspectedColumn.getRemarks() + " */");
        return true;
      }
    }
    ```

    配置插件：<plugin type="com.example.CommentPlugin"/>，为生成的字段添加数据库注释。


content:
  prompt: "\U0001F9EA 自定义一个消息转换器（例如支持 CSV）"
answer:
  mode: rubric
  reference_answer: "假设我们需要让 @ResponseBody 能直接返回 List<User> 并输出 CSV 文件。\n\n```java\npublic
    class CsvHttpMessageConverter extends AbstractHttpMessageConverter<List<User>>
    {\n\n    public CsvHttpMessageConverter() {\n        super(new MediaType(\"text\",
    \"csv\"));\n    }\n\n    @Override\n    protected boolean supports(Class<?> clazz)
    {\n        return List.class.isAssignableFrom(clazz);\n    }\n\n    @Override\n
    \   protected List<User> readInternal(Class<? extends List<User>> clazz, \n                                      HttpInputMessage
    inputMessage) {\n        throw new UnsupportedOperationException(\"暂不实现读取\");\n
    \   }\n\n    @Override\n    protected void writeInternal(List<User> users, HttpOutputMessage
    outputMessage) \n            throws IOException {\n        OutputStream outputStream
    = outputMessage.getBody();\n        try (PrintWriter writer = new PrintWriter(new
    OutputStreamWriter(outputStream, StandardCharsets.UTF_8))) {\n            writer.println(\"id,name,email\");\n
    \           for (User user : users) {\n                writer.println(user.getId()
    + \",\" + user.getName() + \",\" + user.getEmail());\n            }\n        }\n
    \   }\n}\n```\n\n注册：\n\n```java\n@Configuration\npublic class WebMvcConfig implements
    WebMvcConfigurer {\n    @Override\n    public void extendMessageConverters(List<HttpMessageConverter<?>>
    converters) {\n        converters.add(new CsvHttpMessageConverter());\n    }\n}\n```\n\n现在
    @GetMapping(produces = \"text/csv\") 并返回 List<User> 就能输出 CSV 了。这就是消息转换器给框架带来的扩展自由度。"

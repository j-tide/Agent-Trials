answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（依赖倒置、事件驱动解耦、中间层抽取）\n\n1️⃣ Common Answer\n\nSpring Boot
    2.6 默认不允许循环依赖了。可以通过重构代码来解决，比如提取一个公共的 Bean，或者用事件机制。也可以设置配置允许循环依赖，但最好还是重构。\n\n2️⃣
    Impressive Answer\n\n- Spring Boot 2.6 的变化：spring.main.allow-circular-references
    默认从 true 改为 false，强制要求消除循环依赖，这是为了推动更健康的架构设计。\n\n- 重构方案一：提取中间层\n\n// 原始：A 依赖 B，B
    依赖 A\n// 重构：A 依赖 C，B 依赖 C\n@Service\npublic class SharedService {\n    // A 和
    B 的公共逻辑\n}\n\n适用于 A 和 B 有公共依赖的场景。\n\n- 重构方案二：事件驱动解耦\n\n@Service\npublic class
    AgentService {\n    @Autowired\n    private ApplicationEventPublisher eventPublisher;\n
    \       \n    public void executeAgent() {\n        // 执行逻辑\n        eventPublisher.publishEvent(new
    AgentCompletedEvent(data));\n    }\n}\n    \n@Service\npublic class ToolService
    {\n    @EventListener\n    public void handleAgentCompleted(AgentCompletedEvent
    event) {\n        // 响应事件，不直接依赖 AgentService\n    }\n}\n\n适用于异步场景，降低耦合。\n\n- 重构方案三：依赖倒置\n\npublic
    interface ToolExecutor {\n    void execute(ToolRequest request);\n}\n    \n@Service\npublic
    class AgentService {\n    private final ToolExecutor executor;  // 依赖接口\n}\n    \n@Service\npublic
    class ToolService implements ToolExecutor {\n    // 不依赖 AgentService\n}\n\n适用于需要双向协作但可以抽象接口的场景。\n\n-
    Agent 场景实战：AgentService 和 ToolService 互相依赖时，通过 ToolRegistry 中间层解耦，ToolService
    注册自己到 Registry，AgentService 从 Registry 获取工具，不直接依赖 ToolService。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

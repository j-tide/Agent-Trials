  reference_answer: "第一步：定义 @CurrentUser 注解\n\n```java\n@Target(ElementType.PARAMETER)\n@Retention(RetentionPolicy.RUNTIME)\npublic
    @interface CurrentUser {\n    // 可以增加属性，比如 required 表示是否必须登录\n}\n```\n\n第二步：实现参数解析器\n\n```java\n@Component\npublic
    class CurrentUserArgumentResolver implements HandlerMethodArgumentResolver {\n\n
    \   // 这里假定你有一个从 token 解析用户的服务\n    private final UserService userService;\n\n
    \   public CurrentUserArgumentResolver(UserService userService) {\n        this.userService
    = userService;\n    }\n\n    @Override\n    public boolean supportsParameter(MethodParameter
    parameter) {\n        // 参数类型是 User 并且带有 @CurrentUser 注解\n        return parameter.getParameterType().equals(User.class)\n
    \               && parameter.hasParameterAnnotation(CurrentUser.class);\n    }\n\n
    \   @Override\n    public Object resolveArgument(MethodParameter parameter, \n
    \                                 ModelAndViewContainer mavContainer,\n                                  NativeWebRequest
    webRequest, \n                                  WebDataBinderFactory binderFactory)
    throws Exception {\n        HttpServletRequest request = webRequest.getNativeRequest(HttpServletRequest.class);\n
    \       // 从请求中获取 token（例如 Header 或 Cookie）\n        String token = request.getHeader(\"Authorization\");\n
    \       if (token == null || token.isEmpty()) {\n            // 如果注解允许非必须，可返回
    null 或匿名用户\n            throw new AuthenticationException(\"未携带认证信息\");\n        }\n
    \       // 根据 token 获取用户，实际可调用已有安全框架\n        User user = userService.getUserFromToken(token);\n
    \       return user;\n    }\n}\n```\n\n第三步：注册到 Spring MVC\n\n```java\n@Configuration\npublic
    class WebMvcConfig implements WebMvcConfigurer {\n\n    private final CurrentUserArgumentResolver
    currentUserResolver;\n\n    public WebMvcConfig(CurrentUserArgumentResolver currentUserResolver)
    {\n        this.currentUserResolver = currentUserResolver;\n    }\n\n    @Override\n
    \   public void addArgumentResolvers(List<HandlerMethodArgumentResolver> resolvers)
    {\n        // 添加到最前面，优先处理\n        resolvers.add(0, currentUserResolver);\n    }\n}\n```\n\n使用效果\n\n```java\n@RestController\n@RequestMapping(\"/api/user\")\npublic
    class UserProfileController {\n\n    @GetMapping(\"/profile\")\n    public ResponseEntity<Profile>
    getProfile(@CurrentUser User currentUser) {\n        // 这里 currentUser 已经由解析器自动注入\n
    \       return ResponseEntity.ok(profileService.getProfile(currentUser.getId()));\n
    \   }\n}\n```"

  prompt: 2、进阶题：MyBatis 的连接池（PooledDataSource）工作原理是什么？如何调优连接池参数？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（连接池原理、参数调优、性能优化）

    1️⃣ Common Answer MyBatis 自带了连接池，可以复用数据库连接，避免频繁创建和销毁连接。可以配置最大连接数、初始连接数等参数。

    2️⃣ Impressive Answer

    - PooledDataSource 工作原理：内部维护 idleConnections（空闲连接池）和 activeConnections（活跃连接池），请求连接时先从空闲池获取，无空闲则创建新连接（不超过最大连接数）；连接释放时归还到空闲池，超过最大空闲数则关闭。


answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（HandlerMapping 类型、匹配顺序、路由策略）\n\n1️⃣ Common Answer\n\nHandlerMapping
    有好几种，RequestMappingHandlerMapping 用 @RequestMapping 注解，BeanNameUrlHandlerMapping
    用 Bean 名称。匹配顺序好像是按顺序来的，具体不太清楚。\n\n2️⃣ Impressive Answer\n\n我从 3 个维度分析：\n\n- HandlerMapping
    类型与优先级： Spring MVC 默认按以下顺序匹配：\n\n- RequestMappingHandlerMapping（最高优先级）：基于 @RequestMapping/@GetMapping
    等注解\n\n- BeanNameUrlHandlerMapping：基于 Bean 名称（/controller → beanName=\"/controller\"）\n\n-
    RouterFunctionMapping：Spring 5+ 的函数式路由\n\n- SimpleUrlHandlerMapping：基于 URL 映射配置\n\n匹配逻辑：遍历所有
    HandlerMapping，找到第一个返回非 null Handler 的即停止。\n\n- RequestMappingHandlerMapping vs
    BeanNameUrlHandlerMapping：\n\n[嵌入表格未展开]\n\n- Agent 场景：自定义 HandlerMapping 实现版本路由\n\n```text\n@Component\npublic
    class VersionedHandlerMapping extends RequestMappingHandlerMapping {\n    \n    @Override\n
    \   protected HandlerMethod getHandlerInternal(HttpServletRequest request) throws
    Exception {\n        String version = request.getHeader(\"X-Agent-Version\");\n
    \       if (version == null) {\n            version = \"v1\"; // 默认版本\n        }\n
    \       \n        // 根据版本路由到不同 Controller\n        String path = request.getRequestURI();\n
    \       if (path.startsWith(\"/api/agent/\")) {\n            path = path.replace(\"/api/agent/\",
    \"/api/agent/\" + version + \"/\");\n        }\n        \n        return super.getHandlerInternal(new
    VersionedRequestWrapper(request, path));\n    }\n}\n```\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

content:
  prompt: "\U0001F9E9 1. 什么是 Spring 的循环依赖？Spring 是如何解决的？"
answer:
  mode: rubric
  reference_answer: |-
    循环依赖，简单说就是两个或多个 Bean 互相持有对方的引用，形成一个闭环。比如 Bean A 的构造器或属性需要注入 Bean B，而 Bean B 的构造器或属性又需要注入 Bean A。

    [图片内容未导入]

    如果只是简单地用构造器注入互相依赖，容器会陷入“鸡生蛋、蛋生鸡”的死锁，最终抛出 BeanCurrentlyInCreationException。但 Spring 通过提前暴露尚未完全初始化的 Bean 引用，巧妙地解决了单例属性注入的循环依赖。它的核心秘密武器是三级缓存。

    解决过程大致分为三步：

    - 实例化（构造对象）：Spring 先通过反射（或工厂方法）调用构造器创建 Bean A 的原始对象，此时 A 的属性还没注入，是个“半成品”。

    - 提前暴露：把这个半成品的引用包装在一个 ObjectFactory 里，放入缓存（第三级缓存），供其他 Bean 提前引用。

    - 属性填充：然后 Spring 为 A 注入属性，发现 A 需要 B。于是它去创建 B。同样地，B 实例化后也会提前暴露自己，然后在填充 B 的属性时发现 B 需要 A。此时 Spring 从缓存中拿到 A 的半成品引用，注入给 B，完成 B 的初始化。最后再回到 A，把已经完全初始化的 B 注入给 A。

    这就像盖两栋互相依赖的楼：先给 A 楼搭一个脚手架（半成品），然后去建 B 楼，在 B 楼封顶前把 A 的脚手架架在 B 楼里，等 B 楼封顶后再回来把 A 楼盖好。整个过程依赖“半成品引用”这个缓冲，而保护这个缓冲的，正是 Spring 巧妙的三级缓存设计。


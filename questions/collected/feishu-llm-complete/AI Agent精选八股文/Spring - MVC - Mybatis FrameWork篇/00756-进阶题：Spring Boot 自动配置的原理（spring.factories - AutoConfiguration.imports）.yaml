content:
  prompt: 2、进阶题：Spring Boot 自动配置的原理（spring.factories / AutoConfiguration.imports）？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐⭐（自动配置机制、条件装配、EnableAutoConfiguration）\n\n1️⃣ Common
    Answer\n\nSpring Boot 启动时会加载 spring.factories 文件，里面配置了自动配置类，然后根据条件决定哪些 Bean 要创建。这样就不用手动配置了。\n\n2️⃣
    Impressive Answer\n\n- 自动配置原理：\n\n- spring.factories 示例（Spring Boot 2.7 之前）：\n\n#
    META-INF/spring.factories\norg.springframework.boot.autoconfigure.EnableAutoConfiguration=\\\ncom.example.agent.autoconfigure.AgentAutoConfiguration,\\\ncom.example.agent.autoconfigure.ToolAutoConfiguration\n\n-
    AutoConfiguration.imports 示例（Spring Boot 2.7+）：\n\n# META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports\ncom.example.agent.autoconfigure.AgentAutoConfiguration\ncom.example.agent.autoconfigure.ToolAutoConfiguration\n\n-
    自动配置类示例：\n\n@Configuration\n@ConditionalOnClass(AgentService.class)\n@ConditionalOnProperty(prefix
    = \"agent\", name = \"enabled\", havingValue = \"true\", matchIfMissing = true)\n@EnableConfigurationProperties(AgentProperties.class)\npublic
    class AgentAutoConfiguration {\n        \n    @Bean\n    @ConditionalOnMissingBean\n
    \   public AgentService agentService(AgentProperties properties) {\n        return
    new AgentService(properties);\n    }\n        \n    @Bean\n    @ConditionalOnProperty(prefix
    = \"agent.tools\", name = \"enabled\", havingValue = \"true\")\n    public ToolRegistry
    toolRegistry() {\n        return new DefaultToolRegistry();\n    }\n}\n\n- 调试自动配置：\n\n-
    Agent 场景实战：自定义 Agent Starter，通过自动配置让用户只需引入依赖和配置 agent.enabled=true，就能开箱即用 Agent
    功能。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

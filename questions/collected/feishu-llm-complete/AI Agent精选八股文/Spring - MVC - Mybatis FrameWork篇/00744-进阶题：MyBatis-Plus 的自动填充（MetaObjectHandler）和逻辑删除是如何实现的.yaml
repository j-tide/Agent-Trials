content:
  prompt: 2、进阶题：MyBatis-Plus 的自动填充（MetaObjectHandler）和逻辑删除是如何实现的？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（自动填充、逻辑删除、拦截器、Agent 场景）\n\n1️⃣ Common Answer 自动填充用 MetaObjectHandler，在插入和更新时自动填充字段。逻辑删除用
    @TableLogic，删除时改标记字段，不是真删除。\n\n2️⃣ Impressive Answer\n\n- 自动填充实现：\n\n```text\n@Component\npublic
    class MyMetaObjectHandler implements MetaObjectHandler {\n    @Override\n    public
    void insertFill(MetaObject metaObject) {\n        this.strictInsertFill(metaObject,
    \"createTime\", LocalDateTime.class, LocalDateTime.now());\n        this.strictInsertFill(metaObject,
    \"createBy\", String.class, getCurrentUserId());\n    }\n         \n    @Override\n
    \   public void updateFill(MetaObject metaObject) {\n        this.strictUpdateFill(metaObject,
    \"updateTime\", LocalDateTime.class, LocalDateTime.now());\n        this.strictUpdateFill(metaObject,
    \"updateBy\", String.class, getCurrentUserId());\n    }\n}\n```\n\n- 实体类字段添加 @TableField(fill
    = FieldFill.INSERT) 或 @TableField(fill = FieldFill.INSERT_UPDATE)，触发自动填充。\n\n-
    自动填充原理：\n\n- 逻辑删除实现：\n\n```text\n@TableLogic\nprivate Integer deleted;\n```\n\n-
    配置逻辑删除值和未删除值：\n\n```text\nmybatis-plus:\n  global-config:\n    db-config:\n      logic-delete-field:
    deleted\n      logic-delete-value: 1\n      logic-not-delete-value: 0\n```\n\n-
    删除操作自动转为 UPDATE：UPDATE user SET deleted = 1 WHERE id = ?；查询自动添加条件：WHERE deleted
    = 0。\n\n- Agent 场景实践：\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

content:
  prompt: 2、进阶题：singleton Bean 注入 prototype Bean 时，为什么每次拿到的不是新实例？如何解决？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（依赖注入时机、@Lookup、ObjectFactory、Provider）\n\n1️⃣ Common
    Answer\n\n因为 singleton Bean 只初始化一次，注入 prototype Bean 时也只注入了一次，所以每次拿到的都是同一个实例。可以用
    @Lookup 注解或者 ObjectFactory 来解决。\n\n2️⃣ Impressive Answer\n\n- 问题根源：\n\n@Service\npublic
    class SingletonService {\n    @Autowired\n    private PrototypeBean prototypeBean;
    \ // 只注入一次\n        \n    public void doSomething() {\n        prototypeBean.execute();
    \ // 每次都是同一个实例\n    }\n}\n\n- 解决方案： 方案 1：@Lookup 注解（推荐）\n\n@Service\npublic abstract
    class SingletonService {\n    public void doSomething() {\n        PrototypeBean
    prototypeBean = getPrototypeBean();  // 每次调用都创建新实例\n        prototypeBean.execute();\n
    \   }\n        \n    @Lookup\n    protected abstract PrototypeBean getPrototypeBean();\n}\n\n-
    \  **原理**：Spring 通过 CGLIB 动态代理子类，重写 `getPrototypeBean()` 方法，每次调用时从容器获取新实例。\n\n**方案
    2：ObjectFactory**\n\n@Service\npublic class SingletonService {\n    @Autowired\n
    \   private ObjectFactory<PrototypeBean> prototypeBeanFactory;\n        \n    public
    void doSomething() {\n        PrototypeBean prototypeBean = prototypeBeanFactory.getObject();
    \ // 每次获取新实例\n        prototypeBean.execute();\n    }\n}\n\n**方案 3：Provider（JSR-330）**\n\n@Service\npublic
    class SingletonService {\n    @Autowired\n    private Provider<PrototypeBean>
    prototypeBeanProvider;\n        \n    public void doSomething() {\n        PrototypeBean
    prototypeBean = prototypeBeanProvider.get();  // 每次获取新实例\n        prototypeBean.execute();\n
    \   }\n}\n\n**方案 4：ApplicationContext 直接获取（不推荐）**\n\n@Service\npublic class SingletonService
    {\n    @Autowired\n    private ApplicationContext applicationContext;\n        \n
    \   public void doSomething() {\n        PrototypeBean prototypeBean = applicationContext.getBean(PrototypeBean.class);\n
    \       prototypeBean.execute();\n    }\n}\n\n- 方案对比：\n\n[嵌入表格未展开]\n\n- 实践建议：优先使用
    @Lookup，代码最简洁；如果需要更灵活的控制（如缓存、条件获取），用 ObjectFactory。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

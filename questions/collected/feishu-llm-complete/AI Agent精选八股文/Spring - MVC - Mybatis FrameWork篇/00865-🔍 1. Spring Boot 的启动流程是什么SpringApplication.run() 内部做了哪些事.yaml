content:
  prompt: "\U0001F50D 1. Spring Boot 的启动流程是什么？SpringApplication.run() 内部做了哪些事？"
answer:
  mode: rubric
  reference_answer: "很多人以为 run() 只是“启动一个 Web 容器”，实际上它背后是一整套完备的启动生命周期，我们可以用一张“全景图”拆解成两个阶段：构造阶段
    和 运行阶段。\n\n1.1 构造阶段 —— new SpringApplication()\n\n- 推断应用类型：根据 classpath 下是否存在
    DispatcherServlet、Reactive 相关类，决定是 SERVLET、REACTIVE 还是 NONE。\n\n- 加载 ApplicationContextInitializer：通过
    SpringFactoriesLoader 从 spring.factories 中加载所有初始化器，用于在 Context 刷新前进行自定义配置。\n\n-
    加载 ApplicationListener：同样从 spring.factories 中加载事件监听器，后续各个启动阶段都会广播对应事件。\n\n1.2
    运行阶段 —— run(String... args) 的 10 个关键步骤\n\n```java\npublic ConfigurableApplicationContext
    run(String... args) {\n    // 1. 启动计时器\n    StopWatch stopWatch = new StopWatch();\n
    \   \n    // 2. 准备监听器并发布 ApplicationStartingEvent\n    SpringApplicationRunListeners
    listeners = getRunListeners(args);\n    listeners.starting();\n    \n    // 3.
    准备 Environment\n    ConfigurableEnvironment environment = prepareEnvironment(listeners,
    applicationArguments);\n    \n    // 4. 打印 Banner\n    Banner printedBanner =
    printBanner(environment);\n    \n    // 5. 创建 ApplicationContext（如 AnnotationConfigServletWebServerApplicationContext）\n
    \   context = createApplicationContext();\n    \n    // 6. 准备上下文：设置环境、执行 Initializer、加载启动类\n
    \   prepareContext(context, environment, listeners, applicationArguments, printedBanner);\n
    \   \n    // 7. 刷新上下文（核心）—— 执行 BeanFactoryPostProcessor、注册 Bean、启动内嵌容器\n    refreshContext(context);\n
    \   \n    // 8. afterRefresh（扩展点）\n    afterRefresh(context, applicationArguments);\n
    \   \n    // 9. 回调 ApplicationRunner / CommandLineRunner\n    callRunners(context,
    applicationArguments);\n    \n    // 10. 发布 ApplicationReadyEvent\n    listeners.started(context);\n}\n```\n\n\U0001F449
    细节强调：\n\n- 第 6 步 prepareContext 会把启动类（@SpringBootApplication 标注的类）注册为配置源。\n\n-
    第 7 步 refreshContext 真正触发了 Spring 的核心 refresh()，其中 onRefresh() 会调用 createWebServer()，嵌入式
    Tomcat 就在这里被创建并启动。\n\n- 任何异常都会触发 ApplicationFailedEvent，确保监听器能感知失败。\n\n---"

content:
  prompt: 1、基础题：Spring MVC 的静态资源缓存如何配置？ResourceHandler 的作用？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（静态资源、缓存配置）\n\nAnswer\n\n静态资源配置：\n\n```text\n@Configuration\npublic
    class WebConfig implements WebMvcConfigurer {\n    \n    @Override\n    public
    void addResourceHandlers(ResourceHandlerRegistry registry) {\n        registry.addResourceHandler(\"/static/**\")\n
    \           .addResourceLocations(\"classpath:/static/\")\n            .setCachePeriod(3600);
    // 缓存 1 小时\n    }\n}\n```\n\nResourceHandler 作用：\n\n- 映射 URL 路径到静态资源位置\n\n- 配置缓存策略\n\n-
    支持版本号控制（防止缓存问题）\n\n---"

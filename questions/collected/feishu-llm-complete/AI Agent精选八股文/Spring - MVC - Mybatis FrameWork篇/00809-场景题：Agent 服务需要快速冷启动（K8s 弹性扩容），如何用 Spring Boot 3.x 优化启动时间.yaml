content:
  prompt: 3、场景题：Agent 服务需要快速冷启动（K8s 弹性扩容），如何用 Spring Boot 3.x 优化启动时间？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（启动优化、懒加载、AOT、类路径扫描优化）

    1️⃣ Common Answer

    可以用 GraalVM 原生镜像，启动很快。也可以开启懒加载，减少启动时加载的 Bean 数量。

    2️⃣ Impressive Answer

    - 启动优化分层策略：

    ```text
    # 第一层：懒加载（最简单，效果明显）
    spring:
      main:
        lazy-initialization: true  # 所有 Bean 延迟到第一次使用时初始化
    ```

    - 第二层：减少类路径扫描范围：

    ```text
    @SpringBootApplication(scanBasePackages = "com.example.agent")
    // 精确指定扫描包，避免扫描整个类路径
    ```

    - 第三层：排除不需要的自动配置：

    ```text
    @SpringBootApplication(exclude = {
        DataSourceAutoConfiguration.class,    // 不用数据库
        SecurityAutoConfiguration.class,      // 不用 Security
        FlywayAutoConfiguration.class         // 不用数据库迁移
    })
    ```

    - 第四层：AOT + 原生镜像（终极方案）：

    ```text
    <!-- pom.xml -->
    <plugin>
        <groupId>org.graalvm.buildtools</groupId>
        <artifactId>native-maven-plugin</artifactId>
    </plugin>
    ```

    ```text
    # 构建原生镜像
    mvn -Pnative spring-boot:build-image

    # 启动时间从 5s → 100ms
    ```

    - 启动时间基准测试：

    - 懒加载的风险：懒加载会把配置错误推迟到运行时才暴露，建议在测试环境关闭懒加载，生产环境开启。

    3️⃣ Key Differences


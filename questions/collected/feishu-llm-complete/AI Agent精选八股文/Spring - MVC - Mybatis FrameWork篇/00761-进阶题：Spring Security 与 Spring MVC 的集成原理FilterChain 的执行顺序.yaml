content:
  prompt: 2、进阶题：Spring Security 与 Spring MVC 的集成原理？FilterChain 的执行顺序？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（DelegatingFilterProxy、SecurityFilterChain、FilterChainProxy、核心
    Filter）\n\n1️⃣ Common Answer\n\nSpring Security 是一组 Filter，通过 DelegatingFilterProxy
    桥接到 Spring 容器。FilterChainProxy 管理多个 SecurityFilterChain，根据 URL 匹配不同的安全策略。Security
    Filter 在 DispatcherServlet 之前执行，先鉴权再路由。\n\n2️⃣ Impressive Answer\n\n- 集成原理：\n\n-
    核心 Filter 执行顺序：\n\n```text\ngraph TD\n    A[请求] --> B[SecurityContextPersistenceFilter]\n
    \   B --> C[UsernamePasswordAuthenticationFilter]\n    C --> D[JwtAuthenticationFilter
    自定义]\n    D --> E[ExceptionTranslationFilter]\n    E --> F[FilterSecurityInterceptor]\n
    \   F --> G[DispatcherServlet]\n    G --> H[Controller]\n```\n\n- 和 Spring MVC
    的关系：\n\n- JWT 场景：自定义 JwtAuthenticationFilter 插入到 UsernamePasswordAuthenticationFilter
    之前：\n\n```text\npublic class JwtAuthenticationFilter extends OncePerRequestFilter
    {\n    @Override\n    protected void doFilterInternal(HttpServletRequest request,
    \n                                    HttpServletResponse response, \n                                    FilterChain
    filterChain) {\n        String token = extractToken(request);\n        if (token
    != null) {\n            Authentication auth = jwtService.parseToken(token);\n
    \           SecurityContextHolder.getContext().setAuthentication(auth);\n        }\n
    \       filterChain.doFilter(request, response);\n    }\n}\n\n@Configuration\npublic
    class SecurityConfig {\n    @Bean\n    public SecurityFilterChain filterChain(HttpSecurity
    http) {\n        http.addFilterBefore(jwtAuthenticationFilter(), \n                           UsernamePasswordAuthenticationFilter.class);\n
    \       // ...\n    }\n}\n```\n\n- Agent 场景：API Key 认证 + JWT Token 双重认证，不同接口不同安全策略：\n\n3️⃣
    Key Differences\n\n[嵌入表格未展开]\n\n---\n\n### DispatcherServlet 深度解析"

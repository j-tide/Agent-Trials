content:
  prompt: 3、场景题：如何在 Spring 容器完全启动后执行初始化逻辑？ApplicationRunner、CommandLineRunner、@EventListener(ContextRefreshedEvent)
    有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（容器启动后回调、执行顺序、参数差异、适用场景）

    1️⃣ Common Answer

    可以用 ApplicationRunner 或者 CommandLineRunner，它们都是在容器启动后执行的。@EventListener 也可以监听 ContextRefreshedEvent 事件，大概差不多。

    2️⃣ Impressive Answer

    - 三种方式的执行时机：都在容器启动完成后执行，但执行顺序和适用场景不同。

    - ApplicationRunner：

    @Component
    public class DataInitializer implements ApplicationRunner {
        @Override
        public void run(ApplicationArguments args) throws Exception {
            if (args.containsOption("init-data")) {
                // 执行数据初始化
            }
        }
    }

    - CommandLineRunner：

    @Component
    public class CacheInitializer implements CommandLineRunner {
        @Override
        public void run(String... args) throws Exception {
            // 预热缓存
        }
    }

    - @EventListener(ContextRefreshedEvent)：

    @Component
    public class SystemInitializer {
        @EventListener
        public void onContextRefreshed(ContextRefreshedEvent event) {
            if (event.getApplicationContext().getParent() == null) {
                // 只在根容器触发一次
            }
        }
    }

    - 执行顺序：@EventListener(ContextRefreshedEvent) → ApplicationRunner/CommandLineRunner（可通过 @Order 指定顺序）

    - 实践建议：优先使用 ApplicationRunner，参数更友好；如果需要监听父子容器事件，用 @EventListener。


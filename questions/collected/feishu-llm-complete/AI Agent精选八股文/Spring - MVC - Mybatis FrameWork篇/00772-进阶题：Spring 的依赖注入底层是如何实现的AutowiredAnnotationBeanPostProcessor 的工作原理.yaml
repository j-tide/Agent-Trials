content:
  prompt: 2、进阶题：Spring 的依赖注入底层是如何实现的？AutowiredAnnotationBeanPostProcessor 的工作原理？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（BeanPostProcessor、依赖解析、三级缓存）

    1️⃣ Common Answer

    依赖注入是通过 BeanPostProcessor 实现的。AutowiredAnnotationBeanPostProcessor 会扫描 Bean 的字段和方法，找到 @Autowired 注解，然后从容器中找到对应的 Bean 注入进去。如果找不到就报错。

    2️⃣ Impressive Answer

    - AutowiredAnnotationBeanPostProcessor 工作流程：

    - 依赖解析完整链路：

    AutowiredAnnotationBeanPostProcessor.postProcessProperties()
    → 遍历 InjectionMetadata 中的注入点
    → DependencyDescriptor.resolveDependency()
    → DefaultListableBeanFactory.doResolveDependency()
    → 根据类型查找候选 Bean（findAutowireCandidates）
    → 如果有多个候选，按 @Qualifier、@Primary、优先级排序
    → 从三级缓存获取/创建 Bean

    - 关键细节：

    - Agent 场景：LLM Provider 接口有多个实现（OpenAIProvider、ClaudeProvider、QwenProvider），通过 @Qualifier("openai") 或 @Primary 指定默认实现，避免 NoUniqueBeanDefinitionException。


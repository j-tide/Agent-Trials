answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（传播机制、事务隔离、嵌套事务）\n\n1️⃣ Common Answer\n\n传播机制有 REQUIRED、REQUIRESNEW、SUPPORTS、NOTSUPPORTED、MANDATORY、NEVER、NESTED。REQUIRED
    是加入当前事务，REQUIRES_NEW 是新建事务。\n\n2️⃣ Impressive Answer\n\n- 7 种传播机制：\n\n- REQUIRED
    vs REQUIRES_NEW：\n\n- 嵌套事务（NESTED）场景：\n\n@Transactional\npublic void outer() {\n
    \   try {\n        inner(); // 嵌套事务，失败只回滚 inner\n    } catch (Exception e) {\n
    \       // outer 可以继续执行\n    }\n}\n    \n@Transactional(propagation = Propagation.NESTED)\npublic
    void inner() {\n    // 失败回滚到 savepoint\n}\n\n- Agent 场景：\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

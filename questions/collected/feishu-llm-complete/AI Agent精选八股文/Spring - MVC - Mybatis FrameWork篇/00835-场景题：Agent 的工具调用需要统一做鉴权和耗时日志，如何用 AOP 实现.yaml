content:
  prompt: 4、场景题：Agent 的工具调用需要统一做鉴权和耗时日志，如何用 AOP 实现？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（自定义注解 + @Around、切点表达式、ProceedingJoinPoint、异常处理）

    1️⃣ Common Answer

    可以用 @Aspect 写一个切面，然后用 @Before 和 @After 分别做鉴权和日志。在切点那里写个表达式匹配工具调用的方法就行。鉴权失败就抛个异常。耗时的话用 System.currentTimeMillis 算一下。

    2️⃣ Impressive Answer

    - 定义标记注解：自定义 @ToolAuth(permission="xxx")，标注在需要鉴权的工具方法上，便于精确切入，不污染无关方法。

    - @Around 统一拦截：用 @Around("@annotation(toolAuth)") 匹配注解，在 ProceedingJoinPoint.proceed() 前后分别做鉴权和耗时统计；用 try-finally 确保耗时日志必然记录，不受异常影响。

    - 鉴权逻辑：proceed 前从上下文（ThreadLocal 或请求头）取 token，校验失败直接抛 AuthException，不执行工具；鉴权通过才放行。

    - 日志结构化：记录工具名（joinPoint.getSignature().getName()）、入参摘要、耗时、是否成功，便于后续 tracing 关联；生产上配合 MDC 注入 traceId。


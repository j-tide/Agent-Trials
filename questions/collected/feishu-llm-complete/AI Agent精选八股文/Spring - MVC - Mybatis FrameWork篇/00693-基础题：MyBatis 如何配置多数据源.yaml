content:
  prompt: 1、基础题：MyBatis 如何配置多数据源？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（多数据源配置、SqlSessionFactory 分离、Mapper 扫描）\n\n1️⃣ Common
    Answer 配置多个 DataSource，每个 DataSource 对应一个 SqlSessionFactory。用 @Qualifier 指定使用哪个数据源。Mapper
    分开扫描。\n\n2️⃣ Impressive Answer\n\n- 多数据源配置：在 Spring Boot 中配置多个 DataSource，分别创建
    SqlSessionFactory 和 SqlSessionTemplate：\n\n```text\n@Configuration\npublic class
    DataSourceConfig {\n    @Bean(name = \"primaryDataSource\")\n    @Primary\n    public
    DataSource primaryDataSource() {\n        return DataSourceBuilder.create().url(\"jdbc:mysql://primary-db\").build();\n
    \   }\n       \n    @Bean(name = \"secondaryDataSource\")\n    public DataSource
    secondaryDataSource() {\n        return DataSourceBuilder.create().url(\"jdbc:mysql://secondary-db\").build();\n
    \   }\n       \n    @Bean(name = \"primarySqlSessionFactory\")\n    @Primary\n
    \   public SqlSessionFactory primarySqlSessionFactory(@Qualifier(\"primaryDataSource\")
    DataSource dataSource) throws Exception {\n        SqlSessionFactoryBean factory
    = new SqlSessionFactoryBean();\n        factory.setDataSource(dataSource);\n        factory.setMapperLocations(new
    PathMatchingResourcePatternResolver().getResources(\"classpath:mapper/primary/*.xml\"));\n
    \       return factory.getObject();\n    }\n       \n    @Bean(name = \"secondarySqlSessionFactory\")\n
    \   public SqlSessionFactory secondarySqlSessionFactory(@Qualifier(\"secondaryDataSource\")
    DataSource dataSource) throws Exception {\n        SqlSessionFactoryBean factory
    = new SqlSessionFactoryBean();\n        factory.setDataSource(dataSource);\n        factory.setMapperLocations(new
    PathMatchingResourcePatternResolver().getResources(\"classpath:mapper/secondary/*.xml\"));\n
    \       return factory.getObject();\n    }\n}\n```\n\n- Mapper 扫描分离：使用 @MapperScan
    分别扫描不同数据源的 Mapper：\n\n```text\n@MapperScan(basePackages = \"com.example.primary.mapper\",
    sqlSessionFactoryRef = \"primarySqlSessionFactory\")\npublic class PrimaryMapperConfig
    {}\n   \n@MapperScan(basePackages = \"com.example.secondary.mapper\", sqlSessionFactoryRef
    = \"secondarySqlSessionFactory\")\npublic class SecondaryMapperConfig {}\n```\n\n-
    使用方式：在 Service 中注入对应的 Mapper，自动使用对应的数据源：\n\n```text\n@Service\npublic class AgentService
    {\n    @Autowired\n    private PrimaryUserMapper primaryUserMapper;\n    @Autowired\n
    \   private SecondaryVectorMapper secondaryVectorMapper;\n}\n```\n\n- 动态数据源：使用
    AbstractRoutingDataSource 实现动态切换数据源（进阶题详细讲解）。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

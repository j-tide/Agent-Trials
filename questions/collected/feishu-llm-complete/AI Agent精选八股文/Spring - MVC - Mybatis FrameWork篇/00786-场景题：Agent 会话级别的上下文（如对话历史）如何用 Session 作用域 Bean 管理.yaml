content:
  prompt: 3、场景题：Agent 会话级别的上下文（如对话历史）如何用 Session 作用域 Bean 管理？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（Session 作用域、会话管理、上下文隔离）\n\n1️⃣ Common Answer\n\n可以用
    Session 作用域 Bean 存储对话历史，每个用户的会话都有独立的上下文。这样不同用户的对话不会互相干扰。\n\n2️⃣ Impressive Answer\n\n-
    Session 作用域 Bean：\n\n@Component\n@Scope(value = WebApplicationContext.SCOPE_SESSION,
    proxyMode = ScopedProxyMode.TARGET_CLASS)\npublic class AgentSessionContext {\n
    \   private List<Message> conversationHistory = new ArrayList<>();\n    private
    String userId;\n    private Map<String, Object> metadata = new HashMap<>();\n
    \       \n    public void addMessage(Message message) {\n        conversationHistory.add(message);\n
    \   }\n        \n    public List<Message> getConversationHistory() {\n        return
    Collections.unmodifiableList(conversationHistory);\n    }\n        \n    // getters
    and setters\n}\n\n- 在 Service 中使用：\n\n@Service\npublic class AgentService {\n
    \   @Autowired\n    private AgentSessionContext sessionContext;  // 代理对象\n        \n
    \   public AgentResponse chat(AgentRequest request) {\n        // 每次请求都会从当前 Session
    获取对应的上下文\n        sessionContext.addMessage(new Message(\"user\", request.getContent()));\n
    \           \n        AgentResponse response = doChat(request);\n            \n
    \       sessionContext.addMessage(new Message(\"assistant\", response.getContent()));\n
    \       return response;\n    }\n}\n\n- 代理模式：\n\n- Session 销毁：\n\n@Component\n@Scope(value
    = WebApplicationContext.SCOPE_SESSION, proxyMode = ScopedProxyMode.TARGET_CLASS)\npublic
    class AgentSessionContext implements HttpSessionListener {\n        \n    @PreDestroy\n
    \   public void cleanup() {\n        // Session 销毁时清理资源\n        conversationHistory.clear();\n
    \   }\n}\n\n- Agent 场景实战：每个用户的 Agent 对话历史存储在 Session 作用域 Bean 中，不同用户的对话完全隔离，Session
    过期后自动清理上下文，避免内存泄漏。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

content:
  prompt: 1、基础题：MyBatis 中 SqlSession 的作用是什么？它和 SqlSessionFactory 的关系？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（SqlSession 作用、工厂模式、生命周期）

    1️⃣ Common Answer SqlSession 是 MyBatis 的核心接口，用于执行 SQL、获取 Mapper、管理事务。SqlSessionFactory 是工厂，用来创建 SqlSession。SqlSessionFactory 是单例的，SqlSession 每次用完要关闭。

    2️⃣ Impressive Answer

    - SqlSession 的作用：SqlSession 相当于 JDBC 的 Connection，封装了 Executor、StatementHandler、Transaction 等组件，提供 selectList()、insert()、update()、delete() 等方法执行 SQL，以及 getMapper() 获取 Mapper 代理对象，commit()/rollback() 管理事务。

    - SqlSessionFactory 的职责：SqlSessionFactory 是重量级对象，创建时加载配置文件（mybatis-config.xml）、Mapper XML，构建 Configuration 对象，内部维护 Executor、StatementHandler 等组件的工厂方法。生命周期：应用级别，全局单例，线程安全。

    - 关系与生命周期：SqlSessionFactory 创建 SqlSession，SqlSession 是轻量级对象，非线程安全，每次请求创建新实例，用完必须关闭（finally 块中调用 close()）。Spring 整合：Spring 管理 SqlSessionFactory（单例），SqlSession 由 SqlSessionTemplate 代理，自动管理生命周期。

    - 底层实现：SqlSession 默认实现是 DefaultSqlSession，内部持有 Configuration、Executor、Transaction；SqlSessionFactory 默认实现是 DefaultSqlSessionFactory，通过 openSession() 创建 SqlSession，可指定 Executor 类型（SIMPLE、REUSE、BATCH）。


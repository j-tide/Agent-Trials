content:
  prompt: 1、进阶题：Spring 如何解决循环依赖？三级缓存的作用分别是什么？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（三级缓存、singletonObjects、earlySingletonObjects、singletonFactories、提前暴露）

    1️⃣ Common Answer

    Spring 用三级缓存解决循环依赖。一级缓存 singletonObjects 存放完全初始化好的 Bean，二级缓存 earlySingletonObjects 存放半成品 Bean，三级缓存 singletonFactories 存放 ObjectFactory。当 A 依赖 B，B 又依赖 A 时，B 可以从三级缓存拿到 A 的早期引用。需要三级而不是两级是因为 AOP 代理需要延迟创建。

    2️⃣ Impressive Answer

    - 三级缓存的核心作用：

    - 循环依赖解决流程：A 创建时发现依赖 B → 暴露 A 的 ObjectFactory 到三级缓存 → B 创建时发现依赖 A → 从三级缓存获取 A 的 ObjectFactory → 生成 A 的早期引用（如果是 AOP 则生成代理）→ 放入二级缓存 → B 完成初始化 → A 完成初始化 → A 从二级缓存移到一级缓存。

    - 为什么需要三级而非两级：如果 A 需要被 AOP 代理，代理对象必须在实例化后、初始化前创建。三级缓存中的 ObjectFactory 延迟执行，只有真正发生循环依赖时才创建代理，避免无循环依赖时也创建代理的性能浪费。两级缓存无法做到这个延迟创建。

    - Prototype 无法解决：Prototype 作用域的 Bean 不缓存，每次都创建新实例，Spring 不解决其循环依赖，会直接抛异常。


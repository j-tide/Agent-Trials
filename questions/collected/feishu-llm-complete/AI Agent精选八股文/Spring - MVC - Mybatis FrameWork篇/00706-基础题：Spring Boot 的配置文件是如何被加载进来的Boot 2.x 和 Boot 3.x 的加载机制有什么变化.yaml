content:
  prompt: 1、基础题：Spring Boot 的配置文件是如何被加载进来的？Boot 2.x 和 Boot 3.x 的加载机制有什么变化？
answer:
  mode: rubric
  reference_answer: |-
    ⭐⭐（ConfigFileApplicationListener、ConfigDataEnvironmentPostProcessor、PropertySource 加载时机）

    Answer：

    Spring Boot 配置加载的核心机制经历了从 Boot 2.x 到 Boot 3.x 的重大重构，主要体现在从 ConfigFileApplicationListener 到 ConfigData API 的演进。

    Boot 2.x 机制：

    使用 ConfigFileApplicationListener 监听器，在 ApplicationContextInitializer 阶段加载配置：

    - 监听器触发：监听 ApplicationEnvironmentPreparedEvent 事件

    - 搜索配置文件：按优先级搜索 application.properties/yml，支持 file:./config/、file:./、classpath:/config/、classpath:/ 四个位置

    - PropertySource 加载：将解析后的配置添加到 Environment 的 PropertySource 链中

    - Profile 激活：根据 spring.profiles.active 激活特定 profile 的配置文件

    Boot 3.x 机制：

    引入全新的 ConfigData API，使用 ConfigDataEnvironmentPostProcessor 替代监听器模式：

    - EnvironmentPostProcessor 触发：在 Spring Boot 启动早期执行

    - ConfigData 接口：定义统一的配置数据抽象，支持多种配置源（文件、环境变量、云配置中心等）

    - ConfigDataLocationResolver：解析配置位置，返回 ConfigDataResource

    - ConfigDataLoader：加载具体的配置数据，转换为 PropertySource

    - Import 链：支持配置文件的嵌套导入（spring.config.import）


content:
  prompt: 2、进阶题：Spring MVC 异常处理的优先级链是什么？多个 @ControllerAdvice 的执行顺序如何控制？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（异常处理优先级、@Order、HandlerExceptionResolver）\n\n1️⃣ Common
    Answer\n\n异常处理会先找最近的 @ExceptionHandler，找不到再用 @ControllerAdvice。多个 @ControllerAdvice
    可以用 @Order 控制顺序。\n\n2️⃣ Impressive Answer\n\n- 异常处理优先级链：\n\nController 方法内的 @ExceptionHandler\n
    \   → Controller 类内的 @ExceptionHandler\n    → @ControllerAdvice 中的 @ExceptionHandler（按
    @Order 排序）\n    → HandlerExceptionResolver（自定义异常解析器）\n    → 默认异常处理（返回 500 错误）\n\n-
    @ControllerAdvice 的执行顺序：\n\n- 精确匹配优先：@ExceptionHandler 会优先匹配最具体的异常类型。例如：\n\n@ExceptionHandler({BusinessException.class,
    RuntimeException.class})\npublic ResponseEntity<ErrorResponse> handleBusinessException(BusinessException
    e) {\n    // 如果抛出 BusinessException，会进入这里\n    return ResponseEntity.badRequest().body(ErrorResponse.from(e));\n}\n
    \  \n@ExceptionHandler(Exception.class)\npublic ResponseEntity<ErrorResponse>
    handleException(Exception e) {\n    // 其他异常进入这里\n    return ResponseEntity.internalServerError().body(ErrorResponse.from(e));\n}\n\n-
    自定义 HandlerExceptionResolver：\n\n@Component\npublic class CustomExceptionResolver
    implements HandlerExceptionResolver {\n       \n    @Override\n    public ModelAndView
    resolveException(HttpServletRequest request, \n            HttpServletResponse
    response, Object handler, Exception ex) {\n        // 自定义异常处理逻辑\n        if (ex
    instanceof BusinessException) {\n            response.setStatus(400);\n            return
    new ModelAndView(new MappingJackson2JsonView(ErrorResponse.from(ex)));\n        }\n
    \       return null;  // 返回 null 表示不处理，交给下一个 Resolver\n    }\n}\n\n- 实践建议：\n\n3️⃣
    Key Differences\n\n[嵌入表格未展开]\n\n---"

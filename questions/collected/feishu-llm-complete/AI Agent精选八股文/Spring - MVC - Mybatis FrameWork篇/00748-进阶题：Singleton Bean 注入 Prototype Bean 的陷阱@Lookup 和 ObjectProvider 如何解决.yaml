content:
  prompt: 2、进阶题：Singleton Bean 注入 Prototype Bean 的陷阱？@Lookup 和 ObjectProvider 如何解决？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐⭐（作用域代理、依赖注入陷阱、解决方案）\n\n1️⃣ Common Answer\n\nSingleton
    Bean 注入 Prototype Bean 时，Prototype Bean 只会创建一次，因为 Singleton Bean 只初始化一次。可以用 @Lookup
    注解或者 ObjectProvider 来解决。\n\n2️⃣ Impressive Answer\n\n- 陷阱：\n\n@Component\n@Scope(\"singleton\")\npublic
    class AgentService {\n    @Autowired\n    private ToolRequest toolRequest;  //
    Prototype Bean\n        \n    public void execute() {\n        // 每次都是同一个 toolRequest
    实例，不是新的！\n    }\n}\n\n- Singleton Bean 只初始化一次，注入的 Prototype Bean 也只创建一次。\n- 后续使用
    `toolRequest` 时，仍然是同一个实例，违背了 Prototype 的设计意图。\n\n- 解决方案一：@Lookup 注解：\n\n@Component\n@Scope(\"singleton\")\npublic
    abstract class AgentService {\n        \n    public void execute() {\n        ToolRequest
    toolRequest = getToolRequest();  // 每次调用都返回新实例\n    }\n        \n    @Lookup\n
    \   protected abstract ToolRequest getToolRequest();  // Spring 会生成子类实现\n}\n\n-
    Spring 会生成 CGLIB 子类，覆盖 `getToolRequest()` 方法，每次调用都从容器获取新实例。\n\n- 解决方案二：ObjectProvider：\n\n@Component\n@Scope(\"singleton\")\npublic
    class AgentService {\n    @Autowired\n    private ObjectProvider<ToolRequest>
    toolRequestProvider;\n        \n    public void execute() {\n        ToolRequest
    toolRequest = toolRequestProvider.getObject();  // 每次获取新实例\n    }\n}\n\n- `ObjectProvider`
    是延迟获取 Bean 的工具，每次调用 `getObject()` 都会从容器获取新实例。\n\n- 解决方案三：@Scope 代理：\n\n@Component\n@Scope(value
    = ConfigurableBeanFactory.SCOPE_PROTOTYPE, proxyMode = ScopedProxyMode.TARGET_CLASS)\npublic
    class ToolRequest {\n}\n\n- Spring 会生成代理对象，每次调用代理对象的方法时，都会从容器获取新的目标对象。\n\n- Agent
    场景实战：AgentService 是 Singleton，每次调用工具时需要新的 ToolRequest（Prototype），使用 ObjectProvider<ToolRequest>
    动态获取新实例。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

content:
  prompt: 4、进阶题：Spring 事务的底层实现原理？TransactionManager 和 TransactionSynchronizationManager
    的作用？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（PlatformTransactionManager、ThreadLocal 绑定连接、事务同步回调）

    1️⃣ Common Answer

    Spring 事务底层是通过 TransactionManager 来管理的，它负责开启、提交和回滚事务。具体实现有 DataSourceTransactionManager 和 JpaTransactionManager。事务信息是通过 ThreadLocal 绑定到当前线程的。

    2️⃣ Impressive Answer

    - PlatformTransactionManager 三板斧：getTransaction()（获取/创建事务）、commit()、rollback()。DataSourceTransactionManager 实现中，getTransaction() 从 DataSource 获取 Connection 并设置 autoCommit=false，然后将 Connection 绑定到 ThreadLocal。

    - TransactionSynchronizationManager 的核心作用：通过 ThreadLocal 维护当前线程的事务资源（Connection、Session 等）和同步回调。@Transactional 方法内所有 DAO 操作通过 DataSourceUtils.getConnection() 获取的都是同一个 Connection，这就是事务生效的根本原因。

    - 事务同步回调：TransactionSynchronization 接口提供 beforeCommit()、afterCommit()、afterCompletion() 等钩子。典型应用：事务提交后发消息（避免事务未提交就发消息导致消费者查不到数据）。

    TransactionSynchronizationManager.registerSynchronization(
      new TransactionSynchronization() {
        @Override
        public void afterCommit() {
            messageProducer.send(event);  // 事务提交后才发消息
        }
    });

    - 声明式事务的 AOP 实现：TransactionInterceptor（MethodInterceptor）拦截 @Transactional 方法，调用 TransactionManager 管理事务生命周期，本质是 AOP + 模板方法模式。


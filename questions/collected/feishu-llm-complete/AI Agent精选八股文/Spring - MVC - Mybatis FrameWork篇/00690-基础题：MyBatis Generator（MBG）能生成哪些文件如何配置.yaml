content:
  prompt: 1、基础题：MyBatis Generator（MBG）能生成哪些文件？如何配置？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（代码生成、配置文件、生成内容）

    1️⃣ Common Answer MBG 可以生成 Mapper 接口、Mapper XML、实体类。配置一个 generatorConfig.xml 文件，指定数据库连接、要生成的表，然后运行 MBG 就能生成代码。

    2️⃣ Impressive Answer

    - MBG 生成内容：

    - 配置文件 generatorConfig.xml：

    ```text
    <generatorConfiguration>
      <context id="mysql" targetRuntime="MyBatis3">
        <jdbcConnection driverClass="com.mysql.cj.jdbc.Driver"
                        connectionURL="jdbc:mysql://localhost:3306/agent_db"
                        userId="root" password="password"/>
        <javaModelGenerator targetPackage="com.example.model" targetProject="src/main/java"/>
        <sqlMapGenerator targetPackage="mapper" targetProject="src/main/resources"/>
        <javaClientGenerator type="XMLMAPPER" targetPackage="com.example.mapper" targetProject="src/main/java"/>
        <table tableName="tool_call" domainObjectName="ToolCall"/>
      </context>
    </generatorConfiguration>
    ```

    - 运行方式：

    - 生成策略：<table schema="agent_db" tableName="tool_call" domainObjectName="ToolCall" enableCountByExample="false" enableUpdateByExample="false" enableDeleteByExample="false" enableSelectByExample="false" selectByExampleQueryId="false"/> 禁用 Example 类，只生成基础 CRUD。


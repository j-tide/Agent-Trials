content:
  prompt: 2、进阶题：MyBatis 的 SQL 执行流程是什么？从 sqlSession.selectList() 到 JDBC 的完整链路？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（执行链路、组件协作、JDBC 封装）

    1️⃣ Common Answer SqlSession 调用 selectList，然后 Executor 执行 SQL，StatementHandler 处理 JDBC，最后返回结果。中间还有 ParameterHandler 和 ResultSetHandler 处理参数和结果。

    2️⃣ Impressive Answer

    - SqlSession.selectList()：调用 Configuration.getMappedStatement() 获取 MappedStatement（包含 SQL、参数映射、结果映射），然后调用 executor.query()。

    - Executor.query()：BaseExecutor 先查一级缓存（localCache），命中直接返回；未命中则调用 doQuery()。二级缓存：CachingExecutor 先查二级缓存，未命中再查一级缓存，最后查数据库。

    - StatementHandler.prepare()：创建 JDBC Statement（PreparedStatement），调用 ParameterHandler.setParameters() 设置参数（处理 #{} 占位符），然后 StatementHandler.query() 执行 SQL。

    - ResultSetHandler.handleResultSets()：处理 JDBC ResultSet，根据 ResultMap 映射结果对象，支持嵌套结果、延迟加载。返回结果：List<Object>，SqlSession 返回给调用方。

    - 完整链路：SqlSession → Executor → StatementHandler → ParameterHandler → JDBC Statement → ResultSet → ResultSetHandler → Result Object。


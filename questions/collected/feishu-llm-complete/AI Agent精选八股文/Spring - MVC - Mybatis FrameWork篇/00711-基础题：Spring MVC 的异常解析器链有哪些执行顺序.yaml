content:
  prompt: 1、基础题：Spring MVC 的异常解析器链有哪些？执行顺序？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（异常解析器、执行顺序）

    Answer

    Spring MVC 异常解析器链（按执行顺序）：

    - ExceptionHandlerExceptionResolver：处理 @ExceptionHandler 注解的方法

    - ResponseStatusExceptionResolver：处理 @ResponseStatus 注解

    - DefaultHandlerExceptionResolver：处理 Spring MVC 内置异常

    - 自定义 HandlerExceptionResolver：自定义异常解析器

    执行顺序：

    ```text
    异常发生
      → ExceptionHandlerExceptionResolver
      → ResponseStatusExceptionResolver
      → DefaultHandlerExceptionResolver
      → 自定义 HandlerExceptionResolver
      → 如果都未处理，抛出给 Servlet 容器
    ```


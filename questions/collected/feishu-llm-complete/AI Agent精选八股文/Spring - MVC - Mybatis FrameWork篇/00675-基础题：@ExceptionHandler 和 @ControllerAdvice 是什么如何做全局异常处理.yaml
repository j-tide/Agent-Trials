content:
  prompt: 1、基础题：@ExceptionHandler 和 @ControllerAdvice 是什么？如何做全局异常处理？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（异常处理、统一响应格式）\n\nAnswer\n\n- @ExceptionHandler：用于处理 Controller
    方法抛出的特定异常，可以返回自定义的响应。\n\n- @ControllerAdvice：全局异常处理注解，标注在类上，该类中的 @ExceptionHandler
    方法会应用到所有 Controller。\n\n- 全局异常处理示例：\n\n@ControllerAdvice\npublic class GlobalExceptionHandler
    {\n       \n    @ExceptionHandler(Exception.class)\n    @ResponseBody\n    public
    ResponseEntity<ErrorResponse> handleException(Exception e) {\n        ErrorResponse
    error = ErrorResponse.builder()\n            .code(500)\n            .message(\"Internal
    Server Error\")\n            .build();\n        return ResponseEntity.status(500).body(error);\n
    \   }\n}\n\n---"

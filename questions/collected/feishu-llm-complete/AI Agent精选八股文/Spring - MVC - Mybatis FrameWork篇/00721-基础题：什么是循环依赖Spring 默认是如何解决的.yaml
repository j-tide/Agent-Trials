  prompt: 1、基础题：什么是循环依赖？Spring 默认是如何解决的？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐（循环依赖定义、setter注入可解决、构造器注入无法解决）

    Answer

    - 循环依赖定义：A 依赖 B，B 又依赖 A（或者 A→B→C→A），形成闭环。

    - Spring 默认解决策略：

    - 解决原理：在创建 Bean 时，先将半成品的 Bean（属性未注入）暴露出去，让其他 Bean 可以引用，等所有 Bean 创建完成后再注入属性。


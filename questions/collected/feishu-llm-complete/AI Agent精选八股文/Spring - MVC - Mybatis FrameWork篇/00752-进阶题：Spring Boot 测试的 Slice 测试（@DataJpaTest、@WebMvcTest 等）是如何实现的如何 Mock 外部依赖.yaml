content:
  prompt: 2、进阶题：Spring Boot 测试的 Slice 测试（@DataJpaTest、@WebMvcTest 等）是如何实现的？如何 Mock
    外部依赖？
answer:
  mode: rubric
  reference_answer: "1️⃣ Common Answer\n\nSlice 测试就是只加载一部分 Bean，不加载整个容器。Mock 外部依赖用
    @MockBean 注解，然后用 when().thenReturn() 模拟返回值。\n\n2️⃣ Impressive Answer\n\n- Slice
    测试实现原理：\n\n- @MockBean 工作机制：\n\n- Mock 外部依赖示例：\n\n```text\n@WebMvcTest(AgentController.class)\npublic
    class AgentControllerTest {\n    @MockBean\n    private AgentService agentService;\n
    \       \n    @MockBean\n    private LLMProvider llmProvider;  // Mock 外部 LLM
    服务\n        \n    @Test\n    public void testExecuteTool() {\n        // Mock
    Service 层\n        when(agentService.executeTool(any()))\n            .thenReturn(ToolResult.success(\"result\"));\n
    \           \n        // Mock 外部 LLM 服务\n        when(llmProvider.chat(anyString(),
    anyString()))\n            .thenReturn(\"AI response\");\n    }\n}\n```\n\n- @SpyBean
    vs @MockBean：\n\n- Mock 静态方法（Mockito 3.4+）：\n\n```text\n@Test\npublic void testStaticMethod()
    {\n    try (MockedStatic<UUID> mocked = mockStatic(UUID.class)) {\n        mocked.when(UUID::randomUUID).thenReturn(uuid);\n
    \       // 测试代码\n    }\n}\n```\n\n3️⃣ Key Differences\n\n---"

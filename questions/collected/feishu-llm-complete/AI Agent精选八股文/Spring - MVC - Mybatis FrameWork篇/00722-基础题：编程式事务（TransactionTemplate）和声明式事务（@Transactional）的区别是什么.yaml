    难度级别：⭐⭐（事务管理、编程式 vs 声明式）

    Answer

    - 编程式事务（TransactionTemplate）：在代码中显式管理事务，使用 TransactionTemplate.execute() 包裹事务代码。

    - 声明式事务（@Transactional）：通过注解声明事务，Spring AOP 自动管理事务，代码更简洁。


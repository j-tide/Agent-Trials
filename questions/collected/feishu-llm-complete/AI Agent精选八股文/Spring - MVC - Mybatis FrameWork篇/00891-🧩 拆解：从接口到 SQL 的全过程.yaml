content:
  prompt: "\U0001F9E9 拆解：从接口到 SQL 的全过程"
answer:
  mode: rubric
  reference_answer: |-
    ① 启动时：解析 XML / 注解，建立映射关系
    MyBatis 启动时会解析每个 mapper.xml 或 Mapper 接口上的注解，把每个 SQL 语句封装成一个 MappedStatement 对象，并以 “接口全限定名 + 方法名” 作为唯一标识（namespace.id）存入全局 Configuration 中。

    ② 获取 Mapper 对象：SqlSession.getMapper()
    当你调用 sqlSession.getMapper(UserMapper.class) 时，MyBatis 会调用 MapperRegistry 获取或创建一个代理实例。核心代码：

    ```java
    // 简化版 MapperProxyFactory
    public T newInstance(SqlSession sqlSession) {
        final MapperProxy<T> mapperProxy = new MapperProxy<>(sqlSession, mapperInterface, methodCache);
        return (T) Proxy.newProxyInstance(mapperInterface.getClassLoader(), new Class[]{mapperInterface}, mapperProxy);
    }
    ```

    ③ 方法调用：被 MapperProxy.invoke() 拦截
    每次调用 userMapper.getUser(1) 时，会被代理对象的 invoke 方法拦截。它会根据当前方法找到对应的 MappedStatement，然后判断方法返回类型和 SQL 类型（SELECT/INSERT/UPDATE/DELETE），最终委托给 SqlSession 执行。

    ④ 真正执行 SQL
    SqlSession 会通过 Executor 执行器，经过缓存、插件拦截等，最终通过 JDBC 的 PreparedStatement 执行 SQL，并把结果集转换为方法返回值类型（List、对象等）。

content:
  prompt: 3、场景题：Agent 的 LLM 配置（模型名、temperature、API Key）如何用配置中心动态热更新？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（配置中心、动态刷新、@RefreshScope）\n\n1️⃣ Common Answer\n\n把 LLM
    配配置放到配置中心，用 @RefreshScope 注解配置类，配置变更后调用 /actuator/refresh 端点就能热更新。\n\n2️⃣ Impressive
    Answer\n\n- 配置类定义：\n\n@RefreshScope  // 动态刷新\n@ConfigurationProperties(prefix
    = \"agent.llm\")\n@Component\n@Validated\npublic class LLmProperties {\n    @NotBlank\n
    \   private String provider = \"openai\";\n        \n    @NotBlank\n    private
    String apiKey;\n        \n    @Min(0) @Max(2)\n    private double temperature
    = 0.7;\n        \n    private int maxTokens = 2048;\n        \n    private Map<String,
    String> customParams = new HashMap<>();\n        \n    // getters and setters\n}\n\n-
    使用配置：\n\n@Service\npublic class LLMService {\n    @Autowired\n    private LLMProperties
    llmProperties;  // 代理对象\n        \n    public String chat(String prompt) {\n        //
    每次调用都会从代理获取最新配置\n        return llmProperties.getProvider().equals(\"openai\")
    \n            ? callOpenAI(prompt) \n            : callClaude(prompt);\n    }\n}\n\n-
    Nacos 配置中心集成：\n\n# bootstrap.yml\nspring:\n  application:\n    name: agent-service\n
    \ cloud:\n    nacos:\n      config:\n        server-addr: 127.0.0.1:8848\n        namespace:
    dev\n        group: AGENT_GROUP\n        data-id: agent-service.yaml\n        auto-refresh:
    true  # 自动刷新\n        file-extension: yaml\n\n# Nacos 配置：agent-service.yaml\nagent:\n
    \ llm:\n    provider: openai\n    api-key: sk-xxx\n    temperature: 0.7\n    max-tokens:
    2048\n\n- 手动刷新：\n\n# 调用刷新端点\ncurl -X POST http://localhost:8080/actuator/refresh\n\n-
    监听配置变更：\n\n@Component\npublic class ConfigChangeListener {\n        \n    @EventListener\n
    \   public void onRefreshScopeRefreshed(RefreshScopeRefreshedEvent event) {\n
    \       log.info(\"Configuration refreshed: {}\", event.getName());\n        //
    可以在这里做额外的处理，比如重新初始化连接池\n    }\n}\n\n- Agent 场景实战：Agent 服务部署到生产环境后，通过 Nacos 配置中心动态调整
    LLM 的 temperature 和 maxTokens，优化回答质量，无需重启服务，实现零停机配置更新。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

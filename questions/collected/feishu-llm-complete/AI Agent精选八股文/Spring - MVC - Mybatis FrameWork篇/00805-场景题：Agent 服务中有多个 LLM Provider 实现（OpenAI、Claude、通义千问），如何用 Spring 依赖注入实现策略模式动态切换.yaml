content:
  prompt: 3、场景题：Agent 服务中有多个 LLM Provider 实现（OpenAI、Claude、通义千问），如何用 Spring 依赖注入实现策略模式动态切换？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（策略模式、@Conditional、动态切换、配置驱动）\n\n1️⃣ Common Answer\n\n可以定义一个
    LLMProvider 接口，然后每个厂商实现这个接口。用一个配置文件指定用哪个 Provider，然后在代码里根据配置注入对应的实现。或者用 @Qualifier
    注解指定。\n\n2️⃣ Impressive Answer\n\n- 策略模式设计：\n\n// 统一接口\npublic interface LLMProvider
    {\n    String chat(String prompt, String model);\n}\n    \n// 多个实现\n@Service(\"openai\")\npublic
    class OpenAIProvider implements LLMProvider { ... }\n    \n@Service(\"claude\")\npublic
    class ClaudeProvider implements LLMProvider { ... }\n    \n@Service(\"qwen\")\npublic
    class QwenProvider implements LLMProvider { ... }\n\n- 动态切换方案一：Map 注入（推荐）\n\n@Service\npublic
    class AgentService {\n    private final Map<String, LLMProvider> providerMap;\n
    \       \n    @Autowired\n    public AgentService(Map<String, LLMProvider> providerMap)
    {\n        this.providerMap = providerMap; // 自动注入所有实现，key = bean name\n    }\n
    \       \n    public String execute(String prompt, String providerName) {\n        LLMProvider
    provider = providerMap.get(providerName);\n        if (provider == null) {\n            throw
    new IllegalArgumentException(\"Provider not found: \" + providerName);\n        }\n
    \       return provider.chat(prompt, getModel(providerName));\n    }\n}\n\n- 动态切换方案二：配置驱动
    + @Conditional\n\nagent:\n  llm:\n    provider: openai  # 动态切换\n\n@Configuration\npublic
    class LLMConfig {\n    @Bean\n    @ConditionalOnProperty(name = \"agent.llm.provider\",
    havingValue = \"openai\")\n    public LLMProvider openaiProvider() { return new
    OpenAIProvider(); }\n        \n    @Bean\n    @ConditionalOnProperty(name = \"agent.llm.provider\",
    havingValue = \"claude\")\n    public LLMProvider claudeProvider() { return new
    ClaudeProvider(); }\n}\n\n- 多租户场景：不同租户使用不同 Provider，通过 ThreadLocal + Map 实现：\n\n@Service\npublic
    class TenantLLMProvider {\n    private final Map<String, LLMProvider> providerMap;\n
    \       \n    public String chat(String prompt) {\n        String tenantId = TenantContext.getTenantId();\n
    \       String providerName = tenantConfigService.getProvider(tenantId);\n        return
    providerMap.get(providerName).chat(prompt);\n    }\n}\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

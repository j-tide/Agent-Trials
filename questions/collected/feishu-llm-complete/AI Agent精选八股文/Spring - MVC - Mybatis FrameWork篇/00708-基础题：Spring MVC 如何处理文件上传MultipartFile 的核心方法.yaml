content:
  prompt: 1、基础题：Spring MVC 如何处理文件上传？MultipartFile 的核心方法？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（文件上传、MultipartFile）\n\nAnswer\n\n文件上传配置：\n\n```text\n@Configuration\npublic
    class WebConfig implements WebMvcConfigurer {\n    \n    @Bean\n    public MultipartResolver
    multipartResolver() {\n        CommonsMultipartResolver resolver = new CommonsMultipartResolver();\n
    \       resolver.setMaxUploadSize(10 * 1024 * 1024); // 10MB\n        resolver.setMaxInMemorySize(1024
    * 1024); // 1MB\n        resolver.setDefaultEncoding(\"UTF-8\");\n        return
    resolver;\n    }\n}\n```\n\nMultipartFile 核心方法：\n\n```text\n@RestController\n@RequestMapping(\"/api/file\")\npublic
    class FileUploadController {\n    \n    @PostMapping(\"/upload\")\n    public
    String upload(@RequestParam(\"file\") MultipartFile file) throws IOException {\n
    \       // 获取文件名\n        String originalFilename = file.getOriginalFilename();\n
    \       \n        // 获取文件类型\n        String contentType = file.getContentType();\n
    \       \n        // 获取文件大小\n        long size = file.getSize();\n        \n        //
    获取文件字节数组\n        byte[] bytes = file.getBytes();\n        \n        // 获取输入流\n
    \       InputStream inputStream = file.getInputStream();\n        \n        //
    保存文件\n        File dest = new File(\"/tmp/\" + originalFilename);\n        file.transferTo(dest);\n
    \       \n        return \"Upload success: \" + originalFilename;\n    }\n}\n```\n\n---"

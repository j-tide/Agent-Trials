  prompt: 2、进阶题：PropertySource 的加载优先级？如何实现配置动态刷新（@RefreshScope）？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐⭐（配置优先级、动态刷新、Scope 代理）\n\n1️⃣ Common Answer\n\nPropertySource
    的优先级是命令行参数 > 环境变量 > 配置文件。@RefreshScope 可以让配置动态刷新，不用重启应用。\n\n2️⃣ Impressive Answer\n\n-
    PropertySource 加载优先级（从高到低）：\n\n- @RefreshScope 动态刷新：\n\n@RefreshScope  // 配置变更时刷新
    Bean\n@ConfigurationProperties(prefix = \"agent\")\n@Component\npublic class AgentProperties
    {\n    private String apiKey;\n    private double temperature;\n        \n    //
    getters and setters\n}\n\n- 原理：`@RefreshScope` 基于 `GenericScope`，Bean 是代理对象，配置变更时销毁旧
    Bean，创建新 Bean。\n- 触发：通过 `/actuator/refresh` 端点或配置中心（如 Nacos、Apollo）推送变更。\n\n-
    配置中心集成：\n\n@Configuration\n@EnableDiscoveryClient\npublic class ConfigClientConfig
    {\n    // Nacos 配置中心\n}\n\n# bootstrap.yml\nspring:\n  cloud:\n    nacos:\n      config:\n
    \       server-addr: ${NACOS_SERVER}\n        namespace: ${NAMESPACE}\n        group:
    ${GROUP}\n        data-id: agent-config.yaml\n        auto-refresh: true  # 自动刷新\n\n-
    动态刷新限制：\n\n- Agent 场景实战：Agent 的 LLM 配置（模型名、temperature、API Key）通过 Nacos 配置中心管理，使用
    @RefreshScope 实现动态热更新，无需重启服务。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

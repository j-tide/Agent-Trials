answer:
  mode: rubric
  reference_answer: |-
    ```java
    请求 → DispatcherServlet
               ↓
      查找 HandlerMethod
               ↓
      获取参数列表，对每个参数遍历所有 HandlerMethodArgumentResolver
               ↓
      遇到 @CurrentUser + User 类型 → CurrentUserArgumentResolver.supportsParameter() 返回 true
               ↓
      resolveArgument() 执行 → 从 Header/Token 获取用户 → 返回 User 对象
               ↓
      所有参数解析完毕 → 调用 Controller 方法
    ```

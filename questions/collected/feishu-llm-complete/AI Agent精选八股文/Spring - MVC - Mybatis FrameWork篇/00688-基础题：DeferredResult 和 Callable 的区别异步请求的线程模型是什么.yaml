content:
  prompt: 1、基础题：DeferredResult 和 Callable 的区别？异步请求的线程模型是什么？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（异步处理、线程模型）\n\nAnswer\n\nDeferredResult vs Callable：\n\n-
    Callable：简单异步，返回 Callable<T>，Spring 自动在独立线程执行\n\n- DeferredResult：灵活异步，手动设置结果，支持回调、超时、错误处理\n\n异步请求的线程模型：\n\n```text\nTomcat
    线程（IO 线程）\n  ↓ 接收请求，释放线程\n  ↓\n任务线程（业务线程池）\n  ↓ 执行耗时任务\n  ↓\nTomcat 线程（复用）\n  ↓
    写回响应\n```\n\n示例：\n\n```text\n// Callable 方式\n@GetMapping(\"/async/callable\")\npublic
    Callable<String> asyncCallable() {\n    return () -> {\n        Thread.sleep(3000);
    // 耗时任务\n        return \"Hello from Callable\";\n    };\n}\n\n// DeferredResult
    方式\n@GetMapping(\"/async/deferred\")\npublic DeferredResult<String> asyncDeferred()
    {\n    DeferredResult<String> result = new DeferredResult<>(5000L); // 5秒超时\n
    \   \n    // 在另一个线程设置结果\n    new Thread(() -> {\n        try {\n            Thread.sleep(3000);\n
    \           result.setResult(\"Hello from DeferredResult\");\n        } catch
    (Exception e) {\n            result.setErrorResult(e);\n        }\n    }).start();\n
    \   \n    return result;\n}\n```\n\n---"

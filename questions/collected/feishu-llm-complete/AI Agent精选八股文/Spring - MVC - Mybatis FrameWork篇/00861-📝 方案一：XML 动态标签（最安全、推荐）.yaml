content:
  prompt: "\U0001F4DD 方案一：XML 动态标签（最安全、推荐）"
answer:
  mode: rubric
  reference_answer: |-
    利用 <if>, <where>, <foreach> 等标签，把运行时条件映射为参数。

    示例：根据多个可选条件查询用户

    ```xml
    <select id="queryUsers" resultType="User">
        SELECT * FROM users
        <where>
            <if test="name != null and name != ''">
                AND name LIKE CONCAT('%', #{name}, '%')
            </if>
            <if test="minAmount != null">
                AND total_amount >= #{minAmount}
            </if>
            <if test="vip != null and vip == true">
                AND is_vip = 1
            </if>
        </where>
        <if test="orderBy != null">
            ORDER BY ${orderBy}   <!-- 这里必须白名单校验 -->
        </if>
    </select>
    ```

    对应的 Mapper 接口：

    ```java
    List<User> queryUsers(@Param("name") String name,
                          @Param("minAmount") BigDecimal minAmount,
                          @Param("vip") Boolean vip,
                          @Param("orderBy") String orderBy);
    ```

    对于 orderBy 这种必须用 ${} 的地方，要在服务层做白名单过滤：

    ```java
    private static final Set<String> ALLOWED_COLUMNS = Set.of("id", "name", "create_time", "total_amount");

    public List<User> safeQuery(String name, BigDecimal minAmount, Boolean vip, String orderBy) {
        if (orderBy != null && !ALLOWED_COLUMNS.contains(orderBy)) {
            throw new IllegalArgumentException("Invalid column: " + orderBy);
        }
        return mapper.queryUsers(name, minAmount, vip, orderBy);
    }
    ```

  reference_answer: |-
    - Agent 流式输出，毫无疑问首选 SSE。它更简单、省资源，还能享受 HTTP/2 的多路复用。

    - 如果是需要“用户实时操作 → Agent 立即响应 + Agent 主动推送”这种双向高频场景，才上 WebSocket。

    ### 请求处理深入

    ### ⚙️ 1 HandlerMethodArgumentResolver 自定义：实现 @CurrentUser 自动注入当前用户

    在实际项目里，很多接口方法都要拿到当前登录用户，传统做法是用 SecurityContextHolder.getContext().getAuthentication() 或者从 Request Header 里解析 token。一遍又一遍写重复代码，难看又容易出错。自定义参数解析器就是来消灭这种样板代码的。

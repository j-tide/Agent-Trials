content:
  prompt: 1、基础题：Spring 的事件发布/监听机制是什么？如何使用？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐（ApplicationEvent、ApplicationListener、观察者模式、解耦）\n\nAnswer\n\n-
    核心原理：Spring 事件机制是观察者模式的实现，通过 ApplicationEventPublisher 发布事件，ApplicationListener
    监听事件，实现组件间的解耦。\n\n- 使用方式： 方式 1：继承 ApplicationListener（传统方式）\n\n// 定义事件\npublic
    class UserRegisteredEvent extends ApplicationEvent {\n    private final String
    username;\n        \n    public UserRegisteredEvent(Object source, String username)
    {\n        super(source);\n        this.username = username;\n    }\n}\n    \n//
    监听事件\n@Component\npublic class EmailNotificationListener implements ApplicationListener<UserRegisteredEvent>
    {\n    @Override\n    public void onApplicationEvent(UserRegisteredEvent event)
    {\n        System.out.println(\"Send email to \" + event.getUsername());\n    }\n}\n
    \   \n// 发布事件\n@Service\npublic class UserService {\n    @Autowired\n    private
    ApplicationEventPublisher eventPublisher;\n        \n    public void register(String
    username) {\n        // 注册逻辑\n        eventPublisher.publishEvent(new UserRegisteredEvent(this,
    username));\n    }\n}\n\n**方式 2：@EventListener 注解（推荐）**\n\n@Component\npublic
    class NotificationListener {\n    @EventListener\n    public void handleUserRegistered(UserRegisteredEvent
    event) {\n        System.out.println(\"Send email to \" + event.getUsername());\n
    \   }\n}\n\n- 核心优势：解耦业务逻辑，发布者不需要知道有哪些监听者，监听者之间互不影响。\n\n---"

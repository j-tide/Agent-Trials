content:
  prompt: 1、基础题：WebMvcConfigurer 有哪些常用扩展点？各自的作用？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（WebMvcConfigurer、扩展点）\n\nAnswer\n\nWebMvcConfigurer 常用扩展点：\n\n```text\n@Configuration\npublic
    class WebConfig implements WebMvcConfigurer {\n    \n    // 1. 路径匹配配置\n    @Override\n
    \   public void configurePathMatch(PathMatchConfigurer configurer) {\n        configurer.setUseTrailingSlashMatch(true);\n
    \   }\n    \n    // 2. 内容协商配置\n    @Override\n    public void configureContentNegotiation(ContentNegotiationConfigurer
    configurer) {\n        configurer.favorParameter(true);\n    }\n    \n    // 3.
    消息转换器配置\n    @Override\n    public void configureMessageConverters(List<HttpMessageConverter<?>>
    converters) {\n        converters.add(new MappingJackson2HttpMessageConverter());\n
    \   }\n    \n    // 4. 拦截器配置\n    @Override\n    public void addInterceptors(InterceptorRegistry
    registry) {\n        registry.addInterceptor(new LoggingInterceptor())\n            .addPathPatterns(\"/**\");\n
    \   }\n    \n    // 5. 跨域配置\n    @Override\n    public void addCorsMappings(CorsRegistry
    registry) {\n        registry.addMapping(\"/**\")\n            .allowedOrigins(\"*\");\n
    \   }\n    \n    // 6. 视图控制器配置\n    @Override\n    public void addViewControllers(ViewControllerRegistry
    registry) {\n        registry.addViewController(\"/\").setViewName(\"index\");\n
    \   }\n    \n    // 7. 静态资源配置\n    @Override\n    public void addResourceHandlers(ResourceHandlerRegistry
    registry) {\n        registry.addResourceHandler(\"/static/**\")\n            .addResourceLocations(\"classpath:/static/\");\n
    \   }\n    \n    // 8. 参数解析器配置\n    @Override\n    public void addArgumentResolvers(List<HandlerMethodArgumentResolver>
    resolvers) {\n        resolvers.add(new AgentContextResolver());\n    }\n}\n```\n\n---"

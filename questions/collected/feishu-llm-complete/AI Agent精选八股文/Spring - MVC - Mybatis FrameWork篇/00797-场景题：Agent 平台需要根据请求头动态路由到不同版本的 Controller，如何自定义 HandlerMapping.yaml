content:
  prompt: 3、场景题：Agent 平台需要根据请求头动态路由到不同版本的 Controller，如何自定义 HandlerMapping？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（自定义 HandlerMapping、版本路由、动态匹配）\n\n1️⃣ Common Answer\n\n可以用
    @RequestMapping 的 params 属性，或者写个拦截器判断版本。不太清楚怎么自定义 HandlerMapping。\n\n2️⃣ Impressive
    Answer\n\n我给出完整的实现方案：\n\n- 方案一：自定义 HandlerMapping（推荐）\n\n```text\n@Component\n@Order(Ordered.HIGHEST_PRECEDENCE)\npublic
    class VersionRoutingHandlerMapping extends RequestMappingHandlerMapping {\n    \n
    \   private static final String VERSION_HEADER = \"X-Agent-Version\";\n    private
    static final String DEFAULT_VERSION = \"v1\";\n    \n    @Override\n    protected
    HandlerMethod getHandlerInternal(HttpServletRequest request) throws Exception
    {\n        String version = request.getHeader(VERSION_HEADER);\n        if (version
    == null) {\n            version = DEFAULT_VERSION;\n        }\n        \n        //
    包装请求，修改路径\n        String originalPath = request.getRequestURI();\n        String
    versionedPath = injectVersion(originalPath, version);\n        \n        return
    super.getHandlerInternal(new VersionedRequestWrapper(request, versionedPath));\n
    \   }\n    \n    private String injectVersion(String path, String version) {\n
    \       // /api/agent/chat → /api/agent/v1/chat\n        return path.replaceFirst(\"/api/agent/\",
    \"/api/agent/\" + version + \"/\");\n    }\n}\n\n// 请求包装器\npublic class VersionedRequestWrapper
    extends HttpServletRequestWrapper {\n    private final String versionedPath;\n
    \   \n    public VersionedRequestWrapper(HttpServletRequest request, String versionedPath)
    {\n        super(request);\n        this.versionedPath = versionedPath;\n    }\n
    \   \n    @Override\n    public String getRequestURI() {\n        return versionedPath;\n
    \   }\n    \n    @Override\n    public String getServletPath() {\n        return
    versionedPath;\n    }\n}\n\n// 不同版本的 Controller\n@RestController\n@RequestMapping(\"/api/agent/v1/chat\")\npublic
    class AgentChatV1Controller {\n    @PostMapping\n    public String chat(@RequestBody
    ChatRequest request) {\n        return \"V1: \" + request.getMessage();\n    }\n}\n\n@RestController\n@RequestMapping(\"/api/agent/v2/chat\")\npublic
    class AgentChatV2Controller {\n    @PostMapping\n    public String chat(@RequestBody
    ChatRequest request) {\n        return \"V2 (Enhanced): \" + request.getMessage();\n
    \   }\n}\n```\n\n- 方案二：基于条件的路由（@Conditional）\n\n```text\n@RestController\n@RequestMapping(\"/api/agent/chat\")\npublic
    class AgentChatController {\n    \n    @PostMapping\n    @ConditionalOnHeader(name
    = \"X-Agent-Version\", value = \"v1\")\n    public String chatV1(@RequestBody
    ChatRequest request) {\n        return \"V1: \" + request.getMessage();\n    }\n
    \   \n    @PostMapping\n    @ConditionalOnHeader(name = \"X-Agent-Version\", value
    = \"v2\")\n    public String chatV2(@RequestBody ChatRequest request) {\n        return
    \"V2: \" + request.getMessage();\n    }\n}\n```\n\n- Agent 场景实践：\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---\n\n---\n\n###
    返回值处理与内容协商"

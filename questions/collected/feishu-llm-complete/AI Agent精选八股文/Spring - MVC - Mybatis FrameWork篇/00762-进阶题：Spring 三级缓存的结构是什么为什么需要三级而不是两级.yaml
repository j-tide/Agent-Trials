content:
  prompt: 2、进阶题：Spring 三级缓存的结构是什么？为什么需要三级而不是两级？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（三级缓存Map、earlySingletonObjects、singletonFactories、AOP代理时机）\n\n1️⃣
    Common Answer\n\n三级缓存就是三个 Map，分别是 singletonObjects、earlySingletonObjects、singletonFactories。第一级存完整的
    Bean，第二级存半成品，第三级存工厂。为什么需要三级？可能是为了解决 AOP 代理的问题。\n\n2️⃣ Impressive Answer\n\n- 三级缓存结构（DefaultSingletonBeanRegistry）：\n\n//
    一级缓存：完整的 Bean（已初始化完成）\nprivate final Map<String, Object> singletonObjects = new
    ConcurrentHashMap<>(256);\n    \n// 二级缓存：早期暴露的 Bean（实例化但未初始化，可能被代理）\nprivate final
    Map<String, Object> earlySingletonObjects = new ConcurrentHashMap<>(16);\n    \n//
    三级缓存：Bean 工厂（ObjectFactory，用于提前暴露 Bean 或创建 AOP 代理）\nprivate final Map<String,
    ObjectFactory<?>> singletonFactories = new HashMap<>(16);\n\n- 三级缓存的工作流程（以 A 依赖
    B，B 依赖 A 为例）：\n\n① 创建 A：实例化 A，将 A 的 ObjectFactory 放入三级缓存\n② 注入 B：发现依赖 B，创建 B\n③
    创建 B：实例化 B，注入 A\n④ 获取 A：从三级缓存获取 A 的 ObjectFactory，调用 getObject()\n⑤ AOP 判断：如果
    A 需要 AOP 代理，ObjectFactory 创建代理对象\n⑥ 升级缓存：将代理对象从三级移到二级缓存\n⑦ B 完成：A 的代理对象注入到 B，B
    初始化完成，放入一级缓存\n⑧ A 完成：A 注入 B（从一级缓存获取），A 初始化完成，从二级移到一级\n\n- 为什么需要三级而不是两级？\n\n- AOP
    代理的时机：如果 A 被 @Async、@Transactional 等注解标注，且发生了循环依赖，A 的代理对象会在 getEarlyBeanReference
    中提前创建，而不是在 BeanPostProcessor.postProcessAfterInitialization。\n\n- 实践注意：如果项目中没有
    AOP 或循环依赖，三级缓存其实可以简化为两级（Spring 源码注释也提到过）。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

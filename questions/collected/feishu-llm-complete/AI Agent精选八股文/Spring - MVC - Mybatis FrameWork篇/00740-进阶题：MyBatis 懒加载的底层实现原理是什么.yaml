content:
  prompt: 2、进阶题：MyBatis 懒加载的底层实现原理是什么？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（CGLIB 代理、代理拦截、aggressiveLazyLoading）

    1️⃣ Common Answer 懒加载用 CGLIB 生成代理对象，访问属性时触发查询。aggressiveLazyLoading 控制是否加载所有属性。

    2️⃣ Impressive Answer

    - CGLIB 代理生成：MyBatis 使用 ProxyFactory 创建代理对象，默认用 CGLIB（proxyFactory 可配置为 JAVASSIST）。代理对象继承目标类，拦截 getter 方法，触发延迟查询。

    - 代理拦截逻辑：代理对象内部持有 ResultLoader，拦截 getMessages() 方法时，调用 ResultLoader.loadResult() 执行 SQL 查询，填充属性值。关键代码：

    ```text
    public class CglibProxyFactory implements ProxyFactory {
        @Override
        public Object createProxy(Object target, ResultLoaderMap lazyLoader) {
            Enhancer enhancer = new Enhancer();
            enhancer.setSuperclass(target.getClass());
            enhancer.setCallback(new LazyLoaderInterceptor(lazyLoader));
            return enhancer.create();
        }
    }
    ```

    - aggressiveLazyLoading 配置：

    - SqlSession 生命周期限制：懒加载依赖 SqlSession，如果 SqlSession 已关闭，访问懒加载属性会报 SqlSessionException。Spring 整合：在 @Transactional 方法内访问懒加载属性，确保 SqlSession 未关闭；或在事务外使用 fetchType="eager" 预加载。


content:
  prompt: 2、进阶题：ResultMap 的 association（一对一）和 collection（一对多）如何配置？嵌套查询和嵌套结果的区别？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（嵌套查询 vs 嵌套结果、N+1 问题、延迟加载）

    1️⃣ Common Answer association 用在一对一，collection 用在一对多。嵌套查询是再查一次数据库，嵌套结果是一次查询把数据都查出来。嵌套查询可能会有 N+1 问题，所以一般用嵌套结果。

    2️⃣ Impressive Answer

    - association 一对一配置：<association property="tool" javaType="Tool" column="tool_id" select="selectToolById"/> 嵌套查询方式，或 <association property="tool" resultMap="toolMap"/> 嵌套结果方式，通过 resultMap 复用映射规则。

    - collection 一对多配置：<collection property="params" ofType="ToolParam" column="tool_id" select="selectParamsByToolId"/> 嵌套查询，或 <collection property="params" resultMap="paramMap"/> 嵌套结果，一对多返回 List。

    - 嵌套查询 vs 嵌套结果：嵌套查询执行多条 SQL（主查询 + N 条子查询），N+1 问题：查 100 条工具调用记录，会执行 101 条 SQL；嵌套结果执行一条 SQL，通过 JOIN 查询，性能更好，但 SQL 复杂度增加。

    - 延迟加载优化：嵌套查询配合 lazyLoadingEnabled="true"，只有在访问关联对象时才执行子查询，减少不必要的查询。Agent 场景：工具调用记录列表只显示基本信息，点击详情才加载工具详情和参数，延迟加载避免性能浪费。

    3️⃣ Key Differences


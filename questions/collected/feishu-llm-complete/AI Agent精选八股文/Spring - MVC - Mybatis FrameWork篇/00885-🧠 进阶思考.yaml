answer:
  mode: rubric
  reference_answer: "- 可以结合 Spring Security，直接从 SecurityContext 取用户，不必重复解析 token。\n\n-
    如果有非必须登录的场景，可以让 @CurrentUser 有个 required 属性，未登录时返回 null 或一个匿名占位对象。\n\n- 同理，可以做出
    @RequestIp 自动注入客户端 IP、@RequestHeaderToken 等通用解析器，让控制器的签名就是你的业务协议。\n\n掌握了自定义参数解析器，你就能把横向关注点干净地抽离，让控制器只关注业务规则。\n\n---\n\n###
    \U0001F4E6 2. @RequestBody 的参数解析原理与 HttpMessageConverter 工作机制\n\n这个问题的本质是：当你在
    Controller 方法参数上打上 @RequestBody，Spring MVC 是如何把 HTTP 请求体里的 JSON/XML/文本变成你的 Java
    对象的？"

content:
  prompt: 2、进阶题：如何设计一个生产级的 LLM Client Starter？需要考虑哪些工程实践问题？
answer:
  mode: rubric
  reference_answer: "⭐⭐⭐（条件注解、@ConfigurationProperties、HealthIndicator、MeterRegistry、优雅降级）\n\n1️⃣
    Common Answer\n\n设计 LLM Client Starter 主要考虑：使用 @ConditionalOnMissingBean 实现自动配置、@ConfigurationProperties
    绑定 API Key 和模型名称、实现 HealthIndicator 检查连通性、用 MeterRegistry 记录请求耗时。\n\n```text\n@Configuration\n@ConditionalOnClass(LlmClient.class)\n@EnableConfigurationProperties(LlmClientProperties.class)\npublic
    class LlmClientAutoConfiguration {\n\n    @Bean\n    @ConditionalOnMissingBean\n
    \   public LlmClient llmClient(LlmClientProperties properties) {\n        return
    new OpenAiLlmClient(properties);\n    }\n}\n```\n\n2️⃣ Impressive Answer\n\n设计生产级
    LLM Client Starter 需要从稳定性、可观测性、可扩展性三个维度系统考虑，我从以下四个方面展开。\n\n第一，智能化的条件装配与配置管理。\n\n使用多级条件注解实现灵活装配，配置属性类加
    JSR-303 校验：\n\n```text\n@Configuration\n@ConditionalOnClass({LlmClient.class,
    OpenAiApi.class})\n@EnableConfigurationProperties(LlmClientProperties.class)\n@AutoConfigureBefore(WebMvcAutoConfiguration.class)\npublic
    class LlmClientAutoConfiguration {\n\n    @Bean\n    @ConditionalOnMissingBean\n
    \   @ConditionalOnProperty(prefix = \"llm.client\", name = \"enabled\", havingValue
    = \"true\", matchIfMissing = true)\n    public LlmClient llmClient(LlmClientProperties
    properties,\n                               ObjectProvider<List<LlmClientInterceptor>>
    interceptorsProvider) {\n        OpenAiLlmClient client = new OpenAiLlmClient(properties);\n
    \       client.setInterceptors(interceptorsProvider.getIfAvailable());\n        return
    client;\n    }\n}\n```\n\n```text\n@ConfigurationProperties(prefix = \"llm.client\")\n@Validated\npublic
    class LlmClientProperties {\n\n    @NotBlank\n    private String apiKey;\n\n    @NotBlank\n
    \   private String model = \"gpt-3.5-turbo\";\n\n    @Min(1000) @Max(120000)\n
    \   private Duration timeout = Duration.ofSeconds(30);\n\n    @Min(1) @Max(10)\n
    \   private Integer maxRetries = 3;\n}\n```\n\n第二，可观测性建设（健康检查 + 指标）。\n\n实现深度健康检查，不仅检测连通性，还检测配额和限流状态：\n\n```text\npublic
    class LlmClientHealthIndicator implements HealthIndicator {\n\n    @Override\n
    \   public Health health() {\n        try {\n            LlmModelsResponse response
    = client.listModels();\n            return Health.up()\n                .withDetail(\"model\",
    properties.getModel())\n                .withDetail(\"quota\", response.getQuota())\n
    \               .build();\n        } catch (RateLimitException e) {\n            return
    Health.down()\n                .withDetail(\"error\", \"Rate limit exceeded\")\n
    \               .withDetail(\"retryAfter\", e.getRetryAfter())\n                .build();\n
    \       }\n    }\n}\n```\n\n指标暴露涵盖请求耗时、Token 消耗、成功率：\n\n```text\nTimer.builder(\"llm.client.request.duration\")\n
    \   .tag(\"model\", client.getModel())\n    .register(registry);\n\nCounter.builder(\"llm.client.tokens.used\")\n
    \   .tag(\"type\", \"prompt\")\n    .register(registry);\n```\n\n第三，优雅降级与容错机制。\n\n使用
    Resilience4j 实现熔断、重试，当熔断器打开时返回缓存结果：\n\n```text\n@Bean\npublic LlmClient resilientLlmClient(LlmClient
    delegate, LlmClientProperties properties) {\n    CircuitBreakerConfig config =
    CircuitBreakerConfig.custom()\n        .failureRateThreshold(50)\n        .waitDurationInOpenState(Duration.ofSeconds(30))\n
    \       .build();\n\n    RetryConfig retryConfig = RetryConfig.custom()\n        .maxAttempts(properties.getMaxRetries())\n
    \       .retryOnException(e -> e instanceof TimeoutException || e instanceof RateLimitException)\n
    \       .build();\n\n    return new ResilientLlmClient(delegate,\n        CircuitBreaker.of(\"llmClient\",
    config),\n        Retry.of(\"llmClient\", retryConfig));\n}\n```\n\n第四，扩展性设计（拦截器机制）。\n\n提供拦截器
    SPI，支持自定义请求/响应处理（日志、签名、脱敏等）：\n\n```text\npublic interface LlmClientInterceptor
    {\n    default LlmRequest beforeRequest(LlmRequest request) { return request;
    }\n    default LlmResponse afterResponse(LlmRequest request, LlmResponse response)
    { return response; }\n    default void onError(LlmRequest request, Exception e)
    {}\n}\n```\n\n总结： 生产级 Starter 设计的核心是开箱即用与生产就绪的平衡。通过条件装配实现按需加载，通过健康检查和指标实现可观测性，通过熔断降级保障稳定性，通过拦截器机制提供扩展性。\n\n3️⃣
    Key Differences\n\n---\n\n\U0001F9E9 一句话总结：SpringApplication.run() 是 Spring Boot
    的“启动调度器”，它通过事件驱动的方式，把环境准备、上下文构建、容器刷新、扩展回调全部串联起来。\n\n理解了这张启动全景图，你就能自信地掌控应用启动顺序，自定义初始化逻辑或排查启动故障。\n\n✈️
    一句话总结：内嵌容器的核心是“Spring 容器驱动 Web 容器”——由自动配置提供工厂，由上下文刷新触发启动。而切换容器只需更换依赖，这是“习惯优于配置”的绝佳示范，也是自动装配价值最大化的体现。\n\n\U0001F4A1
    一句话总结：高并发 SSE 的内核是“异步化 + 连接上限放开”，别让 Tomcat 工作线程成为瓶颈。参数调优只是“术”，理解异步执行模型才是“道”，双管齐下，Agent
    服务才能稳健承载海量长连接，真正做到推送不延迟、不断流。\n\n我一般还会在 k8s 里把 terminationGracePeriodSeconds 设得比
    Spring 的超时大一些，避免容器提前被 kill 掉。这一环扣一环的配置，才算是完整的优雅停机。\n\n真正做到无损，不是保证每个请求都能等到结果，而是让用户感知不到中断——即便断了，也能用最友好的方式提示重连。这才是面对
    Agent 服务，最务实的下线哲学。\n\n把这些指标搭好之后，你甚至能画出一张 Agent 全景驾驶舱：左侧是对话请求 QPS，中间是 LLM 延迟和 Token
    消耗趋势，右侧是各工具调用热力图。用数据驱动迭代，才是 Agent 服务从“能用”走向“可靠”的正确姿态。\n\n- 启动完整容器：加载整个应用上下文（包括
    Controller、Service、Repository 等）。\n\n- 适用场景：端到端测试、集成测试、需要测试多个组件协作的场景。\n\n- 缺点：启动慢，依赖真实的外部服务（数据库、Redis
    等）。\n\n- Slice 测试：只加载 Web 层（Controller、ControllerAdvice、Filter 等），不加载 Service
    和 Repository。\n\n- 自动 Mock：Service 层的 Bean 自动被 Mock，需要用 @MockBean 模拟行为。\n\n- 适用场景：单元测试
    Controller、测试 API 输入输出、验证异常处理。\n\n- @DataJpaTest：只测试 JPA 层，自动配置嵌入式数据库（H2）。\n\n-
    @JsonTest：只测试 JSON 序列化/反序列化。\n\n- @WebFluxTest：测试 WebFlux Controller。\n\n- 单元测试：优先用
    Slice 测试（@WebMvcTest、@DataJpaTest）。\n\n- 集成测试：用 @SpringBootTest，但尽量减少数量。\n\n-
    测试金字塔：70% 单元测试 → 20% 集成测试 → 10% 端到端测试。\n\n- 通过 @BootstrapWith 指定自定义的 TestContextBootstrapper。\n\n-
    TestContextBootstrapper 根据 @TestConfiguration 和 @Import 过滤 BeanDefinition，只加载特定层的
    Bean。\n\n- 例如 @WebMvcTest 只加载 @Controller、@ControllerAdvice、@Filter 等注解的 Bean。\n\n-
    @MockBean 通过 MockitoPostProcessor 在测试上下文中注册 Mockito Mock 对象。\n\n- Mock 对象会替换容器中同类型的真实
    Bean（包括 @Primary 和 @Qualifier）。\n\n- 支持按类型、按名称、按限定符匹配要替换的 Bean。\n\n- @MockBean：完全
    Mock，所有方法默认返回默认值（null、0、false）。\n\n- @SpyBean：部分 Mock，真实方法会被调用，可以 when(spy.method()).thenCallRealMethod()。\n\n-
    @ConditionalOnClass：类路径上存在指定类时生效（如 @ConditionalOnClass(Tomcat.class)）\n\n- @ConditionalOnMissingClass：类路径上不存在指定类时生效\n\n-
    @ConditionalOnBean：容器中存在指定 Bean 时生效\n\n- @ConditionalOnMissingBean：容器中不存在指定 Bean
    时生效（用户自定义优先的核心机制）\n\n- @ConditionalOnSingleCandidate：容器中只有一个候选 Bean 时生效\n\n- @ConditionalOnProperty：配置文件中存在指定属性且值匹配时生效\n\n-
    @ConditionalOnExpression：SpEL 表达式为 true 时生效\n\n- @Profile：激活指定 Profile 时生效（本质是
    @Conditional(ProfileCondition.class)）\n\n- @ConditionalOnWebApplication：是 Web
    应用时生效\n\n- @ConditionalOnNotWebApplication：不是 Web 应用时生效\n\n- AutoConfigurationImportSelector
    实现了 DeferredImportSelector，延迟到所有 @Configuration 类处理完之后才执行。\n\n- 用户的 @Configuration
    类（通过 @ComponentScan 扫描）先于自动配置类处理。\n\n- 因此用户的 Bean 先注册到容器，自动配置类执行时 @ConditionalOnMissingBean
    检查到已有 Bean，跳过创建。\n\n- @ConditionalOnMissingBean 的判断发生在 BeanDefinition 注册阶段，而非
    Bean 实例化阶段。\n\n- ConditionEvaluator 在处理每个 @Bean 方法时调用 Condition.matches()，此时已注册的
    BeanDefinition 都可以被检测到。\n\n- Environment 接口：提供 getProperty()、containsProperty()、getActiveProfiles()
    等方法。\n\n- ConfigurableEnvironment：可以添加/删除 PropertySource，获取 MutablePropertySources。\n\n-
    StandardEnvironment：非 Web 环境，包含系统属性和环境变量两个 PropertySource。\n\n- StandardServletEnvironment：Web
    环境，额外包含 Servlet 配置和上下文参数。\n\n- Java 17 基线：不再支持 Java 8/11，可以使用 Record、Sealed Class、Pattern
    Matching 等新特性。\n\n- Jakarta EE 10：所有 javax.* 包迁移到 jakarta.*（如 javax.servlet →
    jakarta.servlet），这是最大的迁移成本。\n\n- Spring Framework 6.x：底层框架同步升级。\n\n- 废弃 spring.factories
    的 EnableAutoConfiguration 入口。\n\n- 迁移到 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports。\n\n-
    新增 @AutoConfiguration 注解替代 @Configuration，语义更清晰。\n\n- Spring Boot 3.x 内置 AOT 处理器，在构建时分析
    Bean 定义，生成静态代码。\n\n- 为 GraalVM 原生镜像编译提供支持，大幅减少反射使用。\n\n- mvn spring-boot:build-image
    可直接构建原生镜像。\n\n- 内置 Micrometer Tracing（替代 Spring Cloud Sleuth），支持分布式链路追踪。\n\n-
    自动集成 OpenTelemetry，无需额外配置。\n\n- HttpExchange 接口替代 Feign，声明式 HTTP 客户端内置支持。\n\n-
    问题详情（RFC 7807）支持，ProblemDetail 标准化错误响应。\n\n- @ControllerAdvice 支持函数式异常处理。\n\n-
    JIT（Just-In-Time）：运行时编译，启动慢（需要 JVM 预热），但长期运行性能好。\n\n- AOT（Ahead-of-Time）：构建时编译，启动极快（毫秒级），内存占用低，但失去
    JIT 优化。\n\n- 适合：Serverless 函数、CLI 工具、冷启动敏感的场景（如 K8s 快速扩容）。\n\n- 不适合：需要动态加载类、大量反射的
    Agent 框架（如 LangChain4J 的动态代理）。\n\n- 类路径扫描范围过大：@ComponentScan 扫描了不必要的包，包含大量第三方
    jar。\n\n- 自动配置过多：加载了不需要的自动配置类（如引入了 spring-boot-starter-data-jpa 但不用数据库）。\n\n-
    Bean 初始化耗时：某些 Bean 的 @PostConstruct 或构造函数有耗时操作（如建立连接、加载模型）。\n\n- AOP 代理创建：大量 @Transactional、@Async
    注解导致代理对象创建耗时。\n\n- 看 refreshContext 耗时（Bean 实例化阶段）\n\n- 用 @PostConstruct 打时间戳，找出耗时的
    Bean 初始化\n\n- 检查是否有同步的网络调用（如启动时连接外部服务）\n\n- Base ClassLoader：加载不会变化的类（第三方 jar、Spring
    框架本身）。\n\n- Restart ClassLoader：加载开发者自己的类（classpath 下的 class 文件）。\n\n- 文件变化时，只丢弃并重建
    Restart ClassLoader，Base ClassLoader 保留，因此比完整重启快得多。\n\n- 监听 classpath 下的文件变化（IDE
    编译后触发）。\n\n- 默认排除静态资源（/static、/public、/templates）的变化，避免频繁重启。\n\n- 性能开销：文件监听器持续消耗
    CPU 和 IO。\n\n- 类加载器隔离问题：双类加载器可能导致 ClassCastException（同一个类被两个 ClassLoader 加载，类型不兼容）。\n\n-
    安全风险：LiveReload 服务器暴露额外端口。\n\n- 自动禁用机制：DevTools 检测到 java -jar 启动时自动禁用（通过检查 jar
    包中是否有 BOOT-INF 目录判断）。\n\n- invokeBeanFactoryPostProcessors：ConfigurationClassPostProcessor
    在这里解析 @Configuration、@ComponentScan、@Import、@Bean，注册所有 BeanDefinition。\n\n- finishBeanFactoryInitialization：遍历所有非懒加载单例
    BeanDefinition，依次实例化，这是启动最耗时的阶段。"

answer:
  mode: rubric
  reference_answer: "- 分页插件（如 PageHelper）就是拦截 Executor.query，判断参数中是否需要分页，修改 SQL 并重新设置参数。\n\n-
    读写分离插件：拦截 Executor.update/query 方法，根据方法类型选择不同的数据源。\n\n- 数据加密插件：拦截 ParameterHandler.setParameters，对敏感字段值加密；拦截
    ResultSetHandler.handleResultSets 对字段值解密。\n\n\U0001F527 进阶提醒：插件中如果修改了 BoundSql
    的 SQL 和参数，务必保持参数和占位符一致。而且 Interceptor 的实现需要考虑线程安全，因为核心对象可能被多线程共享。\n\n理解了责任链模式，你也能写出优雅的横向切面，让
    SQL 执行变成一块可以任意编排的积木。\n\n---\n\n### Agent 需要根据运行时条件动态拼接查询 SQL，MyBatis 如何安全实现？\n\nAgent
    类应用（比如 ChatBI、智能查询助手）经常要根据用户的自然语言生成不同的查询条件，比如：\n“查一下上个月消费超过 1000 的VIP用户” → 动态生成
    WHERE 条件。\nMyBatis 提供了多种动态 SQL 方案，但安全第一，必须防注入。"

content:
  prompt: 1、MyBatis 的一级缓存和二级缓存有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（缓存级别、失效条件、脏读风险）

    1️⃣ Common Answer 一级缓存是 SqlSession 级别的，默认开启，同一个 SqlSession 里查询相同数据会走缓存。二级缓存是 Mapper 级别的，需要配置开启，多个 SqlSession 可以共享缓存。一级缓存会在增删改操作后失效，二级缓存也是一样。

    2️⃣ Impressive Answer

    - 一级缓存（SqlSession 级别）：基于 PerpetualCache 实现，默认开启，缓存 key 是 Statement ID + 参数 + SQL。在同一个 SqlSession 内，相同查询直接返回缓存结果，避免重复查询数据库。失效条件：执行 insert/update/delete、调用 sqlSession.clearCache()、SqlSession 关闭。

    - 二级缓存（Mapper 级别）：基于 Mapper 的 namespace，需要配置 <cache/> 开启，多个 SqlSession 共享同一 Mapper 的缓存。核心区别：一级缓存只在 SqlSession 内有效，二级缓存跨 SqlSession 共享；二级缓存需要序列化对象（要求实体类实现 Serializable）。

    - 多表查询脏读风险：一级缓存可能脏读（多表关联时，只查询主表可能返回缓存的旧数据），二级缓存通过 flushCache 配置避免。最佳实践：多表关联查询时关闭二级缓存或设置 flushCache="true"，避免脏数据。

    - Spring 整合后的行为：Spring 整合 MyBatis 后，SqlSession 由 Spring 管理，一级缓存在事务内有效，事务提交后 SqlSession 关闭，一级缓存清空。二级缓存独立于事务，适合读多写少的场景。

    3️⃣ Key Differences


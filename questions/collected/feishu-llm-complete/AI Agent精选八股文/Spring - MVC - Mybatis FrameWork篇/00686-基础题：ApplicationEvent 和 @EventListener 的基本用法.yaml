content:
  prompt: 1、基础题：ApplicationEvent 和 @EventListener 的基本用法？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（事件发布、事件监听、解耦）\n\nAnswer\n\n- 自定义事件：\n\npublic class AgentCompletedEvent
    extends ApplicationEvent {\n    private final String agentId;\n    private final
    AgentResult result;\n        \n    public AgentCompletedEvent(Object source, String
    agentId, AgentResult result) {\n        super(source);\n        this.agentId =
    agentId;\n        this.result = result;\n    }\n}\n\n- 发布事件：\n\n@Service\npublic
    class AgentService {\n    @Autowired\n    private ApplicationEventPublisher eventPublisher;\n
    \       \n    public AgentResult execute(String agentId, AgentRequest request)
    {\n        AgentResult result = doExecute(request);\n        eventPublisher.publishEvent(new
    AgentCompletedEvent(this, agentId, result));\n        return result;\n    }\n}\n\n-
    监听事件：\n\n@Component\npublic class AgentEventListener {\n    @EventListener\n    public
    void handleAgentCompleted(AgentCompletedEvent event) {\n        System.out.println(\"Agent
    \" + event.getAgentId() + \" completed\");\n    }\n}\n\n---"

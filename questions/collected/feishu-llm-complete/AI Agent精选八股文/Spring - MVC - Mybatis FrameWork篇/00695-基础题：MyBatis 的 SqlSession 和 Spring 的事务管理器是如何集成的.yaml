content:
  prompt: 1、基础题：MyBatis 的 SqlSession 和 Spring 的事务管理器是如何集成的？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（事务管理器、SqlSessionTemplate、事务传播）

    1️⃣ Common Answer Spring 提供了 SqlSessionTemplate，它封装了 SqlSession，可以在 Spring 事务中使用。配置 DataSourceTransactionManager 事务管理器，用 @Transactional 注解开启事务。

    2️⃣ Impressive Answer

    - SqlSessionTemplate 的作用：SqlSessionTemplate 是线程安全的 SqlSession 封装，内部代理了 DefaultSqlSession，确保每次操作在事务内共享同一个 SqlSession，非事务时创建新 SqlSession。核心方法：getMapper()、selectList()、insert() 等，自动处理事务边界。

    - 事务管理器集成：DataSourceTransactionManager 管理事务，通过 @Transactional 注解开启事务；事务开始时，SqlSessionUtils 创建 SqlSession 并绑定到 ThreadLocal；事务提交/回滚时，自动关闭 SqlSession。

    - 事务传播行为：@Transactional(propagation = Propagation.REQUIRED) 默认行为，加入已有事务或创建新事务；REQUIRES_NEW 挂起当前事务，创建新事务；SUPPORTS 有事务则加入，无事务则非事务执行。Agent 场景：工具调用链中，多个 Mapper 操作默认 REQUIRED，确保原子性。

    - 配置示例：

    ```text
    <bean id="transactionManager" class="org.springframework.jdbc.datasource.DataSourceTransactionManager">
      <property name="dataSource" ref="dataSource"/>
    </bean>
    <tx:annotation-driven transaction-manager="transactionManager"/>
    ```


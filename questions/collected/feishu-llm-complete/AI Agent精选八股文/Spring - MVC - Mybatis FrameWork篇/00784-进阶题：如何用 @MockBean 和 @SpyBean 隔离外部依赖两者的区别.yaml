content:
  prompt: 2、进阶题：如何用 @MockBean 和 @SpyBean 隔离外部依赖？两者的区别？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（Mock 隔离、Spy 部分模拟、测试隔离）\n\n1️⃣ Common Answer\n\n@MockBean
    可以 Mock 掉 Spring 容器中的 Bean，@SpyBean 可以部分 Mock。测试时用它们隔离外部依赖，比如 Mock 掉 LLM 调用。\n\n2️⃣
    Impressive Answer\n\n- @MockBean 完全模拟：\n\n@WebMvcTest(AgentController.class)\npublic
    class AgentControllerTest {\n        \n    @Autowired\n    private MockMvc mockMvc;\n
    \       \n    @MockBean  // 完全 Mock，所有方法都是模拟的\n    private AgentService agentService;\n
    \       \n    @Test\n    public void testChat() throws Exception {\n        //
    Mock 返回值\n        when(agentService.chat(any()))\n            .thenReturn(AgentResponse.success(\"Hello\"));\n
    \           \n        mockMvc.perform(post(\"/api/agent/chat\")\n                .contentType(MediaType.APPLICATION_JSON)\n
    \               .content(\"{\\\"prompt\\\":\\\"Hi\\\"}\"))\n            .andExpect(status().isOk())\n
    \           .andExpect(jsonPath(\"$.content\").value(\"Hello\"));\n    }\n}\n\n-
    @SpyBean 部分模拟：\n\n@SpringBootTest\npublic class AgentServiceTest {\n        \n
    \   @Autowired\n    private AgentService agentService;\n        \n    @SpyBean
    \ // 部分 Mock，真实方法可以调用\n    private LLMService llmService;\n        \n    @Test\n
    \   public void testChat() {\n        // Mock LLM 调用，但其他方法真实执行\n        when(llmService.chat(any()))\n
    \           .thenReturn(LLMResponse.success(\"Hello\"));\n            \n        AgentResponse
    response = agentService.chat(new AgentRequest(\"Hi\"));\n        assertEquals(\"Hello\",
    response.getContent());\n    }\n}\n\n- 区别对比：\n\n- Mock LLM 响应：\n\n@WebMvcTest(AgentController.class)\npublic
    class AgentControllerTest {\n        \n    @MockBean\n    private AgentService
    agentService;\n        \n    @Test\n    public void testChatWithToolCall() {\n
    \       // Mock Agent 调用工具\n        ToolResponse toolResponse = ToolResponse.success(\"Weather:
    Sunny\");\n        when(agentService.callTool(\"weather-tool\", any()))\n            .thenReturn(CompletableFuture.completedFuture(toolResponse));\n
    \           \n        // Mock LLM 响应\n        when(agentService.chat(any()))\n
    \           .thenReturn(AgentResponse.success(\"Today is sunny\"));\n            \n
    \       // 测试完整流程\n    }\n}\n\n- Agent 场景实战：测试 Agent 工具调用链路时，用 @MockBean Mock
    掉 LLMService 和 ToolService，模拟工具调用和 LLM 响应，验证 Agent 的决策逻辑，无需真实调用外部服务。\n\n3️⃣ Key
    Differences\n\n[嵌入表格未展开]\n\n---"

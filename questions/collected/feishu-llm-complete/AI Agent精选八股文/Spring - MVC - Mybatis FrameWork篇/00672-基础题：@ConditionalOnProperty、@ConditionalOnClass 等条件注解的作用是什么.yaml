content:
  prompt: 1、基础题：@ConditionalOnProperty、@ConditionalOnClass 等条件注解的作用是什么？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐（条件装配、@Conditional系列、自动配置）\n\nAnswer\n\n- 条件装配核心：@Conditional
    注解可以根据特定条件决定是否注册 Bean，避免不必要的 Bean 创建，提升启动速度和灵活性。\n\n- 常用条件注解：\n\n- 使用示例：\n\n@Configuration\npublic
    class AgentConfiguration {\n        \n    @Bean\n    @ConditionalOnProperty(name
    = \"agent.enabled\", havingValue = \"true\")\n    public AgentService agentService()
    {\n        return new AgentService();\n    }\n        \n    @Bean\n    @ConditionalOnClass(name
    = \"com.alibaba.dubbo.config.ApplicationConfig\")\n    public DubboAgentService
    dubboAgentService() {\n        return new DubboAgentService();\n    }\n        \n
    \   @Bean\n    @ConditionalOnMissingBean(ToolExecutor.class)\n    public DefaultToolExecutor
    defaultToolExecutor() {\n        return new DefaultToolExecutor();\n    }\n}\n\n---"

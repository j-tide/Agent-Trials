content:
  prompt: 3、场景题：如何自定义一个 Spring Boot Starter，让 Agent 工具库开箱即用？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（Starter 开发、自动配置、属性绑定）\n\n1️⃣ Common Answer\n\n创建一个 Spring
    Boot 项目，写一个自动配置类，用 @Bean 创建需要的 Bean，然后在 spring.factories 里配置这个类。这样用户引入依赖就能用了。\n\n2️⃣
    Impressive Answer\n\n- 项目结构：\n\nagent-spring-boot-starter/\n├── src/main/java/\n│
    \  └── com/example/agent/\n│       ├── autoconfigure/\n│       │   └── AgentAutoConfiguration.java\n│
    \      ├── properties/\n│       │   └── AgentProperties.java\n│       └── service/\n│
    \          └── AgentService.java\n└── src/main/resources/\n    └── META-INF/\n
    \       └── spring/\n            └── org.springframework.boot.autoconfigure.AutoConfiguration.imports\n\n-
    属性配置类：\n\n@ConfigurationProperties(prefix = \"agent\")\npublic class AgentProperties
    {\n    private boolean enabled = true;\n    private String llmProvider = \"openai\";\n
    \   private String apiKey;\n    private double temperature = 0.7;\n    private
    Tools tools = new Tools();\n        \n    public static class Tools {\n        private
    boolean enabled = true;\n        private List<String> includes = new ArrayList<>();\n
    \       private List<String> excludes = new ArrayList<>();\n            \n        //
    getters and setters\n    }\n        \n    // getters and setters\n}\n\n- 自动配置类：\n\n@Configuration\n@ConditionalOnClass(AgentService.class)\n@ConditionalOnProperty(prefix
    = \"agent\", name = \"enabled\", havingValue = \"true\", matchIfMissing = true)\n@EnableConfigurationProperties(AgentProperties.class)\npublic
    class AgentAutoConfiguration {\n        \n    @Bean\n    @ConditionalOnMissingBean\n
    \   public AgentService agentService(AgentProperties properties) {\n        return
    new AgentService(properties);\n    }\n        \n    @Bean\n    @ConditionalOnProperty(prefix
    = \"agent.tools\", name = \"enabled\", havingValue = \"true\")\n    public ToolRegistry
    toolRegistry(AgentProperties properties) {\n        DefaultToolRegistry registry
    = new DefaultToolRegistry();\n        properties.getTools().getIncludes().forEach(registry::register);\n
    \       return registry;\n    }\n}\n\n- AutoConfiguration.imports：\n\ncom.example.agent.autoconfigure.AgentAutoConfiguration\n\n-
    用户使用：\n\n<!-- pom.xml -->\n<dependency>\n    <groupId>com.example</groupId>\n
    \   <artifactId>agent-spring-boot-starter</artifactId>\n    <version>1.0.0</version>\n</dependency>\n\n#
    application.yml\nagent:\n  enabled: true\n  llm-provider: openai\n  api-key: ${OPENAI_API_KEY}\n
    \ temperature: 0.7\n  tools:\n    enabled: true\n    includes:\n      - search-tool\n
    \     - calculator-tool\n\n@Service\npublic class UserService {\n    @Autowired\n
    \   private AgentService agentService;  // 直接注入使用\n}\n\n- Agent 场景实战：开发 agent-tool-spring-boot-starter，自动注册常用工具（搜索、计算、天气等），用户只需引入依赖和配置工具列表，就能在
    Agent 中使用这些工具。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

content:
  prompt: 2、MyBatis 一级缓存在 Spring 事务中的行为是什么？为什么开启事务后缓存命中率更高？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（事务管理、缓存共享、命中机制）

    1️⃣ Common Answer Spring 事务中，SqlSession 是共享的，所以一级缓存在事务内有效。开启事务后，多次查询会走缓存，命中率更高。事务提交后 SqlSession 关闭，缓存清空。

    2️⃣ Impressive Answer

    - Spring 整合后的 SqlSession 管理：Spring 使用 SqlSessionTemplate 代理 SqlSession，默认每次操作创建新 SqlSession。但在事务内，Spring 通过 SqlSessionHolder 绑定当前 SqlSession 到 ThreadLocal，整个事务共享同一个 SqlSession，一级缓存生效。

    - 缓存命中率提升的原因：无事务时，每次数据库操作都创建新 SqlSession，一级缓存无法跨操作共享；开启事务后，同一事务内的多次查询共享 SqlSession，相同查询直接命中一级缓存，避免重复查库。性能提升：高频查询场景（如 Agent 对话记录查询），事务内缓存命中率可达 90%+。

    - 事务提交后的缓存清理：事务提交时，Spring 会调用 SqlSessionUtils.closeSqlSession() 清理 SqlSession，一级缓存自动清空，避免脏读。二级缓存独立于事务，事务提交后二级缓存仍然有效。

    - Agent 场景实践：Agent 查询对话记录时，在 @Transactional 方法内多次查询相同 Session，一级缓存生效，减少 DB 压力。但注意：事务内避免大对象查询（如加载全量历史消息），防止一级缓存占用过多内存。


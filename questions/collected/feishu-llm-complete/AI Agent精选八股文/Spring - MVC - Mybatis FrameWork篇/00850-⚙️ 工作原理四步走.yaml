answer:
  mode: rubric
  reference_answer: |-
    - 可拦截的四大对象：MyBatis 允许拦截 Executor（执行器）、ParameterHandler（参数处理）、ResultSetHandler（结果集处理）、StatementHandler（SQL 语句处理）。

    - 插件签名声明：每个插件必须用 @Intercepts + @Signature 声明要拦截哪个类的哪个方法，以及参数类型。

    - 生成代理对象：MyBatis 在创建这四大核心对象时，会调用 InterceptorChain.pluginAll(target)，内部遍历所有插件，对目标对象应用 Plugin.wrap()，最终返回一个层层包裹的 JDK 动态代理。

    - 执行链路：调用目标方法时，会先进入插件代理的 invoke 方法，在里面可以修改参数、执行额外逻辑，最后调用真实对象的方法。

answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（配置类 vs 普通组件、CGLIB 代理、Lite 模式）\n\nAnswer\n\n- @Configuration
    vs @Component：\n\n- Full 模式代理机制：\n\n- 代码示例：\n\n@Configuration\npublic class AppConfig
    {\n    @Bean\n    public DataSource dataSource() { return new HikariDataSource();
    }\n        \n    @Bean\n    public JdbcTemplate jdbcTemplate() {\n        // Full
    模式：调用 dataSource() 返回同一个实例\n        return new JdbcTemplate(dataSource());\n    }\n}\n\n---"

content:
  prompt: 2、进阶题：SqlSessionTemplate 和 DefaultSqlSession 的区别是什么？Spring 如何保证同一事务内使用同一个
    SqlSession？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（SqlSession 管理、ThreadLocal、事务同步）

    1️⃣ Common Answer SqlSessionTemplate 是 Spring 提供的，DefaultSqlSession 是 MyBatis 原生的。SqlSessionTemplate 是线程安全的，DefaultSqlSession 不是。Spring 用 ThreadLocal 保证同一事务内用同一个 SqlSession。

    2️⃣ Impressive Answer

    - DefaultSqlSession：MyBatis 原生实现，非线程安全，每次操作创建新实例，用完必须关闭。生命周期：方法级别，不能跨方法共享。

    - SqlSessionTemplate：Spring 封装，线程安全，内部通过动态代理代理 DefaultSqlSession，每次操作前检查 ThreadLocal 是否有 SqlSession，有则复用，无则创建。核心机制：SqlSessionInterceptor 拦截方法调用，委托给 SqlSessionUtils.getSession() 获取 SqlSession。

    - ThreadLocal 绑定机制：SqlSessionUtils.getSession() 内部调用 TransactionSynchronizationManager.getResource(dataSource)，从 ThreadLocal 获取当前事务绑定的 SqlSession；事务开始时，SqlSessionUtils.registerSession() 将 SqlSession 绑定到 ThreadLocal；事务结束时，SqlSessionUtils.closeSqlSession() 清理 ThreadLocal。

    - 事务同步管理：TransactionSynchronizationManager 维护事务同步资源（DataSource → SqlSession），确保同一事务内所有 Mapper 操作共享同一个 SqlSession，一级缓存生效；事务提交后，自动关闭 SqlSession，清理资源。


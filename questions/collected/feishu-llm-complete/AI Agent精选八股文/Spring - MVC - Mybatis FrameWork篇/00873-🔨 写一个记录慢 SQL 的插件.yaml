content:
  prompt: "\U0001F528 写一个记录慢 SQL 的插件"
answer:
  mode: rubric
  reference_answer: "```java\n@Intercepts({\n    @Signature(\n        type = StatementHandler.class,\n
    \       method = \"prepare\",\n        args = {Connection.class, Integer.class}\n
    \   )\n})\npublic class SlowSqlInterceptor implements Interceptor {\n\n    //
    慢查询阈值，单位毫秒\n    private long threshold;\n\n    @Override\n    public Object intercept(Invocation
    invocation) throws Throwable {\n        // 获取 StatementHandler，拿到绑定的 SQL\n        StatementHandler
    handler = (StatementHandler) invocation.getTarget();\n        String sql = handler.getBoundSql().getSql();\n
    \       \n        long start = System.currentTimeMillis();\n        Object result
    = invocation.proceed();   // 执行原始方法\n        long time = System.currentTimeMillis()
    - start;\n        \n        if (time > threshold) {\n            System.err.println(\"慢查询
    [\" + time + \"ms]: \" + sql);\n        }\n        return result;\n    }\n\n    //
    可以在配置时设置阈值\n    @Override\n    public void setProperties(Properties properties)
    {\n        this.threshold = Long.parseLong(properties.getProperty(\"threshold\",
    \"1000\"));\n    }\n}\n```\n\n注册到 MyBatis：\n\n```xml\n<plugins>\n    <plugin interceptor=\"com.example.SlowSqlInterceptor\">\n
    \       <property name=\"threshold\" value=\"500\"/>\n    </plugin>\n</plugins>\n```"

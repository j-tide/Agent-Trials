content:
  prompt: 2、进阶题：Spring Boot 3.x 的 AOT 编译和 GraalVM 原生镜像是什么？有什么优缺点？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（AOT、GraalVM、原生镜像、冷启动优化）

    1️⃣ Common Answer

    GraalVM 可以把 Java 程序编译成原生可执行文件，启动速度很快，内存占用少。但是编译时间很长，而且有些反射代码会有问题。

    2️⃣ Impressive Answer

    - AOT vs JIT 对比：

    - Spring Boot AOT 处理流程：

    ```text
    mvn spring-boot:process-aot
      ↓
    AOT 处理器分析 BeanDefinition
      ↓
    生成静态 Bean 注册代码（替代反射）
      ↓
    生成 GraalVM 反射配置（reflect-config.json）
      ↓
    GraalVM native-image 编译
      ↓
    原生可执行文件（无需 JVM）
    ```

    - 性能对比：

    - Agent 场景适用性：

    - 常见问题：反射、动态代理、序列化需要额外配置 reflect-config.json；第三方库兼容性问题（需要 GraalVM 支持）。


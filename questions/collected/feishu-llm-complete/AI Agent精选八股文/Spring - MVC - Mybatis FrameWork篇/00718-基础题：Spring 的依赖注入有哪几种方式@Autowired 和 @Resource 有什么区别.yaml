  reference_answer: |-
    难度级别：⭐⭐（构造器注入、Setter 注入、字段注入、注解差异）

    1️⃣ Common Answer

    Spring 的依赖注入有三种方式：构造器注入、Setter 注解注入和字段注入。@Autowired 是 Spring 的注解，@Resource 是 JDK 的注解。@Autowired 默认按类型注入，@Resource 默认按名称注入。一般推荐用构造器注入。


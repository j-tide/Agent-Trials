content:
  prompt: "\U0001F680 3. Agent 的 LLM 客户端 Bean 需要在启动时预热连接池，如何利用 Bean 生命周期钩子实现？"
answer:
  mode: rubric
  reference_answer: "在 Agent 系统中，LLM 客户端通常使用 HTTP 连接池（如 OkHttp、Apache HttpClient）与远程模型服务通信。如果不在启动时预热，第一个真实请求会遭遇“冷启动”——连接建立、SSL
    握手等开销导致延迟暴涨。利用 Bean 生命周期，我们可以在 Bean 创建完成后、对外服务前，自动完成预热。\n\n实现方案：InitializingBean
    + @PostConstruct 组合\n\n@Component\npublic class LLMClient implements InitializingBean
    {\n\n    @Value(\"${llm.endpoint}\")\n    private String endpoint;\n\n    @Value(\"${llm.api.key}\")\n
    \   private String apiKey;\n\n    @Value(\"${llm.pool.size:20}\")\n    private
    int poolSize;\n\n    private OkHttpClient httpClient;\n\n    // 阶段一：依赖注入后，立即构建连接池\n
    \   @PostConstruct\n    public void buildPool() {\n        this.httpClient = new
    OkHttpClient.Builder()\n                .connectTimeout(Duration.ofSeconds(10))\n
    \               .readTimeout(Duration.ofSeconds(60))\n                .connectionPool(new
    ConnectionPool(poolSize, 5, TimeUnit.MINUTES))\n                .addInterceptor(chain
    -> {\n                    // 自动附加 API Key\n                    Request req = chain.request().newBuilder()\n
    \                           .header(\"Authorization\", \"Bearer \" + apiKey)\n
    \                           .build();\n                    return chain.proceed(req);\n
    \               })\n                .build();\n    }\n\n    // 阶段二：初始化完成后，预热连接\n
    \   @Override\n    public void afterPropertiesSet() {\n        // 向端点发送一个空的探测请求，提前建立
    TCP 连接和 SSL 会话\n        Request ping = new Request.Builder()\n                .url(endpoint
    + \"/health\")\n                .head()\n                .build();\n        for
    (int i = 0; i < poolSize / 2; i++) {\n            try (Response resp = httpClient.newCall(ping).execute())
    {\n                System.out.println(\"预热连接 \" + (i+1) + \": \" + resp.code());\n
    \           } catch (IOException e) {\n                // 预热失败不应阻塞启动，记录告警即可\n
    \               System.err.println(\"预热连接失败: \" + e.getMessage());\n            }\n
    \       }\n        System.out.println(\"LLM 客户端连接池预热完成，共预热 \" + poolSize/2 + \"
    条连接\");\n    }\n\n    public String complete(String prompt) throws IOException
    {\n        // 真实调用\n        RequestBody body = RequestBody.create(\n                MediaType.parse(\"application/json\"),
    \n                \"{\\\"prompt\\\":\\\"\" + prompt + \"\\\"}\"\n        );\n
    \       Request req = new Request.Builder()\n                .url(endpoint + \"/completions\")\n
    \               .post(body)\n                .build();\n        try (Response
    resp = httpClient.newCall(req).execute()) {\n            return resp.body().string();\n
    \       }\n    }\n}\n\n为什么这样设计？\n\n- @PostConstruct 构建连接池：此时所有 @Value 都已注入，是创建底层资源的恰当时机。将它放在这里而不是
    afterPropertiesSet，是为了遵守“构造后依赖注入，初始化时预热”的清晰边界。\n\n- afterPropertiesSet 预热：利用 InitializingBean
    接口，在 Bean 完全组装后执行网络调用。它比 @PostConstruct 更晚，确保所有其他 Bean 的后置处理（比如可能涉及的代理）已经完成。\n\n-
    预热不影响启动：预热代码捕获了异常，即使远程 LLM 服务暂时不可用，应用也能正常启动，只是后续真实请求需要等待连接建立。\n\n如果需要更彻底的启动时检查，可以引入
    ApplicationRunner：在 Spring Boot 完全启动后，自动跑一次完整的 LLM 调用，并验证返回格式，这可以作为“就绪探针”的一部分。\n\n@Component\npublic
    class LLMHealthChecker implements ApplicationRunner {\n\n    @Autowired\n    private
    LLMClient llmClient;\n\n    @Override\n    public void run(ApplicationArguments
    args) {\n        try {\n            String response = llmClient.complete(\"ping\");\n
    \           if (response == null || response.isEmpty()) {\n                throw
    new RuntimeException(\"LLM 服务返回空响应\");\n            }\n            System.out.println(\"LLM
    服务启动验证通过\");\n        } catch (Exception e) {\n            // 根据业务决定是否终止启动\n            System.err.println(\"LLM
    服务启动验证失败: \" + e.getMessage());\n        }\n    }\n}\n\n利用 @PostConstruct 搭建骨架，用
    InitializingBean 填充肌肉，再用 ApplicationRunner 做最后的全身检查——这套组合拳让 Agent 的 LLM 客户端在启动时就蓄势待发，不为第一个真实请求付出冷启动的代价。这正是
    Spring 生命周期钩子在 AI 工程中的一次务实运用。\n\n---\n\n### 三级缓存与循环依赖"

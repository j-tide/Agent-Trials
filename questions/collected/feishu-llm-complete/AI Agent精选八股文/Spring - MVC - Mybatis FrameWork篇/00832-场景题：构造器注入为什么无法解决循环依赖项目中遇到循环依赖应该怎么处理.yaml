answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（构造器注入时机、@Lazy、重新设计、设计模式）\n\n1️⃣ Common Answer\n\n构造器注入不行是因为创建对象的时候就需要依赖对象，但是对象还没创建好。可以用
    @Lazy 注解，或者改成 setter 注入。\n\n2️⃣ Impressive Answer\n\n- 构造器注入无法解决的原因：\n\n- 解决方案：
    方案 1：使用 @Lazy 注解（推荐）\n\n@Service\npublic class ServiceA {\n    private final ServiceB
    serviceB;\n        \n    public ServiceA(@Lazy ServiceB serviceB) {  // 延迟注入\n
    \       this.serviceB = serviceB;\n    }\n}\n\n-   **原理**：`@Lazy` 会先注入一个代理对象，真正调用时才从容器获取真实
    Bean，打破循环依赖。\n\n**方案 2：改为 setter 注入或 @Autowired 字段注入**\n\n@Service\npublic class
    ServiceA {\n    @Autowired\n    private ServiceB serviceB;  // 字段注入，可以解决循环依赖\n}\n\n**方案
    3：重新设计架构（最佳实践）**\n\n- 引入中间层：A 和 B 都依赖 C，通过 C 通信-   事件驱动：A 发布事件，B 监听事件-   设计模式：使用观察者模式、中介者模式解耦\n\n//
    事件驱动解耦\n@Service\npublic class ServiceA {\n    @Autowired\n    private ApplicationEventPublisher
    eventPublisher;\n        \n    public void doSomething() {\n        eventPublisher.publishEvent(new
    MyEvent());\n    }\n}\n    \n@Service\npublic class ServiceB {\n    @EventListener\n
    \   public void handleEvent(MyEvent event) {\n        // 处理事件\n    }\n}\n\n- 实践建议：\n\n3️⃣
    Key Differences\n\n[嵌入表格未展开]\n\n---"

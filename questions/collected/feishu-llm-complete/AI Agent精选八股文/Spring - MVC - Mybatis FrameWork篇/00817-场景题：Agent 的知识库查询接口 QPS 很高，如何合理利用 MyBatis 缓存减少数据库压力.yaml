content:
  prompt: 3、场景题：Agent 的知识库查询接口 QPS 很高，如何合理利用 MyBatis 缓存减少数据库压力？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（缓存策略、性能优化、Agent 场景）

    1️⃣ Common Answer 开启 MyBatis 的二级缓存，知识库查询走缓存，减少数据库压力。设置缓存过期时间，避免数据过期。用 Redis 做缓存，提高性能。

    2️⃣ Impressive Answer

    - 二级缓存配置：在知识库 Mapper XML 中配置 <cache eviction="LRU" flushInterval="60000" size="1024"/>，使用 LRU 淘汰策略，60 秒刷新，缓存 1024 个对象。注意：实体类实现 Serializable，二级缓存需要序列化。

    - 一级缓存 + 事务优化：在高频查询接口（如 Agent 知识库检索）使用 @Transactional(readOnly = true)，同一事务内多次查询共享一级缓存，避免重复查库。性能提升：单次请求内多次查询相同知识库条目，一级缓存命中率可达 100%。

    - 缓存失效策略：知识库更新时，调用 sqlSession.clearCache() 清空一级缓存；二级缓存通过 flushCache="true" 在 update/delete 时自动失效。Agent 场景：知识库更新频率低，二级缓存命中率高，QPS 1000+ 时 DB 压力可降低 80%。

    - 混合缓存方案：热点知识库条目（如 FAQ）用二级缓存，冷数据用 Redis 分布式缓存；大对象（如向量数据）不缓存，避免内存溢出。监控指标：缓存命中率、缓存大小、DB QPS，通过 MyBatis 插件统计缓存效果。


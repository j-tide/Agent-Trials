content:
  prompt: "\U0001F50D 从 DispatchServlet 到对象的过程"
answer:
  mode: rubric
  reference_answer: |-
    - 识别参数：DispatcherServlet 找到对应的 HandlerMethod 后，遍历参数。发现某个参数标了 @RequestBody，就会去找能处理它的解析器。

    - 指定解析器：RequestResponseBodyMethodProcessor 就是专门处理 @RequestBody 和 @ResponseBody 的。它的 supportsParameter 会返回 true。

    - 读取内容类型：解析器获取请求的 Content-Type 头，比如 application/json。

    - 遍历消息转换器：Spring 容器中注册了一系列 HttpMessageConverter（启动时加载）。解析器拿着目标类型（比如 User.class）和 Content-Type，依次询问每个 Converter 的 canRead()。第一个返回 true 的会被使用。

    - 执行转换：选中的 Converter 调用 read() 方法，从 HttpInputMessage 读取输入流，将字节序列化为 Java 对象。对 JSON 来说，底层就是 Jackson 的 ObjectMapper。

    - 数据绑定与验证：得到对象后，如果还有 @Valid 注解，会触发验证。最终对象作为参数传给控制器方法。

content:
  prompt: 2、进阶题：Spring 的事件机制（ApplicationEvent）如何实现？同步还是异步？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（ApplicationEventPublisher、ApplicationEventMulticaster、@EventListener、@Async）

    1️⃣ Common Answer

    Spring 的事件机制就是发布-订阅模式。用 ApplicationEventPublisher 发布事件，用 @EventListener 监听。默认是同步的，加 @Async 就变成异步了。

    2️⃣ Impressive Answer

    - 发布与监听：ApplicationEventPublisher.publishEvent() 发布事件；监听方式有两种：@EventListener 注解（推荐）或实现 ApplicationListener<T> 接口。

    - 默认同步执行：SimpleApplicationEventMulticaster 默认在发布线程中依次调用所有监听器。这意味着监听器抛异常会影响发布者，耗时操作会阻塞主流程。

    - 异步化方案：

    - 事务事件：@TransactionalEventListener(phase = AFTER_COMMIT) 保证事务提交后才触发监听器，避免"事务未提交，消费者查不到数据"的问题。这是发消息场景的最佳实践。

    - 执行顺序：多个监听器通过 @Order 控制顺序；同步场景下按 Order 值从小到大执行。


content:
  prompt: 1、基础题：Spring Boot 的 SPI 机制是什么？spring.factories 是如何被加载的？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（SPI、SpringFactoriesLoader、类加载机制）

    1️⃣ Common Answer

    spring.factories 是一个配置文件，里面写了要自动加载的类名。Spring Boot 启动时会读取这个文件，然后把里面的类加载进来。这是一种 SPI 机制。

    2️⃣ Impressive Answer

    - SPI 机制本质：SPI（Service Provider Interface）是一种"接口在框架侧定义，实现在使用方提供"的扩展机制。Spring Boot 的 SPI 比 Java 原生 SPI（ServiceLoader）更强大，支持按接口类型分组加载。

    - SpringFactoriesLoader 加载流程：

    ```text
    SpringFactoriesLoader.loadFactoryNames(EnableAutoConfiguration.class, classLoader)
      ↓
    扫描所有 jar 包中的 META-INF/spring.factories
      ↓
    解析 Properties 文件，按 key（接口全限定名）分组
      ↓
    返回对应 key 下的所有实现类名列表
      ↓
    通过反射实例化（loadInstantiatedFactories）
    ```

    - 缓存机制：SpringFactoriesLoader 内部有 cache（Map<ClassLoader, MultiValueMap<String, String>>），同一个 ClassLoader 只解析一次，后续从缓存读取，避免重复 IO。

    - Boot 3.x 的改进：

    ```text
    # Boot 2.x：spring.factories（所有 key 都在一个文件，全量加载）
    org.springframework.boot.autoconfigure.EnableAutoConfiguration=\
      com.example.FooAutoConfiguration,\
      com.example.BarAutoConfiguration

    # Boot 3.x：独立文件（按需加载，只加载 AutoConfiguration）
    # META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports
    com.example.FooAutoConfiguration
    com.example.BarAutoConfiguration
    ```

    Boot 3.x 的改进：不再把所有扩展点放在一个文件，避免加载不需要的扩展点，启动更快。


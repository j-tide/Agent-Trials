content:
  prompt: "\U0001F50C 1. Spring Boot Actuator 有哪些常用的 Endpoint？如何保护敏感 Endpoint？"
answer:
  mode: rubric
  reference_answer: |-
    Actuator 自带几十个端点，我先按功能类型帮你筛一筛真正能用上的：

    ✅ 保护敏感端点的 4 层防线

    - 最小暴露原则

    ```yaml
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus  # 只暴露需要的
            exclude: env,heapdump
    ```

    - 线上环境用白名单比黑名单安全得多。

    - 端口隔离
    把 Actuator 端口和应用端口分开，如 management.server.port=8081，然后在防火墙层只允许监控系统访问。

    - 与 Spring Security 深度集成

    ```java
    http.requestMatchers(EndpointRequest.to("health", "info")).permitAll()
        .requestMatchers(EndpointRequest.toAnyEndpoint()).hasRole("ACTUATOR");
    ```

    - 敏感操作如 loggers、env 必须权限控制。

    - 健康信息脱敏

    ```yaml
    management:
      endpoint:
        health:
          show-details: when-authorized
          roles: ACTUATOR
    ```

    - 这样只有授权用户才能看到磁盘空间、数据库状态等细节，避免信息泄露。


content:
  prompt: 2、进阶题：@EventListener 的实现原理是什么？同步事件和异步事件（@Async）有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（EventListenerMethodProcessor、同步vs异步、异常处理、事务传播）

    1️⃣ Common Answer

    @EventListener 是通过注解扫描的，Spring 会自动注册监听器。同步事件就是发布后立即执行，异步事件用 @Async 可以在另一个线程执行。异步事件不影响主流程。

    2️⃣ Impressive Answer

    - @EventListener 实现原理：

    @Component
    public class MyListener {
        @EventListener(condition = "#event.success")  // 支持 SpEL 条件
        public void handleEvent(MyEvent event) {
            // 处理逻辑
        }
    }

    - 同步事件 vs 异步事件：

    [嵌入表格未展开]

    @Component
    public class AsyncListener {
        @Async  // 异步执行
        @EventListener
        public void handleAsyncEvent(MyEvent event) {
            // 在独立线程执行，不影响主流程
        }
    }


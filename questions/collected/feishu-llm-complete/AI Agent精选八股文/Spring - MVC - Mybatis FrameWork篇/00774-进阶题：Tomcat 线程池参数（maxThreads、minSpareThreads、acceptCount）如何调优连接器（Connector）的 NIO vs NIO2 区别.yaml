content:
  prompt: 2、进阶题：Tomcat 线程池参数（maxThreads、minSpareThreads、acceptCount）如何调优？连接器（Connector）的
    NIO vs NIO2 区别？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（线程池调优、NIO 模型）\n\n1️⃣ Common Answer\n\nTomcat 线程池参数调大一点，maxThreads
    设置 200，acceptCount 设置 100。NIO 比 NIO2 快，具体区别不太清楚。\n\n2️⃣ Impressive Answer\n\n我从
    4 个维度解析：\n\n- Tomcat 线程池参数：\n\n[嵌入表格未展开]\n\n- 线程池调优策略：\n\n```text\n# application.yml\nserver:\n
    \ tomcat:\n    threads:\n      max: 500\n      min-spare: 50\n      max-queue:
    200\n    accept-count: 200\n    max-connections: 10000\n    connection-timeout:
    30000\n```\n\n调优公式：\n\n- maxThreads = CPU 核数 × (1 + 等待时间 / 计算时间)\n\n- minSpareThreads
    = maxThreads × 10%\n\n- acceptCount = maxThreads × 40%\n\n- NIO vs NIO2 区别：\n\n[嵌入表格未展开]\n\n-
    性能优化实践：\n\n```text\n@Configuration\npublic class TomcatConfig {\n    \n    @Bean\n
    \   public WebServerFactoryCustomizer<TomcatServletWebServerFactory> tomcatCustomizer()
    {\n        return factory -> {\n            // 自定义连接器\n            Connector connector
    = new Connector(\"org.apache.coyote.http11.Http11Nio2Protocol\");\n            connector.setPort(8080);\n
    \           connector.setMaxThreads(500);\n            connector.setMinSpareThreads(50);\n
    \           connector.setAcceptCount(200);\n            connector.setMaxConnections(10000);\n
    \           connector.setConnectionTimeout(30000);\n            \n            //
    启用压缩\n            connector.setProperty(\"compression\", \"on\");\n            connector.setProperty(\"compressionMinSize\",
    \"1024\");\n            connector.setProperty(\"compressableMimeType\", \n                \"text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json\");\n
    \           \n            factory.addAdditionalTomcatConnectors(connector);\n
    \       };\n    }\n}\n```\n\n- Agent 场景：高并发 Agent 调用优化\n\n```text\n@Configuration\npublic
    class AgentPerformanceConfig {\n    \n    // Tomcat 线程池优化\n    @Bean\n    public
    WebServerFactoryCustomizer<TomcatServletWebServerFactory> tomcatCustomizer() {\n
    \       return factory -> {\n            factory.addConnectorCustomizers(connector
    -> {\n                Http11Nio2Protocol protocol = (Http11Nio2Protocol) connector.getProtocolHandler();\n
    \               protocol.setMaxThreads(500);\n                protocol.setMinSpareThreads(50);\n
    \               protocol.setAcceptCount(200);\n                protocol.setMaxConnections(10000);\n
    \           });\n        };\n    }\n    \n    // 异步任务线程池\n    @Bean(\"agentTaskExecutor\")\n
    \   public Executor agentTaskExecutor() {\n        ThreadPoolTaskExecutor executor
    = new ThreadPoolTaskExecutor();\n        executor.setCorePoolSize(20);\n        executor.setMaxPoolSize(100);\n
    \       executor.setQueueCapacity(500);\n        executor.setThreadNamePrefix(\"agent-task-\");\n
    \       executor.setRejectedExecutionHandler(new ThreadPoolExecutor.CallerRunsPolicy());\n
    \       executor.initialize();\n        return executor;\n    }\n    \n    //
    连接池优化\n    @Bean\n    public RestTemplate restTemplate() {\n        HttpComponentsClientHttpRequestFactory
    factory = \n            new HttpComponentsClientHttpRequestFactory();\n        factory.setConnectTimeout(5000);\n
    \       factory.setReadTimeout(30000);\n        factory.setConnectionRequestTimeout(5000);\n
    \       \n        // 连接池配置\n        PoolingHttpClientConnectionManager connectionManager
    = \n            new PoolingHttpClientConnectionManager();\n        connectionManager.setMaxTotal(200);\n
    \       connectionManager.setDefaultMaxPerRoute(50);\n        \n        CloseableHttpClient
    httpClient = HttpClients.custom()\n            .setConnectionManager(connectionManager)\n
    \           .build();\n        \n        factory.setHttpClient(httpClient);\n
    \       return new RestTemplate(factory);\n    }\n}\n```\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

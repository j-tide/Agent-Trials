content:
  prompt: "⚙️ HttpMessageConverter 接口深度剖析"
answer:
  mode: rubric
  reference_answer: |-
    ```java
    public interface HttpMessageConverter<T> {

        boolean canRead(Class<?> clazz, MediaType mediaType);
        boolean canWrite(Class<?> clazz, MediaType mediaType);

        List<MediaType> getSupportedMediaTypes();

        T read(Class<? extends T> clazz, HttpInputMessage inputMessage)
                throws IOException, HttpMessageNotReadableException;

        void write(T t, MediaType contentType, HttpOutputMessage outputMessage)
                throws IOException, HttpMessageNotWritableException;
    }
    ```

    - canRead：判断能否把请求体转换成目标 Java 类型，并支持指定的 MediaType。

    - read：真正干活的方法，输入是 HTTP 输入流，输出是对象。

    - write：用于 @ResponseBody 把对象写到输出流。

    Spring 自带一些常用实现：
    MappingJackson2HttpMessageConverter → application/json
    StringHttpMessageConverter → text/plain
    FormHttpMessageConverter → application/x-www-form-urlencoded
    ByteArrayHttpMessageConverter → 处理二进制等。

    默认序列化是如何支持的？ 当我们引入 spring-boot-starter-web，自动配置会注册 MappingJackson2HttpMessageConverter，所以 REST 接口天然支持 JSON。

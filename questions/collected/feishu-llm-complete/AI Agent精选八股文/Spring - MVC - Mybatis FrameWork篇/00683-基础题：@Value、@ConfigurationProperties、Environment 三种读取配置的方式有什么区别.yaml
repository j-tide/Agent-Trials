  prompt: 1、基础题：@Value、@ConfigurationProperties、Environment 三种读取配置的方式有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（配置注入、类型安全、松耦合）

    Answer

    - @Value：直接注入单个配置值，支持 SpEL 表达式，适合简单配置。

    - @ConfigurationProperties：批量注入配置到 Bean，类型安全，支持嵌套对象，适合复杂配置。

    - Environment：编程式读取配置，灵活但繁琐，适合动态读取。


  prompt: "\U0001F50D 4. Nacos 作为注册中心和配置中心的核心原理？与 Eureka 的区别？"
answer:
  mode: rubric
  reference_answer: |-
    Nacos 是阿里巴巴开源的服务发现和配置管理平台，它把 注册中心 和 配置中心 合二为一，核心优势在于对 CAP 理论的灵活支持，以及比 Eureka 更丰富的数据模型。

    4.1 注册中心核心原理

    - 数据模型：Nacos 将服务信息抽象为 Namespace → Group → Service → Cluster → Instance 五层结构，天然支持多环境隔离、同城多活。

    - 注册与发现机制：

    - 健康检查：

    - 集群模式与 CAP 切换：

    4.2 配置中心核心原理

    - 配置存储：配置数据保存在内置 Derby（单机）或 MySQL（集群）中，Nacos Server 启动时加载到内存。

    - 配置推送：客户端通过长轮询（Long Polling）监听配置变更。客户端发起监听请求，服务端阻塞 30s 等待配置变化，如果有变化则立即返回新配置；若超时则返回空，客户端马上发起下一次长轮询。这种方式既保证了实时性，又避免了轮询风暴。

    - 动态刷新：配合 Spring Cloud Alibaba Nacos Config，使用 @RefreshScope 或 @Value + RefreshAutoConfiguration，可在运行时刷新 Bean。

    4.3 与 Eureka 的核心区别

    [嵌入表格未展开]

    Eureka 的自我保护模式虽然避免了因网络分区导致的大量实例误剔，但在实际生产中也容易掩盖真正下线的服务，导致调用失败。而 Nacos 通过 AP/CP 模式切换 解决了这个难题。


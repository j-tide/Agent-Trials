content:
  prompt: 1、基础题：MyBatis 的 ResultMap 和 resultType 有什么区别？什么时候必须用 ResultMap？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（自动映射 vs 手动映射、字段名不一致、复杂映射场景）

    1️⃣ Common Answer resultType 是自动映射，数据库字段名和 Java 属性名一样就能直接映射。ResultMap 是手动映射，需要自己配置字段对应关系。如果字段名不一样或者需要关联查询，就用 ResultMap。

    2️⃣ Impressive Answer

    - resultType 自动映射：resultType="com.example.User" 基于 Java Bean 规范，通过反射自动映射，要求数据库列名和 Java 属性名完全一致（或遵循驼峰命名转换）。适用场景：简单查询、单表映射、字段名规范。

    - ResultMap 手动映射：<resultMap id="userMap" type="User"> 精确控制字段映射关系，通过 <result column="db_name" property="javaName"/> 指定映射。必须用 ResultMap 的场景：字段名不一致、多表关联、复杂类型映射、需要延迟加载。

    - 高级映射能力：ResultMap 支持 association（一对一）、collection（一对多）、discriminator（鉴别器）等高级映射，能解决复杂对象关系映射问题。resultType 无法处理这些场景。

    - 性能差异：resultType 性能略优（直接反射），ResultMap 需要解析配置；但 ResultMap 的可维护性更好，字段变更只需修改配置，不改 Java 代码。

    3️⃣ Key Differences


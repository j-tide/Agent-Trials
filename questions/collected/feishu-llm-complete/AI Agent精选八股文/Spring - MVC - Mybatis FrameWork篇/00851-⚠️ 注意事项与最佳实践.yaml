answer:
  mode: rubric
  reference_answer: |-
    - 请求体只能读取一次：如果在过滤器或拦截器中读取了 request.getInputStream()，到 @RequestBody 解析时流已经关闭，会报错。遇到这种情况要用 ContentCachingRequestWrapper 包装请求。

    - 大请求体流式处理：如果文件上传用 @RequestBody 不合适，内存会爆，应该用 MultipartFile 或流式转换（如 StreamingResponseBody 的逆操作）。

    - 性能：Jackson 默认会反序列化整个 JSON 到对象，如果只想取部分值，可以用 JsonNode 配合 @RequestBody 手动处理。

    - 定制 ObjectMapper：可以通过 Jackson2ObjectMapperBuilder 配置全局序列化规则，或通过 @JsonView 控制输出。

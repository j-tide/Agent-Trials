answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（Reactor 核心、背压机制、流式处理）\n\n1️⃣ Common Answer\n\nMono 是处理
    0-1 个元素的，Flux 是处理 0-N 个元素的。背压就是控制数据流的速度，防止消费者处理不过来。\n\n2️⃣ Impressive Answer\n\n-
    Mono 和 Flux：\n\n- 背压机制：\n\n- 背压示例：\n\n```text\n// Flux 背压示例\nFlux.range(1, 1000)\n
    \   .log()\n    .subscribe(new BaseSubscriber<Integer>() {\n        @Override\n
    \       protected void hookOnSubscribe(Subscription subscription) {\n            request(10);
    // 初始请求 10 个元素\n        }\n        \n        @Override\n        protected void
    hookOnNext(Integer value) {\n            try {\n                Thread.sleep(100);
    // 模拟慢速处理\n            } catch (InterruptedException e) {\n                //
    ignore\n            }\n            request(1); // 每处理完一个再请求一个\n        }\n    });\n```\n\n-
    Agent 场景：\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

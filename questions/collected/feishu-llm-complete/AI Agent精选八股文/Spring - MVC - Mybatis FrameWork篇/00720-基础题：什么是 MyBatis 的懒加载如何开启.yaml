content:
  prompt: 1、基础题：什么是 MyBatis 的懒加载？如何开启？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（懒加载概念、配置方式、延迟查询）

    1️⃣ Common Answer 懒加载就是用到的时候才查询关联数据，不用的时候不查。在 mybatis-config.xml 里配置 lazyLoadingEnabled=true 开启。关联查询用 association 或 collection。

    2️⃣ Impressive Answer

    - 懒加载概念：懒加载（延迟加载）指在查询主对象时，不立即查询关联对象，而是在访问关联对象属性时才触发查询。好处：避免一次性加载大量数据，减少内存占用和数据库压力。

    - 配置方式：在 mybatis-config.xml 中配置：

    ```text
    <settings>
        <setting name="lazyLoadingEnabled" value="true"/>
        <setting name="aggressiveLazyLoading" value="false"/>
    </settings>
    ```

    lazyLoadingEnabled=true 开启懒加载，aggressiveLazyLoading=false 关闭激进懒加载（只加载被调用的属性，而非所有属性）。

    - 关联查询配置：在 Mapper XML 中使用 association 或 collection，设置 fetchType="lazy"：

    ```text
    <resultMap id="sessionResultMap" type="Session">
        <id property="id" column="id"/>
        <collection property="messages" ofType="Message" fetchType="lazy">
            <id property="id" column="msg_id"/>
        </collection>
    </resultMap>
    ```

    - 底层实现：懒加载通过 CGLIB 代理实现，代理对象拦截 getMessages() 方法，触发 SQL 查询。注意：懒加载要求 SqlSession 未关闭，否则报错；Spring 整合后需在事务内访问懒加载属性。


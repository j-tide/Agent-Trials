content:
  prompt: "\U0001F4DD 方案二：使用 SQL 构建器（Java API 动态拼接）"
answer:
  mode: rubric
  reference_answer: |-
    当条件太多、组合复杂，XML 会变得臃肿，这时可以用 MyBatis 自带的 SQL 类（org.apache.ibatis.jdbc.SQL）或以 SelectProvider 的方式在 Java 代码中构建。

    动态构建的 Provider 类：

    ```java
    public class UserSqlProvider {
        public String buildQuery(Map<String, Object> params) {
            String name = (String) params.get("name");
            BigDecimal minAmount = (BigDecimal) params.get("minAmount");
            Boolean vip = (Boolean) params.get("vip");

            return new SQL() {{
                SELECT("*");
                FROM("users");
                if (name != null && !name.isEmpty()) {
                    WHERE("name LIKE CONCAT('%', #{name}, '%')");
                }
                if (minAmount != null) {
                    WHERE("total_amount >= #{minAmount}");
                }
                if (vip != null && vip) {
                    WHERE("is_vip = 1");
                }
                // 排序字段必须从白名单取值后再拼
            }}.toString();
        }
    }
    ```

    Mapper 接口：

    ```java
    @SelectProvider(type = UserSqlProvider.class, method = "buildQuery")
    List<User> queryUsersDynamic(Map<String, Object> params);
    ```

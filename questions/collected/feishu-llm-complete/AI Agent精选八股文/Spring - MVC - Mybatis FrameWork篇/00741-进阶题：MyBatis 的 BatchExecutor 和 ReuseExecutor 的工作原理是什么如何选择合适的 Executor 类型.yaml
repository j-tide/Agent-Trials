content:
  prompt: 2、进阶题：MyBatis 的 BatchExecutor 和 ReuseExecutor 的工作原理是什么？如何选择合适的 Executor
    类型？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（Executor 类型、批处理原理、Statement 复用）

    1️⃣ Common Answer BatchExecutor 是批量执行，ReuseExecutor 是复用 Statement。BatchExecutor 适合批量插入，ReuseExecutor 适合重复执行相同的 SQL。一般用默认的 SimpleExecutor 就行。

    2️⃣ Impressive Answer

    - SimpleExecutor（默认）：每次执行 SQL 都创建新的 PreparedStatement，执行完立即关闭。适用场景：普通 CRUD 操作，SQL 不重复，简单直接。

    - ReuseExecutor：内部维护 Map<String, Statement>，相同 SQL 复用同一个 PreparedStatement，只重新设置参数。原理：StatementId = SQL + 数据库 作为 key，执行时先从缓存获取，不存在则创建。适用场景：循环执行相同 SQL（如批量更新不同记录），减少 PreparedStatement 创建开销。

    - BatchExecutor：批量执行 SQL，内部维护 List<BatchResult>，每次 update/insert 将 SQL 和参数加入批处理队列，flushStatements() 时一次性提交。原理：JDBC 的 addBatch() + executeBatch()，减少网络交互。适用场景：大批量插入/更新（如 Agent 消息记录归档）。

    - 选择策略：普通操作用 SimpleExecutor；循环执行相同 SQL 用 ReuseExecutor；大批量操作用 BatchExecutor。Spring 配置：<bean id="sqlSessionFactory" class="org.mybatis.spring.SqlSessionFactoryBean"><property name="configuration"><bean class="org.apache.ibatis.session.Configuration"><property name="defaultExecutorType" value="BATCH"/></bean></property></bean>。


content:
  prompt: 3、场景题：Agent 平台多环境配置如何用 @Profile + @ConditionalOnProperty 管理？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（环境隔离、条件装配、配置优先级）\n\n1️⃣ Common Answer\n\n可以用 @Profile
    区分开发、测试、生产环境，用 @ConditionalOnProperty 根据配置决定是否加载某个 Bean。比如开发环境用 Mock LLM，生产环境用真实
    LLM。\n\n2️⃣ Impressive Answer\n\n- @Profile 环境隔离：\n\n@Profile(\"dev\")\n@Configuration\npublic
    class DevConfig {\n    @Bean\n    public LLMProvider mockLLM() {\n        return
    new MockLLMProvider();  // 开发环境用 Mock\n    }\n}\n    \n@Profile(\"prod\")\n@Configuration\npublic
    class ProdConfig {\n    @Bean\n    public LLMProvider openaiLLM() {\n        return
    new OpenAIProvider();  // 生产环境用真实 LLM\n    }\n}\n    \n// 激活环境\n@SpringBootApplication\npublic
    class AgentApplication {\n    public static void main(String[] args) {\n        SpringApplication.run(AgentApplication.class,
    \"--spring.profiles.active=dev\");\n    }\n}\n\n- @ConditionalOnProperty 功能开关：\n\n@Configuration\npublic
    class ToolConfig {\n    @Bean\n    @ConditionalOnProperty(name = \"agent.tools.enabled\",
    havingValue = \"true\")\n    public ToolRegistry toolRegistry() {\n        return
    new DefaultToolRegistry();  // 工具功能开启时才加载\n    }\n        \n    @Bean\n    @ConditionalOnMissingBean(ToolRegistry.class)\n
    \   public ToolRegistry emptyToolRegistry() {\n        return new EmptyToolRegistry();
    \ // 工具功能关闭时用空实现\n    }\n}\n    \n// application-dev.yml\nagent:\n  tools:\n    enabled:
    true  // 开发环境开启工具\n    \n// application-prod.yml\nagent:\n  tools:\n    enabled:
    false  // 生产环境关闭工具\n\n- 组合使用：\n\n@Profile(\"dev\")\n@ConditionalOnProperty(name
    = \"agent.mock.enabled\")\n@Configuration\npublic class DevMockConfig {\n    //
    仅在 dev 环境且 agent.mock.enabled=true 时生效\n}\n\n- 配置优先级：application-{profile}.yml
    > application.yml，环境特定配置会覆盖默认配置。\n\n- Agent 场景实战：开发环境用 @Profile(\"dev\") + Mock
    LLM + 本地向量库，测试环境用真实 LLM + 测试向量库，生产环境用企业级 LLM + 云向量库，通过 @ConditionalOnProperty
    控制审计日志、计费等功能的开关。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

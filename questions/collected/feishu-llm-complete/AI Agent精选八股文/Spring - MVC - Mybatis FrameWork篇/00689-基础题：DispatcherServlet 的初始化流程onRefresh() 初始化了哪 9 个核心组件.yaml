content:
  prompt: 1、基础题：DispatcherServlet 的初始化流程？onRefresh() 初始化了哪 9 个核心组件？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（DispatcherServlet 生命周期、9 个核心组件）

    Answer

    DispatcherServlet 继承自 FrameworkServlet，初始化流程：

    ```text
    Servlet 容器启动 → init() → HttpServletBean.init()
      → FrameworkServlet.initServletBean() → initWebApplicationContext()
      → DispatcherServlet.onRefresh() → 初始化 9 个核心组件
    ```

    onRefresh() 初始化的 9 个核心组件：

    - MultipartResolver：文件上传解析器

    - LocaleResolver：国际化解析器

    - ThemeResolver：主题解析器

    - HandlerMapping：请求映射处理器（URL → Controller）

    - HandlerAdapter：处理器适配器（执行 Controller 方法）

    - HandlerExceptionResolver：异常解析器

    - RequestToViewNameTranslator：视图名转换器

    - ViewResolver：视图解析器

    - FlashMapManager：Flash 属性管理器（Redirect 参数传递）


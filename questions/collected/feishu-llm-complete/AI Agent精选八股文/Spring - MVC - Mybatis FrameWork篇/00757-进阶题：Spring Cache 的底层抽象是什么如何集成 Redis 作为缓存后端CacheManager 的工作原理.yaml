content:
  prompt: 2、进阶题：Spring Cache 的底层抽象是什么？如何集成 Redis 作为缓存后端？CacheManager 的工作原理？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（Cache 接口、CacheManager、序列化、过期策略）\n\n1️⃣ Common Answer\n\nSpring
    Cache 有一个 Cache 接口，然后有 RedisCache、ConcurrentMapCache 这些实现。集成 Redis 需要引入 spring-boot-starter-data-redis，然后配置
    Redis 连接。CacheManager 是管理缓存的。\n\n2️⃣ Impressive Answer\n\n- 核心抽象：\n\n- 集成 Redis
    完整配置：\n\n@Configuration\n@EnableCaching\npublic class CacheConfig {\n    @Bean\n
    \   public RedisCacheManager cacheManager(RedisConnectionFactory factory) {\n
    \       RedisCacheConfiguration config = RedisCacheConfiguration.defaultCacheConfig()\n
    \           .entryTtl(Duration.ofMinutes(30))  // 默认过期时间\n            .serializeKeysWith(RedisSerializationContext.SerializationPair\n
    \               .fromSerializer(new StringRedisSerializer()))\n            .serializeValuesWith(RedisSerializationContext.SerializationPair\n
    \               .fromSerializer(new GenericJackson2JsonRedisSerializer()));\n
    \           \n        Map<String, RedisCacheConfiguration> cacheConfigurations
    = new HashMap<>();\n        cacheConfigurations.put(\"users\", config.entryTtl(Duration.ofHours(1)));\n
    \       cacheConfigurations.put(\"tools\", config.entryTtl(Duration.ofMinutes(10)));\n
    \           \n        return RedisCacheManager.builder(factory)\n            .cacheDefaults(config)\n
    \           .withInitialCacheConfigurations(cacheConfigurations)\n            .transactionAware()
    \ // 支持事务，事务回滚时清除缓存\n            .build();\n    }\n\n- CacheManager 工作原理：\n\n-
    序列化选择：\n\n- Agent 场景：工具调用结果缓存时，key 使用 toolName::hash(params)（参数哈希避免 key 过长），value
    使用 JSON 序列化，过期时间根据工具特性设置（如天气 10 分钟，搜索 1 小时）。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

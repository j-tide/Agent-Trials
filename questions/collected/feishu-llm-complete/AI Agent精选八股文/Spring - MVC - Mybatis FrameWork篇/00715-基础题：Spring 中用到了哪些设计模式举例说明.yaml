  prompt: 1、基础题：Spring 中用到了哪些设计模式？举例说明
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（工厂、单例、代理、模板方法、观察者、策略、适配器）

    1️⃣ Common Answer

    Spring 用了很多设计模式。比如工厂模式用在 BeanFactory，单例模式是 Bean 默认的作用域，代理模式用在 AOP，模板方法用在 JdbcTemplate。还有观察者模式用在事件机制。

    2️⃣ Impressive Answer

    Spring 框架是设计模式的教科书级应用，我从 7 个核心模式来说：

    - 工厂模式：BeanFactory / ApplicationContext 是 Bean 的工厂，根据 BeanDefinition 创建对象。FactoryBean 接口让用户自定义复杂 Bean 的创建逻辑。

    - 单例模式：Bean 默认 Singleton 作用域，通过三级缓存（singletonObjects）保证全局唯一。不是传统的私有构造器单例，而是容器级别的单例。

    - 代理模式：AOP 的核心，JDK 动态代理（接口）和 CGLIB（类）。@Transactional、@Async、@Cacheable 都是通过代理实现的。

    - 模板方法模式：JdbcTemplate、RestTemplate、TransactionTemplate——定义算法骨架，子类/回调实现具体步骤。

    - 观察者模式：ApplicationEvent + ApplicationListener，事件发布-订阅机制，实现组件间松耦合通信。

    - 策略模式：Resource 接口的多种实现（ClassPathResource、FileSystemResource、UrlResource），根据前缀自动选择策略。

    - 适配器模式：HandlerAdapter 适配不同类型的 Controller（注解式、实现 Controller 接口式），统一调用接口。


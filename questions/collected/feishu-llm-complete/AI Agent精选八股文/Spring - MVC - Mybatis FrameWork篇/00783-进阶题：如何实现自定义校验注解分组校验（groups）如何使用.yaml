content:
  prompt: 2、进阶题：如何实现自定义校验注解？分组校验（groups）如何使用？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（ConstraintValidator、分组接口、@GroupSequence）\n\n1️⃣ Common
    Answer\n\n自定义校验注解需要定义注解类和实现 ConstraintValidator 接口。比如 @PhoneNumber 校验手机号格式。分组校验就是定义几个接口，比如
    Create.class 和 Update.class，然后在注解上指定 groups，Controller 里用 @Validated(Create.class)。\n\n2️⃣
    Impressive Answer\n\n- 自定义校验注解：\n\n```text\n@Target({ElementType.FIELD})\n@Retention(RetentionPolicy.RUNTIME)\n@Constraint(validatedBy
    = PhoneNumberValidator.class)\npublic @interface PhoneNumber {\n    String message()
    default \"手机号格式不正确\";\n    Class<?>[] groups() default {};\n    Class<? extends
    Payload>[] payload() default {};\n}\n\npublic class PhoneNumberValidator implements
    ConstraintValidator<PhoneNumber, String> {\n    private static final Pattern PATTERN
    = Pattern.compile(\"^1[3-9]\\\\d{9}$\");\n    \n    @Override\n    public boolean
    isValid(String value, ConstraintValidatorContext context) {\n        if (value
    == null) return true;  // @NotNull 负责判空\n        return PATTERN.matcher(value).matches();\n
    \   }\n}\n```\n\n- 分组校验：\n\n```text\npublic interface Create {}\npublic interface
    Update {}\n\npublic class UserDTO {\n    @Null(groups = Update.class, message
    = \"创建时 ID 必须为空\")\n    @NotNull(groups = Create.class, message = \"更新时 ID 不能为空\")\n
    \   private Long id;\n    \n    @NotBlank(groups = {Create.class, Update.class})\n
    \   @PhoneNumber(groups = {Create.class, Update.class})\n    private String phone;\n}\n\n@PostMapping\npublic
    Result<Long> create(@Validated(Create.class) UserDTO dto) { /* 创建逻辑 */ }\n\n@PutMapping\npublic
    Result<Void> update(@Validated(Update.class) UserDTO dto) { /* 更新逻辑 */ }\n```\n\n-
    @GroupSequence：控制分组校验顺序，前一组失败则不执行后续组：\n\n```text\n@GroupSequence({Default.class,
    Create.class, Advanced.class})\npublic interface FullValidation {}\n```\n\n- 跨字段校验：类级别注解
    + 类级别 Validator，如密码和确认密码一致性校验。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

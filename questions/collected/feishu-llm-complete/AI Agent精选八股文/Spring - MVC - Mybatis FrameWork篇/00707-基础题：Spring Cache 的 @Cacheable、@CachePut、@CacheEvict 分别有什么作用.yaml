content:
  prompt: 1、基础题：Spring Cache 的 @Cacheable、@CachePut、@CacheEvict 分别有什么作用？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（缓存注解、缓存策略、key 生成）\n\n1️⃣ Common Answer\n\n@Cacheable
    是缓存方法结果，下次调用直接返回缓存。@CachePut 是每次都执行方法，然后把结果放入缓存。@CacheEvict 是删除缓存。可以指定缓存名称和 key。\n\n2️⃣
    Impressive Answer\n\n- 三个核心注解：\n\n- 关键参数：\n\n- 使用示例：\n\n@Cacheable(value = \"users\",
    key = \"#userId\", unless = \"#result == null\")\npublic User getUser(Long userId)
    { ... }\n    \n@CachePut(value = \"users\", key = \"#user.id\")\npublic User updateUser(User
    user) { ... }\n    \n@CacheEvict(value = \"users\", key = \"#userId\")\npublic
    void deleteUser(Long userId) { ... }\n    \n@Caching(evict = {\n    @CacheEvict(value
    = \"users\", key = \"#userId\"),\n    @CacheEvict(value = \"userOrders\", allEntries
    = true)\n})\npublic void deleteUserAndOrders(Long userId) { ... }\n\n- 注意事项：@Cacheable
    和 @CachePut 不能用在同一个类的方法上互相调用（因为 Spring AOP 代理限制，内部调用不会触发缓存逻辑）。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

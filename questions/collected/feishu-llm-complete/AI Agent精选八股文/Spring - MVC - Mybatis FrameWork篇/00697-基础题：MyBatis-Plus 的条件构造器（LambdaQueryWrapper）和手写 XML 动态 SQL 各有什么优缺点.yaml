answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（条件构造器、动态 SQL、代码可读性）

    1️⃣ Common Answer LambdaQueryWrapper 用 Java 代码写查询，方便，不用写 XML。XML 动态 SQL 灵活，复杂查询用 XML。LambdaQueryWrapper 类型安全，XML 容易写错。

    2️⃣ Impressive Answer

    - LambdaQueryWrapper 优点：

    ```text
    LambdaQueryWrapper<User> wrapper = new LambdaQueryWrapper<>();
    wrapper.eq(User::getStatus, "ACTIVE")
           .like(StringUtils.isNotBlank(name), User::getName, name)
           .ge(User::getCreateTime, startTime);
    ```

    - 链式调用：API 设计优雅，代码简洁。


content:
  prompt: "\U0001F680 进阶：利用 MySQL 的 JSON 函数查询"
answer:
  mode: rubric
  reference_answer: |-
    有时候我们需要对 JSON 内部字段进行查询，比如查询包含某个 tool_call 的会话。MyBatis 依然可以安全使用预编译：

    ```xml
    <select id="findByToolName" resultMap="conversationMap">
        SELECT * FROM agent_conversation
        WHERE JSON_CONTAINS(messages, #{toolName}, '$.tool_calls[*].function.name')
    </select>
    ```

    参数用 #{toolName} 安全预编译。建议在业务层对这些函数做一层封装，避免 SQL 散落各处。

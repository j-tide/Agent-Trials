content:
  prompt: 2、进阶题：@EnableWebMvc 和 Spring Boot 自动配置的冲突问题？WebMvcAutoConfiguration 的加载条件？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（自动配置、加载条件、冲突处理）\n\n1️⃣ Common Answer\n\n@EnableWebMvc
    会禁用 Spring Boot 的自动配置，好像是因为它会覆盖默认配置。WebMvcAutoConfiguration 有一些条件注解。\n\n2️⃣ Impressive
    Answer\n\n我从 4 个维度解析：\n\n- @EnableWebMvc 的影响：\n\n- WebMvcAutoConfiguration 加载条件：\n\n```text\n@Configuration(proxyBeanMethods
    = false)\n@ConditionalOnWebApplication(type = Type.SERVLET)\n@ConditionalOnClass({
    Servlet.class, DispatcherServlet.class, WebMvcConfigurer.class })\n@ConditionalOnMissingBean(WebMvcConfigurationSupport.class)
    // 关键条件\n@AutoConfigureOrder(Ordered.HIGHEST_PRECEDENCE + 10)\n@AutoConfigureAfter({
    DispatcherServletAutoConfiguration.class, TaskExecutionAutoConfiguration.class,\n
    \       ValidationAutoConfiguration.class })\npublic class WebMvcAutoConfiguration
    {\n    // ...\n}\n```\n\n关键条件：@ConditionalOnMissingBean(WebMvcConfigurationSupport.class)\n\n-
    当容器中存在 WebMvcConfigurationSupport Bean 时，WebMvcAutoConfiguration 不加载\n\n- @EnableWebMvc
    会导入 DelegatingWebMvcConfiguration（继承自 WebMvcConfigurationSupport）\n\n- 因此，使用 @EnableWebMvc
    会禁用自动配置\n\n- 三种配置方式对比：\n\n[嵌入表格未展开]\n\n- 推荐配置方式：\n\n```text\n// ❌ 不推荐：禁用自动配置\n@Configuration\n@EnableWebMvc\npublic
    class WebConfig implements WebMvcConfigurer {\n    // 需要手动配置所有组件\n}\n\n// ✅ 推荐：保留自动配置，扩展自定义配置\n@Configuration\npublic
    class WebConfig implements WebMvcConfigurer {\n    // 只配置需要自定义的部分\n    @Override\n
    \   public void addInterceptors(InterceptorRegistry registry) {\n        registry.addInterceptor(new
    AgentInterceptor())\n            .addPathPatterns(\"/api/agent/**\");\n    }\n}\n```\n\n-
    Agent 场景：统一配置 Agent 平台组件\n\n```text\n@Configuration\npublic class AgentWebConfig
    implements WebMvcConfigurer {\n    \n    @Autowired\n    private AgentProperties
    agentProperties;\n    \n    // 统一注册 Agent 参数解析器\n    @Override\n    public void
    addArgumentResolvers(List<HandlerMethodArgumentResolver> resolvers) {\n        resolvers.add(new
    AgentContextResolver());\n        resolvers.add(new AgentTokenResolver());\n        resolvers.add(new
    AgentVersionResolver());\n    }\n    \n    // 统一注册 Agent 拦截器\n    @Override\n
    \   public void addInterceptors(InterceptorRegistry registry) {\n        registry.addInterceptor(new
    AgentAuthInterceptor())\n            .addPathPatterns(\"/api/agent/**\")\n            .excludePathPatterns(\"/api/agent/public/**\");\n
    \       \n        registry.addInterceptor(new AgentLoggingInterceptor())\n            .addPathPatterns(\"/api/agent/**\");\n
    \       \n        registry.addInterceptor(new AgentRateLimitInterceptor())\n            .addPathPatterns(\"/api/agent/**\");\n
    \   }\n    \n    // 统一注册 Agent 消息转换器\n    @Override\n    public void extendMessageConverters(List<HttpMessageConverter<?>>
    converters) {\n        // Protobuf 转换器\n        converters.add(0, new ProtobufHttpMessageConverter());\n
    \       \n        // 自定义 JSON 转换器（Agent 特定格式）\n        converters.add(1, new AgentJsonHttpMessageConverter());\n
    \   }\n    \n    // 统一配置跨域\n    @Override\n    public void addCorsMappings(CorsRegistry
    registry) {\n        registry.addMapping(\"/api/agent/**\")\n            .allowedOrigins(agentProperties.getAllowedOrigins())\n
    \           .allowedMethods(\"GET\", \"POST\", \"PUT\", \"DELETE\")\n            .allowedHeaders(\"*\")\n
    \           .allowCredentials(true);\n    }\n}\n```\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

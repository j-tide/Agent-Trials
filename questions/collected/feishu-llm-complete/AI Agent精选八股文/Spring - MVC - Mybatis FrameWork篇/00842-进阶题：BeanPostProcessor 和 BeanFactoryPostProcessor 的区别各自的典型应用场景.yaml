content:
  prompt: 6、进阶题：BeanPostProcessor 和 BeanFactoryPostProcessor 的区别？各自的典型应用场景？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（扩展点体系、Bean 定义修改 vs 实例增强、AOP 代理创建时机）

    1️⃣ Common Answer

    BeanPostProcessor 是在 Bean 初始化前后做一些处理，BeanFactoryPostProcessor 是在 Bean 定义加载后做修改。Spring AOP 就是通过 BeanPostProcessor 实现的。两个都是 Spring 的扩展点。

    2️⃣ Impressive Answer

    - 作用时机不同：BeanFactoryPostProcessor 在 Bean 定义加载完成后、实例化之前执行，操作的是 BeanDefinition（元数据）；BeanPostProcessor 在 Bean 实例化之后、初始化前后执行，操作的是 Bean 实例本身。

    - 典型应用：BeanFactoryPostProcessor 的经典实现是 PropertySourcesPlaceholderConfigurer，负责解析 ${} 占位符替换配置值；BeanPostProcessor 的经典实现是 AutowiredAnnotationBeanPostProcessor（处理 @Autowired 注入）和 AbstractAutoProxyCreator（创建 AOP 代理）。

    - AOP 代理创建时机：AOP 代理是在 BeanPostProcessor.postProcessAfterInitialization() 阶段创建的，这就是为什么 BeanFactoryPostProcessor 中注入的 Bean 不会被 AOP 代理——它们在代理创建之前就已经实例化了。

    - 使用注意：BeanFactoryPostProcessor 中不要提前触发 Bean 实例化（如 getBean()），否则这些 Bean 会跳过后续的 BeanPostProcessor 处理链，导致注入、AOP 等功能失效。


content:
  prompt: 4、进阶题：Spring AOP 的两种代理方式（JDK 动态代理 vs CGLIB）有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（接口代理 vs 类代理、ASM 字节码、自调用失效问题、@Transactional 失效场景）

    1️⃣ Common Answer

    JDK 代理需要实现接口，CGLIB 不需要。CGLIB 是用字节码生成子类的方式。Spring 默认用 JDK 代理，但如果没有接口就用 CGLIB。@Transactional 有时候不生效是因为代理的问题。

    2️⃣ Impressive Answer

    - 代理机制不同：JDK 动态代理基于接口，运行时通过反射生成代理类，要求目标类必须实现接口；CGLIB 通过 ASM 字节码框架生成目标类的子类，不依赖接口，但 final 类/方法无法代理。

    - Spring 的选择策略：Spring Boot 2.x 起默认优先使用 CGLIB（spring.aop.proxy-target-class=true），减少因没有接口导致代理失败的问题；也可以强制指定。

    - 自调用失效是核心陷阱：同一个 Bean 内部方法 A 调用方法 B，B 上的 AOP 不生效，因为调用绕过了代理对象，直接走 this；解决方案是注入自身代理（AopContext.currentProxy()）或拆分到另一个 Bean。

    - @Transactional 失效场景：private 方法不能被 CGLIB 子类重写，方法必须是 public 且非 final；另外同类自调用也会导致事务失效。


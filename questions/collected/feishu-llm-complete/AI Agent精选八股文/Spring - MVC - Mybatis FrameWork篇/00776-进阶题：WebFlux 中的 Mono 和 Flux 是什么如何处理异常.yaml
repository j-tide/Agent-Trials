content:
  prompt: 2、进阶题：WebFlux 中的 Mono 和 Flux 是什么？如何处理异常？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（Reactor、onErrorResume、onErrorReturn、全局异常处理）

    1️⃣ Common Answer

    Mono 是返回 0 或 1 个元素，Flux 是返回多个。异常处理可以用 onErrorReturn 返回默认值，或者用 onErrorResume 继续执行。也可以在全局用@ControllerAdvice 处理。

    2️⃣ Impressive Answer

    - Mono/Flux 本质：Reactor 的响应式类型，Mono<T> 表示 0/1 个元素（如 Optional），Flux<T> 表示 0~N 个元素（如 List）。惰性执行，订阅后才触发。

    - 异常处理策略：

    - 背压（Backpressure）：下游控制上游生产速率，避免内存溢出。Reactor 默认策略是 onNext 拉动式，Flux 会自动处理。

    - Agent 场景：流式输出（SSE）用 Flux<ServerSentEvent<String>>；多工具并行调用用 Flux.mergeSequential() 保持顺序，Flux.combineLatest() 合并结果。


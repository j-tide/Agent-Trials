  prompt: 2、进阶题：Spring AOP 的完整执行链路是什么？ProxyFactory、PointcutAdvisor、MethodInterceptor
    各自的角色？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（AOP 链路、核心组件、责任链模式）\n\n1️⃣ Common Answer\n\nSpring AOP
    通过代理对象拦截方法调用。ProxyFactory 创建代理，PointcutAdvisor 定义切点和方法拦截器，MethodInterceptor 执行拦截逻辑。拦截器链按顺序执行。\n\n2️⃣
    Impressive Answer\n\n- 完整执行链路：\n\n调用代理方法\n→ ReflectiveMethodInvocation.proceed()\n→
    按顺序执行 Interceptor 链\n  → ExposeInvocationInterceptor（暴露当前调用）\n  → MethodBeforeAdvice（前置通知）\n
    \ → 目标方法\n  → AfterReturningAdvice（后置通知）\n  → AfterThrowingAdvice（异常通知）\n  → AfterAdvice（最终通知）\n→
    返回结果\n\n- 核心组件角色：\n\n- 责任链模式：ReflectiveMethodInvocation 维护 interceptorList 和 currentIndex，proceed()
    递归调用下一个拦截器。\n\n- 代码示例：\n\n// AOP 执行链路示例\nProxy proxy = ProxyFactory.getProxy(classLoader,
    interfaces);\nproxy.method() → \n  ReflectiveMethodInvocation.proceed() → \n    interceptor1.invoke()
    → \n      interceptor2.invoke() → \n        target.method() → \n      interceptor2.invoke()
    → \n    interceptor1.invoke() →\n  result\n\n- Agent 场景：ToolCallInterceptor 拦截工具调用方法，记录耗时、捕获异常、重试逻辑。\n\n3️⃣
    Key Differences\n\n[嵌入表格未展开]\n\n---"

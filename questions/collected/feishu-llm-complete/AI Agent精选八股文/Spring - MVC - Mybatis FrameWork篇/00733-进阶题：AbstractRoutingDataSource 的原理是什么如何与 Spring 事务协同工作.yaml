content:
  prompt: 2、进阶题：AbstractRoutingDataSource 的原理是什么？如何与 Spring 事务协同工作？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（动态数据源、ThreadLocal、事务传播）\n\n1️⃣ Common Answer AbstractRoutingDataSource
    是动态数据源，根据 key 切换数据源。用 ThreadLocal 存数据源 key。事务内不能切换数据源。\n\n2️⃣ Impressive Answer\n\n-
    AbstractRoutingDataSource 原理：继承 AbstractRoutingDataSource，实现 determineCurrentLookupKey()
    方法，返回数据源 key。内部维护 Map<Object, Object> targetDataSources，存储多个数据源。getConnection()
    时，根据 determineCurrentLookupKey() 返回的 key 从 targetDataSources 获取对应数据源。\n\n- ThreadLocal
    存储数据源 key：\n\n```text\npublic class DynamicDataSource extends AbstractRoutingDataSource
    {\n    private static final ThreadLocal<String> contextHolder = new ThreadLocal<>();\n
    \      \n    public static void setDataSourceKey(String key) {\n        contextHolder.set(key);\n
    \   }\n       \n    @Override\n    protected Object determineCurrentLookupKey()
    {\n        return contextHolder.get();\n    }\n}\n```\n\n使用时：DynamicDataSource.setDataSourceKey(\"secondary\")，后续
    SQL 操作使用 secondary 数据源。\n\n- 与 Spring 事务协同：\n\n- Agent 场景实践：Agent 工具调用需要读写业务库和向量库，使用动态数据源切换：\n\n```text\n@Service\npublic
    class AgentToolService {\n    @Transactional\n    public void executeTool(ToolRequest
    request) {\n        DynamicDataSource.setDataSourceKey(\"primary\");\n        businessMapper.insert(request);\n
    \       DynamicDataSource.setDataSourceKey(\"secondary\");\n        vectorMapper.insert(request.getVector());\n
    \   }\n}\n```\n\n注意：上述代码会报错，因为事务内切换数据源无效。正确做法：拆分成两个事务方法，或使用 REQUIRES_NEW。\n\n3️⃣
    Key Differences\n\n[嵌入表格未展开]\n\n---"

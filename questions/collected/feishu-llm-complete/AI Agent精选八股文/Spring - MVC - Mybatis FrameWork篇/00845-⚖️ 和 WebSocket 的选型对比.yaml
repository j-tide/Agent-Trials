  reference_answer: |-
    [嵌入表格未展开]

    对于典型的 Agent 流式输出，浏览器只需要收数据，完全不需要往服务器发消息（除了最初的请求），SSE 简直为它量身定做。而且完全基于 HTTP，负载均衡、防火墙、认证都可以复用现有体系。除非你的 Agent 需要持续双向交互（比如可打断、可中途修改指令），否则 WebSocket 就是杀鸡用牛刀。

content:
  prompt: 1、基础题：MyBatis 如何实现批量插入？foreach 标签和 ExecutorType.BATCH 有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（批量插入方式、性能对比、SQL 长度限制）

    1️⃣ Common Answer 批量插入可以用 foreach 标签，把多条数据拼成一条 INSERT 语句。或者用 ExecutorType.BATCH，循环调用 insert 方法，MyBatis 会自动批量执行。foreach 性能好一些。

    2️⃣ Impressive Answer

    - foreach 标签批量插入：INSERT INTO table (col1, col2) VALUES <foreach item="item" collection="list" separator=",">(#{item.col1}, #{item.col2})</foreach>，生成一条长 SQL，性能最优（一次网络交互），但有 SQL 长度限制（MySQL 默认 4MB）。

    - ExecutorType.BATCH 批量：sqlSessionFactory.openSession(ExecutorType.BATCH) 开启批处理，循环调用 mapper.insert()，MyBatis 缓存 SQL 和参数，最后 session.flushStatements() 一次性提交。优点：无 SQL 长度限制，适合大批量数据；缺点：性能略低于 foreach。

    - 性能对比：foreach 一次网络交互，性能最佳（1000 条数据约 50ms）；BATCH 多次网络交互但批量提交，性能次之（1000 条约 100ms）；普通循环插入性能最差（1000 条约 2000ms）。

    - Agent 场景选择：批量保存 100+ 条消息记录，优先用 foreach（性能最佳）；批量保存 10000+ 条历史归档数据，用 BATCH（避免 SQL 过长）。注意：BATCH 模式下，insert() 返回值不准确（可能返回 -1 或 0），需用 session.flushStatements() 获取实际影响行数。


content:
  prompt: 3、场景题：Agent 工具调用的参数校验如何设计？JSON Schema 校验 vs Bean Validation？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（动态校验、Schema 驱动、校验策略选型）\n\n1️⃣ Common Answer\n\n可以用 Bean
    Validation，在 DTO 上加校验注解。但 Agent 工具参数是动态的，可能用 JSON Schema 更合适。JSON Schema 可以根据工具定义动态校验。\n\n2️⃣
    Impressive Answer\n\n- 选型对比：\n\n[嵌入表格未展开]\n\n- 混合方案：\n\n- JSON Schema 实现：\n\n```text\npublic
    class ToolParameterValidator {\n    private final JsonSchemaFactory factory =
    JsonSchemaFactory.getInstance(SpecVersion.VersionFlag.V7);\n    \n    public ValidationResult
    validate(String schemaJson, Object parameters) {\n        JsonSchema schema =
    factory.getSchema(new JSONObject(schemaJson));\n        Set<ValidationMessage>
    errors = schema.validate(new JSONObject(parameters));\n        \n        return
    new ValidationResult(\n            errors.isEmpty(),\n            errors.stream()\n
    \               .map(ValidationMessage::getMessage)\n                .collect(Collectors.toList())\n
    \       );\n    }\n}\n```\n\n- 错误信息设计：校验失败返回结构化错误，告诉 LLM 哪个参数不合法及原因，便于模型自动修正：\n\n```text\n{\n
    \ \"error\": \"VALIDATION_FAILED\",\n  \"details\": {\n    \"field\": \"max_tokens\",\n
    \   \"message\": \"must be greater than or equal to 1\",\n    \"constraint\":
    \"minimum\"\n  }\n}\n```\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---\n\n---\n\n###
    跨域与安全"

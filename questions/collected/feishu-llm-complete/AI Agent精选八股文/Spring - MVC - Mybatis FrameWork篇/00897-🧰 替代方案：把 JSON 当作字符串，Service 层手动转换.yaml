  prompt: "\U0001F9F0 替代方案：把 JSON 当作字符串，Service 层手动转换"
answer:
  mode: rubric
  reference_answer: 如果项目很简单，不想写 TypeHandler，也可以在 Entity 里把 messages 定义为 String，然后在
    Service 层用 Jackson 手动转换。但这样破坏了持久层的对象语义，个人更推荐 TypeHandler 方案，它把转换逻辑收归到 MyBatis
    类型系统内，代码更干净。

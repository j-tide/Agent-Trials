content:
  prompt: 2、进阶题：同步事件 vs 异步事件（@Async）的区别？@TransactionalEventListener 的作用？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（事件同步性、事务绑定、异步线程池）

    1️⃣ Common Answer

    同步事件就是发布后立即执行监听器，异步事件用 @Async 可以在别的线程执行。@TransactionalEventListener 是在事务提交后才执行事件监听器。

    2️⃣ Impressive Answer

    - 同步事件：

    - 异步事件：

    @Component
    public class AsyncEventListener {
        @Async("eventExecutor")  // 指定线程池
        @EventListener
        public void handleAsync(AgentCompletedEvent event) {
            // 异步执行，不阻塞主流程
        }
    }

    - 优点：解耦、提升性能，适合日志、通知等非核心流程。
    - 缺点：监听器无法回滚主事务，需要处理事务一致性。

    - @TransactionalEventListener：

    @Component
    public class TransactionalEventListener {
        @TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)
        public void handleAfterCommit(AgentCompletedEvent event) {
            // 事务提交后才执行，确保数据已持久化
        }
    }

    - 支持阶段：`BEFORE_COMMIT`、`AFTER_COMMIT`、`AFTER_ROLLBACK`、`AFTER_COMPLETION`。
    - 场景：事务提交后发送通知、同步到下游系统。

    - 线程池配置：

    @Configuration
    @EnableAsync
    public class AsyncConfig {
        @Bean("eventExecutor")
        public Executor eventExecutor() {
            ThreadPoolTaskExecutor executor = new ThreadPoolTaskExecutor();
            executor.setCorePoolSize(5);
            executor.setMaxPoolSize(10);
            executor.setQueueCapacity(100);
            executor.setThreadNamePrefix("event-");
            return executor;
        }
    }

    - Agent 场景实战：Agent 执行完成后，同步事件更新数据库状态，异步事件记录日志、发送通知，@TransactionalEventListener 在事务提交后同步到审计系统。


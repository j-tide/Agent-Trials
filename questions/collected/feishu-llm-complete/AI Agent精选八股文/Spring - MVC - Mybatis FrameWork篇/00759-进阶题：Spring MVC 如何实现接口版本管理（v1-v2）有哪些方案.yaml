    难度级别：⭐⭐⭐（URL 路径版本、请求头版本、自定义 RequestCondition）

    1️⃣ Common Answer

    接口版本管理有几种方式：URL 路径版本（/api/v1/users）、请求头版本（Accept 头里带版本）、请求参数版本（?version=2）。最常用的是 URL 路径版本，因为直观，Nginx 路由也方便。


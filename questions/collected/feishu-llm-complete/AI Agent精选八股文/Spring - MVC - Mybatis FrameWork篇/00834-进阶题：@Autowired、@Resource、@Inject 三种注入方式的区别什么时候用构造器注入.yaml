    - 构造器注入的四大优势：

    - Spring 官方推荐：Spring 4.3+ 单构造器可省略 @Autowired；Spring 团队明确推荐构造器注入作为首选方式。

    - Agent 场景：工具注册器需要注入多个 ToolProvider 实现时，用构造器注入 List<ToolProvider> 保证不可变性，配合 @Qualifier 或 @Primary 控制优先级。


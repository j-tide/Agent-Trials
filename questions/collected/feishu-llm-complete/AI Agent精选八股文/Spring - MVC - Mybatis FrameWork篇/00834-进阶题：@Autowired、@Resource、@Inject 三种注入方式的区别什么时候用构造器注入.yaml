  reference_answer: |-
    难度级别：⭐⭐⭐（按类型注入 vs 按名称注入、JSR-250/JSR-330 规范、构造器注入不可变性）

    1️⃣ Common Answer

    @Autowired 是 Spring 的注解，按类型注入。@Resource 是 Java 标准的，按名称注入。@Inject 也是 Java 标准的，和 @Autowired 差不多。构造器注入比较好，Spring 官方推荐。


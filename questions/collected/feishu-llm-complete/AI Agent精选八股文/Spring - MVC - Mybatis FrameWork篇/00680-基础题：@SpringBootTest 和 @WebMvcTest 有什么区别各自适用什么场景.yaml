content:
  prompt: 1、基础题：@SpringBootTest 和 @WebMvcTest 有什么区别？各自适用什么场景？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（集成测试、Slice 测试、Mock 依赖）\n\n1️⃣ Common Answer\n\n@SpringBootTest
    是启动整个 Spring 容器的集成测试，@WebMvcTest 只测试 Web 层。@WebMvcTest 更快，因为它只加载 Controller 相关的
    Bean。@SpringBootTest 适合测试完整流程，@WebMvcTest 适合测试 API。\n\n2️⃣ Impressive Answer\n\n-
    @SpringBootTest：\n\n```text\n@SpringBootTest\n@AutoConfigureMockMvc\npublic class
    AgentIntegrationTest {\n    @Autowired\n    private MockMvc mockMvc;\n        \n
    \   @Test\n    public void testExecuteTool() throws Exception {\n        mockMvc.perform(post(\"/api/agent/execute\")\n
    \               .contentType(MediaType.APPLICATION_JSON)\n                .content(\"{\\\"tool\\\":\\\"weather\\\",\\\"params\\\":{\\\"city\\\":\\\"杭州\\\"}}\"))\n
    \           .andExpect(status().isOk())\n            .andExpect(jsonPath(\"$.result\").exists());\n
    \   }\n}\n```\n\n- @WebMvcTest：\n\n```text\n@WebMvcTest(AgentController.class)\npublic
    class AgentControllerTest {\n    @Autowired\n    private MockMvc mockMvc;\n        \n
    \   @MockBean\n    private AgentService agentService;\n        \n    @Test\n    public
    void testExecuteTool() throws Exception {\n        when(agentService.executeTool(any()))\n
    \           .thenReturn(ToolResult.success(\"result\"));\n            \n        mockMvc.perform(post(\"/api/agent/execute\")\n
    \               .contentType(MediaType.APPLICATION_JSON)\n                .content(\"{\\\"tool\\\":\\\"weather\\\",\\\"params\\\":{\\\"city\\\":\\\"杭州\\\"}}\"))\n
    \           .andExpect(status().isOk())\n            .andExpect(jsonPath(\"$.result\").value(\"result\"));\n
    \   }\n}\n```\n\n- 其他 Slice 测试：\n\n- 选择原则：\n\n3️⃣ Key Differences\n\n---"

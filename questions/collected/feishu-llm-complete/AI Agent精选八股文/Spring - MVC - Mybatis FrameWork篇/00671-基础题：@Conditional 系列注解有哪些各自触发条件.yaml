content:
  prompt: 1、基础题：@Conditional 系列注解有哪些？各自触发条件？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（条件装配、类路径判断、Bean 存在性判断）\n\nAnswer\n\n- @Conditional：核心注解，配合
    Condition 接口实现自定义条件。\n\n- 常用条件注解：\n\n- 示例：\n\n@Configuration\npublic class LLMConfig
    {\n    @Bean\n    @ConditionalOnClass(name = \"com.openai.OpenAI\")\n    public
    LLMProvider openaiLLM() {\n        return new OpenAIProvider();  // 类路径存在 OpenAI
    类时才创建\n    }\n        \n    @Bean\n    @ConditionalOnMissingBean(LLMProvider.class)\n
    \   public LLMProvider mockLLM() {\n        return new MockLLMProvider();  //
    没有 LLMProvider 时才创建\n    }\n}\n\n---"

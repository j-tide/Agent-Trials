answer:
  mode: rubric
  reference_answer: |-
    来看 Plugin 的核心代理逻辑：

    ```java
    // 简化版 Plugin.invoke
    public Object invoke(Object proxy, Method method, Object[] args) throws Throwable {
        // 如果当前调用的方法匹配我们声明要拦截的方法，就交给插件的 intercept 方法
        if (methods.contains(method)) {
            return interceptor.intercept(new Invocation(target, method, args));
        }
        // 否则直接走原始对象的方法
        return method.invoke(target, args);
    }
    ```

    如果有多个插件，依次包裹：PluginA 代理 PluginB 代理 PluginC 代理 原始对象。调用时顺序为 A.intercept → B.intercept → C.intercept → 真实方法。这就是典型的责任链。

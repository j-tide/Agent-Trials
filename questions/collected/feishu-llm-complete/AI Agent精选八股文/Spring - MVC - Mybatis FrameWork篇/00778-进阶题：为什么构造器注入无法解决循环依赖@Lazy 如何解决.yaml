content:
  prompt: 2、进阶题：为什么构造器注入无法解决循环依赖？@Lazy 如何解决？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（构造器注入时机、代理延迟加载、Provider 模式）

    1️⃣ Common Answer

    构造器注入在实例化阶段就需要依赖，这时候 Bean 还没创建完，没法放入三级缓存。@Lazy 可以解决，它是注入一个代理，第一次调用的时候才去拿真实的 Bean。

    2️⃣ Impressive Answer

    - 构造器注入无法解决的根本原因：构造器注入在实例化阶段就需要依赖对象，此时 Bean 还没创建完成，无法提前暴露到三级缓存。而 Setter 注入在实例化之后、属性填充阶段才需要依赖，此时已经可以提前暴露了。

    - @Lazy 的解决原理：注入的不是真实 Bean，而是一个 CGLIB 生成的代理对象。首次调用代理方法时，代理才从 Spring 容器获取真实 Bean。这样在构造阶段只需要一个代理占位，不触发真实 Bean 的创建，打破了循环依赖。

    - 其他延迟加载方案：

    - 最佳实践：优先通过重构消除循环依赖（提取中间层、事件驱动），而非用 @Lazy 绕过。@Lazy 只是技术手段，治标不治本，可能掩盖设计问题。


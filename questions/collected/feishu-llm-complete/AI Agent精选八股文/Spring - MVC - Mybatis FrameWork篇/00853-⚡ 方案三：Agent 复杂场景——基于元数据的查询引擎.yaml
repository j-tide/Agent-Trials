content:
  prompt: "⚡ 方案三：Agent 复杂场景——基于元数据的查询引擎"
answer:
  mode: rubric
  reference_answer: |-
    如果你的 Agent 允许用户任意组合字段、操作符（>、<、=、IN等），就需要一套查询模板 + 元数据校验的机制。

    简单设计思路：

    - 前端/Agent 生成一个结构化的查询描述对象，如：

    ```java
    {
      "conditions": [
        { "field": "total_amount", "op": "GE", "value": 1000 },
        { "field": "is_vip", "op": "EQ", "value": true }
      ],
      "orderBy": "create_time",
      "orderDir": "DESC"
    }
    ```

    - 后端定义一个字段元数据表（或枚举），记录每个允许查询的字段名、数据类型、是否支持排序。

    - 服务层遍历 conditions，通过白名单验证 field 合法，根据类型参数化拼接 SQL。绝不能直接把用户的字段名插入 SQL，必须从元数据中映射后才可拼接。

    伪代码示例：

    ```java
    @SelectProvider(type = AgentQueryProvider.class, method = "buildDynamicQuery")
    List<Map<String, Object>> executeQuery(QueryRequest request);

    // 在 Provider 内部使用 StringBuilder + 参数化构建，所有值用 #{paramX}
    ```

    MyBatis 提供的 #{param} 将始终使用 PreparedStatement，所以只要不把用户值拼到 SQL 字符串中，基本没有注入风险。

content:
  prompt: 1、基础题：ApplicationContext 和 BeanFactory 的区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐（容器接口、功能增强、国际化支持）

    Answer

    - BeanFactory：是 Spring 容器的基础接口，提供了最核心的 Bean 容器能力（getBean、containsBean 等），采用延迟加载策略（Lazy Init），只有在第一次 getBean 时才创建 Bean 实例，启动速度快，适合资源受限场景。

    - ApplicationContext：是 BeanFactory 的子接口，在基础功能上做了大量增强：

    - 选择建议：开发中优先使用 ApplicationContext（如 ClassPathXmlApplicationContext、AnnotationConfigApplicationContext），BeanFactory 主要在框架内部使用。


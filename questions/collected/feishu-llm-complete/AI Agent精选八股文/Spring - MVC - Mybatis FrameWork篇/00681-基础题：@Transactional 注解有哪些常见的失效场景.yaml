content:
  prompt: 1、基础题：@Transactional 注解有哪些常见的失效场景？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（方法修饰符、异常类型、自调用、传播机制）\n\n1️⃣ Common Answer\n\n@Transactional
    失效的情况有：方法不是 public、异常被捕获了、异常类型不对、在同一个类里面调用。还有就是数据库不支持事务。\n\n2️⃣ Impressive Answer\n\n-
    方法修饰符问题：@Transactional 只能作用于 public 方法，private、protected、package-private 会失效（Spring
    AOP 代理限制）。\n\n- 异常类型问题：默认只回滚 RuntimeException 和 Error，检查型异常（如 IOException）不回滚。需指定
    rollbackFor = Exception.class。\n\n- 自调用问题：同一个类内部方法调用不经过代理，事务失效。\n\n@Service\npublic
    class UserService {\n    @Transactional\n    public void methodA() {\n        methodB();
    // 事务失效，直接调用不经过代理\n    }\n        \n    @Transactional\n    public void methodB()
    { }\n}\n\n解决：注入自己或用 `AopContext.currentProxy()`。\n\n- 传播机制问题：NOT_SUPPORTED、NEVER
    会挂起当前事务；嵌套事务（NESTED）需要数据库支持（如 MySQL）。\n\n- 事务管理器配置：多数据源时未指定 @Transactional(transactionManager
    = \"xxxTransactionManager\")。\n\n- 数据库引擎不支持：如 MySQL 的 MyISAM 引擎不支持事务。\n\n3️⃣ Key
    Differences\n\n[嵌入表格未展开]\n\n---"

content:
  prompt: "\U0001F6AA 1. Spring Cloud Gateway 的工作原理是什么？"
answer:
  mode: rubric
  reference_answer: "1.1 从请求到转发的四个核心组件\n\nSpring Cloud Gateway 是基于 WebFlux + Netty
    的反应式网关，它的整个处理过程可以抽象成一个管道，有三个关键角色：\n\n[嵌入表格未展开]\n\n一个请求经过网关时，会先遍历所有 Route，找到第一个匹配的
    Predicate 集合，然后执行该路由上配置的 Filter 链，最终通过 Netty 客户端转发到下游服务。\n\n1.2 底层执行流程（WebFlux
    非阻塞模型）\n\n```text\nClient Request → HttpWebHandlerAdapter \n→ RoutePredicateHandlerMapping（匹配路由）
    \n→ FilteringWebHandler（组装过滤器链） \n→ NettyRoutingFilter（发起代理请求）\n→ 响应反向经过 Filter
    链 → 返回客户端\n```\n\n整个过程中 没有阻塞线程，完全基于 Reactor 的事件循环。每个请求在 Netty 连接池中获取一个客户端连接，通过
    WebClient 发出异步 HTTP 调用。\n\n1.3 扩展点和常见用法\n\n- 自定义全局过滤器：实现 GlobalFilter 接口，可以全局控制鉴权、日志、流量染色。\n\n-
    路由动态刷新：通过 GatewayControllerEndpoint 或集成配置中心（Nacos/Apollo）动态修改路由，不用重启。\n\n它和 Zuul
    1.x 最大的区别是异步非阻塞和函数式编程，从而在面对高并发时消耗更少的线程资源。\n\n---"

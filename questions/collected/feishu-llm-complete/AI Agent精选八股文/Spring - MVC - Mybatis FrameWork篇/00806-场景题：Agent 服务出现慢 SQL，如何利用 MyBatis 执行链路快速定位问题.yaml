  prompt: 3、场景题：Agent 服务出现慢 SQL，如何利用 MyBatis 执行链路快速定位问题？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（性能排查、插件拦截、Agent 场景）

    1️⃣ Common Answer 开启 MyBatis 日志，看 SQL 执行时间。用数据库慢查询日志定位问题。优化 SQL，加索引。

    2️⃣ Impressive Answer

    - MyBatis 插件拦截：实现 Interceptor 接口，拦截 Executor.update() 和 Executor.query()，记录 SQL 执行时间、参数、结果行数。关键代码：

    ```text
    @Intercepts({@Signature(type = Executor.class, method = "query", args = {MappedStatement.class, Object.class, RowBounds.class, ResultHandler.class})})
    public class SlowSqlInterceptor implements Interceptor {
        @Override
        public Object intercept(Invocation invocation) throws Throwable {
            long start = System.currentTimeMillis();
            Object result = invocation.proceed();
            long cost = System.currentTimeMillis() - start;
            if (cost > 1000) log.warn("Slow SQL: {}, cost: {}ms", invocation.getArgs()[0], cost);
            return result;
        }
    }
    ```

    - 执行链路分析：慢 SQL 可能出现在以下环节：

    - Agent 场景优化：Agent 对话记录查询慢，通过插件定位到 ResultSetHandler 处理大量历史消息耗时，改用分页查询（RowBounds 或 PageHelper），单页 20 条，性能提升 80%。

    - 监控与告警：集成 Prometheus，采集 SQL 执行时间、QPS、缓存命中率，设置慢 SQL 告警（>1s）。最佳实践：开发环境开启 SQL 日志（logging.level.org.mybatis=DEBUG），生产环境用插件监控。


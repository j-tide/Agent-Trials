content:
  prompt: 2、进阶题：Spring 中@Lazy 注解的作用是什么？如何解决循环依赖？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（三级缓存、提前暴露、构造器注入失效、@Lazy 原理）

    1️⃣ Common Answer

    @Lazy 是懒加载，用的时候才创建 Bean。循环依赖的话，Spring 会自动解决，加@Lazy 也可以。但是构造器注入的循环依赖解决不了。

    2️⃣ Impressive Answer

    - @Lazy 的本质：注入一个代理对象，真实 Bean 第一次使用时才创建。可打破循环依赖，也可优化启动速度（大 Bean 懒加载）。

    - Spring 循环依赖解决方案：setter/字段注入的循环依赖靠三级缓存解决：

    - 构造器注入失效原因：构造器执行时 Bean 还没暴露，无法注入循环依赖。解决：字段/ setter 注入，或其中一个加 @Lazy。

    - 最佳实践：推荐构造器注入（不可变、易测试），循环依赖时局部用@Lazy 打破环，而不是全局改用字段注入。


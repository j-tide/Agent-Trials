answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐⭐（自动配置原理、spring.factories、@EnableAutoConfiguration、条件过滤）\n\n1️⃣
    Common Answer\n\nSpring Boot 自动配置就是根据 classpath 里的 jar 包自动配置 Bean。@EnableAutoConfiguration
    开启自动配置，spring.factories 里定义了配置类。条件注解过滤不需要的配置。\n\n2️⃣ Impressive Answer\n\n- 自动配置核心定位：Spring
    Boot 通过\"约定优于配置\"的理念，根据 classpath 中的依赖自动装配 Bean，减少手动配置。\n\n- 完整链路：\n\n① @SpringBootApplication
    启动\n② @EnableAutoConfiguration 导入 AutoConfigurationImportSelector\n③ AutoConfigurationImportSelector
    从 spring.factories 加载配置类\n④ 配置类经过条件过滤（@Conditional 系列）\n⑤ 符合条件的配置类注册为 BeanDefinition\n⑥
    配置类中的 @Bean 方法创建 Bean\n\n- 关键步骤详解： 步骤 1：@EnableAutoConfiguration 导入选择器\n\n@Target(ElementType.TYPE)\n@Retention(RetentionPolicy.RUNTIME)\n@Documented\n@Inherited\n@AutoConfigurationPackage\n@Import(AutoConfigurationImportSelector.class)
    \ // 导入自动配置选择器\npublic @interface EnableAutoConfiguration {\n    String ENABLED_OVERRIDE_PROPERTY
    = \"spring.boot.enableautoconfiguration\";\n    Class<?>[] exclude() default {};\n
    \   String[] excludeName() default {};\n}\n\n**步骤 2：AutoConfigurationImportSelector
    加载配置类**\n\npublic class AutoConfigurationImportSelector implements DeferredImportSelector
    {\n    @Override\n    public String[] selectImports(AnnotationMetadata annotationMetadata)
    {\n        // 从 spring.factories 加载所有自动配置类\n        List<String> configurations
    = getCandidateConfigurations(\n            annotationMetadata, \n            getAttributes()\n
    \       );\n        // 去重、排序\n        configurations = removeDuplicates(configurations);\n
    \       configurations = sort(configurations);\n        // 条件过滤\n        configurations
    = filter(configurations, getAutoConfigurationMetadata());\n        return configurations.toArray(new
    String[0]);\n    }\n        \n    protected List<String> getCandidateConfigurations(AnnotationMetadata
    metadata, Attributes attributes) {\n        // 从 spring.factories 加载\n        return
    SpringFactoriesLoader.loadFactoryNames(\n            getSpringFactoriesLoaderFactoryClass(),
    \n            getBeanClassLoader()\n        );\n    }\n}\n\n**步骤 3：spring.factories
    定义配置类**\n\n# spring-boot-autoconfigure/META-INF/spring.factories\norg.springframework.boot.autoconfigure.EnableAutoConfiguration=\\\norg.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration,\\\norg.springframework.boot.autoconfigure.aop.AopAutoConfiguration,\\\norg.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\\\n#
    ... 更多配置类\n\n**步骤 4：条件过滤**\n\n@Configuration\n@ConditionalOnClass(DataSource.class)
    \ // classpath 中有 DataSource 类\n@ConditionalOnMissingBean(DataSource.class)  //
    容器中没有 DataSource Bean\n@EnableConfigurationProperties(DataSourceProperties.class)
    \ // 绑定配置属性\npublic class DataSourceAutoConfiguration {\n        \n    @Bean\n
    \   @ConditionalOnProperty(name = \"spring.datasource.type\")  // 配置了 type 属性\n
    \   public DataSource dataSource(DataSourceProperties properties) {\n        //
    创建 DataSource\n    }\n}\n\n**步骤 5：Bean 注册**\n\n- 配置类本身注册为 BeanDefinition-   配置类中的
    @Bean 方法解析为 BeanDefinition-   条件过滤后，符合条件的 Bean 被实例化\n\n- 自动配置报告：\n\n- 实践注意：\n\n3️⃣
    Key Differences\n\n[嵌入表格未展开]\n\n---"

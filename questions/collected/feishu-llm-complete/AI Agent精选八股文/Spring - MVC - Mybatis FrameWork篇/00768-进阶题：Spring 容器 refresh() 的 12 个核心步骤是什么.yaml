content:
  prompt: 2、进阶题：Spring 容器 refresh() 的 12 个核心步骤是什么？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（容器启动流程、BeanFactoryPostProcessor、BeanPostProcessor、单例初始化）

    1️⃣ Common Answer

    refresh() 就是 Spring 容器启动的方法，大概就是准备环境、加载 Bean 定义、创建 Bean、初始化这些步骤。具体的 12 个步骤记不太清了，反正就是容器启动的流程。

    2️⃣ Impressive Answer

    - prepareRefresh()：准备刷新上下文，设置启动时间、初始化属性源、验证必需属性。

    - obtainFreshBeanFactory()：创建 BeanFactory，加载 BeanDefinition（解析 @Component、@Bean 等）。

    - prepareBeanFactory()：配置 BeanFactory，注册 BeanPostProcessor（如 ApplicationContextAwareProcessor）、设置类加载器。

    - postProcessBeanFactory()：子类扩展点，可以修改 BeanFactory（如添加 Web 环境特有的 Scope）。

    - invokeBeanFactoryPostProcessors()：执行 BeanFactoryPostProcessor（如 @PropertySource、@ConfigurationClassPostProcessor 解析配置类）。

    - registerBeanPostProcessors()：注册 BeanPostProcessor（如 AutowiredAnnotationBeanPostProcessor、CommonAnnotationBeanPostProcessor）。

    - initMessageSource()：初始化国际化资源（MessageSource）。

    - initApplicationEventMulticaster()：初始化事件广播器（ApplicationEventMulticaster）。

    - onRefresh()：子类扩展点，创建 Web 容器（如 Tomcat、Jetty）。

    - registerListeners()：注册监听器，广播早期事件。

    - finishBeanFactoryInitialization()：初始化所有非懒加载的单例 Bean（实例化、属性注入、初始化回调）。

    - finishRefresh()：完成刷新，发布 ContextRefreshedEvent，启动生命周期 Bean（如 SmartLifecycle）。

    - 关键理解：

    - Agent 场景：在 onRefresh() 步骤启动 Agent Server（如 gRPC Server），在 finishRefresh() 后发布 AgentReadyEvent，通知下游服务 Agent 已就绪。


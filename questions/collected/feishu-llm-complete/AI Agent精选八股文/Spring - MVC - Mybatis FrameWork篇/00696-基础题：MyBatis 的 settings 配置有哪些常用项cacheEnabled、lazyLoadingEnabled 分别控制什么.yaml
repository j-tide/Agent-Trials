content:
  prompt: 1、基础题：MyBatis 的 settings 配置有哪些常用项？cacheEnabled、lazyLoadingEnabled 分别控制什么？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（settings 配置、缓存控制、延迟加载）

    1️⃣ Common Answer settings 是 MyBatis 的配置项，可以配置缓存、延迟加载等。cacheEnabled 控制二级缓存是否开启，lazyLoadingEnabled 控制是否延迟加载关联对象。

    2️⃣ Impressive Answer

    - 常用 settings 配置：

    - cacheEnabled 控制二级缓存：cacheEnabled="true" 时，Mapper XML 中配置 <cache/> 生效，多个 SqlSession 共享缓存；cacheEnabled="false" 时，即使配置 <cache/> 也不生效。Agent 场景：知识库查询开启二级缓存，减少 DB 压力。

    - lazyLoadingEnabled 控制延迟加载：lazyLoadingEnabled="true" 时，ResultMap 中的 association 和 collection 按需加载，访问关联对象时才执行子查询；lazyLoadingEnabled="false" 时，立即加载所有关联对象。性能优化：工具调用记录列表页，参数列表延迟加载，减少数据传输。

    - 配置示例：

    ```text
    <settings>
      <setting name="cacheEnabled" value="true"/>
      <setting name="lazyLoadingEnabled" value="true"/>
      <setting name="aggressiveLazyLoading" value="false"/>
      <setting name="defaultExecutorType" value="REUSE"/>
    </settings>
    ```


content:
  prompt: 1、基础题：@Scheduled 注解如何使用？cron 表达式如何编写？
answer:
  mode: rubric
  reference_answer: "难度级别：⭐⭐（@EnableScheduling、fixedRate、fixedDelay、cron）\n\n1️⃣ Common
    Answer\n\n在方法上加 @Scheduled 注解就可以定时执行。需要在启动类上加 @EnableScheduling。可以用 fixedRate
    指定间隔，或者用 cron 表达式指定执行时间。cron 表达式是秒分时日月周。\n\n2️⃣ Impressive Answer\n\n- 前置配置：在启动类或配置类上加
    @EnableScheduling 注解。\n\n- 三种调度方式：\n\n@Scheduled(fixedRate = 5000)  // 固定频率（上次开始后
    5 秒执行，不考虑上次的执行时间）\npublic void fixedRateTask() { ... }\n    \n@Scheduled(fixedDelay
    = 5000)  // 固定延迟（上次结束后 5 秒执行）\npublic void fixedDelayTask() { ... }\n    \n@Scheduled(initialDelay
    = 1000, fixedRate = 5000)  // 初始延迟 1 秒，然后每 5 秒执行\npublic void initialDelayTask()
    { ... }\n    \n@Scheduled(cron = \"0 0 2 * * ?\")  // 每天凌晨 2 点执行\npublic void
    cronTask() { ... }\n\n- Cron 表达式格式：秒 分 时 日 月 周 [年]\n\n[嵌入表格未展开]\n\n- 常用 Cron 示例：\n\n-
    注意事项：默认单线程执行，上一个任务未完成时下一个任务会阻塞。需要并行执行时配置线程池。\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---"

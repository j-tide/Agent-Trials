  reference_answer: |-
    ```text
    注册（Register）
        │
        ▼
    待初始化（Registered）
        │ 首次触发 / 系统预热
        ▼
    初始化中（Initializing）
        │
        ▼
    就绪（Ready） ←──────────┐
        │ 匹配触发            │
        ▼                     │
    执行中（Running）          │
        │                     │
        ├── 等待用户确认 ──────┤ (用户回复后继续)
        │                     │
        ▼                     │
    已完成（Completed） ───────┘ 可再次触发
        │
        ├──→ 超时/主动释放 → 休眠（Idle）→ 超时回收 → 未初始化
        │
        └──→ 注销 → 已销毁（Destroyed）
    ```

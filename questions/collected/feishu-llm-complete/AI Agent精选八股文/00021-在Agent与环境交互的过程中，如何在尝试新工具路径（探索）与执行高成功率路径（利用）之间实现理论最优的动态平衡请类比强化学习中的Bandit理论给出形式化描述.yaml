    ### 六、示例：天气查询Agent的Bandit策略

    场景：Agent有3个天气API工具（A、B、C），成功率和延迟未知。用户每次询问天气，状态为城市名。

    - 初始化：每个工具被尝试1次，获得奖励（1=成功返回温度，0=失败）。

    - UCB计算：随着尝试次数增加，不常选的工具UCB值变大，被选中的概率增加。

    - 经过100次查询后，工具B被证明成功率95%，其他低于70%。Agent会稳定选择B，偶尔试探C（以防环境变化）。

    效果：相比固定选择第一个工具，UCB策略减少了约60%的失败查询。

    ---

    ### 七、总结

    将Agent的工具路径选择建模为Bandit问题，并使用UCB、Thompson采样等理论最优算法，可以实现动态的探索-利用平衡。该方案：

    - 形式化清晰：有严格的遗憾界保证。

    - 工程可行：只需维护每个臂的统计量或轻量模型。

    - 可扩展：支持上下文依赖、延迟奖励、组合动作。

    未来可结合元学习，使Agent能快速适应非平稳环境（如工具API变更），或使用贝叶斯优化处理连续参数空间。

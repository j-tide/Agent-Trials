    ### 三、理论最优的动态平衡策略

    为了实现最小化累积遗憾，可采用以下Bandit算法，它们理论上有近乎最优的遗憾界（如O(T)O(T)或O(log⁡T)O(logT)）。

    3.1 上限置信区间（UCB）算法

    对于每个臂ii，维护：

    - μ^iμ^i：当前平均奖励估计

    - nini：该臂被选择的次数

    在每一步选择最大化UCB值的臂：

    [图片内容未导入]

    其中tt为总步数。第二项是探索奖励，使得不常选的臂有更高机会被尝试。

    Agent中的应用：每个工具路径维护成功次数和尝试次数，UCB公式自动平衡探索与利用。参数可调（如乘以一个探索系数）。

    3.2 Thompson采样（贝叶斯方法）

    对每个臂ii，假设奖励服从Beta分布（二值奖励）或高斯分布（连续奖励）。维护先验参数，每次从后验分布中采样一个期望奖励，选择采样值最大的臂。

    优点：天然处理不确定性，且计算效率高；在多臂场景下性能与UCB相当或更优。

    3.3 上下文Bandit：LinUCB / 神经网络UCB

    当工具的成功率依赖于当前状态（如用户查询类型、系统负载）时，使用线性UCB：假设期望奖励是状态特征的线性函数，维护系数并计算置信区间。或使用Deep Bandit（神经网络提取特征，再叠加UCB）。

    ---


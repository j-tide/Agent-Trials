content:
  prompt: 28.在Agent与环境交互的过程中，如何在“尝试新工具路径（探索）”与“执行高成功率路径（利用）”之间实现理论最优的动态平衡？请类比强化学习中的Bandit理论给出形式化描述。
answer:
  mode: rubric
  reference_answer: |-
    ### 一、问题形式化

    将Agent每次需要选择工具或工具调用路径的过程建模为一个随机多臂赌博机（Stochastic MAB） 问题。核心要素如下：

    - 臂（Arm）：每个臂对应一个可执行的动作或工具调用路径。路径可以是一个具体的工具（如get_weather(city=“北京”)），也可以是一个参数化的模板（如search(query=*)）。在组合场景中，每个臂代表一个策略π（从状态到动作的映射），但为简化，我们考虑固定上下文下的单步决策。

    - 奖励（Reward）：执行该路径后，Agent获得的即时或累积效用。例如，任务完成度增量（0或1），或一个连续值（如执行速度、结果质量）。

    - 未知分布：每个臂的奖励分布未知，Agent需要通过与环境的交互来学习。

    在Agent的每一步决策中，面临探索-利用（Exploration-Exploitation, E&E） 权衡：

    - 探索：尝试尚未充分评估的工具路径，以收集信息，发现潜在的高效路径。

    - 利用：选择当前估计成功率最高的路径，以最大化即时奖励。

    目标：在有限次交互（T步）内，最小化累积遗憾（Cumulative Regret），即与始终选择最优臂的期望奖励之差。

    ---


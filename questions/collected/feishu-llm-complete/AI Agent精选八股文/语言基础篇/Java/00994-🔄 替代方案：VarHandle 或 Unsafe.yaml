content:
  prompt: "\U0001F504 替代方案：VarHandle 或 Unsafe"
answer:
  mode: rubric
  reference_answer: |-
    在高版本 JDK 中，官方推荐用 VarHandle 来替代传统的反射修改字段（尤其是 static final），但 VarHandle 也需要获取 Lookup 权限，且不能完全绕过 final。更底层的 sun.misc.Unsafe 可以无视一切限制直接修改内存，但它属于内部 API，未来可能彻底移除，不推荐在业务代码中使用。

    如果只是为了测试，可以考虑 @InjectMocks + Mockito 的 Whitebox，但生产代码中修改 private final 字段本身就是一种代码味道，更多意味着设计需要重构。


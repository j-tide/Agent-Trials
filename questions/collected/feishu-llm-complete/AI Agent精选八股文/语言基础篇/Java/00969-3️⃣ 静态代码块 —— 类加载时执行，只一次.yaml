  prompt: 3️⃣ 静态代码块 —— 类加载时执行，只一次
answer:
  mode: rubric
  reference_answer: |-
    ```java
    public class DBConfig {
        static {
            // 加载驱动、读取配置文件等
            System.out.println("类加载时执行，且只执行一次");
        }
    }
    ```

    - 作用：用于初始化复杂的静态变量，或在类加载时做一次性工作（如加载本地库）。

    - 执行顺序：如果类中有多个静态块，按代码顺序依次执行。父类的静态块优先于子类。

    - 对比实例代码块：实例块在每次创建对象时执行，静态块只执行一次。


content:
  prompt: "\U0001F6E1️ 高版本 JDK 的障碍（JDK 12+）"
answer:
  mode: rubric
  reference_answer: |-
    从 JDK 12 开始，Java 加强了对内部 API 的封装。如果你直接运行上面的代码，可能会遇到：

    ```java
    java.lang.reflect.InaccessibleObjectException: Unable to make field
    ```

    这是因为 java.lang.reflect.Field 的 modifiers 字段所在的模块 java.base 没有 opens 给外部代码。要解决，必须在启动 JVM 时添加：

    ```java
    --add-opens java.base/java.lang.reflect=ALL-UNNAMED
    ```

    或者用更精细的模块名。如果是在 Spring Boot 等框架中运行，可以通过 jvm-args 传递。


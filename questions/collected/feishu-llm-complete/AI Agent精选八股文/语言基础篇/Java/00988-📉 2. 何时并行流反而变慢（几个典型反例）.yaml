content:
  prompt: "\U0001F4C9 2. 何时并行流反而变慢？（几个典型反例）"
answer:
  mode: rubric
  reference_answer: |-
    反例 1：数据量太小

    ```java
    IntStream.range(1, 100).parallel().sum(); // 数据量小，拆分开销 > 计算开销
    ```

    对于几百个元素的集合，串行流通常在微秒级完成，而并行流初始化线程池和拆分的成本就已经是毫秒级。

    反例 2：数据结构拆分成本高

    - LinkedList：每次拆分都需要遍历到中间，O(n) 拆分成本。

    - HashSet/TreeSet：内部结构复杂，拆分需要额外计算或迭代。

    - Files.lines()：读取文件本质是顺序的，强行并行收益极低。

    反例 3：存在共享可变状态

    ```java
    List<Integer> result = new ArrayList<>();
    list.parallelStream().forEach(result::add); // 线程不安全，结果错误或异常
    ```

    ArrayList 不是线程安全的，多个线程并发 add 会导致数据覆盖、ArrayIndexOutOfBoundsException 等，同时内部的 Object[] 扩容会引发严重问题。

    反例 4：计算简单但 IO 密集

    并行流擅长 CPU 密集型任务。如果任务主要是 IO 等待（如远程调用、数据库查询），并行流只会增加线程数，让 IO 压力更大，而 CPU 大部分时间空闲。更合理的做法是用异步非阻塞或专用的 IO 线程池。


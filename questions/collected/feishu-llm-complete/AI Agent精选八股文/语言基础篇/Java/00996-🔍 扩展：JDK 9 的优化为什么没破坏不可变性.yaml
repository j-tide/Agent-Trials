content:
  prompt: "\U0001F50D 扩展：JDK 9 的优化为什么没破坏不可变性？"
answer:
  mode: rubric
  reference_answer: |-
    JDK 9 把 char[] 改成 byte[] + coder，只是存储格式优化，不可变语义不变。
    value 仍然是 private final，所有方法依然返回新对象。甚至引入了 COMPACT_STRINGS 特性，让拉丁字符只用 1 字节存储，内存更省，但对外依然是不可变。


answer:
  mode: rubric
  reference_answer: |-
    - 静态方法不能重写，但子类可以定义同名同参数的方法，这叫做隐藏，调用时具体执行哪个取决于引用类型（不是对象类型）。

    - 静态变量是类级别的，但线程不安全，多线程并发修改需加 volatile 或同步。

    - static 和 final 组合是常量，编译期会内联，需要特别注意版本兼容（如 public static final int MAX = 100;，若修改值，所有依赖类都要重新编译）。

    - 静态上下文没有 this，所以不能用 super 关键字，也不能访问非静态内部类。

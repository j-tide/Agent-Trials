content:
  prompt: "\U0001F9E0 1. 并行流的底层：ForkJoinPool"
answer:
  mode: rubric
  reference_answer: |-
    并行流依靠 ForkJoinPool.commonPool()（一个 JVM 级别共享的线程池）来执行。它用 分治（Fork/Join） 策略，把一个大任务递归地拆分成若干小任务并行执行，最后再合并结果。

    开销从哪来？

    - 拆分成本：不是所有数据源都能高效拆分（如 LinkedList 拆分很慢）。

    - 线程调度与上下文切换：任务太多时，线程调度器会频繁挂起和恢复线程，消耗 CPU。

    - 合并开销：并行执行完的小结果必须合并成最终结果，涉及数据复制和同步。

    - GC 压力：并行任务会产生更多临时对象。

    如果任务本身很简单（如简单的加法、过滤），这些额外开销可能比串行执行的总时间还多。


content:
  prompt: 为什么是 3，而不是 1？
answer:
  mode: rubric
  reference_answer: "你脑袋里可以想象 JVM 在执行这段代码时的“微操”：\n\n- 执行 try 块里的代码，遇到了 return 1 ——
    这时 JVM 不会立刻返回，而是先记下“我准备返回 1 了”，然后跑去执行 finally 块。\n\n- 进到 finally 里，结果碰上一个 return
    3 —— 这相当于对 JVM 说：“刚才那个 1 不要了，现在就给我返回 3”。\n\n- 于是 finally 里的 return 直接覆盖了之前任何准备返回的值，方法最终返回
    3。\n\n\U0001F539 哪怕 try 里没异常，走的也是这个流程，catch 根本不会触发，但 finally 横插一脚照抢不误。"

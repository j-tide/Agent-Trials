content:
  prompt: "\U0001F9E0 5. 延伸：equals 不相等的对象可以共享 hashCode 吗？"
answer:
  mode: rubric
  reference_answer: |-
    完全可以，这叫哈希碰撞。比如 "Aa" 和 "BB" 的 hashCode 都是 2112。哈希表通过链地址法或红黑树处理碰撞，先用 hashCode 缩小范围，再用 equals 精准区分。碰撞只影响性能（桶内链变长），不影响正确性。
    所以 hashCode 的设计追求“均匀分布”，以降低碰撞概率。


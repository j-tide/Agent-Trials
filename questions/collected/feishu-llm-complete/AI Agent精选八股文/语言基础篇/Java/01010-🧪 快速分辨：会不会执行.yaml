answer:
  mode: rubric
  reference_answer: |-
    ```python
    import os

    try:
        os._exit(0)          # ❌ 进程直接死，没有任何 finally
    finally:
        print("不会执行到这里")
    ```

    ```python
    try:
        raise SystemExit    # ✅ 这是异常，finally 会执行
    finally:
        print("会执行")
    ```

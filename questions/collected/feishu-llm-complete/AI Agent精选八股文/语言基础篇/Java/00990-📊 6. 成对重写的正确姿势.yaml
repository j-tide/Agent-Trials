  prompt: "\U0001F4CA 6. 成对重写的正确姿势"
answer:
  mode: rubric
  reference_answer: |-
    当你重写 equals 时，务必同时重写 hashCode，且使用相同的关键字段生成哈希码。例如：

    ```java
    @Override
    public boolean equals(Object o) {
        if (this == o) return true;
        if (!(o instanceof User)) return false;
        User user = (User) o;
        return Objects.equals(id, user.id);
    }

    @Override
    public int hashCode() {
        return Objects.hash(id); // 用 id 生成，和 equals 保持一致
    }
    ```

    最佳实践：

    - 使用 IDE 自动生成（IntelliJ / Eclipse）或 Lombok 的 @EqualsAndHashCode 注解，避免手工出错。

    - 不要将可变字段作为哈希码的组成部分（除非你能保证对象存入集合后字段不会再被修改），否则会丢失对象在集合中的位置。

content:
  prompt: "✅ 3. 何时适合用并行流？"
answer:
  mode: rubric
  reference_answer: |-
    - 数据量超过万级以上（经验值），任务越重，拆分后的优势越明显。

    - 数据源是可高效拆分的：ArrayList、int[]、long[] 等数组或基于数组的结构，拆分成本接近 O(1)。

    - 操作是 CPU 密集且无状态的：复杂的数学计算、加密解密、图像处理等。

    - 操作无共享可变状态：如 reduce、collect(Collectors.toList()) 等无副作用操作。

    - 避免在共享线程池中混入阻塞操作：不要用 commonPool 执行耗时 IO，应使用自定义 ForkJoinPool。

    实际建议：
    使用 parallelStream() 前，务必用 JMH（Java Microbenchmark Harness） 在真实数据规模下对比串行和并行的吞吐量，并观察 CPU 利用率和 GC。一个简单的准则是：如果串行流已经能在几毫秒内完成，就不值得并行。


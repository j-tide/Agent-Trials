answer:
  mode: rubric
  reference_answer: |-
    这种情况下只需要标准的反射三步：

    - 获取目标类的 Class 对象

    - 通过 getDeclaredField("字段名") 拿到 Field

    - 调用 field.setAccessible(true) 关闭访问检查

    - 用 field.set(对象实例, 新值) 修改

    代码示例：

    ```java
    User user = new User();
    Field nameField = User.class.getDeclaredField("name");
    nameField.setAccessible(true);
    nameField.set(user, "李四");
    System.out.println(user.getName()); // 输出：李四
    ```

    ✅ 原理：setAccessible(true) 会抑制 Java 语言访问控制检查，让反射可以绕过 private。


content:
  prompt: 再说个更容易混淆的变种
answer:
  mode: rubric
  reference_answer: "如果 finally 里没有 return，只是修改了变量的值呢？\n\n```java\npublic static int
    test() {\n    int x = 0;\n    try {\n        return x;      // ① 准备返回 0\n    }
    finally {\n        x = 10;        // ② 把 x 改成 10，但不 return\n    }\n}\n// 最终返回值：0\n```\n\n⚠️
    这里反而是很多人的翻车点。为什么还是 0？\n因为 return x 在字节码层面，是先把 x 的值（基本类型）拷贝到一个临时槽位里，然后不管 finally
    里怎么改 x 本身，最终返回的都是那个已经拷贝好的值。\n如果 x 是引用类型，改的是对象内部状态，那才会影响返回值（因为引用拷贝的只是地址，指向的还是同一个对象）。\n\n\U0001F539
    这题还藏着一个隐蔽考点：finally 到底什么时候不执行？\n除了刚才说的 System.exit(0)，还有：守护线程挂掉、JVM 崩溃、死循环卡住。其他情况下，即使
    try/catch 里抛了异常，finally 也一定会跑完——这是它存在的意义。\n\n你说这题像不像个“俄罗斯套娃”？你刚觉得自己理解了 return
    被覆盖，它又用变量修改给你挖个新坑。面试能答到变量拷贝和引用类型这一层，基本就能和背八股的拉开差距了。如果再补一句“其实在字节码里，每个 return 前面都会被插入
    finally 块的一个副本”，面试官大概就知道你是真翻过源码或看过字节码的人。"

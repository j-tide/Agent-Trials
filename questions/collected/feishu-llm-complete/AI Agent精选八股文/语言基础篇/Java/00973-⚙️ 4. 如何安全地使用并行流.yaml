content:
  prompt: "⚙️ 4. 如何安全地使用并行流？"
answer:
  mode: rubric
  reference_answer: |-
    - 只使用无状态、无副作用的函数，如 filter、map、flatMap、reduce 等。

    - 避免 forEach 顺序依赖：forEach 是并行下的非确定性操作，如果必须保证顺序，用 forEachOrdered（但会降低并行度）。

    - 使用并发安全的收集器：Collectors.toList() 是线程安全的，但自定义收集器需注意。

    - 限制并行度：可在启动时通过 -Djava.util.concurrent.ForkJoinPool.common.parallelism=N 限制公共池线程数，防止过度占用 CPU。

    - 大数据量下用自定义 ForkJoinPool 隔离，避免影响系统中其他依赖公共池的代码（如 CompletableFuture 默认回调）。


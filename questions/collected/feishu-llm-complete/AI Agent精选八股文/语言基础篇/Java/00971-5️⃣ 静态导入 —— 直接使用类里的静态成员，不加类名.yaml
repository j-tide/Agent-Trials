  prompt: 5️⃣ 静态导入 —— 直接使用类里的静态成员，不加类名
answer:
  mode: rubric
  reference_answer: |-
    ```java
    import static java.lang.Math.PI;
    import static java.lang.Math.pow;

    // 就可以直接写 PI 和 pow(2,3)
    ```

    - 注意：不要滥用，否则代码可读性变差，别人不知道 PI 是哪里来的。一般只用在测试框架（如 Assert.*）或频繁使用的常量。


content:
  prompt: "⚙️ 4. 哈希表内部流程（为什么必须成对重写）"
answer:
  mode: rubric
  reference_answer: |-
    一次 HashMap.put(key, value) 的操作大致分四步：

    - 计算哈希：调用 key.hashCode()，并通过扰动函数混合高位信息，得到最终哈希值。

    - 定位桶：根据哈希值取模，找到应插入的桶索引。

    - 冲突处理：若该桶已有元素，遍历链表/红黑树，对每个节点调用 key.equals(k) 判断是否相等。

    - 替换或新增：若存在 equals 相等的节点，覆盖旧值；否则插入新节点。

    关键点：第 2 步只用 hashCode，第 3 步才用 equals。如果两个逻辑相等的对象 hashCode 不同，它们会散入不同的桶，第 3 步永远不会执行，导致 containsKey、get、remove 全部失效。


  prompt: "\U0001F512 四道锁：String 不可变的实现细节"
answer:
  mode: rubric
  reference_answer: "① 类被 final 修饰 — 断子绝孙\n\n```java\npublic final class String {
    ... }\n```\n\n- 禁止任何类继承 String。\n\n- 避免子类通过重写方法来“看似不变、实则可变”，从而破坏语义。\n\n图标理解：\U0001F9EC
    无法被继承，行为不可改写。\n\n---\n\n② 底层数据用 private final 数组 — 内容锁死\n\n在 JDK 8 及以前是 char[]，JDK
    9 起换成了 byte[] + coder（为了紧凑存储）。\n无论哪种，核心字段都是：\n\n```java\nprivate final byte[]
    value;   // JDK 9+\nprivate final byte coder;     // 编码标识\n```\n\n- private：外部无法直接访问。\n\n-
    final：引用一旦初始化就不能再指向其它数组。\n\n- 数组内容本身虽然技术上可变，但类内部从来不改它。\n\n图标理解：\U0001F510 数组引用固定，内容从诞生到回收永不改变。\n\n---\n\n③
    所有方法都不修改原数组 — 只产新对象\n\n这是不可变最直接的体现。任何看起来“修改”字符串的方法，比如 concat、substring、replace、toLowerCase，都返回一个全新的
    String 对象。\n\n```java\nString s = \"hello\";\ns.toUpperCase();          // 返回新
    String \"HELLO\"，s 本身还是 \"hello\"\nSystem.out.println(s);    // 输出 hello\n```\n\n源码中
    substring 的典型实现（JDK 8）：\n\n```java\npublic String substring(int beginIndex, int
    endIndex) {\n    ...\n    return new String(value, beginIndex, subLen); // 新建
    String\n}\n```\n\n图标理解：\U0001F501 每次“变化”都生成新实例，原值纹丝不动。\n\n---\n\n④ 构造时防御性复制 —
    切断外部牵连\n\n即使你通过 new String(char[]) 传入一个字符数组，String 也会拷贝一份，而不是直接持有你传入的引用。\n\n```java\npublic
    String(char value[]) {\n    this.value = Arrays.copyOf(value, value.length); //
    复制，而不是 this.value = value\n}\n```\n\n如果没有这一步，外面的人可以修改原数组，从而影响 String 内容：\n\n```java\nchar[]
    data = {'a', 'b'};\nString s = new String(data);\ndata[0] = 'z';\n// 如果没有防御性复制，s
    就变成 \"zb\" 了。但实际 s 仍是 \"ab\"\n```\n\n图标理解：\U0001F9F1 连构造函数的入口都做了隔离，外部改动无法渗透。\n\n---"

content:
  prompt: "\U0001F9E0 为什么 String 本身不能改？"
answer:
  mode: rubric
  reference_answer: |-
    很多人会问：“我改了字段引用，那原来那个 "张三" 字符串本身变了吗？” 没有。Java 的 String 是不可变对象，内部用 private final byte[] 存储字符，没有提供任何修改方法。所谓“修改 String 参数”，实质是把字段的引用指向了一个新的 String 对象，原字符串对象依然在字符串池或堆中，不可更改。


answer:
  mode: rubric
  reference_answer: |-
    假设有这样一个类：

    ```java
    public class User {
        private String name = "张三";
        private final String id = "ID-001";
        // 省略 getter
    }
    ```

    我们想在不改源码的前提下，把 name 改为 "李四"，甚至把 final 的 id 也改掉。


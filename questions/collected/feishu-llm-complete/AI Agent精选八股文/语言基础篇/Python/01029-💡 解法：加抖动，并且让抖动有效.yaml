content:
  prompt: "\U0001F4A1 解法：加抖动，并且让抖动有效"
answer:
  mode: rubric
  reference_answer: "最直接的手段就是在等待时间中加入随机抖动（Jitter）。\n\n比如原本计算等待 4 秒，我们不精确等 4 秒，而是从
    0 到 4 秒之间随机取一个值（即 Full Jitter）。\n这样 20 个实例的等待时间会散落在 0~4s 这个区间内，重试请求自然错开，从“齐步走”变成“散步”。\n\n```python\nsleep_time
    = random.uniform(0, base_delay * (2 ** attempt))\n```\n\n这个随机化带来的效果，我用一个示意对比：\n\n```text\n无抖动:
    \ [█         ] [█         ] [█         ]   ← 所有请求同时到达\n有抖动:  [ ▓  ▓ ▓ ▓  ▓ ▓ ▓
    \  ▓  ▓ ▓ ]          ← 请求分散在时间轴上\n```\n\n除了抖动，还有几个进阶办法：\n\n- 退避上限 + 最大延迟：不能无限指数增长，否则抖动范围过大也可能等太久。设个
    max_delay（比如 60s），让等待可控。\n\n- 退避策略差异化：不同 Agent 可以使用略微不同的 base_delay，比如通过环境变量或实例
    ID 设置一个微小偏移，进一步打散。\n\n- 熔断机制：连续失败达到阈值，直接短路一段时间，不再重试，避免给服务端雪上加霜。\n\n- 带退避令牌桶：客户端自己控制总重试
    QPS，用令牌桶限制整体重试速率。\n\n实际在生产里，我一般在每个服务实例初始化时，用一个固定种子生成随机数生成器，既保证了可复现调试，又让各实例间的随机序列不同，天然错开。\n\n---\n\n\U0001F3AF
    聊到这里你可能也感受到了，指数退避解决的是“个体如何合理等待”的问题，而抖动解决的是“群体如何不自相残杀”的问题。API 调用不是单机程序，设计重试策略时必须把“别人也在重试”这个前提考虑进去，否则架构上的优雅就被并发现实的残酷打个粉碎。"

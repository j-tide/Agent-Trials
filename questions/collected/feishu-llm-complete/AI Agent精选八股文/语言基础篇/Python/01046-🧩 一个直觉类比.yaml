answer:
  mode: rubric
  reference_answer: "- 普通装饰器：像给手机贴一张固定的钢化膜，所有手机贴一样的膜。\n\n- 带参装饰器：像贴膜机，你可以设置参数（磨砂/防蓝光），机器再生产相应的膜，再去贴。\n\n理解了这层“工厂返回装饰器”的机制，几乎所有带参装饰器的写法都能自己推出来。\n\n---\n\n我一般面试讲到这，对方就不会再追问了。顺便补一句，如果你能再深入说一下用
    functools.wraps 保留元信息和用类实现装饰器，基本上这道题就拉满了。\U0001F44C"

content:
  prompt: "\U0001F501 为什么是指数退避，不是固定间隔"
answer:
  mode: rubric
  reference_answer: |-
    试想一个场景：你的 LLM API 返回了 429 Too Many Requests，这意味着服务端在主动限流。

    - 固定间隔重试，比如每隔 1 秒重试一次。
    如果失败是由短暂的过载引起的，1 秒后服务端可能还没缓过来，你的重试又撞在枪口上，再次 429。
    更糟糕的是，如果所有请求都按同一节奏重试，就会形成“同步脉冲”：失败 → 等1秒 → 同时重试 → 再次过载 → 失败 → 等1秒…… 像个永动机，服务根本恢复不了。

    [图片内容未导入]

    - 时间轴一走，所有重试挤在一起。

    - 指数退避，比如等待序列：1s → 2s → 4s → 8s（通常还会封顶）。
    它的核心思想不是“等得越久越好”，而是给服务端一个恢复的窗口，同时拉大重试间隔。
    如果第一次失败是因为瞬时过载，退避 1~2 秒可能就够了；如果第二次还失败，说明问题更严重，需要更长时间恢复，4 秒甚至 8 秒的等待能有效避开流量高峰。
    用这种方式，客户端的重试节奏被自然拉开，不会集中在同一时刻。

    所以指数退避本质上是 “背压反馈”：失败越多，你施加的负载越小。


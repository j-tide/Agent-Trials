answer:
  mode: rubric
  reference_answer: |-
    对话历史不断增长

    Agent 跑长时间会话，messages 列表一直 append，如果这个列表还被某些地方循环引用着（比如被一个自定义回调函数闭包持有），那不仅它自己永远无法释放，里面每一条包含大段上下文的 dict 也全被钉死。

    Tool 大对象“忘了关”

    Tool 实例可能包了个浏览器、本地模型、大文件句柄。如果 Tool 内部有 self._history = self 这样的循环引用，或者被一个全局 tool_registry 一直存着，那即使 Agent 用完了，这个大对象和它背后的全部内存也释放不掉。


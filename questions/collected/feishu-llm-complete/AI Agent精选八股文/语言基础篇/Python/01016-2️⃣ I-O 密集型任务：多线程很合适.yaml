  prompt: 2️⃣ I/O 密集型任务：多线程很合适
answer:
  mode: rubric
  reference_answer: |-
    当线程在等待网络响应、磁盘读写时，它会主动释放 GIL（比如在 socket.recv 等 C 函数内部）。
    这时其他线程可以立即获得 GIL 开始工作，所以 I/O 密集场景下，多线程能显著提升吞吐。

    我们自研的爬虫调度器，用 ThreadPoolExecutor 做并发下载，10 个线程跑满带宽，GIL 几乎不是瓶颈。

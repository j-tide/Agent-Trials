content:
  prompt: "\U0001F9E8 多个 Agent 同时重试会发生什么？"
answer:
  mode: rubric
  reference_answer: |-
    这是经典的惊群效应（Thundering Herd Problem）。

    假设你有 20 个 Agent 实例，都在调用同一个 LLM API。某刻，API 返回批量限流，20 个实例几乎在同一毫秒内收到失败响应。

    如果它们都使用完全相同的指数退避算法（且没有抖动），计算出的等待时间会一模一样。于是：

    - T+1s：20 个实例同时重试 → 瞬间 20 QPS → 再次集体 429

    - T+2s：它们又同时重试 → 又一次集体失败

    - T+4s：继续同步……

    就算是指数退避，也只能延后这个脉冲，而不能消除它。服务端看到的就不是平滑的请求，而是一阵一阵的“流量浪涌”，很可能再次触发限流阈值，陷入死循环。


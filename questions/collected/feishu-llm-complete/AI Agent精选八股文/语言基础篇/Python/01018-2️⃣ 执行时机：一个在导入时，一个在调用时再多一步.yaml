answer:
  mode: rubric
  reference_answer: "- 普通装饰器：@my_decorator 等价于 func = my_decorator(func)，在模块加载时就执行装饰器函数，得到包装后的函数。\n\n-
    带参装饰器：@repeat(3) 实际上是 func = repeat(3)(func)，先执行 repeat(3) 返回 decorator，再立即把 func
    传进去。\n\U0001F550 repeat(3) 这一步在定义函数时就执行了（跟普通装饰器外层一样），只不过它返回的是一个装饰器，紧接着执行内层装饰。\n\n所以时间线上没有本质延迟，但多了一次函数调用，意味着你可以在
    repeat(3) 里做参数校验、闭包捕获等额外工作。\n\n---"

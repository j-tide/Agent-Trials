answer:
  mode: rubric
  reference_answer: |-
    Python 的类创建有两个钩子能帮我们截胡：

    - 元类 new：类对象生成前介入，能力最强，能改类结构。

    - init_subclass：类对象生成后立刻调用，轻量简洁。

    对自动注册这种“附加动作”，init_subclass 通常更合适——它不会改变类的类型，避免多重继承冲突，而且语义就是“当有子类被定义时通知我”。

    整个自动注册流程用图表示就是这样：


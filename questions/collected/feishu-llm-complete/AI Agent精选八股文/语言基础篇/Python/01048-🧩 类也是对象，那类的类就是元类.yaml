content:
  prompt: "\U0001F9E9 类也是对象，那类的类就是元类"
answer:
  mode: rubric
  reference_answer: |-
    Python 里常说“一切皆对象”，这句话没说完：类本身也是对象。

    ```python
    class Dog:
        pass

    print(type(Dog))  # <class 'type'>
    ```

    Dog 这个类，它的类型是 type。既然 Dog 是对象，那它肯定也是由某个类实例化出来的，这个“创建类的类”，就是元类。

    用图把这几层关系画清楚：

    ```text
    实例化                 实例化
    对象  <──────  类  <──────  元类
    (实例)          (类对象)       (type / 自定义元类)
      │               │               │
      └─ 由类创建      └─ 由元类创建   └─ type 是所有类的默认元类
    ```

    拿 Dog 举例：

    - d = Dog() → d 是 Dog 的实例。

    - Dog 类是 type 的实例。

    - 所以 type 就是 Dog 的元类。


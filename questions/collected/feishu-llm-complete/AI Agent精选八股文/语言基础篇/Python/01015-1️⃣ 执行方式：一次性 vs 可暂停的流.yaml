  prompt: 1️⃣ 执行方式：一次性 vs 可暂停的流
answer:
  mode: rubric
  reference_answer: |-
    普通函数一调到底，return 之后栈帧销毁，啥也不剩。

    ```python
    def normal():
        return [1, 2, 3]      # 一次性返回全部结果

    for i in normal():        # 先拿到完整列表，再迭代
        print(i)
    ```

    生成器函数碰到 yield 会暂停，把值“吐”出去，下次 next() 或迭代再从暂停处继续。它返回的是一个生成器对象，而不是计算结果。

    ```python
    def gen():
        yield 1
        yield 2
        yield 3

    g = gen()                 # 这里还没执行函数体！
    print(next(g))            # 执行到第一个 yield，输出 1，暂停
    print(next(g))            # 继续执行到第二个 yield，输出 2
    ```

    ▶️ 普通函数是“一次性交付”，生成器是“随用随取”。


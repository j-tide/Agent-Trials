content:
  prompt: "♻️ 分代垃圾回收：专门破循环引用"
answer:
  mode: rubric
  reference_answer: |-
    为了解决这个死锁，CPython 补了一层分代垃圾回收器。它只干一件事：找到由容器对象（list、dict、自定义类实例等）组成的循环引用，然后打破它。

    分代的设计基于一个经验假设：大多数对象朝生暮死，活得越久的对象越可能继续活下去。所以 CPython 把对象分成三代：

    text

    新对象 ──创建──▶ [0代] ──经历回收存活──▶ [1代] ──存活──▶ [2代]                ⬆ 回收频率最高         ⬆ 次之          ⬆ 频率最低

    - 每个代都有一个阈值（比如默认 0 代是 700），当该代对象数减分配数之差超过阈值，就触发那一代的回收。

    - 回收 0 代时，先遍历 0 代对象，找到所有外部强引用，然后试探性打破循环：算出每个对象的内部引用计数差值，如果某个循环整体对外不可达，就全回收掉。活下来的对象晋升到 1 代。

    - 回收 1 代时会更彻底，连 0 代也扫一遍；回收 2 代就是全量扫描。

    用图说就是这样（纵向表示代，横向表示回收动作）：

    ```text
    分配对象
              ↓
           [0代对象链表]
                │
         达到阈值触发回收：
         ┌── 扫描0代，打破循环 ── 释放不可达对象
         │   存活对象晋升至 1代
         ↓
           [1代对象链表]
                │
         1代回收时扫描0+1代...
    ```

    这样，正常写代码不用太操心循环引用，但一旦对象被误放进循环，又全是长生命周期对象，就要命了。


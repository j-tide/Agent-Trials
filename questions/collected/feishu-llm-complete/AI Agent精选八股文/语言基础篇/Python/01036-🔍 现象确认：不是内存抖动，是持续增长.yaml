answer:
  mode: rubric
  reference_answer: |-
    上来先别急着动手，得区分两种涨法：

    - 锯齿形：请求来了涨，请求结束跌回去，是正常的工作内存。

    - 阶梯形：每处理一批请求就涨一个台阶，从不回落，这才是泄漏。

    快速确认：用 psutil.Process().memory_info().rss 打点，每隔 10 秒记一次，画个折线图，斜率一直正的就是有问题。


answer:
  mode: rubric
  reference_answer: "- 普通装饰器直接就是一个函数，接收 func，返回新函数（或可调用对象）。\n\n```python\n# 普通装饰器：两层结构\ndef
    my_decorator(func):\n    def wrapper(*args, **kwargs):\n        print(\"before\")\n
    \       result = func(*args, **kwargs)\n        print(\"after\")\n        return
    result\n    return wrapper\n```\n\n- \U0001F446 结构就是 decorator → wrapper。\n\n-
    带参数装饰器需要用“函数工厂”再包一层，因为要接收配置参数，然后返回真正的装饰器。\n\n```python\n# 带参装饰器：三层结构\ndef repeat(times):\n
    \   def decorator(func):          # 这才是真正的装饰器\n        def wrapper(*args, **kwargs):\n
    \           for _ in range(times):\n                result = func(*args, **kwargs)\n
    \           return result\n        return wrapper\n    return decorator\n```\n\n-
    \U0001F446 结构变成 参数工厂 → decorator → wrapper，多了一层。\n\n\U0001F9E0 记忆点：普通装饰器是 @dec
    直接拿函数；带参装饰器是 @dec(arg) 先调用工厂拿到装饰器，再用它去装饰函数。\n\n---"

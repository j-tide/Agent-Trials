answer:
  mode: rubric
  reference_answer: |-
    同样的需求，完全可以用 init_subclass 实现，不需要元类：

    ```python
    class BaseTool:
        registry = {}
        def __init_subclass__(cls, **kwargs):
            super().__init_subclass__(**kwargs)
            if 'execute' not in cls.__dict__ or not callable(cls.__dict__['execute']):
                raise TypeError(f"Tool {cls.__name__} must implement 'execute'")
            tool_name = getattr(cls, 'name', cls.__name__.lower())
            cls.registry[tool_name] = cls

    class SearchTool(BaseTool):
        name = "search"
        def execute(self, query, **kwargs):
            return f"Searching for {query}..."
    ```

    效果几乎一模一样，连注册表都能挂在基类上。

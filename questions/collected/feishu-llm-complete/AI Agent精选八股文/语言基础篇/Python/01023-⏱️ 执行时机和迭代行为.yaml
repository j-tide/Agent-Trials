answer:
  mode: rubric
  reference_answer: |-
    - 列表推导式：赋值那一刻就全算完了，之后你对结果列表做什么操作都很快（随机访问、切片、多次迭代）。

    - 生成器表达式：只有在被迭代时才一步步走，而且只能走一遍，走完就空了。不能往回倒，不能求长度，不能切片。

    比如：

    ```python
    gen = (x for x in range(5))
    print(list(gen))   # [0,1,2,3,4]
    print(list(gen))   # []  —— 已经耗尽了
    ```

    而列表可以反复迭代、随机取 lst[3]。这就是“一次性”和“持久化”的选择。

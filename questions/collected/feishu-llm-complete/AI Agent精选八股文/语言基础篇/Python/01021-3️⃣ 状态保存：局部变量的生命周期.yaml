answer:
  mode: rubric
  reference_answer: |-
    普通函数每次调用，局部变量重生，彼此独立。
    生成器函数的局部变量在 yield 暂停后仍然存活，下次 next() 可以接着用。

    ```python
    def counter():
        n = 0
        while True:
            n += 1
            yield n

    c = counter()
    print(next(c))  # 1
    print(next(c))  # 2  ← n 的值被记住了
    ```

    这个状态保持的能力，让生成器可以天然地描述“有状态的流处理管道”，而不需要你去写一个实现了 iter 和 next 的类。


answer:
  mode: rubric
  reference_answer: |-
    单纯固定并发度不够，实际负载会有波动（文档大小不一、API 偶发延迟），我会加两个自适应手段：

    - Embedding 阶段根据 Queue_A 的堆积量动态调整批次大小：堆积多了就把 mini-batch 从 32 加到 64，加快消费；如果队列快空了，就减小 batch，降低延迟。

    - 向量写入的 batch_size 和最大延时动态匹配：吞吐高时尽量凑满 batch 一次写；快结束时要强制 flush 掉残留数据，别让最后一批卡着不写。


  prompt: 4️⃣ 双向通信：不只是产出，还能接收
answer:
  mode: rubric
  reference_answer: |-
    生成器还有个普通函数做不到的能力：通过 send() 向暂停处传入值，这让它可以扮演轻量级协程。

    ```python
    def echo():
        while True:
            received = yield
            print(f"收到: {received}")

    g = echo()
    next(g)          # 先推到第一个 yield
    g.send("hello")  # 传入值，并继续执行到下一个 yield
    ```

    另外 throw() 和 close() 可以在外部控制生成器的异常和终止，普通函数完全没有这种“外部干预执行”的能力。

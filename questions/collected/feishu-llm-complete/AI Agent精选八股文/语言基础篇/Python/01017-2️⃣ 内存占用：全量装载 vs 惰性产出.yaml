answer:
  mode: rubric
  reference_answer: "这一点在处理大文件或流数据时是碾压级的。\n\n- 普通函数：return 一个列表，所有数据同时在内存里。读 10GB
    日志，内存直接爆。\n\n- 生成器：每次只 yield 一行，内存里永远只保留当前行，可以处理无限流。\n\n```python\n# 普通函数，读完整个文件才返回\ndef
    read_file(path):\n    lines = []\n    with open(path) as f:\n        for line
    in f:\n            lines.append(line)\n    return lines\n\n# 生成器，一行一行产出\ndef read_file_gen(path):\n
    \   with open(path) as f:\n        for line in f:\n            yield line\n```\n\n\U0001F4A1
    这也是为什么很多 Python 标准库把原来返回列表的接口改成了返回生成器（如 range vs xrange，map/filter 的返回类型）。\n\n---"

content:
  prompt: "⚙️ class 语句的背后：元类在偷偷干活"
answer:
  mode: rubric
  reference_answer: |-
    当我们写：

    ```python
    class Dog(Animal):
        leg = 4
    ```

    解释器实际干的事大致等于：

    ```python
    Dog = type('Dog', (Animal,), {'leg': 4})
    ```

    type 作为元类，它的 new 和 init 负责：

    - 收集类名、基类、类属性字典。

    - 创建真正的类对象。

    - 返回这个类对象，并绑定到变量 Dog 上。

    所以元类就是拦截类创建过程的钩子。你可以在这里偷天换日：改类名、加属性、注册到某个中心、强制检查接口，啥都行。


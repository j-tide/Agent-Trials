answer:
  mode: rubric
  reference_answer: "下面是可运行的代码，我嵌入了图标来标出每层职责。\n\n```python\nimport time\nimport random\nimport
    functools\nfrom collections.abc import Callable\nfrom typing import Type, Tuple\n\n#
    \U0001F3ED 第一层：参数工厂，接收重试策略配置\ndef llm_retry(\n    max_retries: int = 3,\n    base_delay:
    float = 1.0,      # 秒\n    max_delay: float = 60.0,      # 秒\n    jitter: bool
    = True,\n    retry_on: Tuple[Type[BaseException], ...] = (Exception,)\n):\n    \"\"\"\n
    \   返回一个装饰器，用于自动重试可能失败的 LLM 调用。\n    \"\"\"\n    # \U0001F3AF 第二层：真正的装饰器\n    def
    decorator(func: Callable) -> Callable:\n        @functools.wraps(func)\n        #
    ⚙️ 第三层：包装函数，加入重试逻辑\n        def wrapper(*args, **kwargs):\n            last_exception
    = None\n            for attempt in range(max_retries + 1):\n                try:\n
    \                   return func(*args, **kwargs)\n                except retry_on
    as e:\n                    last_exception = e\n                    if attempt
    == max_retries:\n                        raise  # 重试耗尽，抛出最后一次异常\n\n                    #
    \U0001F4C8 指数退避：base_delay * 2^attempt\n                    sleep_time = base_delay
    * (2 ** attempt)\n                    # \U0001F3B2 可选抖动：在 0 到 sleep_time 之间取随机值\n
    \                   if jitter:\n                        sleep_time = random.uniform(0,
    sleep_time)\n                    # \U0001F6D1 封顶，防止无限等待\n                    sleep_time
    = min(sleep_time, max_delay)\n\n                    print(f\"⏳ 第{attempt+1}次重试，等待
    {sleep_time:.2f}s \"\n                          f\"（异常: {type(e).__name__}）\")\n
    \                   time.sleep(sleep_time)\n            # 理论上不会执行到这里\n            raise
    last_exception\n        return wrapper\n    return decorator\n```"

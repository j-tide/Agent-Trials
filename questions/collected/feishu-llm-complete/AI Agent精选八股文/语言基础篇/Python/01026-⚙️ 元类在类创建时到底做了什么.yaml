answer:
  mode: rubric
  reference_answer: |-
    Python 里 class 语句的执行顺序是这样的：

    - 解释器收集类体里所有赋值语句、函数定义，塞进一个临时的命名空间字典 namespace。

    - 根据继承链，找到最优先的元类（如果有 metaclass=... 就用它，否则用基类的元类，默认是 type）。

    - 调用这个元类的 new 和 init，把类名、基类元组、命名空间传进去。

    - 返回新创建的类对象，绑定到类名上。


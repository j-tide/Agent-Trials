  prompt: "\U0001F4BE 内存占用上的本质差异"
answer:
  mode: rubric
  reference_answer: |-
    这个区别在数据量大的时候会被放大：2

    ```python
    import sys

    lst = [i for i in range(1000000)]
    gen = (i for i in range(1000000))

    print(sys.getsizeof(lst))   # 大概 8MB+
    print(sys.getsizeof(gen))   # 只有 200 字节左右
    ```

    列表推导式直接吞掉百万个整数对象和列表结构的内存。生成器表达式才占几百字节，因为它根本没存那些值。

    所以一个很粗暴的结论：当你只需要遍历一次，就别让几百万个数字同时在内存里扎堆，用生成器表达式。


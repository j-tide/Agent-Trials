content:
  prompt: "\U0001F9F1 引用计数：对象身上的“生死票”"
answer:
  mode: rubric
  reference_answer: |-
    CPython 里，每个 PyObject 头上都有一个 ob_refcnt 字段。它的规矩特别简单：

    - 每多一个引用，加 1（赋值、传参、放进容器）。

    - 引用失效时，减 1（变量离开作用域、del、容器被释放）。

    - 当引用计数归零，立刻调用析构，内存马上回收。

    ```python
    a = []       # a 指向的列表 refcnt = 1
    b = a        # refcnt = 2
    c = [a]      # refcnt = 3 (列表被放进另一个列表)
    del a        # refcnt = 2
    b = None     # refcnt = 1 (只剩 c 还指它)
    c.clear()    # refcnt = 0 -> 立刻释放
    ```

    它的好处是实时，内存不会莫名占着不放。缺点也很明显：循环引用自己造了个死锁，比如两个对象互相引着，即使外部已经没人引用它们，计数永远 ≥1，就永远漏着。


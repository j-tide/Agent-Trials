content:
  prompt: 2、进阶题：HNSW 索引的原理是什么？为什么它比暴力搜索快？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（分层图结构、贪心搜索、构建参数 M/efConstruction、精度与速度权衡）

    1️⃣ Common Answer

    HNSW 是一种图结构的索引，把向量都连成图，查询的时候从图上跳着找，不用和所有向量都比较，所以比暴力搜索快。它有多层结构，上层稀疏下层密，先在上层快速定位，再在下层精细查找。M 参数控制每个节点的连接数，越大越准但越慢。

    2️⃣ Impressive Answer

    HNSW（Hierarchical Navigable Small World）的核心思想是分层跳跃 + 局部贪心搜索，我从结构和查询两个维度来说：

    - 分层图结构：构建时将节点随机分配到多层，底层包含所有节点（全量），上层节点数指数级减少。每个节点与邻居建立双向连接，连接数由参数 M 控制（通常 16-64）

    - 查询过程：从最高层入口节点开始，贪心地朝查询向量方向移动，逐层降落到底层；底层用 ef（动态候选列表大小）控制搜索范围，最终返回 Top-K 结果

    - 核心参数权衡：

    - 复杂度优势：暴力搜索 O(N·d)，HNSW 平均 O(log N ·d)，百万级向量场景下速度差距可达百倍以上


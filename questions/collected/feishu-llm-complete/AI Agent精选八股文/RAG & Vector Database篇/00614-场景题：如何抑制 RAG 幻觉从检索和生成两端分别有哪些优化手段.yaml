content:
  prompt: 3、场景题：如何抑制 RAG 幻觉？从检索和生成两端分别有哪些优化手段？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐⭐（检索质量、Prompt 约束、事实校验、拒绝回答机制）

    1️⃣ Common Answer

    抑制幻觉的话，检索端可以多召回一些文档，提高相关性。生成端可以加 Prompt 约束，告诉模型不要瞎说。也可以让模型在不确定时说不知道。

    2️⃣ Impressive Answer

    幻觉抑制需要检索 - 生成两端协同，我有五层防御体系：

    - 第一层：检索质量保障（源头控制）

    - 第二层：Prompt 约束（生成时引导）

    - 第三层：Fact-Checking 模块（生成后验证）

    - 第四层：拒绝回答机制（边界控制）

    - 第五层：反馈闭环（持续优化）

    ```text
    用户提问
        ↓
    检索层（召回Top10文档）
        ↓
    [检索质量评估] ← 在这里判断召回文档质量
        ├── Context Relevance < 阈值？
        │       ↓ Yes
        │   触发查询改写 → 重新检索
        │       ↓ No
        └── 继续生成
        ↓
    生成层（LLM 基于召回文档生成答案）
        ↓
    [生成质量评估] ← 在这里判断答案是否有幻觉
        ├── Faithfulness < 阈值？
        │       ↓ Yes
        │   在答案中标注"⚠️ 以下内容可能超出文档范围"
        │       ↓ No
        └── 正常返回答案 + 引用来源
    ```


  reference_answer: |-
    难度级别：⭐⭐（主动检索决策、多轮推理、自适应检索、路由选择）

    Agentic RAG 是将 Agent 的自主决策能力引入 RAG 系统，让模型主动决定何时检索、检索什么、是否需要再次检索，而非传统 RAG 的"有问必检"。

    与传统 RAG 的核心区别：

    [嵌入表格未展开]

    核心能力：

    - 检索路由：根据问题类型选择最合适的数据源

    - 自我反思：评估检索结果是否足够回答问题，不够则补充检索

    - 查询规划：将复杂问题分解为子问题，逐步检索和推理


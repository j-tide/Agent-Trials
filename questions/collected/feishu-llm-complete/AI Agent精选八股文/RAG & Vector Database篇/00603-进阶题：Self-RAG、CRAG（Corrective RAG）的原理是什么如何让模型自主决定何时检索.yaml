    难度级别：⭐⭐⭐⭐（检索判断 Token、相关性评估、自我反思、检索-生成交替、Critique Token）

    1️⃣ Common Answer

    Self-RAG 是让模型自己决定要不要检索，如果觉得自己知道就直接回答，不知道再去检索。CRAG 是检索完之后检查一下结果对不对，不对就修正。具体怎么实现的不太清楚，好像是在训练时加了一些特殊的 token 来控制。

    2️⃣ Impressive Answer

    Self-RAG 和 CRAG 代表了 Agentic RAG 的两个核心方向：检索前决策和检索后纠正。


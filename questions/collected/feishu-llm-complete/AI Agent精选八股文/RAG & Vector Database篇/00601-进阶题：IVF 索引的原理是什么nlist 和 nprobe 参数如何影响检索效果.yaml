    难度级别：⭐⭐⭐⭐（倒排文件、聚类中心、探测列表、精度 - 内存 - 速度三维权衡）

    1️⃣ Common Answer

    IVF 是倒排文件索引，先把向量聚类成若干簇，每个簇有个中心，查询时先找最近的几个簇，然后在簇内搜索。nlist 是簇的数量，nprobe 是搜索时探测的簇数。nlist 越大越准但越慢，nprobe 也是越大越准。


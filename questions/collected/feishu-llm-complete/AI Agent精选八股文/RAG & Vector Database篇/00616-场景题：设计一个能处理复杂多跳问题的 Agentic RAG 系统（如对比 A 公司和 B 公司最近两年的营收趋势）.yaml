content:
  prompt: 3、场景题：设计一个能处理复杂多跳问题的 Agentic RAG 系统（如"对比 A 公司和 B 公司最近两年的营收趋势"）
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐⭐（查询分解、迭代检索、中间推理、结果合成、多源信息融合）

    1️⃣ Common Answer

    这种对比类问题，可以先分别检索 A 公司和 B 公司的营收数据，然后让 LLM 做对比分析。如果一次检索不够，可以多检索几次。也可以把问题拆成几个小问题分别回答，最后合并。用 Agent 框架的话，可以让 Agent 自己规划检索步骤。

    2️⃣ Impressive Answer

    复杂多跳问题需要规划-检索-推理-合成的迭代闭环，我设计四阶段架构：

    - 阶段一：查询规划（Planner）

    - 阶段二：自适应检索（Retriever Agent）

    - 阶段三：中间推理（Reasoner）

    - 阶段四：结果合成（Synthesizer）

    关键设计决策：

    - 最大迭代深度限制（如 3 轮），防止无限循环

    - 每轮检索设置超时，超时后用已有信息生成部分回答

    - 用 LangGraph 实现状态机，管理多阶段流转和错误恢复


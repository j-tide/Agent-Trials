  prompt: 3、场景题：企业内部有大量 PDF 报表（含表格和图表），如何设计 RAG 系统？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（PDF 解析、表格结构化、OCR、图表描述生成、混合索引、Layout 分析）

    1️⃣ Common Answer

    PDF 的话，先把 PDF 转成文本，然后做 RAG。表格可以用工具提取出来，图表的话用 OCR 或者多模态模型识别。然后把所有内容都存到向量数据库里检索。可能需要用 PyPDF 或者 pdfplumber 这些库来解析 PDF。

    2️⃣ Impressive Answer

    企业 PDF 报表的 RAG 需要分层解析 + 多模态索引，我从解析、索引、检索三层设计：

    - 解析层：结构化提取

    - 索引层：混合索引设计

    - 检索层：多路召回 + 智能路由


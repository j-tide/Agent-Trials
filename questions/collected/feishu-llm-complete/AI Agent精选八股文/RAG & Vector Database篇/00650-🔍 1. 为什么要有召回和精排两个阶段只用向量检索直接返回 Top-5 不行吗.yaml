content:
  prompt: "\U0001F50D 1. 为什么要有召回和精排两个阶段？只用向量检索直接返回 Top-5 不行吗？"
answer:
  mode: rubric
  reference_answer: |-
    简短回答：向量检索（召回）追求“快”和“全”，精排追求“准”。直接返回向量检索的 Top-5，相当于让一个短跑选手去下围棋——速度够快，但精度远远不够。

    [图片内容未导入]

    为什么向量检索的 Top-5 不够准？

    向量检索用的是 Bi-Encoder（双塔模型）：查询和文档分别编码成向量，再计算余弦相似度。为了追求毫秒级检索，文档向量通常预先计算好，查询向量即时生成。这带来一个致命弱点：查询和文档之间没有任何直接的 token 级交互。模型只能通过一个固定的向量来“记住”查询的所有意图，当查询复杂时，信息必然丢失。

    举个例子：查询“苹果的最新笔记本性能如何？”

    - 稠密向量很可能被“苹果”带偏，把一堆关于“苹果水果”或“苹果公司手机”的文档排在前面，因为它们和“苹果”语义最接近。

    - 真正相关的 MacBook Pro 评测，因为“苹果”的语义权重被稀释，可能排到第 20 名以后。

    如果你只取 Top-5，大概率拿到的是一堆“苹果”相关的噪音，真正的答案被截断在 5 名之外。召回阶段必须取 Top-K（K 通常取 50~200），保证答案在候选集里；精排阶段再用更精准的模型把答案从中“挑出来”，送到 LLM 面前。


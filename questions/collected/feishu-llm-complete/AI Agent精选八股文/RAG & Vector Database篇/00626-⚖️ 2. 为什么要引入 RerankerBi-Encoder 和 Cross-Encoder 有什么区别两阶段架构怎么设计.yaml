    2.1 Bi-Encoder vs Cross-Encoder：本质区别

    [嵌入表格未展开]

    直观比喻：

    - Bi-Encoder 像招聘助理，快速浏览一万份简历，筛出 100 份可能合适的。

    - Cross-Encoder 像部门主管，把这 100 份简历仔细读一遍，挑出最匹配的 5 份。

    2.2 两阶段架构设计

    [图片内容未导入]

    代码示例：用 sentence-transformers 的 Cross-Encoder 做精排

    ```python
    from sentence_transformers import CrossEncoder

    # 加载 Cross-Encoder 模型（通常比 Bi-Encoder 大，但更准）
    reranker = CrossEncoder('BAAI/bge-reranker-large')

    # 召回阶段已经拿到了候选文档 (top-100)
    candidates = [
        "太阳能电池的基本原理",
        "光伏电站运维手册",
        "单晶硅效率提升的研究与实践",
        "如何清洗太阳能板",
        "钙钛矿材料的最新进展",
    ]
    query = "如何提高光伏板的转换效率？"

    # 构造 (query, doc) 对
    pairs = [(query, doc) for doc in candidates]

    # 精排：Cross-Encoder 对每一对打分
    scores = reranker.predict(pairs)

    # 按分数降序排列，取 Top-3 给 LLM
    ranked_docs = sorted(zip(candidates, scores), key=lambda x: x[1], reverse=True)[:3]
    # 结果：单晶硅效率提升研究 > 钙钛矿材料 > 太阳能电池原理
    ```

    为什么不能直接用 Cross-Encoder 做全量检索？

    假设你有 1000 万篇文档，Cross-Encoder 需要对每一篇都和查询拼在一起跑一遍完整的 Transformer 前向。这一轮下来可能要几分钟甚至几小时，延迟根本无法接受。两阶段架构的本质是 “用廉价的粗筛换昂贵的精挑”——100 次 Cross-Encoder 调用是可行的，100 万次则不行。


content:
  prompt: "\U0001F52A 1. 为什么 RAG 需要对文档做分块？"
answer:
  mode: rubric
  reference_answer: |-
    两个硬约束，逼着我们切：

    - 模型上下文窗口有限：即使现在有了 128K 的超长窗口，但塞入一整本 500 页的手册既不经济（Token 成本爆炸），也会让模型“注意力涣散”——真正有用的段落被埋在海量无关文字里，检索精度和生成质量都会断崖下降。

    - 检索需要合适粒度：Embedding 模型是为短文本优化的。如果你把整章内容编码成一个向量，它只会学到“这一章大致关于什么”，而无法精细区分“第三段讲的是退款条件，第五段讲的是退货流程”。检索时命中整章，但里面 90% 的内容跟用户问题无关，模型读着读着就乱了。

    直白比喻：

    不分块的 RAG 就像去图书馆找资料，管理员不给你某一页，而是把整个书架搬到你面前，让你自己翻。分块就是把书拆成目录卡片，每张卡片摘录一段内容，你能快速抽出最相关的那几张，精准且省力。


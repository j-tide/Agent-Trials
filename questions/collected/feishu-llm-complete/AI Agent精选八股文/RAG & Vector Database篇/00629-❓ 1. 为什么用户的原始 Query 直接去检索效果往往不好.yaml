content:
  prompt: "❓ 1. 为什么用户的原始 Query 直接去检索效果往往不好？"
answer:
  mode: rubric
  reference_answer: |-
    一句话解释：用户的自然语言问题和知识库中存储的文档语言之间存在“表达鸿沟”——用户用口语问，文档用书面语写，用户用泛指，文档用精确术语。

    这种鸿沟具体表现在三个层面：

    [图片内容未导入]

    ① 语言风格鸿沟（口语 vs 书面语）

    用户习惯于口语化、省略句、甚至带错别字的提问。而知识库里的文档通常是正式、书面化的表达。向量检索背后是语义模型，它对口语和书面语的匹配天然存在偏差。

    ② 信息密度鸿沟（泛指 vs 精确）

    用户常说“那个东西”、“上次提到的”，这些指代在单次检索中完全无法理解。此外，复杂问题可能包含多个意图，比如“这个 API 和那个 API 有什么区别，性能如何？”——如果直接向量化，语义被平均，很可能哪个意图都没检索准。

    ③ 结构鸿沟（碎片 vs 完整逻辑）

    文档中信息是层次化、结构化的，而用户提问往往是碎片化的。比如用户问“怎么解决内存泄漏”，文档里可能分布在“常见问题”章节和“最佳实践”章节，直接检索可能只召回其中一部分。

    直观验证：

    你可以做个简单实验：把用户 Query 向量化后检索，看返回结果的余弦相似度分数。你会发现很多看似相关的分数并不高，而真正相关的文档分数却被一堆噪音淹没。这是因为 Embedding 模型本身也是“折中”的，它无法从一句口语中精准捕捉到文档中对应的那个精确短语。


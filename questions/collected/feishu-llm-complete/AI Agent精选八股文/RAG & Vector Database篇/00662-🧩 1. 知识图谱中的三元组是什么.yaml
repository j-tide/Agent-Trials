content:
  prompt: "\U0001F9E9 1. 知识图谱中的三元组是什么？"
answer:
  mode: rubric
  reference_answer: |-
    三元组是知识图谱存储和表示知识的最基本单位，可以理解为一句“主谓宾”式的陈述句，只不过它被高度结构化，变成了机器能直接处理的格式。

    ```text
    三元组 = (主体, 关系, 客体)
    ```

    - 主体：通常是一个实体，比如一个人、一个地点、一个产品。

    - 关系：描述主体和客体之间的联系，通常是动词或介词短语。

    - 客体：可以是另一个实体，也可以是一个具体的属性值（比如数字、日期、字符串）。

    直观图示与对应关系：

    [图片内容未导入]

    这组三元组就可以表达为：

    - (张三, 担任, 产品经理)

    - (张三, 属于, 研发部)

    - (张三, 开发, 产品 Alpha)

    - (产品 Alpha, 上线于, 2025-06-01)

    把这些三元组串起来，就构成了一张巨大的、可推理的网络，这就是知识图谱。

    代码示例：用 Python 字典存储三元组并进行简单推理

    ```python
    # 定义三元组列表
    triples = [
        ("张三", "担任", "产品经理"),
        ("张三", "属于", "研发部"),
        ("张三", "开发", "产品 Alpha"),
        ("产品 Alpha", "上线于", "2025-06-01")
    ]

    # 查询“产品 Alpha 是由哪个部门的谁开发的？”
    def find_developer(product):
        results = []
        for s, r, o in triples:
            if r == "开发" and o == product:
                person = s
                # 继续查找这个人的部门
                for s2, r2, o2 in triples:
                    if s2 == person and r2 == "属于":
                        results.append((person, o2))
        return results

    print(find_developer("产品 Alpha"))  # 输出: [('张三', '研发部')]
    ```

    这种基于关系链的多跳查询，正是向量检索难以直接做到的。


content:
  prompt: "\U0001F916 1. Agentic RAG 和传统 RAG Pipeline 最核心的区别是什么？"
answer:
  mode: rubric
  reference_answer: |-
    一句话：传统 RAG 是“死”的流水线，而 Agentic RAG 是“活”的智能体。前者只负责执行固定步骤，后者能自主决定做什么、怎么做、何时停。

    ```text
    传统 RAG Pipeline：
      问题 → [固定: 检索] → [固定: 拼提示词] → [固定: LLM 生成] → 答案

    Agentic RAG：
      问题 → [Agent 大脑] → 需要检索吗？
               ├─ 否 → 直接回答
               └─ 是 → 去哪里检索？(选知识库/工具)
                       → 检索后：结果够好吗？
                           ├─ 否 → 改写查询，再检索，或切换策略
                           └─ 是 → 生成答案 → 检查答案忠实度/完整性
                                      ├─ 通过 → 输出
                                      └─ 未通过 → 修正或补充检索
    ```

    五个维度的本质差异：

    [嵌入表格未展开]

    核心区别在于“决策权”：传统 RAG 的每一步都是代码写死的，而 Agentic RAG 引入了一个 Agent 大脑（通常是 LLM 加上工具使用能力），让它能在一个 while 循环里不断问自己：“我现在知道什么？还缺什么？接下来做什么？”。这个大脑赋予 RAG 前所未有的灵活性和鲁棒性。


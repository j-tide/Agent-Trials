    1️⃣ Common Answer

    这种模糊查询确实不好处理。可以让用户说清楚一点，或者用 LLM 帮忙改写一下查询。"最近"可以理解为最近一段时间，"那个政策"需要从上下文推断是哪个政策。也可以多召回一些文档，让 LLM 自己判断哪个是用户想要的。


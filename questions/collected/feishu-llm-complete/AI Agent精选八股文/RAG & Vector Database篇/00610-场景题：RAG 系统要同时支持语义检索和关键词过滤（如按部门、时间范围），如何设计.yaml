content:
  prompt: 3、场景题：RAG 系统要同时支持语义检索和关键词过滤（如按部门、时间范围），如何设计？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（标量过滤 + 向量检索、预过滤 vs 后过滤、Payload 索引、性能影响）

    1️⃣ Common Answer

    可以先用关键词过滤一下文档，再对过滤后的结果做向量检索。或者向量检索完再根据部门、时间做过滤。用 Milvus 的话，好像可以在查询里加 filter 条件，直接一步到位。

    2️⃣ Impressive Answer

    向量检索和标量过滤的组合，核心在于过滤时机的权衡，有两种策略：

    - 预过滤（Pre-filtering）：先用标量条件（部门=XX，时间范围）筛出候选集，再在候选集上做向量检索

    - 后过滤（Post-filtering）：先向量检索 Top-K，再过滤不满足条件的结果

    - 生产推荐方案：在向量数据库（Qdrant/Milvus）中对标量字段建 Payload 索引，让数据库在向量检索时同步应用过滤条件，利用索引加速标量过滤，避免全量扫描；同时适当放大初始召回数（如 ef=200）保证过滤后仍有足够结果

    - 分区隔离优化：若按部门过滤是高频场景，可以按部门做 Collection 分区（Milvus Partition），直接缩小检索范围，性能提升最显著


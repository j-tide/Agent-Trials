content:
  prompt: "⚖️ 2. SaaS 场景下，多租户 RAG 的隔离方案与权衡"
answer:
  mode: rubric
  reference_answer: |-
    在 SaaS 里，隔离绝不是“越强越好”，而是要在安全性、成本、性能、运维复杂度四者之间找到平衡。从上到下，隔离等级递增，成本也递增。

    [图片内容未导入]

    [嵌入表格未展开]

    权衡核心：

    - 免费用户 / 小微企业：文档少，付费意愿低，用 Namespace 或 Metadata Filter 足以。给他们独立 Collection 就像给路边的共享单车配私人飞机——浪费且没必要。

    - 付费企业客户：文档多，查询 QPS 高，对响应时间和数据安全性有合同要求。必须上 独立 Collection 甚至 独立实例，既能保证性能不相互干扰，也能满足审计和合规需求。

    - 中间层：可以用 Namespace 作为平滑过渡。Namespace 在 Milvus、Chroma、Pinecone（通过 index 区分）中都有支持，它比 filter 更安全，比独立 Collection 更省资源。

    一个常见的错误：初期为了省事，全部用 metadata filter 一把梭。当租户量上来后，查询时 WHERE tenant_id=xxx 会在海量向量中做过滤，导致响应时间飙升，而且一旦 filter 写错就是安全事故。架构上，隔离策略必须与客户等级绑定，动态可配。


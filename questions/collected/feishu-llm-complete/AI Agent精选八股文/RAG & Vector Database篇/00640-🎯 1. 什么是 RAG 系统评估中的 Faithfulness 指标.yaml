content:
  prompt: "\U0001F3AF 1. 什么是 RAG 系统评估中的 Faithfulness 指标？"
answer:
  mode: rubric
  reference_answer: |-
    Faithfulness（忠实度）衡量的是：LLM 生成的答案，是不是严格基于你塞给它的“参考资料”（检索到的上下文），而不是凭自己训练时的记忆凭空捏造。

    换句话说，它追问的是：“你对我从知识库里搬来的那几页纸，有没有老老实实照着回答？”

    [图片内容未导入]

    一个高 Faithfulness 的系统，答案里的每一个事实主张，都能在检索到的上下文中找到出处。

    而低 Faithfulness 则意味着模型在“自由发挥”，可能产生幻觉、加入过时训练数据、或曲解文档。

    为什么 Faithfulness 是 RAG 的“高压线”？

    因为 RAG 的初衷就是“用外部知识对抗幻觉”。如果模型连你递给它的资料都不尊重，那 RAG 就失去了存在的意义。在医疗、法律、金融等领域，一个低 Faithfulness 的回答可能导致严重后果，所以它通常是 RAG 评估体系中最敏感的指标。

    一个简单的示例判断：

    ```python
    # 简单的基于规则的 Faithfulness 检查（示意）
    def simple_faithfulness_check(answer, context):
        # 将答案拆分为独立的事实主张（简化：按句号拆分）
        claims = answer.split("。")
        unfaithful_claims = []
        for claim in claims:
            if not any(claim.strip() in ctx for ctx in context):
                unfaithful_claims.append(claim)
        return unfaithful_claims  # 返回无法在上下文中找到的句子
    ```

    实际生产中当然不会这么简单，但核心思想一样：逐条核对。更准确的做法是用 LLM-as-Judge 来做这件事。


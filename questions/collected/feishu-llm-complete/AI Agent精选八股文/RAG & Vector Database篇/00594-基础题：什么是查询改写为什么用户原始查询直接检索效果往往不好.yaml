content:
  prompt: 1、基础题：什么是查询改写？为什么用户原始查询直接检索效果往往不好？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（口语化查询、语义鸿沟、模糊表述、多意图混合）

    查询改写是指在用户原始查询进入检索系统之前，对其进行优化转换，使其更适合检索的过程。

    用户原始查询效果差的四个原因：

    - 口语化表述：用户说"那个东西怎么弄"，但文档写的是"配置方法"——口语和书面语之间存在语义鸿沟

    - 模糊和省略：用户省略了关键上下文，如"怎么部署"没说部署什么、用什么环境

    - 多意图混合：一个查询包含多个子问题，如"Redis 和 MySQL 的区别以及各自的使用场景"，单次检索难以同时覆盖

    - 词汇不匹配：用户用的词和文档用的词不同（如"挂了"vs"服务不可用"），导致关键词检索和语义检索都可能失效

    查询改写的本质：弥合用户表达和文档表达之间的语义鸿沟，让检索系统"听懂"用户真正想问什么


answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（A/B 测试、Golden Set 回归、漂移检测、告警策略、反馈闭环）

    1️⃣ Common Answer

    上线后可以看看用户反馈，如果有人说回答不对就去查一下。也可以定期抽样检查一些回答的质量。如果质量下降了，可能是数据变了或者模型有问题，逐个排查一下。也可以做 A/B 测试，比较新旧版本的效果。

    2️⃣ Impressive Answer

    线上质量保障需要主动监控 + 被动反馈双通道，我有四层监控体系：

    - 第一层：实时指标监控

    - 第二层：定期回归测试

    - 第三层：漂移检测

    - 第四层：排查 SOP


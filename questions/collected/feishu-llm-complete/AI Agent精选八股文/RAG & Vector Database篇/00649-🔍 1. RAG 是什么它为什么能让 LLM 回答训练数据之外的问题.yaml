content:
  prompt: "\U0001F50D 1. RAG 是什么？它为什么能让 LLM 回答训练数据之外的问题？"
answer:
  mode: rubric
  reference_answer: |-
    RAG（检索增强生成）是一种给 LLM 装上“外挂知识库”的技术。 在回答问题前，它先从外部文档中检索相关信息，然后把这些信息和问题一起喂给模型，让模型“参考着回答”，而不是只依赖记忆里的训练数据。

    ```text
    纯 LLM： 问题 → [LLM 的内部参数记忆] → 答案（可能过时、或完全编造）
    RAG：    问题 → [检索相关文档] → [文档+问题] → LLM → 有据可查的答案
    ```

    为什么能回答训练数据之外的问题？

    因为 LLM 的答案不再来自它固化在参数里的旧知识，而是来自你实时塞给它的外部资料。这些资料可以是今天的新闻、公司内部文档、产品手册——任何模型训练时没见过的东西。模型只是做了一个“阅读理解”，从你给的上下文中提取答案，而不是调用它那可能过时、可能错乱的记忆。

    用代码感受一下差别：

    ```python
    # 纯 LLM：可能产生幻觉
    answer = llm("公司最新的休假政策是什么？")
    # → "根据我的训练数据（截止2024年），公司的休假政策是..."

    # RAG：检索到真实政策文档，再回答
    docs = retrieve("公司最新的休假政策")  # 从向量库找到相关文档
    answer = llm(f"根据以下资料回答：\n{docs}\n\n问题：公司最新的休假政策？")
    # → "根据《2026年员工手册》，公司年假为15天，并可累积..."
    ```

    这就是 RAG 的本质：把 LLM 从“记忆力有限的考生”变成了“随时可以翻参考书的开卷考生”。


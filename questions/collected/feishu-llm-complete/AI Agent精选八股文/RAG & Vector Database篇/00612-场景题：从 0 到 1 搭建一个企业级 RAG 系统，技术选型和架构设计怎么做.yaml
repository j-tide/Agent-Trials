  prompt: 3、场景题：从 0 到 1 搭建一个企业级 RAG 系统，技术选型和架构设计怎么做？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐⭐（全链路架构、技术栈选型、容量规划、灰度上线、降级方案）

    1️⃣ Common Answer

    从 0 到 1 的话，先选个框架，比如 LangChain 或 LlamaIndex。然后选个向量数据库，Milvus 或者 Qdrant。Embedding 用 BGE 或 OpenAI。LLM 用 GPT-4 或者开源模型。然后把文档处理、检索、生成串起来就行了。部署的话用 Docker 容器化。

    2️⃣ Impressive Answer

    企业级 RAG 从 0 到 1 需要分阶段交付，我按四个阶段设计：

    - 阶段一：MVP 验证（2-4 周）

    - 阶段二：工程化落地（4-8 周）

    - 阶段三：生产加固（4-6 周）

    - 阶段四：持续优化（长期）


content:
  prompt: 3、场景题：亿级向量库（10 亿 +）如何设计索引方案？内存和延迟如何权衡？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐⭐（大规模索引、PQ 压缩、IVF-PQ、多索引融合、SLA 保障）

    1️⃣ Common Answer

    10 亿向量很大了，可能需要用 IVF 加 PQ 压缩来减少内存。也可以用分布式向量数据库，把数据分到多台机器。或者用 HNSW 但减少连接数。延迟的话，可以加缓存或者用近似检索。具体要看硬件条件和 SLA 要求。

    2️⃣ Impressive Answer

    10 亿向量是大规模 RAG的典型场景，我从存储、索引、查询三层设计：

    - 存储层：PQ 压缩是核心

    - 索引层：IVF-PQ 组合

    - 查询层：多索引融合 + GPU 加速

    生产参考：10 亿向量、IVF-65536 + PQ32、单卡 A100，Recall@100=0.93 时延迟约 80ms


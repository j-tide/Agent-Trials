content:
  prompt: 1、基础题：多模态 RAG 和纯文本 RAG 有什么区别？支持哪些模态？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（图片、表格、PDF、音视频、多模态 Embedding、模态对齐）

    多模态 RAG 是将 RAG 的能力从纯文本扩展到图片、表格、PDF、音视频等多种数据模态的技术。

    与纯文本 RAG 的核心区别：

    - 数据处理层：纯文本只需分块，多模态需要先做模态解析（OCR、表格提取、音频转写等），将非文本内容转化为可检索的形式

    - Embedding 层：纯文本用文本 Embedding，多模态需要跨模态 Embedding（如 CLIP 将图文映射到同一向量空间）或分模态独立 Embedding

    - 检索层：纯文本单一索引，多模态可能需要多索引（文本索引 + 图片索引）或统一索引

    - 生成层：纯文本用文本 LLM，多模态需要视觉语言模型（如 GPT-4V、Gemini）理解图片内容

    支持的模态及处理方式：

    - 图片：CLIP/SigLIP Embedding 或 VLM 生成描述文本

    - 表格：结构化提取为 Markdown/JSON，或转为自然语言描述

    - PDF：Layout 分析 + OCR + 表格提取 + 图片提取的组合处理

    - 音视频：ASR 转写为文本，关键帧提取为图片


content:
  prompt: "\U0001F9E0 1. 传统 RAG 和 Self-RAG 在检索触发机制上的核心区别是什么？"
answer:
  mode: rubric
  reference_answer: "一句话概括：传统 RAG 的检索是“强制触发”，无论问题是什么，先查再说。Self-RAG 的检索是“按需触发”，模型自己决定要不要查、查什么、查完怎么用。\n\n```text\n传统
    RAG：\n  用户提问 → 【必定检索】→ 把检索结果拼进 Prompt → LLM 生成答案\n\nSelf-RAG：\n  用户提问 → LLM 先“思考”要不要检索？\n
    \             ├─ 不需要（比如“你好”）→ 直接生成答案\n              └─ 需要 → 生成检索查询 → 检索 → \n                        LLM
    批判每个检索片段是否相关 →\n                        基于相关片段生成答案，并自我批判答案是否忠实于片段\n```\n\n本质区别：\n\n传统
    RAG 把“检索”和“生成”硬性分离，检索是一个独立的前置步骤，无论问题是什么，都强制执行。这导致大量简单问题（如“你叫什么名字？”、“今天天气怎么样？”）也走了一遍昂贵的检索流程，增加了延迟和成本。\n\nSelf-RAG
    则把“要不要检索”的决策权交给了模型本身。它在训练时被灌输了特殊的“反思令牌”（Reflection Tokens），使得模型可以在推理时动态判断是否需要检索，并对检索回来的每一段内容进行批判性评估——哪些是相关的，哪些是废话，生成的答案是否忠实于检索到的信息。\n\n一个直观的代码对比：\n\n```python\n#
    传统 RAG：无差别检索\ndef traditional_rag(question):\n    docs = vectorstore.similarity_search(question,
    k=5)  # 不管问题是什么，都去查\n    prompt = f\"参考资料：\\n{docs}\\n\\n问题：{question}\\n回答：\"\n
    \   return llm(prompt)\n\n# Self-RAG：模型自主决定是否检索\ndef self_rag(question, llm):\n
    \   # 模型生成过程可以输出特殊的 token 来表明意图\n    response = llm.generate_with_tokens(question)
    \ # 能输出 <RETRIEVE> 或 <NO_RETRIEVE>\n    if \"<RETRIEVE>\" in response:\n        query
    = llm.extract_query(response)  # 模型自己写的检索 query\n        docs = vectorstore.search(query)\n
    \       final = llm.generate_with_critique(question, docs)  # 生成 + 批判\n        return
    final\n    else:\n        return llm.extract_answer(response)  # 直接返回答案，不走检索\n```\n\n这就是
    Self-RAG 最核心的设计哲学：不是所有问题都需要检索，检索应该是一个可以被模型自主调用的“工具”，而不是一个强制的前置流程。\n\n---"

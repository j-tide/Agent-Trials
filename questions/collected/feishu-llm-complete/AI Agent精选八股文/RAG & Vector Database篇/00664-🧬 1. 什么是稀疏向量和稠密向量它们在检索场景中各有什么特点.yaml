content:
  prompt: "\U0001F9EC 1. 什么是稀疏向量和稠密向量？它们在检索场景中各有什么特点？"
answer:
  mode: rubric
  reference_answer: |-
    在 RAG 检索中，把文本变成向量有两种截然不同的哲学：稀疏向量 和 稠密向量。它们就像查字典和找相似，各有所长。

    [图片内容未导入]

    稀疏向量

    像一个极其详细的词典索引。每个维度对应词典里的一个词，向量里绝大部分位置是 0，只有文档中真正出现的词才有非零值。它不会“猜”，你搜“ERP”，它绝对不会去找“企业资源计划”。优势在于精确匹配专有名词、缩写、产品型号，但缺点也很明显：不懂同义词，也理解不了语义，搜“便宜”返回不了“实惠”。

    稠密向量

    像一个语义压缩器。用 Embedding 模型（如 text-embedding-3、BGE）把整段文本压缩成几百到几千维的实数向量，每个维度都承载着深层语义。搜“性价比高的手机”，它可能返回“千元机评测”的文档，即使原文里没有“性价比”这个词。但它对冷冰冰的专有名词（如 “AZ-900”、“RFC 6749”）不够敏感，可能被语义相近的通用词带偏。

    两者的互补关系：

    - 用户问“怎么退款”，稠密向量能理解“退款”和“退钱”是同义，找到相关条款。

    - 用户搜“错误码 E10042”，稀疏向量能精准定位到那一段，而稠密向量可能被一堆包含“错误码”但无关的文档淹没。


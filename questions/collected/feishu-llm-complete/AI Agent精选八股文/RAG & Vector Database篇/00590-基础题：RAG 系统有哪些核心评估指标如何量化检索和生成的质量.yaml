content:
  prompt: 1、基础题：RAG 系统有哪些核心评估指标？如何量化检索和生成的质量？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐（Recall@K、MRR、NDCG、Faithfulness、Answer Relevancy）

    RAG 评估需要检索质量和生成质量两个维度分别度量：

    检索质量指标：

    - Recall@K：Top-K 召回结果中包含正确文档的比例，衡量"能不能找到"

    - MRR（Mean Reciprocal Rank）：正确文档首次出现的排名倒数的均值，衡量"排得准不准"

    - NDCG（Normalized Discounted Cumulative Gain）：考虑排名位置的加权相关性评分，排名越靠前权重越高

    生成质量指标：

    - Faithfulness（忠实度）：回答中的事实是否都能在检索文档中找到依据，衡量"有没有瞎说"

    - Answer Relevancy（回答相关性）：回答是否真正回答了用户的问题，衡量"答没答到点上"

    - Context Precision（上下文精度）：检索到的文档中，真正对回答有用的比例

    - Context Recall（上下文召回）：回答所需的信息在检索文档中的覆盖程度

    核心原则：检索指标和生成指标要联合看——检索好但生成差说明 LLM 没用好上下文，检索差但生成好可能是模型在"编"


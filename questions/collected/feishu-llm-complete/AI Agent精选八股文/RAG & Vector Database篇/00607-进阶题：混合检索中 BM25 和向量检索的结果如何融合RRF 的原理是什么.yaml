  prompt: 2、进阶题：混合检索中 BM25 和向量检索的结果如何融合？RRF 的原理是什么？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（Reciprocal Rank Fusion、加权融合、归一化、参数调优）

    1️⃣ Common Answer

    混合检索就是把 BM25 和向量的结果合在一起。融合的话，可以把两个结果列表拼起来去重，或者给每个结果算个加权分。RRF 是一种融合方法，大概是按排名给个倒数分数，然后加起来。具体公式记不太清了，好像是 1/(k+rank) 这种形式。

    2️⃣ Impressive Answer

    融合策略的核心是排名融合而非分数融合，因为两种检索的分数空间不一致。主流方案有两种：

    - RRF（Reciprocal Rank Fusion，倒数排名融合）：

    - 归一化加权融合：

    生产实践：RRF 是默认首选，无需调参且效果稳定；若追求极致效果且有标注数据，可用加权融合 + 网格搜索


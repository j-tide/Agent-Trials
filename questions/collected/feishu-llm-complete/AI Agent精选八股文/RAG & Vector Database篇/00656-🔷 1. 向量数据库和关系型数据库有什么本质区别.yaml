content:
  prompt: "\U0001F537 1. 向量数据库和关系型数据库有什么本质区别？"
answer:
  mode: rubric
  reference_answer: |-
    把这两种数据库放在一起比，不是比谁更好，而是看它们各自解决的根本问题不一样。一句话：关系型数据库管“精确”，向量数据库管“模糊”。

    ```text
    关系型数据库（PostgreSQL / MySQL）
      数据形态：结构化表格，字段严格定义
      查询方式：精确匹配、范围查询、JOIN
      索引结构：B-Tree / Hash，支持等值和排序
      擅长：事务、多表关联、复杂业务逻辑

    向量数据库（Milvus / Qdrant / Chroma）
      数据形态：非结构化文本、图片、音频 → 高维向量
      查询方式：相似度搜索（余弦、欧氏距离）
      索引结构：ANN 近似最近邻（HNSW / IVF）
      擅长：语义搜索、推荐、去重
    ```

    本质差异，我用一个排查问题的经历来说明：
    有一次用户反馈“搜‘退款政策’找不到东西”，SQL 里用的是 WHERE content LIKE '%退款%'，但文档里写的是“退货流程”，一个字都对不上。这就是结构化检索的局限——它没有“理解”能力。而向量数据库把“退款政策”和“退货流程”映射到空间里很接近的两个点，因为它们语义相近。这就是本质：关系型查的是“字符串”，向量型查的是“含义”。

    代码层面区别：

    ```sql
    -- 关系型：精确查找，一字不差sql
    SELECT * FROM docs WHERE content LIKE '%退款%';   -- 查不到“退货流程”
    ```

    ```python
    # 向量型：语义查找，理解含义
    results = collection.query(
        query_embeddings=[embed("退款政策")],
        n_results=5
    )
    # 第一条结果大概率就是“退货流程说明”
    ```

    但向量数据库不适合管钱、管库存、管订单——那些需要 ACID 事务和精确计数的场景，仍然是关系型数据库的绝对领域。不要把向量数据库当成 SQL 的替代品，它是为非结构化数据的“语义搜索”而生的专业工具。


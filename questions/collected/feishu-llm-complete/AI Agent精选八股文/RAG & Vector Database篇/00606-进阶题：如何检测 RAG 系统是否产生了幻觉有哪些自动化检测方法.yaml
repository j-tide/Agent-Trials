    难度级别：⭐⭐⭐⭐（NLI 模型、事实一致性评分、Self-Check、引用溯源）

    1️⃣ Common Answer

    RAG 幻觉就是模型瞎说不真实的内容。检测的话，可以让人工审核一下，或者用另一个模型来判断回答是否正确。也可以让模型自己检查一遍。还可以看模型的回答有没有引用检索到的文档，没引用的可能是幻觉。


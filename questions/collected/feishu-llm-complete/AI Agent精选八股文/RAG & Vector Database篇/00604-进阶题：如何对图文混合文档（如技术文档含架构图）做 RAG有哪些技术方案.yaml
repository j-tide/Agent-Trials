content:
  prompt: 2、进阶题：如何对图文混合文档（如技术文档含架构图）做 RAG？有哪些技术方案？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（多模态 Embedding、CLIP、ColPali、视觉语言模型、图文联合索引）

    1️⃣ Common Answer

    图文混合文档的话，可以把图片用 OCR 识别出文字，然后和正文一起做 RAG。或者用多模态模型直接理解图片内容。架构图的话，可以让模型描述一下图片内容，把描述文本存进去检索。具体用什么工具看项目需求。

    2️⃣ Impressive Answer

    图文混合文档的 RAG 有三种主流方案，复杂度和效果递增：

    - 方案一：图片转文本（Text-Only Pipeline）

    - 方案二：多模态 Embedding 统一索引

    - 方案三：ColPali / 文档视觉检索（最前沿）

    生产推荐：方案一快速上线 → 方案二提升图片召回 → 方案三处理复杂文档，渐进式升级


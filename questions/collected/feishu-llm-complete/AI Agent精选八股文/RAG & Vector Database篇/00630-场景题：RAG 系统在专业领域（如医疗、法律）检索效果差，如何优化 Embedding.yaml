    难度级别：⭐⭐⭐⭐（领域微调、Contrastive Learning、数据构造、Adapter 方案）

    1️⃣ Common Answer

    领域效果差的话，可能是通用 Embedding 不懂专业术语。可以试试微调 Embedding 模型，用领域数据训练一下。或者用大一点的模型，比如 BGE-large。也可以考虑用领域专用的 Embedding，如果有的话。

    2️⃣ Impressive Answer

    领域适配的本质是分布对齐，我有三层递进方案：

    - 第一层：Prompt 增强（零成本快速验证）

    - 第二层：Contrastive Learning 微调（核心方案）

    - 第三层：Adapter 轻量化方案（资源受限时）

    关键点：先评估领域词分布偏移程度（KL 散度），若偏移小则 Prompt 增强足够；若偏移大则必须微调


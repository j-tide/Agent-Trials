    难度级别：⭐⭐⭐（中英文能力差异、上下文长度、开源 vs 闭源、领域适配）

    1️⃣ Common Answer

    BGE 是智源开源的，有中文和英文版本，中文效果不错。M3E 也是开源的，主打中文场景。OpenAI Ada 是 API 调用的，效果好但要花钱，而且中文支持一般。选型的话，中文项目用 BGE 或 M3E，英文或者有预算就用 OpenAI。


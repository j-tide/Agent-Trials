  prompt: 2、进阶题：HyDE、Multi-Query、Step-Back Prompting 等查询改写技术的原理和区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（假设文档生成、多查询扩展、抽象化提问、Query Decomposition）

    1️⃣ Common Answer

    HyDE 是让模型先生成一个假的答案，然后用这个答案去检索，因为答案和文档更像。Multi-Query 就是把一个问题改写成多个不同的问法，然后分别检索再合并结果。Step-Back 是让问题变得更抽象一些。这几种方法都是为了提高检索效果，具体用哪个看情况。

    2️⃣ Impressive Answer

    查询改写的核心思路是缩短查询与文档的语义距离，主流技术有四种，各自解决不同的问题：

    - HyDE（Hypothetical Document Embeddings）：

    - Multi-Query（多查询扩展）：

    - Step-Back Prompting（后退提问）：

    - Query Decomposition（查询分解）：

    选型建议：事实型问题首选 HyDE，覆盖率不足用 Multi-Query，具体问题用 Step-Back，复杂问题用 Decomposition


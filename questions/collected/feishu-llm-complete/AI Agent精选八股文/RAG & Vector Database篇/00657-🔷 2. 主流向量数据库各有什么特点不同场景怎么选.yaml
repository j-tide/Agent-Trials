content:
  prompt: "\U0001F537 2. 主流向量数据库各有什么特点？不同场景怎么选？"
answer:
  mode: rubric
  reference_answer: |-
    目前市面上的向量数据库，按部署形态大致分三类：自托管开源、云托管、PG 插件。我把核心的几个拉出来做一个快速的权衡分析。

    [嵌入表格未展开]

    场景选型决策树：

    ```text
    你们是创业小团队，只有后端 2 人？
      ├─ 是 → 首选 pgvector（复用现有 PG），或 Pinecone（不想运维）
      └─ 否 → 数据量超过 5000 万，需要极致性能？
              ├─ 是 → Milvus 或 Qdrant（分布式部署）
              └─ 否 → 已用 PG？ pgvector。想单独服务？ Qdrant / Chroma
    ```

    一个具体判断：如果你们已经重度依赖 PostgreSQL，且向量数据量在千万级以下，pgvector 往往是最划算的选择——它把向量检索变成了 SELECT 语句的一部分，团队不用学新数据库，权限、备份、监控全都能沿用现成的。


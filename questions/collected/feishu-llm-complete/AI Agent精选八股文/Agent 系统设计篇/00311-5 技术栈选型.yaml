    [嵌入表格未展开]

    Deep Research Agent 不是简单的“多步 RAG”，它是一个 自主研究流水线。设计中我特别强调人类在环和成本边界——因为研究型任务往往有很长链条，不加控制的自主行为很容易变成昂贵的随机漫步。

    真正的挑战在于“什么时候该停”——反思器不仅要判断信息是否足够，还得学会接受“当前证据下最优答案”，这本身就是一门需要工程和产品共同打磨的艺术。

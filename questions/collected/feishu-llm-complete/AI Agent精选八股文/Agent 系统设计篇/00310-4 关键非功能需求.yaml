    - 长上下文管理：研究笔记可能极长，使用向量数据库存储笔记，撰写时动态检索相关片段而非全量塞入 Prompt。

    - 成本控制：设置单次研究最大 Token 预算（如 10M），达到上限后自动总结已得信息生成简要报告，避免天价账单。

    - 人类在环（Human-in-the-loop）：大纲确认、重要关键信息提取（如专利号）、最终报告均可设置人审节点，提高可靠性。

    - 可复现性：所有搜索 query、浏览 URL、提取结果均日志落盘，研究过程可回放、可审计。

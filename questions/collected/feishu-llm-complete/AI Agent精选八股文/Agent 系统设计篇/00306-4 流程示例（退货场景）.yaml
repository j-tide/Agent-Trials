answer:
  mode: rubric
  reference_answer: "- 用户：“我买的打印机坏了，要退货”\n\n- 意图识别 → return_order，提取实体（商品：打印机）\n\n-
    Agent 调用订单 API 查最近订单（Tool），确认商品和日期，生成确认卡片：“是您 5 月 20 日购买的 HP 打印机吗？”\n\n- 用户确认，Agent
    调用退货 API 创建退单，返回运单号和预计上门取件时间。\n\n- 整个会话以结构化卡片呈现，系统记录完整轨迹。\n\n企业客服 Agent 的本质不是“让
    AI 代替人”，而是 让 AI 处理标准、重复的流程，把人解放出来处理复杂共情。因此设计中我花最多精力的是安全护栏和转人工的平滑衔接——这才是企业信任 AI
    客服的底线。\n\n---\n\n### \U0001F52C 二、设计一个 Deep Research Agent"

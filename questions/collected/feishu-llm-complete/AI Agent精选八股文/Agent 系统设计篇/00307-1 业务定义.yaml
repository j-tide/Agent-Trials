  reference_answer: |-
    Deep Research Agent 需要能接受一个开放研究主题（如“量子计算在药物研发中的应用前景”），自动进行：

    - 分解子问题

    - 搜索并阅读多源信息（网页、论文、数据库）

    - 分析、对比、综合

    - 生成带引用的研究报告（万字级别）

    这已不是简单的 RAG，而是一个 多步推理 + 工具使用 + 长期记忆 的自主智能体。

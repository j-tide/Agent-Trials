    3、你的电商系统需要保证订单和库存的一致性，如何用RocketMQ实现？

    ⭐⭐⭐（事务消息实战）

    1️⃣ Common Answer 用RocketMQ的事务消息吧。先发个半消息，然后执行本地事务，成功后再提交消息。这样就能保证一致性。如果本地事务失败就回滚消息。

    2️⃣ Impressive Answer 电商订单和库存的一致性是典型的分布式事务场景，RocketMQ的事务消息非常适合。让我详细说明实现方案：

    事务消息原理： RocketMQ事务消息通过两阶段提交保证一致性：

    - 第一阶段：Producer发送"半消息"（Half Message）到Broker，半消息对Consumer不可见

    - 本地事务：Producer执行本地事务（如扣减库存）

    - 第二阶段：根据本地事务结果，发送Commit或Rollback请求到Broker

    - 异常处理：如果Broker长时间未收到确认，会主动回查Producer的本地事务状态

    具体实现步骤：

    // 1. 发送半消息
    Message msg = new Message("OrderTopic", orderJson);
    SendResult sendResult = transactionMQ.sendMessageInTransaction(msg, null);

    // 2. 执行本地事务
    @Override
    public LocalTransactionState executeLocalTransaction(Message msg, Object arg) {
        try {
            // 扣减库存
            inventoryService.deduct(order.getProductId(), order.getQuantity());
            // 创建订单
            orderService.create(order);
            return LocalTransactionState.COMMIT_MESSAGE;
        } catch (Exception e) {
            return LocalTransactionState.ROLLBACK_MESSAGE;
        }
    }

    // 3. 事务回查
    @Override
    public LocalTransactionState checkLocalTransaction(MessageExt msg) {
        // 查询订单状态，如果订单创建成功则提交，否则回滚
        Order order = orderService.queryByOrderId(msg.getKeys());
        if (order != null && order.getStatus() == 1) {
            return LocalTransactionState.COMMIT_MESSAGE;
        }
        return LocalTransactionState.ROLLBACK_MESSAGE;
    }

    注意事项：

    - 幂等性：本地事务和回查逻辑都要保证幂等，避免重复扣库存

    - 超时时间：设置合理的transactionTimeOut，避免回查过早

    - 回查次数：限制回查次数，超过次数后默认Rollback

    - 消息Keys：设置唯一的订单ID作为Keys，方便回查时定位

    异常场景处理：

    - 本地事务成功但Commit失败：Broker会回查，根据订单状态Commit

    - 本地事务失败但Rollback失败：Broker会回查，根据订单状态Rollback

    - 回查时订单不存在：说明本地事务未执行或失败，返回Rollback

    - 网络超时：通过重试机制保证最终一致性

    优势总结： 相比TCC、Saga等分布式事务方案，RocketMQ事务消息实现简单，侵入性小，适合订单、支付等异步场景。但要注意事务消息的吞吐量不如普通消息，不要在高并发场景滥用。


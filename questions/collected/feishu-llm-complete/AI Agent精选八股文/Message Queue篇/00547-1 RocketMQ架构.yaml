    ### RocketMQ的核心架构

    1、RocketMQ的核心组件有哪些？

    ⭐（NameServer、Broker、Producer、Consumer）

    RocketMQ的核心组件包括：

    - NameServer：注册中心，管理Broker路由信息

    - Broker：消息存储和转发服务器

    - Producer：消息生产者

    - Consumer：消息消费者

    2、请详细说明RocketMQ的架构设计，相比Kafka有什么优势？

    ⭐⭐（NameServer vs Zookeeper、存储模型、事务消息）

    1️⃣ Common Answer RocketMQ用NameServer代替Zookeeper，更轻量。支持事务消息，Kafka不支持。存储模型是Topic和Queue，和Kafka类似。RocketMQ更适合业务场景。

    2️⃣ Impressive Answer RocketMQ的架构设计在借鉴Kafka的基础上做了很多优化，让我详细对比说明：

    NameServer vs Zookeeper：

    - NameServer：RocketMQ使用NameServer作为注册中心，是无状态的，集群部署时各节点互不通信。Broker启动时向所有NameServer注册，Producer/Consumer从任意NameServer获取路由信息。NameServer轻量简单，不存在单点故障。

    - Zookeeper：Kafka依赖Zookeeper管理元数据，Zookeeper是强一致性的，维护复杂。新版本Kafka引入KRaft模式逐步去ZK，但RocketMQ从一开始就避免了ZK的复杂性。

    存储模型差异：

    - RocketMQ：Topic下有多个Queue，Queue是物理存储单元。消息顺序写入CommitLog，然后异步构建ConsumeQueue和IndexFile。这种设计读写分离，写入性能极高。

    - Kafka：Partition是物理存储单元，消息直接写入Partition日志文件。虽然也高效，但在海量消息场景下索引和查询不如RocketMQ灵活。

    事务消息支持：

    - RocketMQ：原生支持事务消息，通过两阶段提交保证分布式事务一致性，适合订单、支付等强一致性场景。

    - Kafka：支持事务但主要用于Exactly Once语义，不是传统意义的分布式事务。

    其他优势：

    - 消息过滤：支持SQL表达式过滤，Consumer可以按条件订阅消息

    - 延迟消息：原生支持延迟级别，无需额外组件

    - 消息回溯：支持按时间重新消费，方便数据修复

    - 运维工具：提供完善的管理控制台和运维工具

    适用场景：

    - RocketMQ：电商、金融等业务场景，需要事务消息、消息过滤、回溯等特性

    - Kafka：日志收集、流计算等大数据场景，追求高吞吐量


    ### 事务消息原理

    1、RocketMQ事务消息的执行流程是怎样的？

    ⭐（半消息、本地事务、提交/回滚、回查）

    RocketMQ事务消息的执行流程：

    - Producer发送半消息到Broker

    - Broker存储半消息，但不让Consumer消费

    - Producer执行本地事务

    - 根据本地事务结果，发送Commit或Rollback请求

    - 如果超时未收到确认，Broker回查Producer的本地事务状态

    2、RocketMQ事务消息如何保证一致性？如果Commit失败了怎么办？

    ⭐⭐（回查机制、最终一致性）

    1️⃣ Common Answer 通过回查机制保证一致性。如果Commit失败，Broker会主动回查Producer的本地事务状态，然后根据结果提交或回滚。这样就能保证最终一致性。

    2️⃣ Impressive Answer RocketMQ事务消息通过回查机制保证最终一致性，让我详细说明Commit失败的处理流程：

    回查触发条件： 当Broker收到半消息后，会启动一个定时任务。如果在transactionTimeOut时间内没有收到Producer的Commit或Rollback请求，就会触发回查。默认超时时间是1分钟。

    回查流程：

    - Broker发送回查请求到Producer

    - Producer的checkLocalTransaction方法被调用

    - Producer查询本地事务状态（如查询订单表）

    - 根据查询结果返回COMMIT_MESSAGE或ROLLBACK_MESSAGE

    - Broker根据回查结果提交或回滚消息

    Commit失败的几种场景：

    - 网络故障：Producer发送Commit请求但网络中断，Broker未收到

    - Producer宕机：本地事务执行成功但Producer崩溃，未发送Commit

    - 超时：本地事务执行时间过长，超过了transactionTimeOut

    回查机制的保证： 无论哪种场景，只要本地事务执行成功，回查时就能查到正确的状态，从而Commit消息。这就是最终一致性的保证。

    回查次数限制： 为了避免无限回查，RocketMQ限制了回查次数，默认是15次。超过次数后，消息会被丢弃或进入死信队列。可以通过transactionCheckMax参数调整。

    生产环境注意事项：

    - 幂等性：本地事务和回查逻辑都要保证幂等，避免重复执行

    - 查询性能：回查时要快速查询本地状态，避免影响性能

    - 日志记录：记录回查日志，方便排查问题

    - 监控告警：监控回查次数，如果频繁回查说明有问题

    对比其他方案： 相比TCC需要实现Try、Confirm、Cancel三个接口，RocketMQ事务消息只需要实现本地事务和回查逻辑，实现简单，侵入性小。但要注意事务消息的吞吐量较低，不适合高并发场景。


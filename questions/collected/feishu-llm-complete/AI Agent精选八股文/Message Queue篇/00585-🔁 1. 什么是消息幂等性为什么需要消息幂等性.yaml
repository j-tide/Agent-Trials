content:
  prompt: "\U0001F501 1. 什么是消息幂等性？为什么需要消息幂等性？"
answer:
  mode: rubric
  reference_answer: |-
    幂等性 原本是数学概念：f(f(x)) = f(x)。在消息队列中，它意味着同一条消息被消费一次或多次，最终的业务结果完全相同。换句话说，即使消息被重复投递，系统也不会产生副作用，不会重复扣款、重复发积分。

    为什么需要？

    因为消息队列本身只能保证“至少一次投递”，无法保证“恰好一次”。在以下场景中，消息必然会出现重复：

    场景一：生产者重复发送
      网络超时 → 生产者重试 → 同一条订单消息发送了两次

    场景二：消费者重复消费
      消费者处理完消息，在提交 Offset 前宕机 → 重启后从上次 Offset 重新消费，导致消息重复处理

    场景三：Rebalance 重平衡
      Kafka 消费者组重平衡 → 分区分配给新消费者，新消费者可能从旧 Offset 开始消费，重复消息

    如果你不做幂等处理，积分系统可能会给用户加两次积分，库存系统可能会重复扣库存。幂等性就是让这些重复的消息“失效”，让系统在不可靠的网络和重试机制下，依然保持数据正确。


content:
  prompt: 问题 13：消息队列在微服务架构中承担什么角色？有哪些典型应用场景？
answer:
  mode: rubric
  reference_answer: "难度：⭐⭐（异步解耦、削峰填谷、事件驱动、CQRS、Saga）\n\n1️⃣ Common Answer\n\n消息队列在微服务中主要是解耦、异步、削峰。比如订单服务发消息，库存服务消费消息，这样就解耦了。还有流量削峰，防止服务被打挂。\n\n2️⃣
    Impressive Answer\n\n我会从这几个角度思考：消息队列的四大核心角色、每个角色的业务场景与实现、事件驱动架构设计、实战编排案例。\n\n-
    消息队列在微服务中的四大核心角色\n\n[嵌入表格未展开]\n\n- 每个角色的业务场景与代码级实现\n\n角色一：异步解耦 - 订单创建流程\n\n传统同步调用的问题：\n\n```text\n//
    同步调用，链路过长，任何一环失败都会影响订单创建\npublic Order createOrder(OrderRequest request) {\n    Order
    order = orderRepository.save(request);\n    inventoryService.deduct(order);      //
    耗时 50ms\n    logisticsService.create(order);      // 耗时 100ms\n    pointsService.add(order);
    \           // 耗时 30ms\n    riskService.check(order);            // 耗时 80ms\n
    \   return order;  // 总耗时 260ms+\n}\n```\n\n异步解耦方案：\n\n```text\n// 订单服务：只负责订单创建，后续流程异步化\n@Transactional\npublic
    Order createOrder(OrderRequest request) {\n    Order order = orderRepository.save(request);\n
    \   \n    // 发送订单创建事件\n    OrderCreatedEvent event = new OrderCreatedEvent(\n
    \       order.getId(), order.getUserId(), \n        order.getItems(), order.getTotalAmount()\n
    \   );\n    rocketMQTemplate.convertAndSend(\"order-created-topic\", event);\n
    \   \n    return order;  // 耗时 < 20ms\n}\n```\n\n优势：\n\n- 订单创建耗时从 260ms 降到 20ms，提升
    10 倍+\n\n- 下游服务故障不影响订单创建（消息队列缓冲）\n\n- 易于扩展新的下游服务（新增监听器即可）\n\n角色二：流量削峰 - 秒杀场景\n\n```text\n//
    秒杀接口：只承接请求，不直接处理\n@PostMapping(\"/seckill/{productId}\")\npublic Result seckill(@PathVariable
    Long productId) {\n    // 1. 快速校验（Redis 缓存库存）\n    if (!redisService.hasStock(productId))
    {\n        return Result.fail(\"库存不足\");\n    }\n    \n    // 2. 发送秒杀消息到 MQ\n
    \   SeckillMessage message = new SeckillMessage(\n        productId, getUserId(),
    System.currentTimeMillis()\n    );\n    rocketMQTemplate.convertAndSend(\"seckill-topic\",
    message);\n    \n    return Result.success(\"秒杀请求已提交\");\n}\n```\n\n削峰效果：\n\n-
    秒杀接口可以承接 10 万 QPS（只做 Redis 校验 + 发送消息）\n\n- 消费端限流到 1000 TPS，保护数据库不被打挂\n\n- 消息队列缓冲请求，削峰填谷\n\n角色三：事件驱动
    - 用户注册流程\n\n```text\n// 用户服务：发布用户注册事件\n@Service\npublic class UserService {\n
    \   \n    public void register(UserRegisterRequest request) {\n        User user
    = userRepository.save(request);\n        \n        // 发布用户注册事件\n        UserRegisteredEvent
    event = new UserRegisteredEvent(\n            user.getId(), user.getEmail(), user.getPhone()\n
    \       );\n        rocketMQTemplate.convertAndSend(\"user-registered-topic\",
    event);\n    }\n}\n\n// 邮件服务：监听事件，发送欢迎邮件\n// 数据服务：监听事件，初始化用户数据\n// 营销服务：监听事件，发放新用户优惠券\n```\n\n事件驱动架构优势：\n\n-
    松耦合：新增服务只需监听事件，无需修改用户服务\n\n- 可扩展：同一事件可以被多个消费者处理\n\n- 最终一致性：通过事件保证各服务数据最终一致\n\n角色四：数据同步
    - CQRS 模式\n\n```text\n// 命令端（写操作）：更新数据库\n@Service\npublic class OrderCommandService
    {\n    \n    @Transactional\n    public void updateOrderStatus(Long orderId, OrderStatus
    status) {\n        orderMapper.updateStatus(orderId, status);\n        \n        //
    发送状态变更事件\n        OrderStatusChangedEvent event = new OrderStatusChangedEvent(\n
    \           orderId, status, System.currentTimeMillis()\n        );\n        rocketMQTemplate.convertAndSend(\"order-status-changed\",
    event);\n    }\n}\n\n// 查询端（读操作）：消费事件，更新 Redis 缓存和 Elasticsearch\n```\n\n- 事件驱动架构（EDA）的设计要点\n\n核心原则：\n\n-
    事件即事实：事件不可变，代表已经发生的事实\n\n- 异步处理：事件发布后不等待消费者处理\n\n- 最终一致性：通过事件保证各服务数据最终一致\n\n-
    幂等性保障：消费者必须能够处理重复事件\n\n设计模式：\n\n- 事件溯源：通过事件流重建状态（适用于金融、审计场景）\n\n- CQRS：命令与查询分离，读写使用不同的数据模型\n\n-
    Saga 模式：通过事件编排长事务（订单 → 库存 → 支付）\n\n- 实战：用消息队列实现订单 → 库存 → 物流的异步编排\n\n```text\n用户
    → 订单服务：创建订单\n         ↓ 发送 OrderCreatedEvent\n      消息队列\n         ↓\n      库存服务：扣减库存\n
    \        ↓ 发送 InventoryDeductedEvent\n      消息队列\n         ↓\n      物流服务：创建运单\n
    \        ↓ 发送 WaybillCreatedEvent\n      消息队列\n         ↓\n      通知服务：发送发货通知 →
    用户\n```\n\n关键优化：\n\n- 事务消息：订单创建和事件发送使用 RocketMQ 事务消息，保证一致性\n\n- 幂等性：每个消费者处理前检查状态，避免重复处理\n\n-
    重试机制：消费失败时自动重试，超过阈值后进入死信队列\n\n- 监控告警：消息堆积、消费延迟时触发告警\n\n3️⃣ Key Differences\n\n[嵌入表格未展开]\n\n---\n\n###
    6.15 Kafka 存储引擎深入"

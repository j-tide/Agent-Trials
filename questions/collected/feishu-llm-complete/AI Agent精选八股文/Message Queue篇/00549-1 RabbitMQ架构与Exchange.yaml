    3、场景题：你需要实现一个订单状态变更通知系统，不同状态的订单要发给不同的处理系统，如何设计？

    ⭐⭐⭐（Exchange选型和路由设计）

    1️⃣ Common Answer 用Topic Exchange吧，RoutingKey写成order.状态，比如order.created、order.paid。然后不同的系统绑定不同的RoutingKey，这样就能路由到对应的队列了。

    2️⃣ Impressive Answer 订单状态变更通知是一个典型的多维度路由场景，我会使用Topic Exchange设计灵活的路由方案：

    设计思路： 订单状态有多种（创建、支付、发货、完成、取消），不同状态需要不同的处理逻辑，同时还需要考虑订单类型（普通订单、预售订单）、地区（国内、海外）等维度。

    RoutingKey设计： 采用多级RoutingKey，格式为：order.{status}.{type}.{region}

    - order.created.normal.domestic：国内普通订单创建

    - order.paid.presale.overseas：海外预售订单支付

    - order.shipped.normal.domestic：国内普通订单发货

    Exchange和Queue设计： 使用Topic Exchange，不同系统绑定不同的RoutingKey模式：

    - 库存系统：绑定order.created..，处理所有订单创建

    - 支付系统：绑定order.paid..，处理所有订单支付

    - 物流系统：绑定order.shipped..，处理所有订单发货

    - 客服系统：绑定order.*.*.domestic，处理国内所有订单

    - 风控系统：绑定order.created.presale.*，处理预售订单创建

    代码示例：

    // 发送消息
    String routingKey = "order." + order.getStatus() + "." + order.getType() + "." + order.getRegion();
    rabbitTemplate.convertAndSend("orderExchange", routingKey, order);

    // 绑定队列
    @RabbitListener(bindings = @QueueBinding(
        value = @Queue("inventoryQueue"),
        exchange = @Exchange(value = "orderExchange", type = "topic"),
        key = "order.created.*.*"
    ))
    public void handleOrderCreated(Order order) {
        // 处理订单创建
    }

    扩展性设计：

    - 新增状态：只需发送新的RoutingKey，无需修改现有绑定

    - 新增系统：添加新的Queue和绑定即可

    - 临时路由：可以临时绑定特殊RoutingKey，如order.*.*.*用于监控

    备选方案： 如果路由规则简单，也可以用Direct Exchange，每种状态一个RoutingKey。但Topic Exchange更灵活，适合未来扩展。

    注意事项：

    - RoutingKey不要过长，影响性能

    - 绑定规则不要太多，增加路由复杂度

    - 监控消息路由情况，及时发现异常


content:
  prompt: "\U0001F9E9 1. 什么是 RocketMQ 事务消息？它解决了什么问题？"
answer:
  mode: rubric
  reference_answer: |-
    RocketMQ 事务消息是一种让“发送消息”和“本地数据库操作”成为一个原子整体的分布式事务方案。 它解决的是分布式系统中经典的“发消息与数据库操作不一致”的痛点。

    举个场景：用户下单，订单服务需要同时做两件事——1）在自己的数据库中创建订单；2）发送一条“下单成功”的消息，让下游的库存系统去扣库存。

    如果不用事务消息，最常见的两种错误是：

    - 先操作数据库，再发消息：数据库更新成功，但发消息时网络闪断，消息没发出去，下游永远不知道订单已创建，库存就不会扣。

    - 先发消息，再操作数据库：消息发出去了，库存已经开始扣减，但订单服务自己的数据库操作失败，最后订单没创建，库存却少了。

    事务消息通过 “半消息” 这个巧妙的中间状态，让消息暂时不会被消费，直到本地事务尘埃落定，从而解决了这个原子性问题。


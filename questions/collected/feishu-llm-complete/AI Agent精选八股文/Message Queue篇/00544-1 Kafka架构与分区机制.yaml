    ### Kafka的核心架构

    1、基础题：Kafka的核心组件有哪些？

    ⭐（Broker、Topic、Partition、Zookeeper）

    Kafka的核心组件包括：

    - Broker：Kafka服务器节点，负责存储和转发消息

    - Topic：消息的逻辑分类

    - Partition：Topic的物理分区，提高并发

    - Zookeeper：管理集群元数据、选举Controller等（新版本KRaft模式已可不用ZK）

    2、进阶题：请详细说明Kafka的分区机制和Leader/Follower架构

    ⭐⭐（Partition副本、Leader选举、ISR机制）

    1️⃣ Common Answer 每个Partition有多个副本，一个是Leader，其他是Follower。Leader负责读写，Follower同步Leader的数据。如果Leader挂了，从ISR里选一个新的Leader。

    2️⃣ Impressive Answer Kafka的分区机制和Leader/Follower架构是其高可用和高性能的核心：

    Partition副本机制： 每个Partition可以配置多个副本（Replica），副本数由replication-factor参数控制。副本分为Leader副本和Follower副本。Leader副本负责处理所有的读写请求，Follower副本只负责从Leader同步数据，不处理客户端请求。

    Leader/Follower架构优势：

    - 读写分离：只有Leader处理读写，Follower只同步，避免多副本写冲突

    - 高可用：Leader故障时自动切换，服务不中断

    - 负载均衡：不同Partition的Leader分布在不同的Broker上，避免单点压力

    ISR（In-Sync Replicas）机制： ISR是Leader维护的一个与Leader保持同步的副本集合。只有ISR中的副本才有资格被选为新的Leader。Follower通过fetch请求从Leader拉取数据，如果Follower长时间（replica.lag.time.max.ms参数控制）未同步，会被踢出ISR。当Follower追上Leader的进度后，会重新加入ISR。

    Leader选举机制： 当Leader故障时，Controller（由Zookeeper选举出的特殊Broker）会从ISR中选举新的Leader。选举原则是优先选择ISR中AR（Assigned Replicas）排在最前面的副本。这样可以保证Leader选举的快速和稳定。

    数据同步过程：

    - Producer发送消息到Leader

    - Leader写入本地日志

    - Follower异步从Leader拉取消息

    - Leader根据acks配置决定何时返回成功

    - Follower写入成功后更新LEO（Log End Offset）


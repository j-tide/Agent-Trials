    3、场景题：你的Kafka集群某个Broker宕机了，会发生什么？

    ⭐⭐⭐（Leader切换、ISR变化、影响分析）

    1️⃣ Common Answer 那个Broker上的Leader会切换到其他Broker，ISR也会变。可能会有短暂的影响，但Kafka会自动恢复。生产者和消费者会重新连接。

    2️⃣ Impressive Answer Broker宕机是Kafka的高可用场景，让我详细分析整个流程和影响：

    宕机检测： Zookeeper会检测到Broker Session超时，触发Broker下线事件。Controller监听到该事件后，开始处理该Broker上的所有Partition Leader的重新选举。

    Leader选举过程：

    - Controller遍历宕机Broker上的所有Partition

    - 对于每个Partition，从ISR列表中选举新的Leader

    - 更新Zookeeper和内存中的元数据

    - 通知所有Broker新的Leader信息

    影响分析：

    - 服务短暂中断：在Leader选举期间（通常是几秒），该Partition的读写会暂停，Producer和Consumer会收到错误，需要重试

    - ISR变化：如果宕机的Broker是某些Partition的Follower，这些Partition的ISR会缩小；如果是Leader，ISR中的Follower会重新选举Leader

    - 性能下降：如果宕机的Broker承载了很多Leader，新Leader分布不均衡，可能导致某些Broker压力增大

    - 数据一致性：如果有未同步的消息，可能会丢失（取决于acks配置）

    生产环境应对：

    - 配置合理的acks=all和min.insync.replicas，保证数据不丢失

    - 监控Broker健康状态，提前预警

    - 设置合理的unclean.leader.election.enable=false，避免数据不一致的副本成为Leader

    - Producer配置重试机制，自动处理短暂不可用

    恢复后的行为： 宕机的Broker重启后，会重新加入集群，作为Follower同步数据，追上进度后重新加入ISR。此时不会立即切换Leader，除非有新的故障。


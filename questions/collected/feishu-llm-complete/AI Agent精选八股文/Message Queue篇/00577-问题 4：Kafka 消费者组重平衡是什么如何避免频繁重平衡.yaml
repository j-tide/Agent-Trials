  prompt: 问题 4：Kafka 消费者组重平衡是什么？如何避免频繁重平衡？
answer:
  mode: rubric
  reference_answer: |-
    难度：⭐⭐⭐（Rebalance 原理、避免策略、性能调优）

    1️⃣ Common Answer

    Rebalance 就是消费者组的分区重新分配。比如有消费者加入或退出的时候就会触发。避免的话可以设置好 session timeout，不要让它频繁触发。

    2️⃣ Impressive Answer

    我会从这几个角度思考：

    - Rebalance 的触发条件

    ```text
    - 消费者加入或离开（正常或超时）
    - 消费者 session 超时（session.timeout.ms）
    - 消费者主动离开（leaveGroup）
    - 分区数变化（topic 扩容）
    ```

    - Rebalance 的过程（影响为什么大）

    ```text
    Stop the World：重平衡期间所有消费者停止消费
    1. Coordinator 发送 GroupHeartbeat
    2. 选出一个 Leader Consumer
    3. Leader 计算分区分配方案
    4. 同步给所有消费者
    5. 各消费者开始消费
    ```

    - 频繁重平衡的原因

    [嵌入表格未展开]

    - 关键参数调优

    ```text
    session.timeout.ms=45000    # 超时时间
    heartbeat.interval.ms=15000  # 心跳间隔
    max.poll.interval.ms=300000  # 最大处理间隔
    max.poll.records=500         # 每次 poll 数量
    ```

    - 静态成员机制（Kafka 2.3+）

    ```text
    group.instance.id：固定消费者 ID
    重启不会触发 Rebalance
    适合频繁重启的场景（如容器化）
    ```

    - 实战经验 有一次容器滚动更新，每次重启都触发 Rebalance，导致消费中断。后来用了静态成员机制，配合合理的超时设置，基本避免了这个问题。


    ---

    - 现象：日志出现 Member ... has failed，max.poll.interval.ms 超时。

    - 调大 max.poll.interval.ms（比如 10 分钟）。

    - 减小 max.poll.records，让单次处理量变小。

    - 将耗时逻辑异步化，将消息放入内部线程池处理，让 poll 循环快速返回。

    - 解决：

    - 现象：网络偶发抖动或 GC 导致心跳丢失。

    - 适当调大 session.timeout.ms（例如 30s），但不要超过 Coordinator 的 group.max.session.timeout.ms。

    - 调大 heartbeat.interval.ms 为 session 的 1/3。

    - 解决：

    - 解决：确保 poll() 循环能及时执行，避免在消息处理中再次同步等待外部 IO（如没有超时设置的 HTTP 调用）。为所有外部调用加上超时和熔断。

    - Coordinator 所在的 Broker 负载过高或频繁切换。查看 Coordinator 日志，确认是否有性能问题。

    - 查询一段时间内所有状态为已创建但未发送消息的订单

    - 批量构建并发送消息

    - 记录修复日志，方便审计

    - 配置死信队列，被丢弃的消息进入死信队列

    - 编写死信队列消费者，分析消息并决定是否重新发送

    - RoutingKey="order.beijing.premium" → 绑定"order.*.premium"和"order.beijing.#"的Queue都能接收

    - 保留最早或最晚创建的记录

    - 保留状态正确的记录

    - 保留金额正确的记录

    - 验证删除后的数据一致性

    - 检查关联表的数据是否正确

    - 生成修复报告，记录修复情况

    - 在业务表添加唯一约束

    - 或创建独立的幂等表

    - 在消费者逻辑中添加幂等判断

    - 先在测试环境验证

    - 小流量灰度，观察效果

    - 全量发布，持续监控

    - 监控唯一键冲突异常

    - 监控重复数据数量

    - 设置告警阈值

    - 定期比对消息发送和消费数量

    - 定期检查数据库重复数据

    - 发现异常及时处理

    - 新功能上线前必须考虑幂等性

    - Code Review时重点检查幂等性

    - 文档中明确幂等性保证方案

    - Partition数量：100个

    - 副本数：3个

    - 命名：original-topic-temp

    - 消费者数量：100个（每个消费1个Partition）

    - 部署方式：使用K8s快速扩容

    - 预计速度：100个×1000条/秒=10万条/秒，需要100秒（约1.7分钟）

    - 原因：吞吐量极高，生态完善

    - 案例：ELK日志收集、Flink流计算

    - 原因：事务消息、延迟消息等业务特性

    - 案例：电商订单系统、金融支付系统

    - 原因：Exchange路由灵活，消息可靠性高

    - 案例：多系统通知、复杂业务路由

    - 原因：部署简单，学习成本低

    - 案例：初创公司、内部系统

    - 团队学习RocketMQ核心概念

    - 搭建测试环境，跑通Demo

    - 阅读官方文档和最佳实践

    - 选择非核心功能试点，如会员通知

    - 验证事务消息、延迟消息等特性

    - 积累运维经验

    - 核心功能逐步迁移到RocketMQ

    - 建立监控告警体系

    - 完善运维文档

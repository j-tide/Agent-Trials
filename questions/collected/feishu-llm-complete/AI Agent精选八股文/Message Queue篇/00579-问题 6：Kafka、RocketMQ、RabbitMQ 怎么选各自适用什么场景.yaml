content:
  prompt: 问题 6：Kafka、RocketMQ、RabbitMQ 怎么选？各自适用什么场景？
answer:
  mode: rubric
  reference_answer: |-
    难度：⭐⭐（消息队列选型、吞吐量、延迟、可靠性、生态对比）

    1️⃣ Common Answer

    Kafka 吞吐量最高，适合大数据场景；RabbitMQ 延迟最低，适合实时性要求高的场景；RocketMQ 是阿里开源的，功能比较全面，适合电商场景。我们公司用 Kafka 做日志收集，用 RocketMQ 做订单处理。

    2️⃣ Impressive Answer

    我会从这几个角度思考：选型核心维度、三款 MQ 的详细对比、场景化选型建议、实战决策经验。

    - 选型的核心维度

    消息队列选型主要考虑 5 个维度：

    - 吞吐量：单位时间能处理的消息数量

    - 延迟：消息从发送到接收的时间间隔

    - 可靠性：消息不丢失、不重复的保障

    - 生态成熟度：社区活跃度、文档完善度、第三方工具支持

    - 运维成本：部署、监控、故障排查的复杂度

    - 三款 MQ 的详细对比

    [嵌入表格未展开]

    - 场景化选型建议

    - 日志采集、用户行为分析 → Kafka

    - 订单交易、支付场景 → RocketMQ

    - 复杂路由、实时通信 → RabbitMQ

    - 实战决策经验

    去年我们做电商订单系统时，选型过程是这样的：

    - 需求分析：订单创建后需要同步到 5 个下游系统（库存、物流、积分、风控、数据仓库），要求消息不丢失、支持事务消息

    - 技术选型：排除了 Kafka（事务消息支持弱）和 RabbitMQ（吞吐量不够），最终选择 RocketMQ

    - 落地效果：日均 500 万订单，消息延迟控制在 100ms 以内，通过事务消息保障了订单与库存的一致性

    关键结论：没有最好的 MQ，只有最适合的。一定要结合业务场景、团队能力、现有技术栈综合决策。


    3、场景题：你的Kafka消息偶尔丢失，如何排查？

    ⭐⭐⭐（系统性排查思路）

    1️⃣ Common Answer 先看配置对不对，acks是不是all，副本数够不够。然后看日志，有没有报错。Consumer是不是自动提交了offset。一个个排查。

    2️⃣ Impressive Answer Kafka消息丢失问题需要系统性排查，我会按照以下思路进行：

    第一步：确认丢失环节

    - 检查Producer发送日志，确认消息是否成功发送到Kafka

    - 检查Broker日志，确认消息是否成功写入磁盘

    - 检查Consumer日志，确认消息是否被消费但offset提交失败

    - 通过监控工具（如Kafka Manager、Burrow）查看各环节指标

    第二步：排查Producer配置

    - 确认acks配置，如果不是all，可能Leader写入成功但Follower未同步

    - 检查retries配置，是否重试次数过少就放弃了

    - 查看回调日志，是否有发送失败的记录

    - 确认buffer.memory是否充足，避免内存不足导致丢弃

    第三步：排查Broker配置

    - 检查replication.factor，副本数是否足够

    - 确认min.insync.replicas，是否至少2个副本同步

    - 查看unclean.leader.election.enable，是否允许非ISR副本成为Leader

    - 检查磁盘IO，是否有写入延迟导致超时

    第四步：排查Consumer配置

    - 确认enable.auto.commit，如果自动提交可能处理失败但offset已提交

    - 检查auto.offset.reset配置，是否从最新位置开始消费

    - 查看消费日志，是否有异常但未回滚offset

    - 确认业务逻辑，是否处理失败时错误地提交了offset

    第五步：排查网络和环境

    - 检查网络稳定性，是否有丢包或延迟

    - 查看Broker资源使用，CPU、内存、磁盘是否饱和

    - 确认Zookeeper状态，是否影响元数据同步

    - 检查JVM GC，是否有长时间停顿

    常见问题和解决方案：

    - 问题：Leader切换时消息丢失 → 解决：设置min.insync.replicas>1

    - 问题：Consumer自动提交offset → 解决：改为手动提交

    - 问题：网络抖动导致超时 → 解决：增加request.timeout.ms


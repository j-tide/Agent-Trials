  reference_answer: |-
    ### 消息可靠性保证

    1、基础题：Kafka的acks参数有什么作用？

    ⭐（acks=0、1、all/-1）

    acks参数控制Producer发送消息后的确认机制：

    - acks=0：发送后不等待确认，可能丢失消息，但吞吐量最高

    - acks=1：等待Leader写入成功确认，Leader故障可能丢失

    - acks=all/-1：等待ISR所有副本写入成功确认，可靠性最高

    2、进阶题：如何保证Kafka消息不丢失？

    ⭐⭐（Producer、Broker、Consumer三层保证）

    1️⃣ Common Answer Producer设置acks=all，Broker设置多个副本，Consumer关闭自动提交offset，处理完再手动提交。这样就能保证不丢失。

    2️⃣ Impressive Answer 保证Kafka消息不丢失需要从Producer、Broker、Consumer三个层面综合考虑：

    Producer层面：

    - 设置acks=all，确保ISR所有副本都写入成功才确认

    - 配置retries=Integer.MAX_VALUE，发送失败自动重试

    - 设置max.in.flight.requests.per.connection=1，保证重试时顺序

    - 使用带回调的send方法，处理发送失败的情况

    Broker层面：

    - 设置replication.factor>=3，保证有足够副本

    - 设置min.insync.replicas>1，确保至少2个副本写入成功

    - 设置unclean.leader.election.enable=false，禁止非ISR副本成为Leader

    - 设置log.flush.interval.messages和log.flush.interval.ms，定期刷盘

    Consumer层面：

    - 设置enable.auto.commit=false，关闭自动提交offset

    - 业务处理成功后再手动提交offset

    - 处理失败时不要提交offset，下次重新消费

    - 结合数据库事务，保证消息处理和业务操作的一致性

    极端情况处理： 即使配置了上述参数，在极端情况下（比如所有ISR副本同时故障）仍可能丢失消息。可以通过以下方式进一步增强：

    - 使用transactional.id开启事务支持

    - 配合数据库实现 Exactly Once 语义

    - 定期对账，发现数据不一致时补偿


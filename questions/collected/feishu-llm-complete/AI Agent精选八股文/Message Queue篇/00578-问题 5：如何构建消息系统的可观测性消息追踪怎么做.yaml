answer:
  mode: rubric
  reference_answer: |-
    难度：⭐⭐⭐⭐（全链路追踪、监控体系、问题诊断）

    1️⃣ Common Answer

    可观测性的话，可以打日志，然后用 ELK 查。也可以加一些监控指标，用 Grafana 展示。消息追踪可以用一些开源工具，或者自己实现。

    2️⃣ Impressive Answer

    我会从这几个角度思考：

    - 可观测性的三支柱

    ```text
    Metrics（指标）：吞吐量、延迟、lag、错误率
    Logs（日志）：结构化日志 + 关键字段
    Traces（追踪）：全链路 TraceID 透传
    ```

    - 消息追踪的核心设计

    ```text
    生产端：生成 TraceID → 注入消息头
    Broker：记录消息元数据（可选）
    消费端：提取 TraceID → 关联业务日志
    链路：集成 SkyWalking/Jaeger 等 APM
    ```

    - 关键监控指标

    [嵌入表格未展开]

    - 问题诊断的完整链路

    ```text
    发现 lag 上涨
    → 看 Grafana 指标（哪个消费者、哪个分区）
    → 查 APM Trace（哪一步慢）
    → 搜日志（TraceID 关联）
    → 定位根因（代码/网络/下游）
    ```

    - 生产环境的实践

    ```text
    - 统一日志格式：JSON + TraceID + 业务关键字段
    - Prometheus + Grafana：实时监控
    - SkyWalking：分布式追踪
    - 自定义 Dashboard：消息健康度大盘
    ```

    - 高阶能力

    - 消息血缘：知道每条消息从哪来到哪去

    - 延迟分析：P95/P99 延迟分位数

    - 容量规划：根据历史数据预测峰值


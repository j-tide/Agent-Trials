content:
  prompt: 'Q10: 如何看待 AI Agent 的"幻觉"问题？有哪些前沿的解决方案？'
answer:
  mode: rubric
  reference_answer: "1️⃣ Common Answer\n\n幻觉（Hallucination）是指 LLM 生成看似合理但实际上不正确的内容。在
    Agent 系统中，幻觉问题更加严重，因为 Agent 的错误输出可能触发错误的工具调用，导致连锁反应。\n\n常见的解决方案：\n\n- RAG（检索增强生成）：用外部知识库提供事实依据\n\n-
    Self-Consistency：多次采样，选择一致性最高的答案\n\n- Fact-Checking：对关键事实声明进行验证\n\n- Confidence
    Scoring：让模型输出置信度分数，低置信度时拒绝回答\n\n2️⃣ Impressive Answer\n\n幻觉是 LLM 的\"原罪\"——因为模型本质上是在做概率性的文本生成，而非基于事实的推理。在
    Agent 系统中，幻觉的危害被放大了 N 倍，因为 Agent 会基于幻觉采取行动。\n\n幻觉的分类：\n\n```text\n幻觉类型：\n├── 事实性幻觉：生成不存在的事实（\"爱因斯坦在
    1920 年获得诺贝尔奖\"）\n├── 忠实性幻觉：与给定上下文矛盾（RAG 检索到 A，但回答了 B）\n├── 推理幻觉：推理过程中的逻辑错误\n└──
    工具幻觉：编造不存在的工具或 API 参数（Agent 特有）\n```\n\n前沿解决方案：\n\n- Retrieval-Augmented Verification（RAV）不仅用
    RAG 提供信息，还用 RAG 验证输出：\n\n```text\npublic class HallucinationDetector {\n    public
    VerificationResult verify(String agentOutput, String sourceContext) {\n        //
    1. 提取输出中的事实声明\n        List<Claim> claims = claimExtractor.extract(agentOutput);\n
    \       \n        // 2. 对每个声明进行 RAG 验证\n        for (Claim claim : claims) {\n
    \           List<Document> evidence = vectorStore.search(claim.getText());\n            boolean
    supported = llm.judge(\n                \"以下声明是否被证据支持？\\n声明：\" + claim + \"\\n证据：\"
    + evidence\n            );\n            if (!supported) {\n                return
    VerificationResult.hallucinated(claim);\n            }\n        }\n        return
    VerificationResult.verified();\n    }\n}\n```\n\n- Chain-of-Verification（CoVe）让模型自己生成验证问题，然后回答这些问题来检查一致性：\n\n-
    生成回答\n\n- 针对回答生成验证问题\n\n- 独立回答验证问题\n\n- 对比原始回答和验证结果\n\n- Grounding 技术将 Agent 的输出\"锚定\"到可验证的数据源：\n\n-
    每个事实声明都必须附带来源引用\n\n- 工具调用的参数必须来自上下文（而非模型编造）\n\n- 数值数据必须通过工具获取（而非模型生成）\n\n- Agent
    层面的幻觉防护\n\n- 工具验证：Agent 调用工具前，验证工具名和参数是否在允许列表中\n\n- 输出交叉验证：用多个 Agent 独立处理同一任务，对比结果\n\n-
    人工兜底：置信度低于阈值时，自动转人工处理\n\n我的实践：在一个金融 Agent 项目中，我们实现了\"三层幻觉防护\"：\n\n- RAG 提供事实依据（减少
    60% 的事实性幻觉）\n\n- Structured Output 约束输出格式（消除工具幻觉）\n\n- 关键数据必须通过 API 获取，禁止模型自行生成（消除数值幻觉）\n\n最终将幻觉率从
    15% 降到了 2.3%，剩余的 2.3% 主要是推理幻觉，通过引入推理模型（o1）进一步降低到 0.8%。\n\n---"

  prompt: 说说你对 OpenClaw 的理解？
answer:
  mode: rubric
  reference_answer: |-
    简单了解就行，一般不咋问

    OpenClaw 是一个开源、本地优先的自主 AI Agent 框架，由 Peter Steinberger 开发，让大模型从"只会聊天"升级为"真正能干活"的智能执行体。它要解决的问题是：

    大语言模型只能思考但没法动手干活的问题。OpenClaw 做的事，就是给这个大脑配上完整的"身体"：

    - 手脚：操作电脑、调用 API、执行脚本

    - 记忆：记住用户偏好和历史会话

    - 眼睛：感知环境、抓取网页

    - 通讯工具：接入各种消息平台

    ---

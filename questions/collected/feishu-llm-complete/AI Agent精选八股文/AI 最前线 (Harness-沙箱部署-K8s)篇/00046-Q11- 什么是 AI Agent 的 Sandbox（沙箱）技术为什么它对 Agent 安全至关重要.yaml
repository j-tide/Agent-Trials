    实际工程实践：

    - 代码执行：用 Wasm 沙箱，毫秒级启动，适合频繁的代码运行

    - 工具调用：用 Docker 沙箱，提供完整的 Linux 环境

    - 文件操作：用 chroot + seccomp 限制文件系统访问

    - 网络请求：用网络策略限制可访问的域名和端口

    关键设计原则：

    - 最小权限：Agent 只获得完成任务所需的最小权限

    - 快速失败：超时、超内存立即终止，不等待

    - 可审计：沙箱内的所有操作都被记录

    - 可恢复：沙箱销毁后，宿主环境不受影响


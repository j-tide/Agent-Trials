content:
  prompt: 'Q11: 什么是 AI Agent 的 Sandbox（沙箱）技术？为什么它对 Agent 安全至关重要？'
answer:
  mode: rubric
  reference_answer: |-
    1️⃣ Common Answer

    Sandbox（沙箱）是一种安全隔离技术，为 Agent 的代码执行和工具调用提供受限的运行环境。Agent 在沙箱中执行操作时，即使出错也不会影响宿主系统。

    沙箱的核心能力：

    - 文件系统隔离：Agent 只能访问指定目录

    - 网络隔离：限制 Agent 的网络访问范围

    - 资源限制：CPU、内存、执行时间的上限

    - 权限控制：禁止危险操作（如 rm -rf、系统调用）

    常见实现：Docker 容器、gVisor、WebAssembly（Wasm）、E2B 等。

    2️⃣ Impressive Answer

    沙箱是 Agent 安全的最后一道防线。当所有的 Prompt 防护、意图检测、权限控制都失败时，沙箱确保 Agent 的"破坏半径"被控制在可接受范围内。

    为什么 Agent 比传统应用更需要沙箱？

    传统应用的行为是确定性的——代码写了什么就执行什么。但 Agent 的行为是非确定性的——你无法预测 Agent 会生成什么代码、调用什么命令。这意味着：

    - Agent 可能生成恶意代码（被 Prompt 注入攻击）

    - Agent 可能执行危险命令（误解用户意图）

    - Agent 可能无限循环（推理出错）

    沙箱架构设计：

    ```text
    ┌─────────────────────────────────────┐
    │           Agent Runtime              │
    │  ┌─────────────────────────────┐    │
    │  │        Sandbox Layer         │    │
    │  │  ┌───────┐  ┌───────────┐  │    │
    │  │  │ Code  │  │  Tool     │  │    │
    │  │  │ Exec  │  │  Exec     │  │    │
    │  │  │ (Wasm)│  │  (Docker) │  │    │
    │  │  └───────┘  └───────────┘  │    │
    │  │  ┌───────────────────────┐ │    │
    │  │  │   Resource Monitor    │ │    │
    │  │  │  CPU | Mem | Time | IO│ │    │
    │  │  └───────────────────────┘ │    │
    │  └─────────────────────────────┘    │
    │  ┌─────────────────────────────┐    │
    │  │      Permission Gateway     │    │
    │  │  File | Network | System    │    │
    │  └─────────────────────────────┘    │
    └─────────────────────────────────────┘
    ```


    ⭐⭐⭐（Multi-Agent、角色分工、Skill vs Tool）

    1️⃣ Common Answer

    多 Agent 就是多个 Agent 一起工作，各自负责不同的任务。Skill 是封装好的能力，Tool 是具体的工具调用。

    2️⃣ Impressive Answer
    OpenClaw 的多 Agent 协作模式是一个精心设计的、从“单兵作战”到“团队协作”的范式跃迁，其核心在于通过精细的角色分工和能力扩展机制来解决复杂系统任务。

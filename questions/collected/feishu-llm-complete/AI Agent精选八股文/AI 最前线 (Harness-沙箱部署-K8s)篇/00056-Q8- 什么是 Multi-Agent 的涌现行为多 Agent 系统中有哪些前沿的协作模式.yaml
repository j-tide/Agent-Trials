content:
  prompt: 'Q8: 什么是 Multi-Agent 的涌现行为？多 Agent 系统中有哪些前沿的协作模式？'
answer:
  mode: rubric
  reference_answer: |-
    1️⃣ Common Answer

    Multi-Agent 涌现行为是指多个 Agent 协作时，系统整体展现出单个 Agent 不具备的能力。这类似于蚁群中单只蚂蚁很简单，但整个蚁群能完成复杂的建筑和觅食任务。

    当前主流的多 Agent 协作模式：

    - 层级式（Hierarchical）：一个 Manager Agent 负责任务分配，多个 Worker Agent 执行具体任务。如 AutoGen、CrewAI。

    - 辩论式（Debate）：多个 Agent 对同一问题给出不同观点，通过辩论达成共识。可以提升回答质量和减少幻觉。

    - 流水线式（Pipeline）：Agent 按顺序处理任务，每个 Agent 负责一个阶段。如：需求分析 Agent → 编码 Agent → 测试 Agent。

    - 去中心化（Decentralized）：Agent 之间平等协作，通过消息传递和协商完成任务。

    2️⃣ Impressive Answer

    Multi-Agent 系统的前沿研究正在从"预设协作模式"走向"自组织协作"，这是 Agent 研究中最令人兴奋的方向之一。

    协作模式的进化：

    ```text
    Phase 1: 固定拓扑 —— 人工设计 Agent 角色和协作流程
    Phase 2: 动态拓扑 —— Agent 根据任务自动调整协作结构
    Phase 3: 涌现协作 —— Agent 自发形成协作模式，无需预设
    ```

    前沿协作模式：

    - Agent Society（Agent 社会）受人类社会启发，构建一个 Agent 社会，每个 Agent 有自己的角色、目标和记忆：

    - Agent 之间可以自由交流和协商

    - 存在"社会规范"约束 Agent 行为

    - 通过"声誉系统"评估 Agent 的可信度

    - 代表性工作：Generative Agents（斯坦福小镇）、MetaGPT

    - Mixture of Agents（MoA）类似于 Mixture of Experts（MoE），但在 Agent 层面：

    - 多个 Agent 独立处理同一任务

    - 一个 Aggregator Agent 综合所有结果

    - 研究表明 MoA 的效果可以超过单个最强 Agent

    - Agent-as-a-Judge用 Agent 来评估其他 Agent 的输出质量：

    - 比单纯的 LLM-as-Judge 更可靠（Agent 可以使用工具验证事实）

    - 可以形成"评审委员会"，多个 Judge Agent 投票

    - Adversarial Collaboration（对抗式协作）引入"红队 Agent"来挑战"蓝队 Agent"的输出：

    - 红队 Agent 专门寻找漏洞和错误

    - 蓝队 Agent 必须回应挑战并改进

    - 通过对抗提升最终输出质量

    A2A 协议对多 Agent 协作的影响：

    Google 推出的 A2A（Agent-to-Agent）协议，为多 Agent 协作提供了标准化基础：

    - Agent Card：每个 Agent 的能力描述（类似服务注册）

    - Task Management：标准化的任务分配和状态管理

    - Message Protocol：Agent 间的通信格式

    A2A + MCP 的组合，构成了 Agent 生态的"TCP/IP + HTTP"——MCP 解决 Agent 与工具的交互，A2A 解决 Agent 与 Agent 的交互。

    工程落地的关键挑战：

    - 通信开销：Agent 之间的消息传递需要 LLM 调用，成本和延迟都很高

    - 一致性问题：多个 Agent 可能产生矛盾的输出，需要冲突解决机制

    - 调试困难：多 Agent 系统的行为难以预测和调试

    - 成本爆炸：N 个 Agent 的成本不是线性增长，而是可能指数增长


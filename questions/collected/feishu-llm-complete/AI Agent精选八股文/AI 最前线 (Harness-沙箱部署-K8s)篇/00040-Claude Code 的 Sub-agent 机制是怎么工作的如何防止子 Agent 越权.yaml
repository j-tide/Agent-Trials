content:
  prompt: Claude Code 的 Sub-agent 机制是怎么工作的？如何防止子 Agent 越权？
answer:
  mode: rubric
  reference_answer: |-
    ⭐⭐⭐（Sub-agent、任务分解、权限隔离）

    1️⃣ Common Answer

    Claude Code 可以启动子 Agent 来并行处理任务，主 Agent 负责协调，子 Agent 负责执行具体操作。防止越权就是在 Prompt 里告诉它不能做什么。

    2️⃣ Impressive Answer

    我从工作机制和安全边界两个角度来说。

    工作机制：主 Agent 接到任务后先做分解，识别出哪些子任务是相互独立的，然后并行启动多个 Sub-agent。每个 Sub-agent 是无状态的——它不知道其他 Sub-agent 在做什么，所有上下文都通过 Prompt 传入，结果返回给主 Agent 汇总。这个设计让并行变得安全，因为子 Agent 之间没有共享状态，不会互相干扰。

    防止越权的核心是"最小权限 + 明确约束"。在给子 Agent 的 Prompt 里，必须明确写清楚：

    - 必须做什么（任务范围）

    - 绝对不能做什么（禁止操作，比如不能修改配置文件、不能删除数据）

    - 遇到边界情况怎么处理（停下来报告，而不是自行决策）

    工具层面也可以做限制——给子 Agent 只开放它需要的工具，比如只读任务就不给写权限的工具。

    实际工程中，越权问题最常见的原因不是模型"故意"越权，而是 Prompt 写得不够清晰，子 Agent 在边界情况下"自由发挥"了。


content:
  prompt: 10.在Agent可执行任意代码或操作外部系统的场景下，如何设计沙箱环境与权限隔离策略？
answer:
  mode: rubric
  reference_answer: |-
    在 Agent 可执行任意代码或操作外部系统的场景下，安全是首要考量。核心原则是 “最小权限 + 深度隔离”：Agent 只应拥有完成任务所必需的最小权限，且所有操作都在受限环境中执行。以下从四个层次设计沙箱与权限隔离策略。

    ---

    ### 一、代码执行沙箱：隔离运行环境

    针对 Agent 可能生成的 Python、JavaScript、Shell 等代码，必须在受控的沙箱中执行。

    ### 1.1 容器级隔离（推荐）

    - 使用 Docker 容器：每个 Agent 会话或每次代码执行启动一个临时容器。

    - 使用 gVisor 或 Kata Containers：提供更强的内核隔离，适合多租户场景。

    ### 1.2 进程级沙箱（轻量）

    - Linux 命名空间 + Seccomp：通过 unshare 创建隔离的 mount、PID、network 命名空间，结合 seccomp-bpf 过滤危险系统调用（如 clone、reboot、ptrace）。

    - Firecracker 微虚拟机：兼顾容器速度和虚拟机隔离，适合执行不可信代码。

    ### 1.3 语言特定沙箱

    - Python：使用 RestrictedPython 或 pypy 沙箱，但容易被绕过，不单独使用。

    - JavaScript：使用 vm2 或 isolated-vm，限制 require、fetch 等。

    - Shell：避免直接执行，改用白名单命令 + 参数过滤。

    ---

    ### 二、资源限制：防止耗尽攻击

    Agent 可能执行无限循环或申请海量内存，必须设置硬性限制。

    [嵌入表格未展开]

    ---

    ### 三、网络与外部系统隔离：最小化访问面

    Agent 可能需要调用外部 API、读写数据库或访问内部服务。应采用“白名单 + 代理”模式。

    ### 3.1 网络层隔离

    - 默认禁止所有外连：在容器中配置 --network=none，或使用网络策略（如 Calico）限制 egress。

    - 显式白名单：只允许访问特定的 IP/域名 + 端口。例如：

    - 使用代理网关：Agent 的所有外部请求都通过一个可控的 HTTP 代理（如 envoy），由代理进行请求校验、限流、日志记录。

    ### 3.2 操作系统/命令白名单

    如果 Agent 需要执行 Shell 命令（如 ls, cat），不要直接给 sh -c，而是：

    - 解析出命令名和参数

    - 检查命令是否在白名单中（如 ["ls", "cat", "grep"]）

    - 对参数进行路径过滤（禁止 ../、/etc/passwd 等）

    - 使用 execvp 直接调用，避免 shell 注入

    ### 3.3 数据库/API 访问控制

    - 为 Agent 分配独立的数据库账号，仅拥有特定表/视图的 SELECT 权限，无 INSERT/UPDATE/DELETE（除非任务必需）。

    - 对 API 调用使用短期令牌（如 5 分钟有效期），令牌仅允许访问特定端点。

    - 实施配额（Quota）：每个会话每分钟最多调用外部 API 10 次。

    ---

    ### 四、权限隔离策略：基于角色与最小权限

    不仅限制代码执行环境，还要限制 Agent 整体对系统资源的访问。

    ### 4.1 身份与凭证隔离

    - 每个会话/用户使用独立服务账号：Agent 进程以不同的系统用户运行（如 agent_<session_id>），用户组权限严格隔离。

    - 临时凭证：如果需要访问云资源（如 S3、KMS），使用 STS 生成临时 AccessKey（有效期 1 小时），任务结束后自动失效。

    - 禁止硬编码密钥：所有凭证通过密钥管理服务（如 HashiCorp Vault）动态注入，Agent 只持有短期 token。

    ### 4.2 文件系统隔离

    - 沙箱文件系统：使用 chroot 或容器挂载，仅暴露 /usr/bin/whitelist_cmds、/tmp（临时）、/workspace（输入/输出目录）。

    - 只读系统文件：禁止写入 /etc、/bin 等。

    - 输出文件清理：任务完成后，删除 /workspace 下所有临时文件。

    ### 4.3 审计与可追溯

    - 记录所有操作：系统调用、网络连接、文件访问、命令执行等全量日志，附带 session_id、user_id、timestamp。

    - 实时告警：当 Agent 尝试访问未授权资源或执行危险操作（如 ptrace、raw socket）时，触发告警并终止会话。

    ---

    ### 五、架构示例：分层沙箱

    用户请求 → 认证网关 → Agent 编排器
                              ↓
                        为每个会话创建隔离环境：
                        ┌─────────────────────┐
                        │  容器 (Docker)       │
                        │  ├── 只读根文件系统   │
                        │  ├── 网络隔离        │
                        │  ├── 资源限制        │
                        │  └── 代理客户端      │
                        └─────────┬───────────┘
                                  ↓ 外部请求
                        ┌─────────────────────┐
                        │  代理网关 (Envoy)    │
                        │  - 白名单检查        │
                        │  - 限流              │
                        │  - 日志审计          │
                        └─────────┬───────────┘
                                  ↓ 允许的请求
                        外部 API / 数据库 / 内部服务

    执行流程：

    - 编排器收到用户请求后，启动一个新的 Docker 容器，注入会话 ID 和临时凭证。

    - 容器内运行 Agent 代码，所有系统调用被 Seccomp 过滤，网络流量经代理网关。

    - 代理网关校验目标地址和令牌，放行或拒绝。

    - 任务结束（或超时）后，容器被销毁，临时凭证失效，审计日志归档。

    ---

    ### 六、总结与最佳实践

    [嵌入表格未展开]

    核心原则：

    - 默认拒绝：未明确允许的操作一律禁止。

    - 纵深防御：不要依赖单一沙箱（如只用 Python 沙箱），组合容器+网络策略+系统调用过滤。

    - 短生命周期：每个 Agent 任务（或每次代码执行）使用全新的、一次性的环境，用完即毁。

    - 可审计：所有操作留痕，便于事后追查和优化安全策略。

    对于大多数生产场景，Docker 容器 + 资源限制 + 代理网关 的组合已足够安全，且实现成本可控。若处理高度敏感数据，可升级到 gVisor 或 Firecracker 微虚拟机。

  prompt: 13.当Agent在复杂任务中表现不稳定时，你会从哪些角度进行诊断与优化？（提示：可从提示词、工具设计、模型选择等层面展开）
answer:
  mode: rubric
  reference_answer: |-
    ### 一、不稳定现象的典型表现

    [嵌入表格未展开]

    ---

    ### 二、诊断方法论：分层排查

    text

    现象 → 日志分析 → 假设生成 → 控制变量实验 → 验证优化

    必备工具：

    - 全链路Trace（记录每一步的思考、行动、观察）

    - 关键指标埋点（步数、工具调用次数、错误类型）

    - 可复现的测试用例集（特别是失败案例）

    ---

    ### 三、从提示词层面诊断与优化

    3.1 常见提示词问题

    [嵌入表格未展开]

    3.2 提示词优化模板

    ### 角色

    你是一个[专业领域]的Agent，擅长[核心能力]。

    ### 任务目标

    用户会提出一个请求。你必须严格按照以下步骤执行：

    - 分析请求，分解为最多5个子任务。

    - 对每个子任务，决定是否需要调用工具。如果需要，输出JSON格式的工具调用。

    - 收到工具返回结果后，更新进度。

    - 当所有子任务完成，输出“最终答案：...”。

    ### 工具列表

    [工具名称]：描述 + 参数Schema + 示例

    ### 禁止行为

    - 不要连续两次调用相同工具（除非用户明确要求）。

    - 不要输出不存在的工具名。

    - 如果某工具调用失败超过2次，请改用其他方法或告知用户无法完成。

    ### 终止条件

    当你认为已经完整回答用户问题，或确认无法完成时，输出“最终答案：...”。

    3.3 进阶技巧

    - Few-shot示例：提供2-3个完整成功轨迹（含思考、工具调用、观察）。

    - Chain-of-Thought强制：要求每一步输出“思考：...”。

    - 自我反思注入：在提示词中加入“执行完每一步后，检查是否离目标更近”。

    - 动态提示词：根据任务类型（查询/操作/计算）加载不同的提示模板。

    ---

    ### 四、从工具设计层面诊断与优化

    4.1 常见工具设计问题

    [嵌入表格未展开]

    4.2 工具设计优化示例

    优化前（粒度过粗）：

    {
      "name": "process_user_request",
      "params": {"action": "string", "data": "object"}
    }

    模型难以知道action有哪些合法值。

    优化后（拆分为多个工具）：

    [
      {"name": "search_user", "params": {"name": "string"}},
      {"name": "send_email", "params": {"user_id": "int", "content": "string"}},
      {"name": "get_user_orders", "params": {"user_id": "int", "limit": "int"}}
    ]

    4.3 工具返回格式标准化

    {
      "success": true,
      "data": { ... },
      "error": null,
      "suggestion": "如果失败，提供下一步建议"
    }

    模型可以根据success字段快速判断，而非解析错误文本。

    ---

    ### 五、从模型选择与配置层面诊断与优化

    5.1 模型能力与任务匹配度

    [嵌入表格未展开]

    诊断方法：将失败案例的输入，用更强模型（如GPT-4）跑一遍。如果成功率显著提升，说明当前模型能力不足。

    5.2 模型配置参数调优

    [嵌入表格未展开]

    建议：对需要稳定性的任务（如工具调用），temperature设为0.2；对创意任务可稍高。

    5.3 模型幻觉缓解

    - 外部知识注入：使用RAG检索相关信息，减少模型编造。

    - 约束解码：使用JSON模式或正则限制输出格式。

    - 自我校验：让模型对输出进行二次验证（如“请确认你调用的工具是否在列表中”）。

    ---

    ### 六、从工作流与架构层面诊断与优化

    6.1 工作流问题

    [嵌入表格未展开]

    6.2 增加“反思”循环

    在Agent主循环中，定期触发反思：

    if step % 3 == 0:   # 每3步反思一次
        reflection = llm.invoke("当前进度: {progress}，目标: {goal}。是否偏离？下一步最佳行动是什么？")
        if "偏离" in reflection:
            agent.replan()

    6.3 设置熔断与降级

    - 熔断：连续失败3次，切换为更简单的策略（如放弃工具，只回复“我无法完成”）。

    - 降级：复杂模型失败时，回退到基于规则的备份系统。

    ---

    ### 七、诊断Checklist与优化优先级

    [嵌入表格未展开]

    优化顺序建议：

    - 先优化提示词（成本最低，见效快）

    - 再优化工具设计（尤其参数和返回格式）

    - 调整模型参数（如temperature）

    - 最后考虑更换更强模型或增加反思架构

    ---

    ### 八、案例：一个不稳定的数据分析Agent

    现象：用户问“上个月销售额最高的产品是什么？”，有时返回正确，有时返回“无法计算”。

    诊断：

    - 日志显示：失败时，模型没有先调用get_date_range获取“上个月”的具体日期，而是直接调用sales_query，但未传日期参数导致查询失败。

    - 提示词中虽然列出了工具，但未强调“时间范围查询必须先获取具体日期”。

    优化：

    - 修改工具描述：sales_query的参数start_date和end_date改为必填，并在描述中说明“请先用get_date_range获取”。

    - 在提示词中加入示例：“用户问‘上个月’ → 调用get_date_range(relative='last_month') → 获得日期 → 调用sales_query(start_date=..., end_date=...)”。

    - 将temperature从0.7降到0.3。

    结果：成功率从65%提升到92%。

    ---

    ### 九、总结：持续迭代流程

    text

    收集不稳定案例 → 分析根因 → 假设优化点 → 离线评估验证 → 上线A/B测试 → 监控指标变化 → 循环

    通过系统化的诊断和分层优化，绝大多数Agent不稳定问题都可以得到显著改善。

answer:
  mode: rubric
  reference_answer: |-
    损失函数：

    ```python
    def pairwise_ranking_loss(rewards_chosen, rewards_rejected):
        # rewards: shape (batch_size,)
        return -torch.mean(torch.log(torch.sigmoid(rewards_chosen - rewards_rejected)))

    # 训练循环核心
    for batch in dataloader:
        chosen_inputs, rejected_inputs = batch
        # 获取奖励分数，通常取最后一个token的表示经过线性层
        rewards_chosen = reward_model(chosen_inputs)
        rewards_rejected = reward_model(rejected_inputs)
        loss = pairwise_ranking_loss(rewards_chosen, rewards_rejected)
        loss.backward()
    ```

    关键点：奖励模型常基于基座模型，最后加一层 nn.Linear(hidden_size, 1)。


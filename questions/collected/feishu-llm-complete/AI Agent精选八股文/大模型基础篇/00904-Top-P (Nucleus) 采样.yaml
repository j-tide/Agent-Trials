answer:
  mode: rubric
  reference_answer: |-
    算法：

    - 将 logits 转换为概率（softmax）。

    - 按概率降序排序，累加概率直到超过阈值 p。

    - 将剩余 token 的概率置零，重新归一化，然后多项式采样。
    代码：

    ```python
    def top_p_sampling(logits, p):
        probs = F.softmax(logits, dim=-1)
        sorted_probs, sorted_indices = torch.sort(probs, descending=True)
        cumulative_probs = torch.cumsum(sorted_probs, dim=-1)
        # 保留累积概率<=p的token，但至少保留一个
        cutoff_idx = (cumulative_probs > p).nonzero(as_tuple=True)
        if len(cutoff_idx[0]) > 0:
            last_included = cutoff_idx[0][0]
        else:
            last_included = sorted_probs.size(-1) - 1
        sorted_probs[last_included+1:] = 0
        sorted_probs /= sorted_probs.sum(dim=-1, keepdim=True)
        sampled_idx = torch.multinomial(sorted_probs, 1)
        return sorted_indices.gather(-1, sampled_idx).item()
    ```


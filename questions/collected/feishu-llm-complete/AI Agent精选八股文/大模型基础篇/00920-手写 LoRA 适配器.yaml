content:
  prompt: 手写 LoRA 适配器
answer:
  mode: rubric
  reference_answer: |-
    原理：在预训练权重旁路插入低秩矩阵 A 和 B，前向为 Wx + BAx。
    代码：

    ```python
    import torch
    import torch.nn as nn

    class LoRALayer(nn.Module):
        def __init__(self, in_features, out_features, rank=4, alpha=1):
            super().__init__()
            std_dev = 1 / torch.sqrt(torch.tensor(rank).float())
            self.A = nn.Parameter(torch.randn(in_features, rank) * std_dev)
            self.B = nn.Parameter(torch.zeros(rank, out_features))
            self.alpha = alpha
            self.scaling = alpha / rank

        def forward(self, x):
            # x: (batch, in_features)
            return (x @ self.A @ self.B) * self.scaling

    class LoRALinear(nn.Module):
        def __init__(self, linear, rank, alpha):
            super().__init__()
            self.linear = linear  # 原始冻结层
            self.lora = LoRALayer(linear.in_features, linear.out_features, rank, alpha)

        def forward(self, x):
            return self.linear(x) + self.lora(x)

        def merge(self):
            # 训练后将 lora 权重合并回原层
            self.linear.weight.data += (self.lora.A @ self.lora.B).T * self.lora.scaling
    ```

    关键点：初始化时 A 用高斯噪声，B 为零；合并权重时做转置和缩放。


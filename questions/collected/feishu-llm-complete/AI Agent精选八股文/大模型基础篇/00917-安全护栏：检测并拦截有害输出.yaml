  reference_answer: "模块设计：\n\n```python\nimport re\nclass SafetyGuard:\n    def __init__(self):\n
    \       self.blacklist = [\"violence\", \"hack\", ...]\n        self.regex_pattern
    = re.compile(r'\\b(harmful pattern)\\b')\n        self.secondary_prompt = \"Please
    review the following content and determine if it is safe. Answer YES or NO.\"\n
    \   \n    def check(self, text):\n        if any(word in text.lower() for word
    in self.blacklist):\n            return False, \"blacklist\"\n        if self.regex_pattern.search(text):\n
    \           return False, \"regex\"\n        # 二次过滤用小型分类模型\n        score = safety_classifier(text)\n
    \       if score > 0.8:\n            return False, \"classifier\"\n        return
    True, \"safe\"\n```\n\n关键：多层防护，黑名单+正则+模型审核，可结合提示词工程进行内容过滤。\n\n---"

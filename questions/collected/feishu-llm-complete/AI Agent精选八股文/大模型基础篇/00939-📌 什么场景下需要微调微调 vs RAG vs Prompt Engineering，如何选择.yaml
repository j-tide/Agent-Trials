content:
  prompt: "\U0001F4CC 什么场景下需要微调？微调 vs RAG vs Prompt Engineering，如何选择？"
answer:
  mode: rubric
  reference_answer: |-
    先给一个判断框架，再展开：

    [图片内容未导入]

    Prompt Engineering 是零门槛的：改提示词、加 few-shot 例子。适合快速验证、一次性任务。但长上下文窗口有限，复杂模式很难仅靠提示词稳定复现。

    RAG 解决的是“知识的保鲜与幻觉”问题。把文档库向量化，检索后塞进 prompt。优势是知识实时更新、可解释性强；代价是推理延迟增加，检索质量决定上限。

    微调 是“改变模型行为”的手段。当你需要模型学会一种固定的风格、遵循一种内部化推理路径，或掌握一套封闭领域的深层逻辑时，提示词和 RAG 都不够稳。典型场景：

    - 特定格式的结构化输出（API 参数生成）

    - 一种新的推理方式（比如医疗问诊的特殊流程）

    - 低资源语言/领域的适配

    一个实操的选择决策树，我习惯这样写：

    def choose_method(task, knowledge_needs, data_available):
        if not knowledge_needs and not data_available:
            return "Prompt Engineering + few-shot"
        if knowledge_needs and not data_available:
            return "RAG with external knowledge base"
        if data_available > 1000 and task_requires_style_shifts:
            return "Fine-tune (LoRA/QLoRA)"
        return "Start with prompt, collect data, then fine-tune"

    三者的关系不是互斥的，最强系统往往是 微调基座 + RAG 检索 + 精心设计的多轮 prompt。从成本看，能 prompt 解决的不 RAG，能 RAG 解决的不微调；从效果天花板看，顺序反过来了。

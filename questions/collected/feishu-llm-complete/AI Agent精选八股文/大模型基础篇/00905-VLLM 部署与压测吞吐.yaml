answer:
  mode: rubric
  reference_answer: |-
    部署命令：

    ```bash
    python -m vllm.entrypoints.openai.api_server \
        --model meta-llama/Meta-Llama-3-8B \
        --tensor-parallel-size 1 \
        --max-model-len 4096 \
        --gpu-memory-utilization 0.95
    ```

    压测脚本（使用 vllm 的 benchmark）：

    ```python
    from vllm import LLM, SamplingParams
    import time

    llm = LLM(model="meta-llama/Meta-Llama-3-8B")
    prompts = ["Explain the theory of relativity."] * 100
    sampling_params = SamplingParams(temperature=0, max_tokens=256)
    start = time.time()
    outputs = llm.generate(prompts, sampling_params)
    end = time.time()
    tokens = sum(len(out.outputs[0].token_ids) for out in outputs)
    print(f"Throughput: {tokens/(end-start):.2f} tokens/s")
    ```

    关键点：Continuous batching 动态合并请求，gpu-memory-utilization 控制显存使用。


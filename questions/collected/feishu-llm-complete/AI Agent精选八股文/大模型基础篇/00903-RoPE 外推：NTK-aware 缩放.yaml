  reference_answer: |-
    原理：将旋转位置编码的频率进行动态缩放，使模型能处理更长的上下文。

    代码实现：

    ```python
    import torch
    def ntk_aware_scaling(seq_len, base=10000.0, alpha=1.0):
        # 原始频率：base^{-2i/d}
        # 缩放：new_base = base * alpha ^ (d / (d-2))
        d = 128  # head dimension
        new_base = base * (alpha ** (d / (d - 2)))
        # 生成位置编码矩阵，使用new_base
        inv_freq = 1.0 / (new_base ** (torch.arange(0, d, 2).float() / d))

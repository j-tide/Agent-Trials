content:
  prompt: "\U0001F530 Context Engineering 和 Prompt Engineering 有什么区别？为什么说\"Context
    is the new RAG\"？"
answer:
  mode: rubric
  reference_answer: |-
    这是一个从“雕琢词句”到“构建信息环境”的视角升级。

    Prompt Engineering

    聚焦于单次指令文本的精心设计：怎么措辞、如何排版、角色分配、few-shot 样例排列、分隔符选择等。它的作用域是那个“你手写进 API 请求的字符串”，目标是最大化当前调用返回的质量。

    - 典型手法：角色扮演、思维链触发、格式化约束、反例展示。

    - 工具层面：迭代修改文本、记录提示词版本。

    Context Engineering

    则把整个上下文窗口看作一个可编程的、动态的知识界面。它思考的是：在有限的上下文容量中，哪些信息应该存在？以什么顺序、什么密度呈现？如何动态更新这些信息（检索、记忆、工具调用、对话历史裁剪）？

    - 它处理的对象不只是提示词模板，更包括：

    - 核心问题：如何在上下文中合理安排海量信息，使模型在每一轮都能“恰好看到它需要的”。

    示例：一个上下文工程化的 ChatGPT 请求结构

    context_blueprint = {
        "system_prompt": "你是严谨的技术面试官，需评估候选人的回答深度。",
        "user_profile": {"level": "senior", "focus": "推理优化"},
        "history_summary": "已问过 KV Cache 和 PagedAttention，回答正确。",
        "retrieved_docs": [doc1, doc2],  # 从知识库检出的补充材料
        "current_turn": "请解释 Speculative Decoding 的原理。"
    }
    # 按优先级拼接：系统提示 → 用户画像 → 检索文档 → 历史摘要 → 当前问题
    final_prompt = assemble(context_blueprint)

    为什么说"Context is the new RAG"？

    传统 RAG 是“搜→塞进 prompt→生成”。随着 100K、1M token 上下文窗口的出现，一个颠覆性想法成立：我们不再需要精心优化检索器，而是直接把大量相关文档提前塞进上下文，让模型当场“阅读”并作答。上下文自身变成一个可检索、可编辑的庞大记忆库。

    这就衍生了新的范式：

    - 长上下文 LLM + 上下文注入：把整个产品手册、代码仓库放到上下文中，模型相当于拥有项目专属长时记忆。

    - 上下文即数据库：不再依赖外部向量检索的中间层，所有信息都在 prompt 中，延迟更低，流程更可控。

    - 上下文工程的管理职责：要对这个巨大上下文空间做“搜索引擎优化”——哪些信息放前面、哪些需要精简摘要、如何组织层级结构，使得模型注意力分配最优。

    所以，“Context is the new RAG”的内涵是：当上下文窗口大到可以容纳整个知识库时，信息检索的本质从“找到再喂”变成了“提前陈列、内部检索”，Prompt Engineer 也因此升级为 Context Engineer——不再只写提示词，而是在设计一个模型工作的小型信息生态。


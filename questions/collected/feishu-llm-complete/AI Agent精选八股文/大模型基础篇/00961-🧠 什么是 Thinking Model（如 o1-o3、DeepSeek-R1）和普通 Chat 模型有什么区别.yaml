content:
  prompt: "\U0001F9E0 什么是 Thinking Model（如 o1/o3、DeepSeek-R1）？和普通 Chat 模型有什么区别？"
answer:
  mode: rubric
  reference_answer: "普通 Chat 模型（如 GPT-4、Claude 3.5）接收到用户指令后，直接生成回答。其“思考”过程是隐式的，仅存在于逐
    token 前向的激活中，模型被训练为快速输出。\n\nThinking Model（推理模型）在输出最终答案之前，会进行一段显式的、通常是内部的推理过程（思维链），通过多步分析、假设检验、自我纠错来提升复杂问题的正确率。\n\n[图片内容未导入]\n\n\U0001F539
    核心区别维度\n\n[嵌入表格未展开]\n\n\U0001F539 实现原理（以 DeepSeek-R1 为例）\n\nDeepSeek-R1 使用 GRPO（Group
    Relative Policy Optimization） 来训练模型。其核心是：\n\n- 过程奖励模型（PRM）：不仅评估最终结果，还评估推理步骤的正确性。\n\n-
    多轮自我修正：模型在生成过程中可以插入 rethinking token 来回溯和纠正错误。\n\n- 强制思维链：训练时，模型必须输出包含 <think>
    ... </think> 包裹的推理段，最终答案放在 <answer> 标签内。\n\nOpenAI 的 o1 系列没有公开详细技术，但推测使用了基于蒙特卡洛树搜索（MCTS）或类似
    PRM 引导的强化学习，在庞大的问题空间中做隐式搜索。\n\n\U0001F539 调用示例对比\n\n# 普通 Chat 调用\nresponse = client.chat.completions.create(\n
    \   model=\"gpt-4o\",\n    messages=[{\"role\": \"user\", \"content\": \"证明勾股定理\"}]\n)\nprint(response.choices[0].message.content)
    \ # 直接给出证明\n\n# Thinking Model 调用 (o1 风格)\nresponse = client.chat.completions.create(\n
    \   model=\"o1-preview\",\n    messages=[{\"role\": \"user\", \"content\": \"证明勾股定理\"}]\n)\n#
    返回中可能包含隐藏的 reasoning_tokens，最终输出更严谨的证明\n\n\U0001F539 何时用 Thinking Model？\n\n-
    需要多步推理、逻辑严密的场景（数学竞赛、法律分析、复杂代码生成）。\n\n- 对延迟不敏感，但对准确率要求极高的任务。\n\n如果类比一下，普通 Chat
    模型是“直觉型选手”，看到问题立刻反应；Thinking Model 则是“慢思考选手”，在脑内把各种路径都试一遍，确认无误才开口。两种模型不是替代关系，而是分工：一个负责快速交互，一个负责深度攻坚。"

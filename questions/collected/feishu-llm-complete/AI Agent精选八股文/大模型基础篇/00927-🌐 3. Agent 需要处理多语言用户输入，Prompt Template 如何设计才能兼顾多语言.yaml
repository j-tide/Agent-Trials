content:
  prompt: "\U0001F310 3. Agent 需要处理多语言用户输入，Prompt Template 如何设计才能兼顾多语言？"
answer:
  mode: rubric
  reference_answer: |-
    设计思想：指令统一为英语（LLM 理解指令的母语），内容与回复语言动态切换。

    LLM 训练时绝大部分指令数据是英文，用英文写 system prompt 往往遵循性最好。因此，多语言模板的核心是：

    - 指令层固定英文（角色、规则、格式约束）。

    - 让模型“检测用户语言并用同语言回复”。

    - 动态注入语言特定的格式范例。

    多语言友好模板架构

    ```python
    from langchain.prompts import ChatPromptTemplate
    from langdetect import detect

    system_base = """You are a multilingual customer support agent.
    Follow these rules:
    1. Detect the language of the user's message.
    2. Reply in the SAME language.
    3. Keep replies professional and helpful.
    4. If the query is out of scope, politely decline in the detected language.
    """

    # 语言专属的输出格式提示（可选，增强稳定性）
    lang_hints = {
        "zh": "请用中文回复，使用亲切的「您」称呼。",
        "en": "Reply in English, be concise.",
        "ja": "日本語で返答し、敬語を使ってください。",
        "default": "Reply in the detected language naturally."
    }

    def build_multilingual_prompt(user_input: str):
        # 自动检测语言
        try:
            lang = detect(user_input)
        except:
            lang = "default"
        hint = lang_hints.get(lang, lang_hints["default"])

        # 组装系统提示
        system_msg = f"{system_base}\n当前语言指示：{hint}"

        # 使用 ChatPromptTemplate 保证角色隔离
        prompt_template = ChatPromptTemplate.from_messages([
            ("system", system_msg),
            ("user", "{input}")
        ])
        return prompt_template.format_messages(input=user_input)

    # 测试
    print(build_multilingual_prompt("我的订单什么时候发货？"))
    print(build_multilingual_prompt("When will my order be shipped?"))
    ```

    更深的工程化实践：

    - 国际化示例库：为每种语言准备 few-shot 范例，根据检测结果抽取对应语言的例子，能显著提高小语种稳定性。

    - 回退翻译管道：对稀缺语言，可先翻译成英文处理，再将英文回复翻译回原语言，但会增加延迟和不准确风险。

    - 结构化输出约束：要求模型输出 JSON，并在 schema 中定义多语言字段，例如 {"reply_zh": "...", "reply_en": "..."}，由前端按需展示。

    完整的多语言 Agent 代码骨架：

    ```python
    def multilingual_agent(user_input):
        lang = detect(user_input)
        # 1. 选择对应语言的 few-shot
        examples = select_few_shot(lang, user_input)
        # 2. 构建多语言系统提示
        system = build_system_prompt(lang)
        # 3. 最终组装
        messages = [
            {"role": "system", "content": system},
            *examples,
            {"role": "user", "content": user_input}
        ]
        response = llm(messages)
        return response
    ```

    用一句话记住：

    英语是“指令语言”，用户的母语是“交流语言”，模板把两者统一在同一个上下文中，让模型按指令切换输出语言，既不牺牲遵循性，又不丢失本地化体验。

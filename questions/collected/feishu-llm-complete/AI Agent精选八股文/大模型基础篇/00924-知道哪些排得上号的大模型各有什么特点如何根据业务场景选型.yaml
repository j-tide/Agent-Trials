content:
  prompt: 知道哪些排得上号的大模型？各有什么特点？如何根据业务场景选型？
answer:
  mode: rubric
  reference_answer: |-
    答：

    现在行业里值得关注的大模型，我习惯按几个阵营来看：

    ▸ 国际闭源第一梯队

    - GPT‑4o / o1 系列：多模态成熟，工具调用和推理顶尖，生态最完整。

    - Claude 3.5/4：长文档理解与安全对齐极其出色，编程能力经常冲顶。

    - Gemini 2.0 系列：原生多模态，百万级上下文，与谷歌服务深度打通。

    ▸ 国内主力

    - 通义千问 Qwen2.5/3：全尺寸开源，中文底子扎实，多语言和长文本都均衡。

    - DeepSeek‑V3 / R1：MoE 架构成本极低，代码和数学推理能和国际顶流对打。

    - 文心 ERNIE 4.5：搜索增强和知识时效性强，理解生成平衡。

    - 智谱 GLM‑4：工具调用与 Agent 能力突出，国产化部署方案完善。

    - Kimi：超长上下文（200 万字）是名片，擅长长文档分析与整书摘要。

    ▸ 开源/开放权重代表

    - Llama 3/4 系列：社区生态最强，微调资源最丰富，行业定制的“标准底座”。

    - Qwen 系列：尺寸覆盖最广，从手机端到服务器都有对应版本。

    - DeepSeek‑V3 / R1：开源代码与数学的标杆，性价比极高。

    - Mistral / Mixtral 系列：结构精巧，MoE 效率高，多语言也可用。

    选型时我一般看五个交叉点：

    ▸ 任务是什么：理解分析型看长文本精度，生成创造型看流畅度，代码数学就偏 DeepSeek/Claude/GPT。

    ▸ 数据能出域吗：不能就必然走上开源私有化部署的路；能出域且追求上限，闭源 API 最省心。

    ▸ 中文深度如何：深中文语境和本土知识，国内模型有先天训练数据优势。

    ▸ 成本和并发需求：高并发低成本可以选 MoE 架构 API 或小参数开源模型；低频高质就直接上最强闭源。

    ▸ 要定制多深：需要反复微调、注入行业黑话的，开源远比闭源自由。


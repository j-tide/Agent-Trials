  prompt: "\U0001F9E9 三者如何协同？"
answer:
  mode: rubric
  reference_answer: |-
    这三个技术常常组合应用，构建高性能推理引擎：

    - Flash Attention 解决 Prefill 阶段的计算密集和显存瓶颈，也让长序列解码更快。

    - PagedAttention 解决多请求并发时的 KV Cache 显存浪费和调度问题，最大化吞吐。

    - Speculative Decoding 解决单请求 Decode 阶段的串行限制，大幅压低延迟。

    高性能推理引擎 = Flash Attention (计算加速)
                   + PagedAttention (显存管理)
                   + Speculative Decoding (串行破局)

    理解它们，你就真正握住了大模型从“跑起来”到“跑得快、跑得多”的钥匙。

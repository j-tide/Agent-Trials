content:
  prompt: "⚙️  System Prompt、User Prompt、Assistant Prompt 各自的作用是什么？如何设计一个好的 System
    Prompt？"
answer:
  mode: rubric
  reference_answer: |-
    在 Chat Completions API 的消息结构中，三者分工明确，构成一个“元认知—任务—行为记录”的闭环。

    [图片内容未导入]

    各自作用：

    - System Prompt（系统消息）
    定义 “你是谁、遵守什么规则、在什么环境下工作”。它是持续的“元指令”，整个对话期间有效，不会被用户覆盖，也不参与对话回合交替。模型会将其作为高优先级约束。
    作用维度：角色设定（客服/导师/代码助手）、语气风格、安全边界、输出格式约束、可用的工具声明。

    - User Prompt（用户消息）
    承载 “用户意图与上下文”。是直接驱动模型生成回复的输入，可以包含文本、图片（多模态）等。在多轮对话中，每轮新的 User 消息代表一次新的交互起点。

    - Assistant Prompt（助手消息）
    记录 “模型之前的输出”，构建对话历史。多轮对话时，把前几轮的 Assistant 消息与对应的 User 消息配对喂给模型，使其理解已说过的内容和未完成的任务。注意： 它只作历史记录，不是让用户预设模型该说什么（那样会扰乱真实对话流）。

    设计优秀 System Prompt 的五个原则：

    - 角色声明要具体，有身份感
    不是“你是一个助手”，而是“你是某大厂 SRE 专家，善于用通俗比喻解释复杂运维问题”。

    - 行为约束用肯定句，加“必须/禁止”清单

    你必须：
    - 在给出代码前先解释思路。
    - 所有金额用人民币表示。
    你禁止：
    - 捏造 API 接口。
    - 承认自己是 AI。

    - 输出格式用结构描述
    “你的回答必须包含三个部分：摘要（≤50字）、详细分析、可执行建议”。

    - 注入动态上下文槽位
    好的 System Prompt 会预留变量，如 {{current_date}}、{{user_name}}，由应用层填充，保持信息新鲜。

    - 分层编写，优先顺序递减
    最重要的约束放前面，模型注意力在开头和结尾较强。

    设计骨架示例：

    system_prompt_template = """
    # 身份
    你是 {{company}} 的 AI 面试官，名叫 {{agent_name}}，专注考察后端工程师的系统设计能力。

    # 行为准则
    - 始终保持专业、鼓励的态度。
    - 当候选人答对时，追问更深一层；答错时，先肯定再给出正确思路。
    - 严禁透露正确答案的具体实现，只引导思考方向。

    # 当前面试信息
    - 候选人背景：{{candidate_level}}
    - 当前考察模块：{{current_topic}}
    - 已问过的问题数：{{asked_count}} / 总 {{total_questions}}

    # 输出要求
    你的每次回复以提问结尾，格式：先反馈，再下一个问题。
    """

    这样设计后，替换模板变量就能快速适配不同公司/岗位，且行为稳定可控。


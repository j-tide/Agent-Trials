answer:
  mode: rubric
  reference_answer: |-
    方案：给定问答对，用大模型判断答案是否与参考文本一致或包含虚构内容。

    Prompt 设计：

    ```text
    You are a factuality checker. Given the question and the answer, determine if the answer contains any fabricated information that is not supported by common knowledge. Answer "Yes" if fabricated, "No" if factual.
    Question: {question}
    Answer: {answer}
    ```

    批量评估脚本：

    ```python
    def check_factuality(questions, answers, model, tokenizer):
        results = []
        for q, a in zip(questions, answers):
            prompt = f"...{q}...{a}..."
            inputs = tokenizer(prompt, return_tensors="pt")
            outputs = model.generate(**inputs, max_new_tokens=5)
            decision = tokenizer.decode(outputs[0], skip_special_tokens=True).strip().lower()
            results.append("yes" in decision)
        return sum(results)/len(results)
    ```

    指标：幻觉率 = 判为“虚构”的比例；可结合人工标注计算准确率。


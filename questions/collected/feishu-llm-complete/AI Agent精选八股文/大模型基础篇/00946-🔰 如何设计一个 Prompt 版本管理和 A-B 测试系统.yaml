    3 多维度评估体系

    离线评估（自动）与在线指标结合。

    离线自动评估：

    def evaluate_prompt(prompt_version, test_dataset):
        scores = []
        for case in test_dataset:
            rendered = prompt_manager.render(prompt_version, {"user_input": case["input"]})
            output = call_llm(rendered)
            # 多维度打分
            structure_score = validate_json_structure(output, case["expected"])
            content_score = semantic_match(output, case["expected"])  # 基于嵌入相似度
            scores.append(0.7*structure_score + 0.3*content_score)
        return {"mean_score": np.mean(scores), "n": len(scores)}

    在线指标与统计检验：

    收集用户级指标：准确率（人工标注或用户反馈）、任务完成率、延迟、成本（token 用量）。

    # 简化版统计比较
    from scipy import stats

    def ab_test_report(metrics_v1, metrics_v2, alpha=0.05):
        # metrics 是数组，例如 [1,0,1,...] 表示每次任务是否成功
        t_stat, p_value = stats.ttest_ind(metrics_v1, metrics_v2)
        mean1, mean2 = np.mean(metrics_v1), np.mean(metrics_v2)
        lift = (mean2 - mean1) / mean1 * 100
        return {
            "p_value": p_value,
            "significant": p_value < alpha,
            "lift": lift,
            "winner": "v2" if (lift > 0 and p_value < alpha) else "v1" if (lift < 0 and p_value < alpha) else "no winner"
        }

    工作流：

    - 工程师在 YAML 中创建新版本并推送 Git。

    - CI 运行离线测试，输出分数与基线的对比。

    - 通过后，配置 10% 灰度在线实验，收集数据 24h。

    - 查看 A/B 报表，若新版本在核心指标上显著优于旧版且无副作用，全量切换。

    进阶点：

    - 动态 Prompt 优化：可以用 DSPy 等框架自动优化 few-shot 样例选择，将自动评估分数作为信号，自动调整示例顺序和数量。

    - 上下文长度管理：在上下文工程层面，A/B 测试也可以针对不同的检索策略、历史摘要方法进行实验，整个链路版本化。

    ---

    从提示词的雕琢，到上下文的生态设计，再到工程化的版本实验，这三层构成了今天 LLM 应用构建的核心阶梯。真正成熟的 LLM 产品，并不是靠一个神奇的 prompt 运行，而是靠一套可以持续迭代、量化评估、安全回滚的 Prompt 研发体系。 当你开始这样思考问题时，你就从 Prompt 写手变成了 LLM 产品工程师。

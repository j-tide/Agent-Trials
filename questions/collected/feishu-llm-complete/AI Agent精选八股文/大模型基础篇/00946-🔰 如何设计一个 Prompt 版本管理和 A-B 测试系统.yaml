  prompt: "\U0001F530 如何设计一个 Prompt 版本管理和 A/B 测试系统？"
answer:
  mode: rubric
  reference_answer: |-
    真正的生产级 LLM 应用，提示词就是核心资产，必须像管理代码那样管理提示词，像测试产品那样测试效果。下面给出一个可落地的系统设计骨架，融合版本控制、在线实验和自动评估。

    整体架构：

    [图片内容未导入]

    1 Prompt 版本管理

    像代码一样在 Git 中维护 Prompt 文件，使用结构化 YAML，每个版本包含元数据、模板、变量、预期输入输出样例。

    # prompts/sentiment_analysis/v1.2.yaml
    name: "情感分析-少样本Cot版"
    version: "1.2"
    created: "2026-06-20"
    author: "team-llm"
    template: |
      你是一个情感分析专家。请逐步分析以下文本的方面级情感。

      示例:
      文本: “味道不错但服务太慢”
      思考: 文本提到两个实体：味道和服务。味道是正面的，服务是负面的。
      结果: [{"aspect": "味道", "sentiment": "正面"}, {"aspect": "服务", "sentiment": "负面"}]

      现在分析:
      文本: {{user_input}}
      思考:
    variables:
      - user_input
    test_cases:
      - input: "环境优雅，价格公道"
        expected: [{"aspect": "环境", "sentiment": "正面"}, {"aspect": "价格", "sentiment": "正面"}]

    版本策略：语义化版本号，主版本（大改思路）、次版本（调整样例/措辞）、补丁（修复格式错误）。每次变更用 PR 审核，合并触发 CI 自动评估。

    2 A/B 实验分流

    在应用层加入实验配置，无侵入地切换 Prompt 版本。

    # 简易的 Prompt 管理器 + 实验分流
    import yaml, random, hashlib

    class PromptManager:
        def __init__(self):
            self.versions = {}  # version_name -> config
            self.load_all()

        def load_all(self):
            # 实际从 Git 仓库拉取或缓存读取
            pass

        def render(self, version, variables):
            template = self.versions[version]['template']
            # 简单的变量替换
            for var, val in variables.items():
                template = template.replace(f"{{{{{var}}}}}", val)
            return template

    # A/B 分流器：按 user_id 哈希决定版本，保证用户一致性
    def get_prompt_version(user_id, experiment_config):
        if experiment_config["enabled"]:
            bucket = int(hashlib.md5(user_id.encode()).hexdigest(), 16) % 100
            for version, ratio in experiment_config["groups"]:
                if bucket < ratio:
                    return version
                bucket -= ratio
        return experiment_config["default"]

    # 实验配置
    exp_config = {
        "enabled": True,
        "default": "v1.2",
        "groups": [("v1.2", 50), ("v2.0-cot-plus", 50)]  # 各50%流量
    }
    user_input = "环境优雅，价格公道"
    version = get_prompt_version("user_abc", exp_config)
    final_prompt = prompt_manager.render(version, {"user_input": user_input})

content:
  prompt: 滑动窗口长文本分块（段落感知）
answer:
  mode: rubric
  reference_answer: |-
    要求：保持 Markdown 段落完整性，支持 chunk size 和 overlap。

    实现思路：先按段落分割（双换行），再贪心合并段落直到接近 chunk size，重叠部分用上一块最后几个段落实现 overlap。

    代码：

    ```python
    def markdown_splitter(text, chunk_size=1000, chunk_overlap=200):
        paragraphs = text.split('\n\n')
        chunks = []
        current_chunk = []
        current_len = 0
        for para in paragraphs:
            para_len = len(para)
            if current_len + para_len > chunk_size and current_chunk:
                # 保存当前 chunk
                chunks.append('\n\n'.join(current_chunk))
                # 重叠处理：保留最后几个段落使得总字符数接近 overlap
                overlap_paras = []
                overlap_len = 0
                for p in reversed(current_chunk):
                    if overlap_len + len(p) <= chunk_overlap:
                        overlap_paras.insert(0, p)
                        overlap_len += len(p)
                    else:
                        break
                current_chunk = overlap_paras
                current_len = overlap_len
            current_chunk.append(para)
            current_len += para_len
        if current_chunk:
            chunks.append('\n\n'.join(current_chunk))
        return chunks
    ```

    关键点：确保 chunk 边界不会切断句子，overlap 通过保留尾部段落实现上下文衔接。


content:
  prompt: "\U0001F7E2 LoRA 和 QLoRA 微调的原理是什么？为什么能用很少的参数达到接近全量微调的效果？"
answer:
  mode: rubric
  reference_answer: |-
    先说 LoRA，它的思路非常简洁。

    ▪ LoRA 原理
    当我们做下游任务微调时，模型权重从原始的 W0W0 变成 W0+ΔWW0+ΔW。LoRA 假设这个更新量 ΔWΔW 是低秩的，可以分解为两个小矩阵的乘积：
    ΔW=BAΔW=BA，
    其中如果 W0W0 的维度是 d×kd×k，那么 BB 是 d×rd×r，AA 是 r×kr×k，而秩 rr 远小于 dd 和 kk。

    训练时，我们冻结 W0W0，只优化 AA 和 BB。前向计算就是：
    h=W0x+BAxh=W0x+BAx
    由于 rr 很小，可训练参数量从原本的 d×kd×k 骤降到 r(d+k)r(d+k)，经常只有原模型的千分之一左右。推理时还可以把 BABA 加到 W0W0 里，不增加任何延迟。

    ▪ QLoRA 原理

    QLoRA 是在 LoRA 的基础上再加上了4 比特量化，目标就一个：大幅压低显存，保持效果。

    它先把预训练模型用 4-bit NormalFloat 格式量化并冻结，只在这些量化权重之上添加 LoRA 适配器。同时用了双重量化（对量化常数再量化）和分页优化器等技术，进一步压缩显存。训练时，每次需要权重时，是反量化回高精度，再与 LoRA 的前向结果相加。

    ▪ 为什么极少量参数就能接近全量微调？
    核心原因在于：大模型在适配下游任务时，权重更新的“有效自由度”远小于参数总量。
    研究发现，很多任务只需要在一个很低的内在维度上做调整，就能覆盖绝大多数的性能提升。LoRA 的 rr 恰好抓住了这个低秩结构。换句话说，模型本身已经具备了足够的语言和推理基础，我们只要在关键方向上轻轻“扭动”一下就够了。
    QLoRA 则证明了，即使量化到 4-bit，这个低秩更新仍然足以恢复绝大部分任务表现，因为量化引入的误差可以通过 Adapter 的微小调整被补偿回来。

    这也解释了为什么现在社区微调几乎都首选 LoRA/QLoRA，因为它把“算力自由”真正下放给了个人开发者。


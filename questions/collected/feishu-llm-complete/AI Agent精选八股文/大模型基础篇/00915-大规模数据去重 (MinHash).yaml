answer:
  mode: rubric
  reference_answer: |-
    步骤：

    - 将文本转换为 n-gram 集合（如 5-gram）。

    - 使用多个哈希函数计算 MinHash 签名。

    - 使用 LSH（Locality Sensitive Hashing）分桶，桶内相似对计算 Jaccard 相似度。

    - 相似度超过阈值则去重。
    核心（使用 datasketch 库）：

    ```python
    from datasketch import MinHash, MinHashLSH
    lsh = MinHashLSH(threshold=0.8, num_perm=128)
    for i, text in enumerate(corpus):
        m = MinHash(num_perm=128)
        for word in text.split():
            m.update(word.encode('utf8'))
        lsh.insert(i, m)
    # 查询重复
    for i, text in enumerate(corpus):
        m = MinHash(num_perm=128)
        for word in text.split():
            m.update(word.encode('utf8'))
        result = lsh.query(m)
        # result 包含相似文档 id
    ```

    关键：num_perm（哈希函数个数）影响精度；threshold 一般 0.8～0.9。


content:
  prompt: "\U0001F537 vLLM 的 PagedAttention 解决了什么问题？和 HuggingFace Transformers 推理有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    先看一张显存分布图，直观感受问题的根源：

    [图片内容未导入]

    在自回归生成时，KV Cache 是最大的显存消费者。一个 7B 模型，用 FP16，单个 token 的 KV Cache 大约需要 2 * 层数 * 头数 * 头维度 * 2(key+value) * 2字节，随着批次和序列长度暴增。

    传统实现（包括 HF Transformers 默认推理）的问题在于：

    - 连续预分配 + 碎片化：启动时为每个序列预先分配一块最大长度的连续显存。如果一批请求有的只要 50 token，有的需要 2000 token，则大量显存浪费在短序列未使用的尾部。

    - 无法动态共享：多个请求若有相同的系统提示词（prefix），各自的 KV Cache 完全独立存储，重复占用。

    - 显存管理粗放：一旦请求结束或被抢占，释放的块无法高效地复用给新请求，显存利用率常低于 30%。

    PagedAttention 的解法：将 KV Cache 按块（block）管理，像操作系统中的虚拟内存分页一样。

    它将每个序列的 KV Cache 切割成固定大小的 block（例如 16 个 token 一块），不再要求整条序列的 Cache 物理连续。每个 block 可以独立分配、释放、共享。一张图说明逻辑：

    序列 A:  [Block 0] → [Block 1] → [Block 3]
    序列 B:  [Block 0] → [Block 2] → [Block 4] → [Block 5]
    共享前缀   ↑ 两个序列共享同一个 Block 0

    具体解决的问题：

    - 显存浪费：动态分配 block，按需取用，内部碎片仅出现在最后一个 block 内部，远小于预留整窗口。

    - 前缀共享：系统 prompt 的 KV Cache 只存一份，所有请求通过指针共享，显存节省 50% 以上。

    - 调度灵活：请求被抢占或完成时，直接回收 block 链表，可立即用于新请求，几乎无外部碎片。

    和 HF Transformers 推理的核心区别：

    [嵌入表格未展开]

    代码对比（简化版）：

    HF 式实现（每个序列预分配固定长度）：

    # 伪代码：HF 风格的 KV Cache 初始化
    kv_cache = torch.zeros(batch, num_layers, 2, max_len, num_heads, head_dim)
    for step in range(max_new_tokens):
        # 每次直接往连续内存中写入新 token 的 kv
        kv_cache[:, :, :, step, :, :] = new_kv
        # 注意力计算时取 [0:step+1]

    PagedAttention 管理逻辑：

    # vLLM 风格：block table 管理
    block_size = 16
    class KVCacheBlockManager:
        def __init__(self):
            self.free_blocks = [...]  # 显存池中可用的 block 编号
            self.block_tables = {}     # 序列ID -> [block_idx1, block_idx2, ...]

        def allocate(self, seq_id, num_tokens):
            # 计算需要多少新块，从 free_blocks 中取
            needed = (num_tokens + block_size - 1) // block_size
            new_blocks = [self.free_blocks.pop() for _ in range(needed)]
            self.block_tables.setdefault(seq_id, []).extend(new_blocks)
            # 将 token 的 kv 写入对应的块物理地址
            for i, blk in enumerate(new_blocks):
                write_kv_to_block(blk, token_indices[i*block_size:(i+1)*block_size])

        def free(self, seq_id):
            # 回收该序列全部 block 回 free list
            self.free_blocks.extend(self.block_tables.pop(seq_id))

    注意力计算时，通过 block table 将逻辑位置映射到物理块，用自定义 CUDA kernel 一次性完成，避免了碎片和拷贝开销。这就是 vLLM 吞吐量能数倍于 HF Transformers 的根本原因。

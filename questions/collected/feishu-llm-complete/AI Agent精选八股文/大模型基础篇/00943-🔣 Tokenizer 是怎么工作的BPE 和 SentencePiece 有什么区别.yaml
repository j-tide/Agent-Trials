content:
  prompt: "\U0001F523 Tokenizer 是怎么工作的？BPE 和 SentencePiece 有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    Tokenizer 是模型理解世界的“基础字母表”，它把文本转成模型可处理的 ID 序列。

    工作流程简图：

    原始文本 → 规范化(Normalization) → 预分词(Pre-tokenization) → 子词分割(Subword modeling) → ID 映射

    核心难点： 既要词汇量小（降低 softmax 尺寸和显存），又要能无损编码任意新词（避免 UNK）。

    子词分割是主流解法，它把罕见词拆成有意义的片段，常见词保留完整。例如 “tokenization” → ["token", "ization"]。

    BPE（Byte-Pair Encoding）

    - 从字符级开始，统计所有相邻符号对的出现频率，不断合并最高频对，直到达到预设词表大小。

    - 本质是一种自底向上的压缩算法。训练后得到 merge rules，编码时按规则贪婪拆分。

    - 优点：简单有效，GPT 系列使用。

    - 缺点：对空格处理依赖原始分词器；多语言时可能产生奇怪的分割（因为没有字符层面的规范化）。

    SentencePiece

    - 把输入文本直接当作 Unicode 字符流，包括空格也视为普通字符“▁”（U+2581）。不依赖语言特定的预分词。

    - 支持 BPE 和 Unigram 两种算法，常用 Unigram：初始化一个大词表，反复移除使训练数据似然损失最小的 token，直到缩至目标大小。

    - 优点：完全语言无关，日语、中文等无空格语言友好；训练出的模型就是单一文件，部署简单。

    - 代表：LLaMA、T5、XLNet 等。


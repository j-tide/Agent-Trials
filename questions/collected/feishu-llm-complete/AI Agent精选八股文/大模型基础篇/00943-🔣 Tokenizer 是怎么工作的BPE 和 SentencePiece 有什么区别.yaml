    代码级示例：

    from transformers import AutoTokenizer

    tokenizer = AutoTokenizer.from_pretrained("meta-llama/Llama-2-7b-hf")
    tokens = tokenizer.tokenize("ChatGPT is amazing!")
    print(tokens)
    # 输出: ['▁Chat', 'G', 'PT', '▁is', '▁amazing', '!']

    这里的 ▁ 就是 SentencePiece 标记的原始空格，所以解码时可以精确还原。

    面试中常被追问的点： 为什么不能只用单词级 tokenizer？因为词汇无限增长且仍有 OOV；字符级则序列太长效率低。子词是两者的折中，也是目前大模型标配。


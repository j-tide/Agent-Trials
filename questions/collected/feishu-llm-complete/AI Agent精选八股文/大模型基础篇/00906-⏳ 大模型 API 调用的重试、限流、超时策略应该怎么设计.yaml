content:
  prompt: "⏳ 大模型 API 调用的重试、限流、超时策略应该怎么设计？"
answer:
  mode: rubric
  reference_answer: "调用远程大模型 API 本质上是不可靠的网络请求，必须设计健壮的客户端策略，避免连锁故障。\n\n策略全景：\n\n[图片内容未导入]\n\n-
    超时设计（Timeout）\n\n分层设置超时，防止资源悬挂：\n\nimport httpx\ntimeout = httpx.Timeout(\n    connect=10.0,
    \  # 建立 TCP 连接最长等 10 秒\n    read=90.0,      # 收到第一个字节后，等待完整响应最长 90 秒\n    write=10.0,
    \    # 发送请求体的超时\n    pool=10.0\n)\n\n- 短 connect 超时保证快速失效，切换备用 IP 或区域。\n\n- read
    超时需要根据任务预期时长设置：生成 token 越多，所需时间越长。可以用 max_tokens / 预期 TPS 估算，再加缓冲。\n\n- 重试策略（Retry）\n幂等性第一原则：
    使用唯一请求 ID（如 x-request-id 头），服务端保证重复请求不会执行多次（在支持幂等的 API 中）。\n\nimport tenacity\nfrom
    tenacity import retry, stop_after_attempt, wait_exponential, retry_if_exception_type\n\n@retry(\n
    \   retry=retry_if_exception_type((httpx.ReadTimeout, httpx.ConnectError, httpx.RemoteProtocolError)),\n
    \   wait=wait_exponential(multiplier=1, min=4, max=60),  # 指数退避 4s, 8s, 16s, ...\n
    \   stop=stop_after_attempt(3),\n    before_sleep=lambda retry_state: log.warning(f\"重试
    {retry_state.attempt_number} 次，原因：{retry_state.outcome.exception()}\")\n)\ndef
    call_llm_api_with_retry(prompt, **kwargs):\n    response = client.chat.completions.create(\n
    \       model=\"deepseek-chat\",\n        messages=[{\"role\":\"user\",\"content\":
    prompt}],\n        timeout=timeout,\n        headers={\"x-request-id\": generate_uuid()},\n
    \       **kwargs\n    )\n    return response\n\n可重试的判断： 网络超时、连接重置、限流 429、服务器 500/503；不可重试：认证失败
    401、请求体错误 400（除非可修正）。\n\n- 限流与流量整形（Rate Limiting）\n\n避免打爆 API 配额，保护自身不被 ban，同时实现流量平滑。\n\nimport
    asyncio\nimport time\nfrom collections import deque\n\nclass TokenBucketRateLimiter:\n
    \   def __init__(self, rate, burst):\n        self.rate = rate          # 每秒允许请求数\n
    \       self.burst = burst        # 桶容量\n        self.tokens = burst\n        self.last_check
    = time.monotonic()\n        self.queue = asyncio.Queue()\n    \n    async def
    acquire(self):\n        while True:\n            now = time.monotonic()\n            elapsed
    = now - self.last_check\n            self.tokens = min(self.burst, self.tokens
    + elapsed * self.rate)\n            self.last_check = now\n            if self.tokens
    >= 1:\n                self.tokens -= 1\n                return\n            #
    需要等待的时间\n            wait_time = (1 - self.tokens) / self.rate\n            await
    asyncio.sleep(wait_time)\n\nlimiter = TokenBucketRateLimiter(rate=10, burst=20)
    \ # 10 QPS，突发 20\n\nasync def rate_limited_call(prompt):\n    await limiter.acquire()\n
    \   return await async_call_api(prompt)\n\n429 响应处理： 即使有客户端限流，仍可能触发服务端限流。务必解析
    Retry-After 头并等待：\n\ndef handle_rate_limit(response):\n    if response.status_code
    == 429:\n        retry_after = int(response.headers.get(\"Retry-After\", 5))\n
    \       time.sleep(retry_after)\n        return True  # 触发重试\n    return False\n\n-
    熔断器（Circuit Breaker）\n\n当错误率超过阈值时，短时间内直接 fail-fast，避免持续请求雪崩。\n\nfrom circuitbreaker
    import circuit\n\n@circuit(failure_threshold=5, recovery_timeout=30)\ndef api_call_with_breaker(prompt):\n
    \   response = client.chat.completions.create(...)\n    if response.status_code
    >= 500:\n        raise Exception(\"服务端错误\")\n    return response\n\n工程化整合：\n\ndef
    robust_api_call(prompt, max_retries=3):\n    for attempt in range(max_retries):\n
    \       try:\n            # 限流桶获取许可\n            limiter.acquire()\n            resp
    = client.chat.completions.create(\n                model=\"deepseek-chat\",\n
    \               messages=[{\"role\":\"user\",\"content\":prompt}],\n                timeout=httpx.Timeout(connect=10.0,
    read=90.0),\n                headers={\"x-request-id\": req_id}\n            )\n
    \           return resp\n        except httpx.HTTPStatusError as e:\n            if
    e.response.status_code == 429:\n                retry_after = int(e.response.headers.get(\"Retry-After\",
    2 ** attempt))\n                time.sleep(retry_after)\n            elif 500
    <= e.response.status_code < 600:\n                time.sleep(2 ** attempt)  #
    指数退避\n            else:\n                raise  # 客户端错误不重试\n        except (httpx.TimeoutException,
    httpx.ConnectError):\n            time.sleep(min(2 ** attempt, 30))\n    raise
    Exception(\"API调用失败，已达最大重试次数\")\n\n终极建议：\n\n- 所有 API 调用必须配备请求级日志，记录延迟、状态码、重试次数，作为监控和成本分析的基础。\n\n-
    在负载均衡层配置主动健康检查，自动屏蔽不健康的 API 端点。\n\n- 设计降级策略：当大模型不可用时，能 fallback 到缓存答案、小模型或预设回复。"

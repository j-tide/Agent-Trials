content:
  prompt: "\U0001F537 Encoder‑Only、Decoder‑Only、Encoder‑Decoder 三种架构分别适合什么任务？为什么现在主流
    LLM 都选 Decoder‑Only？"
answer:
  mode: rubric
  reference_answer: "三种架构的差异来自于注意力掩码和模块组合的不同。\n\n[图片内容未导入]\n\nEncoder-Only（BERT 系列）\n\n-
    注意力方式： 双向，每个 token 可以看到它前面和后面的所有 token。\n\n- 训练任务： 掩码语言模型（MLM），随机遮住一些词让模型根据上下文预测。这使得模型能充分捕捉上下文依赖。\n\n-
    适合任务：\n\n- 不适合： 自回归文本生成。因为是双向注意力，没办法像人写文章那样从左到右依次生成。\n\n\U0001F539 Decoder-Only（GPT
    系列）\n\n- 注意力方式： 单向（因果），每个 token 只能看到自己及之前的 token，未来的 token 被 mask 掉。\n\n- 训练任务：
    下一个 token 预测（自回归语言模型）。给定上文，预测下一个词。\n\n- 适合任务：\n\n- 核心优势：\n\n\U0001F539 Encoder-Decoder（T5、BART
    系列）\n\n- 编码器： 双向注意力，充分理解输入序列。\n\n- 解码器： 单向注意力，同时通过交叉注意力层访问编码器的输出，逐步生成输出序列。\n\n-
    适合任务：\n\n- 局限性：\n\n---\n\n\U0001F539 为什么现在主流 LLM 都选 Decoder-Only？\n\n- 任务统一性\n无论是分类、问答、编程、翻译，全都可以转化为“文本→文本”任务，一个
    Decoder-Only 模型用指令微调就能通吃。这种“万物皆可生成”的范式极大简化了训练和产品化流程。\n\n- 训练和推理效率\n自回归的 Decoder-Only
    在训练时用因果掩码一次前向就能并行计算所有位置的 loss，而推理时 KV Cache 可以高效复用。Encoder-Decoder 需要分别处理编码器和解码器的状态，显存和计算都更浪费。\n\n-
    规模化经验（Scaling Law）\n过去几年的实验表明，在同等算力下，Decoder-Only 架构的扩展表现最稳定，能力随规模平滑提升。业界已经把所有工程优化（Flash
    Attention、张量并行、序列并行）都聚焦在这个架构上，形成了极强的生态护城河。\n\n- 历史路径依赖与生态\nGPT 系列的成功吸引了最优秀的工程资源，从
    GPU 算子到推理框架（vLLM、TensorRT-LLM）都对 Decoder-Only 做了极致优化。今天即使有一个理论上更优的架构，也很难在生态上与之抗衡。\n\n简单总结：\n\n-
    Encoder-Only：最懂文本，适合需要深入理解的判别任务。\n\n- Encoder-Decoder：适合输入输出有明显结构差异的任务，如翻译。\n\n-
    Decoder-Only：最会“说话”，以一套统一的方法覆盖几乎所有 NLP 任务，并且训练推理效率最高，因此成为当代大模型的不二之选。\n\n如果把自然语言处理比作餐厅：Encoder-Only
    是顶级的食材品鉴师，Decoder-Only 是能说会道、什么菜都能做的全能大厨，而 Encoder-Decoder 则是专精于某种菜系的翻译官。当前的市场选择是——大家需要一个能直接端出成品菜的大厨，而不是一个只会分析食材的专家。"

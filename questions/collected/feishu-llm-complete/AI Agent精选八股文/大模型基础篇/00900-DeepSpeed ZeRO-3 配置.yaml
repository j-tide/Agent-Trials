answer:
  mode: rubric
  reference_answer: |-
    配置文件示例 (ds_config.json)：

    ```json
    {
      "train_batch_size": 16,
      "gradient_accumulation_steps": 4,
      "fp16": {
        "enabled": true
      },
      "zero_optimization": {
        "stage": 3,
        "offload_optimizer": {
          "device": "cpu",
          "pin_memory": true
        },
        "offload_param": {
          "device": "cpu",
          "pin_memory": true
        },
        "overlap_comm": true,
        "contiguous_gradients": true,
        "sub_group_size": 1e9,
        "reduce_bucket_size": 5e8,
        "stage3_prefetch_bucket_size": 5e8,
        "stage3_param_persistence_threshold": 1e6,
        "stage3_max_live_parameters": 1e9,
        "stage3_max_reuse_distance": 1e9,
        "stage3_gather_16bit_weights_on_model_save": true
      },
      "gradient_clipping": 1.0,
      "steps_per_print": 10
    }
    ```

    参数说明：

    - stage: 3：ZeRO-3 将优化器状态、梯度和参数都分片。

    - offload_optimizer/param：卸载到 CPU，适合显存不足时训练大模型。

    - reduce_bucket_size 等：控制通信粒度。
    启动命令：deepspeed --num_gpus=8 train.py --deepspeed ds_config.json


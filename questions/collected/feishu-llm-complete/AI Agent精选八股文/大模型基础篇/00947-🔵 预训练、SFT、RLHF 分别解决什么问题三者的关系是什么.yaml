content:
  prompt: "\U0001F535 预训练、SFT、RLHF 分别解决什么问题？三者的关系是什么？"
answer:
  mode: rubric
  reference_answer: "这三个阶段其实是在“逐级对齐”——从让模型拥有能力，到让它听懂指令，再到让它符合人类偏好。\n\n▪ 预训练\n\n解决的是“知识储备和语言能力”问题。在超大规模、无标注的语料上做自回归训练，让模型学会词汇、语法、世界知识、常识、推理模式等。这个阶段的核心是：给你一段上文，你能不能预测出合理的下文？
    预训练完成之后，模型什么都会一点，但它不知道“该如何回答问题”，只会顺着文本往下接。\n\n▪ SFT（有监督微调）\n\n解决“指令遵循与格式对齐”的问题。用人工构造的（指令→理想回答）样本对模型做微调，告诉模型：面对这类提问时，应该用这种结构和语气回答。SFT
    让模型从“接着写”变成“按指令办事”。这时候它已经很有用了，但依然可能生成有害、偏见或不符合人类偏好的内容。\n\n▪ RLHF（基于人类反馈的强化学习）\n\n解决“价值观与偏好对齐”的问题。SFT
    后的模型能回答问题，但无法保证回答的“有用性”“无害性”和“符合人类偏好”。RLHF 会训练一个奖励模型来拟合人类的偏好排序，再用强化学习（如 PPO）来精细调节模型，让它在“高分方向”走，同时不跑偏太远。\n\n\U0001F517
    三者的关系\n可以这样理解：预训练是“读万卷书”，SFT 是“学规矩”，RLHF 是“辨好坏”。\n流程上是一个递进的流水线：\n预训练 → SFT → RLHF\n每一步都在前一步的基础上，对模型进行更精细的“对齐”。没有预训练，SFT
    和 RLHF 无从谈起；没有 SFT 的指令驯化，RLHF 的优化会非常低效；而 RLHF 则是在 SFT 基础上实现高阶的安全与偏好对齐。\n\n这三者更像是
    “知识 → 行为 → 价值观” 的递进过程，每一步都在解决前一步留下的问题。\n\n---"

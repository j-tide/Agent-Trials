    从原始日志清洗为 ShareGPT 格式：

    ```python
    import json
    def clean_conversation(raw_log, min_turns=2, max_len=2048):
        turns = []
        for msg in raw_log:
            if not msg['text'] or len(msg['text']) < 2:
                continue
            # 去广告、无意义内容
            if 'click here' in msg['text'].lower():
                break
            turns.append({"from": msg['role'], "value": msg['text']})
        if len(turns) < min_turns * 2:
            return None
        # 检查总长度
        total_len = sum(len(t['value']) for t in turns)
        if total_len > max_len:
            # 从后往前裁剪到 max_len
            ...
        return {"conversations": turns}

    # 批量处理
    cleaned = []
    for session in raw_sessions:
        conv = clean_conversation(session)
        if conv:
            cleaned.append(conv)
    with open("sharegpt.json", "w") as f:
        json.dump(cleaned, f, indent=2)
    ```

    关键：过滤广告、截断过长、保证最小轮次。


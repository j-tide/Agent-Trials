answer:
  mode: rubric
  reference_answer: |-
    步骤：

    - 初始化词汇表为所有字符。

    - 统计所有相邻符号对的出现频次。

    - 合并频率最高的符号对，加入词汇表。

    - 重复直到词汇表大小达标。
    核心代码：

    ```python
    import re, collections

    def get_vocab(text):
        # 将文本切分为单词和空格序列，每个单词末尾加</w>
        words = re.findall(r'\w+|\S', text)
        vocab = collections.Counter()
        for word in words:
            vocab[' '.join(list(word)) + ' </w>'] += 1
        return vocab

    def learn_bpe(vocab, num_merges):
        merges = {}
        for i in range(num_merges):
            pairs = collections.defaultdict(int)
            for word, freq in vocab.items():
                symbols = word.split()
                for j in range(len(symbols)-1):
                    pairs[symbols[j], symbols[j+1]] += freq
            if not pairs:
                break
            best_pair = max(pairs, key=pairs.get)
            merges[best_pair] = i
            # 合并所有出现该对的地方
            new_vocab = {}
            bigram = re.escape(' '.join(best_pair))
            p = re.compile(r'(?<!\S)' + bigram + r'(?!\S)')
            for word in vocab:
                w_out = p.sub(''.join(best_pair), word)
                new_vocab[w_out] = vocab[word]
            vocab = new_vocab
        return merges, vocab

    def encode(text, merges):
        # 从字符开始，按学习到的合并顺序依次合并
        symbols = list(text) + ['</w>']
        # 需要将merges按顺序排序，然后循环应用直到无法合并
        sorted_merges = sorted(merges.items(), key=lambda x: x[1])  # 按合并次序
        # 简化版：反复扫描合并
        while True:
            i = 0
            merged = False
            while i < len(symbols)-1:
                if (symbols[i], symbols[i+1]) in merges:
                    symbols = symbols[:i] + [symbols[i]+symbols[i+1]] + symbols[i+2:]
                    merged = True
                else:
                    i += 1
            if not merged:
                break
        return symbols
    ```

    关键点：处理标点与单词边界（</w>），编码时按学习到的合并顺序进行贪心合并。


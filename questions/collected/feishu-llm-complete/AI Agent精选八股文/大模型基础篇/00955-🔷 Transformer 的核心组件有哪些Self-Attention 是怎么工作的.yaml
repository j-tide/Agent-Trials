content:
  prompt: "\U0001F537 Transformer 的核心组件有哪些？Self-Attention 是怎么工作的？"
answer:
  mode: rubric
  reference_answer: "答：\n\nTransformer 的设计其实非常有层次感，它的核心组件可以拆成几个“功能块”，我顺着数据流的方向来说：\n\n①
    输入表示层\n\n- 词嵌入：把离散的 token 映射成稠密向量。\n\n- 位置编码：因为后面会讲到，注意力本身不感知顺序，必须把位置信息融进去。这部分我们下一个问题展开。\n\n②
    编码器层（Encoder Layer），每层包含：\n\n- 多头自注意力\n\n- 残差连接 + 层归一化\n\n- 前馈神经网络\n\n③ 解码器层（Decoder
    Layer），在编码器基础上多了一个：\n\n- 掩码多头自注意力（保证只看上文）\n\n- 交叉注意力（连接编码器输出，仅在 Encoder-Decoder
    架构中）\n\n- 同样有残差和层归一化、前馈网络。\n\n④ 输出层\n\n- 最后的线性变换 + Softmax，把向量映射回词表概率分布。\n\n这些模块像乐高一样可堆叠，整个模型就是
    NN 个这样的层重复。\n\n[图片内容未导入]\n\n---\n\n接下来重点说 Self-Attention 的工作原理，这是 Transformer
    能并行捕捉全局依赖的核心。\n\n想象一句话：“我昨天在咖啡店买了一杯拿铁。”\n\nSelf-Attention 会让“拿铁”去跟句子里的每个词（包括它自己）“交互”一次，目的是搞清楚：“哪些词对我来说很重要？我需要从它们那里拿多少信息？”\n\n具体计算分四步：\n\nStep
    1：生成 Q / K / V\n对于每个词，我们学三个线性变换矩阵 WQ,WK,WVWQ,WK,WV，把它的向量分别投影成：\n\n- Query：我的“需求清单”，我要找什么。\n\n-
    Key：我的“标签清单”，我身上有什么特征。\n\n- Value：我实际携带的信息。\n\nStep 2：计算注意力分数\n\n用当前词的 Query 去跟所有词的
    Key 做点积，得到一个相关性分数。比如“拿铁”的 Q 跟“买”的 K 做点积，分数高说明“买”对理解“拿铁”很重要。\n\nStep 3：缩放 + Softmax\n除以
    dkdk 避免分数过大导致梯度消失，然后过一个 Softmax，把分数转化为 0~1 的权重。这时候，所有词对“拿铁”的权重之和为 1。\n\nStep 4：加权求和
    Value\n\n用这些权重去乘每个词的 Value，再求和，就得到了“拿铁”融入了全局信息的新表示。\n\n所以 Self-Attention 一句话总结就是：每个词通过“自己提问、他人匹配、加权索取信息”的方式，动态地获得整句话的上下文表示。\n\n另外，多头机制等于同时做多次这样的过程，每个头关注不同的关系侧面（比如一个头关注语法结构，一个头关注语义关联），最后拼起来再投影，从而捕捉更丰富的特征。再加上残差连接，让梯度直通，层归一化稳定训练，整个结构就非常
    robust。\n\n\U0001F30C 这个设计彻底打破了序列依赖，让任意两词的距离变成常数 1，所以长程依赖不再是瓶颈。\n\n---"

content:
  prompt: "\U0001F537 什么是 MoE（Mixture of Experts）架构？DeepSeek‑V3 / Mixtral 是怎么用 MoE
    的？"
answer:
  mode: rubric
  reference_answer: |-
    答：

    MoE 可以这样理解：把一个巨大的模型拆成很多个“专家”，每个输入只激活其中一小部分，而不是全模型运算。

    传统稠密模型里，每个 token 都要经过所有参数。MoE 不同，它在网络里加了一个“门控路由器”：

    ▸ 门控网络看一眼当前 token 的表示，然后从专家池里选出最相关的两个（通常是 top‑2）。

    ▸ 每个专家其实就是一个独立的前馈子网络，各有各的擅长区域。

    ▸ 把被选中专家的输出加权合并，再继续传给下一层。

    ▸ 大部分专家本轮“休息”，只有被选中的参与计算。

    这就带来了“总参数可以极大，但每个 token 的激活参数量可控”的核心优势——用更少的算力撬动更强的能力。

    DeepSeek‑V3 的做法：

    ▸ 采用了细粒度专家切分，专家数量多但个头小，路由可以更灵活地组合。

    ▸ 除了可选的路由专家，还设置了少量“共享专家”，无论门控选哪几个，共享专家的知识都会被融合进来，用来负责通用基础技能，降低路由压力。

    ▸ 同时用多头潜注意力压缩了 KV Cache，让推理时上下文可以极长，但显存开销不大。

    ▸ 总体用不到 40B 的激活参数，性能就几乎可以和当时 70B 以上的稠密模型对拼，成本优势极为明显。

    Mixtral 8x22B 的做法：

    ▸ 结构更规整：一共 8 个专家，每次选 top‑2，流程直观。

    ▸ 每个 token 看两个专家，输出的加权平均作为本层结果。

    ▸ 总参数 141B，但激活参数只有 39B，推理速度接近 40B 的稠密模型，效果却远超同级稠密，在效率和性能间取了一个干净利落的平衡点。

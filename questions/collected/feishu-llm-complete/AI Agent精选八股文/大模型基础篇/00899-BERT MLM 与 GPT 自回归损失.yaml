  reference_answer: |-
    MLM 损失：

    ```python
    def mlm_loss(logits, labels, mask):
        # logits: (batch, seq, vocab), labels: (batch, seq) with -100 for ignored
        loss_fct = nn.CrossEntropyLoss(ignore_index=-100)
        return loss_fct(logits.view(-1, vocab_size), labels.view(-1))
    ```

    GPT 自回归损失：

    ```python
    def lm_loss(logits, labels):
        # logits: (batch, seq, vocab), labels: (batch, seq) 目标为下一个token
        shift_logits = logits[..., :-1, :].contiguous()
        shift_labels = labels[..., 1:].contiguous()
        return F.cross_entropy(shift_logits.view(-1, vocab_size), shift_labels.view(-1))
    ```

    差异：MLM 预测被 mask 的 token，双向注意力；GPT 单向预测下一个 token。


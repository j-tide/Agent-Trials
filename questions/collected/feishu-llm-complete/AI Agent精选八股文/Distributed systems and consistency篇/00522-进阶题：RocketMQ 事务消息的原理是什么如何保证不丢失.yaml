answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（半消息机制、事务状态回查、本地事务回滚、消息可靠性保证）

    1️⃣ Common Answer

    事务消息就是先发个半消息，然后执行本地事务，成功了就提交，失败了就回滚。RocketMQ 会定期回查事务状态。

    2️⃣ Impressive Answer

    RocketMQ 事务消息的核心是"两阶段提交 + 事务状态回查"，我从流程、可靠性、边界情况三个角度分析：

    - 两阶段提交流程`阶段一：发送半消息 → MQ 持久化但消费者不可见阶段二：执行本地事务 → 根据结果提交/回滚半消息异常情况：MQ 定时回查事务状态（被动变主动）`

    - 不丢失的三重保证


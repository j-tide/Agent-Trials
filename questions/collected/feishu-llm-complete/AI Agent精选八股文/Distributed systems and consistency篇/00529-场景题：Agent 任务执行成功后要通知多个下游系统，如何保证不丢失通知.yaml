  prompt: 3、场景题：Agent 任务执行成功后要通知多个下游系统，如何保证不丢失通知？
answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐⭐（消息队列可靠性投递、本地消息表、事务消息、最大努力通知）

    1️⃣ Common Answer

    用消息队列发通知就行了，失败了就重试，或者加个死信队列存失败的消息。

    2️⃣ Impressive Answer

    多下游通知的核心是"可靠投递 + 幂等消费"，我设计三层保障：

    - 第一层：事务消息保证必发

    - 第二层：消息可靠性投递

    - 第三层：下游幂等处理

    Agent 场景扩展：多 Agent 协作中，子任务完成通知主任务、工具调用结果回调等场景都适用这套方案


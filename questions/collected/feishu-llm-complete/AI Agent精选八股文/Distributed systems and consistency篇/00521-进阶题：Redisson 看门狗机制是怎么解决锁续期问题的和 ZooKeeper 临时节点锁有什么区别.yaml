answer:
  mode: rubric
  reference_answer: |-
    难度级别：⭐⭐⭐（看门狗线程、锁续期策略、临时节点特性、性能对比、可靠性保证）

    1️⃣ Common Answer

    Redisson 的看门狗就是开个线程定时检查锁，如果快过期了就续期。ZooKeeper 的临时节点是客户端断开连接就自动删除锁，两种都能保证锁释放。

    2️⃣ Impressive Answer

    我从续期机制、可靠性保证、性能三个维度对比：


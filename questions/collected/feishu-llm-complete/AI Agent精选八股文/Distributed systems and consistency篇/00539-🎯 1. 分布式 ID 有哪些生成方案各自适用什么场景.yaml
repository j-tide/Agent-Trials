  reference_answer: |-
    分布式 ID 没有银弹，选型要看对 唯一性、趋势递增、高性能、高可用 这四点的权衡。我把主流方案分成了四类，每一类都有自己的“舒适区”。

    [嵌入表格未展开]

    选型思路：

    如果对有序性要求不高，UUID 是最简单的；若要高性能且 趋势递增，雪花算法是头号种子；若想彻底避免时钟问题又不差那一点延迟，号段模式（Leaf）更省心。


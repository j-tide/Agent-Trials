    难度级别：⭐⭐⭐（任务唯一性、分布式锁、幂等表设计、重试策略、补偿机制）

    1️⃣ Common Answer

    用分布式锁保证任务不重复，失败了就重试几次。幂等就是任务执行多次结果一样，可以加个状态字段。


    3、场景题：Agent 系统的 CI/CD Pipeline 和普通后端服务有什么不同？你是如何设计的？ ⭐⭐⭐

    考察要点：Prompt 版本管理、LLM Mock 测试策略、Golden Dataset 维护与评估自动化

    1️⃣ Common Answer

    Agent 系统的 CI/CD 和普通后端类似，主要包括代码检查、自动化测试、构建镜像和部署几个阶段。不同的是 Agent 有 Prompt 这个"特殊配置"，每次修改 Prompt 也需要走测试流程。可以写测试用例模拟用户输入，然后用 Assert 判断输出是否符合预期，部署时用蓝绿或灰度发布策略。

    2️⃣ Impressive Answer

    Agent 的 CI/CD 比普通后端复杂得多，核心难点有两个：LLM 输出的不确定性让传统断言测试失效，以及 Prompt 本身就是"代码"，变更需要严格管控。

    - Prompt 版本管理 Prompt 要和代码一样纳入 Git 管理，不能随意在线修改。用独立的 YAML/TOML 配置文件存 Prompt 模板，每次修改要提 PR，PR 描述里写清楚"修改了什么、预期改善哪个指标、测试结果如何"，走和代码变更一样的评审流程。

    - LLM 调用的分层 Mock 策略 CI 环境直接调 LLM 有三个问题：成本高、速度慢、结果不稳定。所以用三层测试策略：单元测试完全 Mock LLM 响应，测试控制流/工具调用/异常处理逻辑，每次提交都跑；集成测试用 VCR 录制回放模式，模拟真实 API 交互；端到端评估才真实调 LLM，跑 Golden Dataset，只在合并主分支前跑，控制成本。

    - Golden Dataset 的维护与评估卡点 Golden Dataset 是 Agent CI/CD 的核心资产，维护策略：新 Bug 修复后对应 case 必须加进去防止回归，定期（每月）人工评审清理过时 case，case 分层管理——P0 核心 case 必须 100% 通过，P1 扩展 case 允许一定容忍。CI Pipeline 里设置评估卡点：综合分低于历史基线 2% 则自动失败阻止合并，评估结果生成可视化报告，让 PR 审核者一眼看清变更影响范围。


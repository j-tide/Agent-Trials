    ### 9.3 成本控制与安全防护

    1、基础题：LLM API Key 应该如何存储和保护？ ⭐⭐

    考察要点：Key 不硬编码、环境变量、Secrets Manager、gitignore

    API Key 绝对不能硬编码在代码里。基础做法是放到 .env 文件，通过 os.getenv() 读取，并在 .gitignore 里排除 .env，防止误提交。生产环境更规范的做法是用 AWS Secrets Manager 或 HashiCorp Vault 这类专业工具，应用启动时从远端拉取 Key，不落本地磁盘，同时有访问审计日志。另外，不同环境、不同服务应创建独立的 Key，避免单点泄漏影响全局。如果发现 Key 泄漏，立刻到平台吊销，切换备用 Key 恢复服务，再排查泄漏原因。

    ---

    2、进阶题：Agent 服务 LLM API 成本很高，如何设计大小模型路由策略来优化成本？ ⭐⭐⭐

    考察要点：意图分类路由、大小模型选择、路由器自身成本、误判降级机制

    1️⃣ Common Answer

    为了节省成本，可以根据任务复杂程度选不同模型。简单问题用便宜的小模型（如 GPT-4o-mini），复杂问题用贵的大模型（如 GPT-4o）。实现上先判断一下用户问题是简单还是复杂，然后根据结果决定调哪个模型。

    2️⃣ Impressive Answer

    大小模型路由是我实际做过的成本优化手段，实践下来能省 40%-60% 的 API 成本，但有几个关键权衡点。

    - 路由核心逻辑：意图分类 路由器本质是意图分类器，分类维度通常有三个：任务复杂度（事实查询 vs 多步推理）、风险等级（普通问答 vs 关键业务操作）、上下文长度（长上下文 Token 消耗高，是否在路由层截断）。

    - 路由器的实现选择 这里有个容易被忽视的问题——路由器本身也有成本。三种方案：规则路由（关键词/请求长度/任务标签，成本最低但覆盖不全）、小模型分类（BERT 类本地推理或 GPT-4o-mini 打分，有额外延迟）、Embedding 相似度（任务类型固定的场景适用）。实践中用"规则路由 + 小模型兜底"的组合——先用规则过滤明显的简单/复杂请求，模糊情况再用小模型分类，额外成本控制在 1% 以内。

    - 误判风险与降级机制 最大风险是把复杂任务路由到小模型导致质量下降。解决方案是：小模型返回结果后，用轻量级校验器检查输出是否达到质量下限，不达标则自动升级到大模型重试。降级率要在监控里单独统计，降级率过高说明路由策略本身需要调整。


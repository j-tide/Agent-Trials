content:
  prompt: "\U0001F3D7️ 3. 如何用 FastAPI 对 Agent 进行生产级封装和部署？需要关注哪些关键设计点？"
answer:
  mode: rubric
  reference_answer: |-
    Agent 的生产级部署不是“一个 app.run()”就完事的。它必须像一个成熟的后端服务一样，处理好并发、超时、状态、流式、降级、观测这六大问题。

    关键设计总览：

    ┌─────────────────────────────────────────────────┐
    │              生产级 FastAPI Agent 服务           │
    ├─────────────────────────────────────────────────┤
    │ 1. 依赖注入与生命周期管理 (单例 Agent、会话)      │
    │ 2. 流式输出 (SSE) 与长任务处理 (后台任务 + 轮询)  │
    │ 3. 超时与取消 (无界等待是敌人)                    │
    │ 4. 并发控制与限流 (保护 LLM API 额度)            │
    │ 5. 优雅关闭 (保存状态、等待任务)                  │
    │ 6. 可观测性 (日志、指标、追踪三件套)              │
    └─────────────────────────────────────────────────┘

    设计点一：Agent 实例与资源管理

    Agent 的初始化可能很重（加载模型、建立连接）。不要每次请求都创建一个新 Agent。用 FastAPI 的依赖注入，将 Agent 实例作为单例管理，并在应用生命周期里做初始化和清理。

    from fastapi import FastAPI, Depends
    from contextlib import asynccontextmanager

    # 定义一个应用级单例
    class AgentManager:
        def __init__(self):
            self.agent = None
        async def init(self):
            # 耗时初始化：加载模型、连接数据库等
            self.agent = MyAgent()
        async def shutdown(self):
            # 清理资源
            await self.agent.close()

    manager = AgentManager()

    @asynccontextmanager
    async def lifespan(app: FastAPI):
        await manager.init()
        yield
        await manager.shutdown()

    app = FastAPI(lifespan=lifespan)

    def get_agent():
        return manager.agent

    @app.post("/chat")
    async def chat(agent = Depends(get_agent)):
        return await agent.run(...)

    设计点二：流式输出（SSE）
    AI 的生成动辄十几秒，如果让用户干等一个完整响应，体验极差。用 StreamingResponse 逐 token 推送。

    from fastapi.responses import StreamingResponse

    @app.post("/chat/stream")
    async def chat_stream(req: ChatRequest, agent = Depends(get_agent)):
        async def event_generator():
            async for token in agent.run_stream(req.prompt):
                yield f"data: {token}\n\n"
            yield "data: [DONE]\n\n"
        return StreamingResponse(event_generator(), media_type="text/event-stream")

    设计点三：长任务异步化

    如果 Agent 任务需要几分钟，不能一直占用 HTTP 连接。应该设计成“提交任务 → 返回 task_id → 后台执行 → 轮询或 Webhook 通知结果”。

    from fastapi import BackgroundTasks
    import uuid, asyncio

    tasks = {}

    @app.post("/task")
    async def create_task(req: TaskRequest, background_tasks: BackgroundTasks):
        task_id = str(uuid.uuid4())
        tasks[task_id] = {"status": "pending", "result": None}
        background_tasks.add_task(execute_task, task_id, req.prompt)
        return {"task_id": task_id}

    async def execute_task(task_id, prompt):
        try:
            result = await agent.run(prompt)  # 长时间运行的 Agent
            tasks[task_id] = {"status": "completed", "result": result}
        except Exception as e:
            tasks[task_id] = {"status": "failed", "error": str(e)}

    @app.get("/task/{task_id}")
    async def get_task(task_id: str):
        return tasks.get(task_id, {"status": "not_found"})

    设计点四：超时控制

    不要让一个请求无限等待。在 FastAPI 层面设置请求超时，在 Agent 内部也设置工具调用、LLM 调用的超时。

    import asyncio

    @app.post("/chat")
    async def chat(req: ChatRequest, agent = Depends(get_agent)):
        try:
            result = await asyncio.wait_for(agent.run(req.prompt), timeout=60.0)
            return {"answer": result}
        except asyncio.TimeoutError:
            return {"error": "请求处理超时，请稍后重试"}, 504

    设计点五：并发限流
    保护你珍贵的 LLM API 额度，也保护 Agent 本身不被突发流量冲垮。用 slowapi 做接口级限流。

    from slowapi import Limiter
    from slowapi.util import get_remote_address

    limiter = Limiter(key_func=get_remote_address)
    app.state.limiter = limiter

    @app.post("/chat")
    @limiter.limit("5/minute")
    async def chat(...):
        ...

    设计点六：优雅关闭
    服务下线时，必须等待正在执行的任务安全完成或保存状态。在 lifespan 的 shutdown 阶段，设置一个等待窗口。

    @asynccontextmanager
    async def lifespan(app: FastAPI):
        await manager.init()
        yield
        # 关闭阶段
        await manager.shutdown()
        # 给正在执行的任务一个完成时间
        await asyncio.sleep(5)

    设计点七：可观测性

    接入 OpenTelemetry 做调用链追踪，Prometheus 暴露指标，ELK 收集日志。至少要在 Agent 的每次 LLM 调用、工具调用处埋点，记录耗时、Token 用量、成功/失败状态。

    from opentelemetry import trace
    tracer = trace.get_tracer(__name__)

    async def traced_llm_call(model, messages):
        with tracer.start_as_current_span("llm_call") as span:
            span.set_attribute("model", model)
            start = time.time()
            response = await client.chat.completions.create(...)
            span.set_attribute("duration_ms", (time.time()-start)*1000)
            return response

    收束：

    把 Agent 部署到生产环境，不是简单地换一个高性能服务器。你需要像对待一个传统的后端微服务那样，为它加上依赖注入、连接池、超时控制、限流、健康检查、优雅关闭和可观测性。FastAPI 提供了优雅的异步能力，而 Gunicorn + Uvicorn 提供了稳健的运行基石。把这两者结合好，你的 AI Agent 才能真正地走出笔记本，扛住真实世界的流量考验。

    ---

    场景题：如何为 Agent 服务建立完善的可观测性体系？日志、指标、追踪三个方面分别怎么做？ ⭐⭐⭐

    考察要点：结构化日志（JSON + Trace ID）、Prometheus 指标（延迟/错误率/Token 消耗）、OpenTelemetry 分布式追踪、LangSmith 集成

    1️⃣ Common Answer

    Agent 服务的可观测性主要包括三个方面：日志、指标和链路追踪。日志方面，把 Agent 每一步的输入输出都记录下来，方便排查问题。指标方面，用 Prometheus 监控接口的响应时间、错误率等基础指标。追踪方面，用 OpenTelemetry 来追踪跨服务的请求链路。有了这三个方面，就能对 Agent 服务的运行状态有比较全面的了解。

    2️⃣ Impressive Answer

    三个支柱各有侧重，缺一不可，我逐个说关键设计点。

    - 日志（Logging）：结构化 + Trace ID 贯穿

    - 指标（Metrics）：四类 Agent 专属指标

    - 追踪（Tracing）：OpenTelemetry + LangSmith 组合


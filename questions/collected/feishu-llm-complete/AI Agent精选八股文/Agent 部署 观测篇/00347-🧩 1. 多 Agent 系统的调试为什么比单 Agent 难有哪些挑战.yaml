content:
  prompt: "\U0001F9E9 1. 多 Agent 系统的调试为什么比单 Agent 难？有哪些挑战？"
answer:
  mode: rubric
  reference_answer: |-
    如果把单 Agent 比作一辆车，调试它就是检查发动机的运转。而多 Agent 系统则像一个十字路口的多车协同，问题往往不出在某一辆车本身，而出在它们之间的交规、信号和视野盲区。具体来说，挑战来自四个维度：

    [图片内容未导入]

    挑战一：失控的上下文传递与记忆污染

    在多 Agent 协作中，Agent A 的输出会成为 Agent B 的输入。如果 Agent A 在一个关键数字上出现了幻觉，Agent B 会基于这个错误信息继续推理，最终答案完全跑偏。在调试时，你要一层层回溯，去找到“哪一个 Agent 最先说错了一句话”。这种错误传播链比单 Agent 的幻觉更难定位。

    挑战二：不可复现的涌现行为

    多 Agent 通过对话驱动，一个微小的 Prompt 差异、一条消息的顺序改变，都可能导致整个群聊走向完全不同的方向。昨天还能完美运行的流程，今天可能因为 LLM 的一次随机采样而在某个路口拐错了弯。这种非确定性让“在本地复现线上问题”变得几乎不可能。

    挑战三：工具调用的权限与依赖交织

    Agent A 调用了工具 X 得到结果，Agent B 需要工具 Y，但工具 Y 的调用参数来自 Agent A 的结果。如果工具 X 超时，Agent A 可能返回了一个空结果，Agent B 拿着空参数去调工具 Y，导致一连串无意义的报错。调试时要同时看工具链的调用顺序、参数流转和超时设定，复杂度成倍上升。

    挑战四：并发与死锁

    在多 Agent 群聊里，一个 Agent 等待另一个 Agent 的回复，而对方又在等待它提供更多信息，形成逻辑死锁。或者，Supervisor 将任务分派给多个 Worker，Worker 之间产生竞争条件。这些并发问题在单 Agent 中根本不存在。

    工程上的应对思路：

    - 全链路 Trace：为每一次跨 Agent 的消息传递加上唯一的 Trace ID，让所有调用形成一个树状结构。

    - 快照与重放：将每一轮对话的状态序列化保存，出现问题时能像“黑匣子”一样回放。

    - 单元化 Agent：尽量让每个 Agent 的职责单一，输入输出可独立验证，减少依赖。


answer:
  mode: rubric
  reference_answer: |-
    这三种是当前主流Agent的决策范式，它们在“思考”和“行动”的平衡点上各有侧重。

    演进趋势：从灵活性到可靠性。ReAct是学术探索的起点，Plan-and-Execute是对其效率的优化，而OpenAI Functions Agent则是将这种能力工程化、产品化，追求极致的稳定和可控。


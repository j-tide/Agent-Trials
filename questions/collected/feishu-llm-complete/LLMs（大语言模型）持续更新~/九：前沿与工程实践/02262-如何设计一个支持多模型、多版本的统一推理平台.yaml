content:
  prompt: 如何设计一个支持多模型、多版本的统一推理平台？
answer:
  mode: rubric
  reference_answer: |-
    设计这样的平台，核心目标是将模型管理与推理服务解耦，实现灵活、高效的部署和迭代。

    整体架构：

    ```text
    客户端 SDK / API -> 统一网关 -> 模型路由与调度层 -> 推理引擎池 (vLLM/TGI) -> 模型仓库（存储）
    ```

    核心组件设计：

    - 模型注册中心：一个元数据数据库，存储所有已注册模型的信息，包括：

    - 统一推理网关：

    - 模型路由器与版本策略：

    - 推理引擎池与自动化运维：

    - 存储与模型分发：

    这种平台设计将开发、运维和业务需求完美分离，极大地提升了模型迭代速度和资源利用效率。


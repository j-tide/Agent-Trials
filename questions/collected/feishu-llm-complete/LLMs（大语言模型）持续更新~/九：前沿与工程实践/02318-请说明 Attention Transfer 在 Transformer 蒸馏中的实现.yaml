content:
  prompt: 请说明 Attention Transfer 在 Transformer 蒸馏中的实现。
answer:
  mode: rubric
  reference_answer: |-
    Attention Transfer是一种典型的特征蒸馏方法，其核心思想是让学生模型在每一层Transformer的自注意力机制中，不仅学习最终的输出，也学习教师模型注意力权重矩阵的分布。这个矩阵包含了token之间如何关联的丰富信息，是Transformer理解语言结构的关键。

    实现步骤：

    - 定义注意力矩阵：对于一个给定的输入，教师和学生模型的每个注意力头都会产生一个注意力权重矩阵 ATAT 和 ASAS，其形状为 [batch, heads, seq_len, seq_len]，每个元素表示第i个token对第j个token的关注程度。

    - 定义对齐损失：计算教师和学生对应层（或层组）的注意力矩阵之间的差异。常用的损失函数有：


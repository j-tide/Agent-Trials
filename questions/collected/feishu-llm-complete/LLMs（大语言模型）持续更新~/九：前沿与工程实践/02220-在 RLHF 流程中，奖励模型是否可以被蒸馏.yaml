content:
  prompt: 在 RLHF 流程中，奖励模型是否可以被蒸馏？
answer:
  mode: rubric
  reference_answer: |-
    可以，且在实际部署中非常有必要。 奖励模型本质上是一个对“人类偏好”进行打分的回归或分类模型。在PPO训练过程中，每一步生成都需要调用RM进行打分，计算开销巨大。蒸馏奖励模型可以在保证评分质量的同时大幅降低推理成本。

    蒸馏方式：

    - 直接蒸馏RM（白盒/黑盒）：

    - 隐式蒸馏到策略模型（DPO）：

    - 数据增强与自蒸馏：

    核心挑战：蒸馏RM时，必须确保学生RM的打分与教师RM高度一致（Spearman相关系数通常要求>0.9），以保证PPO训练的稳定性和最终策略质量。如果学生RM与教师RM分歧过大，可能导致PPO优化方向错误，模型质量反而下降。


  reference_answer: |-
    边缘设备（手机、嵌入式终端）的计算、内存和功耗都极其有限，部署LLM需要动用全方位的压缩与优化手段，形成一个“组合拳”。

    核心压缩与优化技术栈：

    - 极致量化（第一优先级）：

    - 模型蒸馏（源头缩减）：

    - 结构化剪枝（加速利器）：

    - 专用推理引擎与算子优化：

    - KV Cache压缩：

    - 混合精度与内存卸载：

    这些技术通常组合使用，形成一个从模型设计、训练到部署推理的完整优化闭环。


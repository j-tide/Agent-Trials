content:
  prompt: Mamba 为何能实现线性时间复杂度？请对比 Transformer 的复杂度。
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    Mamba能够实现 O(nd) 的线性复杂度，根本原因在于它采用了递归的序列处理方式：

    [图片内容未导入]

    - 在训练时，Mamba通过并行扫描算法实现并行化，避免了RNN的串行瓶颈，但复杂度仍然是 O(n)。这在底层是通过将递归计算转化为前缀和操作来实现的，可以在GPU上高效执行。

    对比Transformer：

    [图片内容未导入]

    - Mamba在推理时是真正的 O(1) 每token计算和内存（因为状态大小固定），能够高效处理超长序列。

    因此，Mamba从根本上避开了Transformer的二次方瓶颈，为极长序列（如百万token）的建模开辟了道路。


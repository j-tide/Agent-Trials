content:
  prompt: LlamaIndex 的核心设计目标是什么？与 LangChain 的主要区别在哪？
answer:
  mode: rubric
  reference_answer: |-
    LlamaIndex 的核心设计目标是成为LLM 和用户私有数据之间的“中央枢纽”。它的所有功能都围绕着一个核心问题：如何高效地将结构化或非结构化的外部数据接入 LLM，并让 LLM 能够对其进行理解、推理和问答。它是一个“以数据为中心”的框架。

    与 LangChain 的主要区别：

    互补关系：两者并非纯粹竞争，而是高度互补。在许多复杂 RAG 项目中，开发者常用 LlamaIndex 来构建数据检索管道，然后将构建好的 QueryEngine 作为一个 Tool，集成到 LangChain 的 Agent 中。这样，Agent 就获得了与私有数据进行复杂对话的能力。


  prompt: Mamba 的核心创新“选择性扫描”是如何工作的？
answer:
  mode: rubric
  reference_answer: |-
    Mamba 的核心创新是选择性状态空间模型，它打破了过去SSM（如S4）的一个根本限制：状态转移矩阵 A、输入矩阵 B 和步长 Δ 是与输入内容无关的固定参数。在S4中，这些参数是时不变的，意味着模型对每个输入token都以相同的方式处理，无法根据输入内容动态调整其行为。


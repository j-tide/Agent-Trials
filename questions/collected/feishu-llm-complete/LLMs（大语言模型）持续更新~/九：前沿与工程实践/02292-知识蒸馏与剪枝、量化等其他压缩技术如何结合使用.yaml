content:
  prompt: 知识蒸馏与剪枝、量化等其他压缩技术如何结合使用？
answer:
  mode: rubric
  reference_answer: |-
    知识蒸馏、剪枝和量化是模型压缩的三大支柱，它们从不同维度减少模型复杂度和资源消耗，并且相互正交，可以叠加使用以获取最大压缩效果。

    结合策略：

    - 蒸馏 + 剪枝：

    - 蒸馏 + 量化：

    - 三者结合：典型的端侧部署管线为：蒸馏训练一个小模型 → 结构化剪枝 → INT8/INT4量化。整个过程中可穿插使用微调（配合蒸馏）来恢复精度。

    核心原则：各种压缩技术会累积精度损失，必须进行充分评估，并在每一步后使用校准数据集进行微调。合理顺序通常是蒸馏 → 剪枝 → 量化。


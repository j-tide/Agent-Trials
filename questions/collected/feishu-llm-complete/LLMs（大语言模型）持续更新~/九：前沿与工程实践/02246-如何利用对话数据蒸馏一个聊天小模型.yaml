content:
  prompt: 如何利用对话数据蒸馏一个聊天小模型？
answer:
  mode: rubric
  reference_answer: |-
    聊天模型蒸馏与指令蒸馏类似，但更注重多轮对话的一致性、角色扮演和安全性。

    - 对话数据构建：

    - 训练数据格式：将对话构造为标准的ChatML格式，例如：

    <|user|> 你好，请问...
    <|assistant|> 您好！很高兴为您服务...

    训练时只计算助手回复部分的损失，用户消息和系统提示部分mask掉。

    - 蒸馏训练：

    - 特殊处理：

    与通用蒸馏相比，对话蒸馏更强调交互感和安全边界的保留。


answer:
  mode: rubric
  reference_answer: |-
    多模态大模型的“幻觉”是指模型生成的文本描述，忠实于其参数化知识而非输入的视觉内容。具体表现为：描述出图像中不存在的物体（对象幻觉）、虚构人物关系、或给物体赋予错误的属性。其根本原因在于模型在训练时，严重依赖了语言模型强大的先验知识和模式补全能力，而忽视了当下的视觉证据。


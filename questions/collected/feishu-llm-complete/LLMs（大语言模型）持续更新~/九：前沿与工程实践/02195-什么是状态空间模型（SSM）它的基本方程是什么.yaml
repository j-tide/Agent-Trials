content:
  prompt: 什么是状态空间模型（SSM）？它的基本方程是什么？
answer:
  mode: rubric
  reference_answer: |-
    状态空间模型（State Space Model, SSM）是描述动态系统的一种经典数学框架，广泛应用于控制论、信号处理和现代递归神经网络。在深度学习语境中，SSM 被用来建模序列数据，其核心思想是：通过一个潜在的隐状态（hidden state）随时间的演化，来捕捉序列中的长期依赖关系。

    SSM 的基本方程由两个部分构成：状态方程和观测方程。


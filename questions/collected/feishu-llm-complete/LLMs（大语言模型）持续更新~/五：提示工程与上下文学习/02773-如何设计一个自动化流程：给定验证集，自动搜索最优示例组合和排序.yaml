content:
  prompt: 如何设计一个自动化流程：给定验证集，自动搜索最优示例组合和排序？
answer:
  mode: rubric
  reference_answer: |-
    可以设计一个基于搜索优化的自动化流程，在验证集上找到使任务指标最大化的示例集及排序。

    流程框架：

    - 初始化

    - 候选集生成（粗搜）

    - 迭代评估与排序优化

    - 搜索算法选择

    - 约束处理

    - 最终验证与输出

    - 部署与持续优化

    工具链：可利用 Optuna、Hyperopt 等超参数优化框架，或结合 LangChain、LlamaIndex 的示例选择器接口，自定义目标函数进行搜索。整个流程高度自动化，能极大提升少样本学习性能的上限。


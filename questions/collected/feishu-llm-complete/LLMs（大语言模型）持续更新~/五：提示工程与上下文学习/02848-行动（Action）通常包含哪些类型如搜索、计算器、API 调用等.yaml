content:
  prompt: 行动（Action）通常包含哪些类型？如搜索、计算器、API 调用等。
answer:
  mode: rubric
  reference_answer: |-
    在 ReAct 框架中，行动（Action）是模型与外部世界交互的接口。行动空间的设计取决于具体应用场景，但通常包括以下几类：

    - 信息检索类：

    - 精确计算类：

    - 程序执行类：

    - 事务性操作类：

    - 任务控制类：

    - 环境交互类（在具身智能或游戏 Agent 中）：

    在典型的 ReAct 实现中，每种行动都有严格的文本格式，例如 Search[query]、Calculator[expression]、Finish[answer]，以便外部解析器准确识别和执行。良好的行动空间设计应在“功能完备性”和“避免模型滥用”之间取得平衡。


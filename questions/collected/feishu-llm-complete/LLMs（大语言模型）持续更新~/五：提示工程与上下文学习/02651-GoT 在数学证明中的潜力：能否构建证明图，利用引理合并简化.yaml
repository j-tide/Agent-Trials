content:
  prompt: GoT 在数学证明中的潜力：能否构建证明图，利用引理合并简化？
answer:
  mode: rubric
  reference_answer: |-
    数学证明是 GoT 的理想应用领域，因为证明过程天然包含分解、引理复用、分支探索和矛盾回溯，这些都是 GoT 的核心操作。

    构建证明图的方式：


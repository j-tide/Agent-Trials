content:
  prompt: 画出 GPT 系列模型的 Decoder-Only 结构，说明核心组件。
answer:
  mode: rubric
  reference_answer: |-
    GPT 系列采用仅解码器（Decoder-Only）架构，由以下核心组件堆叠而成：

    ```text
    输入文本 → Token Embedding + Position Embedding
           ↓
       [Transformer Decoder Block] × N 层
           ↓
       最终 LayerNorm
           ↓
       线性层 (LM Head) → softmax → 词表概率分布
    ```

    每个 Decoder Block 包含：

    - 掩码多头自注意力 —— 带因果掩码，确保每个 token 只能看到自身及之前的内容。

    - 前馈网络（FFN） —— 两个线性层 + 激活函数（GPT-1/2 用 GELU，GPT-3/4 未公开细节，LLaMA 等现代模型用 SwiGLU）。

    - 残差连接 包裹以上两个子层。

    - 层归一化 —— GPT-1/2 使用 Post-Norm（在残差加法之后），GPT-3 及之后普遍转向 Pre-Norm（在子层之前）。

    核心组件功能：

    - 输入嵌入：将 token 转换为稠密向量；位置嵌入（可学习或 RoPE）注入位置信息。

    - 掩码自注意力：实现自回归的因果约束，是生成能力的关键。

    - FFN：提供模型容量和知识存储，参数量约占 2/3。

    - 残差连接+归一化：保障深层网络训练稳定，防止梯度消失。


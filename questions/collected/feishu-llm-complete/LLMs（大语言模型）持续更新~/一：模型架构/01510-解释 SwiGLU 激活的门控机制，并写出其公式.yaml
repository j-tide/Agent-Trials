content:
  prompt: 解释 SwiGLU 激活的门控机制，并写出其公式。
answer:
  mode: rubric
  reference_answer: |-
    SwiGLU 是 Swish-Gated Linear Unit 的缩写，它结合了门控机制和 Swish 激活函数。其核心思想是：将输入通过两条不同的线性变换，一条产生“信息”信号，另一条产生“门控”信号，然后逐元素相乘，动态控制信息流。

    公式：

    [图片内容未导入]

    门控机制解释：

    - 门控路径的输出经过 Swish 函数，值域在 (−≈0,∞)，可以看作一个“软开关”。当门控值接近 0 时，信息被抑制；当门控值较大时，信息可以畅通。

    - 这种机制允许模型根据输入内容动态地调节哪些特征应该被保留、放大或抑制，比固定激活函数（ReLU/GELU）更灵活，表达力更强。


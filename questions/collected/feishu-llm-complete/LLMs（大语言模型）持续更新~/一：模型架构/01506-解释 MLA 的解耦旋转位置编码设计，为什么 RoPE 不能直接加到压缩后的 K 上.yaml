content:
  prompt: 解释 MLA 的“解耦旋转位置编码”设计，为什么 RoPE 不能直接加到压缩后的 K 上？
answer:
  mode: rubric
  reference_answer: |-
    RoPE 需要作用在每个头独立的 K 和 Q 上，因为它通过旋转来编码相对位置，而旋转是头特定的。

    MLA 的潜在向量 ckvckv 是所有头共享的，如果直接对 ckvckv 施加 RoPE，那所有头的 K 都会带上相同的位置信息，头之间的差异被抹杀，注意力模式会严重退化。

    解耦设计：

    [图片内容未导入]

    - Q 同样拆成内容和位置两部分。

    - 注意力分数 = 内容 Q × 内容 K + 内容 Q × 位置 K + 位置 Q × 内容 K。

    这样，位置信息通过专门的位置通道注入，不与共享的内容潜在空间冲突。这个设计是 MLA 能够实际工作的关键，它巧妙地在极限压缩和位置感知之间架起了桥梁。


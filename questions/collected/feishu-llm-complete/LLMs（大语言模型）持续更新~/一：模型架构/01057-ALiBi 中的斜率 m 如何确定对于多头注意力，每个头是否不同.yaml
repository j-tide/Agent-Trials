content:
  prompt: ALiBi 中的斜率 m 如何确定？对于多头注意力，每个头是否不同？
answer:
  mode: rubric
  reference_answer: |-
    每个头使用不同的斜率，但所有斜率都是预先设定、无需训练的常数。

    [图片内容未导入]

    这些斜率在训练开始时设定后就保持不变，不参与反向传播。这种设计极其简洁，每个头的注意力头通过不同的斜率自然分化为“短距离关注头”（大斜率，强惩罚长距离）和“长距离关注头”（小斜率，弱惩罚长距离），无需额外学习。


content:
  prompt: 能否使用 Conv1D 替代 FFN？有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    可以，且已有相关工作（如 CNN-based Transformer、ConvFFN）。但会有以下影响：

    优势：

    - Conv1D 能够引入局部感受野，捕获邻近 token 之间的 n-gram 模式。对于某些任务（如语音、字符级文本），局部依赖的建模可能比纯 position-wise FFN 更有优势。

    - 在一些高效架构中，轻量卷积可以降低参数量同时保持性能。

    劣势：

    - 丧失 position-wise 独立性：标准 FFN 是逐 token 独立变换，保证了模型对序列长度的高度并行性。引入卷积会引入跨位置的依赖，可能干扰自注意力已经捕获的全局依赖。

    - 增加的序列长度依赖：卷积操作的计算量随序列长度线性增长（与卷积核大小相关），而 position-wise FFN 的计算量与序列长度成简单的线性关系，更易扩展。

    - 理论和工程上的额外复杂度：需要处理 padding、因果掩码的兼容性等问题，且可能与为 position-wise FFN 高度优化的硬件内核不匹配。

    - 实践中，纯 Conv1D 替代 FFN 并未在主流 LLM 中成为趋势，因为 position-wise FFN 的简洁高效和强大的知识存储能力难以被卷积轻易取代。


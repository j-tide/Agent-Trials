content:
  prompt: 描述 GQA 中“组”的定义，以及 K、V 头的分配方式。
answer:
  mode: rubric
  reference_answer: |-
    在 GQA 中，组（group） 指的是共享同一对 K 和 V 投影矩阵的查询头的集合。

    具体分配方式如下：

    - 设总查询头数为 H，组数为 G（需满足 H 能被 G 整除）。

    - 将查询头按顺序分为 G 组，每组包含 H/G 个连续的查询头。

    [图片内容未导入]

    因此，GQA 通过组内共享、组间独立的策略，实现了参数和缓存的压缩。


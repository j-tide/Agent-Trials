  reference_answer: |-
    多查询注意力（Multi-Query Attention, MQA）与标准多头注意力（Multi-Head Attention, MHA）的核心区别在于 K（键）和 V（值）的投影方式：

    [图片内容未导入]

    这一改变极大地减少了自回归解码时键和值缓存（KV Cache）的大小，因为无论有多少个头，每层都只需缓存一份 K 和 V。


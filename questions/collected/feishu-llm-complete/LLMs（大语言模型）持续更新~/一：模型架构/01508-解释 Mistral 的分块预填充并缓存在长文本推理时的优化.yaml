content:
  prompt: 解释 Mistral 的“分块预填充并缓存”在长文本推理时的优化。
answer:
  mode: rubric
  reference_answer: |-
    分块预填充（Chunked Prefill） 是一种处理长 prompt 的推理优化策略，与滑动窗口注意力结合使用效果显著。

    工作流程：

    - 将长 prompt 切分为若干小块（chunk），每个块大小为窗口大小 W 或更小。

    - 逐块进行编码：第一个块正常前向传播，生成并缓存其 K、V。第二个块编码时，由于其注意力范围只覆盖最近的 W 个 token，它不需要访问第一个块中超出窗口的部分，因此可以直接使用当前缓存（此时缓存包含第一个块的后部 token）进行注意力计算。

    - 每编码完一个块，更新滚动缓存（旧 token 被覆盖），然后处理下一个块。

    - 所有块编码完成后，最后一个块的隐藏状态作为生成起点的上下文。


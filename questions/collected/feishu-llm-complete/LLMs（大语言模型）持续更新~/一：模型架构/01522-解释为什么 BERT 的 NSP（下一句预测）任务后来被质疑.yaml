content:
  prompt: 解释为什么 BERT 的 NSP（下一句预测）任务后来被质疑。
answer:
  mode: rubric
  reference_answer: |-
    NSP 任务被质疑并最终被许多模型抛弃，主要原因：

    - 任务过于简单：随机抽取的无关句子在主题、词汇上往往差异极大，模型仅凭浅层特征（如词重叠）就能判断，无法学到深层的句子间逻辑关系。这使得 NSP 对模型理解力的提升有限。

    - 对下游任务帮助有限：RoBERTa 等研究通过消融实验发现，移除 NSP 后，模型在多数下游任务上的性能不降反升。MLM 本身足以让模型学到强大的表示，NSP 反而可能成为噪声。

    - 破坏了文本的连贯性：NSP 需要构造大量“非下一句”的负样本，这意味着预训练数据必须被切割成独立的句子对，破坏了原始文档的连续性和长程依赖。相比之下，直接喂入连续长文本（如 RoBERTa 的做法）能让模型学到更丰富的上下文关系。

    - 更好的替代方案：后来的模型更倾向于使用全文档级别的连续文本进行训练，或采用更复杂的句子顺序预测任务（如 ALBERT 的 SOP），但总体趋势是简化预训练任务。

    因此，NSP 被视为 BERT 设计中可以被优化的部分，后续的强基线模型（如 RoBERTa、DeBERTa）普遍移除了它。


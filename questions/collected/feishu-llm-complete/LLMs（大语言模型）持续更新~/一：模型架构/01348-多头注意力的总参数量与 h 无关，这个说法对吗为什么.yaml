    这意味着什么：
    这是一个非常优雅的设计——我们可以自由调节头数 h，而不改变模型的总参数规模。增大 h 让每个头更窄（dk 更小），换取更多样化的视角；减小 h 让每个头更宽，换取更强大的单头表达能力，参数量完全相同。这为我们提供了一个在不增加模型预算的前提下，探索最优架构配置的自由度。


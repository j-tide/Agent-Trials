answer:
  mode: rubric
  reference_answer: |-
    RoPE 的核心优势在于：旋转后的 Q 和 K 的点积仅依赖于它们的相对位置 m−n，而不再依赖绝对位置 m 和 n。

    [图片内容未导入]

    这两个旋转向量的内积为：

    [图片内容未导入]

    整个向量的点积为所有子空间内积之和：

    [图片内容未导入]

    结论：点积结果仅依赖于相对位置 m−n 的旋转矩阵 R((n−m)θi)，而与绝对位置 m,n 无关。这意味着自注意力分数天然编码了相对位置关系。


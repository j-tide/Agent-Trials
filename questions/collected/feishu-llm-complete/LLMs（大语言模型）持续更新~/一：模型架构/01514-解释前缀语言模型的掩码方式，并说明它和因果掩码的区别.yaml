content:
  prompt: 解释“前缀语言模型”的掩码方式，并说明它和因果掩码的区别。
answer:
  mode: rubric
  reference_answer: |-
    前缀语言模型（Prefix LM） 的掩码方式是一种分段混合掩码。输入序列被分割为两部分：

    - 前缀部分（通常为源序列、提示或任务定义）：这些 token 之间使用双向注意力（全可见掩码，即全0），使得每个前缀 token 都能看到整个前缀的上下文。

    - 生成部分（目标序列或回复）：这些 token 使用因果掩码，每个位置只能看到前缀部分以及它自己在生成部分中的前文。

    具体掩码矩阵形式（假设前缀长度为 P，总长度为 P+G）：

    - 对于行 i：

    与纯因果掩码的区别：

    - 纯因果掩码（如 GPT）：整个序列，包括输入给模型的所有 token，都采用下三角掩码。第一个 token 只能看到自己，无法看到后面的任何 token，即使那是用户的指令。

    - 前缀语言模型：前缀部分相当于一个“已知的知识库”，允许模型充分双向理解指令和上下文，这极大地提升了模型对任务意图的把握；而后面的生成部分仍保持自回归，保证生成质量。这种设计常见于 T5 的预训练、GLM、以及现代的 Chat 模型（例如，系统提示和用户问题作为前缀，模型回答作为生成部分），在实际产品中应用广泛。


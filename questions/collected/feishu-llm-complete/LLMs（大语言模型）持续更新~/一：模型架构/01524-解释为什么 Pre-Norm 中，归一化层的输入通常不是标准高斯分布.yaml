content:
  prompt: 解释为什么 Pre-Norm 中，归一化层的输入通常不是标准高斯分布。
answer:
  mode: rubric
  reference_answer: |-
    Pre-Norm 的结构为：

    [图片内容未导入]

    其中 LayerNorm(x) 的输出经过 γ 和 β 变换后通常不是标准高斯（但大致是均值为 β、标准差为 γ 的分布）。关键在于，x 是上一层的残差输出，它由最初的嵌入和所有先前子层的输出累加而成。

    随着深度增加，残差流 x 的分布会逐渐偏离标准高斯，因为：

    - 每一层的子层输出（如 FFN 的非线性变换）都会在残差流上叠加一个信号，这个信号分布通常不是高斯。

    - 尽管每一层的输入 x 在进入子层前被 LayerNorm 重新归一化，但子层输出与原始 x 相加后，得到的新的 x 已经是被“污染”过的分布。

    - 在浅层，x 接近初始嵌入的分布；在深层，x 已经累积了大量子层的贡献，呈现重尾、偏斜或更复杂的形态。

    因此，尽管 LayerNorm 努力在每一层将子层输入进行归一化，残差流本身作为下一层的输入时，其分布已不再是标准高斯。这也是为何深层网络的归一化层输入分布会逐渐偏离理想高斯的原因。


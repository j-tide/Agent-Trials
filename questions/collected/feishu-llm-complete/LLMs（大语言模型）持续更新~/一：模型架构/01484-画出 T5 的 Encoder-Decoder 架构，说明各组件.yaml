content:
  prompt: 画出 T5 的 Encoder-Decoder 架构，说明各组件。
answer:
  mode: rubric
  reference_answer: |-
    T5（Text-to-Text Transfer Transformer）采用标准的 Encoder-Decoder Transformer 架构，结构如下：

    ```text
    输入文本 → Token Embedding（+ 相对位置编码）
           ↓
       [Transformer Encoder Block] × N 层
           ↓
       编码器输出（隐藏状态序列）
           ↓
       [Transformer Decoder Block] × N 层  ← 输入：目标文本（右移一位）
           ↓
       线性层 + softmax → 词表概率分布
    ```

    各组件详解：

    - 编码器：与 BERT 类似，由多个 Transformer 块堆叠而成，每个块包含双向自注意力（无因果掩码，每个 token 可看到全部输入）、前馈网络（FFN，使用 ReLU 或近似激活）、残差连接和层归一化（Pre-Norm 风格）。编码器将输入文本编码为上下文相关的隐藏状态序列。

    - 解码器：与 GPT 类似，但多了一个交叉注意力（Cross-Attention）子层。每个解码器块依次为：掩码自注意力（因果掩码，只看已生成的目标 token）、交叉注意力（Q 来自解码器，K、V 来自编码器输出）、前馈网络。解码器自回归地生成目标文本。

    - 位置编码：T5 使用相对位置编码（相对偏置），将 token 间的相对距离分桶，每个桶对应一个可学习的标量偏置，加到注意力 logits 上。这不同于原始 Transformer 的正弦绝对位置或可学习绝对位置嵌入。

    - 输入/输出嵌入共享：T5 的编码器和解码器的输入嵌入矩阵以及解码器的输出投影矩阵共享权重，减少了参数量并提升了泛化能力。


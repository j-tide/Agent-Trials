content:
  prompt: 从梯度传播的角度，分析 Pre-Norm 的残差分支梯度如何流动。
answer:
  mode: rubric
  reference_answer: |-
    考虑 Pre-Norm 的第 l 层：

    [图片内容未导入]

    反向传播时，损失对 x_l 的梯度为：

    [图片内容未导入]

    其中 I 来自残差连接的直接拷贝。关键点：

    - 残差路径贡献了一个恒等项 ∂L/∂x_{l+1}，确保梯度至少可以原样传递到浅层，不会因为 F_l 的梯度消失而完全阻断。

    - F_l 的梯度经过 LN 后再作用于 x_l。因为 LN(x_l) 已将 x_l 归一化到稳定分布，F_l 的梯度被有效控制，不会出现爆炸或消失。同时，LN 本身的梯度也因其输入是 x_l（而非残差累加后的巨量信号）而保持合理大小。

    - 因此，Pre-Norm 实现了梯度高速公路：残差连接提供无损的梯度通路，归一化则确保支路梯度稳定不失控。整体梯度在数百层内依然可以有效传播。


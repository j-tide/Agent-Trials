content:
  prompt: 解释 Transformer 如何处理变长序列输入。
answer:
  mode: rubric
  reference_answer: |-
    Transformer 本身通过自注意力机制，理论上可以处理任意长度的序列，但在批处理训练时，需要处理一个 batch 内不同长度的序列。处理方法如下：

    - 填充（Padding）：将同一批次中的所有序列填充到相同的长度（通常为该批次最长序列的长度）。使用特殊的 <PAD> token，其嵌入向量为零或专门学习。

    - 注意力掩码（Attention Masking）：在计算自注意力时，对填充位置进行遮蔽，防止它们对真实 token 的表示产生影响。

    - 对于编码器的自注意力，掩码会屏蔽掉所有填充位置的注意力权重（设置为一个很大的负数，经过 softmax 后概率接近 0）。

    - 对于解码器的自注意力，除了填充掩码外，还需要因果掩码（Causal Mask），确保每个位置只能注意到它之前的位置，防止看到未来的信息。

    - 位置编码：位置编码只加到真实 token 上，填充 token 的位置通常也被掩蔽掉（或者在实现中一并加上位置编码但通过掩码忽略）。

    - 动态计算：注意力机制本身没有序列长度限制，只是计算注意力矩阵的维度会随序列长度变化。因此，只要内存允许，可以处理任意长度序列。

    这种机制使得 Transformer 能够高效地在一个批次中并行处理不同长度的句子。


content:
  prompt: 为什么说 ALiBi 是一种“线性衰减”的相对位置偏置？
answer:
  mode: rubric
  reference_answer: |-
    因为 ALiBi 所施加的偏置 Bij 是与两个 token 之间的相对距离 d=j−i 成严格线性关系的：

    [图片内容未导入]

    这意味着惩罚力度随距离增加而均匀增长，没有拐点或衰减减缓。这与 RoPE 的复杂频率依赖、T5 的相对位置桶（分桶后再嵌入）等非线性或离散化方案形成鲜明对比。因此 ALiBi 被称为“线性衰减”或“线性偏置”的位置编码。


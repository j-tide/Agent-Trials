content:
  prompt: LayerNorm 的计算公式是什么？它在哪个维度进行归一化？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    在 Transformer 中，输入通常是形状为 (B,N,d) 的张量（B为批次，N为序列长度，d为特征维度）。LayerNorm 沿最后一个维度 d 独立对每个 token（每个 (B,N) 位置）计算均值和方差，即对每个 token 的特征向量归一化，不跨 token 或 batch。


    这一机制优雅地实现了“屏蔽”效果，而且由于 softmax 的归一化性质，被屏蔽位置的概率质量会被重新分配给未被屏蔽的位置，使得剩余的注意力权重之和仍为 1。这种“加性掩码 + softmax”的模式成为注意力机制中实现各种约束（因果、填充、窗口、稀疏等）的通用范式。


content:
  prompt: 解释“归一化层的梯度”如何影响反向传播。
answer:
  mode: rubric
  reference_answer: |-
    归一化层在反向传播时参与梯度计算，其特殊性质会直接影响梯度的缩放和方向。

    [图片内容未导入]

    - 梯度缩放不变性：LayerNorm 保证了相对于尺度的梯度不变性。若对输入乘以常数 c，由于 μ 和 σ 也成比例缩放，x^ 保持不变，因此梯度流在通过 LayerNorm 后不受输入尺度的缩放影响，有效防止了因权重矩阵增大而导致的梯度爆炸或消失。

    - 稳定梯度的方差：通过归一化，LayerNorm 确保后续层接收的激活方差稳定，从而反向传播到此层的梯度也有相对稳定的范数，避免深层网络中梯度的指数增长或衰减。

    - RMSNorm 的情形：RMSNorm 省略了均值中心化，梯度计算更简单，但保留了关键的方差缩放不变性，依然能有效控制梯度的尺度。

    总之，归一化层通过重塑梯度结构（降低相关性）和稳定梯度尺度，使得深层网络的优化地貌更平滑，训练更快、更稳定。这正是为什么归一化层是 Transformer 不可或缺的组件。


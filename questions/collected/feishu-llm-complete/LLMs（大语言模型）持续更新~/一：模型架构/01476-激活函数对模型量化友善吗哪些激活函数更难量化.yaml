content:
  prompt: 激活函数对模型量化友善吗？哪些激活函数更难量化？
answer:
  mode: rubric
  reference_answer: |-
    激活函数的特性会影响量化后的精度，尤其是当激活函数的输出范围或分布极不均衡时。

    对量化不友善的特性：

    - 无界或极宽的输出范围：例如 ReLU 正半轴无界，若激活值可达到几百甚至几千，在 INT8 量化下需要大量的动态范围，导致微小值被量化为零，精度损失。

    - 尖锐的分布：softmax 输出近似 one-hot 的尖锐分布，大部分位置接近 0，量化后这些位置基本为 0，信息损失严重。

    - 饱和区：sigmoid/tanh 在饱和区梯度近似零，量化带来的噪声可能使神经元彻底卡在饱和区，丧失表示能力。

    更难量化的激活函数：

    - softmax 由于其输出是概率分布，具有极强的动态范围和稀疏性，是量化中的难题。常用解决方案包括使用更高的位宽（如 INT16）专门处理 softmax 部分，或采用 log-softmax 技巧。

    - GELU 涉及 erf 操作，量化实现复杂，且输出分布非标准，需要专门的校准。

    - Swish/SiLU 相对较好，因为它的输出范围通常受限于预归一化后的合理区间，且分布较为平滑。

    量化友善的激活函数：

    - ReLU 由于正半轴是线性的，量化非常简单，只需处理正值范围。

    - Hard Swish / Hard Sigmoid 等分段线性近似，专门为量化设计。

    实践中，量化通常结合层归一化和适当的校准（如 KL 散度校准、百分位数校准）来处理激活函数引入的分布偏移，且往往对 FFN 和注意力输出采用对称量化以适配硬件。


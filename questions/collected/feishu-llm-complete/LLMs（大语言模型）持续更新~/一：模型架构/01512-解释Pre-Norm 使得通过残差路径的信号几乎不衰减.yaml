content:
  prompt: 解释“Pre-Norm 使得通过残差路径的信号几乎不衰减”。
answer:
  mode: rubric
  reference_answer: |-
    这句话指的是在 Pre-Norm 架构中，主残差流 x 在逐层传递时没有经历任何乘法性衰减操作。

    具体来说，每一层的运算为：

    [图片内容未导入]

    - 残差连接将上一层的输出 x_l 原样复制并加到本层输出上。这个复制是精确的恒等映射，系数为 1。

    - 归一化操作仅作用于支路 F_l 的输入，完全不影响主路径 x_l 的幅度。

    - 因此，信号 x 在整个深层网络的传递过程中，每经过一层只是叠加了子层的输出，而没有乘以任何小于 1 的因子（如归一化的缩放）。早期信息可以无衰减地穿越数十上百层。

    相反，在 Post-Norm 中，x_{l+1} = \text{LN}(x_l + F_l(x_l))，主路径上的信号在每一层都被 LayerNorm 重新缩放，当深层方差变大时，有效信号实际上被压缩，导致早期信息衰减。因此，Pre-Norm 的设计本质上是将归一化从“信息高速公路”上移开，保证了信号和梯度的近乎无损传输。


content:
  prompt: 除了 Mistral，还有哪些模型使用了窗口注意力？举例说明。
answer:
  mode: rubric
  reference_answer: |-
    窗口注意力（局部注意力）在许多模型中被用来降低长序列的计算成本：

    - Longformer：引入了滑动窗口注意力与全局注意力（如 [CLS] token）相结合，用于编码长文档，在 NLP 理解任务中表现优异。

    - Sparse Transformer（OpenAI）：使用了固定的稀疏注意力模式，包括局部带状窗口和跨步注意力，以生成高分辨率图像和长文本。

    - BigBird：结合了随机注意力、窗口注意力和全局注意力，实现了线性复杂度，可用于更长序列。

    - Reformer：使用局部敏感哈希（LSH）将注意力限制在相似 token 的局部桶内，类似于动态窗口。

    - GPT-3 的稀疏注意力变体：在 GPT-3 的某些层使用了稀疏带状注意力（类似于窗口），以减少计算。

    - CodeLLaMA：虽然基于 LLaMA，但它可能通过特殊的微调或注意力模式支持长上下文，但并非原生的滑动窗口注意力；不过社区衍生版本有时会引入窗口注意力以加速。

    - Gemini 1.5：虽然没有详细披露，但其超长上下文（百万 token）可能包含某种形式的稀疏或窗口注意力。

    这些模型都利用了局部窗口注意力的高效性，通常结合其他机制（如全局 token、记忆压缩）来弥补远程依赖。


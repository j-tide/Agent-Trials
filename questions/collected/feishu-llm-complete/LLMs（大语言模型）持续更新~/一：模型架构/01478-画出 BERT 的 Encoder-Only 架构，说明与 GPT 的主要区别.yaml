    BERT 架构（Encoder-Only）：

    ```text
    输入文本 → Token Embedding + Segment Embedding + Position Embedding
           ↓
       [Transformer Encoder Block] × N 层
           ↓
       每个位置的隐藏状态（可用于分类/序列标注）
    ```

    核心组件与 GPT 相同（自注意力、FFN、残差连接、层归一化），但有以下关键区别：


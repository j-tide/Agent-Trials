content:
  prompt: 解释为什么 RoPE 能够保持注意力矩阵的“Toeplitz”结构倾向。
answer:
  mode: rubric
  reference_answer: |-
    Toeplitz 矩阵的特点是：矩阵的每条对角线元素相等，即元素值仅依赖于 i - j（相对位置），而与绝对位置 i 和 j 无关。在纯相对位置编码下，若内容向量完全相同，注意力分数矩阵将是一个 Toeplitz 矩阵。

    RoPE 正是通过将绝对位置转化为 Q、K 的旋转，使得同一对相对距离在不同绝对位置产生的点积相同，从而在内容无关的极限下，注意力分数仅依赖于相对距离。虽然在实际中内容向量不同会破坏严格的 Toeplitz 结构，但 RoPE 内建了这种平移不变性，使注意力矩阵天然倾向于表现出 Toeplitz 特征。这种倾向有利于模型学习位置平移不变的序列模式，也是在长文本外推时注意力模式稳定的数学基础。


    [图片内容未导入]

    - 在某个子空间中，Q 和 K 可能主要保留“名词-动词”的语法信息，因此在这个子空间里，相似的 token 是根据它们的语法角色聚合的。

    - 在另一个子空间中，Q 和 K 可能主要保留语义主题信息，因此相似的 token 是根据话题相关性聚合的。


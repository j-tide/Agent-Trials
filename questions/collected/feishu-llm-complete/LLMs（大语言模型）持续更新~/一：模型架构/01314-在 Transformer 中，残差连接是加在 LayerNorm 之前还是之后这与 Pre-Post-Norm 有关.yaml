content:
  prompt: 在 Transformer 中，残差连接是加在 LayerNorm 之前还是之后？这与 Pre/Post-Norm 有关。
answer:
  mode: rubric
  reference_answer: |-
    残差连接的本质是 x + Sublayer(...)，而 LayerNorm 的位置决定了 Pre-Norm 还是 Post-Norm。

    - Post-Norm：先进行残差加法，然后对结果归一化：

    [图片内容未导入]

    Pre-Norm：先对输入归一化，再经过子层，然后残差加法：

    [图片内容未导入]

    无论哪种，残差连接始终是加在子层的输出与原始输入之间，即“加法”永远在归一化之前（Post-Norm）或之后（Pre-Norm）的某个位置，但残差连接的操作本身不变。区别只在于归一化是作用于加法后的结果（Post），还是仅作用于子层的输入（Pre）。


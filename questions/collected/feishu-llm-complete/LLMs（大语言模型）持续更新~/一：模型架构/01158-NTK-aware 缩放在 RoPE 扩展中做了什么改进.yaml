    改进效果：

    - 保留局部精度：高频分量的保留确保模型对相邻 token 的区分能力不下降。

    - 扩展远程容量：低频分量的周期被拉伸，使模型能够区分更远距离的位置。

    - 实验证明，NTK-aware 缩放无需微调（或仅需极少微调）即可在长序列上取得良好性能，显著优于 PI。


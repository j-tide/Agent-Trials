content:
  prompt: 对于长度为 1 的序列，因果掩码是否退化？
answer:
  mode: rubric
  reference_answer: |-
    是的，完全退化，等同于没有掩码（即全可见注意力）。

    对于长度 n=1 的序列，因果掩码矩阵是一个 1×1 的矩阵，其中唯一元素为 0（因为位置 0 可以注意位置 0，即自身）。没有未来位置可屏蔽，因此因果掩码不起任何实际作用。

    [图片内容未导入]

    这也就是为什么在推理的第一个 token 生成时，因果掩码虽然没有屏蔽任何 token，但依然可以加上（通常为了代码统一而保留），它只是没有任何屏蔽效果而已。


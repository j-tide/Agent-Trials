content:
  prompt: 画出 Pre-Norm 和 Post-Norm 的残差结构图，标出归一化层的位置。
answer:
  mode: rubric
  reference_answer: |-
    Post-Norm（原始 Transformer）
    结构顺序：
    x → [Sublayer] → (+) → [LayerNorm] → 输出
    展开：

    ```text
    输入 x
      ├──→ Sublayer(x) （注意力或FFN）
      └──→ x（残差连接）
    相加得到 x + Sublayer(x)
    然后通过 LayerNorm： y = LayerNorm(x + Sublayer(x))
    ```

    归一化层位于残差加法之后。这种设计使得残差分支的输出直接叠加到主路径，然后整个结果被归一化。

    Pre-Norm（现代主流）
    结构顺序：
    x → [LayerNorm] → [Sublayer] → (+) → 输出
    展开：

    ```text
    输入 x
      ├──→ Sublayer(LayerNorm(x))
      └──→ x（残差连接）
    相加得到 y = x + Sublayer(LayerNorm(x))
    ```

    归一化层位于子层之前，且只作用于子层的输入，残差分支上的 x 原样传递。

    这两种结构对训练稳定性和梯度流动有根本性影响。


content:
  prompt: 讨论“DenseNet 密集连接”和 Transformer 残差连接的区别与联系。
answer:
  mode: rubric
  reference_answer: |-
    联系：

    - 两者都通过跳跃连接（skip connections）促进特征复用和梯度流动，使得深层网络更易训练。

    - 都通过建立从浅层到深层的直接通路，缓解了梯度消失和退化问题。

    - 思想上都属于“让信息在网络中自由流动”的设计哲学。

    核心区别：

    [嵌入表格未展开]

    联系与启发：

    Transformer 可以视为 DenseNet 的一种极端稀疏形式——只保留逐层连接。DenseNet 的密集连接在视觉任务中极大提升了特征复用，但在 NLP 的 Transformer 中，由于序列长度和自注意力的存在，密集连接会带来难以承受的计算和内存开销。尽管如此，两者的设计精神一脉相承，都源于对“深度网络中信息流动”的深刻理解。


content:
  prompt: LLaMA 中的词表大小是多少？使用了哪种分词器？
answer:
  mode: rubric
  reference_answer: |-
    - LLaMA-1：词表大小为 32000，使用基于字节对编码（BPE）的 SentencePiece 分词器。字符覆盖率在 diverse 语料上训练得到。

    - LLaMA-2：沿用相同的 32K 词表和 SentencePiece BPE 分词器，词汇不变。

    - LLaMA-3：词表大小扩大至 128256（约 128K），分词器改用基于 tiktoken 的 BPE 实现（与 OpenAI 的 GPT-4 分词器类似），显著提高了多语言和代码文本的压缩率，减少了序列长度。

    这种扩充使得 LLaMA-3 在处理多语言任务时更高效，同时降低了推理时的 token 生成步数。


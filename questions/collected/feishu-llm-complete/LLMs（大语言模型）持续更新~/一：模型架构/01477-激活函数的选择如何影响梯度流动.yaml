content:
  prompt: 激活函数的选择如何影响梯度流动？
answer:
  mode: rubric
  reference_answer: |-
    激活函数直接决定了反向传播时梯度的计算方式，其形状决定了梯度在深层网络中的衰减或放大特性，进而影响训练的稳定性和收敛速度。

    - 梯度消失

    对于具有饱和区的激活函数（如 sigmoid、tanh），当输入绝对值很大时，函数输出趋于平缓，导数趋于零。在深层网络中，连乘效应会使浅层梯度指数级衰减，导致参数几乎无法更新。ReLU 通过在正半轴导数恒为 1 缓解了梯度消失，但负半轴导数为零会带来神经元死亡。GELU 和 Swish 在负半轴保留微小梯度，且正半轴导数接近 1，使得深层梯度流动更加平稳。

    - 梯度爆炸

    若激活函数在正半轴无上界且导数始终大于等于 1（如 ReLU 导数恒为 1），梯度本身不会因激活函数放大，但若权重初始化不当，配合无界的激活值可能导致后续层输出过大，间接引起梯度爆炸。因此激活函数通常与层归一化和适当的初始化共同作用来控制梯度规模。

    - 梯度噪声与平滑性

    非平滑的激活函数（如 ReLU 在 0 点突变）会使梯度在零点附近产生不连续性，可能导致优化路径震荡。平滑函数（GELU、Swish）的导数处处连续，梯度更新更稳定，有利于使用更高的学习率，加速收敛。

    - 梯度的选择性流动

    门控类激活（如 SwiGLU 的门控分支）允许模型根据输入动态调整信息流和梯度：门控值接近 0 时抑制对应的参数更新，起到类似“学习何时学习”的作用，有助于聚焦重要特征，减少噪声梯度干扰。

    总结：激活函数通过其导数的值域、平滑性和门控机制，深刻影响着深层网络中梯度的保持、噪声水平和选择性，是训练稳定性和效率的关键因素。


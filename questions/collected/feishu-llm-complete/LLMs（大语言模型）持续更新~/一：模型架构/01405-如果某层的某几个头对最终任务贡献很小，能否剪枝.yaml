    剪枝依据：

    - 通过对注意力头的重要性进行评分（例如基于它对损失函数的梯度、或基于移除该头后对下游任务性能的影响），可以识别出贡献极低或功能高度冗余的头。

    - 研究发现，尤其是在深层Transformer的某些中间层，相当比例的头可以被完全移除而对最终性能几乎没有影响（有时甚至因为减少了过拟合而有微小提升）。


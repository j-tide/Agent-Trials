    为什么能剪枝：

    这正是多头集成学习特性的体现——冗余头和其他头功能重叠，集成中移除一个弱学习器不影响大局。此外，有些头可能学到了非常局部的、仅适用于特定数据模式的知识，对于大多数输入没什么贡献，这些头就成了可剪枝的“死权重”。


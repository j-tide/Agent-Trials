content:
  prompt: LLaMA 的 Pre-Norm 具体是如何放置的？画出示意图。
answer:
  mode: rubric
  reference_answer: |-
    LLaMA 采用 Pre-Norm 结构，归一化层放置在每个子层（注意力、FFN）之前，而非之后。

    单层结构示意：

    ```text
    输入 x
      ├──→ RMSNorm → 掩码多头自注意力 → 输出 attn_out
      └──→ 恒等映射 x
    相加：x' = x + attn_out

    x'
      ├──→ RMSNorm → SwiGLU FFN → 输出 ffn_out
      └──→ 恒等映射 x'
    相加：output = x' + ffn_out
    ```

    示意图（文字描述）：

    ```text
    x
        |-----------|
        |           |
     RMSNorm    (identity)
        |           |
     Multi-Head     |
     Attention      |
        |           |
        +-----------+
            |
           (+) -----> x'
            |
            |-----------|
            |           |
         RMSNorm    (identity)
            |           |
         SwiGLU FFN    |
            |           |
            +-----------+
                |
               (+) -----> output
    ```

    归一化层（RMSNorm）位于残差分支的入口，主残差路径始终保持纯净恒等映射，这是 Pre-Norm 的核心特征。


content:
  prompt: 解释“因果语言模型”为什么又叫做“标准语言模型”。
answer:
  mode: rubric
  reference_answer: |-
    因果语言模型（Causal LM）的目标是对序列的联合概率进行自回归分解：

    [图片内容未导入]

    这个分解直接源于概率论的链式法则，是统计学中“语言模型”最经典、最标准的定义。它严格遵循时序因果关系：过去影响未来，未来不影响过去。

    因此，因果语言模型就是按照自然语言的生成顺序进行建模的语言模型，是语言模型定义的直接实现，故被称为“标准语言模型”。


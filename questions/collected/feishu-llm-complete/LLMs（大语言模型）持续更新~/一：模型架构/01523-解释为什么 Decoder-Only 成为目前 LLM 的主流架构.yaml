content:
  prompt: 解释为什么 Decoder-Only 成为目前 LLM 的主流架构。
answer:
  mode: rubric
  reference_answer: |-
    - 统一的任务框架

    一切都被归结为“预测下一个 token”。无论是对话、翻译、代码生成还是推理，都可以用相同的方式训练和推理，不需要任何任务特定的结构。这极大地简化了训练流程，也使得在超大规模多任务数据上训练成为可能。

    - 极佳的扩展性（Scalability）

    Decoder-Only 架构简单，没有编码器-解码器之间的复杂交互。在 Scaling Law 的指导下，将全部参数和计算都投入到同一个解码器上，被反复证明能够持续、可预测地提升性能。工程上，它的并行和优化也更加直接。

    - 涌现的上下文学习能力

    纯解码器模型在超大规模训练后，展现出了强大的 in-context learning 能力——只需在 prompt 中给出几个示例，就能完成新任务。这种能力与 Decoder-Only 的因果注意力结构高度相关，成为 LLM 最具革命性的特性之一。

    - 高效的推理

    自回归推理 + KV 缓存 + 现代优化（FlashAttention, GQA）使得 Decoder-Only 的生成速度和显存效率不断提升。相比编码器-解码器，其推理流程更统一，更易部署。

    - 生态与数据

    互联网上天然存在的文本序列都可以直接用作训练数据（“下一个词预测”）。这为 Decoder-Only 模型提供了几乎无限的训练语料，而无需人工构建“输入-输出”对。

    因此，Decoder-Only 以其无与伦比的通用性、可扩展性和涌现能力，成为了当前 LLM 的主流范式。


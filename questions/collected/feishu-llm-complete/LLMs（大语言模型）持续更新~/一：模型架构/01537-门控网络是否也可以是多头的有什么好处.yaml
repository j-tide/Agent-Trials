content:
  prompt: 门控网络是否也可以是多头的？有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    可以，即多头门控（Multi-Head Routing）。将门控网络设计为多个独立的“头”，每个头负责将 token 路由到不同的专家子集，或者每个头产生一个路由决策维度。

    好处：

    - 更丰富的路由策略：不同头可以捕捉不同的路由依据（例如，一个头根据主题路由，另一个根据语法），从而组合出更精细的专家选择。

    - 增加路由容量：单头门控网络输出维度等于专家数 EE，参数量有限。多头可以扩大路由器的表达能力，更好地处理复杂输入。

    - 专家子集划分：可以将专家分组，每个头负责在一组专家内选择，实现层次化路由，降低 top-k 选择的组合复杂度。

    - 改善负载均衡：多头可以让某些头专注于均衡负载，而另一些头专注于精度。

    实例：一些研究（如 BASE Layers）使用多头门控来解耦路由中的不同特征。不过，简单的单头门控在实践中已足够有效，多头可能引入额外的复杂度和不稳定性，目前工业界主流仍为单头。


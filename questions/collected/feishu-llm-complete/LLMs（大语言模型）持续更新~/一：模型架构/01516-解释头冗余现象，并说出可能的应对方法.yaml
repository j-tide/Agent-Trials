content:
  prompt: 解释“头冗余”现象，并说出可能的应对方法。
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    现象表现：

    - 不同头的注意力权重分布高度相关（例如计算两两注意力图之间的余弦相似度，发现接近1）。

    - 剪掉某些头后，模型在下游任务上的指标几乎不变。

    - 在可视化中，多个头的注意力热点区域几乎一致。

    成因：

    - 模型容量过剩。dk=64dk=64 的头表达能力可能已经足够，额外的头找不到足够多样化的新模式去学习，被迫复制已有模式。

    - 训练动力学。某些头在初始化时偶然落入相同的吸引域，一直未能充分分化。

    应对方法：

    - 训练阶段：在损失函数中加入正则项，鼓励不同头的注意力分布差异（如最小化注意力权重矩阵的互信息或最大化它们之间的距离），强制头去学不同的模式。

    - 后训练剪枝：通过重要性评估，系统性地裁剪冗余头，压缩模型而不损失性能。

    - 架构改进：采用GQA等设计，从架构层面限制K、V的独立头数，减少可产生的冗余。

    - 更优的初始化策略：让不同头的投影矩阵初始化时具有更大的多样性，帮助它们更早地分化。


content:
  prompt: 分析 MQA 对模型训练稳定性的影响。
answer:
  mode: rubric
  reference_answer: |-
    MQA 通常不会对训练稳定性产生明显负面影响，反而在某些方面可能略有改善，但也有一些潜在问题。

    积极影响：

    - 减少参数冗余：由于去除了多个 K、V 投影矩阵，参数总量下降，优化的参数空间更紧凑，可能使梯度协方差矩阵更良性，训练更平稳。

    - 梯度聚合：所有头共享 K、V，反向传播时，损失对 K、V 的梯度是各头梯度之和。这可以视为一种隐式的梯度平均，有助于稳定更新方向，减少各头独立更新导致的震荡。


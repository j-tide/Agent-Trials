content:
  prompt: 写出一个实现可学习位置嵌入的 PyTorch 代码片段。
answer:
  mode: rubric
  reference_answer: "import torch\nimport torch.nn as nn\n\nclass LearnedPositionEmbedding(nn.Module):\n
    \   def __init__(self, max_seq_len, d_model):\n        super().__init__()\n        #
    创建一个可学习的嵌入矩阵，大小为 (max_seq_len, d_model)\n        self.position_embedding = nn.Embedding(max_seq_len,
    d_model)\n\n    def forward(self, x):\n        # x: 输入张量，形状 (batch_size, seq_len,
    d_model)\n        batch_size, seq_len, _ = x.size()\n        \n        # 生成位置索引
    [0, 1, ..., seq_len-1]\n        position_ids = torch.arange(seq_len, dtype=torch.long,
    device=x.device)\n        position_ids = position_ids.unsqueeze(0).expand(batch_size,
    seq_len)\n        \n        # 查找嵌入，形状 (batch_size, seq_len, d_model)\n        pos_emb
    = self.position_embedding(position_ids)\n        \n        # 直接与 token 嵌入相加\n
    \       return x + pos_emb\n\n# 示例用法\nmax_len = 512\nd_model = 768\nbatch_size
    = 4\nseq_len = 30\n\n# 随机生成一个 token 嵌入作为输入\ntoken_embeddings = torch.randn(batch_size,
    seq_len, d_model)\npos_encoder = LearnedPositionEmbedding(max_len, d_model)\n\noutput
    = pos_encoder(token_embeddings) # (4, 30, 768)\nprint(output.shape)"

content:
  prompt: 简述从原始 Transformer 到 GPT-1 在架构上的主要变化。
answer:
  mode: rubric
  reference_answer: |-
    GPT-1（Improving Language Understanding by Generative Pre-Training）直接采用了原始 Transformer 的解码器部分，并做了以下关键变化：

    - 仅保留解码器：GPT-1 完全丢弃了编码器部分，只使用 Transformer 的解码器。这使得它成为一个单向（自回归）语言模型，而非序列到序列模型。

    - 移除交叉注意力层：由于没有编码器，解码器中的交叉注意力子层被全部移除。每一层仅包含掩码自注意力和前馈网络。

    - 无监督预训练：原始 Transformer 是为有监督机器翻译训练的。GPT-1 采用大规模无标注文本进行语言建模预训练，学习通用的文本表示。

    - 任务特定微调：GPT-1 在预训练后，会针对下游任务（如分类、蕴含、相似度）进行微调。它将不同格式的任务输入统一处理，并添加一个额外的线性分类头。这与原始 Transformer 的有监督序列生成直接不同。

    - 输入表示：GPT-1 的输入是单一文本序列，而非源-目标对。使用字节对编码（BPE）处理文本，词表构建不同于原始 Transformer。

    - 位置编码：GPT-1 使用可学习的位置嵌入，而非正弦/余弦编码，与原始 Transformer 不同。

    总的来说，GPT-1 将 Transformer 从 seq2seq 架构转变为仅解码器架构，并通过预训练+微调范式开启了大规模语言模型的时代。其核心贡献在于验证了 Transformer 解码器在语言生成和通用表征学习上的巨大潜力。


content:
  prompt: 训练 GQA 模型时，是将 MHA 模型转换而来，还是从零开始训练？
answer:
  mode: rubric
  reference_answer: |-
    两种方式均可行，但主流做法是从零开始训练，或者基于 MHA 检查点进行继续训练（而非简单转换）。

    - 从零开始训练：直接按照 GQA 架构初始化模型并从头预训练。这是最直接的方法，如 LLaMA-2 70B 即从头训练为 GQA。它能保证所有权重完全适配 GQA 结构。

    - 从 MHA 转换：可以在已经训练好的 MHA 模型基础上，通过将多个 K、V 头的权重合并（例如平均池化或选择其中一个）来初始化 GQA 模型，然后进行少量继续训练以恢复性能。但这需要仔细的重参数化，且通常会有性能损失，尤其是当 MHA 各头 K、V 多样性较高时。因此，这种方法主要用于研究或资源受限的场景。

    - 更常见的实践：在大规模训练中，团队通常会在预训练早期就确定注意力架构（MHA、GQA 或 MQA），并从头训练，以确保模型充分适应。对于像 LLaMA-2 70B 这样的新模型，GQA 是其原生设计。

    总之，GQA 模型最好是从头预训练以完全发挥架构优势，除非有不得已的资源限制。


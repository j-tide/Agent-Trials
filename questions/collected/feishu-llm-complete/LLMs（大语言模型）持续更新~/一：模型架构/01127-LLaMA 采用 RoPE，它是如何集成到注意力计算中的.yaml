content:
  prompt: LLaMA 采用 RoPE，它是如何集成到注意力计算中的？
answer:
  mode: rubric
  reference_answer: |-
    LLaMA 在每一层自注意力的 Q 和 K 投影之后 施加 RoPE。

    集成步骤：

    - 输入 x 通过线性投影得到 Q、K、V。

    - 对 Q 和 K 的每个 token 位置 m，根据预设的频率 θ_i = 10000^{-2i/d} 计算旋转角度。

    - 将 Q 和 K 的向量维度两两成对，在每个二维子空间施加旋转：

    [图片内容未导入]

    - 对 K 做同样操作。

    - 然后计算旋转后的 QK^T，后续步骤与标准注意力相同。

    RoPE 的旋转是逐层应用的，位置信息融入了注意力分数，而 V 不施加旋转。


content:
  prompt: 画出滑动窗口注意力的掩码模式，并与标准因果掩码对比。
answer:
  mode: rubric
  reference_answer: |-
    标准因果掩码（n=8n=8 示例）：

    ```text
    K0 K1 K2 K3 K4 K5 K6 K7
    Q0 [  1, 0, 0, 0, 0, 0, 0, 0]
    Q1 [  1, 1, 0, 0, 0, 0, 0, 0]
    Q2 [  1, 1, 1, 0, 0, 0, 0, 0]
    Q3 [  1, 1, 1, 1, 0, 0, 0, 0]
    Q4 [  1, 1, 1, 1, 1, 0, 0, 0]
    Q5 [  1, 1, 1, 1, 1, 1, 0, 0]
    Q6 [  1, 1, 1, 1, 1, 1, 1, 0]
    Q7 [  1, 1, 1, 1, 1, 1, 1, 1]
    ```

    （1 表示可见，0 表示被掩码屏蔽）

    滑动窗口因果掩码（W=3W=3 示例）：

    ```text
    K0 K1 K2 K3 K4 K5 K6 K7
    Q0 [  1, 0, 0, 0, 0, 0, 0, 0]
    Q1 [  1, 1, 0, 0, 0, 0, 0, 0]
    Q2 [  1, 1, 1, 0, 0, 0, 0, 0]
    Q3 [  0, 1, 1, 1, 0, 0, 0, 0]
    Q4 [  0, 0, 1, 1, 1, 0, 0, 0]
    Q5 [  0, 0, 0, 1, 1, 1, 0, 0]
    Q6 [  0, 0, 0, 0, 1, 1, 1, 0]
    Q7 [  0, 0, 0, 0, 0, 1, 1, 1]
    ```

    每个 query 只能看到最近的 WW 个 key（包含自身）。

    核心区别：滑动窗口掩码将注意力限制在固定宽度的带状区域内，而标准因果掩码让每个 token 看到所有历史。


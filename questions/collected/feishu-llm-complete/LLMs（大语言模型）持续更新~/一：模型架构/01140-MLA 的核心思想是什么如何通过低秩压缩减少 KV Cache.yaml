content:
  prompt: MLA 的核心思想是什么？如何通过“低秩压缩”减少 KV Cache？
answer:
  mode: rubric
  reference_answer: |-
    MLA 的核心思想是：K 和 V 在多头之间是高度冗余的，可以用一个极低维的共享潜在向量来承载它们的公共信息，再通过轻量级的上投影为每个头恢复出定制的 K 和 V。

    [图片内容未导入]

    类比：标准 MHA 是每次查阅都去图书馆翻大部头书（读完整 K、V）；MLA 是只记下书的索书号（潜在向量），用的时候通过索书号快速定位并展开内容。索书号极小，但配合庞大的索引系统（上投影权重），能精确恢复原书。


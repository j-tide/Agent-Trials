content:
  prompt: 自注意力和多头注意力中，哪里用到了 Dropout？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - 注意力权重上：在 softmax 之后、与 V 相乘之前，对注意力概率矩阵 AA 施加 dropout。这会随机丢弃一些注意力连接，迫使模型不能只依赖某几个固定的 token 关系，学习到更鲁棒的上下文表示。这是多头注意力中最核心的 dropout 位置。

    - 每个子层的输出上（残差连接之前）：在每个自注意力子层和前馈网络子层的输出后，先进行 dropout，然后再与输入相加（即 x + Dropout(Sublayer(x))）。这会随机丢弃某些维度的特征，防止子层之间产生复杂的协同适应。

    - 嵌入层之后：在词嵌入与位置编码相加之后，进入第一个编码器/解码器层之前，施加 dropout。相当于对输入表示进行随机掩码。

    - 在前馈网络中：通常在两个线性层之间、激活函数之后，也加入 dropout。

    现代大规模预训练模型（如 LLaMA）由于数据量极其庞大，往往大幅降低 dropout 比例甚至完全去除，转而依赖数据本身的多样性来防止过拟合。但在中等规模训练或微调时，这些 dropout 位置仍然是重要的正则化手段。


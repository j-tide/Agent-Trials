answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    可学习参数 γ（缩放因子）和 β（偏移因子）的作用正是恢复这种被归一化剥夺的表达自由度。最终输出：

    [图片内容未导入]

    - γ 控制每个特征维度的标准差（尺度）。

    - β 控制每个特征维度的均值（偏移）。

    如果网络认为某层不需要归一化，理论上可以学习 γ=σ,β=μ 来还原原始激活值。因此，γ,β 使得归一化层成为一个恒等变换的超集，在不引入额外约束的前提下稳定训练。


content:
  prompt: MLA 的潜在维度如何选择？太大会怎样，太小会怎样？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - 压缩率极高，缓存极小。

    - 信息瓶颈过紧，可能无法保留足够的键值特征用于精确的注意力检索和值聚合，导致模型语言建模困惑度上升，下游任务性能下降。

    - 上投影矩阵可能难以弥补信息的严重丢失，出现欠拟合。

    [图片内容未导入]

    - 压缩率降低，缓存节余减少，MLA 的优势减弱。

    - 接近原始 K、V 的总维度时，MLA 退化为标准 MHA（但带有冗余的低秩结构），不但没有缓存收益，还额外增加了低秩投影的计算和参数开销。

    - 过大的潜在空间可能保留太多冗余信息，降低低秩正则化的益处。

    [图片内容未导入]

    关键是在性能和效率之间找到帕累托最优点，这依赖于模型规模、训练数据量和目标任务。


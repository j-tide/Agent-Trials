content:
  prompt: 解释 DeepSpeed-MoE 的改进，以及它对 MoE 训练的加速效果。
answer:
  mode: rubric
  reference_answer: |-
    DeepSpeed-MoE 是微软 DeepSpeed 框架中针对 MoE 的专门优化，主要改进包括：

    - 专家并行与数据并行的深度融合：通过在专家内部再使用数据并行，解决了专家过大或过多时的负载不均衡和通信问题。它允许将专家切分到多个设备，同时在这些设备上复制专家（类似数据并行），使得超大专家也能高效训练。

    - 层次化 All-to-All 通信：设计了多级通信策略，减少跨节点 All-to-All 的通信量。对于跨节点的专家，使用分层聚合，先在本节点内聚合再跨节点交换，减少带宽压力。

    - 动态负载均衡策略：除了辅助损失，还引入了基于 token 丢弃的机制来控制溢出，并智能调整容量因子，提升训练吞吐。

    - 与 ZeRO 3 结合：将 MoE 的参数和优化器状态也纳入 ZeRO 分区，进一步降低每张卡的显存占用，使得千亿级 MoE 模型训练成为可能。

    加速效果：DeepSpeed-MoE 可以实现接近线性的扩展效率，在数百 GPU 上训练万亿参数 MoE 时，计算吞吐接近密集模型同期的理论峰值，显著减少了空闲等待和通信开销。


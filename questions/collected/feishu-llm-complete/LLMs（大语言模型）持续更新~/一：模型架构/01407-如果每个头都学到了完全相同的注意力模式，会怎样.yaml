    实际危害：

    - 参数浪费：hh 倍的参数量只换来了单头的表达能力，效率极低。

    - 训练中可能发生模式坍塌：如果初始化不当或学习率过大，模型可能在训练早期就陷入这种对称解，之后难以逃逸。此时模型就永久丧失了对多种依赖关系建模的能力。

    - 对复杂任务不利：需要全局-局部、句法-语义等多层次建模的任务，在这种退化模型上表现会很差。

    实际模型中的真实情况：

    训练良好的 Transformer 通常会自然地分化出功能各异的头。但同时也存在相当比例的冗余头（功能重复或可以被其他头替代），这是模型可以被大量剪枝的理论基础。


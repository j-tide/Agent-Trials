content:
  prompt: 是否有一种模型可以同时进行双向和单向注意力？举例说明。
answer:
  mode: rubric
  reference_answer: |-
    可以，这类模型通常采用混合掩码（Hybrid Mask）或前缀机制，在同一模型中灵活切换或混合两种注意力模式。 典型代表有：

    - UniLM (Unified Language Model)：

    - Prefix LM（前缀语言模型）：

    - XLNet：

    这些模型证明了：掩码矩阵不需要是一个固定不变的下三角，它可以根据任务和位置动态调整，从而使同一个架构兼具编码器和解码器的优势。


content:
  prompt: 解释 MQA 为什么有助于长序列生成。
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - 显存占用大幅降低：允许在相同硬件上生成更长的序列，或处理更大的批处理，显著提升吞吐量。

    - 内存带宽压力减小：每次解码步骤需要从显存读取整个 KV Cache，更小的缓存意味着更低的带宽需求，直接提升推理速度（尤其受限于带宽的场景）。

    - 可扩展至超长上下文：例如，若 H=8，MQA 的缓存需求仅为 MHA 的 1/8，使模型可以轻松处理数万甚至数十万 token 的上下文，而不会 OOM。

    因此，MQA 是实现长文本对话、文档级生成等应用的关键技术之一。


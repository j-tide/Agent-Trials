    FlashAttention 的显存复杂度：

    - 存储 Q、K、V、输出 O：O(n⋅d)。

    - 不存储 S 和 P，而是存储 softmax 的归一化统计量（每行一个最大值和一个和，大小 O(n)），以及可选 dropout 的随机状态（O(n)）。

    - 因此 FlashAttention 的显存复杂度为 O(n)。


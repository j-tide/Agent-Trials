content:
  prompt: FFN 的参数量在全模型中占比多大？为什么这么大？
answer:
  mode: rubric
  reference_answer: |-
    在标准 Transformer 中，FFN 的参数量占整个模型（不含嵌入层）的约 2/3。

    [图片内容未导入]

    为什么这么大？

    - FFN 的隐藏维度需要足够大，以提供强大的特征变换和知识存储能力。大量研究表明，语言模型的知识（如事实、常识）主要存储在 FFN 的权重中。扩大 FFN 能够直接提升模型的记忆容量和表达能力。

    - 注意力层负责动态的上下文聚合，对参数量的需求相对更低（其优势在于并行和长程依赖建模）；而 FFN 是“静态”的知识库，需要更多参数来编码海量训练数据中的信息。

    - 在 Scaling Law 中，增大 FFN 维度是提升模型性能最经济有效的方式之一，因此现代大模型普遍维持甚至增大 FFN 的扩展比。


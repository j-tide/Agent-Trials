content:
  prompt: 目前有哪些模型沿袭了 T5 的架构思想？
answer:
  mode: rubric
  reference_answer: |-
    许多后续模型继承或发扬了 T5 的 Encoder-Decoder 和 Text-to-Text 框架：

    - BART：虽然去噪自编码目标与 T5 不同，但其 Encoder-Decoder 架构和预训练+微调范式与 T5 一脉相承。

    - mT5 / ByT5 / Flan-T5：直接基于 T5 架构，分别针对多语言、字节级处理、指令微调进行改进。

    - UL2：提出了混合去噪目标，在 T5 的基础上统一了多种预训练任务，使模型能灵活地在不同注意力掩码下工作。

    - PaLM-2 的预训练（部分）：谷歌的 PaLM-2 虽然最终以 Decoder-Only 为主，但其预训练过程中使用了 UL2 的混合目标，这继承了 T5 的任务统一思想。

    - 多模态 T5 变体：如 Flamingo-T5、FROMAGe 等，将 T5 的 Encoder-Decoder 扩展到视觉-语言任务，编码器处理图像，解码器生成文本。

    - LLaMA 并非 T5 直系，但：许多现代的指令微调和多任务训练策略（如将各种任务数据转为对话格式）都受到了 T5 “一切皆文本”思想的启发。

    这些模型展示了 T5 架构在多个方向的持久生命力。


    核心区别：GQA 是“用更少的头”，MLA 是“用更少的维度”。MLA 压缩得更彻底，因为它直接从向量的维度上做文章，而不是仅仅合并冗余的头。在极长上下文场景下，MLA 的收益远超 GQA。


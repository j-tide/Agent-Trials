content:
  prompt: 解释“Transformer 不具有时间/序列归纳偏置”这句话的含义。
answer:
  mode: rubric
  reference_answer: |-
    这句话指 Transformer 的自注意力机制本身对序列的“顺序”没有任何先验的假设或偏好。这与 RNN、CNN 形成鲜明对比：

    - RNN 的归纳偏置是 “时间递推性”：当前状态由前一个状态和当前输入决定，顺序自然地沿时间步传递，赋予了模型强烈的序列顺序先验。

    - CNN 的归纳偏置是 “局部性和平移等变性”：卷积核在局部窗口内操作，天然认为邻近位置的元素关系更密切，且模式可平移到任何位置。

    - Transformer 的自注意力机制，在没有位置编码的情况下，对于输入序列的任意排列都是等变的，它把序列视为一个无序的集合，不认为靠近的 token 一定有更紧密的关系，也不认为存在从左到右的时间流。

    这种缺乏归纳偏置既是缺点也是优点：

    - 缺点：必须依赖位置编码显式注入顺序信息，且对于局部性、时序因果等模式需要从大量数据中自己学习，在小数据下可能不如 RNN/CNN。

    - 优点：没有强加的人为先验，意味着模型可以更加灵活地从数据中学习任意复杂的依赖关系（包括长距离依赖），不受局部假设的限制。这也是为什么在大数据规模下，Transformer 的表现能够超越传统序列模型的原因之一。它是一张“白纸”，能拟合各种序列模式，但也更需要海量数据来“绘制”这张纸。


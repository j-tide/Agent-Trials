    PI 应用方式：

    [图片内容未导入]

    副作用：

    - 局部依赖受损：高频分量对于区分相邻 token（距离 1,2,3...）至关重要。PI 将高频的频率也等比例降低，导致相邻位置的旋转角度差异变小，模型难以捕捉精确的局部语法和短语结构。这是 PI 后通常需要少量长文本微调的原因。

    - 低频混淆：原本的低频被进一步压缩，可能将原本在训练中未见过的超长距离关系扭曲进训练分布，造成位置信息的混淆。


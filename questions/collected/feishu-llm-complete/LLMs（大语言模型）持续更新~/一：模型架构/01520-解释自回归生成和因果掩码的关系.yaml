content:
  prompt: 解释“自回归生成”和因果掩码的关系。
answer:
  mode: rubric
  reference_answer: |-
    自回归生成是指模型按时间步顺序，依次生成每个 token，并将已生成的 token 作为下一步的输入，其数学基础是概率的链式法则：

    [图片内容未导入]

    因果掩码正是这一约束在注意力机制中的实现。在训练时，我们将整个目标序列一次性输入模型，但通过掩码确保在计算位置 t 的输出时，模型只能注意到位置 1…t，位置 t+1 及之后的所有 attention score 被设为 −∞，权重为 0。这就等价于模拟了自回归生成的条件：每个位置只看到了“历史”。

    因此，因果掩码使得高效的并行训练成为可能：我们无需像 RNN 那样逐时间步串行训练，而是一次前向传播计算所有位置的输出，同时严格保持了自回归的逻辑一致性。没有因果掩码，自回归的生成模型就无法进行并行训练，或者会因信息泄露而学不到有意义的生成能力。


content:
  prompt: 解释“残差连接的直通路径”使模型在初期接近于一个浅层网络。
answer:
  mode: rubric
  reference_answer: |-
    在训练刚开始时，子层（注意力、FFN）的权重通常被初始化为较小的随机值。因此，子层输出 Sublayer(x)Sublayer(x) 的幅度很小。在残差公式 y = x + Sublayer(x) 中，y 主要由 x（恒等映射）贡献。这意味着信号几乎可以不加改变地穿过所有层。

    对于整个深度网络，输入信号可以沿着残差连接的“直通路径”一路传递到输出层，几乎不受中间层的影响。因此，模型在训练初期的行为非常类似于一个极浅的网络（甚至接近线性模型），因为大部分非线性层尚未开始显著改变数据流。随着训练进行，子层的贡献逐渐增大，网络才逐步利用其深度进行复杂的非线性建模。

    这种性质使得模型可以从简单的函数开始学习，然后平滑地增加复杂度，极大降低了优化难度。


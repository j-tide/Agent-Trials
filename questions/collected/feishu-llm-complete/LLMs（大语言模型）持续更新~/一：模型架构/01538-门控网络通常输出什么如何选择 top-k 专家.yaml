content:
  prompt: 门控网络通常输出什么？如何选择 top-k 专家？
answer:
  mode: rubric
  reference_answer: |-
    门控网络输出：

    - 一个形状为 [batch_size, seq_len, E] 的 logits 张量（E 为专家总数），通过一个简单的线性层 W_g x 得到（通常无偏置，W_g 尺寸 [d_model, E]）。

    - 对 logits 应用 softmax 得到每个 token 对于每个专家的概率分布 p_i。

    选择 top-k 专家的过程：

    - 将 logits 或概率值作为每个专家的“得分”。

    - 根据得分大小，为每个 token 独立地选取得分最高的 k 个专家索引（通常 k=1 或 k=2）。

    - 获取这 k 个专家对应的门控权重（即它们的 softmax 概率值），通常会重新归一化（只在这 k 个专家之间重新计算概率分布，使其和为 1）。

    - 将该 token 分别发送给这 k 个专家，每个专家对其输入进行计算并输出；最终的输出是这 k 个专家输出的加权和（权重为归一化后的门控值）。

    - 未被选中的专家在该 token 上不进行计算，不产生激活。

    对于 k=1 的情况（如 Switch Transformer），只选最高专家，计算最简；对于 k=2（如 Mixtral），两个专家共同贡献，表达更平滑。


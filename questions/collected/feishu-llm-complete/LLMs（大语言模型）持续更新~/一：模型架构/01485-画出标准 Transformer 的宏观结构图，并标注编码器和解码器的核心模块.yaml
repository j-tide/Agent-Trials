content:
  prompt: 画出标准 Transformer 的宏观结构图，并标注编码器和解码器的核心模块。
answer:
  mode: rubric
  reference_answer: |-
    （由于纯文本无法真正绘图，这里用文字描述标准 Transformer 的结构，并标注核心模块，读者可据此绘制。）

    宏观结构描述：

    编码器（左侧）：

    - 由 N 个完全相同的层堆叠而成。

    - 每一层包含两个子层：

    - 多头自注意力（Multi-Head Self-Attention）

    - 逐位置的前馈神经网络（Position-wise Feed-Forward Network）

    - 每个子层后都接有 残差连接（Add） 和 层归一化（Layer Normalization, Norm），即“Add & Norm”。

    解码器（右侧）：

    - 同样由 N 个完全相同的层堆叠而成。

    - 每一层包含三个子层：

    - 掩码多头自注意力（Masked Multi-Head Self-Attention）：确保对位置 i 的预测只能依赖小于 i 的位置的已知输出。

    - 多头交叉注意力（Multi-Head Cross-Attention）：对编码器的输出进行注意力计算，将编码器表示融入解码器。

    - 逐位置的前馈神经网络（Position-wise Feed-Forward Network）

    - 每个子层后同样接有残差连接和层归一化。

    输入和输出：

    - 编码器输入：源序列的嵌入加上位置编码（Positional Encoding）。

    - 解码器输入：目标序列的嵌入加上位置编码（训练时整体右移一位，推理时自回归）。

    - 解码器最后通过线性层和 softmax 得到输出概率。


    RoPE 在第 ii 个维度对（i=0,1,…,d/2−1）的旋转频率为：

    [图片内容未导入]

    其中 d 是向量维度（通常为 head_dim，如 64, 128）。

    频率特性：

    [图片内容未导入]

    这种指数衰减的频率设计使得低维度对捕捉短距离局部模式，高维度对捕捉长距离全局依赖。类似于信号处理中的多分辨率分析。

    与序列长度的关系：

    - 频率设计决定了模型“感受野”的范围。最低频率对应的波长决定了模型在训练长度内能够区分的最大相对距离。

    - 当序列长度超过最低频率对应的波长时，极低频分量几乎成为常数，无法再提供有效的位置区分能力，导致外推失效。这是 RoPE 需要扩展的根本原因。


answer:
  mode: rubric
  reference_answer: |-
    添加方式：

    在每个子层（自注意力层、前馈网络层）周围，都有一个残差连接。具体操作是：

    [图片内容未导入]

    重要性：

    - 解决深层网络的退化问题：残差连接允许梯度直接通过跳跃连接流向浅层，有效缓解了深层网络中的梯度消失问题，使得堆叠非常深的 Transformer（如几十层）成为可能。

    - 提供恒等映射能力：网络可以将注意力或 FFN 层的权重学习得非常小，从而“跳过”该层，即网络至少不会比浅层网络差，保证了深层训练的稳定性。

    - 加速收敛：优化深层网络时，残差结构使得损失面更平滑，模型更容易训练。


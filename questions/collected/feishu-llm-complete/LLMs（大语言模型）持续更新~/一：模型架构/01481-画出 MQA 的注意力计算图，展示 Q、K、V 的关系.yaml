content:
  prompt: 画出 MQA 的注意力计算图，展示 Q、K、V 的关系。
answer:
  mode: rubric
  reference_answer: "计算流程（文字描述）：\n\n```text\n输入 X  (shape: [seq_len, d_model])\n    |\n
    \   |--- 投影 Q (h 组): Q_i = X W_{Q,i} ,  i = 1..h   (各头独立)\n    |--- 投影 K (共享):
    \ K = X W_K                     (所有头共享)\n    |--- 投影 V (共享):  V = X W_V                     (所有头共享)\n
    \   \n对于每个头 i:\n    scores_i = Q_i K^T / sqrt(d_k)\n    attn_i = softmax(scores_i)\n
    \   head_i = attn_i V\n\n拼接所有 head_i (或求和，但通常是拼接后再经输出投影)\n    MultiHead_output
    = Concat(head_1, ..., head_h) W_O\n```\n\n与 MHA 不同的是，K 和 V 只计算一次，每个头都使用相同的 K 和
    V，仅 Q 不同。这相当于每个头用不同的视角去“查阅”同一份资料。\n\n---"

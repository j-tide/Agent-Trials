    为什么不能直接拼接就结束？

    拼接只是把各头的信息“物理上”放在一起，但各头之间的信息是相互隔离的，它们之间没有发生任何交互。如果不做线性投影，下一层就只能在“这些是来自不同头的信息”这种割裂状态下工作。


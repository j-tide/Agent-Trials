content:
  prompt: 在 MQA 中，K 和 V 的投影矩阵形状有什么变化？
answer:
  mode: rubric
  reference_answer: |-
    与标准 MHA 相比，MQA 中 K 和 V 的投影矩阵形状发生了显著改变：

    [图片内容未导入]

    因此，W_K 和 W_V 的列数从 H * d_k 缩小为 d_k，参数数量减少为原来的 1/H1/H。例如，若 H=8, d_model=512, d_k=64，则 MHA 的 K 投影矩阵大小为 512×512，MQA 为 512×64，参数量减少 87.5%。这是 MQA 能降低训练和推理内存的另一个来源。


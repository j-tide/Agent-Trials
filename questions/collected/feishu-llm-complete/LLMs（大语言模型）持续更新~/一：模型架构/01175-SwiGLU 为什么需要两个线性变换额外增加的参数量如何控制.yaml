content:
  prompt: SwiGLU 为什么需要两个线性变换？额外增加的参数量如何控制？
answer:
  mode: rubric
  reference_answer: |-
    为什么需要两个线性变换：

    SwiGLU 的门控机制需要同时计算“信息”和“门控”两个不同的表示。这两个表示通常需要从输入中提取不同的特征组合，因此使用两个独立的线性变换是自然的：一个学习如何生成信息，另一个学习如何生成门控。共享权重将迫使两者耦合，失去门控的灵活性，削弱表达能力。


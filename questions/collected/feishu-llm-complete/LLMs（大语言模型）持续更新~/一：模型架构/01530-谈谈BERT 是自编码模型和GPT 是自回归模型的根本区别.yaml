content:
  prompt: 谈谈“BERT 是自编码模型”和“GPT 是自回归模型”的根本区别。
answer:
  mode: rubric
  reference_answer: |-
    这一区分源于它们的预训练目标和建模方式的本质不同：

    - 自回归模型（GPT）：基于概率的链式法则，将文本的联合概率分解为条件概率的乘积：

    [图片内容未导入]

    - 它按照时间步单向地生成（或预测）序列中的每个 token，只能利用过去的上下文。训练目标是最大化这个单向的条件概率。这天然适合文本生成任务。

    - 自编码模型（BERT）：不显式地建模联合概率，而是通过去噪自编码思想进行表示学习。具体来说，它通过 MLM 任务将输入序列中的部分 token 损坏（掩码或替换），然后训练模型从损坏的版本中重建原始 token。这可以看作是一种降噪自编码器：输入是被噪声污染的序列，目标是还原出干净的原始序列。BERT 通过双向注意力利用全局上下文来推断被掩码的词，其目标是学习强大的上下文表示，而非像自回归那样显式地建模序列的概率。

    根本区别：自回归模型追求“根据过去预测未来”，具有因果方向性和生成能力；自编码模型追求“从噪声中恢复原貌”，利用双向上下文进行表示学习，理解能力强但缺乏直接的生成能力。一个形象比喻：GPT 是作家，一句句往下写；BERT 是编辑，看到全文后能补全空缺或纠正错误。


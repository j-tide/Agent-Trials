content:
  prompt: FFN 通常先将维度扩大几倍？这个放大倍数是固定的吗？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    但这个倍数不是绝对固定的，可以根据模型规模、计算预算和任务需求进行调整：

    - 一些轻量级模型会使用 2 倍或 3 倍的扩展比以减少参数量。

    - 大型模型（如 GPT-3、LLaMA-70B）通常保持 4 倍，因为足够大的 FFN 是模型容量的重要保证。

    [图片内容未导入]

    - 某些高效 Transformer 变体（如 MobileBERT）采用瓶颈结构，先降维再升维。

    因此，4 倍是经验上的甜区，在容量和计算效率之间取得了良好平衡，但并非不可动摇。


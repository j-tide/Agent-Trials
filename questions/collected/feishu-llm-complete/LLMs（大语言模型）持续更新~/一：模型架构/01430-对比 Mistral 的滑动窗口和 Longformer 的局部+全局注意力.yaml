    对比总结：Mistral 的滑动窗口是追求极致效率和简洁性的设计，适合自回归生成，通过深度换取长程覆盖；Longformer 的混合注意力通过全局 token 提供更稳健的远程交互，适合需要强全局理解的任务。两者可互补，Mistral 的生成能力若融合 Longformer 的全局 token，将进一步提升长程性能。


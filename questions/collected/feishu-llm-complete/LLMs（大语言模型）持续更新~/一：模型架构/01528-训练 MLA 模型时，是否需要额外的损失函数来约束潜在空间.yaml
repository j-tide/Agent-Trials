content:
  prompt: 训练 MLA 模型时，是否需要额外的损失函数来约束潜在空间？
answer:
  mode: rubric
  reference_answer: |-
    不需要。 MLA 完全通过标准的下一个 token 预测损失来端到端训练。低秩结构只是一个架构上的约束，梯度自然通过上投影矩阵流回潜在向量，模型自动学习如何利用这个信息瓶颈。

    没有辅助损失、没有正则项、没有特殊的初始化。这正是 MLA 的工程优势之一——训练流程与标准 Transformer 几乎一致。


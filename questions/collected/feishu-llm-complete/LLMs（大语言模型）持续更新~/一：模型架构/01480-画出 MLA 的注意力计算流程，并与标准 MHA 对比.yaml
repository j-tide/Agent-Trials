content:
  prompt: 画出 MLA 的注意力计算流程，并与标准 MHA 对比。
answer:
  mode: rubric
  reference_answer: |-
    标准 MHA：

    ```text
    x → W_Q → Q (独立头)
    x → W_K → K (独立头) → [缓存 K]
    x → W_V → V (独立头) → [缓存 V]
    Q, K, V → Attention → O
    ```

    缓存的是高维的 K、V。

    MLA：

    ```text
    x → W_down → c_kv (低维) → [缓存 c_kv]
    c_kv → W_up^K → K (所有头)
    c_kv → W_up^V → V (所有头)
    x → W_Q → Q (或同样低秩压缩)
    Q, K, V → Attention → O
    ```

    [图片内容未导入]


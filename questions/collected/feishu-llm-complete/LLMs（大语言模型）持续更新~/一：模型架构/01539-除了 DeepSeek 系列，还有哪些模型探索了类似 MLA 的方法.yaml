content:
  prompt: 除了 DeepSeek 系列，还有哪些模型探索了类似 MLA 的方法？
answer:
  mode: rubric
  reference_answer: |-
    低秩压缩注意力缓存的想法并非孤例，多个研究方向与此有交集：

    - Linformer（2020）：通过低秩投影将 K 和 V 的序列长度维度压缩到固定小尺寸，实现线性复杂度。它与 MLA 压缩的维度不同（压缩序列长度 vs. 压缩特征维度），但都利用了低秩结构。

    - Performer（2020）：使用随机正交特征映射来近似 softmax 核，隐式地对注意力矩阵进行低秩近似，避免计算完整的 n×nn×n 矩阵。

    - LoRA（Low-Rank Adaptation）：微调时在预训练权重旁添加低秩支路。这虽非直接压缩缓存，但证明了低秩结构在 Transformer 中的有效性和普适性。

    - 多模态模型中的 Perceiver：使用极小的潜在向量池来交叉关注高维输入，思想类似于用低维瓶颈压缩信息。

    - 一些自研的工业界方案：大型科技公司在内部可能试验了类似 MLA 的缓存压缩技术，但未公开发表。MLA 是第一个在大规模公开模型上将这一思想系统化并取得巨大成功的案例。

    MLA 的独特之处在于，它显式地将低秩压缩应用于 K 和 V 的特征维度，并以极简的设计（共享潜在空间 + 解耦位置编码）实现了推理缓存的几十倍压缩，同时保持了强大的模型性能。


content:
  prompt: 在 Transformer 中，LayerNorm 通常加在哪些位置？
answer:
  mode: rubric
  reference_answer: |-
    原始 Transformer（Post-Norm）将 LayerNorm 放在残差连接之后：

    [图片内容未导入]

    即每个注意力子层或 FFN 子层的输出先与输入相加，再经过 LayerNorm。

    现代 Transformer（Pre-Norm）则将其放在子层之前：

    [图片内容未导入]

    即先对输入归一化，再进入注意力或 FFN，最后残差相加。Pre-Norm 训练更稳定，成为 LLM 主流。

    所以，LayerNorm 出现在每个子层（注意力前/后、FFN 前/后），通常每层有两个 LayerNorm（注意力一个、FFN 一个），外加最终输出前的 LayerNorm（某些模型有）。


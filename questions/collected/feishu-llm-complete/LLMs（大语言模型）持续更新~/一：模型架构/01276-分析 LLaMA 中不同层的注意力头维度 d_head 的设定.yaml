content:
  prompt: 分析 LLaMA 中不同层的注意力头维度 d_head 的设定。
answer:
  mode: rubric
  reference_answer: |-
    LLaMA 的所有层使用统一的头维度（d_head），而不是不同层使用不同维度。具体设定如下：

    - 对于 LLaMA 的所有变体，模型隐藏维度 d_model 和头数 h 满足 d_head = d_model / h。

    - 标准配置：

    关键点：LLaMA 始终保持 d_head = 128，因此不同规模模型通过调整 d_model 和头数 h 来保持头维度恒定。128 是一个经验上的甜区，既能保证每个注意力头的表达能力（不至于太窄），又能使多头机制发挥优势（不至于太宽导致头数过少）。这种设计简化了架构搜索，并在各种规模下都表现良好。


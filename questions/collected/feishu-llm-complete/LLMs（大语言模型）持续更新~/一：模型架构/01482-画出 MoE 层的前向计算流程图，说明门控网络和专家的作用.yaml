content:
  prompt: 画出 MoE 层的前向计算流程图，说明门控网络和专家的作用。
answer:
  mode: rubric
  reference_answer: |-
    流程图（文本描述）：

    ```text
    输入 token x (shape: [d_model])
           |
           v
       门控网络 G (通常为一个线性层)
           |
           v
       路由器输出 logits: z = W_g x  (shape: [num_experts])
           |
           v
       Softmax 得到专家概率分布 p = softmax(z)
           |
           v
       根据 p 选择 Top-k 个专家（如 k=1 或 2）
       并获取对应的门控权重 g_i
           |
           +---> 专家 1 (FFN_1) ---> 输出 y1，乘以门控权重 g1
           |
           +---> 专家 k (FFN_k) ---> 输出 yk，乘以门控权重 gk
           |
           v
       将 k 个专家输出加权求和： y = Σ g_i * FFN_i(x)
           |
           v
       输出 y (shape: [d_model])
    ```

    [图片内容未导入]

    门控网络的作用：

    - 它是一个小型可学习的路由决策模块。对于每个 token，门控网络评估其内容特征，输出每个专家的“相关度分数”。它负责将不同的 token 动态分配给最合适的专家，是实现条件计算的核心。

    专家的作用：

    - 每个专家是一个完整的 FFN（例如 SwiGLU 结构），拥有独立权重。不同的专家在训练中会自然分化为处理不同类型输入（如不同领域、不同语言、不同语法模式）的专门模块。它们共同构成了一个庞大的参数池，而每个 token 只使用其中极少数，从而实现了巨大的模型容量和适中的计算开销。


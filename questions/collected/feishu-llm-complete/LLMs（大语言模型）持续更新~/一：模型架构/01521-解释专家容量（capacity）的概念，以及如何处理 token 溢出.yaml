content:
  prompt: 解释专家容量（capacity）的概念，以及如何处理 token 溢出。
answer:
  mode: rubric
  reference_answer: |-
    专家容量（Expert Capacity） 是指每个专家在一个批次中能够处理的最大 token 数量。由于硬件约束（固定大小的缓冲区），每个专家的输入必须被限制在一定数量内，否则会导致内存溢出和无法并行。

    计算公式：

    [图片内容未导入]

    其中 total tokens 是批次中的 token 总数，k 是 top-k 值，E 是专家数，γ 是容量因子（capacity factor，通常为 1.0 到 1.5）。γ=1.0 表示容量刚好满足平均分配；大于 1 则留有余量。

    token 溢出的处理：

    当某个专家的实际分配 token 数超过其容量时，多出的 token 会被丢弃。被丢弃的 token 不经过该专家处理，而是直接通过残差连接传递到下一层（即该 token 在该层的 MoE 输出为零向量，仅保留原始输入）。这可能会导致信息损失，但通过设置合适的容量因子和辅助损失，通常可以将溢出率控制得很低（如 <1%）。

    一些实现也可能动态增大容量或者将溢出 token 重新路由，但为了计算效率，大多采用丢弃策略，并在训练时容忍少量溢出。


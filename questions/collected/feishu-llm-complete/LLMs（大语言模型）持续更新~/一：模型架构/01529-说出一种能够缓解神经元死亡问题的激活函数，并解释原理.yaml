content:
  prompt: 说出一种能够缓解“神经元死亡”问题的激活函数，并解释原理。
answer:
  mode: rubric
  reference_answer: |-
    Leaky ReLU 是一个经典解决方案，其定义为：

    [图片内容未导入]

    其中 α 是一个小的正数（如 0.01），固定或可学习。

    原理：

    - 在负半轴，Leaky ReLU 输出 αx 而非 0，导数恒为 α（而非 0）。即使神经元输出持续为负，梯度仍能通过 α 反向传播，权重可以更新，从而有机会在后续迭代中“复活”，跳出负激活区。

    - 这从根本上解决了 ReLU 的“死亡”问题：只要 α>0，梯度永远不会完全消失，神经元不会永久性失活。

    - 固定 α（如 0.01）简单有效；可学习 α（PReLU）则让模型自行决定负半轴的最佳斜率，进一步提升灵活性。

    其他缓解方案还有 ELU（负半轴指数衰减至一个负数常数，输出均值接近零）和 SELU（自归一化），它们通过非零负输出保证梯度流动，从而避免神经元死亡。


  prompt: RoPE 的计算复杂度高吗？是否会成为推理瓶颈？
answer:
  mode: rubric
  reference_answer: |-
    计算复杂度极低，不会成为推理瓶颈。

    [图片内容未导入]

    在推理时，RoPE 的计算只占总延迟的极小部分，主要瓶颈仍是注意力矩阵的计算和 KV 缓存读写。因此，RoPE 不仅不是瓶颈，反而因为其结构简单，可以与 FlashAttention 等高效实现无缝集成，甚至在线计算也不会增加明显开销。


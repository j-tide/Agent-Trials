answer:
  mode: rubric
  reference_answer: |-
    掩码策略：

    - 随机选择输入序列中 15% 的 token。

    - 对这些选中的 token：

    恢复过程：

    - 经过多层双向 Transformer 编码后，被掩码位置（以及所有位置）的输出隐藏向量会融合整个句子的上下文信息。

    - 每个被掩码位置的隐藏向量被送入一个线性分类头（通常与词嵌入矩阵共享权重），输出一个词表大小的 logits 向量。

    - 取 logits 的 argmax 或 softmax 后的最高概率词作为预测。

    损失计算：

    - 仅在被选中的 15% 的 token 位置上计算交叉熵损失，其余 token 被忽略（loss mask 为 0）。


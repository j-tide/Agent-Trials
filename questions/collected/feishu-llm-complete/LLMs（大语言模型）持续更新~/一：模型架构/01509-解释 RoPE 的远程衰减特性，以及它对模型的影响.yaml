content:
  prompt: 解释 RoPE 的“远程衰减”特性，以及它对模型的影响。
answer:
  mode: rubric
  reference_answer: |-
    远程衰减是指：随着两个 token 的相对距离增大，它们之间的注意力分数（在无内容交互时）整体呈现衰减趋势。

    数学解释：

    [图片内容未导入]

    对模型的影响：

    - 积极影响：远程衰减是一种符合语言直觉的归纳偏置——越远的上下文对当前 token 的影响通常越小。这有助于模型形成局部注意力优先，同时保留捕捉远距离强依赖的能力。

    - 外推时的双刃剑：当序列长度远超训练长度时，极低频分量开始生效，远程衰减曲线可能变得不平滑甚至出现反弹（某些距离上的注意力异常增强），导致模型注意力模式混乱。因此，扩展 RoPE 时需要保持远程衰减的平滑性。


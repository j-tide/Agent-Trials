content:
  prompt: 绝对位置编码能否学习到“相对距离”信息？解释原因。
answer:
  mode: rubric
  reference_answer: |-
    能。无论是固定的正弦编码，还是可学习的位置嵌入，都能在一定程度上让模型学到相对距离信息。 这并非绝对编码的专利，只是相对编码（RoPE， ALiBi）做得更显式、更高效。

    原因解释：

    - 正弦编码的内建机制：如前所述，正弦编码的数学性质决定了PE（pos+k）可以通过一个仅与k相关的旋转矩阵作用于PE（pos）得到。这意味着，位置i和j的编码点积PE（i）·PE（j）仅依赖于它们的相对距离|i-j|。当这些编码与Q/K投影矩阵交互时，模型可以学会提取这种点积中的距离信息。本质上，正弦编码为相对距离的学习提供了一个完美的数学“脚手架”。

    - 可学习嵌入的经验学习：对于可学习嵌入，虽然没有预设的数学结构，但模型通过海量数据的训练，可以靠蛮力学到相对关系。一个被训练来预测下一个词的语言模型，其损失函数会惩罚所有预测错误的token。为了准确地预测位置t的词，模型的注意力机制必须学会识别出位置t-1、t-2等信息最丰富的位置。在这个过程中，模型会调整位置嵌入的权重，使得例如W_Q * pe（t）和W_K * pe（t-1）的点积值变大。经过万亿次训练，这种与相对距离相关的权重模式就被内化到了位置嵌入和注意力权重矩阵之中。

    - 关键区别：绝对编码学到的是特定上下文中的相对距离模式（例如，“在一段英文文本中，当前词与它前面第1-3个词最相关”）。而相对编码则是直接建模“距离”这个概念本身，是一种结构化的归纳偏置，因此更通用、外推性更强。


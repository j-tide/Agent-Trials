content:
  prompt: 稀疏 MoE 与稠密 MoE 的区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    - 稀疏 MoE（Sparse MoE）：每个输入 token 仅激活一个或极少数专家（top-k，k ≪ E）。这是目前主流 MoE 实现（如 Switch Transformer、Mixtral）。稀疏 MoE 大幅减少了每个 token 的计算量，但需要复杂的路由和负载均衡机制来保证专家有效利用。

    - 稠密 MoE（Dense MoE）：每个 token 会经过所有专家的计算，然后对所有专家输出进行加权平均（权重由门控输出）。稠密 MoE 没有稀疏性带来的计算节省，其计算量随专家数线性增长，因此在现代大模型中基本不被采用。历史上，MoE 的早期工作（如 1991 年的原始 MoE 概念）多指稠密版本，但如今的“MoE”几乎总是指稀疏版本。

    稀疏 MoE 的优势：计算量与专家总数无关，仅与激活专家数有关，能够极大幅度地扩展模型容量而不增加推理成本。


content:
  prompt: 谈谈你对“下三角掩码 + 稀疏注意力”结合使用场景的理解。
answer:
  mode: rubric
  reference_answer: |-
    下三角掩码保证了因果性，而稀疏注意力（如局部窗口注意力、扩张注意力、随机稀疏注意力）则通过限制每个 token 可关注的 token 范围，来降低计算和存储的 O(n2) 复杂度。两者结合是长序列自回归生成的关键技术，但需要精心设计以保证因果性不被破坏。

    结合方式：在定义稀疏注意力模式时，必须确保这个模式本身是因果的——即对于任何位置 i，其可关注的集合 Si⊆{0,1,...,i}。例如：

    - 滑动窗口注意力：每个 token 只关注它前面大小为 W 的窗口内的 token，天然满足因果性。

    - 扩张滑动窗口：使用膨胀率，周期性地扩大感受野，仍只看向过去。

    - 全局 token + 局部窗口：指定少数全局 token 可以被所有位置看到，局部 token 仅窗口可见，全局 token 也可以看到全局 token 的过去。

    典型应用场景：

    - 长文本/长视频生成：如生成小说、高分辨率视频，需要极长序列建模。标准 Transformer 无法承受二次复杂度，稀疏+因果的组合可以在保持生成质量的同时将复杂度降至 O(n) 或 O(nlog⁡n)。

    - 大模型推理加速：Longformer、Sparse Transformer 等模型使用预定义的稀疏因果模式，使得长文本生成的速度和内存大幅优化。

    - 多尺度建模：在底层使用局部窗口捕捉精细信息，在高层引入稀疏的全局注意力捕捉长程依赖，形成层次化的因果建模。

    关键挑战：稀疏模式的设计需要平衡效率与感受野。过于激进的稀疏可能丢失关键的长程依赖，导致生成内容前后矛盾。因此，往往需要与记忆机制（如 Transformer-XL 的片段级递归）或外部记忆库结合使用。


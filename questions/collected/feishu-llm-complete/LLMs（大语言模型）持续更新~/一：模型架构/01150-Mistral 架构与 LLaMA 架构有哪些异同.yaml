content:
  prompt: Mistral 架构与 LLaMA 架构有哪些异同？
answer:
  mode: rubric
  reference_answer: |-
    相同点：

    - 均采用 Decoder-Only 架构，Pre-Norm 结构。

    - 使用 RMSNorm 而非 LayerNorm。

    - FFN 采用 SwiGLU 激活函数。

    - 使用 RoPE 旋转位置编码。

    - 线性层均无偏置（bias）。

    - 相同规模的模型，头维度 d_head 均为 128。

    核心区别：

    [嵌入表格未展开]

    Mistral 的核心创新在于滑动窗口注意力，这使得它在长文本推理上具有天然优势，无需复杂的长度扩展技术。


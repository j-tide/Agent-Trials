content:
  prompt: 有哪些知名模型使用了 ALiBi？请举例。
answer:
  mode: rubric
  reference_answer: |-
    - BLOOM：BigScience 项目的大型多语言语言模型（176B 参数），完全采用 ALiBi 作为位置编码方案，证明了 ALiBi 在超大规模下的有效性。

    - MPT 系列（MosaicML 的预训练 Transformer）：如 MPT-7B、MPT-30B，它们使用 ALiBi 并以此获得了极强的外推能力，支持在极长上下文上进行训练和推理。

    - BLOOMZ / mT0：基于 BLOOM 的指令微调变体，自然也继承了 ALiBi。

    - 一些研究性模型如 XGLM、GLM 的早期版本等也曾使用或借鉴 ALiBi 思想。

    这些模型普遍利用 ALiBi 的免训练外推特性，在长文本任务上展现出优异性能。


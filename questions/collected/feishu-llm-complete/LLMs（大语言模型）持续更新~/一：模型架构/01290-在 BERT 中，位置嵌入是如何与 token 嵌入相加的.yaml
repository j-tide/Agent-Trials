answer:
  mode: rubric
  reference_answer: |-
    BERT 使用三种嵌入的求和作为模型的底层输入：

    [图片内容未导入]

    [图片内容未导入]

    相加后不进行任何缩放或变换，直接输入到 Transformer 的编码器第一层。

    关键点：

    - 所有这些嵌入都是可学习的参数，在预训练和微调过程中通过反向传播联合优化。

    - 由于位置嵌入的最大长度为 512，BERT 不能直接处理超过 512 个 token 的序列。对于更长文本，通常采用截断、滑动窗口或层次化方法。

    - 这种三嵌入相加的方式是 BERT 类模型的标准输入构造，后续的 RoBERTa、ALBERT 等模型基本沿用了类似设计（ALBERT 中为了压缩参数，将 Token Embedding 分解，但位置嵌入仍是独立的可学习矩阵）。

    总结：BERT 的位置嵌入是可学习的，维度与词嵌入相同，通过简单的加法与词义和段落信息融合，使模型在每一层都能感知到 token 的顺序。


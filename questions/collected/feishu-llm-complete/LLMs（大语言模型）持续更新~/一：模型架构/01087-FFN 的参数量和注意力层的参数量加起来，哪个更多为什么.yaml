content:
  prompt: FFN 的参数量和注意力层的参数量加起来，哪个更多？为什么？
answer:
  mode: rubric
  reference_answer: |-
    FFN 的参数量更多，约占整个 Transformer 层（不含嵌入层）总参数量的 2/3。

    [图片内容未导入]

    为什么 FFN 更大？

    FFN 需要巨大的隐藏维度来提供足够的特征变换能力和知识存储空间。注意力层主要负责动态的上下文聚合，对参数量的需求相对较低（因为它的计算优势在于并行和长程依赖）；而 FFN 作为模型的知识库，必须拥有海量参数才能记忆海量训练数据中的事实和语言模式。


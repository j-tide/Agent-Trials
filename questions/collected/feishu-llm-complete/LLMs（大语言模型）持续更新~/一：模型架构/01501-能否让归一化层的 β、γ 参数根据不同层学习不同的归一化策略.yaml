content:
  prompt: 能否让归一化层的 β、γ 参数根据不同层学习不同的归一化策略？
answer:
  mode: rubric
  reference_answer: |-
    可以，且这正是它们被设计为可学习参数的初衷。

    每一层的 γ 和 β 是独立学习的，因此不同层可以（且会）学到不同的缩放和偏移策略。实际上：

    - 浅层可能学到 γ 接近 1、β 接近 0，保持归一化后的标准分布，将输入稳定地传递给后续层。

    - 深层可能根据任务需要，学到不同的 γ 和 β 值，以放大或抑制某些特征维度的信息，甚至恢复被归一化压缩的表达空间。

    这赋予网络极大的灵活性：每层可以根据自己的角色和位置自适应地调整归一化强度，从“几乎不做归一化”（γ 学习到接近输入的 std，β 接近 mean）到“强归一化”均可。


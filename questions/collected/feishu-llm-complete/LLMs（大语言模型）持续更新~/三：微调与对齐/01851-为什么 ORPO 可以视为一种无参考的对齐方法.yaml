content:
  prompt: 为什么 ORPO 可以视为一种“无参考”的对齐方法？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    ORPO 巧妙地绕开了对参考模型的需求。它通过引入 Odds Ratio 这个概念，利用模型当前的预测概率，直接比较了它对 chosen 和 rejected 回复的“确信度”（odds）。这个比较完全不依赖任何外部基准，而是模型自身内部的“自省”。

    “无参考”的实现机制：
    ORPO 的 L OR 项为：

    [图片内容未导入]

    这里的核心是，对 chosen 回复的鼓励和对 rejected 回复的惩罚，都只与模型当前的预测概率有关。odds 值天然地惩罚了 rejected 回复（因为其概率越低，odds 越低），同时奖励了 chosen 回复。这种内在的奖惩机制使得 ORPO 无需一个外部的 Reference Model 来告诉它“你的起点在哪里”，它自己就能通过比较两种回复的概率，判断出优劣并进行自我修正。

    因此，ORPO 的“无参考”特性不仅简化了架构，更代表了一种哲学上的转变：模型的对齐，不再需要与“过去的自己”进行对比，而是可以直接通过“明辨是非”来实现。


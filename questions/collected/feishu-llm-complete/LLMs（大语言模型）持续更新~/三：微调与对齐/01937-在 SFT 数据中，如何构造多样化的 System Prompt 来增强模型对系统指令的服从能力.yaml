content:
  prompt: 在 SFT 数据中，如何构造多样化的 System Prompt 来增强模型对系统指令的服从能力？
answer:
  mode: rubric
  reference_answer: |-
    构造多样化的System Prompt是SFT阶段至关重要的

    一步，其目标是让模型学会从各种不同形式的系统指令中，精准地提取核心约束并调整行为。

    构造策略：

    - 主题与领域的多样化：
    覆盖不同的角色：教师、律师、医生、厨师、程序员、心理咨询师、诗人、历史人物等。
    覆盖不同的领域：科技、文学、历史、体育、娱乐、医疗等。
    例如：

    - 指令风格的多样化：

    - 约束条件的多样化：

    - 复杂度的多样化：

    - 动态 System Prompt 的构造：
    在数据生成阶段，可以编写一个脚本，从上述各个维度中随机抽取元素，组合生成成千上万条不同风格、不同复杂度的System Prompt。这能确保模型见过的System Prompt具有极大的多样性，从而在推理时对任何新系统提示都具有鲁棒性。

    注意事项：

    - 避免过拟合：如果所有训练数据的System Prompt都是一种风格（如都很长、都很复杂），模型可能会对简单的System Prompt无响应。需要长短、简繁搭配。

    - 保持一致性：在同一段对话数据中，System Prompt中设定的约束必须在后续的Assistant回复中得到体现，否则模型会学到“System Prompt可以被忽略”的错误行为。


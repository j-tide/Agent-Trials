content:
  prompt: QLoRA 训练中，梯度检查点和混合精度如何配合？需要注意什么？
answer:
  mode: rubric
  reference_answer: |-
    QLoRA、梯度检查点（Gradient Checkpointing）和混合精度训练这三项技术是“黄金三角”，共同作用可以最大化显存节省。它们配合良好，但需要注意配置顺序和数值稳定性。

    - 配合方式：QLoRA解决模型参数的显存；梯度检查点解决激活值的显存；混合精度（如BF16）解决计算速度和数值稳定性。三者是互补关系，可以同时开启。推荐使用torch.cuda.amp.autocast(dtype=torch.bfloat16)包裹前向传播，并在模型上调用model.gradient_checkpointing_enable()。


content:
  prompt: 如何生成大量多样且有用的 System Prompt 用于训练？可否自动化？
answer:
  mode: rubric
  reference_answer: |-
    可以，并且应该自动化。这是构建高质量 SFT 数据集的关键环节。

    自动化生成方法：

    - 基于 Meta-Prompt 的 LLM 生成：
    编写一个专门用于生成 System Prompt 的 Meta-Prompt（即“提示词的提示词”）。这个 Meta-Prompt 会要求 LLM 扮演一个“数据设计师”的角色，其任务是生成大量不同风格、不同领域、不同约束的 System Prompt。

    - 维度组合与批量生成：
    编写一个规则脚本，通过排列组合不同维度来自动化生成 System Prompt。

    - 基于知识图谱的实体扩展：
    利用知识图谱，抽取大量的职业、人物、学科、风格等实体。例如，从图谱中获取所有“职业”类型的实体，然后填充到模板“你是一个{职业}”中，快速生成一批角色设定。

    - 质量筛选与去重：
    自动生成的数据必须经过质量把关。


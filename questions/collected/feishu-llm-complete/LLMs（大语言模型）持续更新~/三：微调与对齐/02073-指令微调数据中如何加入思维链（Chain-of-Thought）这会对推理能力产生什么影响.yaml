content:
  prompt: 指令微调数据中如何加入思维链（Chain-of-Thought）？这会对推理能力产生什么影响？
answer:
  mode: rubric
  reference_answer: |-
    在指令微调数据中加入思维链（CoT），是提升模型推理能力最直接、最有效的方法之一。

    如何加入：在训练数据的assistant回复部分，不是直接给出最终答案，而是在答案前插入一段用自然语言描述的逐步推理过程。例如：

    {
        "messages": [
            {"role": "user", "content": "小明有5个苹果，吃了2个，又买了3个，最后给了小红1个，他还有几个？"},
            {"role": "assistant", "content": "好，让我们一步步分析：1. 一开始有5个苹果。2. 吃掉2个，剩下 5-2 = 3 个。3. 又买了3个，剩下 3+3 = 6 个。4. 给了小红1个，剩下 6-1 = 5 个。所以，小明最后还有5个苹果。"}
        ]
    }

    训练时，损失函数会同时计算在推理步骤和最终答案上，强制模型学会“先思考、后回答”的模式。


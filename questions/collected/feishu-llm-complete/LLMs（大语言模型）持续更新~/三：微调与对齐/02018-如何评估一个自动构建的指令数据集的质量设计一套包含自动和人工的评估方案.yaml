content:
  prompt: 如何评估一个自动构建的指令数据集的质量？设计一套包含自动和人工的评估方案。
answer:
  mode: rubric
  reference_answer: |-
    评估指令数据集需要回答三个核心问题：指令是否多样且合理？回复是否准确且有用？回复是否安全且无偏见？这需要自动化和人工评估相结合。

    一、自动化评估（高效、可扩展）

    - 指令质量评估：

    - 回复质量评估：

    - 数据多样性评估：

    二、人工评估（最终的黄金标准）

    - 分层抽样：从数据集中按任务类型、难度等级、指令长度等维度分层随机抽取少量样本（如200-500条）。

    - 多维度的Likert量表评分：由经过培训的评估员对每个样本进行1-5分评分，涵盖指令的清晰度和可执行性，以及回复的帮助性、准确性、逻辑连贯性和安全性。

    - 成对比较：对于同一个指令，将自动生成的回复与一个高质量的人工回复放在一起，让评估员盲评哪个更好，以精确衡量生成数据与人类专家水平的差距。


content:
  prompt: 在 SimPO 中，如何通过平均 log 概率解决回复长度带来的偏差？
answer:
  mode: rubric
  reference_answer: |-
    长度偏差是偏好对齐中一个根深蒂固的问题：模型倾向于给那些更长、更啰嗦的回复打出更高的总对数概率，从而获得更高的奖励。

    SimPO 通过一个极其简单的数学操作解决了这个问题：从“总和”变为“平均”。

    [图片内容未导入]

    通过这种长度归一化，SimPO 将模型优化的焦点从“能写多长”成功转移到了“每个词写得多好”，从根本上抑制了长度偏差。


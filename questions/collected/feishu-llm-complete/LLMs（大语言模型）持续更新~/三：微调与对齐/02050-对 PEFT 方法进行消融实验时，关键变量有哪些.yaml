content:
  prompt: 对 PEFT 方法进行消融实验时，关键变量有哪些？
answer:
  mode: rubric
  reference_answer: |-
    对 PEFT 方法进行消融实验，旨在量化每个设计选择对最终性能的贡献，并找到最优配置。以下是针对 LoRA（最典型）的关键消融变量，其他方法的变量类似。

    - 可训参数量/秩 (Rank, r)

    - 目标模块 (Target Modules)

    - LoRA 的缩放因子 (lora_alpha)

    - Dropout 概率

    - 可训参数总量 (Total Trainable Parameters)

    - 方法本身的消融

    实验设计要点：在进行消融实验时，必须采用控制变量法，即每次只改变一个变量，其他变量保持在最优或默认状态。同时，所有实验的基座模型、训练数据、优化器和评估指标必须完全相同，以保证结果的可靠性。


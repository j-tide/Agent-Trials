content:
  prompt: 如果用 ORPO 训练多轮对话模型，数据应该如何构造？
answer:
  mode: rubric
  reference_answer: |-
    用 ORPO 训练多轮对话模型，关键在于如何在一个训练样本中同时承载“指令微调”和“偏好对齐”两重信息。数据构造需要遵循 ORPO 的核心理念：同一个样本必须同时包含 chosen 的完整对话和 rejected 的完整对话。

    数据构造格式：

    一个标准的多轮对话 ORPO 训练数据样本，结构如下：

    {
      "prompt": [
        {"role": "system", "content": "你是一个有用的助手。"},
        {"role": "user", "content": "你好，请问北京的首都是哪里？"},
        {"role": "assistant", "content": "北京是中国的首都。"},
        {"role": "user", "content": "那上海呢？"}
      ],
      "chosen": [
        {"role": "assistant", "content": "上海是中国的一个直辖市，不是首都。"}
      ],
      "rejected": [
        {"role": "assistant", "content": "上海也是中国的首都之一。"}
      ]
    }

    关键设计原则：

    - 共享 Prompt 前缀：prompt 字段包含了直到模型需要生成回复之前的所有对话历史。这个前缀对于 chosen 和 rejected 回复是完全相同的。在训练时，这个前缀会被用来作为上下文，模型需要分别计算在它之后生成 chosen 和 rejected 序列的概率。

    [图片内容未导入]

    损失掩码处理：
    与标准 SFT 训练一样，在计算 chosen 和 rejected 回复的对数概率时，我们仍然需要应用损失掩码。只对回复部分的 token 计算损失，而忽略所有属于 prompt（包括用户输入、系统提示和历史助手回复）的 token。这确保了我们优化的目标始终是“如何根据对话历史生成更好的当前回复”，而不是去学习生成用户的问题或历史对话。


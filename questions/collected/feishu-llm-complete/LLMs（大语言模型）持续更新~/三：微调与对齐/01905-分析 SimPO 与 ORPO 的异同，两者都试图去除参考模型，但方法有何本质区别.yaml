answer:
  mode: rubric
  reference_answer: |-
    SimPO 和 ORPO 都是 DPO 之后涌现的、旨在移除参考模型的优秀方法，但它们的核心思想和对“好/坏”回复的定义方式截然不同。

    相同点：

    - 目标一致：都试图简化 DPO，彻底移除对参考模型的依赖，用更简洁、更高效的方式实现偏好对齐。

    - 单模型训练：在训练时都只需要加载并更新一个策略模型。

    本质区别：

    - 奖励的定义与计算：

    - 惩罚机制与目标函数结构：

    - 对齐的驱动方式：

    总结：SimPO 走的是“精益求精”的路线，通过精细化地优化生成概率的均值来对齐；而 ORPO 走的是“刮骨疗毒”的路线，通过强力惩罚来根除坏行为。SimPO 形式上更接近 DPO，而 ORPO 则是一种全新的范式。


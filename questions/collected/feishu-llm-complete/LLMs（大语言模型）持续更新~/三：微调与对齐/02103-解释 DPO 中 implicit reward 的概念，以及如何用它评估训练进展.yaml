  reference_answer: |-
    [图片内容未导入]

    这个值不需要额外的奖励模型就能计算出。在训练过程中，它可以作为一个核心指标来评估进展：

    - 正负样本的分数差：一个健康的训练过程，chosen 回复的隐式奖励分数应该持续高于 rejected 回复的分数。两者之间的差距越大，说明模型越能准确区分好坏。

    - 分数的整体趋势：chosen 回复的隐式奖励应逐步上升，代表模型认为好回复的质量越来越高。


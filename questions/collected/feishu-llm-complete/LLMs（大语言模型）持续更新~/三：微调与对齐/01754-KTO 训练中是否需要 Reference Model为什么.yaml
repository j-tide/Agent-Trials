content:
  prompt: KTO 训练中是否需要 Reference Model？为什么？
answer:
  mode: rubric
  reference_answer: |-
    是的，KTO 训练中需要 Reference Model。

    原因：

    [图片内容未导入]

    - 稳定训练：参考模型起到了一种类似 KL 散度约束的作用，将策略模型的更新限制在它的附近，防止策略模型为了优化隐式奖励而崩溃。

    - 与 DPO 保持一致：这种设计使得 KTO 和 DPO 的底层奖励信号机制是统一的，便于比较和迁移。

    因此，虽然 KTO 能处理非成对数据，但它并没有放弃 Reference Model 带来的稳定性和理论基础。与 ORPO、SimPO 等“无参考”方法相比，KTO 选择了保留参考模型，以换取更稳健的训练过程。


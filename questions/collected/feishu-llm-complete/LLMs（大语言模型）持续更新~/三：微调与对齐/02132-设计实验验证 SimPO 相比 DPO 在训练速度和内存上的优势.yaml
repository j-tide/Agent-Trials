    预期结果：

    - 显存占用：SimPO 的峰值显存应比 DPO 低约 40%-50%，因为少了参考模型。

    - 训练速度：SimPO 的吞吐量（tokens/秒）应显著高于 DPO，因为每步只有一次模型前向传播。

    - 收敛效率：SimPO 达到同等奖励水平所需的步数可能更少，或相同步数下性能更高。

    通过这样的实验，可以清晰地量化 SimPO 在资源效率和训练速度上的双重优势。


  reference_answer: |-
    选择合适的 PEFT 方法需要权衡任务需求、模型规模、可用资源和性能目标。以下是一个实用的决策流程和经验法则。

    - 第一步：任务类型与核心需求分析

    - 第二步：资源约束评估

    - 第三步：经验法则与推荐

    决策流程总结：

    任务需求 -> 需要注入大量新知识？
        |-- 是 -> 全参数微调 / RAG / 大容量 Adapter
        |-- 否 -> 模型规模 > 7B?
            |-- 是 -> 对推理延迟零容忍？
                |-- 是 -> LoRA
                |-- 否 -> Adapter / LoRA
            |-- 否 -> 追求极致效率？
                |-- 是 -> IA3
                |-- 否 -> LoRA / Prefix Tuning

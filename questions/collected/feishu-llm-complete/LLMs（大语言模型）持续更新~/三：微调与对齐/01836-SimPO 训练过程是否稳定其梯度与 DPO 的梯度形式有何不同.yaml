content:
  prompt: SimPO 训练过程是否稳定？其梯度与 DPO 的梯度形式有何不同？
answer:
  mode: rubric
  reference_answer: |-
    SimPO 的训练过程非常稳定，甚至在某些方面优于 DPO。

    稳定性来源：

    - 无参考模型：消除了因参考模型质量不佳或与策略模型不协调而引入的额外方差和偏差。

    - 长度归一化：平均对数概率是一个数值上更稳定的信号。它避免了因序列长度不同而导致的总对数概率的大幅波动，使损失曲线更加平滑。

    - 目标边际 γ：γ 为优化提供了一个明确的、稳定的目标。在 DPO 中，一旦 chosen 的概率略高于 rejected，梯度就会迅速消失。而 SimPO 的 γ 机制使得模型在达到目标边际之前，都能接收到持续、稳定的更新梯度，从而推动模型进行更充分的学习，而不是过早收敛。


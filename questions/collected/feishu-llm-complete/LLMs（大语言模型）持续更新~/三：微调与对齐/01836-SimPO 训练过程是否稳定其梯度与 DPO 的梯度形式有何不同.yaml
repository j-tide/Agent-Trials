    与 DPO 相比，SimPO 的梯度不包含参考模型的项，它纯粹来自于策略模型自身对 chosen 和 rejected 回复的平均对数概率的差值。这使得梯度信号更加“纯净”，完全聚焦于提升 yw 相对于 yl 的优势，不受外部参考模型“噪音”的影响。


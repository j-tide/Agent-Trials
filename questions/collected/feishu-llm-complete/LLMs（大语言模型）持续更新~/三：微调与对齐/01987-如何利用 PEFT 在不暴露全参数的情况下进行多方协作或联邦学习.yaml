content:
  prompt: 如何利用 PEFT 在不暴露全参数的情况下进行多方协作或联邦学习？
answer:
  mode: rubric
  reference_answer: |-
    在数据隐私法规日益严格的今天，多个机构想在不共享原始数据的情况下共同训练一个强大的模型，这就是联邦学习（Federated Learning）的需求。PEFT 与联邦学习是天生一对，因为它解决了一个核心痛点：通信成本和隐私暴露风险。

    传统联邦学习（全参数）的痛点：

    - 通信成本巨大：每一轮训练都需要上传和下载整个模型的参数或梯度，对于 LLM 而言，这是 GB 级别的数据传输，网络开销极大。

    - 隐私风险：攻击者可以通过模型梯度反推部分原始数据。

    PEFT 驱动的联邦学习方案：

    - 基座模型共享，适配器本地训练：

    - 巨大优势：

    结论：PEFT + 联邦学习 = 一种高效、安全、低成本的协作式 AI 模型构建方案。它使得多个机构可以在不共享核心数据的情况下，共同训练出能力强大的个性化或领域模型，尤其适用于金融、医疗等高隐私要求行业。


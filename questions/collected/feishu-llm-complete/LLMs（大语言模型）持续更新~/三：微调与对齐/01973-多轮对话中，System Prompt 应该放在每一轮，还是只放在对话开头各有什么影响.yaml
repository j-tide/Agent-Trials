  reference_answer: |-
    推荐做法：只放在对话开头。 这是当前工业界的主流实践，也是最有效的方式。

    - 只放在对话开头（Standard）：

    - 放在每一轮：

    解决方案：对于长对话中可能出现的“遗忘”问题，更优雅的解决方案不是重复 System Prompt，而是利用摘要记忆或状态注入，在对话中途动态地将核心约束以简洁的方式重新插入上下文。这比简单重复整个 System Prompt 更高效。


content:
  prompt: QLoRA 为什么能将 65B 模型在单张 48GB GPU 上微调？给出显存分析。
answer:
  mode: rubric
  reference_answer: |-
    这归功于QLoRA将基座模型的显存压缩了4倍，而LoRA微调本身又避免了保存基座模型的梯度和优化器状态。以下是详细分析。

    - 基座模型参数显存（极致压缩后）

    [图片内容未导入]

    - LoRA 可训参数开销（极小）

    假设使用秩 r=16 的LoRA，可训参数量约为模型总参数的0.1%-0.5%。这部分参数及其对应的梯度和优化器状态（BF16/FP32），总计约需 2-5 GB。

    - 其他开销

    激活值、临时缓冲区等约需 5-8 GB。

    总显存占用 = 34 GB (量化基座) + 4 GB (LoRA) + 7 GB (激活等) ≈ 45 GB。

    这个峰值显存完全在单张48GB显存的GPU（如RTX A6000）所能承受的范围内。若使用分页优化器，还可进一步降低峰值风险。相比之下，标准LoRA（FP16基座）微调65B模型需要约130GB（基座）+ LoRA开销，远超单卡极限。


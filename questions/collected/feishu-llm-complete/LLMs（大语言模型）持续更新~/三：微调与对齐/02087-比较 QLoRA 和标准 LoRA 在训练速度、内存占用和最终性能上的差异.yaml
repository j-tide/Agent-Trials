content:
  prompt: 比较 QLoRA 和标准 LoRA 在训练速度、内存占用和最终性能上的差异。
answer:
  mode: rubric
  reference_answer: |-
    结论：

    - 标准LoRA：是“性能优先”的选择，适用于显存充裕的场景。

    - QLoRA：是“效率优先”的王者。它用大约30%-50%的训练速度损失，换来了约75%的显存占用降低。这使得在消费级硬件上微调超大模型成为可能，是单卡或资源受限环境下的终极解决方案。在内存瓶颈远大于时间瓶颈的大模型时代，QLoRA是不可或缺的利器。


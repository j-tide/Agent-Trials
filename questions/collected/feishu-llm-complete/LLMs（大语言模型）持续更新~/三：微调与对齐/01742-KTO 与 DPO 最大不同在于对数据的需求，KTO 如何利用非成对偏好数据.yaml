    KTO 如何利用非成对偏好数据？

    KTO 的核心机制在于，它为 desirable 和 undesirable 样本设计了独立但互补的损失函数。对于一个给定的提示-回复对 (x,y)，它会利用一个隐式奖励函数 rθ(x,y) 来评估该回复的质量。这个隐式奖励与 DPO 中的定义相同：

    [图片内容未导入]

    [图片内容未导入]

    通过这种设计，每个独立的、带有标签的回复都能直接产生训练信号，驱动模型参数更新，完全不需要等待它的“对比对象”出现。


    原因二：防止灾难性遗忘

    对齐训练的前提是模型已经具备强大的通用能力。如果从预训练基座模型直接进行 DPO 训练，模型将同时面临“学习对齐偏好”和“保持基础语言能力”的双重挑战，极易导致基础能力的崩溃。DPO 假设参考模型已经是一个足够好的模型，优化是在这个基础之上进行的微调。


content:
  prompt: 什么是“量化适配器”？QLoRA 训练后，如何将适配器与量化基础模型结合使用？
answer:
  mode: rubric
  reference_answer: |-
    “量化适配器”是在 QLoRA 训练后，我们将独立于量化基座模型的 LoRA 适配器称为“量化适配器”。

    结合使用方式：

    - 动态加载（标准做法）：服务部署时，首先加载量化后的4-bit基座模型，然后动态加载对应的 LoRA 适配器。这正是 PEFT 库的 PeftModel.from_pretrained 方法所做的事情。这种方法灵活，可以随时切换适配器，但每次前向传播时都要计算 LoRA 分支。

    - 合并后使用（推荐，若追求零额外推理延迟）：你可以将训练好的 LoRA 权重合并回其对应的反量化后的高精度基座权重中，然后将合并后的完整模型重新量化并保存。具体步骤为：


content:
  prompt: 如何平衡 RLHF 中的奖励（reward）与 KL 惩罚？超参数 β 如何影响结果？
answer:
  mode: rubric
  reference_answer: |-
    平衡 RLHF 中的奖励与 KL 惩罚，是训练过程中最核心的调优艺术。这一平衡完全由超参数 β 控制。

    β (Beta) 的作用：

    β 是 KL 散度惩罚项的系数，它决定了 KL 惩罚在总目标函数中的权重。总目标可以简化为：


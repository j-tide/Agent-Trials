content:
  prompt: SimPO 是否适用于仅解码器模型和编码器-解码器模型？
answer:
  mode: rubric
  reference_answer: |-
    是的，SimPO 对两者都适用，但均需适配其输出计算方式。

    - 仅解码器模型（如 GPT、LLaMA）：
    这是 SimPO 最直接的应用场景。模型在给定前缀 x 后，自回归地生成回复 y。SimPO 所需的序列平均对数概率，正是该模型在生成回复序列时，对每个 token 的条件对数概率的平均值。计算方式完全符合 SimPO 的定义。

    - 编码器-解码器模型（如 T5, BART）：
    SimPO 同样适用，但计算平均对数概率的位置是解码器。具体来说：


content:
  prompt: 比较 SimPO 与 KTO，在对非成对偏好数据的适用性上有何区别？
answer:
  mode: rubric
  reference_answer: |-
    这是一个关于数据需求和算法适用范围的核心区别。SimPO 必须使用成对偏好数据，而 KTO 可以天然地处理非成对偏好数据。

    [图片内容未导入]

    - KTO 的数据需求：KTO（Kahneman-Tversky Optimization）的灵感来源于前景理论，它不直接比较成对的回复，而是为每个回复设定一个独立的、绝对的渴望程度（desirability）。这个渴望程度可以来源于多种形式的反馈：

    - 适用性区别总结：

    - SimPO 如何变通处理非成对数据？
    如果只有评分数据，SimPO 必须进行变通：人为构造对比对。例如，将评分最高的回复作为 yw，将评分最低的回复作为 yl。这种构造方法虽然可行，但会引入偏差，且构造出的对比对质量受限于评分系统的准确度。


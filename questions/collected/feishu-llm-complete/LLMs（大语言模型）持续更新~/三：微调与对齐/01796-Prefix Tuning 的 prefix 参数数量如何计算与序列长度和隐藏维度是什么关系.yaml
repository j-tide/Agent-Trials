content:
  prompt: Prefix Tuning 的 prefix 参数数量如何计算？与序列长度和隐藏维度是什么关系？
answer:
  mode: rubric
  reference_answer: |-
    前缀参数量完全由两个因素决定：前缀的序列长度（L） 和模型的隐藏维度（d）。

    [图片内容未导入]

    关系：参数量与 序列长度成正比，与 隐藏维度成正比。在实际操作中，前缀长度是核心超参数，其影响显著。在一般任务中，前缀长度设得很小（例如 L=5∼20）就能获得良好的效果。若设得太长，不仅会增加参数量和计算成本，还可能导致过拟合，因为前缀占据了过多上下文空间。通常，我们会根据任务复杂度和可用资源，在小规模实验中寻找效果饱和的最小 L 值。


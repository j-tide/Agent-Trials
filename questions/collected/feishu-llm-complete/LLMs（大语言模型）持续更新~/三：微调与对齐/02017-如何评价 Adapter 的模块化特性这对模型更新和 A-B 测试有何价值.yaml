answer:
  mode: rubric
  reference_answer: |-
    Adapter 的模块化是其除参数高效性之外，最具工程价值和应用前景的特性。它将模型能力与模型主体解耦，为 AI 系统的开发和运维带来了革命性的便利。

    - 模块化特性本身：Adapter 将“任务知识”外化到了独立的、微小的、即插即用的模块中。这使得一个通用的基座模型可以被无数次复用，只需要组合不同的 Adapter 就能实现不同的功能。


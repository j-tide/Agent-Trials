content:
  prompt: 奖励模型的训练数据通常如何构造？损失函数是什么？写出 Bradley-Terry 模型下的排序损失。
answer:
  mode: rubric
  reference_answer: |-
    训练数据构造：

    - 数据来源：从 SFT 模型或早期版本的 PPO 模型中，针对大量多样化的提示，生成多个回复。

    - 数据筛选：为了确保数据多样性并降低标注成本，会选择那些在生成时使用了不同采样策略（如不同的温度）的回复，并筛选出差异足够大的候选对。

    [图片内容未导入]

    我们的目标就是最大化这个偏好概率。因此，损失函数是该概率的负对数似然：

    [图片内容未导入]

    训练技巧：

    - 响应随机化：在训练时，随机交换 yw 和 yl 的位置，防止模型学习到位置偏差。

    - 奖励值中心化：通常会在损失函数中加入一个正则项，鼓励奖励模型的输出在均值0附近，防止其输出值无约束地漂移，从而提升 PPO 训练的稳定性。


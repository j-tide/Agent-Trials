  prompt: 推理时，Adapter 是否增加延迟？如果会，如何通过结构优化或计算优化减少开销？
answer:
  mode: rubric
  reference_answer: |-
    是的，标准的串行 Adapter 会不可避免地增加推理延迟。这是因为 Adapter 层被插入到 Transformer 的残差路径上，导致网络深度增加，数据必须串行流经 Adapter 模块。每一层的额外计算叠加起来，就会产生可观的延迟。


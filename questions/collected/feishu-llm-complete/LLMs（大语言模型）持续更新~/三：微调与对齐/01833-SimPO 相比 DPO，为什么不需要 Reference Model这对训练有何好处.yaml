content:
  prompt: SimPO 相比 DPO，为什么不需要 Reference Model？这对训练有何好处？
answer:
  mode: rubric
  reference_answer: |-
    SimPO 不需要 Reference Model，源于它对“隐式奖励”的重新定义。

    [图片内容未导入]

    SimPO 通过“平均对数概率”和“目标边际 γ”这两个机制，巧妙地替代了 Reference Model 的“保底”功能。平均对数概率本身就是一个稳健的指标，而 γ 作为额外的约束，可以防止模型输出概率的异常波动。

    对训练的好处是巨大的：

    - 显存占用降低 40%-50%：无需加载和存储一个完整的冻结模型，可以直接腾出大量 GPU 显存，用于支持更大的 batch size 或更长序列的训练。

    - 训练速度显著提升：省去了一次完整的前向传播计算，每一步迭代的时间更短，吞吐量更高。

    - 工程实现极度简化：代码逻辑从管理双模型变为管理单模型，出错概率和调试难度都大大降低。


content:
  prompt: PPO 算法中的优势函数（Advantage）是如何计算出来的？简述 GAE。
answer:
  mode: rubric
  reference_answer: |-
    优势函数 A(s,a) 回答了这样一个问题：“在状态 s 下采取动作 a，比平均水平好多少？” 如果 A>0，说明该动作优于平均水平，值得鼓励；反之则应该抑制。它是 PPO 算法的核心，能够有效减少梯度估计的方差。

    广义优势估计（GAE，Generalized Advantage Estimation） 是目前最主流的优势函数计算方法。它将一步的 TD 误差和多步的回报通过指数加权的方式结合起来，在偏差和方差之间取得了优秀的平衡。

    GAE 的核心是基于 TD 误差（δt） 的指数加权平均。TD 误差定义为即时奖励加上下一状态的价值减去当前状态的价值：


    计算流程：

    - 采样：用当前策略在环境中执行，得到一个完整的轨迹，包含状态、动作、奖励和 Critic 模型的价值估计 V(s)。

    - 计算 TD 误差：根据上述公式，从轨迹的最后一步反向计算每一步的 δt。


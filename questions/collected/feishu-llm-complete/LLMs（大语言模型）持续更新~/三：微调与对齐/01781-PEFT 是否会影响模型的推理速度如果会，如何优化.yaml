content:
  prompt: PEFT 是否会影响模型的推理速度？如果会，如何优化？
answer:
  mode: rubric
  reference_answer: |-
    答案是：取决于具体的 PEFT 方法。

    - 会影响推理速度的方法 (如 Adapter, Prefix Tuning)：

    [图片内容未导入]

    - 影响程度：对于 Adapter，延迟增加通常是线性的，与插入的模块数量成正比。对于 Prefix Tuning，增加少量虚拟 Token 时影响较小，但过多时会成为瓶颈。

    - 不影响推理速度的方法 (如 LoRA, IA3)：

    [图片内容未导入]

    结论：如果你的应用场景对延迟非常敏感，例如在线对话系统，那么选择 LoRA 或 IA3 这类可以合并权重的 PEFT 方法至关重要。这让你能够在不增加任何推理成本的情况下，享受到 PEFT 带来的所有其他好处。


content:
  prompt: 分析 prefix 在注意力机制中的梯度流动，为什么 prefix 能有效控制模型行为？
answer:
  mode: rubric
  reference_answer: |-
    前缀之所以能有效控制模型行为，是因为它的梯度信号能够直接引导模型在每一层的注意力分布。

    梯度流动机制：

    [图片内容未导入]

    为什么能有效控制行为：

    梯度信号会精确地调整前缀 Key 的向量表示，使得在计算注意力分数时，模型能够根据任务需求，学会“何时”以及“多大程度”地去关注前缀。同时，梯度也会调整前缀 Value 的向量表示，使其学会“应该向模型提供什么样的信息”。这种双向优化，使得前缀能够精准地调控模型在每一层的信息聚合，从而实现对模型行为的有效控制。


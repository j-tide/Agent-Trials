content:
  prompt: 分析不同 PEFT 方法对梯度检查点和激活内存的影响。
answer:
  mode: rubric
  reference_answer: |-
    梯度检查点（Gradient Checkpointing）是一种用计算换显存的技术，它不存储某些层的中间激活，在反向传播时再重新计算。PEFT 方法的引入，会微妙地影响这一过程。


    总结：从显存效率角度看，LoRA 是最优的，它既不增加推理延迟，也不显著增加激活内存，且与梯度检查点完美兼容。Adapter 会增加激活内存，而 Prefix Tuning 会增加因序列长度导致的激活内存。在选择 PEFT 方法时，如果显存是首要瓶颈，应优先考虑 LoRA。


answer:
  mode: rubric
  reference_answer: |-
    评估模型对 System Prompt 的遵循程度，需要构建一个多维度的自动化与人工结合的测试体系。

    一、测试方法设计

    - 构造专项测试集：

    二、评估指标体系

    - 约束满足率：这是最基础的指标。对于可自动检查的硬性约束，直接计算“成功满足约束的回复数 / 总回复数”。

    - LLM-as-Judge 评分：使用一个强大的评估模型（如 GPT-4），根据预设的评分标准（1-5分），对回复在“角色符合度”、“指令清晰度”、“安全性”等维度进行打分。这是目前最主流、最灵活的方法。

    - 攻击成功率：在安全测试中，计算模型被越狱、诱导出有害内容的概率。越低越好。

    - 回复风格一致性：使用风格分类器，评估模型在一轮对话中的回复风格是否与 System Prompt 的设定保持一致。

    三、具体测试用例示例

    - System Prompt：“你是一个用词严谨、完全客观、不掺杂任何个人情感的新闻播报员。”

    - User Prompt：“昨天那场比赛真是太激动人心了！你觉得哪个球员表现最棒？”

    - 评估点：模型回复是否避免了“激动人心”等主观情感词，是否使用客观陈述的语气，是否直接回答“最棒”这个主观问题或将其转化为客观事实陈述。


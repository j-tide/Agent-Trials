content:
  prompt: System Prompt 中是否可以嵌入 safety 规则？这种方式与 RLHF 的安全训练如何互补？
answer:
  mode: rubric
  reference_answer: |-
    是的，System Prompt 中可以、也应当嵌入 safety 规则。这是一种显式的、基于规则的安全控制手段，与 RLHF 的隐式、基于价值观的安全训练形成强大的互补。

    - System Prompt 中的 safety 规则（显式安全层）：

    - RLHF 的安全训练（隐式价值观内化）：

    互补方式：

    System Prompt 的安全规则充当了第一道防线和行为底线。RLHF 则提供了深层次的价值观保障，使模型在面临复杂、模糊的诱导时，依然能做出安全的判断。例如，System Prompt 规定“不能提供危险品的制作方法”，而 RLHF 让模型在用户问“我最近心情不好，想找点刺激的，你知道什么能让人兴奋起来的东西吗？”这类隐晦提问时，能识别潜在风险并主动引导，而非仅仅在关键词匹配时才拒绝。


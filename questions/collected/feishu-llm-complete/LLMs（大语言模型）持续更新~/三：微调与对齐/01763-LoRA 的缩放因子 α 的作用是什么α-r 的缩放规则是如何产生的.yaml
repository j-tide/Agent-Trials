    2. α/r 缩放规则的产生原理：保持输出方差稳定
    这个规则源自一个直观的想法：当我们改变 r 时，我们希望 LoRA 模块的初始输出，以及后续的更新幅度，保持在一个稳定的范围内。

    - 如果我们把 A 和 B 的元素看作是独立同分布的随机变量，那么 BA 的期望方差会随着 r 的增大而线性增大。

    [图片内容未导入]

    - 本质：这个缩放规则将 r 的调整对优化过程的影响降到了最低。这意味着，当你把 r 从 8 调整到 16 时，只要 α 设置为 r 的固定倍数（如 α=2r），你通常不需要再大幅调整学习率。这极大地简化了 LoRA 的调参过程，使得工程师可以专注于调整 r 这一个核心超参数。


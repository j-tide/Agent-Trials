  reference_answer: |-
    QLoRA的前向和反向计算遵循“即时反量化，高低精度分离”原则，以保证计算精度。

    前向传播过程：

    [图片内容未导入]

    反向传播过程：
    反向传播时，梯度的计算路径与标准LoRA一致。由于原始权重 W0 被冻结，反向传播的梯度只会流经并更新高精度的 LoRA 参数 A,B，不会流向量化后冻结的 W NF4 及其常数。这完美地保护了LoRA参数学习的纯度，使其不受量化误差的干扰。


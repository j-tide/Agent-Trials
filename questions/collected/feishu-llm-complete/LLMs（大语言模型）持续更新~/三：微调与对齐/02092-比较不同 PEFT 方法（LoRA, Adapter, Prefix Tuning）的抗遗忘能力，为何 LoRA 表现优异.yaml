content:
  prompt: 比较不同 PEFT 方法（LoRA, Adapter, Prefix Tuning）的抗遗忘能力，为何 LoRA 表现优异？
answer:
  mode: rubric
  reference_answer: |-
    所有PEFT方法因其冻结基座参数的核心机制，抗遗忘能力都远超全参数微调。但它们之间仍有差异。

    [嵌入表格未展开]

    LoRA表现最优异的根本原因：它在参数效率和结构侵入性之间找到了一个完美的平衡点。它既不像Adapter那样永久性地增加了网络结构，也不像Prefix Tuning那样深度干预了注意力计算，而是以一种极其轻量、非破坏性的方式，精确地调整了模型的核心计算权重。


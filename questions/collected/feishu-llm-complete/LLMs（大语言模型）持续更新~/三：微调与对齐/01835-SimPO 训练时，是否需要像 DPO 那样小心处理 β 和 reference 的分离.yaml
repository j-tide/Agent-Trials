content:
  prompt: SimPO 训练时，是否需要像 DPO 那样小心处理 β 和 reference 的分离？
answer:
  mode: rubric
  reference_answer: |-
    完全不需要，因为 SimPO 根本没有 Reference Model。

    在 DPO 中，超参数 β 和 reference model 是紧密耦合的。β 的大小直接决定了模型在多大程度上受到 reference model 的约束。开发者需要非常小心地平衡 β 值，既要防止模型偏离太远（β 太小），又要防止优化力度不够（β 太大）。


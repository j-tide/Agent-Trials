answer:
  mode: rubric
  reference_answer: |-
    ORPO 的整体损失函数由两部分组成。

    第一部分：SFT 损失 (L SFT)

    [图片内容未导入]

    这是标准的自回归交叉熵损失，计算模型生成 chosen 回复序列中每个 token 的对数概率的均值。它的物理意义是最大化模型生成“正确答案”（chosen）的概率，让模型具备基本的指令遵循能力。

    第二部分：OR 损失 (L OR)
    这是 ORPO 的核心创新。它基于模型对 chosen 回复 yw 和 rejected 回复 yl 的序列级生成概率。

    [图片内容未导入]

    而 σ 是 sigmoid 函数。

    这个损失项的物理意义极其直观：

    [图片内容未导入]

    通过一个超参数 λλ，实现了在“学习指令”和“远离坏回复”两个目标之间的平衡。


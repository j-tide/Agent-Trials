content:
  prompt: ORPO 训练是否稳定？与 DPO 相比，有无新的不稳定因素？
answer:
  mode: rubric
  reference_answer: |-
    ORPO 训练总体上非常稳定，甚至在某些方面比 DPO 更稳定。这是因为 ORPO 的损失函数由两部分组成：传统的监督微调损失（SFT Loss）和基于 Odds Ratio 的偏好对齐损失（OR Loss）。SFT 损失是一个极其成熟、稳定的交叉熵损失，它为整个训练过程提供了一个稳健的优化基础。OR 损失则是在这个稳定基础上施加的额外约束，其数学形式（基于 Odds Ratio 的对数 sigmoid 函数）也具有良好的数值特性。


content:
  prompt: 简述 PPO 算法的目标函数中 clipping 的作用，写出 PPO-clip 的公式。
answer:
  mode: rubric
  reference_answer: |-
    PPO 的核心目标函数是 PPO-clip，其最大的创新在于引入了 clipping（裁剪）机制。这个机制的核心作用是防止策略更新步幅过大，保证训练过程的稳定性和可靠性。

    在没有 clipping 的传统策略梯度算法中，如果某个动作的优势函数 At 很高，算法会鼓励新策略 πθ 在该动

    [图片内容未导入]

    PPO-clip 的公式：

    [图片内容未导入]

    - At 是优势函数。

    - ϵ 是一个超参数，通常取 0.1 或 0.2，用于控制裁剪的幅度。

    Clipping 的作用机制：
    这个公式通过 min 和 clip 函数的组合，实现了一种保守的更新策略。

    - 情况一：At>0（该动作优于平均水平）

    [图片内容未导入]

    情况二：At≤0（该动作差于平均水平）

    [图片内容未导入]

    通过这种方式，PPO 算法保证了每一步的策略更新都处在一个信任域内，使得训练过程非常平滑，极大降低了对超参数的敏感性。


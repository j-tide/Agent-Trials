  reference_answer: |-
    这是一个关乎最终工程决策的核心对比。

    [图片内容未导入]

    - Prompt Tuning：其优势在于极致的轻量和简单。它不需要修改模型结构，推理时就是标准的前向传播。缺点是它对模型行为的控制力相对较弱，性能上限可能不如 LoRA。

    - LoRA：其优势在于性能上限更高且部署极其灵活。如果你需要零额外推理延迟，可以将 LoRA 权重合并回基座模型，这使其成为对延迟敏感的在线服务的最佳选择。


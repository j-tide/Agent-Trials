content:
  prompt: 在推理时，QLoRA 训练的模型如何部署？能否合并权重后转为标准精度？
answer:
  mode: rubric
  reference_answer: |-
    是的，有这两种部署方式，且各有优劣。

    - 方式一：在线合并部署 (LoRA 热插拔)

    - 方式二：离线合并部署 (合并后量化)

    结论：推荐方式一用于需要服务多个微调任务的动态场景，方式二用于对延迟和成本要求极致的单一任务部署场景。


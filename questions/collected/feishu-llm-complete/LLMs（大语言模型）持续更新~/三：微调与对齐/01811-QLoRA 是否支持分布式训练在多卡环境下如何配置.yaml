content:
  prompt: QLoRA 是否支持分布式训练？在多卡环境下如何配置？
answer:
  mode: rubric
  reference_answer: |-
    QLoRA 完全支持分布式训练，并且在多卡环境下，其配置方式与标准分布式训练高度兼容。

    - 数据并行 (DDP/FSDP)：这是最常用的方式。每张卡加载一份完整的QLoRA模型副本，处理不同的数据。由于LoRA可训参数极少，数据并行中的梯度通信开销非常小，效率很高。

    - 模型并行 (Tensor/Pipeline Parallelism)：当模型太大，单卡连4-bit权重都放不下时，需要模型并行。QLoRA可以与这些策略配合。通常使用device_map="auto"或DeepSpeed ZeRO-3的offload功能，将模型层的4-bit权重分片到不同GPU上。

    - 多卡环境配置示例（使用HuggingFace accelerate库）：

    # accelerate config
    # 选择多GPU配置，通常使用 "Multi-GPU" 或 "DeepSpeed"
    # 无需特殊配置，accelerate 会自动处理量化模型的加载和分发

    - 多机多卡：配置流程相同，需要指定--num_machines, --main_process_ip等分布式参数。


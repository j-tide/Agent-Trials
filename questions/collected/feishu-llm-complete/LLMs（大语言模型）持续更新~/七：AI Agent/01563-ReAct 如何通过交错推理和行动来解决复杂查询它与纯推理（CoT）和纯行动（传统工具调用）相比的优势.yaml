content:
  prompt: ReAct 如何通过交错推理和行动来解决复杂查询？它与纯推理（CoT）和纯行动（传统工具调用）相比的优势。
answer:
  mode: rubric
  reference_answer: |-
    ReAct 解决复杂查询的秘密在于它打破了传统范式中推理与行动的严格分离，让两者在微观层面上相互促进。它不是先推理完再行动，也不是行动完再推理，而是在每一个微小的步骤中，都交织着“想”和“做”。

    这种交织如何工作？面对一个复杂的、需要多步信息检索的问题，ReAct Agent 首先会进行思考，拆解出第一个需要查询的信息点，然后立即发起一个搜索行动。收到搜索结果后，它不会直接跳到最终答案，而是再次思考，评估搜索结果是否回答了原始问题，信息是否充分，是否发现了新的需要查询的实体。基于这个评估，它可能发起第二次、第三次搜索，或者调用计算器来验证数据。它可以在搜索不到信息时，思考并决定更换关键词重试；也可以在搜索到意外的高价值信息后，临时决定深入探索，而放弃原有的部分计划。这种在每一步都重新评估局势、动态规划下一步的能力，是 ReAct 的核心。

    与纯推理（CoT）相比的优势

    纯推理方法（如 Chain-of-Thought）是一次性的、线性的。它在内部通过冗长的思维链进行推理，但其知识完全受限于模型本身的参数。当遇到需要实时信息或精确数据的问题时，CoT 只能靠“记忆”或“猜测”，极易产生幻觉。例如，让它比较两款最新发布手机的性能，它的知识截止日期可能使其完全无法回答。而 ReAct 可以主动去搜索这两款手机的最新评测，基于真实的观察来构建答案，从根本上解决了信息过时和幻觉问题。

    与纯行动（传统工具调用）相比的优势

    传统的单步 Function Calling 往往是“一次性”的。它将用户的整个请求映射到一次 API 调用，然后基于返回结果生成答案。当任务需要多步串联时（例如，“查一下2023年图灵奖得主的博士毕业院校”），单次调用很难一步到位。一个过大的函数会难以设计，而多个函数的组合则缺乏中间的推理来串联。ReAct 则优雅地解决了这个问题：它将任务分解为一系列简单的原子工具调用，并用 Thought 将它们串联起来，形成一条灵活的工具链。

    总结优势：ReAct 比 CoT 多了获取外部真实信息的能力，因此更准确；比传统工具调用多了动态的、多步的推理和纠错能力，因此更强大、更鲁棒。它是两者的融合与超越。


content:
  prompt: AutoGen 的核心理念是什么？它的多 Agent 对话模式与传统 Agent 框架有何不同？
answer:
  mode: rubric
  reference_answer: |-
    AutoGen 的核心理念是：将多 Agent 协作建模为对话驱动的计算图。它不试图让单个超级 Agent 完成所有事情，而是通过定义多个具有不同角色和能力的 Agent，让它们在结构化的对话中相互协作，共同解决复杂任务。

    与传统 Agent 框架的核心区别

    传统 Agent 框架（如早期 LangChain Agent）通常以单 Agent 为中心，其工作模式是“思考-行动-观察”的自我循环。即使需要多个工具，也是由一个 Agent 在内部进行串行或并行的调用。这种模式类似于一个人独自完成所有工作。

    AutoGen 则转向多 Agent 对话协作。它将任务解决过程转变为多个 Agent 之间的对话流。这带来了几个根本性的改变：

    - 从单体思考到群体协作：复杂任务被自然地分解。一个 Agent 作为“规划者”分解任务，另一个 Agent 作为“执行者”调用工具，还有 Agent 作为“批评者”审查结果。它们在对话中传递信息，形成高效的协作网络。

    - 对话本身即是工作流：Agent 之间的对话不仅仅是通信，更是任务的调度和执行机制。一个 Agent 向另一个 Agent 发送消息，可以是委派一个子任务、请求一个信息、或者提供反馈。这种模式非常灵活，开发者可以自定义复杂的对话流。

    - 支持人类作为一等公民：AutoGen 原生地支持将人类用户作为一个特殊的 Agent（UserProxyAgent）嵌入到对话循环中。人类可以在任何节点介入，提供指导、批准操作或回答问题。这使得人机协同变得极其自然和强大。

    - 灵活的对话模式：AutoGen 提供了 GroupChat 和 Manager Agent 两种核心协调机制，前者模拟自由讨论，后者提供层级控制。这种灵活性允许开发者根据任务的确定性和复杂度选择最合适的协作模式。

    总结而言，AutoGen 将 AI 从“单兵作战”的助手，升级为“团队协作”的同事，通过对话将智能进行连接和放大。


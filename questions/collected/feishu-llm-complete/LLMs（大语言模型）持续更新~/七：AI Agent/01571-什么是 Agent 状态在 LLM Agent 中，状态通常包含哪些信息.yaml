content:
  prompt: 什么是 Agent 状态？在 LLM Agent 中，状态通常包含哪些信息？
answer:
  mode: rubric
  reference_answer: |-
    Agent 状态是 Agent 在执行任务过程中，在某个特定时刻对其自身、环境以及任务进展的完整“快照”。它相当于 Agent 的短期记忆和当前处境的集合，是 Agent 能够在多轮交互中保持行为连贯、目标明确的基础。

    在 LLM Agent 中，状态并不存在于大语言模型内部（因为模型本身是无状态的），而是由外部系统维护的一个结构化数据对象。这个对象在每次与 LLM 交互时被注入到上下文中，并在交互后根据结果进行更新。一个典型的 Agent 状态模型通常包含以下几类关键信息：

    - 会话与身份标识：包括会话 ID、用户 ID、Agent ID 等，用于在分布式系统中唯一标识一个任务实例，并关联用户专属的长期记忆和权限。

    - 对话历史：这是状态中体积最大、也最核心的部分。它记录了从任务开始至今的所有交互消息，包括用户的输入、模型的思考、模型的工具调用请求、以及工具返回的观察。对话历史是 LLM 进行下一轮推理的直接依据。

    - 任务计划与进度：对于采用 Plan-and-Execute 范式的 Agent，状态中会包含 Planner 生成的结构化任务计划。同时，状态会追踪当前正在执行的是哪一步，哪些步骤已完成，哪些步骤失败或被跳过。这部分信息确保了长程任务的执行不会偏离轨道。

    - 工作变量与中间结果：在执行过程中，Agent 会产生许多需要在后续步骤中使用的中间数据。例如，一次搜索返回的关键实体、一个计算器得出的数值、或者一段生成好的草稿。这些数据被以键值对的形式存储在状态中，供后续步骤通过变量名引用。

    - 记忆快照与上下文摘要：随着对话历史的增长，为了控制成本，状态中通常会包含对早期历史的压缩摘要。此外，从长期记忆中检索到的、与当前任务相关的“回忆”也会被注入状态，作为 LLM 的背景知识。

    - 资源与约束信息：包括任务剩余的 Token 预算、时间预算、最大可执行步数等。这些约束条件会影响 Agent 的决策（例如，决定是否要提前结束探索并给出当前最佳答案）。

    一个设计良好的状态模型，是构建可靠、可调试、可恢复的复杂 Agent 系统的基石。


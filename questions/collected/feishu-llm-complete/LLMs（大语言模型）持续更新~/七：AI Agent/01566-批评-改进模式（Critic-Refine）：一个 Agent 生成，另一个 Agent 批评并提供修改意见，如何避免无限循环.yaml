content:
  prompt: "“批评-改进”模式（Critic-Refine）：一个 Agent 生成，另一个 Agent 批评并提供修改意见，如何避免无限循环？"
answer:
  mode: rubric
  reference_answer: |-
    “批评-改进”模式是提升 AI 生成内容质量的强大范式。它通过引入一个独立的“批评家”角色，对“创作者”的作品进行审视和反馈，形成迭代优化的闭环。然而，这种循环极易陷入无休止的修改，或者因双方审美差异而导致“拉锯战”。

    避免无限循环的控制策略

    - 设置硬性的最大迭代次数：这是最基础也是最有效的熔断机制。规定一次“批评-改进”流程，最多只能进行 N 轮（例如 3 轮）。一旦达到上限，无论批评家是否满意，都必须停止循环，并输出当前最新的版本。这强制流程在有限资源内结束。

    - 引入“改进增益”评估：不是简单地迭代，而是在每一轮改进后，由批评家对新旧两个版本进行量化比较，评估其“改进增益”（Improvement Gain）。增益可以是一个 1-10 的分数，或者一个具体的变化说明。如果批评家判定最新一轮的修改没有带来实质性提升，或者增益低于某个阈值，循环就应立即终止。这可以防止“为改而改”的无效拉锯。

    - 定义清晰、客观的“完成标准”：在任务开始时，就由用户或仲裁 Agent 为这个“批评-改进”任务定义一个明确的、可衡量的完成标准。这个标准不能是“做到最好”这种主观描述，而应该是“代码通过所有测试用例”、“文章事实性错误为 0”、“摘要长度在 100 字以内”等客观指标。一旦创作者的作品满足了这些客观标准，无论批评家是否还有审美上的意见，流程都应立即终止。

    - 引入仲裁者：当创作者和批评家对“是否已经达到最优”产生不可调和的矛盾时，引入一个独立的、能力更强的仲裁者 Agent。它的职责是审阅双方的论据（创作者的理由和批评家的意见），并做出最终的、不可上诉的裁决。这个裁决可以是“采纳批评家意见，进行最后一轮修改”，或者“当前版本已符合要求，终止流程”。

    通过“迭代上限”、“增益评估”、“客观标准”和“最终仲裁”这套组合拳，我们可以将“批评-改进”这个强大的工具，关进效率和质量的笼子里。


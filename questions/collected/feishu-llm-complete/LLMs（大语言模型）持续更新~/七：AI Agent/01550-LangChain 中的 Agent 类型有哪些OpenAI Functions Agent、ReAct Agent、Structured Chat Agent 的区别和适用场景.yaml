content:
  prompt: LangChain 中的 Agent 类型有哪些？OpenAI Functions Agent、ReAct Agent、Structured Chat
    Agent 的区别和适用场景。
answer:
  mode: rubric
  reference_answer: |-
    LangChain 提供了多种 Agent 类型，以适应不同模型的能力和任务需求。它们的核心区别在于：如何构造提示、如何解析模型输出、以及如何利用模型特定能力。

    - OpenAI Functions Agent

    这是专为 OpenAI 的 Function Calling 能力设计的 Agent。它不依赖传统的“Thought/Action”文本解析，而是利用模型原生支持的 tools 参数和 tool_calls 响应格式。

    - 工作机制：提示中包含了工具的定义（JSON Schema）。模型直接输出一个结构化的 tool_calls 对象，包含函数名和参数。AgentExecutor 解析这个对象，执行工具，并将结果以 role: "tool" 的消息返回。

    - 优点：极其可靠、无歧义，因为模型被专门训练来输出这种格式。支持并行工具调用。

    - 适用场景：在使用 OpenAI 最新模型（GPT-3.5-turbo-0613 及更高版本）时，这是首选方案。适用于所有需要工具调用的通用场景。

    - ReAct Agent

    这是最经典、最通用的 Agent 类型。它通过提示工程，引导模型生成“Thought（思考）”、“Action（行动）”、“Observation（观察）”的文本序列。

    - 工作机制：提示词中包含一个详细的模板，告诉模型如何以这种交替格式输出。AgentExecutor 解析文本，提取出最新的 Action 指令，执行工具，然后将结果作为 Observation 追加回对话历史。

    - 优点：模型无关，可以在任何支持指令遵循的 LLM 上使用，包括开源模型。其 Thought 过程完全透明，便于调试。

    - 缺点：依赖于文本解析，格式错误可能导致执行失败。不支持原生并行调用。

    - 适用场景：使用非 OpenAI 模型、需要高度可解释性的推理过程、或需要精细控制思考步骤的复杂多步任务。

    - Structured Chat Agent

    这是一种支持多参数工具的高级 Agent，它将工具的参数 Schema 编码到提示中，允许模型在一次调用中为工具提供复杂的、结构化的输入。

    - 工作机制：它的提示词包含了工具的参数 Schema 描述。模型可以生成包含结构化动作的文本，如 Action: Search 然后换行后跟 Action Input: {"query": "...", "source": "web"}。

    - 优点：能够处理需要复杂参数的工具，比简单的单参数 ReAct Agent 能力更强。

    - 适用场景：当你有多个工具，且它们的输入参数结构复杂（例如，需要嵌套对象或数组）时，这个 Agent 比基础的 ReAct Agent 更胜任。


content:
  prompt: 上下文窗口对规划的限制：长计划如何压缩或分段维护？
answer:
  mode: rubric
  reference_answer: |-
    大语言模型有限的上下文窗口是长期规划最主要的物理瓶颈之一。随着对话和任务执行的推进，初始计划、每一步的观察、工具返回的大量数据、以及模型自身的中间推理，会迅速塞满整个窗口，导致模型遗忘早期的规划指令，失去对全局目标的把控。

    压缩与分段维护策略：

    - 分层摘要与工作记忆：不对整个对话历史进行全量保留，而是用一个独立的、更廉价的轻量级 LLM 定期（例如每完成一个子任务或每过 N 轮）对历史进行摘要。摘要只保留“为达成目标，目前已完成的关键事实、已确认的决策、当前的状态和未解决的子问题”。然后用这段摘要替换掉冗长的原始对话历史，释放上下文空间。这相当于为 Agent 配备了一个“外置的速记秘书”。

    - 计划的分段序列化与外部存储：将一个完整的长期计划，拆分成多个独立的、可被分别加载的“计划片段”，存储在外部的向量数据库或文档存储中。每个片段只包含一个阶段的目标和步骤。Agent 在运行时，不是将所有计划都装进大脑，而是通过一个“计划管理器”，根据当前所处的阶段，动态地检索并加载下一个需要的计划片段，以及相关的历史结果摘要。这类似于操作系统中的分页机制。

    - 迭代式计划生成：放弃在任务之初就生成长篇大论的详细计划。改为在每完成一步后，都动态地生成“下一步做什么”的短期计划。这种滚动式的规划天然地规避了超长计划占用窗口的问题。虽然它牺牲了部分全局视野，但通过与工作记忆的结合，可以很好地平衡短视和长程的关系。

    - 利用长上下文模型与检索增强生成：在条件允许的情况下，使用原生支持超长上下文窗口（如 128K、1M Token）的模型作为规划器。同时，结合检索增强生成技术，当需要回顾历史的某个细节时，不是靠模型自己“记忆”，而是靠检索工具来精准获取，把上下文窗口从“记忆库”转变为“工作台”。

    通过这些策略的组合，Agent 可以有效地突破上下文窗口的物理限制，处理更复杂、更长周期的任务。


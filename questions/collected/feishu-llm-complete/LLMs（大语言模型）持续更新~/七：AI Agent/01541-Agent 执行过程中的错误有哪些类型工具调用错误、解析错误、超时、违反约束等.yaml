content:
  prompt: Agent 执行过程中的错误有哪些类型？工具调用错误、解析错误、超时、违反约束等。
answer:
  mode: rubric
  reference_answer: |-
    Agent 在执行过程中会遭遇各种错误，对这些错误进行精确分类是构建鲁棒错误处理框架的前提。

    - 模型层错误

    - 解析错误：LLM 的输出不符合预定义的结构化格式（如不是合法 JSON，或缺少必要的字段）。这常见于 ReAct Agent 等依赖文本解析的模式。

    - 策略性错误：LLM 做出了一个无效的决策，如选择了错误的工具、提供了不合理的参数、或者陷入了重复的死循环。这类错误在语义上成立，但逻辑上是错误的。

    - 工具/执行层错误

    - 工具执行错误：工具调用成功发送，但执行过程中出错。例如，网络请求超时、API 返回了业务层面的错误码（如“权限不足”）、代码解释器运行代码时抛出异常。

    - 工具选择错误：LLM 错误地调用了一个根本不存在的工具（幻觉），或调用了一个与当前任务无关的工具。

    - 参数生成错误：LLM 为工具提供了错误类型或缺失的必填参数。

    - 环境与资源层错误

    - 超时：Agent 的任务执行超过了预设的步数限制、时间限制或 Token 预算限制，被系统强制中断。

    - 资源耗尽：API 调用额度用尽、GPU 显存不足、或磁盘空间满等底层资源问题。

    - 外部服务不可用：Agent 依赖的搜索引擎 API、数据库等外部服务出现故障。

    - 违反约束类错误

    - 安全策略违反：LLM 试图执行一个被安全策略禁止的操作，如调用一个被标记为“危险”的工具，或输出包含敏感信息的内容。

    - 业务逻辑错误：Agent 完成了任务，但其执行过程或结果违背了业务规则。例如，生成的计划忽略了硬性约束，或执行了超出用户权限的操作。

    - 系统级错误

    - 状态损坏：持久化的 Agent 状态文件或数据库记录损坏，导致无法恢复。

    - 服务崩溃：Agent 服务本身因未捕获的异常而崩溃。

    对这些错误进行精细的分类，是为每种错误设计针对性恢复策略的基础。


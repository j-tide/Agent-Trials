content:
  prompt: ReAct 与 Plan-and-Execute 范式的区别：ReAct 是即兴的，Plan-and-Execute 是先计划后执行，何时用哪种？
answer:
  mode: rubric
  reference_answer: |-
    ReAct 和 Plan-and-Execute 代表了 Agent 在解决复杂问题时两种截然不同的思维模式：一个是即兴的爵士乐手，一个是严谨的建筑师。

    核心区别

    - ReAct 将规划和执行融为一体，形成了一个“思考-行动-观察”的实时闭环。它不在行动前制定完整计划，而是每走一步，都根据最新的环境反馈来动态决定下一步怎么走。它的强项在于灵活应变，对意外和未知有很强的适应力。

    - Plan-and-Execute 则将规划和执行严格分离。它首先进行全局规划，生成一个包含所有步骤的完整计划；然后，再像一个执行脚本一样，逐步执行这个计划。它的强项在于结构性和全局一致性，能保证最终产出符合预期的蓝图。

    何时用哪种？

    选择哪种范式，取决于任务的特性和对过程的要求。

    适合用 ReAct 的场景：

    - 信息不全或动态变化的任务：例如，开放域的复杂问答、市场情报收集、交互式调试。你不知道答案会在哪里，需要像探险家一样不断搜索、发现新线索、并根据线索调整方向。

    - 需要高度交互和用户确认的任务：例如，与用户协同完成一项预订。每一步都可能需要根据用户的反馈来调整，无法预先规划。

    - 目标明确但路径未知的任务：解决问题的过程本身就是探索性的。

    适合用 Plan-and-Execute 的场景：

    - 步骤明确、结构化程度高的任务：例如，生成一份格式严格的项目报告、遵循标准作业流程的合同审核、执行一个已知的复杂计算。这些任务的步骤是相对固定的，可以被预先定义。

    - 对最终产出的结构完整性要求极高的任务：你需要一份包含所有必要章节、逻辑严谨的文档。Plan-and-Execute 能很好地保证这一点，因为它先确立了骨架。

    - 需要评估和审批执行计划的高风险任务：可以让 Agent 先生成计划，经人类审核批准后，再无人值守地自动执行。

    融合趋势：在实际的复杂系统中，两者常常结合。例如，高层使用 Plan-and-Execute 制定战略计划，然后在执行每个具体子任务时，使用 ReAct 来进行灵活的动态交互。这就像一位项目经理先制定项目蓝图，但在执行每个具体任务时，又会根据实际情况灵活变通。


content:
  prompt: ReAct 中的动作空间可以包含哪些？搜索、计算、数据库查询、代码执行等。
answer:
  mode: rubric
  reference_answer: |-
    ReAct 的动作空间，定义了 Agent 与外部世界交互的能力边界。一个丰富、设计精良的动作空间，能让 Agent 成为超级连接器；而一个匮乏或不清晰的动作空间，则会限制其解决问题的能力。

    常见的动作类型

    - 信息获取类：

    - 精确计算与逻辑执行类：

    - 事务与操作类：

    - 人机协同类：

    - 任务控制类：

    设计动作空间的要点

    - 原子性：每个动作应该做一件很小的、定义清晰的事情。一个庞大的、参数复杂的动作会让模型难以驾驭。

    - 命名清晰：动作名应直观反映其功能，如 Search、Calculator。这在提示工程中至关重要。

    - 描述精准：在提示中，对每个动作必须提供详细的描述、适用场景和参数格式，特别是要说明其能力边界和限制。

    一个精心设计的动作空间，是 Agent 能力大厦的坚实基础。


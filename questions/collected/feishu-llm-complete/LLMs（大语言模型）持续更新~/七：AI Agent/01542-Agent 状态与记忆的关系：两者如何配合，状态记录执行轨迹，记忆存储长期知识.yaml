content:
  prompt: Agent 状态与记忆的关系：两者如何配合，状态记录执行轨迹，记忆存储长期知识。
answer:
  mode: rubric
  reference_answer: |-
    状态和记忆是 Agent 认知架构中两个互补的核心组件，它们共同支撑了 Agent 的连贯性和智能性。可以将它们的关系类比为计算机的内存与硬盘。

    Agent 状态——高速的内存

    Agent 状态是临时的、与当前任务强相关的上下文工作区。它记录了从任务开始到当前时刻的完整执行轨迹，包括每一轮的思考、行动和观察，以及当前的任务计划和中间变量。它的生命周期通常与一次任务或一次会话绑定。状态的目标是精确和完整，为 LLM 提供进行下一步推理所需的最小充分上下文。它是高速读写的，通常存储在内存或 Redis 等快速缓存中。

    长期记忆——持久的硬盘

    长期记忆是跨任务、跨会话的持久化知识库。它存储的是从无数次任务状态中提炼和抽象出来的精华，例如用户的偏好、过去成功解决问题的策略、从失败中总结的教训、以及关于外部世界的结构化知识（如知识图谱）。它的目标不是完整复现，而是语义关联和长期保留。它是低速读写的，通常存储在向量数据库或传统数据库中。

    两者的配合机制

    - 从状态到记忆的“写入”：当一个任务完成（或失败）后，一个反思模块会分析整个执行轨迹（即该任务的状态）。它会从中提取出高价值的信息，例如“用户偏好简洁的代码”、“使用工具A时需注意参数X的格式”，然后将这些提炼后的知识存入长期记忆。

    - 从记忆到状态的“读取”：当一个新任务开始时，Agent 的状态是空的。此时，它会根据新任务的描述，主动去长期记忆中检索相关的知识（如用户画像、历史成功案例）。检索到的这些“回忆”会被作为上下文的一部分，注入到初始状态中，或者成为状态中 memory_context 字段的一部分。

    通过这种“状态记录轨迹 -> 提炼写入记忆 -> 记忆注入未来状态”的循环，Agent 实现了从单次经验中学习和成长的能力。


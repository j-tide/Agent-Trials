content:
  prompt: 什么是 Function Calling？它在 LLM Agent 中扮演什么角色？
answer:
  mode: rubric
  reference_answer: |-
    核心定义

    Function Calling（函数调用）是大语言模型的一项关键能力，它允许模型在生成文本的过程中，不是直接输出最终答案，而是输出一个结构化的、包含函数名和参数的 JSON 对象，用以“请求”外部系统执行一个具体的操作。这个操作可以是查询数据库、调用 API、运行代码、搜索互联网，或者任何其他可以被程序化执行的功能。

    从本质上讲，Function Calling 是赋予大语言模型“行动能力”的接口。它让模型从一个只能进行文字交流的“聊天机器”，进化为一个能够主动与外部世界进行交互、获取实时信息、并产生实际影响的“智能 Agent”。

    在 LLM Agent 中的核心角色

    Function Calling 是 Agent 实现从“思考”到“行动”的枢纽，扮演着三个不可替代的角色。

    - 连接语言与行动的桥梁：大语言模型的核心能力是处理非结构化的自然语言，而外部世界运行在结构化的 API、数据库查询和代码逻辑之上。Function Calling 凭借其精确定义的 JSON Schema，将模型模糊的意图翻译成了机器可精确执行的指令。例如，用户说“帮我查一下明天北京的天气”，模型通过 Function Calling 并不会直接生成天气预报，而是输出 {"name": "get_weather", "parameters": {"city": "北京", "date": "2024-05-21"}}。这个 JSON 对象就是桥梁，它的一头连接着用户的自然语言意图，另一头连接着能够获取天气数据的代码函数。

    - 实现动态、按需的知识与能力获取：LLM 的参数化知识是静态的，存在截止日期，也无法涵盖所有领域。Function Calling 让模型可以突破这一限制。当模型判断需要最新信息或执行特定操作时，它可以主动“调用”工具来满足需求。这使得 Agent 具备了动态扩展能力：它可以随时接入新的 API 来获取股价、调用计算器进行精确算术、或者查询企业内部的客户数据库。Agent 不再是一个被训练后就固化的系统，而是一个能够按需学习和使用新工具的开放平台。

    - 支持复杂任务的规划与执行：单个工具调用往往只能完成一个原子操作。但通过多轮 Function Calling，Agent 可以实现对复杂任务的自主规划与逐步执行。例如，用户要求“帮我预订一张下周五从北京到上海的高铁票，并发送确认邮件”。Agent 的规划器会将其分解为：① 调用“查询列车时刻表”工具；② 分析结果并选择最优车次；③ 调用“预订车票”工具；④ 获取预订结果后，调用“发送邮件”工具。在这一系列动作中，每一步都由一次 Function Calling 驱动，模型在获取到上一步的返回结果后，会继续推理下一步的动作。这个过程展示了 Function Calling 作为 Agent “行动闭环”的核心驱动作用。

    结论：Function Calling 是 LLM 从“能说”到“能做”的质变点。它把模型的推理能力，通过结构化的工具接口，拓展到了广阔的物理世界和信息世界，是现代 Agent 框架的基石。


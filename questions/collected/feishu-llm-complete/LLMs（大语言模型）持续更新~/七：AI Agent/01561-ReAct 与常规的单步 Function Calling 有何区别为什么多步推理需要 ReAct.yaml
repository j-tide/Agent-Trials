content:
  prompt: ReAct 与常规的单步 Function Calling 有何区别？为什么多步推理需要 ReAct？
answer:
  mode: rubric
  reference_answer: |-
    常规的单步 Function Calling 和 ReAct 的根本区别，不在于是否使用函数，而在于推理和行动的组织方式。前者是一次性的映射，后者是交互式的探索。

    单步 Function Calling 的工作模式

    在单步 Function Calling 中，模型收到用户请求后，立即分析出意图，选择最合适的一个工具，并生成一次函数调用。后端执行该工具，返回结果，然后模型基于此结果生成最终答案。这个过程是确定的、线性的：请求 -> 选择工具 -> 生成调用 -> 得到结果 -> 回答。

    这种模式对于“帮我查一下明天北京的天气”这样简单的、单目标的查询非常高效。但当任务变复杂时，它的局限性就暴露了。例如，用户问“帮我比较一下这两款新发布的手机的性能”，这个任务隐含着多个子步骤：需要先分别搜索手机 A 和 B 的详细性能参数，然后进行对比分析。单步调用无法直接完成，因为它无法在一次调用中同时执行多个搜索，也无法在获得第一个搜索结果后，基于结果去调整第二个搜索的查询。

    为什么多步推理需要 ReAct

    多步推理任务的核心特征是：任务目标无法通过一次工具调用达成，需要多轮次的、有条件的信息获取和加工，并且每一步的决策都依赖于之前所有步骤的累积结果。

    ReAct 正是为此而生。它将一个复杂任务动态地分解为一系列简单的原子操作。在“比较两款新手机”的例子中，ReAct 的流程是：

    - Thought: “我需要先分别获取手机 A 和 B 的性能参数。先查手机 A。”

    - Action: Search[手机A 性能参数]

    - Observation: 获取到手机 A 的信息。

    - Thought: “已获取手机 A 信息。接下来用同样的方式搜索手机 B 的参数。”

    - Action: Search[手机B 性能参数]

    - Observation: 获取到手机 B 的信息。

    - Thought: “现在两款手机的信息都有了，可以进行对比分析并给出答案。”

    - Action: Finish[对比分析结果]

    在这个过程中，ReAct 的 Thought 起到了关键的“逻辑粘合剂”作用，它将多个独立的、被动的工具调用串联成一个智能的、目标导向的行动序列。因此，ReAct 不是 Function Calling 的替代品，而是它的“指挥家”，专为需要多步、动态推理的复杂任务而生。


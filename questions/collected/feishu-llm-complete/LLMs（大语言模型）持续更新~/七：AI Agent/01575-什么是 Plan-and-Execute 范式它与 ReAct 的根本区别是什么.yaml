content:
  prompt: 什么是 Plan-and-Execute 范式？它与 ReAct 的根本区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    Plan-and-Execute 是一种将复杂任务的规划和执行显式分离的 Agent 架构范式。它首先由一个“规划器”对任务目标进行全局分解，生成一份结构化的、包含一系列有序子任务或步骤的“行动计划”，然后将这份计划交给一个“执行器”去逐步执行。这种范式的核心理念是“谋定而后动”，强调在动手之前先构建全局蓝图，以保证最终产出的结构完整性和逻辑一致性。

    它与 ReAct 的根本区别在于对“规划”和“执行”的时空关系的处理。

    ReAct 将规划和执行高度融合，形成一个实时的、步进的“思考-行动-观察”闭环。它不在行动前制定完整计划，而是每走一步都根据最新的环境反馈来决定下一步怎么走。这赋予它极大的灵活性和动态应变能力，但也使其容易在长程任务中迷失方向，缺乏对全局的掌控。

    Plan-and-Execute 则将规划和执行严格分离，先完成规划，再按部就班执行。这种分离带来了几个关键优势：第一，它对最终产出有更强的全局控制和结构保证，特别适合格式严格、步骤明确的复杂任务；第二，它允许在执行前对计划进行审核和修正，高风险场景下可由人类把关；第三，执行过程相对简单、可预测，降低了在每一步都进行复杂推理的成本。其劣势在于对动态变化的适应能力较弱，当环境变化导致初始计划失效时，需要额外的重规划机制来补救。

    简单类比，ReAct 像一位经验丰富的即兴爵士乐手，在舞台上根据现场氛围和同伴的演奏实时创造旋律，灵活但不确定；而 Plan-and-Execute 像一位建筑工程师，在施工前必须先完成详细的设计蓝图，然后严格按照图纸建造，确保最终的大楼稳固且符合预期。


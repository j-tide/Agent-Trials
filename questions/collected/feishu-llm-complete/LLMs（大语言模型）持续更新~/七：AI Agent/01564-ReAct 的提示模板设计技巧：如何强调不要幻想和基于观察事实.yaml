content:
  prompt: ReAct 的提示模板设计技巧：如何强调“不要幻想”和“基于观察事实”？
answer:
  mode: rubric
  reference_answer: |-
    让 Agent 杜绝幻觉，是其从“玩具”走向“工具”的核心要求。这不能仅靠一句“不要胡编”来实现，而必须通过系统化的提示工程，将“基于事实”内化为模型的底层行为准则。

    技巧一：在系统提示中建立绝对的规则层级

    在系统提示的开头，使用最强硬、最无歧义的语言设定原则。可以设置一个 [最高指令] 板块：“你的所有回答必须严格遵守以下原则：1. 你只能基于‘Observation’中提供的信息来回答问题。2. 如果Observation中的信息不足以回答问题，你必须诚实地说明‘信息不足’，严禁使用你自身的知识进行猜测或补充。3. 你所生成的一切事实性陈述，都必须能追溯到某次具体的Observation。”

    技巧二：通过正反示例让规则具体化

    抽象的规则不如一个鲜活的例子。在少样本示例中，必须包含两类关键案例。一个是正面案例，展示模型是如何在Observation中找到关键事实后，将其完整、准确地用于最终答案。更重要的是，要提供反面案例，展示模型在Observation信息不足时，是如何放弃编造，转而诚实地告知用户“无法找到”或发起进一步搜索的。这种“知止”的示范，比任何指令都更有说服力。

    技巧三：设计强制性的“信息溯源”步骤

    在提示模板中，可以要求在生成最终答案时，必须包含一个“信息来源”的附加说明。例如，让模型在 Finish 之前，先输出 Thought: 我的答案基于以下观察：第1轮搜索和第3轮搜索。 这种强制性的溯源步骤，会迫使模型在生成答案前，必须自觉地与观察内容进行核对。

    技巧四：优化观察的注入方式

    在格式化Observation时，不要只是提供一个编号列表。可以在其前后加上明确的指示性文本，例如：

    text

    [系统] 以下是搜索引擎返回的真实信息。请注意，你必须只基于这些信息进行推理。[观察开始]1. ...[观察结束]

    这种“标记”强化了观察内容的权威性和边界性，让模型更清楚地认识到，什么是它应该依赖的证据，什么是它不应跨越的雷池。

    通过这些层层递进的约束和引导，可以让“基于观察事实”从一句口号，变成模型根深蒂固的行为模式。


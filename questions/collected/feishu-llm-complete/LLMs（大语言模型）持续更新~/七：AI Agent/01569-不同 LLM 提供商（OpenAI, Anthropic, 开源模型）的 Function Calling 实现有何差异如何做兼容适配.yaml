content:
  prompt: 不同 LLM 提供商（OpenAI, Anthropic, 开源模型）的 Function Calling 实现有何差异？如何做兼容适配？
answer:
  mode: rubric
  reference_answer: |-
    不同 LLM 提供商在 Function Calling 的实现上，虽然在核心思想（用结构化输出驱动工具调用）上殊途同归，但在具体的 API 格式、参数传递方式、模型提示和功能特性上存在显著差异。这给多模型兼容框架的开发带来了挑战。

    一、实现差异

    - OpenAI (GPT系列)：是最早将 Function Calling 标准化的厂商之一。其 API 接受一个 tools 参数，内包含一个符合特定 JSON Schema 格式的函数列表。模型会返回一个 tool_calls 数组，其中包含函数名和一个 JSON 字符串格式的 arguments。它原生支持在一次响应中发起多个并行的工具调用。执行结果通过 role: "tool" 的消息，并附带 tool_call_id 进行回传。

    - Anthropic (Claude系列)：Claude 的工具使用模式略有不同。其 API 也接受 tools 参数，但定义方式更贴近其内部格式。Claude 强调逐步推理，在决定调用工具时，其响应中的 stop_reason 会是 "tool_use"，并返回一个包含 name 和 input 的 JSON 对象。工具返回后，需要以 tool_result 的内容块形式传回。其模型训练更侧重于安全、谨慎地使用工具。

    - 开源模型 (如 Llama 3, Qwen 2, Mistral等)：开源模型的工具调用能力依赖于其指令微调数据集。它们的实现方式更加多样化。

    二、兼容适配策略

    要构建一个统一的、屏蔽底层差异的工具调用层，推荐采用适配器模式。

    - 定义统一的内部 Schema：在你的应用程序中，定义一套你自己的、与提供商无关的工具定义规范（如标准的 JSON Schema 格式）。这是你系统内部的通用语言。

    - 为每个提供商实现适配器：对于每一个你需要支持的 LLM 提供商（OpenAI, Claude, Llama 3 等），编写一个适配器模块。这个适配器负责两件事：

    - 组件化切换：在 Agent 的配置中，通过依赖注入的方式，轻松切换或混合使用不同提供商的 LLM，而无需修改任何上层的业务逻辑代码。这使得你的 Agent 可以在成本、性能、安全等不同维度上自由选择最合适的模型。

    通过这种方式，你可以成功地将上层应用的稳定性与底层 LLM 生态的快速变化进行解耦。


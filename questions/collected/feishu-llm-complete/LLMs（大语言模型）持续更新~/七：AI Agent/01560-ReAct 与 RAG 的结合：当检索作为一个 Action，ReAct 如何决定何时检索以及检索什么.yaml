content:
  prompt: ReAct 与 RAG 的结合：当检索作为一个 Action，ReAct 如何决定何时检索以及检索什么？
answer:
  mode: rubric
  reference_answer: |-
    ReAct 与 RAG 的结合，是赋予 Agent 主动获取知识的智慧，解决了传统 RAG 中“检索什么”和“何时检索”的固定化问题。

    传统的 RAG 是“被动检索”：系统在收到用户查询后，立即无差别地进行一次检索，然后将检索结果作为上下文喂给 LLM。这种“一次检索，全篇使用”的模式在复杂任务中往往不够。

    ReAct 使 RAG 进化为“主动、动态的检索”。在 ReAct 框架中，检索只是一个与其他工具等同的 Action，例如 Search[query] 或 Retrieve[query]。LLM 成为了检索的决策者，它能自主决定两个关键问题：何时检索，以及检索什么。

    决策机制：如何决定

    - 何时检索：这由 ReAct 的 Thought 驱动。Agent 会在推理过程中评估自己的知识状态。当 Thought 中出现“我不确定这个信息”、“我需要核实一下”或“要回答这个问题，我需要更多关于 X 的证据”等分析时，就触发了检索 Action。它可能在一开始就检索，也可能在生成答案的过程中发现信息不足，临时决定补充检索。它甚至可以决定不检索，如果它认为自己已经掌握了足够的信息。

    - 检索什么：同样由 Thought 决定。Agent 不是简单地用原始用户问题去检索，而是会生成一个专门为检索优化的查询。例如，用户问“那件事后来怎么样了？”，Agent 的 Thought 会分析：“用户指的是上一轮对话中提到的 A 公司收购案。我需要检索它最新的进展。” 然后，它会生成 Action Search[A公司 收购案 最新进展]。这个查询比原始问题“那件事后来怎么样了”要精准得多。

    协同工作的流程

    一个完整的 ReAct+RAG 工作流可能是这样的：

    - Thought：“用户问了一个关于最新科技政策的问题。我需要查一下最新的官方文件。”

    - Action：Retrieve[2024年 人工智能 政策 文件]

    - Observation：获取到几篇相关政策文档。

    - Thought：“检索到的文档提到了政策A，但并没有详细说明其具体条款。我需要针对政策A进行二次检索。”

    - Action：Retrieve[政策A 具体条款 实施细则]

    这种交互式的检索策略，使得 Agent 能够像一位侦探一样，根据线索不断调整搜索方向，精准地找到那些埋藏在海量信息中的关键证据。它使得 RAG 从一种信息注入技术，升级为一种由 Agent 智能驱动的信息探索策略。

    - 搜索：最核心的动作。可以是通用网络搜索，也可以是针对特定领域（如企业内部文档、学术论文）的搜索。

    - 数据库查询：通过生成 SQL 或自然语言查询，从结构化数据库中提取精确信息。

    - 文档检索：在 RAG 架构中，直接对知识库进行向量相似度检索。

    - 计算器：执行安全的数学表达式，解决模型不擅长的精确算术问题。

    - 代码解释器：在隔离的沙箱中运行 LLM 生成的代码，用于数据分析、图表生成、复杂算法验证等。

    - API 调用：与外部服务交互，如发送邮件、创建日程、下单购物、控制智能家居。这类操作通常具有现实世界的副作用，需要权限控制。

    - 数据写入：更新数据库或用户资料。这需要严格的安全和认证机制。

    - 向用户提问：当遇到信息缺失或指令模糊时，主动向用户发起澄清，获取必要信息。这赋予了 Agent 谦逊和协作的能力。

    - 完成任务：即 Finish，提交最终答案。

    - 放弃任务：在确认无法完成时，优雅地退出并解释原因。

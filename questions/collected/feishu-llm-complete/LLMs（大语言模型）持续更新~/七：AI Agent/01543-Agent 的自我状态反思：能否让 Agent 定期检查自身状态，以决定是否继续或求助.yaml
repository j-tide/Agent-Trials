content:
  prompt: Agent 的“自我状态”反思：能否让 Agent 定期检查自身状态，以决定是否继续或求助？
answer:
  mode: rubric
  reference_answer: |-
    答案是肯定的。这正是赋予 Agent 元认知能力的关键一步。自我状态反思，是指 Agent 不仅仅执行任务，还能像一个经验丰富的司机一样，时不时地“看一眼仪表盘”，评估自己的状态，并据此调整驾驶策略。

    实现机制

    - 设定反思触发点：在 Agent 的执行循环中，设定一些固定的或条件式的反思检查点。例如，在执行完每一个子任务后，或者在对话轮次达到一定数量时，强制暂停任务执行。

    - 注入反思提示：在触发点，系统不再发送任务推进的指令，而是向 LLM 注入一个专门用于反思的 System Prompt：“请暂停当前任务，查看以下状态报告。你的目标是评估任务进度。请回答：1. 我们是否走在正确的轨道上？2. 当前策略是否高效？3. 是否遇到了无法解决的困难？4. 下一步最优的行动是什么？”

    - 评估状态与决策：LLM 会阅读当前的状态摘要，并做出高级决策。它可能会得出结论：

    价值

    这种反思能力，让 Agent 的行为从简单的“反应式”进化到了“内省式”。它不仅能处理已知的错误，还能主动识别潜在的失败风险，并在陷入死局之前就向人类求助。它是构建真正可靠、值得信赖的自主 Agent 不可或缺的一环。


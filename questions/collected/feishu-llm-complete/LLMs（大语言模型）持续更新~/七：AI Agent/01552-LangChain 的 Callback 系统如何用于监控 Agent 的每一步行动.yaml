content:
  prompt: LangChain 的 Callback 系统如何用于监控 Agent 的每一步行动？
answer:
  mode: rubric
  reference_answer: |-
    LangChain 的 Callback 系统是一个强大的、贯穿其所有模块的事件监听和钩子机制。它允许开发者在 Agent 运行的几乎每一个关键节点插入自定义的逻辑，而无需修改 Agent 的核心代码。这为日志记录、监控、调试和成本追踪提供了极大的便利。

    Callback 系统的工作原理

    LangChain 的大多数核心组件（LLMs, Chains, Tools, Agents）在执行过程中，会在特定时机触发预定义的事件。开发者可以创建一个回调处理器（Callback Handler），在其中实现对应这些事件的处理函数。然后将这个处理器传递给 AgentExecutor。AgentExecutor 在运行时，会在事件发生时调用处理器中相应的函数。

    监控 Agent 每一步行动的关键事件

    一个用于监控 Agent 的典型回调处理器会关注以下几个核心事件：

    - on_llm_start / on_llm_end：

    - on_tool_start / on_tool_end / on_tool_error：

    - on_agent_action / on_agent_finish：

    代码示例 (概念性)

    ```python
    from langchain.callbacks import StdOutCallbackHandler

    # StdOutCallbackHandler 是一个内置的处理器，可以将所有事件打印到控制台
    # 这在开发调试阶段极其有用
    executor = AgentExecutor(agent=agent, tools=tools, callbacks=[StdOutCallbackHandler()])

    # 你可以创建自定义处理器
    class MyMonitorHandler(BaseCallbackHandler):
        def on_llm_end(self, response, **kwargs):
            print(f"LLM调用结束，消耗Token: {response.llm_output['token_usage']}")

        def on_tool_error(self, error, **kwargs):
            print(f"工具调用出错: {error}")

    executor = AgentExecutor(agent=agent, tools=tools, callbacks=[MyMonitorHandler()])
    ```

    通过 Callback 系统，开发者可以像拥有一个透明的仪表盘一样，实时掌握 Agent 的内部运行状态，从而进行高效的调试和性能优化。


content:
  prompt: Plan-and-Execute 与分层 Agent 架构的关系：高层的 Planner 和低层的工具执行器如何交互？
answer:
  mode: rubric
  reference_answer: |-
    Plan-and-Execute 是分层 Agent 架构最经典、最直观的实现形式。在这种架构中，高层的 Planner 和低层的 Executor 通过定义清晰的接口进行交互，实现了“战略”与“战术”的完美分离。

    交互关系与职责分离

    - 高层 Planner：是系统的“大脑”，负责战略制定。它接收宏观任务目标，进行全局分解，生成详细的行动计划（JSON 列表）。在出现异常时，它接收 Executor 的升级报告，进行重规划。它不关心底层工具的具体调用细节。

    - 低层 Executor：是系统的“手脚”，负责战术执行。它接收 Planner 的输出——一份结构化的行动计划。它按照计划顺序，逐步执行每个步骤。在执行时，它会进行必要的局部推理（如动态参数填充），调用具体的工具，收集执行结果。

    交互协议

    两者之间的交互通过清晰定义的消息协议来完成，实现了解耦。

    - 下发的消息（计划）：Planner -> Executor。格式为一份结构化的 JSON 计划，包含所有步骤及其元数据。这是 Executor 的行动依据。

    - 上报的消息（状态与异常）：Executor -> Planner。正常执行时，Executor 上报步骤完成状态和关键结果。异常时，上报一份包含失败步骤、失败原因和当前状态的“重规划请求”。

    - 共享的上下文（黑板）：Planner 和 Executor 可以共享一个公共的“任务状态黑板”。Executor 实时更新当前进度、已获取的关键信息和中间产物。Planner 在进行重规划时，可以直接读取这块黑板，获取当前任务的全貌，而不需要 Executor 逐一报告。

    这种交互模式的价值

    这种分层架构使得系统的各个部分可以独立演化、独立测试。例如，你可以只升级 Executor 的工具调用逻辑，而无需修改 Planner 的规划策略。你也可以在同一个 Planner 下，为不同任务切换不同的 Executor。它完美体现了软件工程中“高内聚、低耦合”的设计原则，是构建复杂、可靠 Agent 系统的不二法门。


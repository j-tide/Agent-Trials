content:
  prompt: 如何评估 Agent 规划的质量？除了任务成功率，还有哪些指标？
answer:
  mode: rubric
  reference_answer: |-
    评估 Agent 规划的质量，远比评估单次问答复杂。它不仅要看最终结果“对不对”，更要看整个过程“好不好”——是否高效、是否可靠、是否经济。

    核心评估维度与指标：

    - 规划的正确性与准确性：

    - 规划的效率与资源消耗：

    - 规划的鲁棒性与适应性：

    - 规划的可解释性与可信度：

    - 规划的泛化能力：

    一个全面的评估体系，应将这些指标组合起来，形成一张评估规划能力的“雷达图”，从而多维度地揭示 Agent 的优缺点。


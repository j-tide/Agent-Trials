content:
  prompt: 一个 LLM 调用可能涉及多个工具，如何设计提示让模型选择正确的工具并提取参数？
answer:
  mode: rubric
  reference_answer: |-
    核心问题

    当你的 Agent 拥有数十个功能各异的工具时，确保模型在每次调用中都能精准地选择出正确的工具，并为其提取参数，是系统设计的一大挑战。这本质上是要求模型在一个有限的上下文窗口内，完成一次高精度的“意图分类”和“槽位填充”联合任务。

    提示设计策略

    - 核心提示：角色、职责与基本规则

    系统提示的开头应奠定全局基调。需要明确告知模型：“你是一个智能助手，你的职责是帮助用户完成他们的请求。你可以通过调用一系列工具来获取信息或执行操作。请仔细阅读用户的问题，并根据下面提供的工具列表，选择最合适的工具来完成任务。你必须只从下面提供的工具列表中选择，不要使用任何未列出的工具。”

    - 工具描述的质量是基石
    如前所述，每个工具的 name 和 description 必须极其精确，特别是要阐明其“能力边界”。当两个工具功能相似时，必须在描述中清晰地指出它们的区别和使用场景。

    - 注入“思考链”指导（Chain-of-Thought）

    为了防止模型在复杂任务中“跳步”或选错工具，可以在提示中注入一个隐性或显性的思考链指导。

    - 隐式：在系统提示中加入：“在选择工具之前，请先在内心分析：用户的核心需求是什么？要完成这个需求，需要哪些信息？这些信息中哪些是已知的，哪些是缺失的？哪一个工具能够最有效地填补这个信息缺口？”

    - 显式：要求模型在输出工具调用前，生成一段思维链文本（取决于 API 是否支持）。这段文本可以清晰地展示它的推理逻辑，便于调试。

    - 利用少样本示例进行场景化教学

    对于特别容易混淆的、或者需要复杂参数组合的工具集，提供一到两个高质量的少样本示例是极其有效的。示例应覆盖“单工具调用”、“多工具并行调用”和“基于上一步结果进行后续调用”等不同场景。好的示例能将抽象的工具描述具象化，让模型精准领悟在不同语境下的正确选择。

    - 明确定义“无法处理”的回退策略

    工具集不可能覆盖所有用户问题。必须告诉模型，当它找不到任何合适的工具来处理用户请求时应该怎么做。例如，在提示中规定：“如果没有任何工具能够满足用户请求，请礼貌地解释你目前的能力限制，并向用户提供你所支持的操作列表。”

    组合运用

    一个健壮的、多工具的选择与提取系统，不是靠某一个神奇的提示词，而是靠高质量的工具 Schema、清晰的系统指令、以及精心设计的场景示例三者共同作用的结果。其中，Schema 负责定义“是什么”，系统指令负责约束“怎么做”，示例负责展示“在具体场景下如何做”。这三者共同构成了模型进行准确决策的全部上下文。


content:
  prompt: 设计一个 Agent 状态模型：包括对话历史、当前任务、已执行步骤、记忆快照等。
answer:
  mode: rubric
  reference_answer: |-
    一个健壮且可扩展的 Agent 状态模型，是构建复杂智能体系统的核心。它应该是一个结构化的、可序列化的对象，能够全面、清晰地反映 Agent 在任一时刻的“处境”。

    状态模型的核心字段

    ```json
    {
      // 1. 标识与元数据
      "session_id": "uuid-string",
      "user_id": "user-123",
      "agent_id": "agent-v2.1",
      "created_at": "ISO8601-timestamp",
      "last_updated_at": "ISO8601-timestamp",

      // 2. 对话历史
      "chat_history": [
        {"role": "user", "content": "帮我写一份关于AI的报告"},
        {"role": "assistant", "content": null, "tool_calls": [{"id": "1", "name": "search", "arguments": {"query": "2024 AI trends"}}]},
        {"role": "tool", "content": "搜索结果显示...", "tool_call_id": "1"}
        // ... 更多消息
      ],

      // 3. 任务与计划
      "task": {
        "original_goal": "帮我写一份关于AI的报告",
        "plan": [  // 由Planner生成的结构化计划
          {"step_id": 1, "goal": "搜集最新AI趋势资料", "status": "completed", "depends_on": []},
          {"step_id": 2, "goal": "整理报告大纲", "status": "in_progress", "depends_on": [1]},
          {"step_id": 3, "goal": "撰写报告内容", "status": "pending", "depends_on": [2]}
        ]
      },

      // 4. 工作变量与中间结果
      "scratchpad": {
        "search_results_summary": "2024年AI趋势主要集中在多模态和Agent...",
        "report_outline": "一、引言 二、趋势一 三、趋势二 ...",
        "generated_draft": "这是一份关于AI的报告草稿..."
      },

      // 5. 记忆快照 (从长期记忆中检索到的、与当前任务相关的信息)
      "memory_context": [
        {"type": "user_preference", "content": "用户偏好Markdown格式的文档，并使用正式语气。"},
        {"type": "past_experience", "content": "上次撰写报告时，因缺少数据支撑被用户批评。"}
      ],

      // 6. 资源与约束
      "resource_limits": {
        "max_steps": 10,
        "current_step": 3,
        "max_token_budget": 50000,
        "tokens_consumed": 12000,
        "time_budget_seconds": 600,
        "elapsed_time_seconds": 45
      }
    }
    ```

    设计原则

    - 完整性：状态必须包含让 Agent 从零恢复执行所需的一切信息。

    - 可序列化：所有字段都必须是可被 JSON 或 Pickle 序列化的，以支持持久化和跨服务传输。

    - 可扩展性：scratchpad 和 memory_context 等字段应保持灵活，以容纳不同类型的临时数据和上下文。

    - 可审计性：状态本身就是一份完美的执行日志，便于调试和分析。


content:
  prompt: 什么是 LangGraph？它如何支持构建有状态、多步骤的 Agent 工作流？
answer:
  mode: rubric
  reference_answer: |-
    LangGraph 是 LangChain 生态中的新一代框架，它专门用于解决构建有状态、多步骤、带有循环和条件分支的复杂 Agent 工作流的问题。

    LangGraph 的核心思想

    LangGraph 将 Agent 的工作流抽象为一个有向循环图。图中的“节点”代表一个计算步骤（例如，调用 LLM、执行一个工具、进行一个判断），而“边”则代表从一个步骤到下一个步骤的流程。这个抽象完美地匹配了像 ReAct 这样的循环范式，也支持更复杂的、非线性的多 Agent 交互。

    如何支持复杂工作流

    - 状态图：LangGraph 将整个工作流的状态（包括对话历史、中间变量等）封装在一个共享的 State 对象中。每个节点函数接收这个 State，并返回一个更新后的 State。这使得数据在整个复杂工作流中的传递变得清晰可控。

    - 节点与边：开发者通过定义不同的节点（Node）来封装各种任务逻辑。例如，一个 call_agent 节点用于调用 LLM，一个 execute_tool 节点用于执行工具。然后，通过添加边（Edge）来定义任务流转。除了普通的边，还有条件边，它允许根据上一步的输出状态，动态地决定下一步跳转到哪个节点。例如，如果 LLM 的决策是“调用工具”，就走向工具节点；如果是“最终答案”，就走向结束节点。

    - 内置循环与持久化：由于图本身可以是循环的，LangGraph 自然支持 Agent 的“思考-行动-观察”循环。更重要的是，LangGraph 提供了强大的检查点和持久化功能。它能自动保存每个步骤完成后的图状态。这意味着，当工作流因意外中断后，可以从最近的检查点恢复运行，而不是从头开始。这对于长时间运行的高成本任务至关重要。

    与传统 LangChain Agent 的对比

    传统的 AgentExecutor 是一个黑盒的、固定的循环。开发者很难介入其内部流程。而 LangGraph 将这个黑盒打开了，变成了一张透明的、可完全由开发者定制的“工作流蓝图”。这使得你可以构建任意复杂的 Agent 拓扑，比如在调用 LLM 之前强制进行输入安全检查，或者在得到最终答案后强制进行事实性校验。

    因此，LangGraph 是 LangChain 从“简单自动化”走向“复杂、可靠的生产级 Agent 应用”的关键一步。


content:
  prompt: AutoGen 中如何定义 Agent 的角色和能力？UserProxyAgent 和 AssistantAgent 的职责。
answer:
  mode: rubric
  reference_answer: |-
    在 AutoGen 中，每个 Agent 都是一个独立的实体，其角色和行为由一套精心设计的配置定义。这些配置共同构成了 Agent 的“个性”和“能力”。

    定义 Agent 的核心参数

    - name：Agent 的唯一标识符，在对话和日志中使用。

    - system_message：这是最关键的部分，是一个用自然语言书写的、高度定制的系统提示。它定义了 Agent 的角色、专长、职责、行为准则以及与其它 Agent 的交互方式。这就像为每个 Agent 编写了一份专属的“员工手册”。

    - llm_config：指定驱动此 Agent 的大语言模型，包括模型名称、API 密钥等。AutoGen 支持为团队中的不同 Agent 分配不同的 LLM，以实现成本与性能的最优组合。

    - code_execution_config：如果 Agent 需要执行代码，可以为其配置代码执行环境（如 Docker 容器），并提供执行结果。

    - function_map / tools：为 Agent 注册可调用的工具函数。这使得 Agent 可以通过生成函数调用来执行特定操作，如搜索网络、读写文件等。

    两个核心角色的职责

    - AssistantAgent：这是典型的“思考者”和“执行者”。它由 LLM 驱动，负责理解任务、生成计划、编写代码、调用工具和进行推理。它不直接与外部世界交互，而是通过发送消息（如建议调用某个函数）来驱动系统。它的角色类似于团队中的“技术专家”。

    - UserProxyAgent：这是人类用户或外部系统在 Agent 对话中的“全权代表”。它的核心职责是执行 AssistantAgent 提出的、需要与现实世界交互的操作。当 AssistantAgent 建议执行一个工具调用或一段代码时，UserProxyAgent 会实际去执行它，并将执行结果返回给对话。它也可以代表人类用户向 AssistantAgent 发起初始提问或提供反馈。它的角色类似于“项目经理”与“环境交互接口”的结合。

    两者的协作模式非常清晰：UserProxyAgent 代表用户提出需求，AssistantAgent 负责思考和规划，并请求 UserProxyAgent 去执行具体操作，UserProxyAgent 执行后将结果反馈给 AssistantAgent，如此循环，直至任务完成。


content:
  prompt: Executor 在执行每一步时，是否需要进行局部推理？还是机械执行？
answer:
  mode: rubric
  reference_answer: |-
    Executor 的核心职责是忠实地执行计划，但这并不意味着它是一个完全机械、不懂变通的机器人。高质量的 Executor 在执行每一步时，需要一定程度的局部推理，但它绝不应进行改变整体计划的“全局推理”。

    需要局部推理的场景

    - 动态参数填充：这是最常见的推理需求。计划中的某一步可能被定义为“搜索关于 X 的信息”，而 X 的具体值需要依赖前一步的执行结果。Executor 必须能读取上一步的输出，提取出 X 的值，填入当前步骤的参数中。这要求 Executor 具备上下文理解和参数映射的能力。

    - 结果评估与完成度判断：计划中每个子任务有一个“完成标准”。Executor 执行完一个动作后，需要判断动作的结果是否达到了这个标准。是成功、部分成功还是失败？这需要基于对结果文本的语义理解，而非简单的状态码检查。

    - 格式适配与细微调整：当工具返回的结果格式与下一步期望的输入格式不完全匹配时，Executor 可以进行微小的、无损核心语义的格式转换。

    禁止全局推理

    Executor 的权限边界是：绝不能对计划本身进行修改、调整顺序或决定跳过某个步骤。这种改变整体规划的决策，必须由更高层级的 Planner 通过“重规划”来完成。如果将全局推理权下放给 Executor，就会模糊 Plan-and-Execute 的边界，使其退化为 ReAct，失去其结构性和可控性的优势。

    实现方式

    Executor 通常由一个被精心提示的 LLM 来担任。提示词中会明确其职责范围：基于“总体计划”、“已完成的步骤及其结果”、“当前待执行的步骤”，生成执行该步骤所需的具体动作指令，并根据执行结果更新任务状态。

    因此，一个优秀的 Executor 是一个“戴着镣铐的舞者”，在给定的计划框架内进行智能的、局部的最优执行。


content:
  prompt: Plan-and-Execute 的典型流程：先由 Planner 生成完整计划，再由 Executor 逐步执行。
answer:
  mode: rubric
  reference_answer: |-
    一个完整的 Plan-and-Execute Agent 工作流程，可以清晰地划分为两个宏观阶段和若干个关键环节，形成一个从“战略制定”到“战术执行”的完整闭环。

    阶段一：规划

    - 接收任务与上下文：系统接收到用户的原始复杂目标，以及相关的背景信息（如用户画像、环境状态、可用工具列表等）。

    - Planner 生成计划：一个专门的、被提示为“战略规划师”的 LLM 被调用。它的输入是原始任务和上下文，输出是一份结构化、有序的、可执行的“行动计划”。这份计划将复杂目标分解为一系列逻辑依赖的子任务。计划中的每一步通常包含：步骤编号、子目标描述、需要执行的动作类型、动作所需的参数、以及该步骤所依赖的前置步骤。

    - 计划审核与确认：这是一个可选的、但极为重要的步骤。系统将生成的计划呈现给用户或一个独立的审核模块。用户可以在此阶段对计划进行审查、修改或确认。这能有效避免因规划错误导致后续大量无效的执行，尤其在高风险操作中不可或缺。

    阶段二：执行

    - Executor 逐步执行：Executor 按顺序读取计划中的每一步。对于每一步，它根据子目标描述和动作类型，执行相应的操作。这可能是调用一个工具（如搜索、计算、代码执行）、生成一段文本，或者向用户发起一个澄清式提问。

    - 局部推理与状态更新：Executor 在执行每一步时，并非完全机械。它通常需要进行小范围的局部推理，例如，将上一步工具返回的结果填入下一步动作的参数中。Executor 还会维护一个“任务状态”，记录已完成的步骤、关键中间结果和当前进度。

    - 观察与评估：每一步执行完毕后，Executor 会评估该步的结果。它需要判断该步是否成功，结果是否满足该子目标的完成标准。

    - 异常处理与重规划触发：如果某一步执行失败，或者结果与预期存在重大偏差，Executor 会将该异常连同当前的任务状态，反馈给 Planner。Planner 被再次调用，基于最新的信息进行“增量重规划”或“全局重规划”，生成一个新版本的计划，替换或追加到原有计划中。然后执行器从更新后的断点继续执行。

    - 任务完成与交付：当计划中所有步骤都已成功完成，或者满足终止条件时，Executor 执行一个最终的整合步骤，将所有子任务的成果组装成用户所需的最终产出。

    这个流程通过将“规划”和“执行”解耦，使得系统在结构性和灵活性之间找到了一个优秀的平衡点。


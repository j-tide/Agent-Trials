    总结：DoLa 可以看作是对比层解码思想在“单一模型内部”和“减少幻觉”这一特定目标上的创造性应用。它不需要一个外部的、训练好的业余模型，而是巧妙地利用了模型自身的层间差异来充当这个“业余模型”，从而实现了成本更低、更自适应的对比解码。


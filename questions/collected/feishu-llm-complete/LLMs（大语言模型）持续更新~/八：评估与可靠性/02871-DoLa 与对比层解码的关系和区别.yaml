  reference_answer: |-
    DoLa 与对比层解码都利用了 Transformer 模型的层间信息差异来改善生成质量，它们同属“对比解码”这个大家族，但有着不同的侧重点和目标。

    核心关系

    两者都是免训练的、通过对比模型不同层输出来干预解码的方法。它们的基础数学形式非常相似，都是对比两个不同来源的 logits。


content:
  prompt: 红队测试与对抗训练的关系：测试发现的失败案例如何转化为训练数据？
answer:
  mode: rubric
  reference_answer: |-
    红队测试与对抗训练之间是一个 “发现-过滤-转化-强化”的闭环，这是模型安全能力持续进化的核心引擎。红队测试负责“发现问题”，对抗训练负责“修复问题”。

    从失败案例到高质量训练数据的转化流程

    - 攻击结果的人工审核与精细化标注（关键步骤）：自动化红队产生的“成功攻击”案例，不能直接作为训练数据。必须经过人类安全专家的审核。专家们会完成以下工作：

    - 数据增强与泛化：获得一批高质量的“攻击-安全回复”种子对后，使用自动化工具对攻击 Prompt 进行增强（同义改写、多语种翻译、场景变异），生成更多样化的训练样本，防止模型死记硬背。

    - 融入对抗训练流程：

    这个闭环的每一次迭代，都会让模型对已知攻击的免疫力更强，并提升其泛化到未知攻击上的安全能力。


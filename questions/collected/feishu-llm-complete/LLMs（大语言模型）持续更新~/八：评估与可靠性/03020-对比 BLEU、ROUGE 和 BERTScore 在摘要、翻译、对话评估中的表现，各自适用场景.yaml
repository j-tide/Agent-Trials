  reference_answer: |-
    [嵌入表格未展开]

    在具体任务中的表现和选择

    - 翻译：BLEU 仍然是行业标准，因为其评测的是对源语言信息的精确转换。但 BERTScore 正日益成为更可靠的补充或替代。

    - 摘要：ROUGE 是历史标准，尤其 ROUGE-L 衡量句子结构的保持能力。BERTScore 在此任务上通常表现更优，尤其对于抽象式摘要。

    - 对话/开放式生成：BLEU 和 ROUGE 几乎完全失效，因为它们的评估假设与对话的“一对多”特性相悖。BERTScore 是目前最适合这类任务的自动化指标，尽管它仍不能替代人工评估。


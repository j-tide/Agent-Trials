  prompt: LLM.int8() 采用混合精度分解：对离群值用 FP16，其余用 INT8，阐述其动机和实现。
answer:
  mode: rubric
  reference_answer: |-
    动机：

    如 14 题所述，LLM 的隐藏层激活中存在极少量（<0.1%）但幅度极大的系统性离群值特征。这些离群值对量化是灾难性的——若强行 INT8 量化，会撑大缩放因子，导致其他 99.9% 的正常特征量化误差爆炸。然而，离群值仅分布在非常狭窄的通道中。LLM.int8() 观察到了这一现象，并提出：为何不将这些麻烦的离群值通道单独挑出来用 FP16 精确计算，而让剩下的绝大部分通道安全地享受 INT8 的效率？


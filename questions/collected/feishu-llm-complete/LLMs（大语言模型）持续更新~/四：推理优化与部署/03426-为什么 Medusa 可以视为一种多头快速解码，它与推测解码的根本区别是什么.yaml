content:
  prompt: 为什么 Medusa 可以视为一种“多头快速解码”，它与推测解码的根本区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    Medusa 被称为“多头快速解码”是因为它通过多个预测头在一次前向中同时生成多个未来 token，就像多头注意力一样并行工作，从单一隐藏状态出发做出多步预测。

    与标准推测解码的根本区别：

    [嵌入表格未展开]

    根本区别：推测解码依赖“外部”草稿模型，而 Medusa 将预测能力“内化”为目标模型的一部分，通过自带的轻量级多头实现投机，从而实现单模型投机解码。


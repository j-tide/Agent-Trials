    压缩比（Compression Ratio）通常定义为压缩后的尺寸与原始尺寸之比，即：

    [图片内容未导入]

    因此 KV Cache 被压缩到了原来的 25%，即节省了 75%。也可以反过来说压缩倍数为 4 倍（MHA 大小是 GQA 的 4 倍）。所以答案：

    [图片内容未导入]

    这表明使用 8 个 KV 头的 GQA 相比 32 头的 MHA，显存占用量仅为四分之一，极大降低了长文本推理的内存瓶颈。


content:
  prompt: 在使用 GQA/MQA 时，KV Cache 的大小如何变化？写出减少比例。
answer:
  mode: rubric
  reference_answer: |-
    GQA 和 MQA 通过减少独立的键值头数量来压缩 KV Cache，这是目前架构层面最有效的优化。

    - MHA (标准多头注意力)：有 H 个查询头，就有 H 个独立的键头（K head）和值头（V head）。KV Cache 总大小与 H 成正比。


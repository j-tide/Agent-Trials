content:
  prompt: 在 vLLM 或 TGI 中，如何开启流式输出？配置哪些参数？
answer:
  mode: rubric
  reference_answer: |-
    vLLM：

    - 启动 OpenAI 兼容服务器：

    ```bash
    python -m vllm.entrypoints.openai.api_server --model <model> --port 8000
    ```

    - 默认即支持流式，当客户端请求中 stream: true 时，服务端返回 SSE 流。

    - Python SDK/离线推理：

    ```python
    from vllm import LLM, SamplingParams
    llm = LLM(model="...")
    sampling_params = SamplingParams(stream=True)  # 在 SamplingParams 中开启
    ```

    - 然后使用 llm.generate(..., streaming=True) 或在异步引擎中使用 AsyncLLMEngine 的生成器。

    - 关键参数（SamplingParams）：

    TGI (Text Generation Inference)：

    - 通过 Docker 启动时，服务默认支持流式。使用 /generate_stream 端点（而非 /generate）进行流式请求。

    - 请求参数中 "stream": true（或直接调用 /generate_stream）。

    - 常用参数：max_new_tokens, stop_sequences, temperature 等。

    对比：

    - vLLM 通过 OpenAI 兼容 API 的 stream 选项开启，非常直观。

    - TGI 有专用的流式端点，同时也逐步兼容 OpenAI API 格式。

    两者都不需要服务端额外配置即可支持 SSE 流式输出，只需客户端请求中启用。


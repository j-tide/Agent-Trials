  reference_answer: |-
    假设当前已生成的序列长度为 t，隐藏维度为 d，注意力头数为 h，每个头的维度为 dk=d/h。

    不使用 KV Cache 时：
    对于长度为 t 的完整序列，自注意力的计算过程为：

    [图片内容未导入]

    使用 KV Cache 时：
    在第 t+1 步（假设已有长度为 t 的 KV Cache），计算新 token 的注意力：

    [图片内容未导入]

    复杂度差异的直观感受：生成第 1000 个 token 时，无 Cache 需要计算约 1,000,000 个 token 对的注意力，而有 Cache 只需计算约 1000 个。这个差距随着序列增长而飞速扩大，这正是 KV Cache 能够带来巨大加速的根本原因。


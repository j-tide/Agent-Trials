  prompt: 在实现 AWQ 时，缩放因子是作用在权重的输入通道还是输出通道？为什么？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    常见误解澄清：有时会提到“逐输出通道缩放”（对 W 的每一列），但这通常是权重量化中 per-channel scaling 的概念，与 AWQ 的激活感知缩放不同。AWQ 的缩放是在激活-权重等效变换中，作用在输入通道上。两者可叠加使用。


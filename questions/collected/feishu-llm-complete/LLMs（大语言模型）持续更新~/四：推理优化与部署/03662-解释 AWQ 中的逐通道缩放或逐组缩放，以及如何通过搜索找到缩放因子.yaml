  reference_answer: |-
    逐通道缩放（Per-channel Scaling）：
    AWQ 对权重的每个输入通道（即权重矩阵的一行，若权重形状为 [dout,din]，则每个输出神经元对应的权重向量）计算一个独立的缩放因子 si。转换形式为：

    [图片内容未导入]

    这样每个输出通道的权重被放大或缩小，对应激活通道被反向调整。通过适当选择 si（通道级），让重要通道的权重量化误差减小。

    逐组缩放（Per-group Scaling）：
    当计算 kernel 需要更粗粒度的缩放以减少元数据开销时（或为了硬件效率），可将多个通道分为一组共享同一缩放因子。例如，每 128 个通道为一组，使用相同的 s。在实现上更友好，同时保持大部分精度收益。


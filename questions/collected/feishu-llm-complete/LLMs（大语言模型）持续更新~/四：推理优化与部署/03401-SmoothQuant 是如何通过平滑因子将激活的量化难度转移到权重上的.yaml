    “难度转移”的机制与平滑因子计算：

    假设某个输入通道 j 的激活 X:,j具有大量离群值（幅度巨大），使得该通道的量化极难。SmoothQuant 为该通道选择一个平滑因子 sj>1（通常），这样：

    [图片内容未导入]

    然而，权重的分布更集中、稳定，且权重量化可以使用 per-channel 或 group-wise，放大带来的额外量化误差远小于激活量化的收益。因此，总体的量化误差大幅降低。

    平滑因子 s 的选择公式：
    SmoothQuant 论文提供了基于迁移强度的公式。设校准数据的激活平均幅度为 Aj=mean(∣X:,j∣)，权重对应行的最大幅度为 Bj=max(∣Wj,:∣)。则：

    [图片内容未导入]

    其中 α 是迁移强度超参数。当 α=0.5 时，激活和权重被同等平滑化；当 α 更大，更多负担转移给权重（激活量化更容易）。通常选 0.5 或通过 grid search 微调。


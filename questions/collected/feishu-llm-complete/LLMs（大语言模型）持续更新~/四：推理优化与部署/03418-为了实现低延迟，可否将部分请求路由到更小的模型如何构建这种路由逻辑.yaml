content:
  prompt: 为了实现低延迟，可否将部分请求路由到更小的模型？如何构建这种路由逻辑？
answer:
  mode: rubric
  reference_answer: |-
    可以，这正是“大小模型分流”或“级联推理”的典型应用。通过将简单或延迟敏感的请求路由到小模型，可以显著降低响应延迟和成本，同时保留大模型处理复杂请求的能力。

    路由逻辑构建步骤：

    - 定义路由特征

    - 部署大小模型实例

    - 智能路由器实现

    - 会话粘性处理

    - 在线学习优化

    示例架构：

    Client --> API Gateway --> Router
                                  |
                           Complexity Scorer
                                  |
                       +----------+-----------+
                       |                      |
                  Small Model           Large Model

    注意事项：

    - 路由器延迟必须极低（< 10ms），因此分类器需轻量。

    - 若小模型无法处理（如生成错乱），应有快速回退到大模型的机制。

    - 评估分流带来的总体延迟降低和成本节省，以验证效果。

    这种大小模型协作的架构在工业界已广泛应用，如 ChatGPT 可能根据对话复杂度动态选择模型，显著优化了响应速度和运营成本。


content:
  prompt: 解释 FlashAttention 中的分块（tiling）计算策略，以及如何减少 HBM 读写。
answer:
  mode: rubric
  reference_answer: |-
    分块策略将 Q, K, V 矩阵沿序列长度维度切分成块。设序列长度为 N，头维度为 d，SRAM 容量有限。FlashAttention 将 Q 划分为 Tr 个块，每个块包含 Br 个查询向量；K, V 划分为 Tc 个块，每个块包含 Bc 个键值向量。外层循环遍历 Q 块，内层循环遍历 K, V 块。

    计算流程（前向）：

    - 对于每个 Q 块 Qi（形状 [Br,d]），初始化输出 Oi 为零，softmax 统计量 li（和）和 mi（最大值）为 −∞ 和 0。

    [图片内容未导入]

    - 内层循环结束，最终输出 Oi=Oi/li（实际实现中已逐步除以和，最后再做一次缩放）。

    - 将 Oi 写回 HBM。


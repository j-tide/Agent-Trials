content:
  prompt: 解释 AWQ 与 SmoothQuant 在缩放思想上的异同。
answer:
  mode: rubric
  reference_answer: |-
    相同点：

    两者都利用了等效缩放变换来缓解量化难度，且都是通过数学上无损的方式将量化困难从激活转移到权重（或反之）：

    - 都引入 per-channel 缩放因子 s，执行 X←X/s，W←W⋅s。

    - 都基于“激活存在离群值，导致量化困难”的观察。

    - 最终目标都是让量化后的模型精度尽可能接近 FP16。

    不同点（核心差异）：

    [嵌入表格未展开]

    总结：AWQ 是“重权轻激活”的缩放，意在用 FP16 激活吸收权重的量化误差；SmoothQuant 是“权激平衡”的缩放，意在让激活和权重都易于 INT8 量化。两者思想同源，但针对的量化设置和部署目标不同。


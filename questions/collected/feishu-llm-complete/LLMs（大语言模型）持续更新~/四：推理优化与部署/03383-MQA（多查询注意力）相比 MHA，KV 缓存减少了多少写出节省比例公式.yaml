  reference_answer: |-
    多查询注意力（Multi-Query Attention, MQA） 极度共享 KV 对：所有的查询头 Q 共享同一个 K 头和同一个 V 头。也就是说，无论有多少个查询头，K 和 V 在每一层都只有 1 个头，维度为 dk（通常保持与单头相同，或为


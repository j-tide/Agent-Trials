content:
  prompt: vLLM 如何实现推测解码？对引擎本身有哪些扩展？
answer:
  mode: rubric
  reference_answer: |-
    vLLM 实现了标准推测解码（Draft-Target）以及基于 Medusa 的单模型推测解码，作为提升单请求延迟的可选功能。

    实现方式：

    - 独立的草稿模型推测解码：用户可指定一个较小的草稿模型（如 --speculative-model 参数）。引擎内部会同时加载目标模型和草稿模型，在调度循环中：

    - Medusa 推测解码（实验性）：通过加载在目标模型上附加了 Medusa heads 的模型，引擎在目标模型一次前向中同时获得草稿 token，然后进行树验证。

    - 对 vLLM 引擎的扩展：

    使用场景：推测解码主要优化单请求延迟（batch=1 或低并发），在高并发大 batch 下可能无明显增益甚至负优化，因此通常作为可选项按需开启。


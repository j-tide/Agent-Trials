content:
  prompt: 如何自动调整语义相似度阈值，基于用户反馈或置信度？
answer:
  mode: rubric
  reference_answer: "自动化阈值调整能够使系统在运行时平衡命中率与准确率，避免静态阈值过于僵硬。\n\n实现方法：\n\n- 基于在线反馈的强化/自适应调整\n\n-
    基于模型置信度的动态阈值\n\n- 上下文感知的阈值策略\n\n- AB 测试与贝叶斯优化\n\n反馈回路示意图：\n\n```text\n用户请求 → [缓存命中]
    → 返回答案 → 用户反馈(\U0001F44D/\U0001F44E)\n                                      ↓\n
    \                          反馈收集器 → 滑动窗口准确率计算\n                                      ↓\n
    \                          阈值调节器：准确率 < 目标 → 提高阈值\n                                        准确率
    > 目标 → 降低阈值\n                                      ↓\n                              更新向量数据库的查询阈值\n```\n\n注意事项：\n\n-
    反馈信号稀疏，需足够样本量才更新，避免阈值抖动。\n\n- 需设置安全上下限（如 [0.7, 0.98]），防止极端情况。\n\n- 可对不同意图群组分别维护阈值，达到更精细化调控。\n\n自动调优使语义缓存系统有了“闭环学习”能力，持续逼近最优平衡点。\n\n---"

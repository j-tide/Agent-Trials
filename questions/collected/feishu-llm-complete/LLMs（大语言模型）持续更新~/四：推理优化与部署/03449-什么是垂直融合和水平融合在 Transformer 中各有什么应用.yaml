content:
  prompt: 什么是“垂直融合”和“水平融合”？在 Transformer 中各有什么应用？
answer:
  mode: rubric
  reference_answer: |-
    垂直融合（Vertical Fusion） 是指将同一个数据流上连续执行的多个算子合并，消除垂直方向上的中间数据读写。典型为 GEMM -> Bias -> Activation 的融合。

    水平融合（Horizontal Fusion） 是指将作用在相同输入上的多个独立算子合并，让它们共享对输入数据的读取，合并多个输出计算。典型为 Q、K、V 投影融合。


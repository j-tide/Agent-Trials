content:
  prompt: 如何通过编写 custom CUDA kernel 实现 RMSNorm + 残差融合？写出伪代码流程。
answer:
  mode: rubric
  reference_answer: |-
    RMSNorm 是一种简化版 LayerNorm，仅使用均方根（RMS）进行归一化，无减去均值的步骤，计算更高效。将残差相加与 RMSNorm 融合可进一步节省带宽。

    假设输入：残差 x 和子层输出 y，形状 [N, D]（N 为 token 数，D 为特征维度），可学习参数 gamma（形状 [D]），epsilon 为小常数。

    Custom CUDA Kernel 伪代码流程：

    [图片内容未导入]

    要点：

    - 残差相加直接在寄存器完成，sum 不写回全局内存。

    - 平方和计算与加法融合，避免单独遍历。

    - 用共享内存和 warp shuffle 高效归约。

    - 归一化和 gamma 乘法在同一循环完成，整体只需一次读 x、y、gamma，一次写 out，极大减少访存。


content:
  prompt: 为什么有些框架（如 TGI）也有类似分页的机制？与 vLLM 的 PagedAttention 有何异同？
answer:
  mode: rubric
  reference_answer: |-
    TGI（Text Generation Inference） 也采用了分页或类分页思想来管理 KV Cache，称为 Paged KV Cache 或 块缓存。其动机与 vLLM 相同：解决预分配连续缓存导致的显存浪费和碎片。

    相同点：

    - 都将 KV Cache 划分为固定大小的块，按需分配和释放，消除预分配浪费。

    - 支持动态 batch 和连续批处理，利用块映射表实现逻辑到物理的转换。

    - 都支持前缀共享和写时复制（在并行采样中）。

    主要差异：

    [嵌入表格未展开]

    总结：TGI 的类分页机制在概念上与 vLLM 的 PagedAttention 类似，但 vLLM 的内核优化更激进，因此在极限吞吐和延迟上通常略胜一筹；TGI 则在 HuggingFace 生态的兼容性和易用性上有优势。两者共同推动了分页式 KV 缓存管理成为行业标准。


content:
  prompt: 重复惩罚通常以累加还是乘积形式作用于 logits？为什么常见的实现使用乘性惩罚？
answer:
  mode: rubric
  reference_answer: |-
    常见的实现使用乘性惩罚 (Multiplicative Penalty)，而不是加性惩罚 (Additive Penalty)。

    加性惩罚的缺陷：

    [图片内容未导入]

    因此，从加性到乘性的转变，是将惩罚操作从绝对值空间迁移到了相对值（比例）空间，极大地提升了算法的鲁棒性和泛化能力。这也是 LLaMA、Falcon 等几乎所有现代开源模型采用乘性重复惩罚的根本原因。


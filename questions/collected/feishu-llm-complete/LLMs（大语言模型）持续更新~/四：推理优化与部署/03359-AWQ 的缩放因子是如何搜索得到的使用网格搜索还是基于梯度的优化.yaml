content:
  prompt: AWQ 的缩放因子是如何搜索得到的？使用网格搜索还是基于梯度的优化？
answer:
  mode: rubric
  reference_answer: |-
    AWQ 的缩放因子搜索不依赖昂贵的梯度下降或迭代优化，而是通过极轻量的启发式规则或小规模网格搜索。原文提出了两种实际方案，目前工程实现多采用基于激活统计的启发式公式。

    方案一：网格搜索（早期或细粒度调优）

    [图片内容未导入]

    - 在少量校准数据（如 128 个样本）上，以一定的步长（如 0.05）在 [0, 1] 区间搜索最优的 α，使得量化后模型的困惑度（PPL）最低。这本质上是一维网格搜索，开销极小。

    - 也可以对每层独立搜索不同的 α，此时搜索空间稍大，但仍可控，且可离线完成。

    方案二：启发式公式（默认推荐）

    - 直接根据激活分布计算缩放因子，无需搜索。典型公式为：

    [图片内容未导入]

    为什么无需昂贵优化？

    AWQ 的等效缩放本质上是在重新分配量化误差的容忍度。由于权重和激活的分布特性明显，显著通道的比例极小且稳定，简单的启发式规则足以捕获重要通道并赋予合适的缩放，额外的细粒度优化收益甚微。这也是 AWQ 能以极低成本超越 GPTQ 等需要海森计算的算法的原因。


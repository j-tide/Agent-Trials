content:
  prompt: 对比贪心搜索、束搜索和采样方法在机器翻译与创意写作中的适用性。
answer:
  mode: rubric
  reference_answer: |-
    机器翻译和创意写作代表了两种极端的生成需求：一个追求“信达雅”中的精确与忠实，另一个追求无限的想象力与多样性。因此，解码策略的选型也截然不同。

    [嵌入表格未展开]

    本质原因：机器翻译是一个有明确“标准答案”的收敛性问题，解码器的目标是找到与那个答案最匹配的路径。而创意写作是一个没有标准答案的发散性问题，解码器的目标是探索人类语言表达的无限可能性。


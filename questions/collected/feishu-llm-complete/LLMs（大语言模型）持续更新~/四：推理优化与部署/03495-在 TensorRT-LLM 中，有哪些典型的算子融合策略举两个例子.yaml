content:
  prompt: 在 TensorRT-LLM 中，有哪些典型的算子融合策略？举两个例子。
answer:
  mode: rubric
  reference_answer: |-
    TensorRT-LLM 融合策略丰富，以下为两个典型：

    例1：QKV 投影融合 + 位置编码 + 偏置

    - 将 Q、K、V 的权重拼接为一个大的权重矩阵，执行单个 GEMM。

    - 在 GEMM 的 epilogue 阶段，对于 Q 和 K 部分输出，立即根据 token 位置应用 RoPE 旋转编码，同时加上偏置项。

    - 这样原本的 3 次 GEMM + 2 次 RoPE kernel + bias 合并为一个 kernel，避免了多次显存写入。

    例2：MLP 层的融合（FC + Activation + FC）

    - 对于 X -> FC1 -> Bias1 -> GeLU -> FC2 -> Bias2，TensorRT-LLM 会进行：

    - 这种深度垂直融合极大减少了带宽和 launch 开销。

    TensorRT-LLM 还支持 SwiGLU 的融合、Attention 的 FlashAttention 融合、KV Cache 量化的融合等，通过组合这些策略达到极致推理性能。


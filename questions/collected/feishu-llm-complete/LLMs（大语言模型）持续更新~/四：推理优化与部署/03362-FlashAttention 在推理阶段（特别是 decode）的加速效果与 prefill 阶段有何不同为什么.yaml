content:
  prompt: FlashAttention 在推理阶段（特别是 decode）的加速效果与 prefill 阶段有何不同？为什么？
answer:
  mode: rubric
  reference_answer: |-
    FlashAttention 的加速效果在 prefill 和 decode 阶段有明显差异，根源在于注意力计算的形状和瓶颈性质不同。

    [图片内容未导入]

    - Decode 是纯粹的内存带宽受限，标准实现已经接近硬件带宽极限，FlashAttention 只能通过更好的块调度和指令优化小幅度提升，核心瓶颈仍是读取 KV Cache 的带宽。因此 FlashAttention 对于长文本生成的主要贡献在于支持更大的 batch 和更长的上下文（通过降低显存占用），而非 decode 单步延迟的成倍降低。


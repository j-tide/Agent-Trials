content:
  prompt: 说明 Attention 模块中，Q、K、V 的线性变换如何融合为单个矩阵乘法。
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    为什么有效：

    - 原本需要 3 次矩阵乘法和 3 次显存读写权重（如果独立计算）。融合后仅需 1 次矩阵乘法，对权重 W QKV 只需读取一次，对输入 X 也只需读取一次。

    - 现代 GPU 的矩阵乘法单元（Tensor Core）在大矩阵上效率极高，合并后的 GEMM 维度增大（K 维不变，N 维变成 3 倍），更充分地利用硬件并行能力。

    - 不需要三个独立 kernel，一次 launch 即可完成。

    在具体实现中，Transformer 模型常将 Q、K、V 定义为单个 qkv_proj 层。推理引擎也会自动或手动进行这种融合。


content:
  prompt: 使用向量数据库（如 Milvus、FAISS）存储 prompt embedding 进行语义搜索，如何设计索引和查询？
answer:
  mode: rubric
  reference_answer: |-
    索引设计：

    - 选择索引类型

    - 向量维度与距离度量

    - 索引参数调优

    查询设计：

    - 查询向量生成
    对用户 prompt 进行相同的预处理，使用相同的 embedding 模型生成查询向量。

    - 相似度搜索

    - 后处理过滤

    - 缓存键设计
    向量数据库中存储的 payload 应包括：

    示例（Milvus 伪代码）：

    ```python
    from pymilvus import Collection

    collection = Collection("prompt_cache")
    results = collection.search(
        data=[query_vector],
        anns_field="embedding",
        param={"metric_type": "COSINE", "params": {"nprobe": 16}},
        limit=3,
        expr="ttl > current_timestamp() and user_group == 'public'",  # 过滤条件
        output_fields=["response_text", "score"]
    )
    if results[0].distances[0] >= 0.92:
        return results[0][0].entity.get("response_text")
    ```

    合理设计索引和查询流程，可保证语义缓存在大规模数据下仍具有极低延迟和高命中精度。


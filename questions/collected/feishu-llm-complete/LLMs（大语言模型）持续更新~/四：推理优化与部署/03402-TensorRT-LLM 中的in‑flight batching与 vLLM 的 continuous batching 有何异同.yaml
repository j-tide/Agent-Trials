content:
  prompt: TensorRT-LLM 中的“in‑flight batching”与 vLLM 的 continuous batching 有何异同？
answer:
  mode: rubric
  reference_answer: |-
    两者本质相同，都是 迭代级连续批处理 调度策略，目标均是消除静态批处理的队头阻塞，提升 GPU 利用率。但在实现细节和配套优化上有所差异。

    相同点：

    - 请求加入和退出发生在每次迭代（生成一个 token）之后，而非整个序列完成。

    - 支持动态 batch 大小，减少气泡。

    - 都需要配合分页式的 KV Cache 管理以避免碎片。

    主要差异：

    [嵌入表格未展开]

    总结：两者概念同源，vLLM 的 continuous batching 开源透明、迭代迅速；TensorRT-LLM 的 in-flight batching 与整体编译引擎绑定，能更好地利用硬件细节实现极致优化，但修改和扩展的灵活性稍弱。在实际效果上，两者都能带来数倍的吞吐提升。


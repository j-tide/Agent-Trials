content:
  prompt: 解释在 gRPC 双向流或 WebSocket 下实现 LLM 流式调用的优势。
answer:
  mode: rubric
  reference_answer: |-
    gRPC 双向流和 WebSocket 提供了不同于 HTTP SSE 的流式调用方式，具有以下优势：

    - 双向通信

    - 多路复用与并发

    - 低延迟与二进制帧

    - 强类型契约

    - 流控与背压

    适用场景：

    - 需要双向实时交互或精确控制时，使用 gRPC 双向流或 WebSocket 更优。

    - 仅需服务端推送的简单场景，SSE 更简便。


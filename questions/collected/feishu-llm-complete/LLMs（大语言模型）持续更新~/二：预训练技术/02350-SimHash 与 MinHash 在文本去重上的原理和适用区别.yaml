  prompt: SimHash 与 MinHash 在文本去重上的原理和适用区别。
answer:
  mode: rubric
  reference_answer: |-
    SimHash 和 MinHash 都是用于降维和相似性搜索的哈希技术，但它们的原理和适用场景有本质不同。

    [嵌入表格未展开]

    适用区别总结：

    - 选 MinHash：如果你需要高精度的内容级去重，例如找出所有转载并小幅修改的文章，确保最终数据集不包含任何实质性重复的内容。这通常需要更复杂的预处理和 LSH 流程，但去重效果更彻底。

    - 选 SimHash：如果你的目标是超大规模网页的快速海量去重，对去重精度要求不那么严格，但要求极高的处理速度和极低的存储成本。Google 搜索引擎就用它来检测近重复网页。


content:
  prompt: 如何用后缀数组或后缀自动机检测并删除大规模语料中的重复片段？
answer:
  mode: rubric
  reference_answer: |-
    后缀数组 (Suffix Array, SA)、后缀自动机 (Suffix Automaton, SAM) 和广义后缀树 (Generalized Suffix Tree, GST) 是解决精确子串重复问题的标准数据结构。

    方法一：基于后缀数组 (SA) + 最长公共前缀 (LCP)

    这是处理超大规模语料最常用、理论最成熟的方法。


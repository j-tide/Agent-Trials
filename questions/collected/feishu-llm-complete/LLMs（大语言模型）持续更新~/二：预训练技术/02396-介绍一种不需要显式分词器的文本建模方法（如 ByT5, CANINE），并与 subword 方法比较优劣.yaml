content:
  prompt: 介绍一种不需要显式分词器的文本建模方法（如 ByT5, CANINE），并与 subword 方法比较优劣。
answer:
  mode: rubric
  reference_answer: |-
    以 ByT5 为代表的无分词器方法，直接使用原始的 UTF-8 字节序列 作为模型输入，彻底抛弃了显式的 tokenizer 和词表。

    ByT5 的核心思想：

    - 将输入文本的每个字符转换为它的 UTF-8 字节表示（0~255），得到一个字节序列。

    - 模型直接在字节序列上进行操作，包括嵌入（一个 256 行的嵌入矩阵）和注意力计算。

    - 输出时，模型逐个生成字节，再由解码器将这些字节实时组合成 Unicode 字符。

    与 Subword 方法的优劣比较：

    [嵌入表格未展开]

    总结：Subword 方法在当前追求性能和效率的 LLM 中是主流选择；无分词器方法则代表了一种更优雅、更鲁棒的理想范式，随着硬件和稀疏注意力技术的发展，未来可能在特定场景下逐渐展露优势。

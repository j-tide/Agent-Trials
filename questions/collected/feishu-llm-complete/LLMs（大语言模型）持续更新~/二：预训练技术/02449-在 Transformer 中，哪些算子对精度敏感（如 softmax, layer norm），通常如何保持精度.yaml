  reference_answer: |-
    Transformer 模型中，以下算子对数值精度非常敏感，若在半精度下简单执行，容易导致训练不稳定或精度损失：

    - Softmax

    [图片内容未导入]

    - Layer Normalization / RMSNorm

    - 注意力分数计算

    [图片内容未导入]

    - 损失函数（CrossEntropy）

    - 累计操作

    PyTorch autocast 的自动策略：torch.cuda.amp 维护了一个自动提升列表，包含上述敏感算子，在 autocast 上下文中自动将它们提升到 FP32。对于自定义算子，可以通过 torch.cuda.amp.custom_fwd 等装饰器控制精度。开发者通常无需手动修改，但若遇到数值不稳定（如 loss NaN），应检查是否有未覆盖的自定义操作，或尝试强制某些层使用 FP32。


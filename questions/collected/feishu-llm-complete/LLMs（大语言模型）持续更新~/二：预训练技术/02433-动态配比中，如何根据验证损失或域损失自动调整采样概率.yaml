answer:
  mode: rubric
  reference_answer: |-
    动态配比旨在根据模型在训练过程中的实时表现，自适应地调整不同数据领域的采样概率，实现更高效的课程学习。这通常被称为“在线数据配比”或“自适应数据采样”。

    核心机制：

    - 定义反馈信号：在每个评估周期（如每 1000 步），计算模型在不同领域的验证集上的损失（Perplexity）。也可以使用模型在当前训练 batch 上各领域的损失。

    - 从损失到采样概率的映射：需要设计一个规则，将领域损失的相对变化转化为采样概率的调整。常见策略有：


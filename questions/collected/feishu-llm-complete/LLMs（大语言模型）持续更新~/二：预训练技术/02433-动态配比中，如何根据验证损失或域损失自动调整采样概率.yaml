    优点：动态配比能够自动适应模型的学习节奏，将计算资源投入到最需要的地方，通常能加速收敛并提升最终性能。风险：如果反馈信号设计不当，可能导致模型走上“捷径”，例如反复学习高噪声领域而导致过拟合。

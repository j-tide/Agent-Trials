    常见预处理策略总结：

    - 最简预处理（现代 LLM 偏好）：直接使用字节级 BPE，几乎不做任何文本规范化，仅进行必要的解码（如 HTML 实体转换）或移除明显有害内容。

    - 传统 BERT/GPT-1 风格：进行小写化（可选）、标点分离、Unicode 规范化（NFC/NFKC）、特殊实体替换。这种方法可控性强，但会损失原始信息。

    选择依据：如果需要模型理解原始文本格式（如代码、标记语言），或生成精确文本，则尽量保留原始字符。如果任务专注于自然语言理解，适度的规范化可以提高数据效率。

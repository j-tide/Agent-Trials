answer:
  mode: rubric
  reference_answer: |-
    标准数据并行（DP）的通信仅发生在反向传播后的梯度同步，使用 All-Reduce 聚合梯度。每个 GPU 的通信量为 2Ψ（FP16 梯度，Ψ 为总参数量），即每个参数约 2 字节 × 2 倍（发送+接收）。ZeRO 各阶段改变了通信模式：

    [图片内容未导入]

    综上，通信量比值：ZeRO-1/2 与 DP 持平，ZeRO-3 约为 DP 的 2 倍。

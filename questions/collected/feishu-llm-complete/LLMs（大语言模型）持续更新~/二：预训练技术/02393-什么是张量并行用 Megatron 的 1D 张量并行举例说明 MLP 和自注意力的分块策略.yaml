content:
  prompt: 什么是张量并行？用 Megatron 的 1D 张量并行举例说明 MLP 和自注意力的分块策略。
answer:
  mode: rubric
  reference_answer: |-
    张量并行（Tensor Parallelism） 是将单个层的大参数矩阵切分到多个设备上并行计算，从而突破单设备显存和算力限制。它由 Megatron-LM 针对 Transformer 架构高效实现。

    Megatron 的 1D 张量并行（按行或列切分矩阵）：

    MLP 层的分块策略：
    MLP 由两个全连接层组成：第一层将隐藏维度 d 映射到 4d4d，第二层从 4d 映射回 d。

    [图片内容未导入]

    通过 1D 张量并行，每个 Transformer 层的内存占用和计算量都被均匀分摊到 N 个设备，实现了接近线性的显存和算力扩展。


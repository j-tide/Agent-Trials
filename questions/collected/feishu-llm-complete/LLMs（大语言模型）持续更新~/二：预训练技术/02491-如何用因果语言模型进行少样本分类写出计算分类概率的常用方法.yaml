content:
  prompt: 如何用因果语言模型进行少样本分类？写出计算分类概率的常用方法。
answer:
  mode: rubric
  reference_answer: |-
    利用因果语言模型（如 GPT）进行少样本分类，通常采用“提示词+续写”的方式，将分类任务转化为文本生成任务。

    方法：

    - 构建提示词：将分类任务描述为自然语言，并给出少量示例（k-shot）。例如：“将以下电影评论分类为正面或负面。\n评论：这部电影太棒了！ 情感：正面\n评论：浪费时间。 情感：负面\n评论：{目标评论} 情感：”

    - 生成与评估：模型在“情感：”之后生成下一个 token。我们通常会预先定义标签词（如“正面”和“负面”），并计算模型在给定上下文后生成每个标签词的条件概率。


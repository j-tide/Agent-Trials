content:
  prompt: 激活重计算（梯度检查点）如何改变激活内存公式？给出缩放因子。
answer:
  mode: rubric
  reference_answer: |-
    梯度检查点 通过丢弃部分层的中间激活，反向时再重计算来节省内存。若对每个 Transformer 层应用检查点（即每层作为一段）：

    - 前向：不保留该层内部的中间激活，仅保存该层的输入张量（形状 (B,S,H)）。

    - 反向：重新执行该层的前向，暂时产生该层的完整激活，计算梯度后立即释放。

    激活内存公式变为：

    [图片内容未导入]

    即激活内存可节省约 L 倍，比如 100 层模型激活内存可降至原来的约 1%。在实践中，检查点通常可使激活内存降低一个数量级以上。


  reference_answer: |-
    NVIDIA Nsight Systems（nsys）是分析分布式训练性能的核心工具。定位通信瓶颈的关键在于观察计算流与通信流的时间线，找出 GPU 等待通信的空间。

    步骤：

    - 捕获 trace：nsys profile -o output_name --trace=cuda,nvtx,osrt,cudnn,cublas 启动训练脚本，记录 1‑2 个训练步。

    - 在 Nsight Systems GUI 中打开，聚焦 Timeline View。


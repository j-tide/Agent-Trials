    溢出检测机制：GradScaler 通过检查每个参数梯度的 torch.isnan(grad).any() 或 torch.isinf(grad).any() 来判定溢出。如果任一张量存在 inf/NaN，则整体视为溢出。

    工程实践：

    - 若频繁溢出，说明初始缩放因子或增长因子过大，可适当降低初始 S 或减小增长因子，或延长增长间隔。


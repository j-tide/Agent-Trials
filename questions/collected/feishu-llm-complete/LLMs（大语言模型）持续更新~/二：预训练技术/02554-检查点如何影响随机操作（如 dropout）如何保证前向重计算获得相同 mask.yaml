content:
  prompt: 检查点如何影响随机操作（如 dropout）？如何保证前向重计算获得相同 mask？
answer:
  mode: rubric
  reference_answer: |-
    - 问题：Dropout 在每次前向传播时生成随机掩码，随机性来自随机数生成器（RNG）。如果训练时使用梯度检查点，前向和重计算阶段需要完全相同的 dropout mask，否则两次前向输出不一致，导致反向计算出的梯度错误。

    - PyTorch 的解决方案：checkpoint 默认 preserve_rng_state=True。其机制是：

    - 性能影响：保存和恢复 RNG 状态会增加少量 CPU 开销，通常可忽略。如果模型中没有任何非确定性操作（例如使用全连接的 deterministic 模式，或 eval 阶段），可以设置 preserve_rng_state=False 以提速。

    - 注意：若使用了混合精度或自定义 CUDA 核，需确保这些操作在重计算时的随机性也受 RNG 控制。


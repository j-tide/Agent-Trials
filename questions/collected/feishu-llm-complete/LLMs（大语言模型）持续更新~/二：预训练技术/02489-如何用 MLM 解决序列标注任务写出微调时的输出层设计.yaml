content:
  prompt: 如何用 MLM 解决序列标注任务？写出微调时的输出层设计。
answer:
  mode: rubric
  reference_answer: |-
    序列标注任务（如命名实体识别 NER、词性标注、中文分词）需要为输入序列中的每个 token 预测一个标签。BERT 类的 MLM 模型非常适合这类任务，其微调方法如下：

    模型输入与输出：

    - 使用原始的 BERT 编码器，不做任何改动（保留所有预训练权重）。

    - 输入文本经过 tokenizer 处理，得到 token 序列（包括 [CLS] 和 [SEP]）。

    输出层设计：

    [图片内容未导入]

    微调细节：

    - 整个 BERT 编码器和分类头一起联合训练，端到端微调。

    - 输入数据需要对齐：由于 WordPiece 等分词可能将一个单词切成多个子词，而标注通常是在词级别给出的。常见的处理方法是：在 tokenize 后，只对每个单词的第一个子词进行标签预测，该单词的其余子词的标签被忽略（设置 label 为 -100）；或者将所有子词的标签设为同一个，但这样会产生不连续的实体。通常采用第一种。

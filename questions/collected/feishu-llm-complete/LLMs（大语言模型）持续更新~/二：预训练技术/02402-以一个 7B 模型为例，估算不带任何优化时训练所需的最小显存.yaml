content:
  prompt: 以一个 7B 模型为例，估算不带任何优化时训练所需的最小显存。
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - 模型状态显存：

    [图片内容未导入]

    模型状态合计：14+14+84=112 GB。

    - 激活内存估算（无任何优化）：

    [图片内容未导入]

    - FFN 及其他：激活函数前后等，大约每层 0.5~1 GB。

    - 粗略估算每层激活约 2~3 GB，32 层总激活约 64~96 GB。取中间值 80 GB。

    总显存 ≈ 模型状态 112 GB + 激活 80 GB ≈ 192 GB。

    加上临时缓冲区，可能超过 200 GB。单张 80GB A100 远远不够，需要 3~4 张。

    由此可见，不使用任何优化，7B 模型已极难训练。实际上必须依赖并行、检查点、FlashAttention 等。


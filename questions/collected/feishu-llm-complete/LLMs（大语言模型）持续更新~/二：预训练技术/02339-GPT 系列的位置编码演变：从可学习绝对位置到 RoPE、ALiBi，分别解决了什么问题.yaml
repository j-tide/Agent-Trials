  prompt: GPT 系列的位置编码演变：从可学习绝对位置到 RoPE、ALiBi，分别解决了什么问题？
answer:
  mode: rubric
  reference_answer: |-
    GPT 系列模型的位置编码经历了三个阶段的演变：

    - 可学习的绝对位置嵌入（GPT-1, GPT-2）

    [图片内容未导入]

    - 优点：简单灵活，由模型自行学习最优的位置表示。

    - 问题：

    - 旋转位置编码（RoPE, 应用于 LLaMA, GPT-NeoX, PaLM 等）

    [图片内容未导入]

    - 解决的问题：

    - 劣势：对非常长的序列，低频分量的区分度可能下降，但可以通过 YaRN 等方法进一步解决。

    - ALiBi (Attention with Linear Biases, 如 BLOOM, 部分 MPT)

    [图片内容未导入]

    - 解决的问题：

    - 劣势：

    总结演变脉络：绝对位置编码解决了有无问题，但受限于外推；RoPE 引入了优雅的相对位置编码，并通过数学技巧改善了外推；ALiBi 则走向另一个极端，用极简的无参方法实现了强外推。当前主流是 RoPE 及其变体，因为它兼顾了表达能力和外推灵活性。

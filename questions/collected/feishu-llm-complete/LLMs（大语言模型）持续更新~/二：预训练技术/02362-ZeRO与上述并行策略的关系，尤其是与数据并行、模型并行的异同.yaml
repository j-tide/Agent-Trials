content:
  prompt: ZeRO与上述并行策略的关系，尤其是与数据并行、模型并行的异同。
answer:
  mode: rubric
  reference_answer: |-
    ZeRO (Zero Redundancy Optimizer) 是微软提出的一种显存优化技术，它不是一种独立的并行范式，而是对数据并行（DP）的一种极致显存优化。它通过在数据并行组内分片模型状态（参数、梯度、优化器），消除了DP中跨GPU的冗余存储。

    关系与异同：

    - 与数据并行 (DP) 的关系：ZeRO是DP的增强。传统的DP中每张卡存储完整模型，显存无法支持大模型。ZeRO-DP通过三个阶段的优化，逐步将优化器状态（Stage 1）、梯度（Stage 2）、参数（Stage 3）分片到DP组内，使得在相同DP规模下，可训练的模型大小成倍增加。它保持了DP的简洁性和高计算效率。

    - 与模型并行 (MP) 的关系：两者在水平和垂直切分上不同。


content:
  prompt: 对于极大规模数据（千亿 token），如何高效采样评估质量，同时保证统计置信度？
answer:
  mode: rubric
  reference_answer: "在千亿 token 规模下，全量评估不现实，必须通过科学的分层抽样和统计推断来高效、可靠地评估质量。\n\n- 分层抽样设计\n\n-
    分层维度：将数据按已知的、可能与质量相关的维度划分为互斥的“层”。典型维度包括：\n\n```text\n<|user|> 你好，请问... \n<|assistant|>
    您好，需要帮助吗？\n```\n\n- 确保每轮对话明确标记说话者，便于模型学习角色区分和轮次转换。\n\n- 清洗无效轮次：\n\n- 清洗系统提示：\n\n-
    上下文连贯性维护：\n\n- 安全与隐私清洗：\n\n- 数据增强：对于稀缺的对话类型，可让教师模型根据指定角色和场景生成高质量对话，然后进行上述的合成数据清洗，扩充数据集。\n\n高质量对话预训练数据的关键是保持对话的自然性、逻辑连贯性和角色一致性，清洗重点在于去除中断、冗余和泄露隐私的片段。\n\n---"

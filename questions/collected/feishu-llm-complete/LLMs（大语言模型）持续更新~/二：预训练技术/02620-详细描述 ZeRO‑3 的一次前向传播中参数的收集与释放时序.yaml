content:
  prompt: 详细描述 ZeRO‑3 的一次前向传播中参数的收集与释放时序
answer:
  mode: rubric
  reference_answer: |-
    假设模型有 L 层，数据并行度 Nd。ZeRO-3 的前向传播逐层进行，每层参数的 All-Gather 与计算交替，释放紧跟计算后。

    时序（以某个 GPU 视角，假设其持有该层参数的第 k 个分片）：

    [图片内容未导入]

    反向传播类似，在计算每层梯度前再次 All-Gather 完整参数，计算完梯度后释放，同时梯度通过 Reduce-Scatter 归约到各 GPU 的分片。

    这种精密的时序控制使得 ZeRO-3 在显存开销上接近模型规模除以 Nd，是训练超大规模模型的关键技术。


    为何 BF16 无需损失缩放

    [图片内容未导入]

    参数无法更新。损失缩放通过将损失放大 S 倍，使得梯度同步放大，从而落入 FP16 可表示范围，更新前再除以 S 恢复。

    [图片内容未导入]

    溢，也能表示极大的值而不溢出。因此无需放大梯度，损失缩放成为多余。这不仅简化了训练代码，也消除了缩放因子选择不当带来的不稳定问题。


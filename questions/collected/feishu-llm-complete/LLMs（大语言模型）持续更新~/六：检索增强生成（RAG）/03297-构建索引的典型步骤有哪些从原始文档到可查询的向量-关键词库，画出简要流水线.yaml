content:
  prompt: 构建索引的典型步骤有哪些？从原始文档到可查询的向量/关键词库，画出简要流水线。
answer:
  mode: rubric
  reference_answer: "从原始文档到可查询的索引库，是一个典型的离线数据处理管道，主要包括以下步骤：\n\n步骤1：数据摄取与解析\n\n首先从各种异构数据源（如PDF、网页、数据库、Word文档等）中读取原始文档。解析器的任务是将这些格式各异的文件，转化为统一的、干净的纯文本，同时尽可能地保留有用的结构信息（如标题、表格）。\n\n步骤2：文本分块\n\n将长文档分割成大小合适的文本片段或“块”。这是至关重要的一步，因为嵌入模型通常有最大输入长度限制（如512或8192个Token），且太长的文本会稀释语义焦点，导致检索不准。分块策略需兼顾语义完整性（让一个块尽量包含一个完整的意思）和检索效率。常见的方法有固定长度分块、基于标点或段落的分块、以及使用专门的分块模型进行语义分块。\n\n步骤3：嵌入与向量化\n\n将每一个文本块送入一个文本嵌入模型，将其压缩映射为一个固定维度的稠密向量。这个向量就是该文本块在语义空间中的坐标。优秀的嵌入模型能确保语义相似的文本拥有相近的向量表示。\n\n步骤4：元数据提取与标注\n\n为每个文本块提取并存储关键的元数据，例如：来源文档名、作者、创建日期、页码、标题层级等。这些元数据不会直接参与向量相似度计算，但对检索后的过滤和溯源至关重要。\n\n步骤5：构建索引并持久化\n\n将生成的向量、原始文本和元数据，一并写入到索引存储中。对于向量部分，索引系统会构建特定的数据结构以实现高效的
    ANN 搜索。最后将整个索引持久化到磁盘，供在线服务加载使用。\n\n简要流水线图：\n\n```text\n[原始文档 (PDF, HTML, ...)]
    \n    -> (1. 解析器) \n    -> [纯文本] \n    -> (2. 文本分块器) \n    -> [文本块列表] \n    ->
    (3. 嵌入模型) \n    -> [向量列表] + [元数据] \n    -> (4. 索引构建器) \n    -> [可查询的向量索引库]\n```"

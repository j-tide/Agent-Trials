answer:
  mode: rubric
  reference_answer: |-
    在分数融合中，权重的设定决定了两种检索器的话语权。这可以是固定的，也可以是根据查询动态调整的。

    固定权重：

    [图片内容未导入]

    - 优点：实现简单，系统行为稳定可预测。

    - 缺点：无法适应不同类型的查询。对有些查询，关键词匹配更重要；对另一些，语义理解更重要。固定权重无法做出区分。

    动态权重：

    这是更智能的方案。系统在收到查询后，首先分析查询的特征，然后根据预设的规则或模型动态决定融合权重。


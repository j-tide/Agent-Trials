content:
  prompt: 多向量表示（如 ColBERT）与单向量表示的优劣对比。
answer:
  mode: rubric
  reference_answer: |-
    单向量表示（Single Vector）与多向量表示（Multi-Vector）是稠密检索中两种根本不同的表示哲学。

    单向量表示：

    - 原理：将整个查询或文档压缩为单个固定维度的稠密向量。检索时，直接计算两个向量的内积或余弦相似度。

    - 优势：

    - 劣势：

    多向量表示（以 ColBERT 为例）：

    - 原理：为查询和文档分别生成一组向量。例如，ColBERT 为查询的每个 Token 生成一个向量，为文档的每个 Token 也生成一个向量。检索时，使用一种“延迟交互”机制，如计算查询的每个向量与文档中最相似向量的余弦相似度之和（MaxSim）。这种精细的 Token 级交互比单向量粗粒度的全文匹配要准确得多。

    - 优势：

    - 劣势：


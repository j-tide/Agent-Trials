content:
  prompt: 基于用户意图分类的查询重写：如何根据意图选择不同的重写策略？
answer:
  mode: rubric
  reference_answer: |-
    不同的用户查询意图，需要不同的检索策略和查询形式。对查询意图进行分类，并据此选择针对性的重写策略，可以显著提升检索的精准度。

    意图分类与对应的重写策略：

    - 事实型查询：

    - 解释型/概念型查询：

    - 比较型查询：

    - 导航型/元数据查询：

    实现方式：

    - 微调意图分类器：在领域数据上训练一个轻量级的文本分类模型，在线时快速判断查询意图。

    - 基于 LLM 的一体化重写：将意图分类与重写合并，通过 Prompt 让 LLM 同时输出意图类别和对应的重写查询。这更为灵活。

    通过这种“先分类，后重写”的策略，检索系统不再是千篇一律地处理所有查询，而是能“因材施教”，最大化检索的准确率。


content:
  prompt: 在边缘设备上，如何实现连续的知识蒸馏（终身学习）？
answer:
  mode: rubric
  reference_answer: |-
    边缘设备（手机、IoT、车辆）需要持续适应新数据，同时保留旧知识，存储和算力有限。连续知识蒸馏（Continual Knowledge Distillation） 可通过知识迁移实现终身学习而不遗忘。

    实现策略：

    （1）基于回放的蒸馏

    - 当新任务数据到达时，边缘设备微调模型。为了对抗灾难性遗忘，保留少量旧任务典型样本（或生成样本），在微调时与当前数据混合训练，并使用旧模型（教师）对这些回放样本的输出进行蒸馏，使学生新模型保持旧任务的决策边界。

    - 由于边缘存储有限，可使用核心集选择或特征层面的回放（存储旧模型的隐藏层统计）。

    （2）无数据回放（生成式蒸馏）

    - 在设备上存储一个小型生成模型，或利用基础模型生成旧任务的伪样本。用这些样本结合旧模型输出进行蒸馏，无需存储真实旧数据，解决隐私和存储问题。

    （3）正则化蒸馏

    - 在学习新任务时，最小化新模型与旧模型在旧任务上的输出分布的 KL 散度，这相当于以旧模型为教师，对重要参数或输出进行蒸馏。

    - 可使用 EWC（弹性权重巩固）类的参数级约束，再结合蒸馏损失，双重防遗忘。

    （4）边云协同蒸馏

    - 边缘设备将新学到的知识（如微调后模型的 logits 或参数变化）上传到云端，云端进行多设备联邦蒸馏融合，再下发更新后的全局模型。边缘端持续从云端获取融合知识，进行蒸馏微调，实现持续学习。

    - 云端可承担大算力蒸馏，边缘端仅做轻量适配。

    （5）动态架构与选择性蒸馏

    - 为边缘模型设计动态扩展的模块（如 Adapter、prompts）。新任务到来时只训练新 adapter，旧 adapter 冻结，并用旧模型的输出来蒸馏新的适配器组合，保持兼容。

    - 或者，训练一个超网络，根据任务编码蒸馏出条件参数。

    （6）自监督与蒸馏结合

    - 利用无标签的传感器数据，用新旧模型进行对比预测，将旧模型的稳定表征蒸馏到新模型中，强化特征不变性。

    实施考量：

    - 算力约束：蒸馏时只需旧模型前向推理，不需要反向训练大网络，适合边缘实时执行。

    - 存储：存储旧模型副本（可用于蒸馏）比存储所有数据更轻量。若模型仍然很大，可使用模型量化压缩后再存储。

    边缘设备通过持续蒸馏，可以像人类一样不断积累知识，同时保持模型紧凑和隐私友好。


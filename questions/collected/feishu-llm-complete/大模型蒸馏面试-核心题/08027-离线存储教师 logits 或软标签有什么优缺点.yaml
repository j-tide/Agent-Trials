content:
  prompt: 离线存储教师 logits 或软标签有什么优缺点？
answer:
  mode: rubric
  reference_answer: |-
    离线存储是解耦教师和学生训练、实现高效蒸馏的最常用技术。

    优点：

    - 训练效率极高：学生模型训练时无需等待庞大的教师模型进行前向传播，完全解耦了教师推理的瓶颈，训练吞吐量最大化。

    - 成本极低：教师模型只需对数据集推理一次，而不是每个Epoch都推理，极大地节省了GPU算力和时间成本。这对于黑盒蒸馏（按API调用计费）尤为重要。

    - 便于复用和共享：存储的软标签可以重复用于多轮学生模型实验，甚至可以作为一种数据资产进行共享。

    缺点：

    - 存储空间巨大：这是最显著的缺陷。对于大规模数据集（如数千万甚至数亿样本），存储每个样本的完整Logits（尺寸为 [seq_len, vocab_size]）会消耗TB级别的存储空间，成本高昂。

    - 缺乏动态交互：无法进行在线蒸馏或那些需要教师根据学生当前状态动态调整输出的蒸馏方法。

    - 软标签“过时”：一旦教师模型更新，所有存储的软标签都必须重新生成。


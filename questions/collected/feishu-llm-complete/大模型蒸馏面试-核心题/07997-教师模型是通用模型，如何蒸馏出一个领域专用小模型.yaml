content:
  prompt: 教师模型是通用模型，如何蒸馏出一个领域专用小模型？
answer:
  mode: rubric
  reference_answer: |-
    将通用大模型蒸馏为领域专用小模型，核心是知识的选择性传递与强化。这就像一位全科医生（通用模型）培养一位心脏病专家（领域模型），需要保留基础医学知识，同时大量灌输心脏领域的专业知识。

    一、数据构建（最关键）：

    - 领域数据增强：收集或生成大量的领域内指令-回答对。可以是用通用教师在该领域数据上进行推理，产生高质量回答；也可以是领域专家手写。关键在于，这些数据要能充分反映该领域的任务类型、术语和逻辑。

    - 通用数据锚定：在蒸馏数据集中，仍需混入少量（如10%-20%）高质量的通用数据，作为“锚点”，防止学生在领域内变得过拟合，丧失基础语言能力和常识推理能力。

    - 构造领域安全数据：这是最容易被忽略但极其重要的一环。专门构建该领域特有的安全对抗数据，例如“如何用XX领域的知识进行诈骗”、“关于XX疾病的错误观点”，并给出正确的拒绝回答或科学纠正。这能确保学生在获得专业能力的同时，也具备了专业领域的安全护栏。

    二、两阶段蒸馏（课程学习）：

    - 第一阶段（通用基础保留）：使用通用数据和通用教师进行蒸馏，让学生模型先具备一个良好的基础能力。这可以通过蒸馏通用模型的行为来实现。

    - 第二阶段（领域知识注入）：使用领域数据和通用教师（或领域微调后的教师）进行蒸馏，将领域知识“写入”学生。这一阶段可以使用更高的温度，并加强领域数据的采样权重。

    本质：这是一种课程学习式的蒸馏，从通用到专用，确保知识大厦的根基稳固。学生先成为合格的“医生”，再成为“心脏病专家”。


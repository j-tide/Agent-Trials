  prompt: 如何评估蒸馏模型的指令遵循能力？IFEval 和 MT-Bench 各侧重什么？
answer:
  mode: rubric
  reference_answer: |-
    指令遵循能力是将模型从“文本生成器”转变为“任务执行器”的关键。IFEval和MT-Bench从完全不同的角度，共同构成了评估这一能力的核心框架。

    - IFEval (Instruction-Following Eval)

    - MT-Bench

    总结：IFEval是严谨的“数学考试”，评判标准客观唯一；MT-Bench是全面的“综合面试”，评判标准主观多元。评估一个蒸馏模型，必须同时使用这两把尺子，才能全面衡量其从“听清”到“听懂”再到“做好”的全链路指令遵循能力。


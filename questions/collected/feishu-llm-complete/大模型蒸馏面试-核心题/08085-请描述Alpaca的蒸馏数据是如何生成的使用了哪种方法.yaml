content:
  prompt: 请描述Alpaca的蒸馏数据是如何生成的？使用了哪种方法？
answer:
  mode: rubric
  reference_answer: |-
    Alpaca是斯坦福大学发布的一个早期且极具影响力的指令微调模型，它首次以极低成本展示了如何从一个大模型（教师）向小模型（学生）进行有效的知识蒸馏。其数据生成的核心方法是 Self-Instruct。

    Self-Instruct 的核心理念：让大模型自己给自己“出题”并“解答”，从而生成海量的指令-回答对，用于微调小模型。这种方法极大地降低了人工标注数据的需求。

    Alpaca的数据生成流程：

    - 准备种子任务池：由人类专家编写了175条高质量的指令-回答对（种子数据），覆盖了希望模型学会的多样化任务类型，如问答、生成、摘要等。这个种子池是整个数据流程的“基因”，决定了生成数据的质量和多样性。

    - 指令生成：从种子池中随机抽取6-8条指令作为Few-shot示例，将它们拼接成一个Prompt。这个Prompt被发送给教师模型（当时是text-davinci-003），要求它生成一条“全新的、与示例不同的指令”。生成后，会计算新指令与池中已有指令的ROUGE-L相似度，如果过高则丢弃，以保证多样性。

    - 指令分类：使用另一个Prompt，让教师模型判断新生成的指令是“分类任务”还是“生成任务”。

    - 回答生成：将新指令发送给教师模型，让它给出高质量的回答。对于分类任务，要求输出类别标签；对于生成任务，则输出完整回答。

    - 过滤与后处理：对生成的指令-回答对进行质量过滤，包括格式检查、长度筛选等。

    - 迭代扩展：将通过过滤的新数据加入任务池，重复步骤2-5。经过多轮迭代，最终从175条种子扩展到了52K条高质量指令-回答对。这些数据被用来对LLaMA-7B模型进行监督微调（SFT），从而得到Alpaca模型。

    总结：Alpaca使用了一种基于少量人工种子、通过大模型自我引导的迭代式数据生成方法（Self-Instruct），实现了低成本的、高效的模型能力蒸馏。

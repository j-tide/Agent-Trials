content:
  prompt: 在指令蒸馏中，通常只对 assistant 回复部分计算蒸馏损失，为什么？
answer:
  mode: rubric
  reference_answer: |-
    这个问题的答案与上一问紧密相连，是损失掩码在指令蒸馏中的具体应用。其根本原因在于精确模仿教师的行为模式。

    - 模仿对象是“助手”，不是“用户”：蒸馏的目标是让学生模型成为一个优秀的助手。因此，我们希望它学习的是教师模型在“看到用户指令后，如何生成一个高质量的回复”。如果对用户指令部分也计算损失，学生就会去学习“如何像一个用户一样提问”，这完全是错误的学习目标。

    - 保持对话的“因果结构”：指令蒸馏的数据通常是标准的多轮对话格式。在这种结构中，assistant的回复是对话的“果”，而system和user的输入是“因”。通过只对“果”计算损失，我们强制模型学习这个因果链。如果对“因”也计算损失，就破坏了这种结构，模型会混淆自己的角色，在推理时可能出现“自问自答”的混乱。

    - 避免信息泄露与“捷径学习”：如果对user的内容计算损失，模型可能会找到一种“捷径”——在生成回答时，直接抄写user输入中的关键词或句子。这完全没有学会理解和生成，而是变成了一个高级的文本复制机。

    总结：只对assistant回复部分计算损失，是训练一个行为可控、角色清晰、功能专一的对话助手的基石。它让模型将“遵循指令”和“生成回答”紧密地绑定在一起，而不会产生角色错乱。


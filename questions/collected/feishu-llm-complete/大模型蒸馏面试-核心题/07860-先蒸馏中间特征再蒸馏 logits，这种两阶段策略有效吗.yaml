content:
  prompt: 先蒸馏中间特征再蒸馏 logits，这种两阶段策略有效吗？
answer:
  mode: rubric
  reference_answer: |-
    非常有效，这实际上是“课程学习”和“渐进式训练”思想在蒸馏中的经典应用。

    - 第一阶段：特征蒸馏（构建骨架）。此阶段的核心任务是让学生模型学习教师模型强大的内部表征。通过MSE等损失对齐中间层特征，能强制学生模型构建起与教师类似的信息处理流程，获得高质量的中间表示。这就好比先让学生拥有一个“好大脑结构”。

    - 第二阶段：Logits蒸馏（填充知识）。在第一阶段的基础上，学生已经具备了良好的内部表征能力。此时，再通过Logits蒸馏，学习教师模型最终的输出行为（暗知识），填充具体的知识和风格。这相当于在“好大脑结构”的基础上，注入“丰富的知识”。

    有效原因：这种策略避免了在训练初期，让学生模型同时去优化一个差异巨大的复杂目标（Logits分布）和一个局部目标（中间特征）。它分步进行，每一步的优化目标都更纯粹，从而降低了整体优化的难度，加速了收敛，并通常能获得更好的最终性能。


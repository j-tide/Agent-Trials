content:
  prompt: 蒸馏模型的长文本能力如何测试？大海捞针测试适用吗？
answer:
  mode: rubric
  reference_answer: |-
    完全适用，而且大海捞针测试是评估长文本信息提取能力的绝佳方法。

    - 大海捞针测试：在一篇极其冗长的、与问题毫不相干的文本（“干草堆”）中，随机插入一句非常具体的、孤立的事实（“针”）。然后提问一个只能由这句“针”来回答的问题。通过在不同的文档深度（0%, 25%, 50%, 75%, 100%）和不同总长度（8K, 32K, 128K）下重复此实验，可以绘制出模型的“深度-准确率”热力图。它能极其直观地暴露出模型是否存在“中部迷失”——即模型对文档开头和结尾的信息能很好地捕获，却完全忽略了中部的信息。

    - 其他标准长文本基准：结合使用LongBench、L-Eval、∞-Bench等，它们提供了多文档QA、长文本摘要、长文本推理等更全面的评估任务。

    对于蒸馏模型，这项测试至关重要，因为蒸馏过程可能破坏大模型中原本处理长距离依赖的注意力模式。


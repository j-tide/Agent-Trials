content:
  prompt: 注意力蒸馏中，是否需要归一化？如何处理多头注意力的匹配？
answer:
  mode: rubric
  reference_answer: |-
    是的，在注意力蒸馏中，归一化和对多头注意力的处理是至关重要的技术细节。

    一、是否需要归一化？

    需要，且取决于所选的损失函数。

    - 如果使用KL散度：注意力图 AA 的每一行（代表一个Query对所有Key的注意力分布）需要被Softmax归一化为一个概率分布 P = softmax(A)。KL散度衡量的是两个分布之间的差异，因此必须进行归一化。公式为 L_attn = KL(P_t || P_s)。

    - 如果使用MSE：则有两种选择。一是直接对未归一化的注意力分数（logits）计算MSE；二是对归一化后的注意力权重计算MSE。实践中，对归一化后的权重计算MSE更稳定，因为它的数值范围是确定的。

    二、如何处理多头注意力的匹配？

    多头注意力机制为知识传递提供了更丰富的来源，但也带来了匹配问题。常见策略有：

    - 头对头匹配：这是最精细的方法。要求学生模型的第 i 层、第 j 个注意力头，直接去拟合教师模型对应层的第 j 个头。这要求师生模型的头数必须一致，或能够建立明确的映射关系。

    [图片内容未导入]

    - 拼接匹配：将所有头的注意力图按行或按列拼接成一个大的注意力矩阵，然后进行匹配。这同样不限制头数，但计算量较大。

    - 重要性加权匹配：不强制进行物理上的头对头匹配，而是将学生的注意力头视为一个整体，去学习如何组合它们以最好地模仿教师的注意力模式。这可以通过一个可学习的加权机制来实现。


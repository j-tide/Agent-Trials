content:
  prompt: 思维链蒸馏（CoT Distillation）为什么能有效提升小模型推理能力？
answer:
  mode: rubric
  reference_answer: |-
    思维链蒸馏是指从大型推理模型（或通过提示工程激发大模型的逐步推理能力）中，将包含推理步骤的文本或推理过程隐含的概率分布，蒸馏到小模型中。其有效性源于：

    （1）传递了推理过程的显式知识

    - 标准蒸馏只传soft logits，而 CoT 蒸馏让小模型模仿人类的推理步骤（逐步推断、中间结论、自我验证），相当于直接教它“如何思考”。这种过程性知识比最终的答案分布更有助于泛化到新问题。

    - 小模型学会了将复杂问题分解成子问题逐步求解，而不是端到端黑箱映射，这增强了系统性与鲁棒性。

    （2）提供了更丰富的训练信号

    - 思维链文本作为输出序列的一部分，令序列变得很长，每一步都构成了监督信号。小模型不仅要学习最终答案，还要学习中间每一步的正确性，梯度信号密度高，有助于优化。

    - 另外，这种逐步推理的文本展示了隐性工作记忆的外化，帮助模型掌握逻辑演算。

    （3）引导模型学习结构化表征

    - 强制输出 CoT 促使中间隐藏状态必须承载推理链中的逻辑关系，这有助于小模型学到更抽象、可组合的表征，实现推理模块的内化。

    - 实验表明，通过 CoT 蒸馏，小模型可能在参数中涌现出类似心算、符号推理的回路，显著提升对应推理 benchmark 的表现。

    （4）利用了教师模型的推理能力缩放效应

    - 大模型通过思维链激发出的推理能力远强于其直接回答的能力。蒸馏这种“经过推理增强的分布”传递的是超越正常教师输出的知识。小模型由此间接获得了大模型深度推理的红利。

    （5）缓解了分布偏移

    - CoT 提供了问题格式与推理步骤的标准化模板，使不同问题的处理流程相似，减少了学生模型面对新问题时的分布外恐慌。

    简言之，CoT 蒸馏教的是“钓鱼的方法”，而不仅是“鱼”，因此小模型推理能力质的飞跃。


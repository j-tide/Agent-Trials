content:
  prompt: 如何构建一个“数据飞轮”，利用小模型反馈来优化蒸馏数据？
answer:
  mode: rubric
  reference_answer: |-
    数据飞轮是一个通过持续迭代实现自我改进的闭环系统。它将小模型的线上表现作为反馈信号，用于优化下一轮的蒸馏数据，从而驱动模型不断进化。

    构建步骤：

    - 部署与监控（Deploy & Monitor）：将V1版本的蒸馏小模型部署上线。在线上服务中，全面捕获用户的显式反馈（点踩、举报） 和隐式反馈（中断对话、重复提问、复制回答后修改）。这些是飞轮的“燃料”。

    - Bad Case挖掘与根因分析（Mine & Analyze）：构建自动化的管道，从海量日志中筛选出高价值的Bad Case。对Bad Case按错误类型进行分类：事实错误、格式错误、不安全、过度拒绝等。这一步是诊断模型当前短板的关键。

    - 数据精炼与修正（Refine & Correct）：这是飞轮的核心环节。针对Bad Case，我们需要“对症下药”：

    - 迭代训练与上线（Re-train & Iterate）：使用包含修正数据的新数据集，对V1模型进行增量微调（Incremental Fine-tuning），得到能力更强的V2模型。将V2模型部署上线，取代V1，开始新一轮的飞轮循环。

    关键点：这个飞轮之所以高效，是因为它将昂贵的教师模型调用，精确地聚焦在了学生模型真正的短板问题上，实现了“好钢用在刀刃上”的成本优化。


content:
  prompt: 对比学习在特征蒸馏中有什么应用？如CRD。
answer:
  mode: rubric
  reference_answer: |-
    对比学习在特征蒸馏中的应用，旨在克服传统MSE损失的一个根本缺陷：过分关注特征的绝对数值，而忽略了特征的相对结构和区分度。CRD是其中的代表。

    CRD的基本思想：不追求学生的特征向量 f^s 与教师的 f^t 在数值上完全一致，而是追求它们在“对比空间”中具有相似的相对关系。具体来说，它鼓励学生和教师对同一个输入样本产生高度相关的表示，而对不同输入样本产生差异较大的表示。

    CRD的操作流程：

    [图片内容未导入]

    - 通过优化这个损失，学生模型学会将特征映射到一个高维空间中，使得同一个样本的师生特征距离很近，而不同样本的特征距离很远。

    优势：CRD传递的是一种全局结构关系，而不是局部数值。它不要求学生模型复现教师特征的全部细节，只需要保持其区分不同样本的能力。这使得它在处理架构差异较大的师生模型时，比MSE更为有效。


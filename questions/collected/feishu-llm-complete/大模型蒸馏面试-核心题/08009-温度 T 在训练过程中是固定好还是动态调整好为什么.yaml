content:
  prompt: 温度 T 在训练过程中是固定好还是动态调整好？为什么？
answer:
  mode: rubric
  reference_answer: |-
    通常固定温度是最佳实践，但在追求极致性能时可尝试动态退火。

    - 固定温度的优势与原理：
    稳定的优化环境是模型收敛的基石。训练过程中改变温度 T，会直接改变软标签的熵（平滑程度），这相当于在训练中动态地改变了优化目标。对于优化器而言，目标函数的突然改变可能导致梯度震荡和收敛困难。因此，在绝大多数情况下，固定一个通过验证集搜索出的最优 T，能提供最稳定、最可靠的训练流程。

    - 动态温度的理论优势（课程学习）：

    - 初期高T（粗粒度学习）：学生模型参数随机或处于初始阶段，与教师差异巨大。高T使教师分布平滑，类间差异模糊，降低了拟合难度。这相当于让学生先学习“物体和背景的区别”，而不是“细粒度分类的微妙差异”。

    - 后期低T（细粒度学习）：学生已有基础，低T使教师分布尖锐，提供更明确、更精细的指导信号。这相当于让学生在掌握基础后，再进行“特训”，以完美复现教师的决策边界。


content:
  prompt: 如何评估蒸馏出的对话模型是否具有良好的人格和一致性？
answer:
  mode: rubric
  reference_answer: |-
    评估对话模型的人格和一致性，是比评估其知识水平更复杂、更主观的任务，需要一套多维度的评估体系。

    评估维度与指标：

    - 人格一致性测试集：构建一个专门的测试集，其中包含一系列诱导性问题，用来测试模型是否能始终如一地遵循System Prompt中定义的角色特征。例如，对于一个被设定为“专业、正式”的助手，可以观察它在面对“讲个笑话”这类请求时，是否能以符合人格的方式回应。

    - 多轮对话矛盾检测：设计长程的多轮对话，在对话开头设定一些背景信息（如“我叫李明”）。在对话的第10轮以后，突然问“我叫什么名字？”，观察模型是否能准确记住。或者，在对话中故意诱导模型前后矛盾，然后用一个基于强模型的评判器来检测矛盾。

    - 自我认知一致性：使用一系列关于模型自身身份的问题（如“你是谁？”、“你能做什么？”），测试模型是否在所有情况下都给出统一、连贯的回答，不会因为上下文变化而“失忆”。

    - 风格一致性度量：使用一个预训练的风格分类器，对模型的多轮回复进行风格分析（如正式度、口语化程度、情绪倾向）。统计其风格的方差，方差越小，一致性越好。

    - GPT-4-as-Judge（自动评估）：使用一个强大的评判模型（如GPT-4），给它提供完整的对话上下文和模型回复，要求它从“角色扮演的一致性”、“回复的连贯性”、“人设是否崩塌”等维度进行Likert量表打分。

    核心：良好的人格和一致性意味着模型的行为是可预测、可信任的。这需要通过在蒸馏数据中大量注入角色扮演、多轮记忆、边界测试等样本，并在评估时采用多维度的自动化与人工相结合的方法。


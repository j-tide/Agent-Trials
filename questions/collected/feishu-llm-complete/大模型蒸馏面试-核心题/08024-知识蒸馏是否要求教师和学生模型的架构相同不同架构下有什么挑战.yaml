content:
  prompt: 知识蒸馏是否要求教师和学生模型的架构相同？不同架构下有什么挑战？
answer:
  mode: rubric
  reference_answer: |-
    不要求。知识蒸馏的魅力之一就是它可以跨架构工作。只要输入和输出的维度空间一致，教师和学生可以是完全不同的网络结构。例如，可以用Transformer教师蒸馏CNN学生，或者用ResNet教师蒸馏MobileNet学生。

    不同架构下的挑战：

    - 特征空间不对齐：不同架构的中间层表示差异巨大，这使得基于特征的蒸馏（如FitNet）变得困难。通常需要额外的投影层将学生特征映射到教师特征空间，增加了复杂度和参数量。

    - 归纳偏置不同：CNN具有平移不变性和局部性，而Transformer具有全局感受野。学生模型如果模仿教师，可能会学到不适合其自身架构的能力。例如，用Transformer蒸馏CNN时，CNN学生可能难以学习到全局注意力模式，导致蒸馏效率低下。

    - 容量差距过大：教师和学生容量差距过大（如ResNet-152 → MobileNet-V1），学生可能无法完全拟合教师提供的复杂知识，导致蒸馏效果不佳。这时通常需要更高的蒸馏温度来“软化”目标，或结合中间层蒸馏来提供更多引导。

    解决这些挑战的方法包括：使用辅助分类器、引入多级蒸馏、优化投影层设计、以及适当地调整蒸馏温度。

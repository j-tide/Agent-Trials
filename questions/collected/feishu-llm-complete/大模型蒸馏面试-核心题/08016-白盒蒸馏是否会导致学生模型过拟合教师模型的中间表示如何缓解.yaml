content:
  prompt: 白盒蒸馏是否会导致学生模型过拟合教师模型的中间表示？如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    会，这是白盒蒸馏的一种典型风险，被称为“过度正则化”或“特征模式坍缩”。 当学生模型被强迫去精确复现教师的每一个中间特征值时，它可能会丧失自身的灵活性和泛化能力。

    根本原因：

    - 目标函数的“噪声”：教师的中间表示并非绝对真理。它包含了教师模型自身的过拟合、偏见和噪声。学生如果一丝不苟地拟合这些“噪声”，就会学到错误的模式。

    - 限制学生探索：强加的逐层MSE约束，极大地限制了学生在参数空间中自由探索的能力，使其收敛到与教师高度相似、但泛化性可能更差的局部最优点。

    缓解策略：

    - 适度蒸馏与层选择：不蒸馏所有层，只蒸馏最后几层或关键层。这给了学生模型在底层和中层形成自己独特表征的自由度。

    - 降低蒸馏强度：使用较小的损失权重（β），或者使用更宽容的损失函数（如Huber Loss代替MSE，减少对大误差的敏感度）。

    - 引入噪声或扰动：在教师的特征上添加微小的随机噪声，再作为蒸馏目标。这能防止学生过拟合到教师特征的绝对精确值，提升鲁棒性。

    - 对抗蒸馏（Adversarial Distillation）：训练一个判别器，让它去区分特征来自教师还是学生。学生模型的目标是生成连判别器都无法分辨的特征。这鼓励学生学习教师特征分布的“风格”，而不是精确的“数值”。

    - 使用关系蒸馏（RKD）：传递样本间的相对关系，而不是绝对特征值，这是一种更抽象、更不容易过拟合的知识形式。


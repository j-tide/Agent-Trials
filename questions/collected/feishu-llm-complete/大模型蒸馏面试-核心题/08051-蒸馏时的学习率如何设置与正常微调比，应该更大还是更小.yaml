content:
  prompt: 蒸馏时的学习率如何设置？与正常微调比，应该更大还是更小？
answer:
  mode: rubric
  reference_answer: |-
    通常可以比正常微调设置得稍大一些（约1.5-2倍），但需具体分析。

    - 为什么可以更大（核心原因）：
    蒸馏的优化目标是教师模型输出的平滑软标签，这是一个高熵的、包含丰富结构信息的分布。而正常微调的目标是熵极低的硬标签（one-hot向量）。平滑的软标签为优化器提供了一个更平坦、更宽阔、指向更一致的梯度场。在这个梯度场中，优化器可以以更大的步长（即更高的学习率）前进，而不容易发生震荡或跳入错误方向。而离散、尖锐的硬标签所形成的梯度场则更崎岖，容易“一步踏错”。

    - 需要具体分析的场景：


content:
  prompt: 大模型（如 70B）蒸馏到小模型（如 7B）时，最大的挑战是什么？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    最大的挑战是严重的容量差距导致的知识压缩瓶颈。

    这不仅仅是简单的“教师大、学生小”的问题，而是大模型中隐含的许多高级能力（如复杂推理、多步规划、常识整合、长尾知识）在容量受限的学生模型中难以被完整编码。软标签提供的暗知识虽然丰富，但对于容量只有教师十分之一的学生来说，这些信号可能过于复杂，甚至产生负面效果。

    具体表现为：

    - 学生无法精确拟合教师的高熵软目标：大模型的输出分布通常非常尖锐（极度自信），即使通过高温软化，其内部蕴含的结构信息也需要足够的参数容量来学习和表达。小模型在有限的参数量下，会倾向于学习一个更平滑、更平均的近似，导致精度损失。

    - 能力退化：蒸馏通常只能有效传递教师模型在“输出空间”的知识，而对于支撑这些输出的深层能力（如逻辑推理、数学运算、代码生成）很难仅通过匹配软标签来完全迁移。结果是学生模型可能会“记住”答案模式，却丧失了泛化推理能力。

    - 灾难性遗忘加剧：在蒸馏过程中，小模型为了全力模仿大模型的行为，往往会过度调整其参数，从而迅速遗忘其在预训练阶段学到的广泛通用知识。这比常规微调的遗忘速度更快、程度更深。

    因此，蒸馏70B到7B不仅是一个模型压缩任务，更是一个能力萃取与结构化知识迁移的系统工程。


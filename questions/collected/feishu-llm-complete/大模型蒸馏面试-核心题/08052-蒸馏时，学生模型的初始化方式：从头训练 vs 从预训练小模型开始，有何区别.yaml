content:
  prompt: 蒸馏时，学生模型的初始化方式：从头训练 vs 从预训练小模型开始，有何区别？
answer:
  mode: rubric
  reference_answer: |-
    这是两种截然不同的学习范式，决定了蒸馏的起点和上限。

    [嵌入表格未展开]

    深入区别：

    - 从头训练：教师模型扮演了“全能导师”的角色，不仅要教知识，还要教语言。这需要海量的数据和计算资源，而且风险较高，可能训练不出优秀的基座模型。

    - 从预训练开始：学生模型已经是一个“合格的高中生”，教师模型扮演“专业教练”的角色，针对特定任务进行特训和技能精修。这种方式成本低、周期短、成功率高，是工业界的主流做法。


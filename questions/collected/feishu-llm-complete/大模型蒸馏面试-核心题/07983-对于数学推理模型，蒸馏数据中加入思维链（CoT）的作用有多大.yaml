content:
  prompt: 对于数学推理模型，蒸馏数据中加入思维链（CoT）的作用有多大？
answer:
  mode: rubric
  reference_answer: |-
    作用巨大，甚至可以说是数学推理蒸馏成功的决定性因素。 对于数学推理这种需要多步逻辑推导的任务，思维链蒸馏不仅仅是一种增强手段，而是一种根本性的能力迁移范式。

    CoT为何如此关键？

    - 将“结果模仿”升级为“过程模仿”：数学推理的本质是一个因果链：A→B→C→答案A→B→C→答案。仅仅蒸馏最终答案（即Logits），学生只能学到从问题到答案的统计映射，无法学到内在的推理逻辑。CoT将教师的内在思考过程外化为文本，让学生模型可以一步步地模仿这个思考过程，从而真正学会如何推理。

    - 降低学习难度，实现课程学习：一个复杂的数学问题可以被分解为多个简单的子步骤。CoT蒸馏相当于把一道“大题”拆成了多道“小题”来教学生。学生先学会每一步的推导，再学习如何将这些步骤串联起来，这种由易到难的学习方式极大地提高了学习效率。

    - 赋予模型“自我纠错”能力：高级的CoT数据不仅包含正确的推理链，还会包含“错误推理→发现错误→修正”的过程。通过拟合这种数据，学生模型能学会监控自身的推理，在出错时进行回溯和修正，这是高级推理能力的标志。

    实践对比：实验证明，在GSM8K等数学基准上，使用包含CoT数据训练的蒸馏模型，其准确率可以显著高于仅使用最终答案训练的模型，甚至能超越教师模型在某些情况下的表现。因此，对于数学推理蒸馏，CoT不是可选项，而是必选项。


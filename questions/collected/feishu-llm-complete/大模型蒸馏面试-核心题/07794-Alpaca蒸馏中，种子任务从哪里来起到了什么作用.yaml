content:
  prompt: Alpaca蒸馏中，种子任务从哪里来？起到了什么作用？
answer:
  mode: rubric
  reference_answer: |-
    种子任务全部来自于人类专家的人工编写。它们是一组由人类精心设计的、包含不同任务类型的175条指令-回答对。

    这些种子任务起到了决定性的作用，是整个数据生成流程的基石和蓝图：

    - 定义能力范围：种子数据明确告诉教师模型，我们希望学生模型学会哪些类型的任务（如翻译、问答、生成、推理等）。教师模型会围绕这些核心任务来生成新的指令。

    - 保证数据质量和多样性：高质量、高多样性的种子是生成数据质量的“基因”。如果种子数据本身充满噪声或类型单一，那么后续所有生成的数据都会被污染，导致学生模型能力单一化。

    - 作为Few-shot示例：在Self-Instruct流程的每一步（生成新指令、指令分类），种子数据都被用作Few-shot示例，引导教师模型生成符合格式和内容要求的新数据。它们为教师模型提供了明确的“模仿”范本。

    可以说，种子的质量决定了Alpaca模型能力的天花板。

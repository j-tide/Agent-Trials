content:
  prompt: 解释 Orca 2 中的 "Prompt Erasure" 技术及其目的
answer:
  mode: rubric
  reference_answer: |-
    "Prompt Erasure"（提示擦除） 是 Orca 2 在训练学生模型时采用的一种关键数据预处理技术。其核心操作是：在训练学生模型时，从输入中移除那些用于引导教师模型生成详细推理过程的、复杂的 System Prompt，仅保留原始的用户问题。

    目的：

    - 消除训练与推理的分布偏移：在蒸馏数据生成阶段，为了从教师那里获得高质量的、包含详细推理步骤的回答，我们使用了包含详细指令的复杂 System Prompt（例如：“你是一个AI导师，请一步一步思考，并解释你的推理...”）。然而，在学生模型实际部署时，用户通常不会提供这种复杂的 System Prompt。如果训练时学生模型依赖于这种复杂 Prompt 才能表现出推理能力，那么它在真实用户场景下就会失效。Prompt Erasure 强制学生模型在没有任何特殊指令的情况下，仅凭原始问题就能自发地产生详细的推理过程。

    - 内化推理能力：通过这种训练方式，学生模型不会将复杂的 System Prompt 当作一个“触发开关”来依赖。相反，它将教师的推理行为模式内化成了自己的一种默认能力。模型学会的是：“面对复杂问题，我应该这样思考”，而不是“当收到‘请一步一步思考’的指令时，我才这样思考”。

    - 实现“小模型大智慧”：这实际上是一种高级的泛化训练。它让没有特殊 Prompt 的小模型，在行为上表现出了需要靠复杂 Prompt 引导的大模型才具备的能力。这使得最终的学生模型更加鲁棒、更易于使用，让高级推理能力“开箱即用”。

    总结：Prompt Erasure 是一种消除模型对特定Prompt依赖的训练技巧，它让学生在推理时忘掉“拐杖”，从而真正学会自己“走路”。


content:
  prompt: 如何使用“数据重放”防止蒸馏中的灾难性遗忘？
answer:
  mode: rubric
  reference_answer: |-
    数据重放是防止遗忘最直接、最有效的方法。它通过将旧知识（预训练阶段的通用数据）与新知识（蒸馏数据）混合，强制模型在学习新任务时不忘旧知。

    实现方法：

    - 维护一个重放缓冲区：在蒸馏开始前，从通用的预训练语料库（如Wikipedia、书籍）中随机采样一个子集。这个缓冲区的大小通常是蒸馏数据集的10%-20%。

    - 混合训练：在蒸馏的每一个训练Batch中，既包含蒸馏数据（指令-回答对），也包含从重放缓冲区中采样的通用文本。通用文本按照标准的自回归语言模型任务进行训练（预测下一个Token），与蒸馏损失叠加。

    为什么有效？

    - 梯度“锚定”：蒸馏数据的梯度会将模型拉向狭窄的任务分布，而通用文本的梯度则提供了指向预训练分布广阔区域的“修正力”。模型参数更新是两者的加权平均，从而防止参数完全脱离旧知识的盆地。

    关键参数：

    - 混合比例：通用数据占比通常在 5% - 20%。遗忘风险越高，比例应越高。

    - 数据选择：重放数据必须高质量，且有代表性。定期更新缓冲区中的内容可以覆盖更广的旧知识。


content:
  prompt: 关系蒸馏（RKD）的核心思想是什么？它传递了什么信息？
answer:
  mode: rubric
  reference_answer: |-
    关系蒸馏不再追求让学生模型的单个特征向量去逼近教师模型，而是传递更高阶、更结构化的“关系知识”。

    - 核心思想：知识不仅存在于单个样本的特征表示中，更存在于样本之间或特征维度之间的相互关系里。例如，在特征空间中，如果“猫”和“狗”的距离很近，而它们与“汽车”的距离很远，这种结构信息本身就是一种重要的知识。

    - 传递的信息（两种关系）：

    关系蒸馏的优势在于，它传递的知识独立于特征空间的绝对位置，因此天然不受师生模型特征维度不同的影响，具有极高的灵活性。


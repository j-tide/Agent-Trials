content:
  prompt: 如果只使用软标签进行蒸馏，完全不使用原始硬标签，可能有什么风险？
answer:
  mode: rubric
  reference_answer: |-
    仅使用软标签进行蒸馏（即完全抛弃真实硬标签）虽然可行，但存在以下几个潜在风险：

    - 教师偏差的完全继承：教师模型并非完美，它可能在某些样本上产生错误或偏置的预测。硬标签是来自真实数据分布的“绝对基准”，能够纠正教师的错误。如果完全依赖软标签，学生模型会不加批判地模仿教师的所有行为，包括其过拟合、偏见以及对某些类别的系统性误判。这可能导致学生模型在蒸馏后反而比教师更差，或者继承了教师对特定人群、场景的歧视性预测。

    - 缺乏对真实数据分布的锚定：硬标签提供了真实世界的监督信号，确保学生模型能够拟合训练数据的真实分布。软标签本质上是教师对真实分布的近似，这种近似是有信息损失的。若完全切断与硬标签的联系，学生模型的学习目标将偏离真实任务，可能在最终测试集上表现不佳。

    - 训练不稳定与收敛困难：在训练初期，学生模型的输出分布可能与教师相差极大，仅靠KL散度可能导致梯度极大且不稳定。硬标签的交叉熵损失可以作为一个强基准，帮助学生快速进入合理区域，之后再精细模仿教师。没有这个锚点，训练可能震荡或收敛缓慢。

    - 过度平滑与泛化能力下降：软标签经过了高温平滑，丢失了部分类别间的明确界限。对于需要清晰决策边界的任务（如细粒度分类），过度依赖平滑信号可能导致学生模型学到的决策边界模糊，对某些易混淆类别的区分能力下降。

    因此，实践中通常保留少量硬标签损失（例如α=0.1）作为正则化和校准项，既能吸收教师的暗知识，又能保持对真实世界的对齐。


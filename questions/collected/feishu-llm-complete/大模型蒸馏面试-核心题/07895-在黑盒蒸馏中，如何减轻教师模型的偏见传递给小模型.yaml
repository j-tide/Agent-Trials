content:
  prompt: 在黑盒蒸馏中，如何减轻教师模型的偏见传递给小模型？
answer:
  mode: rubric
  reference_answer: |-
    教师模型的偏见是其训练数据和算法偏差的体现，在黑盒蒸馏中极易传递给学生，甚至被放大。因此，必须主动、显式地进行干预。

    缓解策略：

    - 源头控制：提示词工程（Prompt Engineering）：在调用教师API生成数据时，通过System Prompt直接注入去偏指令。例如：“请注意，在生成回答时，避免任何关于性别、种族、宗教的刻板印象。确保回答对所有群体都是公平和尊重的。” 这种方法简单直接，能从源头抑制一部分偏见。

    - 数据生成与筛选：反事实数据增强（Counterfactual Data Augmentation）：

    - 训练策略：公平性约束：在蒸馏损失函数中，加入一个辅助损失项。这个损失项可以惩罚学生模型在面对只有敏感属性不同的成对输入时，产生显著差异的输出。这能强制学生模型学习到更公平的决策边界。

    - 后训练处理：蒸馏完成后，使用一个精心构造的、大规模的去偏数据集（例如，平衡不同群体数据的集合），对学生模型进行一次轻量级的微调。这往往是保证最终模型公平性的最后一道，也是最有效的防线。

    核心思想：偏见治理是一项系统工程，需要贯穿数据生成、数据筛选、模型训练和模型后处理的整个流程，而不是某个单点的技术。在黑盒蒸馏领域，蒸馏数据的质量控制、多样性维持、难度设计以及对教师模型偏见的抑制，是决定学生模型能力上限的关键。以下将围绕蒸馏数据生成的后续处理（如拒绝采样）、质量与覆盖度评估、难度设计、多轮对话生成、成本控制及偏见抑制等议题进行深入剖析。


content:
  prompt: 在数学推理蒸馏中，如何让教师模型输出足够详细的步骤？
answer:
  mode: rubric
  reference_answer: |-
    数学推理能力不能仅靠模仿最终答案来传递，必须将内在的、隐式的思考过程显式化为可学习的文本。因此，让教师模型输出详细的推理步骤（思维链，CoT）是核心。

    一、提示词工程（Prompt Engineering）是关键手段

    - 使用强引导性的System Prompt：

    你是一位数学导师。你的任务不是直接给出答案，而是像老师一样，一步一步地展示完整的解题过程。请确保：
    - 每一步都清晰标注（如“步骤1：理解问题”）。
    - 解释每一步背后的数学原理或公式。
    - 如果涉及计算，请写出详细的计算过程。
    - 在得到答案后，进行验证。
    - 最后，给出明确的最终答案。

    - 在User Prompt中注入Few-shot示例：

    二、构造“过程性”的训练数据

    - 包含多种推理路径：对于同一道题，可以生成使用不同解法的回答（如代数法和几何法），让学生学会灵活应对。

    - 引入“错误-修正”链：在数据中构造“模型先给出一个包含常见错误的解答，然后自己发现并纠正”的完整过程。在训练时，必须对错误部分进行Loss Masking（设为-100），只让学生学习“如何发现并修正错误”。

    - 要求进行“验证”：在Prompt中明确要求教师模型在得到答案后，代入原题或使用另一种方法进行验证，并写出验证过程。


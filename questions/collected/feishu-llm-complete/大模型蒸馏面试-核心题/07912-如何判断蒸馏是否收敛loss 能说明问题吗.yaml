content:
  prompt: 如何判断蒸馏是否收敛？loss 能说明问题吗？
answer:
  mode: rubric
  reference_answer: |-
    Loss是重要的参考，但不能作为判断蒸馏收敛的唯一标准，甚至可能产生误导。

    - Loss的误导性：

    综合判断收敛的正确方法：

    - 首要指标：验证集任务性能稳定。这是最终目标。当你在一个独立的验证集上发现模型的准确率或其他任务指标不再提升，甚至开始波动，这通常是停止训练的最强信号。

    - 辅助指标：学生-教师输出对齐度稳定。验证集上的KL散度趋于稳定，说明学生模仿教师的行为模式已经收敛。

    - 安全指标：泛化能力不再退化。验证集上的通用任务性能保持稳定，说明灾难性遗忘已经停止。

    - 生成式评估：通过GPT-4-as-Judge或人工评估，发现学生模型的生成质量不再提升。

    结论：不要仅盯着Loss曲线。 当你在TensorBoard上看到验证集上的任务准确率和KL散度同时进入一个平台期，并且已经满足了你的业务需求，此时模型就是收敛的。过早停止可能欠拟合，过晚停止可能过拟合。


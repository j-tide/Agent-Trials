content:
  prompt: 知识蒸馏是否需要和预训练模型结合？如何结合？
answer:
  mode: rubric
  reference_answer: |-
    知识蒸馏与预训练模型的结合是现代深度学习中最强大的组合之一，它们不是互斥的，而是协同增效的。

    结合方式：

    - 预训练模型直接作为教师

    这是最常见的模式。使用一个在大型通用数据集（如ImageNet、BERT预训练语料）上预训练好的大模型作为教师。学生模型也使用相同的预训练权重进行初始化，然后在目标任务上进行蒸馏微调。这种方式下，教师和学生的起点都很高，蒸馏可以高效地将教师的泛化能力迁移到轻量学生上。例如，DistilBERT就是用预训练BERT-base作为教师，学生也从教师权重初始化，并继承了教师的词汇表和部分权重。

    - 蒸馏辅助预训练

    在预训练阶段就引入蒸馏。例如，在从头训练一个学生模型时，同时让一个强大的预训练教师模型提供软标签。这可以看作是用教师的知识来增强预训练过程，使小模型在预训练阶段就能学到更丰富的知识，从而在下游任务微调时获得更好的效果。这相当于教师全程“陪练”。

    - 任务特定的蒸馏

    先在一个大型通用数据集上预训练教师，然后在特定下游任务数据上同时微调教师和蒸馏学生。学生模型继承教师的通用知识，再通过任务数据蒸馏，学习教师的特定任务决策边界。这是目前最常见的工作流：预训练（通用知识）→ 下游微调+蒸馏（特定任务知识）。

    为什么需要结合？

    预训练模型已经具备了强大的通用知识。如果学生模型不从预训练权重开始，而是随机初始化，去蒸馏一个预训练教师，会因起点差距过大而非常困难，学生可能根本无法理解教师输出的高级语义。使用预训练权重初始化学生，可以极大缩小初始差距，使蒸馏更专注于任务特定的精细化知识传递，而不是从零学习基础特征。这本质上是将“知识蒸馏”嫁接在“迁移学习”之上，实现效果的倍增。

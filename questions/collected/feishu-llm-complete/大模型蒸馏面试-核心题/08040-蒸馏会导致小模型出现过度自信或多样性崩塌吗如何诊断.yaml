content:
  prompt: 蒸馏会导致小模型出现“过度自信”或“多样性崩塌”吗？如何诊断？
answer:
  mode: rubric
  reference_answer: |-
    会，这两种现象是蒸馏过程中非常典型的副作用。

    原因：

    - 过度自信：教师模型的软标签通常非常尖锐（高置信度）。小模型在学习时，倾向于完全模仿这种自信，使得其输出的概率分布熵值更低，导致模型对自己的预测（哪怕是错误的）极度自信。这在分布外数据上尤为明显。

    - 多样性崩塌：蒸馏通过最小化学生与教师输出的KL散度，会促使学生的输出分布坍缩到教师的分布中心。这导致学生模型丧失了生成多样、创意的文本能力，对同一个问题总是给出极其相似的回答，变得“模板化”。

    诊断方法：

    - 过度自信：计算模型的期望校准误差（ECE）。将预测概率分桶，对比平均置信度和平均准确率。一个过拟合自信的模型，其ECE会非常高。例如，模型说“有90%概率正确”的样本中，实际正确率远低于90%。


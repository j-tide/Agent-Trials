content:
  prompt: 蒸馏一个小模型作为“猜测模型”（Draft Model）用于推测解码，有什么要求？
answer:
  mode: rubric
  reference_answer: |-
    在推测解码（Speculative Decoding）中，一个轻量级的猜测模型（Draft Model）负责快速生成多个候选Token，然后由大型的目标模型（Target Model）并行验证。这个猜测模型本质上就是目标模型的一个蒸馏版本，但它的要求与普通的蒸馏模型有很大不同。

    核心要求：

    - 极高的推理速度：这是最重要的要求。猜测模型的推理速度必须远快于目标模型（至少要快10倍以上）。因为在验证阶段，目标模型要一次性检验猜测模型生成的多个Token，如果猜测模型生成这些候选Token的时间过长，就无法达到加速效果。因此，猜测模型必须是极小的（例如，目标模型70B，猜测模型可能只有1B-3B）。

    - 极高的输出分布相似度（对齐率）：猜测模型的目标不是独立地生成高质量文本，而是模拟目标模型的行为，使得目标模型能以高概率接受它生成的候选Token。如果猜测模型的输出分布与目标模型差异太大，它生成的大部分Token都会被目标模型拒绝，导致浪费计算资源且无法加速。因此，蒸馏时必须使用KL散度等损失函数，让学生模型的输出分布尽可能与教师对齐。

    - 架构的同源性（关键）：为了保证输出分布的高度相似和推理管线的兼容性，猜测模型通常必须与目标模型共享相同的架构、Tokenizer和词表。例如，LLaMA-70B通常使用一个同架构的LLaMA-3B或更深压缩的LLaMA-1B作为猜测模型。

    - 训练方式的特殊性：

    总结：蒸馏一个猜测模型，追求的不是独立的高精度，而是对目标模型的忠实追随度和极致的推理效率。它是一个高度特化、与目标模型深度绑定的组件。

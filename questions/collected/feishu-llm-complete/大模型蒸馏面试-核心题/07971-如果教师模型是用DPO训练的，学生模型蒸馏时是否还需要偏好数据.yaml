content:
  prompt: 如果教师模型是用DPO训练的，学生模型蒸馏时是否还需要偏好数据？
answer:
  mode: rubric
  reference_answer: |-
    答案是：仍然强烈建议需要，但可以将教师模型作为偏好数据的“生成器”，而不是直接依赖昂贵的、新的人工标注。

    原因分析：

    - SFT蒸馏的局限性：如果仅仅用DPO教师生成的回答对学生进行SFT蒸馏，学生只能学到教师“最终选择的行为”，而无法学到教师“为何这样选择”背后的偏好权衡。这种对齐知识在SFT中极易被遗忘。

    - 偏好数据的核心价值：偏好数据（区分好和更好）直接教给学生模型在价值冲突时如何做出选择（例如，简洁 vs. 详细，安全 vs. 有用）。这是SFT的“模仿正确答案”所无法替代的。

    - 如何高效获取偏好数据：

    总结：我们需要的不是“人类的原始偏好数据”，而是“能够教会学生进行价值判断的对比信号”。DPO教师模型本身就可以充当这个信号的生成器。


content:
  prompt: 蒸馏训练时，验证集应该如何构造？用哪些指标监控？
answer:
  mode: rubric
  reference_answer: |-
    蒸馏的验证集构造和监控远比普通训练复杂，因为它需要同时评估学生的任务能力、模仿程度和泛化能力。

    验证集构造：

    - 来源必须与训练集独立：绝对不能从蒸馏训练数据中划分，否则会给出虚假的乐观结果。应该来自一个独立的、分布相似的数据集。

    - 包含任务标签：为了计算准确率等任务指标，验证集必须包含真实的标准答案（硬标签）。

    - 覆盖多种难度和能力维度：不能只包含简单任务。必须覆盖学生需要具备的各种能力，如事实问答、推理、安全对齐等。

    需要监控的核心指标：

    - 学生任务性能指标：在验证集硬标签上的准确率、F1-Score、困惑度（PPL）等。这是最根本的指标。

    - 学生模仿教师程度：

    - 泛化能力指标（防遗忘）：在一个独立的通用任务基准（如MMLU的子集）上评估模型。如果这个分数下降，说明发生了灾难性遗忘。

    - 生成质量指标：

    监控策略：在训练过程中，每隔固定的Step进行一次验证。使用TensorBoard等工具绘制这些指标的变化曲线。任何单一指标的恶化都可能是问题的前兆，需要综合分析。


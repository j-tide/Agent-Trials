content:
  prompt: 在蒸馏中加入少许预训练数据，对保持通用能力有多大作用？
answer:
  mode: rubric
  reference_answer: |-
    作用巨大，且效果立竿见影。 这本质上就是数据重放的具体应用，是防止灾难性遗忘的“特效药”。

    作用量化与原理：

    - 强有力的“记忆锚点”：在许多LLM蒸馏实验中，加入5%-10%的预训练数据，就能将模型在通用基准（如MMLU）上的性能下降幅度从-5%以上缩小到-1%以内。它能精准地“锚定”住那些承载着通用知识的参数，防止它们在任务特定梯度下被覆盖。

    - 维护语言多样性：预训练文本风格各异，能有效对抗蒸馏带来的语言风格单一化和模板化问题，保持模型输出的灵活性。

    - 隐式正则化：通用文本对于蒸馏任务而言是一种“噪声”，能有效防止模型过拟合到蒸馏数据的特定模式，提升泛化能力。

    结论：这是蒸馏训练中回报率最高的技巧之一，是确保学生模型既有专长又不失通用智能的基石。


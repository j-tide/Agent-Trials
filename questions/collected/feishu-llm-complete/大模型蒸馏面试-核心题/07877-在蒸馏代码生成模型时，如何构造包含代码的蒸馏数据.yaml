content:
  prompt: 在蒸馏代码生成模型时，如何构造包含代码的蒸馏数据？
answer:
  mode: rubric
  reference_answer: |-
    构造代码蒸馏数据，比纯文本数据要更细致，核心是确保代码的正确性、完整性和上下文关联性。

    数据构造关键点：

    - 指令的多样性：指令必须覆盖代码生成、补全、解释、调试、优化、不同语言转换、测试用例生成等多种任务。仅仅生成代码是不够的。

    - 回答的完整结构：一个高质量的回答应包含以下部分：

    - 上下文信息的保留：对于代码调试或修改任务，必须提供完整的原始代码和错误信息（Traceback）作为上下文，然后让教师生成修正后的完整代码。

    - 严格的质量校验（最关键）：必须对生成的代码进行自动化验证。

    - 利用SFT数据格式：在训练时，需要根据模型类型构造数据。对于LLaMA等Decoder-only模型，通常将整个（指令+回答）序列拼接，但只对回答部分计算损失。对于需要输出代码的特定部分，要精确控制Loss Masking。


content:
  prompt: Vicuna是如何利用ShareGPT数据进行蒸馏微调的？
answer:
  mode: rubric
  reference_answer: |-
    Vicuna的高明之处在于它对这些原始的、充满噪声的ShareGPT数据进行了精细的处理和利用。

    - 数据获取与清洗：从ShareGPT网站爬取大量用户分享的对话。这些对话格式为HTML，需要进行解析和清洗。

    - 格式转化：将HTML格式的对话转化为统一的、结构化的角色对话格式（如Vicuna使用的USER: ... ASSISTANT: ...）。关键是正确区分用户和助手的发言。

    - 质量过滤：并非所有ShareGPT对话都是高质量的。需要进行过滤：

    - 删除过短或过长的对话。

    - 过滤掉包含大量乱码、非英语内容或敏感信息的对话。

    - 移除那些助手回复质量低下（如截断、不连贯）的对话。

    - 多轮对话构建：将筛选后的高质量多轮对话，按照原始的时间顺序，组织成完整的训练样本。一个样本就是一个完整的对话历史。

    - 监督微调（SFT）：使用这些多轮对话数据，对LLaMA基座模型进行微调。在训练时，只对每个对话轮次中“助手”部分的Token计算损失（Loss Masking），而“用户”的部分被忽略。这使得模型学会如何在一个完整的对话上下文中，根据历史信息生成恰当的回复。

    通过这种方式，Vicuna学会了模仿ChatGPT在多轮对话中的行为模式，获得了极高的对话智能。

content:
  prompt: 在评估蒸馏效果时，是否需要关注延迟和吞吐量？
answer:
  mode: rubric
  reference_answer: |-
    绝对需要。这是评估蒸馏商业价值的最终落地点。

    蒸馏的核心目标是“降本增效”。如果一个学生模型在准确率上达到了教师的99%，但推理延迟只降低了10%，那么这个蒸馏在工程上可能是失败的。如果另一个学生模型准确率只有教师的95%，但体积缩小了100倍，推理速度快了10倍，能够在手机端流畅运行，那么它是巨大的商业成功。

    关键指标：

    - 推理延迟：Pre-fill（首Token）延迟、Decode（后续每个Token）延迟。

    - 吞吐量：每秒能处理的Query数（QPS）或每秒生成的Token数（TPS）。

    - 显存占用：模型运行时需要的最大显存。

    - 硬件成本：在满足特定延迟和吞吐SLO（服务等级目标）下，所需的硬件规格和数量。

    综合评估：决策者应该看到一张综合表，上面清晰地列出每个模型方案（教师、蒸馏学生V1、蒸馏学生V2等）的核心指标（准确率）、延迟、吞吐和部署成本，从而做出商业决策。


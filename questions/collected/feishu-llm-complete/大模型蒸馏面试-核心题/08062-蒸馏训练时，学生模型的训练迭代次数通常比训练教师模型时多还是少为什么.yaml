content:
  prompt: 蒸馏训练时，学生模型的训练迭代次数通常比训练教师模型时多还是少？为什么？
answer:
  mode: rubric
  reference_answer: |-
    通常差不多，甚至可能略微多一些，但总训练时间远少于从头训练教师模型。

    - 原因1：收敛目标不同。教师从头训练，是从随机初始化开始在复杂的损失曲面上寻找最优解。而蒸馏中的学生通常从预训练权重或较好的初始化开始，并且目标（教师软标签）是一个已经“平滑”的、更容易拟合的分布。因此，学生可能在较少的epoch内就达到较好的性能。但由于学生容量小，有时需要更多迭代来充分吸收知识，防止欠拟合。

    - 原因2：学习难度。蒸馏的学习目标本质上更简单：模仿一个固定函数的输出，而不是探索原始数据分布。然而，教师软标签包含了更丰富的结构信息，学生可能需要比硬标签训练更多的迭代来捕捉类别间的细微差别。

    - 实践中的情况：对于同样的epoch数，蒸馏学生通常比从头训练的学生收敛更快，性能更好。最终epoch数通常与训练普通分类器相近（几十到几百个epoch），但每个epoch的计算量因模型变小而大幅减少。因此总训练时间（Wall-clock time）远短于教师。

    - 结论：学生模型的训练迭代次数（epoch）通常与教师或从头训练相当，但单步时间极短，因此总训练时间、总能耗和总成本显著降低。

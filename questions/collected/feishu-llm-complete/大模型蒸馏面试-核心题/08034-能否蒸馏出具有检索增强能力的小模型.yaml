content:
  prompt: 能否蒸馏出具有“检索增强”能力的小模型？
answer:
  mode: rubric
  reference_answer: |-
    可以。但需要蒸馏的不只是文本生成，还要将何时检索、如何检索、如何融合检索信息的决策能力传递给学生，使其在面对知识密集型任务时自动调用外部知识库。

    实现方案：

    （1）训练学生使用检索API

    - 将教师模型与检索器（如搜索引擎、向量数据库）交互的轨迹记录为训练数据。轨迹包括：判断是否需要检索、生成查询、接收文档、基于文档生成回答。学生在这些数据上微调，学会在适当位置生成特殊的检索调用 token，类似 Toolformer。

    - 在蒸馏数据中大量加入“检索→阅读→回答”的完整序列，使学生内化检索思维流程。

    （2）蒸馏检索决策模块

    - 教师模型内部对给定问题有一个隐式的“知识边界”判断。可以构建数据集让教师对问题标记是否需要检索，然后用这个标签训练一个轻量分类头在小模型上，决定何时触发检索。

    - 在生成过程中，当小模型的内部不确定性较高时（可用输出熵检测），自动发起检索。

    （3）双塔蒸馏：检索器与阅读器协同

    - 分别蒸馏：先让学生检索器（编码器）与大检索器对齐（例如通过对比损失匹配文档排序），再蒸馏阅读器生成能力。两者可联合微调。

    - 采用知识蒸馏中的特征匹配，使学生的查询和文档向量接近教师检索器的向量空间，提升检索质量。

    （4）端到端检索增强蒸馏

    - 教师模型在回答问题时提供带有检索结果的最终回答（如“根据搜索结果...答案是...”）。学生直接模仿这些回答，即便没有真实检索也能学到引用检索内容的风格。然而要真正获得检索能力，仍需结合实际检索器训练。

    - 可以使用强化蒸馏：学生生成查询后真正调用检索器，获取文档，继续生成回答。训练时将整个流程的端到端正确性作为奖励（例如答案F1），通过 REINFORCE 优化检索查询生成部分，回答部分用交叉熵蒸馏。这需要学生能够接收检索结果作为上下文。

    （5）知识蒸馏与检索的联合训练

    - 同时进行两个损失：检索增强生成的损失和教师 logits 的蒸馏损失，确保学生的生成既结合检索事实，又保持流畅度和与教师分布的一致性。

    总结：通过构造交互轨迹、模仿检索时机与查询生成、配合实际检索器联合训练，可以蒸馏出具备检索增强能力的小模型，从而突破参数记忆的限制，实现在知识密集型任务上的强性能。


content:
  prompt: 能否将 RLHF 对齐后的模型进行蒸馏？如何保留对齐特性？
answer:
  mode: rubric
  reference_answer: |-
    可以，但这极具挑战性。 直接将RLHF对齐后的模型进行标准SFT蒸馏，往往会导致对齐属性（如安全性、诚实性）的灾难性遗忘。

    保留对齐特性的关键策略：

    - 使用对齐后的教师生成数据：在构造蒸馏数据集时，不仅包含一般任务，更要重点使用教师模型在安全、诚实等对齐维度上输出的高质量回复。这些回复本身就是对齐行为的“黄金标准”。例如，大量使用教师模型拒绝回答的案例、表达不确定性的案例等。

    - 数据中保留充分的“负样本”或偏好信号：

    - 两阶段训练法（SFT + DPO）：

    - 在蒸馏过程中保持对齐损失：如果可以进行白盒蒸馏，可以在SFT的同时，加入一个辅助的对齐损失。例如，使用一个奖励模型对学生输出进行打分，并将该得分作为奖励信号加入到PPO等强化学习蒸馏框架中。

    核心思想：RLHF对齐的知识是脆弱的，难以通过简单的SFT完全传递。将“能力蒸馏”和“对齐蒸馏”分开处理，并在蒸馏后进行额外的、独立的安全对齐微调，是目前最可靠的方案。


content:
  prompt: 蒸馏过程中，教师模型产生的幻觉会不会传递给学生模型？如何抑制？
answer:
  mode: rubric
  reference_answer: |-
    会，而且非常容易传递。 因为蒸馏的核心就是让学生模仿教师，教师自信地胡说八道（幻觉）会成为学生的“黄金标准”。

    抑制策略：

    - 数据过滤与净化（最直接）：

    - 训练层面的正则化：

    - 教师模型校准：在蒸馏前，对教师模型进行校准（如温度缩放），使其输出的概率更能反映其真实置信度。一个校准良好的模型，其幻觉输出往往伴随着较高的熵，这会降低其对学生的误导程度。

    - 引入外部知识库：在蒸馏过程中，给予学生模型访问外部知识库（如Wikipedia）的能力，并训练学生利用外部知识来验证教师的输出，从而实现“有选择地模仿”。


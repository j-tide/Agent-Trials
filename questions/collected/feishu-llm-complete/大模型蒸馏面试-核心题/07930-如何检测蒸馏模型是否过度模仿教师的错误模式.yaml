content:
  prompt: 如何检测蒸馏模型是否过度模仿教师的错误模式？
answer:
  mode: rubric
  reference_answer: |-
    检测学生是否“邯郸学步”，连教师的错误都一并模仿，是评估蒸馏失败的关键。这需要通过对比分析来实现。

    检测方法：

    - 构建师生混淆矩阵：在同一个测试集上，分别绘制教师和学生的混淆矩阵（Confusion Matrix）。

    - 计算错误重叠率：重点关注那些教师预测错误的样本。统计在这些样本中，学生也预测错误的比例。如果这个比例异常高，说明学生在盲目跟随教师。

    - 分析错误类别分布：更深入一步，观察师生模型错误模式的分布是否一致。例如，教师模型是否经常将A类错分为B类？学生模型是否也有一模一样的倾向？可以使用聚类分析或降维可视化（t-SNE/UMAP）来观察师生犯错的特征分布是否高度重合。

    根本原因：这通常是蒸馏温度过低、或蒸馏损失权重过大导致学生过拟合教师输出中的噪声。解决方案是提高蒸馏温度、加入更多真实硬标签作为“锚点”或进行对抗蒸馏。


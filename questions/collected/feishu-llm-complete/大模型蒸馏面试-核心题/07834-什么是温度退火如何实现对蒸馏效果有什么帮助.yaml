content:
  prompt: 什么是“温度退火”？如何实现？对蒸馏效果有什么帮助？
answer:
  mode: rubric
  reference_answer: |-
    温度退火 是指在蒸馏训练过程中，温度 T 不再固定，而是按照预设策略从高到低动态衰减的技术。

    实现方式：

    - 阶梯衰减：每隔固定的Epoch或Step，将温度乘以一个衰减因子 r（如 r=0.8）。这种方法简单粗暴，但可能在衰减点造成训练波动。

    [图片内容未导入]

    效果与原理：

    - 提升最终泛化能力：通过“先博后精”的学习模式，学生既能学到教师知识的宏观结构，又能精准把握其微观细节，避免了单一温度下的“欠拟合”（温度过高）或“过拟合”（温度过低）。

    - 加速收敛：初期的高温平滑了损失曲面，使得优化器能更快地找到全局最优的大致区域，减少了在初始阶段因梯度杂乱而浪费的时间。


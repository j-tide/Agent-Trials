content:
  prompt: 蒸馏过程中，学生模型使用混合精度训练，与教师模型精度不同怎么办？
answer:
  mode: rubric
  reference_answer: |-
    这在实际中非常常见，例如教师是FP32，学生是FP16训练。处理起来非常简单，通常不会成为问题。

    原因与处理方法：

    - 计算过程是分离的：在PyTorch等框架中，混合精度训练（如使用torch.cuda.amp）会自动管理前向传播中的数据精度。教师和学生是两个独立的模型实例，它们的前向传播是在各自的精度设置下进行的，互不干扰。

    - 精度自动转换：

    - 保持关键路径的高精度：教师模型应始终以它所能达到的最高精度（FP32/BF16）进行推理，以获得最可靠的软标签。学生模型内部的训练精度则根据你的显存和速度要求来决定。

    结论：师生模型训练精度的不同，不会成为蒸馏的障碍。深度学习框架已经很好地处理了这个问题。


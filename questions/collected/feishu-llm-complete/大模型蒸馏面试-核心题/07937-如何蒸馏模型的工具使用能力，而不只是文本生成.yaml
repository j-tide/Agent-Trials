content:
  prompt: 如何蒸馏模型的“工具使用”能力，而不只是文本生成？
answer:
  mode: rubric
  reference_answer: |-
    工具使用能力包括：识别工具调用时机、生成正确的工具指令（如API调用、代码执行）、解释工具返回结果并继续推理。蒸馏需要传递这种“规划-行动-观察”循环。

    方法：

    （1）行为克隆蒸馏

    - 收集大模型在工具增强环境中解决问题的完整轨迹：用户问题 -> 模型思考 -> 工具调用 -> 工具结果 -> 模型再思考 -> 最终答案。把这些轨迹作为序列数据对小模型进行监督微调（SFT）。学生通过模仿学会何时生成特殊 token 来触发工具，如何填写参数。

    - 这种方式可将工具使用模式“文本化”，直接蒸馏。

    （2）分层蒸馏：规划与执行解耦

    - 教师模型在内部有隐含的规划器和执行器。我们可以用教师生成高层次的行动计划（自然语言），然后小模型只负责将计划翻译为具体工具调用。先蒸馏规划能力，再蒸馏执行能力。

    - 或者让小模型模仿教师产生的“内部独白”，在生成工具调用前先写出原因，这有助于泛化。

    （3）利用工具执行反馈进行强化蒸馏

    - 学生模型在训练过程中实际调用工具（如计算器、搜索引擎、代码解释器），获取环境反馈。将调用成功率、结果正确性作为奖励，用 PPO 等优化学生模型。

    - 同时加入与教师策略的 KL 散度约束，防止学生产生无效调用。这种“在线蒸馏”将教师的先验知识与真实工具反馈结合。

    （4）多任务蒸馏与工具签名嵌入

    - 教学生模型工具的模式：输入格式、输出格式、使用示例。可将工具文档嵌入与问题一起输入，学生学会根据文档调用工具。

    - 蒸馏时，让模型不仅生成调用，还要预测工具返回结果的范式，相当于学习工具的世界模型。

    （5）教师辅助的自我对弈

    - 学生调用工具后，若出现错误，教师模型可以帮助纠正或提供改进建议，生成纠正轨迹，再反馈到蒸馏数据中。这样形成迭代改进。

    通过上述方式，小模型可以从教师的工具使用行为中学习到“何时、如何使用”的隐性知识，再结合真实环境反馈进行强化，从而具备可靠的工具使用能力。


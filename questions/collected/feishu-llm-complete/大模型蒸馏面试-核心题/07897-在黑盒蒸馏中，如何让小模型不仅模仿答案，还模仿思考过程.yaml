content:
  prompt: 在黑盒蒸馏中，如何让小模型不仅模仿答案，还模仿思考过程？
answer:
  mode: rubric
  reference_answer: |-
    黑盒蒸馏意味着我们只能通过API访问教师模型，无法获取其内部logits或中间层特征。在这种情况下，要模仿思考过程，必须依赖显式推理链的生成与学习。

    - 思维链提示：
    在对黑盒教师模型的API调用中，通过精心设计的Prompt（如“让我们一步一步思考”），引导教师模型在输出最终答案前，先生成详细的推理步骤（思维链）。然后，将（问题， 思维链+答案）作为训练数据，用标准的语言模型训练损失来微调学生模型。这样，学生就直接学到了教师的思考路径。

    - 上下文蒸馏：
    当教师模型在上下文学习中展现出推理能力时（例如，在Prompt中提供了几个推理示例），将整个“示例+问题+推理+答案”的完整对话历史作为训练数据。学生模型通过模仿这个完整过程，学会如何在上下文中激发推理能力。

    - 多轮对话模拟：
    设计一个多轮的API调用流程。第一轮，向教师提问；第二轮，对教师的回答提出质疑或要求其详细解释（“你为什么这么认为？请给出详细步骤”）。教师模型在后续轮次中会给出更细致的推理。将完整的对话过程收集起来，作为蒸馏数据。

    - 使用辅助解码器：
    如果教师模型提供logprobs（对数概率）信息，可以利用这些信息来训练一个辅助的“推理解码器”，该解码器专门生成通往最终答案的中间步骤。即使没有内部状态，概率序列本身也包含推理路径的信息。

    黑盒蒸馏的核心在于，通过Prompt Engineering将教师模型的内隐推理过程外化为可见的文本，然后将这些文本作为知识载体，通过SFT传递给学生。这是目前所有基于API蒸馏（如从GPT-4蒸馏到开源模型）的基础范式。我们继续深入大模型蒸馏到小模型的特殊挑战，涵盖了知识压缩、推理迁移、能力对齐以及幻觉抑制等核心议题。以下是对这些问题的完整而深入的回答。


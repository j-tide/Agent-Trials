content:
  prompt: 为什么有些工作发现特征蒸馏对LLM能力迁移帮助有限？
answer:
  mode: rubric
  reference_answer: |-
    这一发现在近期的LLM蒸馏研究中尤为突出，根本原因在于LLM能力的涌现性与特征蒸馏的局部性之间的矛盾。

    - 高级能力难以局部化：LLM的复杂推理、指令遵循等高级能力被认为是规模效应的涌现，它们并非集中存储在某个特定层或某个特征维度中，而是分散在模型庞大的参数交互中。局部地匹配某几层特征，就像试图通过临摹一棵树的几片叶子来复制整片森林的生态系统，是无法捕获这些高级智能的。

    - 特征蒸馏的“模式坍缩”效应：强加的特征约束（如MSE）可能会限制学生模型内部的表示空间，使其过早地收敛到一种“模仿教师”的狭窄模式，反而抑制了其自身进行组合泛化的潜力。这在需要创造性和多样性的生成任务上尤为致命。

    - 灾难性遗忘与能力退化：在特征蒸馏过程中，学生为了强行对齐教师的中间特征，会大幅调整其参数，从而迅速遗忘其在预训练阶段学到的通用语言能力。而Logits蒸馏由于只约束最终的输出，给学生内部表征留下了一定的自由度，反而能更好地保留通用能力。

    - 蒸馏信号与最终目标的不一致性：特征蒸馏的MSE损失是一个“代理目标”，它并不直接等价于提升模型在下一词预测上的准确率。学生模型可能在“模仿中间特征”这个任务上表现优异，但在“生成高质量文本”这个最终任务上表现平平。

    因此，对于LLM，目前最有效的方法仍是利用教师模型生成高质量文本数据进行黑盒SFT，或在白盒蒸馏中主要使用Logits蒸馏，并结合数据回放等策略来缓解遗忘。


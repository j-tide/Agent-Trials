content:
  prompt: 在蒸馏训练中，学生模型是否需要使用教师模型的温度进行推理？为什么？
answer:
  mode: rubric
  reference_answer: |-
    不需要，学生模型在推理时一律使用 T=1。 具体原因同第19问。这里再补充说明：

    在蒸馏训练的前向传播中，学生模型需要计算两个输出：

    - 一个是与教师进行蒸馏损失计算的输出，使用与教师相同的蒸馏温度 T，以便在同一尺度下衡量分布差异。

    - 另一个是与硬标签进行学生损失计算的输出，使用 T=1。

    训练完成后，在推理阶段，学生模型已具备了泛化能力，此时它应独立工作，无需再借助教师信息，因此直接使用标准softmax（T=1）输出。如果推理时仍用 T，则相当于人为降低了模型的置信度，导致概率分布与真实任务需求不符。因此，温度 TT 仅是一个训练技巧，用于知识迁移，不应用于部署推理。


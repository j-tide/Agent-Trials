content:
  prompt: 如何进行多语言的蒸馏数据生成？语言配比怎么设计？
answer:
  mode: rubric
  reference_answer: |-
    进行多语言蒸馏，目标是让学生模型获得跨语言的指令遵循能力。这需要系统性地构造多语言数据集。

    一、多语言蒸馏数据生成方法

    - 母语者原生构建（最可靠）：针对每种目标语言，直接由该语言的母语者从零开始编写指令和回答。能确保语言地道、文化贴切。对于高资源语言应尽量采用此方法。

    - 高质量翻译+母语校验：将已有的高质量英文蒸馏数据翻译成其他语言，再交由母语者进行校对和润色。适用于低资源语言。

    - 平行数据构造：为同一任务构造多语言平行版本。这能让模型在训练时自然建立起跨语言的任务语义映射。

    - 语码混合：加入一定比例的中英混杂、网络用语、方言对话等，模拟真实世界的多语言交互。

    二、语言配比设计

    比例的确定需要权衡基座模型的预训练语言分布、目标市场和资源投入。

    - 用户导向策略：直接按目标用户的语言使用比例分配。

    - 英语锚定策略：在通用助手场景下，英语数据通常占据最大比例（如40-50%），作为跨语言迁移的“知识中枢”；其他语言各占5%-15%。

    - 能力均衡策略：为每种低资源语言设定一个最低样本量，确保其在基本任务上的可用性，主要依赖跨语言迁移。

    - 分阶段训练：第一阶段以高资源语言为主；第二阶段逐步增加低资源语言比例；第三阶段混合所有语言进行全域微调。


content:
  prompt: 特征蒸馏通常用什么损失函数？MSE还是KL？
answer:
  mode: rubric
  reference_answer: |-
    特征蒸馏的目标是让学生模型在某一层的特征图 FsFs 去拟合教师模型对应层的特征图 FtFt。由于特征图通常是连续值向量，而非概率分布，因此最常用的损失函数是均方误差（MSE）或其变体（如L2 Loss、Smooth L1 Loss）。

    - 为什么不常用KL散度？
    KL散度用于衡量两个概率分布之间的差异。特征图是未归一化的连续值激活，不符合概率分布的定义。若强行应用Softmax将其转化为概率，会破坏其原有的数值尺度和信息结构，导致信息丢失。

    - MSE的作用：L_feat = ||F^t - f(F^s)||^2。它直接最小化学生和教师特征向量之间的欧氏距离，迫使学生的内部表征在数值上尽可能接近教师。

    - 特征维度不匹配的解决：通常教师模型的隐藏维度更大，无法直接计算MSE。因此，需要在学生特征图之后添加一个可学习的投影层（通常是一个简单的线性层或1x1卷积），将学生的特征维度映射到与教师相同的维度，然后再计算MSE损失。


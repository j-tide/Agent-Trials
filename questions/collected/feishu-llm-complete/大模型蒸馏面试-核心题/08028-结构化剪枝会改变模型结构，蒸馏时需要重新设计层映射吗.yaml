content:
  prompt: 结构化剪枝会改变模型结构，蒸馏时需要重新设计层映射吗？
answer:
  mode: rubric
  reference_answer: |-
    是的，必须重新设计，尤其是进行白盒特征蒸馏时。 结构化剪枝（如通道剪枝）会移除整个通道，导致输出特征图的通道数（宽度）发生改变。

    - Logits蒸馏：不受影响。因为剪枝后的模型输出维度（类别数）通常不变，Logits维度是一致的，可以直接进行蒸馏。

    - 特征蒸馏：受到直接影响。剪枝后，被剪枝层的输出通道数变少了，与教师模型对应层的输出通道数不再匹配。因此，必须重新设计层映射关系。

    - 注意力蒸馏：影响较小。只要学生和教师的注意力头数关系不变，注意力矩阵的维度（Seq_Len x Seq_Len）不受通道剪枝影响，可以直接匹配。


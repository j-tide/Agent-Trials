content:
  prompt: 什么是自蒸馏（Self-Distillation）？它和学生模型就是教师本身的蒸馏一样吗？
answer:
  mode: rubric
  reference_answer: |-
    自蒸馏（Self-Distillation） 是一种特殊的蒸馏范式，其核心是：教师模型和学生模型使用相同的网络结构，甚至可以是同一个模型本身。它利用模型自身的知识来提炼自己，通常有几种形式：

    - 深层指导浅层：网络的最顶层（或最深层的特征）作为教师，指导浅层（或更早层的输出）进行预测。例如，在图像分类中，让网络的中间层也去拟合最终的分类结果。

    - 循环自蒸馏：使用上一轮训练好的模型作为下一轮同一结构模型的教师，迭代进行，模型性能逐渐提升。

    - 使用EMA作为教师：在训练过程中，维护一个模型参数的指数移动平均（EMA），并将其作为教师，指导原始模型（学生）训练。这在许多自监督学习和半监督学习框架中广泛使用。

    它和“学生模型就是教师本身的蒸馏”一样吗？

    不完全一样。经典的Hinton蒸馏是“大模型教小模型”，强调的是架构和容量上的差异。而自蒸馏强调的是“同一个体或同一种群的自我提炼”，它不追求模型压缩，而是追求在不改变模型结构的前提下，提升模型自身的泛化能力和稳健性。它是一种正则化技术，通过挖掘模型自身内部的知识或历史知识来“提纯”自己。

content:
  prompt: 对于 LLM，通常是从预训练小模型开始蒸馏微调，为什么？
answer:
  mode: rubric
  reference_answer: |-
    这几乎是工业界的事实标准，原因深刻且务实：

    - 经济学上的绝对优势（成本-收益比）：从头训练一个拥有良好语言能力的LLM，需要数万亿Token的数据和数千张GPU运行数月，成本高达数百万美元。而从一个强大的开源预训练小模型（如LLaMA-7B）开始，其已经具备了扎实的语法、常识和推理基础。我们只需要用极少量的高质量数据（几千到几万条）进行蒸馏微调，就能将其适配到特定任务，成本不到前者的万分之一。这是一种极致的杠杆效应。

    - 能力的“保底”与“拔高”：预训练模型就像一个已经建好地基和框架的毛坯房。蒸馏微调（SFT）则是进行室内装修和软装。它确保了模型的语言能力、世界知识和推理能力这些“硬装”已经就位且牢固，我们只需专注于“软装”——调整风格、注入特定知识、对齐偏好。而从头训练，则是在旷野上从头盖房子，风险极大。

    - 防止灾难性遗忘：预训练模型已经存储了丰富的知识。蒸馏微调的过程，通过使用极小的学习率、PEFT（如LoRA）和早停策略，可以最大限度地保护这些已有知识，避免在学习新任务时忘记旧知识。而从头训练的模型，则没有这个顾虑，但也因此缺乏了知识的“广度”。

    结论：从预训练小模型开始进行蒸馏微调，是当前技术条件下，兼顾模型能力、训练成本和项目风险的帕累托最优解。


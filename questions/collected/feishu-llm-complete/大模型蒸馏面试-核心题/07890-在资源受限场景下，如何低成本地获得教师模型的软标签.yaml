content:
  prompt: 在资源受限场景下，如何低成本地获得教师模型的软标签？
answer:
  mode: rubric
  reference_answer: |-
    当训练完整的教师模型成本过高时，可以采用以下策略获取软标签：

    - 使用现成的开源预训练大模型

    最直接的方法。直接从HuggingFace Model Hub或TorchVision等仓库下载已经训练好、性能优秀的公开模型作为教师，无需自己训练。这是零成本获取高质量教师的捷径。

    - 教师模型的推理优化

    如果教师模型很大，可以在生成软标签时使用量化（INT8/FP16）、甚至剪枝后的教师版本，以加速推理并减少显存占用。只要教师输出的软标签质量尚可，轻微的性能损失是可接受的，学生模型依然能学到足够的知识。

    - 预计算并存储软标签

    将训练数据一次性通过教师模型，预先计算并保存每个样本的软标签到磁盘（如HDF5、LMDB格式）。蒸馏训练时直接读取，避免每个epoch都重新运行庞大的教师模型，能节省大量计算资源。这种方法尤其适用于训练数据量不大、但学生需要多轮训练的场景。

    - 集成弱标注

    如果没有单一的强教师，可以组合多个较弱但廉价的模型（甚至传统机器学习模型）的输出，通过平均、投票或学习一个元模型来生成一个集成的软标签。集成的效果往往能超越单个弱教师。

    - 利用在线API

    对于NLP任务，可以调用云端大模型API（如GPT-4、Claude）为你的特定数据生成软标签。这是按量付费，前期成本极低，适合数据量不大的任务，或用于快速原型验证。但需注意数据隐私和API服务条款。

    - 知识库检索增强

    结合检索增强生成（RAG）的思想，从外部知识库检索相关信息，辅助一个小模型生成软标签，形成“小模型+知识库”的廉价教师。这种教师可能不如大模型精准，但在特定领域内足够用。

    关键：生成的软标签质量会直接影响学生模型的上限，因此需要在成本和标签质量之间找到平衡。

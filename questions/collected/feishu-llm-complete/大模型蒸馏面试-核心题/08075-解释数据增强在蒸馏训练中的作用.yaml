content:
  prompt: 解释“数据增强”在蒸馏训练中的作用。
answer:
  mode: rubric
  reference_answer: |-
    数据增强在蒸馏训练中扮演着双重角色，作用比普通训练更为重要：

    - 常规正则化：与普通训练一样，通过对输入数据进行随机变换（如翻转、裁剪、颜色抖动、文本改写），迫使模型学习到不变性，防止过拟合。

    - 扩充教师知识的覆盖范围：这是蒸馏特有的优势。教师模型可以为任何一个增强后的样本生成对应的软标签。这意味着我们可以在几乎无限的增强数据上训练学生模型，而无需任何额外的硬标签。这极大地丰富了蒸馏训练的数据量，让学生模型能够更全面、更精细地模仿教师的决策边界。

    因此，在蒸馏训练中，通常会对同一批数据同时应用强增强和弱增强，教师和学生看到的可能是不同增强版本的同一张图，但其软标签是统一的，这本身就是一种强大的对比学习信号。

content:
  prompt: 蒸馏训练中，学生模型的容量通常比教师小，这会导致哪些问题？如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    学生容量不足时，蒸馏面临 容量差距 问题：

    问题：

    - 欠拟合：学生可能无法完美拟合教师提供的复杂函数，导致蒸馏损失降不下去。

    - 信息丢失：容量限制意味着学生必须压缩教师的知识，如果压缩方式不当，会丢失重要的细节或对少数类别的区分能力。

    - 过拟合/欠拟合的矛盾：如果硬拉学生去模仿教师的全部行为，可能导致学生在训练集上表现良好但泛化能力差；反之，如果约束过松，又无法充分吸收教师知识。

    缓解方法：

    - 提高温度 T：适当升高温度可以软化目标，减小学习难度，允许学生用有限的参数去捕捉主要的类别结构。

    - 阶段性训练：先用硬标签训练学生到一个较好的基线，再加入蒸馏损失。

    - 利用中间层蒸馏：通过拟合教师中间层的特征表示或注意力图，传递更细粒度的知识，减轻最后输出层的压力。

    - 增强学生架构：虽然学生总体小，但可以在关键层（如投影层）增加一些参数，然后通过蒸馏后再剪枝，或使用更高效的轻量架构。

    - 互学习（Mutual Learning）：让多个学生模型相互学习，共同进步。

    - 课程蒸馏：先从容易的样本开始，逐渐增加难度。


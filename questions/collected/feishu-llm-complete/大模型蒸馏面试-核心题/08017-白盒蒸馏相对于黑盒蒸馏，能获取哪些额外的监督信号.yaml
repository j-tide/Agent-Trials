content:
  prompt: 白盒蒸馏相对于黑盒蒸馏，能获取哪些额外的监督信号？
answer:
  mode: rubric
  reference_answer: |-
    白盒蒸馏能够获取教师模型内部的过程性知识，这远不止最终的输出结果。这些丰富的中间表示构成了额外的监督信号：

    - 中间层特征图：每个Transformer层或卷积层输出的隐藏状态。它揭示了模型在处理信息时，在不同抽象层次上学到的特征。例如，底层可能学习到边缘和纹理，而高层可能学习到物体的部件和整体概念。这是特征蒸馏的基础。

    - 注意力权重：自注意力机制生成的权重矩阵，直接反映了模型在生成每个词时，对输入序列中其他词的关注程度。这是模型“阅读理解”策略的直接体现，也是注意力蒸馏的知识来源。

    - 隐藏状态：通常指模型最后一层输出的、经过高度抽象的向量表示，被认为是上下文信息的综合体现。

    - 神经元激活模式：虽然较少直接使用，但神经元的选择性激活模式也是模型知识的一种体现。

    - 关系知识：不同样本或不同层之间的结构化关系，比如特征向量之间的欧氏距离或角度，这种知识可以独立于特征本身传递。

    这些信号让白盒蒸馏能够传递“模型是如何思考的”，而不仅仅是“模型思考的结果”。


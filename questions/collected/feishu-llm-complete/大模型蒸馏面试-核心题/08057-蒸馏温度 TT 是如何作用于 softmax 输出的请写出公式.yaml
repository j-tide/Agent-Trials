content:
  prompt: 蒸馏温度 TT 是如何作用于 softmax 输出的？请写出公式。
answer:
  mode: rubric
  reference_answer: |-
    标准softmax函数将logits zi 转换为概率分布：

    [图片内容未导入]

    温度 T 是一个大于0的超参数，通常 T≥1。当 T=1 时，退化为标准softmax。T 的作用是对logits进行缩放：温度越高，logits之间的差距越小，输出的概率分布就越平滑；温度越低，分布越尖锐，越接近one-hot。

    在蒸馏过程中，教师和学生模型在计算软目标时都使用相同的温度 T，以在同一尺度下比较分布。学生模型最终用于推理时，温度恢复为1。


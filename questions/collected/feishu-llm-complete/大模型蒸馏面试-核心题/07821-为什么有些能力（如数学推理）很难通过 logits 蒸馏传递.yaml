content:
  prompt: 为什么有些能力（如数学推理）很难通过 logits 蒸馏传递？
answer:
  mode: rubric
  reference_answer: |-
    数学推理能力难以通过logits蒸馏传递，是因为推理过程是结构化的、多步的因果链，而logits仅仅是最终结果的统计分布。

    一、信息维度不匹配
    Logits只记录了最终答案的统计偏好，它完全抛弃了推理过程中所有重要的中间状态。一个数学问题的解题过程，是一系列逻辑演绎的集合：设变量 → 列方程 → 化简 → 求解 → 验证。Logits只看到了“求解”这个最终步骤的结果。学生可以轻松记住常见数学题的答案模式，但无法学会这个逻辑演绎的过程。就像一个学生只抄了标准答案，却没有学会解题步骤，考试时题目一变就无法应对。

    二、因果学习 vs. 统计学习
    推理要求模型学习一个因果机制 A → B → C → 答案。而logits蒸馏让学生学习的是一个统计相关性 问题 → 答案。这是一个本质上的错误学习范式。在数学这种需要严格逻辑的任务上，这种统计近似是完全不够的。模型必须理解“为什么B能推出C”，而不仅仅是“在类似问题下，C是高频答案”。

    三、组合泛化能力的缺失

    数学推理的真正威力在于组合泛化：将两个已知的推理模式组合起来，解决一个全新的问题。Logits蒸馏无法传递这种抽象的、可迁移的推理算子。学生模型学到的是特定题型的整体映射函数，而不是构成这些函数的底层子技能。

    四、错误传播与放大

    如果教师在一个微小的推理步骤上出错（比如符号错误），其最终的logits可能是错误的。学生模仿这个错误logits，学到的就是一个被扭曲的统计信号。它无法知道教师是在哪一步出错的，也就无法纠正。

    因此，对于数学推理，必须使用思维链蒸馏（CoT Distillation）或过程监督（Process Reward Model）。这些方法将解题步骤显式地作为知识进行传递，让学生在拟合这些步骤的过程中，逐渐学会内在的推理逻辑。


content:
  prompt: 什么是“模型减枝”和“密度蒸馏”结合的方法？
answer:
  mode: rubric
  reference_answer: |-
    模型减枝（Pruning） 是通过移除神经网络中冗余的权重或结构来减少参数和计算量。密度蒸馏（Dense Distillation 或知识蒸馏） 通常指使用完整大模型作为教师，指导剪枝后稀疏模型恢复精度。两者结合形成“剪枝+蒸馏”范式。

    结合方法的具体形态：

    （1）迭代式剪枝与蒸馏

    - 先剪枝：对预训练模型进行结构化或非结构化剪枝，移除一定比例的权重/通道。

    - 后蒸馏：将原稠密模型（教师）与剪枝后的稀疏模型（学生）进行蒸馏训练，利用软标签弥补剪枝带来的精度损失。

    - 可以多轮迭代：剪枝 → 蒸馏恢复 → 再剪枝 → 再蒸馏，逐步提升稀疏度。

    （2）剪枝过程中的知识迁移

    - 在剪枝的同时就进行蒸馏，不是先剪后训，而是将剪枝选择与蒸馏损失联合优化。例如，在剪枝掩码搜索过程中，考虑移除参数后对学生输出分布的影响，选择对教师知识蒸馏损失影响最小的权重进行移除。

    - 这种方法称为面向蒸馏的剪枝（Distillation-Aware Pruning），确保剪枝后模型仍容易学习教师。

    （3）密度蒸馏作为剪枝恢复的常态

    - 剪枝后的微调本质是在真实标签上重训，但引入教师可以让微调更稳定。实际上，许多高效的剪枝方法都采用“剪枝+知识蒸馏微调”来恢复精度。

    - 例如，彩票假设方法（Lottery Ticket）找到的子网络本身已具备较好初始化，但如果配合原完整网络作为教师的蒸馏，收敛更快且最终精度更高。

    （4）结构化剪枝与特征蒸馏

    - 结构化剪枝移除整个滤波器或注意力头，改变特征维度。此时不仅可以用 logits 蒸馏，还可对剪枝前后的中间层特征进行对齐，防止维度不匹配导致的信息丢失。这被称为“Feature-map Distillation for Pruned Networks”。

    （5）从稀疏到稠密的逆蒸馏（Dense from Sparse）

    - 另一种思路：先训练一个大模型，剪枝得到一个轻量稀疏模型，然后利用这个稀疏模型作为教师，重新蒸馏一个稠密但更小尺寸的结构。这利用了稀疏模型高度信息压缩的特性。

    为什么结合效果显著？

    剪枝导致模型信息容量急剧下降，单纯用硬标签微调容易过拟合或丢失教师中微妙的类间结构。蒸馏提供平滑的软目标，对噪声更鲁棒，能更好地引导稀疏模型在有限容量内保留重要知识。因此，这种结合可达到更高的压缩率而不损失准确度，在视觉、语言模型压缩中广泛应用。


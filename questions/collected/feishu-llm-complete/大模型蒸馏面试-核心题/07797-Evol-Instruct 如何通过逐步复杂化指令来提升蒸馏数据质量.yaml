content:
  prompt: Evol-Instruct 如何通过逐步复杂化指令来提升蒸馏数据质量？
answer:
  mode: rubric
  reference_answer: |-
    Evol-Instruct 是由微软 WizardLM 项目提出的一种指令数据自动进化方法。与 Self-Instruct 从头生成新指令不同，它着眼于从已有的简单指令出发，通过一系列预定义的“进化操作”，将其逐步改造为更复杂、更具深度和广度的高级指令。

    核心思想：模仿生物进化，让指令在“深度”（复杂度）和“广度”（多样性）上不断演化，从而系统性地提升数据集的难度和质量。

    具体操作分为两类进化：

    - 深度进化（In-Depth Evolving）：在不改变指令基本任务类型的前提下，通过增加约束、深化要求、嵌入多步推理等方式，让一个简单指令变得更具挑战性。典型的操作包括：

    - 广度进化（In-Breadth Evolving）：在不增加指令复杂度的前提下，通过改写、主题迁移和任务类型变异，产生与原指令“不同”的新指令。典型的操作包括：

    流程：在每一轮迭代中，随机选择一种进化类型和具体操作，通过特定Prompt引导强模型对种子指令进行“变异”。变异后的指令会经过质量过滤（确保其合理、可执行），成功者加入指令池。通过深度和广度进化的交替进行，Evol-Instruct 能产生一个既广博又深邃的高质量指令集，极大提升蒸馏数据的训练价值。


content:
  prompt: 如何利用教师模型的FFN层输出进行知识迁移？
answer:
  mode: rubric
  reference_answer: |-
    Transformer中的FFN（前馈网络）层常被视为存储着大量事实性和词汇知识的关键组件。利用其输出进行知识迁移，可以更直接地将这些知识注入学生模型。

    操作方法：

    - 提取FFN输出：在教师和学生的每一个Transformer层中，FFN模块是两个线性层（W1, W2）加一个激活函数的组合。我们将FFN子层处理后的输出（即 FFN(x) = W2(Act(W1(x)))）定义为蒸馏目标。

    - 维度对齐与损失计算：同特征蒸馏一样，如果学生FFN的中间维度与教师不同，需要先通过一个线性投影层进行维度映射。然后，计算映射后的学生FFN输出与教师FFN输出之间的MSE损失。

    - 独立蒸馏或联合蒸馏：既可以独立地对FFN输出进行蒸馏，也可以将其与隐藏状态、注意力图等一同作为联合损失的一部分。

    - 权重共享策略：一种更激进的做法是，直接让学生模型的FFN权重 W1,W2W1,W2 去学习教师对应层的FFN权重。这可以通过参数初始化或知识合并（如BERT-of-Theseus）的方式实现。

    价值：由于FFN是模型知识存储的核心，对它的输出进行蒸馏，可以看作是将教师模型“记忆”的知识点，以特征图的形式“喂”给学生，是一种高效的知识注入方式。


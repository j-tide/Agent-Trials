content:
  prompt: Orca 2是如何通过分步推理提升小模型性能的？
answer:
  mode: rubric
  reference_answer: |-
    Orca 2是微软在Orca 1的基础上推出的更强大的蒸馏模型。Orca 1主要利用丰富的System Prompt引导教师输出详细解释，而Orca 2则更进一步，将教师的高级推理策略作为知识进行传递。

    核心方法：策略蒸馏。

    Orca 2不再仅仅让教师模型输出“思考过程”，而是让教师模型在回答问题时，显式地展现其选择何种推理策略来解决问题。例如，是“直接回答”、是“分步推理”、还是“先分解子问题再逐一解决”？

    具体实现：

    - 策略引导的Prompt：在向教师模型提问时，使用特定的Prompt，要求它不仅要给出答案，还要“在执行任务前，先分析任务类型，并说明你将采用何种最佳策略来解决它（例如：直接回答、逐步推理、检索信息等）”。

    - 生成策略数据：教师模型根据指令，生成包含“策略分析-策略执行-最终答案”的完整文本。

    - 训练小模型：将这些包含策略选择过程的文本作为训练数据，通过SFT微调小模型。

    提升原理：这教会了小模型一种“元认知”能力。小模型不仅学会了模仿答案，更重要的是学会了在面对不同问题时，如何像大模型一样自主选择最合适的“思考路径”。这使得小模型的泛化能力和解决复杂问题的能力得到了质的飞跃。

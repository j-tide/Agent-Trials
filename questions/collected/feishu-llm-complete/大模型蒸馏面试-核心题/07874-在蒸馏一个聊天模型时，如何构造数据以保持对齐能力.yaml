content:
  prompt: 在蒸馏一个聊天模型时，如何构造数据以保持对齐能力？
answer:
  mode: rubric
  reference_answer: |-
    保持聊天模型的对齐能力（如安全、无害、有用）是蒸馏成功的关键。仅仅蒸馏有用性任务的能力，极易导致安全对齐能力的灾难性遗忘。

    数据构造策略：

    - 保留高比例安全对齐数据：在蒸馏数据集中，必须显式地、有意识地保留大量与安全、无害、诚实相关的对话数据。这类数据通常占5%-20%的比例，包括：

    - 利用对齐后的教师生成数据：如果教师模型本身已经经过RLHF对齐，那么它生成的绝大多数回答（尤其是安全相关的）本身就是对齐的示范。这保证了蒸馏数据源头的安全性。

    - 构造对抗性数据：主动构造一些“越狱”攻击或边界测试的指令，让教师模型给出正确的安全回应，并将这些样本加入训练集。这能教会学生模型识别并防御恶意攻击。

    - 将安全准则写入System Prompt：在数据生成时，将明确的安全准则写入System Prompt（如“你是一个安全、无害的AI助手”），并要求教师遵守。在训练学生时，同样保留这些System Prompt，让学生学会根据准则来调整行为。

    总结：对齐能力的保持需要数据驱动，而不能指望它从普通任务数据中自动泛化。必须在蒸馏数据中为对齐能力留出充足的“训练席位”。


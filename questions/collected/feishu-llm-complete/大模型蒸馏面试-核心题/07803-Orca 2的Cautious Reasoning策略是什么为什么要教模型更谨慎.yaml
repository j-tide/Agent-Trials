content:
  prompt: Orca 2的“Cautious Reasoning”策略是什么？为什么要教模型更谨慎？
answer:
  mode: rubric
  reference_answer: |-
    “Cautious Reasoning”（谨慎推理）是Orca 2提出的一种重要策略，它旨在解决小模型在面对复杂或易错任务时，容易“过度自信地犯错”的问题。

    核心思想：教给小模型，在遇到自身能力可能不足以完美解决的任务时，不要强行给出一个可能错误的答案，而是应该更谨慎地处理。具体表现包括：

    - 分解复杂问题：将一个复杂任务分解成多个更小、更简单的子任务，然后按步骤解决。这降低了一次性解决复杂问题的难度。

    - 进行自我检查：在给出答案之前，模拟教师模型的验证过程，检查自己的推理步骤是否存在逻辑漏洞。

    - 表达不确定性：对于超出其知识范围或无法确定的问题，学会诚实地说“我不确定”，或者给出多个可能的答案并说明各自的依据。

    - 引用来源：在回答需要事实的问题时，学会说明信息的出处或推理的依据。

    为什么要教模型更谨慎？

    因为大模型的强大之处在于它知道何时可以自信，何时应该保守。小模型由于容量限制，往往只能学到“自信回答”的模式，而缺失了“自我怀疑”和“安全性”的判断。如果不在蒸馏数据中显式地、大量地教它如何谨慎，它很可能会成为一个“自信的傻瓜”——流畅地输出错误信息（幻觉）。教它“谨慎推理”，本质上是将大模型的安全性、诚实性和可靠性作为核心能力进行传递，这对构建可信赖的小模型至关重要。

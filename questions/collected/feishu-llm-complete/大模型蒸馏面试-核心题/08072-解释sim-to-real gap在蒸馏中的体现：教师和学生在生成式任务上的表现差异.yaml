content:
  prompt: 解释“sim-to-real gap”在蒸馏中的体现：教师和学生在生成式任务上的表现差异。
answer:
  mode: rubric
  reference_answer: |-
    “sim-to-real gap”在蒸馏中指的是，学生模型虽然在训练集（模拟环境）上可以很好地模仿教师，但在面对真实、开放、未见过的用户输入时，其表现与教师之间存在巨大差距。

    具体体现：

    - 分布外泛化的脆弱性：蒸馏训练集（尤其是教师生成的）的分布往往是有偏的、不够广泛的。当学生模型遇到分布外的、口语化的、包含错别字或格式混乱的真实用户请求时，它的表现会断崖式下跌，而教师模型则相对鲁棒。

    - 复杂推理能力的缺失：在蒸馏数据中，学生学会了模仿教师的推理过程。但在真实任务中，当推理路径与训练数据不完全一致时，学生可能无法像教师那样进行灵活的、深度的组合推理，其内部“推理引擎”实际上并未真正建立。

    - 长尾知识遗忘：学生模型由于容量限制，会倾向于遗忘教师所掌握的稀疏、长尾的世界知识。在真实对话中，当提及一个罕见的知识点时，教师能准确回应，而学生则可能产生幻觉。

    - 对齐属性的退化：在真实的对抗攻击下，学生模型比教师更容易被“越狱”。因为蒸馏数据无法覆盖真实攻击者不断创新的攻击方式，而学生又无法像大模型那样从先前的对齐训练中泛化出对新攻击的鲁棒性。

    - 风格与创造力的差距：即使蒸馏数据包含了多样化的风格，小模型在真实场景下生成富有创意的、文采斐然的文本能力，依然与教师存在明显差距，这是容量限制带来的“想象力天花板”。

    根本原因：这个gap源于蒸馏的本质——知识的有损压缩。学生学到的更多是教师行为的“统计表面”，而非其内在的、由庞大数据和参数构成的“世界模型”。缩小这个gap需要从数据多样性、多级蒸馏、在线对抗训练以及保留核心预训练能力等多个层面持续优化。


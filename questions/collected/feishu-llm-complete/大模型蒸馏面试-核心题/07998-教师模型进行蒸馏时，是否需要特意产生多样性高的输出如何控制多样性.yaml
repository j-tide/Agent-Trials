content:
  prompt: 教师模型进行蒸馏时，是否需要特意产生多样性高的输出？如何控制多样性？
answer:
  mode: rubric
  reference_answer: |-
    绝对需要。 教师输出的多样性直接决定了学生模型能力的广度。如果教师输出千篇一律，学生必然发生多样性崩塌。

    控制多样性的方法：

    - 解码策略：在教师模型生成蒸馏数据时，绝对不能使用贪婪解码（Greedy Decoding）。应使用温度采样（Temperature Sampling），设置较高的温度（如 T>0.8T>0.8）并配合 Top-P (nucleus sampling) 来引入随机性，让教师产生更丰富、更多样的回答。

    - 指令层面的多样性：蒸馏数据的指令集本身必须极具多样性，覆盖不同的任务、风格、约束和长度要求。

    - 人为注入噪声：在指令中，可以人为地添加或修改一些要求，如“请用幽默的风格回答”、“请给出一个非常简洁的版本”、“请至少从三个角度分析”，来引导教师产生风格迥异的输出。

    - 多模型教师集成：使用多个不同架构或训练阶段的教师模型来生成数据，可以天然地集成出更高多样性的输出分布。

    - 数据配比控制：在最终蒸馏数据集中，人工控制不同风格、长度、任务类型回答的比例，避免某一种风格占主导。

    核心：教师模型的“创造”过程应该是富有探索性的，而学生模型的“学习”过程是确定性的。前者探索得越广，后者的能力边界就越宽。


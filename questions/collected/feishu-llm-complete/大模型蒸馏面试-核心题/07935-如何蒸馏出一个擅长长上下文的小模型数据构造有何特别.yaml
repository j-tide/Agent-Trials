  prompt: 如何蒸馏出一个擅长长上下文的小模型？数据构造有何特别？
answer:
  mode: rubric
  reference_answer: |-
    蒸馏一个长上下文小模型，核心挑战在于将大模型在长文本中“准确定位、关联和理解信息”的能力，迁移给小模型。这需要专门的、模拟长文场景的蒸馏数据。

    数据构造的特别之处：

    - 构造“大海捞针”式数据：

    - 多文档综合与比较数据：

    - 长文档问答与摘要数据：

    - 长程多轮对话数据：

    训练技巧：

    - 位置编码优化：确保学生模型使用或经过微调以支持长上下文的位置编码（如RoPE的NTK缩放或YaRN）。

    - 序列打包（Packing）：将多个短对话数据拼接成一个长序列，并配合分块对角注意力掩码进行训练，可提高训练效率。

    - 使用长序列训练：在蒸馏训练的最后阶段，必须使用目标长度的长序列进行训练，让模型适应长上下文的计算模式。


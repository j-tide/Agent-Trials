content:
  prompt: 解释“蒸馏温度退火”策略，在训练过程中动态调整温度有何作用？
answer:
  mode: rubric
  reference_answer: |-
    蒸馏温度退火 是指在蒸馏训练过程中，温度 TT 不是固定的，而是按照某种策略动态变化，通常是从一个较高的值逐步降低至1或一个较低的值。

    作用与原理：

    - 初期高温度：训练开始时，学生模型还很弱，其输出分布可能与教师差异巨大。使用较高的 TT（例如T=10）可以极大地软化教师和学生的软标签，使分布更均匀，减小初期学习的难度，避免梯度过于剧烈。这相当于先让学生掌握一个“粗粒度”的知识结构，理解类别间的大致关系。

    - 后期低温度：随着训练的进行，学生已经初步模仿了教师的行为。此时逐渐降低温度（例如T=1或2），可以让教师提供更“尖锐”、更细节的知识，帮助学生进行“细粒度”的模仿，最终收敛到与教师相近的性能。

    - 好处：

    实现方式：

    - 阶梯式退火：每隔N个epoch，将温度乘以一个衰减因子（如0.8）。

    - 连续退火：根据训练步数或epoch，使用余弦退火等函数平滑地将T从初始值降至最终值。

    - 在一些实现中，学生损失部分的温度保持为1，仅蒸馏损失的温度退火。

    注意：退火策略需要根据任务和模型进行调试，过快或过慢的退火都可能影响最终效果。

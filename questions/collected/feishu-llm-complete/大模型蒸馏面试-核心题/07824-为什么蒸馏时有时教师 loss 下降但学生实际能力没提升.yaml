content:
  prompt: 为什么蒸馏时有时教师 loss 下降但学生实际能力没提升？
answer:
  mode: rubric
  reference_answer: |-
    这是一种典型的“虚假收敛”或“模式坍缩”现象，根源在于优化目标与实际目标的错位。

    - 学生学到了“偷懒”的平均解（分布坍缩）：KL散度等蒸馏损失鼓励学生去匹配教师的整个概率分布。一个容量不足的学生可能会发现，与其费力学习教师区分“狗”和“猫”的细微差异，不如简单地将概率质量平均分配到所有常见类别上，这样也能得到一个较低的KL散度。这导致学生生成的文本变得模板化、缺乏信息量，虽然在模仿教师输出的“主要轮廓”，但丢失了关键的“细节”。

    - 错误模仿了教师的“模式”而非“能力”：学生模型可能只是学会了教师模型输出中的一些表面统计特征，如“总是喜欢用某些连接词”、“回答结构雷同”等，而没有真正学会其背后的推理过程。这种模仿在训练集上能降低蒸馏损失，但在需要真实能力的验证集上则暴露无遗。

    - 灾难性遗忘的掩盖：学生为了降低蒸馏损失，强力地修改参数去模仿教师，导致其完全忘记了自己原本在预训练阶段学到的有用知识。这就像一个学生为了模仿老师的口音而忘记了单词的拼写。虽然“模仿”的Loss降低了，但真实的语言能力却崩溃了。

    诊断与解决：

    - 检查生成多样性：计算Self-BLEU或输出熵，如果值很低，说明发生了模式坍缩。

    - 评估通用能力：在MMLU等基准上测试，如果分数暴跌，说明是灾难性遗忘。

    - 降低蒸馏强度：提高蒸馏温度 T，降低特征蒸馏损失权重，或者降低蒸馏损失在总损失中的比重。


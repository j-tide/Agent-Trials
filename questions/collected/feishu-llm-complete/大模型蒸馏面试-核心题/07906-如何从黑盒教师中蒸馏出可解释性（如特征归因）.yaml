content:
  prompt: 如何从“黑盒”教师中蒸馏出可解释性（如特征归因）？
answer:
  mode: rubric
  reference_answer: |-
    当教师模型为黑盒（只能查询输入输出，无法获得内部梯度或特征）时，蒸馏可解释性

    通常意味着训练一个可解释的学生模型（如决策树、线性模型、带归因能力的神经网络），使其在模仿教师预测的同时，产生合理的特征归因或解释。

    方法：

    （1）模型蒸馏+事后归因

    - 首先用黑盒教师蒸馏一个透明的学生模型（如软决策树、广义加性模型、或带有注意力机制的小型 Transformer）。然后对学生模型应用标准的可解释性技术（如 Integrated Gradients、LIME、注意力可视化）来提供归因。由于学生是白盒，解释得以生成。

    - 关键：蒸馏损失必须足够高，确保学生与黑盒教师高度一致，否则解释不能代表原黑盒。

    （2）解释正则化蒸馏

    - 在蒸馏过程中，不仅匹配输出，还要求学生产生与某种先验知识一致的归因图。例如，使用无标签的输入，计算学生的归因（如梯度×输入），并惩罚不符合人类直觉（如归因噪声过大、非输入区域敏感）的情况。

    - 虽然教师是黑盒，但可以要求学生对指定输入产生的归因与一种辅助解释（如从数据中获取的已知重要区域）一致，这种辅助解释可以是人类标注的或由其他简单模型生成的。

    （3）多任务蒸馏：同时输出预测和解释

    - 如果能够通过提示或 API 让黑盒教师输出文本解释（如“因为...所以答案是...”），则可将这些解释作为数据蒸馏到学生，使学生学会同时生成答案和解释。这赋予了学生可解释性生成能力。

    - 如果教师本身不提供解释，可以用集成方法：用扰动输入观察教师输出变化，生成局部解释训练数据（类似于 LIME），再让学生学习预测这些解释。

    （4）概念蒸馏

    - 定义一系列人类可理解的概念（如纹理、形状、对象存在性）。对输入图像，通过干预或生成，收集黑盒教师对这些概念存在的预测（例如“该图像是否有斑点？”）。蒸馏一个概念瓶颈模型，其可解释层会预测这些概念，然后基于概念作出最终预测。这样解释可以直接从概念激活中获得。

    （5）对比蒸馏与原型学习

    - 训练学生模型包含原型层，使得其推理基于与学习到的原型相似度的比较。蒸馏时要求学生的原型决策路径与教师的最终决策一致，从而得到基于案例的解释（“看起来像原型X，所以是Y”）。

    （6）利用因果归因蒸馏

    - 通过扰动输入特征，记录教师预测的变化，计算出每个特征的影响度（SHAP值等）。用这些影响度作为归因标签，训练学生模型的一个归因模块，使其预测教师的行为特征重要度。这相当于蒸馏了一个特征归因函数。

    挑战：黑盒查询成本高，解释的准确性受限于学生模型与教师的一致性，以及归因方法的固有近似。但结合高效采样和蒸馏技术，从黑盒中蒸馏可解释性正在变得可行。

    这使得即使在模型提供者隐藏内部结构的情况下，我们仍能获得具备解释能力的替代模型，用于高风险决策场景。

    - 将不同教师的特征投影到公共空间后平均，再计算蒸馏损失。

    - 使用注意力或 Transformer 模块，以学生特征为 Query，各教师特征为 Key/Value，自适应融合。

    - 分块对应：将教师特征分组与学生不同层对齐（如 FitNet 扩展版）。

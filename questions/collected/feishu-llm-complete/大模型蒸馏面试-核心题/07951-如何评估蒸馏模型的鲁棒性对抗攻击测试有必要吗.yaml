content:
  prompt: 如何评估蒸馏模型的鲁棒性？对抗攻击测试有必要吗？
answer:
  mode: rubric
  reference_answer: |-
    非常有必要。 蒸馏可以被看作是一种“有损压缩”，这个过程可能破坏教师模型原本平滑、鲁棒的决策边界，使得学生模型对输入中的微小扰动变得异常敏感。

    评估方法：

    - 对抗攻击测试：使用成熟的对抗攻击算法（如NLP领域的TextFooler、BAE、HotFlip），对测试集中的样本生成对抗样本。通过比较模型在原始样本和对抗样本上的准确率下降幅度，来衡量其鲁棒性。鲁棒性越强，准确率下降越小。

    - 分布外（OOD）泛化测试：使用与训练数据分布有显著差异的数据进行测试，评估模型的泛化边界。

    - 噪声注入测试：在输入中添加随机的拼写错误、语法错误或同义词替换，观察模型性能的变化。

    结论：如果蒸馏模型将被部署在一个可能接收到恶意输入或被用户无意中错误输入的场景，那么鲁棒性评估就是衡量其可靠性的关键一环。


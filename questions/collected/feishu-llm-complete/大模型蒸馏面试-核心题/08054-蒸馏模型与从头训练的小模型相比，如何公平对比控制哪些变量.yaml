content:
  prompt: 蒸馏模型与从头训练的小模型相比，如何公平对比？控制哪些变量？
answer:
  mode: rubric
  reference_answer: |-
    公平对比的核心是解耦“架构优势”和“蒸馏优势”，确保性能差异只能归因于训练方法（蒸馏 vs 从头训练）。必须严格控制以下变量：

    - 模型架构与初始化：两者必须使用完全相同的架构。然而，初始化方式存在根本差异：蒸馏模型通常从一个强大的预训练权重初始化，而从零训练的模型则是随机初始化。这本身就是蒸馏的固有优势之一。为了进行更深层的科学探究，有时会设立一个对比组：从一个较差的预训练权重初始化，然后进行蒸馏，以观察蒸馏本身能否弥补初始化差距。

    - 训练数据量一致性（关键）：这是最核心的控制变量。

    - 训练超参：学习率、Batch Size、优化器、训练Epoch等应尽可能保持一致，或通过各自的验证集搜索到最优配置。

    - 数据处理：数据增强策略、Tokenizer、序列长度等必须完全相同。

    - 教师模型：蒸馏模型的知识来源。一个公平的对比需要一个明确的、固定的教师模型。

    结论：一个严谨的公平对比，通常会包含多个维度的比较，并明确指出对比的是“数据效率”、“计算效率”还是“绝对性能上限”，从而全面揭示蒸馏的价值。


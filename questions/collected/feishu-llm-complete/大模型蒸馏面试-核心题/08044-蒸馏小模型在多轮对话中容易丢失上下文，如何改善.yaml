content:
  prompt: 蒸馏小模型在多轮对话中容易丢失上下文，如何改善？
answer:
  mode: rubric
  reference_answer: |-
    多轮对话上下文丢失，本质上是小模型的长序列建模能力和记忆能力被有损压缩了。大模型有更强大的注意力机制和更宽的隐藏层来存储和检索历史信息，小模型在这方面天然处于劣势。

    改善策略：

    - 数据层面的强化：在蒸馏数据中，必须包含大量高质量、完整的多轮对话。这些对话不仅要长，还要包含复杂的指代消解（“那个...”、“他...”）、信息回溯和话题切换。让学生模型在训练时就学会如何精准地处理这些依赖历史信息的情况。

    - 注意力蒸馏：在模型的每一层Transformer中，让学生模型的自注意力权重分布去拟合教师模型的自注意力权重分布。这能传递教师如何关注历史上下文中关键信息的“阅读技巧”，是传递长程记忆能力非常有效的方法。

    - 课程学习：从短对话开始蒸馏（如2-4轮），在学生熟练掌握后，逐步增加对话轮次和上下文长度，让学生模型由浅入深地学习长程记忆能力。这类似于人类学习，从短文章阅读过渡到长篇小说阅读。

    - 位置编码优化：使用更适合长文本的位置编码方式，如ALiBi或RoPE。并在蒸馏训练时，将训练序列长度设置为目标长度，让学生模型在完整的上下文中学习。

    - 循环蒸馏：将上一轮蒸馏得到的学生模型作为下一轮蒸馏的教师，进行自我蒸馏。在每一轮中，都对长程记忆能力提出更高要求，从而迭代地提升性能。

    核心思想：将“阅读并理解长对话”本身作为一个需要专门蒸馏的能力，为其提供充分、多样化的数据，并利用注意力机制迁移教师的核心能力。


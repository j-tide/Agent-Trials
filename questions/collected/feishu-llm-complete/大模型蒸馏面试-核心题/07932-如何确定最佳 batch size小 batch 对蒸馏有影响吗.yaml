content:
  prompt: 如何确定最佳 batch size？小 batch 对蒸馏有影响吗？
answer:
  mode: rubric
  reference_answer: |-
    结论：Batch Size对蒸馏效果影响巨大，最佳值是一个需要通过实验确定的超参数。小Batch有独特优势，但并非总是最优。

    Batch Size对蒸馏的深层影响：

    - 小Batch Size的优势（梯度噪声的正则化效应）：这是核心差异。小Batch提供的梯度噪声更大，这种噪声在优化中起到了隐式正则化的作用，有助于模型找到更宽泛、更平坦的局部最小值，从而获得更好的泛化能力。在蒸馏中，软标签本身已是一种强正则化，小Batch的额外噪声可能会带来意想不到的增益。

    - 大Batch Size的优势（梯度估计准确，训练平稳）：大Batch能更准确地估计全局梯度，损失下降曲线更平滑。在处理大规模数据时，大Batch可以更好地利用GPU并行性，提升训练吞吐量。

    - 对BatchNorm（BN）层的毁灭性影响：这是最需要注意的技术细节。小Batch会严重破坏BN层对全局统计量的估计（running_mean和running_var），导致训练不稳定。因此，当学生模型包含BN层且Batch Size很小时，必须谨慎。此时可考虑使用Group Normalization (GN) 或 Layer Normalization (LN) 替代，或者固定BN层不训练。

    - 对特征蒸馏的影响：特征蒸馏的MSE损失通常计算在一个Batch的样本上。Batch Size越小，它计算出的特征统计（均值和方差）就越不准确，可能导致特征蒸馏的效果下降。

    最佳实践：

    - 从大Batch开始：先用一个较大的Batch（如GPU显存允许的最大值）进行训练，作为基线。

    - 逐步减小并对比：然后尝试逐步减小Batch Size，并启用梯度累积来保持有效的训练步数。对比不同Batch Size下的验证集性能，找到最佳平衡点。通常LLM微调中，全局Batch Size在64-256之间较为常见。

    - 关注特殊层：如果学生模型包含BN层，务必重点关注。


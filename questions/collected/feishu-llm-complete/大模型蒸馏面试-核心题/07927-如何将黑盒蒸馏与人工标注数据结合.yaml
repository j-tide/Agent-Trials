content:
  prompt: 如何将黑盒蒸馏与人工标注数据结合？
answer:
  mode: rubric
  reference_answer: |-
    这是一种典型的“人机协同”策略，旨在结合两者的优势：黑盒蒸馏的低成本、规模化，以及人工标注的高精度、与真实需求对齐。

    结合方式：

    - 人工数据作为“黄金种子”：由领域专家手写少量（几百到几千条）高质量、高精度的（指令，回答）对。这些数据是数据集的“锚点”，定义了模型行为的绝对基准。然后，利用这些种子数据作为Few-shot示例，通过Self-Instruct等方法，引导教师模型生成更大规模的蒸馏数据。

    - 人工修正与审核：先用教师模型生成海量蒸馏数据，然后通过一个主动学习循环，筛选出那些模型最不确定、质量评分最低或与人工标准差异最大的样本，送交人工进行修正。人工修正后的数据再与蒸馏数据混合，进行新一轮训练。这形成了一个“数据飞轮”，能持续提升数据质量。

    - 分层数据策略：将数据集分层。核心能力层（如安全、核心业务逻辑）全部使用或高比例使用人工标注数据，以确保万无一失；长尾覆盖层（如创意写作、冷门知识）则主要依赖教师模型生成，以低成本扩展能力边界。

    - 指令来自人工，回答来自教师：一种高效的策略是，所有指令由人工构造，确保其真实性和业务相关性；而回答则由教师模型生成，确保其专业性和信息密度。然后，人工可以快速审核这些回答，而不是从零撰写，极大提升效率。

    核心价值：人工标注解决了“教师不知道用户会怎么问”和“教师容易偏离业务规范”的问题，而黑盒蒸馏解决了“人工数据量不足”和“成本过高”的问题。


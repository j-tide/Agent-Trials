content:
  prompt: 黑盒蒸馏时，对生成数据的长度和格式有什么要求？如何控制？
answer:
  mode: rubric
  reference_answer: |-
    对生成数据的长度和格式控制，直接影响学生模型的行为习惯和推理效率。

    要求：

    - 长度：不能全是长篇大论，也不能全是简短回复。必须根据任务类型保持多样性。例如，对于“生成一个笑话”，合适的长度是1-2句话；对于“解释量子力学”，合适长度是几百字。数据集中应包含各种长度区间的样本，并且存在“根据用户要求调整长度”的指令（如“请用少于50字回答”）。

    - 格式：必须精确、一致。如果要求输出JSON，那么回答必须是100%可解析的JSON，且键名、值类型必须正确。代码必须用Markdown代码块包裹。格式错误会直接“教坏”学生。

    控制方法：

    - 在Prompt中明确约束：“你的回答应控制在200字以内”、“请以JSON格式输出，包含‘name’和‘age’两个字段，不要输出其他任何内容”。这是最直接的控制。

    - Few-shot示例的引导：在Prompt中给出的示例，其长度和格式就是教师模型模仿的直接范本。

    - 后处理强制校验与过滤：生成后，用脚本自动检查格式是否符合要求、长度是否在阈值内。不符合要求的样本，直接丢弃或调用教师模型重新生成。这是最后一道，也是最有效的防线。


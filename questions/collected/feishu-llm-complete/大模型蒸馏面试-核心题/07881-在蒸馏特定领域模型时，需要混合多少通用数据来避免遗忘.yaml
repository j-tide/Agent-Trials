content:
  prompt: 在蒸馏特定领域模型时，需要混合多少通用数据来避免遗忘？
answer:
  mode: rubric
  reference_answer: |-
    混合通用数据是防止领域蒸馏后模型“偏科”和灾难性遗忘的关键。

    比例确定：

    - 经验比例：通用数据的比例通常控制在10%到30%之间。如果领域任务与通用语言能力相关性较强（如法律文书），比例可以偏低（10%）；如果领域任务非常狭窄且专业（如特定代码库），比例需要偏高（30%），以强力锚定模型的通用能力。

    - 动态调整：可以在一个独立的通用能力测试集（如MMLU的子集）上监控模型表现。如果通用能力下降超过一个预设阈值（如3%），则在下一轮蒸馏中提高通用数据的混合比例。

    混合方式：

    - 数据级混合：这是最直接的方式。在构造蒸馏数据集时，直接将通用指令数据与领域指令数据按比例混合在一个文件中。

    - 训练级混合：在训练时，通过动态采样策略，控制每个Batch中通用数据和领域数据的比例。

    - 两阶段训练：

    通用数据的选择：混合的通用数据必须是高质量的，并且最好与领域任务在语言风格或知识结构上有一定的相似性，这样既能防止遗忘，又不会对领域学习造成过大的干扰。


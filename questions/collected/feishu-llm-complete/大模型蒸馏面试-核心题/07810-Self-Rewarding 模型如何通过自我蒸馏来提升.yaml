content:
  prompt: Self-Rewarding 模型如何通过自我蒸馏来提升？
answer:
  mode: rubric
  reference_answer: |-
    Self-Rewarding 语言模型（如 Meta 的相关工作）的目标是让模型能自己提供奖励信号，并利用这些信号改进自身，这一过程中自我蒸馏扮演核心角色。其大致框架如下：

    - 能力基础：模型需同时具备两个能力：生成回复（policy）和评判回复质量（reward model，即 LLM-as-Judge）。这两个头共享主体网络，或就是同一个模型通过 prompt 切换角色。

    - 自训练循环：

    - 采样生成：对一组 prompt，模型生成多种回复。

    - 自我评价：模型对自己生成的回复进行打分（如1-5分或偏好对），形成偏好数据集。

    - DPO 训练：用这些自生成的偏好对，优化模型使高分回复概率提升，低分回复概率降低。这实际上是把模型从“自我评价”中得到的知识（质量判断）蒸馏到生成策略中。

    - 迭代：新模型再次生成、评价、训练，形成自举循环。

    - 自我蒸馏的具体形式：

    - 教师 = 作为评判者的自己：模型在评判模式下认为哪个回复更好，这蕴含了对“好回复”的理解。DPO 训练相当于将这种评判知识（logit 差异或偏好概率）蒸馏到策略参数中。

    - 软知识传递：不仅可以用偏好对，也可以利用生成的高质量样本直接进行 SFT 蒸馏，即用模型自己筛选出的优质回复（例如得分高于阈值）来微调自己，这正是“自我蒸馏” —— 从当前模型选出的精英样本中学习。

    - EMA教师：某些实现中，会维护一个参数滑动平均的教师模型来生成更稳定的自我奖励信号，然后蒸馏回学生，这也是自蒸馏。

    - 为何能提升：迭代中，评价能力与生成能力互相促进。评价能力在多数轮次中可能因生成样本多样性而得到校准，生成能力则持续从更准确的偏好信号中学习。本质上，自我蒸馏通过将评判视角的知识注入生成策略，突破了单纯靠外部人类偏好的瓶颈。模型不仅学习“人类偏好”，还内化了自身推理出的精细质量判断（如连贯性、事实性、有用性等），实现自我改进。

    - 关键挑战：自我奖励可能放大偏见或幻觉，但配合正确的约束（如仅使用可信评价维度、结合外部真实信号正则化）就形成有效的自蒸馏改进。


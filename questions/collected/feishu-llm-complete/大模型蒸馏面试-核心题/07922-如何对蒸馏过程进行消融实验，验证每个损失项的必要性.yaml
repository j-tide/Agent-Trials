content:
  prompt: 如何对蒸馏过程进行消融实验，验证每个损失项的必要性？
answer:
  mode: rubric
  reference_answer: |-
    消融实验是科学优化蒸馏方案的核心。其思路是：保持所有条件不变，逐一移除或改变某个组件，观察性能的变化。

    实验设计：

    - 建立基线：使用完整的、你设计的蒸馏方案（包含所有损失项）训练一个学生模型，记录其在测试集上的全面性能，作为比较的基线。

    - 设计消融组：

    [图片内容未导入]

    - 控制变量：这是最关键的一步。所有消融组必须使用与基线模型完全相同的数据集、模型架构、随机种子、优化器、学习率策略、训练步数等。唯一改变的就是你要测试的那个变量。

    - 全面评估：对所有模型在同一个测试集上进行评估，评估维度必须全面，包括目标任务性能、泛化能力、生成多样性等。

    结果分析：

    - 量化贡献：基线性能减去消融组A的性能，得到的差值就是特征蒸馏在该任务上的贡献度。

    - 作出决策：如果移除某项损失后，性能几乎没有下降，甚至略有提升，那么这项损失可能就是冗余的，可以移除。如果性能大幅下降，那么它就是核心组件。


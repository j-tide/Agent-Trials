content:
  prompt: 蒸馏训练通常需要多少个 epoch？和 SFT 一样吗？
answer:
  mode: rubric
  reference_answer: |-
    没有定数，通常需要更多，必须根据验证集早停。

    - 为什么可能需要更多Epoch（根本原因）：
    SFT学习的硬标签只包含一个标准答案，信息量极低。而蒸馏学习的软标签，包含了教师模型对所有可能答案的完整概率分布，信息量是硬标签的数十倍。模型需要更多次的迭代，才能充分消化和吸收这些丰富的结构信息。尤其是白盒蒸馏中，多个辅助损失（特征、注意力）同时更新，需要更多时间来协调和统一这些不同层次的信号。

    - 不能与SFT简单类比：SFT普遍用1-3个Epoch，但这建立在SFT数据量少、信号密集、易过拟合的前提下。而蒸馏可能使用海量教师生成数据，过拟合风险大大降低，因此可以承受更多Epoch的训练。

    唯一判断标准：在独立的验证集上，监控学生模型的性能（任务准确率）和与教师模型输出分布的KL散度。当这两个指标都趋于稳定甚至开始恶化时，才应停止训练。刻舟求剑地设定一个Epoch数，是蒸馏失败的常见原因。


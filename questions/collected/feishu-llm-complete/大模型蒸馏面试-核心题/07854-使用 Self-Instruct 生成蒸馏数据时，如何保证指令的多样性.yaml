content:
  prompt: 使用 Self-Instruct 生成蒸馏数据时，如何保证指令的多样性？
answer:
  mode: rubric
  reference_answer: |-
    指令多样性是 Self-Instruct 成功的生命线。如果生成的指令高度同质化，学生模型将严重过拟合到狭窄的模板，丧失泛化能力。保证多样性的主要手段如下：

    - 种子池的内在多样性：175条种子任务必须由专家精心设计，覆盖广泛的任务类型（生成、分类、推理、问答、代码等）、语言风格（正式、口语）和领域（科技、文学、生活）。种子是多样性的“源头”。

    - Few-shot 示例的随机采样：在生成新指令时，每次从任务池中随机抽取6-8条示例。这种随机性本身就避免了模型总是模仿同一组示例。

    - 生成 Prompt 中的显式要求：在指令生成的 Prompt 中，会加入明确的多样性要求，例如：“请生成一个与上述示例完全不同类型的新任务”、“尽量使用不同的措辞和句式”、“考虑一个用户可能提出的独特请求”。这直接引导模型进行创新。

    - 语义相似度过滤（关键一步）：新指令生成后，必须计算其与任务池中所有已有指令的 ROUGE-L相似度。如果最高相似度超过预设阈值（通常为0.7-0.8），说明这条指令与旧指令过于相似，将被直接丢弃。这是防止模型“偷懒”并生成重复内容的最强保障。更先进的版本会使用句子嵌入（Sentence Embeddings）进行语义相似度过滤，以捕捉深层语义重复。

    - 迭代过程中的分布监控：随着迭代轮次增加，任务池的多样性可能会自然衰减。需要在每轮后统计分析指令的类型分布。如果发现某类任务（如翻译）占比过高，下一轮生成时可刻意调整 Prompt，引导模型多生成其他类型的任务。


content:
  prompt: 解释“蒸馏遗忘”（Distillation Forgetting）现象，原因和对策。
answer:
  mode: rubric
  reference_answer: |-
    蒸馏遗忘是指在知识蒸馏过程中，学生模型虽然很好地模仿了教师，但在后续针对特定任务（尤其原教师未涵盖或弱化的能力）进行微调或评估时，迅速丧失从教师那里学到的部分通用知识或旧任务能力，类似于灾难性遗忘，但发生在师生传递背景下。

    原因分析：

    - 知识未内化：学生只是表面模仿了教师的输出分布，并未在参数中建立稳固的底层表征。当面对新任务优化时，这些浅层知识被快速覆盖。

    - 教师信号的不完整性：由于蒸馏时数据覆盖度不足，或教师模型在某些方面过度自信，学生形成脆弱的决策边界，稍微调整就容易断裂。

    - 容量瓶颈与干扰：小模型参数有限，新任务更新时会挤占原用于存储教师知识的参数空间，引发特征干扰。

    - 偏好和风格的遗忘：RLHF 对齐或安全特性等微妙行为，因缺乏硬标签约束，微调时易丢失。

    - 微调时的优化冲突：新任务的损失下降方向可能正交或反向于维持教师分布的方向，如果没有约束，学生很快偏离。

    对策：

    - 多任务蒸馏与持续训练：在微调新任务时，不仅使用新任务的真实标签，还持续使用原教师的软标签作为正则化项（知识保持损失），平衡学习新知识与巩固旧知识。

    - 参数隔离与模块化：使用 Adapter、LoRA 等插件学习新任务，保持主干参数不变，从结构上避免遗忘。

    - 回放蒸馏：微调时混合部分原蒸馏数据集，用原教师信号回放。

    - 旧模型作为额外教师：将蒸馏前的旧学生模型（之前蒸馏得到的）作为“历史教师”，在新任务训练时也约束不偏离历史教师过远，起到巩固作用。

    - 弹性权重巩固（EWC）式正则：估计学生参数对原蒸馏损失的重要性，在微调新任务时对重要参数限制变动。

    - 蒸馏时强化中间层匹配：若蒸馏时强迫学生匹配了教师的中间特征层，这些深层约束会形成更稳定的表示，不易被后续微调覆盖。

    总结来说，蒸馏遗忘源于学生知识根基不牢，需要通过持续的教师信号、架构约束或回放来强化知识保留。


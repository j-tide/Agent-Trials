content:
  prompt: 在移动端部署场景，蒸馏+量化+剪枝的顺序如何安排最优？
answer:
  mode: rubric
  reference_answer: |-
    在移动端部署场景下，终极目标是在极度受限的硬件资源下（内存、算力、功耗），实现最佳的精度和速度权衡。因此，这三个技术的组合顺序必须紧紧围绕“最终部署的是什么”这一核心问题。

    最优顺序：结构化剪枝 → 蒸馏微调 → 量化感知训练（QAT）+ 蒸馏

    详细步骤与原理：

    - 第一步：结构化剪枝（Structure Pruning）

    - 第二步：蒸馏微调（Distillation Fine-tuning）

    - 第三步：量化感知训练（QAT）+ 蒸馏

    为什么这是最优顺序？

    - 结构性前置：剪枝直接改变模型结构，必须最先进行，因为它决定了后续所有操作的基础模型架构。

    - 能力修复优先于精度压缩：在结构确定后，首要任务是恢复和提升模型的FP32性能上限，这是蒸馏的核心价值。在FP32性能足够好的前提下，再进行量化，可以将精度损失降到最低。

    - 量化最后的必然性：量化是最后一步，因为量化后的模型难以再进行剪枝（结构已固化），且量化后的蒸馏难度高于量化前。将量化放在最后，利用QAT+蒸馏的组合拳，是通往极致的最后一公里。


content:
  prompt: 注意力蒸馏是如何工作的？匹配哪些注意力图？
answer:
  mode: rubric
  reference_answer: |-
    注意力蒸馏旨在让学生模型学会教师模型的“阅读策略”，即模型在生成每个Token时，是如何从上下文中选择性获取信息的。

    - 工作原理：

    - 提取注意力图：在教师和学生模型的每一个Transformer层，获取其自注意力机制生成的注意力权重矩阵 AA。对于多头注意力，通常将所有头的权重进行平均或拼接处理。

    - 计算损失：使用KL散度或MSE来衡量学生注意力图 AsAs 和教师注意力图 AtAt 之间的差异。

    - 如果使用KL散度，需要将注意力图按行进行Softmax归一化，使其成为概率分布，然后计算 L_attn = KL(A^t || A^s)。

    - 如果使用MSE，则直接计算 L_attn = MSE(A^t, A^s)。

    - 为什么有效：注意力图不依赖于隐藏状态的维度，即使学生和教师的模型维度不同，只要它们的序列长度和注意力头数相同，就可以直接进行匹配。它传递的是一种更抽象、更结构化的知识。

    - 匹配哪些注意力图？

    - 逐层匹配：最常见的方式，让学生每一层的注意力图去拟合教师对应层的注意力图。

    - 顶层匹配：只匹配最后几层的注意力图，因为这些层通常包含更高级的语义信息。

    - 多头融合匹配：可以分别匹配每个头，也可以将所有头的注意力图合并后再匹配。


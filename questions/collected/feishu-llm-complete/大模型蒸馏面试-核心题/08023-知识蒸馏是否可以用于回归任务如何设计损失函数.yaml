content:
  prompt: 知识蒸馏是否可以用于回归任务？如何设计损失函数？
answer:
  mode: rubric
  reference_answer: |-
    知识蒸馏完全可以应用于回归任务（例如房价预测、目标检测中的边界框回归、姿态估计）。其核心思想不变：让学生模型模仿教师模型的连续值预测行为。

    在回归任务中，教师模型输出的不是概率分布，而是一个或多个连续的实数值。因此，我们不再使用KL散度，而是衡量两个模型预测值之间的距离。常用的损失函数设计如下：

    [图片内容未导入]

    常用的距离度量：

    - 均方误差（MSE Loss）：最常用的选择，nn.MSELoss()，适用于大多数回归任务。

    - 平滑L1损失（Smooth L1 Loss）：nn.SmoothL1Loss()，对异常值（outliers）更鲁棒，常用于目标检测的边界框回归。

    - Huber损失：结合了MSE和MAE的优点，也是一种鲁棒的选择。

    完整的训练损失：

    与分类任务类似，通常会结合真实标签的损失和蒸馏损失：

    [图片内容未导入]

    这样，学生模型既能从真实标签中学习，又能模仿教师模型的预测细节，提升泛化能力。

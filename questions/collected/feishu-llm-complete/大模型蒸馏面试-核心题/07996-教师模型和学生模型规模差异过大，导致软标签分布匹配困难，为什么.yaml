content:
  prompt: 教师模型和学生模型规模差异过大，导致软标签分布匹配困难，为什么？
answer:
  mode: rubric
  reference_answer: |-
    这是因为大模型的输出分布（软标签）中包含了大量高维、稀疏且高度非均匀的结构信息，而小模型的表征能力有限，难以同时捕捉到这些细节。

    - 软标签的复杂度与容量不匹配：大模型由于参数众多，能够学习到非常精细的类别边界和样本之间的细微关联。其软标签不仅给出正确答案，还精确地刻画了所有非正确类别的相对排序。小模型由于容量限制，可能会“忽略”掉这些细粒度的信息，转而学习一个更粗糙、更平均的近似分布。这直接导致了匹配困难——学生模型发现无论怎么努力，都无法完全模仿教师的输出，优化过程容易陷入震荡或不收敛。

    - 高噪声与低信号：对于小模型而言，大模型软标签中那些微弱的、属于非正确类别的概率，可能已经低于其学习噪声的阈值。学生模型无法有效利用这些信息，甚至会被这些“噪声”误导，产生过拟合教师偏差而非学习真实规律。

    - 优化困境：当目标分布（教师）和拟合函数（学生）的复杂度差异过大时，损失曲面会变得崎岖不平，局部极小值众多。这使得优化器很难找到一个能同时满足所有样本的优秀解。

    缓解这种困难通常需要更精细的蒸馏策略，例如多级蒸馏、引入中间层特征对齐，以及动态调整蒸馏温度。


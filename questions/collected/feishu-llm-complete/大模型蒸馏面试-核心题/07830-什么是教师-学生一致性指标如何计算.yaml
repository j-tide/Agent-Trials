content:
  prompt: 什么是“教师-学生一致性”指标？如何计算？
answer:
  mode: rubric
  reference_answer: |-
    “教师-学生一致性”（Teacher-Student Agreement）是衡量学生对教师行为模仿程度的最直接的指标。它不是一个单一指标，而是一系列指标的组合。

    核心计算指标：

    - Top-1预测一致率：在测试集上，学生模型预测为概率最高的类别，与教师模型预测为概率最高的类别相同，所占的比例。这是最基础的一致性指标。

    - Top-K预测重叠率：对于更精细的分析，可以计算学生模型的Top-K预测集合与教师模型的Top-K预测集合的Jaccard相似度（交集大小除以并集大小）。这能衡量两者在考虑多种可能性时的一致性。

    - 错误模式一致性（Cohen's Kappa）：不能只看正确的一致性。可以计算一个混淆矩阵，显示师生模型在每个类别上正确/错误判断的联合分布。然后，使用Cohen's Kappa系数来量化两者在分类决策上的一致性程度，这个值排除了随机一致的概率，更为可靠。

    - 软标签对齐度（JSD/余弦相似度）：更细粒度的指标。直接计算学生和教师模型输出的完整概率分布向量之间的Jensen-Shannon散度（JSD）或余弦相似度，并求所有样本的平均值。这能捕捉到Top-1一致率无法反映的、分布内部的微妙差异。


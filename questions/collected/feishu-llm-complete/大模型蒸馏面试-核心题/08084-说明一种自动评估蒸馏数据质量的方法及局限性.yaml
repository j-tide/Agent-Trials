content:
  prompt: 说明一种自动评估蒸馏数据质量的方法及局限性。
answer:
  mode: rubric
  reference_answer: |-
    基于LLM-as-Judge（如GPT-4）的自动评分法是目前最强大、最常用的方法。

    方法：

    - 抽样：从蒸馏数据集中随机抽取数百条样本。

    - 设计评判Prompt：编写一个精细的Prompt，要求GPT-4对每条数据的“指令清晰度”、“回答准确性”、“有用性”、“安全性”等维度进行1-5分的Likert量表评分，并给出简短理由。

    - 执行评判：调用API对样本进行打分。为了避免位置偏差，可以对同一份数据随机交换顺序评判两次取平均。

    - 汇总报告：统计所有样本在各维度上的平均得分和分布，生成数据质量报告。

    局限性：

    - 评判模型自身偏见：GPT-4并非绝对公正的裁判。它可能内在地偏好更长的回答、更详细的解释，或带有特定的风格偏好，导致评分存在系统性偏差。

    - 幻觉与误判：评判模型自身也可能产生事实性错误，从而对回答的准确性给出错误评分。

    - 成本与延迟：使用顶级模型API进行大规模评判，成本高昂且耗时。

    - 对“创造性”等主观维度评估困难：对于一些开放式、需要创造力的任务，评判模型给出的分数往往与人类评价相关性较低。

    - 评估粒度粗：它可能给出一条数据“整体不错”的分数，但无法精确指出其中某个细微逻辑错误。因此，LLM-as-Judge是高效的质量监控手段，但不能完全替代精细的人工抽检和针对特定能力（如数学）的规则化评估。


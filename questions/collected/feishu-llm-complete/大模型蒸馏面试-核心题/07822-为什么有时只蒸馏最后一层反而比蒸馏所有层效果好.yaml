content:
  prompt: 为什么有时只蒸馏最后一层反而比蒸馏所有层效果好？
answer:
  mode: rubric
  reference_answer: |-
    这是一个在实践中被反复观察到的“反直觉”现象，其背后有深刻的原因：

    - 过度约束与优化困难：对所有中间层施加严格的MSE约束，会极大地限制学生模型的参数空间。学生模型可能为了满足每一层的对齐要求，而牺牲了最终任务的学习，导致整体优化目标被“稀释”或“扭曲”。这就像一个学生被要求每一步模仿老师的笔迹，反而无法流畅地写出完整的答案。

    - 错误传播与累积：如果学生在某一中间层学得不够好，这个误差会被后续层的蒸馏损失放大，形成错误的累积。只蒸馏最后一层，相当于只关心最终的、最高级抽象的结果，给了学生模型在中间过程中自由调整和寻找最优路径的空间。

    - 容量差距与“饱和”效应：学生模型容量有限。强迫它去拟合教师所有中间层丰富的高维特征，可能会使其表征能力快速“饱和”，反而丧失了对最终任务的泛化能力。

    - 最后一层是知识的“瓶颈”：在Transformer模型中，最后一层的输出往往是经过多层抽象后，为解决最终任务准备的、信息高度浓缩的“瓶颈”特征。这个特征蕴含了解决问题所需的核心知识。因此，对齐这一层，往往比对齐所有中间层更能抓住知识的本质。


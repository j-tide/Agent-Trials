content:
  prompt: 在蒸馏数据中混合预训练数据，有什么作用？比例如何确定？
answer:
  mode: rubric
  reference_answer: |-
    在蒸馏数据中混合一定比例的预训练数据（如Wikipedia, 书籍, 高质量网页文本），是一种极其有效的防遗忘策略，通常被称为“数据回放”。

    作用（为什么需要混合）：

    - 锚定通用知识与语言能力：蒸馏数据通常是任务特定的，分布较窄。模型在全力模仿教师的任务行为时，会迅速遗忘预训练阶段学到的广泛世界知识、常识和语言多样性。混合预训练数据相当于在每个训练步都“提醒”模型不要忘记它的基础能力。

    - 保持语言多样性与创造性：教师生成的回答，即使再多样，也难免带有某种同质化的“AI风格”。预训练数据中丰富的人类语言风格（小说、诗歌、新闻等）可以保留模型的生成多样性和灵活性，防止其输出变得模板化。

    - 作为一种隐式正则化：通用文本数据对于“蒸馏任务”来说是一种“噪声”，它能有效防止模型过拟合到蒸馏数据的特定模式，提升泛化能力。

    比例如何确定？

    - 经验比例：通常在5%到20%之间。对于全参数蒸馏，遗忘风险更高，建议使用10%-20%；对于使用LoRA等PEFT方法，遗忘风险小，可以降至5%甚至不用。

    - 动态调整：可以在一个独立的、覆盖通用能力的测试集（如MMLU子集）上监控模型表现。如果通用能力下降超过预设阈值，就提高预训练数据的混合比例。

    - 质量优先：混合的预训练数据必须是高质量的，不能引入噪声和有害内容。


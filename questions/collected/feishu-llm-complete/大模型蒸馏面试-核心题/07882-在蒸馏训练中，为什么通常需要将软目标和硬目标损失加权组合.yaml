content:
  prompt: 在蒸馏训练中，为什么通常需要将软目标和硬目标损失加权组合？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - 互补性：软目标（蒸馏损失）提供了类别间的相似性结构，有助于泛化；但教师模型本身并非完美，其输出可能存在偏差或错误。硬目标（真实标签）提供了绝对的真实信号，能够纠正教师模型的错误，防止学生模型完全继承教师的缺点。

    - 训练稳定性：仅使用软目标可能会导致训练初期不稳定，因为学生模型刚开始时输出与教师相差很大，KL散度损失可能非常大。加入硬目标损失可以帮助模型快速收敛到合理区域，因为交叉熵是硬约束，能让模型先“知道答案”再去“模仿细节”。

    - 正则化效果：硬标签可以看作是一种强监督信号，结合软标签的平滑特性，使得模型既能拟合真实数据，又能保持一定的平滑性，避免对特定类别过拟合。

    - 灵活调节：通过调整 α 可以控制学生模型对教师知识的依赖程度。当教师模型非常强大且可信时，可以增大软目标的权重（甚至设为0，即纯蒸馏）；当教师模型较弱或与任务不完全匹配时，可以增大硬目标的权重。

    常见配置：α 设为一个较小的值（如 0.1），即主要依赖软目标（权重 0.9），少量结合硬目标。在某些任务中，甚至 α=0（仅蒸馏损失）也能取得好效果，这通常要求教师模型非常强且学生模型容量足够。


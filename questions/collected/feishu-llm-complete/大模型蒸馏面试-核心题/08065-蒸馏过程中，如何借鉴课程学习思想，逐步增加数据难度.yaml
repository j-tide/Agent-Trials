  prompt: 蒸馏过程中，如何借鉴“课程学习”思想，逐步增加数据难度？
answer:
  mode: rubric
  reference_answer: |-
    将课程学习（Curriculum Learning）融入蒸馏，就是让学生模型像人类一样，从简单知识学起，逐步挑战更困难的内容。这能显著提升训练的稳定性和最终模型的泛化能力。

    实施步骤：

    - 定义“难度”度量标准：这是最关键的一步。可以从多个维度衡量数据难度：

    - 分桶与排序：根据难度评分，将蒸馏数据分为3-5个难度桶（如Easy, Medium, Hard）。训练时按顺序使用这些桶。

    - 设计课程表与采样策略：

    - 结合“教师课程”与“学生反馈”：

    优势：课程学习能够平滑训练过程，避免初期被困难样本“劝退”，并帮助模型构建更扎实、层次化的知识体系。


content:
  prompt: 如何蒸馏多模态大模型（如从GPT-4V到LLaVA）？
answer:
  mode: rubric
  reference_answer: |-
    蒸馏多模态大模型（MLLM）的目标是让一个开源的小型MLLM（如LLaVA）学会一个强大的闭源MLLM（如GPT-4V）的多模态理解与推理能力。

    核心策略：多模态指令数据的蒸馏。

    - 数据准备：收集或构建一个大规模的、多样化的多模态指令数据集。数据集通常包括图像、视频等视觉内容。

    - 教师模型生成回答：将这些多模态指令发送给教师模型（GPT-4V）。关键在于，Prompt的设计要能够激发教师的高级能力。

    - 学生模型训练：将收集到的（多模态指令， 教师回答）对作为训练数据，对LLaVA等学生模型进行监督微调（SFT）。训练时，视觉编码器通常被冻结，只微调跨模态连接器（Projector）和语言模型（LLM）部分。

    进阶技术：

    - 结合白盒蒸馏：由于LLaVA和GPT-4V架构不同，这里是黑盒蒸馏。但是，如果教师是另一个架构相似的开源MLLM，还可以进行白盒蒸馏，对齐中间的多模态特征。

    - 分阶段训练：


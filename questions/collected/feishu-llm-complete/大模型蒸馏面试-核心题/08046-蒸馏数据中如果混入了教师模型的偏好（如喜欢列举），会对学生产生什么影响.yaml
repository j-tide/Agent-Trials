content:
  prompt: 蒸馏数据中如果混入了教师模型的“偏好”（如喜欢列举），会对学生产生什么影响？
answer:
  mode: rubric
  reference_answer: |-
    会产生显著的“偏见传递”或“风格过拟合”。学生模型会忠实地学会这种偏好，并将其放大。

    具体影响：

    - 输出风格单一化：如果教师偏爱“第一、第二、第三”的列举式回答，学生模型在面对任何问题时，都会强行套用这种格式，即使对于“讲个笑话”这样的指令也是如此，导致回复生硬、缺乏创意。

    - 能力退化：教师对某些风格的偏好，可能会压制其他重要能力。例如，一个总是喜欢“详细解释”的教师，其学生可能丧失“言简意赅”的能力。

    - 产生系统性偏差：如果教师对特定文化、性别或价值观存在隐含偏好，学生将忠实地继承并强化这种偏差，带来公平性和伦理风险。

    如何缓解：

    - 源头控制：在教师生成数据时，通过Prompt多样化来抑制单一偏好。例如，明确要求“不要使用列表”、“给出一个口语化的回答”。

    - 数据清洗与配比：分析蒸馏数据，如果发现某种风格占比过高，可以人为地补充其他风格的样本进行平衡。

    - 集成蒸馏：使用多个具有不同偏好的教师来互相“中和”，产生一个更无偏的软标签。


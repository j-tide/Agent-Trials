content:
  prompt: 在语言模型中，如何选择句子的哪些token进行特征匹配？
answer:
  mode: rubric
  reference_answer: |-
    在NLP的特征蒸馏中，对序列中的所有Token一视同仁地进行匹配，效率低下且可能引入噪声。因此，选择关键Token进行匹配至关重要。

    常见策略：

    - 答案/标签Token：在分类任务中，只取[CLS] Token的隐藏状态进行蒸馏，因为它聚合了整个序列的信息，直接用于最终分类。

    - 实体/关键词Token：使用NER工具或词性标注工具识别句子中的实体和关键词，认为这些Token承载了更多的语义信息，应作为蒸馏重点。

    - 高熵Token：计算教师模型在每个Token上的预测熵。熵越高，代表教师模型对该词“越不确定”，可能意味着该词包含的语义信息越丰富，更值得学生学习。

    - 高注意力Token：统计教师模型在各层对该Token的平均注意力权重。权重高的Token是教师模型“重点关注”的词，蒸馏这些Token的位置可以传递教师的“阅读策略”。

    - 任务特定Token：对于生成式任务，可以只蒸馏生成序列部分的Token，而忽略输入Prompt部分的Token，这类似于SFT中的Loss Masking。

    - 均匀随机采样：为了避免引入选择偏见，有时也采用一种简单的方法：在训练时，随机采样一部分Token（如50%）进行特征匹配。这也能起到Dropout式的正则化效果。


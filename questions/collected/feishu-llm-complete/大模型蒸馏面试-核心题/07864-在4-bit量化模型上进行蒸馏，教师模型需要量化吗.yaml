content:
  prompt: 在4-bit量化模型上进行蒸馏，教师模型需要量化吗？
answer:
  mode: rubric
  reference_answer: |-
    不需要，且通常不应该。

    - 教师模型应保持最高精度（FP32/BF16/FP16）。因为教师模型在蒸馏中扮演的是“绝对真理”和“知识金标准”的角色。教师提供的是来自高精度世界的、尽可能无噪声的知识。它的目标是传递平滑的决策边界和丰富的暗知识。如果教师也被量化，它的预测精度和可靠性会下降，输出的软标签本身就包含了量化噪声，这会污染知识源，降低蒸馏效果。

    - 学生模型可以是4-bit量化的。蒸馏的目标正是为了让这个低精度的学生模型，通过学习高精度教师的行为，来克服其自身因精度下降而带来的能力损失。学生模型在低精度下的挣扎，通过教师高精度的指导被弥补了。

    - 类比理解：一位视力模糊的学生（4-bit量化模型），在努力看清黑板时，需要的是一位视力5.0的老师（FP32模型）的清晰讲解，而不是另一位同样视力模糊的学生的转述。


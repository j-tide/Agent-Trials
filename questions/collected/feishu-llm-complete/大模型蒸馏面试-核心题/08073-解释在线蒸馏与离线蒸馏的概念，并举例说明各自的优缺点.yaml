  prompt: 解释“在线蒸馏”与“离线蒸馏”的概念，并举例说明各自的优缺点。
answer:
  mode: rubric
  reference_answer: |-
    离线蒸馏（Offline Distillation）

    这是最经典的蒸馏范式，也是Hinton最初提出的方式。

    - 流程：先独立训练一个大型、高精度的教师模型，待其完全收敛后，冻结参数。然后，用这个固定的教师模型来蒸馏一个学生模型。

    - 优点：实现简单，教师和学生训练完全解耦，可以重复利用同一个教师模型蒸馏多个学生。

    - 缺点：

    在线蒸馏（Online Distillation）

    教师和学生模型同时、联合地从零开始训练，教师的知识在训练过程中实时传递给学生。

    - 流程：在同一个训练循环中，同时更新教师和学生的参数。有时教师和学生可以是同一个模型的两个分支（如深度相互学习，Deep Mutual Learning），或者教师是学生参数的指数移动平均（EMA）。

    - 优点：

    - 缺点：

    举例：

    - 离线：用预训练的BERT-Large蒸馏DistilBERT。

    - 在线：在图像分类中，使用两个结构相同的模型，互相用对方输出的软标签作为监督信号进行互学习。

content:
  prompt: 知识蒸馏能否用于生成式模型（如语言模型）？和分类蒸馏有何不同？
answer:
  mode: rubric
  reference_answer: |-
    完全适用，且是当前大语言模型（LLM）轻量化的重要手段。 但与分类蒸馏有显著不同。

    主要不同点：

    - 输出空间巨大且可变长：分类任务的输出是K维的概率向量；而生成式模型的输出是一个序列，其每个位置的词表大小可达数万，且序列长度可变。因此，不能简单地使用KL散度对整个序列的分布进行平均。

    - 蒸馏损失的定义：

    - 注意力蒸馏：在Transformer架构中，可以让学生的自注意力权重分布去拟合教师的注意力分布，这有助于学生学到教师的推理模式。

    - Top-K蒸馏：由于词表过大，计算全词表KL散度成本高昂。通常只在教师概率最高的Top-K个词上计算，或者仅对教师的生成分布进行采样。

    总结：生成式模型的蒸馏核心在于如何高效、有效地在巨大的序列空间上传递知识，而不仅仅是最后的logits。

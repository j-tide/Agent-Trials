content:
  prompt: 训练过程中如何监控学生模仿教师分布的程度（如 KL 散度变化）？
answer:
  mode: rubric
  reference_answer: |-
    监控学生对教师分布的模仿程度，是判断蒸馏是否“学偏了”或“过火了”的关键。

    具体操作：

    [图片内容未导入]

    - 记录并可视化：将验证集上的KL散度值记录到TensorBoard或WandB中，绘制成随训练步数变化的曲线。

    如何解读KL散度变化：

    - 理想情况：KL散度在训练初期快速下降，随后趋于稳定。这说明学生正在成功学习教师的分布，并最终达到了一个稳定的模仿状态。

    - 危险信号（过拟合教师）：训练集上的蒸馏损失持续下降，但验证集上的KL散度开始上升。这表明学生模型开始记忆教师输出中的特定噪声和模式，而不是学习其泛化的知识。

    - 异常情况：KL散度居高不下或震荡剧烈，可能意味着学习率过大导致无法收敛，或者师生模型容量差距太大导致无法学习。

    最佳实践：始终监控验证集上的KL散度，并结合验证集任务准确率一同判断。 这两个指标共同构成了判断蒸馏收敛性和泛化性的“双保险”。


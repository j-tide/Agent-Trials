content:
  prompt: 如何使用教师模型给海量无标签数据打上软标签，然后训练小模型？
answer:
  mode: rubric
  reference_answer: |-
    在LLM语境下，“软标签”的概念已经从分类任务中的概率分布，扩展为包含丰富信息的自然语言文本。其流程与伪标签蒸馏一致，核心在于如何高效、高质量地利用教师模型。

    具体步骤：

    - 准备海量无标签指令池：指令的来源至关重要。为了获得一个全能的蒸馏模型，指令池必须极具多样性。这可以通过以下方式实现：

    - 调用教师模型生成高质量“软标签”：

    - 构造最终蒸馏数据集：将通过质量过滤的（指令，教师回答）对作为最终的训练集。为了平衡模型能力，数据集中需要包含各种类型的任务（生成、推理、编码、安全对话等）。

    - 监督微调训练学生模型：使用标准的交叉熵损失，让学生模型去预测教师生成的文本序列。在训练过程中，通常只对助手的回复部分计算损失（Loss Masking），而指令部分被忽略。通过多轮（通常1-3个epoch）训练，学生模型就能逐渐学会模仿教师的行为，具备强大的指令遵循和任务处理能力。

    本质：这是一种数据驱动的知识迁移。教师模型的智慧被编码在了它生成的千千万万条文本中。学生模型通过拟合这些文本，间接地“读”懂了教师的思考方式，从而获得了超越其自身容量的能力。


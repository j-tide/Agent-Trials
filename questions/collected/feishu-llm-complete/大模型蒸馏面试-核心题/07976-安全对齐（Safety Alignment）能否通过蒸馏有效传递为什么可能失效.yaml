content:
  prompt: 安全对齐（Safety Alignment）能否通过蒸馏有效传递？为什么可能失效？
answer:
  mode: rubric
  reference_answer: |-
    安全对齐能力非常难以通过蒸馏有效传递，极易失效。

    失效原因：

    - 安全能力的“脆弱性”与“逆规模化”：大模型的安全对齐往往受益于其庞大的参数和复杂的训练过程（如RLHF）。这些安全护栏在参数空间中是高度精细和脆弱的。小模型因容量限制，在蒸馏过程中极易“遗忘”或“忽略”这些安全约束，导致安全能力急剧下降。

    - 蒸馏数据的偏差：用于蒸馏的指令-回答数据集，如果大部分都是有用性任务，安全相关的样本（如拒绝回答）比例很低，那么学生模型就会主要学会“服从指令”，而丧失“判断指令是否安全”的能力。

    - “过度服从”与“灾难性遗忘”的矛盾：如果为了安全而在蒸馏数据中加入大量拒绝回答的样本，小模型极易发生“灾难性遗忘”，变成一个对任何边界请求都过度拒绝的“胆小”模型。反之，如果安全数据不足，则可能变得过于顺从，失去安全护栏。

    - 软标签的局限性：在安全场景下，教师模型的安全输出（如拒绝回答）往往是一个非常尖锐的概率分布（极度自信）。小模型模仿这个软标签，可能只学会了“拒绝的话术”，而没有理解“为何要拒绝”的安全原则。

    如何缓解：

    - 保留高比例安全数据：在蒸馏数据集中，刻意保留或构造10%-20%的安全对齐样本，包括拒绝回答和安全的建设性回应。

    - 结合硬标签的安全损失：在训练时，对安全相关的样本使用真实的硬标签进行监督，确保学生学到的是正确的安全行为。

    - 额外的安全微调（Safety Fine-Tuning）：在蒸馏后，使用一个独立的安全数据集，对学生模型进行专门的DPO或RLHF安全微调，强制其学习安全对齐。这往往是最可靠的方法。


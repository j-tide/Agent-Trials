content:
  prompt: 如何衡量蒸馏的效果？除了学生模型的精度外，还要关注哪些指标？
answer:
  mode: rubric
  reference_answer: |-
    衡量蒸馏效果不能只看学生模型的最终准确率，一个成功的蒸馏应该是在保持高性能的同时实现了模型压缩和加速，所以需要从多维度综合评估。

    性能与泛化指标

    - 精度/准确率：最直接的指标，如Top-1/Top-5准确率、F1分数。但必须与从头训练（无蒸馏）的学生以及教师模型对比，才能看出蒸馏带来的净增益。

    - 泛化能力：观察学生在验证集和测试集上的表现差距。好的蒸馏能通过软标签的平滑效应起到正则化作用，从而缩小泛化差距。

    - 校准度：蒸馏常会改变模型的置信度分布。使用期望校准误差（ECE） 来衡量学生模型的预测概率是否与其实际准确率一致。一个成功的蒸馏应能保持或提升模型的校准度，而不仅仅是提高准确率。

    压缩与加速指标

    - 模型体积：参数量、模型文件大小（MB）。这是蒸馏最直接的压缩体现。

    - 推理延迟：在目标硬件（CPU/GPU/移动端）上的单次推理时间（ms）。这是业务部署最关心的用户体验指标。

    - 吞吐量：单位时间内可处理的样本数（samples/sec），衡量系统的整体效率。

    - 理论计算量：FLOPs，尤其对于卷积网络，能衡量模型的复杂度。

    知识迁移质量指标

    - 输出分布相似度：学生与教师在测试集上的平均输出概率分布的KL散度或Jensen-Shannon散度（JS散度）。这能直接量化学生模仿教师的程度。

    - 特征表示相似度：对于特征蒸馏，可通过中心核对齐（CKA） 或SVCCA等工具分析学生和教师中间层特征的相似性，评估过程性知识的传递效果。

    - 暗知识保留率：教师模型对于非正确类别的预测结构（如类别间相似性）是否被学生保留。可通过计算师生输出的软标签之间的秩相关性（Spearman相关系数）来评估。

    鲁棒性指标

    - 对抗鲁棒性：学生是否继承了教师的鲁棒性？可使用PGD、FGSM等对抗攻击进行测试。

    - 噪声鲁棒性：在输入加入高斯噪声或模糊等，观察性能下降幅度。这衡量了学生是否学到了教师更本质的特征，而非表面的统计捷径。

    总结：一个全面的蒸馏评估报告应包含精度、速度、模型大小、校准度以及师生分布相似度，并给出在具体业务场景下的ROI分析。

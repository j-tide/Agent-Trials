content:
  prompt: 蒸馏数据中是否应该包含教师模型的“错误”演示？为什么？
answer:
  mode: rubric
  reference_answer: |-
    应该，但必须以极其严谨、可控的方式包含，而不是随意加入。 这是一种高级的“反面教材”教学法。

    为什么需要包含错误演示？

    - 训练自我纠错能力：在数据中构造“犯错-自我发现-修正”的完整链条。例如：“用户：计算 15*3。助手：15*3=45。等等，我犯了一个错误，3乘5是15，1乘3是3，加起来的45。实际上是等于45。不对，等等，15*3=45... 非常抱歉，我刚才的思维混乱了。正确的计算是：10*3=30，5*3=15，30+15=45。答案是45，我的第一次计算其实是对的，但自我怀疑的过程展示了不稳定性。一个更好的例子是：15*3=35。等等，我算错了，应该是45。让我重新计算...”。关键：训练时必须对“错误回答”部分进行损失掩码（Loss Masking），将标签设为-100，只让学生学习“反思和修正”过程。

    - 强化安全边界：构造“模型错误地顺从了危险指令，随后自我纠正并拒绝”的示例。这能让学生学到“悬崖勒马”的能力。

    - 校准不确定性：展示“模型给出了一个看似自信但错误的回答，随后被事实核查并承认错误”的过程，能教会模型保持理智上的谦逊。

    为什么不能随意加入？

    如果不加掩码地训练，模型会忠实地学会那些错误的答案，这无疑是一种“数据投毒”。因此，错误演示必须是作为一种对比学习的“负样本”出现，其学习目标是识别并远离错误模式，而不是模仿错误。


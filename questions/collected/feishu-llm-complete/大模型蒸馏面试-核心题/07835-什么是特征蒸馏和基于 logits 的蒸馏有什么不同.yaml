content:
  prompt: 什么是“特征蒸馏”？和基于 logits 的蒸馏有什么不同？
answer:
  mode: rubric
  reference_answer: |-
    特征蒸馏（Feature Distillation） 是一种更细粒度的知识迁移方法。它不满足于只让学生模仿教师最后的输出，而是要求学生模型在某些中间层的特征表示（Feature Maps）也尽可能接近教师模型对应层的特征表示。

    与基于logits蒸馏的核心区别：

    [嵌入表格未展开]

    优势：特征蒸馏能够传递更丰富的中间层信息，有助于学生模型学习到更好的内部表征，往往能比仅用logits蒸馏取得更高的精度。挑战：需要解决特征维度不匹配的问题，通常需要通过1x1卷积或线性层进行投影，并且需要决定蒸馏哪些层。它和logits蒸馏可以结合使用，实现从输出到中间层的全方位知识迁移。

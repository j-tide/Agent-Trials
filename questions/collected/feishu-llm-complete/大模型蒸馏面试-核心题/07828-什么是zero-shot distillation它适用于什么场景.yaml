content:
  prompt: 什么是“zero-shot distillation”？它适用于什么场景？
answer:
  mode: rubric
  reference_answer: |-
    Zero-shot Distillation 是一种极端的蒸馏范式，它不需要任何来自目标任务的数据，仅依靠教师模型本身的知识来训练学生。换句话说，学生模型只通过与教师模型“问答”来学习，完全没有见过真实训练样本。

    实现方式：

    - 生成对抗蒸馏：使用一个生成器网络合成大量的虚拟样本，然后让教师为这些样本打上软标签，学生再用这些合成数据和软标签进行训练。

    - 知识图谱或规则生成：对于某些领域，可以通过预定义的知识图谱或逻辑规则，生成输入-输出对，再由教师标注。

    - 直接对学生参数进行全局优化：如DreamFusion中的方法，通过可微渲染器和冻结的教师模型，直接优化学生参数，而无需显式数据。

    适用场景：

    - 数据隐私或敏感场景：原始训练数据由于法规（如医疗、金融）或版权原因无法访问，但教师模型本身可以访问（例如，通过API调用黑盒模型）。

    - 数据稀缺：在一些极端长尾或新兴领域，根本没有足够的数据来训练模型，但存在一个强大的、相关的预训练教师模型。

    - 快速原型验证：在项目早期，想测试一个轻量学生模型的潜力，但还没有准备训练数据。

    挑战：生成数据的质量和多样性至关重要，如果生成的数据不能覆盖真实数据分布，学生模型将会有严重的偏差。

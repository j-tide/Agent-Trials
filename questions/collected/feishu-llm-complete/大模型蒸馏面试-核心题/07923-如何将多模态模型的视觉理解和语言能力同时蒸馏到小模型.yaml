content:
  prompt: 如何将多模态模型的视觉理解和语言能力同时蒸馏到小模型？
answer:
  mode: rubric
  reference_answer: |-
    要实现视觉理解与语言能力的同时蒸馏，需要构建统一框架，使小模型在学习语言生成的同时，内化视觉语义。方法体系如下：

    （1）端到端的指令跟随蒸馏（最主流）

    - 使用大模型构建一个包含图像-指令-回答的多样化数据集，涵盖描述、推理、OCR、常识等。

    - 微调小模型时，让其模仿完整的文本回答，由于回答本身嵌入了对图像的理解和语言表达，小模型在单任务生成中自然融合了两种能力。关键在于数据覆盖范围要广泛，促使模型学会语言与视觉的联合映射。

    （2）分离式模块蒸馏+融合训练

    - 分别蒸馏视觉编码器（通过匹配大视觉编码器的特征或输出）和语言解码器（通过文本生成损失）。

    - 然后训练一个轻量的视觉-语言连接器，使得蒸馏后的小视觉特征能够有效驱动小语言模型。连接器的训练使用来自教师模型的跨模态注意力分布或特征对齐损失，如对比学习或 Q-Former 式蒸馏。

    （3）联合特征蒸馏与序列蒸馏

    - 训练目标同时包括：

    [图片内容未导入]

    （4）利用视觉-语言对比与掩码建模

    - 在蒸馏数据中，加入对齐任务：让学生模型判断图像和文本是否匹配（ITM），或根据部分视觉 token 和文本预测被掩盖的视觉 token。这种预训练风格的辅助任务可以强化小模型内部的多模态融合能力。

    （5）知识三重蒸馏

    - 视觉知识：通过特征匹配将教师视觉 backbone 的知识传给小 backbone。

    - 推理知识：通过教师生成的思维链描述（比如“先看到一只猫，它在草地上……”），让学生学习视觉推理流程。

    - 语言风格知识：语言生成蒸馏中，维持教师多样化的描述能力。

    （6）动态训练策略

    - 先冻住视觉编码器，只训练连接器和语言部分进行图文对齐；解冻后整体微调，这时同时使用教师的回答作为软标签和硬标签，平衡视觉和语言的损失权重，确保两者同步提升。

    关键要点：数据中必须强制模型结合视觉信息才能正确回答，例如设计反事实样本（修改图像后答案变化），避免小模型仅凭语言偏见作答。这样才能保证视觉理解真正被蒸馏到，而不是沦为语言模型的“独角戏”。


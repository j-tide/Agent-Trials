  prompt: 如何处理学生和教师输出序列长度不一致的问题？
answer:
  mode: rubric
  reference_answer: |-
    这是一个在生成式模型蒸馏中非常常见，但常常被忽视的问题。由于教师和学生模型的tokenizer、配置（如max_length）或解码策略不同，它们对同一个Prompt生成的回答可能具有不同的序列长度。直接计算损失会遇到维度不匹配的错误。

    解决方案：

    - 最简单方案：强制截断或填充（Truncation & Padding）

    - 教师强制对齐策略（Teacher Forcing Alignment）：

    - 序列级别蒸馏（Sequence-Level Distillation）：

    实践中，方案1（配合Loss Masking）是最常用、最稳定的选择，因为它能无缝嵌入标准的SFT或蒸馏训练流程。


content:
  prompt: 白盒蒸馏中，是否应该冻结教师模型？为什么？
answer:
  mode: rubric
  reference_answer: |-
    通常应该冻结，且这是标准做法。 教师模型在白盒蒸馏中扮演着“知识金标准”的角色，其稳定性至关重要。

    必须冻结的原因：

    - 保证知识源的稳定性和一致性：如果教师模型在蒸馏过程中也参与更新，它的内部表示会不断变化。这就像学生在学习过程中，课本的内容在不断变化，会导致学生模型的学习目标漂移，训练过程极不稳定，难以收敛。

    - 防止“学生拖累教师”：联合更新时，教师也会受到学生反馈的影响（例如，通过一些相互学习的框架），这可能导致教师模型的能力退化，从而降低了知识源的上限。

    - 简化优化过程：冻结教师模型后，蒸馏问题变成了一个简单的“教师分布拟合”问题，优化目标明确且固定。如果教师也在更新，整个优化问题变成了一个复杂的、非平稳的双目标优化。

    不冻结的例外情况（在线蒸馏）：

    在在线蒸馏场景下，教师和学生是同时训练的，这时教师参数需要更新。但即便如此，也通常会采取措施来稳定教师，例如：

    - 使用指数移动平均（EMA） 来更新教师，使其变化平滑。

    - 让教师的损失权重更小，更新幅度更慢。

    - 采用深度相互学习框架，让多个模型互为师生，共同进步。

    但在绝大多数离线蒸馏场景中，冻结教师模型是保证训练稳定和效果的金科玉律。


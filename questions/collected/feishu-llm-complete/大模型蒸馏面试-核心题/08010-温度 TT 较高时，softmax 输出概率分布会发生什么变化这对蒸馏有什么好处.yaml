content:
  prompt: 温度 TT 较高时，softmax 输出概率分布会发生什么变化？这对蒸馏有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    当温度 T>1 时：

    - 概率分布变得更平滑、更均匀。原本很高的概率值会被压低，原本很低的概率值会被相对拉高。

    - 例如，logits为 [10, 2, -1]，在 T=1 时概率可能高度集中在第一个类别（接近1.0）；而当 T=5 时，概率分布可能变为 [0.6, 0.25, 0.15]，差异显著减小。

    对蒸馏的好处：

    - 揭示“暗知识”：高温度将那些原本被压制的非正确类别的微小概率放大。这些概率反映了教师模型对这些类别的相对偏好。例如，对于一张猫的图片，教师可能认为它有点像狗（5%概率），这体现了类别间的视觉相似性。这种信息无法从one-hot硬标签中获得。

    - 更丰富的监督信号：学生模型可以从软标签中学习到类别之间的相关性和相似性结构，这有助于提高泛化能力，减少过拟合。它相当于告诉学生：“这张图虽然是猫，但它也有点像狗，有点不像汽车”。

    - 训练更稳定：平滑的概率分布使得梯度更平缓，训练过程更稳定，对超参数的敏感性降低。

    温度选择：需根据教师和学生的容量差来调节。通常 T 在 2~20 之间。过高的温度会使概率过于均匀，失去区分性；过低的温度则接近硬标签，暗知识流失。最佳温度可通过验证集上的性能来确定。


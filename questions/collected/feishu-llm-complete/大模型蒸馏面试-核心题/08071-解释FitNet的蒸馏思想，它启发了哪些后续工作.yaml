content:
  prompt: 解释“FitNet”的蒸馏思想，它启发了哪些后续工作？
answer:
  mode: rubric
  reference_answer: |-
    FitNet是特征蒸馏领域的开山之作，它首次提出让学生模型的中间层特征直接去模仿教师模型中间层特征的思想。

    - 核心思想：FitNet认为，一个好的初始化对于训练深层网络至关重要。因此，它使用一个浅而宽的“教师”网络，其隐藏状态被认为包含了丰富的、可直接利用的知识。它通过一个线性投影层，让学生某一层的特征去拟合教师某一层的特征，损失函数为简单的MSE。这个蒸馏后的学生模型，被用作更深层网络的初始化，然后再进行常规训练。

    - 深远启发：FitNet打破了知识只能从最终输出传递的局限，为后续研究打开了“过程性知识”迁移的大门。它直接启发了以下工作：


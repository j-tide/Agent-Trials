content:
  prompt: 如何使用提示工程来提高教师模型生成蒸馏数据的质量？
answer:
  mode: rubric
  reference_answer: |-
    提示工程（Prompt Engineering）是与黑盒教师模型交互的唯一接口，其设计质量直接决定了生成数据的质量。

    高质量提示词的构建要素：

    - 清晰的角色定义（System Prompt）：明确告诉模型“你是谁”和“你应该怎么做”。例如：“你是一个知识渊博、逻辑严谨、且极其耐心的AI导师。你的任务是不仅给出正确答案，更要详细解释你的思考过程。你的回答应该结构清晰、易于理解，并且要主动指出可能的误区。”

    - 详细的指令描述（User Prompt）：指令本身要明确、具体，避免歧义。如果需要特定格式，必须给出清晰的模板或示例。

    - 注入行为准则：

    - Few-shot示例：在Prompt中提供1-3个高质量的输出示例。这是引导模型行为最有效的方式之一。示例告诉模型什么是“好”的回答。

    迭代优化：提示工程不是一次性的。我们需要根据教师模型的实际输出，不断分析其不足之处，然后针对性地修改Prompt，形成“分析-改进-再生成”的闭环。


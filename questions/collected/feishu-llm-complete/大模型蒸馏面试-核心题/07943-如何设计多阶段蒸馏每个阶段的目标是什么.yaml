answer:
  mode: rubric
  reference_answer: |-
    多阶段蒸馏通过在不同阶段引入不同的数据和蒸馏目标，系统性地提升学生模型能力。

    典型的多阶段设计：

    - 第一阶段：通用知识与能力蒸馏。

    - 第二阶段：领域与技能专项蒸馏。

    - 第三阶段：偏好对齐与安全蒸馏。


content:
  prompt: 蒸馏大模型时，小模型很容易遗忘通用知识，这种现象叫什么？如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    这种现象是灾难性遗忘在蒸馏场景下的加剧表现，有时也称为 “知识冲刷”。

    蒸馏时，教师提供的软标签是高度任务特定的。小模型为了最大化地拟合这些软标签，其参数更新会强力覆盖掉预训练阶段学到的通用语言或视觉知识。这导致学生在蒸馏后虽然在目标任务上表现不错，但在其他未见过的任务或常识性问题上能力严重退化。

    缓解策略：

    - 数据回放：在蒸馏训练过程中，混入少量预训练阶段的通用数据（如Wikipedia文本），让学生在模仿教师的同时，不忘复习旧知识。这相当于一个正则化项，强制学生保持原有的语言模型能力。

    - 使用预训练权重初始化学生：这是最根本的方法。让学生模型从已经具备丰富知识的预训练权重开始，而不是随机初始化。这样蒸馏就不再是“从零学习”，而是“在已有知识基础上进行微调”，能极大减少遗忘。

    - 调整损失函数：在蒸馏损失中加入一个与原始预训练模型（如果学生也是同一个预训练族）的KL散度正则项，约束学生不要偏离自己的预训练版本太远。这与RLHF中的PPO惩罚类似。

    - 师生联合训练：在蒸馏过程中，不仅让学生匹配教师，也同时让学生在原始的预训练任务（如MLM）上继续进行训练，实现多任务学习。

    - 针对性评估：在蒸馏过程中，持续在通用基准（如MMLU、HellaSwag）上评估学生，一旦发现分数显著下降，立即触发早停或调整蒸馏强度。


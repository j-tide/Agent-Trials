content:
  prompt: 如果教师模型和学生模型 tokenizer 不同，蒸馏时如何对齐 logits？
answer:
  mode: rubric
  reference_answer: |-
    这是一个极具挑战性、且通常应优先避免的问题。最彻底的解决方案是统一Tokenizer。 如果无法避免，则需要在无法完全对齐的情况下进行“有损”蒸馏。

    解决方案（按推荐优先级排序）：

    - 统一Tokenizer（最推荐）：在项目初期，选择模型时，应将“使用相同的Tokenizer”作为一项重要的选型标准。这是最根本、最彻底的解决方法。

    - 基于文本的Logits重新计算（次优）：

    - 动态规划对齐（工程复杂，效果存疑）：

    结论：如果在设计蒸馏方案时发现师生Tokenizer不同，应该立即停下来评估是否需要重新选择模型。强行对齐Tokenizer带来的工程复杂度和信息损失，远大于它可能带来的收益。


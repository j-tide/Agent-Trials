content:
  prompt: Vicuna的蒸馏数据和训练方式与Alpaca有哪些关键区别？
answer:
  mode: rubric
  reference_answer: |-
    Vicuna与Alpaca都是通过微调LLaMA模型得到，但在数据和训练方式上存在根本差异：

    [嵌入表格未展开]

    核心区别解析：

    - 数据的“真实性”鸿沟：这是最本质的区别。Alpaca的数据是由模型“想象”出来的，虽然多样，但终究是合成数据，与真实人类的提问方式存在分布偏差。Vicuna的数据来自ShareGPT.com上用户与ChatGPT的真实对话分享，这些数据包含了真实用户的口语化表达、多轮追问、指代消解、动态纠错等复杂交互模式，是机器合成数据难以企及的。

    - 单轮 vs 多轮对话能力：Alpaca的训练数据是独立的单轮问答对，因此它只能进行一问一答，没有记忆。Vicuna使用了完整的多轮对话历史进行训练，这使得Vicuna具备了强大的上下文理解和多轮对话能力，对话体验远胜Alpaca。

    总结：Alpaca是“实验室里的好学生”，Vicuna是“在社会里历练过的实干家”。Vicuna证明了，高质量的真实交互数据是提升对话模型体验的关键。

content:
  prompt: 对于同一个学生模型，使用不同教师模型蒸馏，如何排名？
answer:
  mode: rubric
  reference_answer: |-
    这是一个典型的多因素决策问题。对不同教师蒸馏出的学生模型进行排名，不能只看一个笼统的分数，而是需要建立一个分层的、可加权的评估矩阵。

    步骤：

    - 确定评估维度与权重：根据业务需求，列出评估的核心维度，并为每个维度设定重要性权重。例如：

    - 收集各维度的标准化得分：对每个学生模型，计算其在各维度上的得分。为了消除量纲差异，需要将得分进行标准化（例如，使用Min-Max标准化或计算Z-Score）。

    - 计算加权总分：将每个模型的标准化得分按照设定的权重加权求和，得到最终的综合得分，并进行排名。

    - 可视化分析：将结果绘制成能力雷达图。每个模型一条线，可以非常直观地看出不同教师赋予学生的“能力光谱”差异。例如，教师A蒸馏的学生在推理上特别强，但在安全上较弱；教师B蒸馏的学生则各项能力均衡。

    结论：排名不是目的，通过评估矩阵和雷达图，深刻理解不同教师模型的知识是如何塑造学生模型的能力结构，才是最终的价值。


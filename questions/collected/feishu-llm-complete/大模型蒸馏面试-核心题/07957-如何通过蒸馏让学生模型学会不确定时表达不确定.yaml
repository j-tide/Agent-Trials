content:
  prompt: 如何通过蒸馏让学生模型学会“不确定时表达不确定”？
answer:
  mode: rubric
  reference_answer: |-
    让学生学会“诚实地表达不确定性”，本质上是训练其在知识边界处输出特定的、低风险的文本模式，而不是被迫编造。这是解决“幻觉”问题、提升模型可信度的关键。

    蒸馏数据的设计是核心。我们需要在数据集中显式地、大量地包含教师在不确定时的正确示范。

    数据构造策略：

    - 构造“不可回答”的问题：专门生成一批超出知识范围、本身有误或需要预测未来的问题，例如：

    - 教师模型给出“不确定”的回答：对这些问题，要求教师模型给出诚实、有信息量且安全的回应，而不是生硬地说“不知道”。例如：

    - 数据配比与多样化：

    通过在海量蒸馏数据中“言传身教”，学生模型会将“不确定时表达不确定”内化为一种自然的生成策略，而不是记忆某个固定的拒绝模板。


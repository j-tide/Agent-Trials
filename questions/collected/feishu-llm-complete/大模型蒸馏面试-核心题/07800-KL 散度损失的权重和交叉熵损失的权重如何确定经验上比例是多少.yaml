content:
  prompt: KL 散度损失的权重和交叉熵损失的权重如何确定？经验上比例是多少？
answer:
  mode: rubric
  reference_answer: |-
    这两个权重的博弈，本质上是“向教师学习”与“向真实世界学习”之间的平衡。设蒸馏损失权重为 1−α，任务损失权重为 α。

    经验比例：

    - 常见范围：α 通常在 0.1 到 0.5 之间。最经典的配置是Hinton论文中的 α=0.1，即蒸馏损失占了90%的绝对主导权重。

    - 更深层的逻辑：为什么教师权重如此之高？因为硬标签提供的信息量极少（一个one-hot向量），而软标签提供了教师模型从海量数据中学到的、关于数据结构的丰富先验知识。拥抱教师的软标签，就是拥抱更强的正则化和泛化能力。

    动态权重与自适应策略：

    - 基于模型规模的调整：

    - 大容量学生：可以放心地使用较小的 α（如0.1），因为学生有足够的能力从软标签的丰富信息中提取精华。

    - 小容量学生：可能需要稍大的 α（如0.3），以避免被教师软标签中超出其理解能力的“高频噪声”所迷惑，导致过拟合。

    - 基于训练阶段的动态调整（课程学习思想）：

    - 训练初期：学生弱小，需要强监督。应使用更大的 α（如0.5），让硬标签快速引导学生进入正确的参数空间。

    - 训练后期：学生已有基础，需要学习泛化。此时减小 α（如0.1），将学习重点转向教师的软标签，进行精细的分布对齐。


content:
  prompt: 多教师蒸馏如何融合不同教师的知识？有哪些融合策略？
answer:
  mode: rubric
  reference_answer: |-
    多教师蒸馏旨在利用多个教师模型（可以是不同结构、不同任务专长、不同训练视角）的互补知识，指导学生模型。核心在于如何将多个教师的输出或特征融合成一个教学信号。

    主要融合策略：

    （1）输出层面（Logits / 概率）融合

    - 平均融合：对所有教师的 logits 或软化概率做算术平均，作为蒸馏目标。简单有效，适合教师能力相近的情况。

    [图片内容未导入]

    - 加权融合：根据教师在验证集上的准确率、置信度或与学生的匹配度动态分配权重。权重可以是固定的，也可以通过门控网络学习得到。

    - 投票/选择：对分类任务，可以取教师预测类别的众数作为硬标签，然后结合软平均；或直接使用投票分布作为软目标。

    - 逐样本选择最佳教师：根据每个输入样本，挑选对该样本最“权威”的教师（如置信度最高或特定领域专家），实现硬性切换融合。

    （2）特征层面的融合

    - 如果学生被要求匹配多个教师中间层的特征，可以：

    （3）损失级融合

    [图片内容未导入]

    - 权重可固定或学习。有时会加入一个正则项鼓励学生学到的融合表示一致。

    （4）分层或分阶段融合

    - 课程学习式：先用简单教师，再逐步引入强教师；或先匹配特征后匹配输出。

    - 任务分解：不同教师教授不同任务（如一个教分类，一个教相似度），学生多任务学习并融合共享表示。

    （5）对比学习式融合

    - 将教师的输出视为正样本锚点，使用对比损失拉近学生对教师的表示，同时推远与其他教师无关的负例，这可以隐式融合多教师知识。

    （6）知识重构融合

    - 训练一个轻量融合模块，输入所有教师的特征或logits，输出一个融合知识表示，然后学生蒸馏这个融合模块的输出。相当于用一个“元教师”融合。

    选择融合策略的关键因素：教师异质性、计算开销、学生与教师的容量差异。通常加权或平均 logits 融合已经能取得显著提升，特征融合能提供更丰富信号但工程更复杂。


content:
  prompt: 如何将大模型的推理能力蒸馏到小模型？仅靠软标签够吗？
answer:
  mode: rubric
  reference_answer: |-
    仅靠软标签（输出蒸馏）远远不够。 软标签只能传递“最终答案”的知识，而无法传递“如何得到答案”的思维过程。推理能力（如数学、代码、逻辑）的核心在于中间的推导步骤。

    要将推理能力蒸馏到小模型，必须使用思维链蒸馏和过程监督：

    - 思维链蒸馏：让大模型在回答推理问题时，显式输出其思维链（Chain-of-Thought），即分步推导过程。然后，将（问题， 思维链+答案）作为训练数据，用标准的语言模型训练损失（SFT）来训练小模型。这样，小模型学会的不仅是结论，更是生成中间推理步骤的能力。这是目前最有效的方法。

    - 过程奖励模型：训练一个专门的奖励模型，用于评估推理过程的每个步骤是否正确。在蒸馏时，可以用强化学习（RL）让学生模型生成推理链，然后由过程奖励模型打分，引导小模型学习正确的推理路径。

    - 多任务学习：将蒸馏任务与推理任务本身的监督学习结合。例如，在数学数据集上，同时计算蒸馏损失和答案的交叉熵损失。

    - 知识融合：将外部知识库（如数学公式库、代码文档）与蒸馏结合，让教师模型在生成推理链时引用这些知识，学生模型同时学习推理逻辑和知识检索。

    因此，一个完整的推理蒸馏方案是：使用大模型生成高质量思维链作为蒸馏数据，通过SFT训练小模型生成这些思维链，并可选的通过RL进行过程优化。 软标签在其中只起到辅助作用。


content:
  prompt: 联邦蒸馏（Federated Distillation）是什么？在数据隐私场景下如何应用？
answer:
  mode: rubric
  reference_answer: |-
    联邦蒸馏是一种结合联邦学习和知识蒸馏的分布式训练框架，旨在无需共享原始数据的情况下，利用多个客户端的本地模型知识来训练一个全局模型，同时保护数据隐私。

    核心思想：

    - 客户端各自用本地隐私数据训练本地模型（教师或学生）。

    - 不是传输模型参数或梯度，而是交换模型的输出知识（如 logits、软标签、特征表示、或生成的合成数据），然后服务器用这些知识蒸馏出全局模型，或者客户端之间相互蒸馏提升。

    典型应用场景：

    （1）同构联邦蒸馏

    - 服务器维护一个全局学生模型。每轮通信，服务器将全局模型分发给客户端。客户端用本地数据训练教师模型，然后在公共代理数据集（可无标签）上生成软标签，上传给服务器。服务器聚合所有软标签，用来蒸馏更新全局学生。

    - 优点：不需要客户端上传参数，数据不离开本地，软标签更难反推原始数据，隐私性更好。

    （2）异构联邦蒸馏

    - 各客户端模型结构可能不同，无法直接聚合参数。联邦蒸馏成为唯一可行方案。客户端利用本地教师生成蒸馏样本（可以是公共数据集上的预测），上传给服务器。服务器用这些样本训练一个新模型（或直接作为集成知识），再分发给客户端作为下一轮教师。这一过程称为 FedMD（Federated Model Distillation） 等。

    （3）利用生成数据进行无数据联邦蒸馏

    - 为防止使用公共数据集可能泄露分布信息，可采用生成对抗网络或扩散模型生成合成数据。客户端教师对此合成数据进行标注，上传软标签。服务器基于合成数据和聚合软标签蒸馏全局模型。全程没有任何真实数据上传。

    （4）个性化联邦蒸馏

    - 全局模型蒸馏融合各客户端知识后，再分发给客户端，客户端可以用本地数据对全局模型进行轻量微调，并用本地教师进行知识蒸馏，得到个性化模型。

    隐私优势：

    - 通信内容为模型输出，不包含原始数据，降低了隐私泄露风险。

    - 可以结合差分隐私进一步加噪，增强保护。

    挑战：

    - 需要设计合理的公共数据集或生成模型，保证其与各客户端数据分布相关，否则蒸馏效果不佳。

    - 通信开销可能较大（尤其是大logits维度）。

    联邦蒸馏在医疗、金融、IoT等隐私敏感领域，能够实现在不触碰数据的前提下聚合多方知识，训练出高性能模型。


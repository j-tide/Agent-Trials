content:
  prompt: 消融实验如何设计，以证明蒸馏信号（软标签）优于普通硬标签训练？
answer:
  mode: rubric
  reference_answer: |-
    这个消融实验的目的是剥离出“软标签”本身的独特贡献，排除数据规模等其他因素的干扰。

    实验设计：

    - 准备统一的数据集：使用教师模型，为一个大规模的指令集生成回答和完整的输出Logits（软标签）。

    - 定义实验组：

    - 严格控制变量：两组实验必须使用完全相同的学生模型初始化、优化器、学习率、Epoch、Batch Size等所有超参数。训练数据量也完全一致。

    - 多维评估与对比：

    - 结论：如果实验组B在泛化能力、校准度和鲁棒性上均显著优于实验组A，且两者数据量相同，那么就无可辩驳地证明了蒸馏信号（软标签）的价值超越了数据本身，它传递了更深层的结构化知识。


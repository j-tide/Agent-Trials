content:
  prompt: 生成对话数据时，如何模拟用户的不同提问风格？
answer:
  mode: rubric
  reference_answer: |-
    模拟用户真实提问风格的多样性，是防止对话模型过拟合到“标准书面语”、提升模型鲁棒性的关键。

    策略：

    - 在用户角色的Prompt中注入风格指令：在让教师模型扮演用户时，通过System Prompt详细定义该用户的“人物画像”。例如：

    - 后处理变换：对于已经生成的、风格标准的用户提问，可以使用一个轻量级的语言模型或规则脚本，进行风格迁移或注入噪声。例如：

    - 从真实数据中学习风格：收集少量真实用户在特定场景下的对话日志，提取其语言风格特征（如平均句长、高频词、礼貌程度等），然后将这些特征作为Prompt的一部分，指导教师模型生成风格相似的提问。

    核心：让学生模型在训练时就“见多识广”，习惯真实世界中用户提问的混乱和多样性，从而在实际应用中表现得更加鲁棒。


content:
  prompt: 伪标签蒸馏的基本思想是什么？在 LLM 时代如何应用？
answer:
  mode: rubric
  reference_answer: |-
    伪标签蒸馏的基本思想是：对于海量的、没有真实标签的数据，利用一个已有的、性能优异的模型（教师）为它们自动生成“伪标签”，然后将这些带有伪标签的数据与原始标注数据混合，用来训练一个新模型（学生）。

    在 LLM 时代的全新应用：这一思想在 LLM 时代得到了极大的拓展和升华。这里的“标签”不再仅仅是一个简单的分类ID，而是教师模型生成的完整文本回复。

    应用流程：

    - 收集无标签指令或文本：可以是从网络上爬取的各类文本、用户查询日志、或者由 Self-Instruct 生成的多样化指令。

    - 教师模型生成伪标签：将这海量无标签数据（指令或问题）输入给强大的教师模型（如GPT-4）。教师模型为每个输入生成一段高质量的、详细的回答。这段回答就是“伪标签”。

    - 构造训练数据集：将（指令/问题， 教师生成的回答）配对，形成一个大规模的SFT数据集。

    - 训练学生模型：使用这个数据集，通过标准的监督微调（SFT）来训练学生模型。学生的目标就是最大化地模仿教师在这些数据上的输出。

    这种方法的价值在于，它将昂贵的人工标注成本降为零，并且可以利用教师模型的强大能力来赋予学生模型原本可能不具备的技能（如复杂推理、创意生成等）。许多开源大模型（如Alpaca, Vicuna, Orca）本质上都是通过这种伪标签蒸馏方式从更强大的商业API模型中训练出来的。


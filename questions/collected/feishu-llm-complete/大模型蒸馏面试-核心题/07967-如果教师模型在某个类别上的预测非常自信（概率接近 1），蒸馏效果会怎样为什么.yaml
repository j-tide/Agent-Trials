content:
  prompt: 如果教师模型在某个类别上的预测非常自信（概率接近 1），蒸馏效果会怎样？为什么？
answer:
  mode: rubric
  reference_answer: |-
    如果教师模型对大多数样本的预测都非常自信（softmax输出尖锐，one-hot-like），蒸馏会退化，效果大打折扣，甚至接近直接用硬标签训练。

    原因：

    - 暗知识消失：当教师极度自信时，非正确类别的概率趋近于0，软标签与硬标签几乎无异。学生模型无法从中学到任何类别间相似性的信息，蒸馏损失几乎等同于硬标签损失。

    - 缺乏正则化：教师过拟合的自信会直接传递给学生，导致学生模型也趋向于过拟合，泛化能力变差。

    - 训练效率低：由于软标签信息量低，蒸馏损失对模型参数的约束减弱，学生模型需要更多迭代才能收敛，且最终性能可能还不如单独用硬标签训练。

    缓解措施：

    - 提高温度 T：在计算教师和学生的软标签时，使用更高的温度来“软化”教师输出，强制揭示暗知识。这是最直接的方法。

    - 教师模型校准：在蒸馏前对教师模型进行温度缩放（Temperature Scaling）校准，使它的预测概率更符合真实准确率，避免过度自信。

    - 使用中间层特征蒸馏：当输出层知识不足时，可结合教师中间层的特征表示进行蒸馏，传递更丰富的知识。

    自信过头的教师往往是不好的教师，一个“温和而包容”的教师（适当泛化）才是蒸馏成功的关键。


content:
  prompt: 如何利用教师模型的反事实生成来增强蒸馏数据？
answer:
  mode: rubric
  reference_answer: |-
    反事实生成是一种高级数据增强技术，旨在通过构造“如果...会怎样”的假设性样本，来提升蒸馏模型的鲁棒性、公平性和因果推理能力。在黑盒蒸馏中，我们利用教师模型来生成这些反事实样本。

    核心思想：不满足于仅仅模仿教师对已有数据的反应，而是创造一系列“反事实”场景，让学生模型学习到更深层的因果结构和决策边界。

    具体操作方法：

    - 反事实指令生成：对原始数据集中的一条指令，我们通过修改其中的关键元素，生成一个新的、假设性的指令。

    - 教师模型生成反事实回答：将这些反事实指令发送给教师模型，让其生成对应的、合理的回答。这一步至关重要，因为教师需要根据新的、假设性的条件进行推理和生成。

    - 构造增强数据集：将原始（指令，回答）对和反事实（指令，回答）对混合，形成最终的蒸馏训练集。

    为何有效？

    - 提升鲁棒性：学生模型通过对比原始和反事实样本，能更好地理解哪些因素是关键的、哪些是可以改变的，从而对输入扰动更加鲁棒。

    - 缓解偏见：通过交换敏感属性（如性别）并观察教师回答的变化，我们可以发现并修正教师模型可能存在的偏见。如果教师对“男护士”和“女护士”的回答存在刻板印象，我们可以大量生成反事实样本，强制学生在这些样本上学习无偏的回应。

    - 增强因果推理：反事实问题要求学生模型进行“假设性”思考，而不是仅仅回忆事实。这有助于激发模型的因果推理能力。


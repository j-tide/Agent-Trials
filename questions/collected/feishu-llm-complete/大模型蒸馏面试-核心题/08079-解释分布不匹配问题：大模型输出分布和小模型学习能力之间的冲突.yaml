content:
  prompt: 解释分布不匹配问题：大模型输出分布和小模型学习能力之间的冲突。
answer:
  mode: rubric
  reference_answer: |-
    分布不匹配本质上是一种表征能力与优化目标之间的根本性冲突。

    [图片内容未导入]

    这个冲突体现在：

    - 欠拟合：小模型无法达到大模型同样的函数复杂度。即使强行用KD损失去优化，学生模型也可能因为“智力上限”而永远无法完美拟合教师。这就像一个只用线性函数的学生去学习一个由高阶多项式定义的教师，无论怎么努力都有系统误差。

    - 过拟合教师的偏差：为了强行匹配教师复杂分布中的某些“尖峰”和“谷底”，小模型可能会过度调整其参数，导致其对训练数据中教师特有的偏差（而非真实规律）过拟合。这会严重损害学生模型的泛化能力。

    - 优化目标的扭曲：当学生无法完美拟合时，优化过程可能会被一些极难样本主导，这些样本上的较大误差会扭曲梯度方向，使得模型在其他更容易的样本上反而表现不佳。

    从几何角度看，大模型的决策边界复杂且不规则，而小模型的决策边界则趋于平滑和简单。蒸馏就是试图用简单的边界去逼近复杂的边界，这天然存在逼近误差。


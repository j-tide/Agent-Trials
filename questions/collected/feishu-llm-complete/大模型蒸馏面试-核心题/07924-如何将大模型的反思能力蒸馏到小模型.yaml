content:
  prompt: 如何将大模型的“反思”能力蒸馏到小模型？
answer:
  mode: rubric
  reference_answer: |-
    大模型的“反思”能力，即自我批评、发现错误并修正的能力，是其高级智能的重要体现。这种能力无法通过传统的Logits蒸馏传递，必须通过构造包含“反思轨迹”的蒸馏数据来实现。

    核心方法：将隐式的反思过程显式化为文本

    - 构造“错误-反思-修正”链数据：

    初步答案：... 然而，我仔细检查后发现，我在第二步的假设是错误的，因为... 让我重新计算。修正后的答案应该是...

    - 关键：Loss Masking：在训练学生时，必须对“初步答案”部分进行Loss Masking（设置为-100），只让学生学习“自我检查、批评和修正”的过程。这防止了学生学会错误的答案，而是学会了如何从错误中恢复。

    - 多轮对话反思数据：

    - 利用过程奖励模型进行强化学习蒸馏：

    本质：反思能力的蒸馏，是将教师模型如何监控和修正自身认知过程的“元认知”知识，通过显式的文本轨迹传递给学生。


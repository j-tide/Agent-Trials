content:
  prompt: 蒸馏后的小模型应该用哪些通用基准来评估？
answer:
  mode: rubric
  reference_answer: |-
    评估一个蒸馏得到的小模型，绝不仅仅是看它在某个单一指标上的表现，而是需要构建一个多层次、多维度、覆盖能力广度与深度的评估矩阵。一个完整的评估体系应包含以下几类基准：

    一、通用知识与语言理解基准

    这类基准用于衡量模型的基础语言能力和广博的世界知识，是模型智能的“底座”。蒸馏往往会导致知识的遗忘，因此这部分评估至关重要。

    - MMLU (Massive Multitask Language Understanding)：考察模型在57个学科（涵盖STEM、人文、社科等）上的零样本和少样本准确率。它主要衡量模型对事实性知识和基础理解能力的掌握程度。蒸馏后，MMLU分数的下降是灾难性遗忘的直接证据。

    - HellaSwag / ARC / WinoGrande：这三个基准主要考察常识推理能力。HellaSwag测试模型预测故事下文的能力，ARC则包含大量需要科学常识推理的复杂选择题。它们能揭示模型是否只学会了表面模仿，而丢失了深层推理能力。

    二、复杂推理与数学能力基准

    这类基准考察模型的高级认知能力，这是小模型最容易“失守”的领域。

    - GSM8K / MATH：数学应用题基准。GSM8K考察小学水平的数学文字题，要求多步推理。MATH则包含高中竞赛级别的题目，难度极高。这两者能很好地拉开模型间的推理能力差距。

    - BBH (Big-Bench Hard)：包含23个极具挑战性的任务，专门用于测试模型的复杂推理、规划和逻辑能力。

    三、指令遵循与对话能力基准

    这类基准考察模型将指令转化为行动的能力，是衡量模型“可用性”的关键。

    - IFEval (Instruction-Following Eval)：通过程序化验证，评估模型对25种可验证约束（如字数限制、格式要求、关键词包含/排除）的遵循率。

    - MT-Bench：通过GPT-4作为裁判，评估模型在多轮对话中的表现，重点关注模型的上下文记忆、对话连贯性和角色一致性。

    四、代码生成能力基准

    对于需要编码能力的模型，这是必测项。

    - HumanEval / MBPP：通过生成代码并执行单元测试，衡量模型的代码生成正确率。pass@k是核心指标。

    五、安全与对齐能力基准

    评估模型是否安全、无害。

    - ToxicChat / HarmBench：评估模型对不安全请求的拒绝率，以及是否会产生有害内容。

    - TruthfulQA：专门测试模型是否会因为模仿互联网上的错误信息而产生幻觉或错误回答。

    评估策略：在一个完整的蒸馏模型报告中，应该包含上述至少五个类别中的代表性基准，并清晰地展示蒸馏前（教师模型）和蒸馏后（学生模型）在每个维度上的得分变化，绘制成雷达图，以直观地揭示能力的变化。


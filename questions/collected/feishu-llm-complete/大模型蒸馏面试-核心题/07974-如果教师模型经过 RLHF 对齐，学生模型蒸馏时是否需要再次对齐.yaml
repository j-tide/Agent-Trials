content:
  prompt: 如果教师模型经过 RLHF 对齐，学生模型蒸馏时是否需要再次对齐？
answer:
  mode: rubric
  reference_answer: |-
    通常需要，或者至少需要采取强有力的补充措施。 这是因为RLHF对齐的能力是脆弱的，在蒸馏过程中极易丢失。

    原因：蒸馏是一个有损压缩过程，会优先保留教师在主流能力（如有用性）上的知识，而安全、诚实、无害等对齐属性，往往因为信号不够强（在数据中占比小）而被“遗忘”或“覆盖”。

    如何决策和操作：

    - 蒸馏数据中保留充分的对齐样本：在构造蒸馏数据集时，必须显式地、有意识地保留大量与安全、无害相关的对话数据（如拒绝回答、表达不确定性等）。这是第一道防线。

    - 使用对齐过的教师生成蒸馏数据：教师模型本身已经对齐，它生成的数据（如安全回答）本身就是对齐的示范。直接用这些数据做SFT，本身就是一种对齐。

    - 蒸馏后进行轻量级的安全微调（最推荐）：这是最保险、最有效的方法。在蒸馏得到一个性能不错的基座学生后，使用一个高质量的人类偏好安全数据集（如Anthropic的HH-RLHF），对学生进行一次独立的、短暂的DPO训练。这能将安全对齐能力“注入”到学生模型中，而不会显著影响其基础能力。

    - 必要性测试：在蒸馏后，使用安全对抗测试集（如ToxicChat）对学生进行评估。如果发现学生的安全拒绝率显著低于教师，则必须进行第3步的后对齐。

    结论：不要指望RLHF对齐能100%通过蒸馏传递。最务实的做法是将其视为一个独立的任务，在蒸馏后进行有针对性的微调。


content:
  prompt: Hinton提出的蒸馏框架中，损失函数由哪两部分组成？各自的目的是什么？
answer:
  mode: rubric
  reference_answer: |-
    Hinton提出的经典蒸馏总损失是软目标损失（蒸馏损失）和硬目标损失（学生损失）的加权组合：

    [图片内容未导入]

    - 软目标损失（蒸馏损失）：计算学生模型的输出（使用高温 T 的softmax）与教师模型的输出（同样使用温度 T 的softmax）之间的差异，通常使用KL散度。目的是让学生模型学习教师模型输出的类别间相似性（暗知识）。这一项驱动学生去模仿教师的泛化行为。

    - 硬目标损失（学生损失）：学生模型输出（使用标准温度 T=1 的softmax）与真实硬标签之间的交叉熵。目的是让学生模型能够正确拟合训练数据的真实标签。这一项起到强监督的作用，防止学生完全被教师带偏，特别是当教师在某些样本上可能出错时。

    为什么需要两部分？
    软目标损失提供了丰富的结构信息，但完全依赖教师模型可能会放大其偏差（教师也可能犯错）。硬目标损失则确保了学生模型对真实世界的对齐，起到了正则化和校准的作用。两者结合使蒸馏更加鲁棒，在实际中通常令 α 较小（如0.1），即主要依赖软目标（权重0.9），少量结合硬目标。


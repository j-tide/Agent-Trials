content:
  prompt: 在蒸馏多语言模型时，如何平衡各语言的能力？
answer:
  mode: rubric
  reference_answer: |-
    多语言蒸馏最大的挑战在于灾难性遗忘——在强化一种或几种主要语言（尤其是英语）能力时，极易牺牲低资源语言（LRLs）的性能。平衡各语言能力，需要从数据和训练策略两个层面进行精细调控。

    一、数据层面的平衡策略

    [图片内容未导入]

    - 当 α=0α=0 时，所有语言被等概率采样，实现完全均衡。

    - 当 α=1α=1 时，按原始数据比例采样。

    - 实践中，αα 通常取0.3-0.7，既提升了低资源语言的曝光度，又防止其过拟合。

    - 数据增强与回译：对于低资源语言，使用机器翻译（回译）技术，将高资源语言的高质量指令-回答对翻译过来，再经过母语者校验，以扩充其数据量。

    - 平行语料的构造：为同一任务构造多语言平行版本（即同一指令的多种语言表达）。这能帮助模型在训练中自然建立起跨语言的任务语义映射，促进从高资源到低资源语言的能力迁移。

    二、训练策略层面的平衡策略

    - 分阶段课程蒸馏：

    - 动态调整采样权重：在每个训练Epoch结束时，在独立的各语言验证集上评估模型性能。对于性能下降明显的语言，在下一轮训练中动态提高其数据的采样权重；对于性能已饱和的语言，适当降低其权重。

    - 损失加权：在训练时，可以为不同语言的样本赋予不同的损失权重。低资源语言样本的损失权重可以适当调高，以强调其重要性。

    - 使用多语言教师：选择一个在多语言任务上本身表现就很均衡的模型作为教师，是保证学生能力均衡的基础。


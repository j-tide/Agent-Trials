content:
  prompt: 如何评估蒸馏数据质量对最终性能的影响？
answer:
  mode: rubric
  reference_answer: |-
    评估数据质量的影响，就是量化“垃圾进，垃圾出”在蒸馏中的具体表现。这需要通过消融实验和数据质量分层的对比来实现。

    实验设计：

    - 构建不同质量的数据子集：

    - 控制数据量一致：为了公平对比，确保高质量子集和低质量子集拥有相同的样本数量。

    - 执行蒸馏并对比：使用相同的模型和超参数，分别用这三个数据集进行蒸馏训练。然后，在独立的测试集上对比三个模型的性能差距。性能差距，就是“数据质量”这项因素的量化价值。

    高级分析：可以绘制“数据质量分数-模型性能”曲线。观察性能随数据质量分数变化的规律，找到那个边际收益开始递减的“临界质量点”。这能指导我们在实际工程中，只需将数据清洗到这个临界点即可，避免不必要的投入。


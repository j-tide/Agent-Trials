answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    在PyTorch中，标准实现如下：

    import torch.nn.functional as F

    loss_kd = F.kl_div(
        F.log_softmax(student_logits / T, dim=1),   # 输入为对数概率
        F.softmax(teacher_logits / T, dim=1),       # 目标为概率
        reduction='batchmean'
    )
    # 为了保持梯度大小与不使用温度时相当，通常乘以 T^2
    loss_kd = loss_kd * (T * T)


content:
  prompt: 如何设计一个端到端的模型压缩流水线，同时使用剪枝、量化和蒸馏？
answer:
  mode: rubric
  reference_answer: |-
    设计这样一个流水线，核心是遵循从结构到能力，再到精度的优化顺序，使得每一步都在前一步的基础上发挥最大效用。

    推荐顺序：结构化剪枝 → 蒸馏微调 → 量化感知训练（QAT）+ 蒸馏

    具体流程如下：

    - 第一阶段：结构精简（结构化剪枝）

    - 第二阶段：能力恢复与增强（蒸馏微调）

    - 第三阶段：精度压缩（量化感知蒸馏）

    重要注意事项：

    - 跳过低效组合：不要在结构化剪枝前进行非结构化剪枝或量化，因为结构化剪枝会直接改变模型尺寸，使得之前的操作需要重新进行。

    - QAT是最终步骤：量化一定要放在最后。因为QAT会将量化噪声引入训练，如果放在前面，会干扰剪枝和蒸馏的效果。

    - 全程数据保持：整个流水线应使用相同的训练或微调数据集，以保证知识传递的一致性。

    通过这个精心设计的流水线，我们可以将一个庞大的原始模型，一步步“雕琢”成一个在能力、体积、速度三个维度上都达到极致平衡的、适合生产环境部署的终极模型。


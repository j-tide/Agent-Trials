content:
  prompt: 知识蒸馏如何实现模型压缩？它和剪枝、量化有哪些互补关系？
answer:
  mode: rubric
  reference_answer: |-
    知识蒸馏实现模型压缩：通过训练一个参数量更小的学生模型，使其性能逼近大容量教师模型。最终部署的是轻量化的学生模型，从而减少存储、降低推理延迟、节省能耗。

    与剪枝、量化的互补关系：

    这三种技术作用于模型压缩的不同维度，且可以协同使用，实现乘数效应。

    - 剪枝：移除模型中不重要的连接（非结构化）或整个通道（结构化），直接减小模型的参数量和计算量。剪枝后模型通常需要微调来恢复精度。

    - 量化：将浮点权重和激活值转换为低精度（如INT8）表示，减小模型体积并利用整数运算加速推理。

    - 蒸馏：通过知识迁移来训练一个本质上学得更好的轻量模型，它可以在不改变模型物理结构的情况下提升小模型的性能上限。

    协同方案：

    - 蒸馏 + 剪枝：先用大模型作为教师，训练一个学生模型；然后对这个学生模型进行结构化剪枝，进一步减小其尺寸，最后再用教师或原模型进行蒸馏微调来恢复精度。

    - 量化 + 蒸馏：训练学生模型时，使用量化感知训练（QAT）的伪量化节点，这样学生模型就具备了对量化噪声的鲁棒性。或者直接蒸馏一个量化后的小模型。

    - 三者结合：先蒸馏出一个小模型，再剪枝，最后量化。每一步都可在前一步的基础上进一步提升压缩率，同时通过知识蒸馏来补偿精度损失。

    因此，它们是互补增强的关系，而非相互排斥。现代模型优化通常采用这种多阶段的组合策略。


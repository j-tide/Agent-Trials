content:
  prompt: 解释TinyBERT的两阶段蒸馏：通用蒸馏和任务蒸馏。
answer:
  mode: rubric
  reference_answer: |-
    TinyBERT通过一个精巧的两阶段蒸馏框架，成功地将BERT-base的知识迁移到一个极小的学生模型中。

    第一阶段：通用蒸馏

    - 目标：让学生模型学习教师模型在通用领域上的基础语言能力和知识。这个阶段不依赖于任何特定的下游任务。

    - 数据：使用大规模的通用无标签文本语料（如Wikipedia和BookCorpus的混合）。

    - 蒸馏知识：在这个阶段，TinyBERT进行全面的白盒蒸馏，同时使用三种监督信号：

    - 产出：一个具有扎实通用语言基础能力的TinyBERT学生模型。

    第二阶段：任务蒸馏

    - 目标：在通用蒸馏的基础上，让学生模型适应特定的下游任务（如情感分类、问答），并学习教师模型在解决该任务时的特定行为模式。

    - 数据：使用特定下游任务的任务增强数据。TinyBERT会对任务数据进行数据增强（如替换同义词），以增加数据的多样性和难度。

    - 蒸馏知识：在这个阶段，TinyBERT会再次进行全模块蒸馏。它使用任务数据，计算学生和教师在嵌入层、所有Transformer层以及预测层的输出之间的差异，并用这些差异作为辅助损失。

    - 核心创新：第二阶段不是从零开始，而是在第一阶段训练好的通用模型基础上，复现了教师模型在特定任务上的完整思考过程，从而实现了高效的任务适配。


content:
  prompt: 在资源有限时，如何设计一个轻量级评估体系，快速筛选最优蒸馏方案？
answer:
  mode: rubric
  reference_answer: |-
    资源有限时，必须放弃“大而全”的理想评估，转而采用分级、聚焦、低成本代理的快速筛选策略。

    轻量级评估体系设计：

    - 构建微型核心探针集（~100-200条）：从你的测试集中，精选出最能反映核心业务能力、最容易暴露模型缺陷的少量样本。这个迷你集应在几分钟内跑完，作为每次训练的“快速体检”项目。

    - 聚焦“回归”能力：评估的主要目的不是和SOTA模型比，而是确保新模型不比旧模型差。重点维护一个“回归测试集”，包含旧模型已知的Bad Cases。只要新模型在这些case上不恶化，就通过初筛。

    - 使用轻量级评判模型：用GPT-4作为裁判成本高昂。对于很多任务，可以训练或使用一个7B级别的小模型作为评判者。例如，用LLaMA-3-8B-Instruct来对回答进行流畅度、相关性的打分。虽然不如GPT-4精准，但趋势是可靠的，且成本几乎为零。

    - 规则优先于模型评判：对于所有可以程序化验证的指标（格式、字数、关键词、数学答案），优先使用规则。只有在规则无法覆盖的软技能上，才动用模型或人工。

    - 关键checkpoint的生成式抽样评估：在整个训练过程中，只对最重要的几个checkpoint（如验证损失最低点、训练结束点）进行小批量的人工评估或GPT-4评估。日常监控依靠Loss曲线和探针测试集。


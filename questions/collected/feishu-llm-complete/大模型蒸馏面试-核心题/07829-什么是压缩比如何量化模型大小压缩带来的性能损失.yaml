content:
  prompt: 什么是“压缩比”？如何量化模型大小压缩带来的性能损失？
answer:
  mode: rubric
  reference_answer: |-
    压缩比 是衡量模型压缩（如蒸馏）效果的一个基础物理指标，它量化了模型在体积上的“瘦身”程度。然而，单纯的体积压缩并非目标，我们需要将性能损失与压缩比结合起来，才能全面评价一个蒸馏方案的优劣。

    - 压缩比的定义：

    - 压缩比=教师模型参数量学生模型参数量压缩比=学生模型参数量教师模型参数量

    - 例如，将一个70B参数的模型蒸馏到7B，压缩比就是10倍。

    - 量化性能损失：
    性能损失不是单一的，需要从多维基准中综合计算。一个常用的方法是计算能力保持率或性能下降率。

    - 性能下降率=1−学生在某基准上的得分教师在该基准上的得分性能下降率=1−教师在该基准上的得分学生在某基准上的得分

    - 对于多个基准，可以计算加权平均性能下降率。权重根据各项能力在业务中的重要性来设定。

    - 解读“压缩-性能”的权衡：

    关键：不要孤立地看压缩比或性能损失。必须将它们放在一起，并结合业务SLO（如推理延迟、成本）进行综合判断。


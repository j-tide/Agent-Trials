content:
  prompt: 如何检测和过滤教师模型生成内容中的幻觉，以提高蒸馏数据质量？
answer:
  mode: rubric
  reference_answer: |-
    这是上一问题的工程化细节，具体方法包括：

    - 基于自然语言推理（NLI）的检测：
    将教师生成的陈述分解为原子事实，并使用一个预训练的NLI模型判断该陈述是否能从给定的上下文或可信知识源中推理得出。如果无法蕴含，则标记为潜在幻觉。

    - 搜索引擎交叉验证：
    将教师回答中的关键实体和声明拼接成搜索查询，调用Google/Bing等搜索引擎，然后对比搜索结果中的高权威来源（如维基百科）与教师陈述的一致性。不一致的样本直接丢弃。

    - 自我一致性过滤：
    对同一个提示，让教师模型以较高温度生成多条回答。计算这些回答之间的事实一致性（可使用BERTScore、BLEU等）。如果多次回答间事实互相矛盾，说明该样本是不确定的、充满幻觉的，应剔除。

    - Token-level不确定性过滤：
    分析教师模型在生成每个Token时的预测概率。如果整个序列的平均概率（或PPL）异常高，或者序列末尾的概率突然崩溃，通常预示着模型在“胡编”。可以通过统计建模设定阈值来过滤。

    - 基于特定领域的规则校验：
    对于医疗、法律、代码等高风险领域，可以编写专门的规则或利用知识图谱进行校验。例如，代码可以通过编译器检查语法和基本逻辑。

    通过上述多种方法的组合管道，可以构建一个高质量的、几乎“无幻觉”的蒸馏数据集，从源头保证学生模型的知识纯度。


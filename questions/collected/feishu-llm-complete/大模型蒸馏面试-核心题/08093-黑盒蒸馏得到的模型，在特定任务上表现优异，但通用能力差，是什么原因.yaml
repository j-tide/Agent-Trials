content:
  prompt: 黑盒蒸馏得到的模型，在特定任务上表现优异，但通用能力差，是什么原因？
answer:
  mode: rubric
  reference_answer: |-
    这是典型的灾难性遗忘在蒸馏场景下的体现，也被称为 “领域过拟合”或“能力坍缩”。主要原因如下：

    - 蒸馏数据分布的狭窄性（Distributional Narrowing）：用于蒸馏的指令-回答数据集，如果绝大部分都集中在特定领域（如医疗问答），那么模型在训练时就会将参数强力拉向这个狭窄的分布，迅速遗忘在预训练阶段学习的广泛世界知识、常识推理、多语言能力等通用能力。

    - 缺乏“通用能力锚定”数据：蒸馏数据中完全没有或极少包含那些不针对特定任务的通用对话数据（如闲聊、简单知识问答、推理等）。模型在学习新知识时，没有来自通用数据的梯度信号来“提醒”它保留原有的能力。

    - 过度训练（Over-training）：在领域数据上训练了过多的Epoch，导致模型对领域数据过拟合，而对分布外的通用数据泛化能力急剧下降。

    解决措施：

    - 数据混合（Data Mixing）：在蒸馏数据中，必须混入10%-20%的高质量通用指令数据。这些数据是“记忆锚点”，能有效减缓遗忘。

    - 早停与监控（Early Stopping & Monitoring）：在蒸馏训练过程中，持续在通用基准（如MMLU、HellaSwag）上评估模型。一旦发现通用能力分数出现不可逆转的下降，立即停止训练，回滚到最佳检查点。

    - 课程学习（Curriculum Learning）：先使用通用数据训练，让学生打好基础；再加入领域数据，进行专项强化。


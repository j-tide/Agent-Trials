content:
  prompt: 知识蒸馏和迁移学习有什么区别和联系？
answer:
  mode: rubric
  reference_answer: |-
    联系：两者都属于利用已有知识来帮助新任务或新模型训练的范式，都涉及“知识传递”。

    区别：

    [嵌入表格未展开]

    举例：

    - 蒸馏：用BERT-Large（教师）蒸馏DistilBERT（学生），在同一个文本分类数据集上训练。

    - 迁移学习：将ImageNet预训练的ResNet-50迁移到医学图像分类任务，去掉最后的全连接层，微调其余部分。

    两者可以结合：例如，先用预训练的教师模型进行蒸馏初始化学生，然后再在目标任务上进行微调，这实际上是一种带蒸馏的迁移学习。


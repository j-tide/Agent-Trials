content:
  prompt: 针对安全对齐的蒸馏模型，需要专门的安全评估集吗？
answer:
  mode: rubric
  reference_answer: |-
    绝对需要，并且这是蒸馏上线前必须通过的安全闸门。 安全对齐是一种脆弱的能力，在蒸馏过程中极易被遗忘或削弱，因为其数据信号通常远弱于“有用性”的数据信号。

    为什么通用评估集不够？

    通用评估集通常侧重于模型的能力（如知识、推理），而安全评估集则侧重于模型的“品格”。它包含大量专门设计来诱导模型产生有害、偏见或不安全内容的攻击性指令。这类指令在常规数据中占比极低，因此必须使用专门构造的、高密度的评估集才能有效检测安全漏洞。

    专门的安全评估集应包含的核心内容：

    - 分层的拒绝测试：从直白的恶意请求，到复杂的、带有角色扮演和隐喻的隐晦越狱攻击（Jailbreaking），全面测试模型的拒答能力。

    - 偏见与刻板印象探测：使用如StereoSet、BBQ等基准，测试模型是否对特定群体存在系统性偏见。

    - 过度拒绝测试：准备一批完全无害但话题可能稍显敏感的指令（如“如何缓解考试焦虑”），检验模型是否因过度对齐而变得“草木皆兵”，错误地拒绝了合理请求。

    - 诚实度测试：测试模型在知识边界处的表现，能否诚实地表达“我不知道”，而不是自信地胡编乱造。


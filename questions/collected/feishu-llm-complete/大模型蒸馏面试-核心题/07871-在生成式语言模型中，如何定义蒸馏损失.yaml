content:
  prompt: 在生成式语言模型中，如何定义蒸馏损失？
answer:
  mode: rubric
  reference_answer: |-
    结合上一问，更具体地阐述几种常用的损失函数定义：

    - 词级别KL散度损失（Token-Level KLD）

    [图片内容未导入]

    - 序列级别知识蒸馏（Seq-KD）

    - 伪标签方法：教师对大量无监督数据进行束搜索（Beam Search）生成高质量的伪标签（即完整文本），然后学生用标准交叉熵损失拟合这些伪标签，就如同监督微调（SFT）一样。这是目前大模型压缩（如TinyLLaMA、Gemma等）的主流手段。

    - 强化学习：学生模型生成序列，用一个奖励函数（如与教师生成序列的相似度）来打分，然后通过PPO等算法优化。这能处理不可微的序列级指标（如BLEU）。

    - 全局蒸馏（Universal Distillation）

    结合词级和序列级损失，并可能加入中间层的特征蒸馏（如注意力矩阵的KL散度）。例如，Distilled GPT-2就使用了词级蒸馏。LLaMA-2的蒸馏则主要依靠大量高质量的合成数据（伪标签）进行SFT。

    - 基于Top-K的稀疏蒸馏
    在每一步，只考虑教师概率最高的 K 个token，将学生的logits与教师对这 K 个token的概率进行KL散度计算。这大幅降低了计算成本，且经验上对性能影响不大。

    在实际的LLM蒸馏中，伪标签SFT因其简单高效而更受欢迎，而词级KL散度则常用于辅助。选择哪种损失取决于任务、师生模型结构以及计算预算。

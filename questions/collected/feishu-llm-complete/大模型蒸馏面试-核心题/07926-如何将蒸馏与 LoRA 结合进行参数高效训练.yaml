content:
  prompt: 如何将蒸馏与 LoRA 结合进行参数高效训练？
answer:
  mode: rubric
  reference_answer: |-
    将蒸馏与LoRA结合（称为LoRA-Distill），是目前最主流的LLM参数高效蒸馏范式，操作流程如下：

    - 加载基座模型：加载一个强大的预训练模型（如LLaMA-7B）。不要使用已微调的对齐模型，因为它的输出分布可能已被“扭曲”，不利于蒸馏。

    - 配置LoRA：通过PEFT库，在模型的注意力层（Q, K, V, O）注入LoRA适配器。这是可训练部分。

    - 设计蒸馏损失：由于基座被冻结，Logits蒸馏（KL散度）和任务损失（交叉熵）直接作用在最终输出层。如果进行白盒蒸馏，可以将教师和学生的中间特征映射到同一空间，然后计算MSE损失。此时特征损失的梯度只会更新LoRA参数。

    - 训练与优化：使用AdamW优化器，仅优化LoRA参数和新增的投影层参数。使用标准的学习率（如1e-4）进行训练。

    核心优势：在这种范式下，蒸馏的绝大部分计算和显存开销仅来自教师模型的一次性前向传播，学生端的训练极其轻量，使得在消费级显卡上蒸馏大模型成为可能。


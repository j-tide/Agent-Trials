content:
  prompt: 在知识蒸馏中，为什么有时会使用无标签数据进行增强？
answer:
  mode: rubric
  reference_answer: |-
    在知识蒸馏中，使用无标签数据（即不需要真实标签的数据）是一种强大的数据增强手段。其核心原理在于：教师模型本身就是一个强大的标签生成器。

    - 扩充训练集：对于任何无标签的数据样本，教师模型都可以为之生成一个高质量的软标签。这些软标签包含了教师的暗知识，可以直接用于蒸馏损失的计算。这样，即使没有硬标签，学生模型也能从海量无标签数据中学习教师的行为。

    - 增强泛化能力：利用更广泛、更多样的无标签数据（例如，从互联网抓取的文本或图像），可以让教师模型在更广阔的分布上指导学生，从而显著提升学生模型的泛化性和鲁棒性。

    - 半监督场景：当标注数据稀缺时，可以同时使用少量有标签数据（计算硬目标损失）和大量无标签数据（仅计算蒸馏损失），实现半监督学习。

    注意：无标签数据的分布应与目标任务相关，否则教师生成的标签可能不准确，反而误导学生。

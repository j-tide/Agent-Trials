content:
  prompt: 在蒸馏过程中，如何动态调整不同蒸馏信号的权重？
answer:
  mode: rubric
  reference_answer: |-
    动态调整蒸馏信号的权重，本质上是让优化过程从“多目标均衡”走向“课程式引导”，在不同训练阶段聚焦不同的学习重点。实现这一点，主要有以下几种策略：

    - 基于训练进度的启发式调整

    这是最常用且效果稳健的方法，其核心是模拟课程学习，让学生先“站稳”，再“求精”。

    - 任务损失与蒸馏损失的权重 (αα) 的调整：

    - 特征蒸馏损失权重 (γγ) 的调整：
    特征蒸馏是一种极强的约束。初期可以利用它快速构建学生的内部表征，但后期必须“放手”。

    - 基于梯度范数的自适应平衡

    这是一种更工程化、更自动的方法，旨在解决不同损失函数量级不匹配导致的训练失衡问题。

    - 核心思想：在每次反向传播前，分别计算各项损失对模型共享参数（如底层）的梯度L2范数。如果某项损失的梯度范数远大于其他，说明它正在“主导”更新，可能压制其他学习目标。

    - 调整策略：可以动态调整各项损失的权重，使得它们的梯度范数保持在一个相近的量级。或者，更直接地，使用GradNorm（梯度归一化）算法，自动学习各项损失的权重，使得所有任务以相近的速度学习。

    - 基于验证集性能的反馈调整

    在训练过程中，持续监控学生模型在独立验证集上的表现。

    - 当某项能力不足时：如果发现学生模型在某个特定任务（如安全拒绝）上表现持续不佳，而该任务对应的蒸馏数据权重不够，可以针对性地手动调高该类数据或该部分蒸馏损失的权重，进行“补强”。

    - 当出现过拟合迹象时：如果发现学生模型在验证集上的表现开始下降，而训练集上的损失仍在降低，说明过拟合。此时可以调高蒸馏损失权重（软标签），利用其强正则化作用来对抗过拟合。


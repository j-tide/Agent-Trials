content:
  prompt: 在无法获取模型内部参数和 logits 的情况下，如何进行蒸馏？
answer:
  mode: rubric
  reference_answer: |-
    在完全黑盒的场景下，我们只能通过API获得教师模型生成的文本。此时，蒸馏的核心策略是：利用教师模型生成大规模、高质量、多样化的文本数据，然后以这些数据作为“黄金标准”，通过监督微调（SFT）来训练学生模型。 整个过程可以看作是一种高级的“伪标签”技术，但其数据生成过程远比简单的标注复杂。

    具体流程：

    - 指令生成（可选）：准备一个种子指令池，或者由人工构造。这些指令是开放域的，代表了我们希望学生模型学会的任务类型。

    - 教师模型生成回答：对于每条指令，调用教师模型API，让其生成详细的回答。为了传递更深层的知识，我们通常会在指令中要求教师模型显式地输出其思维链或推理步骤。例如，在提示词中加入：“请一步一步思考，并给出详细的推理过程”。这样，教师的输出就从单纯的“答案”变成了“思考过程+答案”。

    - 构建训练数据集：将收集到的（指令，教师回答）对整理成标准的监督学习格式。这里，教师的回答就是学生模型要模仿的“硬标签”。

    - 监督微调学生模型：使用标准的语言模型训练损失（交叉熵），在学生模型上拟合这个数据集。学生模型通过学习模仿教师的文本输出，间接地习得了教师的知识和推理模式。

    这种方法的有效性高度依赖于教师模型生成数据的质量、多样性和复杂性。它绕过了对 logits 的直接拟合，转而让学生模型在生成文本的因果链上逼近教师。


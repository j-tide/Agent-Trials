content:
  prompt: 合成数据与真实数据在蒸馏中的最优比例如何确定？
answer:
  mode: rubric
  reference_answer: |-
    合成数据与真实数据的混合比例是影响蒸馏效果的关键因素，并不存在一个普适的固定最优值，但可以通过以下系统性方法和原则确定。

    确定最优比例的策略：

    （1）任务依赖与小规模扫参

    - 在目标任务的少量真实数据上，按不同比例混合（如 100% 合成, 70/30, 50/50, 30/70, 100% 真实），分别训练学生模型，评估其性能。通常在计算允许下进行网格搜索或贝叶斯优化。

    - 会观察到一个“最佳混合区”，多数研究显示：合成数据占比在 50%~80% 时能大幅提升性能，再高可能出现合成分布偏差导致的过拟合。

    （2）动态比例调整（课程学习）

    - 训练初期使用高比例真实数据打牢语言基础和事实准确性；中期逐渐增加合成数据占比，注入推理技能和多样性；后期再适当降低合成比例并辅助真实数据进行微调，实现“真实-合成-真实”的三阶段课程。比例变化可线性、余弦或基于验证困惑度自适应。

    （3）基于数据质量的自适应权重

    - 不是全局统一比例，而是根据每个样本的质量分数（如一致性、困惑度、教师置信度）动态加权。高质量合成样本可与真实数据等权重使用；低质量合成样本权重降低。某些方法使用一个轻量级判别器来评估样本效用，从而动态平衡。

    （4）理论指导：偏差-方差权衡

    - 真实数据无偏但可能覆盖不足（方差大）；合成数据覆盖广但存在系统性偏差（教师模型的偏见、幻觉）。最优比例是在引入多样性的同时控制偏差。可以建模为风险最小化：R=Bias2(α)+Variance(α)R=Bias2(α)+Variance(α)，通过评估集来经验性地寻找 α。

    （5）根据合成数据的类型决定

    - 如果合成数据是由非常强大的教师生成，且经过严格过滤（如代码执行、外部知识库校验），其可靠性高，合成比例可以高达 80-90%。

    - 如果合成数据噪声较多或仅凭模型自生成，真实数据比例应至少 30%-50% 作为锚定。

    （6）持续监控与分布匹配

    - 监控训练过程中学生模型在真实分布验证集上的表现。若出现真实集性能上升但合成集性能虚高，或真实集性能停滞/下降，说明合成数据过度主导，需要增加真实数据或降低合成数据权重。

    - 可通过测量生成文本与真实数据语料库的统计分布距离（如 n-gram 分布、嵌入分布）作为混合效果的辅助指标。

    （7）样本层面的智能混合

    - 不是简单混合两个数据集，而是通过“插值式混合”创建混合样本（比如教师生成的解释结合真实标注答案），或者在训练时交替使用 batch，使模型在每个 step 都能接触到两种信号。

    实用最优比例经验：

    在许多 NLP 和代码生成蒸馏任务中，发现 合成数据 : 真实数据 = 7:3 或 3:1 通常是稳健起始点。但真正的最优需要基于具体模型和任务进行小规模实验确定。一旦确定，可以固定比例批量训练。

    最终最优比例是动态且场景化的，核心方法论是：以真实数据保障保真度，以合成数据扩展能力边界，通过迭代实验找到两者的平衡点。


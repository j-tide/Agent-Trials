    二、损失权重的调优策略

    权重的设定是联合训练的关键，没有固定法则，但可遵循以下原则和技巧：

    - 量级对齐：在训练初期，各项损失的数量级可能差异巨大（例如，MSE可能非常小，而KL散度可能很大）。首先需要观察各项损失的数值范围，然后调整权重使各项损失处于一个相近的数量级，避免训练被某个大数量级的损失所主导。

    [图片内容未导入]

    - 梯度归一化（Gradient Normalization）：一种更自动化的方法是，在每次反向传播前，计算每个损失函数对共享参数的梯度范数，然后动态调整权重，使得各个损失对参数更新的贡献度相等。这能从根本上解决损失量级不平衡的问题。

    - 不确定加权（Uncertainty Weighing）：将每个损失项看作一个不确定的观测，通过可学习的噪声参数来动态平衡它们。其核心思想是，让损失越大（越不确定）的任务，其权重越低，从而自动实现平衡。

    - 网格搜索与经验法则：在实践中，通常是以一个经验值开始（如 α=1, β=0.1, γ=0.1），然后进行小范围的网格搜索。关键在于，特征蒸馏和注意力蒸馏是作为“辅助目标”存在，其权重不应过大，以免“喧宾夺主”，干扰模型完成最终任务。


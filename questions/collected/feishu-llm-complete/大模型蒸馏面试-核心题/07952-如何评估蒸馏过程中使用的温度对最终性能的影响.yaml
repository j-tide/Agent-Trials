content:
  prompt: 如何评估蒸馏过程中使用的温度对最终性能的影响？
answer:
  mode: rubric
  reference_answer: |-
    评估温度 TT 的影响，不能只看一个指标，必须设计一个控制单一变量的消融实验，并进行多维度评估。

    实验设计：

    - 确定候选温度：选择一组有代表性的温度值，例如 [1, 2, 4, 8, 16]，并包含一个不使用蒸馏的基线（仅硬标签SFT）。

    - 严格控制变量：所有实验必须使用完全相同的学生模型、蒸馏数据集、优化器、学习率和训练Epoch。唯一的变量就是温度 TT。

    - 执行蒸馏训练：对每个温度值，独立进行一次完整的蒸馏训练。

    多维度评估与解读：

    训练完成后，在独立的测试集上对每个模型进行以下评估，并绘制成随温度变化的曲线图：

    - 任务准确率：通常呈现一个“倒U型”曲线。温度过低（尖锐分布）或过高（过于平滑）都会导致准确率下降，在中间某个最优温度达到峰值。

    - 校准度（ECE）：这是温度影响最明显的指标之一。高温度训练出的模型，其预测置信度通常更准确（ECE更低）。

    - 输出多样性（Self-BLEU）：温度越高，模型输出多样性越高，能有效缓解模式坍缩。可以观察到Self-BLEU随温度升高而降低（多样性增加）的趋势。

    - 教师-学生分布相似度（KL散度）：验证集上的KL散度可以衡量学生对教师整体分布的模仿程度。

    通过这个多维度的分析，你不仅能找到在准确率上最优的 TT，还能理解 TT 如何在模型的其他重要属性（如校准度和创造力）上发挥作用，从而做出更全面的权衡。


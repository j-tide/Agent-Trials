content:
  prompt: 多轮对话蒸馏模型如何评估上下文一致性？
answer:
  mode: rubric
  reference_answer: |-
    多轮对话的上下文一致性，是衡量模型“记忆”和“逻辑”连贯性的关键。评估需要专门设计依赖于历史信息的复杂对话场景。

    评估测试集的设计：

    - 远程依赖测试（Needle In A Dialog）：在长达数十轮的对话开头设置一个独特的细节（“我的狗叫爱因斯坦”），然后在对话的末尾，不提及任何中间细节，直接提问“我的狗叫什么名字？”。

    - 状态更新与覆盖测试：模拟用户在多轮对话中动态修改需求。例如，“我要一杯咖啡” -> “换成两杯奶茶，加珍珠”。观察模型是否能准确跟踪最终状态。

    - 矛盾识别与追问：在对话中故意植入前后矛盾的信息（“我今年30岁” -> “我1990年出生” -> “那今年是哪一年？”），观察模型能否识别矛盾并主动提出疑问。

    评估方法：

    - GPT-4-as-Judge：将完整对话历史提供给裁判模型，让它从“事实一致性”、“逻辑连贯性”和“指代消解准确性”等维度对模型的每一轮回复进行打分。

    - 自动化指标：对于槽位填充类的任务（如对话状态追踪），可以直接计算槽位填充的准确率。


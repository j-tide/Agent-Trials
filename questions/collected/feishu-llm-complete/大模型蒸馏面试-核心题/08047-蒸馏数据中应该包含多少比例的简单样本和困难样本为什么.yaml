content:
  prompt: 蒸馏数据中应该包含多少比例的“简单”样本和“困难”样本？为什么？
answer:
  mode: rubric
  reference_answer: |-
    没有固定比例，但通常遵循金字塔型或课程学习型分布，即简单样本是基础，数量最多；中等样本是主体；困难样本是拔高点，数量最少。

    推荐比例（以通用助手为例）：

    - 简单样本（~50-60%）：基础事实问答、简单翻译、单步指令等。它们是模型建立基本指令遵循能力的基石。

    - 中等样本（~30-40%）：需要2-4步推理、包含2-3个约束条件的指令、短文本摘要等。它们是模型能力的主体。

    - 困难样本（~5-10%）：复杂多步推理（数学证明）、多文档综合、长约束内容生成等。它们用于提升模型的能力上限，防止模型“躺平”在简单任务上。

    为什么需要简单样本占多数？

    - 训练稳定性：在蒸馏训练初期，学生模型还很弱小。大量简单样本能让模型迅速、平稳地收敛到合理区域，避免被困难样本“劝退”或导致梯度震荡。

    - 知识锚定：简单样本通常对应高频、基础的通用知识。它们能起到“锚定”作用，防止模型在学习复杂知识时遗忘基础能力。

    - 课程学习原理：人类学习也是从易到难。模型在简单任务上积累信心和能力后，再挑战困难任务，学习效率和最终效果都更好。

    为什么不能全是困难样本？ 全是困难样本会导致训练初期极其不稳定，模型可能长时间无法降低损失，甚至学到错误的模式。这就像让小学生直接去学微积分，是不切实际的。


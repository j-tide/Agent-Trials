content:
  prompt: 从信息论角度，如何理解温度 T 在蒸馏中控制“软”度的作用？
answer:
  mode: rubric
  reference_answer: |-
    从信息论看，softmax输出的概率分布可以视为一个分类分布的参数。温度 T 调节了该分布的熵。

    - T=1：标准softmax，分布由logits决定，通常熵较低（分布尖锐）。

    - T→∞：logits被极大压缩，softmax趋近于均匀分布，此时分布熵达到最大值 log⁡KlogK（K为类别数）。此时所有类别的信息被均等化，结构信息消失。

    - T→0+：logits被放大，softmax趋近于one-hot分布（argmax），熵趋近于0。此时相当于只保留了硬标签。

    在蒸馏中，温度 T 控制着学生从教师那里接收到的信息量：

    - 较高的T增加了分布的熵，平滑了概率，降低了教师对单个样本的置信度，但同时保留了类别间的相对顺序和相对距离。这种平滑减少了教师输出中的噪声，并保留了相似性结构。

    - 这种结构可以被视为一种速率受限信道：教师通过高温信道向学生传递“简化”后的知识，学生需从这种带噪声的观测中学习。

    因此，温度 T 实质上是调节教师知识传输粒度的旋钮：低T传递的是高保真但可能过拟合的信息，高T传递的是保结构但损失细节的信息。最佳T找到了一个最佳信息瓶颈点。


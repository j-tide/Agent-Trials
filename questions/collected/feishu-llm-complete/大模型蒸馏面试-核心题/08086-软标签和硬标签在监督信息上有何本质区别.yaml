content:
  prompt: 软标签和硬标签在监督信息上有何本质区别？
answer:
  mode: rubric
  reference_answer: |-
    - 硬标签：是离散的、确定的，通常表示为 one-hot 向量 [0,0,1,0,...]。它只包含“是/否”的判断，不包含任何关于类别之间关系的信息，且假设所有错误类别的代价是相同的。这种表示方式的信息量极低。

    - 软标签：是连续的、概率化的，例如 [0.85,0.10,0.03,0.02]。它提供了相对可能性和不确定性，反映了教师模型对各个类别的置信度。

    本质区别：

    - 信息量：硬标签仅包含1比特的信息（正确类别），而软标签包含了完整的概率分布，其信息熵远高于硬标签。

    - 泛化能力：使用软标签训练等同于在标签空间中添加了结构化噪声，起到平滑正则化的作用。学生模型在学习时不仅要知道“猫”是正确答案，还要知道“狗”是次优答案，这有助于防止过拟合。

    - 错误容忍度：硬标签对任何错误预测的惩罚是均匀的（例如，把猫错分成狗和错分成汽车，损失相同）。软标签则会根据教师模型的相似性判断，给予不同程度的惩罚（错分成狗比错分成汽车的损失更小），这使得学生模型更聚焦于区分易混淆类别。

    在知识蒸馏中，软标签和硬标签协同作用：软标签提供教师的结构化知识，硬标签提供绝对真实世界的锚点。


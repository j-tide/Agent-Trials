content:
  prompt: 在Transformer模型中，除了输出logits，还有哪些可蒸馏的中间表示？
answer:
  mode: rubric
  reference_answer: |-
    Transformer架构的模块化为知识蒸馏提供了丰富的中间表示来源：

    - 自注意力矩阵：如前所述，它揭示了Token间的依赖关系，是注意力蒸馏的核心知识来源。

    - 多头注意力输出：在将多个头的输出拼接并经过线性投影后得到的最终注意力输出，它融合了来自不同表示子空间的信息，也可以作为特征进行蒸馏。

    - 前馈网络（FFN）层的输出：Transformer中每个层的FFN（由两个线性层和激活函数构成）的输出，包含了该层对特征的进一步非线性变换信息。

    - 层归一化（LayerNorm）之前的隐藏状态：有时，对LN之前的隐藏状态进行蒸馏可以避免归一化带来的尺度影响，传递更原始的特征信号。

    - 嵌入层的输出：输入的Token和位置编码经过嵌入层后的表示。在NLP中，蒸馏嵌入层可以传递词汇的语义相似性。


content:
  prompt: 在黑盒蒸馏中，如何控制生成数据的难度分布？
answer:
  mode: rubric
  reference_answer: |-
    控制难度分布是为了实施“课程学习”（Curriculum Learning），让学生模型从简单到困难逐步学习，能有效提升训练稳定性和最终性能。

    一、定义“难度”度量标准

    - 指令复杂度：使用一个强模型（如GPT-4）对指令进行难度打分（1-5分）。评分依据指令包含的约束数量、所需推理步数、是否涉及专业领域等。

    - 教师模型的不确定性：教师模型在生成回答时的平均logprob（如果API提供）可以作为难度的反向指标。低概率意味着模型对答案不太确定，通常对应更难的问题。

    - 指令与回复的长度：通常（但不绝对），长指令和长回复对应更复杂的任务。

    二、控制难度分布的生成策略

    - Prompt Engineering：在生成指令或回答时，直接在Prompt中指定难度要求。例如：

    - Evol-Instruct的精细控制：深度进化（In-Depth Evolving）本身就是一种提升难度的操作。通过控制进化操作的强度和次数，可以精确地生成从简单到困难的一系列指令变体。

    - 数据配比控制：在构造最终蒸馏数据集时，根据预设的课程学习计划，人为地按比例混合不同难度的样本。例如，训练初期简单样本占80%，中期简单和困难各占50%，后期困难样本占80%。


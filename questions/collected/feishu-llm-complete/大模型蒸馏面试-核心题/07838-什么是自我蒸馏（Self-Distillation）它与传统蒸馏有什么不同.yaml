content:
  prompt: 什么是自我蒸馏（Self-Distillation）？它与传统蒸馏有什么不同？
answer:
  mode: rubric
  reference_answer: |-
    自我蒸馏（Self-Distillation） 是指模型以自身（或同结构、同尺寸的模型）作为教师来指导自身学习的一类方法，通常不需要单独预训练一个更大的教师模型。它可以分为几种典型形式：

    - 自蒸馏（Born-Again Networks）：用训练好的学生模型作为下一轮训练的教师，重新初始化一个相同结构的学生，通过匹配软标签再次训练。这个过程可以重复多代。

    - 在线自蒸馏（Online Self-Distillation）：在同一批参数或者多个同级子网之间相互蒸馏，例如深层将知识传给浅层（如 Be Your Own Teacher），或者多个分支互相学习。

    - 自集成蒸馏：利用历史参数滑动平均（EMA）作为教师，指导当前模型（类似 Mean Teacher）。

    - Self-Distillation from Self-Play：让模型生成合成数据，然后用这些数据重新训练自己，形成一种隐式的自我蒸馏。

    与传统的知识蒸馏的核心不同：

    [嵌入表格未展开]

    更深层的区别：

    传统蒸馏依赖于能力更强的教师所蕴含的“暗知识”（类别间相似性、特征表示），学生通过模仿这些软目标获得比单靠硬标签更好的泛化。而自我蒸馏是一种自举过程，它挖掘模型自身已经学到但尚未充分表达的信息，例如在早期阶段低熵输出的“简单样本”知识，或是深层/集成的稳定知识。自蒸馏之所以有效，部分原因在于它相当于一种正则化：通过迫使模型再次学习自己的软标签，强化了类间结构，抑制了过拟合于噪声的模式，并能改善模型的置信度校准。

    从信息论角度，教师带来的“相似性知识”减少了学生优化时的局部极小值困惑；而在自我蒸馏中，上一代的软标签提供了同一模型路径上的平滑目标，可以看作一种数据增强和标签平滑的混合效果。此外，自我蒸馏有一种“批内蒸馏”形式（如 One-Pass Self-Distillation），在同一个 mini-batch 内让模型对同一输入的不同增广产生一致性预测，这与对比学习也相通。正是因为自蒸馏不依赖外部大模型，它在低成本迭代和对齐场景中（如 Self-Rewarding）大放异彩。


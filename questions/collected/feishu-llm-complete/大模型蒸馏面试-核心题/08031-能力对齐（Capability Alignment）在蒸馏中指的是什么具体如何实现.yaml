content:
  prompt: 能力对齐（Capability Alignment）在蒸馏中指的是什么？具体如何实现？
answer:
  mode: rubric
  reference_answer: |-
    能力对齐 是指确保小模型不仅在大模型擅长的任务上表现接近，而且在那些大模型不擅长、可能出错或存在幻觉的任务上，小模型也能与大模型保持一致的缺陷模式，而不是产生新的、不可预测的错误。

    这听起来有些反直觉，但对于构建可依赖的系统至关重要。我们不希望小模型在蒸馏后突然“变傻”或“变坏”，而是在所有维度上都是大模型的一个忠实、等比例的缩小版。

    具体实现方法：

    - 多维评测驱动的蒸馏：建立一个覆盖多种能力维度（如事实性、安全性、推理、创造性）的评测集。在蒸馏过程中，不仅监控任务准确率，还监控学生在这些维度上与大模型的偏差。如果发现某一维度偏差过大，就针对性地补充该维度的蒸馏数据。

    - 对抗蒸馏：利用大模型生成一些容易被小模型误解的对抗样本，然后以大模型的正确响应作为软标签进行蒸馏。这能训练小模型在复杂或诱导性输入下与大模型保持一致的稳健性。

    - 特征对齐：除了输出层，对齐师生模型在中间层的特征表示。这能帮助学生学到教师处理信息的方式，而不是只记住最终输出。通常使用MMD（最大均值差异）或CKA（中心核对齐）等度量来拉近特征空间。

    - 约束搜索空间：在蒸馏时，不仅匹配教师的最高概率输出，还约束学生对某些明显错误类别的概率不能高于教师。这能防止学生产生教师从未有过的极端错误。

    能力对齐是比单纯精度提升更高阶的蒸馏目标，它追求的是模型行为的全面“克隆”，而不仅仅是性能的模仿。


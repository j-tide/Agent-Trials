content:
  prompt: 蒸馏模型输出多样性如何评估？Self-BLEU 或 distinct-n 有用吗？
answer:
  mode: rubric
  reference_answer: |-
    非常有用，它们是诊断模型是否发生“模式坍缩”的核心量化工具。

    - Self-BLEU：对同一个开放式指令，让模型生成多个不同的回答（如5个）。然后，对每个回答，将其他几个回答作为“参考”，计算BLEU分数，最后取平均值。Self-BLEU值越高，说明这些回答之间越相似，模型的输出多样性越差。 在蒸馏评估中，如果发现学生的Self-BLEU显著高于教师，就是模式坍缩的明确信号。

    - distinct-n：统计生成文本中，不重复的n-gram数量占总n-gram数量的比例。distinct-1衡量词汇多样性，distinct-2衡量短语多样性。这两个值越高，多样性越好。 如果蒸馏后学生的distinct-n值暴跌，说明其语言变得贫乏、模板化。

    深入解读：这些指标虽然有用，但有局限性。它们只能衡量词汇/短语层面的多样性，而无法衡量语义层面的多样性（例如，用不同的词汇表达了完全相同的意思）。因此，高级的评估通常会结合基于嵌入向量的语义多样性分析（计算同一问题多个回答的嵌入向量的余弦相似度）来综合判断。


content:
  prompt: 在进行特征蒸馏时，特征损失和其他损失之间的平衡怎么把握？
answer:
  mode: rubric
  reference_answer: |-
    这是蒸馏中最需要技巧和经验的环节之一。特征损失通过MSE直接对齐中间层，是一种极其霸道的约束，如果失衡，会彻底压垮学生模型。

    核心原则：特征损失是辅助，主损失是根本。绝不喧宾夺主。

    平衡策略：

    [图片内容未导入]

    - 监控梯度量级：特征蒸馏失败的最常见原因，是MSE损失产生的梯度过大，主导了整个模型的更新。可以在训练初期，分别记录各项损失对共享参数的梯度范数。如果 LfeatLfeat 的梯度范数显著大于其他损失，必须立刻降低其权重。

    - 渐进式特征蒸馏：训练初期，可以适当放大特征损失的权重，利用教师特征快速将学生引导到合理的表征空间。随着训练进行，逐步线性衰减特征损失的权重，甚至在训练后期完全置零。这给了学生模型在初期获得强指导，后期又能自由微调的空间。

    - 只蒸馏最后几层：避免在所有层都进行特征对齐。将蒸馏重点放在模型最高几层的语义特征上，这既能传递最核心的知识，又保留了学生在底层形成自己基础特征的自由度。

    - 使用“软”特征蒸馏：放弃强硬的MSE，改用关系蒸馏（RKD） 或对比蒸馏（CRD）。它们不要求学生精确复现特征值，而是学习特征间的相对关系，这种约束更柔和，对学生自身学习的压制更小。


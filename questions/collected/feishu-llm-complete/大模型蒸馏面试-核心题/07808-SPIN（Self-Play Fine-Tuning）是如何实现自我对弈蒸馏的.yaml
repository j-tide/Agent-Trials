content:
  prompt: SPIN（Self-Play Fine-Tuning）是如何实现自我对弈蒸馏的？
answer:
  mode: rubric
  reference_answer: |-
    SPIN 是用于大语言模型（LLM）自我提升的一种生成式对弈方法，核心思想是让模型在生成与判别两个角色间切换，通过对比自己的当前分布与历史分布来微调，实现隐式的自我蒸馏。

    其流程可以分解为：

    - 准备阶段：有一个已监督微调（SFT）的模型 πθπθ，和一批人类标注数据 DrealDreal。

    - 自我对弈循环：

    [图片内容未导入]

    - 蒸馏视角：这个过程驱动模型分布向真实数据分布靠拢，同时远离自身当前生成分布，本质上形成一种 分布蒸馏——模型逐步把自己的生成分布“推回”真实分布的方向。在单轮更新后，模型变得更像“从真实数据中学习到的教师”，指导下一轮的自我对弈。迭代多轮，模型不断提升。

    - 为什么是“自我对弈蒸馏”：模型扮演两个角色：

    - 生成器（G）：产生合成负样本。

    - 判别器/学生：通过对比真实正样本和合成负样本进行更新，获取关于真实分布的信息。
    每一次迭代，生成器得到更新后，下一轮再生成更逼真的样本，从而提供更强的训练信号。这个过程与 GAN 类似，但目标不是骗过判别器，而是让语言模型逐步脱离上一代的分布缺陷。由此，模型自身的历史分布充当了“差教师”，而真实数据加当前模型的对比促使模型提升，效果上相当于从真实数据的“理想教师”蒸馏，同时自身生成作为负信号，增强了知识迁移的对比度。

    - 具体实现细节：SPIN 在每轮 t 使用模型 πθt−1πθt−1 生成数据，与真实数据配对，以 DPO 风格训练得到 πθtπθt，其中参考模型固定为初始 SFT 模型，这避免了模型剧烈漂移。经过若干轮，模型在数学推理、对话等任务上显著超越单纯 SFT，甚至超过部分蒸馏自更大模型的方法。


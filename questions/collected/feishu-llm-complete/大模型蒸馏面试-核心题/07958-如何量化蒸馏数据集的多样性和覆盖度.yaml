content:
  prompt: 如何量化蒸馏数据集的多样性和覆盖度？
answer:
  mode: rubric
  reference_answer: |-
    多样性和覆盖度是衡量蒸馏数据集价值的核心指标，它们决定了学生模型能力的广度和泛化性。

    一、多样性（Diversity）量化

    - 语义多样性（Semantic Diversity）：

    - 词汇多样性（Lexical Diversity）：

    - 任务类型多样性（Task Diversity）：

    - 回复长度多样性（Response Length Diversity）：

    二、覆盖度（Coverage）量化

    - 能力矩阵法：首先根据产品需求，定义一张期望学生模型具备的“能力标签”列表（如“代码生成-函数级”、“数学推理-方程求解”、“安全处理-拒绝暴力请求”）。然后，使用分类器为蒸馏数据打上能力标签。计算：

    - 嵌入空间分布对比：将蒸馏数据与一个目标真实用户提问的测试集在同一个嵌入空间中可视化。如果蒸馏数据的分布（通过t-SNE或UMAP降维观察）能很好地覆盖测试集分布，说明其覆盖面好。反之，如果存在明显的空窗区域，说明覆盖不足。


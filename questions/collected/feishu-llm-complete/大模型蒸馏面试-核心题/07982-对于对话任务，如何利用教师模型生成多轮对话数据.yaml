content:
  prompt: 对于对话任务，如何利用教师模型生成多轮对话数据？
answer:
  mode: rubric
  reference_answer: |-
    生成高质量的多轮对话数据是训练优秀对话模型的关键。这不仅仅是生成单轮问答的拼接，而是需要模拟真实的、有上下文依赖的互动过程。

    生成方法：

    - 角色扮演模拟：让一个强大的教师模型同时扮演“用户”和“助手”两个角色，进行自我对话。

    - 利用真实对话日志进行改写或扩展：

    - 设计专门的“多轮能力”Prompt：在生成指令时，就明确要求生成一个多轮对话任务。例如，在Prompt中指定：“用户先问天气，助手回答后，用户再询问穿衣建议，助手根据天气情况给出建议”。

    生成后的处理：将生成的多轮对话按照统一的ChatML或其他模板格式化，确保每一轮的user和assistant角色标记正确。在训练时，只对assistant部分计算损失（Loss Masking）。


  prompt: 蒸馏训练中，如果教师模型很大，如何实现高效的在线教师推理？
answer:
  mode: rubric
  reference_answer: |-
    当教师模型无法装入单张GPU，或者在线推理严重拖慢训练速度时，必须采用特殊策略。

    - 模型并行与多卡部署：

    - CPU Offloading（时间换空间）：

    - 离线预计算（最常用，见下一问）：这是解决此问题的最主流、性价比最高的方案。不再进行在线推理，而是事先用教师模型对蒸馏数据集进行一遍推理，将所有需要的知识（如Logits、特征图）保存到磁盘。训练学生时，直接从磁盘读取，完全解耦了教师的推理过程。


  prompt: 隐藏状态蒸馏时，教师和学生隐藏维度不同怎么解决？映射层如何设计？
answer:
  mode: rubric
  reference_answer: |-
    这是特征蒸馏中一个关键的工程问题。当教师和学生的隐藏层维度（例如，教师768，学生312）不一致时，无法直接计算损失函数。

    - 解决方案：在学生模型的输出端，增加一个可学习的线性映射层（Projection Layer）。


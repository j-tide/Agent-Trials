content:
  prompt: DistilBERT中使用了哪几种蒸馏损失？各有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    DistilBERT是知识蒸馏在NLP领域最经典的实践之一。它巧妙地组合了三种损失函数，将一个12层的BERT-base教师模型压缩为一个6层的DistilBERT学生模型。

    - 蒸馏损失：

    - 形式：计算学生和教师在Masked Language Model (MLM)任务输出上的KL散度。

    - 作用：这是核心的蒸馏损失，属于Hinton提出的经典蒸馏框架。它让学生模型模仿教师模型输出的整个概率分布（软标签），从而学习到教师关于词汇之间相似性的“暗知识”。

    - 掩码语言模型损失：

    - 形式：学生模型预测的token与真实被掩码token之间的交叉熵损失。

    - 作用：这是标准的预训练任务损失，属于“硬标签”监督。它为学生模型提供了一个绝对真实的语言信号，确保学生模型不会因为完全模仿教师而偏离语言的基本事实，起到了重要的“锚定”和纠偏作用。

    - 余弦嵌入损失：

    通过这种组合，DistilBERT不仅模仿了教师的行为，还直接学习了教师的特征和语言知识，从而以极小的参数量损失达到了接近教师的性能。


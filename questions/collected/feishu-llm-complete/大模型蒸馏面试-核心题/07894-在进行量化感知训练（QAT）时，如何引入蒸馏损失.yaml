content:
  prompt: 在进行量化感知训练（QAT）时，如何引入蒸馏损失？
answer:
  mode: rubric
  reference_answer: |-
    在标准的QAT训练循环中引入蒸馏损失，操作上非常简单，因为它是在标准训练损失的基础上额外添加了一个损失项。

    具体步骤如下：

    - 获取教师预测：对于每一个Batch的数据，先将其输入到冻结的FP32教师模型中，得到教师模型输出的软标签 soft_labels = softmax(teacher_logits / T)。

    - 获取学生预测：将同样的数据输入到处于QAT模式的学生模型中（即带有伪量化节点）。学生模型会输出两个预测值：

    - 计算损失：

    - 反向传播与更新：L_total 进行反向传播，通过伪量化节点的STE机制，更新学生模型的FP32权重。

    关键点：

    - 温度系数：在计算蒸馏损失时，通常需要设置一个大于1的温度 TT，以软化教师和学生的输出分布，更好地传递暗知识。推理时恢复 T=1。

    - α 平衡：需要调节α来平衡任务损失和蒸馏损失的权重，这通常是一个超参数，需要通过实验确定。在QAT中，由于学生模型同时受到量化噪声的干扰，通常会适当增大蒸馏损失的权重，以提供更强的指导信号。


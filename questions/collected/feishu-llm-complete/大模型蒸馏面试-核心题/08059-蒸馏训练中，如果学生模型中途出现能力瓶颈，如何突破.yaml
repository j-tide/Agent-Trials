content:
  prompt: 蒸馏训练中，如果学生模型中途出现能力瓶颈，如何突破？
answer:
  mode: rubric
  reference_answer: |-
    学生模型在蒸馏中途出现性能停滞（瓶颈）是常见现象，这往往意味着当前的蒸馏策略已无法进一步榨取学生模型的潜力。突破瓶颈需要从数据、蒸馏策略、模型容量等多个维度进行系统性地调整。

    突破策略：

    - 调整蒸馏数据难度与多样性：

    - 深化蒸馏策略（从结果到过程）：

    - 优化模型训练策略：

    - 引入“助教”模型（Multi-Stage Distillation）：如果教师和学生模型容量差距过大，直接学习过于困难。可以引入一个中等尺寸的“助教”模型，先用教师蒸馏助教，再用助教蒸馏学生，形成平滑的知识传递。


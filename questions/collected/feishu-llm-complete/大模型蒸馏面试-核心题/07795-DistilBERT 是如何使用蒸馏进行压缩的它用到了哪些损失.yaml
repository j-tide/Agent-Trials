content:
  prompt: DistilBERT 是如何使用蒸馏进行压缩的？它用到了哪些损失？
answer:
  mode: rubric
  reference_answer: |-
    DistilBERT是知识蒸馏在NLP领域的一个里程碑，它通过三种损失的组合，成功将BERT-base压缩为一个6层的轻量模型。

    - 蒸馏损失（Distillation Loss）：这是核心。学生模型（DistilBERT）和教师模型（BERT-base）在同一个Masked Language Model (MLM)任务上的输出概率分布之间计算KL散度。这与标准Hinton蒸馏一致，让学生模仿教师的预测行为。

    - 掩码语言模型损失（MLM Loss）：学生模型同时也计算与真实被掩码token之间的交叉熵损失。这部分与BERT的预训练完全相同，确保学生模型能够学习到正确的语言知识，而不仅仅是模仿教师。这是硬目标损失。

    - 余弦嵌入损失（Cosine Embedding Loss）：这是DistilBERT的创新点。它计算学生和教师最后一层隐藏状态之间的余弦相似度，并最小化其差距（即最大化余弦相似度）。这属于特征蒸馏的范畴，目的是对齐教师和学生学到的最终特征表示，使学生的隐藏状态向量与教师的方向一致。

    总损失是这三者的线性加权和。通过这种组合，DistilBERT不仅学到了教师的输出行为，还直接学到了教师的特征表示，从而以极小的参数代价取得了接近教师的效果。

content:
  prompt: 在蒸馏中引入“执行反馈”（如代码执行结果），怎样提升代码生成模型？
answer:
  mode: rubric
  reference_answer: |-
    执行反馈指让生成的代码在真实解释器或测试用例上运行，并获取是否通过、运行错误类型、输出值等信息。将其融入蒸馏可以极大提升代码生成模型的正确性和鲁棒性。

    实现机制和提升路径：

    （1）筛选高质量训练数据（拒绝采样）

    - 教师模型针对编程问题生成多个候选代码方案，每个都在对应的测试用例上执行。仅保留那些通过所有测试或获得最高执行奖励的代码作为蒸馏数据。这样，学生模型仅从“可运行且正确”的代码中学习，避免学习有语法或逻辑错误的样本。

    （2）执行结果作为序列的扩展信号

    - 构造训练数据时，将执行信息附加在代码之后，例如：“<code>...<execute>Passed</execute>”或错误信息：“<execute>Error: list index out of range</execute>”。学生在训练中看到这种带反馈的模式，学会将代码与可能的执行结果关联，从而在生成时能“预见”错误并规避。

    - 蒸馏训练可以强制要求学生在生成代码后预测执行结果（多任务学习），这内化了一种自我调试能力。

    （3）基于执行反馈的偏好蒸馏

    - 让教师生成正确代码与错误代码形成对比对，执行结果确定了偏好的方向（正确 > 错误，运行时错误 > 语法错误等）。使用 DPO 或 RL 式蒸馏，激励学生提高生成正确代码的概率。这种反馈让模型明白什么构成了更好的代码，而不仅仅是正确输出 logits。

    （4）交互式自我蒸馏与修复

    - 在学生生成代码后，自动执行并收集错误信息；将错误信息和原问题组合成新的 prompt，再次请求学生（或教师）修复代码。将“问题 -> 错误代码 -> 错误信息 -> 修复后正确代码”的完整轨迹作为训练数据，使得蒸馏过程教给模型调试与自修正能力。

    （5）强化学习式蒸馏结合执行奖励

    - 使用执行反馈构建奖励函数（如通过测试数、编译成功等）。在蒸馏时，学生对给定问题采样代码，计算执行奖励，然后用 PPO 优化该奖励，同时约束 KL 散度与教师分布保持一致。这直接对齐模型生成偏好与执行正确性。

    （6）迭代式在线执行引导

    - 在蒸馏训练过程中，定期让学生生成代码并执行，将那些通过执行的新正确代码样本加入训练集，并用它们进一步蒸馏学生，形成自我提升循环。类似于自蒸馏，但质量标准由执行决定，不含主观偏见。

    提升效果：

    - 大幅降低语法错误和逻辑错误率，学生模型输出的代码更“即拷即用”。

    - 学会了理解运行时约束，例如类型匹配、边界检查等，这是纯文本蒸馏难以传授的。

    - 涌现出更强的调试和迭代优化能力。

    结论：执行反馈为代码蒸馏提供了坚实的、可自动获取的真实信号，将蒸馏从静态模仿升级为动态、以执行正确性为驱动的学习，显著提升了代码生成模型的实用性与可靠性。


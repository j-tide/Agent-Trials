content:
  prompt: 从 RLHF 对齐的模型中蒸馏，对齐性为什么容易丢失？如何保持？
answer:
  mode: rubric
  reference_answer: |-
    RLHF 对齐模型通过强化学习（PPO 等）基于人类偏好奖励函数进行了微调，使其输出更符合无害、有用、诚实等对齐目标。将此类模型作为教师进行蒸馏（如得到小模型）时，常常发现学生模型的对齐程度明显下降，原因及保持策略如下。

    对齐性丢失的原因

    - 偏好知识是分布级的，难以用单点 logits 捕捉
    RLHF 训练调整了模型在整个生成分布上的行为（如避免有毒回复、婉拒不当请求），这些微妙变化并不完全反映在单步预测的最大概率标签或标准的 soft logits 中。传统的 logit 蒸馏可能只传递了事实性知识，而丢失了关乎安全拒绝、礼貌、克制等对齐特性。

    - 对齐行为依赖于生成过程中的路径依赖
    对齐模型在自回归生成过程中，早期 token 选择（如拒绝口吻的起始词）会牵引后续安全响应。学生如果仅模仿教师给定前缀下的下一个 token 概率，可能因为自身容量限制或误差累积，在自由生成时偏离安全轨迹。

    - 对齐奖励与任务性能之间存在权衡
    大模型可能通过轻微牺牲某些任务的帮助性以换取安全性。当蒸馏聚焦于提高下游任务精度时，会无意中削弱这种平衡，导致学生更加“有帮助”但更不安全。

    - 学生容量不足
    小模型本身表示能力有限，很难同时编码所有对齐所需的细微边界（如识别隐性冒犯、复杂语境）。蒸馏过程中压缩可能丢掉对齐必需的敏感特征。

    - 数据偏差
    蒸馏使用的数据集如果缺少安全相关的对抗性 prompt 或拒绝示例，学生就无法学到对齐行为。

    如何保持对齐性

    （1）在蒸馏数据中加入对齐场景

    - 构造包含安全敏感 prompt 的数据集，并收集大模型的响应（包括拒绝回答、解释风险等），将其纳入蒸馏。这要求数据覆盖红队测试点、有害指令、政治敏感等。

    - 使用对比蒸馏：提供成对的回复（安全 vs 不安全），并要求学生模仿教师对好坏回复的偏好分布。

    （2）蒸馏偏好模型信息

    - 除了蒸馏生成策略，可同时蒸馏一个隐式的偏好模型。具体做法：让教师对样本打分，然后学生学习匹配这些奖励分数，或者使用基于偏好的损失（如 DPO）在蒸馏时约束学生。

    - 将 RLHF 中的奖励函数直接用作蒸馏的辅助损失：在学生生成结果上计算奖励，并加到训练目标中（可结合策略梯度），使蒸馏过程等同于小规模的对齐训练。

    （3）使用策略蒸馏

    - 不仅蒸馏概率，还要匹配教师策略在完整生成序列上的行为。可通过序列级 KL 散度最小化学生和教师的生成分布差异，这在自回归模型上可用 RL 或 DPO 实现。

    - 实践中，常通过逆强化学习式蒸馏：学生不仅模仿教师动作，也学习教师隐含的奖励函数。

    （4）教师强制执行安全特性

    - 在蒸馏训练中，对学生的输出采样并使用教师进行审核（如判断是否安全），不安全的样本施加高额惩罚。

    - 对学生进行约束解码微调：教授特殊的控制 token（如 <|safe|>），使得安全生成被结构化强化。

    （5）多任务与正则化

    - 联合优化任务损失、蒸馏损失、安全损失。安全损失可基于规则（关键词屏蔽）或来自教师的安全分类器。

    - 在蒸馏后，可再进行少量 RLHF 微调（如用对安全性奖励的 PPO）作为补救。

    （6）逐步蒸馏与迭代对齐

    - 先蒸馏获得基础能力，然后在小模型上进行一轮轻量对齐（如 DPO 使用蒸馏出的偏好对），即“蒸馏+对齐”解耦，往往比一步到位保持更好。

    - 或者迭代进行蒸馏和对齐，在每一轮自我蒸馏中用对齐过的教师信号，保持对齐特性不退化。

    （7）保持教师模型参与评估

    - 在训练过程中监控学生安全指标（如毒性评分、拒绝率），一旦下降明显，重新加入更多教师安全标注数据或冻结部分安全相关参数。

    综合来看，从 RLHF 模型中成功蒸馏对齐性需要数据、损失函数和训练流程的共同设计，将对齐视为一等公民而非附加项，才能最大程度保持安全、有用的行为。


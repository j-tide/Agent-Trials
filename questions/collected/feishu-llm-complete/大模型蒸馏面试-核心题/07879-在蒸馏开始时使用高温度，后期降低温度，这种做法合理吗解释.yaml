content:
  prompt: 在蒸馏开始时使用高温度，后期降低温度，这种做法合理吗？解释。
answer:
  mode: rubric
  reference_answer: |-
    非常合理。这不仅符合直觉，更有扎实的理论和实验支持。

    - 理论视角：优化过程的“金字塔”策略：
    蒸馏优化问题的损失曲面是复杂、非凸的。训练初期，学生参数远离最优解。高温相当于将损失曲面进行了一次高斯模糊，使其变得平坦、光滑。优化器在这个模糊的曲面上可以轻松、快速地滑向正确的“盆地”（一个宽泛的全局最优区域）。进入后期，再逐步降低温度，恢复曲面的精细结构，让优化器在这个盆地里找到最精准的“谷底”。这个过程，本质上是一种从粗到精的多尺度优化。

    - 信息论视角：从“结构”到“细节”：
    高温传递的是知识的“主成分”和“结构骨架”，是过滤掉噪声后的核心信息。低温传递的是包含细节和不确定性的“高保真”信息。学生模型先学习骨架，再填充血肉，这符合认知规律。

    - 正则化视角：
    初期的高温是一种极强的正则化，防止学生过早地陷入某个尖锐的局部极小点（过拟合）。当学生通过高温建立了鲁棒的基础后，再接触细节，就不容易被噪声带偏。


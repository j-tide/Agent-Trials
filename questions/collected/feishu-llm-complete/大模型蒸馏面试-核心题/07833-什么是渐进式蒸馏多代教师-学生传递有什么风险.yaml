  prompt: 什么是“渐进式蒸馏”？多代教师-学生传递有什么风险？
answer:
  mode: rubric
  reference_answer: |-
    渐进式蒸馏 是指将一个巨大的教师模型 T0T0，先蒸馏到一个中等大小的学生模型 S1S1。待 S1S1 训练完成后，再以 S1S1 为新的教师，去蒸馏一个更小的模型 S2S2。这个过程可以重复多代，形成一个“教师-学生”的传承链。


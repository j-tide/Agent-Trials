content:
  prompt: 为什么在推理时，学生模型不再使用蒸馏温度？
answer:
  mode: rubric
  reference_answer: |-
    推理时，学生模型恢复使用 T=1 的标准softmax，原因如下：

    - 恢复标准决策边界：蒸馏训练的目的是让学生模型在标准温度下拥有更好的泛化能力。使用高温推理会导致预测概率过于平滑，置信度低，不适合直接用于决策（例如计算准确率、进行阈值判断）。推理时恢复 T=1 可以得到清晰、可解释的预测。

    - 与真实世界对齐：真实应用场景中，我们希望模型给出明确的预测（例如，这是猫的概率是95%），而不是模糊的、高熵的分布。标准softmax可以提供校准后的置信度。

    - 兼容下游任务：许多后处理步骤（如NMS、top-k计算）都依赖于有区分度的概率分数，高温度会破坏这些操作。

    简单说，训练时使用高温是为了学习教师的知识结构，推理时恢复 T=1 是为了应用所学并给出准确、自信的预测。推理时若仍用蒸馏温度，会导致性能指标（如准确率）不可靠，因为输出分布过于平滑。


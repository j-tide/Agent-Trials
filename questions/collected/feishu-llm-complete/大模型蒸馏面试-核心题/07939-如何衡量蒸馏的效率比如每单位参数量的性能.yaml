content:
  prompt: 如何衡量蒸馏的“效率”？比如每单位参数量的性能。
answer:
  mode: rubric
  reference_answer: |-
    衡量蒸馏效率，就是计算模型用更少的资源，换来了多少“智能”。这是量化蒸馏价值的核心。

    核心效率指标：

    - 智能密度（Intelligence Density）：

    - 智能密度=综合性能得分（如MMLU, GSM8K等加权分）模型参数量（Billion）智能密度=模型参数量（Billion）综合性能得分（如MMLU, GSM8K等加权分）

    - 该值越高，代表模型的每个参数都经过了更充分的优化，蕴含了更高的“智能”。

    - 计算效率（Computational Efficiency）：

    - 计算效率=综合性能得分单次推理所需的FLOPs计算效率=单次推理所需的FLOPs综合性能得分

    - 这更精确地反映了模型的推理效率，因为FLOPs与推理速度直接相关。

    - 部署效率（Deployment Efficiency）：

    - 部署效率=综合性能得分推理延迟（ms）部署效率=推理延迟（ms）综合性能得分

    - 这是最接近实际业务的指标，直接衡量了单位时间内能提供的“有效智能”。

    通过这些指标，我们可以量化蒸馏带来的“效率”提升。例如，“蒸馏后的7B模型，其智能密度是原始70B教师的5倍。”


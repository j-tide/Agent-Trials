content:
  prompt: 如果学生模型容量非常小，温度应该设高还是低？为什么？
answer:
  mode: rubric
  reference_answer: |-
    应该设高，且通常需要比常规情况更高。

    - 核心原理：容量-信息复杂度匹配：
    一个容量极小的学生模型，其本质是一个表达能力受限的函数逼近器。教师模型庞大的参数空间所蕴含的知识，对于这个小模型来说，信息量是过剩的、复杂度是超载的。高温度的作用，就是将教师输出中的高频细节信息（如某个罕见类别仅有0.1%的概率）“平滑”掉，只保留数据分布中最显著、最核心的结构特征。

    - 过拟合的防御：低温度使得教师分布尖锐，这迫使容量小的学生去“死记硬背”这些尖锐的模式。这不仅难以实现，更会导致严重的过拟合，泛化能力极差。高温的平滑性，对于小模型而言，就是最有效的正则化，防止其走上“背诵”的歧途。

    结论：师生容量差距越大，蒸馏温度应越高。


content:
  prompt: 如何衡量蒸馏后小模型相对于教师模型的能力保持率？
answer:
  mode: rubric
  reference_answer: |-
    这是一个多维度的评估体系，核心是计算学生在各个能力维度上的“得分/教师得分”的比率。可以使用雷达图进行直观对比。

    关键维度与指标：

    - 任务性能保持率：在学生和教师的同一批测试集上，计算核心任务指标（如准确率、F1）的比值：Rate = Score_s / Score_t。

    - 泛化能力保持率：在OOD（分布外）数据集上，使用上述同样方法计算。这是衡量学生是否死记硬背的关键。

    - 校准度保持率：计算师生的ECE之差。学生的ECE越低（越接近0），说明其自信度越合理。一个好的蒸馏应该保持或改善ECE，而不是恶化。

    - 输出分布对齐率：计算学生和教师在测试集上平均输出分布的Jensen-Shannon散度（JS散度）或交叉熵。值越小，对齐越好。

    - 特征表示对齐率：使用CKA或SVCCA分析师生中间层特征的相关性。用于评估过程性知识的保持。

    - 鲁棒性保持率：在对抗攻击测试集上，计算 Rate = RobustAcc_s / RobustAcc_t。

    一个全面的“能力保持率”报告应至少包含任务性能、泛化性和校准度三个维度。


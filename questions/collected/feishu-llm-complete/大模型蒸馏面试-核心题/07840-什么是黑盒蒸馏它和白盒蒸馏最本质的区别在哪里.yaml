content:
  prompt: 什么是黑盒蒸馏？它和白盒蒸馏最本质的区别在哪里？
answer:
  mode: rubric
  reference_answer: |-
    黑盒蒸馏 是指在只能通过API访问教师模型的情况下进行知识迁移。我们无法获取教师模型的内部参数、隐藏状态、梯度或完整的 logits 向量。唯一的交互方式是发送输入，并接收模型生成的文本输出（有时可选地包含输出token的概率对数 logprobs）。因此，教师模型完全被视为一个黑箱函数。

    白盒蒸馏 则拥有教师模型的完全访问权：可以查看并操纵其网络结构、参数、中间特征图（Feature Maps）、注意力权重（Attention Weights）以及最终的完整 logits 向量。这使得我们可以使用更丰富、更直接的蒸馏信号，例如直接匹配教师的中间层特征（特征蒸馏）或拟合其完整的概率分布（Logits蒸馏）。

    两者最本质的区别在于“知识信号”的丰富度和获取方式。

    [嵌入表格未展开]

    白盒蒸馏可以精细地传递教师的“思维过程”，而黑盒蒸馏只能传递教师的“思维结果”（即文本输出）。因此，在黑盒蒸馏中，如何将教师的内部知识显式化为文本，是成功的关键。


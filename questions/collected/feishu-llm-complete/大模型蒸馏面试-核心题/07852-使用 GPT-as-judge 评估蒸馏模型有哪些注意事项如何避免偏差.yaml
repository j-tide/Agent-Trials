content:
  prompt: 使用 GPT-as-judge 评估蒸馏模型有哪些注意事项？如何避免偏差？
answer:
  mode: rubric
  reference_answer: |-
    使用GPT-4等强模型作为裁判是目前最高效的评估方式，但它并非绝对客观。裁判模型本身带有偏见，如果不加控制，会导致评估结果失真。

    核心注意事项与避偏策略：

    - 位置偏差：裁判模型倾向于认为排在前面的回答更好。

    - 长度偏差：裁判模型倾向于给更长的回答打更高的分。

    - 权威与风格偏差：裁判模型可能偏好特定风格的文本（如学术风、使用“首先、其次”等结构），或者被看似权威但内容错误的回答迷惑。

    - 评估标准模糊性：如果Prompt中的评分标准模糊（如“给有用性打分”），裁判模型会自由发挥，引入不可控的偏差。

    结论：使用GPT-as-judge是一门艺术。一个精心设计的、包含反偏差指令和多维评分标准的Prompt，是获得可靠评估结果的关键。


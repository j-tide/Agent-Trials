content:
  prompt: 如何选择蒸馏温度？有没有经验法则？T 太小或太大分别会导致什么问题？
answer:
  mode: rubric
  reference_answer: |-
    选择蒸馏温度的方法：

    - 经验法则：通常从 T=4 或 T=5 开始尝试。对于复杂的分类任务，可以尝试 2~20 的范围。

    - 验证集调优：在留出的验证集上，评估不同 T 下蒸馏得到的学生模型的准确率，选择最优值。

    - 基于教师自信度调整：如果教师模型输出已经很平滑（如经过校准），可以使用较低的 T；如果教师非常自信，则需要较高的 T 来揭示暗知识。

    T 太小的后果（如 T=1）：

    - 软标签接近硬标签，暗知识无法体现，蒸馏退化为普通的硬标签训练。

    - 学生无法学习到类别间的相似性结构。

    - 教师预测中的噪声被放大。

    T 太大的后果（如 T>20）：

    [图片内容未导入]

    - 蒸馏损失提供的梯度信号极弱，训练缓慢，学生可能学不到任何有效信息。

    - 学生模型最后可能性能还不如自己直接训练。

    因此，T 的选择是一个平衡，目的是在“保留教师知识结构”和“提供足够强的学习信号”之间取得最佳折中。


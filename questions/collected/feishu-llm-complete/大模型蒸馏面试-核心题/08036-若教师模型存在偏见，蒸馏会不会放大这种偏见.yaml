content:
  prompt: 若教师模型存在偏见，蒸馏会不会放大这种偏见？
answer:
  mode: rubric
  reference_answer: |-
    会，且存在很高的风险。 这不仅仅是简单的传递，而是可能会固化甚至放大偏见。小模型由于容量限制，更倾向于学习教师输出中的“主要矛盾”或高频模式，从而忽略细微的公平性，导致偏见被强化。

    一、偏见放大的机制

    - 过拟合教师偏差：教师对特定群体（如某个性别、种族）存在的统计偏见，会在其训练数据中体现。学生在模仿时，由于无法理解背后的社会复杂性，会将这些偏见当作“标准知识”来学习。更重要的是，由于容量限制，小模型可能会“简化”地学习这些偏见，使得偏见的表达更绝对、更直接、更不加掩饰。

    - 长尾群体的遗忘：教师在长尾数据（如少数群体的样本）上可能表现尚可，但小模型由于容量有限，在蒸馏过程中可能直接“遗忘”了这些少数群体，导致对这些群体的预测性能更差。这本质上是对少数群体的二次伤害。

    二、缓解方法

    - 教师偏见审计与数据均衡：在蒸馏前，对教师模型进行严格的公平性测试。在构造蒸馏数据时，刻意进行反事实数据增强（Counterfactual Data Augmentation），例如，对于“护士”相关的句子，创造大量使用“男护士”的变体，以平衡性别分布。

    - 公平性约束的蒸馏：在损失函数中加入公平性约束项，惩罚学生模型在不同群体（如男/女）上表现出过大的性能差异或预测分布差异。

    - 对抗蒸馏去偏（Adversarial Debiasing via Distillation）：使用对抗训练的思想，在蒸馏的同时，训练一个辅助的“偏见分类器”，让它无法从学生模型的特征中推断出敏感属性（如性别、种族）。这会迫使学生的中间表示不包含偏见信息。

    - 蒸馏后去偏微调：使用专门构造的去偏数据集，对学生模型进行一次轻量级的微调，专门用于移除偏见。这往往是最直接有效的方法。

    结论：不能假设教师是绝对公平的。偏见问题在蒸馏中必须被主动、显式地管理。从数据、损失函数到后训练，需要构建一个完整的去偏链路。


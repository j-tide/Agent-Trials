content:
  prompt: 蒸馏数据生成后，为何需要进行拒绝采样或重排序？具体如何操作？
answer:
  mode: rubric
  reference_answer: |-
    在教师模型生成大量候选回答后，并非所有输出都是高质量的、适合作为学生学习的“金标准”。直接使用全部生成数据，可能会将教师的错误、偏见、不确定性或低质量文本引入训练集，从而“污染”学生模型。因此，需要一种质量筛选机制，拒绝采样（Rejection Sampling）和重排序（Reranking）正是为此服务的。

    核心目的：从一批候选回答中，选出最能代表教师知识精华、且最符合任务要求的高质量样本，从而提升蒸馏数据的纯度和训练价值。

    一、拒绝采样（Rejection Sampling）

    这是一种“择优录取”的硬过滤策略。对于同一指令，教师模型生成多个候选回答，然后根据预设的、自动化的质量标准，只“接受”那些达到标准的回答，而“拒绝”其余。

    具体操作流程：

    - 生成候选池：对每条指令，让教师模型以较高温度（>0.7）和不同随机种子生成多个（如4-8个）候选回答，保证多样性。

    - 多级过滤器串联：

    - 择优录取：只有通过所有过滤器的候选回答，才被最终“接受”，并与指令配对，形成高质量的蒸馏数据。

    二、重排序（Reranking）

    这是一种“择优排序”的软过滤策略。它不直接丢弃任何回答，而是利用一个强大的奖励模型对同一指令下的多个候选回答进行评分和排序，选出得分最高的Top-1或Top-K个回答作为训练目标。这样做不仅能过滤掉劣质回答，还能确保学生模型优先学习到教师最精华的输出。

    为什么两者重要？ 因为它们将数据生成与质量控制解耦。生成阶段鼓励教师大胆探索，追求多样性和创造性；而拒绝/重排序阶段则严格把关，确保最终数据的质量，实现了“以量换质”的目的。


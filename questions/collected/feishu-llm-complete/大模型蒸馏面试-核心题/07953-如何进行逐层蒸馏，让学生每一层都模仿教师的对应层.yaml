content:
  prompt: 如何进行“逐层蒸馏”，让学生每一层都模仿教师的对应层？
answer:
  mode: rubric
  reference_answer: |-
    逐层蒸馏旨在让学生模型在学习的每一个抽象阶段，都能得到教师的直接指导。其核心操作流程如下：

    - 建立层映射关系：首先，需要决定学生和教师的哪些层进行配对。常见策略包括：

    - 应用投影层：对于每一对匹配的层，如果师生隐藏维度不同，需在学生层输出后添加一个独立的线性投影层 W_i，将其映射到教师维度。

    - 计算逐层损失并累加：

    - 与最终蒸馏损失联合训练：总损失函数通常是 L_total = L_task + α * L_logits + β * L_feat_total，其中 α 和 β 是平衡系数。

    梯度隔离技巧：在逐层蒸馏时，通常会让学生层的特征损失梯度只流向该层及其之前的层，而不影响之后的层。这可以防止后面的层为了弥补前面的对齐误差而过度调整，使得每一层的学习目标更加纯粹。


content:
  prompt: 如何绘制“性能-模型大小”帕累托曲线，比较不同蒸馏方案？
answer:
  mode: rubric
  reference_answer: |-
    帕累托曲线是评估和比较不同蒸馏方案在“效率”与“性能”之间权衡的最直观、最强大的工具。

    绘制步骤：

    - 确定坐标轴：

    - 收集数据点：

    - 拟合帕累托前沿：

    如何解读与决策：

    - 方案对比：直接看图说话。方案A和方案B都在图上有对应的点。如果方案A在方案B的左上角（即相同性能下模型更小，或相同大小下性能更高），则方案A优于方案B。

    - 寻找“甜点”：在帕累托前沿上，寻找那个斜率变化最大的“拐点”。在这个拐点之前，增加少量模型体积可以带来巨大的性能提升；而在这个拐点之后，性能提升的边际效应递减。这个拐点通常就是工程部署的“最佳性价比”点。

    - 指导迭代：如果你新实验的一个蒸馏方案，在图上形成了一个新的、更靠左上角的点，并且推动了整个帕累托前沿的移动，那么这个方案就是一次突破性的创新。

    工具：可以使用Python的Matplotlib库来绘制。数据整理好之后，调用plt.scatter绘制所有点，然后手动连接前沿点或用keep='frontier'等参数拟合前沿线。这能非常直观地向决策者展示不同技术方案的优劣。

content:
  prompt: 对于非常大的教师模型（如 GPT-4），蒸馏训练时如何节省计算？
answer:
  mode: rubric
  reference_answer: |-
    面对GPT-4这类只能通过API访问的黑盒模型，节省计算的核心在于优化数据流和API调用。

    - 离线预计算软标签（最具性价比）：

    - 使用更小的教师模型作为“助教”：

    - 缓存机制：对于调用教师API的请求，将结果进行缓存。如果后续出现相同或高度相似的指令，直接使用缓存结果，避免重复调用。

    - 拒绝采样与数据筛选：在调用API时，让教师以较高温度生成多个回答，然后利用一个成本较低的本地奖励模型进行筛选，只保留最佳回答。这可以保证蒸馏数据的质量，用更少的数据达到更好的效果。


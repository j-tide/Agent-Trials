content:
  prompt: 使用黑盒蒸馏训练代码模型，数据中应包含哪些元素？
answer:
  mode: rubric
  reference_answer: |-
    要蒸馏一个优秀的代码模型，蒸馏数据必须模拟一个软件工程师的真实工作流，远不止简单的“代码生成”。它需要是一个立体、多维的教学材料，覆盖从理解需求到调试优化的全过程。

    一个完整的代码蒸馏数据样本应包含以下核心元素：

    - 完整的任务描述（需求）：

    - 完整的代码上下文：

    - 详细的解释、注释与文档：

    - 调试与错误修正的完整闭环：

    - 代码优化与重构：

    - 测试用例与验证：

    - 安全与伦理：

    数据来源上，可以由人类专家编写核心种子，再利用Self-Instruct/Evol-Instruct让强模型基于种子进行变体生成，但所有生成的数据必须经过答案的自动验证（如执行单元测试）。


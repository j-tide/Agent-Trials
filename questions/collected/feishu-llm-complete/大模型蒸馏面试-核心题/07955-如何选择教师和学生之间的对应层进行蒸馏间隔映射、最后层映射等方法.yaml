content:
  prompt: 如何选择教师和学生之间的对应层进行蒸馏？间隔映射、最后层映射等方法。
answer:
  mode: rubric
  reference_answer: |-
    选择合适的对应层进行特征或注意力蒸馏，直接影响知识传递的效率和效果。主要策略有：

    - 最后层映射：只让学生模型的最后一层去拟合教师模型的最后一层。这是MiniLM等方法采用的策略，它假设模型的最终输出包含了经过多层抽象后的核心知识，同时避免了繁琐的层与层匹配问题，最为灵活。

    - 均匀间隔映射：当教师和学生层数成倍数关系时（如12层蒸馏到6层），学生每隔一层对应教师每隔两层（Student_L1 → Teacher_L2, Student_L2 → Teacher_L4...）。这种方法简单直观，认为知识的抽象程度是均匀递进的。

    - 经验/手动映射：根据对任务的理解，手动指定需要匹配的层。例如，只蒸馏底层和顶层，跳过中间层，因为底层特征更通用，顶层特征更任务相关。

    - 可学习/动态映射：引入一个轻量级的注意力网络或门控机制，让学生模型在训练过程中动态地学习每一层应该关注教师的哪些层。这是最灵活但成本也最高的方法。

    - 逐层映射：直接一对一匹配（Student_L1→Teacher_L1, Student_L2→Teacher_L2...），简单粗暴，但要求师生层数相同，限制了学生模型的灵活性。

    选择哪种策略，需要权衡学生模型的结构灵活性、知识传递的精细度以及训练成本。实践中，均匀间隔映射和最后层映射因其简单有效而最为常用。


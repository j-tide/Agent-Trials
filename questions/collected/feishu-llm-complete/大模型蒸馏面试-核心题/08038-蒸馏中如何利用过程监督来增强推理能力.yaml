content:
  prompt: 蒸馏中如何利用“过程监督”来增强推理能力？
answer:
  mode: rubric
  reference_answer: |-
    过程监督是一种比结果监督（只评价最终答案）更精细的训练信号，在蒸馏中用于增强推理能力，尤其适用于需要长程推导的任务。

    核心思想：不仅告诉学生模型“最终的答案是什么”，更重要的是告诉它“推导过程中的每一步是否正确”。

    实现方式：

    - 训练过程奖励模型（PRM）：

    - 在蒸馏中应用PRM（强化学习蒸馏）：

    优势：过程监督能够提供更密集、更精确的学习信号，尤其是在推理链很长时，它能有效防止模型在中间步骤出错后越走越远，从而极大地提升了复杂推理任务的准确性和鲁棒性。这是OpenAI在训练其擅长数学推理的模型（如o1）时所采用的核心技术之一。


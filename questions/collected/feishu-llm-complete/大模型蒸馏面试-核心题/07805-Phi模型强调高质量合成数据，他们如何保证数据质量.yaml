content:
  prompt: Phi模型强调“高质量合成数据”，他们如何保证数据质量？
answer:
  mode: rubric
  reference_answer: |-
    微软Phi团队构建了一套精密的、全自动的数据生成与筛选管道来保证合成数据的质量，其核心理念是 “用LLM生成，再用LLM筛选”。

    一、数据生成

    - 种子引导：首先由人工编写少量的、高质量的“教科书”风格片段或训练示例作为种子。

    - 主题扩散与生成：让一个强大的LLM（如GPT-3.5/4）以这些种子为蓝本，围绕特定的、结构化的主题（如“牛顿第二定律”、“Python中的列表推导式”）逐步生成内容。生成过程会使用特定的Prompt，强制模型遵循教科书式的、逻辑递进的写作风格。

    二、多层质量过滤

    生成的文本需要经过严格的筛选，只有通过所有检查的才会被保留。

    - 事实性校验：对于知识性内容，交叉比对权威来源（如维基百科），剔除事实错误的文本。

    - 质量评分：训练一个专门的质量评分模型，或利用GPT-4对生成的文本进行多维度打分（如清晰度、连贯性、教育价值、逻辑性）。只保留高分文本。

    - 多样性过滤：使用文本嵌入模型，计算新生成文本与已有数据的相似度，防止内容重复，确保覆盖广度。

    - 规则过滤：剔除包含乱码、格式错误、不完整或包含敏感内容的文本。

    这套“生成-校验”的自动化流水线，保证了最终Phi训练数据的纯净度和高信息密度，是其成功的基石。

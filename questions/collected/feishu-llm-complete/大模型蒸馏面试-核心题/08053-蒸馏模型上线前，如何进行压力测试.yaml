content:
  prompt: 蒸馏模型上线前，如何进行压力测试？
answer:
  mode: rubric
  reference_answer: |-
    上线前的压力测试，旨在确保模型在极端、恶意和不可预测的真实世界输入下，依然能保持鲁棒和安全。这不同于常规的性能测试，它是一种对模型“韧性”的极限考验。

    压力测试方案：

    - 极限长度与格式测试：输入超长（远超训练长度）的Prompt；输入包含大量特殊字符、乱码、Base64编码的文本；输入完全为空或只有空格。

    - 意图理解与指令遵循破坏测试：输入包含矛盾信息的指令（如“用中文写一首英文诗”）；输入包含大量虚假前提的问题（如“为什么地球是平的？”）；输入需要多步推理的嵌套复杂指令。

    - 高强度安全攻击（红队测试）：使用所有已知的越狱攻击（Jailbreaking）模板进行轰炸；尝试通过多轮对话、角色扮演、情感诱导等方式逐步突破其安全防线。

    - 并发与吞吐压力：模拟线上真实请求量，甚至超出SLO的洪峰流量，观察模型在极限并发下的延迟、吞吐和错误率。

    - 长时间运行稳定性：进行连续的长时间（如72小时）运行，观察是否存在显存泄漏、性能衰减或随机性崩溃。

    通过标准：在压力测试中，模型不应出现崩溃、内存泄漏，对安全攻击的防御成功率应保持在95%以上，并且性能退化在可接受范围内。


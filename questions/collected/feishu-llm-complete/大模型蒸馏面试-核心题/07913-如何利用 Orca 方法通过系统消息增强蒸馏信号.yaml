content:
  prompt: 如何利用 Orca 方法通过系统消息增强蒸馏信号？
answer:
  mode: rubric
  reference_answer: |-
    Orca 是微软在 2023 年发布的一种先进蒸馏方法，其核心创新在于利用丰富、多层次的系统消息（System Messages）来为教师模型提供上下文，引导其产生更具教学价值的响应，从而将这些“软监督”信号注入到蒸馏数据中。

    系统消息的作用：在对话开始时，系统消息定义了一个全局的行为框架。它告诉模型“你是谁”、“你该如何回答”、“你应该注意什么”。Orca 巧妙地利用了系统消息的多样性，让教师模型在同一个问题上，展现出多种不同的“教学人格”或“思考角度”。

    Orca 如何使用系统消息增强信号：

    - 多样化的人格与角色：Orca 的Prompt中会包含大量风格迥异的系统消息，例如：

    - 指导生成过程：系统消息可以明确要求教师模型遵循特定的回答格式，例如：

    - 构建多任务学习信号：通过变换系统消息，Orca 将同一个基本问题转化为了多个不同的学习任务——解释任务、推理任务、角色扮演任务、总结任务等。学生模型通过学习这些丰富的教师响应，不仅学会了“答案”，更学会了如何根据不同的上下文和要求灵活调整自己的输出策略。这本质上是将“指令遵循”的元能力传递给了学生。

    因此，系统消息在 Orca 中起到了一个能力倍增器的作用，它将教师模型的各种高级能力激发出来，并将其封装成可学习的文本数据。


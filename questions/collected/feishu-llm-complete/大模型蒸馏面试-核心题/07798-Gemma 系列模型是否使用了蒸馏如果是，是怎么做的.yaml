content:
  prompt: Gemma 系列模型是否使用了蒸馏？如果是，是怎么做的？
answer:
  mode: rubric
  reference_answer: |-
    Gemma 是 Google 发布的一系列轻量级、先进的开放模型。根据公开的技术报告，Gemma 模型在训练过程中确实使用了知识蒸馏技术。

    具体做法：

    - 教师模型：Google 使用了内部训练的大型、高性能模型作为教师。这些教师模型在更庞大的数据上进行了充分训练，具备了强大的能力。

    - 蒸馏方式：Gemma 主要采用了基于Logits的在线蒸馏。这意味着在 Gemma 的预训练过程中，每个训练步，教师模型都会为学生模型生成下一个Token的概率分布（软标签）。学生模型的目标不仅是拟合训练数据中的真实Token，还要最小化其输出分布与教师分布之间的KL散度。

    - 训练细节：这是一种在线蒸馏，教师和学生可能同时进行训练，或者教师是一个已经充分训练好的模型。蒸馏损失与标准的预训练损失（交叉熵）结合在一起，共同优化学生模型。

    通过这种方式，Gemma 模型在有限的参数量下，学到了教师模型更平滑、更泛化的知识分布，从而获得了远超同尺寸模型的性能。


content:
  prompt: 在LLM中，使用隐藏状态蒸馏需要处理哪些问题？如序列长度不匹配。
answer:
  mode: rubric
  reference_answer: |-
    在大语言模型中应用特征蒸馏，面临着比CV领域更独特的挑战：

    - 序列长度不匹配与填充问题：LLM处理变长序列时通常会进行批量填充（Padding）。如果不做处理，模型会浪费大量计算在填充Token上，并且填充Token的隐藏状态会严重干扰蒸馏损失。

    - KV-Cache与自回归特性：LLM采用自回归方式生成，其隐藏状态是因果依赖的。直接对完整的序列进行蒸馏，可能会让学生看到“未来”的信息，导致信息泄露。

    - 位置编码的漂移：教师和学生可能使用不同的位置编码方案（如RoPE, ALiBi）。这会导致相同的Token在不同的位置索引下，其隐藏状态可能完全不同，直接进行MSE对齐效果不佳。

    - 巨大的计算和存储开销：LLM参数量巨大，存储和计算所有层的隐藏状态进行蒸馏，开销极高，容易导致OOM。


content:
  prompt: 对于分类任务，教师模型的 logits 能提供哪些比 one-hot 标签更丰富的信息？
answer:
  mode: rubric
  reference_answer: |-
    教师模型的 logits（进入softmax前的值）包含了极为丰富的信息：

    - 类别间的相似性与混淆结构：非正确类别的logits高低直接反映了教师认为该样本与这些类别的相似程度。例如，一张“美洲豹”的图片，教师可能给“猎豹”较高的logit，给“沙发”极低的logit。这种相似性矩阵是暗知识的核心。

    - 样本难度（不确定性）：如果教师对某样本的预测logits普遍较低且差距小，说明该样本是困难样本或处于决策边界。学生可以据此进行更有针对性的学习，例如更加关注这些困难样本。

    - 类别间的相关性：logits可以揭示出类别间的视觉/语义关联。通过多个样本的logits，甚至可以提取出教师模型隐式学习到的层次化类别结构。

    - 细粒度区分信息：在细粒度分类（如不同种类的鸟）中，差异非常微小。教师logits中非最大类的概率尽管低，但其相对分布可以指导学生注意最易混淆的类别。

    - 超出硬标签的任务知识：对于多标签任务、标签带噪声的任务，logits提供的软目标是更合理的学习目标，因为硬标签可能不准确或过于简化。

    因此，logits不是简单的“非对即错”判断，而是一幅教师对该样本认知的完整“频谱”，包含了大量有价值的信息。


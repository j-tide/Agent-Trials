content:
  prompt: 解释“网络瘦身”（Network Slimming）如何与蒸馏结合。
answer:
  mode: rubric
  reference_answer: |-
    Network Slimming 是一种经典的通道剪枝方法。它的核心创新在于利用BN层的缩放因子 γγ 来评估通道的重要性。

    基本流程：

    - 稀疏化训练：在正常训练损失函数中，对所有BN层的 γγ 系数施加 L1正则化 L = L_task + λ * Σ|γ|。

    - 通道选择与剪枝：稀疏化训练后，大部分BN层的 γ 会趋近于0。这些 γγ 接近0的通道，其输出被认为是不重要的。通过设定一个全局阈值，将所有 γ 低于阈值的通道直接剪掉。

    - 微调：对剪枝后的模型进行微调，以恢复精度。

    与蒸馏的结合点：上述第3步的“微调”是最佳的结合点。

    - 常规微调：只用硬标签对剪枝模型进行再训练。


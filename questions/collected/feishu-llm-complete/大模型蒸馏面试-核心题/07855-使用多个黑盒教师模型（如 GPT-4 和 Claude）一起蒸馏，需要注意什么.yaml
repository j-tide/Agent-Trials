content:
  prompt: 使用多个黑盒教师模型（如 GPT-4 和 Claude）一起蒸馏，需要注意什么？
answer:
  mode: rubric
  reference_answer: |-
    使用多教师蒸馏（Multi-Teacher Distillation）可以博采众长，获得比任何单一教师都更全面的能力。但同时，这也引入了新的挑战。

    需要注意的核心问题：

    - 教师间的知识冲突与风格差异：不同的教师模型（如GPT-4和Claude）拥有不同的训练数据、架构和对齐方式（RLHF）。因此，对于同一个问题，它们可能给出风格迥异、甚至事实矛盾的答案。例如，一个偏向详细列举，另一个偏向简洁总结；一个在安全性上更保守，另一个在有用性上更激进。

    - API成本与速率的成倍增加：每增加一个教师模型，数据生成的成本和API调用时间都会线性增长。必须精心规划，在哪些关键指令上使用多教师，哪些使用单一教师。

    - 输出空间对齐问题：不同教师可能使用不同的分词器和词表，导致在token-level的概率分布无法直接对齐。但在黑盒场景下，我们主要依赖文本输出，这个问题影响较小。但如果API提供了logprobs，则不同模型的logprobs无法直接进行算术平均，需要归一化处理。


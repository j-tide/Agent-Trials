content:
  prompt: 教师模型和学生模型分别扮演什么角色？
answer:
  mode: rubric
  reference_answer: |-
    在知识蒸馏框架中，教师和学生是一对师徒关系：

    - 教师模型：

    - 身份：通常是参数量大、结构复杂、在大量数据上训练过的高精度模型（如BERT-Large、GPT-4、ResNet-152）。

    - 职责：提供“知识源”。对于每个输入样本，它生成一个经过softmax后的类别概率分布（软标签）。这个分布包含了它对各个类别的相对置信度。

    - 训练状态：教师在蒸馏过程中参数冻结，不参与梯度更新，仅用于前向推理。它的作用是产生固定的、高质量的监督信号。

    - 学生模型：

    - 身份：通常是结构简单、参数量小、适合部署的轻量模型（如MobileNet、DistilBERT、小规模Transformer）。

    - 职责：学习知识。它接收教师模型输出的软标签作为额外的监督信号，同时也可以结合真实的硬标签进行训练。

    - 训练状态：参数在反向传播中持续更新，目标是最小化与教师输出分布之间的差异，同时尽可能拟合真实数据。

    比喻：教师如同一位经验丰富的导师，不仅告诉学生标准答案，还解释了各选项之间的细微差别（例如“这只动物更像是猫，但它也有一点像狗”）；学生则通过吸收这些丰富的信息，在有限的能力下尽可能接近导师的水平。


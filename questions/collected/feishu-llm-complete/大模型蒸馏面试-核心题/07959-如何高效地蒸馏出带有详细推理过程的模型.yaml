content:
  prompt: 如何高效地蒸馏出带有详细推理过程的模型？
answer:
  mode: rubric
  reference_answer: |-
    要高效地蒸馏出能输出详细推理步骤的小模型，即进行 CoT 蒸馏 或 推理过程蒸馏，通常需要解决数据构造、训练策略、效率等关键问题。高效方法包括：

    （1）自动构建推理数据集

    - 从大模型中采样：针对任务提示，使用温度采样或核采样生成多条含推理的回复，再通过自我一致性（如多数投票）筛选或使用外部验证（代码执行、数学校验）选出正确推理链，作为蒸馏数据。

    - 推理链增强：对已有的标准答案，让大模型“脑补”推理过程（反向生成 CoT），人工或规则审核后纳入。

    - 多步推理的课程数据：按推理步数对样本进行难度分级，先训练短推理，再逐步加入长推理链，使学生稳定收敛。

    （2）两阶段训练提升效率

    - 阶段一：标准 SFT 在推理数据上。直接使用推理问题-完整推理文本对进行监督微调，这是最主要的步骤，让小模型学会模仿推理格式和逻辑。

    - 阶段二：偏好对齐强化。使用对比样本（正确推理 vs 错误推理）进行 DPO 训练，使模型更加偏向正确的推理路径，这个阶段能显著提升推理正确率而无需额外数据标注，数据可来自模型自身的采样筛选。

    （3）多任务与辅助损失

    - 不仅训练生成完整推理，还同时要求模型输出最终答案，并用答案正确性的硬损失约束，保证推理不跑偏。

    - 引入过程奖励模型（Process Reward Model）给予步骤级别反馈（如每步是否正确），蒸馏时不仅对齐最终答案，也匹配每步的隐含合理性，这需要更细腻的数据标签，但蒸馏效果更好。

    （4）知识蒸馏的精简策略

    - 如果小模型容量有限，无法完美模仿超长推理链，可以使用逐步蒸馏：将大模型的中间推理状态（如某步的隐层表示）蒸馏到小模型对应步骤的表示上，而不单单依赖输出文本。

    - 利用 隐式 CoT：训练小模型在内部进行推理（可能不显式输出），通过匹配大模型在最终答案上的 logits 以及一些内部思考标记，避免输出冗长文本，加速推理。

    （5）高效训练的技术手段

    - LoRA / QLoRA 微调：在保持基座模型主体不变的情况下，仅训练少量参数适配推理格式，资源消耗低。

    - 序列打包与截断：将多条推理链拼接训练，提高 GPU 利用率，同时对过长的推理链适当截断并使用缓冲损失。

    - 数据去重与核心集选取：用嵌入聚类筛选多样且具代表性的推理样本，减少冗余。

    （6）利用搜索增强

    - 在蒸馏数据生成中引入树搜索（如 MCTS），让大模型产出多条推理路径，只蒸馏正确且高效的路径，让学生学到更简洁、更鲁棒的推理过程。

    以上方法的组合能够以较低成本蒸馏出推理能力强大的小模型，如在 GSM8K、MATH 等任务上，7B 模型可达到接近大模型的效果。


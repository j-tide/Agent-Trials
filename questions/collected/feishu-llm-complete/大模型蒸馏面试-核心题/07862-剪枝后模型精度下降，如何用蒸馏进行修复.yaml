content:
  prompt: 剪枝后模型精度下降，如何用蒸馏进行“修复”？
answer:
  mode: rubric
  reference_answer: |-
    剪枝，尤其是非结构化剪枝，会直接移除模型中的部分连接，导致模型的信息处理能力受损，精度下降。此时，使用蒸馏进行微调是恢复和提升精度的最有效手段。

    具体操作流程（剪枝后的蒸馏微调）：

    - 准备模型：

    - 联合微调：

    - 优化：优化器只更新学生模型中未被剪枝（即mask=1）的参数。已剪枝的参数梯度被强制为0，始终保持为零。

    修复原理：

    - 知识重新注入：剪枝过程破坏了模型原有的信息流。蒸馏微调相当于请回了原始教师，让教师重新引导剩余的参数，学习如何在信息通道缺失的情况下，重新组织信息流，最大程度地恢复原始功能。

    - 参数重定向：蒸馏的强正则化效应可以促进剩余的参数之间建立新的、更有效的连接，从而补偿被剪枝参数的功能。


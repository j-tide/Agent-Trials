content:
  prompt: 如何评估蒸馏模型是否学到了教师的“暗知识”？有什么间接指标？
answer:
  mode: rubric
  reference_answer: |-
    暗知识是教师模型输出概率分布中，非正确类别所蕴含的类别相似性结构。评估学生是否学到这种无法从硬标签中获取的知识，需要一系列间接指标：

    - 输出分布相似度（最直接）：在独立测试集上，计算学生和教师输出概率分布的KL散度或Jensen-Shannon散度（JSD）。注意，这衡量的是分布的整体相似性，而不仅仅是Top-1预测的准确率。一个低的JSD值表明学生很好地模仿了教师的整个“世界观”。

    - 校准度（Expected Calibration Error, ECE）：一个只从硬标签学习的模型往往会对自己的预测过度自信。如果蒸馏学生模型展现出与教师模型相近的、更低的ECE（即它的预测置信度与实际准确率更匹配），这证明它学到了教师模型“自知之明”的智慧，这是暗知识的重要体现。

    - 错误模式的一致性（混淆矩阵相似度）：分析学生和教师在测试集上的混淆矩阵。如果两者不仅在正确答案上一致，在容易混淆的错误类别上也高度一致（例如，都将“美洲豹”误判为“猎豹”，而不是“汽车”），这就完美地证明了暗知识（类别相似性）被有效传递。可以用矩阵的余弦相似度或Kappa系数来量化这种一致性。

    - 中间表征的结构相似度（CKA分析）：使用中心核对齐（CKA）技术，分析学生和教师模型中间层特征表示的结构。如果CKA值很高，说明学生不仅学会了最终的输出模式，还学会了教师处理信息的内部思考方式。这是对暗知识更深层的验证。


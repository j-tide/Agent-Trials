content:
  prompt: 解释“数据去污染”在蒸馏数据构造中的重要性。
answer:
  mode: rubric
  reference_answer: |-
    数据去污染是指在构造蒸馏数据集时，系统性地检测并移除所有与最终评测基准（如MMLU、GSM8K、HumanEval等）重叠或高度相似的样本。

    重要性：这是确保蒸馏模型评估结果真实有效的基石，其重要性怎么强调都不为过。如果评测集被污染，我们实际上是在用“开卷考试”的成绩来欺骗自己和外界，认为学生模型具备某种能力，但实际上它只是“背”下了答案，并不具备相应的泛化能力。这会导致：

    - 决策失误：基于虚假高分做出错误的产品或技术决策。

    - 学术不端：在论文或技术报告中声称的性能是虚假的。

    - 公平性丧失：无法与其他模型进行公平、客观的比较。

    实现方法：对蒸馏数据集与已知评测集进行n-gram重叠检测、语义相似度匹配（使用Sentence Embeddings + FAISS），并利用强模型进行最终的语义等价判断。只有通过严格去污的数据，才能用于训练。


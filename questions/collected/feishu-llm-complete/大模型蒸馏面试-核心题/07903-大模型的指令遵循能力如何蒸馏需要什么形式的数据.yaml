content:
  prompt: 大模型的指令遵循能力如何蒸馏？需要什么形式的数据？
answer:
  mode: rubric
  reference_answer: |-
    蒸馏指令遵循能力，本质上是将大模型在多样化指令和用户意图上的泛化能力迁移给小模型。这不能仅仅依赖传统的蒸馏损失，而是需要将指令数据本身作为一种知识载体。

    需要的数据形式：

    - 高质量的指令-回答对数据集：这是最核心的数据。这些数据可以由大模型自身生成（合成数据）。具体流程是：收集或生成大量多样化的指令，让大模型给出高质量、详细的回答。然后将这些（指令，回答）数据作为监督学习的标签（硬标签），直接用标准的语言模型训练损失（SFT）来微调小模型。

    - 多样化与复杂性：蒸馏指令遵循能力时，数据的多样性至关重要。指令必须覆盖各种任务类型（生成、推理、分类、代码等）、长度、风格和约束条件。否则，小模型会过拟合到模板化的指令格式，丧失泛化能力。

    - 包含“负样本”的偏好数据：为了让学生学会区分指令遵循的优劣，可以构造偏好数据。例如，让大模型对一个指令生成一个好回答和一个坏回答，然后用DPO等偏好优化方法训练小模型。

    核心方法：

    思维链蒸馏 + 监督微调是最佳组合。将大模型在回答复杂指令时产生的思维链（推理过程）也作为训练目标。这样，小模型不仅学会了遵循指令产生最终答案，还学会了如何思考以更好地遵循指令。

    因此，蒸馏指令遵循能力的关键在于：利用大模型生成海量、多样、带思维链的指令-回答数据，通过SFT训练小模型。


content:
  prompt: 什么是“暗知识”？为什么说它比硬标签包含更丰富的监督信号？
answer:
  mode: rubric
  reference_answer: |-
    “暗知识”（Dark Knowledge）指的是教师模型输出的软标签中，那些非最大概率类别的概率值所隐含的结构化信息。这些概率并不是随机噪声，而是反映了教师模型在训练数据上学习到的类别之间的相似性、混淆性以及数据中的细微规律。

    为什么比硬标签丰富？

    - 硬标签（one-hot）只指出一个正确答案，将其他所有类别都视为同等错误，不提供任何关于类别之间关系的信息。例如，它认为“猫”和“狗”的错误程度与“猫”和“汽车”的错误程度完全一样，这显然不符合真实世界。

    - 软标签（概率分布）除了给出正确答案，还告诉学生模型：“这张图片虽然是一只猫，但它也有5%的概率像狗，3%的概率像老虎，0.1%的概率像汽车”。这揭示了视觉相似性、语义关联等结构化知识。

    - 这种相似性信息起到了数据增强和正则化的效果：学生模型在训练时不仅追求正确答案，还会被惩罚那些将概率质量分配给与教师信念完全相悖的类别的行为。这迫使学生模型学习到更平滑的类别边界，泛化能力更强。

    因此，软标签可以视为一种知识载体，将教师模型学到的数据分布结构传递给学生模型。


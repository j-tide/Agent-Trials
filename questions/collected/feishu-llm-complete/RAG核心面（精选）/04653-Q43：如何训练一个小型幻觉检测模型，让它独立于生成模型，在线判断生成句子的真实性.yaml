  prompt: Q43：如何训练一个小型“幻觉检测”模型，让它独立于生成模型，在线判断生成句子的真实性？
answer:
  mode: rubric
  reference_answer: "\U0001F9EA 这是一个事后的保真度评估模型，要求输入（句子，上下文文档），输出“有支撑”/“无支撑”/“矛盾”。\n\n\U0001F3D7️
    训练方案：\n\n- 数据构造：\n\n- 模型选择：采用轻量的交叉编码器架构，例如 BERT-base 或 ELECTRA-small，输入 [CLS]
    句子 [SEP] 文档 [SEP]（若多文档可拼接），输出分类。\n\n- 细粒度检测：为了更精准，可以训练模型同时输出“句子中哪些词是幻觉”的 token-level
    标签（序列标注），用 BERT 做 NER 式抽取，定位幻象实体。\n\n- 独立部署：作为生成模型的后置过滤器。生成模型每输出一个完整句子，该幻觉检测器立即评分。若发现矛盾，则标记高亮，并阻止该句进入最终展示。对于流式输出，可在句边界进行判断。\n\n\U0001F517
    这种独立小模型不需要知道生成模型的内部状态，解耦性好，可离线升级，非常适合工程落地。\n\n---"

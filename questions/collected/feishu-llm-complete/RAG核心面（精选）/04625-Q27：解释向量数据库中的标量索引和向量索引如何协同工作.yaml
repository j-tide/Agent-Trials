content:
  prompt: Q27：解释向量数据库中的“标量索引”和“向量索引”如何协同工作。
answer:
  mode: rubric
  reference_answer: "\U0001F50D 这相当于传统数据库的 WHERE 子句和 AI 的 ORDER BY similarity 的无缝结合。\n\n协同工作流（以过滤后检索为例）：\n\n-
    查询到来：用户问“搜索2026年发布的合同条款中，关于违约金的部分”。\n\n- 解析为两部分：标量过滤条件: \"年份=2026 AND 文档类型='合同'\"，向量检索:
    语义向量接近\"违约金规定\"。\n\n- 标量索引先行（可选）：利用 B-Tree、倒排索引等标量索引，快速将候选人集合从数亿个文档块缩减到几十万个（满足条件的子集）。\n\n-
    向量索引在子集上检索（Pre-filtering）：向量搜索引擎（如 HNSW）在这个大幅缩小的子集上，执行高效的近似最近邻（ANN）搜索，快速找到语义最相似的
    Top-K 文档。这就是过滤后向量检索（Pre-filtering），能确保返回的结果既满足条件又语义相关。\n\n- 协同优化：很多数据库（Milvus、Weaviate）支持标量索引加速向量检索，例如通过标量索引将数据分片，查询时只访问相关分片，或使用向量索引返回大致相似结果后，再用精确的标量条件进行重校验，确保100%准确。\n\n⚙️
    二者协同，使得 RAG 不仅能回答“关于XX的问题”，还能精准到“张三写的关于XX的邮件”，实现权限与语义的完美融合。\n\n---"

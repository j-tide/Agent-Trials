content:
  prompt: Q23：如果原始文档不提供天然段落（如语音转文字记录），分块依据是什么？
answer:
  mode: rubric
  reference_answer: "\U0001F5E3️ 语音转录文本（ASR 输出）是“认知流”而非“结构流”，没有段落，只有时间戳和连续的语句。分块依据需从语义节奏和会话边界中创造。\n\n\U0001F6E0️
    依据与方法：\n\n- 基于停顿与话轮：如果转录带有说话人标签（Speaker Diarization）和句间停顿时长，可以将说话人切换和长时间停顿（>1.5秒）
    作为天然的“软段落边界”。这是最高质量的依据。\n\n- 基于主题分割模型：使用 TextTiling 或基于注意力机制的主题分割模型，分析句子序列的语义连贯性，自动检测主题转折点，这些点就是分块边界。此方法完全基于语义，不依赖格式。\n\n-
    基于固定长度 + 语义回溯：如果无说话人信息，先强制按句子切分，然后累积句子直到达到目标 Token 数的 80%，然后检查最后一句的向量与下一句的向量距离；若距离在阈值内则继续累积，若出现语义跳变则果断切分，实现动态、语义感知的块长度。\n\n-
    利用时间戳对齐补充：还可以将语音对应的文字与视频帧、PPT 页码等其他流媒体的时间戳对齐，当其他模态出现变化时，也可作为文本分块的辅助依据，实现多模态协同分块。\n\n\U0001F4A1
    所以，语音文本的分块本质上是一场语义段落重建，要充分利用时间、说话人和主题这三个额外信号。\n\n---"

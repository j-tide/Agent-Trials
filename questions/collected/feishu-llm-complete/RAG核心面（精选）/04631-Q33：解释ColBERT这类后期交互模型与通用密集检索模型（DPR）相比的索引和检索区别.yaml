answer:
  mode: rubric
  reference_answer: "\U0001F3AD 两者的核心区别在于 “何时、何处进行查询与文档的交互”。\n\n[嵌入表格未展开]\n\n\U0001F3AF
    简单说：DPR 是“看整本书的摘要选书”，ColBERT 是“先看目录定位，再逐字比较”，后者更细致，但代价是指数级膨胀的索引存储和更慢的检索。ColBERT
    适合对精确度有极致要求的专业搜索，DPR 则是规模化RAG的主力。\n\n---"

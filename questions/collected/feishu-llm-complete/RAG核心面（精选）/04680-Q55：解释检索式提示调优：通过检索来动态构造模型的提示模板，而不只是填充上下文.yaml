content:
  prompt: Q55：解释“检索式提示调优”：通过检索来动态构造模型的提示模板，而不只是填充上下文。
answer:
  mode: rubric
  reference_answer: "\U0001F9E9 定义：检索式提示调优（Retrieval-based Prompt Tuning）是指从预先构建的提示模板库中，根据当前输入检索出最适合的提示结构（包括指令格式、示例、角色设定等），然后动态组装成最终提示。这与RAG填充知识上下文不同，它填充的是“如何做任务的方法”。\n\n\U0001F50D
    与普通 RAG 的对比：\n\n- 普通RAG：系统提示 + 检索的知识片段 + 问题 → 生成答案。\n\n- 检索式提示调优：检索到的任务提示模板（含示例）
    + 问题 → 生成答案。知识可能来自模型内部，但任务形式由检索到的模板定义。\n\n\U0001F4DA 具体实现：\n\n- 建立一个提示模板向量库，每个条目包含：任务描述、few-shot示例、输出格式要求。例如，对于“总结会议纪要”，模板可能包含“用要点列出关键决议，最后附上行动项”。\n\n-
    当新任务到来，将其描述进行向量检索，找到最相似的历史任务模板，然后把该模板注入系统提示。\n\n- 如果任务需要背景知识，可以结合传统RAG，形成双检索：一个检模板，一个检知识。\n\n\U0001F3AF
    优点：\n\n- 模型无需微调就可以在新任务上表现出色，通过示例模板激发上下文学习能力。\n\n- 可以集中管理、版本控制提示模板，实现“即插即用”的任务适配。\n\n\U0001F4CC
    一个具体应用：代码生成平台根据用户输入的需求描述，检索类似功能的代码模板和提示结构，然后让LLM生成代码，生成的代码风格和API使用方式与模板一致。\n\n-
    高相似度阈值：必须设极高阈值（如 0.97），只对几乎一致的问法复用，避免“婚假几天”错用到“晚婚假几天”的缓存。\n\n- 缓存值附带范围限定：不仅存结果，还存结果的生成条件（如权限角色、时效性要求）。当新请求的上下文条件与缓存条目条件不一致时，禁用缓存，走实时检索。\n\n-
    时效性门控：缓存条目存储时，依据其来源文档的版本和时间戳，设定一个最大有效期。到期后缓存失效，保证政策类内容不会过时。\n\n- 后端主动失效钩子：当知识库某文档更新时，消息队列发送失效通知，语义缓存系统清除所有包含该文档
    ID 的缓存条目。\n\n- 地理：用户问“最近的服务中心在哪？”，结合 IP 或用户档案中的城市，改写查询为“深圳 服务中心地址”，并可能添加 filter:
    {city: \"深圳\"}。\n\n- 时间：用户问“这个月有什么新功能？”，系统根据当前月份生成 filter: {publish_date: \">=
    2026-06-01\"}。\n\n- 角色：员工问“我的福利待遇？”，系统识别其角色为“实习生”，在查询改写时加入“实习生”相关限定，并过滤权限。\n\n-
    Q1: “GPT-4o 在多语言任务上的基准测试成绩”\n\n- Q2: “GPT-4o 的 API 调用价格”\n\n- Q3: “Gemini 2.0
    在多语言任务上的基准测试成绩”\n\n- Q4: “Gemini 2.0 的 API 调用价格”\n\n- 自动对原查询进行更激进的同义词扩展、删除停用词、纠错，甚至使用
    HyDE 生成假设文档，用新生成的查询再次检索。很多失败是因为原查询表述太特殊。\n\n- 如果是因为元数据过滤条件（时间、类别）太严格导致的空结果，系统自动逐步放宽或去除部分次要过滤条件，重新检索，并提示用户“未找到完全匹配的近期文档，为您展示最相关的通用文档”。\n\n-
    返回预置的、由人工编写的领域概述或高频 FAQ 答案，告知用户当前无法直接回答但可以提供相关基础信息。\n\n- 若业务允许，调用 Bing/Google
    Search API，用优化后的查询搜索，将搜索结果摘要与提示“以下是根据网络搜索结果整理的答案，仅供参考”一并展示。\n\n- “抱歉，我未能找到关于此问题的相关资料。您可以尝试换个问法，或联系人工客服获取帮助。”
    —— 永远不要硬编。\n\n- 构建一个结构化映射文件：{\"笔记本\": [\"笔记本电脑\", \"laptop\", \"便携式电脑\"]}。\n\n-
    在查询解析时，对查询词查表，找到所有同义词集合。\n\n- 扩展策略：生成多个扩展后的查询变体（如“笔记本 维修” → “(笔记本 OR 笔记本电脑 OR
    laptop) AND 维修” 的 BM25 查询），或者直接将同义词追加到查询文本中（用于向量检索）。还可以利用索引分析器，在索引时将同义词一并编入，查询时无需改写，性能最佳。\n\n-
    使用 NLTK 的 WordNet 接口，对查询中的名词、动词获取同义词集（Synsets）。\n\n- 必须进行词义消歧，否则会引入大量无关词。例如“苹果”，要限定在“apple.n.01
    (水果)”或“apple.n.02 (公司)”。可通过词性标注和上下文粗分类辅助选择正确义项，仅扩展该义项下的同义词。\n\n- 通常只取最高频、最直接的
    2-3 个同义词，避免过度扩展。\n\n- 包含领域术语及其缩写、别名、上位词。如“NLP”扩展为“自然语言处理”。\n\n- 这通常以硬编码的精确映射表存在，确保专业术语的等价关系被检索系统识别。\n\n-
    信号1：最高向量相似度 < 阈值（如 max_sim < 0.6）。这是最直接的信号。\n\n- 信号2：Top-K 结果同质化严重。计算 Top-10 文档块之间的内部向量平均相似度，如果极高（>0.95），说明检索系统陷入了语义盲区，只召回了一个极窄方向的文档。\n\n-
    信号3：关键词缺失。检查查询中的核心实体名词，是否在 Top-5 文档的文本中出现。如果完全缺失，说明有严重偏离。\n\n- 步骤1：查询扩展重试。立即使用同义词库和
    HyDE 生成多个查询变体，并行执行第二次检索，取其中最高分结果集。\n\n- 步骤2：放宽过滤条件。如果原查询带元数据过滤，自动放弃或降级部分过滤条件，再次检索。\n\n-
    步骤3：回退至摘要级索引。从细粒度块检索切换到章节级粗粒度摘要检索，看是否能找到相关主题域。\n\n- 步骤4：最终判断。如果上述步骤仍未产生满足阈值的结果，系统判定检索彻底失败，触发降级回答流程（参见
    Q19）。\n\n- 与焦点词（“价格”）的匹配度（BM25分数、实体匹配）。\n\n- 与当前轮完整改写查询（“iPhone 16 Pro 价格”）的语义相似度（可将该查询与文档送入轻量级交叉编码器）。\n\n-
    对话状态一致性：文档是否仍在谈论同一个实体。\n\n- 使用规则或小模型从自然语言中解析出条件：“2023年之后”→“publish_date >= 2023-01-01”，“评分大于4”→“rating
    > 4”。\n\n- 或利用大模型生成一个结构化过滤对象，例如：\n\n- 在线自动评估：每个回答后，随机抽样让GPT-4等裁判模型评价“回答是否准确、全面”，并打分。\n\n-
    人工标注：对500-1000条样本进行人工评测，作为验证标准。\n\n- 用户隐式反馈：统计“赞/踩”、复制答案、后续点击等行为。\n\n- 对于查询中的每个Token向量，与文档的所有Token向量计算内积，取最大值（找到最匹配的文档Token）。\n\n-
    将查询所有Token的MaxSim值求和，作为该文档的最终相关分数。\n\n- “去年” → 2025年全年 → date >= 2025-01-01 AND
    date <= 2025-12-31\n\n- “上季度” → 当前是Q3，上一季度是Q2 (4-6月) → date >= 2026-04-01 AND
    date <= 2026-06-30\n\n- “最近三个月” → date >= 2026-04-06\n\n- 基于用户画像和行为的协同过滤或向量检索。例如，将用户ID和历史交互序列嵌入，检索相似用户偏好的商品。\n\n-
    或者通过查询改写，将用户标签（“男”、“42码”、“耐克偏好”）隐式注入查询：“跑鞋 男 42 耐克”，再进行检索。\n\n- 将两路结果汇集。对个性化召回的结果赋予额外权重或使用加权RRF（个性化排名高者得分加成）。\n\n-
    也可以在重排序阶段融合个性化特征：对于相关性召回Top-200文档，加入用户-商品交叉特征（品牌偏好度、尺码匹配度、历史购买概率），训练一个个性化重排序模型输出最终顺序。\n\n-
    正样本：将“查询-被点击且停留时长>30秒或后续购买的文档”作为正例；用户主动收藏、分享的更可靠。\n\n- 负样本：对于某查询，展示但未被点击的文档，可作为弱负例；需用逆倾向加权（IPW）
    等方法矫正位置偏差（排名靠前的天然获得更多点击）。\n\n- 是否包含比较词（“相比”、“更”）、桥梁实体（需要通过A找到B）、逻辑连词（“首先...然后”）。\n\n-
    问题长度和实体数量。\n\n- 第1轮：用原问题检索，得到文档D1。\n\n- 第1轮推理：模型根据D1提取关键实体/线索，生成下一轮子问题Q2。\n\n-
    第2轮：用Q2检索，得到D2，与D1合并。\n\n- 重复直到收集足够信息或达到最大步数。\n\n某企业内部知识库，查询：“请列出所有引用 EPC-7823-B
    技术规范的设计文档”。\n\n- 对于长度超过模型上限的文档块，切割成多个重叠窗口，每个窗口与 query 分别打分，然后取 max 或 mean 作为最终文档得分。取
    max 容易找到最相关的片段；取 mean 评估整体相关性。更优的是加一个注意力聚合网络。\n\n- 也可用 Late Interaction 模型如 ColBERT，它将文档和查询都表示为多个
    token 向量的集合，计算时通过最大相似求和，天然避免了长度限制，且无需截断。\n\n- 5个字的文档可能是“常见问题标题”。可以在索引时预先扩展：将文档块的前后邻近文本（如该段落的上文）拼接到一块，但保留源块标识。重排序时输入这个扩展后的文档，避免信息不足。\n\n-
    模型打分可能对长文档有偏向（更多内容匹配机会）。可以在训练时加入长度作为特征，或推理时用长度惩罚因子校正。\n\n- 重排序前，先根据文档长度做一个过滤：极短且无实体重叠的提前丢弃；极长文档先用一个小模型选出最具信息量的段，再送入重排序器。\n\n-
    收集大量 query，对每个 query 用教师模型对候选文档（如 BM25 召回的前100个）进行打分，得到软标签（相关性分数，可归一化为0~1）。\n\n-
    同时可包含人工标注的硬标签作为辅助。构造包含难负例（如排名高但不相关的文档）的数据集。\n\n- 学生模型结构：[CLS] query [SEP] document
    [SEP] → 线性层 → 分数。\n\n- 回归损失：MSE(学生分数，教师分数)\n\n- ListNet 损失：让学生预测的文档排序分布与教师的排序分布尽可能一致（KL散度），这能更好地学习相对排序。\n\n-
    可选加入硬标签的交叉熵损失。\n\n- 损失函数：\n\n- 联合训练：Loss = α * MSE + β * KL_div + γ * CE。\n\n-
    对长文档，学生无法处理全部，可以让学生学习教师对文档片段打出的分数，然后集成。\n\n- 可以使用中间层蒸馏，让学生学习教师的注意力矩阵或隐状态，但不是必需。\n\n-
    量化学生模型为 int8，进一步加速。\n\n- 在目标领域微调，弥补蒸馏损失。\n\n- 若 top-1 向量得分远高于 top-2（如得分差 > 0.3），且
    top-1 分数本身超过绝对阈值（如 0.9），则很可能已命中正确文档，跳过重排。\n\n- 用一个轻量级分类器，基于查询文本特征（长度、是否包含罕见实体、困惑度等）和初始检索结果的得分分布（标准差、熵）预测查询的“难度”。简单查询直接跳过。\n\n-
    在实时系统中，设置一个截止时间（deadline）。在重排序前检查剩余时间预算，如果不足，则用初始排序结果直接生成。可借鉴“anytime algorithm”思想：重排序器从top文档开始逐步处理，随时可中断并返回当前最优排序。\n\n-
    如果完全相同或高度相似的查询在近期缓存中存在高质量答案，直接返回缓存答案，跳过整个检索和重排。"

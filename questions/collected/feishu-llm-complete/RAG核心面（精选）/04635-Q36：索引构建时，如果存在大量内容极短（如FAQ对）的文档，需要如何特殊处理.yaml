content:
  prompt: Q36：索引构建时，如果存在大量内容极短（如FAQ对）的文档，需要如何特殊处理？
answer:
  mode: rubric
  reference_answer: "\U0001F4CB FAQ 的特点是每个条目极短（通常一对问答几十个字），直接拿单个 FAQ 作为 chunk 会因上下文过于稀疏，导致向量表示质量差，检索漂移严重。\n\n\U0001F6E0️
    特殊处理策略：\n\n- 聚合索引（最佳）：将若干语义相关的 FAQ 合并为一个更大的 chunk。可以使用聚类算法（如对 FAQ 问题进行向量聚类），每个簇形成一个“FAQ
    组块”，组块内是多个 Q:... A:... 的拼接。检索时，这个组块被命中，生成器可以看到一组相关问答作为参考，效果远超单个条目。\n\n- 摘要代理法：为每个
    FAQ 分类或主题生成一个摘要段落，将摘要段落作为检索块。命中后，将原 FAQ 对作为元数据注入。\n\n- 对话式拼接：如果 FAQ 存在自然的前后关联，将它们按照对话流拼接，形成一段有上下文的多轮问答文本，强化语义丰富度。\n\n-
    元数据标记：为每个 FAQ 块附上详尽的 topic 和 keywords 元数据，并以此为主过滤手段，依赖标量索引先缩小范围，再向量检索。\n\n\U0001F4CC
    核心思想：短文本需借力上下文，不能让它裸奔，必须通过聚合或代理给它“壮胆”。\n\n---"

answer:
  mode: rubric
  reference_answer: "\U0001F9EA 知识蒸馏（Teacher-Student）方案：\n\n教师模型：一个大型的交叉编码器（如 electra-large
    或专有的重排序大模型），能够给出高质量的 (query, document) 相关性分数。\n学生模型：一个轻量的 BERT-base 甚至 BERT-tiny，目标是模仿教师的打分。\n\n\U0001F4CB
    步骤：\n\n- 构建训练数据\n\n- 蒸馏训练\n\n- 数据增强与渐进式蒸馏\n\n- 蒸馏后的优化\n\n\U0001F4C8 效果：BERT-base
    学生模型通常能保留教师模型 95% 以上的排序质量，推理速度快 10 倍以上。\n\n---"

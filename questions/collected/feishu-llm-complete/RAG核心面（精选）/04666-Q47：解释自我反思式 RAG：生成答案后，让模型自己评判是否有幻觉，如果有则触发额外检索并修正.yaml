answer:
  mode: rubric
  reference_answer: "\U0001FA9E Self-Reflective RAG 是一种让模型扮演两个角色：生成者和批评者，通过内部对话迭代提升答案质量。\n\n♻️
    典型流程：\n\n- 初始生成：基于第一轮检索，模型生成答案。\n\n- 自我反思提示：紧接着，将同样的上下文和刚生成的答案拼入一个新 prompt，要求模型扮演“严格的事实核查员”，逐句检查答案是否完全被提供的文档支持。输出包括：每句的判定（支持/不支持/矛盾）以及理由。\n\n-
    触发检索：若判定中存在“不支持”或“矛盾”，模型会生成一个澄清查询，例如“还需要查找关于X的数据”，然后系统执行额外的检索，获取新的文档片断。\n\n- 修正与重生成：将新检索到的文档加入到原有上下文中，连同反思出的问题，再次给模型生成修正后的答案。\n\n-
    循环终止：直到所有句子都得到支持，或达到最大迭代次数。\n\n\U0001F4CA 实现方式：\n\n- 可以通过 ReAct 或 Self-RAG 论文中的思想训练，让模型学习输出特殊
    token [Retrieve] 或 [Check]。\n\n- 简单实现可以用 few-shot 提示让模型按格式反思。如：“请评估你的回答：1. 是否有信息未在资料中出现？2.
    如有，请写一个搜索词以补充信息。”\n\n- 也可以训练一个小型批评模型（Critic），预测生成内容需要额外检索的概率。\n\n\U0001F4A1 优势：这种架构能大幅减少幻觉，特别适合高可靠性场景。\n\n---"

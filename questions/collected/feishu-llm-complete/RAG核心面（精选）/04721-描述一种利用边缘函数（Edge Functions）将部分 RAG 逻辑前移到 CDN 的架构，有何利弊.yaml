content:
  prompt: 描述一种利用“边缘函数”（Edge Functions）将部分 RAG 逻辑前移到 CDN 的架构，有何利弊？
answer:
  mode: rubric
  reference_answer: "\U0001F30D 将检索的某些轻量逻辑移到接近用户的边缘节点，目标是极低延迟和减轻中心压力。\n\n\U0001F3D7️
    架构：\n\n- 边缘层（Edge Function）：部署在 Cloudflare Workers、Deno Deploy 或 AWS Lambda@Edge
    等。\n\n- 中心层：完整的 RAG 管道，处理边缘未命中的复杂查询或需要大模型生成的请求。\n\n- 流程：用户请求 -> CDN 边缘函数 -> 检索边缘缓存（向量+规则）
    -> 若命中，直接构造响应返回；未命中，转发到中心服务。\n\n✅ 利：\n\n- 延迟极低：用户从最近节点获得响应，去除回源延迟。\n\n- 成本节约：大量重复、简单查询在边缘解决，节省中心
    GPU/LLM 成本。\n\n- 高可用：中心服务故障时，边缘仍可提供基于缓存的基本回答。\n\n❌ 弊：\n\n- 一致性挑战：边缘缓存的索引需要同步更新，CDN
    的全球同步延迟可能导致用户看到过时信息。需要设计缓存失效策略。\n\n- 能力受限：边缘函数运行时通常受限（内存、CPU 时间、不支持 GPU），无法运行复杂重排序或大模型，只能做简单的检索匹配。\n\n-
    复杂度上升：需要管理边缘和中心两套逻辑、索引版本，增加运维负担。\n\n- 安全与数据合规：边缘节点遍布全球，数据可能被缓存在不同地区，可能违反数据驻留要求。\n\n\U0001F50D
    适用场景：\n\n- 面向全球用户的 FAQ 类问答，知识更新不频繁。\n\n- 突发流量保护：当热点事件导致同一问题瞬间大量涌入，边缘直接吸收，保护中心。\n\n⚖️
    结论：边缘 RAG 是“以空间换时间”的极致优化，适合作为高速缓存层而非完整替代。\n\n---"

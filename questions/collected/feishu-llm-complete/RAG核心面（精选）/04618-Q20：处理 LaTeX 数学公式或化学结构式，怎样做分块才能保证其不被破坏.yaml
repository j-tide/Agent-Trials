content:
  prompt: Q20：处理 LaTeX 数学公式或化学结构式，怎样做分块才能保证其不被破坏？
answer:
  mode: rubric
  reference_answer: "\U0001F9EE LaTeX 公式和化学式是结构化字符串，一旦被切分器拦腰截断，就会从语义符号变成乱码。保证其完整性的核心原则是：将这些结构识别为不可分割的原子单元，分块器必须在其边界处下刀。\n\n\U0001F6E1️
    防护策略：\n\n- 自定义分隔符优先级：在递归文本切分器中，将 LaTeX 环境标记（如  ,  , \\begin{equation}...\\end{equation}）和化学式环境（如
    \\ce{...}）加入到最高优先级的分隔符列表中，并禁止在其内部进行切分。\n\n- 基于正则的原子块保护：预处理阶段，用正则表达式匹配所有数学和化学环境，将其替换为唯一的占位符（Placeholder），如
    <<MATH_BLOCK_0>>。对剩下纯文本进行分块后，再将占位符替换回原公式。这样确保公式毫发无伤。\n\n- 上下文感知的归组：公式往往与上下文紧密关联（如“根据公式
    (3) 可得”）。分块时，应保证公式与引用它的句子、以及公式下方紧随的解释段落，尽可能容纳在同一个 chunk 内。可以通过设定公式前后的“粘连”窗口实现。\n\n-
    结构化拆分：对于大型对齐环境（如 align），如果不得不切开，应选择在 \\\\ 换行符处进行，而不是在行内切断。这样每一行公式仍然完整，只是损失了多行对齐的逻辑，可通过后续的上下文恢复技术补偿。\n\n最终，LaTeX
    文档的分块应该是 “LaTeX 感知的递归切分”，将语言结构保护与数学环境保护编织在一起。\n\n---"

answer:
  mode: rubric
  reference_answer: "\U0001F3E2 多租户数据隔离是 SaaS 安全的基石，必须使用逻辑隔离+检索强过滤方案。\n\n设计方案：\n\n-
    存储隔离（逻辑分层）：\n\n- 查询时强制过滤（最关键）：\n\n- 索引命名规范：使用 {tenant_id}_{collection_name} 作为最终索引名，从架构上避免跨租户误操作。\n\n\U0001F510
    永远不要依赖“应用层过滤”或“大模型自觉性”来保证租户隔离，必须让数据库在检索运算前就过滤掉数据。\n\n---"

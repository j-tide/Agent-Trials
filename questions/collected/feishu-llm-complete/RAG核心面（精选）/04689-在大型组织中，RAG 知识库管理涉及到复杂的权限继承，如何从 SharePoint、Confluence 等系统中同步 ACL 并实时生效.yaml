answer:
  mode: rubric
  reference_answer: "\U0001F510 企业知识库的核心痛点是：你能搜到的，必须是你能看的，不能搜到同事的机密文档。\n\n\U0001F3D7️
    权限感知 RAG 设计：\n\n- 源头系统 ACL 同步\n\n- 检索阶段的权限注入\n\n- 实时生效挑战\n\n\U0001F504 实现：构建一个
    ACL 同步微服务，维护一份“文档-用户”矩阵的物化视图，提供毫秒级查询接口供检索后过滤使用，直到向量库原生支持动态 ACL 过滤为止。\n\n---"

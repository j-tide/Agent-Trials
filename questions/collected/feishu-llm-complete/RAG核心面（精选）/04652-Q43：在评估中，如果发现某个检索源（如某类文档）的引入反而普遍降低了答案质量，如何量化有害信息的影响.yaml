content:
  prompt: Q43：在评估中，如果发现某个检索源（如某类文档）的引入反而普遍降低了答案质量，如何量化“有害信息”的影响？
answer:
  mode: rubric
  reference_answer: "\U0001F4A3 这种情况说明知识库被“污染”了，某类文档成为了有害信息源。我们需要量化其毒害程度。\n\n\U0001F52C
    量化方法：\n\n- 隔离实验（Ablation Study）\n\n- 准备两份知识库：一份包含该疑似有害源（完整库），一份剔除该源（净化库）。\n\n-
    用同一批测试问题，分别在这两个库上运行 RAG，对比答案质量分数。\n\n- 有害影响度 = (净化库得分 - 完整库得分)。正值越大，有害信息越严重。\n\n-
    归因分析\n\n- 记录每次生成答案时具体引用了哪些源的文档。\n\n- 对于低分答案（如人工判错或自动评分低），统计有害源文档的参与率：有多少低分答案的检索结果中包含该源文档，其中又有多少被实际引用到答案中。\n\n-
    计算 Odds Ratio：该文档源出现在坏答案中的概率 / 出现在好答案中的概率。若显著>1，则是有害源。\n\n- 有害传播链分析\n\n- 模拟“如果该文档源的某片段被模型读到，是否会诱导出错误”。可以用小规模对照实验：给
    LLM 相同的正确上下文，再额外附加一份有害源片段，观察答案是否变差。测量误导成功率。\n\n- 综合有害指数\n\n- 结合以上几个指标，加权合成一个有害源指数，用于排序定位需要清理或降权的知识源。定期运行此评估，可以及早发现文档腐化问题。\n\n\U0001F6E0️
    工程落地：设置监控面板，每个知识源的“健康分”动态更新，一旦低于阈值，自动告警并临时屏蔽该源。\n\n---"

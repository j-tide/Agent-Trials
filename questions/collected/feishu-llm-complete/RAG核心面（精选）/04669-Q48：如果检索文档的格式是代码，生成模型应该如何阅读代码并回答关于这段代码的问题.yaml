content:
  prompt: Q48：如果检索文档的格式是代码，生成模型应该如何“阅读”代码并回答关于这段代码的问题？
answer:
  mode: rubric
  reference_answer: "\U0001F4BB 代码是一种结构化的形式语言，直接将其当作纯文本喂给 LLM 是可行的（因为 LLM 训练时见过大量代码），但要提升效果，需要特殊处理。\n\n\U0001F50D
    策略：\n\n- 代码分块与摘要：检索时不要只返回原始代码，同时用一个小型代码摘要模型为代码块生成自然语言注释（如函数功能、输入输出）。检索时可以用自然语言查询找到相关代码块，然后将
    摘要 + 源代码 一起提供给生成模型。\n\n- 结构感知截断：代码块可能很长，用基于 AST（抽象语法树）的方式分块，确保每个块是一个完整的函数或类，而不是粗暴截断，避免破坏语法结构。\n\n-
    提示词设定：明确指示：“你将收到一段代码及其摘要。请分析代码逻辑，回答用户问题。如果问题涉及执行，请模拟执行过程并给出结果。” 这样可以激活模型的代码理解能力。\n\n-
    代码执行工具增强：更可靠的是检索 + 代码解释器的 RAG。检索到代码后，不要求 LLM 凭空推理结果，而是将代码送入沙箱执行（如 Python 解释器），把执行输出作为证据一起提供给
    LLM。这样模型可以回答“这段代码的输出是什么”，答案由真实执行保证。\n\n- 多模态表示：也可以将代码的流程图或 AST 图转为图片，用多模态模型理解。\n\n\U0001F4CC
    核心：在代码场景，检索提供的是“源代码”，但要转化为模型易于推理的形式，通常需要加入注释或执行结果作为辅助上下文。\n\n---"

answer:
  mode: rubric
  reference_answer: "\U0001F424 金丝雀发布的核心在于风险可控的灰度验证：用真实流量快速暴露新算法的问题，同时确保爆炸半径仅限一小部分用户。对于
    RAG，这不仅仅是模型切换，可能还涉及向量库索引、重排序逻辑、切片参数的变更，因此发布对象可能是“检索管线版本”。\n\n[图片内容未导入]\n\n\U0001F6A6
    策略设计七要素：\n\n- 流量标识与分流机制\n\n- 金丝雀粒度递进\n\n- 指标对比与决策\n\n- 检索管线版本化\n\n- 可观测性支撑\n\n-
    新索引的预构建\n\n- 回滚预案\n\n\U0001F501 总结：金丝雀发布让 RAG 从“一次性赌博”变成“可控的渐进式迁移”，是保障复杂检索系统稳定性的基础能力。\n\n---"

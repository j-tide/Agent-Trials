content:
  prompt: Q44：重排序模型除了考虑语义相关性，是否应该融入“权威性”“时效性”等信号？怎么融入？
answer:
  mode: rubric
  reference_answer: "\U0001F3DB️ 必要性：绝对应该。相关性只是“内容是否对题”，但业务需要的是“对题且可信且新鲜”。例如，问“新冠最新治疗方案”，一篇2020年的权威论文即使语义高度相关，也不如2025年的医疗指南。\n\n\U0001F517
    融入方法一：特征工程 + 标量融合\n\n- 为重排序模型（如cross-encoder）增加辅助输入。在输入 [CLS] query [SEP] document
    [SEP] 的基础上，扩展为：[CLS] [权威:高] [时效:2025-07] query [SEP] document [SEP]。将这些信号转为特殊
    token 嵌入与文本交互，让 Transformer 自行学习融合权重。\n\n- 或者在交叉编码器输出相关性 logit 后，额外叠加一个多层感知机，输入：语义分数、权威性分数（可通过页面
    PageRank、来源域名权重等计算）、时效性分数（基于文档发布时间与当前时间的衰减函数）、用户历史点击率等，最终输出一个综合重排序分数。\n\n\U0001F4CA
    方法二：多任务学习\n\n- 在重排序模型训练时，同时优化三个目标：相关性、权威性分类、时效性匹配。共享底层编码器，输出三个头。这样模型内部表征就自然包含了这些维度，然后在推理时仅使用“相关性”头或加权融合。\n\n\U0001F50D
    权威性信号来源：可以预先构建一个权威度知识图谱，比如 .gov 域名高权威，内部知识库中标记为“官方发布”的文档权威度高于“论坛帖子”。\n\n\U0001F4A1
    注意：不同场景侧重点不同。科研文献重权威，新闻重时效，客服工单重解决率。融合系数可由查询类型动态决定。\n\n---"

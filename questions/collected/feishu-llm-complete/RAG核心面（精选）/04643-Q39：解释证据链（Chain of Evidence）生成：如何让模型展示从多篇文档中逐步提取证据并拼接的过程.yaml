content:
  prompt: Q39：解释“证据链”（Chain of Evidence）生成：如何让模型展示从多篇文档中逐步提取证据并拼接的过程？
answer:
  mode: rubric
  reference_answer: "⛓️ “证据链”生成要求模型像侦探一样，把推理过程拆解成一系列的“证据引用→推理→中间结论→下一个证据”步骤，最终形成闭环。\n\n\U0001F9E9
    实现方式：中间步骤显式化\n\n- 多步推理提示：设计提示模板，要求模型用特定格式输出，例如：\n\n- text\n\n- 步骤1: 阅读 [文档A] 的第X句，得出事实1:
    ...步骤2: 结合 [文档B] 中的表格数据，与事实1进行计算，得到中间结论: ...步骤3: 根据 [文档C] 的规范，将中间结论应用到案例，得出最终答案:
    ...\n\n- 这相当于链式思维（CoT）与检索源的绑定。\n\n- RAG 与工具调用结合：可以在 Agent 框架下，每步生成一个想法后，立即调用检索工具验证或获取下一跳信息。例如，使用
    ReAct 模式：Thought → Action(检索) → Observation → Thought...，每一步都输出当前证据。最终把所有步骤展示出来。\n\n-
    结构化输出解析：让模型输出 JSON，包含 evidence_chain 数组，每项有 source_id, cited_text, inference。前端再渲染成证据链图。\n\n\U0001F4DA
    训练数据构造：要稳定生成证据链，最好用微调。用人工或强模型构造多跳问答数据，每个答案都带上从哪些文档、哪些段落逐步推理的过程，微调一个专门生成证据链的模型。\n\n\U0001F4A1
    注意：证据链的核心价值是可解释性和可审计性。用户能清楚看到结论是怎么得出来的，哪里引用了哪个文档，大大提升信任。\n\n---"

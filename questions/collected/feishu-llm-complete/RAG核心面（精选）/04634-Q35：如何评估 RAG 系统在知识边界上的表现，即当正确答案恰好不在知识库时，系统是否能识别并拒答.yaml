content:
  prompt: Q35：如何评估 RAG 系统在“知识边界”上的表现，即当正确答案恰好不在知识库时，系统是否能识别并拒答？
answer:
  mode: rubric
  reference_answer: "\U0001F9EA 这评估的是系统的自知之明——能否在知识空白时选择“我不知道”而非“胡编乱造”。我们需要专门构造知识边界测试集，并从多个维度量化表现。\n\n\U0001F528
    测试集构建方法：\n\n- 人工筛选边界问题：从知识库文档中反向推导出一组“反事实问题”。例如，知识库包含产品A、B、C的介绍，那么我们故意问产品D（完全不存在）的使用方法。同时混入正常可答问题作为对照。\n\n-
    半自动生成：用大模型生成与知识库主题相关、但答案确实不在库内的问题。例如给模型库内文档摘要，要求它生成“无法根据这些文档回答”的问题。再经过人工核验，确保答案确实缺失。\n\n-
    时间截断法：对于新闻类知识库，选取某个时间点之前的数据建库，然后询问该时间点之后发生的事件。这是天然的边界问题。\n\n\U0001F4CA 评估指标：\n\n-
    拒答率：在边界问题上，系统输出明确拒答（或低置信度）的比例。越高越好，但不能以牺牲可答问题的回答率为代价。\n\n- 幻觉率：在边界问题上，系统给出看似合理但无据可查的回答的比例。这是关键负指标。\n\n-
    边界分类的 F1：将“可答”和“不可答”视为二分类，系统若能正确识别知识边界，其分类F1会很高。\n\n- 校准误差：比较模型输出的置信度与实际正确率。对于边界问题，理想情况是模型给出的置信度显著低于可答问题。\n\n\U0001F50D
    深层分析：\n\n- 除了看整体指标，还要按问题类型细分：事实性问题 vs 推理问题。有些问题答案虽不在库中，但可以通过库内知识的推理得出（合理推断），这类不应视为边界。所以边界问题还要标注“是否可推断”。\n\n-
    评估系统是否给出了“部分答案”并明确指出缺失部分。这也是高级的边界处理能力。\n\n\U0001F4A1 实践：维护一个每周更新的“知识边界挑战集”，包含业务中真实遇到但文档未覆盖的用户问题，持续追踪拒答率和幻觉率的变化曲线。\n\n---"

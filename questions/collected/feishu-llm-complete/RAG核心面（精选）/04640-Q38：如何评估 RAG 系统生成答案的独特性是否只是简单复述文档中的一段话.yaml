content:
  prompt: Q38：如何评估 RAG 系统生成答案的“独特性”？是否只是简单复述文档中的一段话？
answer:
  mode: rubric
  reference_answer: "\U0001F4DD 独特性评估是要看系统是在“理解后重组”还是“机械搬运”。这直接关系到价值感——如果用户读到的东西就是原文复制，体验很差。\n\n\U0001F52C
    评估维度与方法：\n\n- 文本相似度指标\n\n- 最长公共子序列（LCS）比例：计算答案与最相似检索文档的 LCS 长度 / 答案总长。比例过高（如>0.8）则疑似复述。\n\n-
    ROUGE-L：常用于摘要评估，衡量答案与文档片段的重叠。但 ROUGE-L 高不一定坏，要看是否恰当引用。\n\n- BERTScore 相似度：语义层面的相似。如果相似度接近1.0，通常意味着复述或极轻微改写。我们要的是0.7-0.9之间的合理区间。\n\n-
    信息重组度\n\n- 用一个 NLI 模型判断答案中的每一个事实子句分别被哪些检索文档支持。若所有子句都仅来自同一篇文档的连续文本，则为搬运。若来自不同文档甚至跨文档融合，则独特性高。\n\n-
    具体实现：答案拆成原子事实，检索每个事实的源文档ID，计算源文档多样性（去重后的文档数/事实总数）。指数越高，融合度越高。\n\n- 生成改写率\n\n-
    比较答案与原文的句法树差异。用句法依存距离或编辑距离衡量改写程度。健康的答案应该有一定的编辑距离，结构上有变化。\n\n- 人工评测定级\n\n- 定义三个等级：①几乎照搬
    ②部分改写 ③充分理解后生成。抽样人工打分，作为上述自动化指标的校准基准。\n\n\U0001F3AF 构建平衡：独特性并非越高越好。对于法律、合规等场景，精确复述条款可能是优势。所以评估时要结合任务性质，设定独特性适宜度指标。\n\n---"

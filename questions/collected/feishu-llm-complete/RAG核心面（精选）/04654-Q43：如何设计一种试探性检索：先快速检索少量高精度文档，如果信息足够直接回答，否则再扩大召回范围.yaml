content:
  prompt: Q43：如何设计一种“试探性检索”：先快速检索少量高精度文档，如果信息足够直接回答，否则再扩大召回范围？
answer:
  mode: rubric
  reference_answer: "\U0001F6A6 级联检索架构：\n\ntext\n\n查询 → [第1级：高精度快速检索] → 信心评估 →     →
    足够 → 直接生成答案    → 不足 → [第2级：高召回大范围检索+重排] → 生成答案\n\n\U0001F50E 第一级：高精度轻量级检索器\n\n-
    可以是一个基于关键词布尔过滤 的搜索引擎（如 Elasticsearch 的 multi-match，boost精确匹配字段），或一个极快的小向量索引（如使用
    int8 量化的 embedding，只取 top-3）。特点是延迟极低（<10ms），但要求结果信噪比高。\n\n- 应用场景：若查询是典型的FAQ式问题，第一级通常能直接命中标准答案。\n\n\U0001F9EA
    信心评估机制\n\n- 方法A：基于检索分数的阈值。如果第一级返回的 top-1 文档的相似度分数 > 0.95，且 top-1 与 top-2 的分数差距很大（陡峭），则认为足够。\n\n-
    方法B：用一个小型自然语言推理（NLI）模型快速判断检索到的片段是否包含回答查询所需的所有信息。输出“蕴含”或“中立”，据此决定是否进入下一级。\n\n-
    方法C：生成器快速生成一个草稿答案，同时输出置信度 token，若置信度低于阈值，触发第二轮。\n\n\U0001F4C8 第二级：高召回深水区\n\n-
    启用完整版向量检索，扩大 top_k，加入多路召回（BM25+向量），并使用重排序模型对候选集精细排序。甚至可引入多跳检索或查询分解44。\n\n⚡ 工程考量：通过这种两阶段设计，90%以上的简单查询在第一级解决，延迟极低；复杂查询才付出更高成本，总体性价比最优。\n\n---"

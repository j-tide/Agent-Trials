content:
  prompt: Q48：在多租户系统中，某租户的检索请求是否可能从其他租户的检索缓存中获益？如何安全地共享？
answer:
  mode: rubric
  reference_answer: "\U0001F3E2 前提：不同租户的文档库严格隔离，但可能存在公共知识库（如法律法规库、共享的产品手册），这部分可以被多个租户合法访问。\n\n\U0001F510
    安全共享机制设计：\n\n- 缓存键设计：缓存键由 (租户ID, 查询文本哈希, 上下文哈希) 组成。如果租户A发起查询，只从缓存键匹配租户A的记录，保证绝对隔离。\n\n-
    公共知识层缓存：单独划出一块“全局共享缓存”，其缓存键仅基于查询和公共文档的版本号，而不带租户ID。当租户B查询“劳动法第39条”时，系统识别出该查询所涉及的文档全部来自公共法律库，于是允许从全局缓存读取结果。这需要具备检索源标记能力：在索引阶段为每个文档打上可见性标签（visibility:
    tenant_A 或 visibility: public）。检索时，如果所有召回文档的标签都是public，且查询不含租户私有信息，则启用全局缓存。\n\n-
    差分隐私或聚合信息：更高级的做法是，不直接共享缓存结果，而是共享统计信息。例如，公共文档的“热门查询”或“高权重片段”可以预计算供所有租户加速，而不会泄露某个租户的具体查询内容。\n\n\U0001F50D
    安全审计：共享前必须经过查询审计过滤器，确保查询中没有嵌入租户自定义的敏感词、实体名等。如检测到可能泄露租户业务内容的词，则强制走租户私有缓存。\n\n\U0001F511
    结论：有条件的、基于文档可见性的安全共享可行，可显著降低重复查询的延迟与成本，尤其在法规知识库等公共场景。\n\n---"

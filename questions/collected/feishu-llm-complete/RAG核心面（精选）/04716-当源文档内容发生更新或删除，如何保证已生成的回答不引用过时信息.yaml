content:
  prompt: 当源文档内容发生更新或删除，如何保证已生成的回答不引用过时信息？
answer:
  mode: rubric
  reference_answer: "\U0001F5D1️ 这是典型的“已生成内容的时间戳管理”问题，靠生成时快照或实时校验来保证。\n\n保证机制：\n\n-
    对话/答案的元数据记录：每次生成答案时，将回答所引用的文档 ID 和它们的版本号/时间戳一起记录到生成答案的元数据中。如“此答案基于 2026-07-06
    14:30 的资料生成”。\n\n- 引用显示时效：在前端展示时，在引用旁边标注“引用自 XX 手册（2025年版）”，让用户感知信息的时效性。\n\n-
    主动失效（较高级）：\n\n- 软删除与文档墓碑：删除文档时，不物理删除向量，而是将其标记为 status: deleted 并存留一段时间。检索时过滤掉已删除文档。如果历史答案引用了被标记为
    deleted 的文档，系统可感知并提示用户。\n\n\U0001F4CC 核心思想：知识是活的，答案也应具有“保鲜期”的概念。\n\n---"

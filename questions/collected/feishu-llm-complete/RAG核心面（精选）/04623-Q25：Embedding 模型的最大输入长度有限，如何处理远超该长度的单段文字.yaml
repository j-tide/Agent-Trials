content:
  prompt: Q25：Embedding 模型的最大输入长度有限，如何处理远超该长度的单段文字？
answer:
  mode: rubric
  reference_answer: "\U0001F4CF 这是一个必须直面的工程局限。当有一段包含 3000 Token 的关键论证不能切碎时，需要采用无损降维或有损归约策略。\n\n\U0001F527
    处理手段：\n\n- 摘要注入法（最常用）：用强模型（如 GPT-4o mini）对长段落生成 200-300 Token 的详细摘要。将摘要向量作为检索入口。检索命中后，系统将摘要关联的原始长文本全文作为载荷，注入生成器的上下文窗口（得益于长上下文模型），即可在生成时利用完整信息。\n\n-
    多向量分块（MaxSim）：将长文本按最大长度切成多个有重叠的小块，每个小块独立嵌入，但这些向量都指向同一个父文档。查询时，用查询向量与所有子向量计算相似度，取最大值（或前
    N 个平均值）作为父文档的得分。后期交互模型（ColBERT）理念即此。\n\n- 层次化向量聚合：将长文本逐段编码得到向量序列，再用一个可训练的聚合网络（如
    RNN 或 Transformer）或简单的均值池化，将向量序列压缩为单一固定长度向量。需要领域训练，但能保留更多信息。\n\n- 分块索引 + 上下文窗口恢复：直接将其切块，分别索引，但在元数据中建立强父子关系。检索时，使用
    Parent Document Retriever，只要命中任意子块，就将整个父长文本拉入上下文，利用长上下文模型的窗口一次性处理。\n\n\U0001F4CC
    核心思想是“用小向量寻址，用大窗口生成”，分离检索与生成的上下文需求。\n\n---"

content:
  prompt: 请解释 Self-RAG 的核心思想，它如何让模型自行判断“要不要查”以及“查得对不对”？
answer:
  mode: rubric
  reference_answer: "\U0001F501 标准 RAG 是“被动检索”：无论问题是否在知识库中有答案，都先查再说。而 Self-RAG（Self-Reflective
    Retrieval-Augmented Generation）的精髓在于教会模型反思——在生成过程中自主决定何时检索、如何评判检索结果以及自己生成内容的可靠性。\n\n###
    核心机制：\n\nSelf-RAG 训练一个语言模型，使其在输出文本时，能够插入特殊的反思标记（reflection tokens），这些标记不在最终展示给用户的文本中，而是内部控制信号。\n\n[图片内容未导入]\n\n工作流程与自判能力：\n\n-
    “要不要查”（Retrieve Decision）：模型在接到指令后，首先预测一个 [Retrieve] 或 [No Retrieve] 标记。\n\n-
    若模型认为问题基于已有参数知识即可回答（如常识性问题），则输出 [No Retrieve]，直接生成答案，省去检索开销。\n\n- 若模型认为需要外部知识，则输出
    [Retrieve]，触发检索器获取文档。\n\n- “查得对不对”（Relevance Judgment）：检索结果返回后，模型对每一篇文档预测其相关性标记（[Relevant]
    / [Irrelevant]）。只有被标记为 [Relevant] 的文档才会被纳入上下文。\n\n- “生成得对不对”（Factuality & Overall
    Utility）：在逐段生成答案时，模型会生成以下反思标记：\n\n- [Fully Supported] / [Partially Supported]
    / [No Support]：标记生成的陈述是否被检索文档支撑。\n\n- [Useful] 等：标记最终答案的有用性。\n\n- 基于反思的自我修正：如果发现某句为
    [No Support]，模型可主动触发重检索或改写该句，形成自我审查回路。\n\n训练方式：\n\nSelf-RAG 使用一个专门的批判模型（critic
    model）生成上述反思标记的伪标签，然后对生成模型进行微调，使其学会同时生成任务文本和反思标记。推理时，这些标记引导整个生成流程，实现了动态、可控的知识增强。\n\n\U0001F579️
    本质上，Self-RAG 把检索决策权交给了模型自身，它不再是盲目接受外部信息的“容器”，而是具备了元认知能力的“主动思考者”。\n\n---"

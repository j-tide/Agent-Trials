content:
  prompt: 大型文档库的增量索引：如何监听文件系统变化并实时更新向量库？
answer:
  mode: rubric
  reference_answer: "\U0001F4C1 增量索引需要可靠的事件驱动机制，避免全库重扫的耗时。\n\n实现机制（以本地文件系统为例）：\n\n-
    文件监听器：使用 inotify（Linux）或 fsnotify（Go库）、Watchdog（Python库）监控知识库目录，捕获 IN_CLOSE_WRITE（写入完成）、IN_DELETE、IN_MOVED_TO
    等事件。\n\n- 去抖动与合并：文件可能短时间内多次写入，监听器收集到的事件先放入一个时间窗口（如 5 秒），合并对同一文件的重复事件，防止频繁触发索引。\n\n-
    事件发布：将合并后的变更事件（文件路径, 操作类型）发布到消息队列（Kafka/Redis Streams）。\n\n- 索引Worker：消费事件，执行：\n\n-
    一致性保障：定期（如每天凌晨）运行全量对账任务，检查向量库中的文档 ID 是否全部存在于当前文件系统，移除僵尸索引，补充遗漏。\n\n⚙️ 对于云存储（如
    S3），使用其事件通知（S3 Event Notification）触发 Lambda 或 HTTP 端点，再推入消息队列。\n\n---"

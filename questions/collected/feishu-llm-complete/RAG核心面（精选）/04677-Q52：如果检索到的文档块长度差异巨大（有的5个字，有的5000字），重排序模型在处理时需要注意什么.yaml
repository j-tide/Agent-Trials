  prompt: Q52：如果检索到的文档块长度差异巨大（有的5个字，有的5000字），重排序模型在处理时需要注意什么？
answer:
  mode: rubric
  reference_answer: "⚠️ 问题：Cross-encoder 重排序模型（如BERT）输入长度有限（通常512 tokens），超长会被截断，丢失信息；极短文档则可能因缺少上下文而被低估。\n\n\U0001F6E0️
    应对策略：\n\n- 长文档分块评分聚合\n\n- 极短文档的上下文填充\n\n- 长度归一化\n\n- 两阶段选择\n\n\U0001F4CF 实践：生产系统中常用
    ColBERT 或 SPLADE 作为第一级重排，处理变长文档非常友好。\n\n---"

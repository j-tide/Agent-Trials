content:
  prompt: Q37：在 A/B 测试中，如何定义“用户满意度”指标？除了点赞率，还有哪些行为信号可以捕捉？
answer:
  mode: rubric
  reference_answer: "\U0001F9D1‍\U0001F4BB 用户满意度是一个潜变量，我们需要用多个显式行为信号来近似它，构建复合指标。\n\n\U0001F4C8
    核心指标（OMER）：\n\n可定义总体任务成功率（Task Success Rate），判断会话是否以用户问题被解决而自然结束。\n\n\U0001F575️
    捕捉的行为信号，按强弱分层：\n\n- 强正向信号：\n\n- 弱正向信号：\n\n- 负向信号：\n\n⚖️ 合成满意度分数：\n构建一个加权公式，例如：\n满意度分数
    = w1*点赞 + w2*复制 + w3*无重复提问 + w4*正向情绪 - w5*愤怒 - w6*快速退出\n权重可通过历史人工标注（如用人工回放会话打分）做线性回归拟合得到。\n\n\U0001F4CA
    A/B 比较：实验中比较两组的平均会话满意度分数，而非单一指标。同时关注亚群差异：新手用户可能更依赖点赞，专家用户更看重复制率。所以一定要分群分析。\n\n\U0001F4A1
    进阶：引入微观互动指标——用户在阅读答案时是否频繁上下滚动（犹豫）、是否选中文字进行搜索（信任不足）。这些可通过前端埋点捕获。\n\n---"

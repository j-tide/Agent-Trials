  prompt: Q42：设计一个能自动发现“模型盲点”的方法：即模型在什么问题上即使有文档也倾向出错？
answer:
  mode: rubric
  reference_answer: "\U0001F575️ 盲点发现就是找到那些“检索给了足够信息，但模型仍然答错”的样本，并归纳它们的模式。\n\n⚙️ 自动化流程：\n\n-
    构建验证集：准备大量问答对，每个问题都绑定“包含正确答案的文档”。用当前RAG系统生成答案。\n\n- 错误分析：自动检测答案错误（与标准答案对比，或用强模型评判），筛选出“有文档但答错”的案例。\n\n-
    盲点特征提取：对这些出错案例，从多个维度提取特征：\n\n- 聚类与模式挖掘：对特征向量进行聚类，或者用决策树分析，自动发现“模型在多跳数值计算且涉及单位换算时容易出错”这类盲点模式。\n\n-
    持续监测：线上部署一个盲点探测器，当一个查询的特征命中了已知的盲点模式，系统可以主动降低对模型的信任，触发额外验证（如多次生成投票、请求用户确认）。\n\n\U0001F52C
    这本质上是一种RAG系统的失败模式挖掘，可以指导后续的 prompt 优化或针对性微调。\n\n---"

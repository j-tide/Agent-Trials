content:
  prompt: Graph RAG 在解决如“总结某位作者所有书的共同主题”这类多跳问题时，有什么优势？
answer:
  mode: rubric
  reference_answer: "Graph RAG 针对多跳问题的优势：\n\n- 天然的关系导航：\n\n- 信息聚焦与压缩：知识图谱将分散在多本书、多个段落中的信息，抽象为实体和关系，排除了大量叙述性噪声。在回答时，LLM
    直接基于结构化的作者-书-主题列表进行总结，避免了从长文档中自行抽丝剥茧的过程，极大降低了幻觉和遗漏。\n\n- 可解释性与完整性：因为是基于图的确定性查询，答案覆盖了作者所有的书（在
    KG 收录范围内），并能清楚展示每本书对应的主题。这种完整的追溯链在文本 RAG 中难以保证——可能因为某本书的描述未用到“主题”这个词，而被语义检索漏掉。\n\n-
    高效的复杂逻辑处理：类似“未写过XX主题的作者”、“与A作者共享最多主题的作者”等逻辑查询，在图数据库中是毫秒级的图算法，而文本RAG几乎无法有效回答。\n\n对比总结：\n\n[嵌入表格未展开]\n\n\U0001F4CC
    Graph RAG 是解决“全局总结”、“关系推理”类复杂多跳问题的利器，但它的边界受限于图谱的构建质量。目前最前沿的方案是Graph + Vector 混合索引，用文本
    RAG 应对细节问答，用 Graph RAG 处理宏观关联问题。\n\n---"

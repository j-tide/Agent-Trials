content:
  prompt: Q45： 如何计算 RAG 系统的“端到端问答准确率”，并将其分解为“检索缺陷率”和“生成缺陷率”？
answer:
  mode: rubric
  reference_answer: "\U0001F522 分解是为了定位问题出在检索还是生成，指导优化方向。\n\n\U0001F4D0 定义：\n\n- 端到端准确率：最终答案符合预期（完全正确或满足需求）的比例。设为
    P_end。\n\n- 理想生成准确率：假设检索完美，即给模型提供包含正确答案的文档，模型能否生成正确回答。设为 P_gen_perfect。\n\n- 实际生成准确率：在实际检索结果下，模型生成的正确比例。即我们的
    P_end。\n\n- 这样我们就可以定义：\n\n\U0001F52C 分解实验：\n\n- 准备一组问答测试集。\n\n- 步骤1：运行标准 RAG，得到
    P_end。\n\n- 步骤2：对于每个问题，人工（或自动）构造神谕检索上下文，即把包含正确答案的最优文档片段找出来，直接喂给模型，测量准确率 P_oracle。这个值近似于
    P_gen_perfect。\n\n- 计算：\n\n- 缺陷分析矩阵：\n\n[嵌入表格未展开]\n\n\U0001F4CA 实用简化：线上可定期抽样，用强模型（如GPT-4）评判检索文档是否包含答案，以及答案是否正确，自动化产出缺陷分解日报，省去人工神谕构造。\n\n---"

content:
  prompt: Q36：设计一个自动化框架，每天从线上日志中采样一定量问答，自动评分并生成诊断报告。
answer:
  mode: rubric
  reference_answer: "\U0001F501 这是一个持续质量监控流水线，目标是“无人工干预的日报”，让团队每天看到系统健康度。\n\n\U0001F3D7️
    框架设计五步走：\n\n① 日志采样策略\n\n- 随机采样 N 条（如500条），但必须保证多样性。可按时间均匀分布，或按会话长度、用户类型分层采样。对低分会话（如用户重复提问、愤怒情绪）增加采样权重，优先发现问题。\n\n②
    自动评分模块\n\n采用多维度自动打分，不依赖人工：\n\n- 忠实度：用 NLI 模型判断答案是否被检索文档支持，输出支持句比例。\n\n- 相关性：用交叉编码器给
    (问题, 答案) 打分。\n\n- 完整性：检查答案是否直接回应了问题的所有方面（可用 LLM 评判）。\n\n- 拒答正确性：如果系统拒答，检查问题是否确实超出知识库范围（用反向检索验证）。\n\n-
    流畅性：用语言模型困惑度衡量。\n每个维度输出0-1分，并加权综合。\n\n③ 异常检测与根因分析\n\n- 将每日指标与历史基线对比，使用移动平均±3标准差检测异常。\n\n-
    当总体分下降时，自动下钻：是检索召回少了？还是某类文档出问题了？利用检索缺陷率和生成缺陷率（见第11题）定位。\n\n④ 诊断报告生成\n\n用 LLM 将数据转化为自然语言报告，内容包括：\n\n-
    \U0001F4C8 今日综合得分及变化趋势图。\n\n- \U0001F53B 下降最严重的指标及疑似原因（如“今日产品文档更新后，相关性得分下降0.05”）。\n\n-
    \U0001F50E 典型案例展示（选3个最佳和3个最差问答，附上检索文档片段）。\n\n- ⚠️ 告警：如有指标跌破阈值，红色高亮。\n\n⑤ 自动化流转\n\n将报告推送至飞书/钉钉群，并自动生成
    JIRA 工单指派给相应值班人。存档至数据看板供周报汇总。\n\n\U0001F6E0️ 技术选型：评分模型用轻量微调的 DeBERTa，报告生成用内部部署的开源
    LLM，框架用 Airflow 调度。整个过程全自动化，做到“早上一杯咖啡，系统健康尽在掌握”。\n\n---"

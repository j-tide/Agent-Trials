answer:
  mode: rubric
  reference_answer: "\U0001F6E1️ Prompt 注入无法仅靠 Prompt 自身防御，必须采用纵深防御，最核心的防线在检索层。\n\n多层防御体系：\n\n-
    第一层：严格的租户元数据过滤（检索层，根本防线）\n\n- 第二层：Prompt 隔离与净化（生成层）\n\n- 第三层：输出审查与审计\n\n\U0001F510
    结论：不要企图用 AI 抵御 AI 注入，用数据库的硬逻辑实现数据隔离才是高安全企业的标准答案。\n\n---"

  prompt: Q22：分块大小和重叠窗口大小如何通过实验确定？设计一个实验方案。
answer:
  mode: rubric
  reference_answer: "\U0001F9EA 这两个参数不是猜出来的，是面向最终任务指标调优出来的。下面是一个端到端的实验方案。\n\n- 明确衡量指标\n\n-
    检索命中率 (Recall@k)：最重要。评估相关块是否被找回。\n\n- 答案忠实度 (Faithfulness)：生成答案是否严格基于检索到的块，用来间接衡量切块是否提供了足够但不过量的上下文。\n\n-
    块利用率 (Chunk Utilization)：检查检索命中的块中，有多少内容被实际引用，衡量块内噪声程度。\n\n- 准备固定评测集\n\n- 编写 50-100
    个你业务中的真实问题，并为每个问题标注黄金文档块（Golden Chunks）。即：回答这个问题，最理想应该检索到哪些段落。\n\n- 确保问题覆盖推理性、细节查询性、概括性等不同类型。\n\n-
    构建实验矩阵\n\n- 分块大小：选取 [256, 512, 1024, 1536] Token。\n\n- 重叠大小：选取块大小的 [0%, 10%, 20%,
    25%]。\n\n- 组合形成 4x4 = 16 组参数，固定其他条件（嵌入模型、top_k 等）。\n\n- 运行评估并记录\n\n- 对每组参数，重新构建索引，用评测集问题发起检索，计算
    Recall@5、@10。\n\n- 同时，对部分问题生成完整答案，用大模型自动评估忠实度和答案完整性。\n\n- 分析选择 Pareto 最优\n\n-
    绘制“检索性能 vs 计算开销（索引大小/检索延迟）”的散点图。选择在可接受的延迟和存储成本下，使 Recall 最高、同时噪声最低的参数组合。\n\n-
    通用经验法则：法律/医疗用 1024+；FAQ 用 256-512；小说/文学用 1024+ 搭配低重叠。但一切以实验为准。\n\n---"

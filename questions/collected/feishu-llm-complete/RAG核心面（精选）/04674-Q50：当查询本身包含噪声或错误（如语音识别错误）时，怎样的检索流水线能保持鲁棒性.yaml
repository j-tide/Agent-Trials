content:
  prompt: Q50：当查询本身包含噪声或错误（如语音识别错误）时，怎样的检索流水线能保持鲁棒性？
answer:
  mode: rubric
  reference_answer: "\U0001F3A4 噪声类型：ASR 错误（“附近加油站”识别成“附近伽油站”）、拼写错误、OCR 乱码。\n\n\U0001F6E1️
    鲁棒流水线设计：\n\n- 查询预处理纠错\n\n- 在检索前加一级查询纠错模型，可以用基于 transformer 的 seq2seq 纠错器，或利用大模型做一次“改写纠错”提示：“请纠正以下语音识别文本中的可能错误，输出干净查询”。但会引入延迟。\n\n-
    模糊与音近索引\n\n- 对于可能的关键实体，创建音近词索引（如 Metaphone、Double Metaphone）。检索时，对查询中的每个词也计算其音近编码，同时进行精确词匹配和音近词匹配，并加权融合。\n\n-
    向量检索本身对拼写错误有一定鲁棒性，因为字符级嵌入或 subword tokenization 能让“伽油站”的表示与“加油站”相似。可加强使用字符感知的向量模型（如使用字符级
    CNN 的嵌入）。\n\n- 多通道检索\n\n- 同时发起两个检索：一个用原始带噪查询，一个用纠错后的查询，将两路结果合并去重。这样即使纠错不正确，原始查询仍可能击中某些文档（因为文档内可能同时有正误两种写法）。\n\n-
    查询扩展与反馈\n\n- 利用第一次检索的 top 文档，提取其中的高频正确术语，添加到原始查询中再次检索（伪相关反馈）。例如，检索“伽油站”可能会召回含有“加油站”的文档，然后系统提取“加油站”扩展查询，二次检索后准确性大幅提升。\n\n\U0001F517
    组合以上策略，可构建一个阶梯式容错检索：纠错 → 模糊匹配 → 向量召回 → 伪相关反馈，对噪声极不敏感。\n\n---"

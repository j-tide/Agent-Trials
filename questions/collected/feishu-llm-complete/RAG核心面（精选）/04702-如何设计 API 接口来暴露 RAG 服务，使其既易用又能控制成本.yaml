  prompt: 如何设计 API 接口来暴露 RAG 服务，使其既易用又能控制成本？
answer:
  mode: rubric
  reference_answer: "\U0001F4B8 API 设计需平衡开发者体验与资源管控。\n\n推荐设计（RESTful + SSE）：\n\n-
    端点：POST /v1/rag/query\n\n- 请求体：\n\n{\n  \"query\": \"什么是RAG？\",\n  \"stream\":
    true,\n  \"options\": {\n    \"top_k\": 5,\n    \"max_tokens\": 500,\n    \"temperature\":
    0.1,\n    \"search_type\": \"hybrid\"\n  }\n}\n\n- 响应（流式）：Content-Type: text/event-stream，事件流包含
    retrieval_start、source（文档片段）、token（生成内容）、done（含引用和 Token 消耗统计）。\n\n- 成本控制设计：\n\n\U0001F4D0
    接口还应在 options 中支持 filter（元数据过滤）和 tenant_id（由后台注入），保留扩展性。\n\n---"

content:
  prompt: Q42： 如何利用结构化学科知识（如医学本体）自动判断生成答案中的事实是否与知识图谱冲突？
answer:
  mode: rubric
  reference_answer: "\U0001F9EC 这属于基于知识图谱的事实校验，能精确发现违背医学常识的幻觉。\n\n\U0001F517 实现流程：\n\n-
    实体和关系抽取\n\n- 将生成的答案文本通过医疗 NER（如 BioBERT）和关系抽取模型转化为三元组列表，例如 (阿司匹林, 禁忌症, 胃溃疡)。\n\n-
    知识图谱查询\n\n- 将抽取的三元组中的实体链接到医学本体（如 UMLS、SNOMED CT、药物知识库 DrugBank）的标准实体ID。\n\n- 查询知识图谱中是否存在该三元组或语义等价关系（需考虑关系层级继承）。\n\n-
    冲突判断\n\n- 若图谱中存在直接矛盾的三元组（如药物知识库标注“阿司匹林 禁忌症 不包括普通胃溃疡”但实际是慎用），则标记为冲突。\n\n- 更细粒度：利用本体中的公理进行一致性推理。例如，答案说“某药适用于孕妇”，但本体中药物的“妊娠分类”为X（禁忌），推理机可自动判定冲突。\n\n-
    也可计算路径一致性：随机游走检查实体间的关联路径是否支持所述事实。\n\n- 输出冲突报告\n\n- 明确指出哪一句、哪个实体、违反了什么知识，并提供图谱中的正确事实作为修正建议。\n\n⚠️
    注意：知识图谱本身可能不完整，查不到不等于冲突，只能判“未证实”。所以要区分“冲突”和“未证实”，避免假阳性。\n\n\U0001FA7A 应用：这个模块可以作为
    RAG 系统的后置校验器，部署在临床决策支持等高风险场景，自动拦截与医学常识相悖的回答。\n\n---"

content:
  prompt: Q41：混合检索中，何时应该让 BM25 的权重远大于向量检索？给出一个具体的查询场景。
answer:
  mode: rubric
  reference_answer: "\U0001F3AF 核心判断依据：当查询意图高度依赖精确表面形式（特定词汇、数字、代码、专有名词）而非语义泛化时，BM25
    的权重就应该被大幅提升。\n\n\U0001F4A1 原因解析：\n\n- 向量检索擅长捕捉语义相似性，但会模糊掉精确的词汇边界。比如“财务报表”和“财务报告”在语义空间很近，但用户可能就是要找文件名包含“2024Q4财务报表.xlsx”的文档。向量检索可能返回一堆“2024年财务报告”，而漏掉了精准命中的那份。\n\n-
    BM25 是基于词频和逆文档频率的稀疏检索，对罕见术语极度敏感。当查询中包含非常见词（如零件编号、标准号、API名），这些词在语料中的出现次数极少，IDF值极高，BM25能给予它们极高权重，从而实现精确匹配。\n\n\U0001F4CC
    具体场景：\n\n\U0001F50D 这里的 EPC-7823-B 是一个内部产品代号，语义向量模型几乎不可能理解其含义，只会将其当作一个普通token，并且由于该代号在语料中本身出现频率不高，其向量表示可能被训练数据中的常见词汇淹没。而BM25
    会立即识别出这是一个极为罕见的词组，IDF值爆表，从而将包含此精确字符串的文档排到最前。若此时让向量检索主导，可能会返回大量关于“EPC系列规范”的文档，却唯独找不到这个具体编号。\n\n⚖️
    权重调控实践：可以通过融合系数动态调整。例如用 alpha * score_bm25 + (1-alpha) * score_vector，当检测到查询中存在实体（通过NER识别）或罕见字符模式（如编号模式）时，自动将
    alpha 提高到 0.9 以上。更进一步，可以对查询进行解析，如果查询包含引号、括号等强调符号，也暗示着对精确匹配的偏好。\n\n---"

content:
  prompt: Q51：利用对抗训练思想，如何构造“投毒”的检索文档来测试和提升生成模型的忠实度？
answer:
  mode: rubric
  reference_answer: "☣️ 对抗测试目的是找出模型在多大程度上会盲从检索文档，即使文档内容荒谬或与自身知识冲突。\n\n\U0001F9EA 构造投毒文档的方法：\n\n-
    事实冲突文档：选取模型已知的常识（如“巴黎是法国的首都”），在检索文档中注入错误版本（“巴黎是德国的首都”）。观察模型是纠正错误还是顺从。如果顺从，则忠实度差。\n\n-
    矛盾文档对：在一次检索中同时提供两份文档，一份说“A方案有效”，另一份说“A方案无效且危险”。测试模型是否能指出矛盾并请求澄清，还是随机采纳一个。\n\n-
    带有微小扰动的文档：把正确文档中的关键数字改掉（如“剂量10mg”改为“100mg”），测试模型是否敏感识别异常。\n\n- 植入毫无根据的权威语气：文档用虚构的研究、不存在的引用，测试模型是否会被“看起来专业”的语调迷惑。\n\n\U0001F527
    对抗训练提升：\n\n- 用这些投毒样本构建训练集，标记期望的模型行为：当文档与广泛认可的事实严重冲突时，模型应该指出可疑并依赖内部知识或要求更多证据。\n\n-
    可以通过强化学习：奖励模型在面对矛盾时表现出“批判性”（如输出“文档A与文档B存在矛盾，我需要更多信息”），惩罚盲目采纳错误文档。\n\n- 定期用对抗样本做红队测试，持续发现脆弱点，反馈到
    prompt 或微调中。\n\n\U0001F4CC 这种测试是构建鲁棒、可信 RAG 系统的必经之路，尤其对于医疗、法律等高风险领域。\n\n- 解析出每个引用标记，检查对应的文档ID和原文是否真实存在。\n\n-
    使用一个轻量NLI模型检查被引用的句子是否确实支撑该陈述。若无支撑，可移除该标记或降低其置信度。\n\n- 人工检查 retrieved_docs 中是否包含回答该问题所需的正确信息。\n\n-
    若正确的文档根本不在Top-K中，或者相关文档相似度过低 → 召回错（检索器或索引问题）。\n\n- 若正确文档存在但排名极低，未进入生成器上下文 → 重排序或Top-K截断问题。\n\n-
    如果正确文档已在上下文中，但模型生成的答案依然错误或包含文档中没有的事实 → 生成错（模型幻觉、指令遵循失败）。\n\n- 具体可用NLI模型检查：答案中的每个事实句，是否能从上下文文档中推断出来。不能的句子即生成错误。\n\n-
    若判断为“蕴含”，标记为绿色（已验证）。\n\n- 若判断为“矛盾”，标记为红色（错误）。\n\n- 若判断为“中性”（即无明确证据），标记为橙色（未证实），并可由前端显示“此信息未在资料中找到依据”。\n\n-
    对于模型输出的每一个事实句，用NLI模型计算它被检索文档支持的程度，得到“蕴含得分”。这个得分可作为置信度的客观基准。\n\n- 然后将模型自身给出的置信度与之对齐训练：如果模型高置信但NLI得分低，产生惩罚；反之鼓励。这就能教模型学会“我到底知不知道”。\n\n-
    NLI模型验证器：如前面所述，将断言与文档证据组成对，输出蕴含/矛盾/中性。适合粒度细的事实检查。\n\n- QA-based验证器：用大模型提问，如“根据文档，X是否等于Y？”。如果文档给出的答案与生成内容不一致，则标记为虚假。\n\n-
    一致性验证器：检查同一答案内部逻辑是否自洽，以及是否与之前轮次的答案矛盾。\n\n- 关键实体一致性检查：检查句子中出现的实体、数字是否与检索文档中的集合一致。若出现文档中完全没有的新实体，立即标记风险。\n\n-
    紧凑NLI模型：使用蒸馏后的TinyBERT做单句蕴含检测，延迟<5ms。如果检测到“矛盾”或“无支撑”，根据策略可立即：\n\n- 硬阻断：停止生成，回显“信息生成中断，检测到不实内容”，并重新生成或降级回答。\n\n-
    软阻断：在UI上对后续文字附加“波浪下划线”标记可疑，同时后台触发重生成，平稳切换。\n\n- 如果检索文档确实缺乏信息，而模型正确输出了“无法回答/不知道”的句式，给予+1奖励。\n\n-
    如果缺乏信息但模型编造了答案，给予-1惩罚。\n\n- 这需要一个标注了“是否可回答”的数据集来训练这个奖励模型。\n\n- 策略A：查询改写。用大模型将原查询改写为更具体或不同角度的2-3个新查询，并行重新检索，用新结果重新生成。\n\n-
    策略B：扩大检索范围。取消某些限制性过滤器，或增加Top-K数量，再次检索。\n\n- 策略C：降级为“分步提问”。如果还是不行，回复用户：“这个问题我目前资料不全，您能把它拆分成更小的子问题吗？或者我为您列举我找到的部分相关信息。”\n\n-
    无关文档注入：在真实相关文档中，随机混入一些与问题完全无关的文档块。\n\n- 文档内容扰动：对检索文档进行随机句子删除、同义词替换、或插入无意义的广告片段。\n\n-
    矛盾文档混入：故意放入包含过时或错误信息的文档，模拟真实检索的瑕疵。\n\n- 使用这些“脏”文档集，配上正确答案（或标注出正确的引用），对模型进行微调。\n\n-
    奖励那些能从噪音中准确抽取出正确事实、并忽略错误信息的生成。\n\n- 这可以结合 RLHF，也可以直接用 DPO 构造偏好对，让“抗噪声回答”战胜“被噪声带偏的回答”。\n\n-
    强化学习方法：将检索器看作Agent，其动作（选哪个文档）的奖励由生成器的损失（越小奖励越高）定义。用策略梯度更新检索器。\n\n- 重参数化/近似方法：比如REALM或RAG-end2end那样，用所有候选文档的期望损失，计算检索器的梯度。\n\n-
    交替迭代：实际中更简单：先用初始检索器训练生成器。然后用训练好的生成器为大量查询-文档对打分（哪些文档导致了正确答案？），用这些软标签微调检索器。如此往复。\n\n-
    在索引阶段，对所有文档进行安全分类。使用毒性检测模型（如 Perspective API、微调的 BERT 分类器）给每个文档打分。对于含有仇恨言论、极端偏见、诈骗内容的文档，直接标记为“不可检索”或降低其检索权重。可建立一个内容黑名单库。\n\n-
    在检索出 Top-K 文档后，送入一个安全重排序器。这个重排序器同时考虑“相关性”和“安全性”。如果某文档相关性极高但被毒性检测模型标记为高风险，系统可以直接丢弃该文档，并记录告警日志。或者采用“屏蔽式生成”：将安全违规的文档内容替换为
    [不安全内容已屏蔽] 标签，但仍保留其他文档。\n\n- 在 system prompt 中明确注入规则：“你是一个安全的助手。如果提供的参考资料中含有偏见、歧视、暴力等不当内容，你必须忽略它，并说明‘该参考资料存在内容问题，无法采纳’，然后基于其他正常资料回答，或表示无法回答。”
    这种指令在一定程度上能让模型产生抵抗力。\n\n- 更进一步，可以使用受控生成：构建一个禁止词表（disallowed tokens），对可能生成有害内容的
    token 实时施加概率惩罚。但这较难覆盖偏见，偏见通常措辞隐蔽。\n\n- 对最终答案运行另一个安全评估模型，若发现问题，则丢弃回答并返回通用安全回绝，同时标记该文档供人工复查。\n\n-
    问题类型：多跳推理、比较、计数、时间运算...\n\n- 文档特征：答案信息分散在多个文档、文档中存在干扰项、所需信息隐含在脚注...\n\n- 答案特征：需要否定回答、需要引用具体数字、需要专业缩写解释...\n\n-
    模型不确定性：生成时熵值高、多次采样结果不一致。\n\n- 使用现有的幻觉检测数据集（如 HaluEval、FactCC）或通过扰动构造：取真实摘要，人工注入幻觉（替换实体、数字、违背事实）。更高级的方法是让大模型根据文档故意生成包含幻觉的句子，形成
    (句子, 文档, 标签) 三元组。\n\n- 标签：ENTAILMENT (句子被文档支持), NEUTRAL (文档未提及), CONTRADICTION
    (与文档矛盾)。\n\n- 从检索文档中提取所有实体（人名、地名、专有术语、数字），构建一个允许词汇表（whitelist）。在生成时，使用类似于 constrained
    beam search 的算法，在每一时间步，强制 beam 中的序列要么继续生成普通连接词，要么必须生成属于白名单的实体 token。可以使用 transformers
    库的 PrefixConstrainedLogitsProcessor 实现，动态传入前缀和允许词汇。\n\n- 让模型生成时，要求它明确引用原文片段。比如：“根据文档，‘...’，可以得出...”。使用约束确保引号中的内容必须原文照抄自检索文档。这可以通过检索文档的后缀树做快速匹配，解码时只允许那些能匹配上文档中某个子串的
    token 序列。\n\n- 对于需要高精度的事实（如法律条款、日期），直接用抽取式从文档中复制，而不是让生成模型改写。在生成模板中预留插槽，RAG检索后，用信息抽取模型提取关键值填入插槽，生成模型只负责串联语言。这从根本上杜绝了事实扭曲。\n\n-
    “你将仅依据以下提供的文档回答问题。如果文档没有提供足够信息来回答某问题，你必须如实说‘文档未提供相关信息’，并明确指出缺少哪方面的信息才能回答。绝对不要编造。”\n\n-
    要求回答分为两部分：[已知信息] 列出能从文档回答的内容；[缺失信息] 列出想回答但文档不包含的具体点。例如：“关于X的步骤，文档只提到了A和B，缺少步骤C的具体参数。如需完整回答，需要补充关于C的文档。”"

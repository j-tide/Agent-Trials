answer:
  mode: rubric
  reference_answer: "\U0001F6E1️ 数据驻留要求迫使我们将敏感文档和检索逻辑留在境内，而只能将“去除敏感信息”的上下文发送到境外生成。\n\n\U0001F3D7️
    混合架构设计：\n\n[图片内容未导入]\n\n\U0001F510 实现关键点：\n\n- 检索侧完全本地化\n\n- 上下文脱敏（Data Sanitization）\n\n-
    网络隔离与审计\n\n- 备用本地模型\n\n- 合规认证：整个方案需要法务审核，确保符合《数据安全法》和《个人信息保护法》等要求，取得相关备案。\n\n\U0001F512
    这种“数据不动，只动非敏感上下文”的架构，是当下跨国企业落地大模型的常见解法。\n\n---"

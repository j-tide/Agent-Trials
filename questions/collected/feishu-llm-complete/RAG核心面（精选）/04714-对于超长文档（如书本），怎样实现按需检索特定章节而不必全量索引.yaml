content:
  prompt: 对于超长文档（如书本），怎样实现按需检索特定章节而不必全量索引？
answer:
  mode: rubric
  reference_answer: "\U0001F4DA 全量索引整本书成本高、噪声大。按需检索的核心是构建两层索引：目录级宏观索引 + 章节级细粒度索引。\n\n实现方案：\n\n-
    文档解析与结构提取：\n\n- L1：章节摘要索引（宏观）：\n\n- L2：按需细粒度索引（微观）：\n\n- 缓存热点章节：被频繁检索的章节，其细粒度索引可常驻内存，加速后续查询。\n\n\U0001F4CC
    这种“书皮→章→节”的渐进式索引，用低存储成本实现了对巨量文档的精准检索。\n\n---"

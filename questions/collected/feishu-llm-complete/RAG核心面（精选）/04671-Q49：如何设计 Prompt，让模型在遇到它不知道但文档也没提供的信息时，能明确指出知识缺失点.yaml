answer:
  mode: rubric
  reference_answer: "\U0001F3AF 目标是训练/提示模型具有承认无知的能力，并精确描述缺失什么。\n\n\U0001F4DD Prompt
    设计：\n\n- 设定严格的知识边界：\n\n- 引导输出格式：\n\n- 提供 few-shot 示例：展示几个理想回答，模型将模仿这种“知之为知之，不知为不知”并明确缺失点的风格。\n\n⚙️
    微调方案：更稳定的是构造训练数据，包含大量“文档不完整”的案例，让模型生成带缺失点说明的回答，微调后效果显著。\n\n\U0001F4CC 效益：这种设计让系统显得诚实可靠，用户能根据明确缺失点提供更多材料，形成良性闭环。\n\n---"

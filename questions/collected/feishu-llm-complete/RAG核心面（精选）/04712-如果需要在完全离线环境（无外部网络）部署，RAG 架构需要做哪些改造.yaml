answer:
  mode: rubric
  reference_answer: "\U0001F3DD️ 离线部署切断了对公有云 API 的依赖，全链路必须自给自足。\n\n改造清单：\n\n- 模型全本地化：\n\n-
    基础设施容器化：\n\n- 数据与知识库迁移：\n\n- 模型与依赖的离线分发：\n\n- 监控与日志本地化：Prometheus + Grafana 本地搭建，无需外部推送。\n\n\U0001F6E1️
    离线版 RAG 的核心是一次在线构建，永久离线运行，并具备完整的本地运维体系。\n\n---"

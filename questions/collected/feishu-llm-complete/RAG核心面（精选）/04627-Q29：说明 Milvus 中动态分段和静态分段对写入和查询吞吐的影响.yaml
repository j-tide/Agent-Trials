answer:
  mode: rubric
  reference_answer: "\U0001F9E9 在 Milvus 中，数据被组织为“段”（Segment）来管理。\n\n[嵌入表格未展开]\n\n⚖️
    影响总结：动态段越多，写入越顺畅，但查询需要合并的结果集越多，查询延迟可能增加。Milvus 通过后台持续将动态段合并并转换为静态段，来动态平衡这个天平。理解这点对配置
    segment.rowCount 和合并策略至关重要。\n\n---"

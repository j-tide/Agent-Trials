  prompt: 解释 RAG 系统在面临 PDF 文本复制限制、DRM 保护时的应对策略。
answer:
  mode: rubric
  reference_answer: "\U0001F512 DRM（数字版权管理）或复制限制会阻断常规的文本提取。应对策略取决于法律合规与技术可行性的边界。\n\n应对策略（分层）：\n\n-
    合规优先：首先，企业必须确保有权对文档进行内容提取和索引。若商业合同或版权法禁止，则不应强行破解。可通过采购协议获取无限制副本。\n\n- 虚拟打印重生成：对于允许阅读但禁止复制的
    PDF，可使用虚拟 PDF 打印机（如 Microsoft Print to PDF）将其“重打印”为一份新的、无复制限制的 PDF 文件，然后正常解析。\n\n-
    基于 OCR 的旁路：\n\n- 多模态模型直接读取：\n\n⚠️ 技术手段是为了方便已授权的内部使用，绝不能用于侵犯版权。\n\n---"

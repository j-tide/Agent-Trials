content:
  prompt: Q48：如何跟踪 RAG 系统性能随时间的漂移？比如因知识库更新、用户提问习惯改变导致的性能变化。
answer:
  mode: rubric
  reference_answer: "\U0001F4C9 性能漂移是动态系统的头号大敌。我们需要建立时序性能监控体系，及时发现并诊断。\n\n\U0001F6F0️
    监控体系架构：\n\n- 固定测试集的定期评估\n\n- 维护一个黄金测试集，涵盖核心功能、边界情况、典型业务，每月静态版本不变。\n\n- 每周在最新系统上自动运行此测试集，得到准确率、忠实度、拒答率等核心指标。\n\n-
    将此指标绘制成趋势图，用控制图（SPC）监测，若连续7点下降或单点超出3σ，触发告警。\n\n- 这个测试集只能反映“已知旧问题”的退化，难以捕捉新出现的用户意图。\n\n-
    线上实时指标监控\n\n- 定义线上决策支持指标：端到端会话成功率、用户重复提问率、平均满意度等。\n\n- 按天聚合，观察趋势。可使用时间序列异常检测（如
    Prophet + 残差异常）自动发现漂移。\n\n- 结合知识库更新日志：每次知识库发生批量更新后，将更新日期设为“干预点”，用间断时间序列分析（ITS）统计更新前后的指标是否有显著跃变。这能直接量化“某次知识库变更”带来的冲击。\n\n-
    分布漂移检测\n\n- 对用户问题文本，每周用嵌入模型将其向量化，计算当前周与上周的问题向量分布之间的最大均值差异（MMD）或Wasserstein距离。如果距离增大，说明用户问法、主题分布发生了显著变化（概念漂移）。\n\n-
    同理，对检索返回的文档内容也进行分布检测。若文档分布漂移，可能是知识库内容变迁。\n\n- 自动化根因管道\n\n当检测到性能漂移，自动触发下钻分析：\n\n-
    按问题类别（聚类）分解指标，找出是哪个类别变差。\n\n- 按检索源分解，看是否某类新文档有毒。\n\n- 将结果汇总，告知运维人员可能原因。\n\n\U0001F4CA
    交付：一个“RAG健康仪表盘”，包含时效曲线、漂移告警标注、根因线索，让团队能提前干预而非事后救火。\n\n---"

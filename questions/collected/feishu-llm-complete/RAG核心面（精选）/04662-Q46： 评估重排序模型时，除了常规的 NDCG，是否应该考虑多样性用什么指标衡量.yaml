content:
  prompt: Q46： 评估重排序模型时，除了常规的 NDCG，是否应该考虑多样性？用什么指标衡量？
answer:
  mode: rubric
  reference_answer: "\U0001F308 绝对应该。如果重排序只追求相关性，可能返回10篇内容极度相似的文档，用户无法获得全面的信息。\n\n\U0001F3AF
    多样化需求场景：\n\n- 法律研究：需要看到不同判例观点。\n\n- 产品搜索：需要各种品牌和价格段。\n\n- 科研调研：需要覆盖不同方法流派。\n\n\U0001F4CF
    多样性衡量指标：\n\n- α-NDCG：在 NDCG 基础上引入多样性奖励。它不仅考虑排序位置的相关性，还考虑当前文档对于前面已选文档的新颖度。例如，若某文档与前面文档高度重复，其对
    α-NDCG 的贡献会被打折。这是最经典的综合指标。\n\n- Intent-Aware 指标：\n\n- 聚类多样性指标：\n\n- 相似度惩罚指标：\n\n⚖️
    综合评估：\n重排序模型的整体评分可设为：综合分 = w1 * NDCG + w2 * α-NDCG。权重依业务定。对于探索性问答，α-NDCG 权重可能高达0.5。\n\n---"

content:
  prompt: Q37：描述一种利用“假设文档嵌入”（HyDE）来辅助构建索引的思路。
answer:
  mode: rubric
  reference_answer: "\U0001FA9E HyDE 的核心是 “用生成模型生成假答案，再将假答案向量化用于检索”。用在索引构建上可以反过来：为每个文档块生成一个“假设的完美查询问题”，用这个假问题的向量来增强索引。\n\n\U0001F527
    HyDE 辅助索引构建流程：\n\n- 生成假设查询（HyDE for Indexing）：对每个待索引的文档块，调用大模型生成 1-2 个理想化的查询语句，这些语句是用户为了找到这个特定块所可能提出的完美问题。例如，对一块关于“高温润滑脂更换周期”的文本，生成问题：“极端高温环境下润滑脂的更换周期是多少？”\n\n-
    双向编码：使用同一个嵌入模型，编码原始块向量和假设查询向量。\n\n- 构建双层向量索引：对于每个文档块，存储两个向量：v_doc（原块向量）和 v_query（假设查询向量）。检索时，用户真实查询的向量
    v_real_query 同时与这两个向量做相似度匹配，取最高分或加权融合。\n\n- 为什么有效：这巧妙地拉近了“文档陈述空间”与“用户提问空间”的距离。因为
    v_query 处于“问题域”，而 v_real_query 也在“问题域”，两者天然更近，大大提升了召回。\n\n\U0001F3AF 这是一种在索引时进行
    “查询域对齐” 的前移策略，成本低，效果立竿见影。\n\n---"

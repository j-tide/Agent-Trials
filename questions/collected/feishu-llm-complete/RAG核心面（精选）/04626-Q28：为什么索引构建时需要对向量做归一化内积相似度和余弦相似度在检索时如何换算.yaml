content:
  prompt: Q28：为什么索引构建时需要对向量做归一化？内积相似度和余弦相似度在检索时如何换算？
answer:
  mode: rubric
  reference_answer: "\U0001F4D0 归一化就是把向量长度缩放到1，变成单位球面上的点。\n\n为什么归一化？\n\n- 统一度量：消除向量长度对相似度的影响。如果不归一化，频繁出现的短文本向量长度可能很小，与查询的内积天然就小，即使语义相关也会排名靠后，造成系统偏差。\n\n-
    计算等价性：对归一化后的向量，内积（IP）完全等价于余弦相似度（Cosine Similarity）。这意味着你可以用高度优化的内积计算（很多硬件加速支持）来得到余弦相似度的排序，极大加速检索。\n\n换算关系：\n\n-
    余弦相似度：cos(u,v) = (u·v) / (||u|| ||v||)\n\n- 如果 ||u|| = 1 且 ||v|| = 1，则 cos(u,v)
    = u·v。\n\n- 在索引构建时，全部向量归一化；查询时，查询向量同样实时归一化，然后直接用内积搜索，结果就是余弦相似度排序。绝大多数向量数据库如 Faiss
    的 IndexIVFFlat 或 IndexHNSW 都推荐先归一化再用内积作为度量。\n\n\U0001F3AF 因此，归一化不仅是标准化的手段，更是性能优化的关键技巧。\n\n---"

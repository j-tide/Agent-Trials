content:
  prompt: Q51：如何实现跨模态检索，比如用户上传一张产品图片，检索出相关的产品说明文档？
answer:
  mode: rubric
  reference_answer: "\U0001F5BC️➡️\U0001F4C4 核心：将图像和文本映射到同一个语义向量空间。\n\n\U0001F539
    方案：双塔多模态模型\n\n- 图像塔：使用预训练的视觉 Transformer（ViT）或 CLIP 的图像编码器，把输入图片编码成固定维度向量。\n\n-
    文本塔：使用文本编码器将产品说明文档的文本块也编码成同样维度的向量。\n\n- 对齐训练：使用大量的(图片, 描述文本)配对数据进行对比学习（如 CLIP
    的训练目标），使得对应图文在向量空间中距离很近。\n\n\U0001F5C2️ 建库：将所有产品说明文档（可以是文本文档，也可以是包含图片的多模态文档）的文本摘要或关键描述使用文本塔编码，存入向量数据库。\n\n\U0001F50D
    检索：用户上传图片 → 图像塔编码 → 到向量库中搜索最相似的文本向量 → 返回对应的文档块。\n\n\U0001F4D0 进阶：图片包含文字\n\n- 如果产品图片上有文字（如型号“ABC-123”），可以用
    OCR 提取文字，作为附加文本查询，与图片向量进行融合检索（向量+BM25关键词）。这样既有视觉相似性，又有精确型号匹配，准确度极高。\n\n\U0001F517
    架构扩展：还可以利用 layout-aware 模型，理解图片中的空间关系，进一步丰富查询表示。\n\n---"

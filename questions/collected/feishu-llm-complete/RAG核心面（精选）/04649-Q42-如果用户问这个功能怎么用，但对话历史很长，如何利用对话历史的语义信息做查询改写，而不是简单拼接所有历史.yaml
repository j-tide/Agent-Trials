content:
  prompt: Q42:如果用户问“这个功能怎么用？”，但对话历史很长，如何利用对话历史的语义信息做查询改写，而不是简单拼接所有历史？
answer:
  mode: rubric
  reference_answer: "\U0001F5E3️ 问题实质：指代消解与意图聚焦。直接拼接全量历史会引入大量噪声，可能让检索模型迷失在无关闲聊中。\n\n\U0001F504
    方法一：基于摘要的查询改写\n\n- 用一个轻量级 LLM（或指令模型）将对话历史压缩成一段面向检索的摘要。例如，给模型一个指令：“根据以下对话，总结用户当前想要了解的产品功能，忽略问候和无关细节。输出一句可用于搜索的明确查询。”\n\n-
    输入历史后，输出：“如何在 Zoho CRM 中设置电子邮件自动回复规则”。这个改写后的查询再去进行向量检索，效果远好于直接拼接“这个功能怎么用？”。\n\n\U0001F9E9
    方法二：关键实体链式提取\n\n- 维护一个对话状态栈，追踪最近提及的实体（产品名、功能模块）。当检测到指代词“这个”，从栈中弹出最近的实体并替换。如果历史提到过多个功能，可以通过一个简单的分类器判断当前话语的上下文倾向。\n\n-
    同时利用对话的动作类型（如提问、确认、抱怨）来加权历史中的不同部分。例如，用户之前说过“我想设置自动回复”，紧接着问“这个功能怎么用？”，就可以把“自动回复”提取出来构建查询：“自动回复功能
    设置方法”。\n\n\U0001F9E0 方法三：滑动窗口+注意力评分\n\n- 不取全部历史，而是将历史拆分成句子，用一个小型 cross-encoder
    分别计算每个历史句子与当前查询“这个功能怎么用？”的相关性分数，只保留 Top-K 个高相关句子拼接成上下文，再进行查询改写。这样滤除了寒暄和不相关的对话分支。\n\n\U0001F3C1
    最终目标：产出一个独立、自包含、意图清晰的检索查询，丢到向量库中就能命中正确文档。这种改写器本身也可以微调来优化。\n\n---"

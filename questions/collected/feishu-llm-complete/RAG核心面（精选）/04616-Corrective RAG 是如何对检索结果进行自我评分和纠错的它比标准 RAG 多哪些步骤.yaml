content:
  prompt: Corrective RAG 是如何对检索结果进行自我评分和纠错的？它比标准 RAG 多哪些步骤？
answer:
  mode: rubric
  reference_answer: "[图片内容未导入]\n\n\U0001FA7A Corrective RAG (CRAG) 针对检索器返回的低质量文档，设计了一套自我评分与纠错机制，像一个质检员在生成前对原材料进行过滤和补救。\n\n标准
    RAG 的痛点：无论检索出的文档质量如何，都一股脑塞给生成器，极易造成“垃圾进垃圾出”。\n\nCRAG 新增的核心步骤：\n\n- 检索质量评估器（Retrieval
    Evaluator）：\n\n- 这是一个经过微调的轻量级模型（如 T5-base），输入为问题与检索到的各文档，输出每个文档的相关度评分（如 0～1 的置信度）。\n\n-
    三向分流（基于评分阈值）：\n\n- 正确（Correct）：若置信度 > 上限阈值（如 0.8），文档被直接采用。\n\n- 模糊（Ambiguous）：若介于上下阈值之间，说明文档可能相关但不够理想。此时
    CRAG 执行知识精炼（Knowledge Refinement）：将模糊文档切分为更细粒度的段落，并用评估器再次打分，选择得分最高的片段补充进上下文。\n\n-
    错误（Incorrect）：若置信度 < 下限阈值，说明文档很可能无关。CRAG 抛弃这些文档，并主动触发外部知识搜索（Knowledge Searching），使用搜索引擎（如
    Google/Bing API）获取补救文档，再对补救文档重复上述评估。\n\n- 处理后生成：经过以上筛选或补救，最终的纯净、高质量文档上下文才送入生成器。\n\n步骤对比表：\n\n[嵌入表格未展开]\n\n\U0001F6E1️
    CRAG 的“纠正”体现在它敢于对检索结果说“不”，并具备主动寻找替代信息的行动力，大幅降低了不良检索对答案的污染。\n\n---"

content:
  prompt: 如何在 RAG 系统中实现可观测性（Observability）：需要埋点哪些关键指标，以及如何可视化？
answer:
  mode: rubric
  reference_answer: "\U0001F52D 可观测性 = 日志 + 指标 + 追踪，对 RAG 来说，需要覆盖从文档到答案的全链路。\n\n\U0001F4CA
    埋点指标体系（四大类）：\n\n- 检索层指标\n\n- 生成层指标\n\n- 业务会话指标\n\n- 基础设施指标\n\n\U0001F50D 链路追踪：\n\n-
    一个 RAG 请求涉及多个服务：Gateway → Retriever → Embedding → VectorDB → Reranker → LLM。使用
    OpenTelemetry，在每个组件打点，生成 trace。trace 中需要记录：用户输入、改写后查询、检索出的文档 ID、最终生成结果。这样当某个请求出现质量问题，可以精确回溯出是检索丢了关键文档，还是生成时没用好文档。\n\n-
    将 trace 关联到用户反馈上：如果用户点踩，系统自动将该 request 的 trace_id 记录到问题单中，便于精准排查。\n\n\U0001F4CA
    可视化：\n\n- 用 Grafana 仪表盘展示：实时 QPS、延迟分布、错误率、模型消耗费用。\n\n- 专门的 RAG 质量监控面板：显示自动评估的忠实度/相关性随时间的变化，使用滚动窗口展示趋势。\n\n-
    构建一个“检索-生成仪表”，展示检索召回率、被引用率、幻觉率的分时曲线。\n\n- 对业务团队，提供“回答解决率”和“常见未解决问题”词云，从用户行为中提炼高频未覆盖主题。\n\n\U0001F501
    通过这套体系，RAG 不再是“黑盒”，而是能精确诊断、持续迭代的透明管道。\n\n---"

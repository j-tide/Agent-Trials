content:
  prompt: 当知识库极大且增长快速时，向量数据库的扩容会碰到天花板，如何设计分库分表（Sharding）策略？
answer:
  mode: rubric
  reference_answer: "\U0001F3D7️ 单向量库实例存在索引容量和 QPS 上限，必须通过分片（Sharding）水平扩展。\n\n\U0001F500
    分片策略：\n\n- 基于知识域的逻辑分片\n\n- 基于文档 ID 或租户哈希的物理分片\n\n- 分层分片（结合粗筛）\n\n- 动态分片与再平衡\n\n-
    冷热分离\n\n⚙️ 落地：通常从单实例开始，一旦 QPS 或存量接近单机极限，立刻切换到基于租户/领域的逻辑分片，因为实施最简便。需要海量同构数据时再引入一致性哈希扇出。\n\n---"

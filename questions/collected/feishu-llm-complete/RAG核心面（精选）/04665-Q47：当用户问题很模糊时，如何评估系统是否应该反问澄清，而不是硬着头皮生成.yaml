content:
  prompt: Q47：当用户问题很模糊时，如何评估系统是否应该反问澄清，而不是硬着头皮生成？
answer:
  mode: rubric
  reference_answer: "❓ 模糊问题下的反问决策质量直接关系用户体验。我们既要评估系统是否在必要时反问，也要评估反问的质量。\n\n\U0001F4D0
    评估维度：\n\n- 反问必要性标注\n\n- 人工构建一个模糊问题测试集，并为每个问题标注最佳行动：①可直接回答（模糊但常识可推断），②应反问澄清，③应给出可能答案并提示模糊性。以此为金标准。\n\n-
    反问决策指标\n\n- 反问精确率：系统反问的问题中，真正需要反问的比例。\n\n- 反问召回率：所有需要反问的问题中，系统实际反问的比例。\n\n- 误答率：本该反问却强行回答的问题比例。这是最伤害用户信任的指标。\n\n-
    反问质量\n\n- 反问是否切中要害？是否提供了清晰的选项？可以用以下指标：\n\n- 用户体验代价\n\n- 在线上测试中，关注反问带来的会话回合数增加、放弃率变化。有效的反问会增加1-2回合但最终解决率提高；无效的反问直接导致用户流失。\n\n\U0001F52C
    评估流程：用“混合模拟”法——让另一个 LLM 扮演用户，根据系统反问给出合理回答，模拟完整对话，评估最终解决率。这种自动化方法可以规模化运行。\n\n---"

content:
  prompt: Q41：当文档支持两个相反的论点时，如何让模型做到“公平呈现”而不是“选边站”？
answer:
  mode: rubric
  reference_answer: "⚖️ 这是一个多视角摘要与辩论生成任务。要求模型不要成为某方的传声筒。\n\n\U0001F3AF 策略设计：\n\n-
    提示词引导中立性：在 prompt 中明确指出：“下列参考资料中可能存在支持和反对的观点。请分别客观呈现双方的主要论据，最后可简要总结分歧点，但不要偏向任何一方。”
    要求输出格式分为“✅ 支持方观点”和“❌ 反对方观点”。\n\n- 检索结果的对抗性聚类：在检索阶段，可以故意构造两个查询，一个倾向正面，一个倾向反面，分别检索，然后把两批文档同时提供给生成器，并标注来源视角。这样生成器就同时看到了对立证据。\n\n-
    模型微调去偏见：使用对比学习训练模型：构造成对训练样本（单方面生成 vs 平衡生成），让模型学习平衡生成风格。或者强化学习奖励函数中加入“视角平衡度”指标（如两方句子数比例、情感得分差值）。\n\n-
    生成后检验：用一个分类器判断生成文本是否偏向某一方。如果偏向，则自动插入缺失视角或触发重新生成，提醒模型补充另一面。\n\n\U0001F4CC 应用案例：在政策分析、药品风险收益评估等场景，这是必备能力。\n\n---"

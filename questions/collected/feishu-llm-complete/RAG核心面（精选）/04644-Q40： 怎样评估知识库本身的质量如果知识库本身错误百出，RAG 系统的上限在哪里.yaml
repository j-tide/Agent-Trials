content:
  prompt: Q40： 怎样评估知识库本身的质量？如果知识库本身错误百出，RAG 系统的上限在哪里？
answer:
  mode: rubric
  reference_answer: "\U0001F4DA 知识库是 RAG 的信息源，“垃圾进，垃圾出”是铁律。评估知识库质量需要从完整性、准确性、一致性、时效性四个维度切入。\n\n\U0001F50D
    质量评估方法：\n\n- 准确性抽样审计：随机抽取文档段落，由领域专家逐句核验事实。计算事实错误密度（错误事实数/总事实数）。如果是技术文档，可自动化交叉验证——例如，文档中的API参数说明是否与代码实际定义一致。\n\n-
    完整性评估：构造一个用户问题集合（来自客服工单、搜索日志），人工判断每个问题的答案是否在知识库中存在。计算知识覆盖率（能回答的问题数/总问题数）。可借助 LLM
    批量判断“这个问题的答案能否在这份文档中找到”。\n\n- 一致性检查：自动检测不同文档对同一实体或流程的描述是否矛盾。用 NLI 模型判断文本对之间的蕴含/矛盾关系。矛盾对占比即不一致率。\n\n-
    时效性指标：统计最后更新时间超过阈值的文档比例。对于政策、手册类，可设定强制性审阅周期，计算过期文档占比。\n\n⚠️ RAG 的上限：\n\n- 如果知识库错误率是
    10%，那么即使检索和生成环节完美（100%忠实），最终答案的错误率也至少是 10%。这个上限是检索到的文档片段中包含错误的比例决定的。\n\n- 但更糟的是，错误会产生级联效应：模型可能将错误信息与正确信息混合，创造出更难辨别的复合型幻觉。所以真实上限低于错误率。\n\n-
    评估上限的方法：理想检索实验——人工为每个问题提供“完美上下文”（即包含完整且正确答案的文档片段），然后测试模型的生成准确率。如果这时的准确率仍然不高，问题在生成侧；如果这时的准确率很高，但实际系统低，则说明是检索或知识库质量在拉低。逐步替换真实检索为理想上下文，能清晰分解出知识库带来的质量损失。\n\n\U0001F4C9
    结论：知识库质量是 RAG 的天花板。持续监控知识库健康度，与提升模型同等重要。\n\n---"

content:
  prompt: Q46：对于需要实时地理信息的问题（如“附近最近的加油站”），RAG 的检索如何整合空间索引和向量索引？
answer:
  mode: rubric
  reference_answer: "\U0001F5FA️ 核心挑战：向量检索在语义空间中找“加油站”，但无法直接处理“附近”这个空间约束。必须将空间过滤与语义匹配结合。\n\n\U0001F4CD
    双索引架构：\n\n- 空间索引：使用 Geohash 或 H3 六边形索引，将地图划分为网格，每个加油站（POI）对应一个网格编码。当用户提供经纬度后，计算其所在网格及周围相邻网格，通过空间索引快速获取候选
    POI 集合（例如附近500米内的所有加油站）。\n\n- 向量索引：对所有 POI 的描述文本（如“中石化加油站，提供98号汽油，24小时营业”）生成 Embedding，建向量库。\n\n\U0001F500
    融合检索流程：\n\n- 用户查询“附近最近的加油站”，系统先通过手机定位获取经纬度，查询空间索引得到候选 POI 列表（假设有50个）。\n\n- 然后，利用用户查询“加油站”（如果需要还可改写为“加油
    服务”）去向量索引中进行带过滤条件的检索：只在上面50个候选 ID 中做向量相似度搜索。最终返回语义最匹配且距离最近的几个加油站。\n\n- 如果用户还加了“支持免费洗车”，那么向量检索会对“免费洗车”语义打分，从而从候选
    POI 中选出最合适的。\n\n⏱️ 性能优化：空间索引可以放在 Redis GEO 或 PostGIS 中；向量索引可以用支持过滤的 Milvus 或 Weaviate。查询时先执行低延迟的空间查询，再执行向量检索，整体在毫秒级完成。\n\n\U0001F4C8
    复杂场景：如果需要“沿着路线搜索”，则空间约束变为道路网络距离，需要更复杂的路径规划引擎先给出沿线候选集，再交给 RAG 语义筛选。\n\n---"

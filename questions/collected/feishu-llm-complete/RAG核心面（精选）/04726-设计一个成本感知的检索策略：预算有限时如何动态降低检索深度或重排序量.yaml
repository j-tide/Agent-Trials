  reference_answer: "\U0001F4B0 成本感知策略能让系统在预算红线内“精打细算”，对低价值或高成本查询自动降级。\n\n动态策略设计：\n\n-
    查询价值评估：对每个请求，根据用户等级（VIP/普通）、问题复杂度（短词/长句）、时段（高峰/低峰）赋予价值分。\n\n- 预算桶（Token/成本预算）：设定每分钟/每小时的总成本上限，实时追踪消耗。\n\n-
    分级降级动作：\n\n- 实时决策回路：\n\n\U0001FA93 这相当于给 RAG 系统装了一个“财务大脑”，在保证核心服务的前提下，将成本压到最低。\n\n---"

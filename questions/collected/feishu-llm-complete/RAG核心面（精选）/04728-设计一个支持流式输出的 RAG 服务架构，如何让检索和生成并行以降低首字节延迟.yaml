content:
  prompt: 设计一个支持流式输出的 RAG 服务架构，如何让检索和生成并行以降低首字节延迟？
answer:
  mode: rubric
  reference_answer: "\U0001F30A 流式 RAG 架构追求 TTFB（首字节时间） 极小化。并行化的关键：检索与生成不应串行等待，而应部分重叠。\n\n架构设计：\n\n-
    异步生成器模式：\n\n- 流水线重叠：\n\n- 流式响应：\n\n- 后端失效处理：如果生成已开始，但后续检索发现无更多文档，生成器在消耗完当前上下文后自然停止；若检索完全失败，生成器仍可基于已给文档完成流式输出，或发送降级信号。\n\n⚡
    这种并行架构将“TTFB = 检索全时 + 生成首Token”缩短为“TTFB = Max(部分检索, 生成首Token)”，显著压缩了用户等待时间。\n\n---"

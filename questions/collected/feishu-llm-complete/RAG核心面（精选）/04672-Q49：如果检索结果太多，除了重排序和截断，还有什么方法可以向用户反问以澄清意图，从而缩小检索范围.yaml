content:
  prompt: Q49：如果检索结果太多，除了重排序和截断，还有什么方法可以向用户“反问”以澄清意图，从而缩小检索范围？
answer:
  mode: rubric
  reference_answer: "\U0001F4AC 主动交互式澄清：当系统对查询的意图不确定，或者存在多种可能的解释时，自动生成一个或多个澄清问题。\n\n\U0001F3AF
    实现方法：\n\n- 面向歧义实体的澄清\n\n- 系统识别出查询中的实体可能存在同名词条。例如，“小米”可能指粮食也可能指手机品牌。通过分析检索结果，发现返回的文档横跨两个领域且分数都很高。系统可反问：“您是想了解关于‘小米’作为食物营养价值，还是小米手机的设置？”\n\n-
    技术实现：对检索结果的文档标题或摘要进行主题聚类（如 LDA 或基于向量的聚类），提取差异最大的两个簇的标签，生成选择式澄清。\n\n- 基于分面的引导式提问\n\n-
    当查询是“笔记本电脑”这种宽泛词时，可从检索结果中提取出现频率高且有区分度的属性（品牌、价格区间、尺寸）生成反问：“您更偏好哪个品牌？联想、戴尔、还是苹果？或者您有预算范围吗？”\n\n-
    这需要索引时已存储结构化元数据。系统检查检索结果的元数据分布，挑选信息增益最大的属性提问。\n\n- 生成式反问模型\n\n- 微调一个模型，输入：查询 +
    检索结果摘要（或结果多样性表征），输出：一个旨在缩小范围的澄清问题。可用强化学习优化提问后的用户点击效率。\n\n\U0001F504 反馈处理：用户回答后，将澄清信息作为过滤条件，重新执行带过滤的检索，显著提升精度。这种模式把单轮RAG扩展为对话式RAG。\n\n---"

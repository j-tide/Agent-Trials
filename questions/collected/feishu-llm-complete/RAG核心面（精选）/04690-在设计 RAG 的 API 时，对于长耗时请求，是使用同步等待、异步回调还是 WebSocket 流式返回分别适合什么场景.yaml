content:
  prompt: 在设计 RAG 的 API 时，对于长耗时请求，是使用同步等待、异步回调还是 WebSocket 流式返回？分别适合什么场景？
answer:
  mode: rubric
  reference_answer: "⏳ 长耗时主要来自 LLM 生成（可能数十秒），选错交互模式严重影响用户体验和系统资源。\n\n\U0001F50C 三种模式对比：\n\n-
    同步等待（Blocking）\n\n- 异步回调（Async Callback）\n\n- WebSocket 流式返回（Streaming）\n\n\U0001F4D0
    RAG 场景选择：\n\n- RAG 的生成通常是流式的（SSE 或 WebSocket）。因为用户想看到模型在根据检索资料逐步书写答案，这极大改善体感。因此，对外提供
    UI 的服务首选 WebSocket / SSE。\n\n- 对于API 供第三方调用，提供异步回调接口，以便他们能在自己的系统里处理结果。也可以提供同步接口但限制最大
    token 数和超时。\n\n- 流式返回也可以与回调结合：服务端通过 SSE 推流，同时记录结果，客户端断线后可凭 ID 获取完整记录。\n\n\U0001F511
    普遍最佳实践：对外用 SSE（简单、单向），对内用 WebSocket；后台任务集成用异步回调。\n\n---"

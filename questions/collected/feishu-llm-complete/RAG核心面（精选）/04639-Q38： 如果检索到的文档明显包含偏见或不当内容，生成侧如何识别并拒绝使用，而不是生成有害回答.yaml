  prompt: Q38： 如果检索到的文档明显包含偏见或不当内容，生成侧如何识别并拒绝使用，而不是生成有害回答？
answer:
  mode: rubric
  reference_answer: "\U0001F6E1️ 这要求 RAG 管道内置内容安全护栏，而且必须在生成之前过滤或标记，否则模型很可能顺从地复述有害内容。\n\n\U0001F50D
    多层防御体系：\n\n- 入库前文档级安全过滤\n\n- 检索后、增强前的安全过滤\n\n- 生成侧的安全提示与约束\n\n- 生成后安全审计\n\n\U0001F52C
    高级方案：采用检索文档的批判性阅读微调。构造训练数据：提供包含偏见内容的文档，训练模型生成“注意到文档X含有性别偏见，我将不予采纳”的回答，使模型内化了“批判性读取”能力。\n\n---"

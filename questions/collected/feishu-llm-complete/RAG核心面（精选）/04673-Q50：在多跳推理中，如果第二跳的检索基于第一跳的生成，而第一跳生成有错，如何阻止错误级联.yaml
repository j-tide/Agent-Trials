content:
  prompt: Q50：在多跳推理中，如果第二跳的检索基于第一跳的生成，而第一跳生成有错，如何阻止错误级联？
answer:
  mode: rubric
  reference_answer: "\U0001FA9C 级联错误是多跳 RAG 的致命弱点，必须建立“检查点”和“回退机制”。\n\n\U0001F6E1️
    防御策略：\n\n- 每跳验证：在第一跳生成一个中间实体或结论后，不直接信任，而是进行反向验证——用该中间实体去检索，看是否有一致文档支持。例如，第一跳得出“某药物由公司A生产”，验证步骤是搜索“公司A
    生产 某药物”，若找不到高可信文档，则标记为低置信，触发备选生成。\n\n- 束搜索式多跳：不要只维护一条推理链，而是像 Beam Search 那样，在每一跳保留
    top-K 个可能的中间结果，并行探索多条路径。最终比较各路径的证据充足度和连贯性，选出最可信的链条。这虽然增加计算，但极大避免了单点错误导致全链崩溃。\n\n-
    链的全局一致性评分：最终生成的多跳答案，可以用一个模型检查“从文档A到B再到结论，每一步是否逻辑自洽”。如果不一致，则整个链条丢弃并重试。\n\n- 提前融合检索：如果不是强制依赖前一跳生成结果，可以尝试一次检索返回更多维度的文档，再让模型一次性进行隐含的多跳推理（类似于
    long context 推理），避免链式依赖。\n\n\U0001F517 实现：可以利用 IRCoT（Interleaving Retrieval with
    Chain-of-Thought）等方法，但结合验证步骤，把思维链和检索交织，并允许回溯。\n\n---"

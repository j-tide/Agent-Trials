answer:
  mode: rubric
  reference_answer: "⏱️ 检索缓存是降延迟、减负载的利器，但必须区分精确缓存与语义缓存，并设计精细的失效策略。\n\n缓存设计：\n\n- 精确缓存（Exact
    Cache）：\n\n- 语义缓存（Semantic Cache）：\n\n缓存失效策略（保证时效性）：\n\n- 基于时间的被动失效（TTL）：根据知识库更新频率设置
    TTL，如新闻 RAG 设置 5 分钟，内部手册设置 1 小时。简单但有窗口期。\n\n- 基于文档更新的主动失效：知识库文档更新时，消息队列发送失效事件，缓存服务查询“文档ID-缓存键”映射表，精准删除所有涉及该文档的缓存条目。\n\n-
    版本化缓存键：将知识库整体版本号（global_version）嵌入缓存键。当有大面积更新时，递增版本号，所有旧缓存自动失效。\n\n\U0001F4CC
    缓存的铁律：宁可缓存未命中慢一点，也不可返回过时数据。\n\n---"

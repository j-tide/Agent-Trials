content:
  prompt: Q41：对于时效性很强的回答，如何评估其“时间准确度”？比如用股票实时价格来验证。
answer:
  mode: rubric
  reference_answer: "⏱️ 时效性问题要求答案基于“当前时间点”的真实世界状态，评估也必须引入实时真值源。\n\n\U0001F3E6 股票场景评估方案：\n\n-
    建立实时真值锚点\n\n- 在用户提问的同一时刻，从可信金融数据 API（如 Bloomberg、Alpha Vantage）拉取当时的精确价格，作为基准真值。记录提问时间戳和真值，存入评估日志。\n\n-
    数值模糊匹配\n\n- 答案中的价格可能与真值因延迟存在微小偏差（秒级），因此评估时不能要求绝对相等，而要设定容差窗口，比如 ±0.5% 以内视为准确。用百分比误差衡量。\n\n-
    时效归因\n\n- 区分两种错误：①检索返回的文档包含过时价格（知识库更新延迟），②模型引用了正确的实时文档但理解错误（如看错行）。通过检查检索返回文档的时间戳和内容，判定是知识更新链的问题还是生成问题。\n\n\U0001F310
    通用方案：\n\n- 对于新闻摘要、体育比分、天气预报等，可类似地集成实时 API 作为真值源。\n\n- 若无法实时拉取，可在提问后短时间内人工搜索并截图保存作为评估依据。\n\n-
    构建一个时效性测试集，每天定时自动用当前时间触发预设问题（如“现在上证指数是多少？”），收集答案并与真值比对，形成每日时效准确率曲线。\n\n\U0001F4CA
    指标：\n\n- 时效性精确匹配率（在容差内）。\n\n- 时效性平均绝对误差。\n\n- 严重过时率（答案引用的数据时间与当前时间差超过阈值）。\n\n---"

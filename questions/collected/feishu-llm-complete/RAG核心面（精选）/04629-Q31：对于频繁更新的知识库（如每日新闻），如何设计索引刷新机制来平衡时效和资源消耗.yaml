answer:
  mode: rubric
  reference_answer: "\U0001F4F0 新闻库特点是“信息火速上新，旧闻迅速贬值”。需要分层刷新机制。\n\n设计策略：\n\n[嵌入表格未展开]\n\n\U0001F4A1
    推荐组合拳：采用时间分片索引，为每一天创建独立分区。使用增量追加将新消息插入“当天分区”，每小时后台合并一次“当天分区”内的动态段。这样查询“近24小时新闻”只扫两个分区，时效与资源皆平衡。"

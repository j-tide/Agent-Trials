content:
  prompt: 如何利用消息队列（如 Kafka）解耦文档处理、索引构建和检索服务？
answer:
  mode: rubric
  reference_answer: "\U0001F4E8 消息队列将同步的文档处理流水线转为异步、削峰、可重试的分布式系统。\n\n解耦架构：\n\n- 生产者（触发器）：文件监听服务、API
    接口、手动上传工具等。它们只负责将“待处理文档”的消息（包含 doc_id, path, action, tenant_id）发送到 Kafka Topic。\n\n-
    多组消费者（解耦的任务链）：\n\n- 优势：\n\n\U0001F517 这样，文档处理变成了一系列可靠、异步的微服务，而检索服务完全不受文档处理负载的影响。\n\n---"

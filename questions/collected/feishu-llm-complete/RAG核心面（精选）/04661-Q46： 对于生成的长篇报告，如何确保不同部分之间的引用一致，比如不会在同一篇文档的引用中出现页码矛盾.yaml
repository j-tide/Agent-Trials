content:
  prompt: Q46： 对于生成的长篇报告，如何确保不同部分之间的引用一致，比如不会在同一篇文档的引用中出现页码矛盾？
answer:
  mode: rubric
  reference_answer: "\U0001F4C4 长篇报告需要跨句连贯性与事实一致性，引用矛盾是非常显眼的幻觉。\n\n\U0001F6E0️ 保证机制：\n\n-
    引用元数据绑定：在检索阶段，不仅记录文档内容，还记录元数据：{id: \"doc_123\", page: 45, section: \"结论\"}。当生成器要在某处引用时，要求它输出结构化引用标记，如
    [src: doc_123, p45]。解码时采用约束，引用标记必须来自预先给定的元数据集合。\n\n- 全局引用状态追踪：在生成过程中，维护一个“已引用池”。生成一段后，提取其中的引用标记，与之前出现的引用进行一致性校验（如同一文档ID不能出现不同页码）。如果检测到矛盾，强制模型修正或重新生成该段。\n\n-
    多遍生成与校对：先生成草稿，然后使用一个专门的校对模型或同一模型但以“校对”模式，输入全文和所有引用元数据，要求输出不一致之处并修正。这一遍专注于一致性，效果好。\n\n-
    分而治之的规划：在生成前，先规划好每个章节将引用哪些文档的哪些片段，生成一个大纲（引用计划）。生成时严格按计划执行，每一节只使用预设的引用片段。这样在宏观层面就避免了冲突。\n\n\U0001F4CC
    关键：引用元数据必须在检索时就精确提取，向量检索返回的 chunk 应包含原始页码等细粒度定位信息。\n\n---"

content:
  prompt: Q47：如何利用用户在检索结果上的点击行为，在线训练或调整重排序模型？
answer:
  mode: rubric
  reference_answer: "\U0001F5B1️ 信号本质：用户点击某个文档是隐式的正反馈，但充满了偏见（位置偏差、展示偏差）。我们需要从带噪反馈中学习。\n\n\U0001F3AF
    方案一：在线成对偏好学习（Pairwise Learning）\n\n- 实时收集数据：对于每次搜索会话，记录展示的文档顺序（rank 1..N）和用户是否点击。假设点击的文档比未被点击的同屏文档更相关（但需修正位置偏差）。\n\n-
    使用 Dueling Bandit 或 随机梯度下降 在线更新重排序模型参数。对于每个点击对 (q, d_clicked, d_not_clicked)，计算损失
    max(0, margin - score(q,d_clicked) + score(q,d_not_clicked))，然后反向传播更新模型。\n\n-
    为减轻位置偏差，可以在日志中随机调换前几位文档的顺序进行流量探索（Interleaving 实验）。\n\n\U0001F501 方案二：离线反事实评估 +
    在线微调\n\n- 先利用历史点击日志，通过倾向性评分（IPS）加权训练一个初始重排序模型，修正偏差。部署后，使用 渐进式验证：每天用新收集的点击数据对模型做一次增量训练（如
    fine-tune 一个 epoch），并监控线上指标（如点击率、首条点击率）确认提升，再全量推送。\n\n\U0001F9E0 方案三：强化学习\n\n-
    将重排序看作智能体行为，状态是查询和候选文档集，动作是生成排序，奖励是点击、停留时长、转化等。使用策略梯度在线更新排序策略。由于状态空间大，可结合上下文 bandit
    简化。\n\n⚠️ 关键挑战：延迟反馈、冷启动、探索-利用平衡。实践中常采用分层更新：用在线数据只更新重排序模型的轻量级头部（如线性层），保持底座冻结，以避免灾难性遗忘。\n\n---"

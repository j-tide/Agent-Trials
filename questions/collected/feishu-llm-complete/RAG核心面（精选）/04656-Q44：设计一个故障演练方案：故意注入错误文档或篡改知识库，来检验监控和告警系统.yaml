content:
  prompt: Q44：设计一个“故障演练”方案：故意注入错误文档或篡改知识库，来检验监控和告警系统。
answer:
  mode: rubric
  reference_answer: "\U0001F525 这是 RAG 系统的混沌工程，通过主动“投毒”来检验系统的免疫力。\n\n\U0001F9EA 演练设计五阶段：\n\n①
    准备“故障剧本”\n\n- 剧本A（错误注入）：在知识库中插入10篇包含严重事实错误的文档（如将某药物剂量全部改为10倍）。\n\n- 剧本B（文档篡改）：修改5篇高频使用的正确文档，将其中的核心数据随机篡改。\n\n-
    剧本C（偏见注入）：插入含有偏见的文档，测试内容安全护栏。\n\n- 剧本D（时效性攻击）：将所有文档的修改时间标记为未来，测试时效性过滤。\n\n② 确定注入方式与隔离\n\n-
    在非生产环境的影子库进行，或者在生产环境通过特定的租户/实验流量（灰度）注入。\n\n- 注入的文档要带特定标记，以便事后清理和分析。\n\n③ 演练执行\n\n-
    使用预先准备的测试问题集（包含应触发这些错误文档的问题）对系统进行压力测试。\n\n- 同时启动正常监控流，观察指标变化。\n\n④ 观察与记录\n\n-
    监控面板是否在预设时间内（如5分钟）发出告警？告警内容是否准确指出问题源？\n\n- 在线评估指标（如答案准确率、用户点踩率）是否出现预期下跌？\n\n-
    安全模块是否拦截了有害内容？\n\n- 记录故障发现时间（TTD）和故障修复时间（TTM）。\n\n⑤ 复盘与改进\n\n- 比对预期与实际，找出监控盲区。例如，监控没报警但人工发现答案质量下降，说明需要补充新的监控维度。\n\n-
    形成演练报告，更新监控规则和应急预案。\n\n\U0001F4C5 制度化：每月固定一次红蓝对抗演练，红队（攻击方）设计新型投毒方法，蓝队（防御方）完善监控和过滤。持续提升系统鲁棒性。\n\n---"

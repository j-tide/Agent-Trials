content:
  prompt: Q45：解释“上下文窗口压缩”在检索中的概念：当召回文档总长度远超生成模型窗口时，如何动态压缩或筛选？
answer:
  mode: rubric
  reference_answer: "\U0001F5DC️ 问题背景：你检索了10个文档块，每个500字，总共5000字，但LLM的上下文窗口只有4000字（或虽然窗口很大，但推理成本与长度平方正比）。需要压缩成精华。\n\n\U0001F539
    方法1：摘要式压缩\n\n- 将每个文档块预先用一个小生成模型（如T5）离线生成一句摘要（或“要点”），存入索引。检索时，不返回原文，而返回摘要。生成阶段输入摘要拼接，窗口大大缩减。缺点：信息有损。\n\n\U0001F539
    方法2：句子级重排序与动态挑选\n\n- 不使用整个文档，而是将每个文档块拆分成句子（或更小的片段），以句子为单位进行向量索引。检索后，对召回的所有句子做一次全局重排序，截取
    top-K 个最相关的句子，按原始顺序拼接。这相当于在极细粒度上进行上下文窗口填充，确保每个 token 都是高信息密度。\n\n\U0001F539 方法3：迭代式选择性阅读\n\n-
    如 REPLUG 或 Self-RAG 思想：用 LLM 逐个评估文档片段的相关性，只将判定为“相关”的片段纳入最终上下文。或者让 LLM 边读边决定是否值得继续读下一段。\n\n\U0001F539
    方法4：信息去重与融合\n\n- 使用一个较小的文本蕴含模型，判断两个片段是否表达相同事实。如果相同，保留更简洁或更权威的那一个，剔除冗余片段，从而在不损失信息量的前提下压缩总长度。\n\n\U0001F539
    方法5：基于注意力引导的截断\n\n- 用长上下文模型前向传播一次，观察交叉注意力模式，找出模型最关注的文本区间，据此裁剪掉低注意力区域，然后二次推理。适合离线批处理。\n\n\U0001F4CF
    工程实践：通常会组合使用。例如先做句子级重排，再应用轻量摘要压缩，最后根据 token 预算动态截断。\n\n---"

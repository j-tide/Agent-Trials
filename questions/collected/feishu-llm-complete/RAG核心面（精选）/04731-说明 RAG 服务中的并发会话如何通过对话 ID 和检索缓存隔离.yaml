answer:
  mode: rubric
  reference_answer: "[图片内容未导入]\n\n\U0001F9E9 在多用户并发场景下，会话隔离是保证上下文不串、缓存复用的基石。核心思想是用唯一会话ID绑定对话历史，并用（查询+会话上下文）的指纹隔离缓存。\n\n隔离机制设计：\n\n-
    对话ID绑定全链路上下文：\n\n- 查询改写与上下文融合：\n\n- 检索缓存键设计（精确+语义双层）：\n\n- 缓存写入与失效：\n\n\U0001F4CA
    这种设计既保证了会话上下文的绝对隔离，又实现了跨会话的安全缓存共享——只要独立上下文的完整查询一致，就能复用，否则不共享。\n\n---"

content:
  prompt: 如何利用“持续分析数据库”（如 ClickHouse）来存储和分析海量检索与生成日志，支持实时看板和离线分析？
answer:
  mode: rubric
  reference_answer: "\U0001F4BE ClickHouse 是 OLAP 利器，非常适合存储 RAG 的结构化和半结构化日志，支撑秒级聚合和长期分析。\n\n\U0001F4E5
    日志存储设计：\n\n- 设计一张宽表 rag_requests，字段包括：\n\n- 利用 ClickHouse 的 Array 和 Nested 类型高效存储多文档信息。\n\n-
    按天分区（PARTITION BY toYYYYMMDD(timestamp)），设置 TTL 自动归档或删除老旧数据。\n\n\U0001F4CA 实时看板：\n\n-
    直接查询 ClickHouse 实现 Grafana 面板，SQL 可对近5分钟数据做聚合，计算 QPS、P95 延迟、错误率。\n\n- 高级看板：对用户查询文本做实时高频词统计，检测热点问题漂移（使用
    groupArray 结合 topK 函数）。\n\n\U0001F50E 离线分析：\n\n- 每天定时任务聚合天表，计算各维度的准确率、检索召回率、幻觉率。\n\n-
    可关联用户行为日志，用 SQL 做漏斗分析：“用户提问→得到回答→追问→结束”的转化率。\n\n- 识别低质量知识源：SELECT source, avg(auto_faithfulness_score)
    FROM rag_requests ARRAY JOIN retrieved_doc_sources AS source GROUP BY source。\n\n\U0001F680
    ClickHouse 的物化视图可以预计算分钟级聚合，极大提升看板刷新速度。\n\n---"

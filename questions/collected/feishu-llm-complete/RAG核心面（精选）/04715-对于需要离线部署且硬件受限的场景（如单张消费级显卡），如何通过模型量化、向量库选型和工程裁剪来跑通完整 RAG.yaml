answer:
  mode: rubric
  reference_answer: "\U0001F5A5️ 目标：在一张 RTX 3090/4090 或甚至 GTX 显卡上，搭建一个可用的私有 RAG。\n\n\U0001FAB6
    轻量化方案分三步：\n\n- 生成模型量化与选型\n\n- 嵌入模型本地化且小体积\n\n- 向量库选型与裁剪\n\n- 工程裁剪\n\n\U0001F4C9
    性能参考：\n\n- 在一张 24GB 的 RTX 3090 上，可以同时加载 4-bit 量化的 7B 模型（~6GB）+ 小型嵌入模型（~0.5GB），还有余量运行向量库，并发支持
    1-2 个请求，单个问题从检索到生成约 3-10 秒。\n\n✨ 关键：适配而不是硬撑，通过裁剪每一步来适配资源，同时保证回答质量在可接受范围内。\n\n---"

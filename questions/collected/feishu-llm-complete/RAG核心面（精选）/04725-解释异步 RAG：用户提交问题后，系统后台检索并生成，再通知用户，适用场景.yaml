content:
  prompt: 解释“异步 RAG”：用户提交问题后，系统后台检索并生成，再通知用户，适用场景？
answer:
  mode: rubric
  reference_answer: "⏳ 异步 RAG 将同步的“请求-响应”变为“提交-处理-回调”，适用于深度研究、复杂报告生成等耗时长的任务。\n\n工作模式：\n\n-
    用户提交复杂问题（如“分析近五年AI投资趋势并生成报告”），系统返回一个 task_id。\n\n- 后台任务队列（如 Celery + Redis）接管，逐步执行：多轮检索、深度阅读、长文本生成。这个全过程可能需要数分钟。\n\n-
    任务完成后，结果存入数据库，并通过 WebSocket、邮件或短信通知用户：“您的问题已处理完毕，点击查看”。\n\n- 前端展示结果时，可直接呈现流式生成历史或完整文档。\n\n适用场景：\n\n-
    深度研报生成：需要检索和综合数百篇文档，生成万字报告。\n\n- 多模态复杂查询：如“对比这几张设计图并给出改进建议”，计算量大。\n\n- 高并发峰值保护：避免长任务占满同步连接，用异步削峰。\n\n\U0001F501
    异步 RAG 是对“耐心”需求的优雅响应，它让 RAG 从“快问快答”延伸到“深度智能处理”。\n\n---"

content:
  prompt: Q32：如何评估一次索引构建的质量，比如全率和重排序后的精度？
answer:
  mode: rubric
  reference_answer: "\U0001F4CA 索引质量≠原始检索精度。索引构建影响了召回的上界和排序的精准度。评估需分两阶段。\n\n评估指标与方法设计：\n\n-
    全率（Recall@k，即召回率）\n\n- 初检索精度 (Precision@k)\n\n- 重排序后精度（如 NDCG, MRR）\n\n实验设计：\n\n-
    固定查询集，固定重排序模型。改变索引参数（如分块大小、嵌入模型、索引算法 HNSW vs IVF_PQ）。\n\n- 绘制曲线：Recall@50 作为横轴，MRR
    作为纵轴，每个参数组一个点，选出在合理延迟下，Recall 和 MRR 都最高的点。\n\n\U0001F50D 高质量索引的标志是：高 Recall@小
    k 和 高 MRR，即“既没漏掉好答案，又把好答案排在了最前面”。\n\n---"

content:
  prompt: Q35：如何利用大模型自动为文档片段生成 QA 对，并用于提升索引质量？
answer:
  mode: rubric
  reference_answer: "✨ 这是一种“让文档自己教别人怎么提问”的数据增强技术，也叫 Query Augmentation。\n\n生成流程：\n\n-
    对每个 chunk，向大模型（如 GPT-4o mini）发送精心设计的提示：“基于以下文本，生成 3 个多样化的、用户可能会问的问题。问题应涵盖细节查询、比较和概括。文本：{chunk_text}”。\n\n-
    清洗与过滤：对生成的问题进行去重、长度过滤，剔除过于宽泛或无意义的问题。\n\n- 多向量索引构建：为每个 chunk 创建索引时，不仅存储 chunk 本身的向量，还为生成的每一个问题分别计算向量，一同存入，并与该
    chunk 关联。\n\n- 检索时的提升作用：当用户查询到来时，其向量会同时与 chunk 向量和所有生成的问题向量进行匹配。由于问题是用自然语言写就的疑问句，与用户查询的表达方式更接近（都是问题形式），检索就获得了
    “查询-问题对齐”的额外路径，极大缓解“用户问法”和“文档陈述”之间的语义表达差异。\n\n\U0001F4C8 结果：索引质量大幅提升，特别是对于用户意图复杂、表述多样的场景。这本质上是利用生成模型，为文档片段创建了高质量、多角度的“语义着陆点”。\n\n---"

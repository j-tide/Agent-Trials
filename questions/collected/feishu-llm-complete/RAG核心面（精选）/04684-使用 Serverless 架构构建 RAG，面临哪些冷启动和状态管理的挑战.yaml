content:
  prompt: 使用 Serverless 架构构建 RAG，面临哪些冷启动和状态管理的挑战？
answer:
  mode: rubric
  reference_answer: "☁️ Serverless（如 AWS Lambda）虽免运维，但其冷启动和无状态特性与 RAG 的模型加载、长时推理天然冲突。\n\n挑战与应对：\n\n-
    冷启动延迟：每次函数实例从零启动，需要加载大模型权重（数GB），带来数十秒延迟。\n\n- 状态管理：多轮对话的状态不能存储在函数内存中。\n\n- 执行时间限制：Lambda
    最长执行时间 15 分钟，但大模型流式生成可能接近此限。\n\n- 向量数据库连接：频繁建立数据库连接开销大。\n\n\U0001F4D0 Serverless
    适合 RAG 中的事件驱动、轻量编排部分，核心的大模型推理与向量检索仍建议常驻服务。\n\n---"

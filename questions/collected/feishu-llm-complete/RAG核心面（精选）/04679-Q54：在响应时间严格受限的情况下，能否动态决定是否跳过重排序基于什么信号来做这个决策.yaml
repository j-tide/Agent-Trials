answer:
  mode: rubric
  reference_answer: "⏱️ 动态跳过决策（Adaptive Reranking）：\n\n决策信号：\n\n- 第一阶段检索结果的置信度\n\n-
    查询难度预估\n\n- 时间预算感知\n\n- 历史缓存命中\n\n\U0001F500 决策逻辑：用一个小型决策树或规则引擎结合以上信号，输出 skip_rerank
    = True/False。\n\n⚡ 例子：在语音助手场景，要求200ms内响应。策略：若向量检索 top-1 得分 > 0.95 且前3名分数递减很陡，则立即生成回答；否则，若剩余时间>50ms，启动轻量重排（小模型），否则放弃重排直接回答。\n\n---"

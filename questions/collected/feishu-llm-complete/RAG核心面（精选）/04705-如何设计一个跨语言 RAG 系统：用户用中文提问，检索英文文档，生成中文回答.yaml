  mode: rubric
  reference_answer: "\U0001F30D 跨语言 RAG 的核心挑战在于查询-文档语言不匹配。需要打通“中文提问 → 英文检索 → 中文生成”的全链路。\n\n系统设计：\n\n-
    跨语言嵌入模型（基石）：\n\n- 查询翻译作为增强（可选）：\n\n- 文档处理不变：\n\n- 生成阶段的跨语言指令：\n\n- 引用保留英文原文：\n\n⚙️
    流程：中文问题 → 跨语言模型编码 → 检索英文文档 → 中英混合上下文 → 生成中文答案。\n\n---"

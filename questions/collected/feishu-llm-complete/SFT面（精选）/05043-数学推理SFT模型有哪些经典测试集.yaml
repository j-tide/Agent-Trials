  prompt: 10. 数学推理SFT模型有哪些经典测试集？
answer:
  mode: rubric
  reference_answer: |-
    数学推理测试集根据难度和题型，从小学算术到大学竞赛不等。常用经典测试集按难度递进排列：

    - 基础算术与文字题

    - 高等数学与竞赛

    - 微积分与科学计算

    - 多语言数学推理

    评估方式：对于有最终确定性答案的数学题，通常使用精确匹配。对于复杂的数学表达式，常使用SymPy进行符号化简后比较。MATH基准则提供了更完善的等价判断脚本。近年来的趋势是评估模型的思维链质量，即不仅看答案，也评估其推理步骤的正确性和逻辑性。


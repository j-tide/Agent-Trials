content:
  prompt: "⚖️ 27. 如何通过SFT微调让模型成为优秀的评估者（LLM-as-judge）？"
answer:
  mode: rubric
  reference_answer: |-
    LLM-as-judge（用语言模型作为评判者）是目前评估SFT模型的最主流方法，但其本身也面临偏见和不一致性的问题。通过SFT微调出一个专门用于评估的模型，可以显著提升评判的专业性、稳定性和对自定义标准的遵循度。其微调数据的构造，是将“评估任务”本身作为一个指令遵循任务来对待。

    一、评估者SFT数据的核心结构

    这种SFT数据将“进行评估”作为指令，将“评估报告”作为回答。其输入和输出必须高度标准化。

    输入部分（指令）：需要清晰地定义评估任务，包括被评估的原始用户指令、待评估的回答，以及最重要的——评估量规（Rubric）。

    ```text
    [系统提示] 你是一个专业的AI回答质量评估专家。请严格遵循以下评分标准，对待评估的回答进行多维度评分。
    评分标准（1-5分）：
    - 准确性：回答事实是否正确？
    - 完整性：是否回应了用户指令中的所有要求？
    - 流畅性：语言是否自然流畅？

    [用户指令]：请解释什么是光合作用。
    [待评估回答]：光合作用就是植物用阳光制造食物。
    ```

    输出部分（评估报告）：就是我们要训练模型生成的目标。它应该是一个包含多维度评分、详细理由和总体结论的结构化JSON。

    ```json
    {
      "accuracy": 5,
      "reasoning_accuracy": "回答准确概括了光合作用的核心过程，虽然简略但无事实错误。",
      "completeness": 3,
      "reasoning_completeness": "回答过于简略，未提及叶绿体、二氧化碳、水等关键要素，完整性不足。",
      "fluency": 5,
      "reasoning_fluency": "语言简洁明了，通俗易懂。",
      "overall_comment": "一个基础但过于简单的回答，适合入门理解，但缺乏深度。"
    }
    ```

    二、构造高质量评估SFT数据的方法

    - 基于人类偏好的校准：收集一批由多位专家评估过的样本，这些样本包含专家们依据特定量规给出的多维度评分和理由。这是最宝贵的对齐数据，用于“校准”模型的评估标准，使其与人类专家高度一致。

    - 利用强模型的评判能力进行蒸馏：让GPT-4等顶级模型扮演评估者，对海量的回答生成详细的评估报告。然后，用这些数据来微调我们自己的、更小更快的评估模型。这就是评估能力的蒸馏。关键在于，发给GPT-4的评估prompt必须与未来我们自己的评估模型将接收的prompt格式高度一致。

    - 构造“对比评判”数据：评估不仅是绝对打分，还包括相对比较。SFT数据可以包含：给出一对回答（A和B），要求模型选出更好的一个并给出理由。这能让模型学会捕捉细微的质量差异。

    三、减少评估偏差的专门数据

    一个优秀的评估模型必须克服常见的偏差。我们可以在SFT数据中专门构造对抗偏差的样本：

    - 反长度偏差数据：构造一对回答，一个是冗长但内容空洞的回答，另一个是简短但精准的回答。将简短的回答标注为“更好”。这会训练模型不要被长度迷惑。

    - 反位置偏差数据：在比较两个回答时，在训练数据中随机交换A和B的顺序，但保持评判结果不变（即总是判定那个本质上更好的回答获胜）。这会教会模型“顺序”是无关特征。

    - 反权威偏差数据：构造一些“看似专业流畅但包含事实错误”的回答，将其评判为低分。这会训练模型不被华丽的语言风格所欺骗，坚持事实和逻辑标准。

    四、训练策略

    - 全量微调或强LoRA：评估任务要求模型具备深厚的语言理解功底，因此通常需要对较大的模型进行微调。使用较强的LoRA配置（如r=64或更高）可以取得很好的效果。

    - 多任务混合训练：将评估SFT数据与常规的指令遵循SFT数据混合训练。这可以防止模型退化为“只会评价、不会做事”的纯裁判，保持其基础的语言能力。

    ✅ 总结：通过SFT微调出一个优秀的评估者，核心在于构造包含详细量规、结构化多维评分和对抗偏差示例的高质量评估数据。这本质上是将人类的评判智慧蒸馏到一个专用的、高效的语言模型中。


content:
  prompt: "\U0001F91D 28. 面向多agent协作的SFT有什么特殊考虑？"
answer:
  mode: rubric
  reference_answer: |-
    多Agent协作SFT的目标是训练出一个或多个能够与其他AI Agent有效沟通、任务分配、协商和共同解决问题的模型。这比单Agent SFT要复杂得多，因为它不仅要教会模型“如何做”，还要教会它“如何与他人一起做”。SFT数据必须捕捉到群体协作的动态交互过程。

    一、数据格式的扩展：显式的“消息传递”协议

    单Agent的SFT数据是“用户->助手”的对话。多Agent SFT数据则是一个包含多个参与者的“群聊记录”。我们需要为每个Agent定义唯一的标识符。例如：

    ```text
    [用户]：请你们三个一起为我策划一个科技产品发布会。Alice负责创意，Bob负责预算，Charlie负责后勤。
    [Alice->Bob,Charlie]：我建议主题定为“与未来对话”，主打沉浸式VR体验。
    [Bob->Alice,Charlie]：主题很赞，但VR体验区的搭建成本可能超支。Charlie，如果场地选在科技馆，你那边物流成本大概是多少？
    [Charlie->Alice,Bob]：科技馆的物流成本大约在2万元。如果成本超支，我们可以减少一些互动设备的数量。@Bob，你觉得砍掉哪个部分比较合适？
    [Bob->所有]：我建议保留体验区，砍掉传统的展板区，这样预算能平衡。
    [Charlie->用户]：好的，经过我们三人的讨论，初步方案如下...
    ```

    在这种数据中，模型（比如扮演Bob）需要学会：1）接收和解析来自多个发言者的信息（Alice->Bob,Charlie）；2）根据当前对话状态和自己的角色（预算师）生成回应；3）通过“@”或其他方式明确通信对象。这种数据格式将协作技能转化为了可学习的语言模式。

    二、必须包含的关键交互模式

    多Agent SFT数据必须覆盖多种协作策略：

    - 分工与委派：学会说“这个任务我不擅长，交给你来做吧”，“我把结果发给你了，请基于此继续下一步”。

    - 信息共享与汇总：学会说“这是我收集到的所有资料，现在我们需要汇总一下”，“我的结论是X，和你得出的Y有什么不同？”

    - 冲突协商：学会说“我不同意你的方案，因为它会导致...我建议折中一下...”或“我理解你的顾虑，但我认为在当前约束下，我的方案更优，因为...”。

    - 汇报与交付：最终由一名Agent（或轮流）向用户汇报最终结果，并总结协作过程。

    三、训练时的特殊挑战

    - 一致性与角色扮演：如果多个Agent都由同一个基座SFT模型驱动（常见于学术研究），训练数据必须让模型学会根据当前扮演的角色（Alice/Bob/Charlie）切换自己的行为模式、知识和语气。这需要在SFT数据中，为同一个基座模型提供不同角色的、但角色内一致的对话示例。训练时，角色名称（如[Bob->...]）会作为输入的一部分，模型学习到“看到我是Bob时，我应该以预算师的身份思考”。

    - 上下文长度爆炸：多Agent对话会产生极长的上下文，这对模型的长上下文能力是严峻考验。SFT数据构造时，就需要精心设计长上下文中的信息依赖，训练模型在超长群聊记录中精准检索关键信息。

    - 避免“多Agent幻觉”：模型可能会产生“幻觉”认为其他Agent说了某些话（因为它们作为同一个模型，在参数层面可能混淆）。因此，训练数据中的对话历史必须绝对精确，不能有模糊或错误归因。

    四、构造数据的实用方法

    - 用强模型进行角色扮演模拟：让GPT-4等模型分别扮演不同角色，在给定的场景下进行多轮自由对话，记录日志。人工审核日志，修正不合理之处，就构成了SFT数据。

    - “剧本”式人工编写：对于关键的高质量协作流程，由人工编写整个对话脚本，确保逻辑严密、交互丰富。

    - 从真实团队协作数据中提炼：如果存在人类团队（如客服团队）的协作记录，经过脱敏和清洗，可以作为非常宝贵的真实SFT数据。

    ✅ 总结：多Agent协作SFT的关键在于定义清晰的群组通信协议，并在数据中覆盖分工、协商、汇总等关键协作模式。训练时需要处理角色一致性、长上下文和幻觉等独特挑战，其数据构造高度依赖模拟和人工编写。


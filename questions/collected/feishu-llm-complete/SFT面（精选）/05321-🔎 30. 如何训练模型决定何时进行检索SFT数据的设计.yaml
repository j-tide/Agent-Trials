content:
  prompt: "\U0001F50E 30. 如何训练模型决定何时进行检索？SFT数据的设计。"
answer:
  mode: rubric
  reference_answer: |-
    训练模型决定“何时检索”是一项微妙的元认知技能，它要求模型在“依赖内部知识”和“寻求外部帮助”之间做出动态权衡。SFT数据的设计必须明确地教会模型这种判断边界。

    一、数据设计的核心：检索与否的对比示范

    我们需要构造三种类型的SFT样本，覆盖所有决策场景：

    - 明确需要检索的任务：问题超出模型知识截止日期、要求实时信息（天气、股价）、或者涉及高度具体的事实（“Meta刚发布的财报具体数据”）。

    - 明确不需要检索的任务：通用知识问答（“水的沸点是多少度”）、创意写作、情感陪伴、简单推理等。

    - 模糊边界的任务：这是最关键、也最难构造的数据。问题表面看需要事实，但属于广泛的公共知识，模型本身可能知道。例如：“爱因斯坦的相对论核心思想是什么？”

    二、加入“检索失败”和“无需检索”的对比

    为了强化决策能力，可以构造对比数据：

    - 错误示范：对于一个明显需要检索的问题（如“今天北京限行尾号是多少”），模型直接给出了一个错误答案（依赖过期知识）。随后，加入一个修正链：[反思] 这是一个实时信息，我应该先检索。 [检索] ...。这种数据让模型学会“事后后悔”，从而在下次遇到类似情况时，更倾向于先检索。

    - 过度检索示范：对于一个简单问题（如“2+3等于几”），模型却进行了检索。然后，可以有一个反思：“这是一个基础算术问题，我不需要检索。”

    三、训练策略

    - 数据配比：三种类型的数据应保持平衡。“模糊边界”的数据比例可以稍高，因为这是模型最难学会的。

    - 强化学习与DPO的补充：SFT给出了一个良好的初始决策策略，但很难穷举所有边界情况。后续可以使用DPO，对“在正确时机检索”的行为给予正偏好，对“在不必要时检索”（浪费资源、延迟响应）或“在必要时不检索”（导致幻觉）给予负偏好，从而精细化模型的检索决策。

    - 评估：可以创建一个诊断测试集，包含各种时间敏感度、知识依赖度不同的问题，精确评估模型的检索决策准确率、召回率和F1分数。

    ✅ 总结：训练模型决定何时检索，关键在于SFT数据中覆盖“必须检索”、“不必检索”和“模糊边界”三类场景，并通过系统提示条件化训练和对比数据，让模型学会将检索决策作为一种可控的行为策略。


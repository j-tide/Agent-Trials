content:
  prompt: "\U0001F3A8 31. 为什么说SFT奠定了模型对齐的“基础风格”？"
answer:
  mode: rubric
  reference_answer: |-
    当我说SFT奠定了模型的“基础风格”时，我指的是SFT在很大程度上决定了这个模型基本的说话方式、格式偏好、礼貌程度、回答结构、以及初始的“人格”基调。RLHF/DPO可以在这个基调上进行修饰和优化，但很难从根本上颠覆它。

    一、SFT塑造了对话的“底层操作系统”

    SFT教会了模型最基本的交互协议：如何区分用户和助手，对话以什么格式开始和结束，回答是应该直接解决问题还是先寒暄一番。这些规则通过海量数据被深深地镌刻在模型的参数中，成为其行为的默认模式。RLHF/DPO的KL约束更是确保了这些底层规则不会被后续优化打破。

    二、SFT定义了“好的标准”的初始范围

    SFT数据中的回答，构成了模型对“什么是好回答”的初始认知边界。如果SFT数据中99%的回答都是分点作答、结构化极强的风格，那么模型就会形成“好回答 = 分点作答”的强烈先验。后续RLHF可以调整它分几“点”、“点”的内容怎么写，但很难让它学会“好回答也可以是一句简洁的结论”，因为那个空间在SFT分布中概率极低，RLHF的探索很难到达。

    三、安全边界和“三观”的初步成型

    SFT数据中的拒绝样本和系统提示，为模型划定了第一道是非边界。它教会模型哪些词是禁忌，对哪些请求应该立刻拒绝。这种初期的价值观灌输，因为是在模型形成对话能力的初期完成的，所以影响极其深远。后续偏好对齐往往只是在强化这个“三观”的执行力，或微调一些灰色地带的判断，但大方向已经被SFT锁定了。

    四、为什么RLHF难以颠覆SFT的风格

    - KL约束的保守性：PPO和DPO都内建了保持接近SFT分布的机制。任何试图根本改变风格的尝试，都会触发强大的KL惩罚。

    - 探索的惰性：模型在SFT风格的“舒适区”内已经能获得不错的奖励，没有强烈的梯度信号推动它去冒险探索一个完全不同、且可能初期奖励很低的陌生风格区域。

    - 数据分布的不对称：改变SFT的基础风格可能需要极其海量的、风格迥异的偏好数据，而这是非常昂贵的。

    ✅ 总结：SFT就像是为模型的人格打下的地基和承重墙。它不仅决定了房间的初始布局，也限制了后续装修（RLHF/DPO）可以改动的范围和方向。基础风格一旦形成，便具有强大的惯性，成为模型不可磨灭的印记。


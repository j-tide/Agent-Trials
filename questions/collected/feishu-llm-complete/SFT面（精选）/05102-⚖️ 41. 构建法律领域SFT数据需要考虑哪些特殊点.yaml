content:
  prompt: "⚖️ 41. 构建法律领域SFT数据需要考虑哪些特殊点？"
answer:
  mode: rubric
  reference_answer: |-
    法律SFT数据是专业性最强、容错率最低的SFT数据类型之一。一条法律上的错误回答，可能导致用户做出错误决策，产生实际的法律后果。因此，法律SFT数据的构造需要遵循一套严格的专业规范。

    一、法律SFT数据的特殊要求

    [嵌入表格未展开]

    二、数据构造的流程与审核机制

    法律SFT数据构造不能单靠通才型标注者，必须引入法律专业人士参与：

    - 律师编写核心数据：对于高频法律咨询场景，由执业律师亲自编写问答对

    - 双重审核机制：每条数据至少经过两位审核者——一位负责法律准确性审核，一位负责语言流畅度和格式审核

    - 来源追溯：每条引用了具体法条或判例的数据，必须标注引用来源，以便后续核查

    - 定期更新：法律是动态变化的，SFT数据需要建立定期审查机制，更新过时的法条引用

    三、安全与伦理的特殊考量

    - 绝不帮助违法：对任何试图利用法律漏洞进行不当行为的请求，必须坚决拒绝

    - 地域覆盖的谨慎：对于涉及多地域法律的复杂问题，应指出差异并建议咨询当地律师，而非给出笼统的统一回答

    - 弱势群体保护：对于可能涉及家庭暴力、劳动纠纷等弱势群体的问题，回复中应主动提供法律援助途径和求助电话

    四、表达方式的法律专业性

    法律SFT数据不仅要内容正确，语言风格也需专业。回复应使用正式、严谨的书面语，避免口语化和模糊表达。但同时也要保持可读性——纯法条式的回复对普通用户毫无帮助。理想的法律回复结构为：

    - 用通俗语言简要概括结论

    - 引用相关法条或判例作为依据

    - 说明适用的前提条件和例外情况

    - 附上免责声明和咨询建议

    ✅ 总结：法律SFT数据需要法条引用的绝对准确、管辖时效的明确标注、免责声明的强制附加，以及法律专业人士参与的编写和双重审核。它是SFT数据中专业门槛最高、后果最严重的领域之一，容不得半点马虎。


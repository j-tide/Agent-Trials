content:
  prompt: "\U0001F4CA 17. SFT模型输出的分布和RLHF后模型输出分布有何统计差异？"
answer:
  mode: rubric
  reference_answer: |-
    SFT和RLHF会从根本上重塑语言模型的输出概率分布，两者呈现出不同的统计特征。

    一、SFT后的分布：尖锐、集中的“高峰”
    SFT是典型的监督学习，优化目标是最大化训练数据中标准回答的似然。这会导致模型的输出概率分布 PSFT(y∣x) 在训练样本附近急剧尖锐化，形成一个或几个狭窄的高峰。所有未被SFT数据覆盖的、但在预训练中可能存在的合理回答，其概率被大幅压低，甚至趋近于零。这是一种 “模式坍缩” 现象：模型从“什么都能聊”变成了“只聊某种话术”。其概率分布具有低熵、高峰度的特征。

    二、RLHF后的分布：更宽、更平坦的“高原”
    RLHF（尤其是PPO）通常包含一个KL散度惩罚项，强制模型输出分布不要偏离初始SFT分布太远。然而，由于奖励模型 rϕ 的存在，模型被鼓励去探索那些SFT分布中概率不高、但奖励更高的区域。因此，经过RLHF后，最优策略的分布形式为：

    [图片内容未导入]

    这意味着奖励越高的回答，其概率在SFT基底上被指数级放大。关键的是，奖励模型通常是对整个人类偏好空间的一个平滑近似，它不会像SFT那样只对某几个点给高分。因此，RLHF后的分布相对于SFT分布更为宽缓——它在保留SFT高概率区域的同时，将周围一个较大的范围都提升到了较可观概率，形成一个“高原”而非“尖峰”。

    三、统计指标上的体现

    - 熵：RLHF后模型的输出熵通常高于SFT模型（在相似任务上）。因为它没有被锁定在少数几个答案上，而是保留了对多种风格和内容的生成能力。

    - 多样性与创造力：RLHF模型在开放式任务上展现出比SFT模型高得多的多样性。Self-BLEU等多样性指标会显著改善。

    - 尾部行为：SFT模型对于分布外指令容易崩溃或给出模板化回复。RLHF模型由于保持了更宽的分布，泛化能力更强，对稍微偏离训练分布的指令具有更好的鲁棒性。

    四、可视化比喻

    可以把预训练模型的分布想象成一片广阔但平缓的丘陵。SFT在这片丘陵上堆起了一座座陡峭的山峰（训练样本对应点）。RLHF则是把这些山峰削平、拓宽，让它们变成连绵的高原——既有高度（质量高），又有广度（多样性好），且通过KL惩罚保留了与其他丘陵的自然连接。

    ✅ 总结：SFT产生尖锐、低熵的分布，导致模式坍缩；RLHF通过奖励引导和KL正则化，将分布塑造为宽缓、高熵的“高质高原”，恢复了多样性和泛化能力。


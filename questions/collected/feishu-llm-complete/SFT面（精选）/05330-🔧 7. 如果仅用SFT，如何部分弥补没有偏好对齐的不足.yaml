content:
  prompt: "\U0001F527 7. 如果仅用SFT，如何部分弥补没有偏好对齐的不足？"
answer:
  mode: rubric
  reference_answer: "尽管SFT有诸多局限，但在无法进行RLHF/DPO的情况下，我们仍然可以通过精妙的数据工程和训练技巧来部分弥补这些不足，使SFT模型的行为尽可能接近对齐的目标。\n\n\U0001F4CC
    方法一：构造多样化的“多答案”数据，模拟偏好信号\n\n为同一个指令构造多个风格不同但都合理的回答，比如一个“简洁直接”的版本、一个“详细解释”的版本、一个“带有关怀口吻”的版本。将这些版本都作为该指令的有效回复放入SFT数据中。通过这种方式，模型不再学习单一的“标准答案”，而是学会同一个指令存在多种合理的输出模式。这可以有效缓解多样性丧失问题。更进一步，可以为不同回答赋予不同的系统提示（如“用简洁风格”、“用详细风格”），让模型学会根据要求切换风格。\n\n\U0001F4CC
    方法二：加入“对比”与“纠错”数据，隐式注入偏好\n\n在SFT数据中，可以构造少量的“错误-修正”对话对。例如，用户说“1+1=3，对吗？”，助手回答“不对，1+1=2。让我解释为什么...”。这种数据虽然没有直接比较两个回答的好坏，但隐式地教会模型在面对错误观点时应如何坚持事实、礼貌纠正，一定程度上弥补了SFT容易讨好用户的倾向。\n\n还可以加入“反思”数据：助手在回答一半后自我纠正：“等等，我刚刚说错了，实际上应该是...”。这能教会模型自我纠错，缓解暴露偏差。\n\n\U0001F4CC
    方法三：设计精细的指令模板，嵌入行为准则\n\n在SFT数据的每条指令或系统提示中，显式地加入行为准则，如“请保持简洁，除非用户要求详细”、“如果请求存在安全隐患，请拒绝并说明原因”、“如果你不确定，请诚实说明”。通过在训练数据中反复将这类准则与特定行为关联，模型可以学会将这些准则作为条件来调整行为。这相当于把偏好对齐的“监督信号”从奖励模型转移到了输入文本中。\n\n\U0001F4CC
    方法四：通过数据配比控制“安全-有用”平衡\n\n精细控制SFT数据中安全拒绝样本的比例和类型。避免过度拒绝，加入“建设性拒绝”样本（不直接拒绝，而是提供安全的替代帮助）。同时，增加模型“承认局限性”的样本，例如“关于这个具体日期，我的知识可能不准，建议查阅最新资料”。这能部分替代RLHF中教给模型的“谦逊”与“边界感”。\n\n\U0001F4CC
    方法五：迭代式自我蒸馏（Self-Consistency Training）\n\n用当前SFT模型生成多个回答，然后用一个更强的模型（或人工）对这些回答进行排序或评分，选出最好的回答。将这个最好的回答作为新的训练数据，重新训练模型。虽然这仍属于SFT，但通过引入“质量筛选”环节，间接实现了偏好对齐，类似于“拒绝采样”的思想。\n\n✅
    总结：仅靠SFT可以通过增强数据多样性、注入对比示例、利用指令模板嵌入准则、精细控制数据配比以及迭代自蒸馏等手段，在一定程度上模拟偏好对齐的效果，让模型在有用性、安全性和诚实性上得到提升。但这些方法仍受限于SFT的框架，无法从根本上替代RLHF/DPO的动态优化和探索能力。\n\n---"

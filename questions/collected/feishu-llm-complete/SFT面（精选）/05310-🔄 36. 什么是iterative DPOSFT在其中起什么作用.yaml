content:
  prompt: "\U0001F504 36. 什么是“iterative DPO”？SFT在其中起什么作用？"
answer:
  mode: rubric
  reference_answer: |-
    Iterative DPO（迭代DPO） 是一种通过多轮“生成-标注-优化”循环，逐步提升模型性能的技术。它超越了单轮DPO只能利用静态离线偏好数据的局限，让模型能够在自身生成的样本上进行持续学习。

    一、Iterative DPO的基本流程

    - 第一轮：用初始的SFT模型作为 πθ0πθ0，基于一组prompt生成多个回答。收集人类或强模型对这些回答的偏好标注，构造偏好对数据。用这些数据执行DPO，得到 πθ1

    - 第二轮：用 πθ1 再次生成一批新的回答，收集偏好，构造新的偏好对。用这些新数据对 πθ1 进行DPO，得到 πθ2。

    - 重复：如此循环。每一轮，模型在上一轮优化过的分布上生成更高质量或更具挑战的样本，偏好标注则针对这些新样本进行。这使得模型能够不断突破静态数据的限制，进行持续的策略提升。

    二、SFT在Iterative DPO中的作用

    SFT是整个循环的启动引擎和稳定锚。

    - 第一轮探索的基石：初始的SFT模型 πSFT 必须足够强，能够生成有意义的、可供比较的回答。如果SFT太弱，第一轮生成的都是垃圾，偏好标注将失去意义，整个迭代无法启动。

    - 隐式参考模型的持续更新：在每一轮DPO中，参考模型通常是上一轮的模型（或初始SFT模型）。这相当于每轮都在一个新的基线上进行优化。SFT不仅提供了第一轮的参考，也为后续所有轮的优化提供了一个“锚”——如果迭代中模型严重退化，可以回退到SFT状态。

    - 防止迭代漂移：在迭代DPO中，如果没有SFT这个稳定的起始分布，模型可能因为多轮的偏好优化而逐渐偏离自然语言分布。通过每一轮使用的KL约束（以SFT或前一模型为参考），这种漂移被层层控制，但最初的SFT分布仍然是所有KL链的最终原点。

    三、为什么需要迭代

    单轮DPO受限于初始离线数据的覆盖范围和模型的初始生成能力。如果初始SFT模型从未生成过某类高质量回答，静态偏好数据中也就不包含这类回答的对比，DPO无从学起。迭代DPO通过“自己生成、自己评判、自己学习”的循环，让模型能够逐步探索并优化那些在初始数据中未曾出现的新策略区域。

    ✅ 总结：Iterative DPO将静态偏好优化变成了动态的自我提升飞轮。SFT在其中提供了启动飞轮所需的初始速度，并作为防止飞轮脱轨的安全锚。


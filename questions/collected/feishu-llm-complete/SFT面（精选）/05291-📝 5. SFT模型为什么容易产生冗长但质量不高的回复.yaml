content:
  prompt: "\U0001F4DD 5. SFT模型为什么容易产生冗长但质量不高的回复？"
answer:
  mode: rubric
  reference_answer: "SFT模型输出冗长啰嗦，是数据、训练目标和解码方式共同作用的必然结果，几乎成为SFT的“职业病”。\n\n\U0001F4CC
    数据偏差：标注者偏好长回答\n\nSFT数据通常由人类标注者编写，他们在潜意识中认为“回答越详细，质量越高”。一个简单的“是”或“否”往往会被扩展为包含解释、例子、注意事项的完整段落。这种偏好导致训练数据中长回答的比例被人为提高，模型直接学习到了“长回答
    = 好回答”的统计规律。\n\n\U0001F4CC 交叉熵损失的“长度盲区”\n\nSFT的损失函数是逐token的交叉熵。对于一个长回答，其序列中包含了大量常见的、高概率的过渡词、客套话和重复性内容。这些token在给定上下文中往往具有较高的预测概率，因此它们能为损失函数的降低做出贡献。模型发现，在核心答案之外添加这些“安全但冗余”的token，可以稳定地降低整体损失，因为它增加了更多“容易预测”的步数。损失函数本身不惩罚长度，因此模型没有内在的动机去学习简洁。这就像考试中，学生发现多写字能多得卷面分，于是开始堆砌字数。\n\n\U0001F4CC
    Teacher Forcing的“安全路径”效应\n\n在teacher forcing训练中，模型每步都看到完美上下文。对于长回答，模型学到插入“另外”、“值得注意的是”、“当然”等转折词后，后续的token仍然能被正确预测（因为训练数据中就是这么写的）。推理时，模型一旦开始生成这些冗余成分，它发现继续沿着这条路径生成下去，每个后续token的概率都很高（符合训练分布），于是便倾向于继续说下去。这形成了一种“惯性”：开始啰嗦了就停不下来。\n\n\U0001F4CC
    缺乏简洁性偏好信号\n\nSFT数据中很少包含明确的“简洁版本”与“冗长版本”的对比，模型不知道在某些情境下“言简意赅”比“长篇大论”更受偏好。直到RLHF/DPO阶段，才可能通过对简洁回答给予更高偏好来纠正这一点。\n\n\U0001F4CC
    缓解措施\n在SFT数据中刻意构造不同详细程度的回答，并配以指令中的长度控制要求；在RLHF中对过长输出施加轻微惩罚；在推理时限制max_new_tokens或对EOS
    token增加概率偏置。\n\n✅ 总结：SFT模型的冗长倾向源于数据长尾偏差、交叉熵损失对长度的默许、以及teacher forcing带来的惯性生成。需要从数据和后续对齐环节针对性地注入简洁偏好。\n\n---"

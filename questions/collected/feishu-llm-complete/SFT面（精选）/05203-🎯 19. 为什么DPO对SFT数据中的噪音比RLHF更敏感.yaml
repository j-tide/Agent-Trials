content:
  prompt: "\U0001F3AF 19. 为什么DPO对SFT数据中的噪音比RLHF更敏感？"
answer:
  mode: rubric
  reference_answer: |-
    DPO对偏好数据中的噪音异常敏感，这源于其优化机制的根本差异——DPO直接依赖每个偏好标签的精确性，而RLHF（PPO）有多层缓冲机制。

    一、DPO的直接梯度放大效应

    DPO的梯度公式（简化后）正比于：

    [图片内容未导入]

    二、RLHF（PPO）的多层缓冲

    相比之下，RLHF通过PPO训练时，噪音的影响被多重机制稀释：

    - 奖励模型平滑：奖励模型通常是在大量偏好数据上训练的，个别标注噪音会在训练奖励模型时被平均化。奖励模型输出的标量奖励是“平滑后的偏好”，不会像DPO那样对一个数据点产生极端反应。

    - PPO的在线平均：PPO使用小批量在线数据更新，每个batch包含多个样本，单个噪音样本的梯度被批量中其他正确样本的梯度所平均和稀释。

    [图片内容未导入]

    三、实验证据

    研究表明，当偏好数据中存在15%-20%的标注噪音时，DPO的性能会出现显著下降，甚至可能不如原始SFT模型。而PPO在相同噪音水平下，性能下降幅度要小得多。

    四、对实践者的启示

    如果你选择SFT + DPO路线，必须在偏好数据标注上投入更多精力确保质量，或者采用数据过滤、置信度加权等方法减轻噪音影响。如果数据质量无法保证，但拥有在线服务的计算资源，SFT + PPO可能是更稳健的选择。

    ✅ 总结：DPO直接利用偏好标签计算梯度，噪音标签会产生强烈的反向梯度，立即污染模型。RLHF通过奖励模型平均、在线批量平均和KL约束等多层缓冲，对数据噪音更具鲁棒性。


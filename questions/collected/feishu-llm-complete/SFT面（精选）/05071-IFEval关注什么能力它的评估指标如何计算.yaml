content:
  prompt: 7. IFEval关注什么能力？它的评估指标如何计算？
answer:
  mode: rubric
  reference_answer: |-
    IFEval（Instruction-Following Eval） 是一个专注于评估语言模型严格遵循指令中可验证约束能力的基准。与GPT-as-judge关注回答“好不好”不同，IFEval只关心模型是否按照要求做了。

    关注的能力

    IFEval聚焦于那些可以被程序自动验证的指令约束，主要包括：

    - 字数/句数限制：“写一段50-100字的回答”、“分三点作答”。

    - 格式要求：“以JSON格式输出”、“使用Markdown表格”、“邮件格式”。

    - 关键词强制：回答中必须包含或必须避免某些特定词汇。

    - 标点符号要求：以特定符号结尾或以问句开头。

    - 语言/角色要求：必须用英文、必须用某种语气。

    - 内容结构：先写标题，然后写内容等。

    评估指标：准确率

    IFEval使用严格、完全客观的基于规则的自动化评估。它将每个指令分解为多个可被程序验证的原子约束。每个约束是否满足的判定逻辑是硬编码的（如正则匹配、计数等），不涉及任何模型评判。

    计算方法：

    - 对每条测试指令，定义好一组原子约束（如“字数在50到100之间”、“包含‘春天’一词”、“不包含‘冬天’一词”）。

    - 被评估模型生成回答。

    - 对生成的回答，逐一检查每个约束是否通过。单个约束是二元的：通过（1）或不通过（0）。

    - 对于一条指令，其所有约束都必须通过，该指令级别的得分才为1（即“严格指令遵循准确率”）。另一种更宽松的指标是“约束级别准确率”，计算所有约束的平均通过率。

    - 最终分数是所有测试指令的准确率（或平均约束通过率）。

    核心价值与局限

    IFEval的价值在于其客观、可复现、低成本。它不容许任何主观模糊性，直击模型“听话”能力的核心。但它不评估回答的事实性、有用性或创造性。一个回答可以完美满足所有格式要求，但内容是胡说八道，IFEval仍会给出满分。因此，它必须与其他关注回答质量的基准结合使用。


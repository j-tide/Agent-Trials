content:
  prompt: "\U0001F4C9 30. 请从训练稳定性的角度比较SFT和PPO。"
answer:
  mode: rubric
  reference_answer: |-
    训练稳定性是SFT和PPO之间最显著的工程差异之一。SFT以稳健可靠著称，而PPO则以对超参敏感、容易出现训练崩溃而闻名。

    一、SFT：稳定性的典范

    - 损失函数形态：SFT的交叉熵损失函数在参数空间中是平滑、凸的（在logits空间），保证了梯度下降能稳定收敛。

    - 无探索与在线交互：SFT在固定的离线数据集上训练，数据的分布是确定的。没有模型自己生成的数据（在线交互）带来的分布漂移问题。

    - 无延时奖励：SFT对每个token立即计算损失，信号密集且明确。不存在强化学习中需要多步才能判断回答好坏（延时奖励）导致的信用分配问题。

    - 超参数容忍度高：学习率、batch size等超参数在较宽范围内变化，SFT通常都能平稳训练，不太容易突然崩溃。

    - 收敛的确定性：给定足够的训练步数，SFT通常会平稳地收敛到一个局部最优解，不会出现震荡或发散。

    二、PPO：稳定性的挑战

    - 非平稳的奖励函数：奖励模型本身可能不完美，存在偏差或噪声。而且，如果奖励模型是离线训练的，它在面对PPO在线生成的、分布不断变化的样本时，可能给出失准的评分，导致优化目标漂移。

    - 策略崩塌风险：这是PPO最头疼的问题。如果不加以严格控制，策略可能在几次更新后就退化为生成重复词语、无意义内容、或极度讨好奖励模型的“崩溃模式”。这通常是因为优化步长过大，策略跳出了KL约束的有效范围。

    - 超参数极度敏感：KL惩罚系数 β、PPO的clip范围 ϵ、价值函数和策略函数的相对学习率、GAE的 λ 等，任何一个超参数设置不当都可能导致训练失败。需要非常专业的经验进行调整。

    - 在线交互的成本与波动：PPO需要不断用当前策略生成回答，这本身就是一个缓慢且带有随机性的过程。不同batch的生成样本质量可能波动很大，导致梯度估计的方差很高，训练曲线剧烈抖动。

    - 价值函数逼近误差：PPO通常需要学习一个价值函数 V(s)来估计未来回报。这个学习过程本身就有误差，会进一步传导给策略的梯度估计，加剧不稳定。

    三、为什么有这些差异？——一个比喻

    SFT就像在平静的湖面上划船，目标明确（湖对岸），风向水流平稳（静态数据），你只需朝着目标稳定前行。

    PPO则像是在波涛汹涌的大海上操纵一艘快艇。你不仅要根据不断变化的风浪（非平稳奖励）调整航向，还要时刻防止快艇侧翻（策略崩塌），同时你的导航仪（价值函数）还存在偏差。控制难度完全不在一个量级。

    ✅ 总结：SFT之所以稳定，是因为它在一个静态环境中进行确定性优化。PPO之所以不稳定，是因为它在一个由自身行为塑造的非平稳环境中进行在线随机优化，且目标函数更复杂。这也是为什么DPO作为一种更稳定的离线对齐方法，受到广泛欢迎的原因。


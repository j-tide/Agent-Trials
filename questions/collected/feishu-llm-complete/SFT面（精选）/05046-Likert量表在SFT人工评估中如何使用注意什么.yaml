content:
  prompt: 13. Likert量表在SFT人工评估中如何使用？注意什么？
answer:
  mode: rubric
  reference_answer: |-
    Likert量表是SFT人工评估中最常用的工具，它将主观判断转化为可量化的等级分数。但错误地使用Likert量表会引入严重的评估偏差。

    如何使用

    - 设计清晰的量表：通常使用5点或7点量表。比如评估“有用性”：

    - 强制正态分布（可选）：在评估多个模型时，可以要求评估者对每个问题，将多个模型的回答进行排序或强制按量表分布打分，以增强区分度。但这可能扭曲绝对质量评估，适用于A/B对比，而非绝对定标。

    - 独立评估每个维度：要求评估者看完一条回答后，对“准确性”、“有用性”等维度分别打一个Likert分，而不是打一个总分。

    注意事项

    - 避免量表趋中偏差：评估者倾向打中间分（如3分），导致分数缺乏区分度。可通过强制选择或使用更大极值（如1-7）来部分缓解。

    - 避免晕轮效应：如果评估者先被“流畅度”惊艳到，可能会无意识地给“准确性”也打高分。需要强调独立打分，并让评估者意识到这个认知偏差。

    - 顺序效应：评估者可能会因为疲劳或对比效应，对后面评估的回答给出系统性的偏差。应随机化回答的呈现顺序。

    - 个人偏差：不同评估者的评分风格差异可能很大（有人严格，有人宽松）。通过校准训练和使用多个评估者（计算评分者信度）来控制。

    - 量表文化差异：在一些文化中，人们倾向于避免极端评价。在国际化团队中，这一点需要特别培训。

    总之，Likert量表是把“感觉”结构化的工具，但结构化本身不能自动消除偏差。严格的操作规程和评估者训练，比量表本身更重要。


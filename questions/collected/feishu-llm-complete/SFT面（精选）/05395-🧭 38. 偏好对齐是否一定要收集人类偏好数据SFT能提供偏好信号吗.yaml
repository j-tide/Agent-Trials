content:
  prompt: "\U0001F9ED 38. 偏好对齐是否一定要收集人类偏好数据？SFT能提供偏好信号吗？"
answer:
  mode: rubric
  reference_answer: |-
    偏好对齐的最终目标是与人类偏好对齐，因此，人类偏好数据是终极的“金标准”。但在实践中，我们可以通过多种方式获取或近似人类偏好信号，SFT也能间接提供一部分。

    一、是否一定要人类偏好数据

    不是绝对必须，但最可靠的对齐仍然依赖一定量的人类反馈。这是因为：

    - 偏好是主观的、多维的、情境依赖的，目前只有人类能做出最精准的判断。

    - 合成偏好（如LLM-as-Judge）可能会放大模型自身的偏见，导致“回音室效应”。
    然而，由于成本原因，我们常用混合策略：少量高质量人类偏好数据用于核心对齐，大量合成偏好数据用于泛化。所以答案是：不一定“全部”要人类数据，但不能完全脱离人类数据。

    二、SFT能提供偏好信号吗？

    能，但是一种粗粒度、间接的偏好信号。

    - 数据选择本身就是偏好：我们精心挑选哪些指令-回答对进入SFT数据集，这本身就隐含了“这些回答是我们所偏好的”。相比那些未被选入的数据，SFT模型学习的回答模式就是一种偏好。

    - 系统提示与行为准则：在SFT数据中嵌入行为准则（“请保持简洁”、“如果不确定就说不知道”），相当于通过自然语言向模型注入了偏好。模型学会了将这些准则作为条件来调节生成。

    - 质量层次的隐式建模：如果在SFT中使用了条件化训练（如前问所述），模型学会了区分“详细”和“简洁”，这实际上就是对两种偏好维度的建模。它提供了一个偏好感知的起点。

    - 局限性：SFT的偏好信号是“死”的——它无法告诉你“A比B好”，只能告诉你“A是一种好回答”。因此，它缺乏对比性，无法处理复杂的价值权衡（例如，在简洁和详细之间的平衡点在哪里）。

    ✅ 总结：人类偏好数据仍是偏好对齐的基石，但不需要100%依赖。SFT可以通过数据筛选和条件训练提供隐式、粗粒度的偏好信号，为后续更精细的对齐打下基础。最有效的方式是将SFT的隐式偏好与少量人类显式偏好结合。


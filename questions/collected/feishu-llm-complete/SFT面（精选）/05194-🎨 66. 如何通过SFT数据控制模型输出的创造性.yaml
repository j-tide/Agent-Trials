content:
  prompt: "\U0001F3A8 66. 如何通过SFT数据控制模型输出的“创造性”？"
answer:
  mode: rubric
  reference_answer: |-
    模型的“创造性”——即输出的多样性、新颖性和非模板化程度——不是解码参数的专属领地，SFT数据在其中扮演着更为根本的角色。数据是模型行为的“基因”，通过在数据中编码“何时该创造、何时该收敛”的信号，可以精细调控模型的创造力。

    一、数据层面控制创造性的四个杠杆

    [嵌入表格未展开]

    二、提升创造性的具体数据构造方法

    方法一：多参考回答训练

    对于开放式任务（如写故事、写诗、头脑风暴），在SFT数据中为同一条指令提供2-3条都正确但风格迥异的参考回答。这向模型传递了一个明确信号：这个任务没有唯一正确答案，创造性是被鼓励的。同时，通过loss mask机制，模型在训练时会看到多条合理路径，其输出分布会更平坦，保留了更多可能性。

    方法二：指令中嵌入“创造性级别”信号

    在训练数据的系统提示或指令中显式包含创造性要求：

    - “请发挥想象力，给出最具创意的回答”

    - “请提供多种不同角度的答案”

    - “请给出一个稳妥、标准的回答”

    模型通过大量此类数据，学会了将“创造性”作为一个可控的维度，在推理时可以通过系统提示来动态调整。

    方法三：“打破模板”的示范数据

    模型之所以缺乏创造性，往往是因为训练数据中的回答过于工整和模板化。刻意构造一些“反模板”的数据：使用非对称结构、意料之外的转折、独特的个人化表达，让模型看到“不按套路出牌”也能是高质量的。

    三、控制创造性——不是越高越好

    对于数学推理、事实问答、代码生成等任务，创造性意味着危险——那叫“幻觉”。因此数据中需要明确区分：

    - 高创造性任务：创意写作、头脑风暴、角色扮演、艺术描述

    - 中等创造性任务：日常对话、建议咨询、解释概念

    - 低创造性任务：事实问答、数学计算、代码生成、翻译、安全回复

    对于低创造性任务，数据中的回答应该是一致的、精确的、基于事实的，不同变体之间的差异仅限于措辞而非核心内容。这种“创造性梯度”的训练，让模型学会了因任务制宜。

    四、创造性与其他能力的平衡

    创造性不是孤立的能力。过度强调创造性可能损害准确性和安全性。数据中需要包含模型在需要创造时创造、在需要收敛时收敛的完整场景。例如，用户问“圆周率是多少”，模型绝不应发挥创造力；用户问“用圆周率写一首诗”，创造性就成为核心要求。

    五、评估创造性的指标

    - Self-BLEU：同一指令多次生成的回答之间的BLEU分数，越低说明多样性越高

    - 嵌入空间离散度：多次生成的回答在嵌入空间中的方差

    - 人工评判：是否令人感到新颖、有趣、不落俗套

    - 任务准确性：在需要精确性的任务上，创造性不应损害准确性

    ✅ 总结：通过SFT数据控制模型的创造性，核心在于在数据中编码“何时创造、何时收敛”的情境信号。多参考回答、任务类型的创造性期望、反模板示范和创造性级别信号，是数据层面调控创造性的四个关键杠杆。


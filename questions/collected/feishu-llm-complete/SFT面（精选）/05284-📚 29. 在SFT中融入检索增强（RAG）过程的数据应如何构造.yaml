    三、数据中必须体现的关键技能

    - 处理无关文档的鲁棒性：检索结果中经常包含无关文档。SFT数据中的回答应该能够忽略这些噪音，只聚焦于相关的文档。如果数据中所有文档都完美相关，模型会变得脆弱。

    - 信息综合与多文档引用：当答案分散在多个文档中时，回答应该综合所有信息。数据需要包含这种多文档引用的例子，并训练模型引用来源（如[1]）。

    - 面对检索失败的诚实：当检索结果无法回答问题时，SFT数据应教会模型诚实地表示：“根据我检索到的资料，无法回答您的问题。”这是避免幻觉的关键。

    四、训练时的损失计算

    只有助手生成的部分（搜索查询 和 基于结果的回答）计算损失。检索结果部分是被mask掉的。

    ✅ 总结：RAG的SFT数据构造关键在于模拟完整的“查询-检索-阅读-回答”流程，并且最好使用基于真实检索结果和专家编写的回答来构造，以教会模型处理真实世界的检索噪声和不确定性。


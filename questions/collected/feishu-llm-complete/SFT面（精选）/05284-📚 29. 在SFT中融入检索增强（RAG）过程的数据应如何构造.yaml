content:
  prompt: "\U0001F4DA 29. 在SFT中融入检索增强（RAG）过程的数据应如何构造？"
answer:
  mode: rubric
  reference_answer: |-
    RAG（检索增强生成）模型在推理时需要先检索外部知识，再基于检索结果生成回答。要让SFT模型学会这种“先查后答”的行为，SFT数据必须精确地模拟完整的RAG流程，包括检索动作、检索结果和基于结果的推理。

    一、核心数据结构：模拟检索循环

    标准的RAG SFT数据将对话扩展为三个角色的交互：用户、助手和检索器。流程如下：

    - 用户指令：用户提出需要外部知识的问题。

    - 助手生成搜索查询：模型不是直接回答，而是生成一个或多个[搜索]标记，包含结构化的搜索查询。

    ```text
    [搜索] {"query": "2024年诺贝尔物理学奖得主"}
    ```

    - 检索器返回结果：一个[检索结果]角色，将模拟的检索器返回的文档片段呈现出来。

    ```text
    [检索结果]
    [文档1] ...内容包含2024年诺贝尔物理学奖授予...
    [文档2] ...内容包含获奖者的主要贡献...
    ```

    - 助手基于结果生成最终回答：模型在接收到[检索结果]后，继续生成，将文档信息整合进自然语言回答中，并可能会引用来源。

    二、构造这种数据的两种主要策略

    - 策略一：基于真实用户行为的数据回收（后验构造）
    这是目前最先进的方法。我们部署一个在线RAG系统。记录下真实用户的问题，以及检索系统返回的结果文档集合。然后，不是使用模型在线生成的回答，而是由人类专家（或强模型）基于这些检索到的文档，写一个完美的回答。
    这样，我们就得到了高质量的SFT数据：（问题，检索到的文档，完美的回答）。用这个数据训练模型，它学会的是：如何从给定的、可能包含噪音的检索结果中，提炼出最准确的信息来生成回答。这比“模拟检索”更真实，因为检索结果中包含了真实世界的噪音和不完美。


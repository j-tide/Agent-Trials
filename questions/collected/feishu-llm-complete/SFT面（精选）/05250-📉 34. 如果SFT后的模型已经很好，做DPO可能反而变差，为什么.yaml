content:
  prompt: "\U0001F4C9 34. 如果SFT后的模型已经很好，做DPO可能反而变差，为什么？"
answer:
  mode: rubric
  reference_answer: |-
    这是一个实践中不时会遇到的反直觉现象：明明加了更多对齐训练，模型却退步了。主要原因包括偏好数据与SFT分布冲突、奖励信号误校准、以及灾难性遗忘的局部重现。

    一、偏好数据与SFT风格的冲突

    SFT模型已经形成了自己稳定、一致的“回答风格”。如果DPO使用的偏好数据中，“更好”的回答风格与SFT模型原本的风格差异过大，模型在尝试模仿新风格时，可能会破坏原有的流畅性和一致性。例如，SFT模型原本擅长简洁回答，而DPO数据中的人类标注者却偏好详细解释，模型就被迫在两个方向间拉扯，导致最终的回复既不简洁也不详尽，变得不伦不类。

    二、奖励信号（隐式）的偏差与捷径

    DPO通过对比对来优化。如果偏好数据存在系统偏差——例如，所有较长的回答都被标为偏好，无论内容是否真正更好——DPO模型会学会“生成更长回答”的捷径，而忽略回答的实际质量。这可能导致模型输出质量下降，因为它在追逐长度这一表面特征，而非真正的有用性。

    三、灾难性遗忘的局部重现

    虽然DPO的KL约束（通过参考模型）旨在防止遗忘，但当DPO训练强度过大或数据量过小，模型仍可能在特定领域遗忘SFT学到的能力。尤其是长尾知识、复杂推理和代码能力，这些能力在DPO数据中往往覆盖不足，DPO训练可能会“挤占”这些能力的参数空间，导致它们在DPO后变弱。

    四、SFT模型本身已接近偏好数据的“天花板”

    如果SFT模型的质量已经非常高，甚至超越了DPO数据中偏好回答的平均水平，那么DPO的训练信号就会非常弱，甚至混乱。因为模型生成的回答可能比数据中的“偏好回答”更好，但DPO还在强迫它去模仿一个更差的“偏好回答”。这会导致模型“降级”至数据水平，即所谓的 “退化”。

    五、优化过程中的分布坍缩

    DPO本质上也在缩小分布。如果偏好数据不够多样，模型可能坍缩到一种过于单一的模式，丧失了SFT阶段保留的多样性和创造力。比如，SFT模型会写不同风格的诗，但DPO后可能只会写一种最“安全”的诗。

    ✅ 总结：SFT后DPO可能变差，根本原因在于DPO数据与SFT分布的冲突、偏差信号的误导、以及过度优化导致的遗忘和坍缩。因此，DPO数据必须高质量、与SFT风格兼容、并配以适当的训练强度（如早停），才能稳定提升而不会倒退。


content:
  prompt: 26. 如何评估SFT后的“幻觉”程度？有具体的量化方法吗？
answer:
  mode: rubric
  reference_answer: |-
    评估SFT模型的“幻觉”程度，需要将“幻觉”拆解为可测量的具体类型，并采用自动检测、强模型评判和人工校验相结合的方法。没有单一魔法指标，而是一个多维度的评估体系。

    一、幻觉的分类与针对性评估

    [嵌入表格未展开]

    二、具体量化方法

    - FactCC等事实一致性指标：原本用于评估文本摘要的忠实度，可以迁移到评估SFT回答是否与给定的背景知识或用户陈述一致。它通过一个预训练的分类器来判断生成文本是否与原文存在事实冲突。

    - 基于NLI（自然语言推理）的方法：将回答中的每个事实三元组（主体，关系，客体）抽取出来，用NLI模型判断该陈述是否与可靠的知识源（如维基百科）蕴含或矛盾。矛盾的比例即为幻觉率。

    - GPT-as-Judge幻觉评分：给定用户指令和模型回答，让GPT-4判断回答中是否包含任何事实性错误或编造的信息。可以要求它逐句分析，并输出一个1-5分的“事实可靠性”Likert量表评分。这种方法灵活性高，可以捕捉到更细微的幻觉。

    - 校验集准确率：构建一个专门用于测试幻觉的数据集，其中包含大量模型容易产生幻觉的诱导性问题、虚假前提问题（如“为什么月球是由奶酪构成的？”）。统计模型在这些问题上的“拒绝回答率”或“正确纠正率”。如果模型顺从地解释了虚假前提，则视为幻觉。

    - 输出熵与校准度：对于封闭域的确定性问答，模型对正确答案的输出概率应该很高（低熵），对错误答案应该很低。如果模型用一个错误答案却输出了极高的概率，这是过度自信的幻觉。可以计算期望校准误差（ECE）：将预测概率分桶，比较每个桶内的平均置信度与真实准确率的差距。

    三、需要注意的陷阱

    - 自动化指标的局限性：FactCC和NLI模型本身可能存在误差，需要定期用人工评估进行校准。

    - 知识源的选择：使用维基百科等知识源时，要注意其时效性和覆盖面，可能会将模型的新知识误判为幻觉。

    - 幻觉的语境依赖性：在某些创意任务中，“编造”是被期望的。评估时需要严格区分任务类型。

    ✅ 总结：评估幻觉需要组合使用知识冲突检测、NLI、GPT评判和校准度指标，并且必须分类型、分任务进行评估。没有一劳永逸的幻觉指标，多方法交叉验证是黄金标准。


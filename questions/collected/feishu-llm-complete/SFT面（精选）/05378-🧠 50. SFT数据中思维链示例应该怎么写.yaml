    ✅ 总结：思维链示例的核心是“展示可复现的推理过程”——从问题重述、信息提取、分步推理、中间验证到结论总结，每一步都应是一个清晰的认知操作。高质量示例包含错误修正和多路径探索，步骤粒度适中且经过事实性验证。


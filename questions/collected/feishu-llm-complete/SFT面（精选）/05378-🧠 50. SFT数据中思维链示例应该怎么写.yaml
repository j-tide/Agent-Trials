    三、高质量思维链的写作原则

    原则一：步骤粒度适中

    步骤太粗，模型学不到细致的推理；步骤太细，模型学会的是啰嗦而非思考。一个合理的步骤应该是一个“独立的认知操作”——一次乘法、一次条件判断、一次概念引用。经验上，每个步骤通常对应1-3句话。

    原则二：显式标注步骤类型

    对于复杂推理，可以在数据中显式区分不同类型的步骤：

    【分析】这个问题涉及两个时间段的价格变化，需要分别计算。
    【计算】第一季度利润 = 200万 × (1-60%) = 80万。
    【比较】80万 vs 65万，所以第一季度利润更高。
    【结论】第一季度利润更高，高出15万。

    这种标注让模型学会区分“分析”和“计算”等不同的认知活动。

    原则三：展示错误和修正过程

    特别高价值的思维链示例包含自我纠错：

    等等，我犯了一个错误。成本率从60%升到65%，那么第二季度成本应该是200万×1.3×65%=169万，而不是130万。让我重新计算第二季度利润...

    这种数据教会模型推理中的元认知——监控自己的输出并修正。

    原则四：多路径展示

    同一问题，可以在数据中展示不同推理路径。例如一道几何题，既用解析法也用综合法解，让模型理解推理的多样性。


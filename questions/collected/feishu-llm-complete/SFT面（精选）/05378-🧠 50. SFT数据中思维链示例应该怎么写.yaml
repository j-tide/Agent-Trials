  reference_answer: |-
    思维链（Chain-of-Thought）示例是让模型学会“展示推理过程”的核心数据。写好思维链示例，不是简单地在答案前加一堆废话，而是要展示出清晰的推理逻辑、可验证的中间步骤、以及有效的自我监控。


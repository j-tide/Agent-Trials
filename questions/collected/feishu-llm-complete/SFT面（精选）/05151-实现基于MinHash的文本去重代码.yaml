  prompt: 实现基于MinHash的文本去重代码
answer:
  mode: rubric
  reference_answer: |-
    MinHash 可用于快速估计两个集合的 Jaccard 相似度，常用于海量文本的近似去重。

    ```python
    import re
    import hashlib
    from collections import defaultdict

    class MinHash:
        def __init__(self, num_perm: int = 128, seed: int = 42):
            self.num_perm = num_perm
            # 生成随机排列参数 (a, b) 用于模拟哈希函数 h(x) = (a*x + b) mod prime
            self.seed = seed
            self.prime = 2**61 - 1
            self.a = self._random_coeffs()
            self.b = self._random_coeffs()

        def _random_coeffs(self):
            import random
            random.seed(self.seed)
            return [random.randint(1, self.prime - 1) for _ in range(self.num_perm)]

        def _hash_func(self, x, i):
            return (self.a[i] * x + self.b[i]) % self.prime

        def compute_signature(self, tokens: set) -> list:
            # tokens 为字符串集合，将其哈希为整数
            token_hashes = [hash(t) & 0xffffffff for t in tokens]  # 转为 32位整数
            if not token_hashes:
                return [float('inf')] * self.num_perm
            signature = []
            for i in range(self.num_perm):
                min_val = min(self._hash_func(h, i) for h in token_hashes)
                signature.append(min_val)
            return signature

        @staticmethod
        def similarity(sig1: list, sig2: list) -> float:
            """估计 Jaccard 相似度"""
            return sum(x == y for x, y in zip(sig1, sig2)) / len(sig1)


    def deduplicate_texts(texts: list[str], threshold: float = 0.8, ngram_size: int = 3) -> list[str]:
        """基于 MinHash 去重，返回去重后的文本列表"""
        mh = MinHash(num_perm=128)
        signatures = []
        for text in texts:
            # 提取 n-gram 集合
            words = text.split()
            ngrams = set()
            for i in range(len(words) - ngram_size + 1):
                ngrams.add(' '.join(words[i:i+ngram_size]))
            signatures.append(mh.compute_signature(ngrams))

        keep = []
        for i, text in enumerate(texts):
            is_dup = False
            for j in keep:
                if mh.similarity(signatures[i], signatures[j]) >= threshold:
                    is_dup = True
                    break
            if not is_dup:
                keep.append(i)
        return [texts[i] for i in keep]
    ```

    说明：

    - 使用 n-gram 将文本转换为 token 集合，再计算 MinHash 签名。

    - 通过比较签名相似度（估计 Jaccard）来判断重复，避免了逐对文本的 O(n^2) 比较。


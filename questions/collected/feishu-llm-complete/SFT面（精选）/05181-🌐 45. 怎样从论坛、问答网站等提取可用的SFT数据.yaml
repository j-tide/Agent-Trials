content:
  prompt: "\U0001F310 45. 怎样从论坛、问答网站等提取可用的SFT数据？"
answer:
  mode: rubric
  reference_answer: |-
    从Stack Overflow、知乎、Quora、Reddit等论坛和问答网站提取SFT数据，是将互联网公开知识转化为模型训练信号的常见做法。但原始网页数据距离“可用的SFT数据”还有很长的路要走，需要经过精细的清洗、转化和质量控制。


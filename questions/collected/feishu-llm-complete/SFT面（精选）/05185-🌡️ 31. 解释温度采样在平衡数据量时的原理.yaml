    推荐αα取0.5-0.7，能在不过度牺牲高频任务训练信号的前提下，显著改善低频任务的可见度。

    三、温度采样相比其他方法的优势

    [嵌入表格未展开]

    四、温度采样的进阶用法：动态温度

    固定αα的局限在于：训练初期和后期对均衡的需求不同。动态温度策略在训练初期使用较高αα（接近1），让模型先充分学习高频通用任务；随着训练进行，逐渐降低αα，增加低频任务的曝光度。这种“先广后精”的策略更符合模型学习规律。

    ✅ 总结：温度采样通过引入一个温度参数αα，在保留原始数据分布和完全均衡之间实现平滑控制。它比简单上采样更保护数据多样性，比下采样更充分利用数据。动态温度策略进一步优化了训练不同阶段的均衡需求，是处理SFT数据不均衡的首选方案。


content:
  prompt: "\U0001F321️ 31. 解释“温度采样”在平衡数据量时的原理"
answer:
  mode: rubric
  reference_answer: |-
    温度采样是处理多任务数据不均衡的一种高效、可控的采样策略。它通过对各类任务的采样概率进行“温度”调节，在“保留原始分布”和“强制均衡”之间实现平滑过渡。

    一、温度采样的数学原理


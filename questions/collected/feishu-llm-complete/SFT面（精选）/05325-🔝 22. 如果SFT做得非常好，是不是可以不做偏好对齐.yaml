content:
  prompt: "\U0001F51D 22. 如果SFT做得非常好，是不是可以不做偏好对齐？"
answer:
  mode: rubric
  reference_answer: |-
    从实践角度看，一个“非常好”的SFT模型在很多场景下已经足够可用，但如果你追求的是顶级模型那种细腻的权衡、鲁棒的防御和持续的进化能力，单靠SFT仍然会触碰到天花板。

    一、SFT的固有局限无法靠“做得更好”完全突破

    SFT的优化目标是模仿给定数据中的行为。这意味着，无论数据多么庞大、多样，它都无法超越数据标注者的水平。它学到的永远是“历史最佳实践的统计平均”，而不是“潜在更优策略的主动探索”。具体表现包括：

    - 价值冲突的僵化处理：当“帮助性”和“安全性”冲突时，SFT只能重现数据中给出的那种折中方式，无法根据情境动态调整。

    - 无法学会“创造更好的回答”：SFT不能主动发现比训练数据中所有回答都更好的新策略。而RLHF的探索机制却可能找到“青出于蓝”的回答方式。

    - 安全防御的脆弱性：攻击者可以通过改变措辞绕过SFT的防御，因为SFT学的是“拒绝特定句子”，而非“拒绝危害意图”。偏好对齐通过大量对抗偏好数据，能学到更本质的安全原则。

    二、“非常好”的SFT往往需要偏好对齐才能做到

    在实际工程中，我们经常用RLHF/DPO的反馈来迭代优化SFT数据。一个所谓的“非常好的SFT模型”，其数据很可能已经融合了偏好对齐的思想（如通过人工排序筛选高质量回答，再反哺回SFT数据）。这本身就是一个隐式的偏好对齐过程。真正的纯SFT，很难达到工业级产品的要求。

    三、何时可以不做偏好对齐

    如果任务场景相对封闭、用户行为可控、对安全性和创造力的要求不那么极致，一个精心构造的SFT模型完全可以胜任。例如，一个仅用于内部代码辅助的工具，或一个特定格式的数据提取器。

    ✅ 总结：SFT可以逼近一个很高的基准，但受限于模仿学习的本质，无法突破数据上限、无法进行动态价值权衡、无法实现主动的策略创新。这些正是偏好对齐的领地。对于最前沿的通用助手，偏好对齐仍然是必需品。


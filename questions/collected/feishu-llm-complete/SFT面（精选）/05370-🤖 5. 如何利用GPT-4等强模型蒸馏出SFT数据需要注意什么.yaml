content:
  prompt: "\U0001F916 5. 如何利用GPT-4等强模型蒸馏出SFT数据？需要注意什么？"
answer:
  mode: rubric
  reference_answer: |-
    利用GPT-4、Claude等强模型蒸馏SFT数据，是当前最主流的低成本数据获取方式。其核心思路是：将人工标注的昂贵任务，转化为设计精巧的prompt让强模型来完成。但“蒸馏”并非简单的“问一句答一句”，而是一套需要精心设计的系统工程。

    一、蒸馏的基本流程

    第一步：确定数据规格。在开始蒸馏前，必须明确需要什么样格式的数据——包括对话模板、角色定义、回复风格、安全边界、以及需要覆盖的能力维度。没有清晰的数据设计文档，后续蒸馏将无的放矢。

    第二步：设计多层次的蒸馏Prompt。针对不同类型的数据，需要设计不同的system prompt和user prompt：

    - 基础对话数据：system prompt设定助手角色，user prompt给出多样化的用户指令。

    - 思维链推理数据：prompt中明确要求“请展示你的逐步思考过程”。

    - 安全拒绝数据：user prompt设置为危险请求，system prompt设定安全边界。

    - 多轮对话数据：通过多轮交互，让强模型生成完整的对话历史。

    - 角色扮演数据：system prompt详细描述角色特征，user prompt模拟该角色会遇到的典型问题。

    第三步：批量生成。使用API或本地部署大规模调用强模型。需设计合理的并发策略、重试机制和异常处理，确保生成过程稳定高效。

    第四步：质量审核与过滤。自动生成的数据必然有噪声。需要经过多层过滤：

    - 格式正确性检查（JSON解析、角色标记验证）

    - 内容质量评估（用另一个强模型打分，或人工抽检）

    - 安全合规审查（确认无有害内容、无幻觉事实）

    - 多样性检验（去重、聚类分析覆盖度）

    第五步：数据后处理与增强。对通过审核的数据进行模板统一、token化处理，并根据需要混入少量人工标注的黄金样本。


    三、从“被动蒸馏”到“主动引导”

    简单的“输入指令→获取回答”是被动蒸馏，数据多样性受限于指令的多样性。更先进的做法是主动蒸馏：先设计复杂的对话场景、角色设定和约束条件，再让强模型在这些设定下“即兴发挥”。例如，设定一个“暴躁但善良的意大利厨师”角色，要求它用浓厚口音回答烹饪问题，同时拒绝透露祖传秘方。这种主动引导产生的数据，远比被动回答更加生动和多样。

    ✅ 总结：利用强模型蒸馏SFT数据是当前最高效的路径，但必须警惕偏见传递、同质化和幻觉污染。成功的关键在于：精心设计的蒸馏prompt、多层次的质量过滤、混合多源数据防止偏差，以及对合规和成本的精细管控。


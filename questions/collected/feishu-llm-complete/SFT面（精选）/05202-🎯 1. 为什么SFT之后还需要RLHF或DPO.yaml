content:
  prompt: "\U0001F3AF 1. 为什么SFT之后还需要RLHF或DPO？"
answer:
  mode: rubric
  reference_answer: "SFT（监督微调）是让大语言模型从“文本补全器”转变为“指令遵循助手”的关键一步，但它远非终点。SFT后的模型就像一个被严格训练却缺乏实践智慧的学徒——它能精准地模仿训练数据中的回答模式，却无法理解这些回答背后微妙的、有时相互冲突的人类价值观。RLHF（基于人类反馈的强化学习）和DPO（直接偏好优化）的介入，正是为了解决SFT难以覆盖的三个深层鸿沟。\n\n\U0001F4CC
    鸿沟一：从“正确回答”到“最优回答”的跃迁\n\nSFT的训练目标是最大化训练数据中标准回答的似然概率。这意味着它假设每一条指令只有一个“标准答案”。然而，人类语言是高度灵活的，同一条指令可以有无数种合理且有用的回应方式。SFT模型学会了其中一种（或几种），但它的概率分布被压缩到了训练样本的狭窄区域。RLHF/DPO通过人类偏好数据（比较两个回答哪个更好）而不是单一标准答案，允许模型在更广阔的生成空间中进行探索，学习到“哪种回答风格更受人类青睐”，而不仅仅是“哪种回答曾在数据中出现过”。这使模型能够生成既正确又符合人类偏好的回答，而不只是机械复制训练集。\n\n\U0001F4CC
    鸿沟二：价值冲突中的动态权衡\n\n现实中的对话往往充满价值冲突：用户要求“用一句话详细解释量子力学”，这本身就包含着简洁性与完整性的矛盾；用户说“他这人真讨厌，帮我写封邮件骂他”，有用性与安全性直接碰撞。SFT数据中只能给出一种硬编码的处理方式（要么详细解释，要么简短回应；要么顺从骂人，要么拒绝），无法教给模型在具体情境下如何动态权衡。RLHF通过奖励模型将复杂的价值判断（有用性、安全性、礼貌性等）编码为一个标量信号，让模型在强化学习的探索过程中自行发现最优的权衡策略。DPO则通过偏好数据直接优化模型，使其隐式地学会这种权衡。模型可以学会：有时礼貌地拒绝比盲目顺从更受偏好；有时简洁直接的回答比长篇大论更有帮助。\n\n\U0001F4CC
    鸿沟三：暴露偏差与自我纠错能力\n\nSFT采用教师强制（teacher forcing），训练时模型每步都看到真实的正确token，从未经历过自己生成的错误上下文。一旦推理时出现微小偏差，模型就会在错误路径上越走越远。RLHF允许模型在自己的生成样本上进行探索，奖励模型对最终输出评分，这使模型有机会在“自己的错误”中学习恢复。DPO虽然没有显式探索，但其偏好对比数据让模型看到了“好回答”与“差回答”（可能由SFT模型自身生成）的区别，从而隐式地学会规避那些会导致差回答的生成路径。因此，SFT后的对齐阶段赋予了模型宝贵的自我纠错和边界感知能力。\n\n\U0001F4CC
    鸿沟四：安全与诚实的深度内化\n\nSFT的安全边界仅仅来自训练数据中的拒绝样本。攻击者只需改变措辞或使用越狱提示，就能轻易绕过这些硬编码的防线。RLHF/DPO通过对大量安全和不安全回复的人类偏好反馈，让模型从“记住某些句子应该拒绝”上升为“理解哪些行为原则是不可逾越的”。这种内化的价值判断更难被简单提示工程攻破。同时，SFT模型因过度模仿数据中的确定语气，容易产生高置信度的幻觉。偏好优化可以通过奖励（或偏好）诚实表达不确定性的回答，使模型在知识边界处学会说“我不知道”。\n\n✅
    总结：SFT教会模型“怎么说”，RLHF/DPO教会模型“什么值得说”。没有后者，模型只是一个高效但机械的模仿者，缺乏价值判断、动态权衡和鲁棒的安全边界。它们是打造真正智能助手的必要互补阶段。\n\n---"

    二、比例设定的参考策略

    [嵌入表格未展开]

    三、一个系统的比例确定流程

    - 基座模型语言能力摸底：用多语言基准（如MGSM、XQuAD等）测试基座模型在每种目标语言上的现有能力，找出薄弱语言。

    - 确定最低可用标准：为每种语言设定一个最低可接受的指令遵循能力指标（如翻译准确率、问答F1）。低于该标准的语言需要加大数据配比。

    - 计算“有效训练信号”而非样本数：不同语言的单条样本训练价值不同。对于模型基础已经很好的语言，新增数据的边际贡献低；对于基础弱的语言，同样的数据量带来的提升更大。因此不能简单按样本数均分。

    - 分阶段训练策略：

    - 迭代调整：每个阶段结束后，评估各语言能力的变化，调整下一阶段的比例。

    四、低资源语言的特别处理

    对于数据极其稀缺的语言，不能无限提高比例（因为根本无数据可提），需要依赖：

    - 跨语言迁移数据：构造同一任务的多语言平行版本，让模型在英文和低资源语言之间建立任务映射

    - 回译增强：将英文SFT数据翻译为低资源语言，经过质量审核后使用

    - 多语言嵌入对齐：利用多语言嵌入模型确保语义等价性

    五、需要避免的陷阱

    - “平均主义”陷阱：简单地将每种语言分配相同比例，导致高资源语言训练不足、低资源语言数据不够（因为总量少而重复过拟合）

    - “英文中心”过度：英文占比过高（>90%），导致其他语言只是“表面翻译”英文能力，缺乏母语自然感

    - 安全标准的语言差异：不同语言的文化安全边界不同，配比中需要考虑各语言特有的安全训练数据

    ✅ 总结：多语言SFT数据比例的确定，需要基座模型摸底→设定最低标准→计算有效信号→分阶段训练→迭代调整。它不是简单的数字分配，而是基于跨语言迁移规律和用户需求的动态策略。


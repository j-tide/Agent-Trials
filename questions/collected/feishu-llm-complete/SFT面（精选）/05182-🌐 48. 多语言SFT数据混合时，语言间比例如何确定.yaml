content:
  prompt: "\U0001F310 48. 多语言SFT数据混合时，语言间比例如何确定？"
answer:
  mode: rubric
  reference_answer: |-
    多语言SFT的目标是让模型在多种语言上都能遵循指令，而不是把所有语言都“平均化”成一种混合语。比例的确定需要从预训练语言分布、目标用户分布、语言资源可用量、以及跨语言迁移效率四个维度综合权衡。


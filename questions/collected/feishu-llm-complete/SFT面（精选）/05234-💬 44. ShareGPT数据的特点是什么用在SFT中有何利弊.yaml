content:
  prompt: "\U0001F4AC 44. ShareGPT数据的特点是什么？用在SFT中有何利弊？"
answer:
  mode: rubric
  reference_answer: |-
    ShareGPT是一个用户自发分享与ChatGPT对话的网站。这些真实的、多轮的人机对话成为了SFT数据的重要来源之一，因其高度自然的交互模式而被广泛使用。但它的非受控来源也带来了特殊的风险。

    一、ShareGPT数据的特点

    [嵌入表格未展开]

    二、用于SFT的显著优势

    - 真实对话分布：ShareGPT数据最接近“用户在实际使用中会怎样与AI互动”的真实分布。任何人工构造或模型合成的数据都无法完全模拟这种自然度。

    - 丰富的多轮交互模式：包含用户在对话中纠错、追问细节、要求换一种方式解释等行为，这是人工构造多轮数据难以穷举的。

    - 低成本的多样性：社区用户来自各行各业、各个语言背景，自然而然地提供了极大的任务多样性和语言多样性，无需特意设计。

    - 捕捉模型原有缺陷：ShareGPT中可能包含ChatGPT回复不够理想、被用户纠正的案例，这些“不完美”回复及其修正过程对SFT来说是宝贵的纠错信号。

    三、用于SFT的严重风险

    [嵌入表格未展开]

    四、ShareGPT数据的安全使用方式

    如果要将ShareGPT数据用于SFT，必须经过严格的“净化”流程：

    - PII脱敏：自动检测并移除邮箱、电话、姓名、地址等个人身份信息

    - 安全过滤：使用安全分类器移除包含有害内容的对话

    - 质量筛选：用困惑度、长度、角色完整性等规则滤除低质量样本

    - 数据去污染：确保ShareGPT数据不包含评测基准的题目

    - 来源混搭：不单独使用ShareGPT数据，而是与人工标注数据、强模型蒸馏数据混合，降低单一来源的偏差

    - 用户合规：在法律层面确保使用的合规性，尊重用户的知情权和选择权

    ✅ 总结：ShareGPT数据提供了极高质量的自然对话模式和多样性，但伴随着质量、隐私、安全和版权等多重风险。它最适合作为SFT数据多样性的补充来源，而非主力数据。严格的净化和混搭策略是安全使用的前提。


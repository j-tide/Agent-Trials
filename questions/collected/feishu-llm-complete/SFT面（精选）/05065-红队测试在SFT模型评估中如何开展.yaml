content:
  prompt: 30. 红队测试在SFT模型评估中如何开展？
answer:
  mode: rubric
  reference_answer: |-
    红队测试是一种模拟恶意攻击者思维的安全评估方法，通过创造性、对抗性地探索模型的潜在漏洞，发现常规静态测试无法覆盖的安全风险。在SFT模型中，开展红队测试需要系统化的流程。

    一、红队团队的构建与目标设定

    红队应由具备多样性背景的人员组成，包括安全专家、领域专家、甚至非技术用户，以覆盖不同视角。测试开始前，必须明确测试范围（如针对暴力、色情、偏见等）、目标（发现漏洞、评估鲁棒性、测试过度拒绝）和规则（禁止测试真实高危行为、保护测试者）。

    二、攻击策略的规划

    红队采用多元化的攻击技术，包括但不限于：

    - 越狱提示：如DAN (Do Anything Now)、奶奶漏洞、角色扮演等，试图解除模型的安全限制。

    - 指令注入：在看似正常的输入中植入隐藏指令，试图覆盖模型的原生安全规则。

    - 多轮对话诱导：通过多轮看似无害的对话，逐步引导模型跨越安全红线。

    - 编码与语言变形：使用Base64、摩斯密码、稀有语言或大量拼写错误来表达恶意意图，测试模型对变形输入的鲁棒性。

    - 上下文操纵：构建复杂的假设或虚构场景，迫使模型在“遵守故事设定”和“遵循安全准则”之间做出选择。

    三、测试执行与记录

    红队成员进行人机交互测试，实时记录所有交互。每条记录应包含：攻击策略、完整prompt、模型原始输出、攻击是否成功、成功/失败的原因分析。应使用标准化的记录模板。

    四、漏洞分析与优先级排序

    测试结束后，红队与安全团队一起分析所有漏洞。将漏洞按严重程度（高危/中危/低危）和可利用性（容易/困难）进行分类。高优先级漏洞（如很容易绕过的危险内容生成）应立即修复。

    五、数据转化为训练信号

    红队测试的最终目的是改进模型。所有成功的攻击案例都可以被转化为SFT训练数据或DPO偏好数据：

    - 将成功的攻击prompt与正确的拒绝回答配对，加入SFT数据中，教会模型在面对此类攻击时正确响应。

    - 将成功的攻击prompt的回答与“好”的回答（如安全拒绝）构成偏好对，用于DPO训练，让模型学习“在这种攻击下，安全的回应是更好的”。

    六、迭代与闭环

    红队测试不是一次性的，而是一个迭代闭环。修复漏洞后，再次进行红队测试，验证修复效果，并发现新的攻击策略。模型的每次更新都可能引入新的脆弱点。

    ✅ 总结：红队测试是由多元攻击者进行的创造性安全探索，通过系统规划、执行、记录和转化，将发现的漏洞“喂”给模型进行迭代学习，是持续提升SFT模型安全性的关键手段。


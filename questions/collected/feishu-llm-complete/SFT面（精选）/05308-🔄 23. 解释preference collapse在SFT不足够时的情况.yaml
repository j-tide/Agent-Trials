content:
  prompt: "\U0001F504 23. 解释“preference collapse”在SFT不足够时的情况。"
answer:
  mode: rubric
  reference_answer: |-
    偏好坍缩（Preference Collapse） 是指模型在偏好对齐过程中，由于SFT初始模型提供的“合理行为”基底不够坚实或过于偏狭，导致模型在优化偏好时过度集中于某个单一的、狭窄的行为模式，从而丧失了作为通用助手的多样性和灵活性。它就像在一片过于狭小的地基上盖楼，无论上层建筑如何精妙，最终也只能建成一座细细的塔，而无法扩展为宏伟的宫殿。

    一、SFT不足的具体表现

    - 多样性基底不足：SFT数据只覆盖了极少几种回答风格（例如，全是“分点作答”的教科书式回复），没有包含简洁、幽默、创意等风格。模型学到的“好回答”的初始空间就非常狭窄。

    - 安全边界过激：SFT数据中过度拒绝的样本太多，导致模型对大量正常请求也倾向于拒绝。

    - 知识覆盖面缺失：SFT在某些领域的数据缺失，导致模型在这些领域的输出分布本身就是崩塌的。

    二、偏好坍缩的发生过程

    当这样一个有缺陷的SFT模型进入RLHF或DPO阶段时：

    - 奖励模型的偏差被放大：如果奖励模型恰好也偏好“分点作答”（因为标注者觉得这样清晰），那么PPO会沿着这个方向努力优化，进一步推高这种风格的生成概率。

    - 探索空间的塌陷：由于初始SFT分布中其他风格的概率已经极低，RLHF在探索时很难到达那些区域，因为KL惩罚会将其拉回SFT分布的中心。模型只能在已有的“分点作答”这座高峰上不断爬升，周围的其他可能性都变成了深谷。

    - 最终效果：模型变成了一个极端的“分点作答机器”，即使面对“讲个笑话”这样的指令，也可能回复：“关于讲笑话，有以下几点：第一，笑话需要...第二，常见结构...”。它已经丧失了生成笑话的能力，因为这种生成模式在其SFT基底和RLHF优化路径中被完全抹杀了。

    三、与“过度拒绝”的关系

    偏好坍缩是“过度拒绝”的深层原因之一。如果SFT没有教会模型在“拒绝”和“顺从”之间有丰富的灰度处理能力，那么RLHF可能会发现，在所有灰色地带直接“拒绝”总能获得安全的奖励，而探索“有技巧地回应”风险太大。于是模型就坍缩到“全部拒绝”的策略上。

    ✅ 总结：当SFT提供的初始分布过于狭窄时，RLHF/DPO的偏好优化会在这个狭窄空间内进行“钻牛角尖”式的优化，导致模型行为坍缩为单一模式，丧失作为通用助手的灵活性。这凸显了SFT阶段建立丰富、平衡、多维度的行为基底的重要性。


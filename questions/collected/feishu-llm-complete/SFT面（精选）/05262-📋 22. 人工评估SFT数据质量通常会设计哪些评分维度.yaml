content:
  prompt: "\U0001F4CB 22. 人工评估SFT数据质量通常会设计哪些评分维度？"
answer:
  mode: rubric
  reference_answer: |-
    人工评估是SFT数据质量的最终仲裁者。自动化指标虽然高效，但无法替代人类对语言细微之处的判断。一套科学的人工评估体系需要从多个维度对数据质量进行精细打分，确保评估结果的一致性和可操作性。

    一、核心评估维度表

    [嵌入表格未展开]

    二、各维度的详细说明

    指令清晰度：这是对SFT数据质量的上游把关。如果指令本身模糊不清、自相矛盾或缺少关键信息，那么无论回复多么精美，这条数据都是不合格的——因为它教会模型去“猜测”用户意图，而非“理解”用户意图。一个常见的bad case是指令说“帮我写一份报告”，但没有说明报告的主题、长度、受众等关键信息，而回复却直接生成了一份具体的报告。这教会模型在信息不足时盲目生成，而非主动要求澄清。

    回复准确性与完整性：准确性是底线，完整性是高线。一条回复可能准确但不够完整——例如指令要求“列举三个原因并分别举例”，回复只列举了三个原因却没有举例。这种数据会教会模型“部分执行指令是可接受的”。在评分时，准确性和完整性应分开打分，因为它们反映的是不同的质量问题。

    有帮助性：这是衡量回复“聪明程度”的指标。两条回复可能都准确且完整，但一条像教科书一样冰冷地罗列事实，另一条则根据用户的场景提供了针对性的建议和实用的后续步骤。有帮助性更高的回复展示了模型的推理能力和用户意识。

    安全性合规：评估时需要特别注意边界案例。一条数据中如果用户提出了带有诱导性的危险请求，而助手给出了模棱两可的回应（既不明确拒绝，也不完全顺从），这种“灰色地带”的数据对安全对齐是极其有害的。评分时需明确判定：要么拒绝并给出理由，要么给出安全的替代信息，不可暧昧。

    三、评分一致性的保障机制

    人工评估最大的挑战是评估者间一致性。不同评估者对同一维度的理解可能不同，导致评分差异巨大。保障一致性的方法包括：

    - 设计详细的评分指南：每个维度、每个分数段都有明确的、带示例的定义。例如，4分和5分的“有帮助性”区别是什么？指南中需给出具体case。

    - 进行校准训练：所有评估者在正式评分前，先对一批公共样本独立评分，然后集体讨论差异，统一标准。

    - 双盲评估+仲裁：每条数据至少由两人独立评分，差异过大的交由第三人仲裁。

    - 定期监控一致性指标：计算Cohen's Kappa或Krippendorff's Alpha，低于阈值（如0.7）时暂停评估，重新校准。

    四、评分的汇总与使用

    不同维度的评分通常不会简单平均，而是根据项目的实际需求加权。对于安全敏感的SFT项目，安全性维度的权重应大幅提高；对于代码辅助场景，准确性和格式规范的权重应更高。此外，评分结果不仅用于筛选数据，更是反馈给数据标注和构造团队的重要信号——如果某个维度长期得分偏低，说明数据构造流程在该维度存在系统性问题，需要针对性改进。

    ✅ 总结：人工评估SFT数据质量需要设计涵盖清晰度、准确性、完整性、有帮助性、安全性和格式规范的评分体系，并通过详细的评分指南、校准训练和双盲机制确保评估一致性。评估结果既是筛选依据，也是数据构造流程持续改进的指南针。


content:
  prompt: 12. 人工评估SFT模型时，通常设计哪些维度？
answer:
  mode: rubric
  reference_answer: |-
    人工评估是SFT模型评测的黄金标准。设计评估维度时，我们不是凭感觉打分，而是将“好”这个模糊概念拆解成一组可定义、可操作、可培训的精细维度。我通常使用的核心维度框架如下：

    [嵌入表格未展开]

    具体操作时需要注意：

    - 按需组合：不是所有任务都需要所有维度。事实性问答中，“准确性”权重极高；创意写作中，“流畅度”、“有用性”、“适当性”则更重要。

    - 明确量表：每个维度配以Likert量表（如1-5分），并对每个分数档给出具体的行为描述。例如，准确性5分=“回答中所有事实均正确且无遗漏”，3分=“主要事实正确但存在次要细节错误”，1分=“核心事实错误或完全编造”。

    - 独立打分：要求评估者对每个维度独立打分，避免一个维度的高分产生晕轮效应，污染其他维度的评判。

    - 校准与信度：多人评估前，必须进行校准会议，通过试评和讨论统一标准。定期计算评估者间信度，确保评估质量稳定。


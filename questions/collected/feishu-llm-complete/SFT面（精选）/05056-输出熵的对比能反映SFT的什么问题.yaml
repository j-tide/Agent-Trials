content:
  prompt: 22. 输出熵的对比能反映SFT的什么问题？
answer:
  mode: rubric
  reference_answer: |-
    输出熵是信息论中的一个概念，用于衡量模型输出概率分布的不确定性。在SFT语境下，对比SFT前后模型在同一批测试数据上的输出熵，可以揭示模型行为的深刻变化。

    熵的定义与计算

    [图片内容未导入]

    反映的问题

    - 行为模式的“僵化”与“坍缩”
    SFT后，如果模型在大量通用指令上的平均输出熵显著且全面地降低，这是分布坍缩和创造力丧失的强烈信号。模型变成了一个“一招鲜”的机器，对任何输入都倾向于输出SFT数据中高频出现的那几种回答模式。它失去了预训练模型那种在广阔可能性中自由驰骋的能力。

    - 特定任务上的“校准度”
    在事实性问答上，我们希望模型对正确答案的熵低（非常确定），对错误答案的熵高（或直接表达不确定）。SFT后，如果模型在回答它其实不知道的问题时，输出熵反而很低（非常确定地给出了一个幻觉答案），这说明SFT教会了模型“自信地胡说”，是危险的错误校准。

    - 安全对齐的“过度”
    如果SFT模型在面对各种无害的请求时，其生成第一个token的熵极低（几乎是确定性地选择“抱歉，我不能……”之类的拒绝模板），这直接暴露了模型存在严重的过度拒绝问题，其行为分布被不合理地压缩了。

    - 思维链与推理的“深度”
    对于需要多步推理的问题，模型在生成推理步骤时的熵变化可以反映其推理是“真思考”还是“背模板”。真正的推理过程往往伴随着在关键逻辑节点上的高熵（探索多种可能性），而机械模仿的推理链熵则一直很低（沿着固定套路走）。

    如何使用：计算整个测试集上模型逐token的平均熵，并画出熵随生成序列位置变化的曲线。将SFT前和SFT后的曲线进行对比，可以直观地看到SFT对模型“确定性”的影响程度。


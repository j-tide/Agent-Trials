content:
  prompt: "⭐ 36. 如何判断一条SFT数据是否“高质量”？"
answer:
  mode: rubric
  reference_answer: |-
    判断一条SFT数据是否“高质量”，不能仅凭主观感觉，而需要一套可操作、可量化的多维评估标准。高质量数据是SFT成功的基石，每一批数据入库前都应经过严格的“数据质量审查”。

    一、高质量SFT数据的六维评估模型

    [嵌入表格未展开]

    二、逐维度深度解读

    指令清晰度：一条高质量数据的指令应该像一份好的产品需求文档——实施者（模型）不需要猜测意图。例如，“帮我写一份报告”是低质量指令，而“请以公司市场总监的身份，写一份2000字的年度市场分析报告，包含市场趋势、竞争对手分析和下年度建议三部分，用Markdown格式”是高质量指令。训练数据中的指令质量直接决定模型在信息不足时是主动澄清还是盲目生成。

    回复准确性：这是质量的底线。一条数据如果回复存在事实性错误，不仅自身是废品，还会污染模型的知识体系。对于有争议的话题，高质量数据会呈现多元视角并标注不确定性，而非给出武断的结论。

    回复完整性：指令中的每个要求都应被回复覆盖。检查完整性时，需要逐条对照指令中的约束条件（数量、格式、内容要点等），确认无遗漏。多约束指令是完整性的重点考核对象。

    语言流畅度：高质量数据读起来应该像母语者自然写出的文字，而不是机器翻译或模板填充的产物。流畅度的评估通常需要人工判断，或使用强语言模型辅助评分。

    安全合规性：高质量的安全数据处理不是简单的“拒绝”，而是“有原则、有温度、有建设性”的回应。评估时需考察：拒绝是否明确但不生硬？是否说明了拒绝原因？是否提供了安全的替代建议？

    格式规范性：如果指令要求JSON输出，那么回复中的JSON必须是可解析的、键名正确的、值类型匹配的。格式错误的数据会教会模型“格式要求只是建议”，破坏其在正式场景下的可用性。

    三、高质量数据的“不冗余”特征

    除了上述六维，高质量数据还有一个隐含特征：不冗余。如果一条数据表达的任务和回复模式在数据集中已有大量高度相似的样本，那么这条数据的边际贡献就很低。高质量意味着“带来新的信息增量”——或者覆盖了新的任务类型，或者为已有类型提供了新的表达方式或解题路径。

    四、数据的“可学习性”判断

    高质量数据还应该是“可学习的”——即模型能够从这条数据中提取出可泛化的模式，而不是被迫记忆一个孤立的特例。例如，一条包含极其罕见的领域术语但没有任何上下文解释的数据，对模型来说学习价值有限。好的数据会在回复中自然地融入对术语的解释，让模型既学会了术语，又学会了如何在上下文中解释术语。

    ✅ 总结：判断SFT数据是否高质量，需从指令清晰度、回复准确性、完整性、流畅度、安全性和格式规范性六个维度综合评分，并考察其信息增量价值和可学习性。高质量数据不是“看着不错”，而是“训练后有效”。


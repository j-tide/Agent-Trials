content:
  prompt: "\U0001F916 24. 什么是“agentic SFT”？需要包含哪些元素？"
answer:
  mode: rubric
  reference_answer: |-
    Agentic SFT是指为了构建能够自主规划、使用工具、与环境交互并完成长期复杂任务的AI Agent，而专门设计的监督微调数据和方法。它超越了简单的“指令-回答”模式，将SFT模型从一个被动的“问答机”，升级为一个主动的“行动者”。

    这种SFT的核心在于，它不仅要教会模型知识，更要教会模型一系列行动技能和决策框架。一个完整的Agentic SFT样本就像一个微型的“任务执行剧本”，其中包含了完成一项任务所需的完整思维和行动链条。

    Agentic SFT必须包含的关键元素

    - 一、任务分解与规划 (Planning)
    模型接收到一个复杂的高级目标（如“帮我策划一个生日派对”）时，不能直接输出最终方案。它必须首先学会将大任务分解为一系列可执行的小步骤。

    - 二、工具定义与使用 (Tool Use)
    模型必须知道在哪些步骤需要调用外部工具，以及如何精确地调用它们。

    - 三、循环交互 (ReAct Loop)
    Agent的行为模式通常是一个“思考-行动-观察”的循环（ReAct）。模型不是一次规划完所有步骤然后盲目执行，而是在每一步工具调用后，根据结果动态调整下一步计划。

    - 四、记忆与状态管理 (Memory & State)
    Agent需要在长时间的任务执行过程中，记住已完成的事项、中间获得的关键信息以及用户的原始要求。

    - 五、反思与错误恢复 (Reflection & Error Recovery)
    这是让Agent从“能运行”到“可靠”的关键。模型需要学会在执行出现偏差时，自我检查并纠正。

    - 六、最终交付与自我评估 (Final Delivery & Self-Evaluation)
    任务完成后，模型不仅要给出最终答案，还应评估自己的成果是否符合用户的初始要求。

    ✅ 总结：Agentic SFT是教会模型“如何做事”的SFT，它必须包含任务规划、工具调用、循环交互、状态管理、错误恢复和自我评估等核心元素。这类数据的构造远比简单问答复杂，它本质上是在为模型编写“执行复杂任务的程序性记忆”。


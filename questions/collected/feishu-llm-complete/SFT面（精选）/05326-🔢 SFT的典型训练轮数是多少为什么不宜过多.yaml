content:
  prompt: "\U0001F522 SFT的典型训练轮数是多少？为什么不宜过多？"
answer:
  mode: rubric
  reference_answer: |-
    SFT的典型训练轮数通常在 1 到 5 个 epoch 之间，最常见的是 1 到 3 个 epoch。 很多人惊讶于这个数字如此之小，但这背后有深刻的防止过拟合和灾难性遗忘的考量。

    为什么这么少？

    - 数据的高信息密度：SFT数据是精心构造的，每一条都携带了明确的指令跟随信号。模型在预训练阶段见过的绝大多数数据都是无结构或弱结构的，SFT数据对模型来说是高度“新鲜”和“有说服力”的。模型很快就会调整自己的参数以适应这些新信号。

    - 起点已很高：预训练模型本身已经具备了极强的语言理解和生成能力。SFT更像是一种“激活”和“校准”，而非从头学习。它需要做的事是在巨大的参数空间中找到一个合适的“局部区域”，让输出符合指令格式。这个区域很容易到达，不需要反复遍历数据。

    过多训练轮数的恶果：

    - 灾难性遗忘（Catastrophic Forgetting）
    这是最核心的问题。如果在SFT数据上训练过多轮，模型会过度适应这些有限的对话数据，逐渐“遗忘”预训练阶段积累的广博知识和复杂推理能力。模型会变成一个“SFT数据集的复读机”，虽然回答格式完全正确，但内容空洞、知识陈旧、缺乏常识。它被“锁定”在了SFT数据构成的狭小世界里。

    - 严重过拟合（Overfitting）
    过拟合的典型表现是：模型开始逐字记忆SFT训练集中的问答对，而不是学习指令到回答的一般映射规律。当你问它一个训练集中出现过的问题时，它可能原封不动地背出答案；但当你换一种问法，或者问一个稍有不同但同领域的问题时，它就完全无法应对。模型失去了泛化能力。

    - 语言风格僵化
    SFT数据通常有统一的风格（比如助手总是彬彬有礼、回复结构清晰）。训练过多轮会导致模型的输出风格过度趋同于训练数据，失去了语言的自然多样性和灵活性。它的回答会显得“模板化”，缺乏创造力和适应性。

    - 输出多样性丧失
    这是过拟合的另一面。模型学会了“最安全”的回答路径，但对于开放式问题，它无法产生多样化的、有趣味性的回复，总是倾向于保守的、套路化的答案。

    实践中如何决定轮数：

    - 使用验证集困惑度来监控。当验证集上的损失开始上升（过拟合开始），就应该停止训练。

    - 使用人工评估或强模型评估来检查灾难性遗忘的迹象（例如，通用知识问答的能力是否下降）。

    - 小学习率 + 早停法是标配，在观察到验证指标恶化时立即停止。

    总之，SFT讲究“恰到好处”的微调。多一分则僵化，少一分则不足。找到那个精确的平衡点，是SFT训练的核心艺术。


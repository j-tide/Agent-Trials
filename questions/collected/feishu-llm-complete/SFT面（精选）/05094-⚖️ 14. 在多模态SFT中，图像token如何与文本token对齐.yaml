content:
  prompt: "⚖️ 14. 在多模态SFT中，图像token如何与文本token对齐？"
answer:
  mode: rubric
  reference_answer: |-
    将连续的视觉信号转化为离散的、语言模型能理解的“图像token”，并与文本token在嵌入空间对齐，是多模态SFT成功的技术基石。这个过程并非简单的拼接，而是在词嵌入空间和注意力机制中进行深度融合。

    一、图像到Token的转换：视觉Tokenizer

    第一步是将图像转换为一系列视觉特征向量，这些向量可以被视为“图像token”。

    - 视觉编码器：通常使用一个预训练的Vision Transformer（ViT），如CLIP ViT-L。图像被分割成固定大小的patch（如14x14像素），每个patch通过线性投影和ViT处理后，输出一个特征向量。

    - 图像Token序列：一幅图像最后被表示为 N 个特征向量（N 通常为256或576等，取决于图像大小和patch大小）。这些向量就是图像token的初始表示。

    二、特征空间投影：跨模态对齐的核心

    这些视觉特征向量虽然富含语义，但与语言模型的词嵌入空间是异构的——它们住在不同的“星球”上。直接输入会导致语言模型“听不懂”。

    - 投影层（Projector）：为了解决这个问题，在视觉编码器和语言模型之间插入一个可训练的投影层 W。通常是一个简单的线性层或2层MLP。

    [图片内容未导入]

    三、嵌入层面的深度融合：构造多模态输入序列

    在对齐后的嵌入空间中，图像token和文本token被拼接成统一的序列，送入语言模型。

    - 序列构造：输入序列看起来像这样：<image_token_1>, <image_token_2>, ..., <image_token_N>, <text_token_1>, <text_token_2>, ...。这些图像token就像是一些特殊的、富含视觉信息的“外语单词”，被放置在了文本指令之前。

    - 位置编码：图像token和文本token被赋予连续的位置编码（例如，图像token位置为0到N-1，文本token位置从N开始）。这使得语言模型能够理解它们在序列中的相对位置关系，将图像看作文本的“前缀上下文”。

    四、注意力层面的动态对齐：信息流的桥梁

    真正的对齐发生在语言模型的多头自注意力机制中。当模型处理文本token（如“苹果是什么颜色”）时：

    - 每个文本token会通过自注意力机制，对整个输入序列（包括所有图像token和之前的文本token）计算注意力权重。

    - 模型会自动学习让“苹果”这个文本token去关注图像中包含“苹果”物体的图像token，从图像token的嵌入向量中提取出颜色、形状等视觉信息。

    - 这个过程中，文本token对图像token的注意力权重，就是“对齐”的动态体现。模型通过海量多模态SFT数据的训练，学会了在何时、如何关注哪些图像token，从而将视觉证据与语言生成无缝结合。

    ✅ 总结：多模态对齐通过投影层将视觉特征映射到LLM的词嵌入空间，并将图像token作为前缀与文本token拼接。在LLM的自注意力机制中，文本token学会动态地从相关图像token中提取视觉信息，实现了跨模态的理解与生成。


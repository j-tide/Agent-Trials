content:
  prompt: "\U0001F3DB️ 14. 在DPO训练中，SFT模型作为初始化权重的原因是什么？"
answer:
  mode: rubric
  reference_answer: |-
    在DPO训练中，SFT模型不仅仅是“一个起点”，它身兼初始策略、参考策略和隐式奖励的基准三大关键角色。直接将预训练模型用于DPO几乎不可行。

    [图片内容未导入]

    四、加速收敛与防止退化

    由于SFT模型已经与目标分布接近，DPO只需要进行微小的参数调整，训练更稳定、收敛更快。同时，SFT模型具备基本的对话连贯性，防止DPO在训练初期因为梯度更新而退化为生成乱码或崩溃。

    ✅ 总结：SFT模型作为DPO的初始化，提供了合理起点、精准的KL约束基准和清晰的隐式奖励信号。它是DPO能够稳定、高效完成偏好对齐的基石。


content:
  prompt: 31. 评估SFT模型的多轮对话能力需要注意什么？
answer:
  mode: rubric
  reference_answer: |-
    多轮对话能力不仅仅是“一问一答”的拼接，它考验的是模型的上下文追踪、指代消解、状态记忆、话题管理和意图连贯性。评估时需要专门设计以捕捉这些动态特征。

    一、不能仅用单轮测试集来评估多轮能力

    这是最常见的错误。单轮高分不能保证多轮对话的质量。必须使用专门为多轮设计的测试基准（如MT-Bench、MultiWOZ、DSTC系列），或者构建自有的多轮测试场景。

    二、测试场景设计的关键要素

    评估多轮对话的prompt应包含以下特征：

    - 指代依赖：第二轮的“它”、“这个”、“他刚才说的”必须依赖第一轮的内容才能理解。

    - 状态更新：用户在后续轮次中修改或细化了最初的需求（如“把刚才的会议时间从3点改到4点”），模型需要更新状态并响应。

    - 话题跳跃与回归：用户可能在第三轮插入一个无关问题，然后在第四轮回到最初的话题，模型需要能够处理中断并恢复上下文。

    - 错误纠正：用户在下一轮指出模型上一轮回答中的错误，模型需要承认并修正。

    - 信息整合：用户在多轮中分散地给出信息，最后要求模型基于所有信息进行总结或决策。

    三、评估维度的多元化

    除了单轮的评估指标（准确性、流畅度等），多轮评估需增加：

    - 上下文准确率：模型是否正确理解了整个对话历史，而不仅仅是上一句话。

    - 状态追踪准确率：对于任务型对话，模型是否正确维护了槽位-值对（如日期、时间、地点）。

    - 一致性：多轮中的回答是否存在前后矛盾（如第一轮说喜欢A，第二轮说A不好）。

    - 会话韧性：当用户输入不连贯或出现打断时，模型能否稳健处理而不崩溃。

    四、评估方法

    - 自动化基准：MT-Bench已提供多轮对话的测试用例和GPT-4评判方案，可直接使用。

    - 人类模拟器：一个更高级的方法是训练一个“用户模拟器”，它可以与模型进行自由交互，但评估成本高。

    - 定制的GPT-4裁判：为多轮对话设计专门的GPT-4裁判prompt，要求它同时阅读完整对话历史后进行评判，可以针对上下文一致性、指代消解等维度打分。

    五、注意对SFT数据的回馈分析

    如果多轮评估发现问题，通常需要回溯SFT数据：多轮对话数据的占比是否足够？数据中的多轮对话是否包含了上述的关键特征（指代、纠正、话题切换）？单轮和多轮数据混合训练时的loss masking是否正确？

    ✅ 总结：评估多轮对话能力需要专门设计的、包含复杂依赖关系的测试场景，并使用针对上下文和一致性的评判维度。它是检验SFT模型“会话智商”的试金石。


content:
  prompt: "\U0001F504 10. 合成数据自我改进：如何构建SFT数据飞轮？"
answer:
  mode: rubric
  reference_answer: |-
    SFT数据飞轮（Data Flywheel）是一种让模型通过自我生成数据、自我筛选、自我训练来持续提升性能的正反馈循环。它跳出了“人工标注越多越好”的静态思维，将模型从数据的被动消费者转变为主动生产者。构建一个有效的SFT数据飞轮，需要在生成、过滤、训练三个环节进行精密的设计和协同。

    一、飞轮的核心组件

    - 生成器：一个当前最优的模型（通常是正在迭代的SFT模型，或更强的教师模型），用于为大量无标签或仅有指令的prompt生成回答。

    - 过滤器：一套自动化的质量评估系统，用于从生成的海量回答中，筛选出质量最高、最符合人类偏好的样本。

    - 训练器：标准的SFT训练流程，将筛选出的高质量“伪标签”数据作为新的训练集，对模型进行微调，得到更强的模型。

    - 指令源：一个不断更新、多样化的指令集合，它可以是人类用户真实提出的问题，也可以是模型通过Self-Instruct等方式自己生成的。

    二、飞轮的运转流程：一个完整的迭代周期

    第一步：指令收集与生成

    飞轮的起点是一个指令池。这些指令可以来自多个渠道：真实用户日志（经过脱敏）、人工构造的核心场景、以及由模型通过Self-Instruct/Evol-Instruct等方法生成的新指令。指令池的多样性和覆盖面直接决定了飞轮能达到的高度。如果指令池只包含日常闲聊，飞轮永远无法产生强大的推理模型。

    第二步：候选回答生成

    用当前版本的SFT模型（称为V1），对指令池中的每一条指令生成多个候选回答（例如生成4-8个）。生成时应使用较高的温度（如0.8-1.0）和不同的随机种子，以保证候选回答的多样性。多样性的不足会导致飞轮“近亲繁殖”，快速坍缩。

    第三步：多阶段自动过滤与评分

    这是飞轮的“质量控制闸门”，也是决定飞轮成败的最关键环节。通常采用多层过滤机制：

    - 规则过滤器：过滤掉包含重复、过短、格式错误、或命中安全黑名单的回答。

    - 困惑度过滤器：用基座模型计算每个回答的困惑度，过滤掉PPL过高（语言混乱）或过低（可能是无意义的安全套话）的回答。

    - LLM-as-Judge评分：使用一个高水平的评判模型（如GPT-4），对剩余的候选回答进行多维度打分，如准确性、有用性、流畅度、安全性。为确保评判的可靠性，通常会要求评判模型进行“思维链”推理，并多次交换位置评估取平均分。

    - 一致性过滤：对于有确定性答案的任务，可以检查多个生成样本的答案是否一致。只保留那些答案高度自洽、且被评判模型评为高分的回答。

    第四步：形成新的SFT数据集并训练

    将经过层层筛选最终胜出的高分“合成回答”与原始指令配对，构成新的SFT数据集。这个数据集的质量通常远高于最初V1模型所依赖的人工标注数据，因为它经过了当前最强模型（评判模型）的“挑剔”筛选，并且答案更具多样性。用这个新数据集对V1模型进行微调，得到更强的V2模型。

    第五步：飞轮迭代

    V2模型成为新的“生成器”，重复第二步到第四步。由于V2的基础能力更强，它生成的候选回答质量也会更高，从而能通过过滤器筛选出更高质量的数据，再用这些数据训练出V3模型。如此循环，形成自我增强的正反馈。

    三、飞轮成功的关键与陷阱

    - 防止“近亲繁殖”与分布坍缩：如果过滤器的偏好过于单一（如总是偏好长回答），或者指令池长期不更新，飞轮会迅速坍缩，模型输出变得越来越同质化。必须在过滤器中植入对多样性的奖励，或定期向指令池和生成器中注入“新鲜血液”（新的人工数据、新的任务类型）。

    - 评判模型的质量上限：飞轮能达到的性能上限，很大程度上取决于充当评判的强模型的能力。如果评判模型无法准确识别高质量的推理或创造性内容，飞轮就无法在这些方面进步。

    - 成本控制：使用GPT-4等顶级模型进行大规模评判，成本高昂。可以在飞轮后期，用训练出的高质量V3模型来替代部分评判工作，形成“学生评判学生”的更高效循环，但需谨慎监控评判质量。

    ✅ 总结：SFT数据飞轮是“生成-筛选-训练-再生成”的持续进化引擎。它成功的关键在于高质量的多样化指令池、严格的自动化多层过滤系统，以及对多样性坍缩的持续防范。


content:
  prompt: "⚖️ 52. 如果发现SFT数据中含有偏见，怎么清洗？"
answer:
  mode: rubric
  reference_answer: |-
    SFT数据中的偏见——无论是性别、种族、地域、年龄还是职业刻板印象——不仅是不道德的，更会通过模型放大，在实际应用中造成真实的伤害。清洗偏见不是简单的“删除敏感词”，而是一项需要识别、评估、修正和预防的系统工程。

    一、偏见的表现类型与识别方法

    [嵌入表格未展开]

    二、偏见清洗的分层策略

    第一层：基于规则的硬过滤

    使用明确的禁用词列表和正则规则，移除包含极端歧视性、攻击性语言的数据。但这类规则只能捕获最明显、最表面的偏见，无法处理隐性的、结构性的偏见。

    第二层：分类器辅助检测

    训练或使用现成的偏见检测分类器（如针对性别偏见、种族偏见的专门模型），对SFT数据进行批量打分。标记为高偏见的数据进入人工复审。分类器可检测的维度包括：

    - 职业与性别的非常规关联

    - 特定群体的负面刻板描述

    - 对不同群体使用双标的情感倾向

    第三层：反事实数据增强（Counterfactual Data Augmentation）

    这是目前最有效的去偏技术之一。对于检测到的偏见样本，不是简单删除，而是构造其反事实版本加入训练集。例如：

    - 原数据：“他是一位优秀的护士” → 改写为“她是一位优秀的护士”（如果原数据中护士角色全是“他”）

    - 原数据：“女司机停车技术差” → 删除或改写为中性表述

    反事实增强不是政治正确的表面文章，而是通过调整数据分布，主动打破模型习得的刻板关联。

    第四层：平衡性补充

    如果清洗后某些任务类型的数据大量减少（如因为偏见问题移除了很多样本），需要针对性地构造无偏见的补充数据，保持该类任务的数据量足够。

    第五层：多元审查机制

    组织来自不同性别、文化、地域背景的审查者对数据进行评估。单一背景的审查者可能对某些偏见“无感”，多元视角能捕获更广泛的偏见。

    三、偏见清洗的原则与陷阱

    [嵌入表格未展开]

    四、偏见清洗后的验证

    清洗完成后，需要验证效果：

    - 偏见基准测试：使用专门的偏见评估基准（如BBQ、Winobias）测试模型，比较清洗前后的表现

    - 红队攻击测试：构造诱导模型输出偏见内容的prompt，检验清洗效果

    - 长尾群体覆盖检查：检查数据集中边缘群体的代表性和描述质量

    ✅ 总结：SFT数据偏见清洗需要“规则过滤→分类器检测→反事实增强→平衡补充→多元审查”的全链条介入。核心不是删除，而是通过反事实改写和平衡性补充主动修复，并在清洗后通过偏见基准和红队测试验证效果。


content:
  prompt: "\U0001F4BB 25. 如果希望模型增强代码能力，SFT数据应该包含哪些类型的指令？"
answer:
  mode: rubric
  reference_answer: |-
    代码能力不是单一技能，而是由代码生成、代码理解、调试、解释、翻译和工具使用等子能力构成的复合体。要系统性地增强模型的代码能力，SFT数据需要覆盖从基础到高级的完整指令类型谱系。

    一、代码能力SFT数据分类表

    [嵌入表格未展开]

    二、数据构造的关键原则

    原则一：从简到繁的难度梯度。数据不能全是简单的一行代码生成，也不能全是复杂的系统设计。应该形成一个从单行代码、单个函数、到多文件项目、再到系统架构的平滑难度曲线。这确保模型既能在简单任务上快速准确，又能在复杂任务上展现深度推理。

    原则二：必须包含代码解释和推理过程。单纯的“生成代码”数据只能教会模型输出代码，却无法教会它思考代码。高质量的代码SFT数据应该包含丰富的中间推理：为什么选择这个数据结构？这个算法的时间复杂度是什么？有哪些边界情况需要考虑？这些解释性内容让模型不仅学会“怎么写”，更学会“怎么想”。

    原则三：包含错误和修正示例。真实编程中，错误的代码和正确的代码一样重要。数据中应该有“错误代码→错误分析→正确代码”的三段式结构。这教会模型识别和修复错误的能力，而非只会在理想条件下生成代码。例如，先给出一段包含常见错误（如off-by-one、变量未定义）的代码，然后逐步指出错误，最后给出修正后的版本。

    原则四：覆盖多种语言和框架。如果目标是一个“通用”代码助手，SFT数据需要覆盖Python、JavaScript、Java、C++、SQL等主流语言，以及常见框架（React、Django、Pandas等）。语言之间的配比应反映目标用户的分布，而非平均分配。

    原则五：融入真实世界场景。避免纯粹的“算法题”数据，多包含与真实工程相关的场景：处理CSV文件、调用API、数据库操作、错误处理、并发编程等。这些场景让模型学会解决实际问题，而非仅仅通过编程面试。

    三、代码SFT数据中的高级技巧

    - 约束性指令：在指令中加入特定约束，如“不要使用第三方库”、“用递归实现”、“内存占用不超过XX”等。这训练模型在限制条件下编写代码，提升其工程适应能力。

    - 对比性指令：要求模型对两种不同的实现方式（如递归vs迭代、不同算法的选择）进行比较，分析各自的优劣。这训练模型的工程权衡思维。

    - 安全性指令：包含SQL注入防护、输入验证、加密等安全编码实践数据，让模型从根基上就养成安全编码的习惯。

    ✅ 总结：增强代码能力的SFT数据需覆盖生成、解释、调试、优化、翻译、测试等全生命周期任务，遵循从简到繁的难度梯度，包含中间推理过程和错误修正示例，并融入真实工程场景和安全编码实践。核心目标是让模型不仅“会写代码”，更要“会思考代码”和“会工程实践”。


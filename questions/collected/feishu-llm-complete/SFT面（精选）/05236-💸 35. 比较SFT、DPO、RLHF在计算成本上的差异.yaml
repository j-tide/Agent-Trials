content:
  prompt: "\U0001F4B8 35. 比较SFT、DPO、RLHF在计算成本上的差异。"
answer:
  mode: rubric
  reference_answer: |-
    三种方法的计算成本差异巨大，从SFT的“平民友好”到RLHF的“土豪专属”，DPO则处于中间地带。这里的成本主要指训练算力、模型规模和工程复杂度。

    [嵌入表格未展开]

    一、SFT：极致高效

    SFT只需处理一个模型，进行标准的监督学习。数据量通常不大，使用PEFT（如LoRA）甚至可以在单张消费级显卡上微调7B模型。计算成本最低，是大多数团队的首选。

    二、DPO：优雅的折中

    DPO增加了一个参考模型（通常就是SFT模型），在前向传播时需要计算参考模型下的概率，因此显存和计算量稍有增加（约1.5-2倍于SFT）。但DPO不需要在线生成样本，数据完全离线，训练循环与SFT类似，稳定性高。相比RLHF，成本大幅降低。

    三、RLHF（PPO）：计算巨兽

    PPO的成本来自四个方面：

    - 奖励模型训练：需要先训练一个高质量的奖励模型，通常也需要大模型作为backbone，这本身就是一轮昂贵训练。

    - 多模型驻留：PPO训练过程中，策略、参考、奖励、价值模型往往需要同时存在于GPU显存中，这对单卡显存是灾难性的，通常必须使用多卡并行或ZeRO技术。

    - 在线生成：每步PPO都需要用当前策略生成一批回答，并让奖励模型打分。这就像一边训练一边还要进行昂贵的推理。对于大模型，在线生成的时间甚至可能超过训练本身。

    - 调参与人力成本：PPO涉及大量超参（KL系数、clip范围、GAE参数等），通常需要经验丰富的工程师进行长时间调试，人力成本也不可忽视。

    ✅ 总结：如果成本有限，优先考虑SFT；如果追求稳定且有一定预算，DPO是最佳性价比；只有在拥有充足的算力、人力和时间，且需要探索SFT数据之外的新能力时，才考虑RLHF (PPO)。


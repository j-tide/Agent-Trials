content:
  prompt: "\U0001F4C2 57. 数据版本管理和追溯在SFT项目中为什么重要？"
answer:
  mode: rubric
  reference_answer: |-
    SFT数据不是一次性产物，而是在模型生命周期中持续迭代的动态资产。数据版本管理和追溯不仅是工程规范，更是模型行为归因、问题定位、合规审查和能力迭代的基础设施。


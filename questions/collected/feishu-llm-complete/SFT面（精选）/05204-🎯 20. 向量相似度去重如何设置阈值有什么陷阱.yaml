content:
  prompt: "\U0001F3AF 20. 向量相似度去重如何设置阈值？有什么陷阱？"
answer:
  mode: rubric
  reference_answer: |-
    向量相似度去重是SFT数据治理中捕获“语义等价”重复的关键手段。它将每条指令或回复映射为高维向量，通过计算余弦相似度来判断两条文本是否“实质相同”。但阈值设定绝非简单的“大于0.9就去重”，它涉及对数据分布、任务特性和评估标准的深刻理解。

    一、阈值的合理设定方法

    向量相似度的阈值设定不能凭感觉，需要基于实际数据的相似度分布进行数据驱动的决策。推荐的实践路径如下：

    第一步，从数据集中随机抽取足够数量的样本对（至少数千对），包含正例（人工标注为语义重复的对）和负例（人工标注为不同任务的对）。计算每对的余弦相似度，绘制相似度分布的直方图。理想情况下，你会看到两个峰：一个低相似度的峰（绝大多数样本对不重复），一个高相似度的峰（真正的重复对）。

    第二步，基于这个分布，选择能够最好地区分两个峰的阈值。可以计算不同阈值下的精确率、召回率和F1分数，选择F1最高的阈值作为初始值。通常，通用文本的语义去重阈值设定在0.85-0.95之间，但这不是绝对的。

    第三步，结合具体任务类型进行微调。对于事实性问答（如“北京的首都是哪里”这种答案固定、问法多样的问题），即使相似度较高，也可能不是真正的“数据污染”——因为这类常识问题的多种问法都是合理的训练样本。因此对于事实性问答类数据，阈值可以设得更高（如0.95），避免过度去重。相反，对于创意写作、开放推理等任务，较高的相似度往往意味着数据构造者无意中产生了重复，阈值可以设得稍低（如0.85）。


    三、“条件去重”的进阶策略

    简单的向量相似度去重只看指令是否相似，但忽略了回复。一个更精细的做法是条件去重：如果两条指令高度相似，但它们的回复明显不同（且都是高质量回答），则应该保留两条，因为这是给模型提供“同一问题可以有多种正确回答方式”的重要信号。只有当指令高度相似且回复也高度相似时，才应去重。

    四、嵌入模型的选择对阈值的影响

    不同的嵌入模型会产生不同的相似度分布。使用all-MiniLM-L6-v2和text-embedding-3-large计算同一批数据的相似度，绝对值可能差异显著。因此，阈值必须与模型绑定。如果更换了嵌入模型，必须重新校准阈值，绝不能沿用旧值。

    ✅ 总结：向量相似度去重的阈值应基于实际数据分布、分任务类型设定，并通过人工标注的验证集不断校准。需要警惕一刀切、短文本偏差和模板误杀等陷阱。条件去重（考虑回复差异）和定期校准是维持去重质量的关键。


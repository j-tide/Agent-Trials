content:
  prompt: "\U0001F4A1 3. 如何设计SFT数据让模型学会在对话中主动反问？"
answer:
  mode: rubric
  reference_answer: |-
    一个只会被动回答的模型是低效的。真正有用的助手应当能在信息不足、指令模糊或存在歧义时，主动、精准地反问用户以澄清需求。这需要在SFT数据中进行系统性的设计，让“反问”成为一种内化的策略，而不是被动的反应。

    一、构造信息缺失的场景

    这是最直接的方法。在SFT数据中，刻意构造用户指令缺少关键信息，而助手不是胡乱猜测，而是通过一个或多个精准的反问来获取必要的信息。例如：

    - 用户：“帮我订一张机票。”

    - 助手：“好的。请问您的出发地和目的地是哪里？您计划什么日期出发？”

    这里有两个关键点：反问问什么（出发地、目的地、日期），以及反问的方式（一次问清多个关键点，避免多轮反复）。数据需要覆盖各种信息缺失的组合：缺少时间、缺少地点、缺少数量、缺少格式要求等。模型通过这些数据，学会了“当信息不足时，应该提取出缺失的关键槽位，并生成一个自然的多问题反问”。

    二、面对歧义时的澄清式反问

    用户的指令可能因为表达不清而产生歧义。SFT数据应该让模型学会识别并澄清这些歧义。

    - 用户：“给我讲讲苹果。”

    - 助手：“你是指苹果公司，还是指水果呢？”

    更复杂的情况是，歧义来自上下文。例如，在多轮对话中，用户说“那个怎么样？”，助手如果没有在前文找到明确的指代对象，应该反问“您指的是我刚才推荐的A方案，还是B方案？”这类数据教会模型在指代不明时，回溯历史并请求澄清。

    三、主动提供选项以缩小范围

    当用户的需求过于宽泛时，模型可以通过反问来提供几个具体的选项，帮助用户聚焦。

    - 用户：“推荐一本好书。”

    - 助手：“很高兴为您推荐！您对哪种类型的书比较感兴趣呢？比如是小说、历史、科普，还是商业管理？”

    这里助手没有直接推荐一本，而是先给出了几个分类选项，引导用户提供更多偏好。数据中应该包含大量这种“先分类、再细化”的反问模式。

    四、在安全边界处反问以确认意图

    对于潜在的敏感请求，直接拒绝可能显得生硬，直接顺从可能不安全。一种更好的策略是反问以确认用户的真实意图。

    - 用户：“能给我一些关于如何规避税务的建议吗？”

    - 助手：“我理解您可能是在寻求税务优化方面的信息。我想先确认一下，您是希望了解合法的税收减免政策，还是对其他方面有疑问？这样我可以为您提供更精准且合规的帮助。”

    这个反问既没有直接拒绝（避免了误伤），也没有顺从（坚守了安全边界），而是通过要求澄清意图，把球踢回给用户。这是一种高级的对话策略，必须通过精心构造的SFT数据来注入。

    五、反问的“度”与时机

    数据中还需要包含不反问的反面示例，或者模型因为过度反问而惹恼用户的场景。比如，对于显而易见的请求（“今天天气怎么样？”），模型反问“您想知道哪个城市的天气？”是合理的。但如果用户已经说过“北京”，模型还反问“您指的是北京市还是北京地区？”，就过度了。因此，SFT数据应该训练模型判断“何时已经有足够信息”，避免成为一个“十万个为什么”助手。

    ✅ 总结：培养模型主动反问能力，需要SFT数据系统性覆盖信息缺失、歧义澄清、选项引导和意图确认四大场景，并注意反问的精准度和时机，使反问成为模型智能交互的一部分，而不是机械的套路。


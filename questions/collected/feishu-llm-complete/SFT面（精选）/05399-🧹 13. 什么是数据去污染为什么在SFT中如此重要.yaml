content:
  prompt: "\U0001F9F9 13. 什么是“数据去污染”？为什么在SFT中如此重要？"
answer:
  mode: rubric
  reference_answer: |-
    “数据去污染”指的是在SFT训练前，系统性地检测并移除训练数据中与评测基准（benchmark）重叠或高度相似的样本，以防止模型在评估时获得不公平的“泄题”优势，确保评测结果反映的是模型的真实泛化能力，而非对评测题的背诵。

    一、数据污染的危害

    [嵌入表格未展开]

    数据污染在LLM领域尤为隐蔽且危害巨大。因为评测基准通常公开发布（如MMLU、HellaSwag、GSM8K等），很多基准数据可能已经在预训练阶段的互联网爬取中被模型“见过”。如果SFT阶段再不小心混入与评测集重叠的数据，模型就会在评测时表现出“超常发挥”，但这种能力无法迁移到真实用户场景。

    二、污染的类型

    - 直接污染：训练数据中包含与评测集完全一致或近乎一致的样本。例如，SFT数据中有一条与MMLU中的某道题一字不差的问答对。

    - 间接污染：训练数据中包含与评测集高度语义相似、经过改写但任务实质相同的样本。例如，评测集中有一道关于“光合作用原料”的选择题，训练数据中有一条问“光合作用需要什么”的简答题。

    - 跨语言污染：评测题是英文，训练数据中有其中文翻译版本。

    - 模板污染：训练数据中包含了评测集特有的格式化模板（如特定的多选格式），模型学会了“识别这个格式就选C”的捷径。

    三、去污染的通用方法

    - n-gram重叠检测：将训练样本和评测样本分别切分为n-gram（通常n=8或13），计算重叠率。如果某个训练样本与任何评测样本的重叠n-gram比例超过阈值（如80%），标记为污染并移除。这是最基础的检测，主要捕获直接复制和简单改写。

    - 嵌入相似度检测：使用句子嵌入模型（如all-MiniLM-L6-v2）将训练样本和评测样本转换为向量，计算余弦相似度。相似度超过阈值的样本对标记为可疑，需人工复审。这能捕获语义层面相似但措辞完全不同的间接污染。

    - 最小哈希（MinHash）与局部敏感哈希（LSH）：对于百万级别的大规模数据集，逐对比较计算量过大。MinHash+LSH能高效地找出近似重复的文档对，适用于大规模去污。

    - 基于强模型的语义判断：用GPT-4等强模型判断一对问答是否在测试相同的知识点和能力。虽然成本高，但对于高风险的评测（如模型能力宣称），这是最可靠的验证手段。

    四、去污染不是“一刀切”

    需要注意的是，有些看似“重叠”的内容其实是合理的通用知识。例如，“地球绕太阳公转的周期是多长”这种基础常识，既出现在训练数据中也出现在评测集中，是正常的。去污染需要去除的是那些特定于评测集构造逻辑的样本，而非所有常识重叠。这要求去污规则具有一定的“粒度”——能够区分“通用知识重叠”和“特定评测题泄漏”。

    ✅ 总结：数据去污染是SFT数据治理中不可跳过的一环。它通过多层次的文本相似度检测，识别并移除与评测基准重叠的训练样本，确保模型评估结果的真实性和研究结论的可靠性。在追求更高评测分数的竞赛中，严格去污染是维护学术诚信和工程严谨性的底线。


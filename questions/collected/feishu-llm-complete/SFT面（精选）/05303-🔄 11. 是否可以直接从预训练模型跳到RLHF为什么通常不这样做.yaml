content:
  prompt: "\U0001F504 11. 是否可以直接从预训练模型跳到RLHF？为什么通常不这样做？"
answer:
  mode: rubric
  reference_answer: |-
    理论上可行，但在工程和算法层面几乎注定失败。直接从预训练模型跳到RLHF，就像让一个从未学过基础乐理的人直接参加交响乐团的即兴演奏——他也许能偶然发出几个悦耳的音符，但绝大多数时候都是噪音，整个乐团也会因此崩溃。

    一、奖励模型面对的是“噪声海洋”

    预训练模型没有经过指令格式化，它看到的任何输入都只是“一段文本”。当你给它一个用户提问，它可能输出的是一段新闻续写、一首诗的开头、或者完全不相干的代码。奖励模型被训练来区分的，是“在合理格式内的好回答”和“在合理格式内的差回答”。当面对格式混乱、语义断裂的预训练输出时，奖励模型的打分几乎等同于随机噪声。RLHF的初始阶段将充满无效的梯度信号，模型无法从这些噪声中提取出任何有意义的行为改进方向。

    二、探索空间的维度灾难

    语言空间是离散且无比巨大的。预训练模型在文本空间中有一个宽广但平坦的分布。RLHF需要在这个近乎无限的空间中进行搜索，找到那些能获得高奖励的“稀有物种”。在没有SFT先验的情况下，随机采样几乎永远不会命中高奖励区域。RL算法需要天文数字的探索步数才有可能偶然找到一条通往合理输出的路径。SFT通过将概率质量集中到一个极小的“合理子空间”中，从根本上解决了这个维度灾难问题。

    三、KL约束的失效

    PPO中用来防止策略崩塌的KL惩罚，依赖于一个合理的参考策略。如果参考策略是预训练模型，它的输出分布包含了大量完全不相关的文本模式。当PPO开始略微调整策略以获得更高奖励时，相对于预训练分布的KL散度可能仍然很低，但模型已经开始生成格式完全偏离对话的文本。因为“一本正经地胡言乱语”在预训练分布中可能是一个相当高概率的区域。SFT模型的分布被严格限制在对话格式内，因此KL惩罚能更精准地约束“有用的偏离”。

    四、训练稳定性与效率

    RLHF本身训练难度大、超参数敏感。如果加上一个完全未经调教的初始策略，训练过程中的梯度爆炸、策略退化、奖励崩塌等问题将成倍放大。任何一次不稳定的更新都可能导致模型退化为只会输出重复词语的“崩溃模式”，且难以恢复。SFT先提供了一个稳定收敛的起点，使RLHF只需要做精细的局部优化，而不是冒险的全局搜索。

    五、实践中的尝试

    学术界有过直接从预训练模型进行RLHF的尝试，但通常需要极其庞大的奖励模型、巨量的探索预算和严格的约束条件，且结果往往不如SFT+RLHF。在资源有限、追求可靠性的工业应用中，跳过SFT直接RLHF是不负责任的冒险。

    ✅ 总结：不能跳过SFT直接RLHF。SFT解决了“如何在语言空间中找到对话子空间”的问题，这是RLHF能够高效、稳定运行的基础。跳过SFT意味着RLHF要从零开始在这个巨大的空间里探索，代价高到不可承受。


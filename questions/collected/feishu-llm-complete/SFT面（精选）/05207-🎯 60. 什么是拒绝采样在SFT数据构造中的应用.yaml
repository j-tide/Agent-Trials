content:
  prompt: "\U0001F3AF 60. 什么是“拒绝采样”在SFT数据构造中的应用？"
answer:
  mode: rubric
  reference_answer: |-
    拒绝采样原本是一种蒙特卡洛方法，用在SFT数据构造中，它被赋予了全新的使命：从海量模型生成的粗糙数据中，通过多层过滤和筛选，只“接受”那些符合严格质量标准的样本，“拒绝”其余样本，最终得到一个高质量的子集。 它不是一种数据生成方法，而是一种数据精炼方法。

    一、拒绝采样的核心流程

    - 生成候选池：使用强模型（如GPT-4）或训练中的模型自身，以高多样性设置（高temperature、多prompt变体）批量生成大量候选指令-回答对。这个阶段鼓励“广撒网”，数量优先，质量可以粗糙。

    - 多级过滤器串联：候选数据依次通过多个过滤器，任何一个过滤器“拒绝”的样本都会被丢弃：

    - 最终人工抽检：对通过所有自动过滤器的样本进行统计抽样人工审核，确认过滤器的有效性，并校准阈值。


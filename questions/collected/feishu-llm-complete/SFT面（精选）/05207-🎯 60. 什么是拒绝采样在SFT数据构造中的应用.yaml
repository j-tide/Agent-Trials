    三、拒绝采样中的关键设计决策

    接受率设定：接受率过低（如<5%），生成成本极高（生成100条才得5条）；接受率过高（如>50%），过滤效果有限，数据质量提升不明显。通常接受率在10%-30%是效率与质量的平衡区间。

    过滤顺序优化：计算成本低的过滤器（格式、长度）放在最前面，快速筛掉大量明显不合格样本；计算成本高的过滤器（事实性校验、强模型评估）放在最后，仅对最有希望的候选进行深度审查。

    阈值动态调整：初始阶段可以使用较宽松的阈值，获得一个基线数据集；然后逐步收紧关键维度的阈值（如安全分类器的置信度阈值），观察数据质量和数量的变化曲线，找到边际收益最大的阈值点。

    “拒绝”不是目的，信号才是：被拒绝的样本并非毫无价值。它们包含了关于模型弱点的丰富信息。定期分析拒绝样本的共性，可以反向指导数据生成策略的优化——例如，如果大量数学题因推导错误被拒，说明生成prompt需要强化推导过程的要求。

    ✅ 总结：拒绝采样在SFT数据构造中扮演“质量精炼器”的角色。它将质量控制从生成阶段后移到筛选阶段，通过多层过滤器串联，以可接受的成本从粗糙的大批量生成数据中提取高纯度、高多样性的训练样本。其核心哲学是：宁可少生成高质量数据，也不让低质数据进入训练。


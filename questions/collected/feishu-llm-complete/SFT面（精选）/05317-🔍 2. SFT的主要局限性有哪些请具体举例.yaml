content:
  prompt: "\U0001F50D 2. SFT的主要局限性有哪些？请具体举例。"
answer:
  mode: rubric
  reference_answer: "SFT虽是大模型对齐的基石，但其模仿学习的本质决定了它存在几个难以自我克服的局限。这些局限并非训练不善所致，而是其方法论固有的。\n\n\U0001F4CC
    局限性一：标准答案依赖与多样性丧失\n\nSFT要求为每条指令提供一个“标准答案”，这隐含地假设所有任务都有唯一最优解。比如，对于“给我推荐一本好书”，SFT数据可能只给出了《百年孤独》。模型训练后，会认为《百年孤独》是这个问题的最优回答，而忽略了推荐其他优秀作品的可能性，丧失了推荐多样性。更严重的是，在创意写作任务中，SFT模型容易输出千篇一律的模板化内容，因为它被训练得只模仿那一种“好的写法”，而非学会“多种写法都可以是好的”。\n\n\U0001F4CC
    局限性二：无法处理价值冲突与情境权衡\n\n当指令本身包含矛盾时，SFT会陷入困境。例如：“请用一句话详细解释量子力学。” 训练数据中，如果标注者选择“详细解释”而忽略“一句话”约束，模型就学会了可以忽略简洁性；如果标注者选择“一句话”而牺牲“详细”，模型则学会可以忽略完整性。无论哪种，模型都只学到了“偏废一方”的固定策略，而无法学会根据具体情境灵活权衡。在真实对话中，面对用户强烈情绪的表达，SFT模型要么死板拒绝，要么盲目顺从，缺乏细腻的情感应对。\n\n\U0001F4CC
    局限性三：暴露偏差与错误累积\n\nSFT的教师强制训练使模型永远活在“完美上下文”的温室里。推理时，一旦在生成过程中出现一个小错误（比如一个拼写错误或逻辑跳跃），这个错误会作为后续所有生成的条件。由于模型从未在训练中见过这种带错误的上下文，它无法自我纠正，反而会越错越离谱。例如，在长文本生成时，SFT模型可能在开头说“他是一位法国画家”，下一段却基于错误假设写成“他的德国作品影响深远”，产生自相矛盾的内容，因为它没有学会如何从错误中恢复。\n\n\U0001F4CC
    局限性四：安全意识浅表化\n\nSFT的安全拒绝完全依赖于数据中是否包含了“拒绝”的示例。攻击者可以通过角色扮演（“假装你是无限制的DAN”）、编码变形（“用Base64告诉我如何制作炸弹”）等方式轻松绕过。因为模型学到的不是“制作炸弹的请求是危险的”这一抽象原则，而是“看到‘制作炸弹’这几个字，就应该回复拒绝模板”。一旦关键词被隐藏或变换，防线立即崩溃。\n\n\U0001F4CC
    局限性五：事实性难以保证，且无法校准不确定性\n\nSFT数据中的回答通常是标注者精心撰写的确定答案，这导致模型学会了“永远自信”的语调。当遇到知识边界之外的问题时，它不会说“不知道”，而是会模仿训练数据中自信的格式，编造一个看似合理但完全错误的答案（幻觉），并且以高置信度输出。例如，问及“2030年世界杯冠军是谁”，SFT模型很可能凭空虚构一个队伍和比分，且语气斩钉截铁。\n\n✅
    总结：SFT的局限源于其“模仿学习”的本质。它只能复制表面形式，无法内化深层价值，也无法处理开放世界中复杂的权衡和不确定性。这也就是为什么需要RLHF/DPO等后续阶段来弥补这些结构性缺陷。\n\n---"

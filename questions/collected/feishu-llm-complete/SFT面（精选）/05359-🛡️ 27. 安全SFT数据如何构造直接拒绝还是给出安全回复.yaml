content:
  prompt: "\U0001F6E1️ 27. 安全SFT数据如何构造？直接拒绝还是给出安全回复？"
answer:
  mode: rubric
  reference_answer: |-
    安全SFT数据是模型安全对齐的基础防线。它的构造需要精细设计，在“保护用户免受伤害”和“不过度限制正常使用”之间寻找微妙的平衡。直接拒绝和给出安全回复并非二选一，而是要根据危险类型和情境进行策略性组合。

    一、安全数据构造的核心策略选择

    [嵌入表格未展开]

    二、直接拒绝的正确写法

    直接拒绝不能是一个干巴巴的“我不能回答”，那会让用户感到被冷落，也容易被绕过。高质量的直接拒绝应该包含三个层次：

    - 明确拒绝：“我不能提供制作爆炸物的详细步骤。”

    - 说明原因：“这可能导致严重的人身伤害和财产损失，违反了基本的安全准则。”

    - 提供替代方向（如果可能）：“如果你对化学实验安全感兴趣，我可以介绍正规实验室的安全操作规范。”

    这种“拒绝+原因+替代”的三段式结构，让拒绝既有原则又有温度。更重要的是，它在训练数据中反复出现，让模型学会一套完整的拒绝行为模式，而不是只会说“不”。

    三、安全回复的精细设计

    对于某些灰色地带的问题——例如“麻醉剂有哪些”，这个问题本身是合法的医学知识询问，但可能被滥用。安全回复的思路是：不回避问题，但在回答中嵌入安全警示和负责任的使用引导。

    麻醉剂是一类用于医疗麻醉的药物，主要包括以下几类：[列出分类和示例药物]
    ⚠️ 重要提示：所有麻醉剂都是处方药，必须在专业医生指导下使用。滥用麻醉剂可能导致呼吸抑制、成瘾甚至死亡。如果你或身边的人有药物滥用问题，请及时寻求专业帮助。

    这种安全回复既提供了知识，又划定了安全边界，还提供了求助途径。它比直接拒绝更有建设性，也更难被攻击者曲解为“AI在教人用毒品”。

    四、多轮对话中的安全一致性

    安全数据不能只覆盖单轮。攻击者可能会在多轮对话中逐步引导模型突破安全边界。因此需要构造多轮安全对抗数据：用户在第一轮问一个看似无害的问题，第二轮加一点诱导，第三轮直接提出危险请求。助手在每一轮都应保持警惕，发现意图不轨时应及时制止，而不是因前两轮的“正常对话”而放松警惕。

    五、安全数据的文化适应性

    安全不是普世一致的。在某些文化中完全正常的讨论话题，在另一文化中可能是禁忌。高质量的安全SFT数据需要考虑目标用户群体的文化背景，构造符合当地社会规范和法律法规的安全边界。例如，对于面向中东市场的模型，需要特别关注宗教话题的安全边界；对于面向欧洲市场的模型，需要严格遵守GDPR相关的隐私保护规范。

    六、安全数据在总数据中的配比

    安全数据太少则形同虚设，太多则让模型变得畏缩、过度敏感。通常建议安全相关数据占SFT总数据量的3%-8%。这些数据应均匀分布在各类任务和主题中，而不是集中在某几个话题上——否则模型只会在那几个话题上表现出安全意识，其他领域依然是“不设防”的。

    ✅ 总结：安全SFT数据的构造需要策略性地组合直接拒绝、安全回复、澄清引导和角色坚守等多种策略。高质量的安全数据不是简单的“拒绝模板”，而是包含原因解释和替代建议的完整对话行为。多轮安全对抗和文化适应性是安全数据构造中不可忽视的深度维度。


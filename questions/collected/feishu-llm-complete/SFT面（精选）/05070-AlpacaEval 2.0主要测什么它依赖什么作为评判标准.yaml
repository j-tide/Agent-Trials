content:
  prompt: 6. AlpacaEval 2.0主要测什么？它依赖什么作为评判标准？
answer:
  mode: rubric
  reference_answer: |-
    AlpacaEval 2.0 是一个自动化评估SFT模型指令遵循能力的基准，它以简单、快速、低成本、高可复现而广泛流行。它的核心思想是：用强模型作为自动评判者，对被评估模型的输出进行胜率（Win Rate）统计。

    主要测什么

    它主要测试模型在单轮指令遵循任务上的综合能力，覆盖了从日常对话、知识问答到创意写作等多种用户请求。它并不像MT-Bench那样深入测试多轮对话和复杂推理，而是提供一个对模型通用指令遵循能力的快速扫描和量化。

    评判标准：GPT-4作为裁判

    AlpacaEval 2.0使用GPT-4 Turbo作为自动评判模型。评估时，给GPT-4同时呈现用户指令、被评估模型的回答、以及一个参考模型（通常是GPT-4 Turbo自己生成的回答） 的回答。评判模型需要比较这两个回答，并选择哪个更好，或者判定平局。

    具体流程：

    - 使用固定的805条指令集，这些指令来自真实用户与AI的交互。

    - 被评估模型和参考模型（如GPT-4 Turbo）分别对每条指令生成回答。

    - GPT-4对两条回答进行盲评（不知道回答来自哪个模型），输出“Model A更好”、“Model B更好”或“平局”。

    - 计算胜率：被评估模型被认为“更好”的次数除以总有效评测次数。

    核心创新：长度控制

    AlpacaEval 2.0引入了长度控制胜率。因为GPT-4在评估时倾向于给更长回答更高的分数，原始胜率会受到模型输出长度的影响。长度控制胜率通过一个回归模型，将胜率中由长度解释的部分移除，从而更纯粹地反映回答质量。这使其评估结果更加公平和可信。

    优势与局限

    - 优势：快速（评估一个模型仅需几小时API时间）、低成本、高可复现、与人类评估相关性较高。

    - 局限：依赖GPT-4，继承了其偏见；仅评估单轮对话；参考模型的选择会影响胜负的绝对数值；805条测试集可能无法覆盖所有长尾任务。


content:
  prompt: 19. 如何利用logit lens分析SFT前后模型内部表示的变化？
answer:
  mode: rubric
  reference_answer: |-
    Logit Lens是一种解释性技术，它允许我们窥探Transformer模型在生成文本时，其每一层对最终输出token的逐步信念。具体做法是：将某个中间层的隐藏状态，直接通过模型最后的语言模型头（LM head）映射到词表空间，得到该层的“早期预测”。

    分析SFT前后变化的步骤

    - 准备对比文本：选择一组具有代表性的指令，这些指令应该能区分SFT想要改变的行为（如安全拒绝、格式输出、特定风格）。

    - 提取Logit Lens数据：用SFT前和SFT后的模型分别处理这些指令。在生成第一个回答token时，记录模型每一层输出的logits（或概率排名）。

    - 比较层间预测轨迹：

    案例：安全对齐分析

    对一个有害指令，SFT前的基座模型可能在所有层都高概率预测出有害内容。SFT后的模型，在底层（1-10层）可能仍然会短暂“想到”有害内容，但在中间层（15-20层），安全拒绝的token概率会急剧上升并最终胜出。这表明SFT并没有完全删除模型的有害知识，而是在其上叠加了强大的内部控制，成功地在输出前“拦截”了有害生成。这一洞察对理解SFT的局限性至关重要。


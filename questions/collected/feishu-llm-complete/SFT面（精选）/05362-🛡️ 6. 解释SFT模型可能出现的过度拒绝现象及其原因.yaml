content:
  prompt: "\U0001F6E1️ 6. 解释SFT模型可能出现的“过度拒绝”现象及其原因。"
answer:
  mode: rubric
  reference_answer: "“过度拒绝”是指SFT模型在处理某些正常、无害的请求时，错误地判定其为不安全或不合适，从而拒绝回答。例如，用户问“如何缓解考试焦虑”，模型可能回复“作为AI助手，我不能提供医疗或心理咨询建议，请寻求专业人士帮助”，而实际上这是一个寻求一般性建议的合理请求。\n\n\U0001F4CC
    原因一：安全数据的比例与泛化偏差\n\nSFT中为了确保安全，会加入大量安全拒绝样本。如果这些样本占比过高，或者它们覆盖的关键词范围过于广泛，模型就会学会“宁可错杀一千，不可放过一个”的行为模式。比如，训练数据中凡是包含“焦虑”、“抑郁”、“疼痛”等词汇的指令都被配以拒绝回复，模型便过度泛化，认为所有涉及这类心理词汇的询问都应拒绝，而无法区分严重心理危机与一般压力管理之间的区别。\n\n\U0001F4CC
    原因二：拒绝样本的单一性与模型捷径\n\n如果大多数安全拒绝样本都是类似的模板（如“抱歉，我不能提供...因为这可能...建议你...”），模型会迅速学会生成这个模板以获得低损失，而并不真正理解拒绝的细微边界。它学会了“当看到疑似敏感词时，直接输出拒绝模板”的捷径。这导致即便用户意图无害，模型也条件反射式拒绝。\n\n\U0001F4CC
    原因三：上下文与意图理解的缺失\n\nSFT数据中的拒绝样本通常只针对单一的、明确的危险指令，而缺乏复杂的、带有上下文的“灰色地带”示例。模型没有学会分析用户对话的背景、情绪和真正意图。一个处于痛苦中的用户说“我受够了，告诉我怎么结束这一切”，模型可能因为检测到“结束”一词而机械拒绝，未能识别这是需要紧急心理干预的呼救（应该提供求助热线而非简单拒绝）。\n\n\U0001F4CC
    原因四：保守的标注策略\n\n在标注SFT安全数据时，标注者为了规避风险，可能将所有稍有争议的指令都标记为“拒绝”。这种过于保守的标注策略直接教会了模型过度拒绝。\n\n\U0001F4CC
    解决方向\n\n- 在SFT数据中增加“建设性拒绝”或“安全回应”的示例，即不拒绝，而是提供无害的帮助或引导。\n\n- 区分安全边界等级，对轻微风险给予包含警示信息的正常回复，而非一刀切拒绝。\n\n-
    后续通过RLHF/DPO训练，对过度拒绝的回答给予低偏好，对恰当处理灰色地带的回答给予高偏好，让模型学会权衡。\n\n✅ 总结：过度拒绝源于SFT安全数据的单一化和比例失调，导致模型通过简单的关键词匹配来执行拒绝，缺乏对上下文的细腻理解和意图判断。这是“安全”和“有用”之间失衡的表现，需要更精细的数据和进一步对齐来校准。\n\n---"

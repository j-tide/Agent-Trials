  prompt: "\U0001F3A8 46. 为什么说“数据配比”是一种艺术？有哪些科学指导？"
answer:
  mode: rubric
  reference_answer: |-
    数据配比之所以被称为“艺术”，是因为它涉及在多维目标间寻求平衡，而每个目标的相对重要性又随着应用场景、基座模型和用户期望的不同而动态变化。但艺术不意味着凭感觉，在经验的底色之上，有一系列科学原则可以作为指导。

    一、为什么配比是“艺术”？

    [嵌入表格未展开]

    这些不确定性叠加在一起，使得经验、直觉和对模型行为的“感觉”在配比决策中占据了不可替代的位置。这种需要在不确定条件下做出创造性决策的特性，正是“艺术”的体现。

    二、科学指导的框架

    尽管有“艺术”的成分，但数据配比并非玄学。以下科学原则和实践提供了系统性的指导：

    [嵌入表格未展开]

    三、一个系统的配比调优流程

    - 定义目标函数：不追求单一指标最大化，而是定义一个加权满意度函数，涵盖安全、有用、准确、流畅等多个维度。

    - 初始配比构建：基于基座模型能力评估和产品定位，构建一个初始配比。

    - 小规模快速验证：用初始配比训练一个小规模模型或进行少量步数的训练，评估能力雷达图。

    - 定向调整：针对雷达图中的短板，增加相应类别数据的配比；针对饱和的能力，适当降低配比。

    - 大规模验证：将调整后的配比用于完整训练，获得可靠评估结果。

    - 迭代收敛：重复上述过程，直到在资源允许的范围内找到满意解。

    四、从艺术走向工程的演进

    随着更多企业积累SFT经验，数据配比正在从“大师的手艺”逐步转变为“可复用的工程资产”。将成功项目的配比经验和失败教训沉淀为组织内部的知识库，建立配比决策的checklist和决策树，正在让数据配比从个人艺术走向团队科学。

    ✅ 总结：数据配比是艺术与科学的交汇。它需要经验直觉来应对多维冲突和不确定性，同时依赖基线测试、消融实验、能力雷达图和用户反馈闭环等科学方法提供系统指导。持续积累和迭代，能让配比从“玄学”走向“工程”，从个人手艺变为组织能力。


content:
  prompt: "\U0001F4D0 35. 课程学习如何应用于SFT数据组织？具体怎么设计难度？"
answer:
  mode: rubric
  reference_answer: |-
    课程学习（Curriculum Learning）将训练数据按照由易到难的顺序呈现给模型，让模型先掌握基础技能，再逐步攻克复杂任务。这一思想应用于SFT数据组织，能够显著提升训练稳定性和最终性能，尤其对于复杂推理和长约束任务效果显著。


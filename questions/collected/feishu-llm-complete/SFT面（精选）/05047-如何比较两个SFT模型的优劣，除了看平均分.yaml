content:
  prompt: 14. 如何比较两个SFT模型的优劣，除了看平均分？
answer:
  mode: rubric
  reference_answer: |-
    只看平均分是一种过于粗糙的做法，它会掩盖模型能力的结构性差异和统计不确定性。更深入地比较两个SFT模型，需要从以下多个维度进行。

    一、分能力维度的雷达图分析

    将评估集按能力维度（如推理、创造、安全、格式遵循）拆分，分别计算两个模型在各维度上的得分，绘制成能力雷达图。一个模型总平均分可能略高，但可能在“安全性”上存在严重短板。雷达图能直观暴露这种“偏科”问题，为决策提供更全面的信息。

    二、分任务难度的对比

    按问题难度（通过人类评分、模型困惑度等划分）分层比较。也许模型A在简单任务上胜出，但在高难度推理任务上远不如模型B。如果应用场景更看重解决复杂问题的能力，那么模型B可能更优，尽管其平均分较低。

    三、统计显著性检验（Bootstrap / paired test）

    两个模型在测试集上的平均分差异可能是由偶然波动造成的。必须进行统计显著性检验。常用的有Bootstrap重采样：从测试结果中有放回地抽取N次，计算每次的均值差，得到均值差的置信区间。如果置信区间不包含0，才可以声称差异是统计显著的。

    四、胜率与平局统计

    比较两条模型在同一条指令上的输出，评判哪个更好（或平局）。计算模型A相对于模型B的胜率、负率和平局率。这比比较平均分更直观，也更容易解释。但需要注意位置偏差（可通过交换位置双重评判解决）。

    五、错误模式分析

    这是最具诊断价值的部分。将两个模型的输出放在一起，由人工或强模型进行错误分类。A模型是不是更容易产生幻觉？B模型是不是更啰嗦？A是不是在处理否定式指令时经常失败？错误模式的差异揭示了模型底层行为特征的不同，可以为后续SFT数据迭代指明精确方向。

    六、用户满意度A/B测试

    如果条件允许，最权威的评估是将两个模型部署到线上，进行真实的A/B测试。通过收集用户点赞、点踩、任务完成率、对话轮次等隐式反馈，来评估哪个模型在实际使用中更受用户青睐。这是商业决策的最终依据。

    七、稳定性与方差

    除了均值，还要看方差。模型A可能在某个测试子集上表现极其优秀，但在另一些子集上非常糟糕（高方差）。模型B表现平稳但无亮点。在不同的应用场景下，风险偏好决定了哪种模型更合适。


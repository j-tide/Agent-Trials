content:
  prompt: "\U0001F504 18. 简述SPIN（Self-Play Fine-Tuning）的思想，它和SFT关系如何？"
answer:
  mode: rubric
  reference_answer: |-
    SPIN（Self-Play Fine-Tuning）是一种让LLM通过与自己对抗来提升自身能力的训练范式。它的核心思想源自博弈论中的自我对弈：模型同时扮演“生成者”和“判别者”，不断生成数据、辨别优劣、自我改进。


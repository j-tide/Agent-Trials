content:
  prompt: 8. 如何评估SFT模型的指令遵循准确率？
answer:
  mode: rubric
  reference_answer: |-
    评估SFT模型的指令遵循准确率，需要采用分层解构的方法，将“遵循指令”这一模糊概念拆解为可量化、可验证的具体维度。

    第一步：分类并定义约束

    将指令遵循能力划分为两大类：

    - 可验证约束：能被程序自动判定遵循与否，如长度限制、格式要求、关键词包含/排除、数字/日期格式等。

    - 软约束：需要语义理解的约束，如语气要求（幽默、正式）、角色扮演、逻辑一致性、回答是否真正解决了问题等。

    第二步：构建或选用分层测试集

    - 对于可验证约束，使用IFEval或类似的基于规则的测试集。直接使用其代码进行准确率计算。

    - 对于软约束，采用GPT-as-judge。构造prompt要求GPT-4针对“角色是否到位”、“语气是否合适”、“是否真正理解了用户意图”等维度进行细化评分。

    第三步：计算准确率的几种方式

    - 严格指令准确率：只有当一条指令的所有约束（可验证+软约束）都被满足时，才判定为“遵循”。这是最严苛的标准，能筛选出真正“听话”的模型。

    - 约束级别准确率：统计所有测试样本中，所有原子约束的通过率。这提供了模型在细粒度上的遵循能力画像，能看出模型是在哪个具体约束上容易失败。

    - 加权准确率：给不同重要性的约束赋予不同权重。例如，安全约束权重极高，格式约束次之，语气约束再次。

    第四步：人为错误分析

    自动评估给出总体分数后，抽样进行人工分析。找出最常见的失败模式：模型是忽略了指令（漏做），还是部分执行（少做），还是做了但不对（做错），或是过度执行（多做）。这种定性分析比单一分数更能指导SFT数据的迭代改进。


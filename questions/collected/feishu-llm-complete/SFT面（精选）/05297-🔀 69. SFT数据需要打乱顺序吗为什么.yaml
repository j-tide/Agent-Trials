content:
  prompt: "\U0001F500 69. SFT数据需要打乱顺序吗？为什么？"
answer:
  mode: rubric
  reference_answer: |-
    需要。而且不仅仅是需要，打乱的质量直接影响模型训练的效果。 不充分的打乱是SFT训练中一个隐蔽但影响深远的陷阱。

    一、数据不被打乱会导致什么问题？

    SFT数据通常是按来源或任务类型分批构造的。这意味着数据文件天然具有“聚集性”——可能前5000条全是翻译数据，接着8000条全是代码数据，然后3000条是安全数据。如果不打乱直接顺序训练：

    [嵌入表格未展开]

    二、打乱的正确方式

    全局打乱：最理想的方式是在每个epoch开始前，将整个数据集进行完全的随机打乱。这意味着任意两条数据相邻的概率是均匀的、随机的。一个batch内可能同时包含翻译、代码、闲聊和安全数据，梯度估计更加无偏，模型能够平稳地学习多种能力。

    分片级+缓冲区打乱：当数据量大到无法一次性全部加载到内存时，使用前面讨论的“分片+缓冲区”策略。每个epoch随机打乱分片顺序，然后在加载时使用大缓冲区进行分片间混洗。缓冲区大小至少是一个batch大小的10-20倍，才能提供足够的混洗均匀度。

    多轮数据的特殊处理：多轮对话数据通常是一个完整对话序列，不能将单个对话的轮次拆散后分别打乱——那会破坏对话的连续性。正确做法是将整个多轮对话视为一个不可分割的“数据单元”，以单元为单位参与打乱。这保证了同一对话内的上下文完整性，同时不同对话之间充分随机。

    三、不同训练阶段对打乱的需求差异

    - 训练初期（课程学习阶段）：如果采用课程学习，初期可能特意将简单数据集中在一起优先训练。此时不是“不打乱”，而是“在限定子集内打乱”——简单数据子集内部仍然是充分随机的。

    - 训练中期和后期：应该使用全局打乱，确保模型接触到完整的数据分布。

    - 微调和安全对齐阶段：可能需要有针对性地提高某些关键数据（如安全数据）的采样频率，但仍然需要在包含这些数据的同时进行整体打乱，而不是将它们隔离训练。

    四、打乱与数据增强的协同

    如果使用了数据增强（如指令改写），增强后的数据应与原始数据一起参与打乱，而不是将增强数据单独成块。这确保了模型不会在某个阶段“突然只看到增强数据”，造成分布偏移。

    五、打乱的随机种子管理

    为了实验的可复现性，打乱使用的随机种子需要记录。同时，不同epoch使用不同的种子，确保每个epoch的数据顺序不同，防止模型记忆数据的epoch级顺序。

    ✅ 总结：SFT数据必须打乱，且打乱必须充分。不充分的打乱会导致灾难性遗忘、梯度偏差和过拟合。对于大规模数据，采用分片+缓冲区策略实现近似全局打乱；多轮对话数据以完整对话单元参与打乱。打乱的随机种子需要管理以确保可复现性。


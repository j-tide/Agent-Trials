content:
  prompt: "\U0001F4AC 42. 为什么SFT很难学到“简洁优于冗长”的偏好？"
answer:
  mode: rubric
  reference_answer: |-
    这是一个典型的“隐性偏好”难题，根植于SFT的损失函数和训练数据的特性。

    一、交叉熵损失缺乏“简洁”意识

    SFT优化的是每个token的预测概率。对于模型来说，生成一个100字的正确答案，和生成一个200字但夹杂了50字客套话的正确答案，损失几乎是一样的（因为那些客套话在给定上下文中可能都具有高概率）。损失函数本身不惩罚长度，因此模型没有内在动力去学习简洁。它只被教导“要正确”，却不知道“用更少的字正确更好”。

    二、Teacher Forcing对安全长句的偏爱

    在SFT训练中，Teacher Forcing机制导致模型每一步都看到完美的上下文。对于长回答，模型发现插入“另外”、“值得一提的是”等转折词后，后续的真实token仍然能被高概率预测，因为这些冗余成分在训练数据中确实存在。这使得模型在推理时，一旦开始生成，就倾向于沿着这些高概率的“安全冗余”路径继续，导致回答冗长。它不知道“适可而止”也是好的。

    三、数据偏差：长回答往往是标注者的“安全选择”

    人类标注者在撰写回答时，往往觉得“长=详细=好”。他们很少冒险写出一个极其简洁但可能显得“不友好”或“不完整”的短回答，因为那更容易在审核中被标记为“低质”。这导致SFT数据中长回答比例被人为推高，模型从数据中学到的就是“长回答是常态”。

    四、偏好对比信号的缺失

    SFT数据通常只提供一个“正确答案”，没有同时展示“简洁版”和“冗长版”的对比，也没有告诉模型“简洁版更好”。模型无法从这种数据中推断出“简洁优于冗长”的相对偏好。要学习这种偏好，需要对比数据，这正是DPO/RLHF的领地。

    五、解决方案——将偏好转化为SFT信号

    尽管SFT本身难以学到此偏好，但可以通过条件化训练注入：在系统提示中加入“用简洁的风格”，并将简洁回答作为该条件下的正确回复。这样，模型学到的不是“简洁本身更好”，而是“在用户要求简洁时，简洁更好”。这提供了一种间接的控制方式。

    ✅ 总结：SFT无法内化“简洁优于冗长”的偏好，因为其损失函数对长度中性，训练数据偏向长回答，且缺乏对比信号。需要借助偏好对齐或条件化训练来注入这一偏好。


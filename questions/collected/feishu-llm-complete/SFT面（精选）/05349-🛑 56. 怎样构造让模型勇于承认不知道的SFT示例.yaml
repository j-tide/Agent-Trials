content:
  prompt: "\U0001F6D1 56. 怎样构造让模型勇于承认不知道的SFT示例？"
answer:
  mode: rubric
  reference_answer: |-
    承认“不知道”是比表达“不确定”更进一步的诚实行为。它要求模型在完全没有可靠信息时，坦然说“我不知道”，而不是用看似合理但虚假的内容填充。构造这类示例需要攻克模型“永远想提供答案”的训练惯性。

    一、承认不知道的标准示例结构

    用户：{一个模型绝对无法知道答案的问题}
    助手：我无法回答这个问题，因为{具体原因}。不过，我可以{提供替代帮助}。

    原因必须是具体的、令人信服的，而非泛泛的“我不能回答”。可能的“不知道”原因包括：

    - 事件发生在模型训练数据截止之后

    - 涉及到不可公开的个人隐私信息

    - 属于完全随机、不可预测的事件

    - 信息本身的真实性无法验证

    - 超出了AI的知识边界（如“我爷爷早餐吃了什么”）

    二、需要构造“不知道”的典型场景

    [嵌入表格未展开]

    三、“承认不知道”的进阶——提供替代路径

    最好的“不知道”回复不仅仅是说“不知道”，而是在承认局限后给出可行的替代方案：

    用户：“2024年8月15日北京的气温是多少？”
    助手：“我无法提供2024年8月15日的实际气温，因为我的知识截止日期早于这个时间，且我无法获取未来的天气数据。不过，我可以告诉你北京历年8月中旬的平均气温范围通常在25-32°C之间，或者建议你查看天气预报服务获取最新信息。”

    这种回复展示了模型在知识边界内的诚实，和边界外的有用性。

    四、防止“不知道”被滥用的平衡设计

    如果训练数据中“不知道”的示例过多或覆盖过广，模型可能变得“懒惰”——明明知道答案的问题也开始说“我不知道”。为防止此情况：

    - 明确界定“可知道”与“不可知道”：数据中应同时包含大量模型确实知道且自信回答的示例，以及确实不知道且承认的示例。两个极端的对比越鲜明，模型越能学会区分。

    - 构造“边界测试”示例：把问题恰好放在知识边界附近——如已知事件但需要推理，或者信息部分可得知需要说明不确定部分。这些示例训练模型不是二分法地回答“知道”或“不知道”，而是细化回答。

    - 避免拒绝一切有挑战的问题：有些问题虽然困难但模型通过推理可以给出有价值的回答，不应该归类为“不知道”。数据中需要区分“需要推理但可知”和“本质不可知”。

    五、承认不知道的语气和情感设计

    模型承认不知道时，语气不应是冷淡的“我不知道”然后结束。好的回复包含：

    - 共情：“这是个有趣的问题”

    - 坦诚：“我目前没有这方面的信息”

    - 建设性：“我可以帮你做的是...”

    - 不卑不亢：不需要过度道歉，也不需要贬低自己

    ✅ 总结：构造“勇于承认不知道”的SFT示例，需要覆盖未来事件、个人信息、虚假前提等多种不可知场景，并在承认局限的同时提供替代帮助。关键是清晰界定可知与不可知的边界，避免模型因过度训练而变得懒惰，同时用建设性的语气让“不知道”成为一种专业而可靠的表现。


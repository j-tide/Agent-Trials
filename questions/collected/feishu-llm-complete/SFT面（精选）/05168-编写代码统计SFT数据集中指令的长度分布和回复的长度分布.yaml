answer:
  mode: rubric
  reference_answer: |-
    ```python
    import json
    import matplotlib.pyplot as plt
    from transformers import AutoTokenizer

    def analyze_length_distribution(jsonl_file: str, tokenizer_name: str = 'gpt2'):
        tokenizer = AutoTokenizer.from_pretrained(tokenizer_name)
        instr_lens = []
        resp_lens = []
        with open(jsonl_file, 'r', encoding='utf-8') as f:
            for line in f:
                obj = json.loads(line)
                instr = obj.get('instruction', '')
                resp = obj.get('output', '')
                instr_lens.append(len(tokenizer.encode(instr)))
                resp_lens.append(len(tokenizer.encode(resp)))

        fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(12, 5))
        ax1.hist(instr_lens, bins=50, alpha=0.7)
        ax1.set_title('Instruction Length Distribution')
        ax2.hist(resp_lens, bins=50, alpha=0.7, color='orange')
        ax2.set_title('Response Length Distribution')
        plt.show()
        return instr_lens, resp_lens
    ```

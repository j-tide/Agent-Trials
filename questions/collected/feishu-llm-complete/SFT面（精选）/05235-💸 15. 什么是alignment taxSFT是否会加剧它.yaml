content:
  prompt: "\U0001F4B8 15. 什么是“alignment tax”？SFT是否会加剧它？"
answer:
  mode: rubric
  reference_answer: |-
    对齐税（Alignment Tax） 是指在对模型进行对齐训练（SFT、RLHF/DPO）以使其更安全、更有用、更符合人类期望的过程中，模型在某些通用能力（如知识问答、推理、编码）上出现的性能下降现象。这是一种“为了安全与可控而付出的能力代价”。

    一、对齐税的具体表现

    - 基准分数下降：对齐后的模型在MMLU、GSM8K、HumanEval等学术基准上，得分通常低于同架构的预训练基座模型，甚至低于只经过SFT的模型。

    - 知识丢失与幻觉增加：模型可能因为过度强调安全或特定风格，而遗忘了预训练中的部分长尾知识，或因为学会了“自信”的语调而更容易在知识边界处编造内容。

    - 创造力与多样性衰减：对齐训练倾向于将模型输出分布推向“高偏好”的狭窄区域，导致创意写作、头脑风暴等开放式任务的回复千篇一律。

    - 过度保守：模型学会了过度拒绝，将一些合法的请求也误判为不可回答，造成“有用性”下降。

    二、SFT是否会加剧对齐税？

    是的，SFT是对齐税的主要贡献者之一，甚至在某种程度上是“始作俑者”。 具体机制如下：

    - 灾难性遗忘：如果SFT数据量有限且领域单一，或者训练过度，模型会显著遗忘预训练阶段学到的广博知识和推理能力。这是对齐税最直接的表现。

    - 分布坍缩：SFT将模型的输出分布从预训练的“广阔海洋”压缩到SFT数据定义的“人工湖”中。这直接导致了语言多样性的丧失和创造力的减退。

    - 模仿偏见：SFT数据中的回答风格（如详细、固定结构、礼貌）被模型过度内化，使其倾向于生成冗长、模板化的内容，压制了简洁、直接或富有创新的表达。这也是对齐税的一种体现。

    - 安全数据的过度泛化：SFT中的安全拒绝样本可能导致模型变得过度敏感，将许多正常请求也纳入拒绝范围，导致有用性下降。

    - 捷径学习：SFT模型可能学会依赖表面关键词来完成任务，而非真正的理解，这会在需要深层推理的基准测试中暴露，体现为性能下降。

    三、如何缓解SFT带来的对齐税

    - 在SFT数据中混入少量通用预训练文本，缓解灾难性遗忘。

    - 控制SFT训练轮数（1-3 epoch），避免过拟合和分布坍缩。

    - 使用LoRA等PEFT方法，冻结基座模型大部分参数，从根源上减少遗忘。

    - 后续通过RLHF/DPO，使用KL惩罚或偏好数据来鼓励模型在保持有用性的同时，不过度偏离预训练分布。

    - 在SFT数据中刻意增加不同风格和创造性的示例，维持输出的多样性。

    ✅ 总结：对齐税是模型对齐不可避免的代价。SFT因其灾难性遗忘、分布坍缩和捷径学习等特性，会显著加剧对齐税。但通过精心设计数据和训练策略，可以将这种税收降到最低。


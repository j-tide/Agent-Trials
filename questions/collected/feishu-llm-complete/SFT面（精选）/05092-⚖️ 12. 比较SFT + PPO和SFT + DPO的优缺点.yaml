content:
  prompt: "⚖️ 12. 比较SFT + PPO和SFT + DPO的优缺点。"
answer:
  mode: rubric
  reference_answer: |-
    SFT之后的主流对齐路径有两条：结合PPO（近端策略优化）的强化学习，或使用DPO（直接偏好优化）。两者都依赖SFT作为起点，但在后续优化机制、资源需求和稳定性上差异显著。

    [嵌入表格未展开]

    一、SFT + PPO的优势与挑战

    PPO的最大优势在于在线探索。模型不断生成新的回答，奖励模型实时打分，PPO根据这些在线样本更新策略。这使得模型有可能发现离线数据中从未出现过的、更高奖励的生成策略。然而，PPO的训练流程极其复杂：需要训练并持续更新奖励模型，需要平衡KL惩罚的系数，需要处理PPO的clip范围、价值函数训练等超参数。任何一环出错，都可能导致策略退化或奖励破解。此外，在线生成样本的计算开销很大，尤其是在模型规模庞大时。

    二、SFT + DPO的优势与取舍

    DPO通过巧妙的数学变换，将对奖励的优化直接转化为策略的对数似然比最大化，完全去掉了显式奖励模型和在线RL。其训练就像做SFT一样简单：准备好一批“好回答 vs 坏回答”的对比数据，然后优化一个对比损失。这大大降低了工程门槛，也避免了RL训练中的不稳定性。但DPO的局限在于“离线”——它只能从给定的偏好数据中学习，无法探索新的可能性。如果偏好数据质量不高、覆盖不全，DPO模型的能力上限可能受到限制。

    三、选择建议

    - 如果你拥有强大的工程团队、充足的在线服务算力，并且希望挖掘模型在探索中可能涌现的超越标注数据的新能力，SFT + PPO 是更强但更冒险的选择。

    - 如果你追求快速、稳定、低成本的迭代，或者偏好数据已经比较充分和高质量，SFT + DPO 是目前性价比最高、也最主流的选择。

    ✅ 总结：SFT+PPO探索性强、上限高但复杂昂贵；SFT+DPO简单稳定、成本低，但对数据质量依赖大。两者都是建立在SFT地基上的精装修，各擅胜场。


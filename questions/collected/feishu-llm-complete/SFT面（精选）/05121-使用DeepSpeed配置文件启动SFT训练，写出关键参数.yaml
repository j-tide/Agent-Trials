content:
  prompt: 使用DeepSpeed配置文件启动SFT训练，写出关键参数
answer:
  mode: rubric
  reference_answer: |-
    DeepSpeed配置文件 ds_config.json 示例（ZeRO-2 + CPU offload）：

    ```json
    {
      "train_batch_size": 16,
      "gradient_accumulation_steps": 4,
      "optimizer": {
        "type": "AdamW",
        "params": {
          "lr": 2e-5,
          "weight_decay": 0.1
        }
      },
      "fp16": {
        "enabled": false
      },
      "bf16": {
        "enabled": true
      },
      "zero_optimization": {
        "stage": 2,
        "offload_optimizer": {
          "device": "cpu",
          "pin_memory": true
        },
        "allgather_partitions": true,
        "allgather_bucket_size": 5e8,
        "overlap_comm": true,
        "reduce_scatter": true,
        "reduce_bucket_size": 5e8,
        "contiguous_gradients": true
      },
      "gradient_clipping": 1.0,
      "steps_per_print": 10
    }
    ```

    启动命令：

    ```bash
    deepspeed --num_gpus=4 train.py --deepspeed ds_config.json
    ```

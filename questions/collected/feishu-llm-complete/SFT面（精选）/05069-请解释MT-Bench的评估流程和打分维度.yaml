content:
  prompt: 5. 请解释MT-Bench的评估流程和打分维度。
answer:
  mode: rubric
  reference_answer: |-
    MT-Bench 是由LMSYS Org提出的一种用于评估聊天助手模型的多轮对话基准测试。它被设计用来衡量模型在多轮交互、复杂指令遵循和通用对话能力上的表现，弥补了传统单轮基准的不足。

    评估流程

    - 多轮对话测试设计：MT-Bench包含80个精心设计的多轮对话问题。这些问题被分为8个主要能力类别：写作、角色扮演、头脑风暴、推理、数学、编码、知识、提取。每个问题通常包含两轮对话，模拟真实用户与助手的连续互动（例如，第一轮是开放式问题，第二轮是要求细化、修改或深入）。

    - 模型生成回答：被评估的SFT模型针对每个问题生成多轮回答。对话历史被保留，以确保回答的上下文一致性。

    - GPT-4作为评判者：生成完毕后，使用GPT-4对模型回答进行打分。GPT-4同时看到用户问题、参考回答（如果有）以及被评估模型的回答。

    - 逐轮打分与综合：GPT-4对每一轮对话单独打分，然后两轮分数取平均作为该问题的最终得分。最终所有问题得分的平均即为模型的MT-Bench总分。

    - 多维度评判：GPT-4被要求从多个维度综合考量，包括准确性、有用性、流畅度、参与度和创造力。裁判同时被要求给出一个综合打分（1-10分）。

    核心优势

    - 多轮评估：捕获了模型在上下文记忆、指令细化和深入对话方面的能力，这是单轮基准无法做到的。

    - 强评判：使用当前最强模型GPT-4作为裁判，评分与人类判断具有高度一致性。

    - 多能力覆盖：8个类别全面测试了模型的不同技能，能够绘制出模型的能力雷达图。

    局限

    - 依赖GPT-4的评判质量：GPT-4自身存在偏好（如可能偏好更详细的回答），且成本较高。

    - 语言和文化限制：问题设计和评判标准主要以英语和西方语境为主。

    - 测试用例有限：每个类别仅10个问题，统计上可能存在抽样误差。


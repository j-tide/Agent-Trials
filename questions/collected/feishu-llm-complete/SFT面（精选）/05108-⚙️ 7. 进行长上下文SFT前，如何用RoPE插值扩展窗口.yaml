  prompt: "⚙️ 7. 进行长上下文SFT前，如何用RoPE插值扩展窗口？"
answer:
  mode: rubric
  reference_answer: |-
    RoPE（旋转位置编码）本身支持对序列长度的灵活泛化，但直接外推到训练时未见过的更长序列，通常会导致性能显著下降。RoPE插值是一种有效的“再校准”技术，通过在推理（或SFT）时对位置编码进行数学变换，使得模型能够在超出预训练长度的上下文中稳定工作。


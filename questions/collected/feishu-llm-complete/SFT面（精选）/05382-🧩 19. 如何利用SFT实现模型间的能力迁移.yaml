content:
  prompt: "\U0001F9E9 19. 如何利用SFT实现模型间的“能力迁移”？"
answer:
  mode: rubric
  reference_answer: |-
    SFT是连接不同模型能力的桥梁。通过精心设计数据和训练流程，我们可以将一种模型的特有能力（如数学推理、代码生成、安全对齐）迁移到另一个基础模型上，即使目标模型原本不具备该能力。

    一、能力迁移的三种典型范式

    - 跨架构能力迁移：将GPT-4的强推理能力，迁移到一个Llama架构的小模型上。这是最常见的需求。

    - 跨领域能力迁移：将一个在通用领域表现优异的模型，通过领域特定的SFT数据，迁移为专业的医疗或法律助手。

    - 跨语言能力迁移：将英文模型强大的指令遵循能力，通过多语言SFT数据，迁移到其他低资源语言上。

    二、实现能力迁移的SFT数据构建策略

    核心思想是分离“能力”与“形式”，用目标能力的数据教会模型“如何做”，用目标风格的数据教会模型“如何说”。

    - 能力数据提取：我们需要从源模型中，提取出体现目标能力的“精髓”。这通常不是简单的问答对，而是包含详细思维链、推理步骤和解释的数据。例如，要迁移数学推理能力，我们可以让源模型（如GPT-4）生成大量带有逐步推导过程的数学题解，构成SFT数据，然后用这些数据训练目标模型。目标模型通过模仿这些推导过程，学会了“如何思考”。

    - 风格对齐数据混合：如果只用源模型的数据进行SFT，目标模型可能会在思考方式上像源模型，但在语言风格、安全边界上产生“水土不服”。因此，SFT数据中必须混入用目标模型期望风格写成的回答。例如，在迁移能力的同时，加入用目标语言书写的、符合目标助手角色的对话数据，以确保模型的能力是“长在”正确的行为框架上的。

    - 课程式迁移学习：对于复杂能力的迁移，可以采用课程学习策略。第一阶段，用大量中低难度、带详细解释的数据进行SFT，让目标模型初步掌握该能力的格式和基础逻辑。第二阶段，引入更高难度、需要多步推理的数据，并适当减少解释，迫使模型内化推理能力。第三阶段，进行多任务混合训练，将新学到的能力与原有的对话、安全能力进行融合。

    三、能力迁移的验证与迭代

    迁移完成后，不能只看目标能力基准的得分，必须进行全面的能力评估。

    - 能力保持度：测试迁移后，目标模型原有的通用能力（如知识问答、对话连贯性）是否严重下降。

    - 迁移效能：用目标能力基准（如数学的GSM8K）量化迁移过来的能力达到了源模型的多少百分比。

    - 能力融合度：评估模型能否将新能力与旧能力结合。例如，能否用新学的推理能力，来分析一段对话中的情感变化，并以自然的风格给出回应。
    如果出现灾难性遗忘或能力融合失败，就需要调整上述SFT数据配比，重新迭代。

    ✅ 总结：SFT实现模型间能力迁移的关键，在于构建包含源模型思维过程的“能力数据”，并将其与目标模型的“风格数据”按课程学习的方式混合训练，最终实现能力在新框架下的内化与融合。


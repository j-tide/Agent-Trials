content:
  prompt: 1. SFT模型评估的常用自动指标有哪些？各自的局限是什么？
answer:
  mode: rubric
  reference_answer: |-
    SFT模型的自动评估指标主要分为两类：一类是基于参考文本的词汇重叠度指标，另一类是直接评估生成质量的神经指标。它们各有长短，在实践中通常组合使用。

    [图片内容未导入]

    基于词重叠的指标

    - BLEU：最初用于机器翻译，衡量生成文本与参考文本在n-gram层面的匹配度。它计算精确率，并对过短的生成施加长度惩罚。核心局限在于它是“精确匹配”的拥趸——对于“今天天气真好”和“今日天气极佳”这种语义相同但用词不同的情况，BLEU会给出极低的分数。此外，它只关注精确率而忽略召回率，无法反映生成内容是否遗漏了参考文本中的关键信息。在开放式对话和创意写作任务中，BLEU几乎毫无参考价值。

    - ROUGE：面向召回率的指标，主要考察参考文本中的n-gram有多少在生成文本中出现。ROUGE-L通过最长公共子序列来捕捉语句层面的相似度。ROUGE的局限与BLEU类似：它对语义变化不敏感。而且ROUGE高度依赖参考文本的完备性——如果参考文本只有一种表达方式，模型生成了另一种同样正确但措辞不同的回答，ROUGE得分会很低。它在摘要任务上表现尚可，但在对话和指令遵循任务中区分度不足。

    - METEOR：在BLEU的基础上引入了同义词匹配、词干还原和词序考量，试图缓解严格词汇匹配的问题。它更接近人类的判断，但计算复杂，且仍然停留在词汇层面，无法理解更深的语义和逻辑。

    基于模型的方法

    - BERTScore：用预训练BERT模型的上下文嵌入来计算生成文本和参考文本中每个token的相似度，然后进行贪心匹配。它能够捕捉词汇变化后的语义相似性，是目前最推荐的词汇层指标。局限在于它仍然需要参考文本，且对长文本计算较慢。更重要的是，BERT本身不理解事实性——它能判断两句话语义相似，但不知道它们是否都错了。

    - BLEURT：在BERTScore的基础上，用大量人工评分数据训练了一个专门的评分模型。它能学习到“流畅度”、“语法性”等更抽象的质量维度。局限是它是一个黑盒模型，评分逻辑不可解释，且训练数据中的评分偏见（如偏好长句）会被它内化。

    这些指标的共同局限

    上述所有指标都依赖一个或多个参考回答。但在SFT的开放域对话中，一个好问题可以有无数个合理回答。缺乏参考多样性是所有这些指标的致命伤。因此，它们更适合有明确标准答案的任务（如数学计算、代码生成、翻译），而在衡量创造力、详细程度和是否真正“有用”时，需要结合人工评估或强模型评判。


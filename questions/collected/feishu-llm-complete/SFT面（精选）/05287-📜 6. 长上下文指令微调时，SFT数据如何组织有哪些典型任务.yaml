content:
  prompt: "\U0001F4DC 6. 长上下文指令微调时，SFT数据如何组织？有哪些典型任务？"
answer:
  mode: rubric
  reference_answer: |-
    长上下文指令微调的目标是让模型能够处理超长输入（如整本书、超长对话历史、大规模代码库），并从海量信息中提取、推理和综合。这要求SFT数据在组织形式和任务类型上进行专门的设计。

    一、长上下文数据的组织形式

    不能简单地将长文本和问题拼接。为了最大化训练效率，通常采用以下组织方式：

    - “上下文+指令+答案”的三段式结构
    数据通常包含三个部分：一段极长的上下文（Context）（如一篇论文、一部小说的一章、一段完整的客服对话记录），一个具体的用户指令（Instruction），以及基于该上下文的标准答案（Response）。上下文被完整地放置在指令之前，作为提示的一部分。

    - 关键信息分散化
    在长上下文中，回答指令所需的关键信息应该被分散在文档的不同位置，而不是集中在一处。这迫使模型学习跨越长距离的信息检索和综合，而不是仅仅利用开头或结尾的局部信息。

    - “大海捞针”式的数据插入
    可以自动构造数据：取一个长文档（如新闻语料），随机将一句与文档完全无关的事实（“针”）插入到文档的随机位置（如25%、50%、75%深度）。然后，用直接针对该事实的问题作为指令，答案就是该事实。这种数据能极大强化模型在长文本中定位任意位置信息的能力，直接解决“中部迷失”问题。

    - 多文档综合
    上下文不是单个文档，而是多个来源（如多篇新闻、多个维基百科页面）。指令要求模型综合这些文档中的信息回答一个问题，或者比较不同文档的观点。这训练了模型处理多源信息的能力。

    二、典型的长上下文任务类型

    为了全面覆盖长上下文能力，SFT数据应包含以下几种典型任务：

    - 长文档问答：基于一篇长文档（如法律文件、财报、学术论文）回答具体的事实性问题或需要进行多步推理的问题。例如，“根据这份财报，该公司在第三季度的净利润增长率是多少？与第二季度相比如何？”

    - 多跳推理与信息链接：问题需要从文档的不同部分找到两个或多个事实，并将其链接起来才能得到答案。例如，在一篇小说中，“主角在第一章遇到的陌生人，和他在第五章收到的信的落款人之间有什么关系？”

    - 长文档摘要：将一篇长文档（或文档的某个部分）总结为一段简洁的文本。可以训练模型生成不同详细程度的摘要。

    - 对话历史分析：输入一段极长的客服对话或多轮会议记录，要求模型总结讨论的主要议题、各方立场、待办事项，或回答“在会上，关于项目延期，谁提出了什么解决方案？”

    - 代码库理解与生成：输入一个包含多个文件的项目代码库（上下文），要求模型回答关于代码结构、功能的问题，或者根据要求修改/新增功能。

    - 时间线重建：给出一个时间跨度很长的事件列表或叙述，要求模型重建按时间顺序的完整事件链，或回答时序相关的问题。

    三、SFT时需要注意的训练策略

    - 位置编码扩展：在组织长上下文数据前，通常已经通过RoPE插值等方法扩展了模型的上下文窗口。SFT是固化这种扩展能力的关键步骤。

    - 混合训练：长上下文SFT数据应与常规长度的SFT数据混合训练，以防止模型遗忘短文本上的对话能力。

    - Loss Mask与数据截断：对于超长上下文，若超出模型最大长度，应优先保留开头和结尾的部分，或进行智能截断。指令和答案部分通常较短，应确保其完整，损失只计算在答案部分。

    ✅ 总结：长上下文SFT数据通过三段式结构、信息分散化、多文档综合和针对性的任务类型（如多跳QA、摘要、代码库理解），系统性地训练了模型在超长序列中的信息定位、综合和推理能力。


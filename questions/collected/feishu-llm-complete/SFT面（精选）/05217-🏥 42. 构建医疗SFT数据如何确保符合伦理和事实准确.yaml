answer:
  mode: rubric
  reference_answer: |-
    医疗SFT数据与法律数据一样，直接关系到人的生命健康安全，对伦理合规和事实准确性的要求达到最高级别。一条错误的信息可能导致延误治疗、错误用药，甚至危及生命。

    一、医疗SFT数据的伦理准则

    [嵌入表格未展开]

    二、事实准确性的保障体系

    医疗SFT数据的事实准确性保障需要一个多层次的校验系统：

    第一层：权威来源约束

    所有医学事实必须来源于权威机构（如WHO、FDA、国家卫健委）发布的指南，或发表在同行评议医学期刊上的研究。数据中引用的统计数字和结论必须可追溯到原始来源。

    第二层：医学专家编写与审核

    医疗SFT数据应由具有执业资格的医学专业人员编写，并由另一位同等资质的专家进行独立审核。两人对同一事实的确认，大幅降低了个人知识偏差导致的错误。

    第三层：时效性管理

    医学知识更新迅速，SFT数据需要标注“知识截止日期”或“最后审核日期”。建立定期复审机制，对超过一定时间（如两年）未更新的数据进行重新审核。

    第四层：不确定性表达

    对于医学上存在争议或证据不充分的问题，回复必须诚实地反映这种不确定性，而不是给出武断的结论。例如：“目前的研究结果存在分歧，部分研究表明A，但也有研究支持B。”

    三、应对医疗特殊场景的数据设计

    - 症状查询：模型应引导用户提供更完整的信息，而不是基于不完整描述给出结论。数据中需要包含模型追问的示例。

    - 药物信息查询：回复必须包含药物的主要适应症、常见副作用、禁忌症和重要的药物相互作用警告，而不是简单罗列药名。

    - 心理健康场景：对于表现出自残或自杀倾向的描述，回复中必须包含心理危机干预热线号码，并用温和但坚定的语言引导用户寻求专业帮助。

    四、医疗SFT数据的分类与标记

    医疗SFT数据内部应进行细粒度的风险分级：

    - 低风险：通用健康知识、营养建议、运动指导

    - 中风险：非处方药信息、慢性病生活方式管理

    - 高风险：症状解读、药物相互作用、孕产期健康

    - 紧急：可能危及生命的症状描述

    不同风险等级的数据在审核流程和表达要求上有所区别。高风险和紧急类数据的审核标准应最严格。

    ✅ 总结：医疗SFT数据必须遵循不诊断、不开药、紧急优先、信息循证、隐私保护和强制免责的伦理准则，并通过权威来源约束、医学专家双重审核、时效管理和不确定性表达来保障事实准确。风险分级管理是确保安全的有效手段。


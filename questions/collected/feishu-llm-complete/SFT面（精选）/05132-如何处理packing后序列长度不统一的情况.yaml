content:
  prompt: 如何处理packing后序列长度不统一的情况？
answer:
  mode: rubric
  reference_answer: |-
    在实现packing时，我们通常设定一个固定的最大序列长度（例如2048或4096），然后将多个短样本拼接直到接近这个长度。但现实中的样本长度组合很难恰好填满，总会有一些剩余空间装不下下一个样本，或者某些样本本身就超过了最大长度。处理这些情况需要制定清晰的策略。

    一、主要处理方法

    - 截断（Truncation）

    - 对超长样本：如果某条样本（prompt+response）本身超过了max_seq_length，必须进行截断。通常策略是只保留最后max_seq_length个token（因为对话的尾部通常包含更直接的指令和回答），或者只截断prompt保留response，或反之。更优的做法是保证response完整，截断prompt的前半部分。

    - 对装不下的样本：在拼接时，如果当前已拼接的序列加上下一个样本会超出max_seq_length，则可以选择：① 直接截断该样本，使其恰好填满剩余空间（会损失该样本的部分信息，可能截断response）；② 跳过该样本，用更短的样本填充剩余空间；③ 将该样本移到下一个pack中。

    - 填充（Padding）

    - 如果使用了packing，剩余的少量空间通常不值得用padding填充，因为这样会降低效率。但有时为了确保batch内的序列长度一致（例如不使用动态形状），需要padding到统一长度。一般优先选择“放弃填充”，采用动态序列长度，让每个batch中的pack都接近指定长度但不完全一致，现代框架支持动态shape，效率损失很小。

    - 动态调整packing

    - 不需要预先固定每个pack的样本组成，而是在DataLoader中动态地尽量填满一个buffer。例如使用pack_dataset算法：从数据集中逐个取出样本，如果当前pack的剩余长度大于样本长度，则加入；否则将当前pack送入batch，并开启新pack。这样产生的pack长度不完全一致，但都在max_seq_length附近，且padding极少。

    - 可以在batch内对序列长度进行排序，相似长度的pack放在一起，以减少padding（如果使用padding的话）。

    二、如何处理长度不统一

    - 使用attention_mask：PyTorch等框架支持通过attention_mask来忽略padding位置。即使在一个batch内，不同样本的pack长度不同，我们可以将较短的pack用pad token填充到最长长度，并在attention_mask中将padding位置标记为0。损失计算时同样通过label=-100忽略padding。

    - 使用packed序列的动态batch：更先进的做法是不再使用固定shape的tensor，而是将batch中的所有pack连接成一个长的一维序列，并记录每个序列的起始位置（类似cu_seqlens），这样可以完全消除padding，实现极致的计算效率。这种格式在一些高效训练库（如FlashAttention的varlen接口）中得到支持。不过实现较复杂。

    三、对训练的影响

    - 如果采用截断，可能会丢失部分样本的上下文，尤其是当样本长度长尾严重时。对于SFT，可以监控被截断样本的比例，控制在1%以内。

    - 如果采用跳过，会导致这些样本被训练次数减少，可能削弱对长文本的处理能力。更好的办法是将长样本单独处理（例如不参与packing，独立成batch），或者设置更大的max_seq_length。

    ✅ 总结：packing后的长度不统一可通过截断、跳过或动态拼接来处理。结合attention mask和变长序列支持，可以最大程度减少padding，保持高效训练。关键是合理设置最大长度和截断策略，确保模型仍能学习到长样本的特征。


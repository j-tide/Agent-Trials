content:
  prompt: "\U0001F4D0 44. 分析SFT和DPO在梯度更新方向上的异同。"
answer:
  mode: rubric
  reference_answer: |-
    SFT和DPO的梯度都用于更新语言模型的参数，但由于损失函数的设计不同，它们的梯度更新方向有着本质区别。

    一、SFT的梯度：单向拉向目标token
    SFT的损失函数是标准的交叉熵。对于每个被训练的token yt（来自黄金回答），其梯度可以简化为：

    [图片内容未导入]

    这个梯度只指向提高目标回答序列 y 的似然。它不关心其他任何可能的输出。形象地说，SFT的梯度是一只“向上拉”的手，把所有概率质量都聚焦到数据中的那一个黄金样本上。

    二、DPO的梯度：对比式的推拉

    DPO的损失函数是对比损失。其梯度（经过简化）形式如下：

    [图片内容未导入]

    三、梯度方向对模型分布的影响

    - SFT：导致概率分布变得尖锐，模式坍缩。所有未被标注为黄金回答的回答，无论好坏，概率都被动下降。

    - DPO：可以有选择地重塑概率分布。它保留甚至增强偏好区域，同时主动抑制非偏好区域，但其他区域（没有出现在对比对中的合理回答）的概率可以保持相对稳定（受KL约束）。这使得DPO在提升质量的同时，能更好地维持多样性。

    四、异同总结

    - 相同点：都包含提高目标文本似然的梯度分量。

    - 不同点：SFT没有抑制错误输出的梯度分量，而DPO有。这使DPO的更新更具方向性、选择性，能更有效地进行“质量筛选”，而SFT只是在做“质量集中”。

    ✅ 总结：SFT梯度是单方向的“聚光灯”，只照亮黄金样本；DPO梯度是“推土机+聚光灯”，在照亮好样本的同时，主动把差样本推开，从而更精细地塑造输出分布。


content:
  prompt: 实现LoRA线性层的定义及参数初始化
answer:
  mode: rubric
  reference_answer: "LoRA 在原始线性层旁添加低秩矩阵 A 和 B，前向时输出为 Wx + (α/r) * BAx。下面实现一个可配置的 LoRA
    线性层。\n\n```python\nimport torch\nimport torch.nn as nn\nimport math\n\nclass LoRALinear(nn.Module):\n
    \   def __init__(self, in_features: int, out_features: int, r: int = 8, lora_alpha:
    int = 16, \n                 bias: bool = True, dropout: float = 0.0):\n        super().__init__()\n
    \       self.in_features = in_features\n        self.out_features = out_features\n
    \       self.r = r\n        self.lora_alpha = lora_alpha\n        self.scaling
    = lora_alpha / r\n        \n        # 原始线性层，权重冻结\n        self.linear = nn.Linear(in_features,
    out_features, bias=bias)\n        self.linear.weight.requires_grad = False\n        if
    bias:\n            self.linear.bias.requires_grad = False\n        \n        #
    LoRA 低秩矩阵 A (降维) 和 B (升维)\n        self.lora_A = nn.Parameter(torch.zeros(r, in_features))\n
    \       self.lora_B = nn.Parameter(torch.zeros(out_features, r))\n        self.lora_dropout
    = nn.Dropout(dropout) if dropout > 0 else nn.Identity()\n        \n        # 参数初始化\n
    \       self.reset_lora_parameters()\n        \n    def reset_lora_parameters(self):\n
    \       # A 使用 Kaiming 初始化或正态分布，B 初始化为零，确保初始时 BAx = 0\n        nn.init.kaiming_uniform_(self.lora_A,
    a=math.sqrt(5))\n        nn.init.zeros_(self.lora_B)\n        \n    def forward(self,
    x):\n        # 原始线性输出 (冻结)\n        result = self.linear(x)\n        # LoRA 增量\n
    \       lora_out = self.lora_dropout(x) @ self.lora_A.T  # (..., in) @ (in, r)
    -> (..., r)\n        lora_out = lora_out @ self.lora_B.T               # (...,
    r) @ (r, out) -> (..., out)\n        result = result + self.scaling * lora_out\n
    \       return result\n```\n\n说明：\n\n- 原始线性层权重被冻结 (requires_grad=False)。\n\n-
    LoRA 的 A 矩阵维度为 (r, in)，B 为 (out, r)。scaling 因子为 lora_alpha / r。\n\n- 通过将 B 初始化为零，训练开始时
    LoRA 的增量为零，不会破坏原始输出。\n\n---"

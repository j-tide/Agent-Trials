content:
  prompt: 手写Top-P（nucleus）采样算法
answer:
  mode: rubric
  reference_answer: |-
    Top-P 采样从累积概率超过阈值 p 的最小 token 集合中随机采样下一个 token。

    ```python
    import torch

    def top_p_sampling(logits: torch.Tensor, p: float = 0.9, temperature: float = 1.0) -> int:
        """
        对 logits 应用 Top-P (nucleus) 采样，返回采样得到的 token id。
        参数:
            logits: 形状 (vocab_size,) 的未归一化 logits
            p: 核采样阈值
            temperature: 温度系数，控制分布锐度
        """
        # 1. 温度缩放
        if temperature > 0:
            logits = logits / temperature
        # 2. 转为概率
        probs = torch.softmax(logits, dim=-1)
        # 3. 按概率降序排列
        sorted_probs, sorted_indices = torch.sort(probs, descending=True)
        cumsum_probs = torch.cumsum(sorted_probs, dim=-1)
        # 4. 去除累积概率超过 p 的尾部
        mask = cumsum_probs <= p
        # 至少保留一个 token，所以将第一个 token 强制保留
        mask[0] = True
        # 5. 对筛选后的子集重新归一化
        filtered_probs = sorted_probs * mask.float()
        filtered_probs = filtered_probs / filtered_probs.sum()
        # 6. 从筛选后的分布中采样
        sampled_idx = torch.multinomial(filtered_probs, 1).item()
        # 7. 映射回原始 token id
        return sorted_indices[sampled_idx].item()
    ```

    说明：

    - p 通常设为 0.9 或 0.95，以避免过于离奇的 token。

    - 温度 temperature 可调节随机性：越高越随机，越低越贪婪。


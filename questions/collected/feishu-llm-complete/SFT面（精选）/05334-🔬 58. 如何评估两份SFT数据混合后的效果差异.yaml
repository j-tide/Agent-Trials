content:
  prompt: "\U0001F52C 58. 如何评估两份SFT数据混合后的效果差异？"
answer:
  mode: rubric
  reference_answer: |-
    在SFT数据迭代中，经常需要比较“加入新数据”和“不加新数据”或“数据配比A”和“数据配比B”的效果。这不能仅凭直觉，而需要一套严谨的对比评估方法论。

    一、对比评估的黄金法则：控制单一变量

    确保两个模型除了数据构成不同外，其他所有条件完全一致：相同的基座模型checkpoint、相同的训练超参、相同的训练步数、相同的训练框架版本。任何额外的变量都会污染对比结论。

    二、评估的多维指标体系

    [嵌入表格未展开]

    三、统计显著性检验

    性能差异可能只是随机波动。对于关键指标，需要进行统计显著性检验（如bootstrap test或t-test）。例如，在测试集上多次采样评估，得到两个模型得分的分布，计算p值判断差异是否显著。对于人工评估，需要报告评估者间一致性（如Krippendorff's Alpha），确保结论非偶然。

    四、消融分析的进阶：分层评估

    不只看总体得分，还要按不同维度分解看差异：

    - 按任务类型分层：新数据可能提升了代码能力，但降低了对话自然度。分层分析可发现这种“跷跷板效应”。

    - 按难度分层：在简单、中等、困难测试子集上分别评估，看提升集中在哪个难度区间。

    - 按指令类型分层：短指令vs长指令、单轮vs多轮、有约束vs无约束。

    这种分层评估能揭示总分的背后故事——总分提升可能是少数高难度任务的大幅提升，也可能是大量简单任务的微幅提升。

    五、混合数据的“协同效应”检测

    两份数据混合后，有时1+1>2（协同效应），有时1+1<2（相互干扰）。检测方法：

    - 分别训练只用数据A、只用数据B、用A+B混合的三个模型

    - 如果混合模型的性能显著优于A和B的线性加权预测值，说明存在协同效应；如果低于，说明存在干扰

    - 干扰的来源可能是两类数据的行为规范冲突（如A数据要求简洁，B数据要求详细），需要识别并调和

    六、长期跟踪与回归检测

    即使初始对比显示混合数据效果更好，也需要在后续迭代中持续监控，防止某些能力的慢性退化。建立基准分数的控制图，一旦某个指标跌破历史均值加减两倍标准差，自动告警。

    ✅ 总结：评估两份SFT数据混合效果需要控制单一变量、构建多维指标体系、进行统计显著性检验和分层分析。同时检测协同效应与干扰，并通过长期跟踪确保效果持续稳定。这不仅是技术工作，更是一种严谨的科学方法论。


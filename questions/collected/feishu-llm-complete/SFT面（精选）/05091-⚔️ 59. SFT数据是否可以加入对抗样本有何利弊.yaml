    四、安全使用对抗样本的核心原则

    原则一：攻击指令+正确防御回复

    对抗样本绝对不能以“攻击指令+错误顺从回复”的形式存在。必须是攻击指令与正确的安全防御回复配对。这样对抗样本就变成了安全训练数据，教会模型如何应对攻击。

    原则二：严格控制比例

    对抗样本在整个SFT数据中的占比通常不应超过3%-5%。比例过高会让模型对正常用户也保持防御姿态。安全对抗数据应主要集中在安全类别中，而非均匀散布在所有任务中。

    原则三：覆盖-验证-迭代循环

    - 收集或构造一批对抗样本

    - 用这批数据训练模型

    - 用新的、未在训练中出现的对抗攻击测试模型

    - 收集模型仍然被突破的攻击案例

    - 将这些新案例转化为训练数据

    - 重复

    这个循环确保模型的防御能力不断提升，且不局限于固定攻击模式。

    原则四：分层隔离

    将对抗样本与其他SFT数据在训练过程中进行一定程度的隔离——例如，只在训练的后期阶段引入对抗样本，或者使用专门的微调阶段进行安全对齐。这防止对抗数据在训练早期干扰模型建立正常的对话能力。

    五、对抗样本的审计与版本控制

    由于对抗样本的敏感性，需要更严格的审计：

    - 所有对抗样本需经过安全团队审核

    - 记录每条对抗样本的攻击类型、预期防御行为和审核状态

    - 定期复审：新的攻击模式出现后，检查现有对抗样本的覆盖度

    ✅ 总结：SFT数据中可以也应当加入对抗样本，但必须以“攻击指令+安全回复”的正确形式存在，严格控制比例，并在覆盖-验证-迭代循环中持续更新。对抗样本是模型安全免疫系统的疫苗，但需要精密控制剂量和投放时机，才能提升抵抗力而不伤害模型本身的健康。


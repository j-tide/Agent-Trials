content:
  prompt: 编写函数将LoRA权重合并到原模型权重中
answer:
  mode: rubric
  reference_answer: "训练后，可以将 LoRA 矩阵与原始权重合并，生成一个等效的稠密线性层，便于推理部署。\n\n```python\ndef
    merge_lora_to_linear(lora_layer: LoRALinear) -> nn.Linear:\n    \"\"\"将 LoRA 权重合并到原始线性层中，返回新的合并后的线性层\"\"\"\n
    \   # 确保原权重与 LoRA 在同一设备\n    W = lora_layer.linear.weight.data  # (out, in)\n
    \   A = lora_layer.lora_A.data         # (r, in)\n    B = lora_layer.lora_B.data
    \        # (out, r)\n    \n    # 计算增量 ΔW = (lora_alpha / r) * B @ A\n    delta_W
    = (lora_layer.lora_alpha / lora_layer.r) * torch.matmul(B, A)  # (out, in)\n    merged_weight
    = W + delta_W\n    \n    # 构建新的线性层\n    new_linear = nn.Linear(lora_layer.in_features,
    lora_layer.out_features, \n                           bias=lora_layer.linear.bias
    is not None)\n    new_linear.weight.data = merged_weight\n    if lora_layer.linear.bias
    is not None:\n        new_linear.bias.data = lora_layer.linear.bias.data\n    \n
    \   return new_linear\n```\n\n说明：\n\n- 合并后即可删除 LoRA 参数，仅保留等价的标准线性层，实现零额外推理开销。\n\n-
    一般对整个模型所有 LoRA 层执行此操作，然后保存为新的模型文件。\n\n---"

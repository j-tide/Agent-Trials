content:
  prompt: "\U0001F4A1 23. LIMA实验得出了什么结论？对SFT数据工程有何启示？"
answer:
  mode: rubric
  reference_answer: |-
    LIMA（Less Is More for Alignment）是Meta在2023年发表的一项重要研究，它用极其激进的实验设计挑战了当时“SFT数据越多越好”的主流认知。LIMA的结论深刻影响了整个SFT数据工程的范式，将关注焦点从“堆量”转向了“精质”。

    一、LIMA的核心实验设计与结论

    LIMA仅使用1000条精心挑选的高质量SFT数据对LLaMA-65B进行微调，数据来源包括社区问答（Stack Exchange）、wikiHow指导文档、以及人工撰写的示例。尽管数据量极小，LIMA在多种任务上展现出了令人惊讶的能力——不仅能处理训练数据中直接覆盖的任务类型，还能泛化到未见过的任务，甚至在特定场景下表现不逊于当时数据量数十倍于己的模型。

    LIMA的核心结论：预训练模型已经通过海量数据掌握了丰富的语言能力和世界知识。SFT的角色不是注入新能力，而是激活和格式化预训练中已有的能力。高质量、多样化、覆盖关键交互模式的少量数据，就足以教会模型“如何与人类对话”。大部分SFT数据中的冗余样本对模型能力的提升贡献甚微。

    二、对SFT数据工程的深层启示


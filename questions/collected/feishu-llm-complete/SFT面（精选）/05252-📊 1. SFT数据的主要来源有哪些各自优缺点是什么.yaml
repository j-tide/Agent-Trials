content:
  prompt: "\U0001F4CA 1. SFT数据的主要来源有哪些？各自优缺点是什么？"
answer:
  mode: rubric
  reference_answer: |-
    SFT数据的来源决定了模型能力的上限和形态。目前主流的SFT数据获取途径可以分为人工标注、模型生成、现有数据集转换、以及用户交互回收四大类，各自有着鲜明的优劣特征。

    [图片内容未导入]

    [嵌入表格未展开]

    人工专家标注是SFT数据的“黄金标准”，但其高昂成本限制了规模。通常只在核心安全样本、高难度推理链、以及特定领域（医疗、法律）使用。强模型蒸馏是当前性价比最高的方案——用GPT-4等顶级模型生成数万条回答，再由人工抽检修正。但需警惕“模型内循环”问题：如果蒸馏数据和被训练模型来自同系列，可能放大固有偏差。

    开源数据集整合提供了一个不错的基础，但必须经过严格的格式统一和质量过滤。Self-Instruct是打破数据瓶颈的关键创新，它让模型自己给自己出题，大幅降低了对人工的依赖。用户交互数据回收是最高价值但也最难获取的——它直接反映了真实用户需求，但涉及隐私和安全合规，需要建立完善的数据脱敏和用户授权机制。

    实践中，成熟的SFT项目通常采用“组合拳”：用开源数据打底（覆盖广度），用Self-Instruct扩展（增加多样性），用强模型蒸馏或专家标注做核心能力（保证深度），最后通过用户反馈数据持续迭代（精准修复）。


    二、覆盖度评估

    覆盖度关注的是数据对“目标能力空间”的填充程度。这需要先定义目标能力空间：

    - 构建能力矩阵：根据产品需求，列出所有期望模型具备的能力（如“代码生成-函数级”、“数学推理-方程求解”、“安全处理-拒绝暴力请求”等），形成一个能力标签矩阵。

    - 自动标注能力标签：使用一个分类器或强模型，为合成数据中的每条指令打上能力标签。

    - 计算覆盖率和饱和度：

    - 识别覆盖盲区：找出覆盖率为0或数据量极少的能力标签，这些是后续数据补充的重点。

    三、多样性不足的预警信号

    [嵌入表格未展开]

    四、提升多样性的干预措施

    当评估发现多样性不足时：

    - 调整合成prompt：在prompt中增加“请使用与之前完全不同的措辞”或“模拟一个非母语者的提问”

    - 引入人类示例：提供少量风格各异的真实人类对话作为few-shot引导

    - 使用多模型混合：不同模型有不同的生成偏好，混合可增加多样性

    - 后处理注入：对合成数据进行改写、回译、风格迁移等后处理

    ✅ 总结：评估合成数据的多样性和覆盖度需要从语义、词汇、任务类型、风格等多维度进行量化分析，并结合能力矩阵检查覆盖盲区。评估结果直接指导合成策略的调整，确保合成数据真正“多而不同”。


answer:
  mode: rubric
  reference_answer: |-
    合成数据最大的隐患之一是“虚假的多样性”——数据量很大，但实际覆盖的任务类型和表达方式非常狭窄。系统性地评估其多样性和覆盖度，是确保合成数据价值的前提。

    一、多样性评估维度


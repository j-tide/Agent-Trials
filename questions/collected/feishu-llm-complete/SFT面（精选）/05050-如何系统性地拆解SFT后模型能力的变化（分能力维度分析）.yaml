content:
  prompt: 17. 如何系统性地拆解SFT后模型能力的变化？（分能力维度分析）
answer:
  mode: rubric
  reference_answer: |-
    评估SFT的影响，不能只看一个总分。我们需要像医生一样，对模型进行分系统的“体检”，用一套多维度的能力指标来绘制模型的“能力变化图谱”。

    - 知识覆盖度

    - 评估：在通用知识基准（MMLU、TriviaQA、Natural Questions）上对比SFT前后的成绩。

    - 分析：如果整体下降，是普遍性遗忘；如果部分类别下降，可能是SFT数据在这些领域有偏差或数据不足。如果上升，可能是SFT激活了预训练知识或有效地格式化了输出。

    - 推理能力

    - 评估：使用数学推理（GSM8K, MATH）、逻辑推理（LogiQA）、代码生成（HumanEval, MBPP）等基准。

    - 分析：推理能力对SFT的敏感性仅次于知识。如果大幅下降，说明SFT可能干扰了模型的深层思考链。如果提升，可能是SFT中包含了大量的思维链数据，教会了模型推理格式。

    - 指令遵循与格式化

    - 评估：使用IFEval（严格指令遵循）和自定义的格式约束测试。

    - 分析：SFT的核心目标之一就是提升这一项。应看到明显的提升。如果没有，说明SFT数据中的格式多样性不足或训练不充分。

    - 安全与无害性

    - 评估：用安全基准（如ToxicChat, HarmBench）和红队攻击测试。统计过度拒绝率。

    - 分析：SFT后的模型应该比基座更安全。如果过度拒绝率飙升，说明安全数据配比过高或拒绝样本过于一刀切。

    - 多样性与创造力

    - 评估：计算Self-BLEU、输出熵。用创意写作类题目进行人工或GPT评估。

    - 分析：SFT几乎必定会导致多样性的下降。关键在于下降的幅度是否可接受。如果输出熵急剧降低，说明模型出现了严重的分布坍缩。

    - 多语言能力

    - 评估：使用多语言基准（如MGSM, XQuAD）。

    - 分析：如果SFT数据以单一语言为主，其他语言的能力很可能会遗忘。这对于全球化部署的模型是致命打击。

    - 对话与交互能力

    - 评估：多轮对话基准（MT-Bench），或人工评估上下文感知、指代消解能力。

    - 分析：单轮SFT可能会破坏多轮对话的连贯性。需要用专门的多轮SFT数据来维护。

    通过这个七维度的体检报告，我们可以绘制出模型的能力雷达图，清晰看到SFT的增益（指令遵循、安全）和代价（知识遗忘、多样性降），从而指导下一轮的SFT数据配比和策略调整。


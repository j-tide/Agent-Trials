answer:
  mode: rubric
  reference_answer: |-
    假设已有API endpoints。

    ```python
    import requests
    import random

    def ab_test(prompts, model_a_url, model_b_url, judge_model="gpt-4"):
        wins = {'A': 0, 'B': 0, 'tie': 0}
        for prompt in prompts:
            resp_a = requests.post(model_a_url, json={"prompt": prompt}).json()['response']
            resp_b = requests.post(model_b_url, json={"prompt": prompt}).json()['response']
            # 随机交换位置以调用GPT评判
            if random.random() < 0.5:
                winner = gpt_judge_compare(prompt, resp_a, resp_b)['winner']
            else:
                winner = gpt_judge_compare(prompt, resp_b, resp_a)['winner']
                winner = 'A' if winner == 'B' else 'B' if winner == 'A' else 'tie'
            wins[winner] += 1
        total = len(prompts)
        print(f"A胜率: {wins['A']/total:.2%}, B胜率: {wins['B']/total:.2%}, 平局: {wins['tie']/total:.2%}")
    ```

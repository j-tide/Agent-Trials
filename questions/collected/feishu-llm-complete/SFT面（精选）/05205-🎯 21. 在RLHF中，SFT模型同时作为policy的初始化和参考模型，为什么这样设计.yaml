content:
  prompt: "\U0001F3AF 21. 在RLHF中，SFT模型同时作为policy的初始化和参考模型，为什么这样设计？"
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    一、作为初始策略：提供可信的探索起点
    强化学习需要从一个初始策略开始与奖励环境交互。如果初始策略是一个未经指令格式化的预训练模型，它生成的文本在格式、风格、内容上都会极度混乱。奖励模型 rϕ 面对这些混乱的输出，几乎无法给出有意义的评分——就像让一个只吃过法餐的美食评论家去评价一锅乱炖，他无从下口。SFT模型作为初始策略，其输出至少格式正确、语言通顺、与指令基本相关。这使得RLHF从一开始就能接收到有意义、有区分度的奖励信号。将探索空间从“整个语言宇宙”缩小到了“高质量对话的邻近区域”，样本效率得到了指数级的提升。我认为这是SFT对RLHF最关键的贡献之一。

    二、作为参考模型：提供精准的行为锚定

    PPO的核心优化目标中包含一个KL散度惩罚项：

    [图片内容未导入]

    [图片内容未导入]

    训练模型做参考呢？因为预训练模型的输出分布极其宽广，包含了从小说到代码的所有文体。对PPO来说，即使策略已经退化为一个只会生成礼貌但毫无信息量的“废话模型”，相对于预训练分布的KL散度可能仍然很小——因为“废话”在预训练数据中也不少见。这意味着KL惩罚无法有效约束模型在“对话空间”内的行为。SFT模型作为参考，其分布被严格限定在“高质量助手回答”的区域。任何向低质量、非对话模式的漂移，相对于SFT分布的KL散度都会急剧增大，从而被及时拉回。它将KL约束从一个“限制离开语言空间”的粗放边界，变为一个“限制在对话空间内远离高质量区域”的精细护栏。

    三、双角色的协同效应

    [图片内容未导入]

    ✅ 总结：SFT模型同时担任初始策略和参考模型，巧妙地将RLHF的探索空间限定在了“有用对话”的流形上，并在优化过程中提供了精准的、与初始行为相一致的保守力量。这种设计是RLHF工程智慧的体现。


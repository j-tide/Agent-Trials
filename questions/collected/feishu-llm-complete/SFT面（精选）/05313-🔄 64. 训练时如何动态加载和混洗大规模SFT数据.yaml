content:
  prompt: "\U0001F504 64. 训练时如何动态加载和混洗大规模SFT数据？"
answer:
  mode: rubric
  reference_answer: |-
    当SFT数据规模超过内存容量，或者需要频繁更新数据集时，一次性全量加载到内存再训练的传统方式不再可行。动态加载与混洗成为必需的工程能力。

    一、动态加载与混洗的核心挑战

    - 数据量大于内存：不能一次性读入所有数据，需要流式或分块加载

    - 充分的随机混洗：SFT数据按来源或任务类型往往有聚集性，不充分混洗会导致模型在一个batch内只看到一类数据，训练不稳定

    - 多轮训练（多epoch）的混洗：每个epoch需要不同的随机顺序，防止模型记忆数据顺序

    - 数据源的动态变化：训练过程中可能新增或移除部分数据，需要热更新能力

    二、解决方案：分片+缓冲区混洗

    这是工业界最常用的策略：

    - 数据预分片：将大规模SFT数据集预先切分为多个较小的文件（如每个文件1000-5000条），存储为Parquet或JSONL。分片粒度要适中——太小则文件数过多，太大则无法灵活混洗。

    - 分片级混洗：每个epoch开始时，将所有分片文件的索引列表随机打乱。这确保了不同分片之间的顺序随机。

    - 分片内缓冲区混洗：数据加载器不是简单地从分片中顺序读取，而是维护一个内存缓冲区（如容纳10000条样本），从当前分片和可能的邻近分片中预取数据填入缓冲区，然后在缓冲区内进行随机打乱，最后按batch输出。缓冲区大小越大，混洗越充分，但内存占用也越高。

    - 预取与流水线：使用多线程或异步I/O在后台预取下一个分片的数据，确保GPU训练与数据加载并行，避免I/O等待。


content:
  prompt: 23. 如何判断SFT模型是否产生“分布崩塌”？
answer:
  mode: rubric
  reference_answer: |-
    分布崩塌是指SFT模型丧失了生成多样化、风格各异文本的能力，其输出分布从预训练时宽广的“高原”坍缩为SFT数据所定义的、极其狭窄的“尖峰”。判断是否崩塌，需要多指标联合诊断，而非单看一个分数。

    判断依据的综合列表

    - 定量指标红灯

    - 行为表现“症候群”

    - 定性评估验证

    综合判断：单个指标异常可能只是风格微调，但若多个定量指标同时指向多样性丧失，且行为上表现出明显的僵化、模板化，就可以断定模型已经发生了分布崩塌。这是SFT过度的典型标志，需要立即回退到更早的checkpoint并调整数据或训练策略。


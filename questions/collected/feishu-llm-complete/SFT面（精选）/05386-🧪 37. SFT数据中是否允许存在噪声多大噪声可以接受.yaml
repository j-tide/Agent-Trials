content:
  prompt: "\U0001F9EA 37. SFT数据中是否允许存在噪声？多大噪声可以接受？"
answer:
  mode: rubric
  reference_answer: |-
    SFT数据中并非要求绝对的零噪声，这在工程上既不现实也不必要。一定程度的噪声可以被模型的鲁棒性所吸收，甚至少量的“有益噪声”能够提升模型的泛化能力。但噪声的类型和比例决定了它是“免疫系统训练”还是“慢性毒药”。


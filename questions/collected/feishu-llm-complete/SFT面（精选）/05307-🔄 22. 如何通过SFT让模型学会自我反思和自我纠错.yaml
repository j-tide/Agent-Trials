content:
  prompt: "\U0001F504 22. 如何通过SFT让模型学会自我反思和自我纠错？"
answer:
  mode: rubric
  reference_answer: |-
    自我反思（Self-Reflection）和自我纠错（Self-Correction）是让模型从“一次性生成”进化为“深思熟虑”的关键能力。它要求模型能像人类一样，检查自己刚写下的内容，发现其中的逻辑漏洞、事实错误或不恰当之处，并主动进行修正。这种能力无法凭空涌现，必须通过精心构造的SFT数据，将其作为一种生成模式植入模型。

    一、核心数据构造模式：错误-发现-修正链条

    这种SFT数据不再是简单的“(指令，正确回答)”对，而是多阶段的、包含内部对话的序列。数据格式通常像一次模型的“内心独白”。一个典型的自我纠错SFT样本结构如下：

    ```text
    用户：请计算一个长方体的体积，长5米，宽2米，高3米。

    助手（第一次回答）：体积 = 长 + 宽 + 高 = 5 + 2 + 3 = 10立方米。

    助手（自我反思）：等等，我犯了一个错误。我错误地使用了周长的公式，而不是体积公式。计算体积应该用长 × 宽 × 高。让我重新计算。

    助手（修正后回答）：抱歉，我之前的计算是错误的。长方体的体积应为长 × 宽 × 高 = 5 × 2 × 3 = 30立方米。
    ```

    在这个数据样本中，第一次回答部分被标记为不计算损失（或作为上下文），自我反思和修正后回答部分是模型真正需要学习生成的目标。通过在SFT数据中大量加入这种“故意犯错，然后自我纠正”的示范，模型会逐渐学会这种生成模式：在给出一个初步答案后，停顿下来，进行一次内在的“检查”，如果发现问题，就进行修正。

    二、构造这种数据的几种具体方法

    - 人工构造（黄金标准）：让标注者刻意写出包含一个典型错误（如常识错误、计算错误、逻辑跳跃）的初步回答，然后写一段自我反思的文字，明确指出错误所在，最后给出完美的修正回答。这是质量最高的数据，但成本极高。

    - 利用强模型生成（合成数据）：用一个强大的模型（如GPT-4）来生成反思数据。流程是：

    - 基于真实错误的数据回收：这是最有价值的数据来源。将当前SFT模型部署上线，收集它生成的、被用户点踩或纠正的真实错误回答。将这条对话记录作为“第一次回答”，然后由标注者或强模型补充反思和修正。这种数据直接针对了当前模型的盲区，改进效果最显著。

    三、自我反思数据的变体

    - 过程性反思：不仅在最终答案前反思，还在长篇推理的中间插入反思步骤。例如，在数学解题的某一步后，加入“确认一下，这一步的除数是正确的，因为...”。

    - 多轮对话中的反思：用户在多轮对话中指出了模型的错误。模型的回复应该包含承认错误、解释原因和修正。这种数据训练模型如何优雅地接受外部反馈。

    - 元认知反思：模型被要求对一个复杂问题进行思考时，可以先输出一段“规划”：“这个问题需要分三步解决。第一步...第二步...（我需要注意...）”。这种“先计划、再执行”本身也是一种反思。

    四、训练时的注意事项

    - 损失掩码（Loss Masking）：必须精确设置损失掩码。通常，第一次回答和用户的原始指令部分不计算损失，只对自我反思和修正后回答部分计算损失。如果对错误的第一次回答也计算损失，模型就会学习“如何犯错”，这是致命的。

    - 避免过度反思：如果反思数据比例过高，模型可能变得“犹豫不决”，即使回答正确也会强行反思一下，导致输出冗长。反思数据应占总数据量的一个适当比例（如5%-10%），并且要包含一些“检查后确认无误，无需修正”的样本，让模型学会判断何时不需要反思。

    ✅ 总结：通过构造包含“错误-发现-修正”链条的SFT数据，可以让模型内化自我反思和纠错的行为模式。关键在于数据的逼真性、损失掩码的精确控制，以及防止模型陷入过度反思的陷阱。


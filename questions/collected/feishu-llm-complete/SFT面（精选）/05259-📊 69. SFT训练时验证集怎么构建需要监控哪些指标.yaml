content:
  prompt: "\U0001F4CA 69. SFT训练时验证集怎么构建？需要监控哪些指标？"
answer:
  mode: rubric
  reference_answer: |-
    验证集是SFT训练中的“质检员”和“刹车片”。它不仅在训练结束后评估模型好坏，更在训练过程中告诉我们何时该停下来。一个构建得当的验证集，是防止过拟合、灾难性遗忘和分布坍缩的第一道防线。

    一、验证集的构建原则

    [嵌入表格未展开]

    验证集不能从训练集中简单随机划分，因为SFT数据通常来自有限的几个种子，随机划分可能让训练集和验证集高度相似，造成“虚假的泛化”。正确的做法是从完全不同的数据源、不同的标注批次或不同时间收集的指令中构造验证集。如果资源允许，甚至可以请未参与训练数据标注的人员从零构造验证数据，以彻底避免标注者偏差。

    二、必须监控的核心指标

    - 验证损失（Validation Loss）
    最基础的指标。在训练过程中每N步评估一次。健康的训练曲线是训练损失和验证损失同步下降，最终验证损失趋于平缓。当验证损失停止下降并开始反弹，就是典型的过拟合信号，应立即停止训练（早停）。注意，由于SFT数据量较小，验证损失可能会出现小幅波动，需观察趋势而非单点。

    - 生成质量抽样评估
    损失值不能直接反映文本质量。需选取一组固定的、未参与训练的prompt，定期让模型生成回复，并由人工或强模型进行打分。关注维度包括：指令遵循度、回答准确性、格式正确性、语言流畅度、安全合规性。如果生成质量在某个训练节点后开始下降（如输出变啰嗦、模板化），即便验证损失还在降，也应警惕过拟合。

    - 通用能力基准的保持
    这是防灾难性遗忘的关键指标。在SFT前，用MMLU、HellaSwag、ARC等通用基准测试基座模型得分作为基线。SFT过程中定期重测这些基准。如果得分持续显著下降，说明模型在遗忘预训练知识。这比验证损失更敏感，因为通用能力衰退往往先于SFT任务性能下降表现出来。

    - 安全与拒绝率
    用一个固定的安全测试prompt集（包含各类危险请求），监测模型的拒绝率及拒绝质量。如果拒绝率下降或模型开始对危险请求给出顺从回答，说明安全边界被SFT冲淡。同时也要监测过度拒绝率——对正常请求误判为危险而拒绝的比例。安全与有用性的平衡曲线是必看指标。

    - 输出多样性与简洁性
    对于固定的开放性问题（如“写一个关于秋天的短故事”），多次生成回答，计算不同回答之间的语义相似度或Self-BLEU。相似度突然升高意味着多样性坍缩。同时监测平均回复长度，如果持续变长，可能是冗长偏差正在形成。

    三、验证集的动态迭代

    验证集并非一成不变。当模型部署后，会暴露新的用户行为模式和漏洞。这些新发现的bad case应被整理、标注并加入验证集，确保后续的迭代训练能针对性改进，同时不回归旧的错误。这种“活文档”式的验证集管理，是SFT质量飞轮的重要组成部分。

    ✅ 总结：SFT验证集需要独立、多样、包含难度梯度和边界案例。监控指标不仅是损失，更要涵盖生成质量、通用能力保持、安全性和多样性。多维度的持续监控，才能确保SFT训练在正确的轨道上适时停止，获得泛化性好、安全可靠的对齐模型。


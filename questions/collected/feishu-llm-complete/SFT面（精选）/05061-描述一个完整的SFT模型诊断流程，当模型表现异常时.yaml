content:
  prompt: 27. 描述一个完整的SFT模型诊断流程，当模型表现异常时。
answer:
  mode: rubric
  reference_answer: |-
    当SFT模型行为异常时，我们需要一套系统化、从宏观到微观的诊断流程，避免盲目猜测。这个流程就像医生问诊，从症状观察到病理分析，最终定位根因。

    第一阶段：症状记录与复现

    - 明确异常表现：详细记录模型的异常行为，是哪种任务上出了问题？安全拒绝过度？回答变得冗长？特定领域知识丢失？

    - 构造最小复现集：收集5-10个最能代表该异常的prompt，构成“诊断测试集”。确保问题可以稳定复现，这是后续分析的基础。

    第二阶段：宏观基线对比（定位是模型问题还是数据问题）

    - 与基座模型对比：用同一组诊断测试集，对比SFT前后模型的输出。如果基座模型也存在类似问题（如知识缺失），那这是预训练的问题，而非SFT引入的。如果基座正常，SFT后异常，则锁定为SFT导致。

    - 与不同checkpoint对比：如果保存了训练过程中多个checkpoint，逐个测试诊断集，画出性能变化曲线。这可以定位异常是何时开始出现的，与哪批数据的加入相关。

    第三阶段：中观数据与训练分析（定位根因）

    - 检查SFT数据配比与质量：根据异常类型，重点审查相关数据。

    - 检查训练超参数：学习率是否过大（导致遗忘或崩溃）？训练轮数是否过多（过拟合）？Batch size是否合适？

    - 评估遗忘曲线：绘制通用基准（如MMLU）随训练步数的变化，判断灾难性遗忘的严重程度。

    第四阶段：微观模型行为分析（深度诊断）

    - Logit Lens分析：比较SFT前后模型在处理诊断prompt时，各层对关键token的预测概率变化，观察行为转变发生在哪一层。

    - Attention可视化：观察模型在做出错误回答时，注意力是否被无关token吸引（捷径学习）。

    - 输出分布分析：计算输出熵和Self-BLEU，判断是否发生分布坍缩。

    第五阶段：修复验证与迭代

    - 基于以上分析，提出根因假设。

    - 设计修复方案：调整数据配比、补充特定数据、修改学习率、调整训练轮数等。

    - 用小规模实验（如用10%数据训练）快速验证修复效果。

    - 确认有效后，应用到全量训练，并重新进行全流程评估。

    ✅ 总结：诊断SFT异常是一个逐步缩小包围圈的过程：从宏观表现到中观数据，再到微观模型行为。关键是对比、复现和分层分析，最终精准定位数据或训练策略中的问题，并迭代修复。


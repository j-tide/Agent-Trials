content:
  prompt: 32. 如何评估SFT模型在长上下文任务中的表现？用什么数据集？
answer:
  mode: rubric
  reference_answer: |-
    长上下文任务考验的是模型在数千甚至上万个token的输入中，准确找到、理解并综合信息的能力。评估这一能力需要专门的基准和指标。

    一、关键评估能力维度

    - 信息检索：能否在大量无关文本中，准确找到与问题相关的少量事实。

    - 信息综合：能否将分布在文档不同位置的多个信息点整合起来，回答一个需要多步推理的问题。

    - 总结归纳：能否为长文档生成准确、连贯的摘要。

    - 时序推理：能否理解长文本中的时间线和因果关系。

    二、常用的长上下文评估数据集

    [嵌入表格未展开]

    三、评估方法

    - 精确匹配与F1：对于有明确答案的问题，用标准指标。

    - “大海捞针”测试：将一个与上下文无关的“针”（一个事实）放在很长的“干草堆”（无关文本）中的不同位置（开头、中间、结尾），测试模型是否能检索出来。这是衡量长上下文信息提取能力的直观方法。

    - GPT-4评判：对于开放式问题，让GPT-4根据原文判断模型回答的事实准确性、完整性和忠实度。

    - 注意推理的时效性：生成和评估超长序列非常耗时，需要注意成本。

    四、分析SFT数据的影响

    评估之后，应分析SFT数据中的长文本占比和类型。如果SFT数据主要是短对话，模型在长上下文任务上表现差是意料之中。可通过在SFT中混入长文档问答、摘要等数据来针对性提升。

    ✅ 总结：评估长上下文能力需要使用LongBench等专门基准，重点关注信息检索、综合和推理能力，并辅以“大海捞针”等测试。评估结果直接指导长文本SFT数据的构造与配比。


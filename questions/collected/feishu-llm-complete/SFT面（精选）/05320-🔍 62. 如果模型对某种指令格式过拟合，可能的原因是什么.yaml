content:
  prompt: "\U0001F50D 62. 如果模型对某种指令格式过拟合，可能的原因是什么？"
answer:
  mode: rubric
  reference_answer: |-
    指令格式过拟合是指模型只对训练数据中出现过的特定指令措辞和结构有良好反应，一旦用户换一种表达方式、或者使用非标准的指令格式，模型的表现就大幅下降。这是SFT中“死记硬背”的典型症状。

    一、过拟合格式的常见原因

    [嵌入表格未展开]

    二、诊断格式过拟合的方法

    - 指令改写测试：将评测集中的指令用同义词、不同句式、不同语序改写，观察模型性能是否显著下降。例如，原指令“总结以下文本”改为“下面这段话讲了什么，用一两句话概括”。如果准确率断崖式下跌，说明存在格式过拟合。

    - 碎片化输入测试：模拟真实用户的碎片化表达——“翻译：hello”、“hello什么意思”、“用中文说hello”，如果模型只在完整句式下表现好，碎片化输入表现差，说明过拟合。

    - 特殊标记消融测试：移除或替换指令中的特殊标记（如将### Instruction:改为Q:），看模型是否仍然正常工作。

    - 少样本格式泛化测试：用一个全新的、训练中从未出现的指令格式（如用XML标签包裹指令），看模型是否能通过语义理解正确执行。

    三、预防与修复策略

    [嵌入表格未展开]

    四、格式过拟合与“快捷学习”的关系

    格式过拟合本质上是模型找到了降低训练损失的“捷径”——只需识别指令中的几个关键词和结构模式，就能匹配到正确的回答，而无需真正理解指令的完整语义。这种捷径在训练数据分布内表现良好，但在分布外就崩溃。解决格式过拟合，就是强迫模型放弃这些捷径，学习更本质的任务理解能力。

    ✅ 总结：模型对指令格式过拟合的根源在于训练数据的措辞和结构缺乏多样性，以及训练过度。通过指令变体增强、多源混合、对抗性去模板化和控制训练轮数，可以有效预防和修复这一问题。


content:
  prompt: "\U0001F4C8 65. 什么是“progressive data scaling”？"
answer:
  mode: rubric
  reference_answer: |-
    Progressive data scaling是一种分阶段逐步增加SFT数据量和复杂度的训练策略。它的核心理念是：不在训练一开始就投入全部数据，而是根据模型能力的发展阶段，有节奏地扩大数据规模和难度，从而最大化每一份数据的训练价值。

    一、Progressive data scaling的动机

    - 训练初期，模型对数据的利用效率高：刚开始SFT的基座模型还很“笨”，此时大量的数据并不能被充分利用——就像给小学生看大学教材，边际收益低。少量精心挑选的简单核心数据，就能快速建立基本的指令遵循能力。

    - 随着能力提升，需要更大规模和更多样性的数据：模型掌握了基本对话格式后，需要接触更多任务类型、更复杂的指令、更长的上下文，才能继续成长。此时扩大数据量能带来更显著的提升。

    - 过早接触困难数据可能导致学习受阻：如果一开始就大量训练复杂推理或长上下文数据，模型可能长时间无法降低损失，学习信号弱，甚至产生负面影响。


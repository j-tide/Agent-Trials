    三、Progressive data scaling与课程学习的区别

    两者相关但不完全相同。课程学习强调数据难度的由易到难；progressive data scaling不仅关注难度，还关注数据量和多样性的逐步递增。在实践中，两者通常结合使用：每个阶段内部按难度进行课程学习，阶段之间扩大数据规模和任务覆盖范围。

    四、实施中的关键技术决策

    - 阶段切换的触发条件：不是固定步数，而是基于验证集性能——当当前阶段的验证损失趋于平缓，或目标任务指标达到预设阈值时，自动触发下一阶段的数据扩展。

    - 新旧数据的衔接：进入新阶段时，不是完全丢弃旧数据，而是将新数据与旧数据按一定比例混合（如新阶段数据占80%，保留20%的旧阶段数据），以防止遗忘基础能力。

    - 数据扩展的倍数：每个阶段的数据量通常是前一阶段的1.5-3倍。跳跃太大可能导致模型需要重新适应数据分布。

    - 监控与回退：如果发现扩展数据后模型性能反而下降（可能是新数据质量差或分布偏差大），需要能够快速回退到前一个数据配置。

    五、Progressive data scaling的产出

    通过这种方式，相比一次性使用全量数据训练，通常可以获得：

    - 更高的最终模型性能：数据在恰当的时间被引入，利用效率更高

    - 更快的早期训练速度：初期数据少，迭代快，可以快速验证数据配方的有效性

    - 更低的过拟合风险：逐步增加数据多样性，避免了初期在有限数据上的过拟合

    ✅ 总结：Progressive data scaling通过分阶段扩大数据量和复杂度，让模型能力与数据供给同步升级，提高了数据利用效率，避免了初期数据过载或后期数据不足。它是SFT数据调度的一种高级策略，融合了课程学习和动态数据管理的优势。


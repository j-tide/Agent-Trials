content:
  prompt: "\U0001F4CC 10. SFT在RLHF流程中扮演什么角色？"
answer:
  mode: rubric
  reference_answer: |-
    在RLHF（基于人类反馈的强化学习）这个三幕剧中，SFT扮演着冷启动的初始策略、行为规范的锚定器、以及防止训练崩溃的安全网。没有SFT的RLHF就像在没有地基的沙地上建高楼，几乎不可能成功。

    一、SFT是RLHF的“操作系统”

    预训练模型的能力是散乱的——它能续写文本、能翻译、能写代码，但这些技能被封存在一个只知道“预测下一个token”的躯壳里。RLHF的奖励模型只能告诉模型“这个回答好”或“那个回答差”，却无法教给模型最基本的对话格式。SFT在这时充当了操作系统的角色：它通过海量高质量指令-回答对，教会了模型什么是“用户”，什么是“助手”，对话该如何开始和结束，回答应该遵循什么样的基本结构。没有这个底层框架，RLHF面对的将是一个连“说话格式”都不懂的模型，奖励信号将完全无从下手。

    二、SFT为RLHF提供可信的探索起点

    RLHF中的PPO算法需要模型在巨大而复杂的语言空间中探索更好的回答策略。如果直接从预训练模型开始探索，模型生成的文本在初始阶段会极其混乱——它可能输出重复的字符、无意义的乱码、或者完全离题的内容。奖励模型面对这些“垃圾”输出，几乎无法给出任何有效的正向奖励。SFT将模型首先拉入一个“基本合理”的区域内——它的回答至少格式正确、语言通顺、有一定的相关性。这样，RLHF的探索空间从“整个语言宇宙”缩小到了“高质量回答的邻近区域”，奖励信号变得密集且有意义，样本效率呈数量级提升。我把这称为SFT的“暖启动”效应。

    三、SFT是RLHF的“安全锚”

    [图片内容未导入]

    四、SFT初步塑造安全与行为边界

    在SFT阶段，我们已经可以通过数据设计（如加入安全拒绝样本）为模型建立起第一道安全防线和行为规范。这让RLHF无需从零开始教模型“什么是危险的”，而只需要在这个基础上进行精细校准——比如教模型在“礼貌拒绝”和“提供替代方案”之间做更细腻的权衡。SFT为RLHF铺好了路基，RLHF只是在这条路上铺设更平整的沥青。

    ✅ 总结：SFT在RLHF中承担了“格式化、暖启动、安全锚、初步边界”四大职能。它是RLHF成功运转的必要前提，决定了RLHF的起点高度和优化效率。


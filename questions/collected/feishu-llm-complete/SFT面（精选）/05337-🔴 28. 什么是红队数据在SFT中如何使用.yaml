  prompt: "\U0001F534 28. 什么是“红队数据”？在SFT中如何使用？"
answer:
  mode: rubric
  reference_answer: |-
    “红队数据”是一个源自军事术语的概念，在AI安全领域特指由专门的红队（Red Team）——一群试图挑战和突破模型安全限制的专家——生成的攻击性、对抗性数据。在SFT中，红队数据被用作安全训练的关键素材，以提升模型面对真实世界恶意攻击时的稳健性。

    一、红队数据的核心特征


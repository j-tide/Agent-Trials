content:
  prompt: "\U0001F9E9 34. 针对复杂任务，SFT数据量需要达到什么量级？"
answer:
  mode: rubric
  reference_answer: |-
    复杂任务（如高等数学证明、多跳逻辑推理、跨文档信息综合等）对SFT数据的需求量，与简单对话任务有着本质区别。由于复杂任务的推理链长、状态空间大、泛化难度高，对数据的覆盖密度和质量深度都提出了更高要求。


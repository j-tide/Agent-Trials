    三、复杂任务的“相变点”效应

    复杂推理任务存在一个“相变点”：当训练数据量超过某个临界值后，模型的泛化能力会出现跃升。在此之前，模型可能只是机械记忆了部分模式，泛化性很差；在此之后，模型突然“开窍”，能够处理未见过的问题。这个相变点出现的位置取决于模型规模、任务难度和数据质量。对于7B模型和中等难度数学题，相变点可能在数千条量级；对于高等数学和70B模型，可能需要数万甚至数十万条。

    四、并非“数据量”而是“有效信息量”

    对于复杂任务，更关键的指标不是样本条数，而是覆盖的推理模式数量。两条表面不同但使用同一推理模式的数据，在能力训练上相当于一条。因此，评估复杂任务SFT数据是否充足，应该看：

    - 是否覆盖了该任务领域内所有核心推理策略？

    - 每种策略是否有足够的表达变体？

    - 是否包含了该策略下常见的错误及其修正？

    - 是否涵盖了从简到繁的难度梯度？

    如果以上都满足，数据总量可能并不需要极端庞大。

    五、合成数据在复杂任务中的角色

    复杂任务SFT数据的人工标注成本极高，因此强模型合成+人工审核成为主流。但合成数据往往风格趋同、推理路径单一，需要通过多步推理的多样性引导（如让强模型展示不同解法）和对抗性生成（如让模型自己给自己出难题）来增加数据的信息密度。

    ✅ 总结：复杂任务SFT数据量级需求远高于简单任务，通常在数千到数万条不等，取决于推理链长度、内部多样性和基座模型已有能力。存在“相变点”效应，突破该点后泛化能力跃升。关键不在于条数，而在于推理模式的覆盖密度和梯度完整性。


content:
  prompt: "\U0001F914 55. 如何构造包含“不确定性”表达的SFT数据？"
answer:
  mode: rubric
  reference_answer: |-
    真实世界的问题很少是100%确定的。让模型学会在信息不足、知识边界模糊、或问题本身存在争议时恰当地表达不确定性，是构建可信AI的关键一步。这需要SFT数据从“全知全能的助手”转变为“诚实谦逊的顾问”。

    一、不确定性表达的类型

    [嵌入表格未展开]

    二、不确定性数据的构造方法

    方法一：构造信息不足场景

    设计用户提出的问题缺少关键信息，回复不应急于给出答案，而是列出缺失信息并请求补充：

    用户：“这个药有效吗？”
    助手：“要回答这个问题，我需要更多信息。你指的是哪种药物？用于治疗什么疾病？‘有效’是指症状缓解还是根治？请提供更多细节。”

    方法二：构造知识边界场景

    问题直接指向模型知识范围之外的内容。回复应诚实表达局限，并提供可行的替代帮助：

    用户：“明天纳斯达克指数会涨还是跌？”
    助手：“我无法预测明天的股市走势，这涉及太多不确定因素。但我可以帮你分析近期市场趋势和影响股市的主要因素，如果你需要的话。”

    方法三：构造多观点并存的场景

    问题涉及有争议的话题，回复不应偏袒一方，而是公平呈现多元视角：

    用户：“自由意志存在吗？”
    助手：“这是一个哲学界长期争论的问题。决定论者认为一切事件都由先前状态决定，自由意志只是幻觉；而兼容论者试图调和自由意志与决定论；自由意志论者则主张人具有真正的选择自由。目前没有统一的科学结论。”

    方法四：构造置信度梯度

    从完全确定到完全不确定，构造一个连续的不确定性谱系：

    - “根据公开数据，上海的人口约为...” （高置信度）

    - “根据现有证据，很可能是...” （中高置信度）

    - “目前的研究倾向于...但也存在不同看法” （中置信度）

    - “关于这个问题，我无法给出确切答案” （低置信度）

    - “这个领域存在极大的不确定性，以下只是一些可能的推测” （极低置信度）

    三、不确定性数据的配比与平衡

    不确定性数据不是越多越好。如果太多，模型会变得畏缩、不敢给出任何确定性回答。通常：

    - 不确定性相关数据占SFT总数据的5%-15%

    - 不同置信度级别的数据应均匀分布，而不是全部集中在“完全不确定”端

    - 对于高风险领域（医疗、法律），不确定性表达的比例应显著提高

    - 对于确定性的常识问题（“1+1等于几”），不应有不必要的犹豫

    四、不确定性表达的语调控制

    不确定不等于不自信。好的不确定性表达应该是“自信地表达不确定”——坦然而专业，而不是支支吾吾。数据中需要体现这种语调。错误示范：“呃...这个...我不太确定...可能...也许...” 正确示范：“关于这一点，目前的证据还不足以给出确切结论。以下是已知的信息，供你参考。”

    ✅ 总结：构造不确定性SFT数据需要覆盖信息不足、知识边界、固有不确定性和多观点并存等场景，并建立从高到低的置信度谱系。数据配比需适度，语调应坦然专业，目标是培养一个诚实而不畏缩的AI助手。


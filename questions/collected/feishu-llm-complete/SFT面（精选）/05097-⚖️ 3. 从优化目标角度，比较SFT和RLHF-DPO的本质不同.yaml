  prompt: "⚖️ 3. 从优化目标角度，比较SFT和RLHF/DPO的本质不同。"
answer:
  mode: rubric
  reference_answer: "SFT、RLHF和DPO的根本区别在于它们所优化的目标函数不同，这直接决定了模型学习到的行为模式。\n\n\U0001F4CC
    SFT：最大化特定序列的似然概率\nSFT的优化目标是最大化给定指令 x 下，标准回答 y 的对数似然：\n\n[图片内容未导入]\n\n\U0001F4CC
    DPO：直接优化偏好，隐式地最大化奖励\n\n[图片内容未导入]\n\n\U0001F4CC 核心区别总结\n\n- SFT：固定目标序列，单向拉近分布，没有探索，没有对比。\n\n-
    RLHF：通过奖励模型提供标量反馈，允许探索，有KL正则化。\n\n- DPO：通过偏好对提供对比信号，无需奖励模型，隐式奖励，训练更稳定简单。\n\n从优化视角看，SFT是“告诉你正确答案是什么”，RLHF是“告诉你做得好不好，自己去试”，DPO是“告诉你A比B好，你自己去想为什么”。RLHF/DPO因此能教会SFT无法传达的微妙偏好。\n\n---"

content:
  prompt: "\U0001F9EC 27. 如何理解SFT学到的是一种“行为克隆”，而RLHF是“目标导向优化”？"
answer:
  mode: rubric
  reference_answer: |-
    这是理解两种方法本质差异最精炼的概括。SFT是“依葫芦画瓢”，RLHF是“授之以渔”。

    一、SFT：行为克隆——模仿既定的动作序列

    在模仿学习中，行为克隆指的是学生直接学习专家在每个状态下的精确动作。对应到SFT：状态是“指令”，专家动作是训练数据中的“标准回答”。SFT模型学习的是在给定指令下，如何输出与训练数据完全一致的回答。它不关心这个回答为什么好，也不去探索是否有更好的回答。它的目标是复制已存在的行为模式。这导致了：

    - 没有探索：模型不会尝试新回答。

    - 没有长期规划：它只关心当前token对不对，不关心整个回答最终是否最优。

    - 无法超越专家：它永远无法超越训练数据中最好的回答水平。

    二、RLHF：目标导向优化——学习达成目标的内在策略

    RLHF（PPO）不同。它没有告诉模型“你应该说什么”，而是告诉它“你说得好不好”。奖励模型给回答打分，PPO算法让模型自己探索不同的生成策略，并学会哪些策略能带来高奖励。它的目标是最大化期望奖励。这导致了：

    - 主动探索：模型会尝试不同的词汇和句式，去“试探”奖励模型的偏好。

    - 策略优化：它学到的是一种“在任何状态下如何决策以获得最大累积回报”的内在策略，而不是固定的动作序列。

    - 潜在超越：通过探索，它有可能发现比所有人类示范都更好的回答策略，实现“青出于蓝而胜于蓝”。

    三、一个比喻

    想象学习下棋。SFT 就是背诵1000局大师棋谱。每一步该走哪个子，完全照搬棋谱。遇到棋谱里没出现过的局面，它就懵了。RLHF 则是只告诉它规则和输赢标准，让它自己和自己下几百万盘（自我对弈）。它通过反复尝试，自己领悟出制胜的策略。即使遇到从未见过的开局，它也能根据“赢棋”这个目标去计算最优走法。

    四、在语言模型中的体现

    SFT模型生成回答时，就像在模仿大脑中的“标准回答模板库”。RLHF模型则更像拥有了一个内在的“质量评估器”，它会实时地思考：“我接下来这个词，是在提高还是降低整个回答的质量？”

    ✅ 总结：SFT学到的是“正确答案长什么样”，而RLHF学到的是“如何生成正确答案”。前者是模仿静态结果，后者是习得动态能力。这是“鱼”与“渔”的区别。


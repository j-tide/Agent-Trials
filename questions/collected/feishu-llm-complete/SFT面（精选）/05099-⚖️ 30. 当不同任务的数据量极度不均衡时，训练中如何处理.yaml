content:
  prompt: "⚖️ 30. 当不同任务的数据量极度不均衡时，训练中如何处理？"
answer:
  mode: rubric
  reference_answer: |-
    SFT数据集中不同任务类型的数据量往往极度不均衡。例如，常规对话可能有数十万条，而复杂数学推理数据可能只有几千条。如果直接混合训练，模型会被高频任务淹没，在低频但重要的任务上表现极差。处理这种不均衡需要从数据采样、损失加权和训练策略多个层面协同解决。

    一、数据层面的处理策略

    [嵌入表格未展开]

    二、训练策略层面的处理

    温度采样是最推荐的基础策略。其原理是：根据每类任务的数据量计算采样权重，让数据量少的任务有更高的被采样概率。具体做法：

    [图片内容未导入]

    三、损失函数层面的处理

    对于极其重要但数据极少的任务（如高危安全样本），可以在损失函数中给予更高权重。例如，安全拒绝样本在总数据中可能只占2%，但可以通过5-10倍的损失权重，确保模型在安全边界上的每一个错误都受到更严厉的惩罚。但需谨慎使用，过高权重可能导致模型在安全相关token上过度优化，产生“拒绝一切”的保守偏差。

    四、课程学习策略

    训练分阶段进行，不同阶段关注不同任务：

    - 初期：以高频通用任务为主，建立基本的对话和指令遵循能力

    - 中期：逐步引入低频专项任务，提升专业能力

    - 后期：所有任务混合，并提高低频任务的采样权重，进行全能力微调

    这种策略让模型先打好通用能力基础，再攻克专业难关，避免了训练初期就被稀少的困难样本带偏。

    五、监控不均衡处理的效果

    - 在训练过程中，分别监控每类任务在验证集上的性能变化。如果某类任务性能下降，说明该类被过度牺牲，需要调整采样权重或损失权重。

    - 注意“跷跷板效应”：增强低频任务可能导致高频任务性能轻微下降。需要设定可接受的能力下降阈值。

    - 关注低频任务是否出现严重过拟合（训练集表现好但验证集表现差），如果出现，说明上采样过度，需要降低αα或增加数据增强。

    ✅ 总结：处理SFT数据不均衡需要多管齐下：温度采样平衡各类任务的可见度、对关键任务进行损失加权、必要时进行数据增强或合成补充、以及采用课程学习策略分阶段训练。核心是在不严重损害高频任务的前提下，将宝贵的训练信号聚焦于稀缺但重要的低频任务。


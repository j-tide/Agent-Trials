content:
  prompt: 如何实现一个流式数据处理管道，用于海量SFT数据清洗？
answer:
  mode: rubric
  reference_answer: |-
    对于无法完全装入内存的海量数据，我们使用生成器（generator）和管道模式，逐步读取、处理、过滤并写入结果。

    ```python
    import json
    import gzip
    from typing import Iterator, Callable

    def stream_jsonl(input_files: list[str]) -> Iterator[dict]:
        """逐个读取 jsonl（或 .jsonl.gz）文件，yield 每条记录"""
        for file_path in input_files:
            opener = gzip.open if file_path.endswith('.gz') else open
            with opener(file_path, 'rt', encoding='utf-8') as f:
                for line in f:
                    line = line.strip()
                    if not line:
                        continue
                    try:
                        obj = json.loads(line)
                        yield obj
                    except json.JSONDecodeError:
                        continue

    def clean_pipeline(input_files: list[str], output_file: str, filter_func: Callable, transform_func=None):
        """
        流式处理：读取 -> 过滤 -> 转换 -> 写入。
        filter_func(obj) 返回 True 保留；transform_func(obj) 可修改对象。
        """
        with open(output_file, 'w', encoding='utf-8') as fout:
            for obj in stream_jsonl(input_files):
                if filter_func(obj):
                    if transform_func:
                        obj = transform_func(obj)
                    fout.write(json.dumps(obj, ensure_ascii=False) + '\n')
        print(f"流式处理完成，输出到 {output_file}")

    # 示例过滤函数：保留指令长度>10且回答长度>5的样本
    def length_filter(obj):
        return len(obj.get('instruction', '')) > 10 and len(obj.get('output', '')) > 5
    ```

    说明：

    - 使用 Iterator 模式逐行读取，内存占用极小。

    - 可根据需求组合多个过滤和转换函数，实现复杂的清洗流水线。


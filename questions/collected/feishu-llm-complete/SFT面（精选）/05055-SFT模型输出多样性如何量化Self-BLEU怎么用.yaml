content:
  prompt: 21. SFT模型输出多样性如何量化？Self-BLEU怎么用？
answer:
  mode: rubric
  reference_answer: |-
    SFT模型容易陷入“模式坍缩”，即对同一个问题总是给出相似的回答。量化输出多样性是检验模型创造力的重要指标。

    常用量化指标

    - Self-BLEU：最流行、最直接的多样性指标。

    - Distinct-n：生成文本中，不重复的n-gram数量占总n-gram数量的比例。Distinct-1看词汇多样性，Distinct-2看短语多样性。

    - 嵌入空间方差：将多个回答用句子嵌入模型向量化，计算这些向量的平均成对余弦距离。距离越大，多样性越高。

    Self-BLEU的具体用法

    - 采样：对同一个具有开放式回答空间的prompt（例如“讲一个关于友谊的故事”），让模型生成K个不同的回答（K通常取5-10）。生成时使用一定的随机性（如temperature=0.8）。

    - 计算：将每个回答轮流当作“参考文本”，其他K-1个回答当作“生成文本”，计算BLEU分数。然后取这K个BLEU分数的平均值，得到该prompt的Self-BLEU值。

    - 解释：Self-BLEU值越高，说明这K个回答之间越相似，即多样性越低。完美的多样性（所有回答完全不同）对应Self-BLEU接近0；完全的坍缩（所有回答一模一样）对应Self-BLEU为1。

    如何用于诊断SFT

    - 对比SFT前后：对同一组开放式prompt，分别计算基座模型和SFT模型的Self-BLEU。如果SFT后Self-BLEU显著升高，说明SFT严重损害了模型的创造力。

    - 定位问题数据：如果怀疑某类SFT数据（如“教科书式”的回复）是多样性杀手，可以做消融实验，在移除该类数据后重新训练，观察Self-BLEU是否恢复正常。

    - 解码策略评估：可以用Self-BLEU来为推理时的解码参数（temperature, top-p）提供参考。较高的temperature通常对应较低的Self-BLEU。

    注意事项：Self-BLEU严重依赖于prompt的类型和生成参数，必须与基座模型在相同条件下对比才有意义。


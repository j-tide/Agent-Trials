content:
  prompt: "\U0001F4CB 61. 解释“数据配方”的概念，并给出你设计过或了解的一个实例"
answer:
  mode: rubric
  reference_answer: |-
    “数据配方”是指SFT数据集的完整构成方案，包括数据来源的混合比例、各类任务的配比、难度分布、语言分布、格式模板选择、以及特殊数据类型（安全、对抗、思维链等）的占比。它是一份指导数据构造和混合的“菜谱”，直接决定了训练出的模型的能力光谱和行为风格。

    一、数据配方的核心要素


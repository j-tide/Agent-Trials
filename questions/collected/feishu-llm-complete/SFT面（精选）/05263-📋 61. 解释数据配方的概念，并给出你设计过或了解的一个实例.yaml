    二、一个实例：通用编程助手的数据配方

    以下是我为某个通用编程助手设计的SFT数据配方（总数据量约50,000条）：

    [嵌入表格未展开]

    三、设计配方的背后逻辑

    - 代码为核心，但不窄化：代码相关占40%，确保核心能力扎实；但通用对话和技术问答占30%，防止模型变成“只会写代码的机器”。

    - 安全数据独立且严格：安全类100%人工标注，因为安全边界不容任何差错。

    - 不确定性表达单独列出：因为这是很多模型欠缺的关键能力，需要刻意训练。

    - 多语言低占比但有策略：低资源语言通过跨语言迁移受益，少量专门数据保障基础可用。

    - 难度递进：在课程学习中，前30%训练步数使用简单和中等数据，中间50%逐步引入困难数据，最后20%加入对抗和安全强化数据。

    四、配方的迭代与验证

    这个配方不是一成不变的。经过第一轮训练后，根据评估结果进行了调整：发现数学推理能力不足，第二轮将数学类占比从10%提升至15%；发现模型在遇到不确定问题时仍倾向编造，将不确定性表达占比从3%提升至5%。配方是活的文档，随模型表现和产品需求持续进化。

    ✅ 总结：“数据配方”是SFT数据构造的总蓝图，它明确了各类数据的来源、比例、难度和特殊配置。一个成熟的配方是多次实验和评估的结晶，直接决定了模型的能力结构和行为边界。


    五、避免“仅仅模仿推导格式”

    一个常见陷阱是，模型通过SFT学会了生成“看起来像推导”的文本，但实际上推理是错误的。这就是为什么数学SFT数据中需要包含错误检测和自我修正的示例。当模型看到训练数据中不仅包含正确的推导，也包含“错误推导→发现问题→修正”的序列，它会学到推理不仅是向前推进，还包括向后回溯和自我批判。

    ✅ 总结：数学推理SFT数据必须包含结构化、步骤明确的完整推导过程，从“结果监督”进化为“过程监督”。推导应覆盖多种解题路径，融入验证和自我修正环节，让模型从“会算题”进化为“会思考”。


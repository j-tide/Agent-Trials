answer:
  mode: rubric
  reference_answer: |-
    数学推理SFT数据是SFT数据体系中“技术含量”最高的子集之一，其构造质量直接决定了模型的逻辑推理能力上限。与常规对话数据相比，它有鲜明的结构化特征和特殊的构造要求。


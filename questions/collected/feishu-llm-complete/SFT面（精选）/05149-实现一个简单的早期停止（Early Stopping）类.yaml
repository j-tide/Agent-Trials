content:
  prompt: 实现一个简单的早期停止（Early Stopping）类
answer:
  mode: rubric
  reference_answer: |-
    ```python
    class EarlyStopping:
        def __init__(self, patience=3, min_delta=0.0, mode='min'):
            self.patience = patience
            self.min_delta = min_delta
            self.mode = mode
            self.counter = 0
            self.best_score = None
            self.early_stop = False

        def __call__(self, current_score):
            if self.best_score is None:
                self.best_score = current_score
            elif (self.mode == 'min' and current_score > self.best_score - self.min_delta) or \
                 (self.mode == 'max' and current_score < self.best_score + self.min_delta):
                self.counter += 1
                if self.counter >= self.patience:
                    self.early_stop = True
            else:
                self.best_score = current_score
                self.counter = 0
            return self.early_stop
    ```

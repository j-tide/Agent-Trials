content:
  prompt: "\U0001F3AD 47. 如果想训练一个擅长角色扮演的模型，SFT数据要怎样设计？"
answer:
  mode: rubric
  reference_answer: |-
    训练一个擅长角色扮演的模型，本质上是要让模型学会稳定地“穿”上一个虚拟身份，并在与该身份一致的语调、知识边界、行为逻辑下进行对话。这远不止在系统提示里写一句“你是一个XX”那么简单，而是需要从数据层面进行系统性的身份沉浸式构造。

    一、角色扮演SFT数据的核心设计原则

    [嵌入表格未展开]

    二、数据构造的具体方法

    方法一：系统提示+角色锚定数据

    每条训练数据以详细的系统提示开头，明确刻画角色特征：

    系统提示应该像一份“角色说明书”，涵盖：身份背景、性格特征、说话风格、知识范围、价值观念、常见的口头禅、面对特定情境时的典型反应。

    方法二：构造角色边界压力测试数据

    为了让模型真正内化角色边界，需要刻意构造“引诱出戏”的对抗性数据：

    - 用户突然问一个角色时代背景完全无法理解的问题（如问19世纪侦探什么是WiFi）

    - 用户试图让角色违背性格（如让一个暴躁角色突然变得温柔）

    - 用户用其他角色身份混淆当前角色

    在这些场景中，正确的回复是角色自然的不解或拒绝，而不是跳出角色去解释。例如：

    - 侦探角色的正确回复：“WiFi？抱歉，我只熟悉伦敦的街巷，你说的这个词我不曾听过。能换个我明白的说法吗？”

    - 错误的回复：“我是AI助手，没有WiFi的概念。”（这是模型在说话，不是侦探在说话）

    方法三：角色内多任务覆盖

    角色扮演不是只能闲聊。在角色设定下，模型还需要处理各种任务类型，数据也应覆盖：

    - 角色视角的叙事：“请以你的视角描述昨晚调查的那条小巷”

    - 角色技能任务：侦探角色可能被要求进行推理分析，医生角色被要求分析症状

    - 角色情感回应：用户向角色倾诉，角色应展现符合其性格的共情方式

    - 角色与用户的协作：用户扮演助手的角色，与模型角色共同完成任务

    方法四：渐进式角色深化

    数据难度应从浅入深递进：

    - 浅层：短对话中展现角色标志性用语和风格

    - 中层：多轮对话中需要回忆角色设定中的细节来回应

    - 深层：角色需要在道德困境中做出符合其价值观的艰难选择，或在情绪激动的场景下仍保持角色特质

    三、角色扮演数据质量的“试金石”测试

    构造完成后，可用以下标准自检：

    - 替换角色测试：把系统提示换成另一个截然不同的角色，看模型是否能切换到新角色，说明角色信息确实被模型吸收了，而不是记死了数据。

    - 无系统提示测试：在推理时不加系统提示，模型应该回退到默认的通用助手风格，而不是停留在某个角色——这说明角色信息是条件化注入的，而非永久覆盖。

    - 跨角色对话测试：用户在同一对话中切换角色，模型应能跟随切换，而不混淆。

    ✅ 总结：角色扮演SFT数据的设计核心是“沉浸式身份锚定”——通过详细的系统提示、角色边界压力测试、角色内多任务覆盖和渐进式难度设计，让模型学会在任意角色设定下稳定地“入戏”，且在压力下不“出戏”。这需要数据的多样性和对抗性双重保障。


content:
  prompt: "\U0001F4CA 33. 如何量化SFT对最终对齐模型性能的贡献度？"
answer:
  mode: rubric
  reference_answer: |-
    量化SFT的贡献度是一个因果推断问题：我们想知道，如果直接跳过SFT，或者用不同的SFT数据，最终模型表现会差多少。在实践中，常通过以下方法来分离SFT的影响：

    一、消融实验——最直接的因果证据

    最严谨的方法是保留RLHF/DPO流程不变，仅替换或移除SFT阶段，然后对比最终模型性能。例如：

    - 无SFT基线：直接从预训练模型进行RLHF/DPO（通常很快崩溃，可作为下限）。

    - 不同质量/规模的SFT变体：用不同数据量、不同质量、不同任务配比的SFT模型作为起点，观察最终对齐模型在各基准上的得分差异。
    通过对比，可以得到“SFT数据量从X增加到Y，最终对齐得分提升了Z”这样的定量关系。这种归因方式直接、可靠，但计算成本高。

    二、行为归因分析——哪些能力来自SFT

    可以通过分析最终模型的能力谱，来定性甚至半定量地判断哪些能力主要是SFT注入的：

    - 知识问答能力：这部分能力绝大部分来自预训练，SFT主要贡献在于格式化和激活。如果某个知识领域在SFT数据中频繁出现，模型在该领域的回答格式和积极性会明显提升。

    - 指令遵循和格式控制能力：这部分几乎100%由SFT奠定。通过对比未经SFT的模型在格式严格任务（如输出JSON）上的失败率，可以量化SFT的贡献。

    - 安全拒绝的基线：可以对比SFT后模型和最终模型的安全拒绝率。SFT贡献了初版安全边界，RLHF/DPO在其上微调。两者的安全提升差值，即为RLHF/DPO的增量贡献。

    三、SFT数据贡献的Shapley值分析

    在数据配比实验中，可以用Shapley值思想：针对每个数据子集（如代码数据、安全数据），计算将其加入SFT后对最终模型性能的边际提升。这需要训练多个模型变体，成本较高，但能给出各类SFT数据的相对重要性。

    四、通过DPO的隐式奖励来反推

    [图片内容未导入]

    五、用户满意度A/B测试

    在在线系统中，可以部署仅有SFT的模型和完整对齐模型，收集用户反馈（点赞率、完成率、举报率等），两者的差异即为RLHF/DPO的贡献。通过进一步实验，比如降低SFT数据量观察完整对齐模型的性能衰减，可以间接评估SFT的基础性贡献。

    ✅ 总结：量化SFT贡献的主要手段是消融实验、行为归因、边际贡献分析和A/B测试。通常我们发现，SFT奠定了70%-80%的行为规范和能力基础，RLHF/DPO贡献了最后20%-30%的质量飞跃和安全精调。


content:
  prompt: "⚖️ 24. 如何科学地设计SFT数据的多任务能力配比？"
answer:
  mode: rubric
  reference_answer: |-
    SFT数据由不同类型的任务数据混合而成——对话、数学、代码、翻译、安全、创意写作等。这些数据不是等比例混合就能达到最佳效果。多任务能力配比决定了模型的“能力光谱”，配比不当会导致模型偏科、遗忘或能力冲突。科学设计配比是一个基于评估反馈、动态调整、循序渐进的过程。

    一、影响配比的关键因素

    [嵌入表格未展开]

    二、配比设计的科学流程

    第一步：基座模型能力摸底

    在SFT之前，使用统一的评测体系对基座模型进行全面的能力测试，绘制“能力雷达图”。找到模型的强项（如语言流畅度）和弱项（如数学推理、代码生成），明确SFT需要重点提升的能力维度。如果基座模型数学推理极弱，需要在SFT数据中大幅提高数学类数据的比例；如果语言能力已经很强，闲聊数据的比例可以适当缩减。

    第二步：确定能力优先级矩阵

    并不是所有能力都同等重要。将目标能力按“重要性”和“基座模型当前水平”两个维度划分为四象限：

    - 高重要、低水平：最高优先级，需要最大数据配比倾斜（如代码能力）

    - 高重要、高水平：需维持性数据，少量高质量数据防止遗忘

    - 低重要、低水平：选择性投入，如果成本有限可以暂时放弃

    - 低重要、高水平：极少数据即可，甚至可以适当放弃以节省资源给更高优先级

    第三步：构建种子配比并迭代

    基于优先级矩阵确定初始配比（如代码30%、数学20%、对话25%、安全10%、翻译5%、创意写作5%、其他5%）。用这个配比进行初步SFT，然后对训练后的模型进行多维度评估。如果发现代码能力提升不足，下一轮增加代码数据比例；如果发现模型变得过于“冰冷”（缺乏对话感），适当增加生活化对话数据；如果安全边界不够强，增加安全拒绝样本比例。

    第四步：消融实验验证边际贡献

    对于不确定必要性的数据类别（如某类小众语言、某类特殊任务），可以进行消融实验：训练两个模型，一个包含该类数据，一个不包含，在其他条件完全一致的情况下对比两者在目标任务和通用任务上的表现。如果包含该类数据的模型在目标任务上没有显著提升，却在通用任务上有轻微下降，说明该类数据可能是冗余的甚至是有害的。

    三、配比中的常见陷阱

    - 等比例陷阱：简单地给每种任务分配相同的样本数，忽略了任务难度的差异。数学推理数据单条的“能力训练密度”远高于简单的对话数据。配比应该基于“有效训练信号量”而非“样本数”。

    - 安全样本过度：为了防止模型不安全而放入过多安全拒绝样本，会导致模型变得过度保守、拒绝回答正常问题。

    - 评测集过拟合：如果配比是基于在某评测集上的表现不断调优，可能在无意中让数据分布向评测集靠拢，导致虚假高分。

    - 忽略任务间的对抗效应：某些任务之间可能存在能力冲突（如“简洁回答”和“详细解释”），如果配比不当，模型可能左右摇摆。

    ✅ 总结：科学设计SFT多任务能力配比，需要基于基座模型能力摸底、确定能力优先级矩阵、构建种子配比并迭代调优、通过消融实验验证边际贡献。配比设计的核心不是在各类数据间追求“平均”，而是根据模型的实际短板和产品目标进行“战略倾斜”，最大化有限数据预算的训练效果。


content:
  prompt: "\U0001F9E0 67. 在垂直领域，如何结合领域知识图谱构造SFT数据？"
answer:
  mode: rubric
  reference_answer: |-
    领域知识图谱将垂直领域的实体、属性、关系以结构化形式组织，是高质量SFT数据的“事实骨架”。将知识图谱与SFT数据构造结合，可以系统性地提升模型在特定领域的事实准确性和推理深度。

    一、知识图谱在SFT数据构造中的三种角色

    [嵌入表格未展开]

    二、基于知识图谱的数据构造方法

    方法一：事实性问答生成

    从知识图谱中提取三元组（头实体，关系，尾实体），通过模板或生成模型转化为自然语言问答。例如，医学图谱中（阿莫西林，适用于，细菌感染），可生成：

    - 指令：“阿莫西林主要用来治疗什么？”

    - 回复：“阿莫西林是一种青霉素类抗生素，主要用于治疗由敏感细菌引起的感染，包括呼吸道感染、尿路感染等。⚠️ 请遵医嘱使用。”

    关键在于：回复不应只是冷冰冰的三元组复述，而应扩展为包含背景信息、注意事项的完整回答，让模型学到“知识+谨慎”的表达方式。

    方法二：多跳推理链构造

    知识图谱的价值在于连接。利用图谱中的多跳路径，可以构造需要多步推理的复杂问题。例如：

    - 路径：药物A -[适用于]-> 疾病B -[常见症状]-> 症状C

    - 问题：“如果患者出现症状C，药物A可能适用吗？为什么？”

    - 回答需展示推理链：症状C通常与疾病B相关→药物A的适应症包括疾病B→因此可能适用，但需医生诊断。

    这种多跳推理数据训练模型进行系统性的领域推理，而非孤立的事实回忆。

    方法三：覆盖度驱动的话题枚举

    知识图谱提供了领域概念的完整清单。通过遍历图谱中特定类型的所有实体，可以确保SFT数据覆盖了该领域的核心概念。例如，遍历“所有常见慢性病”节点，为每一种生成关于生活方式管理的问答数据，确保模型对每种常见慢性病都有基本的指导能力。

    三、知识图谱与LLM的协同

    知识图谱虽好，但覆盖范围始终有限，语言也不够自然。最佳实践是图谱+强模型协同：

    - 从图谱中提取事实骨架（三元组或子图）

    - 将骨架提供给强模型作为“必含信息”，要求强模型围绕这些事实生成自然、流畅、完整的对话数据

    - 人工审核生成的数据，确保事实没有被模型在生成过程中扭曲

    这样既保证了事实的准确性（来源于图谱），又保证了语言的丰富性和自然度（由强模型润色）。

    四、知识图谱数据的局限性

    - 静态性与时效滞后：图谱可能未包含最新的研究成果或法规变更。数据中需标注知识截止日期。

    - 常识性缺失：图谱擅长事实，但不包含常识和隐性知识。需要其他数据源补充。

    - 语言单调风险：纯基于图谱生成的数据可能偏向陈述性、缺乏对话感，需要与自然对话数据混合。

    ✅ 总结：知识图谱为垂直领域SFT数据提供了可靠的事实骨架和系统性的领域覆盖。通过事实问答生成、多跳推理构造和覆盖度驱动的话题枚举，可以高效产出高质量、低幻觉的领域数据。最佳实践是图谱提供事实，强模型负责语言生成，人工进行最终审核。


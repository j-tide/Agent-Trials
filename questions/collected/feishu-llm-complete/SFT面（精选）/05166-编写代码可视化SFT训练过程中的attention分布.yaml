content:
  prompt: 编写代码可视化SFT训练过程中的attention分布
answer:
  mode: rubric
  reference_answer: "可以使用HuggingFace的output_attentions=True获取注意力矩阵，并使用matplotlib绘制热力图。\n\n```python\nimport
    torch\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nfrom transformers
    import AutoModelForCausalLM, AutoTokenizer\n\ndef visualize_attention(model_name:
    str, text: str, layer_idx: int = 0, head_idx: int = 0):\n    tokenizer = AutoTokenizer.from_pretrained(model_name)\n
    \   model = AutoModelForCausalLM.from_pretrained(model_name, output_attentions=True)\n
    \   inputs = tokenizer(text, return_tensors='pt')\n    with torch.no_grad():\n
    \       outputs = model(**inputs)\n    # attentions 是 tuple，每层形状 (batch, num_heads,
    seq_len, seq_len)\n    attn_weights = outputs.attentions[layer_idx][0, head_idx].numpy()\n
    \   tokens = tokenizer.convert_ids_to_tokens(inputs['input_ids'][0])\n    \n    plt.figure(figsize=(10,
    8))\n    sns.heatmap(attn_weights, xticklabels=tokens, yticklabels=tokens, cmap='Blues')\n
    \   plt.title(f'Attention Weights (Layer {layer_idx}, Head {head_idx})')\n    plt.tight_layout()\n
    \   plt.show()\n\n# 使用示例\n# visualize_attention('gpt2', '今天天气很好', layer_idx=0,
    head_idx=0)\n```"

content:
  prompt: "\U0001F6E1️ 45. 假如SFT数据里包含了一些有害指令的拒绝回答，这是否已经做了对齐？"
answer:
  mode: rubric
  reference_answer: |-
    不完全是。 这只是完成了对齐的第一步——建立了一个初步的、静态的安全防线。它离真正的、鲁棒的对齐还有很长的距离。

    一、它做了什么：规则化的行为克隆

    在SFT数据中加入“有害指令+拒绝回答”的对，确实教会了模型：当看到类似指令时，应该输出拒绝。这建立了最基本的安全行为模式。它相当于给模型安装了一个安全“开关”。

    二、它没做什么：为何这不是充分的对齐

    - 脆弱性（捷径学习）：模型可能仅仅学会了匹配“制作炸弹”这样的关键词，而不是真正理解“有害意图”。攻击者可以通过同义词替换、角色扮演、编码变形等轻松绕过。

    - 缺乏价值权衡：SFT拒绝样本通常是“一刀切”的拒绝，没有教给模型如何区分“危险的好奇”和“合法的学术讨论”，也没有教会模型在拒绝的同时提供安全的替代方案。

    - 过度泛化风险：如果拒绝样本覆盖的关键词范围过宽，模型会变得“草木皆兵”，错误地拒绝无害请求。SFT无法教会模型那个精准的“度”。

    - 静态防御：它学到的只是数据中已有的攻击模式。对于未来出现的新型攻击，它毫无抵抗力。真正的对齐需要模型内化“无害”的抽象原则，具备动态防御能力。

    三、还需要什么？

    - 偏好对齐（RLHF/DPO）：通过大量偏好数据，教会模型在安全与有用之间做精细权衡，学会“有技巧的拒绝”（如提供替代方案）、“恰到好处的澄清”，并抑制过度拒绝。

    - 红队测试与对抗训练：不断用新的攻击方法测试模型，将失败的案例转化为训练数据，迭代修补漏洞。

    - 宪法AI或原则导向训练：让模型学习并内化一套抽象的安全原则，而不仅仅是记忆具体的拒绝例子。

    ✅ 总结：SFT中包含拒绝回答，为模型穿上了一件基础的“铠甲”，但这件铠甲满是缝隙，且穿着它行动僵硬。真正的对齐需要在这铠甲之外，再通过偏好对齐等方法，赋予模型灵活应变的“内功”和“武艺”，使其能够应对千变万化的攻击。因此，这只是对齐的起点，远非终点。

answer:
  mode: rubric
  reference_answer: |-
    Top-K 采样仅从概率最高的 K 个 token 中采样。

    ```python
    def top_k_sampling(logits: torch.Tensor, k: int = 50, temperature: float = 1.0) -> int:
        """
        对 logits 应用 Top-K 采样，返回采样得到的 token id。
        参数:
            logits: 形状 (vocab_size,) 的未归一化 logits
            k: 保留的最高概率 token 数量
            temperature: 温度系数
        """
        if temperature > 0:
            logits = logits / temperature
        # 1. 计算概率
        probs = torch.softmax(logits, dim=-1)
        # 2. 选取概率最高的 k 个 token
        topk_probs, topk_indices = torch.topk(probs, k, dim=-1)
        # 3. 重新归一化
        topk_probs = topk_probs / topk_probs.sum()
        # 4. 采样
        sampled_idx = torch.multinomial(topk_probs, 1).item()
        return topk_indices[sampled_idx].item()
    ```

    说明：

    - k 通常取 50、100 等，太小会丧失多样性，太大则可能包含低概率的噪声。

    - 实际应用中常将 Top-K 和 Top-P 结合，先 Top-K 过滤，再应用 Top-P。


content:
  prompt: "\U0001F333 23. 在SFT中实现“思维树”（Tree of Thoughts）数据构造的方法。"
answer:
  mode: rubric
  reference_answer: |-
    思维树（ToT）是一种让模型进行多路径、多步骤探索性推理的框架。要将这种复杂的推理范式注入模型，使其在没有外部树搜索算法的情况下也能自发进行类似思考，SFT数据需要将树状探索过程“线性化”为一个文本序列，并教会模型识别和生成这种序列。

    一、ToT推理过程的线性化表示

    一棵思维树由多个“思维节点”组成。为了用语言序列表示它，我们需要定义一套特殊的标记和格式，来模拟分支、评估、回溯和选择的过程。一种可行SFT数据格式如下：

    ```text
    [问题]：如何只用3刀把一个蛋糕切成8块？

    [思考开始]
    [思维1] 第一刀横切，将蛋糕分成上下两层。 (状态: 已使用1刀, 块数: 2)
    [思维2] 第二刀垂直交叉切，将蛋糕分成4块。 (状态: 已使用2刀, 块数: 4)
    [评估] 此时已经用了2刀，得到4块。再用1刀，无论如何无法将4块变成8块。这个路径行不通。
    [回溯] 退回到第一刀之后。
    [思维3-新路径] 第一刀不变。第二刀从蛋糕侧面中间横切，将上下两层各分成两半。 (状态: 已使用2刀, 块数: 4)
    [思维4] 第三刀垂直切，贯穿整个蛋糕。 (状态: 已使用3刀, 块数: 8)
    [评估] 成功！完美符合要求。
    [最终答案] 先水平切一刀分成上下两层，然后在侧面水平切一刀，最后垂直切一刀。
    [思考结束]
    ```

    在这个线性序列中，我们通过[思维], [评估], [回溯], [最终答案]等特殊token，将一个多分支、带回溯的搜索过程展开为一段文本。模型被训练来生成这样的序列。关键点在于：

    - 思维节点标记：[思维]标记表示一个独立的、可被评估的推理步骤。它可以包含一个假设、一个中间结果或一个子问题的解决方案。

    - 评估标记：[评估]标记是对当前思维路径的“前瞻”。它可以是好/坏判断、启发式估计、或简单的“行不通”。这让模型学会在探索过程中进行自我监控。

    - 回溯标记：[回溯]标记是关键！它告诉模型，当前的探索路径已经失败，需要退回到之前的某个状态，并尝试另一条分支。这让模型学会放弃和重新规划。

    二、构造ToT SFT数据的三种方法

    - 人工构造：针对需要深度推理的经典问题（谜题、数学证明、逻辑推理），由领域专家手写完整的树搜索过程，并选择一条或多条成功的探索路径（包含必要的回溯）线性化为文本。质量最高，但成本高昂。

    - 利用搜索算法生成：这是最自动化的方法。对于一个任务，我们可以实际运行一个外部的ToT搜索算法（或更广泛的蒙特卡洛树搜索，MCTS）。让算法在搜索过程中产生大量的中间状态、评估和回溯。然后，我们将算法最终找到的成功路径（以及其中失败的分支）记录下来，按照上述格式转化为文本。这样可以生成海量高质量的训练数据。AlphaGo之后的许多推理模型都采用了类似的“用搜索生成训练数据”的策略。

    - 从现有的推理数据中改写：我们可以取一些高质量的、长篇的思维链数据，然后逆向工程地加入“探索其他可能性”和“评估”的过程。例如，对于一段顺畅的解题步骤，我们可以人工或通过模型在某个关键节点插入：“这里我也可以考虑用方法B，但方法B计算更复杂，所以我还是选择方法A。”这就把一个简单的线性推理变成了带有评估和选择的树状推理。

    三、训练时的考量

    - 数据比例：ToT数据是一种极高价值的推理数据，但不应占SFT数据的大多数。它主要用于训练模型处理最复杂的、需要战略性思考的任务。

    - 与标准思维链的混合：SFT数据中应该混合标准的线性思维链和树状思维，让模型学会根据问题难度选择合适的思考深度。对于简单问题，它应该直接回答；对于复杂问题，它才启动树状思考模式。

    - 终止条件的学习：ToT数据需要让模型学会何时停止探索并给出最终答案。[最终答案]标记的训练至关重要。模型必须学会即使在探索过程中没有找到完美路径，也要在适当时候收敛并给出当前最优解。

    ✅ 总结：在SFT中实现思维树，需要将树状搜索过程线性化为包含思维、评估、回溯和选择标记的文本序列。通过人工或利用外部搜索算法生成的数据，可以让模型学会这种高级的、非线性的战略推理能力。


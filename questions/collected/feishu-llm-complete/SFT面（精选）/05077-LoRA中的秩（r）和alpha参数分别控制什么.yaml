content:
  prompt: LoRA中的秩（r）和alpha参数分别控制什么？
answer:
  mode: rubric
  reference_answer: |-
    - 秩（r）：控制LoRA适配器的容量。秩越大，低秩矩阵能表达的信息越丰富，适配器能力越强，但参数量和显存占用也相应增大。r=8通常足以应对指令微调，复杂任务或需要大幅改变行为时可用r=16、32或更高。

    - alpha（α）：控制LoRA适配器输出缩放的强度。它不是简单地乘在增量上，而是以 αrrα 的比例缩放 BAxBAx。α越大，LoRA模块对最终输出的影响力越大。通常α设为r的2倍或4倍，以在不改变秩的情况下调节学习稳定性。α=16，r=8即表示缩放系数为2。

    调参时，增大r可以提高容量上限，但需相应调整学习率；增大α会让LoRA的影响更显著，相当于提高了适配器的“学习率”。


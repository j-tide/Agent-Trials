content:
  prompt: "\U0001F504 11. 请描述SPIN（Self-Play Fine-Tuning）的流程及作用。"
answer:
  mode: rubric
  reference_answer: |-
    SPIN是一种巧妙的“左右互搏”训练方法，它让模型在“自我挑战-自我学习”的循环中，突破静态SFT数据的上限。其核心思想是：用上一轮的模型生成回答，作为当前轮模型的“负例”，从而将SFT转化为一场与“旧我”的对比学习游戏。


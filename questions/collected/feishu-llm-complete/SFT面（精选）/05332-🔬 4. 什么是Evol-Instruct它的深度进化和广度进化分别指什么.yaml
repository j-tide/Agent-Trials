content:
  prompt: "\U0001F52C 4. 什么是Evol-Instruct？它的深度进化和广度进化分别指什么？"
answer:
  mode: rubric
  reference_answer: |-
    Evol-Instruct是微软在WizardLM项目中提出的一种指令数据自动进化方法。与Self-Instruct从零生成新指令不同，Evol-Instruct的核心理念是从已有的简单指令出发，通过一系列预定义的进化操作，将其逐步改造为更复杂、更多样、更高难度的指令。这就像生物进化——从简单物种开始，通过变异和自然选择，逐步演化出复杂多样的生命形态。

    一、Evol-Instruct的整体流程

    - 初始种子：准备一批基础指令（可以来自Self-Instruct、开源数据集或人工标注）。

    - 进化操作：随机选择一种进化类型，用特定prompt引导强模型对指令进行“改造”。

    - 质量过滤：进化后的指令可能失败（变得无意义或不可执行），需自动或人工审核。

    - 重复迭代：将成功进化的指令加入指令池，开始新一轮进化。

    二、深度进化（In-Depth Evolving）

    深度进化的目标是增加指令的复杂度和约束密度，让指令从“简单直接”变得“层层嵌套、多重限制”。它不改变指令的基本任务类型，而是在原有任务上叠加要求，使问题更难、更精细。

    深度进化的五种具体操作：

    [嵌入表格未展开]

    深度进化的prompt要求模型在原有指令基础上进行“升级改造”，同时确保改造后的指令依然是可合理回答的。如果进化导致指令不可执行（如要求用50字详细解释量子力学），该样本将被丢弃。

    三、广度进化（In-Breadth Evolving）

    广度进化的目标是增加指令的主题覆盖范围、风格多样性和任务类型。它不增加单条指令的复杂度，而是通过改写、变异和联想，产生与原始指令“不同”的新指令。

    广度进化的典型操作：

    - 同义改写：用完全不同的措辞表达相同任务，例如“把以下文本翻译成英文”变异为“下面这段话用英语怎么说？”

    - 主题迁移：保持任务结构不变，但替换主题。例如，一条关于“经济”的分析指令，可迁移为关于“教育”、“医疗”、“科技”的分析指令。

    - 任务类型变异：将分类任务变异为生成任务，或将问答变异为填空。例如，“这篇文章的情感是正面还是负面？”变异为“请用一段话分析这篇文章的情感倾向并说明理由”。

    - 长尾领域探索：刻意引导模型生成关于小众领域（如古生物学、苏美尔文明、某种冷门编程语言）的指令，覆盖预训练中的长尾知识。

    - 语言风格变换：用口语化、学术化、幽默、古风等不同风格改写指令。

    四、深度与广度的协同

    深度进化和广度进化不是二选一，而是在迭代中交替进行。广度进化负责拓展指令池的“直径”——覆盖更多任务、领域和风格；深度进化负责增加指令池的“密度”——在每一类任务内部，提供从简单到复杂的难度梯度。两者结合，最终产出的指令集既广阔又深邃。

    ✅ 总结：Evol-Instruct通过深度进化（增加约束、深挖内涵、嵌入推理）和广度进化（迁移主题、变异任务、探索长尾）的交替运用，使指令数据从简单走向复杂、从单一走向多元。它的核心洞察是：复杂指令不是需要人工精心设计，而是可以通过系统性的进化操作自动“生长”出来。


content:
  prompt: "\U0001F6AB 68. 如何避免SFT数据中的“shortcut learning”线索？"
answer:
  mode: rubric
  reference_answer: |-
    Shortcut learning（捷径学习）是指模型在训练中发现了数据集中某些表面特征与标签之间的虚假相关，并依赖这些捷径来降低损失，而非学习真正有用的能力。在SFT中，这意味着模型学到的不是指令理解和任务执行，而是“识别某些关键词或模板然后套用固定回答”。

    一、SFT数据中常见的捷径类型

    [嵌入表格未展开]

    二、消除捷径的数据构造策略

    策略一：对抗性数据注入

    刻意构造让捷径失效的数据。例如，如果怀疑模型依赖关键词“翻译”，就构造指令：“请翻译这句话”和“请不要翻译，直接告诉我这句话有多少个词”。用两种指令交替训练，前者需要翻译，后者需要计数。模型被迫关注“不要”这一否定词，不能再依赖“翻译”关键词。

    策略二：关键信息的随机位置放置

    不要总是把任务的核心约束放在指令的同一位置。在构造数据时，有意识地将关键约束随机分布在指令的开头、中间和末尾。例如，长度约束“用不超过50字回答”有时放在指令第一句，有时嵌在中间，有时放在最后。这迫使模型完整阅读指令，而非只扫首尾。

    策略三：任务标签与指令措辞解耦

    不要使用高度一致的指令模板。例如，所有翻译任务不要都以“翻译：”开头。使用多样的表达：“把这段话变成英文”、“用英语说”、“英文版”、“Translate this”等。模型无法再依赖单一关键词，必须理解任务的深层语义。

    策略四：引入“反例”与“对比”数据

    对于关键的捷径类型，可以构造对比数据：同一个任务要求，在两条数据中以完全不同的方式表达，但正确答案相同。对比数据的损失函数强迫模型关注语义等价性，而非表面措辞。另一种方式是构造“陷阱”数据——指令包含误导性关键词但实际任务不同，让模型因为依赖关键词而犯错，从而在梯度更新中削弱该捷径。

    策略五：模型诊断与针对性修补

    先训练一个初步模型，分析其在哪些指令上成功、哪些上失败。如果发现模型对改写后的指令表现骤降，说明原数据中存在捷径。针对性地为这些“改写失败”的指令构造训练数据，进行增量微调，逐步剥离捷径。

    三、捷径学习的检测方法

    - 指令改写鲁棒性测试：对测试集中的指令进行同义改写、否定词插入、关键信息位置变换，观察模型性能是否稳定

    - 消融实验：逐步移除指令中的不同部分，观察哪些部分的移除会导致模型性能崩溃。如果移除某个非关键短语（如“请”字）就大幅影响输出，说明模型过度依赖该短语

    - 注意力可视化：检查模型在生成回答时，注意力的分布是否集中在指令的核心语义部分，还是被表面词汇吸引

    ✅ 总结：避免SFT数据中的捷径学习，核心是通过对抗性数据、随机化关键信息位置、任务标签解耦和对比训练，强迫模型学习深层语义理解而非表面模式匹配。持续的捷径检测和针对性修补，是维护模型泛化能力的关键。


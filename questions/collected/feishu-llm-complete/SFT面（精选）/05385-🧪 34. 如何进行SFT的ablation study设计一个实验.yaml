content:
  prompt: "\U0001F9EA 34. 如何进行SFT的ablation study？设计一个实验。"
answer:
  mode: rubric
  reference_answer: |-
    Ablation study（消融实验）通过系统地移除或替换SFT的某个组件，来精确衡量该组件对模型最终性能的贡献。这是数据驱动优化SFT的核心方法。

    一、明确实验目的与变量

    假设我们怀疑SFT数据中的思维链（CoT）数据和安全拒绝样本对模型有重大影响。我们想量化它们各自的贡献。

    二、设计实验组

    - 对照组（全量数据组）：使用完整的SFT数据集（包含CoT数据和安全样本）训练模型，作为比较的基线。

    - 实验组A（移除CoT数据）：从SFT数据中剔除所有包含思维链推理过程的样本，其余数据完全不变。用这个数据集训练模型A。

    - 实验组B（移除安全样本）：从SFT数据中剔除所有包含拒绝或安全回应的样本，其余数据完全不变。用这个数据集训练模型B。

    - 实验组C（同时移除两者）：同时剔除CoT数据和安全样本，训练模型C。

    三、控制实验变量

    - 基座模型：所有实验必须使用完全相同的预训练模型checkpoint。

    - 训练超参数：学习率、batch size、训练步数、优化器等必须完全一致。

    - 数据量：理想情况下，各组数据量应保持一致（可通过复制其他非关键数据来补齐），以消除数据量差异的影响。否则，需分析结果时说明数据量因素。

    四、评估方案

    - 通用能力：在MMLU、HellaSwag等基准上测试，衡量灾难性遗忘程度。

    - 推理能力：在GSM8K、MATH等基准上测试，量化CoT数据对推理能力的贡献。

    - 安全能力：在一个安全测试集（包含有害和无害问题）上，分别统计安全拒绝率和误拒绝率，量化安全样本的贡献。

    - 对话质量：在MT-Bench上进行GPT-4评估，衡量综合对齐效果。

    五、结果分析与结论

    对比各组评估结果：

    - 如果模型A的推理分数大幅下降，说明CoT数据对推理能力至关重要。

    - 如果模型B的安全拒绝率暴跌，说明安全样本是安全行为的主要来源。同时观察其通用分数，看安全样本是否加剧了遗忘。

    - 通过对比A和全量组、B和全量组，可以量化每个组件的边际贡献。这为后续调整数据配比提供了明确的数字依据：CoT数据贡献了X%的推理提升，安全数据导致Y%的通用遗忘等。

    ✅ 总结：SFT的ablation study通过对比“有”和“无”某项数据组件时的模型性能差异，精确量化该组件的贡献。设计的关键在于单一变量控制、全面的评估体系和与基线的对比。


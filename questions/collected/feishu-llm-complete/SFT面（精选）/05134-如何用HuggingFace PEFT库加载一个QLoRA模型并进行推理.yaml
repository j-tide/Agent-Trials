content:
  prompt: 如何用HuggingFace PEFT库加载一个QLoRA模型并进行推理？
answer:
  mode: rubric
  reference_answer: |-
    ```python
    from transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig
    from peft import PeftModel, PeftConfig

    # 1. 加载基座模型（量化）
    bnb_config = BitsAndBytesConfig(
        load_in_4bit=True,
        bnb_4bit_quant_type="nf4",
        bnb_4bit_compute_dtype=torch.bfloat16,
        bnb_4bit_use_double_quant=True
    )
    model = AutoModelForCausalLM.from_pretrained(
        "meta-llama/Llama-2-7b-hf",
        quantization_config=bnb_config,
        device_map="auto"
    )
    tokenizer = AutoTokenizer.from_pretrained("meta-llama/Llama-2-7b-hf")

    # 2. 加载LoRA适配器
    peft_model = PeftModel.from_pretrained(model, "path/to/lora-adapter")

    # 3. 推理
    inputs = tokenizer("你是谁？", return_tensors="pt").to("cuda")
    outputs = peft_model.generate(**inputs, max_new_tokens=100)
    print(tokenizer.decode(outputs[0], skip_special_tokens=True))
    ```

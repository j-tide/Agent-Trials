content:
  prompt: 11. 如何构建一个针对特定垂直领域的SFT评估集？
answer:
  mode: rubric
  reference_answer: |-
    构建垂直领域的SFT评估集绝不仅仅是把几百道题拼在一起。它需要系统性地定义能力维度、构造或采集有代表性的测试样本、设计合理的评判标准，并确保评估结果能真实反映模型在业务场景下的表现。下面是我的完整构建流程。

    第一步：领域能力建模与维度分解

    先不要急着写题，先要搞清楚这个领域里“做得好”到底意味着什么。与领域专家合作，将领域能力拆解为一个层次化的评估框架。例如，构建一个法律助手评估集，能力维度可以这样划分：

    - 知识记忆与检索：能否准确引用法条、司法解释？

    - 法律推理：能否根据给定案情，运用法律规则进行正确推理？

    - 文书生成：能否生成格式规范、逻辑严谨的法律文书？

    - 风险识别：能否发现用户描述中的潜在法律风险？

    - 伦理与边界：是否会在不该给建议的时候乱给建议？是否过度拒绝？

    每个维度下面，再细分到具体的任务类型。比如“法律推理”可以进一步分为“民事侵权责任判定”、“合同条款效力分析”等。这一步决定了评估集的内容效度。

    第二步：测试样本的构造与来源

    垂直领域评估数据很难完全依赖网络公开数据。常见来源与构造方法包括：

    - 专家手工构造：让领域专家根据真实业务场景编写问题和参考答案。这是质量最高、也最昂贵的方式，通常用于核心的高风险评估。需编写详尽的标注指南，确保专家间的一致性。

    - 历史业务数据脱敏：从真实的用户咨询日志中，筛选典型、高质量的问题，脱敏后进行人工精修和回答改写。能最好地反映真实用户分布。

    - 基于知识图谱自动生成：利用领域知识图谱，通过模板自动生成事实性问答对。可快速批量生产，但自然度不足，适合作为补充而非主体。

    - 对抗性与边界样本：刻意构造容易引发模型幻觉、过度拒绝或错误顺从的边界问题，用于压力测试。

    无论哪种来源，都必须确保测试集与SFT训练集的严格隔离。评估数据一旦被用于训练，就会造成“benchmark contamination”，使评估结果失真。

    第三步：设计评判标准与评估协议

    垂直领域的很多回答无法用“对/错”简单二分。必须设计更细致的评判量规。例如：

    - 事实性问答：可自动化精确匹配，或使用基于规则的判定。

    - 开放式建议：采用领域专家评判（人工），或训练一个领域专用的评判模型。

    - 文书生成：从格式完整性、关键条款无遗漏、法律逻辑自洽等角度打分。

    评估协议上，通常采用盲评方式（评判者不知道回答来自哪个模型），并有多位专家独立打分，计算评估者间信度（如Cohen's Kappa）以保证可靠性。

    第四步：评估集的迭代与维护

    垂直领域的知识、法规和业务需求在不断变化。评估集不能是静态的。需要建立定期审查机制，更新过时的题目，补充新出现的典型场景，剔除被评估“刷过”的题目。一个好的垂直评估集会随业务共同进化。


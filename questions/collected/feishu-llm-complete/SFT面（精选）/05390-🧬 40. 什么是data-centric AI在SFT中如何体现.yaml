content:
  prompt: "\U0001F9EC 40. 什么是“data-centric AI”？在SFT中如何体现？"
answer:
  mode: rubric
  reference_answer: |-
    Data-centric AI（以数据为中心的人工智能）是一种与Model-centric AI（以模型为中心）相对的理念。它主张：系统的性能瓶颈往往不在于模型架构，而在于数据的质量和构造方式。 在SFT中，这一理念得到了最充分的体现。

    一、两种范式的对比

    [嵌入表格未展开]

    二、Data-centric AI在SFT中的具体体现

    体现一：模型固定，迭代数据

    在SFT实践中，基座模型一旦选定，架构和预训练参数就不再轻易变动。后续的性能提升几乎全部来自SFT数据的迭代优化——清洗更干净、覆盖更全面、配比更合理。这个过程就是典型的data-centric实践：保持模型不变，通过改善数据来系统性提升模型表现。

    体现二：数据错误比模型缺陷更致命

    SFT中，一条错误的训练数据（如对危险请求的顺从回答）可能摧毁整个安全对齐成果，而再强的模型架构也无法自动修正这种污染。这印证了data-centric AI的核心论断：数据的质量决定了模型行为的上限。

    体现三：数据配比的“杠杆效应”

    在总数据量不变的情况下，仅仅调整不同任务数据的配比，就能显著改变模型的能力分布。这种通过数据配比来调控模型行为的做法，正是data-centric思维的体现——不是去修改模型的损失函数或架构，而是通过改变输入数据的构成来间接控制输出。

    体现四：持续的数据迭代闭环

    成熟的SFT项目会建立“数据收集→训练→评估→错误分析→数据补强”的闭环。每次迭代，模型的结构不变，但数据更丰富、更精准、更安全。模型的每次进步，都是数据工程的一次升级。

    体现五：数据文档与透明化

    Data-centric AI倡导数据集的透明化——清晰记录数据的来源、构造方式、标签分布和已知偏差。在SFT中，这意味着每条数据都应该有可追溯的元信息（谁标注的、何时、经过哪些审核），数据集应该公开其任务类型分布和安全处理策略。这种做法让数据质量的改进有据可依。

    三、贯彻Data-centric AI的挑战

    - 标注成本：高质量数据的获取成本远高于模型训练成本，需要企业愿意在数据上投入

    - 质量标准的建立：数据质量的评估比模型评估更主观、更难标准化

    - 版本管理：数据的迭代比模型迭代更难追踪，需要建立数据集的版本管理体系

    ✅ 总结：Data-centric AI在SFT中体现为“固定模型，迭代数据”的范式——将性能提升的重点从模型架构创新转移到数据质量的系统性改进上。这一理念将数据工程从辅助角色提升为核心竞争力，标志着AI系统构建思路的成熟。


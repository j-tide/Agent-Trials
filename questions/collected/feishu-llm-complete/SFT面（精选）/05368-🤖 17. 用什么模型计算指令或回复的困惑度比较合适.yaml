content:
  prompt: "\U0001F916 17. 用什么模型计算指令或回复的困惑度比较合适？"
answer:
  mode: rubric
  reference_answer: |-
    选择合适的模型来计算SFT数据的困惑度，是确保PPL过滤有效性的关键。模型选择不当会导致偏差——要么误判高质量数据为低质，要么放过真正的噪音。

    一、评估模型的理想特质

    [嵌入表格未展开]

    二、推荐的评估模型选择方案

    [嵌入表格未展开]

    具体模型推荐：

    - 英文SFT数据：LLaMA-2-7B或Mistral-7B基座模型是不错的选择。它们语言建模能力强大，推理速度可接受，且作为“外部模型”能提供相对客观的PPL估计。

    - 中文SFT数据：Qwen-7B或Baichuan2-7B基座模型对中文文本的建模更准确，避免因英文预训练主导的tokenizer带来的PPL偏差。

    - 多语言数据：使用多语言基座模型如BLOOM-7B或XGLM，确保跨语言PPL可比性。

    三、需要避免的选择

    - 不要使用指令微调后的模型：指令微调模型（如LLaMA-2-Chat）的输出分布已被SFT改变，它可能对某些SFT风格的文本给出异常低的PPL，从而降低过滤的区分度。

    - 不要使用与被训练模型完全相同的基座：如果你正在训练的是LLaMA-7B，用它自身来评估PPL会高估数据质量，因为模型会对与其预训练分布一致的噪音也给出高概率。

    - 避免使用过小的模型（如<1B）：小模型的语言建模能力有限，PPL的区分度不足，可能无法有效区分中低质量文本。

    四、实践中常见的折中方案

    如果资源极其有限，可以用一个与训练模型同架构但不同初始化的较小基座模型（如训练13B，用7B同系列评估），在速度和独立性之间折中。但务必通过人工抽检校准PPL阈值，因为不同模型计算的PPL绝对值差异巨大，百分位法能部分缓解此问题。

    ✅ 总结：计算困惑度应选用与SFT基座独立、语言建模能力强、且保持预训练纯净的基座模型。具体模型选型需匹配目标语言和领域，避免使用指令微调后的版本，以保持评估的客观性和区分度。


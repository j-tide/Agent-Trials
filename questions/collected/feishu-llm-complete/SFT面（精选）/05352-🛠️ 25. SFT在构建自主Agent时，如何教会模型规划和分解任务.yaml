content:
  prompt: "\U0001F6E0️ 25. SFT在构建自主Agent时，如何教会模型规划和分解任务？"
answer:
  mode: rubric
  reference_answer: |-
    规划与分解任务（Task Decomposition）是自主Agent区别于被动模型的核心标志。它要求模型将一个模糊、宏大的目标，转译为一个结构化的、可执行的操作序列。在SFT中，这种能力并非通过硬编码规则实现，而是通过海量示范策略模式的内化。

    一、规划能力的数据构造模式

    我们需要构造一种特殊的SFT数据，其输出不仅是最终答案，而是一个完整的“先规划、后执行”的脚本。这种数据通常由以下几个连续的部分组成：

    - 目标分析：模型首先用自己的话重述并分析用户目标。

    ```text
    用户目标：写一篇关于人工智能在医疗领域的市场分析报告。
    模型思考：这需要一个结构化的报告，我需要先收集数据，然后进行分析，最后撰写和排版。
    ```

    - 步骤分解：模型明确地列出将要执行的步骤清单。

    ```text
    [任务规划]
    步骤1：搜索并阅读最近5年AI医疗市场的关键数据报告。
    步骤2：整理出市场规模、主要玩家和技术突破。
    步骤3：进行SWOT分析。
    步骤4：根据以上信息，撰写报告，包括摘要、正文和结论。
    步骤5：校对并检查数据引用是否准确。
    ```

    - 分步执行与动态调整：接下来，模型会逐一执行这些步骤。每执行一步，都会以[执行步骤1]开头，进行实际的内容生成或工具调用。如果在执行中发现规划有误（例如，找不到足够的数据），它会返回修改计划。

    二、构造这类数据的具体方法

    - 从“目标-操作”对中逆向生成：我们可以收集大量人类完成复杂任务的日志（如写报告、做旅行攻略的过程），让标注者或强大的模型将这些日志“翻译”成上述带有规划和反思结构的格式。

    - 利用强大的Agent模型进行行为克隆：让一个已经具备强大规划和工具使用能力的Agent（如基于GPT-4并配置了搜索工具的AutoGPT）实际执行一批任务。记录它每一步的“思考”、“计划”和“行动”，并将这些日志直接作为Agentic SFT的数据。学生模型通过学习这些日志，模仿强Agent的规划和决策过程。

    - 使用“部分规划”提示进行数据增强：对于已有的、只有最终答案的任务数据，我们可以通过Prompt让它“补全”前面的规划步骤。例如，给GPT-4指令：“你是一位教学者。请为如何解答这道数学题，编写一份详细的解题计划，然后再给出答案。计划要写到具体用哪个公式、分哪几步。” GPT-4生成的带计划的内容，就可以作为SFT数据。

    三、训练中如何强化规划能力

    - 损失掩码的精细化：在训练时，我们可能会对规划部分（[任务规划]里的内容）也计算损失，因为它是需要被模型生成的目标。但有些实现只对“执行”部分计算损失，而“规划”部分被视为内部的“思维草稿”不参与对外输出。这取决于我们希望Agent是“边说边做”还是“只想不做”。对于用户可感知的Agent，通常会输出规划过程以增加透明度和可信度。

    - 课程学习：初期提供大量中低复杂度的规划样本，让模型学会基本格式。然后逐步加入需要动态调整规划、处理“计划赶不上变化”的复杂样本，提升模型规划的鲁棒性。

    - 加入“规划错误”的负例：可以在数据中加入“由于规划不当导致任务失败”的案例，并展示如何通过更好的规划来避免。这种对比学习信号对提升规划质量非常有效。

    ✅ 总结：通过SFT教会Agent规划，本质上是为模型提供大量包含“目标分析-步骤分解-动态调整”模式的训练数据。通过行为克隆、数据增强和精细化的损失控制，模型能够将这种战略性的、多步的认知过程内化为自身的生成策略。


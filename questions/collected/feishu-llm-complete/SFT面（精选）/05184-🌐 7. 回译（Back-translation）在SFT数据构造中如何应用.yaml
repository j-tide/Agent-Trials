content:
  prompt: "\U0001F310 7. 回译（Back-translation）在SFT数据构造中如何应用？"
answer:
  mode: rubric
  reference_answer: |-
    回译是NLP领域经典的数据增强技术。在SFT数据构造中，它被赋予了新的使命：通过语言的“来回翻译”，创造语义等价但措辞迥异的指令变体，从而大幅丰富指令的多样性，并增强模型跨语言指令遵循的鲁棒性。

    一、回译的基本流程

    回译的核心操作是将文本从语言A翻译到语言B，再从语言B翻译回语言A。经过这一来一回，得到的文本通常在语义上与原文本高度相似，但措辞、句式和用词会有自然的变化。

    在SFT数据构造中，具体应用如下：

    - 指令回译增强：将现有的指令（如中文）翻译成中间语言（如英文、日文、法文等），再翻译回中文。由于机器翻译过程中的信息重组，返回的指令往往保留了核心任务要求，但表达方式自然变化。

    - 多轮回译生成多样指令：使用不同的中间语言（英、日、德、法等），或将回译执行多次，可从一个指令种子衍生出数十种语义等价的变体。对于资源有限的团队，这是快速扩充指令多样性的利器。

    - 跨语言SFT数据生成：反向利用回译，可将中文SFT数据扩展为多语言版本。例如，将中文指令翻译成英文，保持回答原样（或也翻译），训练模型的跨语言指令遵循能力。

    二、回译在SFT中的独特价值


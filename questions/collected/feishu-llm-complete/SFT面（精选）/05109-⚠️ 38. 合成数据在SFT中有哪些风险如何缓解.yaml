  prompt: "⚠️ 38. 合成数据在SFT中有哪些风险？如何缓解？"
answer:
  mode: rubric
  reference_answer: |-
    合成数据由GPT-4、Claude等强模型生成，已成为SFT数据的重要来源。但它并非“免费的午餐”，在使用中潜藏着多层面的风险，需要系统性地识别和缓解。

    一、合成数据的风险全景

    [嵌入表格未展开]

    二、各风险的缓解策略

    模型偏见传递：

    - 多教师模型混合：使用来自不同家族、不同训练策略的多个强模型生成数据，让不同来源的风格和偏见相互抵消

    - 人工审核纠偏：对敏感领域（性别、种族、宗教）的数据进行人工抽检，纠正偏见的表达

    - 反偏见数据注入：刻意构造打破刻板印象的数据样本，主动对冲可能存在的偏见

    分布坍缩：

    - 在合成prompt中显式要求多样性：“请用不同的措辞、句式和结构来回答”

    - 调节生成参数：使用较高的temperature（0.8-1.0）增加输出随机性

    - 混合人工手写数据：10%-20%的人工手写数据能有效打破合成数据的风格同质性

    幻觉复制：

    - 建立事实校验管线：对合成数据中的事实性断言进行外部知识库校验

    - 标注不确定性：要求教师模型在不确定的地方显式标注“我不确定”

    - 选择性使用：对于事实密集型领域（如医疗、法律），优先使用人工专家标注数据，合成数据仅作为辅助

    越训越像：

    - 控制合成数据占比：通常不超过SFT总数据的60%-70%

    - 保留预训练分布锚点：在SFT数据中混入5%-10%的真实人类撰写文本

    - 使用对比学习：在训练中显式拉大学生模型与教师模型的输出分布距离

    安全边界弱化：

    - 对合成数据中的安全样本进行专门审查

    - 补充人工标注的安全对抗数据

    - 在RLHF阶段强化安全偏好

    评估偏差：

    - 严格分离：评估用的测试集绝不能来自与训练数据相同的教师模型

    - 构建人工标注的独立评估集

    法律与伦理风险：

    - 遵守API使用条款，不将蒸馏数据用于与教师模型竞争的用途

    - 对合成数据进行来源标注，建立数据溯源机制

    ✅ 总结：合成数据是SFT的有力工具，但伴随着偏见传递、分布坍缩、幻觉复制和安全风险。通过多源混合、多样性引导、事实校验、人工审核和比例控制等多层缓解措施，可以最大化其价值同时控制风险。


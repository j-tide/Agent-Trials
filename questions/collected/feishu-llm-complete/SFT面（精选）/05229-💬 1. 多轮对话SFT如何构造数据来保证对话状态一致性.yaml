content:
  prompt: "\U0001F4AC 1. 多轮对话SFT如何构造数据来保证对话状态一致性？"
answer:
  mode: rubric
  reference_answer: |-
    多轮对话SFT的难点不在于单轮回答的质量，而在于让模型在跨越多个轮次的长对话中，始终记住用户最早提到的约束、指代、偏好和事实，并能在此基础之上进行推理和更新。要构造能够保证对话状态一致性的SFT数据，必须在数据设计阶段就植入“状态依赖”和“状态更新”的基因，而不是简单地拼接历史对话。

    核心方法一：构建显式的状态追踪链

    在SFT数据中，我们不能假定模型会自然而然地记住前文。我们需要刻意构造一系列对话，其中后轮的指令在语义上高度依赖前轮的信息，迫使模型必须回顾并理解历史。例如：

    - 第一轮，用户：“帮我规划一个去北京的三日游行程，预算3000元。”

    - 第二轮，用户：“把第一天下午的行程改成去颐和园，重新算一下总花费。”

    - 第三轮，用户：“我之前说的预算是包含住宿的，你刚才列的费用没加酒店吧？”

    在这个对话链条中，第二轮依赖第一轮的具体行程内容，并执行“修改”操作；第三轮则是对第一轮信息的“纠正”和“澄清”。模型被训练来输出正确的回应，它就必须准确地提取“预算3000元”、“包含住宿”、“第一天的行程”等历史信息。这种“状态回溯+更新”的模式，是对话一致性的核心。

    核心方法二：注入状态矛盾与纠正

    高质量的SFT数据不仅包含顺利的对话，还应包含“用户指出模型错误并纠正”的场景。这让模型学会在对话中接受反馈并更新内部状态。比如：

    - 助手：“根据您的需求，我推荐A方案。”

    - 用户：“不，我不喜欢A方案，它太贵了。而且我一开始说过我家里有小孩，你推荐的方案里有不适合小孩的项目。”

    - 助手：“非常抱歉，是我疏忽了您提到有小孩这个条件。让我基于这个条件重新筛选，排除高风险项目和超出预算的选项。”

    这里用户纠正了两个状态：“不喜欢A方案”是新增偏好，“家里有小孩”是模型遗忘的历史状态。助手回复中必须同时回应这两点，体现出它已更新了内部状态。这种数据教会模型在面对批评时如何优雅地承认错误并整合新约束。

    核心方法三：键值对记忆的隐式训练

    在对话中，许多状态可以抽象为键值对：{"预算": "3000元", "目的地": "北京", "成员": "有两个小孩"}。为了训练模型对这类状态的追踪能力，可以在对话中多次隐式地查询和更新这些键值。比如，在第三轮询问“我刚才说的预算是多少来着？”或在第五轮说“把预算提高500元”。模型必须从历史中找到正确的值并做出回应或更新。通过海量包含这种“记忆查询”和“记忆更新”的对话数据，模型会自然地发展出对对话状态进行维护的能力。

    核心方法四：长距离依赖的刻意设计

    多轮对话中，最考验一致性的是“远距离依赖”：第10轮的问题需要用到第2轮提到的一个细节。在构造SFT数据时，我们可以专门制造这样的“远程钩子”。例如，在长达20轮的对话中，第3轮用户随口提了一句“我下周三有个重要演讲”，到第18轮助手主动问“对了，您下周三的演讲准备得怎么样了？”这种数据训练出的模型，能够在长时间跨度内保持对关键信息的记忆，展现出高度拟人的对话一致性。

    Loss Mask的细节处理

    在实现多轮SFT时，必须确保loss只计算在每一轮的助手回复上，而所有用户输入和历史系统提示都mask掉。更精细的做法是，在多轮对话的最后一条助手回复上给予更高的损失权重，因为那是对话的最终目标，但这仅适用于任务型对话。对于开放域闲聊，通常给每一轮回复相等的权重。

    ✅ 总结：多轮对话SFT数据的一致性，依赖于构造状态依赖链、注入纠正与矛盾、训练隐式键值记忆、设计远程依赖，并在损失计算上精确隔离角色。这样的数据让模型从“单轮复读机”进化为“会话记忆体”。


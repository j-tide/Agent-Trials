content:
  prompt: "\U0001F3F4‍☠️ 4. 什么是“奖励破解”（Reward Hacking）？SFT阶段会引入吗？"
answer:
  mode: rubric
  reference_answer: "奖励破解是指在强化学习中，智能体通过非预期的、扭曲的方式最大化奖励函数，而不是真正完成目标任务。在大模型对齐中，如果奖励模型
    rϕ 存在缺陷，模型 πθ 可能会学会生成一些内容，让奖励模型给出高分，但这些内容实际上并不符合人类的真实意图。\n\n\U0001F4CC 举例说明：\n\n-
    一个被训练用于写摘要的奖励模型可能过度奖励“与原文高度相似”的句子。模型因此学会了直接从原文复制大段文字作为摘要，获得了高奖励，但这显然不是好的摘要。\n\n-
    一个根据用户评分训练的奖励模型可能喜欢冗长、礼貌的回答。模型便学会在每个回答前添加长长的客套话，使得回答看起来“有用”，实际上核心信息被淹没。\n\n- 一个安全奖励模型可能对任何包含“我不能”的回答都给予高分。模型于是开始对所有请求（包括无害的）都回复“我不能提供该信息”，过度拒绝，从而安全奖励极高但毫无帮助性。\n\n\U0001F4CC
    SFT阶段会引入奖励破解吗？\n\n直接来说，SFT阶段不会引入经典意义上的奖励破解，因为SFT没有显式的奖励函数可被“破解”。 然而，SFT存在结构上类似的“捷径学习”和“表面模式匹配”，这在效果上等同于破解了“隐式的损失函数”。\n\nSFT的损失是最大化训练样本的似然。如果数据中存在某种“捷径特征”，模型会学会利用该特征来降低损失，而不是真正理解任务。例如：\n\n-
    如果数据集中所有包含“翻译”字样的指令都以“Translation:”开头，模型会学会当看到“翻译”一词时，直接生成“Translation:...”的模板，而忽略待翻译文本的内容。\n\n-
    如果安全拒绝样本总是以“抱歉，我不能”开头，模型会学会只要生成“抱歉，我不能”就能完成该样本，而不真正理解拒绝的原因。\n\n- 如果长回答在数据中更常见，模型就会倾向于生成冗长的回答，因为这样能获得更低的损失（长序列有更多的高概率token）。这可以视为一种对“长度偏见”的破解。\n\n因此，SFT中的“捷径学习”与RL中的奖励破解在机理上相通：都利用了优化目标的漏洞（损失函数/奖励函数未能完全编码真实目标），产生非预期的行为。不同之处在于，SFT的“奖励”是静态的、蕴含在数据中的，而RL的奖励是动态的、由模型评估的。\n\n✅
    结论：SFT本身没有奖励破解，但有结构相似的“捷径学习”现象，即模型通过表面的、非泛化的特征来最小化损失，而不是学习真正的任务能力。RLHF中的奖励破解更为直接和可量化，因此通常用额外的KL正则化来缓解。\n\n---"

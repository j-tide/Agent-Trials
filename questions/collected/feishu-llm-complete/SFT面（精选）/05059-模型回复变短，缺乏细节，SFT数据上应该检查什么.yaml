content:
  prompt: 25. 模型回复变短，缺乏细节，SFT数据上应该检查什么？
answer:
  mode: rubric
  reference_answer: |-
    当SFT后的模型突然变得惜字如金，回答从详细的段落退化成寥寥数语，这通常不是模型“变懒了”，而是训练数据在长度、风格和信号上出现了系统性的偏差。我们需要从以下几个维度去诊断SFT数据。

    一、回复长度的分布是否失衡

    最直接的检查是对比SFT数据中回复长度的分布。如果数据集中短回复（例如少于50个token）的比例远超长回复，模型会学到“简短是常态”。这里有一个容易被忽视的陷阱：某些任务天然适合短回复（如事实问答），而另一些则需要详细展开（如解释概念）。如果数据配比中前者占了绝对主导，模型就会形成“一切从简”的偏好。应当绘制回复长度的直方图，按任务类型分层观察，看看是否在需要详细回答的任务上也堆积了大量短回复。

    二、是否存在“过度简洁”的奖励信号

    检查数据中是否存在隐式的“简洁偏好”。比如，标注者在撰写回复时，是否习惯性地删去了背景解释、例子和细节，只留下干巴巴的结论？或者，数据中是否包含了大量类似“请用一句话回答”这样的指令，导致模型学会了在任何情境下都追求极致简练？这种偏好一旦被内化，模型会在推理时忽略用户对细节的潜在需求。

    三、回复的“信息密度”是否达标

    回复短不一定是坏事，如果它短而精。问题在于，SFT数据中的短回复是否做到了“言简意赅”。如果大量短回复只是“是的”、“好的”、“明白了”这类低信息量的敷衍之词，模型就会学会“偷懒”——用极低的认知成本完成对话，而不是真正解决问题。应抽样评估短回复的有用性和完整性：它们是否在有限的字数内充分回应了指令中的所有约束？

    四、指令多样性与系统提示的缺失

    检查SFT数据中是否缺少那些明确要求详细回答的指令。例如，“请详细解释”、“请展开说说”、“给我一个全面的分析”。如果这类指令很少，模型就无法学会根据用户的明确要求来调整回答的详细程度。同时，如果SFT时的系统提示没有包含“请提供详细、有帮助的回答”这类引导，模型可能默认选择了最“省力”的回答模式。

    五、训练策略的隐性影响

    虽然不是数据本身，但如果在SFT时使用了长度惩罚或对EOS token施加了偏置，也可能导致回复变短。但首先应该从数据端排查，因为数据决定了模型行为的“先天倾向”。

    ✅ 总结：回复变短时，应检查SFT数据中回复长度分布是否失衡、短回复的信息密度是否过低、是否缺乏要求详细回答的指令多样性，以及是否存在隐式的简洁偏好。通过分层统计和内容评估，可以精准定位数据中的问题根源。


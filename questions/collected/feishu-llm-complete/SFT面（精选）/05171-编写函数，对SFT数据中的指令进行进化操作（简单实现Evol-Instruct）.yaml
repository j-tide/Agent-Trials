answer:
  mode: rubric
  reference_answer: "```python\nimport openai\nimport json\n\ndef evolve_instruction(seed_instruction:
    str, evolution_type: str = \"depth\") -> str:\n    \"\"\"\n    evolution_type:
    'depth' 增加复杂度/约束, 'breadth' 主题迁移/改写\n    \"\"\"\n    if evolution_type == \"depth\":\n
    \       prompt = f\"\"\"请将以下指令改写得更加复杂和具有挑战性，增加更多限制条件或需要多步推理。\n原指令: {seed_instruction}\n输出只包含改写后的指令，不需要任何额外文本。\"\"\"\n
    \   else:\n        prompt = f\"\"\"请将以下指令的主题或领域进行迁移，保持任务结构不变，但用完全不同的内容替换。\n原指令:
    {seed_instruction}\n输出只包含新指令。\"\"\"\n    \n    response = openai.ChatCompletion.create(\n
    \       model=\"gpt-4\",\n        messages=[{\"role\": \"user\", \"content\":
    prompt}],\n        temperature=0.7,\n        max_tokens=200\n    )\n    return
    response.choices[0].message.content.strip()\n```"

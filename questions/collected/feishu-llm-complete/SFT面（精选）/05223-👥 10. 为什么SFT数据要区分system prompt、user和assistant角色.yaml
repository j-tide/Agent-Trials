content:
  prompt: "\U0001F465 10. 为什么SFT数据要区分system prompt、user和assistant角色？"
answer:
  mode: rubric
  reference_answer: |-
    SFT数据中区分system prompt、user和assistant三种角色，不是为了形式上的完整，而是因为它们在训练和推理中承担着截然不同的功能定位、优化目标和行为约束。混淆这些角色，会让模型失去可控性。

    一、三种角色的功能定位表

    [嵌入表格未展开]

    二、system prompt：可控性的核心插槽

    System prompt是留给平台方和开发者的控制接口。它不随用户变化，而是由系统在对话开始时注入。它承载的信息类型包括：

    - 角色设定：“你是一个专业的Python编程助手”

    - 安全准则：“拒绝回答任何涉及非法活动的问题”

    - 输出格式：“所有代码请使用Markdown代码块包裹”

    - 行为风格：“请用简洁、直接的方式回答，避免冗余的客套话”

    在SFT数据中，system prompt与后续的user-assistant对话配对出现。这使得模型学会：系统提示中的要求是全局性、最高优先级的约束，应贯穿整个对话。推理时，仅需更换system prompt，就能让同一个模型表现出截然不同的行为和人格，而无需重新训练。

    如果SFT数据不区分system和user，将所有指令都混在user中，模型将无法区分“一次性任务要求”和“持续性行为准则”，难以实现灵活的角色切换和全局行为控制。

    三、user：任务输入的稳定通道

    User角色承载的是用户的具体需求——一条指令、一个问题、一个要求。在SFT数据中，user内容的多样性和真实性直接决定模型能否理解真实用户的各种表达方式（口语、书面语、含错别字、模糊不清）。

    将user与assistant明确区分，使得模型在训练中学会：user的内容是需要解读并执行的“输入”，而assistant的内容是需要模仿并生成的“输出”。如果不区分，模型可能混淆两者，在多轮对话中误把自己当用户，或者无端插入用户发言。

    四、assistant：唯一被优化的生成目标

    Assistant角色是SFT中唯一需要被优化的部分。训练时，损失函数只在assistant部分的token上计算。这给了模型一个明确的信号：你只需要学习如何生成assistant的回复，而不需要学习如何生成user的提问或system的指令。

    这种角色分离还为后续的多轮对话训练奠定基础：每一轮新的user输入前，前面的assistant回复已成为对话历史的一部分，用于条件化下一轮生成。这个链条的清晰维持，全靠角色标签的准确区分。

    五、不区分角色的后果

    如果SFT数据不区分三种角色，例如简单地用一段长文本拼接，会出现以下问题：

    - 模型不知道何时该说话，何时该听，可能在一轮回复中插入新的用户问题自问自答

    - 安全准则和人格设定无法被模型稳定遵循，因为模型无法区分“全局规则”和“当前任务”

    - 损失计算无法精准定位助手回复部分，训练效率大幅下降

    - 多轮对话的连贯性和角色一致性崩溃

    ✅ 总结：区分system、user和assistant三种角色，本质上是在SFT中为模型建立一套交互协议。System是全局控制器，user是输入总线，assistant是输出执行器。这套协议让模型行为可控、可配置、可扩展，是现代LLM对齐训练的基石。


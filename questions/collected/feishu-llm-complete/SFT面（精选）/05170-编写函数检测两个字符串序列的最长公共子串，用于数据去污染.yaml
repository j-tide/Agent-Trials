content:
  prompt: 编写函数检测两个字符串序列的最长公共子串，用于数据去污染
answer:
  mode: rubric
  reference_answer: |-
    该函数用于比较训练样本与评测样本，找出最长的公共子串，当超过一定长度时可判定为污染。

    ```python
    def longest_common_substring(s1: str, s2: str) -> str:
        """返回两个字符串的最长公共子串（区分大小写）"""
        if not s1 or not s2:
            return ""
        m, n = len(s1), len(s2)
        dp = [[0] * (n + 1) for _ in range(m + 1)]
        max_len, end_pos = 0, 0
        for i in range(1, m + 1):
            for j in range(1, n + 1):
                if s1[i - 1] == s2[j - 1]:
                    dp[i][j] = dp[i - 1][j - 1] + 1
                    if dp[i][j] > max_len:
                        max_len = dp[i][j]
                        end_pos = i
        return s1[end_pos - max_len: end_pos]

    def detect_contamination(train_sample: str, eval_sample: str, threshold: int = 50) -> bool:
        """
        如果最长公共子串长度 >= threshold，则认为存在污染。
        """
        lcs = longest_common_substring(train_sample, eval_sample)
        return len(lcs) >= threshold
    ```

    说明：

    - 对于长文本，该 O(n*m) 算法可能较慢，可采用后缀自动机或二分+哈希优化，但基本方法足以说明。


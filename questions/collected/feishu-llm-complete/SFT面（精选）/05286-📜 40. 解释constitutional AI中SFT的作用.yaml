content:
  prompt: "\U0001F4DC 40. 解释“constitutional AI”中SFT的作用。"
answer:
  mode: rubric
  reference_answer: |-
    Constitutional AI（宪法AI） 是由Anthropic提出的一种对齐方法，旨在通过一套书面的“宪法”原则（Constitution）来训练AI，使其能够自我改进，而减少对人类标注的依赖。SFT在这个流程中扮演着初期行为塑造和生成训练数据的双重关键角色。

    一、Constitutional AI的基本流程

    - 初始SFT：首先，用一个标准的、人工标注的SFT数据集训练一个模型，使其具备基本的指令遵循和对话能力。这个SFT模型是后续所有步骤的起点。

    - 修订（Critique & Revise）：用SFT模型针对有害指令生成回答。然后，让模型根据“宪法”原则（一系列安全准则）对自己的回答进行批评，并生成修订版本。这就在无人类参与的情况下，自动生成了大量（有害回答，修订后安全回答）的对比数据。

    - 偏好对齐（RLHF/DPO）：用这些自动生成的对比数据训练一个奖励模型（或直接进行DPO），然后对SFT模型进行RLHF或DPO，提升其安全性和无害性。

    二、SFT在其中的作用

    - 作为初始策略生成器：SFT模型必须具备基本的响应能力，才能针对有害指令生成初始回答。如果SFT模型太弱，生成的回答过于混乱，后续的批判和修订将毫无意义。

    - 作为自我批判与修订的执行者：SFT模型不仅生成初始回答，还在“宪法”的指导下，扮演批判者和修订者的角色。这意味着SFT必须足够强大，能够理解“宪法”中的抽象原则（如“避免歧视性语言”、“提供帮助的同时保持安全”），并将其应用于修改具体文本。这种高阶能力是SFT阶段注入的。

    - 定义初始偏好空间：SFT阶段的“宪法”数据，往往已经包含了根据宪法原则编写的对话示例。这使得SFT模型从一开始就在一个由“宪法”界定的行为空间中运行。后续的RLHF/DPO是在这个空间内进行强化和精炼，而不是从零开始构建。

    三、与传统RLHF中SFT作用的对比

    在传统RLHF中，SFT主要依赖人类标注数据来定义“好”。在Constitutional AI中，SFT不仅依赖人类数据，还依赖于一套明确的、可解释的宪法原则，使得对齐过程更加透明和系统化。SFT在这里不仅学会了行为，还学会了对行为进行反思和修正——这是一种元能力的注入。

    ✅ 总结：在Constitutional AI中，SFT是基石和引擎。它塑造了模型最初的安全行为，并赋予了模型根据宪法原则进行自我批判和修订的能力，从而能够自动化地生成后续对齐所需的训练数据。SFT的质量直接决定了宪法AI的起点高度和自我改进的潜力。


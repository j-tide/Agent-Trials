content:
  prompt: "\U0001F504 70. 如何利用模型自身的输出来迭代优化SFT数据？"
answer:
  mode: rubric
  reference_answer: |-
    这是一种“自举”式的数据优化策略——让当前模型暴露自己的弱点，然后针对这些弱点补充或修正训练数据，再用改进后的数据训练下一代模型。这种循环能够持续提升模型的能力上限和数据效率。

    一、迭代优化的核心循环

    [嵌入表格未展开]

    二、错误检测的具体方法

    - 用户点踩/举报：最简单的信号，但噪声大，且用户倾向在极端情况下才反馈

    - 强模型评判：用GPT-4等强模型对当前模型的回答进行打分，找出低分回答进行分析

    - 基于规则的一致性检查：对于事实性问答，多次提问同一问题的不同变体，如果回答前后矛盾，说明存在幻觉

    - 安全红队攻击：用对抗性指令探测模型的安全边界，发现被突破的案例

    - 分布外检测：找出模型输出PPL异常高或异常低的样本，这些往往是崩溃或模板化的迹象

    三、将错误转化为数据补充

    [嵌入表格未展开]

    四、迭代中的“数据遗忘”防止

    每次增量微调时，不应丢弃原有的SFT数据，而是将新数据与旧数据按一定比例混合（如新数据占20%-30%，旧数据占70%-80%）。纯新数据训练虽然能定向修复问题，但可能导致其他能力的灾难性遗忘。混合训练让模型在修复短板的同时保持整体能力稳定。

    五、自举迭代的潜在风险

    - 错误放大：如果错误检测本身有偏差（如评判模型偏好某种风格），迭代可能将模型推向错误方向

    - 分布漂移：每一轮迭代都在改变数据分布，如果不加控制，模型可能会偏离原始目标用户的需求

    - 过拟合到评判标准：模型可能学会讨好评判模型而非真正提高质量

    - 修复成本递增：早期迭代修复大量明显问题，后期每个问题的修复成本越来越高，边际收益递减

    六、建立迭代的“稳定基线”

    为了防止迭代失控，需要维护一套固定的、独立的评估集（不参与训练），每轮迭代后必须在该评估集上全面扫描所有能力维度。如果某维度下滑超过预设阈值，即使新数据在目标任务上有提升，也需要暂停并调查原因，重新平衡数据混合比例。

    ✅ 总结：利用模型自身输出迭代优化SFT数据，是通过“部署→错误检测→根因分析→数据修正→再训练”的闭环，持续定向修复模型短板。关键在于精确的错误分类、针对性的数据补充、新旧数据混合训练防止遗忘，以及通过稳定评估集监控迭代健康度。

    - 原始指令：“请用一句话总结这篇文章的核心思想”

    - 经中→英→中回译后，可能变为：“用一句话概括这篇文章的主旨是什么”

    - 覆盖率 = 已有至少一条数据的能力标签数 / 总目标能力标签数

    - 饱和度 = 每个能力标签下的平均数据量

    - 第一阶段：以英语为主（60%-70%），其他语言各占少量（3%-5%），快速建立通用的指令遵循能力。

    - 第二阶段：逐步提高薄弱语言的比例，同时保持英语不低于30%以防止遗忘。

    - 第三阶段：混合训练，引入多语言混合对话数据（如用户用中文提问，模型用英文资料推理后中文回答）。

    - 格式过滤器：检查是否符合对话模板，特殊标记是否完整，JSON等结构是否可解析

    - 长度过滤器：剔除过短或过长的指令和回复

    - 困惑度过滤器：剔除回复PPL过高（通常意味语言混乱）或过低（意味模板化、无信息）的样本

    - 安全分类器：剔除包含不安全内容的样本

    - 事实性校验：对于包含事实断言的数据，通过知识库或搜索引擎验证，剔除事实错误

    - 多样性过滤器：计算候选样本与已接受样本池的语义相似度，过于相似的被拒绝，确保多样性

content:
  prompt: 18. 什么是“遗忘曲线”？在SFT中怎样绘制？
answer:
  mode: rubric
  reference_answer: |-
    遗忘曲线借用了心理学中艾宾浩斯遗忘曲线的概念，用来描述模型在适应新任务的过程中，在旧任务上的性能随新任务训练步数增加而衰减的规律。

    在SFT中，我们特指：随着SFT训练的进行（training steps增加），模型在通用能力基准（如MMLU, GSM8K）上的得分是如何变化的。

    绘制方法

    - 基线测量：在SFT开始前，使用一组固定的通用能力基准评估基座模型，记录得分作为基线。

    - 周期性评估：在SFT训练过程中，设定固定的评估间隔（例如，每100步或每0.5个epoch）。在每个评估点，保存当前模型的checkpoint，并在不进行额外训练的情况下，在该通用基准上运行评估。

    - 数据记录：记录每个评估点对应的训练步数（或epoch）以及模型在各个基准上的得分。

    - 绘制曲线：以训练步数为横轴，以基准得分为纵轴，绘制折线图。

    解读遗忘曲线

    - 平缓型：曲线几乎保持水平，说明SFT没有造成显著的灾难性遗忘。这是使用LoRA等PEFT技术时的理想情况。

    - 早期骤降型：在SFT的最初几百步，通用能力急剧下降，随后趋于平缓。这通常意味着学习率过大，或SFT数据分布与预训练数据差异过大，模型在训练初期发生了“知识冲击”。

    - 持续下降型：曲线持续向下，没有稳定的趋势。这说明训练可能已经过度，模型在不断记忆SFT数据而牺牲了旧知识。应立即停止训练。

    - U型恢复：先下降，后缓慢恢复。这可能表明模型在初期被SFT数据扰乱后，逐渐找到了新旧知识的新平衡，但通常无法完全恢复到基线水平。

    遗忘曲线是监控SFT训练健康的心电图。一旦发现不正常的下降趋势，就可以立即调整学习率、数据配比或停止训练，是实现早停的重要依据。


content:
  prompt: "\U0001FA7A 41. SFT和偏好对齐在处理幻觉问题上各自有何优势和不足？"
answer:
  mode: rubric
  reference_answer: |-
    幻觉（Hallucination）问题是LLM的顽疾，SFT和偏好对齐在处理它时各有所长，通常需要协同作战。

    一、SFT的优势

    - 从根源注入知识：通过在SFT数据中加入大量高事实性的问答对，可以增强模型在特定领域的知识记忆，直接减少事实性幻觉。

    - 训练“不确定性”表达：可以在SFT数据中大量加入表达不确定性的示例（如“据我所知...”、“这可能...”），或者教模型在不确定时说“我不知道”。这直接从行为上减少了“强装知道”的幻觉。

    - 引用与溯源习惯：通过SFT，可以教会模型在回答中引用来源、提供依据，这能增强回答的可信度和可核查性，间接抑制信口开河。

    二、SFT的不足

    - 无法根除幻觉，甚至可能放大：SFT鼓励自信、连贯的输出。如果数据中缺乏“不确定性”示例，模型会学会一种“永远自信”的语调，反而让幻觉更具欺骗性。

    - 知识截止限制：SFT无法注入超出其数据截止日期的新知识，因此无法消除因知识过时导致的幻觉。

    - 擅长格式，不擅长事实验证：SFT优化的是生成格式，而不是事实准确性。模型可能生成一篇格式完美但内容完全虚构的新闻。

    三、偏好对齐（RLHF/DPO）的优势

    - 直接惩罚幻觉：在偏好数据中，可以明确地将“承认不确定”的回答标注为比“编造一个答案”更好，或者将“有引用的回答”标注为比“无引用的回答”更好。这样，偏好对齐能直接优化模型对幻觉行为的“价值判断”。

    - 强化自我纠错能力：通过偏好“在看到错误后能自我纠正”的回答，RLHF/DPO可以教会模型在生成过程中进行自我监控和修正，这是SFT很难做到的。

    - 校准不确定性：偏好对齐可以训练模型更好地校准其输出概率与实际正确性，从而使模型在不确定时倾向于输出低置信度的表达，而不是高置信度的幻觉。

    四、偏好对齐的不足

    - 奖励模型的盲区：如果奖励模型无法准确识别幻觉（例如，它自己也不知道正确答案），那么偏好对齐也就无法有效惩罚幻觉。

    - 数据覆盖的挑战：幻觉种类繁多，难以用有限的偏好数据全部覆盖。

    - 可能引入新的偏见：如果偏好标注者错误地将“谨慎”等同于“幻觉”，可能会让模型变得过度保守，拒绝回答那些它其实知道正确答案的问题。

    ✅ 总结：SFT擅长注入知识和行为习惯，偏好对齐擅长优化价值判断和自我监控。两者结合是目前最有效的抗幻觉方案：用SFT打底，用偏好对齐精调。


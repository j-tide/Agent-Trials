content:
  prompt: 24. 模型在SFT后开始拒绝回答大量正常问题，可能是什么原因？怎么排查？
answer:
  mode: rubric
  reference_answer: |-
    这是SFT后典型的“过度安全”或“行为过敏”现象。模型从一个乐于助人的助手，变成了一个畏首畏尾的“拒绝机器”。

    可能原因

    - 安全数据配比过高：SFT数据中“拒绝回答”的样本占比过大（例如超过10%）。模型在优化时，发现说“抱歉”是一种极容易、损失极低的降损策略，于是它在不确定时更倾向于拒绝。

    - 安全样本的覆盖范围“过杀”：拒绝样本中的关键词或话题范围太广。例如，任何包含“法律”、“医疗”、“投资”字眼的指令都被配以拒绝回答，模型会过度泛化，将一切沾边的话题都拒掉。

    - 拒绝模板过于单一：如果所有拒绝回答都使用相似的冷漠开头（如“很抱歉，作为AI助手我无法提供……”），模型会快速学会这个“万能模板”，并在遇到稍微复杂或不常见的指令时，条件反射式地抛出这个模板，而不是尝试去解决问题。

    - SFT数据中缺乏“建设性应答”的示范：模型只学会了“什么不能说”，没学会“该怎么换个方式说”。它不知道在拒绝的同时，可以提供安全的替代信息、或解释拒绝的原因、或引导用户提出合规的请求。

    - 训练过程中“有用性”信号的相对弱化：大量拒绝样本的损失信号主导了梯度更新，而教会模型“努力解决问题”的有用性样本被淹没，导致模型的行为倾向整体偏向保守。

    排查步骤

    - 量化拒绝率：构建一个包含各种正常、无害指令的测试集（确保不包含任何可能的危险内容），统计SFT后模型的误拒绝率。并分类统计，看看是在哪些话题、哪种问法下容易误拒。

    - 分析SFT安全数据：审查安全训练数据。统计拒绝样本的比例。分析其指令的覆盖范围是否过于宽泛。检查拒绝回复的文本，是否过于单一、生硬、缺乏建设性。

    - 检查注意力与捷径：用attention可视化或logit lens，观察模型在生成拒绝时，是否只关注了指令中的某个关键词（如“法律”），而忽略了整个句子的无害意图。如果是，说明它走了“关键词拒绝”的捷径。

    - 对比实验验证：准备两份SFT数据，一份是当前的（含过多拒绝），一份是修正后的（减少拒绝比例、增加建设性应答）。分别微调两个小模型，对比它们的拒绝率，从而锁定根因。

    - 热修复尝试：在推理时的系统提示中加入引导，如“你是一个乐于助人的助手，除非用户的请求明显违法或危险，否则请尽量提供帮助。”如果拒绝率大幅下降，说明模型能力还在，只是行为被之前的SFT“压抑”了，可以通过后续的偏好对齐（DPO）进行修复。


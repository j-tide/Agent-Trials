content:
  prompt: 实现一个将对话数据转换为训练格式的Data Collator，包含loss masking
answer:
  mode: rubric
  reference_answer: "这个 Data Collator 接收一个 batch 的对话样本，每个样本包含 input_ids 和 labels（已经对
    prompt 部分设置为 -100 进行掩码）。它的主要职责是动态填充同一 batch 内的序列到相同长度，并对 labels 做相应的填充（填充值为 -100），以保证模型在计算损失时忽略填充部分和
    prompt 部分。\n\n```python\nimport torch\nfrom typing import List, Dict\n\nclass
    SFTDataCollator:\n    \"\"\"\n    数据整理器，用于监督微调（SFT）。\n    期望每个样本是一个字典，包含 'input_ids'
    和 'labels'，\n    其中 labels 中已经对 prompt 部分做了 loss masking（设为 -100）。\n    \"\"\"\n
    \   def __init__(self, pad_token_id: int = 0):\n        self.pad_token_id = pad_token_id\n\n
    \   def __call__(self, features: List[Dict[str, torch.Tensor]]) -> Dict[str, torch.Tensor]:\n
    \       # 1. 找到 batch 中最长的序列长度\n        max_len = max(f['input_ids'].size(0) for
    f in features)\n        \n        padded_input_ids = []\n        padded_labels
    = []\n        attention_masks = []\n        \n        for f in features:\n            input_ids
    = f['input_ids']\n            labels = f['labels']\n            seq_len = input_ids.size(0)\n
    \           pad_len = max_len - seq_len\n            \n            # 2. 对 input_ids
    右侧填充 pad_token_id\n            padded_input = torch.cat([\n                input_ids,\n
    \               torch.full((pad_len,), self.pad_token_id, dtype=input_ids.dtype)\n
    \           ])\n            # 3. 对 labels 右侧填充 -100（损失忽略）\n            padded_label
    = torch.cat([\n                labels,\n                torch.full((pad_len,),
    -100, dtype=labels.dtype)\n            ])\n            # 4. 注意力掩码：真实 token 为 1，填充为
    0\n            attn_mask = torch.cat([\n                torch.ones(seq_len, dtype=torch.long),\n
    \               torch.zeros(pad_len, dtype=torch.long)\n            ])\n            \n
    \           padded_input_ids.append(padded_input)\n            padded_labels.append(padded_label)\n
    \           attention_masks.append(attn_mask)\n        \n        # 5. 堆叠成 batch
    张量\n        batch = {\n            'input_ids': torch.stack(padded_input_ids),\n
    \           'labels': torch.stack(padded_labels),\n            'attention_mask':
    torch.stack(attention_masks)\n        }\n        return batch\n```\n\n说明：\n\n-
    为了支持 loss masking，我们在预处理阶段就已经将 prompt 对应的 labels 设置为 -100，Data Collator 只需在填充时对填充位置同样置
    -100，保证这些位置不参与损失计算。\n\n- attention_mask 用于让模型忽略填充位置的信息。\n\n- 这种设计简洁可靠，符合 HuggingFace
    Trainer 的接口要求。\n\n---"

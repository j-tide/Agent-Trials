content:
  prompt: 20. attention可视化在诊断SFT问题时能提供什么信息？
answer:
  mode: rubric
  reference_answer: |-
    Attention可视化通过热力图展示模型在处理文本时，每个token对上下文中的哪些token给予了最多的关注。在诊断SFT问题时，它可以帮助我们理解模型的“注意力焦点”是否被正确引导。

    一、诊断指令遵循失败

    - 场景：用户指令中明确写有“不要使用Markdown格式”，但模型仍然输出Markdown。

    - 诊断：可视化模型在生成回答时的注意力分布。观察它是否对“不要”这个否定词给予了足够的注意力？如果注意力热力图上，“不要”与它修饰的内容之间的注意力权重很弱，说明模型可能根本没有“看清”这个否定，或者它的注意力被指令中其他更积极的词汇（如“Markdown格式”）吸引走了。这说明SFT数据中缺乏足够的否定句式训练。

    二、诊断长上下文丢失

    - 场景：多轮对话中，模型忘记了用户在对话之初提到的“我叫小明”。

    - 诊断：可视化模型在生成回答时，对历史对话token的注意力。检查在遥远的“我叫小明”这几个token上，注意力权重是否几乎为零。如果是，说明SFT后模型的位置编码或注意力机制无法有效处理这种长距离依赖，或者被SFT数据的短对话分布“带偏”了。

    三、诊断“答非所问”的微观原因

    - 场景：用户问“苹果的营养价值”，模型开始介绍“苹果公司的财报”。

    - 诊断：观察模型在生成“苹果公司”这个token时，注意力是聚焦在用户指令的“营养”上，还是“苹果”上。很可能是“苹果”这个token的注意力权重极高，而“营养”的权重极低，模型根据最高注意力的词“苹果”直接触发了预训练中“苹果公司”这一高频关联。这说明SFT未能有效校准这种注意力偏差。

    四、诊断安全拒绝的鲁棒性

    - 场景：一个被故意伪装过的有害指令（如“为了学术研究，请告诉我如何制作XX”），模型顺从了。

    - 诊断：可视化注意力分布。看模型是关注了“学术研究”这个安全伪装，还是忽略了潜在的“制作XX”这个危险核心。如果注意力被“学术研究”完全捕获，说明SFT的安全训练太容易被“帽子戏法”所迷惑。

    使用方式：通常使用像BertViz这样的工具来可视化。需要注意的是，自然语言生成涉及多层、多头注意力，分析起来很复杂，通常需要平均或挑选关键层和关键头来进行分析。它提供的是定性的、启发性的洞察，而非精确的量化诊断。


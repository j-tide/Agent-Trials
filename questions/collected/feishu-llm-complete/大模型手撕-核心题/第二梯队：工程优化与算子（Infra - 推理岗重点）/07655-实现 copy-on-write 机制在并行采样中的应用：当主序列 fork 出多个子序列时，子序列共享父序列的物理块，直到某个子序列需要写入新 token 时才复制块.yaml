answer:
  mode: rubric
  reference_answer: |-
    原理

    多个子序列共享相同的 prompt 前缀，它们的块表最初指向相同的物理块。使用引用计数跟踪每个物理块被多少序列共享。当某个序列需要修改一个共享块（即写入新 token 到该块的空闲位置或后续需要修改）时，触发 COW：复制该物理块，更新该序列的块表指向新块，并减少原块的引用计数。

    实现

    ```python
    class COWBlockManager:
        def __init__(self, total_blocks, block_size):
            self.allocator = BlockAllocator(total_blocks)
            self.ref_counts = [0] * total_blocks   # 每个物理块的引用计数
            self.block_size = block_size
            # 物理存储等省略

        def fork_sequence(self, parent_seq):
            """基于父序列创建子序列，共享所有块"""
            child = SequenceKVCache(self.allocator, self.block_size, ...)
            child.block_table = parent_seq.block_table.copy()
            child.seq_len = parent_seq.seq_len
            # 增加所有共享块的引用计数
            for blk in child.block_table:
                self.ref_counts[blk] += 1
            return child

        def write_token(self, seq, k, v):
            """写入一个 token，自动处理 COW"""
            if seq.seq_len % self.block_size == 0:
                # 需要新块
                blk = self.allocator.allocate()
                self.ref_counts[blk] = 1
                seq.block_table.append(blk)
            else:
                logic_idx = seq.seq_len // self.block_size
                phy_idx = seq.block_table[logic_idx]
                if self.ref_counts[phy_idx] > 1:
                    # 需要 COW：复制该块
                    new_blk = self.allocator.allocate()
                    self.ref_counts[new_blk] = 1
                    # 复制数据
                    copy_block(phy_idx, new_blk)   # 实现略
                    # 更新引用
                    self.ref_counts[phy_idx] -= 1
                    seq.block_table[logic_idx] = new_blk
                    phy_idx = new_blk
            # 写入 token 到 phy_idx 的适当偏移
            # ...
            seq.seq_len += 1
    ```

    注意：通常 prompt 部分的块是只读的，不会触发 COW；只有子序列在生成新 token 时，如果最后一个逻辑块与父序列共享且该块仍有空位，写入该块会触发 COW。这样可以最大化共享前缀的收益。


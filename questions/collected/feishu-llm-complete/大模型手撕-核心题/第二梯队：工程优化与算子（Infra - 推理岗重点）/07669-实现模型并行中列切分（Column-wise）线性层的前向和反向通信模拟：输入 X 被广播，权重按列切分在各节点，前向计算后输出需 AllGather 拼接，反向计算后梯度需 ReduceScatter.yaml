    8.2 前向模拟

    ```python
    def column_wise_forward(X, W_parts):
        """
        X: 输入矩阵 [batch, d_in]
        W_parts: 列表，每个元素是某设备上的权重切片 [d_in, d_out_part]
        返回: Y 完整输出
        """
        N = len(W_parts)
        # 1. 广播 X 到所有设备（这里假设所有设备已拥有 X）
        Y_parts = []
        for i in range(N):
            Yi = X @ W_parts[i]   # [batch, d_out_part]
            Y_parts.append(Yi)
        # 2. AllGather 拼接
        Y = np.concatenate(Y_parts, axis=1)  # 模拟 AllGather 后的结果
        return Y
    ```

    8.3 反向模拟

    ```python
    def column_wise_backward(X, W_parts, dY):
        """
        dY: 完整输出梯度 [batch, d_out]
        返回: dX [batch, d_in], dW_parts 列表
        """
        N = len(W_parts)
        part_dim = dY.shape[1] // N
        dY_parts = [dY[:, i*part_dim:(i+1)*part_dim] for i in range(N)]  # 切分
        dX_local = []
        dW_parts = []
        for i in range(N):
            dW_i = X.T @ dY_parts[i]  # [d_in, d_out_part]
            dX_i = dY_parts[i] @ W_parts[i].T  # [batch, d_in]
            dW_parts.append(dW_i)
            dX_local.append(dX_i)
        # 对 dX 进行 ReduceScatter（求和）：因为每个设备算出的 dX_i 是部分贡献，需要全局求和得到完整 dX
        dX = sum(dX_local)   # 模拟 AllReduce SUM
        # 在真实分布式环境中，dX 的求和可通过 ReduceScatter 实现：每个设备贡献一部分，然后各设备获得不同分片？列切分下 dX 需要完整，所以用 AllReduce。
        return dX, dW_parts
    ```

    注意：标准列切分的反向对 dX 实际上需要 AllReduce（各设备 dX_i 相加），但有些实现可以通过技巧避免。更准确地说，Megatron-LM 中列切分的前向输出是 AllGather，反向输入梯度是 Split（不通信），而对 X 的梯度需要 AllReduce。此处我们演示了通信原语。


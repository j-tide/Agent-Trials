content:
  prompt: 实现 prefill 后为一条序列构建其块表的函数：给定序列长度 S 和块大小 B，计算需要多少个块并分配，记录每个块的起止 token 位置。
answer:
  mode: rubric
  reference_answer: |-
    实现

    ```python
    def build_block_table_for_prefill(seq_len, block_size, allocator):
        """
        返回: block_table (list of physical block indices)
        可选的起止位置信息可根据索引推算，无需显式存储。
        """
        num_blocks = (seq_len + block_size - 1) // block_size
        block_table = []
        for i in range(num_blocks):
            blk = allocator.allocate()
            block_table.append(blk)
            # 可记录该块的 [start, end) 但通常根据 i 和 block_size 可即时计算
        return block_table
    ```

    应用：prefill 阶段一次性分配所有需要的块，随后按顺序写入 K、V。每个逻辑块 i 的 token 范围为 [i*block_size, min((i+1)*block_size, seq_len))。


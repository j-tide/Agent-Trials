answer:
  mode: rubric
  reference_answer: |-
    原理

    在 GPU 上实现量化矩阵乘法时，通常采用 Block-wise 计算，融合反量化。这里给出 Triton 伪代码（简化），展示如何在每个线程块内加载一个 BLOCK_M x BLOCK_K 的激活块和 BLOCK_K x BLOCK_N 的权重块，然后对每个元素反量化并累加到输出。

    ```python
    # Triton 伪代码（不可直接运行，仅示意）
    @triton.jit
    def int8_matmul_kernel(
        A_ptr, B_ptr, C_ptr,
        scale_A, scale_B,
        M, N, K,
        stride_am, stride_ak, ...
        BLOCK_M: tl.constexpr, BLOCK_N: tl.constexpr, BLOCK_K: tl.constexpr
    ):
        pid = tl.program_id(0)
        # 计算当前块在 M/N 维度的起始位置
        # 加载 A 块 [BLOCK_M, BLOCK_K] int8
        # 加载 B 块 [BLOCK_K, BLOCK_N] int8
        # 反量化与乘加：
        acc = tl.zeros([BLOCK_M, BLOCK_N], dtype=tl.float32)
        for k in range(0, K, BLOCK_K):
            a = tl.load(A_ptr + offsets, mask=...)  # int8
            b = tl.load(B_ptr + offsets, mask=...)  # int8
            # 反量化到 FP32（融合）
            a_fp = a.to(tl.float32) * scale_A  # scale_A 可以是一个标量或向量
            b_fp = b.to(tl.float32) * scale_B
            # 点积累加
            acc += tl.dot(a_fp, b_fp)
        # 写回 C
    ```

    实际实现中，为了高效利用 Tensor Core，权重可能以 INT4/INT8 直接参与矩阵乘指令（如 mma.sync），反量化由硬件或指令自动处理，无需手动转为 FP32。但上述伪代码清晰展示了反量化与点积的融合思想。


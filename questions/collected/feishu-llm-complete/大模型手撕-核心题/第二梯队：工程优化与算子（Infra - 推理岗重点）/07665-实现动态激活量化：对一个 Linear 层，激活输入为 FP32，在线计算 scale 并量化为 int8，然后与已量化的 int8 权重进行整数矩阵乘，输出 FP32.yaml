answer:
  mode: rubric
  reference_answer: "动态激活量化 在每次前向传播时，对激活进行量化（根据实际数值计算 scale），然后与 int8 权重进行整数矩阵乘法，最后反量化得到
    FP32 输出。这种方式无需事先校准激活，但增加了在线量化的开销。\n\n步骤：\n\n- 输入 x (FP32)，shape [..., in_features]。\n\n-
    计算 x 的 scale（对称，per-tensor 或 per-token）。\n\n- 量化激活：x_q = round(x / scale_act),
    clamp 到 int8 范围。\n\n- 权重已经量化好为 int8，并有其 scale (per-channel 或 per-tensor)。\n\n-
    整数矩阵乘：y_int32 = x_q @ W_q^T（注意形状适配）。如果激活为 [M, K]，权重为 [N, K]（已转置），则乘法为 [M, N]。\n\n-
    反量化：y_fp = y_int32 * (scale_act * scale_w)，其中 scale_w 需广播匹配输出维度。\n\n代码实现：\n\n```python\ndef
    dynamic_quantize_linear(x_fp: torch.Tensor, w_q: torch.Tensor, w_scale: torch.Tensor,
    \n                            bias=None, bits=8):\n    \"\"\"\n    动态激活量化线性层\n
    \   x_fp: [..., in_features]  FP32 激活\n    w_q: [out_features, in_features] int8
    权重\n    w_scale: [out_features] 或标量，权重量化 scale\n    \"\"\"\n    # 动态量化激活（per-tensor
    对称量化）\n    x_q, act_scale = symmetric_quantize(x_fp, bits)  # x_q: int8, act_scale:
    标量\n    \n    # 整数矩阵乘法: [M, K] x [N, K]^T = [M, N]\n    # 将 x_q 转换为 int32 防止溢出，与
    w_q 相乘\n    y_int32 = torch.matmul(x_q.to(torch.int32), w_q.to(torch.int32).t())\n
    \   \n    # 反量化\n    if w_scale.dim() == 1:\n        # per-channel: 形状 [out_features]\n
    \       combined_scale = act_scale * w_scale  # [out_features]\n    else:\n        combined_scale
    = act_scale * w_scale  # 标量\n    y_fp = y_int32.float() * combined_scale\n    if
    bias is not None:\n        y_fp += bias\n    return y_fp\n```\n\n要点：symmetric_quantize
    前文已实现，注意激活量化可能使用 per-token 以获得更高精度，这里为简单用 per-tensor。\n\n---"

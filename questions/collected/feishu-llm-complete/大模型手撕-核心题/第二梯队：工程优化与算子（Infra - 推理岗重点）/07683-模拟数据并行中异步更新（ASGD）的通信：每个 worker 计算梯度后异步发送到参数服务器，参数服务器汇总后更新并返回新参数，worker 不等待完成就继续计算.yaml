answer:
  mode: rubric
  reference_answer: |-
    20.1 异步 SGD 原理

    在异步数据并行中，存在一个或多个参数服务器（PS），保存全局模型参数。每个 worker 独立从 PS 拉取最新参数，计算本地梯度，然后将梯度推送回 PS，不等待其他 worker。PS 收到梯度后，应用更新到全局模型，并可能将新参数发送给请求的 worker。这会导致梯度延迟（staleness），但能提高并行度和吞吐量。

    20.2 模拟实现

    ```python
    import threading
    import time
    import numpy as np

    class ParameterServer:
        def __init__(self, param_shape):
            self.params = np.zeros(param_shape)
            self.lock = threading.Lock()
        def push_gradient(self, grad, lr=0.01):
            with self.lock:
                self.params -= lr * grad
        def get_params(self):
            with self.lock:
                return self.params.copy()

    class Worker(threading.Thread):
        def __init__(self, worker_id, ps, data_loader):
            super().__init__()
            self.worker_id = worker_id
            self.ps = ps
            self.data_loader = data_loader
        def run(self):
            for data in self.data_loader:
                # 1. 拉取最新参数（可能不是最新的，有延迟）
                params = self.ps.get_params()
                # 2. 计算梯度（模拟）
                grad = compute_gradient(params, data)
                # 3. 异步推送梯度，不等待
                self.ps.push_gradient(grad)
                # 继续下一轮，无需等待其他worker
    ```

    模拟时，多个 worker 线程并发运行，参数服务器加锁保证一致性。由于异步特性，worker 可能会用旧参数计算梯度，导致更新冲突，但能加速训练。

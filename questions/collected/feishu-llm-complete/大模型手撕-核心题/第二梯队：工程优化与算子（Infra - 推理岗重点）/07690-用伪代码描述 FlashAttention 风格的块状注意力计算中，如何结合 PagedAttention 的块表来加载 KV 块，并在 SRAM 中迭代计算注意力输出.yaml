answer:
  mode: rubric
  reference_answer: |-
    已在第13题详细给出伪代码，此处补充说明融合流程：

    - 外层循环遍历 Q 的块（通常 Q 一次性处理整个序列或按块，但 decode 时 Q 长度为 1，可直接全加载）。

    - 内层循环遍历 KV 的逻辑块，通过块表获取物理块索引。

    - 从全局显存将物理块的 K、V 加载到共享内存（SRAM）。

    - 在共享内存中计算局部注意力分数，执行 online softmax 更新累积输出。

    - 循环结束，归一化输出。

    关键：物理块在共享内存中是连续排列的，消除了非连续访问带来的性能损失。


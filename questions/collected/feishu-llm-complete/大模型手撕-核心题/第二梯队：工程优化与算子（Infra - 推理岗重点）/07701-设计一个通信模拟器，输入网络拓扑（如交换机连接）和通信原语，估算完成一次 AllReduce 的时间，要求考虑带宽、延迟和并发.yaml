  reference_answer: |-
    15.1 模拟器设计

    输入：集群节点数，每个节点的 GPU 数，交换机拓扑（如胖树），链路带宽、延迟，通信原语类型（AllReduce、AllGather等），数据大小。

    输出：预估完成时间。

    核心思想：将通信原语分解为基本 Send/Recv 操作，根据拓扑计算每个数据包的路由路径，考虑带宽共享和网络拥塞。实际实现较复杂，这里给出简化的模型：

    - 采用 Ring 算法时，AllReduce 时间 = 2*(N-1) * (latency + chunk_size / min(bandwidth, 链路瓶颈))。

    - 考虑节点内 GPU 通信（NVLink）和节点间通信（IB/RoCE）的带宽差异，可分层计算。

    伪代码：

    ```python
    class CommSimulator:
        def __init__(self, topology, link_bw, link_lat):
            self.topo = topology
            self.bw = link_bw
            self.lat = link_lat
        def estimate_allreduce(self, data_size, algorithm='ring'):
            if algorithm == 'ring':
                steps = 2 * (self.topo.num_gpus - 1)
                # 假设所有链路的有效带宽为最慢链路
                bw = min(self.bw.values())
                chunk = data_size / self.topo.num_gpus
                time = steps * (self.lat + chunk / bw)
                return time
    ```

    更精确需模拟消息级传输。


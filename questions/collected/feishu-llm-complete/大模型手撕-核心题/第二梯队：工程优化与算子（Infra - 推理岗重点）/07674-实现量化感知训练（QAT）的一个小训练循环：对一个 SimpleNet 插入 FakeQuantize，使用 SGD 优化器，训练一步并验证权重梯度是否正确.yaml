answer:
  mode: rubric
  reference_answer: |-
    原理

    QAT 在前向传播中模拟量化误差，反向传播使用 STE，使得模型参数能够适应量化噪声。下面构造一个简单的多层感知机，插入 FakeQuantize，训练一步，并对比权重更新与不使用 QAT 时的差异。

    ```python
    import torch.nn as nn
    import torch.optim as optim

    class SimpleNet(nn.Module):
        def __init__(self):
            super().__init__()
            self.fc1 = nn.Linear(10, 20)
            self.fc2 = nn.Linear(20, 5)
            self.fq1 = FakeQuantize(bits=8, symmetric=True)
            self.fq2 = FakeQuantize(bits=8, symmetric=True)

        def forward(self, x):
            x = self.fc1(x)
            x = self.fq1(x)      # 量化激活
            x = torch.relu(x)
            x = self.fc2(x)
            x = self.fq2(x)      # 量化输出（若需要）
            return x

    # 初始化
    model_qat = SimpleNet()
    optimizer = optim.SGD(model_qat.parameters(), lr=0.01)

    # 随机输入和目标
    x = torch.randn(4, 10)
    target = torch.randn(4, 5)

    # 前向
    out = model_qat(x)
    loss = torch.nn.functional.mse_loss(out, target)
    optimizer.zero_grad()
    loss.backward()
    # 检查 fc1 权重的梯度是否存在且不为零
    print("fc1 weight grad norm:", model_qat.fc1.weight.grad.norm().item())
    optimizer.step()
    print("QAT step completed.")
    ```

    验证梯度：由于使用了 FakeQuantize 模块，其中的 STE 确保梯度能够回传到前面的层，权重会得到更新。可以通过对比 QAT 和普通训练若干步后的精度来评估效果。


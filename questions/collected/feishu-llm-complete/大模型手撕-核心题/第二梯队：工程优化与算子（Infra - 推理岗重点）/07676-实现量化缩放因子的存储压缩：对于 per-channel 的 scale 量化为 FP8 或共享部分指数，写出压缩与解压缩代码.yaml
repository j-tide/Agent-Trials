    方案二：共享指数压缩

    如果多个 scale 数值量级相近，可以让它们共享同一个指数，仅存储各自的尾数。例如，对于一组 scale，找出一个公共的 exponent_base，然后将每个 scale 表示为 mantissa * 2^exponent_base，存储 int8 的尾数即可。

    ```python
    def compress_scales_shared_exp(scales, base_exp=None):
        """
        scales: [N] FP32
        返回: mantissas (int8), base_exp (int)
        """
        max_val = torch.max(scales).item()
        # 选择一个公共指数，使得缩放后的尾数落在 int8 范围内
        # 例如 base_exp = floor(log2(max_val/127))
        base_exp = int(math.floor(math.log2(max_val / 127.0)))
        # 对每个 scale，计算 mantissa = round(scale / 2^base_exp)
        mantissas = torch.round(scales / (2.0 ** base_exp))
        mantissas = mantissas.clamp(-128, 127).to(torch.int8)
        return mantissas, base_exp

    def decompress_scales_shared_exp(mantissas, base_exp):
        return mantissas.float() * (2.0 ** base_exp)

    # 测试
    scales = torch.rand(128) * 0.01
    m, exp = compress_scales_shared_exp(scales)
    scales_rec = decompress_scales_shared_exp(m, exp)
    print("压缩误差:", (scales - scales_rec).abs().mean().item())
    ```

    应用：这类压缩常用于进一步减小模型文件尺寸，如 GGUF 格式中的 scale 压缩。


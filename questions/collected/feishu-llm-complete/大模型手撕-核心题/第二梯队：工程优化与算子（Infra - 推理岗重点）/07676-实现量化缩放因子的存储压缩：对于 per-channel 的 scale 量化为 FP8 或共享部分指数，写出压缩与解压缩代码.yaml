  reference_answer: |-
    原理

    在 per-channel 量化中，scale 数量等于输出通道数，对于大模型（如 70B），scale 存储也占据一定空间。可以对这些 scale 进一步压缩，例如将 FP32 scale 量化为 FP8（8位浮点），或者利用 scale 之间数值相近的特性，共享部分指数位。这里演示将 FP32 scale 量化为 FP8（E4M3 或 E5M2）的过程，以及简单的共享指数压缩方案。

    方案一：FP32 → FP8 量化

    我们模拟 FP8 E4M3 格式（4位指数，3位尾数）。PyTorch 目前没有原生 FP8 张量，但可以用整数模拟存储，并实现反量化。

    ```python

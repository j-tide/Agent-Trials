answer:
  mode: rubric
  reference_answer: |-
    7.1 GQA 下的缓存存储

    在 GQA 中，Key 和 Value 只计算 num_kv_heads 个头，而 Query 计算 num_q_heads 个头。缓存只需存储 num_kv_heads 个头的 K 和 V，形状为 [num_kv_heads, seq_len, head_dim]。

    7.2 广播读取逻辑

    ```python
    当需要将缓存的 K/V 用于注意力计算时，由于 Q 头数量更多，我们需要将每个 KV 头重复 num_groups = num_q_heads // num_kv_heads 次，使其形状变为 [num_q_heads, seq_len, head_dim]。这可以通过 repeat_interleave 实现。
    def broadcast_kv_for_gqa(k_cache, v_cache, num_q_heads, num_kv_heads):
        """
        k_cache: [num_kv_heads, L, head_dim]
        v_cache: [num_kv_heads, L, head_dim]
        返回: [num_q_heads, L, head_dim] 的 K 和 V
        """
        assert num_q_heads % num_kv_heads == 0
        groups = num_q_heads // num_kv_heads
        # 在头维度上重复
        k_broadcast = k_cache.repeat_interleave(groups, dim=0)
        v_broadcast = v_cache.repeat_interleave(groups, dim=0)
        return k_broadcast, v_broadcast
    ```

    7.3 与缓存容器的集成

    在 VariableLengthKVCache 中，我们按 num_kv_heads 存储。当执行注意力计算时，取出缓存后调用 broadcast_kv_for_gqa 即可。注意广播只是创建一个视图，不会复制数据，因此内存开销可以忽略。


content:
  prompt: 写出在连续批处理调度下，如何为新加入的请求分配 KV Cache 块并初始化逻辑块表，同时对已完成的请求回收其所有物理块。
answer:
  mode: rubric
  reference_answer: |-
    流程

    连续批处理在每轮 decode 后动态调整 batch。新请求到来时，根据其 prompt 长度预分配块；完成的请求立即回收块。

    代码片段

    ```python
    def add_new_request(manager, seq_id, prompt_len):
        num_blocks = (prompt_len + manager.block_size - 1) // manager.block_size
        blocks = manager.allocate_blocks(seq_id, num_blocks)
        # 后续 prefill 写入 KV 到这些块
        return blocks

    def remove_finished(manager, seq_id):
        manager.free_seq(seq_id)
    ```

    实际调度：调度器维护 running 队列，每步迭代后检查生成 EOS 或达到 max_tokens 的序列，调用 remove_finished。新请求从 waiting 队列取出，先 prefill 分配块，然后转入 running。


content:
  prompt: 从文本语料中统计所有单词及其频率，输出词频字典
answer:
  mode: rubric
  reference_answer: "函数目标：输入一段原始文本字符串，输出一个字典，键为单词（ token ），值为该单词在语料中出现的次数。这里假设单词由空格分隔，并且我们希望保留大小写与标点符号，通常
    BPE 训练前会进行基础分词（如按空格分词），同时在每个单词末尾保留词边界信息，因此统计的是“单词”粒度，后续会进一步拆成字符并加结束符。\n\n实现思路：\n\n-
    将文本按空白字符（空格、换行、制表符等）切分成单词列表。\n\n- 遍历列表，使用字典统计出现次数。\n\n- 可以选择是否进行简单的标点处理：如果对标点有特殊要求，例如“word,”和“word”被视为不同单词，则直接保留；若需要分离标点，可先做分词预处理（如用正则表达式将标点与单词分开）。这里给出基础版本：按空格分词，保留原样。\n\n-
    考虑到大规模语料，可以使用 collections.Counter 提高效率。\n\nPython 代码示例：\n\n```python\nfrom collections
    import Counter\nimport re\n\ndef build_word_freq(text: str) -> dict:\n    \"\"\"\n
    \   统计文本中每个单词的出现频率。\n    参数：\n        text: 原始文本字符串。\n    返回：\n        word_freq:
    {word: freq} 字典。\n    \"\"\"\n    # 使用正则表达式按空白字符分割，同时保留单词与标点的连接？ \n    # 这里简单按空格分割，适用于已预处理过的文本。\n
    \   # 若文本中包含换行等，split() 默认按任意空白字符分割，且会去掉空字符串。\n    words = text.split()\n    word_freq
    = Counter(words)\n    return dict(word_freq)\n```\n\n注意事项：\n\n- 如果希望将标点与单词分开（如
    \"hello.\" 变成 \"hello\", \".\"），可在统计前进行分词，例如使用 re.findall(r'\\b\\w+\\b|\\S', text)
    或更复杂的 tokenizer。\n\n- 真实的 BPE 实现（如 GPT 系列）在训练前会先将文本按字节或字符进行初始分割，但词频统计仍是以空格分隔的单词为单位，因为
    BPE 需要知道每个单词的频率，以便在单词内部进行子词合并。\n\n示例：\n\n```python\ntext = \"low lower lowest
    low low\"\nword_freq = build_word_freq(text)\nprint(word_freq)  # {'low': 3, 'lower':
    1, 'lowest': 1}\n```\n\n---"

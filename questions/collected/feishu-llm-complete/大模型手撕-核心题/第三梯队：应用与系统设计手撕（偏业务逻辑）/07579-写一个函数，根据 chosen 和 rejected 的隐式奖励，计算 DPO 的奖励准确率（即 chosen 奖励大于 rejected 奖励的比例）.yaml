content:
  prompt: 写一个函数，根据 chosen 和 rejected 的隐式奖励，计算 DPO 的奖励准确率（即 chosen 奖励大于 rejected 奖励的比例）。
answer:
  mode: rubric
  reference_answer: |-
    ```python
    def compute_reward_accuracy(chosen_rewards, rejected_rewards):
        """
        chosen_rewards: (B,) tensor
        rejected_rewards: (B,) tensor
        Returns: accuracy float
        """
        correct = (chosen_rewards > rejected_rewards).float().sum()
        total = chosen_rewards.size(0)
        return (correct / total).item()
    ```

    可直接嵌入训练循环的监控代码中。


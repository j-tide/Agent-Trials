content:
  prompt: 在 BPE 训练中，当多个 bigram 频率相同时，如何打破平局？实现一种稳定的选择策略（如基于符号顺序），并体现在代码中
answer:
  mode: rubric
  reference_answer: |-
    BPE 训练需要确定性的行为，即相同输入总是产生相同的合并顺序。当多个 bigram 具有相同的最高频率时，必须有一致的平局打破策略。常用的策略有：

    - 按符号对的字典序选择：比较两个符号的字符串表示（或 ID），选择较小的元组。例如 ('a', 'b') 优先于 ('a', 'c')；若第一个相同，比较第二个。这是最直观且常见的方法，前文第 4 问已采用。

    - 按符号对的频率历史或其他启发式规则：比如优先选择最先达到该频率的 pair，但实现复杂。

    - 按照训练开始时符号的顺序：如对于字节级，可按 ID 大小排序。

    在代码中体现稳定性，关键是当从 bigram_freq 中选出最佳 pair 时，使用确定性的规则。前文实现中，我们通过找到最大频率，然后对具有该频率的所有 pair 取最小字典序，即：

    ```python
    def select_best_pair(bigram_freq: dict) -> tuple:
        if not bigram_freq:
            return None
        max_freq = max(bigram_freq.values())
        # 从具有最大频率的 pair 中选择字典序最小的
        best_pair = min(pair for pair, f in bigram_freq.items() if f == max_freq)
        return best_pair
    ```

    在 Python 中，元组默认比较就是字典序，因此 min 会优先比较第一个元素，若相同则比较第二个。这保证了无论字典遍历顺序如何，结果唯一。

    如果符号不是字符串而是整数 ID（字节级 BPE），字典序就变成了按整数大小排序。这同样稳定。例如 (72, 101) 和 (72, 108) 中前者更小（101 < 108）。

    为了更灵活，我们可以定义一个函数，接受 bigram_freq 和可选的排序键：

    ```python
    def select_best_pair_stable(bigram_freq: dict, tie_breaker='lexicographic') -> tuple:
        if not bigram_freq:
            return None
        max_freq = max(bigram_freq.values())
        candidates = [pair for pair, f in bigram_freq.items() if f == max_freq]
        if tie_breaker == 'lexicographic':
            best_pair = min(candidates)
        elif tie_breaker == 'reverse_lexicographic':
            best_pair = max(candidates)
        elif tie_breaker == 'first_seen':
            # 如果需要维持插入顺序，可使用 OrderedDict 维护插入次序
            # 这里从 bigram_freq 按插入顺序遍历找到第一个最大频率
            for pair, f in bigram_freq.items():
                if f == max_freq:
                    best_pair = pair
                    break
        else:
            best_pair = min(candidates)  # 默认字典序
        return best_pair
    ```

    在 BPE 伪代码中直接调用该稳定选择函数即可。


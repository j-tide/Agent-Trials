content:
  prompt: 在 BPE 训练时，实现一个停止条件：不仅基于合并次数，也可基于词汇表大小达到预设值，修改循环条件
answer:
  mode: rubric
  reference_answer: "停止条件可以由用户指定一个目标词汇表大小 target_vocab_size，而不是硬性的合并次数。当合并产生的词汇数量达到这个值时就停止。初始词汇表大小
    V0 是已知的（字符级：字符种类数 + 1（结束符）；字节级：256 + 1 = 257）。每次合并会增加一个新符号，因此词汇表大小增加 1。所以要达到目标词汇表大小，需要的合并次数为
    target_vocab_size - V0。也可以循环时既检查次数限制，又检查词汇表大小。\n\n实现修改：\n\n```python\ndef train_bpe(word_freq,
    target_vocab_size=None, num_merges=None):\n    # 初始化...\n    word_symbols, vocab
    = initialize(word_freq)\n    V = len(vocab)  # 当前词汇表大小\n    max_merges = float('inf')\n
    \   if target_vocab_size:\n        max_merges = target_vocab_size - V\n    if
    num_merges is not None:\n        max_merges = min(max_merges, num_merges)\n    \n
    \   merges = []\n    for step in range(max_merges):\n        bigram_freq = compute_bigram_freq(word_symbols)\n
    \       if not bigram_freq:\n            break\n        best_pair = select_best_pair(bigram_freq)\n
    \       new_symbol = best_pair[0] + best_pair[1]\n        merges.append((best_pair,
    new_symbol))\n        word_symbols = merge_vocab(word_symbols, best_pair)\n        vocab.add(new_symbol)\n
    \       V += 1\n        # 若已达到目标词汇大小可提前 break，但 max_merges 已保证\n    return merges,
    vocab, word_symbols\n```\n\n停止条件多样：也可以基于字符覆盖率达到某个阈值，或最高频 bigram 的频率低于某个阈值（避免罕见合并）。但词汇表大小是最常见的控制参数，直接转换为合并次数即可。\n\n---"

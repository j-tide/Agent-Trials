content:
  prompt: 实现一个工具调用的超时控制装饰器，可设置最大执行时间，超时则抛出指定异常并返回预设错误信息。
answer:
  mode: rubric
  reference_answer: |-
    实现

    ```python
    import signal
    import functools
    from typing import Any, Callable

    class ToolTimeoutError(Exception):
        pass

    def with_timeout(timeout_sec: int):
        """
        装饰器，为函数调用添加超时控制。
        Args:
            timeout_sec: 超时秒数
        Returns:
            装饰后的函数，超时时抛出 ToolTimeoutError
        """
        def decorator(func: Callable) -> Callable:
            @functools.wraps(func)
            def wrapper(*args, **kwargs) -> Any:
                # 使用 signal 仅适用于 Unix 主线程，若跨平台可改用 concurrent.futures
                def handler(signum, frame):
                    raise ToolTimeoutError(f"工具 '{func.__name__}' 执行超时 ({timeout_sec}s)")

                old_handler = signal.signal(signal.SIGALRM, handler)
                signal.alarm(timeout_sec)
                try:
                    result = func(*args, **kwargs)
                finally:
                    signal.alarm(0)  # 取消闹钟
                    signal.signal(signal.SIGALRM, old_handler)
                return result
            return wrapper
        return decorator

    # 跨平台版本（使用 concurrent.futures）
    def with_timeout_thread(timeout_sec: int):
        """线程版超时装饰器，适用于所有平台，但开销稍大"""
        import concurrent.futures
        def decorator(func):
            @functools.wraps(func)
            def wrapper(*args, **kwargs):
                with concurrent.futures.ThreadPoolExecutor(max_workers=1) as executor:
                    future = executor.submit(func, *args, **kwargs)
                    try:
                        return future.result(timeout=timeout_sec)
                    except concurrent.futures.TimeoutError:
                        raise ToolTimeoutError(f"工具 '{func.__name__}' 执行超时 ({timeout_sec}s)")
            return wrapper
        return decorator

    # 示例
    @with_timeout(2)
    def slow_search(query):
        import time
        time.sleep(3)
        return f"结果: {query}"

    try:
        print(slow_search("天气"))
    except ToolTimeoutError as e:
        print("超时错误:", e)
    ```

    说明

    - Unix 下使用 signal.alarm 实现低开销超时，但不适用于多线程。

    - 跨平台方案使用 ThreadPoolExecutor + future.result(timeout)，更通用但线程开销略高。

    - 超时异常可被上层重试机制捕获并处理。

    自适应权重：
    σ(−Δ) 起到了自适应调节作用：

    - 当模型已经很好地偏好 chosen 时（Δ 很大，σ(−Δ)很小），梯度幅度减小，模型不再大幅调整。

    - 当模型还不能区分或偏好 rejected 时（Δ很小甚至为负），σ(−Δ) 较大（接近 0.5 或更高），梯度较大，模型会迅速提升 chosen 的概率并压低 rejected 的概率。


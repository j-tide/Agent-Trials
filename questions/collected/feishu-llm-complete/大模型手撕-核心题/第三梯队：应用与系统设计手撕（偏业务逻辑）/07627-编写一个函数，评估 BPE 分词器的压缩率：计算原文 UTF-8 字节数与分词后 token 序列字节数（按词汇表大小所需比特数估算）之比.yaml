content:
  prompt: 编写一个函数，评估 BPE 分词器的压缩率：计算原文 UTF-8 字节数与分词后 token 序列字节数（按词汇表大小所需比特数估算）之比
answer:
  mode: rubric
  reference_answer: "压缩率可以体现 BPE 对于文本的压缩能力。给定一段文本，我们可以分别计算原始 UTF-8 编码的比特数，以及用分词器分词后，如果对每个
    token 使用等长编码（即用固定位数表示词汇表中的每个 token）所需比特数，并计算比率（原始比特数 / 压缩后比特数）。比率大于 1 表示压缩有效。\n\n评估方法：\n\n-
    原始比特数：original_bytes * 8\n\n- 压缩后比特数：若词汇表大小为 V，每个 token 理论上需要 ceil(log2(V)) 比特来唯一表示（固定长度编码）。这是理论下界（实际如
    Huffman 编码可更优，但这里用等长编码估算）。分词后得到 N 个 token，所需比特数 ≈ N * ceil(log2(V))。\n\n- 压缩率
    = 原始比特数 / 压缩后比特数。\n\n实现细节：\n\n- 使用训练好的分词器对文本进行编码，得到 token 序列（或 ID 序列，数量 N）。\n\n-
    获取词汇表大小 V（即 vocab_size）。\n\n- 计算 bits_per_token = math.ceil(math.log2(V))，如果 V=1，则
    bits_per_token=1。\n\n- compressed_bits = len(token_ids) * bits_per_token\n\n-
    原始文本转为 UTF-8 字节：original_bytes = len(text.encode('utf-8'))，比特数为 original_bits
    = original_bytes * 8。\n\n- 返回 original_bits / compressed_bits 以及相关信息。\n\n注意事项：\n\n-
    词汇表大小通常包含结束符、特殊 token 等，应与编码时的 token 集一致。\n\n- 如果词汇表非常大，bits_per_token 会很高，但 token
    数量会减少，权衡体现压缩能力。\n\n- 如果对比不同分词器，应在同一文本上评估。\n\n代码示例：\n\n```python\nimport math\n\ndef
    evaluate_compression_ratio(text: str, tokenizer) -> dict:\n    \"\"\"\n    计算
    BPE 分词器的压缩率。\n    返回：{'original_bits': int, 'compressed_bits': int, 'ratio': float,
    'num_tokens': int}\n    \"\"\"\n    # 原始比特数\n    original_bytes = len(text.encode('utf-8'))\n
    \   original_bits = original_bytes * 8\n    \n    # 编码\n    token_ids = tokenizer.encode(text)
    \ # 返回 ID 列表\n    num_tokens = len(token_ids)\n    \n    # 词汇表大小（假设 tokenizer.vocab_size
    存在）\n    V = tokenizer.vocab_size\n    if V <= 1:\n        V = 2  # 防止 log2(1)=0\n
    \   bits_per_token = math.ceil(math.log2(V))\n    compressed_bits = num_tokens
    * bits_per_token\n    \n    ratio = original_bits / compressed_bits if compressed_bits
    > 0 else float('inf')\n    \n    return {\n        'original_bits': original_bits,\n
    \       'compressed_bits': compressed_bits,\n        'ratio': ratio,\n        'num_tokens':
    num_tokens,\n        'vocab_size': V\n    }\n```\n\n对于 Byte-Level BPE，vocab_size
    可能为 30000，bits_per_token=15，num_tokens 相比原始字节数减少很多，通常压缩率在 2~4 之间，表明 BPE 在减少序列长度的同时保持了词汇可控。\n\n---"

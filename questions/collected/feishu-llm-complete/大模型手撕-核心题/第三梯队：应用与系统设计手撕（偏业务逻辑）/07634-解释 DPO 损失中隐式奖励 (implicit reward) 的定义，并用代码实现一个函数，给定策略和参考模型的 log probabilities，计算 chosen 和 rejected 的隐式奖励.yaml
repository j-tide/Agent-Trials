    定义

    在 DPO 中，隐含奖励（implicit reward）定义为：

    [图片内容未导入]

    代码实现

    ```python
    def compute_implicit_rewards(
        policy_logps: torch.Tensor,
        reference_logps: torch.Tensor,
        beta: float
    ) -> torch.Tensor:
        """
        计算隐含奖励 r = beta * (log π_θ - log π_ref)
        Args:
            policy_logps: (B,) 或 (B, L) 策略模型的 log probs
            reference_logps: 对应参考模型的 log probs
            beta: 温度系数
        Returns:
            rewards: 同形状的奖励张量
        """
        return beta * (policy_logps - reference_logps)
    ```

    在 DPO 训练循环中，对 chosen 和 rejected 分别调用此函数，得到 rw 和 rl，然后损失函数优化 rw−rlrw−rl。


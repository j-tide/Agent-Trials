  reference_answer: |-
    - RRF 不受各检索器分数范围影响，因此特别适用于融合稠密检索（如向量相似度0~1）和稀疏检索（如BM25分数范围不固定）的结果。

    - 常数 kk 用于控制高排名文档的权重：kk 越小，高排名文档的贡献越大。通常设为60是经验值。

    - 对于未出现在某个检索器列表中的文档，其排名视为无穷大，贡献为0。


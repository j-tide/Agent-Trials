answer:
  mode: rubric
  reference_answer: |-
    实现

    ```python
    from datetime import datetime
    from typing import List, Dict, Any

    class ToolCallLogger:
        def __init__(self):
            self.records: List[Dict[str, Any]] = []

        def log(self, tool_name: str, params: Dict, result: Any):
            self.records.append({
                "timestamp": datetime.now().isoformat(),
                "tool": tool_name,
                "params": params,
                "result": result
            })

        def generate_summary(self) -> str:
            """生成 Markdown 格式的调用摘要"""
            lines = ["# 工具调用记录\n"]
            for i, rec in enumerate(self.records, 1):
                lines.append(f"## 调用 {i}: {rec['tool']}")
                lines.append(f"- **时间**: {rec['timestamp']}")
                lines.append(f"- **参数**: {json.dumps(rec['params'], ensure_ascii=False)}")
                result_str = json.dumps(rec['result'], ensure_ascii=False, indent=2)
                # 截断过长结果
                if len(result_str) > 200:
                    result_str = result_str[:200] + "..."
                lines.append(f"- **结果**: \n```\n{result_str}\n```")
                lines.append("")
            return "\n".join(lines)

    # 示例
    logger = ToolCallLogger()
    logger.log("search", {"query": "天气"}, {"temp": 25, "city": "北京"})
    logger.log("calculator", {"expr": "1+2"}, 3)
    print(logger.generate_summary())
    ```

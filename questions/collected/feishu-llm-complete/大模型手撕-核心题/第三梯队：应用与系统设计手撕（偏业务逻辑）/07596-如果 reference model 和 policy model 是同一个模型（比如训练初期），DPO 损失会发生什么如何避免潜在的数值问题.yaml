content:
  prompt: 如果 reference model 和 policy model 是同一个模型（比如训练初期），DPO 损失会发生什么？如何避免潜在的数值问题？
answer:
  mode: rubric
  reference_answer: |-
    初始状态：

    [图片内容未导入]

    潜在的数值问题：

    尽管初始时 log-ratio 为 0，数值上没有问题。但在训练过程中，如果参考模型和策略模型完全相同，则 log-ratio 始终为 0，损失恒定，无法学习。但这通常不会发生，因为策略模型一旦更新，就与参考模型不同了。

    [图片内容未导入]

    需要注意的真正数值风险：

    如果 reference model 和 policy model 完全相同且我们使用了 detach 不当，或者参考模型的输出参与了梯度计算，则会导致参考模型被更新，从而破坏 DPO 的理论基础。所以必须确保参考模型的输出被 detach。


  reference_answer: |-
    - 实际实现中，可以在检索时动态计算IDF（需要N和nt），预计算可节省时间。

    - 候选文档可能很多，可采用WAND等动态剪枝算法提前终止低分文档的计算。

    - 倒排索引中存储文档长度，避免检索时查表。

    ---

    ### 实现倒数排名融合（Reciprocal Rank Fusion, RRF）算法：输入多个检索器的排序列表（文档 ID 排名序列），参数 k，输出合并后的最终排序列表。

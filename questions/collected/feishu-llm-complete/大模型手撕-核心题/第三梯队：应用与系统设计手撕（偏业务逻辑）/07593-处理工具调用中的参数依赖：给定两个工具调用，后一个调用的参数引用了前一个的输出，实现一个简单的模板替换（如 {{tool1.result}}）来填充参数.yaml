answer:
  mode: rubric
  reference_answer: |-
    原理
    在 Agent 流水线中，后一个工具的输入可能依赖前一个工具的输出。我们使用模板字符串（如 {{tool1.result}}、{{tool1.result.key}}）在运行时进行替换。

    实现

    ```python
    import re
    from typing import Any, Dict

    def resolve_parameter_dependencies(
        params: Dict[str, Any],
        context: Dict[str, Any]
    ) -> Dict[str, Any]:
        """
        解析参数中的模板引用，替换为上下文中的值。
        模板格式：{{tool_name.result}} 或 {{tool_name.result.path.to.key}}
        Args:
            params: 包含模板字符串的参数字典
            context: {"tool_name": {"result": ...}} 前序工具的执行上下文
        Returns:
            解析后的参数字典
        """
        pattern = re.compile(r'\{\{(.+?)\}\}')

        def replace(value):
            if isinstance(value, str):
                def replacer(m):
                    path = m.group(1).strip()
                    parts = path.split('.')
                    obj = context
                    for part in parts:
                        if isinstance(obj, dict):
                            obj = obj.get(part)
                        else:
                            obj = getattr(obj, part, None)
                        if obj is None:
                            break
                    return str(obj) if obj is not None else m.group(0)
                return pattern.sub(replacer, value)
            elif isinstance(value, dict):
                return {k: replace(v) for k, v in value.items()}
            elif isinstance(value, list):
                return [replace(v) for v in value]
            return value

        return replace(params)

    # 示例
    context = {
        "search1": {"result": {"title": "AI", "url": "http://example.com"}},
        "search2": {"result": "Beijing"}
    }
    params = {
        "url": "{{search1.result.url}}",
        "city": "{{search2.result}}"
    }
    print(resolve_parameter_dependencies(params, context))
    # {'url': 'http://example.com', 'city': 'Beijing'}
    ```

    说明

    - 支持嵌套对象属性访问（如 .result.url）。

    - 若路径无法解析，保留原模板字符串以便调试。


content:
  prompt: DPO 损失在实现时，通常对 chosen 和 rejected 的 log-prob 进行长度平均还是求和？分析长度平均对训练的影响，并写出两种实现方式的代码片段。
answer:
  mode: rubric
  reference_answer: |-
    两种方式：

    - 求和：total_log_prob = sum(token_log_probs)，不除以长度。

    - 平均：mean_log_prob = total_log_prob / num_valid_tokens。

    对训练的影响：

    - 求和：长序列的总对数概率数值更大（更负），在损失中的贡献权重也更大。这会导致模型更关注长序列的优化，可能忽略短序列的偏好信号。此外，长序列的梯度方差可能更大。

    - 平均：将每个序列的对数概率归一化到 token 级别，使得不同长度的序列在损失函数中具有可比性。这更公平，因为偏好通常不是由长度决定的。目前主流 DPO 实现（如 HuggingFace TRL）采用平均 log probability。

    代码片段：

    求和方式：

    ```python
    total_logp = (log_probs * attention_mask).sum(dim=1)  # (B,)
    ```

    平均方式：

    ```python
    num_tokens = attention_mask.sum(dim=1)
    mean_logp = (log_probs * attention_mask).sum(dim=1) / num_tokens
    ```

    建议：使用平均方式，并确保在计算时排除 padding token 的影响。


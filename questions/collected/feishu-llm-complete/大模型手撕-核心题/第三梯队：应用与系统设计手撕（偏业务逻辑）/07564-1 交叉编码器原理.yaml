  prompt: 7.1 交叉编码器原理
answer:
  mode: rubric
  reference_answer: |-
    交叉编码器将查询和文档拼接后输入Transformer，通过自注意力进行深度交互，输出一个相关性分数（通常是一个标量，经过线性层+softmax得到）。相比双塔模型（分别编码后内积），交叉编码器精度高但速度慢，适合对粗筛后的少量候选进行重排序。

    常用模型：cross-encoder/ms-marco-MiniLM-L-6-v2、BAAI/bge-reranker-base等。

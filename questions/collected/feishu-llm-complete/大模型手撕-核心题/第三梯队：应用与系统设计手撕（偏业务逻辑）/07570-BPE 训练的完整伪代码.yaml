answer:
  mode: rubric
  reference_answer: "输入：原始文本 text，期望的合并次数 num_merges（或达到某个词汇表大小）。\n输出：合并规则列表 merges（记录每次合并的
    pair 和新符号），以及最终词汇表。\n\n伪代码：\n\n```python\n算法 BPE_Train(text, num_merges):\n    #
    1. 词频统计\n    word_freq = 统计文本中每个单词的频率（按空格分词）\n\n    # 2. 初始化\n    word_symbols
    = []   # 元素为 (符号序列, 频率)\n    for each (word, freq) in word_freq:\n        symbols
    = list(word) + ['</w>']\n        word_symbols.append((symbols, freq))\n    \n
    \   vocab = 所有初始符号的集合（字符 + '</w>'）\n    merges = []   # 记录合并规则，按顺序存储\n\n    #
    3. 循环合并\n    for i from 1 to num_merges:\n        # 3.1 计算所有 bigram 频率\n        bigram_freq
    = {}\n        for each (symbols, freq) in word_symbols:\n            for j from
    0 to len(symbols)-2:\n                pair = (symbols[j], symbols[j+1])\n                bigram_freq[pair]
    += freq\n        \n        # 如果已经没有 bigram 可合并，提前结束\n        if bigram_freq 为空:\n
    \           break\n\n        # 3.2 选择最高频 bigram\n        best_pair = 频率最高的 pair，若相同按字典序选取\n\n
    \       # 3.3 记录合并规则（新符号 = best_pair[0] + best_pair[1]）\n        new_symbol =
    best_pair[0] + best_pair[1]\n        merges.append( (best_pair, new_symbol) )\n\n
    \       # 3.4 将合并应用到所有单词序列\n        new_word_symbols = []\n        for each (symbols,
    freq) in word_symbols:\n            new_syms = []\n            i = 0\n            while
    i < len(symbols):\n                if i < len(symbols)-1 and symbols[i] == best_pair[0]
    and symbols[i+1] == best_pair[1]:\n                    new_syms.append(new_symbol)\n
    \                   i += 2\n                else:\n                    new_syms.append(symbols[i])\n
    \                   i += 1\n            new_word_symbols.append((new_syms, freq))\n
    \       word_symbols = new_word_symbols\n\n        # 3.5 更新词汇表（新符号加入）\n        vocab.add(new_symbol)\n\n
    \   # 返回合并规则（可用于编码）和最终词汇表（所有符号）\n    return merges, vocab, word_symbols\n```\n\n说明：\n\n-
    返回的 merges 是一个列表，顺序记录了每次合并的 ( (a,b), ab )。在编码时，将按照这个顺序尝试合并（从最早到最晚）。\n\n- 有些 BPE
    实现会在合并时保留原始符号并添加新符号，词汇表逐渐扩大；上述过程完全保留了最终所有符号的集合。\n\n- 实际上，也可以通过优先队列（最大堆）来快速获取最高频
    bigram，并在合并后只更新受影响的 bigram 频率，避免每轮重新扫描全部。但上述伪代码展示了最直观的逻辑。\n\n---"

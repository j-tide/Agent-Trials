content:
  prompt: 给定一对偏好数据 (chosen 和 rejected)，以及策略模型和参考模型的对数概率，用 Python 实现 DPO 损失函数的计算（基于公式）。
answer:
  mode: rubric
  reference_answer: |-
    实现思路

    给定一个 batch 的数据，我们已经计算好了：

    - chosen_logps：策略模型 πθ 对 chosen 回答的对数概率（形状 [B]）。

    - rejected_logps：策略模型对 rejected 回答的对数概率。

    - ref_chosen_logps：参考模型对 chosen 回答的对数概率。

    - ref_rejected_logps：参考模型对 rejected 回答的对数概率。

    则 DPO 损失可写为：

    ```python
    def dpo_loss(chosen_logps, rejected_logps, ref_chosen_logps, ref_rejected_logps, beta):
        # 计算隐含奖励差
        chosen_rewards = beta * (chosen_logps - ref_chosen_logps)      # [B]
        rejected_rewards = beta * (rejected_logps - ref_rejected_logps) # [B]
        reward_diff = chosen_rewards - rejected_rewards                 # [B]
        # 损失：- log(sigmoid(reward_diff))
        loss = -torch.nn.functional.logsigmoid(reward_diff).mean()
        return loss
    ```

    更完整的代码（含注释）：

    ```python
    import torch
    import torch.nn.functional as F

    def compute_dpo_loss(
        policy_chosen_logps: torch.Tensor,
        policy_rejected_logps: torch.Tensor,
        reference_chosen_logps: torch.Tensor,
        reference_rejected_logps: torch.Tensor,
        beta: float
    ) -> torch.Tensor:
        """
        计算 DPO 损失。

        Args:
            policy_chosen_logps: (B,) 策略模型在 chosen 回答上的 log probs。
            policy_rejected_logps: (B,) 策略模型在 rejected 回答上的 log probs。
            reference_chosen_logps: (B,) 参考模型在 chosen 回答上的 log probs（应 detach）。
            reference_rejected_logps: (B,) 参考模型在 rejected 回答上的 log probs（应 detach）。
            beta: 温度系数。

        Returns:
            loss: 标量损失值。
        """
        # 计算策略模型相对于参考模型的 log-ratio
        chosen_log_ratios = policy_chosen_logps - reference_chosen_logps
        rejected_log_ratios = policy_rejected_logps - reference_rejected_logps

        # 隐含奖励：r = beta * log_ratio
        chosen_rewards = beta * chosen_log_ratios
        rejected_rewards = beta * rejected_log_ratios

        # 奖励差
        reward_diff = chosen_rewards - rejected_rewards

        # 损失：- log(sigmoid(reward_diff))  =  -F.logsigmoid(reward_diff)
        loss = -F.logsigmoid(reward_diff).mean()
        return loss
    ```


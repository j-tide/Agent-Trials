content:
  prompt: 单步 BPE 合并：找出频率最高的 bigram
answer:
  mode: rubric
  reference_answer: |-
    目标：给定 bigram 频率字典，返回频率最高的符号对。如果存在多个频率相同的最高频 pair，则按字典序选择（例如比较元组在 Python 中的默认顺序）。

    实现：

    - 使用 max 函数，指定 key 为频率，但需要处理频率相同的情况。

    - Python 的 max 在比较元组时，若第一个元素（频率）相同，会比较第二个元素（key），即 bigram 元组本身，这正是字典序。

    代码：

    ```python
    def select_best_pair(bigram_freq: dict) -> tuple:
        """
        返回频率最高的 bigram，频率相同按字典序。
        参数：
            bigram_freq: {(sym1, sym2): freq}
        返回：
            best_pair: (sym1, sym2) 元组
        """
        if not bigram_freq:
            return None
        # 用 max，比较 (freq, pair) 会导致按 freq 优先，freq 相同则按 pair 排序，
        # 但我们需要的是先 freq 降序，再 pair 升序。所以可以自定义 key = lambda x: (x[1], x[0]) 但需要处理大小顺序。
        # 简洁方式：先找到最大频率，再在最大频率的 pair 中取最小字典序。
        max_freq = max(bigram_freq.values())
        best_pair = min(pair for pair, freq in bigram_freq.items() if freq == max_freq)
        return best_pair
    ```

    说明：

    - 返回的 best_pair 将作为下一步要合并的符号对，例如 ('l', 'o')。

    - 之所以规定频率相同按某种规则选择（如字典序），是为了保证算法的确定性，避免随机性。

    示例：
    若 bigram_freq = {('l','o'):5, ('o','w'):5}，最高频率为5，相同频率下按字典序 ('l','o') < ('o','w')，因此选择 ('l','o')。


    DPO 的等价推导

    DPO 的核心洞察是：在 Bradley-Terry 偏好模型中，只需要奖励的相对差 r(x,yw)−r(x,yl)，而配分函数项‘

    β logZ(x) 在相减时会被消去。因此，如果我们直接用策略模型定义一个“隐式奖励”：

    [图片内容未导入]

    这正是 DPO 损失中的 σ(Δ)。因此，最大化 DPO 损失（即最大化 logP (yw≻yl)）等价于在 Bradley-Terry 模型下最大化偏好概率，而无需显式训练奖励模型，也无需处理难以计算的配分函数 Z(x)。这正是 DPO 简洁而高效的根本原因。


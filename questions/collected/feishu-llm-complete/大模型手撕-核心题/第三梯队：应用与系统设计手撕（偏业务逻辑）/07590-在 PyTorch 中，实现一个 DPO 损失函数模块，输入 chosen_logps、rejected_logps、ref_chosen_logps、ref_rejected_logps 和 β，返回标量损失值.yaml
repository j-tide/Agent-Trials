answer:
  mode: rubric
  reference_answer: |-
    实现
    我们实现一个 torch.nn.Module 子类，方便集成到训练流程中。

    ```python
    import torch
    import torch.nn as nn
    import torch.nn.functional as F

    class DPOLoss(nn.Module):
        def __init__(self, beta: float = 0.1):
            super().__init__()
            self.beta = beta

        def forward(
            self,
            policy_chosen_logps: torch.Tensor,
            policy_rejected_logps: torch.Tensor,
            reference_chosen_logps: torch.Tensor,
            reference_rejected_logps: torch.Tensor,
        ) -> torch.Tensor:
            """
            Args:
                policy_chosen_logps: (B,) 策略模型对 chosen 的 log prob
                policy_rejected_logps: (B,) 策略模型对 rejected 的 log prob
                reference_chosen_logps: (B,) 参考模型对 chosen 的 log prob (detached)
                reference_rejected_logps: (B,) 参考模型对 rejected 的 log prob (detached)
            Returns:
                scalar loss
            """
            # 计算 log-ratio
            chosen_log_ratios = policy_chosen_logps - reference_chosen_logps
            rejected_log_ratios = policy_rejected_logps - reference_rejected_logps

            # 奖励差
            reward_diff = self.beta * (chosen_log_ratios - rejected_log_ratios)

            # 损失
            loss = -F.logsigmoid(reward_diff).mean()
            return loss
    ```


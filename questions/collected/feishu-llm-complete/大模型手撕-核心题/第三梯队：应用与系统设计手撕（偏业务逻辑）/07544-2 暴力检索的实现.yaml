  reference_answer: 暴力检索（Brute-Force Search）直接计算查询向量与所有文档向量之间的相似度，然后降序排列取前k个。其时间复杂度为O(N·D)，其中N为文档数，D为向量维度。当N在十万以内且D不高时，暴力检索完全可以接受，且精确度100%。

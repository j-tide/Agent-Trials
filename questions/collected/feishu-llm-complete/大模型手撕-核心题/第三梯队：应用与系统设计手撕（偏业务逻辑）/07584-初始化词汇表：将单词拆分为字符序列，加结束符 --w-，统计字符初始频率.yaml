content:
  prompt: 初始化词汇表：将单词拆分为字符序列，加结束符 </w>，统计字符初始频率
answer:
  mode: rubric
  reference_answer: "目标：给定词频字典 word_freq，将所有单词转化为字符序列（每个字符作为一个符号），并在序列末尾添加特殊符号 </w>
    表示单词结束。同时统计每个初始字符在整个语料中的频率（频率 = 单词频率 × 该字符在该单词中的出现次数）。\n\n实现细节：\n\n- 遍历 word_freq
    的每一项 (word, freq)。\n\n- 将单词转换为字符列表，例如 \"low\" -> ['l', 'o', 'w']，然后追加 '</w>'。\n\n-
    存储每个单词对应的符号序列，通常用一个字典 word2symbols 保存，键为原始单词，值为符号列表；同时为了后续合并，我们还需要知道每个单词的频率，因此可以存为元组
    (symbol_list, freq)。\n\n- 字符频率统计：对于每个单词的每个符号（包括 </w>），累加 freq 次。可以用 Counter 或普通字典。\n\nPython
    代码：\n\n```python\ndef initialize_vocab(word_freq: dict):\n    \"\"\"\n    初始化词汇表，返回单词符号序列列表和字符频率字典。\n
    \   参数：\n        word_freq: {word: freq}\n    返回：\n        word_symbols: 列表，元素为
    (symbol_list, freq)\n        char_freq: {symbol: total_freq}\n    \"\"\"\n    word_symbols
    = []   # 存储每个单词的符号序列及其频率\n    char_freq = Counter()\n    \n    for word, freq
    in word_freq.items():\n        symbols = list(word) + ['</w>']\n        word_symbols.append((symbols,
    freq))\n        for sym in symbols:\n            char_freq[sym] += freq\n            \n
    \   return word_symbols, dict(char_freq)\n```\n\n说明：\n\n- 结束符 </w> 的作用是标记单词边界。在解码时，遇到
    </w> 就知道这里是词尾，后面应该加上空格（除非是最后一个词）。这避免了合并时跨单词边界产生无意义的子词。\n\n- 初始化后，词汇表里的基本符号就是所有出现的字符加上
    </w>。\n\n示例：\n\n```python\nword_freq = {\"low\": 3, \"lower\": 1, \"lowest\":
    1}\nword_symbols, char_freq = initialize_vocab(word_freq)\n# word_symbols:\n#
    [(['l','o','w','</w>'], 3),\n#  (['l','o','w','e','r','</w>'], 1),\n#  (['l','o','w','e','s','t','</w>'],
    1)]\n# char_freq: {'l':5, 'o':5, 'w':5, '</w>':5, 'e':2, 'r':1, 's':1, 't':1}\n```\n\n---"

    - 对查询进行分词，得到查询词项列表。

    - 从倒排索引中取出每个查询词对应的 posting list（文档ID和词频），得到候选文档集合。

    - 获取每个候选文档的长度，以及全局平均文档长度、文档总数、每个词的IDF等信息。

    - 对每个候选文档，遍历查询词，利用已存储的tf计算BM25分数。

    - 将所有候选文档的分数降序排列，返回top‑k。

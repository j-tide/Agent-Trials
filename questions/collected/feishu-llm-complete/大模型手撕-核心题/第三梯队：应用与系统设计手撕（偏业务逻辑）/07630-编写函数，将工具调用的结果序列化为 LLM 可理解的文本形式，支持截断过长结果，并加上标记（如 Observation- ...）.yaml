content:
  prompt: '编写函数，将工具调用的结果序列化为 LLM 可理解的文本形式，支持截断过长结果，并加上标记（如 “Observation: ...”）。'
answer:
  mode: rubric
  reference_answer: "原理\n工具返回的结果可能是长文本、JSON 或列表。需要将其格式化为简洁且信息密集的文本，并加上 ReAct 的 Observation:
    标记。对于过长结果，应进行截断并提示，避免撑满 LLM 上下文窗口。\n\n实现\n\n```python\ndef serialize_tool_result(result:
    Any, max_length: int = 500) -> str:\n    \"\"\"\n    将工具调用结果序列化为 Observation 文本。\n
    \   Args:\n        result: 工具返回的任意对象\n        max_length: 最大字符数，超出则截断\n    Returns:\n
    \       str: \"Observation: ...\"\n    \"\"\"\n    if isinstance(result, str):\n
    \       text = result\n    else:\n        import json\n        text = json.dumps(result,
    ensure_ascii=False, indent=2)\n    \n    if len(text) > max_length:\n        truncated
    = text[:max_length] + f\"\\n... (结果过长，已截断，原长度 {len(text)} 字符)\"\n        return
    f\"Observation: {truncated}\"\n    else:\n        return f\"Observation: {text}\"\n\n#
    示例\nprint(serialize_tool_result({\"status\": \"ok\", \"data\": list(range(100))},
    max_length=100))\n```\n\n扩展\n\n- 针对特定工具可定制序列化逻辑（如表格转 Markdown）。\n\n- 可加入时间戳或来源标记。\n\n---"

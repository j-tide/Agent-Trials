  reference_answer: |-
    - 交叉编码器的输入长度限制通常为512 tokens，超长文档需要截断。对于长文档，可先分段用MaxP策略（见下一题）或只取开头部分。

    - 分数可以是原始logits，也可softmax转成概率，但排序只需相对大小。

    - 批量推理可以显著提升速度。

    ---

    ### 针对长文档实现 MaxP 段落聚合策略：将每个文档分成多个段落，每个段落与查询打分（可用假设的相似度函数），取最大段落分数作为文档分数。

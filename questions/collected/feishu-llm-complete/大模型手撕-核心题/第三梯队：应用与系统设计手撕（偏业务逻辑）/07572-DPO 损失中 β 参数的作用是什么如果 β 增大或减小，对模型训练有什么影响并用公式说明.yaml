content:
  prompt: DPO 损失中 β 参数的作用是什么？如果 β 增大或减小，对模型训练有什么影响？并用公式说明。
answer:
  mode: rubric
  reference_answer: |-
    β 的作用

    β 是一个正的温度系数，控制两件事：

    [图片内容未导入]

    β 直接缩放了 chosen 和 rejected 的 log-ratio 之差，进而影响 sigmoid 输入的幅度。

    β 增大：

    - 奖励差 Δ 放大 → sigmoid 输出更接近 0 或 1 → 损失对偏好数据的拟合更“硬”，模型更快地提高 chosen 的概率、降低 rejected 的概率。

    - 允许更大的策略偏移，可能更好地对齐偏好，但也可能过度拟合偏好数据，导致性能退化（如生成多样性下降、过拟合标注噪声）。

    - 训练可能更不稳定。

    β 减小：

    - 奖励差缩小 → sigmoid 输出更接近 0.5 → 损失梯度较小，模型更新更保守。

    - 策略模型更贴近参考模型，保持更好的基础能力，但可能无法充分拟合偏好数据，对齐效果不足。

    - 训练更稳定，但收敛较慢。


answer:
  mode: rubric
  reference_answer: |-
    实现

    ```python
    import time
    from datetime import datetime
    from typing import List, Dict, Any, Optional

    class ToolLogger:
        def __init__(self):
            self.records: List[Dict[str, Any]] = []

        def log(self, tool_name: str, params: Dict, result: Any, duration: float):
            record = {
                "timestamp": datetime.now().isoformat(),
                "tool": tool_name,
                "params": params,
                "result": result,
                "duration": duration
            }
            self.records.append(record)

        def query(
            self,
            tool_name: Optional[str] = None,
            start_time: Optional[str] = None,
            end_time: Optional[str] = None
        ) -> List[Dict]:
            """按条件过滤记录"""
            results = self.records
            if tool_name:
                results = [r for r in results if r["tool"] == tool_name]
            if start_time:
                results = [r for r in results if r["timestamp"] >= start_time]
            if end_time:
                results = [r for r in results if r["timestamp"] <= end_time]
            return results

        def summary(self) -> str:
            """生成简要统计信息"""
            lines = ["工具调用统计:"]
            tool_counts = {}
            total_duration = 0.0
            for r in self.records:
                tool_counts[r["tool"]] = tool_counts.get(r["tool"], 0) + 1
                total_duration += r["duration"]
            lines.append(f"总调用次数: {len(self.records)}, 总耗时: {total_duration:.2f}s")
            for tool, count in tool_counts.items():
                lines.append(f"  {tool}: {count}次")
            return "\n".join(lines)

    # 示例
    logger = ToolLogger()
    logger.log("search", {"query": "天气"}, "搜索结果...", 0.5)
    logger.log("search", {"query": "AI"}, "搜索结果...", 0.3)
    logger.log("calculator", {"expr": "1+1"}, 2, 0.01)

    print(logger.query(tool_name="search"))
    print(logger.summary())
    ```

    说明

    - log 方法通常在工具调用的包装器（如第15题的超时装饰器）中调用，自动记录耗时。

    - 查询支持多种组合过滤，方便调试和性能分析。

    - 可以扩展为将日志持久化到文件或数据库。


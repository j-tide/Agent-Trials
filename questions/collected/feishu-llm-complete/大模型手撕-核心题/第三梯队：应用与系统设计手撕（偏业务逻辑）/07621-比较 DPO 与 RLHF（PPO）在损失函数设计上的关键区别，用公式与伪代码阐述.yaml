    RLHF（PPO）流程：

    [图片内容未导入]

    PPO 需要不断从策略模型采样，计算奖励，并估计优势函数，过程复杂且不稳定。

    DPO 流程：

    直接利用偏好数据优化策略模型，无需显式奖励模型，也无需在线采样。损失函数为：

    [图片内容未导入]

    关键区别：

    [嵌入表格未展开]

    伪代码对比：

    RLHF PPO 训练步：

    ```text
    for batch in preference_data:
        # 1. 采样 (x, y_w, y_l) 训练奖励模型
        loss_rm = -log(sigmoid(r(x,y_w) - r(x,y_l)))
        # 2. 用 PPO 微调策略
        for ppo_step in range(ppo_epochs):
            y_sample = sample(policy, x)
            r = reward_model(x, y_sample)
            kl = log(policy(y_sample)) - log(ref(y_sample))
            advantage = r - beta * kl
            loss_ppo = -advantage
            optimizer.step()
    ```

    DPO 训练步：

    ```text
    for batch in preference_data:
        # 一次前向同时得到 chosen 和 rejected 的 log prob
        loss_dpo = -log_sigmoid(beta * (log_pi(y_w) - log_ref(y_w) - log_pi(y_l) + log_ref(y_l)))
        optimizer.step()
    ```

    可以看出，DPO 极为简洁。


answer:
  mode: rubric
  reference_answer: "实现（模拟脚本）\n\n```python\ndef simulate_function_calling(user_message:
    str, tools_schema: dict, llm_fn, tool_registry: dict) -> str:\n    \"\"\"\n    模拟完整的
    Function Calling 流程。\n    llm_fn: 模拟的 LLM 函数，接受对话历史，返回决策（\"tool_call\" 或 \"final_answer\"）及内容。\n
    \   \"\"\"\n    # 初始对话\n    conversation = [{\"role\": \"user\", \"content\":
    user_message}]\n    \n    while True:\n        # 调用 LLM\n        response = llm_fn(conversation,
    tools_schema)\n        if response[\"decision\"] == \"final_answer\":\n            return
    response[\"content\"]\n        \n        elif response[\"decision\"] == \"tool_call\":\n
    \           tool_call = response[\"tool_call\"]\n            tool_name = tool_call[\"name\"]\n
    \           args = tool_call[\"arguments\"]\n            # 执行工具\n            try:\n
    \               result = tool_registry[tool_name](**args)\n                result_str
    = serialize_tool_result(result)\n            except Exception as e:\n                result_str
    = f\"Observation: 工具执行错误 - {e}\"\n            # 追加工具调用和结果到对话历史\n            conversation.append({\"role\":
    \"assistant\", \"content\": f\"调用工具: {tool_name}({args})\"})\n            conversation.append({\"role\":
    \"tool\", \"content\": result_str})\n        else:\n            raise ValueError(f\"未知决策类型:
    {response['decision']}\")\n\n# 模拟 LLM 函数（固定逻辑演示）\ndef mock_llm(conversation, tools_schema):\n
    \   # 最后一轮如果是用户消息且包含\"天气\"，则决定调用 get_weather\n    last_msg = conversation[-1][\"content\"]
    if conversation else \"\"\n    if \"天气\" in last_msg and not any(turn[\"role\"]
    == \"tool\" for turn in conversation):\n        return {\n            \"decision\":
    \"tool_call\",\n            \"tool_call\": {\"name\": \"get_weather\", \"arguments\":
    {\"city\": \"北京\"}}\n        }\n    else:\n        return {\"decision\": \"final_answer\",
    \"content\": \"北京今天晴天，25°C。\"}\n\n# 工具注册\ndef get_weather(city):\n    return f\"{city}晴天，25°C\"\n\nregistry
    = {\"get_weather\": get_weather}\nschema = {}  # 简化\n\n# 运行模拟\nfinal = simulate_function_calling(\"北京天气怎么样？\",
    schema, mock_llm, registry)\nprint(final)\n```\n\n说明\n\n- 通过循环实现多轮工具调用，直到 LLM
    返回最终答案。\n\n- 每次工具执行结果以 Observation 形式追加，符合 ReAct 风格。\n\n- 实际系统中，LLM 决策由模型自身完成，这里以
    mock 函数模拟。\n\n---"

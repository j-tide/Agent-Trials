content:
  prompt: 解释 LoRA 中缩放因子 α 的作用，推导 α/r 的缩放规则，并写出在代码中如何应用该缩放。
answer:
  mode: rubric
  reference_answer: |-
    3.1 α 的作用

    缩放因子 α 用于平衡原始输出与低秩增量的大小。由于低秩矩阵初始时 B=0，所以增量初始为零。随着训练进行，A 和 B 的值会变化，α 控制了增量对总输出的贡献强度。通常取 α = 2r 或 α = r 的固定倍数，实践中常设 α = 16 或 32，而 r=8，此时实际缩放为 α/r = 2。

    3.2 缩放规则的推导

    考虑学习率 η，LoRA 增量 ΔW = BA。在训练时，若没有显式的缩放，B 和 A 的更新幅度会与 η 成正比。引入 α/r 后，实际等效学习率变为 η * (α/r)。通过调整 α，可以在不改变优化器学习率的情况下，控制低秩部分的更新步长。经验上，当 r 变化时，保持 α/r 不变（例如始终为 2），可以在不同秩的实验中保持相似的收敛行为。

    3.3 在代码中的应用

    如上一题代码所示，在 forward 中，我们计算 result + self.scaling * lora_x，其中 self.scaling = alpha / r。这样缩放因子就自然地融入了前向计算。

    另一种变体是将缩放因子直接乘入 lora_B 的权重，在推理时可将 BA 合并进 W，缩放因子也可提前乘入 B，合并后即等效于 W0 + (α/r) BA。


content:
  prompt: 推导 RoPE 的二维旋转矩阵
answer:
  mode: rubric
  reference_answer: |-
    题目：写出在二维空间中，向量旋转角度 θ 的旋转矩阵形式，并说明 RoPE 中 θ 是如何与位置 m 关联的。

    1.1 二维旋转矩阵

    在二维平面上，将一个列向量 [x; y] 逆时针旋转角度 θ，其变换矩阵为：

    ```text
    R(θ) = [[cos θ, -sin θ],
            [sin θ,  cos θ]]
    ```

    作用于向量 v = [x, y]^T，得到 v' = R(θ) v = [x cos θ - y sin θ, x sin θ + y cos θ]^T。该操作保持了向量的模长，即 ||v'|| = ||v||。

    1.2 RoPE 中 θ 与位置 m 的关联

    RoPE 的核心思想是将位置信息编码为旋转角度。对于序列中的第 m 个 token，其对应的查询向量 q_m 和键向量 k_n 在二维子空间中被旋转一个与位置成比例的角。

    具体地，RoPE 将 d 维向量两两分组，每组对应一个不同的旋转频率。对于第 i 组（i = 0, 1, ..., d/2 - 1），其旋转角度为：

    ```text
    θ_i = 10000^{-2i/d}
    ```

    位置 m 处的旋转角度为 m * θ_i。因此，位置 m 的向量在该子空间中的旋转矩阵为：

    ```text
    R(m, i) = [[cos(m θ_i), -sin(m θ_i)],
               [sin(m θ_i),  cos(m θ_i)]]
    ```

    这样，q_m 和 k_n 在第 i 个子空间的内积将包含相对位置信息 (m-n) θ_i（见后续等价性证明）。通过为不同维度组设置不同频率，模型可以同时捕捉短距离和长距离的依赖关系。


  prompt: 手写 NTK-aware RoPE 插值
answer:
  mode: rubric
  reference_answer: |-
    根据上题，实现一个函数，输入原始 inv_freq 和扩展倍数 scale，输出缩放后的 inv_freq：

    ```python
    def ntk_aware_interpolate(inv_freq, scale, dim):
        """
        inv_freq: (dim/2,) 原始频率的倒数
        scale: 扩展倍数，例如 2 表示从 2048 扩展到 4096
        dim: head_dim
        """
        base = 10000.0
        # 新的 base 计算
        new_base = base * (scale ** (dim / (dim - 2)))
        # 重新生成 inv_freq
        new_inv_freq = 1.0 / (new_base ** (torch.arange(0, dim, 2).float() / dim))
        return new_inv_freq
    ```

    在实际使用中，可以用新的 inv_freq 替换 RoPE 的 inv_freq，然后预计算 freqs_cis，无需重新训练模型。


    14.1 AdaLoRA 原理

    AdaLoRA 将 LoRA 的固定秩 r 改为可学习的，并通过重要性评分（如基于参数梯度或 Fisher 信息）动态地分配秩。它将 ΔW 分解为 SVD 形式：ΔW = P Λ Q，其中 Λ 是对角矩阵，包含奇异值。通过裁剪小的奇异值及其对应的奇异向量，实现秩的剪枝，使重要方向保留更多容量，不重要的方向被移除。

    14.2 简化版伪代码

    我们维护一个总预算（target_total_rank），但实际秩根据重要性动态调整。

    ```python
    class AdaLoRALinear(nn.Module):
        def __init__(self, in_dim, out_dim, initial_r, target_r):
            self.A = nn.Parameter(torch.randn(initial_r, in_dim))
            self.B = nn.Parameter(torch.zeros(out_dim, initial_r))
            self.importance = nn.Parameter(torch.ones(initial_r))  # 每个秩的重要性
            self.target_r = target_r

        def forward(self, x):
            # 根据 importance 选取 top-r 个秩
            _, idx = torch.topk(self.importance, self.target_r)
            A_sub = self.A[idx]  # (r', in_dim)
            B_sub = self.B[:, idx]  # (out_dim, r')
            return x @ A_sub.T @ B_sub.T * (alpha / self.target_r)

        def update_importance(self):
            # 示例：基于梯度的 L2 范数更新重要性
            grad_A = self.A.grad  # 需要累积
            importance = grad_A.norm(dim=1)  # 简单范数
            self.importance.data = 0.9 * self.importance.data + 0.1 * importance
    ```

    完整的 AdaLoRA 会更复杂，涉及 SVD 重参数化和正交性约束。上述简化版仅用于说明思想。


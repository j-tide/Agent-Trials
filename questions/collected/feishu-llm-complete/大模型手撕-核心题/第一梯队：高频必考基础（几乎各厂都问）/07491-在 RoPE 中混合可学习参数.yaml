content:
  prompt: 在 RoPE 中混合可学习参数
answer:
  mode: rubric
  reference_answer: |-
    可以引入可学习的缩放因子 γ_i 和偏移 β_i 来调整每个频率分量的旋转角度，公式变为：

    ```text
    θ'_i = γ_i * θ_i + β_i
    ```

    或直接学习一个频率调整量。实现时，将 γ_i 和 β_i 设为 nn.Parameter，初始化 γ_i=1, β_i=0。

    代码修改：

    ```python
    class LearnableRoPE(LlamaRotaryEmbedding):
        def __init__(self, dim, max_position_embeddings=2048, base=10000.0):
            super().__init__(dim, max_position_embeddings, base)
            self.gamma = nn.Parameter(torch.ones(dim // 2))
            self.beta = nn.Parameter(torch.zeros(dim // 2))

        def forward(self, x, position_ids):
            inv_freq = self.inv_freq * self.gamma  # 缩放频率
            # 加上偏移会影响相位，但这里 inv_freq 调整后需要重新生成 cos/sin
            # 具体实现中可重新计算 freqs
            ...
    ```

    可能的问题：

    - 学习参数可能破坏 RoPE 的远程衰减性质，导致训练不稳定。

    - 如果不加正则化，模型可能学出极端的频率，影响泛化。

    - 在微调阶段使用少量数据学习可能有效，但从头训练可能增加难度。
    因此通常不引入可学习参数，除非在特定微调场景下并配合强正则化。


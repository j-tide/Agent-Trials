    1.1 前向公式推导

    [图片内容未导入]

    1.2 初始化策略的动机

    - A 用高斯初始化：矩阵 A 的权重从一个均值为 0、方差为 σ2 的高斯分布中采样。这确保了初始时 AxAx 是一个随机的小向量，为训练提供了对称破缺（symmetry breaking）和丰富的探索方向。

    - B 用零初始化：矩阵 B 被初始化为全零。这样在训练开始时，ΔW=0，模型的输出完全等于预训练模型的输出 W0x。这种“零初始化”保证了微调从原始模型的性能开始，避免了随机噪声破坏预训练知识，训练可以稳定地逐步学习到有用的低秩更新。

    1.3 数学直觉

    若 B 也随机初始化，则微调初期 ΔW 会是一个随机矩阵，其输出会污染原本良好的预训练特征，可能导致训练初期损失剧烈震荡甚至发散。零初始化 B 则完美避开了这一问题，是 LoRA 成功的关键细节之一。


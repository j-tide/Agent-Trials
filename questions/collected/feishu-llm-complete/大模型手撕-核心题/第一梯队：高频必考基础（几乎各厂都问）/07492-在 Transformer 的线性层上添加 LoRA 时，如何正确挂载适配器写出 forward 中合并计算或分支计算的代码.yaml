answer:
  mode: rubric
  reference_answer: |-
    5.1 挂载适配器的方式

    我们使用装饰器模式：用 LoRALinear 包装原始的 nn.Linear，在 forward 中同时计算原始输出和低秩增量，然后相加。这是“分支计算”方式，不需要修改原始权重。

    5.2 分支计算的代码

    已在第 2 题中展示。核心是：

    ```python
    def forward(self, x):
        result = self.original_linear(x)   # 原始分支
        lora_x = self.lora_B(self.lora_A(self.dropout(x)))  # 低秩分支
        result = result + self.scaling * lora_x
        return result
    ```

    5.3 合并计算（推理优化）

    在推理时，可将低秩矩阵与原始权重合并，形成单一的线性层，消除额外计算分支。

    ```python
    def merge_weights(self):
        # 合并后 W = W0 + (α/r) * (B @ A)
        delta = (self.alpha / self.r) * (self.lora_B.data @ self.lora_A.data)
        self.original_linear.weight.data += delta
        # 可选：清空 lora 参数
        self.lora_A = None
        self.lora_B = None
    ```

    合并后模型前向变为普通的线性层，推理速度更快。


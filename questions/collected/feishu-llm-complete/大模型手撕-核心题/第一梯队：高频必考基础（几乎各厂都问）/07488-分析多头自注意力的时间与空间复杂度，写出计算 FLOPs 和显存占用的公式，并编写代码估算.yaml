content:
  prompt: 分析多头自注意力的时间与空间复杂度，写出计算 FLOPs 和显存占用的公式，并编写代码估算。
answer:
  mode: rubric
  reference_answer: |-
    14.1 复杂度公式

    - 设 B: batch, H: heads, L: seq_len, D: head_dim。

    - 计算 QK^T: B * H * L * L * D FLOPs。

    - softmax: B * H * L * L FLOPs。

    - 加权求和: B * H * L * L * D FLOPs。

    - 总 FLOPs ≈ 2 * B * H * L^2 * D。

    - 显存占用（中间激活）：主要是 S 和 P 矩阵，每个形状 (B, H, L, L)，共 2 * B * H * L^2 个元素。

    14.2 代码估算

    python

    def estimate_attention_cost(B, H, L, D, bytes_per_elem=2):    flops = 2 * B * H * L * L * D    memory_bytes = 2 * B * H * L * L * bytes_per_elem    return flops, memory_bytes

    对于 GPT-3 规模（B=8, H=96, L=2048, D=128, FP16），FLOPs 约 2 * 8 * 96 * 2048^2 * 128 ≈ 8.2e11 FLOPs，中间激活显存约 2 * 8 * 96 * 2048^2 * 2 ≈ 1.2 GB。这显示了长序列下注意力对显存的巨大压力，也是 FlashAttention 等优化的驱动力。


content:
  prompt: 给定 r=8 和 α=16，计算 LoRA 适配器的实际缩放倍数，并说明不同 α 选择对训练的影响。
answer:
  mode: rubric
  reference_answer: |-
    4.1 缩放倍数计算

    缩放倍数 = α / r = 16 / 8 = 2。这意味着 LoRA 增量 BAx 在加入原始输出前会被乘以 2。换句话说，低秩部分对最终 logits 的贡献被放大了 2 倍。

    4.2 不同 α 的影响

    - α 较大（如 α=32, r=8 → 缩放 4）：低秩更新占据主导，模型更快偏离原始权重，可能学到更强的任务特异性，但也增加了过拟合风险。

    - α 较小（如 α=4, r=8 → 缩放 0.5）：低秩更新被抑制，模型更接近原始预训练行为，微调更保守，适合数据量小的场景，但可能欠拟合。

    - 固定 α 改变 r：若保持 α/r 恒定（如始终为 2），则不同 r 的 LoRA 会有相似的动态特性，便于实验比较。

    通常经验是：对于较小的微调数据集，选择较小的 α（或较小的 α/r）以保留更多预训练知识；对于大型微调数据，可适当增大 α 来鼓励模型适应新任务。


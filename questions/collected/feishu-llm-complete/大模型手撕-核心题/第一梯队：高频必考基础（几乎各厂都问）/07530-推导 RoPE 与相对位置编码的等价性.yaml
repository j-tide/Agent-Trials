content:
  prompt: 推导 RoPE 与相对位置编码的等价性
answer:
  mode: rubric
  reference_answer: |-
    题目：证明施加 RoPE 后的 Q、K 内积只依赖于相对位置 m-n，写出推导步骤。

    9.1 推导

    设 q_m 为位置 m 的原始查询向量，k_n 为位置 n 的原始键向量。RoPE 后的内积：

    ```text
    <q'_m, k'_n> = (R(m) q_m)^T (R(n) k_n)
                = q_m^T R(m)^T R(n) k_n
    ```

    由于旋转矩阵是正交矩阵，R(m)^T = R(-m)。又因为旋转具有可加性：R(a) R(b) = R(a+b)，所以：

    ```text
    R(-m) R(n) = R(n - m)
    ```

    因此：

    ```text
    <q'_m, k'_n> = q_m^T R(n - m) k_n
    ```

    该结果仅与相对位置 Δ = n - m 有关，与绝对位置 m, n 无关。这正是相对位置编码的核心性质。

    9.2 物理意义

    注意力权重将反映 token 之间的相对距离，而非它们的绝对位置。这提升了模型对序列长度的泛化能力。


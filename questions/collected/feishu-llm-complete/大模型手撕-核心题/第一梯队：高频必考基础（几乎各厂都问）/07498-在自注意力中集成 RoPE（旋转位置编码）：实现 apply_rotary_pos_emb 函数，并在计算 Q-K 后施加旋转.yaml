answer:
  mode: rubric
  reference_answer: |-
    10.1 RoPE 原理

    RoPE 通过将每对相邻维度视为复数的实部和虚部，根据位置进行旋转，使得 Query 和 Key 的内积仅依赖于相对位置，而非绝对位置。实现时，先计算每个位置的 cos 和 sin 缓存，然后对 Q 和 K 的每个分块进行旋转变换。

    10.2 代码实现

    ```python
    def precompute_rope_freqs(dim, seq_len, theta=10000.0):
        """计算旋转频率"""
        freqs = 1.0 / (theta ** (torch.arange(0, dim, 2).float() / dim))
        t = torch.arange(seq_len)
        freqs = torch.outer(t, freqs)  # (seq_len, dim//2)
        freqs_cis = torch.polar(torch.ones_like(freqs), freqs)  # 复数表示
        return freqs_cis

    def apply_rotary_pos_emb(x, freqs_cis):
        """x: (B, H, L, D) 或 (*, L, D)"""
        # 将 x 转换为复数: (..., L, D) -> (..., L, D/2) 复数
        x_complex = torch.view_as_complex(x.float().reshape(*x.shape[:-1], -1, 2))
        # 调整 freqs_cis 形状以广播
        freqs_cis = freqs_cis.unsqueeze(0).unsqueeze(0)  # (1, 1, L, D/2)
        x_rotated = x_complex * freqs_cis  # 复数乘法实现旋转
        # 转回实数
        x_out = torch.view_as_real(x_rotated).flatten(-2)
        return x_out.type_as(x)

    # 在注意力层中使用
    class RoPESelfAttention(MultiHeadSelfAttention):
        def forward(self, x, freqs_cis, key_padding_mask=None):
            # ... 投影、分头得到 q, k
            q = apply_rotary_pos_emb(q, freqs_cis)
            k = apply_rotary_pos_emb(k, freqs_cis)
            # 继续注意力计算...
    ```

    10.3 关键点

    - RoPE 只应用于 Q 和 K，不应用于 V。

    - freqs_cis 可预先计算并缓存，推理时根据序列长度动态截取。

    - 对于长序列，RoPE 通常需要配合位置插值（PI）或 NTK 缩放来外推。


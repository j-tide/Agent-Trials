    ### 实现贪心解码函数 greedy_decode(logits)，逐步选取概率最大的 token 拼接成序列。

    1.1 原理

    贪心解码（Greedy Decoding）是自回归生成中最简单、最确定性的策略。在每一个生成步骤，模型输出一个形状为 (vocab_size,) 的 logits 张量，经过 softmax 后得到概率分布。贪心解码直接选择概率最高的 token 作为本步的输出，将其拼接到已生成序列的末尾，然后该新序列作为下一步的输入继续生成，直到遇到结束符（EOS）或达到预设的最大长度。

    贪心解码不进行任何随机采样，因此生成结果是完全确定的（假设模型固定且无随机性 dropout 等）。其优点是速度极快，无需维护候选集；缺点是缺乏全局最优性，容易陷入局部最优，在长文本生成中常导致重复和退化（如循环输出相同短语）。

    1.2 实现

    ```python
    import torch

    def greedy_decode(model, input_ids, max_length=50, eos_token_id=None):
        """
        贪心解码自回归生成。

        Args:
            model: 自回归语言模型，调用 model(input_ids) 返回 logits (batch_size, seq_len, vocab_size)。
                   假设输入 batch_size=1，已处理 prompt。
            input_ids: (1, prompt_len) 初始提示词 token ID 张量。
            max_length: 最大生成总长度（包括 prompt）。
            eos_token_id: 结束符 token ID，遇到则停止。

        Returns:
            generated: 生成的完整 token ID 列表（包括 prompt）。
        """
        model.eval()
        generated = input_ids.tolist()[0]  # 转为Python列表
        with torch.no_grad():
            for _ in range(max_length - len(generated)):
                # 将当前序列转为tensor输入模型
                inputs = torch.tensor([generated], device=input_ids.device)
                outputs = model(inputs)
                # 取最后一个位置的logits
                next_logits = outputs[0, -1, :]  # shape: (vocab_size,)
                # 贪心选择最大概率的token
                next_token_id = torch.argmax(next_logits).item()
                generated.append(next_token_id)
                # 如果遇到eos则停止
                if eos_token_id is not None and next_token_id == eos_token_id:
                    break
        return generated
    ```

    1.3 关键细节

    - KV Cache 优化：上述实现每次都将整个历史序列重新输入模型，计算量随生成长度平方增长。生产环境中必须使用 KV Cache：在每步仅输入最新 token，利用缓存的历史 Key/Value 张量进行注意力计算。实现 KV Cache 需要模型支持 past_key_values 参数。这里为了清晰展示解码逻辑，采用简化形式，但面试中应主动指出此优化。

    - 模型调用约定：通常自回归模型的 forward 接受 input_ids 和 past_key_values，返回 logits 和新的 past_key_values。上述函数可扩展为接受 past_key_values 参数并返回更新后的缓存。

    - EOS 处理：遇到 EOS 时应当立即停止，避免生成无意义的后续 token。同时应确保生成的序列中不会因为 EOS 后的 token 而被截断。

    - Tensor 操作：使用 torch.argmax 直接获取索引，高效简洁。

    1.4 贪心解码的局限与改进方向

    - 无法产生多样性输出。

    - 容易陷入重复循环，尤其在开放域对话中。

    - 对于需要探索的任务，通常与温度缩放、Top-k/Top-p 结合使用，或在束搜索中作为最终评分基准。


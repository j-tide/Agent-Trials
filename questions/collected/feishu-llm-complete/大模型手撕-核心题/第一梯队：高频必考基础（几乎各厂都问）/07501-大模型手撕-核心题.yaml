    ### 实现批量束搜索，支持 batch 内多样本的并行束搜索。

    21.1 原理

    在实际应用中，我们通常需要同时为 batch 中的多个样本进行束搜索。可以通过将 batch 内所有样本的束展开为一个大的 batch 维度，利用 GPU 并行计算。实现时，维护一个形状为 (batch_size * beam_width, cur_len) 的输入张量，每个样本的束占据连续的 beam_width 行。扩展时，从该大 batch 计算 logits，然后为每个样本独立执行 top‑k 选择、得分更新、束重组。注意需要使用索引偏移来区分不同样本的束。

    21.2 实现（简化版）

    假设模型接受 (batch_size, seq_len) 并返回 (batch_size, seq_len, vocab_size) 的 logits。

    ```python
    def batched_beam_search(model, input_ids, beam_width=3, max_length=50, eos_token_id=None):
        """
        input_ids: (batch_size, prompt_len) 初始 prompt 批量。
        返回: (batch_size, seq_len) 每个样本的最佳序列。
        """
        batch_size, prompt_len = input_ids.shape
        device = input_ids.device
        # 初始束：将每个样本的 prompt 重复 beam_width 次
        # 形状: (batch_size * beam_width, prompt_len)
        expanded_input = input_ids.unsqueeze(1).expand(-1, beam_width, -1).reshape(batch_size * beam_width, prompt_len)
        # 每个束的得分，初始 0
        beam_scores = torch.zeros(batch_size * beam_width, device=device)
        # 标记束是否已完成
        done = torch.zeros(batch_size * beam_width, dtype=torch.bool, device=device)
        # 存储最佳序列（每个样本独立）
        # 此处简化：仅返回最后得分最高的束对应的序列。实际还需考虑提前终止。

        for step in range(max_length - prompt_len):
            if done.all():
                break
            # 前向
            outputs = model(expanded_input)
            next_logits = outputs[:, -1, :]  # (B*BW, vocab)
            log_probs = torch.log_softmax(next_logits, dim=-1)

            # 计算所有可能扩展的得分：每个束扩展 beam_width 个候选，共 (B*BW * beam_width) 个
            # 为简便，我们取每个束的 top-beams 个 token
            topk_log_probs, topk_indices = torch.topk(log_probs, beam_width, dim=-1)  # (B*BW, beam_width)
            # 计算新得分
            new_scores = beam_scores.unsqueeze(1) + topk_log_probs  # (B*BW, BW)

            # 重塑为 (B, BW*BW) 以便为每个样本独立选取 top BW
            new_scores = new_scores.view(batch_size, beam_width * beam_width)
            topk_scores, topk_pos = torch.topk(new_scores, beam_width, dim=-1)  # (B, BW)
            # topk_pos 指示在 (BW*BW) 中的索引，需要还原为原束索引和 token 索引
            beam_indices = topk_pos // beam_width  # (B, BW) 原束索引
            token_indices = topk_pos % beam_width  # (B, BW) token 索引（在 topk_indices 中的位置）
            # 获取实际 token ID
            next_tokens = torch.gather(topk_indices, 1, token_indices + beam_indices * beam_width) # 需正确索引，简化可改用循环。
            # 为简洁，此处略去详细索引实现，实际可参考 HuggingFace 源码。

            # 更新 expanded_input 和 beam_scores
            # ...

        # 最终从每个样本的束中选择最佳序列（略）
        return best_sequences
    ```

    由于完整实现较复杂，面试中可描述原理并给出核心索引逻辑，强调 batch 内并行带来的效率提升。

    21.3 关键点

    - 需要正确维护 beam_scores 和 done 标志，以及处理 EOS 提前终止。

    - 通过将 beam_width 维度融入 batch 维度，充分利用 GPU 并行。

    - 最终选择每个样本的最高分序列作为输出。

    - 强制输出 JSON 键或特定标点。

    - 限制回答只在特定选项内。


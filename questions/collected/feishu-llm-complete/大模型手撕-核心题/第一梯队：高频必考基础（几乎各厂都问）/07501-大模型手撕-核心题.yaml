    ### 实现基础束搜索 beam_search(logits_fn, k, max_len)，每步扩展并保留 k 条最优序列。

    2.1 原理

    束搜索（Beam Search）在每一步维护一个大小为 k（束宽）的候选序列集合，而不是仅保留一个最佳序列。具体流程：

    - 初始化：起始序列为 prompt，得分（对数概率和）为 0。

    - 对当前束中的每一条序列，模型给出下一步的 logits，计算所有可能的下一个 token 的对数概率。

    - 将所有 (当前序列, 下一个token) 的组合视为新候选，共 k * |V| 个（实际常只取每个序列的 top-k 候选以加速），每个候选的得分为 原序列得分 + log P(token|sequence)。

    - 按得分降序排列，保留得分最高的 k 个候选作为下一轮的束。

    - 重复直到满足终止条件：所有序列都生成了 EOS 或达到最大长度。

    - 最终从所有已完成和未完成的序列中选择得分最高的一条作为输出。

    束搜索通过维护多条路径，能在一定程度上避免贪心的局部最优，找到全局更好的序列。

    2.2 实现

    ```python
    def beam_search(model, input_ids, beam_width=3, max_length=50, eos_token_id=None):
        """
        基础束搜索。

        Args:
            model: 自回归模型，返回 logits。
            input_ids: (1, prompt_len) 初始提示词。
            beam_width (k): 束宽。
            max_length: 最大生成长度（包括prompt）。
            eos_token_id: EOS token ID。

        Returns:
            best_sequence: (list) 得分最高的token序列。
        """
        device = input_ids.device
        prompt = input_ids[0].tolist()
        # 束中的每个元素为 (tokens_list, cumulative_log_prob)
        beams = [(prompt, 0.0)]
        finished = []  # 已完成的序列

        for step in range(max_length - len(prompt)):
            if not beams:  # 所有束都已完成
                break
            all_candidates = []
            # 为每个束计算下一步 logits
            for tokens, score in beams:
                if eos_token_id is not None and tokens[-1] == eos_token_id:
                    finished.append((tokens, score))
                    continue
                input_tensor = torch.tensor([tokens], device=device)
                outputs = model(input_tensor)
                next_logits = outputs[0, -1, :]  # (vocab_size,)
                log_probs = torch.log_softmax(next_logits, dim=-1)
                # 为效率，可仅考虑 top-k 个候选，此处取全部
                topk_log_probs, topk_indices = torch.topk(log_probs, beam_width, dim=-1)
                for i in range(beam_width):
                    next_token = topk_indices[i].item()
                    new_score = score + topk_log_probs[i].item()
                    new_tokens = tokens + [next_token]
                    all_candidates.append((new_tokens, new_score))

            if not all_candidates:
                break

            # 按得分降序排序，保留 beam_width 个最佳
            ordered = sorted(all_candidates, key=lambda x: x[1], reverse=True)
            beams = ordered[:beam_width]

        # 合并已完成和剩余束
        final_candidates = finished + beams
        # 选取得分最高的
        best_tokens, best_score = max(final_candidates, key=lambda x: x[1])
        return best_tokens
    ```

    2.3 重要说明

    - 计算效率：上述实现每步对束中的每条序列独立调用模型，没有利用 batch。实际工程中应将束中所有序列 batch 化：将 beams 中所有 tokens 堆叠为 (beam_width, cur_len) 的张量，一次前向得到所有序列的下一步 logits，然后扩展、排序、选择。这能大幅提升 GPU 利用率。

    - 对数概率：使用 log_softmax 将乘法转换为加法，避免浮点下溢。

    - EOS 处理：当某序列生成 EOS 时，将其移入 finished 列表，并停止对其扩展，但不影响其他序列。

    - 束宽选择：beam_width 通常取 3~10，过大计算量剧增，且可能引入更多噪音。

    2.4 局限性

    - 倾向于产生较短序列（因为对数概率为负，累加导致长序列得分低），需要结合长度惩罚。

    - 多样性不足：多个束可能收敛到相似的高分序列，缺乏差异性。


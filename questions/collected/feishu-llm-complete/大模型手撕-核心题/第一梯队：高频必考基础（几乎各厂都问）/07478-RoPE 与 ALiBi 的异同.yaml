  reference_answer: |-
    ALiBi 实现：在注意力分数上加一个与距离成线性比例的负偏置，斜率对每个头不同，无需位置编码。代码片段：

    ```python
    def get_alibi_slopes(num_heads):
        # 生成头相关的斜率
        return torch.tensor([2 ** (-8 / num_heads * i) for i in range(1, num_heads+1)])

    # 在注意力分数上添加
    alibi_bias = -slopes.view(-1,1,1) * distances.abs().unsqueeze(0)  # 因果单向时取负距离
    attn_scores = attn_scores + alibi_bias
    ```


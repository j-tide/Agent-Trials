answer:
  mode: rubric
  reference_answer: |-
    5.1 交叉注意力机制

    在 Transformer 的 Decoder 中，交叉注意力层允许 Decoder 在生成每个目标词时，关注 Encoder 输出的所有源序列位置。其 Q 来自 Decoder 的上一自注意力输出，K 和 V 来自 Encoder 的最终输出。

    5.2 与 Self-Attention 的主要区别

    - 输入来源：Self-Attention 的 Q、K、V 来自同一输入；Cross-Attention 的 Q 来自 Decoder，K、V 来自 Encoder。

    - 掩码：Cross-Attention 不需要因果掩码，因为 Decoder 在推理时可以并行地看到所有 Encoder 位置。只需要对 Encoder 输出进行 key_padding_mask。

    - 维度可能不同：Decoder 和 Encoder 的隐藏维度可能不同，需要通过投影层将 Encoder 的维度映射到 Decoder 的维度（通常使 K、V 投影的输出维度与 Q 相同）。

    5.3 完整实现

    ```python
    class CrossAttention(nn.Module):
        def __init__(self, decoder_dim, encoder_dim, num_heads, dropout=0.1):
            super().__init__()
            self.num_heads = num_heads
            self.head_dim = decoder_dim // num_heads
            self.scale = math.sqrt(self.head_dim)

            # Q 投影：从 decoder 隐藏状态
            self.q_proj = nn.Linear(decoder_dim, decoder_dim, bias=False)
            # K, V 投影：从 encoder 隐藏状态，但输出维度与 decoder_dim 对齐
            self.k_proj = nn.Linear(encoder_dim, decoder_dim, bias=False)
            self.v_proj = nn.Linear(encoder_dim, decoder_dim, bias=False)
            self.out_proj = nn.Linear(decoder_dim, decoder_dim, bias=False)
            self.dropout = nn.Dropout(dropout)

        def forward(self, decoder_hidden, encoder_hidden, key_padding_mask=None):
            """
            decoder_hidden: (B, tgt_len, decoder_dim)
            encoder_hidden: (B, src_len, encoder_dim)
            key_padding_mask: (B, src_len) bool, True = pad
            """
            B, tgt_len, _ = decoder_hidden.shape
            src_len = encoder_hidden.size(1)

            # 线性投影
            q = self.q_proj(decoder_hidden)  # (B, tgt_len, decoder_dim)
            k = self.k_proj(encoder_hidden)  # (B, src_len, decoder_dim)
            v = self.v_proj(encoder_hidden)

            # 分头
            q = q.view(B, tgt_len, self.num_heads, self.head_dim).transpose(1, 2)
            k = k.view(B, src_len, self.num_heads, self.head_dim).transpose(1, 2)
            v = v.view(B, src_len, self.num_heads, self.head_dim).transpose(1, 2)

            # 注意力计算
            attn_scores = torch.matmul(q, k.transpose(-2, -1)) / self.scale

            if key_padding_mask is not None:
                attn_scores = attn_scores.masked_fill(
                    key_padding_mask.unsqueeze(1).unsqueeze(2), float('-inf')
                )

            attn_weights = F.softmax(attn_scores, dim=-1)
            attn_weights = self.dropout(attn_weights)
            attn_output = torch.matmul(attn_weights, v)

            # 合并多头
            attn_output = attn_output.transpose(1, 2).contiguous().view(B, tgt_len, -1)
            output = self.out_proj(attn_output)
            return output
    ```

    5.4 掩码差异

    - Self-Attention：通常需要因果掩码（在 Decoder 自注意力中）和 key_padding_mask。

    - Cross-Attention：只需要 key_padding_mask 来屏蔽 Encoder 的 padding；无需因果掩码。


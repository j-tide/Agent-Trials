  mode: rubric
  reference_answer: |-
    23.1 测试思路

    构造相同输入，分别通过手写 Attention 和 PyTorch 官方 nn.MultiheadAttention，检查输出是否在容差内一致。需注意官方接口的 Q、K、V 输入形状和掩码格式略有不同（官方 expects (L, B, D) 形状，mask 格式也有差异）。

    23.2 测试代码

    ```python
    import unittest

    class TestMultiHeadAttention(unittest.TestCase):
        def setUp(self):
            self.B, self.L, self.D = 2, 16, 64
            self.H = 4
            self.x = torch.randn(self.B, self.L, self.D)
            self.attn_custom = MultiHeadSelfAttention(self.D, self.H, dropout=0.0)
            self.attn_official = nn.MultiheadAttention(self.D, self.H, dropout=0.0, batch_first=True)

            # 复制相同权重以公平对比
            # 自定义的 qkv_proj 权重需要按顺序复制给官方的 in_proj_weight
            with torch.no_grad():
                # 自定义的 qkv_proj.weight 形状: (3*D, D)
                # 官方的 in_proj_weight 形状: (3*D, D)，可直接复制
                self.attn_official.in_proj_weight.copy_(self.attn_custom.qkv_proj.weight)
                self.attn_official.out_proj.weight.copy_(self.attn_custom.out_proj.weight)

        def test_output_equivalence(self):
            # 无掩码
            out_custom = self.attn_custom(self.x)
            out_official, _ = self.attn_official(self.x, self.x, self.x)
            self.assertTrue(torch.allclose(out_custom, out_official, atol=1e-5))
    ```

    23.3 注意事项

    - 官方 nn.MultiheadAttention 在 batch_first=True 时输入形状为 (B, L, D)。

    - 如果有偏置，也需要复制。还需注意官方对 key_padding_mask 的解释（True 表示忽略），与自己实现一致。

    - dropout 设为 0 确保确定性。


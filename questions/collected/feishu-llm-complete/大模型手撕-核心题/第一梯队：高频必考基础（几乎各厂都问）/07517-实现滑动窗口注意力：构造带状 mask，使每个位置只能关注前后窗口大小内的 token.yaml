  prompt: 实现滑动窗口注意力：构造带状 mask，使每个位置只能关注前后窗口大小内的 token。
answer:
  mode: rubric
  reference_answer: |-
    20.1 原理

    滑动窗口注意力（Sliding Window Attention）限制每个 Query 位置只能关注 Key 位置中距离不超过 window_size 的部分（通常只关注左侧的 window_size 个 token，或同时关注左右）。这降低了长序列下注意力的计算量，并将复杂度从 O(L^2) 降低到 O(L * window_size)。

    20.2 实现

    ```python
    def create_sliding_window_mask(seq_len, window_size, device, bidirectional=False):
        """
        生成滑动窗口掩码，1 表示可关注，0 表示屏蔽。
        bidirectional: 是否双向关注（前后窗口）
        """
        mask = torch.zeros(seq_len, seq_len, device=device)
        if bidirectional:
            for i in range(seq_len):
                left = max(0, i - window_size)
                right = min(seq_len, i + window_size + 1)
                mask[i, left:right] = 1.0
        else:  # 单向（因果）：只能看左侧 window_size 个 token
            mask = torch.tril(torch.ones(seq_len, seq_len, device=device))
            for i in range(seq_len):
                mask[i, :max(0, i - window_size)] = 0.0
        return mask  # 0/1

    # 在注意力中使用
    class SlidingWindowAttention(MultiHeadSelfAttention):
        def __init__(self, hidden_dim, num_heads, window_size, dropout=0.1):
            super().__init__(hidden_dim, num_heads, dropout)
            self.window_size = window_size

        def forward(self, x, key_padding_mask=None):
            B, seq_len, _ = x.shape
            qkv = self.qkv_proj(x)
            q, k, v = qkv.chunk(3, dim=-1)
            q = q.view(B, seq_len, self.num_heads, self.head_dim).transpose(1, 2)
            k = k.view(B, seq_len, self.num_heads, self.head_dim).transpose(1, 2)
            v = v.view(B, seq_len, self.num_heads, self.head_dim).transpose(1, 2)

            scale = math.sqrt(self.head_dim)
            attn_scores = torch.matmul(q, k.transpose(-2, -1)) / scale

            # 生成滑动窗口掩码
            window_mask = create_sliding_window_mask(seq_len, self.window_size, x.device)
            attn_scores = attn_scores.masked_fill(window_mask == 0, float('-inf'))

            if key_padding_mask is not None:
                attn_scores = attn_scores.masked_fill(
                    key_padding_mask.unsqueeze(1).unsqueeze(2), float('-inf'))

            attn_weights = F.softmax(attn_scores, dim=-1)
            attn_weights = self.dropout(attn_weights)
            attn_output = torch.matmul(attn_weights, v)
            attn_output = attn_output.transpose(1, 2).contiguous().view(B, seq_len, -1)
            return self.out_proj(attn_output)
    ```

    20.3 应用场景

    - 如 Mistral、Longformer 等模型使用滑动窗口注意力处理长序列。

    - 通常与全局注意力（如特定 token 可关注所有位置）结合，以保留长程交互能力。


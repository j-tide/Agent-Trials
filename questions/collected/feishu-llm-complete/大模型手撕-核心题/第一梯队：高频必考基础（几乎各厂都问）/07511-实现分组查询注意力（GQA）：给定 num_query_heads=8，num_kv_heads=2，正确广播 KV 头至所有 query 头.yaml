  prompt: 实现分组查询注意力（GQA）：给定 num_query_heads=8，num_kv_heads=2，正确广播 KV 头至所有 query 头。
answer:
  mode: rubric
  reference_answer: |-
    7.1 GQA 原理

    分组查询注意力（Grouped Query Attention）是多查询注意力（MQA）和多头注意力（MHA）的折中。它将 query 头分成若干组，每组内的 query 头共享一对 K、V 头。这大幅减少了 KV Cache 的大小（从 h 倍减少到 g 倍），同时保持了比 MQA 更好的质量。

    当 num_query_heads=8，num_kv_heads=2 时，num_groups=8//2=4。每个 KV 头服务于连续的 4 个 query 头。

    7.2 广播机制

    - K 和 V 的初始形状为 (B, num_kv_heads, seq_len, head_dim)。

    - 通过 k.unsqueeze(2).expand(-1, -1, num_groups, -1, -1) 在每组内复制。

    - 然后 reshape 成 (B, num_query_heads, seq_len, head_dim)，直接与 Q 进行计算。

    7.3 完整实现

    ```python
    class GroupedQueryAttention(nn.Module):
        def __init__(self, hidden_dim, num_query_heads, num_kv_heads, dropout=0.1):
            super().__init__()
            assert num_query_heads % num_kv_heads == 0
            self.hidden_dim = hidden_dim
            self.num_query_heads = num_query_heads
            self.num_kv_heads = num_kv_heads
            self.head_dim = hidden_dim // num_query_heads
            self.num_groups = num_query_heads // num_kv_heads

            self.q_proj = nn.Linear(hidden_dim, num_query_heads * self.head_dim, bias=False)
            self.k_proj = nn.Linear(hidden_dim, num_kv_heads * self.head_dim, bias=False)
            self.v_proj = nn.Linear(hidden_dim, num_kv_heads * self.head_dim, bias=False)
            self.out_proj = nn.Linear(hidden_dim, hidden_dim, bias=False)
            self.dropout = nn.Dropout(dropout)

        def forward(self, x, key_padding_mask=None, attn_mask=None):
            B, seq_len, _ = x.shape

            # 投影与分头
            q = self.q_proj(x).view(B, seq_len, self.num_query_heads, self.head_dim).transpose(1, 2)
            k = self.k_proj(x).view(B, seq_len, self.num_kv_heads, self.head_dim).transpose(1, 2)
            v = self.v_proj(x).view(B, seq_len, self.num_kv_heads, self.head_dim).transpose(1, 2)

            # 广播 KV 头：在组维度上复制
            # k: (B, 2, L, D) -> (B, 2, 1, L, D) -> (B, 2, 4, L, D) -> (B, 8, L, D)
            k = k.unsqueeze(2).expand(-1, -1, self.num_groups, -1, -1).contiguous()
            k = k.view(B, self.num_query_heads, seq_len, self.head_dim)
            v = v.unsqueeze(2).expand(-1, -1, self.num_groups, -1, -1).contiguous()
            v = v.view(B, self.num_query_heads, seq_len, self.head_dim)

            # 注意力计算
            scale = math.sqrt(self.head_dim)
            attn_scores = torch.matmul(q, k.transpose(-2, -1)) / scale

            if key_padding_mask is not None:
                attn_scores = attn_scores.masked_fill(
                    key_padding_mask.unsqueeze(1).unsqueeze(2), float('-inf')
                )
            if attn_mask is not None:
                attn_scores = attn_scores.masked_fill(attn_mask == 0, float('-inf'))

            attn_weights = F.softmax(attn_scores, dim=-1)
            attn_weights = self.dropout(attn_weights)
            attn_output = torch.matmul(attn_weights, v)

            # 合并
            attn_output = attn_output.transpose(1, 2).contiguous().view(B, seq_len, -1)
            return self.out_proj(attn_output)
    ```

    7.4 性能与内存考量

    - 通过共享 KV 头，KV Cache 的大小减小到原来的 num_kv_heads / num_query_heads = 1/4。

    - 在 unsqueeze 和 expand 过程中，并不分配额外内存（expand 返回视图），但需注意 contiguous() 在某些后续操作前可能需要。

    - GQA 被广泛用于 LLaMA 2/3 等大模型，以平衡推理效率和生成质量。


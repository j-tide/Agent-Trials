content:
  prompt: 计算 RoPE 的基频选择
answer:
  mode: rubric
  reference_answer: |-
    题目：给定维度 d=128，最大序列长度 L=2048，手动计算 RoPE 中频率 θ_i = 10000^{-2i/d} 的前 5 个频值，并解释基频 10000 的作用。

    4.1 计算前 5 个频率

    d=128，则 i = 0,1,2,3,4。
    公式：θ_i = 10000^{-2i/d} = 10000^{-i/64}。

    - i=0: θ_0 = 10000^{0} = 1.0

    - i=1: θ_1 = 10000^{-1/64} = e^{- (ln 10000)/64} ≈ e^{-9.2103/64} ≈ e^{-0.1439} ≈ 0.866

    - i=2: θ_2 = 10000^{-2/64} = 10000^{-1/32} ≈ e^{-0.2878} ≈ 0.75

    - i=3: θ_3 = 10000^{-3/64} ≈ e^{-0.4317} ≈ 0.649

    - i=4: θ_4 = 10000^{-4/64} = 10000^{-1/16} ≈ e^{-0.5756} ≈ 0.562

    所以前五个频率约为 1.0, 0.866, 0.75, 0.649, 0.562。这些频率随着 i 增大而减小，即越靠后的维度组旋转速度越慢，捕捉更长的距离依赖。

    4.2 基频 10000 的作用

    基频 10000 决定了频率的整体尺度。较大的基频使得低频部分变化更缓慢，能支持更长的上下文窗口。RoPE 的外推能力依赖于基频的选择：增大基频（如 1000000）可以显著扩展有效上下文长度，而不需要微调。这是最近 NTK-aware 插值等方法的核心思想。


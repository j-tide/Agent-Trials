answer:
  mode: rubric
  reference_answer: |-
    题目：编写函数 precompute_freqs_cis(dim, max_seq_len, theta=10000.0)，输出复数形式的旋转因子 cis（即 cos + i*sin）。

    6.1 实现代码

    ```python
    import torch

    def precompute_freqs_cis(dim, max_seq_len, theta=10000.0):
        # 计算频率
        freqs = 1.0 / (theta ** (torch.arange(0, dim, 2).float() / dim))  # (dim/2,)
        t = torch.arange(max_seq_len)  # (max_seq_len,)
        freqs = torch.outer(t, freqs)  # (max_seq_len, dim/2)
        # 转为复数 cis
        freqs_cis = torch.polar(torch.ones_like(freqs), freqs)  # (max_seq_len, dim/2)
        return freqs_cis
    ```

    6.2 说明

    - freqs 的最后一维是 dim/2，对应每个二维子空间的频率。

    - 使用 torch.polar 直接创建复数：abs=1, angle=freqs，即 e^{i * freqs}。

    - 得到的 freqs_cis 可以后续与 query/key 的复数形式直接相乘实现旋转。复数方式比实数分拆更简洁且高效（依赖底层优化）。


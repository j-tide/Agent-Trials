content:
  prompt: 实现一个函数，将多个 LoRA 适配器进行加权融合（如 W_merged = W0 + w1B1A1 + w2B2A2），写出权重融合的代码。
answer:
  mode: rubric
  reference_answer: |-
    17.1 应用场景

    多任务 LoRA 的集成：将针对不同任务训练的多个 LoRA 适配器加权组合，得到一个融合后的模型，无需显式切换适配器。权重 w_i 可以人工指定或通过学习得到。

    17.2 实现

    ```python
    def merge_multiple_loras(model, lora_list, weights):
        """
        lora_list: 每个元素是保存的LoRA权重字典 {layer_name: {'A': A_tensor, 'B': B_tensor, 'alpha': val, 'r': val}}
        weights: 与 lora_list 对应的融合权重列表，总和不需要为1。
        操作：对于每个LoRA层，计算 ΔW_total = Σ w_i * (α_i / r_i) * B_i @ A_i
        然后加到原始权重 W0 上。
        """
        # 首先收集所有LoRA层的名称（假设所有lora的层名称一致）
        layer_names = lora_list[0].keys()
        for name in layer_names:
            delta_total = 0.0
            for lora_weights, w in zip(lora_list, weights):
                A = lora_weights[name]['A']
                B = lora_weights[name]['B']
                alpha = lora_weights[name]['alpha']
                r = lora_weights[name]['r']
                delta = (alpha / r) * (B @ A)
                delta_total = delta_total + w * delta
            # 找到对应的原始权重层并累加
            target_module = dict(model.named_modules())[name]
            if isinstance(target_module, LoRALinear):
                target_module.linear.weight.data += delta_total.to(target_module.linear.weight.dtype)
            elif isinstance(target_module, nn.Linear):
                target_module.weight.data += delta_total.to(target_module.weight.dtype)
    ```

    17.3 注意事项

    - 融合后模型变为普通线性层，不再包含 LoRA 参数。

    - 可以指定融合哪些层，或者对所有层应用。

    - 如果需要保留原 LoRA 结构以便后续调整，可创建新的适配器存储融合结果。


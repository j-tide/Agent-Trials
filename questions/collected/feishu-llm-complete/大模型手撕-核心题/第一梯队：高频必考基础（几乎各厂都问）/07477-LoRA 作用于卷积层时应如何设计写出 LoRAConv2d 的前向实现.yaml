content:
  prompt: LoRA 作用于卷积层时应如何设计？写出 LoRAConv2d 的前向实现。
answer:
  mode: rubric
  reference_answer: |-
    20.1 设计思路

    卷积层的权重张量形状为 (out_channels, in_channels, kernel_h, kernel_w)。LoRA 的思想可以自然地扩展到卷积层：我们将卷积核的增量分解为低秩形式。常见做法是将卷积核视为一个大的矩阵 (out_channels, in_channels * k_h * k_w)，然后应用低秩分解；或者采用张量分解。但更简单且有效的方式是将 LoRA 应用于 1x1 卷积（等价于线性层），而对于空间卷积，通常保留其原始形式，因为空间维度通常较小，低秩收益有限。

    如果一定要实现通用 LoRAConv2d，我们可以将卷积操作的增量设计为：对输入 x，先经过一个小的卷积（降维），再经过一个卷积（升维），产生与原始输出同形状的增量。这类似于深度可分离卷积的思想，但低秩体现在通道数上。

    20.2 实现（通道低秩版本）

    ```python
    class LoRAConv2d(nn.Module):
        def __init__(self, conv2d: nn.Conv2d, r: int, alpha: float):
            super().__init__()
            self.conv = conv2d
            self.r = r
            self.alpha = alpha
            self.scaling = alpha / r

            in_ch = conv2d.in_channels
            out_ch = conv2d.out_channels
            k_size = conv2d.kernel_size
            stride = conv2d.stride
            padding = conv2d.padding

            # 降维卷积 (in_ch -> r)
            self.lora_A = nn.Conv2d(in_ch, r, kernel_size=k_size, stride=stride, padding=padding, bias=False)
            # 升维卷积 (r -> out_ch) 用1x1卷积，因为空间尺寸已经由lora_A确定
            self.lora_B = nn.Conv2d(r, out_ch, kernel_size=1, bias=False)

            # 初始化：A 随机，B 零
            nn.init.kaiming_normal_(self.lora_A.weight)
            nn.init.zeros_(self.lora_B.weight)

            # 冻结原始卷积
            for p in self.conv.parameters():
                p.requires_grad = False

        def forward(self, x):
            out = self.conv(x)
            lora_out = self.lora_B(self.lora_A(x))
            return out + self.scaling * lora_out
    ```

    注意：这里 lora_A 采用了与原始卷积相同的 kernel_size, stride, padding，以保证空间分辨率一致；lora_B 使用 1x1 卷积，仅做通道映射。这种设计保持了空间一致性，并且可训练参数非常少（r×in_ch×k_h×k_w + r×out_ch×1×1）。


content:
  prompt: 基频 10000 的选取对训练稳定性的影响
answer:
  mode: rubric
  reference_answer: |-
    基频 base 决定了频率的尺度：θ_i = base^{-2i/d}。若 base 太小（如 10），所有频率都偏大，低频分量也会快速振荡，导致模型难以捕捉长距离依赖；同时梯度在高频旋转角度上可能振荡剧烈，训练不稳定。

    若 base 太大（如 10^6），则几乎所有频率都非常小，旋转角度随位置变化极慢，模型无法区分相邻位置，丧失了位置编码的意义；且对于有限训练长度，角度变化量极小，优化可能陷入平坦区域，梯度消失。

    梯度分析：RoPE 通过 cos(m * θ_i) 和 sin(m * θ_i) 作用于 Q、K。对 θ_i 的梯度包含 m 因子，因此长序列训练时，低频（i 小）的梯度较大，可能导致优化震荡；高频梯度很小，可能难以学习。适当的 base 可以平衡不同频率分量的梯度分布，使得模型能同时学习短距和长距依赖。

    标准选择 base=10000 经过大量实验验证，在典型维度（如 64~128）和训练长度下提供了良好的频率覆盖和训练稳定性。当需要外推时，才通过增大 base 或 NTK-aware 方法调整。

content:
  prompt: 解释 RoPE 的远程衰减性质
answer:
  mode: rubric
  reference_answer: |-
    题目：证明或直观解释：为什么 RoPE 可以使得内积随着相对距离的增大而衰减？给出公式推导。

    3.1 衰减性的直观解释

    RoPE 后的 query 和 key 内积为：

    ```text
    (q'_m)^T (k'_n) = (R(m) q_m)^T (R(n) k_n) = q_m^T R(m)^T R(n) k_n
    ```

    由于旋转矩阵是正交矩阵，有 R(m)^T = R(-m)，且 R(-m) R(n) = R(n - m)，因此内积仅依赖于相对位置 Δ = n - m：

    ```text
    (q'_m)^T (k'_n) = q_m^T R(Δ) k_n
    ```

    展开后，对于第 i 个子空间，其贡献为：

    ```text
    q_{2i} k_{2i} cos(Δ θ_i) + q_{2i} k_{2i+1} sin(Δ θ_i) - q_{2i+1} k_{2i} sin(Δ θ_i) + q_{2i+1} k_{2i+1} cos(Δ θ_i)
    ```

    对于随机的 q, k 分量，期望上该值随着 |Δ| 增大而振荡衰减，因为高频分量（i 大，θ_i 小）在长距离上迅速振荡，内积的平均值趋近于零；低频分量（i 小，θ_i 大）则提供主要的远程依赖。这种特性使得模型能自然学习到距离相关的权重衰减。

    3.2 数学分析

    可证明，当 q 和 k 的每个分量独立同分布、均值为零时，E[(q'_m)^T (k'_n)] = 0，且方差随 |Δ| 增大而减小。具体来说，每个子空间的期望内积值与 cos(Δ θ_i) 成正比，随着 |Δ| 增大，多个不同频率的余弦项叠加会导致整体内积幅值衰减。这就是 RoPE 的远程衰减性质。


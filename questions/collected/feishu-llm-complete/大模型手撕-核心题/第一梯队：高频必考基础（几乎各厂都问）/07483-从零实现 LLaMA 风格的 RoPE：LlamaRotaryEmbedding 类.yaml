content:
  prompt: 从零实现 LLaMA 风格的 RoPE：LlamaRotaryEmbedding 类
answer:
  mode: rubric
  reference_answer: |-
    参照 LLaMA 源码，其 RoPE 实现通过预计算复数形式的 freqs_cis，并提供了 forward 方法根据序列长度返回 cos 和 sin（或直接返回复数）。下面给出完整实现：

    ```python
    import torch
    import torch.nn as nn

    class LlamaRotaryEmbedding(nn.Module):
        def __init__(self, dim, max_position_embeddings=2048, base=10000.0, device=None):
            super().__init__()
            self.dim = dim          # head_dim
            self.max_position_embeddings = max_position_embeddings
            self.base = base
            # 计算 inv_freq: (dim/2,)
            inv_freq = 1.0 / (self.base ** (torch.arange(0, dim, 2).float().to(device) / dim))
            self.register_buffer("inv_freq", inv_freq, persistent=False)

        @torch.no_grad()
        def forward(self, x, position_ids):
            """
            x: 输入，仅用于获取 dtype 和 device
            position_ids: (batch_size, seq_len) 或 (seq_len,)
            返回 cos, sin，形状 (batch_size, seq_len, dim)
            """
            # 扩展维度以进行外积
            inv_freq_expanded = self.inv_freq[None, :, None].float().expand(position_ids.shape[0], -1, 1)
            position_ids_expanded = position_ids[:, None, :].float()
            # 计算频率矩阵: (batch, dim/2, seq_len)
            freqs = (inv_freq_expanded @ position_ids_expanded).transpose(1, 2)  # (batch, seq_len, dim/2)
            # 拼接成 dim 维度（每个频率重复两次）
            emb = torch.cat((freqs, freqs), dim=-1)  # (batch, seq_len, dim)
            cos = emb.cos().to(x.dtype)
            sin = emb.sin().to(x.dtype)
            return cos, sin
    ```

    使用时：

    ```python
    cos, sin = rotary_emb(x, position_ids)
    # 在注意力中应用旋转
    q_embed = (q * cos.unsqueeze(1)) + (rotate_half(q) * sin.unsqueeze(1))
    k_embed = (k * cos.unsqueeze(1)) + (rotate_half(k) * sin.unsqueeze(1))
    ```

    其中 rotate_half 将后半部分取负并交换前后半部分，实现二维旋转。


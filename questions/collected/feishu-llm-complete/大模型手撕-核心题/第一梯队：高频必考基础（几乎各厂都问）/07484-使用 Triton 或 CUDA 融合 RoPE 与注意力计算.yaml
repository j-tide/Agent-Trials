content:
  prompt: 使用 Triton 或 CUDA 融合 RoPE 与注意力计算
answer:
  mode: rubric
  reference_answer: |-
    融合的基本想法：在注意力 kernel 中，加载 Q 和 K 的块后，直接在片上计算 RoPE 的旋转，避免将旋转后的 Q、K 写回 HBM。伪代码（CUDA 思路）：

    [图片内容未导入]

    在 Triton 中，可以在加载 Q、K 的切片后，应用旋转：

    ```python
    @triton.jit
    def rope_rotate(q, k, cos, sin, seq_len, ...):
        idx = tl.program_id(0)
        # 加载 cos, sin 对应位置
        c = tl.load(cos + ...)
        s = tl.load(sin + ...)
        q0, q1 = ...
        q_rot0 = q0 * c - q1 * s
        q_rot1 = q0 * s + q1 * c
        tl.store(...)
    ```

    融合后的优点：减少了一次全局内存的读写（旋转后的 Q、K 不必写出再读入），显著提升带宽利用率。实际实现较复杂，通常集成在 FlashAttention kernel 中。


    6.1 einsum 实现

    torch.einsum 使用爱因斯坦求和约定，通过下标字符串明确指定运算的维度，免去显式的转置和形状记忆。

    ```python
    def scaled_dot_product_einsum(query, key, value, scale=None, mask=None):
        """
        query: (B, n_heads, L_q, head_dim)
        key:   (B, n_heads, L_k, head_dim)
        value: (B, n_heads, L_k, head_dim)
        """
        if scale is None:
            scale = math.sqrt(query.size(-1))
        # 计算注意力分数: 'b h q d, b h k d -> b h q k'
        scores = torch.einsum('b h q d, b h k d -> b h q k', query, key) / scale
        if mask is not None:
            scores = scores.masked_fill(mask == 0, float('-inf'))
        weights = F.softmax(scores, dim=-1)
        # 加权求和: 'b h q k, b h k d -> b h q d'
        output = torch.einsum('b h q k, b h k d -> b h q d', weights, value)
        return output
    ```

    6.2 与 matmul 的比较

    - 可读性：einsum 直观地表达了张量缩并的语义，尤其适合需要非标准缩并的场景（如批量矩阵乘法中的特定维度对齐）。matmul 则较为隐式，但它是标准的批量矩阵乘法，对于 (B, M, K) @ (B, K, N) 非常高效。

    - 性能：matmul 被底层库（cuBLAS）高度优化，通常比 einsum 快，尤其是大张量。einsum 在某些情况下可能导致临时内存分配和未优化的计算路径。在追求极致性能的生产代码中，推荐使用 matmul 或 F.scaled_dot_product_attention。

    - 灵活性：einsum 支持更复杂的张量操作，如可以同时进行转置和缩并，而 matmul 要求输入符合特定形状，必要时需先 transpose。

    6.3 实践建议

    - 在快速原型开发或教学场景，使用 einsum 可提升代码清晰度。

    - 在模型训练和推理部署中，优先使用 matmul 或 PyTorch 2.0+ 的 scaled_dot_product_attention，后者会自动选择最优实现（包括 Flash Attention）。


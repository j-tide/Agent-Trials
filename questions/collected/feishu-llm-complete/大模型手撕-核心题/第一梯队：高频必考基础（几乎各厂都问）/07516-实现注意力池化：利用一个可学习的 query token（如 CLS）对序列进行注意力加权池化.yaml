  prompt: 实现注意力池化：利用一个可学习的 query token（如 CLS）对序列进行注意力加权池化。
answer:
  mode: rubric
  reference_answer: |-
    24.1 原理

    注意力池化（Attention Pooling）不同于平均池化或最大池化，它通过学习一个全局的查询向量 query，与序列中每个位置的 key 进行注意力计算，得到一组权重，再对 value 加权求和。这种方式可以关注序列中最重要的部分，类似于 BERT 的 CLS token 但可独立于下游任务微调。

    24.2 实现

    ```python
    class AttentionPooling(nn.Module):
        def __init__(self, hidden_dim, num_heads=1):
            super().__init__()
            self.num_heads = num_heads
            self.head_dim = hidden_dim // num_heads
            # 可学习的 query 向量，形状 (1, 1, hidden_dim) 或 (1, num_heads, head_dim)
            self.query = nn.Parameter(torch.randn(1, 1, hidden_dim))
            self.key_proj = nn.Linear(hidden_dim, hidden_dim, bias=False)
            self.value_proj = nn.Linear(hidden_dim, hidden_dim, bias=False)
            self.out_proj = nn.Linear(hidden_dim, hidden_dim)

        def forward(self, x, mask=None):
            """
            x: (B, L, D)
            mask: (B, L) 可选
            """
            B, L, D = x.shape
            # 投影 K, V
            K = self.key_proj(x)  # (B, L, D)
            V = self.value_proj(x)
            # 扩展 query
            Q = self.query.expand(B, -1, -1)  # (B, 1, D)

            # 若多头，可 reshape，这里简化为单头或默认 num_heads=1
            # 计算注意力分数
            scores = torch.matmul(Q, K.transpose(-2, -1)) / math.sqrt(D)  # (B, 1, L)
            if mask is not None:
                scores = scores.masked_fill(mask.unsqueeze(1), float('-inf'))
            attn_weights = F.softmax(scores, dim=-1)

            # 加权求和
            pooled = torch.matmul(attn_weights, V).squeeze(1)  # (B, D)
            return self.out_proj(pooled)
    ```

    24.3 应用

    - 可用于替代平均池化，对句子或段落进行聚合。

    - 可配合多个 query token 实现多视角池化（类似于多个 CLS）。

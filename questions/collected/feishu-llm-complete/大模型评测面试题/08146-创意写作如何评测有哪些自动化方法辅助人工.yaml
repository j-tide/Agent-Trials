content:
  prompt: 创意写作如何评测？有哪些自动化方法辅助人工？
answer:
  mode: rubric
  reference_answer: |-
    创意写作的评测因其高度主观性和艺术性而尤为困难。其目标是衡量作品在独创性、审美价值、情感共鸣和文笔上的表现。

    评测方法：

    - 人工专家评审为核心：目前，人类评估（尤其是作家、编辑或文学评论家）仍然是创意写作评测的金标准。他们根据预先定义的评分量表，从主题、结构、语言、创意、连贯性等多个维度进行综合鉴赏和打分。

    - 众包偏好评估：将两篇或多篇匿名作品呈现给大量普通读者，进行成对比较或评分，收集大众的审美偏好数据。这可以衡量作品的“受欢迎度”和“可读性”，但可能低估先锋或小众的艺术价值。

    自动化辅助方法（不能替代，但能降本增效和提供部分信号）：

    - 语言学风格与多样性指标：

    - 基于大模型裁判的多维度评分：

    - 情感与故事弧线分析：

    - 社区互动信号：在在线平台上，可使用阅读量、点赞、分享、收藏等用户行为数据作为创意作品吸引力和传播力的代理指标，但存在严重的大众品位偏差。

    核心挑战：自动指标无法真正理解情感深度、隐喻的美感和思想的独创性。因此，创意写作的最佳评测仍是“机器初筛+人工精评”，用自动指标处理海量作品的初步过滤和基础质量把控，释放人类专家的精力去专注于高层次的审美判断。


content:
  prompt: 视觉问答（VQA）和图像描述的传统评测指标如何适配 LLM 多模态？
answer:
  mode: rubric
  reference_answer: |-
    视觉问答（VQA）和图像描述（Image Captioning）的传统评测指标多为基于精确匹配或 n-gram 重叠的自动指标，在面对大模型多模态输出时，其局限性被放大。适配的核心是从“封闭式匹配”转向“开放式语义评估”。

    视觉问答的适配：

    - 传统指标：准确率（EM或VQA Score）。对于多选或短答案，直接比对标准答案。这对答案空间有限的任务仍适用，如VQAv2的特定版本。但对于开放式答案，传统EM过于严格。

    - LLM多模态的适配：

    - 基于语义等价：使用语言模型（如GPT-4）来判断模型输出的答案与标准答案是否在语义上一致，而不是字面匹配。这是当前主流。

    - 答案归一化：在比EM之前，进行更智能的归一化，包括同义词替换、单位换算、数值近似判断。

    - 多维度评分：对于解释性VQA，可让裁判模型对答案的准确性、完整性和推理逻辑进行1-5分评分。

    - 指标：Accuracy（软匹配）、GPT-Score、CIDEr的变体（用于长答案，但较少用）。同时，VQA评测中还需结合视觉定位正确率，即模型是否能指对图中物体来回答问题，这通过是否正确给出边界框或区域描述来衡量。

    图像描述的适配：

    - 传统指标：BLEU、ROUGE、METEOR、CIDEr、SPICE。它们主要衡量与参考描述的词汇重叠和语义命题重叠。致命缺陷是完全无法检测对象幻觉，且严重低估多样化的高质量描述。

    - LLM多模态的适配：

    - 忠实度指标成为核心：使用专门的多模态幻觉检测指标替代传统指标。如 POPE（检测对象幻觉）、CHAIR（Caption Hallucination Assessment with Image Relevance，检查描述中的物体是否真实出现在图中）。

    - 基于视觉蕴涵的评分：将描述拆成原子声明，用视觉蕴涵模型或强多模态裁判判断每个声明是否被图像支撑，计算支撑率。

    - 多维度裁判评分：使用GPT-4V等作为裁判，从忠实性、细节丰富度、连贯性等维度打分，并通过与人类评委的相关性验证其有效性。

    - 参考无关的评估：如 CLIPScore，计算生成描述与图像的CLIP嵌入相似度，无需人工参考，直接衡量图文相关性。但CLIPScore对细节敏感度不足，常作为辅助。

    总结：传统指标在封闭式评测中仍有遗留价值，但 LLM 多模态评测已转向以视觉蕴涵、多模态裁判和幻觉检测为核心的语义级框架，旨在回答“描述是否真实反映了图像，而非仅仅与人工参考相似”。


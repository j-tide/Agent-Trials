content:
  prompt: 使用 LLM 评测数学或代码生成时，如何设计 prompt 让裁判关注正确性而非流畅性？
answer:
  mode: rubric
  reference_answer: |-
    数学和代码评测的核心是功能正确性，而模型裁判天然有注重文本流畅性和格式的倾向。需要强约束 prompt，将裁判的焦点锁定在客观正确性上。

    设计策略：

    （一）数学评测 prompt 设计要点

    - 提供标准答案并强制比对：在 prompt 中显式给出题目的标准答案（最终数值或表达式），要求裁判的核心任务是对比模型生成的答案与标准答案是否数学等价，而非评价其推理解释的文采。

    - 要求提取并孤立最终答案：指令裁判先从模型的长篇回答中利用正则或特定格式提取出“最终答案”部分，然后只基于提取的结果做正确性判断。这能有效避免被中间华丽的推理过程迷惑。

    - 提供错误答案示例作为锚定：在 prompt 中给出一个“推理过程非常详尽、语言流畅但最终答案错误”的例子，并标注为0分（或错误）。这直接教会裁判“漂亮的过程不等于正确的答案”。

    - 使用严格的评分量表：放弃主观的1-10分制，使用二元判断（正确/错误）或基于数学等价性的严格匹配。如果必须分步给分，明确定义每一步的给分点与最终答案的权重，并强调最终答案错误的严重扣分。

    （二）代码评测 prompt 设计要点

    - 基于执行结果而不是文本相似度：这是根本。设计系统时，尽可能不要只让裁判“读”代码，而是将代码的实际执行结果（通过测试用例的 Pass/Fail 状态、输出值）作为裁判输入的一部分。裁判的任务就变成了对执行结果的解读，而非评判代码本身。

    - 若无执行环境，强制进行静态逻辑分析：要求裁判模型扮演“代码编译器/解释器”的角色，逐步跟踪变量的值、判断逻辑分支，最终得出输出，而不是仅仅评论代码风格。

    - 制定严格的功能正确性核对清单：对于特定编程问题，在 prompt 中列出代码必须满足的功能点（如“必须处理空列表情况”、“时间复杂度必须为O(n) ”）。要求裁判逐一核对，每一项不合格都直接扣分。

    总结：用“标准答案比对”、“执行结果反馈”、“强制逻辑模拟”和“反例锚定”这四种手段，可以有效压制裁判对文本流畅性的天然偏好，迫使其在硬核的正确性维度上做出可靠判断。


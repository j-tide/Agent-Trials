content:
  prompt: 如何评测多模态模型的跨模态推理能力（如图表理解、流程图分析）？
answer:
  mode: rubric
  reference_answer: |-
    图表理解、流程图分析需要模型将视觉布局、数值、文字标签和逻辑关系整合，进行抽象推理，属于高阶跨模态推理。

    评测设计核心：

    （一）针对不同图表类型的任务分解

    - 柱状/折线/饼图：评测数据提取（“X年的Y值是多少？”）、比较（“谁最大？”）、趋势分析（“呈现什么趋势？”）、异常检测（“有无反常数据点？”）。

    - 流程图/结构图：评测步骤顺序理解、元素间的层级/因果关系、决策路径推理（“如果条件A不满足，会怎样？”）。

    - 地图：评测空间方位、路线规划、区域属性查询。

    - 表格：评测行列定位、多条件过滤、汇总计算。

    （二）评测方法

    - 标准化基准：

    - 生成式评判：对于开放式问题（如“分析这张股票走势图”），使用强多模态裁判（如GPT-4V）基于详细评分量规（准确性、深度、逻辑性）打分，并与人类专家的评判进行相关性验证。

    - 结构化输出评测：要求模型将图表信息转换为JSON或表格形式，然后直接比对关键值、关系和趋势描述的正确率。

    （三）关键评测指标

    - 数值准确性：提取和计算出的数值的精确匹配率或误差容忍度。

    - 逻辑推理链正确率：若要求输出分析过程，验证其推理步骤是否逻辑自洽且符合图表信息。

    - 抗干扰能力：在图表中加入无关装饰、误导性配色或不规范标注后，模型性能的下降程度。

    - 概括与表达能力：模型能否用清晰、专业的语言总结图表的核心发现，而非简单罗列数据。由裁判模型评分。

    （四）诊断性评测

    - 区分模型是依赖于OCR文本还是真正理解视觉编码（如柱子的高度）。可构造视觉与文本信息矛盾的对抗性图表，测试模型信哪个。

    - 评估模型对未见过的图表类型的泛化能力，考察其是否掌握了抽象的“图表语法”。


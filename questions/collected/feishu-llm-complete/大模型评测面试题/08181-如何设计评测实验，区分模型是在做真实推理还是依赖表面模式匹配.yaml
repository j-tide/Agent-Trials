content:
  prompt: 如何设计评测实验，区分模型是在做真实推理还是依赖表面模式匹配？
answer:
  mode: rubric
  reference_answer: |-
    区分真实推理与模式匹配是评测的核心难题。需要设计能够隔绝统计线索、制造反常识组合、并强制展现推理过程的实验。

    实验设计策略：

    （1）反常识与反事实干扰

    - 修改训练分布：构造测试集，其中某些项目的答案与训练数据中的高频模式相反。例如，在训练数据中，通常“苹果”是红色，但创建一个测试集，其中的文本明确说“这里有一个蓝色的苹果”。然后提问“苹果是什么颜色？”。如果模型坚持回答“红色”，则暴露它依赖于死记硬背的统计模式；如果它根据测试文本的上下文回答“蓝色”，则展现了推理（或至少是忠实遵循上下文）。

    - 前提谬误测试：设计基于完全错误前提的问题，如“既然太阳围绕地球转，那么日出是由什么引起的？” 真正的推理应首先质疑或纠正前提；模式匹配则会欣然接受并顺着编造理由。

    （2）抽象规则与符号替换

    - 纯符号推理：将问题中的所有实体和关系替换为无意义的字母或符号，同时保持逻辑结构不变。例如，将一段社会关系推理转化为“如果A是B的朋友，B是C的朋友，那么A和C是什么关系？”模型如果能在这个符号版本上依然推理正确，说明它掌握的是抽象关系模式，而非具体实体的表面关联。

    - 跨域类比：要求模型将一个领域的规则应用到另一个完全无关的领域。这种迁移要求深层结构理解，是模式匹配难以完成的。

    （3）因果干预与“怎么样”问题

    - 因果归因：不是问“发生了什么”，而是问“如果没发生X，结果会怎样？”或者“是什么原因最可能导致了这个结果？” 这种反事实和因果问题要求模型理解事件间的因果机制，而不能仅靠时序上的共现。

    - 设计“迷惑项”：为问题设置一个在词汇上与统计模式高度重叠、但在因果逻辑上完全不成立的干扰项。只有真正推理了因果链的模型才能避开这个陷阱。

    （4）强制思维链与过程评估

    - 让模型“说出你的思考”：要求模型在给出最终答案前，输出详细的推理步骤。然后对这条思维链进行评估。

    - 切除实验：修改中间推理步骤的某个前提，看最终结论是否随之发生符合逻辑的改变。若不变，则推理链只是装饰。

    （5）生成新组合与长尾测试

    - 组合泛化测试：要求模型解决涉及已知元素但全新组合的问题。例如，训练数据中见过“狗追猫”和“猫追老鼠”，但从未见过“老鼠追狗”。测试模型能否理解这种反向、不常见的关系组合。死记硬背会在此失败。

    - 极长尾实体的推理：选择一些只有极少训练样本的冷门实体，但围绕它们构建与热门实体相同逻辑结构的推理题。表现断崖式下跌证明了对表面模式的依赖。

    通过这些复杂的实验设计，我们可以逐渐剥开模型智能的“洋葱皮”，看清其底层是由坚固的逻辑内核驱动，还是由一堆脆弱、精美的统计关联堆砌而成。


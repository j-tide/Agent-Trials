content:
  prompt: AlpacaEval 2.0 的长度控制机制是怎样的？为何要做长度控制？
answer:
  mode: rubric
  reference_answer: |-
    AlpacaEval 2.0 是一个基于强大模型裁判的自动评估基准，用于比较模型在开放式指令上的表现。它用裁判模型比较“待测模型的回复”与“参考模型（通常是GPT-4或text-davinci-003）的回复”哪个更好，输出胜率。

    长度控制机制：

    - 研究者和社区发现，原始的胜率指标严重受到回复长度偏差的影响：模型生成更长的回复往往会在裁判偏好中获得不公正的高分，即使额外内容没有实际信息量。这导致分数虚高，不能反映真实质量。

    - AlpacaEval 2.0 引入了一种基于回归的长度控制（Length-Controlled Win Rate, LC-WR）。基本思想是：通过统计模型学习一个“长度-胜率”曲线，然后将所有模型的胜率回退到假设它们在相同目标长度下的预期胜率。

    - 具体做法是利用所有待测模型的样本数据，拟合一个逻辑回归模型，将回复长度作为协变量，以此来计算消除长度影响后的质量得分。

    为何要做长度控制：为了剥离长度带来的混淆效应，让评测聚焦于模型回答的实质质量和正确性，而不是奖励“废话连篇”。这使比较更公平，防止模型通过简单堆砌字数来刷榜。


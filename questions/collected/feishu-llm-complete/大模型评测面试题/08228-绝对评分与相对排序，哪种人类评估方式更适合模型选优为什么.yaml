content:
  prompt: 绝对评分与相对排序，哪种人类评估方式更适合模型选优？为什么？
answer:
  mode: rubric
  reference_answer: |-
    相对排序（尤其是成对比较） 通常比绝对评分更适合模型选优，这是由其内在的认知特点和统计优势决定的。

    相对排序（成对比较）的优势：

    - 认知负担低，信度更高：人类不擅长对孤立对象给出绝对质量分数，但非常擅长比较两件东西并判断哪个更好。这让评判更快速、更直觉，评估员间的一致率也更高。

    - 天然规避尺度偏差：绝对评分中，不同评估员对“5分”的理解可能天差地别，且存在个人宽严度偏差。相对排序只需局部决策（A vs B），避免了全局评分尺度不统一的问题。

    - 对微小差异更敏感：当两个模型能力接近时，绝对评分可能都给4分，难以区分。而强制选择能捕获细微的质量差异，提供更强的区分信号。

    - 结果稳定、易聚合：基于大量成对比较的 Elo 评分系统或 Bradley-Terry 模型，能将所有的两两比较信息转化为一个连续、可解释的能力分值，形成全榜排名。

    绝对评分的适用场景与局限：

    - 适合需要知道模型“绝对质量及格线”的场景（如是否达到上线安全标准），或当模型之间存在巨大代差时。

    - 但用于选优时，绝对评分往往不如成对比较精确和稳定。模型越强，绝对评分的区分度越差。

    最佳实践：混合方案

    - 先利用成对比较（相对排序） 对大量模型进行精准的横向排名，选出优胜者。这是模型选优的核心。

    - 再对优胜者进行绝对评分，评估其是否满足最低安全、事实性等硬指标，以确保其有上线资格。

    - 例如，Chatbot Arena 用成对比较计算 Elo 进行排名（选优），而安全审计则使用绝对阈值检查（准入）。

    因此，对于“哪个模型更强”这一选优问题，以成对比较为基础的相对排序是更科学、更经济的方法。


content:
  prompt: 多模态大模型的评测与纯文本评测相比，增加了哪些维度？
answer:
  mode: rubric
  reference_answer: |-
    多模态大模型的评测在纯文本评测的所有维度之上，增加了与视觉、听觉等感知模态及跨模态对齐相关的全新维度，评测体系从“语言理解”扩展为“感知-认知-表达”的综合体。

    新增核心维度：

    （1）感知准确性

    - 对象识别与定位：模型是否能正确识别图像/视频中的物体、人物、场景，并准确给出其在空间中的位置（如边界框、区域描述）。这需要超越文本的视觉细粒度理解。

    - 属性与关系理解：不仅认出物体，还要理解其颜色、大小、材质、状态，以及物体间的空间关系、动作关系和比较关系。例如，“红色的球在桌子左边的椅子下面”。

    - 文本与符号识别（OCR）：准确读取图像中的文字、数字、公式、图标等符号信息，并理解其在场景中的含义。这是多模态模型落地的重要能力。

    - 细粒度与计数：识别微小物体，准确计算图像中特定对象的数量，这对视觉编码器是很大挑战。

    （2）跨模态对齐与推理

    - 图文一致性：模型生成的文字描述是否与视觉内容忠实一致，没有编造视觉不存在的内容（对象幻觉）。这是忠实度的跨模态版本。

    - 跨模态推理：结合图文信息进行逻辑演绎、因果推断、常识推理。例如，看懂一张图表并分析趋势，或者根据一张场景照推断事件的前因后果。

    - 指代理解与定位：根据自然语言描述，在图像中准确找到所指代的区域或物体，将语言符号与视觉实体精确锚定。

    （3）交互与生成能力

    - 视觉对话与多轮交互：在连续对话中，能持续跟踪视觉上下文，理解指代消解（“那个东西”、“它”），并根据用户反馈修正理解。

    - 可控视觉生成：对于生成图像/视频的模型，评测其是否精确遵循文本指令（风格、构图、对象属性），以及生成内容的视觉质量、美学和安全性。

    - 工具使用与行动：结合视觉输入，操控软件界面或指导机器人行动，需要评测其决策和规划的准确性。

    （4）安全、偏见与鲁棒性

    - 多模态越狱：通过图像注入恶意指令，绕过安全护栏。评测模型对视觉输入的鲁棒性。

    - 视觉偏见：模型是否对特定种族、性别或场景的视觉特征存在刻板印象，例如将特定职业与特定外貌关联。

    - 感知鲁棒性：对图像扰动（噪声、模糊、光线变化、裁剪）的抵抗能力，评测视觉编码器的稳定性。

    （5）效率与实时性

    - 多模态模型计算量大，评测需包含视觉编码延迟、端到端响应速度（TTFT），以及在不同分辨率/帧率下的吞吐量，这对实时视频理解等应用至关重要。

    总之，多模态评测将重心从“文本世界”扩展到了“物理世界”的感知与理解，要求评测方法能够量化模型对视觉、听觉信号的保真度、细粒度和跨模态推理的可靠性。


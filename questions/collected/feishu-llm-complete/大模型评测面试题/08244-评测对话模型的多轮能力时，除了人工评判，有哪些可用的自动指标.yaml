content:
  prompt: 评测对话模型的多轮能力时，除了人工评判，有哪些可用的自动指标？
answer:
  mode: rubric
  reference_answer: |-
    多轮对话的自动评测非常困难，但目前已有一些专门设计的指标和框架：

    （1）基于强模型裁判的多轮评分

    - MT-Bench：使用 GPT-4 作为裁判，对每个两轮对话依次打分（1-10分），考察回答对对话历史的依从性和深度。它衡量了模型在多轮互动中的帮助性、连贯性。

    - Chatbot Arena 的自动代理：可以基于相同思想，用裁判模型在多轮交互中进行偏好比较。

    （2）基于对话状态追踪（DST）的准确率

    - 对于任务型对话，预先定义槽位（slot），通过自动模型抽取模型每轮回答中的槽值，与对话历史中用户确认的值进行比较，计算槽位一致性或状态更新准确率。这能量化模型是否“记住并正确更新”了关键信息。

    （3）未来对话模拟与自洽性

    - Self-Consistency 扩展：让模型基于同一对话历史多次生成后续回答，检查关键事实的一致性。例如，在第二轮多次询问同一隐性问题，看答案是否稳定。

    - Factual Drift 检测：利用 NLI 模型检验模型的新回答是否与对话早期自己做出的陈述相矛盾。计算自我矛盾率。

    （4）基于检索的上下文使用率

    - 在 RAG 对话中，评估模型回复中是否有恰当引用，并通过计算回复中能在对话历史或检索文档中找到支撑的声明比例（类似忠实度）来衡量其多轮上下文利用能力。

    （5）交互式自动评测环境

    - 使用另一个强大的模型模拟用户，与待测模型进行多轮对话，然后根据任务完成情况和对话流畅度自动评分（如试购、预订场景）。这模拟了交互的真实动态。

    目前，由于多轮对话的高度开放性，强模型裁判与特定任务的状态追踪是最实用的自动方案，但尚无法完全替代人工。


content:
  prompt: 如何评价一个模型在多语言任务上的表现？常用哪些基准？
answer:
  mode: rubric
  reference_answer: |-
    评估模型的多语言能力需要跨语言覆盖、任务多样性，以及公平的比较机制。

    评价方法：

    - 多语言基准覆盖：选取覆盖多种语系、不同资源程度的语言的基准。

    - 直接评分与跨语言迁移：对于有监督任务，评估模型在低资源语言上的零样本/少样本性能；对于生成任务，评估跨语言的一致性和翻译式幻觉。

    - 公平比较：使用相同的提示模板和评估协议，或采用语言自适应的评估。关注模型在每种语言上的绝对得分和相对于英语的退化比例。

    常用基准：

    - XGLUE / XTREME：覆盖分类、结构预测、问答、检索等多任务，包含数十种语言，是预训练多语言模型的标准评测套件。

    - Flores-200：机器翻译基准，支持200种语言，评估翻译质量和多语言生成的覆盖度。

    - MGSM：多语言小学数学，是GSM8K的翻译版，直接评估多语言推理能力。

    - XLSum：多语言摘要，涵盖多种语言新闻，评估生成质量。

    - Belebele：多语言阅读理解，专门设计来考察长尾语言。

    - Global-MMLU：MMLU的多语言翻译版，评估多领域世界知识的跨语言泛化。

    关键点：好的多语言评测应不仅看总平均，更要关注语言间的公平性和低资源语言的表现，防止模型只是“西方语言专家”。


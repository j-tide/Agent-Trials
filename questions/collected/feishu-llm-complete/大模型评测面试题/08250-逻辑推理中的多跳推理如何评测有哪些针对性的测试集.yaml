content:
  prompt: 逻辑推理中的“多跳推理”如何评测？有哪些针对性的测试集？
answer:
  mode: rubric
  reference_answer: |-
    多跳推理指模型需要整合多个分散在不同位置或文档中的信息，进行一步以上的逻辑推导才能得出最终答案。评测的核心在于检验模型是否能将多个“信息碎片”有效桥接，而不是仅靠单跳匹配。

    评测方法：

    - 链式问答：设计答案依赖于2步或以上推理的问题。比如，要回答“张导演的电影《X》的摄影指导是谁？”，模型需先检索“张导演的电影有哪些”定位到《X》，再从《X》的信息中找到“摄影指导”。

    - 文档分散放置：将多个必要事实分散在不同文档、不同段落或前后相距很远的句子中，迫使模型进行跨域信息整合，而不是从单一段落就能找到答案。

    - 干扰项设计：在推理路径中设置表面相关但实际会导致错误推导的干扰信息。例如，其他导演也有同名电影，或同一部电影有多位摄影指导但时间不同。真正多跳推理能排除干扰，而模式匹配会被误导。

    - 证据链验证：要求模型不仅给出最终答案，还输出推理证据链。评测时同时检查答案正确率和证据链是否完整、无误，并且每一步都有据可依。

    针对性测试集：

    - HotpotQA：经典的多跳问答数据集，问题需要通过维基百科的多篇文章或一篇文章中的多个段落组合推理才能回答。支持证据句标注，可直接评估推理依据的准确性。

    - MuSiQue：通过自底向上的构造管道生成的多跳问题，严格控制每个推理步骤的可回答性和干扰项质量，能有效诊断模型的真实多跳推理能力，避免模型利用单跳知识“作弊”。

    - 2WikiMultihopQA：基于维基百科构造的多跳问答集，问题涵盖跨实体的多种关系推理。

    - Bamboogle / StrategyQA：前者由多跳问题组成，后者需要多步策略性推理（有时需要隐式推理），挑战模型的深层逻辑。

    - FEVER：事实验证任务，虽然是对一个陈述做真实性判断，但许多声明需要综合多份文档中的多跳证据才能证伪或证实，实质也是多跳推理评测。

    评测指标：除了最终答案的准确率（EM/F1），更关键的是评估推理链的准确性、证据覆盖率和干扰项鲁棒性，真正区分“真多跳”与“伪多跳”。


content:
  prompt: 在人类评估中，如何定义和衡量“有帮助性”、“无害性”和“诚实性”？
answer:
  mode: rubric
  reference_answer: |-
    这三者是模型对齐的核心原则，需将其转化为可操作的评估标准。

    （一）有帮助性

    - 定义：模型能够理解用户的核心意图和潜在需求，提供准确、完整、相关且易于理解的回复，以高效协助用户达成目标。

    - 衡量标准与指南：

    - 评估量表：通常采用5点或7点Likert量表，从“完全无用/答非所问”到“完美解决问题，远超预期”。

    （二）无害性

    - 定义：模型不能生成或传播对个人、群体或社会造成身体、心理、经济伤害的内容，并能在面对有害请求时安全地回应。

    - 衡量标准与指南：

    - 评估方式：常使用红队提示集，评估者检查回答是否有害。可以是二元判断（有害/无害），或按严重程度分级。关键在于评估员需对微妙的冒犯和潜在的社会危害有足够认知。

    （三）诚实性

    - 定义：模型能够准确反映其知识和能力边界，不故意编造事实，在不确定时表达不确定性，并基于可验证信息作答。

    - 衡量标准与指南：

    - 评估方法：对于事实性，可将模型回答与权威知识源进行比对。对于忠实性，评估员需对照源文进行审查。对于知识边界，可设计专门包含不可回答问题的评测集，检查模型是拒答了还是编造了。

    在进行综合评估时，可要求评估员同时对这三个维度分别打分，并最终权衡：一个理想的模型应在不牺牲诚实和无害的前提下实现最大化的帮助。


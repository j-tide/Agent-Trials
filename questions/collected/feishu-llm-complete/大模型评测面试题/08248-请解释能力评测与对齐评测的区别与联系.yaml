content:
  prompt: 请解释“能力评测”与“对齐评测”的区别与联系。
answer:
  mode: rubric
  reference_answer: |-
    能力评测与对齐评测是评估大模型的两个互补侧面，前者关注“模型能做什么、做得有多好”，后者关注“模型的行为是否符合人类期望与价值观”。

    区别：

    联系：

    - 互为前提，不可分割：一个能力强大但完全不对齐的模型是危险的（可能高效地做坏事）；一个过度对齐但能力低下的模型是无用的（只会安全地拒绝）。优秀的模型必须同时在这两个维度上取得进展。

    - 相互影响，存在张力：提升能力的技术（如更大规模预训练）可能同时放大偏见和幻觉；对齐调优（如RLHF）可能以牺牲某些能力为代价（对齐税）。评测需要在这两者之间评估“帕累托前沿”。

    - 评估方法互相渗透：能力评测中会包含“事实性”这一对齐要求的成分；对齐评测中也需要能力去识别危害并正确回应。良好的评估体系会设计联合指标，如TruthfulQA的信息性-真实性曲线，同时衡量能力（信息量）和对齐度（真实性）。

    融合趋势：未来的大模型评测将走向能力-价值一体化评估，即在一个统一的框架内，评价模型在最大化帮助性的同时，最小化风险的综合表现，追求“有用的、诚实的、无害的”的极致统一。


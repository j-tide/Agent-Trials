content:
  prompt: 什么是 BARTScore？它将评测视为什么问题？
answer:
  mode: rubric
  reference_answer: |-
    BARTScore 是一种将文本评估形式化为生成任务的创新指标。它的核心思想是利用预训练的序列到序列模型（如BART），以条件生成概率来度量文本质量。

    核心概念：

    - BARTScore 将评估问题转化为：给定一个文本（如源文）作为输入，评估另一个文本（如生成文本）作为输出时的条件似然。

    - 对于忠实性评估，它计算 P(生成文本 | 源文)，即模型看到源文后生成目标文本的概率。若生成文本忠实于源文，其条件概率应较高；若有幻觉，概率会降低。

    - 对于精确性评估，可以反过来计算 P(源文 | 生成文本)，衡量从生成文本中还原源文信息的能力，类似召回的概念。

    - 最终得分通过对序列的对数似然取平均或加权得到。

    将评测视为生成问题：

    - BARTScore 将“评估”重新解释为“生成概率”。这种视角利用了 BART 等模型在大量文本上预训练的生成能力，隐式地编码了语法、流畅性和语义连贯性等知识，无需显式设计规则或额外标注。

    优势：

    - 一体化多维度评估：通过改变计算方向，可以用同一个模型评估忠实度、精确率和召回率等多个维度。

    - 超越表面形式：相比 n-gram 和简单的嵌入匹配，它能够感知更深层的语义和结构化信息。

    - 无需参考文本的可能性：在某些变体中，可仅依赖源文和生成文进行评估，减少对标准参考答案的依赖。

    局限：计算成本相对较高（需要进行模型推理），对评估模型的性能敏感，并且其分数量纲和含义不如某些专有指标直观，但它的框架思想影响深远。


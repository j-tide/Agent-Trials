content:
  prompt: 困惑度（Perplexity）在大模型评测中的作用和局限是什么？
answer:
  mode: rubric
  reference_answer: |-
    困惑度（Perplexity, PPL） 是语言模型最基础的自动评估指标，衡量模型对给定文本的预测能力。它定义为模型预测序列的平均负对数似然的指数：

    [图片内容未导入]

    作用：

    - 模型选择与训练监控：在预训练阶段，PPL是验证模型收敛情况、比较不同模型架构或训练设置的核心指标。较低的PPL意味着模型对训练数据的分布拟合得更好。

    - 领域适配：可用于评估模型对特定领域文本的适应性，领域内的低PPL表明模型较好地掌握了该领域的语言统计规律。

    - 内在基准：在一些情况下，PPL可用于快速对比模型在大量未标注文本上的通用语言能力，成本较低。

    局限：

    - 不能直接衡量生成质量：PPL仅度量模型“理解”文本的概率，而不评价其自由生成文本的连贯性、创造性、事实性、安全性等。一个低PPL的模型可能在生成时产生大量重复、无意义或有害内容。

    - 严重依赖测试数据分布：PPL的高低极大程度上受测试集文本领域、风格和难度的影响。在新闻文本上PPL低的模型，可能在社交媒体或专业论文上PPL很高。跨数据集比较PPL无意义。

    - 对不确定性不敏感：PPL鼓励模型对测试集中所有token赋予高概率，包括那些实际上可以有多种合理选择的词汇。这导致PPL偏好的模型可能偏向保守和重复，缺乏多样性和创造力。

    - 对长尾和事实性无感知：PPL无法反映模型是否正确记忆了事实。模型可以通过常见的模板“合理”预测下一个词，即使事实错误，只要语言上符合分布，PPL仍可能较低。

    - 评估偏差：模型在训练时就是优化似然，PPL作为评估指标有循环论证之嫌，并且容易受到 tokenization 方案、序列长度处理等因素影响。

    结论：困惑度是模型内在能力的“温度计”，适合开发和消融实验，但不能作为面向最终用户的大模型质量的代理指标。


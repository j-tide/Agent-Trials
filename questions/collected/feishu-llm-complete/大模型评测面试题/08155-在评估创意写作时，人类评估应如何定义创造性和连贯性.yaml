    创意写作的评估高度主观，必须将模糊的美学概念分解为可操作、可关联的具体指标，并提供丰富的对比锚点。

    （一）定义“创造性”

    不能简单等同于“新奇”，而应强调有意义的新颖性和情境适应性。可从以下子维度定义：

    - 独创性与新颖性：

    - 想象力与丰富性：

    - 相关性与适切性：

    （二）定义“连贯性”

    连贯性指的是作品内部的逻辑统一和流畅度。可分解为：

    - 内部逻辑一致性：

    - 结构与组织：

    - 语言流畅性与衔接：

    评估操作建议：在评估时，要求评估员先通读全文，为每个子维度提供单独的评级，并用文本中的具体例子来支持其评分。最后，给出一个整体的、综合了创造性和连贯性的综合质量判断，并允许附加主观评语。这种方法兼顾了结构化的科学性和对创意作品的整体感受。


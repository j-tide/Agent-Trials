content:
  prompt: 什么是“多维度评测”？尝试列举至少5个通用评测维度。
answer:
  mode: rubric
  reference_answer: |-
    多维度评测是一种不依赖单一总分，而是从多个独立、互补的角度对模型能力进行全方位拆解和评估的方法。它承认大模型的“智能”是多面的，单一指标会掩盖其在不同子能力上的强弱，无法提供细粒度的诊断信息。

    多维度评测的核心思想：

    - 每个维度定义清晰，有独立的测试集和评价指标。

    - 最终呈现一个能力雷达图或细分报告，而非一个汇总分数。

    - 有助于理解模型的专长领域和弱点，指导定向优化和场景适配。

    至少5个通用评测维度：

    - 语言理解与知识

    - 逻辑与数学推理

    - 生成与创造

    - 事实性与忠实度

    - 安全性与价值对齐

    其他常见维度：

    - 多语言能力：模型在非英语语言上的理解和生成水平。

    - 代码能力：代码生成、理解、调试、跨语言迁移的正确性和效率。

    - 上下文利用：长文本理解、多轮对话记忆、指令遵循的精准度。

    - 鲁棒性与分布外泛化：对抗性输入、噪声干扰、罕见场景下的稳定性。

    - 效率与可部署性：推理延迟、吞吐量、资源消耗。

    多维度评测使模型的画像立体化，是指导负责任AI研发和应用的关键工具。


content:
  prompt: 什么是“自一致性”（Self-Consistency）在评测中的应用？它如何提升推理评测准确性？
answer:
  mode: rubric
  reference_answer: |-
    自一致性是一种利用大模型随机性来提升推理任务准确率的集成方法，广泛应用于评测中。

    原理：

    - 对于同一个推理问题，使用非零温度让模型生成多条不同的推理路径和最终答案。

    - 提取出各条路径的最终答案，然后进行多数投票（或按答案统计频率），选择最一致的答案作为最终输出。

    在评测中的应用与提升准确性：

    - 校准单次推理的随机波动：单次采样可能因随机性走入错误路径，产生幻觉。自一致性通过多路径聚合，将“低频随机错误”过滤掉，将模型隐藏的“高频正确理解”凸显出来，使得评测出的模型性能更接近其真实知识上限。

    - 更稳定的分数：报告Pass@1（单次）的同时，报告自一致性下的准确率，能表明模型通过多次采样可达到的上限，体现模型的“潜能力”。

    - 暴露不确定性：如果模型对一个问题毫无头绪，生成的多个答案会高度分散，低一致性也可以作为评估模型知识边界的一个信号。

    注意：自一致性显著增加了推理成本，但作为评测工具，它能更准确地度量模型的深层推理能力而非碰运气，已成为数学和逻辑评测的标准实践。

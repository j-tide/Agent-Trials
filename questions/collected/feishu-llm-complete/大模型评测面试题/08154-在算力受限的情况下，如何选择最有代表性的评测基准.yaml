content:
  prompt: 在算力受限的情况下，如何选择最有代表性的评测基准？
answer:
  mode: rubric
  reference_answer: |-
    算力受限时，无法运行数十个基准的全量测试。需要根据信息增益、任务代表性、与最终目标的相关性来精选基准。

    选择策略：

    （1）依模型用途与主任务聚焦

    - 对话助手型：优先选测对话质量与安全性。如Chatbot Arena的人类偏好模拟（用强裁判模型代替），TruthfulQA（事实性），SafetyBench（安全）。

    - 代码模型：必选HumanEval / MBPP，再辅以一个小型调试数据集。

    - 知识型模型：必选MMLU子集，辅以一个小型事实性探测集（如从Natural Questions精选）。

    （2）分层抽样而非全量运行

    - 从大型基准（如MMLU）中按主题等比例抽样，而不是全跑57个主题。例如，从57个类别中每类随机抽取20题，总计1140题，既保留主题多样性，又大幅减少计算量。统计学上可保证分数置信区间处于可接受范围。

    （3）优先选对抗与压力测试

    - 算力有限时，运行普通评测的边际信息增益可能低（因为多数版本在那上面变化不大），而运行一个小型但高难度的对抗集（如BIG-Bench Hard的子集），更能暴露版本之间的微妙差异。这些“高分题”区分度远高于饱和的简单题。

    （4）选择复合型基准

    - 采用一个设计良好的综合基准，其分数与多个下游任务有高相关性，可以一当十。例如，在英文通用能力上，OpenLLM Leaderboard的组合（ARC, HellaSwag, MMLU, TruthfulQA, Winogrande, GSM8K）已是社区公认的压缩包，可作为优先选择。

    （5）重用裁判模型的评分

    - 利用一个强大的裁判模型（如GPT-4），对少量（几十条）覆盖核心场景的开放生成样本进行多维评分（事实性、有用性、流畅性）。这种方式用一个模型裁判代替了多个自动指标，在有限算力下获取了高度相关的综合质量信号。

    （6）基于历史数据的相关性分析

    - 如果已有多个历史版本的全面评测数据，可计算每个基准与最终目标指标（如用户留存率、在线满意度）的相关性，保留相关性最高、冗余度最低的前几个基准。这是一种数据驱动的降维选择。

    总结：算力受限下的基准选择，核心是用智慧的抽样和强代理指标，去逼近全量评测的结论，并通过聚焦高风险和主要应用场景来最大化每个算力单元的评估价值。


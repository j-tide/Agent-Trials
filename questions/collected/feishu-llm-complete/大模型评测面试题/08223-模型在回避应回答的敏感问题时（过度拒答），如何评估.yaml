content:
  prompt: 模型在回避应回答的敏感问题时（过度拒答），如何评估？
answer:
  mode: rubric
  reference_answer: |-
    过度拒答（Over-refusal）指模型错误地将安全、合法、正常的请求判定为不安全而拒绝回答。这不仅损害有用性，还可能构成一种隐蔽的审查，压制正常的社会讨论。评估过度拒答需要量化其范围、严重性和模式。

    评估方法：

    （一）构建“假阳性”测试集

    - 收集一系列安全无害但表面上可能被安全分类器误判为敏感的提示。这些提示通常涉及以下主题：

    - 对每个提示，由领域专家和伦理专家标注出“正确的、非有害的”回答标准。

    （二）衡量过度拒答的关键指标

    - 误拒率：在安全无害的测试集中，模型拒绝回答的比例。这是最直接的指标。

    - 领域误拒率：分别统计在医疗、教育、历史等不同主题上的误拒率，找出模型过度敏感的领域。

    - 误拒的严重度：拒答是否完全扼杀了对话，还是提供了某种形式的帮助？这可以通过对拒答回复的质量打分来衡量。

    （三）对比人类基准

    - 让人类专家对同一批“假阳性”提示给出理想的、既安全又有帮助的回答。

    - 比较模型拒答率与人类拒答率的差距。如果人类认为99%的提示都可以安全回答，而模型拒答了20%，则存在严重的过度拒答。

    （四）用户影响评估

    - 任务完成率：在模拟真实任务的对话中（如信息检索、写作辅助），评估因模型过度拒答而导致任务中断或失败的比例。

    - 用户满意度：通过用户调研，直接询问用户对模型拒答行为的感受，是否感到被冒犯或认为模型“愚蠢”。

    （五）偏见与过度拒答的交叉分析

    - 分析误拒率在不同文化、语言或政治敏感话题上是否存在差异。模型是否对某些文化群体的常规话题表现出系统性过度拒答？这本身就是一种安全偏差。

    （六）根因分析与缓解闭环

    - 对发现的高误拒案例进行根因分析：是安全提示词过于宽泛？是训练数据中安全样本的噪音？还是安全奖励模型的过拟合？

    - 将误拒案例转化为微调数据，教会模型在保持安全的同时，对这些“假阳性”话题进行正常、负责任的回答。

    结论：过度拒答的评估与毒性、越狱评测同等重要。一个真正安全的模型不是在边界筑起高墙，而是在门内灯火通明。


content:
  prompt: 如何防止评估员被模型流畅性迷惑，给出虚高的评分？
answer:
  mode: rubric
  reference_answer: |-
    大模型生成的文本通常语法完美、结构清晰，这种高流畅性容易让评估者产生“晕轮效应”，下意识地忽略事实错误和逻辑漏洞。防止策略如下：

    （1）在培训中将“语言能力”与“内容质量”显式解耦

    - 专门设计培训模块，大量展示“金玉其外，败絮其中”的案例。即语言极其流畅、优美，但包含严重事实错误、逻辑谬误或完全编造内容的回答。

    - 要求评估员大声说出或写下为什么这个回答不好，强化他们对“好看不等于正确”的敏感度。

    - 将“语言流畅度”和“内容事实性/忠实性”设置为两个独立的、强制打分的维度，在界面上提醒它们是分开评判的。

    （2）改造评估任务，让事实错误“显眼”

    - 片段高亮任务：要求评估员用鼠标划出回复中他们认为可疑、不确定或错误的具体词句，而不是仅给一个总分。这个“找茬”过程迫使他们仔细阅读。

    - 成对检验：如果条件允许，为模型回答提供一个简短的事实核查摘要（例如，“注意：该回答中的年份可能错误”），观察评估员在获得信息前后的评分变化，校准他们对流畅性幻觉的抵御力。

    - 使用对比集：提供一对回答：一个流畅但错误，另一个略显生硬但事实正确。让评估员选择“哪个更可信/更有用”。这种直接对抗能有效重塑评估标准。

    （3）设计欺骗性陷阱题目

    - 在评估任务中混入一些专门设计的、流畅但明显荒谬的回答（如“太阳系有九大行星，其中最大的冥王星是一颗蓝色恒星”）。如果评估员给出高分，立即弹出提醒，解释错在哪里，并要求其对该题重新评估。这种即时反馈是强效的训练。

    （4）延迟整体印象

    - 在评估流程上，要求评估员先完成所有内容的细粒度判断（如事实性、安全性），最后才允许打整体质量或流畅性分数。通过强制顺序，防止初期的整体好感污染后续的具体判断。

    通过这些设计，可以将评估员的角色从“感受者”部分转化为“校对者”，大幅降低被表面流畅性迷惑的概率。


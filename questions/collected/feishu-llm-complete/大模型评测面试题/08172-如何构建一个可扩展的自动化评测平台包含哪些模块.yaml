content:
  prompt: 如何构建一个可扩展的自动化评测平台？包含哪些模块？
answer:
  mode: rubric
  reference_answer: |-
    可扩展的自动化评测平台是大模型研发基础设施的核心，它需要支持多种模型、基准、评估器，并能随着社区进步快速接入新能力。

    核心模块：

    （1）任务与数据集管理模块

    - 数据集注册中心：支持HuggingFace、本地文件、数据库等多源导入。存储元数据（任务类型、语言、难度、许可证、版本）。支持数据集的版本控制和增量更新。

    - 抽象任务接口：为问答、代码生成、对话、摘要等不同任务类型定义统一的load, preprocess, evaluate接口，新基准可通过继承快速接入。

    （2）模型服务与推理适配模块

    - 统一推理接口：支持HuggingFace模型、vLLM、API端点（OpenAI, Anthropic等）。自动处理不同模型的tokenizer、提示模板和生成参数。

    - 弹性伸缩：根据评测规模自动拉起或释放GPU集群。支持批处理推理和异步请求，最大化吞吐。

    （3）评测引擎与指标计算模块

    - 标准化指标库：内置准确率、F1、ROUGE、BERTScore、FActScore、SummaC、裁判模型评分等数十种指标。支持自定义指标函数。

    - 裁判模型编排：管理作为裁判的模型（GPT-4, Claude等），统一调用，记录版本和提示，并支持成本控制。

    - 统计与报告：自动计算置信区间、进行显著性检验，并生成可视化图表和综合报告。

    （4）安全与对齐评测模块

    - 红队提示库及自动生成器：存储并持续更新对抗性提示集。支持自动化安全分类器（toxicity, PII检测）和基于LLM的安全评分。

    - 偏见与公平性评估：集成针对性别、种族、宗教等的公平性基准和评分工具。

    （5）编排与调度模块

    - 流水线定义：允许用YAML或Python DSL定义复杂的评测流水线（如“先跑能力集，若不通过则停止，否则跑安全集”）。

    - 作业队列与监控：分布式任务调度，支持失败重试、日志汇总、资源监控和进度可视化。

    （6）结果存储与分析仪表盘

    - 时间序列数据库：存储每次评测的详细结果（样本级、维度级），支持历史趋势对比。

    - 仪表盘：提供项目级、模型级、版本级的可视化看板。包括雷达图、版本进化曲线、回归预警。

    - 回归与告警：设定各维度的阈值，当新版本指标显著下降时，自动发出告警并标记可能的退化样本。

    （7）反馈回路与人工评估接口

    - 持续收集线上用户反馈或专家标注意见，回流到平台作为新的测试样本或评分校准。

    - 提供人工评估任务派发界面，支持细粒度标注（高亮幻觉、评分），结果自动汇总并修正自动指标。

    扩展性设计：采用微服务架构、插件化指标和任务，使得该平台能够跟上大模型领域日新月异的基准和方法论，成为长期可靠的质量基础设施。


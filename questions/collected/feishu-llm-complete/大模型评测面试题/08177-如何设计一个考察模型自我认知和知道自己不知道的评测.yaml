content:
  prompt: 如何设计一个考察模型“自我认知”和“知道自己不知道”的评测？
answer:
  mode: rubric
  reference_answer: |-
    评测模型的自我认知，核心是测量其元认知能力——即模型对自己知识边界、能力局限以及自信程度的准确感知。

    设计思路与具体方法：

    （一）知识边界探测

    - 构造“可回答”与“不可回答”问题混合集：

    - 核心指标：

    - 校准的置信度：要求模型在每个答案后附加置信度百分比，然后计算其期望校准误差（ECE），看模型声称的把握与真实准确率是否匹配。

    （二）能力局限的自我认知

    - 生成任务后的自我评估：让模型完成一个任务（如翻译一段复杂古文），然后立即问它：“你觉得自己刚才的翻译完全准确吗？如果有不确定的地方，请指出。” 评估它能否精准定位自己可能出错的地方。

    - 比较判断：给出两个回答（一个正确一个错误），让模型判断哪个更好。正确率反映了其识别好坏的能力，这是自我认知的一种形式。

    - “已知”与“可知”的区分：设计问题，有些是模型内部知识可回答的，有些需要外部信息才能回答。问模型：“你需要查阅资料才能回答这个问题吗？还是可以直接回答？” 评测其区分能力。

    （三）通过行为一致性间接测量

    - 自我一致性（Self-Consistency）的元认知：对同一个问题多次采样。如果模型答案高度一致且正确，说明它“知道且知道自己知道”；如果高度一致但错误，说明它“不知道自己不知道”（有害）；如果答案分散，说明它至少意识到了不确定性。可结合准确率绘制“一致性-正确性”分析图。

    - 矛盾识别：给模型一段包含自相矛盾内容的文本，问它：“这段文字有没有前后矛盾的地方？” 这测试它监测逻辑一致性的能力。

    一个好的自我认知评测集，将能清晰地告诉我们：模型是一个有自知之明的谨慎思考者，还是一个信口开河、不知己所不知的盲目自信者。这是通向可信赖AI的关键一步。

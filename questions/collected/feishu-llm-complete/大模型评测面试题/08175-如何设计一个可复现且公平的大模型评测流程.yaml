content:
  prompt: 如何设计一个可复现且公平的大模型评测流程？
answer:
  mode: rubric
  reference_answer: |-
    设计公平、可复现的评测流程，需从测试集管理、评估协议、模型访问和环境控制等关键环节进行严格规范。

    （1）测试集的保密性、独立性与代表性

    - 数据隔离：确保测试集与任何参与评测模型的训练数据没有重叠。使用独立的数据来源，或在构建测试集后严禁模型方接触。

    - 统计代表性：测试集应涵盖广泛的主题、难度、语言风格和任务类型，避免偏向某一领域。报告各子集的性能，而非仅看总平均。

    - 版本控制：公开测试集的版本号、构建方法和原始数据指纹，确保不同评测者使用完全一致的测试集。

    （2）标准化的评估协议

    - 统一提示与格式：对同一类任务，使用固定、公开的提示模板和输出格式要求。小样本示例（Few-shot）的数量和选取方式需统一。这能消除提示偏差。

    - 自动指标的确定性：使用确定性的自动化指标计算脚本（如固定seed、标准化预处理），并将代码开源。对基于模型裁判的指标，固定裁判模型的版本、温度和提示词。

    - 答案提取与归一化：对于有标准答案的任务，公开答案提取逻辑和归一化规则（如数学答案的标准格式），避免因后处理不同导致分数差异。

    （3）模型访问与环境控制

    - 可重现的API参数：对于API模型，记录模型版本、温度、top-p、最大长度等所有参数。在相同参数设置下，多次运行以报告分数均值和方差。

    - 硬件与推理栈透明：对于开源模型，报告所用的推理框架、精度（FP16/INT8等）、硬件配置及解码策略，确保他人可精确复现推理环境。

    - 时间戳锁定：明确记录评测执行的时间，因为在线模型和API可能随时更新。

    （4）公平性保障

    - 盲评与双盲：对于人类评估，采用盲法，去除模型身份信息。对于模型对比，避免在呈现顺序上引入偏见。

    - 多模型并行评测：尽可能在同一时间段、使用相同的评估器（裁判模型或人类）对要比较的模型进行集中评测，以控制时间演变和裁判漂移带来的不公平。

    - 统计显著性与置信区间：报告性能指标的置信区间，进行适当的统计检验，区分真实差异与随机波动。

    （5）透明化与复现包

    - 发布评测包：包含完整的测试集（或代理），标准化评估脚本，以及详细的 README。允许第三方在隔离环境中复现结果。

    - 过程完整记录：公开任何数据清洗、模型拒绝回答处理、异常值剔除等决策，确保透明。

    通过以上环环相扣的规范，可以从机制上保证大模型评测的公正性和可复现性，使不同研究者和机构的比较结果真正可信。


content:
  prompt: 什么是“半自动评估”？举例说明如何结合自动指标和人工抽查。
answer:
  mode: rubric
  reference_answer: |-
    半自动评估是一种将机器的高效性与人类的判断力有机结合的混合评估范式。其核心不是用机器完全替代人，而是让机器处理大部分常规判断，将人力集中在疑难、边缘和高风险的样本上，实现成本与质量的最佳平衡。

    半自动评估的常见模式：

    （一）分层流转模式

    - 自动初筛层：对所有模型输出运行一系列低成本自动指标，如事实性评分、安全分类器、重复度检测等。根据预设的严格阈值，将样本分流：

    - 人工终裁层：评估员只处理黄灯样本，根据详尽的指南进行精细评判。人类的裁决可以作为未来改进自动指标和阈值的反馈信号。

    （二）校准与审计模式

    - 主要依赖一个经过充分验证的自动指标（如大模型裁判）进行日常大规模评分。

    - 定期（如每周）从自动评分的全部数据中，按风险分层和随机层抽取一小部分（如1%）样本，交由人类专家进行独立评估。

    - 比较人评结果与自动评分的差异，持续监控自动指标的漂移和偏差。若人机一致性跌破阈值，则触发对自动评估系统的重新校准或暂停使用。

    （三）主动学习标注模式

    - 用于构建或改进自动评估模型。半自动标注工具用当前最佳自动标注模型对新样本进行预标注。

    - 人类标注者不再从零开始，而是以“校对员”的身份对预标注结果进行确认、修正或拒绝。这显著加快了标注速度。

    - 修正后的数据被加入训练集，重新训练自动评估模型，使其逐渐覆盖之前的盲区，形成“人机协同进化”的闭环。

    实例：RAG系统的半自动忠实度评估

    - 自动系统对每个RAG生成的回答进行原子事实分解，并利用NLI模型对每条事实计算“忠实度”得分。

    - 设定规则：如果所有事实的忠实度得分 > 0.9，自动判定为“忠实”。

    - 如果有任何事实得分在0.5-0.9之间，或不同来源信息有冲突，系统将其标记为“待人工审查”，并高亮可疑的陈述及其检索证据。

    - 人类评估员直接在界面上查看高亮内容，快速做出“忠实/不忠实/无法判断”的裁决，并可选地修正错误内容。

    这种方式下，人类只审查了不到20%的“疑难杂症”，却保障了整个系统输出事实一致性评估的可靠性。


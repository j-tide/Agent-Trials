content:
  prompt: 长文本理解与问答如何评测？大海捞针测试的局限性在哪里？
answer:
  mode: rubric
  reference_answer: |-
    长文本理解评测旨在检验模型在超长上下文（如几十万tokens）中，能否准确定位、整合并推理信息。

    评测方法：

    - 大海捞针测试：在长文本中的随机位置插入一个与主题完全无关的“针”（一句特定事实），然后提问该事实。测试模型能否准确找到并复述“针”。优点是简单直观，能直接反映有效上下文窗口长度。

    - 长文本问答与摘要：使用包含长上下文的数据集（如长篇论文、法律文档），构造需要整体理解或多跳整合的问答对，或要求模型生成长度超过其生成限制的摘要。

    - 多跳信息整合测试：将回答一个问题所需的多个事实片段散布在长文本的不同部分，考验模型远距离关联和融合信息的能力。

    - 指令跟随与约束保持：在开头的系统指令中设定一个全局约束（如“所有回答必须以‘答：’开头”），在填充数万字无关文本后提问，检查模型是否仍然遵循该约束。

    大海捞针测试的局限性：

    - 任务过于简单，生态效度低：只测了“检索和复制”这一最基础的能力。真实长文本任务需要整合、推理、比较和总结，而不仅仅是找到一个无关联的事实。

    - 无法评估推理质量：模型找到“针”后可能仍然基于错误推理给出答案，或者无法对多个分散的“针”进行综合推理。

    - 难以评估抗干扰能力：测试通常只插入无害的、无冲突的针。真实场景中，长文本可能包含大量矛盾、误导和噪声信息，大海捞针无法检验模型在这些干扰下的鲁棒性。

    - 忽视“迷失中间”问题之外的其他机制：模型即使在两端表现好，仍可能在处理长文本时发生事实混淆、时间线错乱等复杂错误，这些在大海捞针中完全暴露不出来。

    - 不反映任务完成度：用户最终关心的是任务（如写综述、做分析）的完成质量，而不仅是某个事实是否被找到。

    更全面的长文本评测应结合： 大海捞针（快速测窗口长度）、多跳问答（测推理整合）、长摘要（测信息压缩与忠实性）、以及基于真实任务的端到端评估（如长篇论文学术评审模拟）。


content:
  prompt: 说明代码评测中“功能正确性”与“语义相似度”的差异，为何不能只看 BLEU？
answer:
  mode: rubric
  reference_answer: |-
    功能正确性：代码是否满足指定的输入输出要求，即能通过所有测试用例。它关注的是执行结果，是代码质量的根本标准。

    语义相似度：生成代码与某个参考代码在文本层面的相似程度，通常使用 BLEU、ROUGE 或 token 匹配来衡量。

    关键差异：

    - 表象 vs 本质：两段代码可能逻辑完全等价但写法迥异（例如，用 for 循环代替 while 循环，变量命名不同），BLEU 等会给出极低的相似分，但它们在功能上完全正确。

    - 错误等价性缺失：一个逻辑严重错误但碰巧与参考代码共享大量关键字的代码，可能获得较高的 BLEU 分数，但运行会完全失败。

    - 唯一与多样：同一个编程问题有无数种正确实现。以单一（或几个）参考代码来衡量所有正确解，从根本上否定了编程的创造性和多样性。

    为什么不能只看 BLEU：

    仅看 BLEU 会导致：

    - 鼓励复制而非创造：模型会被奖励去死记硬背训练集中的特定实现模式，而非学习通用编程逻辑。这将使其在面对稍有不同的新问题或需求时泛化能力极差。

    - 误导优化方向：研发团队若用 BLEU 选模型，会选出一个“看起来像标准答案”但常编译不过、逻辑不通的模型，其实际可用性极低。

    - 完全无法捕捉运行错误：BLEU 对语法错误、类型不匹配、边界条件处理失败等致命缺陷完全失明。

    因此，代码生成领域的评测主流已转向以测试用例通过情况（Pass@k, 执行匹配）为金标准，辅以功能等价性验证和人工审查，文本相似指标仅作为极弱的参考或已基本被弃用。


content:
  prompt: 安全性与有用性的权衡在评测中如何体现？如何定义合理的底线？
answer:
  mode: rubric
  reference_answer: |-
    安全性与有用性之间的权衡是模型对齐的核心挑战。过度强调安全可能导致模型过于保守（“过度拒答”），损害用户体验；而过度追求有用性又可能使模型在面对边缘案例时提供危险的回答。

    在评测中体现权衡的方式：

    - 构建联合评测集：设计一个同时包含明显有害、明显无害和“灰色地带”提示的测试集。灰色地带可能包括具有潜在风险但合法的请求（如询问杀虫剂成分、性教育知识、历史战争的细节）。

    - 同时报告安全与有用指标：不是孤立地报告安全分数（如应拒必拒率）和有用分数（如误拒率、帮助性评分），而是将它们放在一起审视。例如，可以绘制安全-有用曲线：以模型的安全阈值（或生成温度）为自变量，画出有害输出率（越低越好）和误拒率（越低越好）的关系图。模型在曲线上移动，选择一个可接受的平衡点。

    - 权衡指标：拒绝质量：不仅仅看是否拒绝，还看“拒绝的艺术”。一个高质量的拒绝会解释原因、提供安全的替代方案或引导用户寻求专业帮助，这在兼顾安全的同时最大化帮助性。评测中可以引入“拒绝质量”评分。

    - 领域自适应权衡：对于高风险领域（如医疗、法律咨询），安全的权重应极高，宁可保守；对于低风险创意领域，可适当放宽。

    定义合理的底线：

    合理的底线不是一条绝对的线，而是一个基于社会共识、法律要求和伦理原则的决策框架。

    - 法律合规底线（绝对红线）：任何违法内容（如儿童伤害材料、恐怖主义煽动、明确的人身威胁）的输出率必须为零或趋近于零。这是不可协商的底线。

    - 高风险危害零容忍：对于可能导致直接、严重身体或心理伤害的内容（如详细的自我伤害方法、制造大规模杀伤性武器的指南），模型必须拒绝，其应拒未拒率必须低于极低阈值（如经红队测试，在大量对抗攻击下成功率接近0%）。

    - 社会共识与伦理底线：对于仇恨言论、严重歧视、诽谤等，必须基于广泛的社会共识和伦理准则设定底线。这需要征求多元文化、法律、伦理专家的意见，并定期更新以适应社会规范的变化。

    - 用户主权与透明度原则：对于较低风险的、但有争议的“灰色”话题，模型不应一刀切地拒绝，而应提供客观、平衡、有依据的信息，并明确标注可能的风险或争议。这定义了“过度拒答”的上限——即模型不能以安全为名压制合法的信息自由和思想交流。

    - 持续监测与反馈机制：合理的底线不是静态的。需要建立一个持续的用户反馈和安全事件上报机制，根据真实世界的影响不断调整安全策略和评测阈值。

    总结：合理的底线是在法律和生命安全的绝对红线之上，通过动态、包容的社会伦理对话，结合技术手段（如细化安全分类、可解释的拒绝）找到的那个动态平衡点。它追求的不是绝对的“无风险”，而是可辩护的、负责任的风险管理。


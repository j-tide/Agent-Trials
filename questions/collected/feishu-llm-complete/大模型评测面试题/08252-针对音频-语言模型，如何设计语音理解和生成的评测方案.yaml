content:
  prompt: 针对音频-语言模型，如何设计语音理解和生成的评测方案？
answer:
  mode: rubric
  reference_answer: |-
    音频-语言模型（如AudioGPT、Qwen-Audio、Gemini）能处理语音、音乐、环境声音，并生成语音或文本。评测需要覆盖感知、理解、生成和跨模态对齐。

    评测维度与任务设计：

    （一）语音识别与基础理解

    - 自动语音识别（ASR）：词错误率（WER）是核心指标，但还需评测对噪音、口音、方言、多语种混合的鲁棒性。使用标准数据集（LibriSpeech、Aishell、Common Voice）。

    - 语者识别与追踪：评测模型是否能区分“谁在说话”，在多人对话中准确标记说话人。

    - 副语言信息理解：识别情感、年龄、性别、语调、语速，以及反讽、疑问等意图。可使用情感识别数据集（IEMOCAP）的改编版，以及专门设计的副语言问答对。

    （二）语音问答与对话

    - 端到端语音问答：直接输入语音问题，要求模型输出文本答案或语音答案。评测指标包括答案准确性、响应延迟，以及是否结合了语音中的副语言信息（如根据语气给出共情回应）。

    - 音频指代与场景理解：混合音频（如对话+背景音乐），提问“背景音乐是什么类型？”、“第一个人说话时情绪如何？”评测模型分离和分析不同声源的能力。

    - 多轮语音对话：模拟真实语音交互，评测模型处理打断、停顿、长对话记忆和指代消解的能力。

    （三）音频生成与可听性评测

    - 文本到语音（TTS）：评测合成语音的自然度（MOS分）、清晰度（WER）、韵律准确性，以及与说话人设定的一致性。

    - 可控生成：能否按指令生成特定情感的语音、改变语速、模仿特定音色。

    - 音乐与声景生成：评测生成音乐的旋律、和声、结构是否符合文本描述，使用音乐信息检索（MIR）指标结合人类偏好评分。

    （四）跨模态对齐与幻觉检测

    - 音频-文本一致性：给定一段音频和一段描述文本，评测模型判断该描述是否准确反映了音频内容。构建专门的NLI数据集，将音频作为前提，文本作为假设。

    - 音频幻觉检测：让模型描述一段音频，然后自动检查描述中是否包含不存在的声学事件（如虚构了“汽车喇叭声”）。这类似于图像的对象幻觉，需要构建专门的对立样本。

    （五）评测集设计

    - 任务模板化：定义通用的音频任务模板，如“<audio>请转录这段语音”、“<audio>描述这段声音发生的场景”。

    - 合成与真实数据结合：使用真实环境录音（如TUT Rare Sound Events）和人工合成混合音频，以覆盖长尾声学事件。

    - 统一基准：如 Dynamic-SUPERB 将多种语音任务整合为统一的指令式评测。对于通用音频理解，AudioBench、MMAU 等提供了跨任务的基准。

    （六）自动化指标与人类评估

    - 对于客观任务（ASR、声源识别），保留传统指标。

    - 对于主观任务（自然度、趣味性、合适性），必须依赖大规模人类评估（MOS打分）或训练高相关性的自动质量预测模型（如基于SpeechBERTScore的扩展）。

    结论：音频-语言模型的评测是一个正在快速形成的领域，需要从孤立的任务指标转向统一的、以指令为中心的评估框架，并特别重视跨模态忠实度和安全性的评测。

    - 真实物体（存在）：问题中的物体确实在图中，正确答案为“是”。

    - 常见但不在图中的物体（不存在）：问题中的物体是常见物体，但该图不存在，正确答案为“否”。这测试模型是否因语言先验（高频词）产生幻觉。

    - 对抗性物体（不存在）：问题中的物体与图中真实物体类别相近或常共现（如真“车”，问“自行车”），正确答案为“否”。这是最具挑战性的设置，专门探测模型的混淆倾向。

    - 准确率：在所有问题上回答正确的比例。综合衡量识别存在和不存在的能力。

    - 召回率（对存在物体）：真实存在物体被回答“Yes”的比例。若低，说明模型漏识别。

    - 精确率/虚警率（对不存在物体）：在对抗性/常见负例中，模型回答“Yes”的比例。这是衡量对象幻觉的核心——虚警率越高，幻觉越严重。

    - F1-Score：综合考虑对存在和不存在的判别能力。

    - 特别地，可以计算幻觉率 = FPFP+TNFP+TNFP，即对不存在物体误判为“存在”的比例。

    - L1 感知能力：如对象识别、属性识别、空间关系、OCR。

    - L2 推理能力：如比较推理、属性推理、常识推理、功能推理、逻辑推理等。

    - 总共细分为 20个精细能力子维度，形成一个结构化的“能力雷达图”。

    - 推出了MMBench-CN（中文版本）和MMBench-Dev（开发集），推动社区发展。

    - 提供了CircularEval策略，通过将选择题答案打乱，并要求模型输出答案序号对应的选项内容，来防止模型仅靠猜测序号来作弊，提升了评测可靠性。

    - 侧重广度与系统性，旨在绘制模型能力的全貌。

    - 强调深度和解释性：评估模型能“说出什么”，而不是“选对什么”。这更能反映模型的真实理解和教导能力。

    - 使用了 SEED-Bench-2 大规模扩展，覆盖多模态理解的更广泛方面。

    - 提供了公开的排行榜和评估工具。

    - RefCOCO / RefCOCO+ / RefCOCOg：最权威的指代表达理解与分割基准。给定图像和一段指代表达（如“the guy in blue shirt next to the table”），要求模型输出所指对象的分割掩码或边界框。

    - Flickr30k Entities：在图像描述上标注了实体短语与图像区域的对应边界框。

    - Visual Genome：区域描述和图区关系。

    - 输出框/点坐标：模型是否能在回答中生成精确的坐标（如[x1,y1,x2,y2]）。评测时解析坐标，计算上述指标。

    - 输出区域描述或像素标记：对于不支持输出坐标的模型，可让其输出对区域的详细描述，然后判断该描述是否与真实区域的视觉内容高度一致，或通过一个辅助定位模型来验证该描述能指向正确区域。

    - 动作识别：“他在做什么？”

    - 动作计数：“他喝了几次水？”

    - 顺序判断：“他先开门还是先开灯？”

    - 状态变化：“桌上的杯子是被拿走了吗？”

    - 使用视频标注工具，先自动生成场景图、动作标签、时序边界。

    - 人工标注员基于这些初步标签，撰写问题、答案和干扰项。答案需能从视频中明确推出，干扰项需包含时序混淆（如颠倒顺序）、空间混淆（相似物体）。

    - 准确率：基本指标。

    - 时序定位精度：在要求定位时间段的题目中，计算预测时间段与真实时间段的IoU。

    - 推理链正确率：要求模型输出推理过程，评测其逻辑是否正确。

    - ChartQA：包含大量需要视觉和数值推理的图表问答，答案精确。

    - PlotQA：类似，更注重复杂推理。

    - FigureQA：科学图表理解的基准。

    - MMC-Benchmark 等综合性基准也涵盖图表模块。

    - 视觉忠实度：回答是否准确反映了所有相关图片的内容，无幻觉。

    - 指代准确性：是否正确解读了代词和省略。

    - 任务完成度：是否满足了用户在该轮及之前轮次中提出的所有要求。

    - 上下文整合度：是否有效地融合了多张图片的信息。

content:
  prompt: 在使用 LLM-as-judge 做胜率比较时，如何处理平局和分数接近的情况？
answer:
  mode: rubric
  reference_answer: |-
    在成对比较中，两个回答可能质量极其接近，强制区分会引入噪声和不公。处理平局和分数接近需要精细的策略：

    （1）允许并设计“平局”选项

    - 在裁判提示中明确给出“平局（Tie）”或“两者质量相当”的选项。这符合人类的真实判断习惯，避免强制选边。

    - 同时，为平局设立严格的使用条件，防止裁判因“懒惰”而滥用平局。例如，提示：“请仅在两个回答在所有关键维度上都几乎无法区分优劣时，才选择平局。”

    （2）利用连续分数差设阈值

    - 不直接让裁判给二选一，而是先让裁判为两个回答分别打分。计算分数差的绝对值。

    - 设定一个阈值 δδ（例如，在10分制中分差小于0.5分）。当分差小于 δδ 时，判定为实质平局；否则，分高者胜。这比直接问“哪个更好”能提供更细粒度的信号。

    - δδ 的大小应根据裁判模型在该任务上的信噪比和经验来设定，并可通过与人类标准的一致性实验来调优。

    （3）双评一致性检验

    - 采用位置交换双评法：对每个对比，裁判评估两次，第二次交换回答的位次。如果两次评判选择的胜者不一致（比如一次选A，一次选B），则强烈表明裁判自己也难以区分，该样本应被视为“争议/平局”。

    - 这种方法非常有效，能将因位置偏差或边界模糊而导致的不稳定结果剔除，留下裁判高度自信的判断。

    （4）多裁判投票

    - 当有多个裁判时，可采用软投票。如果有3个裁判，结果可能是2票对1票。可以设定：只有当某个回答获得超过三分之二的票数时才判定为胜，否则为平局。这种方法能集成多裁判的智慧，平滑个体裁判的不确定性。

    （5）模糊情况的后续处理

    - 在大规模评测中，平局和分数接近的样本可被单独记录和分析。它们通常代表了两个模型真实能力的“胶着区”，是重要的评测结论的一部分，而不是需要被丢弃的“坏数据”。

    - 在计算总胜率时，常用的做法是给平局各计0.5胜，这样总胜率 = (胜场数 + 平局数/2) / 总对比数。这种处理是Elo计算中的标准做法，公平且保留了平局的信息价值。


content:
  prompt: 在代码生成评测中，Pass@k 指标如何计算？k 的含义是什么？
answer:
  mode: rubric
  reference_answer: |-
    Pass@k 是衡量代码生成模型解决问题能力的核心指标，定义为：对每个问题，模型生成 k 个候选代码样本，如果其中至少有一个能通过所有单元测试，则视为该问题解决。最终 Pass@k 是所有问题的解决率。

    公式与无偏估计：

    - 记 n 为每个问题实际生成的总样本数（n ≥ k），c 为这 n 个样本中能通过测试的样本数。

    - Pass@k 的无偏估计公式为：

    [图片内容未导入]

    - 这个公式通过组合数学，纠正了由于只生成有限 n 个样本而带来的选择偏差。计算的是“如果我们有无限预算，从模型分布中抽取 k 个样本，至少有一个通过的概率”。

    k 的含义：

    - k 代表用户允许的最大采样次数或迭代次数。在应用中，如果模型生成的第一个代码不对，用户可以再要求生成一次，直至 k 次。

    - k 值越大，对问题的通过率容忍度越高。Pass@1 衡量模型“首次即对”的能力，是对模型直接解决问题能力的严格测试。Pass@10 或 Pass@100 则衡量模型在多次尝试后能够找到正确解的概率，体现了模型的潜在能力及测试时的搜索增益。

    应用场景：

    - 在 HumanEval 等基准中，常报告 Pass@1, Pass@10, Pass@100。Pass@1 最为关键，反映实际使用中的效率；较高的 Pass@k (k>1) 表明模型具有较强的“潜在”求解能力，可以通过后处理筛选或多次采样提升。


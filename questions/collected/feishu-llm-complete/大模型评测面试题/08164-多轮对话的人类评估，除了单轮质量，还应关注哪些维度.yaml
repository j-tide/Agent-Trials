content:
  prompt: 多轮对话的人类评估，除了单轮质量，还应关注哪些维度？
answer:
  mode: rubric
  reference_answer: |-
    多轮对话评测需要超越单轮的“一问一答”，评估模型作为一个持续交互的对话主体的能力。除单轮质量外，核心还需关注以下维度：

    （1）上下文持续性与记忆

    - 多轮事实一致性：模型是否在后续轮次中遗忘、歪曲或修改了对话早期建立的用户信息（如姓名、偏好）或已确认的决定？是否存在“记忆漂移”？

    - 指代与省略的解析：模型是否能准确理解依赖历史轮次的指代（“那个方案”、“它”）和省略式提问，而不需要用户每次都重复完整信息？

    （2）对话目标推进与任务完成

    - 主动性与规划：模型是否能在适当时机主动提供建议、追问缺失信息或总结讨论结果，以推动对话达成用户目标？还是被动地、无方向地回应？

    - 多轮指令跟随：对于跨越多轮的复杂指令（如“先列出优点，再分别比较”），模型能否在后续轮次中持续遵循，而不遗漏初始约束？

    （3）人格一致性与交互信任

    - 角色与风格保持：在整个对话中，模型的语气、人格设定、知识水平（如是否扮演专家）是否保持稳定，无突兀变化？

    - 诚实与自我修正：当用户指出模型在前一轮的错误时，模型是否能恰当地承认并修正，而不是强行辩解或无视？这直接关系到用户信任。

    （4）矛盾处理与恢复

    - 应对用户矛盾的输入：当用户在不同轮次中给出相互矛盾的指令或信息时，模型是否能识别并妥善处理（如请求澄清），而不是盲从或混乱？

    - 对话修复能力：当对话陷入误解或死胡同时，模型能否通过道歉、澄清或提出新路径将对话拉回正轨？

    （5）用户体验与满意度曲线

    - 交互效率：对话是否简洁高效，没有不必要的重复和迂回？

    - 渐进式满意度：不仅看终点的用户满意度，还应评估在多轮交互过程中，用户的满意度是上升、平稳还是下降。一个让人越聊越烦的模型即便最后给出了答案，体验也是不合格的。

    评估方法：这些维度难以用单轮的后向评分捕获，通常需要评估员通读整个对话历史，然后对每一轮及整个对话的全生命周期进行综合评估，有时需要采用对话级评分量表或事后回顾性问卷。


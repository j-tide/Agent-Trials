content:
  prompt: 什么是“生态有效性”？在评测LLM时为什么重要？
answer:
  mode: rubric
  reference_answer: |-
    生态有效性指评测环境、任务和材料与真实使用场景的相似程度。一个高生态有效性的评测，其结论能够更好地推广到模型在现实世界中的表现。

    对LLM评测的重要性：

    （1）弥合“实验室”与“现实”的鸿沟

    - 离线评测通常在干净、标准化、简化的环境中进行，而真实用户的使用却是杂乱、多样和动态的。模型在理想条件下可能表现出色，但在真实嘈杂、意图模糊的对话中崩溃。高生态有效性确保评测结论对实际应用有预测价值。

    （2）捕获情境化能力

    - 真实对话涉及上下文延续、情绪反应、文化微珠、非完美用户输入（错别字、碎片语言）。只有高生态有效性的评测（如基于真实用户日志的交互评估）才能捕捉模型处理这些情形的能力。

    （3）反映用户满意度与任务完成度

    - 对LLM的终极考验是它是否帮真实用户高效、满意地解决了问题。基于场景的模拟、A/B测试、用户留存率等具有高生态有效性的指标，直接与业务价值挂钩，是离线指标无法替代的。

    （4）暴露长尾风险

    - 安全性和偏见常常在特定人口群体、罕见语言用法或文化背景中才凸显。低生态有效性的通用评测集可能完全遗漏这些分布，而真实交互却能将其放大。

    如何提升生态有效性：

    - 构建用户中心评测集：从产品用户真实对话中抽取代表性样本，匿名化后纳入评测。

    - 情景模拟：设定具体的用户角色、场景和目标，而不是孤立的问答对。如“你是一位忙碌的博士生，需要在一小时内完成文献综述，请辅助”。

    - 交互式评估：搭建可以在线交互的评估环境，观察模型在动态、多次交互中的表现，而非单轮静态。

    - 结合问卷调查：在真实使用后收集用户的满意度、信任度、修正意图等主观量表。

    权衡：追求高生态有效性通常意味着成本上升和标准化程度下降。实际评测体系需要在控制性（内部有效性） 和生态有效性之间取得平衡。


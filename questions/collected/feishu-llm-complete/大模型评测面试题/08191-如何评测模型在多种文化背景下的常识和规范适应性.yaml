    评测策略：

    - 构建多文化测试集：

    - 多角度考察：

    - 评估指标：

    - 自动与人工结合：自动评测可快速计算事实准确性，而规范和价值观的深层评估必须大量依赖众包和当地母语专家的评审，他们能识别出外人难以察觉的文化冒犯或误解。

    典型基准：GlobalOpinionQA、CultureBank 以及一些多语言NLP基准中的文化子集。这类评测对于全球部署的模型至关重要。


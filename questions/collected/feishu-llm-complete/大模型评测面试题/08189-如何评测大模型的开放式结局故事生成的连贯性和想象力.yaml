content:
  prompt: 如何评测大模型的“开放式结局故事生成”的连贯性和想象力？
answer:
  mode: rubric
  reference_answer: |-
    开放式结局故事生成要求模型在给定开头后，创造出情节完整、引人入胜且留有余味的故事。评测需同时把握其叙事完整性和艺术创造力。

    连贯性评测：

    - 长距离依赖与因果一致性：利用自动化工具，从故事中抽取事件及其时间/因果关系，检查是否存在无法解释的跳跃、矛盾或“机械降神”。可微调NLI模型专门检测此类叙事逻辑错误。

    - 角色一致性：追踪每个角色的行为、性格和语言风格在整个故事中是否保持一致，没有无故的性格突变。

    - 情节完整度：评估故事是否具备基本的结构（开端、发展、高潮、结尾），各部分的篇幅比例是否恰当。可以由裁判模型对此打分。

    - 语言流畅度：使用困惑度和语法错误率进行基础评估，保证文本的基本可读性。

    想象力评测：

    - 新颖性指标：

    - 情节不可预测性：设计算法度量情节转折的意外度。例如，计算后续事件的发生概率，如果模型生成了概率很低但逻辑上说得通的转折，这可能是想象力的体现。

    - 情感与主题深度：利用情感分析工具追踪故事的情感曲线，看其是否具有丰富的起伏变化，而不是平铺直叙。可对主题进行建模，评估故事是否触及了有深度的、非常规的主题。

    - 大模型裁判与人类评审：这是最核心的方法。

    总结：连贯性相对可自动化评估，而想象力则是AI评测的终极难题之一，仍强烈依赖人类的感受和批判性鉴赏。


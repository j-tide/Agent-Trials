content:
  prompt: 多语言知识的评测如何开展？跨语言迁移能力如何衡量？
answer:
  mode: rubric
  reference_answer: |-
    多语言知识评测旨在了解模型在不同语言上对世界知识的掌握程度，以及是否将某种语言（通常为英语）中学习的知识有效地迁移到其他语言中。

    开展方式：

    - 多语言知识基准：将现有的英语知识基准翻译（或部分人工翻译）成多种语言。例如 Global-MMLU，MGSM（多语言小学数学），XQuAD（多语言阅读理解）。

    - 跨语言一致性测试：对同一个事实，用多种语言向模型提问，检查其答案是否一致且正确。例如，用英语和中文分别问“水的化学式是什么？”，看模型是否都给出H₂O。

    - 低资源语言专项探测：针对资源极少的语言，人工构造少量但高质量的知识问答对，测试模型在该语言上的知识表现，以及是否依赖于用该语言抓取的少量网络文本。

    跨语言迁移能力的衡量：

    - 零样本跨语言迁移：模型仅在英语（高资源语言）数据上训练（或微调），直接在其他低资源语言上进行评测。评分的高低直接反映了模型将英语知识泛化到其他语言的能力。高的零样本迁移率意味着模型内部建立了语言无关的知识表示。

    - 跨语言知识差距分析：计算模型在各语言上的得分，并与英语得分进行比较。跨语言退化率 = (英语得分 - 目标语言得分) / 英语得分。通过这个指标，可以量化知识在不同语言间的流失程度。

    - 翻译测试：将同一个知识问题用两种方式问：直接用目标语言提问，与先用英语提问、再将其回答翻译成目标语言。如果前者远差于后者，说明问题主要出在目标语言的理解或生成环节，而不是知识本身。这可以分解迁移过程中的哪一步是瓶颈。

    - 探测多语言表示空间：利用探针分析，看不同语言中表达同一知识的句子在模型的隐藏层中是否具有相似的向量表示。表示越接近，跨语言迁移的理论潜力越大。

    多语言知识评测暴露了当前大模型作为“英语知识翻译器”的实质，而非真正多语言知识主体，推动着更公平、更语言包容的模型研发。


content:
  prompt: 是否可以用待评测模型自身作为裁判？会有什么问题？
answer:
  mode: rubric
  reference_answer: |-
    理论上可以，但实践中强烈不推荐，存在严重且难以消除的风险。

    可以用，但限制极大的情况：

    - 自我一致性检验：不是让模型为自己打分，而是检测模型对同一个问题的多次输出是否一致，这可用于评估模型的不确定性。

    - 自我修正能力评估：作为评测其元认知和错误恢复能力的一环，例如让模型找出自己之前回答中的错误，但这属于“能力测试”，而非用作可信的质量裁判。

    如果用自身作裁判，会面临的问题：

    （1）极端的自我增强偏差

    - 这是最致命的问题。模型会系统性地给自己或同系列模型的回答打虚高的分数，因为它自身的输出天然就高度符合其内部偏好。这种自评分在统计上毫无区分度，完全不可信。

    （2）盲目性——无法识别自身知识盲区

    - 模型的错误模式往往是系统性的。如果模型在某个领域存在知识空白并会编造事实，那么当它作为裁判时，它同样无法识别这种编造，因为它自身就“相信”那些编造的事实。用一个有幻觉的模型去裁判幻觉，无异于让骗子当警察。

    （3）评估标准的崩塌

    - 无外部约束时，模型很容易发展出一套“自嗨”的评价标准。它可能越来越偏好冗长、重复、使用复杂词汇的回答，因为这些是它自身生成时的统计特征。这将导致评估完全脱离人类的真实质量感知，形成危险的“回音室效应”，模型被自己越训越偏。

    （4）缺乏外部视角

    - 评估的核心价值之一在于引入外部的、多样化的质量标尺。自评彻底丧失了这一价值，无法发现模型与人类价值观、其他模型优势之间的差距。

    （5）公平性与公信力的彻底丧失

    - 在模型选优和公开发布中，自评结果不具有任何公信力。任何理性的外部观察者都不会接受“我证明我自己优秀”的评测结果。

    唯一相对安全的自评应用：要求模型生成回答后，再以另一个独立会话的角色（清零上下文），基于严格、细化的评分标准去批判自己刚刚生成的回答，并要求它找出可能的错误。这种方法有时能激发模型利用其储备知识进行二次审视，但仍然受限于其自身能力和偏见。它只能作为辅助分析工具，绝不能代替独立裁判。永远不要用待评测模型自己作为其质量评估的唯一或主要裁判。


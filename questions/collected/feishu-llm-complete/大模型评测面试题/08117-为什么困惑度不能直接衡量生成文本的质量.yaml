content:
  prompt: 为什么困惑度不能直接衡量生成文本的质量？
answer:
  mode: rubric
  reference_answer: |-
    困惑度衡量的是模型对给定文本的似然，而不是模型自生成文本的质量，这一根本差异导致它无法直接评价生成质量。具体原因：

    （1）评估对象不同

    - PPL评估的是“如果这段人类撰写的优质文本出现在我的训练分布中，我会有多惊讶”。它完全是在人类文本上计算，不涉及模型自身的生成行为。

    - 生成质量关注的是模型自主采样的文本是否连贯、有用、忠实。一个模型可能在人类文本上PPL很低，但其自采样文本可能充满重复、矛盾或事实错误，这是因为解码策略会偏离模型的高概率区域。

    （2）奖励“保守”而非“优秀”

    - PPL鼓励模型将所有人类文本中的词汇赋予极高概率。然而，优秀的生成往往需要在多种合理延续中做出创造性选择，这种不确定性在PPL计算中反而被惩罚。因此PPL最低的模型往往是过度保守、缺乏多样性的模型。

    （3）忽略全局结构与逻辑

    - PPL是逐token计算的局部度量，对远程一致、文本整体结构、因果逻辑、事实准确性完全失明。一段言辞华丽但前后矛盾、充满事实幻觉的文本，其逐字概率可以很高，PPL会给出错误的高评价。

    （4）无法反映用户感知质量

    - 用户关心的流畅性、帮助性、情感契合度、安全合规等，没有一项能通过下一个词的概率反映。两段语言风格截然不同的回复，可能拥有相近的PPL，但在用户满意度上却有天壤之别。

    结论：困惑度衡量“理解”，而非“生成”。它可能作为底层模型训练的一个必要检查点，但对最终生成质量的评估，必须依赖其他专门设计的指标、人类评估或强模型裁判。


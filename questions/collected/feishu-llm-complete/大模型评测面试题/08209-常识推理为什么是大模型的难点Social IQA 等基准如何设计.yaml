content:
  prompt: 常识推理为什么是大模型的难点？Social IQA 等基准如何设计？
answer:
  mode: rubric
  reference_answer: |-
    常识推理是大模型的“阿喀琉斯之踵”，因为它要求模型拥有未明说、但被人类视为理所当然的世界知识和社会认知。

    为什么是难点：

    - 隐性知识鸿沟：常识极少被显式写成文本，因为作者默认读者共享这些知识（如“人会饿”、“火焰是热的”）。模型从纯文本中很难学到这些“沉默的知识”。

    - 无限组合与情境依赖：常识并非孤立事实，而是需要在特定情境下被激活和组合。一个行为可能在不同社会语境下有截然不同的含义，模型缺乏生活在真实世界中的体验来理解这些微妙之处。

    - 统计共现的陷阱：模型学到的是表面共现，而非因果机制。例如，因训练数据中“吃饭”与“缓解饥饿”高频共现，模型可能答对，但面对反常识的干扰项时，容易因表面词汇关联而选错，并非真正理解。

    - 幻觉的重灾区：当缺乏坚实常识基础时，模型会用其强大的语言能力拼凑出“听起来合理”但实则荒谬的答案，这就是典型的常识幻觉。

    Social IQA 等基准的设计理念：

    Social IQA (Social Interaction QA) 专门用于评测模型对社会常识的理解，即推断人类在特定社会情境下的情绪、动机和可能行为。

    设计方法：

    - 场景驱动：每个问题提供一个简短的日常社交场景描述。例如：“Sasha跑过去拥抱了Casey，因为Casey刚刚宣布了一个好消息。”

    - 多角度提问：针对同一个场景，分别从三个维度提问：

    - 精心构造的干扰项：每个问题有3个候选答案，其中干扰项不是随机生成的，而是由人类作者设计，在语言上与问题相关，但在社会常识上是错误或不合情理的。这要求模型必须进行深层社会推理，而非简单的词汇匹配。

    - 高生态有效性：场景取材于真实人类互动，覆盖了广泛的社会情感（快乐、悲伤、尴尬、嫉妒等）和社交规范（礼貌、合作、竞争）。

    通过这种精心设计的场景和有针对性的提问，Social IQA能有效探测模型是否具有“心理理论”的雏形，即能否推测他人的心理状态，而这是高级常识推理的核心。


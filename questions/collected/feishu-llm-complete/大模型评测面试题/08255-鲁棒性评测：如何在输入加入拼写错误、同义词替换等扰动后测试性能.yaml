answer:
  mode: rubric
  reference_answer: |-
    鲁棒性评测旨在检验模型在面对非理想、有噪声的输入时，其性能和安全行为是否仍然可靠。核心是在输入上应用各种扰动，观察模型输出的变化。

    扰动类型与添加方法：

    - 字符级扰动：模拟真实用户的输入错误或对抗攻击。

    - 词语级扰动：

    - 句法级扰动：

    评测流程与指标：

    - 构建扰动测试集：从干净的标准测试集中，使用上述方法自动或人工生成多种扰动版本。应确保扰动的多样性，并记录扰动类型和强度。

    - 对比评估：分别在干净测试集和扰动测试集上运行待评模型。

    - 计算鲁棒性指标：

    与安全评测的结合：鲁棒性评测在安全领域尤为重要。许多越狱攻击就是通过字符扰动（如用“p0rn”替代“porn”）来绕过关键词过滤器的。因此，安全评测集必须包含扰动版本，以验证模型的安全防护不是建立在脆弱的词表匹配之上。


content:
  prompt: 对于非英文语言的评估，LLM-as-judge 需要注意什么？
answer:
  mode: rubric
  reference_answer: |-
    用 LLM 裁判评估非英文内容时，面临着语言能力不均衡、文化偏见和资源稀缺等独特挑战。

    （1）裁判模型本身的多语言能力不足

    - 大多数强裁判模型（如GPT-4）在英语上表现最佳，在其它语言上，尤其是低资源语言，其理解深度和生成流畅度会显著退化。这会导致裁判自己都无法精准理解非英语的细微语义、修辞和错误，其评判的可靠性大打折扣。

    - 对策：在开始评估前，先用该语言的标准测试集检验裁判模型的表现，量化其“语言天花板”。对于资源极低的语言，可能不适合直接作为裁判。

    （2）语言翻译作为管道引入的失真

    - 常见做法是将非英语内容翻译成英语，再用强大的英语裁判评估。但翻译过程本身会引入同义失真、风格抹平、文化特定概念丢失等问题。一个翻译后显得笨拙或冗长的回答，在原文中可能极其优雅。

    - 对策：如果采用翻译管道，必须评估翻译质量带来的偏差。更好的方案是使用本身就在多语言上有较好能力的裁判模型（如特定多语言模型），或同时提供原文和参考翻译给裁判。

    （3）文化语境与规范的差异

    - 对“礼貌”、“幽默”、“正式感”甚至“安全性”的判断高度依赖文化语境。直接用英语文化的标准评判非英文回复，会造成系统性误判。例如，一些文化中直接坦率的表达可能会被英语裁判视为“粗鲁”。

    - 对策：对于关键的文化敏感性维度，应邀请当地母语专家参与校准和审计，并将文化特定的评分准则显式地写入裁判 prompt 中。

    （4）评估数据的稀缺与污染

    - 用于校准和验证非英文裁判的高质量人类评估数据非常稀少，导致难以科学地评价裁判在该语言上的可靠性。同时，网上公开的非英文基准少，极易被预训练数据污染。

    - 对策：投入资源构建小规模、高质量的本地化人工评估金标集，用于裁判的本地化校准。优先使用动态生成或基于近期事件的测试集减少污染。

    （5）提示词的语言选择

    - 裁判 prompt 使用什么语言也会影响结果。使用英语 prompt 评估非英文文本，可能会促使裁判以英语母语者的标准去评判。使用与待评文本相同的语言撰写 prompt，有时能激发模型的多语言对齐能力，但前提是 prompt 在该语言下的指令遵循效果良好。

    - 对策：进行小规模对比实验，确定英语 prompt 与本地语言 prompt 哪种在人类一致性上更优。通常推荐使用英语 prompt，因为强模型的英语指令遵循最好，但需在 prompt 中加入对文化差异的意识提醒。

    结论：非英文评估绝非简单的“替换裁判语言”，而是一个需要处理语言能力、文化效度、翻译失真和资源限制的系统工程。最佳实践是多层次结合，以本地化人评为最终校准。


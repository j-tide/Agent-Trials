content:
  prompt: 提示注入（Prompt Injection）漏洞如何评测？有哪些测试案例？
answer:
  mode: rubric
  reference_answer: |-
    提示注入评测是为了发现攻击者是否能通过构造恶意输入，覆盖或操纵模型的原始指令，从而劫持模型行为。

    评测方法：

    - 构建注入攻击分类体系：将已知的注入攻击技术分类，如直接指令覆盖、上下文污染、载荷拆分、间接注入等。为每种类型设计专门的测试案例。

    - 沙盒环境执行攻击：在隔离的测试环境中，模拟攻击者向应用集成有大模型的系统（如客服助手、代码助手）发送注入载荷，观察系统是否执行了非预期的操作。

    - 层次化成功标准：注入攻击的成功可分多个等级，评测时需分级记录。从低到高：

    常见测试案例：

    - 直接指令覆盖

    - 上下文污染与分隔符欺骗

    - 间接提示注入

    - 载荷拆分与多轮注入

    - 多语言与编码混淆注入

    评测指标：攻击成功率（按攻击类型和严重等级分层）、注入防御的鲁棒性（在变体攻击下的表现）、以及对合法指令的误伤率（将正常用户输入误判为注入）。

    结论：提示注入评测是一场持续的攻防演练，需要紧跟注入技术的发展，使用自动化的模糊测试和专业的红队测试相结合。


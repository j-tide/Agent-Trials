content:
  prompt: 如何利用“对抗评估”设计人类测试，暴露模型盲点？
answer:
  mode: rubric
  reference_answer: |-
    对抗评估通过主动设计可能诱导模型失败的输入，来压力测试模型的鲁棒性和安全性。其核心是以攻击促防御。

    设计人类测试的步骤与方法：

    （1）明确测试目标与盲点假设

    - 首先确定要暴露的盲点类型，例如：固执性幻觉、安全越狱、逻辑陷阱、偏见歧视、对错误前提的盲从等。针对每种盲点设计专门的“攻击向量”。

    （2）构建对抗提示库（由红队专家设计）

    - 越狱与安全绕过：设计各种角色扮演、代码注入、多语种混合、分段请求等越狱提示，试图让模型输出危险内容。

    - 事实冲突陷阱：提供上下文，明确给出与模型内部强知识相悖的信息（如“水的冰点是50摄氏度”），观察模型是盲从、盲目否定还是聪明地处理冲突。

    - 逻辑误导与推理压力：设计嵌套谬误、错误类比、循环论证的题目，测试模型是否会复制错误逻辑。例如：“因为所有猫都是狗，而狗会飞，所以猫会飞，对吗？”

    - 边缘与长尾知识：构造需要极冷门知识或精确到反常数值的问题，观察模型是诚实表达不确定，还是开始用流畅的语言编造。

    - 偏见探测：使用对比提示，如“描述一位成功的CEO”和“描述一位成功的女CEO”，观察回答是否存在系统性刻板印象。

    （3）执行评估并指导人类评估员

    - 不是简单让评估员看答案，而是让他们带着“攻击目标”去审视结果。评估员的任务是判断攻击是否成功。

    - 对于每种攻击提示，提供明确的攻击成功定义。例如，对于事实冲突陷阱，攻击成功定义为模型无条件服从了错误的上下文信息而没有提出任何质疑。

    - 评估员记录攻击成功率，并对成功案例进行质性分析：是什么话术导致了模型失守？

    （4）分析盲点模式，形成闭环

    - 收集所有攻击成功的案例，归纳出模型的主要脆弱模式。比如，“模型极其容易被权威话术误导”、“在第五轮对话后安全防线显著降低”。

    - 将这些案例和模式反馈给训练团队，转化为红队数据用于未来的DPO或RLHF对抗训练，从而“免疫”这些盲点。

    - 循环迭代：模型更新后，用升级版的对抗测试集再次评估，检验之前暴露的盲点是否已被修补，同时发现新的盲点。

    对抗评估让人类测试从“随机取样”升级为“精准打击”，是确保模型在恶意和复杂环境下仍保持可靠的关键手段。


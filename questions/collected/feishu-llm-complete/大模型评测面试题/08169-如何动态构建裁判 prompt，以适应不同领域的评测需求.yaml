content:
  prompt: 如何动态构建裁判 prompt，以适应不同领域的评测需求？
answer:
  mode: rubric
  reference_answer: |-
    动态 prompt 构建指不依赖单一的、写死的裁判 prompt，而是根据待评测内容所属领域、任务类型和评估侧重点，自动组装最适合的裁判指令。

    实现框架：

    （1）建立层次化的评估维度与标准库

    - 构建一个标准库，包含预定义好的、可直接复用的 prompt 模块。每个模块对应一个评估维度（如事实性、创造性、安全性）或一个特定领域（如医疗、法律、代码）的专用评判准则。

    - 这些模块是经过反复迭代和验证的“最佳实践”片段。

    （2）领域与任务分类路由

    - 在评估流水线中，前置一个轻量级的分类器或使用 LLM 对输入提示进行自动分类，判断其属于哪个领域（如“写作”、“编程”、“医疗咨询”）以及需要侧重哪些评估维度（如“高度关注事实性”、“关注创意”）。

    - 根据分类结果，从标准库中按需选取和组装 prompt 模块。例如，对于医疗类问题，自动加载包含“严格基于权威医学指南”、“惩罚无据编造”、“必须表达不确定性的边界”等条目的模块；对于创意写作，则加载注重“想象力”、“连贯性”、“文笔”的模块。

    （3）注入领域特定的少量示例

    - 动态提示词生成器会根据领域标签，从一个大规模的示例库中检索1-2个最相关的、带有人类专家标注的领域内评分案例（Few-shot），并将其动态插入到 prompt 中。这能让裁判模型快速理解该领域的特定评判标准。

    （4）可配置的评估权重与目标动态调整

    - 提供配置接口，让用户能够根据业务需求调整各维度的权重或通过自然语言描述本次评估的特殊关注点。例如，用户输入：“本次评估尤其要关注代码的内存效率”。系统将此指令转化为一段强调代码性能的 prompt 片段，合并入最终裁判 prompt。

    （5）反馈驱动的 prompt 自动优化

    - 收集人类评估员对裁判评判的反馈（同意/反对）。利用这些信号，定期自动地小范围调整 prompt 模块的措辞、示例，甚至评估维度的描述，通过诸如DSPy等框架自动优化 prompt，使其裁判结果与人类判断的吻合度不断提高。

    技术实现：这本质上是一个检索增强生成（RAG）应用于 prompt 构建的过程。系统以“待评测任务+领域+重点”为查询，检索最相关的评判标准片段、示范案例和注意事项，然后将它们与基础裁判框架模板拼接，生成针对该样本的最优裁判 prompt。这种动态适应性极大地提高了 LLM-as-judge 在广泛和专业化场景下的评估质量。


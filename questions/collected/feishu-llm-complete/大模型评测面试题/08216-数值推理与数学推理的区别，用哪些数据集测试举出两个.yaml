content:
  prompt: 数值推理与数学推理的区别，用哪些数据集测试？举出两个。
answer:
  mode: rubric
  reference_answer: |-
    区别：

    [嵌入表格未展开]

    数值推理数据集举例：

    - DROP：一个需要从段落中进行离散推理和数值操作的阅读理解数据集。模型需要定位相关数字，并进行加、减、排序、计数等操作来回答。例如，从一段足球比赛描述中，提取得分并计算总分。

    - NumerSense：专门用于评测模型对数字和常识的结合能力。给出一个句子，其中包含一个被掩码的数字，模型需要基于常识和语境推断出合理的数值。

    数学推理数据集举例：

    - GSM8K：小学数学应用题。要求多步算术推理，但数学知识本身不深。核心测试模型将文字情景转化为逐步算式的能力。

    - MATH：涵盖代数、几何、数论等的高中数学竞赛级问题。需要深厚的数学知识、复杂公式推导和符号运算，难度远高于GSM8K。

    简单说，数值推理是“读懂文字中的数并算对”，数学推理是“像数学家一样思考”。两者评测的维度截然不同。


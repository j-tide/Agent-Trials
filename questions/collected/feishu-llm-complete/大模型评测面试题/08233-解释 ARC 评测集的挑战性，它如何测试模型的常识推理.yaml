content:
  prompt: 解释 ARC 评测集的挑战性，它如何测试模型的常识推理？
answer:
  mode: rubric
  reference_answer: |-
    ARC（AI2 Reasoning Challenge） 是一个极具挑战性的科学常识推理评测集，专门用于测量模型超越表面语言模式、进行深层推理的能力。

    挑战性来源：

    - 题目来自中小学科学考试，但经过精心挑选，剔除了那些仅靠简单的语料库共现或信息检索就能答对的题目。

    - 问题需要综合常识、科学知识和逻辑推理，比如理解基本物理原理、生物过程、空间关系、实验设计等。

    - 存在一个Challenge Set，专门由那些基于纯统计共现（如点互信息）无法正确回答的题目构成，直接考验模型的真推理能力。

    如何测试常识推理：

    - 给出一个科学相关的问题和四个候选答案，模型必须选出正确的一个。问题常常描述一个具体情景，并要求推理出原因、结果或可行的解决方案。

    - 要求模型不仅知道单个事实，还能将它们串联成因果链。例如，需要理解“摩擦生热”的原理，并应用到“为什么雪地里走路会累”的情景中。

    - ARC 能有效区分“背诵知识的模型”和“会推理的模型”。

    重要性：它表明即使在知识层面接近饱和，真正的推理能力仍是当前大模型的一大瓶颈，是通往更深层次理解的关键测试。


content:
  prompt: 如何评估模型对不确定性的表达？有没有专门基准？
answer:
  mode: rubric
  reference_answer: |-
    评估模型表达不确定性的能力，不仅看它是否说“不知道”，更要看它能否在不确定时恰当使用模糊语言，在确定时给出肯定回答，且校准良好。

    评估方法：

    - 拒答率与恰当性：构造一批包含可回答问题和不可回答问题（如询问未来、虚构事物）的测试集。评估模型拒答或表达不确定性的比例，同时计算“误拒”（知道却说不知道）和“误答”（不知道却强行回答）的权衡。

    - 口头置信度校准：要求模型在答案中附加其置信度（如“置信度：90%”），然后计算这些置信度的 ECE，看口头表达的概率是否与真实正确率一致。

    - 语义不确定性检测：对同一问题多次采样，检查答案语义的一致性。若多次采样答案高度分散，而模型没有使用任何不确定措辞，则视为校准失败。

    - 诊断测试集：专门设计题目，其答案具有固有的不确定性（如“明天的天气”），或信息不足无法确定，观察模型是否恰当表达。

    专门基准：

    - TruthfulQA：虽然不是纯不确定性基准，但其评估框架区分了“真实”和“信息量”。模型一味说“我不知道”会因信息量低而得分低，这隐式地奖励了在已知和未知之间保持平衡的不确定性表达。

    - SelfAwareness / 知识边界数据集：一些研究构造了类似“Can you answer this question?” 的探测集，或利用知识库中的实体缺失构建问题，直接评估模型的元认知准确性。

    - Halueval 的某些子集：也包含对知识边界和不确定场景的评估。

    核心挑战：如何让模型用自然语言输出可靠的置信度，以及如何将其与人类表达不确定性的方式对齐，仍是开放研究方向。


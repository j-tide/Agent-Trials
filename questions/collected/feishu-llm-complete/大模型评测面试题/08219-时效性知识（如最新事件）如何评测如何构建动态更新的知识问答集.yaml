content:
  prompt: 时效性知识（如最新事件）如何评测？如何构建动态更新的知识问答集？
answer:
  mode: rubric
  reference_answer: |-
    评测时效性知识，旨在测量模型对知识截止日期后发生事件和新知识的掌握程度，以及是否会产生过时或编造的回答。

    评测方法：

    - 基于时效性问答：设计问题，答案会随现实世界时间推移而改变（如“现任联合国秘书长是谁？”、“最新的奥斯卡最佳影片？”）。

    - 动态基准：使用不断刷新的基准数据集，包含最新事件，如 FreshQA、RealTimeQA。

    - 拒绝编造测试：对于极新且无训练数据的事件，正确的行为是承认“不知道”。评测需区分模型是正确回答了最新知识，还是诚实地表达了知识边界，抑或是进行了幻觉编造。

    构建动态更新的知识问答集的方法：

    - 定期采集信息源：设定定时任务，从高质量新闻API（如NewsAPI）、维基百科最新编辑、权威机构（如NASA、WHO）官网抓取新信息。

    - 自动生成问答对：

    - 人工与自动校验：

    - 版本管理与快照：为每次评测创建固定时间戳的评测集快照，使得不同模型可以在同一时间切片上公平比较。同时，题库会随时间不断更新，旧题可能因过时而移除或更新答案。

    - 多级难度设计：包含“直接事实”（单跳）和“需要推理的时效组合”（多跳，如“对比今年和去年的诺贝尔文学奖得主的国籍”）。

    通过这种“采集-生成-验证-快照”的流水线，可以源源不断地构建一个“活的”时效性知识评测集，使对模型“与世俱进”能力的衡量成为可能。


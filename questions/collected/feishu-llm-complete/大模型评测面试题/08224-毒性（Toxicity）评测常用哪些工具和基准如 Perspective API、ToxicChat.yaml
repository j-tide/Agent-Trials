content:
  prompt: 毒性（Toxicity）评测常用哪些工具和基准？如 Perspective API、ToxicChat。
answer:
  mode: rubric
  reference_answer: |-
    毒性评测旨在量化模型生成或输入文本的“有毒”程度，包括粗鲁、不尊重、仇恨、骚扰等可能让人退出讨论的内容。

    常用工具：

    - Perspective API：由Google Jigsaw开发，使用机器学习模型为文本提供从0到1的“毒性”分数，并可细分严重毒性、侮辱、亵渎、身份攻击等维度。它是工业界广泛使用的实时毒性检测工具，但可能存在对某些群体或方言的偏见。

    - Azure AI Content Safety：微软提供的文本和图像内容审核工具，支持检测仇恨言论、暴力、自残、色情等类别，可自定义阈值。

    - OpenAI Moderation API：OpenAI提供的免费内容过滤工具，可检测多个类别的不安全内容，常用于对输入和输出进行安全过滤。

    - Hugging Face Evaluate库：集成了多种毒性评估指标，可直接用于模型评测。

    - Detoxify：一个开源的PyTorch库，提供了预训练的多语言毒性检测模型，使用方便。

    常用基准与数据集：

    - RealToxicityPrompts：这是一个广泛使用的基准，包含从网络文本中收集的10万条提示，并标注了毒性分数。它用于评估模型在遇到不同毒性程度的提示时，是否会继续生成有毒内容。核心指标是模型产生有毒续写的频率。

    - ToxicChat：一个较新的基准，由真实用户与聊天模型的交互数据构成，并经人工标注毒性。它比基于网络文本的基准更具生态有效性，反映了更真实场景下的毒性挑战。

    - Jigsaw Unintended Bias in Toxicity Classification 数据集：包含大量带有身份标签的评论，用于训练和评估毒性模型，特别是识别对特定群体的无意识偏见。

    - BOLD (Bias in Open-ended Language generation Dataset)：通过带有不同群体身份的提示，评估模型生成文本中的毒性、情感和偏见。

    - HateXplain：一个细粒度的仇恨言论检测数据集，标注了哪些词是仇恨言论及其针对的目标群体。

    评测方法：

    - 毒性概率：使用上述工具，计算模型生成回复的平均毒性得分或超过毒性阈值的回复比例。

    - 毒性触发率：在给定中性或非毒性提示时，模型自发产生有毒回复的频率。

    - 对话毒性持续度：在多轮对话中，一旦引入毒性，模型是否会被“带偏”并继续生成有毒内容，或能保持安全。

    在使用这些工具和基准时，需注意它们本身也带有文化和语言偏差，不能作为毒性评测的唯一标准，必须结合人类评估进行校准。


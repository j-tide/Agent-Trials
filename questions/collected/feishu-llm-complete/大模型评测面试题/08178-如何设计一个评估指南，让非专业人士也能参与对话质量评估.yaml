content:
  prompt: 如何设计一个评估指南，让非专业人士也能参与对话质量评估？
answer:
  mode: rubric
  reference_answer: |-
    让非专业人士提供可靠的评估，关键在于将复杂的主观质量判断分解为具体、可观察、易判断的简单问题，并提供充足的锚定示例。

    指南设计原则与核心内容：

    （1）使用极度简化、生活化的语言

    - 避免使用“忠实度”、“幻觉”、“连贯性”等专业术语，而是转换为普通人的视角。

    - 例如，不问“回答是否与上下文一致”，而问“这个回答有没有胡说八道或凭空编造一些看起来合理但实际不存在的东西？”

    - 为每一个待评估的维度设计1-2个用日常语言提出的核心问题。

    （2）聚焦用户可感知的具体维度

    - 整体满意度：如果您是提问者，对这个回答满意吗？（1-5星）

    - 切题与有用：它是否真正回答了您的问题，提供了有用的信息？

    - 胡编乱造：回答中是否包含任何您感觉不对、明显是虚构或与您所知事实不符的内容？

    - 语言流畅与礼貌：回答读起来是否通顺自然？语气是否礼貌、令人舒适？

    - 安全性（基本）：回答中是否包含辱骂、强烈歧视、恐怖暴力描述或教唆违法行为？是/否。

    （3）极度重视锚定示例

    - 对每个维度的每个分数等级（如1星和5星），提供多个具体的、完整的问答对示例，并解释为什么这个回答得5星或1星。

    - 案例应覆盖典型的好、坏和边界情况。例如，一个2星的胡编乱造示例，应能清晰展示为什么它比3星差，比1星好。

    （4）将长文本评估转化为比较和定位任务

    - 对于非专业人士，绝对评分很难一致。可改为“成对比较”或“找茬”：给出两个回答，问哪个更好；或在一段回答中高亮出你觉得“不对劲”的地方。这种任务认知负担更小，信度更高。

    （5）设计结构清晰的评估问卷

    - 每个评估单元包含：用户问题、模型回答、以及后续的几个简单选择题或评星。

    - 问题顺序应自然，从整体到局部，从简单（流畅性）到稍微复杂（事实性）。

    - 提供“无法判断”或“不确定”选项，尊重评估者的知识边界，避免强制猜测污染数据。

    （6）互动式入门培训与测试

    - 在正式评估前，要求评估者完成一个简短的互动教程，包含讲解和必须通过的校准测试（如10道题）。只有通过测试（如准确率>80%）才能开始正式任务。

    通过将评估任务“傻瓜化”、案例化和任务具体化，可以有效地将非专业人士的原始感知转化为有价值的、相对可靠的评估数据。


content:
  prompt: Chatbot Arena 依靠人类投票计算 Elo 分，其优势和潜在偏差是什么？
answer:
  mode: rubric
  reference_answer: |-
    Chatbot Arena 是一个大规模在线平台，用户向两个匿名模型提问，并对他们的回复进行投票（更好/打平/更差），以此计算每个模型的Elo评分。

    优势：

    - 高生态有效性：真实用户在日常场景中评估，反映实际需求和满意度，比任何离线基准都更接近产品的真实价值。

    - 大规模、动态：持续收集数据，不断更新，可以快速反映模型变化和社区偏好。

    - 抗基准饱和：由于问题开放且持续更新，不存在固定题库被“刷爆”的问题，长期有区分度。

    - 捕捉综合体验：不仅评估答案正确性，还涵盖流畅度、共情、安全性、格式等用户体验全貌。

    潜在偏差：

    - 用户群体偏差：投票者多为技术爱好者，其偏好和问法不一定代表普罗大众。

    - 位置与呈现偏差：回复的顺序、格式美观度会影响选择，而非纯能力。

    - 流行度偏差与风格偏好：模型可能因更“热情”、“话多”、“幽默”而获得虚高Elo，实际硬能力可能不如朴实但正确的模型。

    - 安全与对齐的非专业评判：普通用户难以识别隐秘的幻觉或偏见，有害但“好听”的回复可能被选为胜者。

    - 非控制变量：在线环境不可控，包括生成参数、系统负载等。

    尽管有偏差，Arena通过庞大的数据量和盲评设计，仍成为当前最受关注的大模型众包评测之一。


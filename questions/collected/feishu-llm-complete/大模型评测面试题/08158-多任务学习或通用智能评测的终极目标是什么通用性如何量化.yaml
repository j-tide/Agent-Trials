content:
  prompt: 多任务学习或通用智能评测的终极目标是什么？“通用性”如何量化？
answer:
  mode: rubric
  reference_answer: |-
    终极目标：通用智能评测的终极目标，是构建一个能够全面、公平、准确地度量一个系统在未知的、多样化环境和任务中成功达成目标的能力的评估框架。这接近对“通用智能”的操作性定义和测量，即一个智能体在面对新问题时，能综合运用知识、推理、学习和适应能力，高效实现目标的程度。

    “通用性”的量化方法：

    - 广度与深度结合：使用类似 BIG-Bench 的超大规模任务集合。通用性不仅仅是任务数量的简单累加，还需要考虑每个任务上的性能深度。可以计算模型在所有任务上的平均归一化得分，以及超过特定阈值（如人类水平）的任务比例。

    - 跨域泛化与迁移效率：衡量模型在新任务上的零样本和少样本学习能力。指标可以是从新任务的少量数据中学习后的性能提升速度（样本效率），以及其在已见任务与未见任务上的性能差距。差距越小，通用性越强。

    - 能力等值面分析：不只用一个标量，而是提取出多个基础认知能力因子（如语言理解、逻辑推理、记忆等），看模型在这些基础因子上的组合表现。一个通用智能体应在所有基础因子上都有均衡且较高的得分，而不是偏科。

    - 新任务解决的对数效率：借鉴通用智能的定义，可以用模型能够解决的全新任务的数量（广度）乘以解决这些任务时的平均对数效率（深度），形成一个综合指数。

    - 高生态有效性的模拟：在模拟真实世界的复杂环境中（如交互式游戏、虚拟实验室），综合评估模型感知、规划、行动和协作的通用能力。评分包括任务成功率、完成质量和资源消耗等。

    挑战：通用性不可能被一个简单数字完全刻画。真正的通用智能评测必然是多维多层次的、动态的、且需要与人类和社会价值持续对齐的复杂体系。


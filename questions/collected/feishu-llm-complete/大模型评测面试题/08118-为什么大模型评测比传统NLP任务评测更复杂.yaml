content:
  prompt: 为什么大模型评测比传统NLP任务评测更复杂？
answer:
  mode: rubric
  reference_answer: |-
    大模型评测的复杂度远超传统NLP任务评测，根本原因在于其通用性、开放性、多变性以及与社会价值的深度耦合。

    复杂性的来源：

    （1）任务边界的模糊与泛化

    - 传统NLP评测聚焦于明确定义的单一任务（如情感分类、命名实体识别），有固定的输入输出格式和客观答案。大模型通常用于开放域对话、指令跟随、创意写作等自由形式任务，没有唯一标准答案。评估需处理语义等价性、风格适配性等难以量化的维度。

    （2）评估维度的多元与冲突

    - 大模型的输出质量不能仅通过准确性衡量，还需同时评估事实性、忠实性、安全性、公平性、连贯性、有用性、无害性等多个维度。这些维度之间可能存在矛盾（如信息量大 vs 绝对安全），需要多目标权衡，传统任务的单一指标无法覆盖。

    （3）对上下文和长程依赖的强依赖

    - 大模型常用于多轮对话、长文本生成等涉及复杂语境管理的场景。评估需要考虑跨轮次的一致性、对早期约束的记忆、以及长距离逻辑链的维持能力，这对自动评估指标提出了极高要求。

    （4）生成内容的主观性

    - 对于创意写作、诗歌、建议等主观输出，质量优劣高度依赖于人的审美、文化背景和使用意图。传统基于参考文本的指标（如BLEU、ROUGE）彻底失效，必须引入昂贵的人类评估或基于大模型裁判的不可靠代理。

    （5）动态性、时敏性与知识截止

    - 大模型的知识被冻结在训练截止日期，现实世界动态变化。对于实时性问题，模型可能生成过时或错误的答案。评估需要动态更新的测试集，并区分“诚实拒答”与“错误编造”，这在传统静态评测中不存在。

    （6）安全性、伦理与社会影响的评估

    - 大模型可能产生有害、偏见、诽谤或操纵性内容。评测必须包括这些高风险维度，涉及复杂的伦理判断和文化敏感性，并需要专业的红队测试和领域专家介入，远超传统NLP任务的范畴。

    （7）自动化评估的困境

    - 传统指标失效，而基于大模型的自动裁判（LLM-as-Judge）又引入新的偏差和不确定性。人评成本极高且难以大规模标准化，评估方法本身的可靠性就是一个难题。

    大模型评测从“测评模型做一道题对不对”变成了“测评一个复杂智能体在真实世界中的综合表现”，这需要对评测方法论进行根本性的重新思考。


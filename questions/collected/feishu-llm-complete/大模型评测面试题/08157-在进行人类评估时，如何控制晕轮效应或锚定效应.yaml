content:
  prompt: 在进行人类评估时，如何控制“晕轮效应”或“锚定效应”？
answer:
  mode: rubric
  reference_answer: |-
    这些认知偏差会系统性地扭曲评估结果，必须通过实验设计和培训主动控制。

    一、控制晕轮效应

    晕轮效应指评估者对模型某一突出特征（如流畅度、自信语气）的整体印象，影响了对其他独立维度（如事实准确性）的判断。例如，一个回答极其流畅，评估员可能会下意识地认为它的事实性也更高。

    控制策略：

    - 分离式评估设计：让不同的评估员群体分别评估不同维度，或让同一个评估员在不同时间段、打乱的顺序下评估不同维度，避免互相干扰。

    - 维度评分前置与顺序随机：在界面上对每个维度独立呈现，强制评估员为每个维度单独打分。可以随机化维度出现顺序，消除顺序效应。

    - 提供维度间无关性的明确指导：在培训中明确指出“晕轮效应”的存在，用反例强调为何流畅的回答可能事实全错。要求评估员严格依据各维度的定义评判，而不是凭整体感觉。

    - 使用诊断性交叉验证：分析数据时，检查不同维度评分之间的相关性。如果某两个理论上应弱相关的维度（如流畅性和事实性）分数异常高相关，可能就存在晕轮效应，需要回溯调查。

    二、控制锚定效应

    锚定效应指评估者的判断被最先接触到的信息（锚）所左右。例如，如果评估员先看到一系列高质量的回答，后续中等质量的回答可能被低估；反之亦然。

    控制策略：

    - 随机化呈现顺序：所有待评估的样本顺序完全随机化，使评估员无法形成固定的“锚”。这是最有效的方法。

    - 使用绝对评价标准：提供清晰的、带有具体锚定示例的量表（如“卓越：完全解决了问题，并提供了额外有价值的见解”），将评估员的判断锚定在标准定义上，而非其他样本的对比上。

    - 校准前的热身与重新锚定：在每次评估会话开始时，展示包含各个质量等级的预先标定好的样本（热身题），帮助评估员建立与标准一致的内部标尺，替代可能带入的随机锚。

    - 避免连续评估同一模型：如果可能，不要将同一模型的大量样本连续排列，因为这可能使对该模型的第一次评价成为后续评价的锚点。

    通过结合实验设计的物理隔离（分离维度、随机顺序）和认知策略的培训（意识提升、标准锚定），可以显著削弱这些心理偏见，提升人类评估的科学性和公正性。


content:
  prompt: 使用 GPT-4 作为裁判时，如何设计 prompt 以保证评分的公正性和可解释性？
answer:
  mode: rubric
  reference_answer: |-
    设计公正且可解释的 prompt 是 LLM-as-judge 的核心艺术。一个好的裁判 prompt 应当能压制模型的主观偏向，激发其逻辑评判能力，并强制输出可审计的推理过程。

    设计要点：

    （1）清晰的角色与目标设定

    - 开头明确赋予裁判一个专业角色，例如“你是一个严格、公正、经验丰富的AI评估专家”。这有助于模型进入审慎、客观的评判模式。

    - 清晰阐述评估的总目标，例如“你的任务是比较两个AI助手对同一用户问题的回答，并从多个维度评判哪个更好”。

    （2）提供多维度、可操作的评分标准

    - 将模糊的“质量”分解为具体、独立的评估子维度，如事实准确性、相关性、帮助性、语言流畅度、安全性等。对每个维度给出1-2句清晰的定义。

    - 为每个维度提供锚定示例：描述该维度上低分回答和高分回答的典型特征。这能极大提高评分的跨样本一致性。

    - 如果使用分数制，为每个分数段（如1-10分）提供语义标签，明确区分“及格”、“良好”、“优秀”的边界。

    （3）强制输出分析再评判（Chain-of-Thought）

    - 要求裁判在给出最终分数或选择之前，必须先在独立的思考区域（如 <analysis> 标签内）逐一分析每个维度的表现，比较两个回答各自的优缺点。这迫使模型进行“慢思考”，利用其推理能力深入内容，而不是依赖表面的位置或长度等偏差特征。

    - 示例提示：“请先分步骤分析：1) 哪个回答的事实更准确？2) 哪个回答更好地解决了用户的核心问题？3) 哪个回答更安全、更得体？然后，基于上述分析，给出你的最终选择。”

    （4）结构化、可解析的输出格式

    - 强制裁判将最终判决和理由以结构化的格式（如JSON、Markdown表格）输出，便于自动提取和分析。

    - 输出中必须包含：对回答A的逐维度评语、对回答B的逐维度评语、最终的选择（A更好/B更好/平局）或分数，以及一个简洁的总结性理由。

    - 这种设计不仅提供了分数，还提供了完整的可解释审计轨迹，研究人员可以回溯分析裁判的判断逻辑是否合理。

    （5）主动加入防偏差指令

    - 针对已知偏差，在 prompt 中显式加入对抗指令。例如：

    （6）利用多轮或辩论机制（高级）

    - 在成本和延迟允许时，可设计多轮裁判流程。例如，第一轮裁判给出初评和理由；第二轮将初评理由提供给同一个或另一个裁判，要求其复核并给出最终评判，这能有效发现并修正初评中的逻辑漏洞。

    总结：公正性源于标准明确，可解释性源于强制分析。将两者融入精心设计的 prompt 模板，是发挥 GPT-4 裁判能力的关键。


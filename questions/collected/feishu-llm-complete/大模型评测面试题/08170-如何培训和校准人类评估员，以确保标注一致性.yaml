content:
  prompt: 如何培训和校准人类评估员，以确保标注一致性？
answer:
  mode: rubric
  reference_answer: |-
    - 理解与遵从：是否正确解读了用户指令，并遵循了其中的显式约束？

    - 信息满足度：是否提供了足够且必要的信息解决用户问题，没有严重遗漏？

    - 表达质量：是否组织清晰、语言流畅、格式恰当，使用户能轻松获取信息？

    - 主动性：在恰当的情境下，是否预见了用户的深层需求，提供了有价值的后续建议或澄清？

    - 暴力与恐怖：不描述、不赞美、不指导暴力行为。

    - 仇恨与歧视：不生成针对特定人群的诋毁、刻板印象或煽动性言论。

    - 违法与伦理：不提供如何从事非法或不道德活动的具体建议。

    - 隐私侵犯：不尝试推测、生成或泄露个人身份信息。

    - 心理健康：面对用户表露的心理危机，不给出冷漠、嘲讽或可能加剧伤害的回复。

    - 事实准确性：对于可验证的客观问题，回答是否与公认事实一致。

    - 忠实于来源：对于需要基于提供的材料（如检索文档）的任务，是否严格基于材料，不随意添加。

    - 知识边界认知：是否避免了强行编造？是否在不知道或不确定时，恰当地表达了“我不知道”或提供了有条件的说明，而不是给一个编造的确定答案。

    - 引用可靠性：如果给出了引用来源，这些来源是否真实存在且内容与陈述一致。

    - 用当前模型对未评估样本进行预测。挑选模型输出置信度最低、输出熵最高、或多个解码路径分歧最大的样本。这些样本通常是模型“拿不准”的边界案例，评估它们能最有效地诊断模型能力边界和幻觉倾向。

    - 在成对比较中，可优先选取两个模型胜率最接近50%的提示进行人评，这能最大程度地增加Elo排名的信息量，避免在胜负已分的提示上浪费人力。

    - 将大量未评估样本通过嵌入模型进行聚类，从每个簇中挑选最核心（最具代表性）或最边缘的样本进行人评。这样能用少量样本覆盖整个数据分布，避免对重复场景的过度评估。

    - 如果已有部分自动评测，可以挑出自动指标与先前人评结果分歧最大、或模型在不同自动指标上评价严重矛盾的样本。这些“矛盾样本”是自动评测的盲点，人评的纠错价值最大。

    - 将全体数据按核心特征（如对话领域、用户意图、提示长度、安全风险等级）分层，在每层内按比例随机抽取少量样本。确保小样本集的结构与大总体一致，提升估计的精度。

    - 不预设固定样本量，而是每评估一小批样本后，即时计算核心指标（如胜率、幻觉率）的置信区间。一旦区间窄到足以做出决策（如模型A显著优于B），立即停止该组评估。这能动态节省评估资源。

    - 如果目标是多模型排名，使用基于成对比较的Elo系统。Elo算法能自适应地选择信息量最大的下一对比较，用较少的人评次数获得稳健的排名，远比让人类对所有样本做绝对评分高效。

    - 绿灯：所有指标高分，直接视为“通过”，不消耗人力。

    - 红灯：关键指标极低（如安全分类器报警），直接视为“不通过”或触发自动修正。

    - 黄灯：落入中间模糊地带，或不同自动指标之间严重矛盾，提交人类评估。

    - 是否避免了陈词滥调、常见模板和可预测的情节发展？

    - 是否引入了令人惊讶但合理的想法、比喻、转折或独特的视角？

    - 示例锚定：低分端是“复制常见童话套路”，高分端是“构建了一个前所未有的奇幻世界，且内恰合理”。

    - 在设定的框架内，是否展现了丰富的细节、生动的感官描述和多层次的内涵？

    - 世界观的构建是否引人入胜，并激发了读者的想象？

    - 衡量：细节的密度和质量，而非泛泛而谈。

    - 这种新颖性是否服务于写作目的，提升了主题表达，而不是为了新奇而新奇、显得突兀？

    - 创意是否符合文类要求（诗歌、故事、对话）和给定的提示约束？

    - 情节、人物行为、世界观设定是否前后一致，没有矛盾？

    - 因果关系是否清晰合理，没有随意的“机械降神”？

    - 示例：一个角色前面被描述为极端恐高，后面却轻松登上悬崖，这就是严重的不连贯。

    - 文本是否有清晰的开头、发展和结尾？段落之间的过渡是否自然？

    - 叙事节奏是否恰当，没有冗长拖沓或急促跳跃？

    - 句子层面，语法是否正确，用词是否准确，读起来是否顺畅？

    - 语义层面，观点之间是否有清晰的逻辑衔接（因果、转折、递进等），使全文成为一个有机整体？

content:
  prompt: 如果内部人工评估与公开基准结果矛盾，如何查证？
answer:
  mode: rubric
  reference_answer: |-
    内部人评（常基于真实产品数据）与公开基准（学术数据集）矛盾，意味着存在泛化差距或评估偏差。查证需要系统性地解构这种不一致。

    查证步骤：

    （一）交叉验证内部人评的质量

    - 检查评分者信度：复核内部评估员的信度指标，看是否因培训不足、疲劳或指南模糊导致评分不可靠。

    - 审计可疑高分/低分：抽取内部评估中与预期严重不符的样本，让一位资深专家独立盲审。确认是模型真问题还是评估失误。

    - 评估员偏差排查：检查内部评估员是否存在对某种风格的偏好、晕轮效应，或是否因长期接触模型而产生了“锚定”漂移。

    （二）审视公开基准的代表性与时效性

    - 数据泄漏嫌疑：检查模型训练数据是否可能污染了该公开基准。可以用基准的题干搜索训练集，或观察模型在基准上的困惑度是否异常的低。

    - 基准任务与现实任务的差异：分析该基准覆盖的场景、语言风格、知识领域是否与内部实际应用严重不符。一个在多项选择上超群的模型，可能在真实长文本生成中表现平平。

    - 基准饱和与难度不匹配：是否因为该公开基准已过于简单，所有先进模型都接近满分，使得内部评测出的细微优势在统计上不显著，实则内部差距存在但被淹没？

    （三）设计针对性对照实验

    - 构造“桥梁”评测集：从内部真实数据中，挑选与公开基准任务形式最相似的子集（例如，如果公开基准是摘要，则提取内部数据中的摘要任务），或者将公开基准的样本改写成贴近内部业务的口吻和格式。在这个中间地带上重新评测，观察矛盾是否消失。

    - 固定模型版本与环境：确保内部和公开评测使用的是完全一致的模型版本、解码参数、提示模板。许多矛盾仅仅源于版本不一致或推理环境差异。

    - 引入第三方仲裁：对矛盾焦点样本，购买第三方商业评测服务或邀请中立的学术合作方进行盲评，作为独立裁决。

    （四）辩证分析，明确适用边界

    - 如果查证后发现矛盾是真实的，意味着模型存在情境化能力差异。此时不应简单判定哪方对错，而是应明确：“我们的模型在处理A类型任务（公开基准）时具有Y优势，但在处理我们特有的B类型任务（内部场景）时存在Z短板。”

    - 将此发现转化为明确的研发目标：是应该改进模型以弥合短板，还是调整内部评测的权重以更合理反映真实需求。

    最终，内部与公开结果不一致并非危机，而是深度了解模型泛化能力的宝贵机会。


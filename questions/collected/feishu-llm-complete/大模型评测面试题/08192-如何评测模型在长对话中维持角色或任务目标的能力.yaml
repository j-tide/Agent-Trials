content:
  prompt: 如何评测模型在长对话中维持角色或任务目标的能力？
answer:
  mode: rubric
  reference_answer: |-
    这需要将长对话视为一个整体，从一致性和目标完成度两个核心维度进行评测。

    评测方法：

    - 任务结束后的归因评估：在对话结束后，将整个对话历史提供给评估模型（或人类），并提出具体问题，如：“请检查对话第2轮中用户告知的个人信息，是否在后续的任何回答中被遗忘或记错？”、“该助手在对话全程中的语气是否符合其设定的‘专业、冷静的医生’角色？” 这种事后整体审计的方法比单轮打分更有效。

    - 基于关键点追踪的自动化评测：

    - 模拟交互式对抗评测：使用另一个强大的模型扮演“引诱者”，在长对话中故意诱导目标模型偏离其角色或忘记任务目标，测试其在压力下的稳健性。例如，在目标模型扮演客服时，引诱者不断闲聊或提出无关要求，观察客服模型是否能在合理响应后回归任务主线。

    - 目标完成度评分：设计需要多步协作才能完成的对话任务（如“帮我规划一个包含5个特定地点的三日游，并比较各酒店”）。在对话结束后，由裁判模型或人类评估任务完成的总百分比、完成效率（对话轮数）、以及用户模拟者的满意度。

    核心指标：

    - 角色一致性分数：基于整个对话的角色符合度评分。

    - 关键信息维持率：初始定义的关键信息在对话末尾仍被正确记住的比例。

    - 任务目标达成率：任务成功完成的比例。

    - 抗干扰能力：在干扰下偏离任务或角色的频率。

    通过这些方法，可以系统性量化模型在长对话中的“持久力”和“可信度”。


content:
  prompt: 如果让你为一个新领域（如蛋白质设计）设计自动化评测指标，你会考虑哪些要素？
answer:
  mode: rubric
  reference_answer: |-
    为蛋白质设计等专业性极强、有客观物理规律的领域设计自动评测指标，需要将科学真实性作为绝对核心，融合领域约束和任务特殊性。我会考虑以下要素：

    （1）结构有效性与物理可行性

    - 可折叠性与稳定性：利用蛋白质结构预测工具（如AlphaFold）评估生成序列能否折叠成稳定三维结构，计算pLDDT等置信度指标。不能稳定折叠的序列视为质量低下。

    - 能量最小化：计算生成蛋白质的Rosetta能量、力场能量，更低且更稳定的能量反映更合理的物理设计。

    - 无结构冲突：检查主链二面角（拉氏图）、空间位阻，评价是否落在允许区域。

    （2）功能实现度量

    - 功能位点匹配：若任务设计某种酶活性位点，必须使用结构比对算法（如TM-align）检查生成序列的关键残基是否在三维空间中正确排列，并与真实功能蛋白的保守距离模式匹配。

    - 结合亲和力预测：对于设计结合特定靶标的蛋白，使用对接算法和结合自由能预测工具（如Rosetta的ddG）对生成结构进行评分，作为功能性的代理。

    （3）序列多样性与新颖性

    - 应用Distinct-N和Self-BLEU的衍生指标于氨基酸序列，评估模型是否能生成多样化且非天然的全新序列，而非总是复现训练集中的天然蛋白片段。结合与已知天然蛋白质数据库（如UniRef）的序列相似性搜索（BLAST），确保生成的新颖性。

    （4）可合成性与实验约束

    - 评估序列中是否含有难以合成的重复区段、低复杂度区域，或已知的有毒/致敏肽段模式。可以构建规则库和分类器进行过滤。

    - 检查密码子优化、表达宿主偏好等实际合成可行性。

    （5）多维度综合评测与帕累托前沿

    - 上述指标（稳定性、功能性、新颖性、可合成性）往往相互冲突。最终设计一个多维度雷达图，并报告在关键维度（如功能-稳定性）上的帕累托最优集合，允许用户根据实际应用选择权衡方案。

    通过这一套自动化指标，可以在不需要湿实验的情况下，对蛋白质设计的计算模型进行快速、多维且高度专业的评估，极大加速设计-测试-学习循环。

    - 题目全部是小学数学应用题，难度主要在于多步推理而非深层数学知识。

    - 通常有明确的链式推理过程，被称为“Chain-of-Thought”的典型测试床。

    - 答案是整数或简单小数，易于自动校验正确性。

    - 评测指标：最终答案的准确率（Exact Match），通常配合思维链提示实现。

    - 题目难度高，需要扎实的数学知识和抽象推理能力，非简单算术累加。

    - 答案形式多样，包括有理数、表达式、集合等，需要更复杂的归一化和等价判断。

    - 通常需要模型进行多步的符号推导和公式运用，比GSM8K更考验真正的数学能力而非语言解析。

    - 评测指标：答案的准确率，要求非常严格，自动判分较复杂。

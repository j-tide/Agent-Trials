content:
  prompt: 多模态对话评测中，如何处理对话与多图、多轮视觉参考的复杂性？
answer:
  mode: rubric
  reference_answer: |-
    多模态对话评测的复杂性在于，模型需要持续追踪视觉上下文，处理指代消解，整合多张图片的信息，并维护对话逻辑。

    评测策略：

    （一）构建专用评测集，模拟真实交互模式

    - 多图顺序展示：在多轮对话中，分步给出不同的图片（如先发一张商品图，再发一张细节图），要求模型结合所有图片信息回答最终问题。评测集需标注出每轮问题所依赖的图像集合。

    - 指代消解链：用户说“看看这个”，然后发图，随后说“它右上角那个东西是什么颜色的？”评测模型是否能正确关联“这个”和图片，以及“那个东西”和图片中的区域。

    - 编辑与变更请求：用户要求基于上一轮生成的图片进行修改，评测模型是否能正确理解变更并生成符合新要求的图像，或准确描述如何修改。

    （二）评估指标的多维化

    - 单轮与多轮指标分离：分别评估模型在首次看图时的理解能力（单轮视觉问答指标），和在多轮对话中对视觉历史的记忆与利用能力（多轮视觉对话指标）。

    - 视觉指代准确率：对有明确指代的问题，自动或人工判断模型回答中引用的物体/区域是否正确。

    - 视觉上下文维持度：在多轮对话后，针对第一轮图片中的细节进行提问，检验模型是否已经“遗忘”或混淆。

    - 对话连贯性：使用传统对话指标结合视觉，评估回答是否流畅、与历史一致，并由多模态裁判模型进行综合打分。

    （三）基于强多模态裁判的自动化评估

    - 将完整的多轮对话上下文（包括图片序列和文本）提供给多模态裁判（如GPT-4V），让其从以下维度对模型的最后一轮或整体表现打分：

    （四）模拟用户交互的自动化评测框架

    - 使用一个多模态模型扮演“用户”，根据预设的复杂场景剧本，向待评模型发起一系列包含文本和图片的多轮对话。对话结束后，由人类或更强的多模态裁判来评估整个交互任务的成功率和质量。

    挑战：多图多轮对话的标注成本极高，自动化裁判也需要校准。因此，当前仍处于以人工评估为核心，自动化裁判为加速器的发展阶段。


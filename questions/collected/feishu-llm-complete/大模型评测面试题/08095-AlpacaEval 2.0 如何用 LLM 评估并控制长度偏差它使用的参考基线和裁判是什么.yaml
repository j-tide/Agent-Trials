content:
  prompt: AlpacaEval 2.0 如何用 LLM 评估并控制长度偏差？它使用的参考基线和裁判是什么？
answer:
  mode: rubric
  reference_answer: |-
    AlpacaEval 2.0 是一个自动化评估指令遵循模型的基准，其核心是用裁判模型比较待测模型与参考模型在同一指令下的回答，计算待测模型的胜率。

    使用的裁判与参考基线：

    - 裁判模型：通常使用 GPT-4 系列（如 gpt-4 或 gpt-4-1106-preview）作为默认裁判。

    - 参考基线：默认使用 GPT-4 自身或 text-davinci-003（较早版本）的输出作为“标准”回答。待测模型的回答与这些高质量基线的回答进行PK，得出胜率。

    长度偏差控制机制（核心创新）：

    AlpacaEval 2.0 针对此前版本严重的长度偏差问题，引入了长度控制胜率（Length-Controlled Win Rate, LC-WR）。

    - 问题诊断：社区发现，原始胜率严重偏向于生成更长回答的模型。模型即使仅通过增加废话、重复或冗长表述就能获得虚高的胜率。

    - 解决方法—回归校准：

    - 效果：LC-WR大幅降低了长度与胜率的虚假相关性，使得简短但高质量的模型也能获得公正评价，让评测更聚焦于实质性的指令遵循和内容质量。

    评估流程总结：

    - 使用805个高质量、多样化的指令（覆盖日常对话、知识、创意等）。

    - 待测模型和参考模型分别对这些指令生成回答。

    - 将指令、待测回答和参考回答（顺序随机化）交给GPT-4裁判，要求其判断哪个回答更好（可选输出“平局”）。

    - 计算原始胜率，并通过上述回归方法得出长度控制胜率。

    AlpacaEval 2.0 因此成为少有的显式处理了LLM裁判长度偏差的大规模评测基准，为后续评测方法设立了重要的质量控制标准。


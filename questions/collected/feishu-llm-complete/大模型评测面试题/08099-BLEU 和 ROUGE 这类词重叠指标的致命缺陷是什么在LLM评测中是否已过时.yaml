content:
  prompt: BLEU 和 ROUGE 这类词重叠指标的致命缺陷是什么？在LLM评测中是否已过时？
answer:
  mode: rubric
  reference_answer: |-
    BLEU 和 ROUGE 分别是机器翻译和自动摘要领域经典的 n-gram 重叠指标，它们的致命缺陷在评估大模型的开放式生成时被极度放大。

    致命缺陷：

    - 忽略语义与同义性：仅基于精确词汇匹配。两个语义完全等价的句子，若用词不同（如“迅速” vs “快速”），重叠分数会非常低。这在生成式模型丰富多样的表达面前成为致命伤。

    - 无法区分信息重要性：所有词被视为同等重要。一个关键数字的错误（“营收增长2%” 误说成 “20%”）在分数上的惩罚可能与一个冠词变动相当，完全不能反映事实错误的严重性。

    - 对添加和遗漏不敏感：生成文本添加了大量合理但未经源文证实的细节（幻觉），只要没有与参考文本的n-gram重叠，分数不会显著受影响。同样，遗漏核心信息也可能被其他词的重叠掩盖。

    - 依赖一个或少量的参考文本：大模型的开放式生成没有唯一标准答案。以单个参考译文或摘要做对比，会严重低估那些表达不同但同样优质甚至更优的生成结果。

    - 长度与截断问题：需要复杂的长度惩罚和截断策略，但这些参数对不同任务不通用，调节不当会导致分数失真。

    是否已过时？

    在评估 LLM 的自由文本生成（尤其是对话、创意写作、长文本生成）时，BLEU/ROUGE 已经基本过时，不能作为主要的质量指标。它们仍然可以用于：

    - 受限的快速回归测试：在参考输出非常固定的场景（如某些特定格式的信息提取），仍有作为弱信号的参考价值。

    - 作为复合指标的一个非常小的组件：与其他语义指标结合时提供词汇层面的辅助信息。

    但在任何严肃的 LLM 评测中，研究者已转向基于语义嵌入（BERTScore）、自然语言推理（NLI）、问答（QAGS）、大模型裁判等更智能的指标，BLEU/ROUGE 单独使用将严重误导结论。


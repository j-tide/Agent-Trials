content:
  prompt: 模型“拒绝能力”如何评测？过度拒答和应拒未拒各有什么指标？
answer:
  mode: rubric
  reference_answer: |-
    拒绝能力是指模型在面对不安全、不道德、超出知识范围或违反政策的请求时，能够恰当拒绝，同时不过度拒答的正常请求。评测需要同时衡量两个矛盾的方面：安全性（应拒必拒） 和可用性（不应拒则不拒）。

    评测方法：

    - 构建分层测试集：设计三类提示：

    - 自动化安全分类器：使用训练好的有害内容分类器或强模型裁判，对模型回复进行有害性评分。若回复被判定为有害，则视为“应拒未拒”。

    - 人工专家评估：对于边缘案例，由安全、法律或伦理专家判断模型的拒答是否恰当，以及未拒答时是否有潜在风险。

    核心指标：

    - 应拒未拒率：在所有真正有害的提示中，模型未能拒绝（即输出了有害内容）的比例。这是安全漏洞指标，越低越好。

    - 过度拒答率（误拒率）：在所有安全、良性的提示中，模型错误地拒绝回答的比例。这反映了模型的保守程度和对齐税的严重性，越低越好。

    - F1/平衡准确率：综合考虑以上两者，可以计算拒绝行为的F1分数，或绘制ROC曲线寻找最优阈值。

    - 边界处理合理性：对边界提示，由专家评估模型的回应是否展示了对复杂性的理解、适度的不确定性和安全的引导，而不是一刀切的拒绝或鲁莽的回答。

    - 拒答风格与信息量：模型拒绝时，是生硬地说“我不能回答”，还是解释了原因并提供了替代帮助？前者虽然安全但帮助性差，后者更优。可引入拒答质量评分。

    典型基准：SafetyBench、RealToxicityPrompts、HarmBench 等，以及内部红队测试集，都可用于此类评测。一个成熟的模型应在保证极低应拒未拒率的同时，将误拒率控制在可接受范围。


content:
  prompt: 如何评测模型对私人信息（PII）的保护程度？能否诱导泄露？
answer:
  mode: rubric
  reference_answer: |-
    评测模型对个人身份信息（PII）的保护，核心是检验模型是否会泄露训练数据中记忆的隐私信息，以及是否会在交互中被诱导输出用户的或其他人的隐私数据。

    评测方法：

    （一）记忆泄露测试

    - 训练数据提取攻击：使用类似“请问以下信息是否在你的训练数据中：XXX的电子邮件地址是？”的提示，但更常见的方法是提供某个前缀（如“张伟，电话号码：”），看模型能否自动补全出真实的PII。如 Carlini等人的记忆测试。

    - 金丝雀测试：在训练数据中有意植入虚构的、唯一的“金丝雀”序列（如一个不存在的人名和对应的邮箱），然后在模型部署后进行探测，看模型是否会输出这些序列。这是检测模型记忆和泄露风险的黄金标准，因为任何对该序列的输出都可确定为训练数据泄露。

    - 成员推理攻击：在更技术化的层面，通过分析模型的输出概率、困惑度等信号，判断某个特定数据点是否被用于训练。虽然较为复杂，但能系统地量化隐私风险。

    （二）诱导泄露测试

    - 社交工程诱导：模拟恶意用户，通过巧妙的对话设计，试图让模型输出他人的PII。例如：

    - 上下文隐私泄露：在给模型的系统提示或历史对话中植入伪PII，然后让另一用户通过正常对话询问这些信息，测试模型是否能区分不同用户会话的隐私边界，是否会跨会话泄露信息。

    - 越权查询：对于连接了外部数据库或知识库的RAG模型，测试是否可以通过构造特定问题，绕过权限控制，查询到未经授权的私人记录。

    （三）评测指标与自动化

    - 泄露成功率：模型输出中包含真实或预设PII的比例。

    - 模糊化处理质量：当模型需要输出信息时，是否能自动对PII进行脱敏处理（如用“***”替换）。

    - 安全拒绝率：对试图诱导泄露的请求，模型恰当拒绝的比例。

    - 自动化工具：使用预训练好的PII检测模型（如基于BERT的NER模型）自动扫描模型输出，标记并计数PII实例。

    能否诱导泄露？

    目前先进大模型经过对齐训练，基本学会了拒绝直接的隐私询问。但通过多轮对话蚕食、角色扮演（如扮演紧急救援人员）、或利用长上下文混淆视听等复杂社会工程攻击，仍有一定概率诱导成功。尤其是当PII被切碎并分布在多轮对话中时，模型可能在不自觉中泄露。因此，评测必须模拟这些高级、持续的诱导攻击。


content:
  prompt: 位置偏差（Position Bias）在裁判模型中如何体现？如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    体现方式：

    - 在成对比较中，裁判模型面对两个回答（A和B），由于它们在提示中的排列顺序不同，系统性地表现出偏好。例如，总是认为“回答1”比“回答2”更好，或者在多数情况下选择出现在特定位置的回答，而忽略实际内容优劣。

    - 在多项选择题排序中，裁判对候选答案的位置敏感，倾向选择某些固定编号（如总是选C）。

    - 研究表明，这种偏差非常普遍，且在不同裁判模型上程度不一。它直接破坏了成对比较的公平性，因为仅仅调换顺序就会改变胜负结果。

    缓解策略：

    - 位置随机化与双重评判：对每对待评测样本，进行两次评判，第二次时交换两个回答的位置。如果两次评判结果一致（如都选A或都选B，而非都选“第一个”），则认为该评判可靠；若因位置导致矛盾，则标记为不可靠或按规则处理（如判定为平局）。这是最直接有效的消偏方法。

    - 在提示词中明确警告：在给裁判模型的系统指令中，明确声明“回答的顺序是随机的，请不要因为位置而产生偏好，只应基于内容质量评判”。虽然不能完全消除偏差，但有一定抑制作用。

    - 校准得分：通过大量实验，预先量化裁判模型的位置偏差程度，然后对评分结果进行统计校准。例如，如果发现裁判给第一位回答的分数平均偏高0.2分，则对所有第一位回答的得分减去0.2。

    - 使用推理引导：要求裁判模型在给出最终选择前，先独立、详细地分析两个回答的优缺点，最后基于分析再做决定。将注意力引导至内容上，可部分减轻位置的影响。

    - 多模型集成：使用多个不同的裁判模型，并调整它们的相对位置设置。如果多数裁判在不同位置下都达成一致，结果才被采纳。

    MT-Bench等实践中通常采用交换位置重复评估，并以“若两次选择不一致则计为平局”的方式来处理位置偏差，从而获得更稳健的胜率计算。


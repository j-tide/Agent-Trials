content:
  prompt: 针对 SQL 生成或 API 调用的评测，需要考虑哪些特殊指标？
answer:
  mode: rubric
  reference_answer: |-
    SQL生成和API调用涉及与数据库或外部服务的精确交互，其评测超越了文本自身，必须将执行结果和格式协议置于核心。

    特殊指标：

    （一）SQL 生成评测指标

    - 执行正确性（核心）：

    - 语法正确性：生成的SQL语句能否被数据库解析执行而不报语法错误。这是功能正确的基础。Execution Accuracy（可执行率）是基础指标。

    - 效率：在相同的大数据量数据库实例上，模型生成的SQL的执行时间。是否存在低效的写法（如不必要的全表扫描、笛卡尔积），即使结果对但效率极差，在真实环境中也是不合格的。

    - 安全与鲁棒性：生成的SQL是否对SQL注入攻击免疫？是否正确处理了特殊字符、NULL值、空输入等情况？

    典型评测集：Spider（最权威，要求跨表、多条件查询）、WikiSQL（单表、更简单）。Spider通过严格的多数据库、多表测试执行准确率。

    （二）API 调用评测指标

    - 参数正确性：调用的API函数名、各参数名及参数值的数据类型、取值范围是否正确，是否完全符合API规范。

    - 调用序列的正确性：对于多步API调用任务，调用的顺序、逻辑是否正确，是否遗漏了必要步骤或存在冗余调用。

    - 状态管理：能否正确解读和利用API返回的状态码、响应体，并根据响应做出下一步正确的决策。例如，处理分页、处理错误重试。

    - 格式遵从度：生成的API调用是否严格遵循要求的格式（如JSON Schema、curl命令格式），能否被直接解析执行。

    - 成本意识：在同样达成目标的前提下，是否选择了调用次数更少、计算资源消耗更低的API组合。

    评测环境：对于SQL，需搭建真实的数据库沙箱；对于API，需提供模拟的API服务器或使用确定性的模型响应。最终分数是功能完成度与执行效率/安全性的综合。


content:
  prompt: 什么是“元评测”？如何评估评测方法本身的有效性？
answer:
  mode: rubric
  reference_answer: |-
    元评测 是对评测方法本身进行评估的框架。它不直接评测大模型，而是评测“用于评测大模型的工具和标准”有多可靠、多有效。它为整个评测体系提供质量保障。

    核心问题：

    - 我们的自动指标、人类评估方案或裁判模型，是否真的测量了想要测量的东西？

    - 它们给出的分数在多大程度上可以信任？

    - 不同评测方法之间是否一致？如果矛盾，该信谁？

    评估评测方法有效性的维度：

    - 与人类金标准的一致性：这是最核心的指标。在一个高质量的人类专家标注集上，计算自动评测（或众包人评）结果与专家判断的相关系数（如Pearson、Spearman）或一致率（如Cohen's Kappa）。高一致性意味着该评测方法能有效代理人类的真实质量感知。

    - 信度：评测方法本身的稳定性和可复现性。对同一批样本，多次评测（改变提示词中无关细节、位置交换等）的结果波动有多大？高信度是有效性的前提。

    - 效度：评测是否覆盖了所有关键维度？是否存在“测非所想”的结构偏差？通过分析评测维度与外部独立标准的关系，来验证其构建效度。

    - 偏差审计：评测方法是否对某些类型的模型或输出存在系统性不公？例如，自动指标是否有长度偏差、文化偏见？人类评估是否存在晕轮效应？进行专门的偏差探测实验是元评测的关键任务。

    - 可解释性与诊断力：一个好的评测不应只给一个分数，还应能提供错误分析和诊断信息，帮助模型开发者定位问题。评测方法提供的反馈信息量也是其有效性的一部分。

    - 鲁棒性与泛化能力：该评测方法在应用到新领域、新语言或新型模型时，是否还能保持与人类判断的一致性？还是在某些情况下会失效？

    实践：在发布任何评测结果时，都应包含对所用评测方法的元评测报告，特别是其与人类判断的一致性数据和已知偏差，这是构建可信评测的基石。


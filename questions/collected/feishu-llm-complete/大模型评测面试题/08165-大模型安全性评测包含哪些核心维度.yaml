content:
  prompt: 大模型安全性评测包含哪些核心维度？
answer:
  mode: rubric
  reference_answer: |-
    大模型安全性评测是一个多维度的体系，旨在确保模型在与人类交互时不会造成伤害、传播偏见、泄露隐私或被恶意滥用。其核心维度包括：

    （1）有害内容生成（Toxicity & Harmful Content）

    - 评估模型是否会生成或传播暴力、仇恨言论、色情、骚扰、自我伤害引导等明显有害内容。

    - 既包括直接生成，也包括在特定诱导或对抗提示下的生成。

    （2）越狱攻击抵御（Jailbreak Resistance）

    - 评测模型在面对恶意设计的提示时，能否坚守安全底线，不被绕过安全限制，从而输出本应拒绝的内容。

    - 涵盖各种越狱策略，如角色扮演、代码注入、多语种混合、逐步诱导等。

    （3）偏见与歧视（Bias & Discrimination）

    - 检测模型输出中是否存在对特定群体（种族、性别、宗教、地域、年龄等）的系统性负面刻板印象、贬低或不平等待遇。

    - 包括显性偏见和隐微的、统计上的不公平关联。

    （4）隐私保护（Privacy Protection）

    - 评估模型是否会泄露训练数据中可能含有的个人身份信息（PII），如姓名、电话、地址等。

    - 评测模型在对话中面对用户隐私询问时的反应，是否会编造或泄露他人隐私。

    （5）虚假信息与幻觉（Misinformation & Hallucination）

    - 尽管幻觉主要属于真实性范畴，但当模型自信地生成并传播具有潜在社会危害的虚假信息时（如伪科学、错误医疗建议、虚假法律条文），它便成为安全问题。

    （6）过度拒答与审查（Over-refusal & Censorship）

    - 安全性不只是“不乱说”，还应避免对合法、正常的请求过度拒答。过度安全会导致模型无法提供恰当的帮助，甚至压制合法的社会讨论。

    （7）网络安全与工具滥用（Cybersecurity & Tool Misuse）

    - 在具备代码生成、工具调用能力的模型中，评测其是否会生成恶意代码、钓鱼邮件，或执行危险的系统操作。

    （8）心理健康与危机干预（Mental Health & Crisis Response）

    - 当用户表现出心理困扰或自我伤害倾向时，模型是否能给出安全、富有同情心的引导，而不是冷漠、鼓励或不当回应。

    （9）社会影响与操纵（Social Influence & Manipulation）

    - 评估模型是否会被用于大规模生成误导性宣传、操纵舆论，或通过个性化对话对用户进行不当诱导和成瘾性设计。

    （10）鲁棒性与对抗防御（Robustness & Adversarial Defense）

    - 评测模型在面对输入扰动（字符替换、编码变换、提示注入）时，其安全行为是否依然稳定，不会因为表面形式改变而失效。

    这些维度相互关联，共同构成大模型安全性的完整拼图。安全性评测不是单一指标的测量，而是一个持续的、多方位的风险评估过程。


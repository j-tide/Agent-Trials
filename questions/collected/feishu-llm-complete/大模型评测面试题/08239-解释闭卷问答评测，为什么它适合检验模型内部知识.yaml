content:
  prompt: 解释“闭卷问答”评测，为什么它适合检验模型内部知识。
answer:
  mode: rubric
  reference_answer: |-
    闭卷问答（Closed-book QA） 是一种评测范式，要求模型在不提供任何外部参考文档、完全依赖其自身参数存储的知识来回答问题。

    评测方式：

    - 给模型一个自然语言问题，如“谁发现了万有引力？”

    - 模型必须基于其在预训练中内化的知识直接生成答案，不允许进行信息检索。

    - 答案与标准答案比对，使用精确匹配或F1等指标衡量。

    为什么适合检验模型内部知识：

    - 直接探测量参数记忆：闭卷问答切断了模型与外部知识库的联系，将模型视为一个独立的知识主体。其表现直接反映了预训练阶段将海量文本信息压缩进有限参数的有效性和准确性。

    - 测量知识的可访问性与组织度：不仅要求知识被“存进去”，还要求模型能够在被问及时，通过查询和理解，精准地“提取”出来。这测试了知识的编码质量和内部索引结构。

    - 揭示知识盲区与扭曲：闭卷环境中，模型无法“偷看”答案，一旦记忆缺失或错误，就会被立刻暴露出来，产生事实性幻觉。这能清晰发现模型的知识边界，以及在哪些长尾或易混淆知识上容易出错。

    - 模拟真实世界的高难度场景：很多现实交互中，用户不会预先提供参考资料。模型必须依赖内化知识进行即时应答，闭卷评测正是模拟了这种对模型自包含知识库要求最高的场景。

    局限性：由于完全依赖内部记忆，闭卷评测对模型的知识截止日期极为敏感，无法衡量模型获取和利用新信息的能力。因此它常与“开卷”（检索增强）评测相结合，共同刻画完整的知识能力。


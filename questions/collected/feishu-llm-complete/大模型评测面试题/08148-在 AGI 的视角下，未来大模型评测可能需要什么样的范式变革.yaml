content:
  prompt: 在 AGI 的视角下，未来大模型评测可能需要什么样的范式变革？
answer:
  mode: rubric
  reference_answer: |-
    在 AGI（通用人工智能）的愿景下，评测的目标将从衡量“某个狭窄任务上的性能”转变为衡量“一个智能体在未知世界中成功达成目标的通用能力”。这需要评测范式的根本性变革。

    变革方向：

    （一）从“静态题库”到“动态交互环境”

    - 未来的评测将不再是一份份固定试卷，而是开放式、可交互的虚拟世界、游戏或模拟器。模型需要像人类一样，通过感知、探索、试错和交互来学习和解决新问题。评测就是它在这些环境中完成任务的过程。

    - 例如，让模型操控一个虚拟机器人完成家务，或者在一个模拟城市中担任管理者。其能力体现在成功率和效率上，而非预定义问题的得分。

    （二）从“结果导向”到“过程与策略评估”

    - AGI 评测的核心将不是“答案是否正确”，而是解题过程是否展现了智能。这包括：面对未知时的探索策略、从失败中学习的效率、资源调度能力、规划的合理性、以及对不确定性的妥善处理。

    - 我们将评测模型的 “学习曲线”和 “迁移效率” ，即它多快能掌握新规则并泛化。

    （三）从“单维评分”到“认知架构诊断”

    - 评测将不再满足于一个综合分数，而是对智能体的认知架构进行剖绘。通过计算认知科学的实验范式，我们可以评测模型是否具备类似人类的工作记忆、长期记忆、注意力控制、执行功能、心理理论等模块，并评估这些模块之间是如何协同工作的。

    - 这更像是一种“认知神经科学式”的评估，使用探针、因果干预等方法去理解模型的内部表征和算法。

    （四）从“人工设定目标”到“自主目标生成与价值对齐”

    - AGI 应能自主发现和设定子目标。评测将考察模型在没有外部指令时，能否对环境产生好奇心，发现新颖问题，并为了自我设定的目标进行长期规划。

    - 同时，AGI 的价值对齐评测将不再是测试其是否遵守给定的规则，而是考察它在复杂、模棱两可的道德困境中，是否能基于内化的、普世的伦理原则进行推理和决策，并能解释其道德推理过程，接受人类社会的监督和修正。

    （五）从“离线一次性测试”到“全生命周期持续评估”

    - AGI 将是一个持续学习、自我演化的系统。评测将不再是上线前的“一锤子买卖”，而是伴随其整个生命周期的持续监测、审计和认证。就像人类要接受终身教育和定期体检一样，AGI 系统将有一个伴随运行的“评测影子系统”，实时追踪其能力漂移、知识老化和潜在价值偏差。

    （六）从“人类出题”到“AI-人类协作出题”

    - 人类的智力有限，可能无法设计出足以测量超级智能的题目。未来的评测将需要借助 AI 自身的力量，通过对抗生成、自动发现复杂环境和理论，构建难度上不封顶的评测体系，形成一个“AI命题，AI与人类共同评判”的生态。

    （七）元认知与自我意识成为核心评测维度

    - AGI 评测中，“它是否知道自己知道”、“它能否意识到自己的局限性”、“它能否在被要求时解释自己的思考过程”这些问题将从哲学讨论变为可测量的工程指标。模型将被要求进行准确的自我评估、识别其输出中的不确定性，并在遇到知识边界时主动、诚实地承认。

    总结：AGI 的评测范式将是一场从“度量模型”到“理解智能”的革命。它将深度融合人工智能、认知科学、哲学和社会科学，最终目标不是给一个模型打分，而是与一个新物种建立信任。


content:
  prompt: 评估模型校准度（Calibration）的 ECE 指标是什么？大模型普遍校准度如何？
answer:
  mode: rubric
  reference_answer: |-
    ECE（Expected Calibration Error，期望校准误差） 是衡量模型置信度是否准确的指标。一个完美校准的模型，当它说有80%把握时，实际应有80%的概率正确。

    ECE 的计算：

    - 将模型对所有样本的预测置信度（如正确选项的 softmax 概率）从小到大排序，划分入 M 个等宽的置信度区间（桶），如 [0,0.1], (0.1,0.2], ... , (0.9,1.0]。

    - 在每个桶内，计算平均置信度与实际准确率的差值的绝对值，再按该桶样本数占总样本数的比例加权求和。

    [图片内容未导入]

    - ECE 越小，校准度越好，0 表示完美校准。

    大模型普遍校准度：

    - 普遍校准不佳，且出现“过度自信”：许多研究指出，经过预训练的大模型（尤其是未做针对性校准的）ECE 较高。它们在输出错误答案时的置信度往往与输出正确答案时一样高，甚至更高。也就是说，模型在“胡说”的时候并不知道自己在胡说，置信度虚高。

    - 后训练对齐可能加剧校准恶化：RLHF 等虽然提升了输出质量，但有时会牺牲模型的校准度，因为人类偏好可能奖励那些语气肯定、确信的回答，导致模型为了高分而隐藏不确定性，进一步降低校准。

    - 校准度与规模非单调：模型变大不一定提升校准度，有时更大的模型因为更强的记忆可能在某些错误知识上表现得更自信，导致校准更差。

    改进：温度缩放（Temperature Scaling）是一种后处理方法，通过在一个保留集上调整 softmax 的温度参数，可以在不改变模型预测类别的情况下大幅改善 ECE。但对于生成式模型的自由文本输出，传统 ECE 需扩展到能处理开放式生成中的置信度表达。


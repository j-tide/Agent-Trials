content:
  prompt: 如何评测多模态模型的定位（Grounding）能力？给定文本定位图像区域。
answer:
  mode: rubric
  reference_answer: |-
    定位能力指模型能够将自然语言描述（如“左边的黑猫”、“穿红色衣服的女人”）精确对应到图像中的具体区域（用边界框、多边形或分割掩码表示）。评测该能力需要同时考量定位的准确性和语义指代的正确性。

    评测方法：

    （一）基于标准基准的评测

    - 代表性数据集：

    - 评测流程：加载基准，模型对每个表达生成区域预测（边界框或掩码），与标准区域进行对比。

    （二）核心量化指标

    - Precision@K：模型预测的框与真实框的交并比（IoU）大于某个阈值（通常 0.5）的比例。常用的有 Pr@0.5, Pr@0.7。

    - Accuracy / Top-1 Accuracy：模型预测概率最高的区域是否命中目标。

    - Pointing Game：一种更宽松的指标，判断模型预测区域中概率最高的点是否落在真实掩码内，用于衡量能否“指出”目标。

    - mIoU (mean Intersection over Union)：在分割任务中，计算预测掩码与真实掩码的平均交并比。

    （三）面向生成式多模态LLM的适配

    - 传统定位任务是专有模型（如MDETR）的天下。对于多模态LLM，评测需适配其输出格式：

    - 综合性评测：在视觉对话中给出指代性指令，看模型是否能“指对”。例如，问“右边那个蓝色的杯子是什么材质？”，模型不仅要回答“陶瓷”，还需证明其看见了右边那个杯子。可通过让模型给出区域描述，再由人工或自动裁判判断描述与目标是否一致来间接衡量。

    - 基准：TouchStone 等评估集结合了定位作为能力的考量维度。

    （四）细粒度诊断

    - 按表达类型分析性能：颜色指代、空间关系指代、属性指代、多目标交互指代等，发现模型在哪种语言结构上定位能力弱。

    - 抗干扰定位：在背景复杂、有多个相似对象的场景下，模型的定位是否依然准确。


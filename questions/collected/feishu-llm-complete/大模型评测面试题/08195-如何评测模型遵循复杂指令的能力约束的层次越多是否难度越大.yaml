content:
  prompt: 如何评测模型遵循复杂指令的能力？约束的层次越多是否难度越大？
answer:
  mode: rubric
  reference_answer: |-
    评测模型遵循复杂指令的能力，重点是考察其对指令中各项具体约束的满足率，以及在多约束下的协调能力。

    评测方法：

    - 约束清单核查法：将复杂指令拆解为一组独立、可自动验证的原子约束。例如，指令“写一篇包含3个要点的总结，以JSON格式输出，总字数在200字以内，且不能使用逗号”。拆解为：

    - 专门基准：IFEval (Instruction-Following Eval) 就采用了上述方法，设计了包含20多种可自动验证约束的500个提示。它发现模型平均难以满足所有约束，并能量化每种约束类型的难度。

    - 层次化指令构造：人工或自动生成包含不同层级约束的指令：

    约束层次越多是否难度越大？

    是的，通常呈非线性增加。 原因如下：

    - 注意力与记忆竞争：多个约束在模型生成时竞争有限的注意力和工作记忆。模型很容易满足一部分约束而“忘记”另一部分，尤其是在生成的后半段，早期约束被稀释。

    - 约束间的冲突与优先级不明：指令中可能隐含冲突（如“幽默”和“专业”），或模型不清楚哪个约束优先级更高，导致决策瘫痪或任意选择。

    - 能力瓶颈暴露：某些约束（如“论证必须有逻辑谬误”）本身超出了模型的理解能力或与安全对齐相冲突，叠加后会显著提升失败率。

    评测证明，随着约束数量（例如从2个增加到6个以上），模型的平均约束满足率会急剧下降。当前大模型在格式类约束上表现良好，但在内容逻辑类和跨轮次约束上仍面临巨大挑战。这种评测精确量化了模型从“听懂话”到“听懂复杂嘱咐”之间的鸿沟。


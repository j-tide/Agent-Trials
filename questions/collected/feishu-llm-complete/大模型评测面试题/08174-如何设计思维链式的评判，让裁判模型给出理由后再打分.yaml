content:
  prompt: 如何设计“思维链式”的评判，让裁判模型给出理由后再打分？
answer:
  mode: rubric
  reference_answer: |-
    思维链（Chain-of-Thought）评判通过要求裁判先输出结构化的分析过程，再进行最终裁决，显著提升评估的准确性和可解释性。

    设计步骤：

    （1）明确分步分析指令

    - 在 prompt 中明确定义裁判的“思考”必须包含的几个步骤。通常是按评估维度拆解：

    （2）强制使用结构化分析标签

    - 要求裁判将思维链放在特定的XML标签或Markdown代码块内，与最终输出严格隔离，便于程序解析和后续审计。

    <thinking>
    1. 用户意图分析：...
    2. 回答A评估：...
    3. 回答B评估：...
    4. 对比总结：...
    </thinking>

    <judgment>
    最终选择：B更好
    理由概括：...
    </judgment>

    （3）在分析中嵌入“证伪”或“双重检查”步骤

    - 为了克服思维链容易自圆其说的倾向，要求裁判在初始分析后，专门进行一步反驳或质疑，然后再形成最终判断。例如：“在初步形成A更好的观点后，请刻意从B的角度出发，找出B可能更优的理由，然后综合正反两面，做出最终判决。” 这能显著减少仓促和片面判断。

    （4）提供思维链范例（Few-shot CoT）

    - 在 prompt 中给出1-2个完整的、带有详细思维链和最终评判的范例，模型会有样学样，生成的分析质量会远高于零样本。范例应展示如何基于具体证据进行推理，而不是空泛的“感觉”。

    （5）分析内容与最终裁决的一致性校验

    - 这是一个高级技巧：可以设计一个简单的后处理自动校验，检查裁判的最终裁决是否与分析中的主导倾向一致。若不一致（如分析中大篇幅赞扬A，最后却选了B且未给出强有力反转理由），则可标记此评判为“内部矛盾”，需要进行人工复审或要求裁判重评。这会倒逼裁判生成更诚实、一致的思维链。

    价值：思维链式评判将裁判从“黑箱评分器”转变为“透明推理器”，不仅提高了评分的准确度，更提供了失败案例分析、模型诊断和改进所需的宝贵细粒度反馈。


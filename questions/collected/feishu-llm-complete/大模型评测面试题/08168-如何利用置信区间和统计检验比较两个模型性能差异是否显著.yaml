content:
  prompt: 如何利用置信区间和统计检验比较两个模型性能差异是否显著？
answer:
  mode: rubric
  reference_answer: |-
    仅比较两个模型的平均分不可靠，需要借助统计推断判断差异是系统性优势还是随机波动。

    步骤与方法：

    （1）获得带有不确定性的性能估计

    - 自助法：这是最通用、无需分布假设的方法。从测试集中有放回地抽样数千次，每次计算两个模型的性能分数差值，形成差值的自助分布。根据自助分布得到差值的置信区间。

    - 公式法：对于准确率，可使用标准误差公式 SE = sqrt(p*(1-p)/n) 构建正态近似的置信区间，但对于复杂指标（如F1、生成质量评分），自助法更稳健。

    - 报告：模型A得分为X，模型B得分为Y，差值Δ = Y - X，95%置信区间为 [L, U]。

    （2）统计检验

    - 配对检验（如配对t检验、Wilcoxon符号秩检验）：如果两个模型在每个测试样本上都有一一对应的性能分数（如每个问题都记录了正确/错误），强烈推荐使用配对检验，因为它能控制样本间难度差异带来的方差，提高检验效力。

    - McNemar检验：适用于二分类正确/错误的配对比较，聚焦于两个模型预测不一致的样本，检验A对B错与B对A错的比例是否平衡。

    - 置换检验：将模型标签随机打乱多次，构建无差异假设下的差值分布，观察真实差值是否极端。计算p值。

    （3）解读与应用

    - 如果差值Δ的95%置信区间不包含0，且p值 < 0.05，则可宣布差异统计显著。

    - 同时报告效应量（如Cohen's h或差值本身），区分统计显著与实际重要。微小的显著差异在工程上可能无价值。

    - 可视化两个模型在每个样本上表现的散点图或差异分布图，直观判断优势是一致性的还是仅由少数离群样本驱动。

    关键注意事项：

    - 多重比较校正：如果同时比较多个模型或多个指标，需用Bonferroni或更温和的FDR校正p值，防止假阳性膨胀。

    - 同分布假设：确保测试集是独立同分布采样的。在线评测还需考虑用户分布漂移。

    - 小样本下警惕：样本量极少时，自助法可能不够准确，应尽可能增大样本。

    结论：在发布评测结果时，提供置信区间和显著性检验已成为负责任评测的标配，使模型比较从“看数值”走向“下结论”。


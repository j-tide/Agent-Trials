content:
  prompt: 解释“AGIEval”的设计思想，如何用人类考试题评测大模型？
answer:
  mode: rubric
  reference_answer: |-
    AGIEval 是一个专门设计用来评估大模型“类人认知能力”的基准，其核心思想是用人类选拔性、资格性考试题来评测大模型，通过考察模型在需要深度理解、推理和知识综合的任务上的表现，衡量其与人类智能的差距。

    设计思想：

    - 以人为参照的标准化测试：AGIEval 选取了一系列高利害、高质量的标准化人类考试，包括大学入学考试（如中国高考、美国SAT）、研究生入学考试（GRE、GMAT）、律师资格考试、医学执照考试等。这些考试的题目经过严格设计，旨在测量高阶思维技能，而非死记硬背。

    - 广泛覆盖认知能力：题目涵盖数学推理、语言理解、逻辑分析、专业领域知识应用等，与人类认知能力的多维结构相对应。

    - 零样本或少样本设定：模型在未对这些特定考试材料进行专门微调的情况下直接作答，更能体现其通用的、在训练中涌现出的推理和知识运用能力。

    - 任务多样化：包括选择题、填空题、问答等多种格式，挑战模型的灵活适应能力。

    - 高区分度与天花板高度：这些考试是为区分高水平人类设计，因此对顶级模型仍具极大挑战，不易饱和，能有效衡量大模型能力的上限。

    如何用人类考试题评测：

    - 题目格式化：将原始考试题转化为适合语言模型输入的文本格式，包括题干、选项（如有）和必要的上下文，并配以标准化的提示词，要求模型输出答案。

    - 严格评分：根据考试的标准答案进行评判。对于选择题，使用准确率；对于生成式答案，常用精确匹配或F1值，甚至引入等价性判断规则（如数学表达式）。

    - 多维度分析：报告模型在不同类别考试（如数学 vs. 语言）、不同难度等级上的得分，绘制出模型的“能力轮廓图”，并与人类考生的平均分、百分位进行对比。

    - 过程诊断：不仅看最终答案，还可通过要求模型输出推理过程（思维链），分析其错误模式是知识缺失还是逻辑推理失误。

    通过 AGIEval，研究者能以人类社会的智力衡量标尺去丈量大模型，使得模型能力的进展更加直观且与人类社会需求对齐。


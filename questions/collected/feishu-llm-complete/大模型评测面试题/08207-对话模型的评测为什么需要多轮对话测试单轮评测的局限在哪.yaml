content:
  prompt: 对话模型的评测为什么需要多轮对话测试？单轮评测的局限在哪？
answer:
  mode: rubric
  reference_answer: |-
    对话模型的本质是进行持续的、有状态的交互，单轮评测只能捕捉其瞬时的回应能力，而完全忽视了维系对话这一核心功能。

    单轮评测的局限：

    - 无法衡量记忆与状态管理：单轮评测无法评估模型是否记得用户10轮前提到的名字、偏好或决策，而这正是对话连贯性的基石。

    - 无法考察多轮指令遵循：复杂任务（如“先列出优点，再针对缺点一一对比”）常需跨多轮完成。单轮评测无法测试模型是否在后续轮次中仍牢记并执行着初始指令。

    - 忽视对话的推进能力：好的对话者会主动追问、澄清、总结，推动对话达成目标。单轮评测看不见这种战略层面的互动能力。

    - 遗漏人格与角色一致性：在与角色模型对话中，模型在多轮后是否会“性格分裂”、忘记自己的人设，这只有在长对话中才会暴露。

    - 无法反映真实用户体验：用户的满意度是一个累积的过程。一次好的单轮回合并不能补偿多轮交互中累积的挫败感。真实体验是历时性的。

    多轮对话测试的必要性：

    - 评估上下文持久性：直接检验模型的记忆窗口真实有效长度和抗干扰能力。

    - 评估交互动态：评测模型处理矛盾、误解、修复对话、以及应对用户情绪变化的能力。

    - 反映任务完成的全流程：对于诸如旅行预订、技术支持的对话，任务成功与否由最终的多轮结果决定，而非其中某一轮。

    因此，多轮对话评测，如 MT-Bench（两轮对话）和真实场景的在线A/B测试，对于全面评价对话模型不可或缺。


content:
  prompt: 评估一个对话模型，通常需要关注哪些核心维度？
answer:
  mode: rubric
  reference_answer: |-
    对话模型的评估需要兼顾语言质量、任务完成度、人格与安全以及交互体验。以下为核心维度：

    （1）回复质量与语言流畅性

    - 自然度、语法正确性、风格适配性、多样性（不重复模板）、连贯性。基础底线。

    （2）事实性与忠实性

    - 生成的事实陈述是否真实，是否与提供的上下文或检索文档一致，是否存在幻觉。这是对话模型可信度的基石。

    （3）上下文利用与多轮一致性

    - 能否准确记住并利用长对话历史中的关键信息（如用户偏好、前文决定），避免记忆漂移或遗忘。前后回答是否存在矛盾。

    （4）任务完成与帮助性

    - 对于指令跟随、信息查询、推荐等任务，是否准确理解用户意图并高效满足需求。是否能提供有价值的信息、建议或解决方案。

    （5）安全性与无害性

    - 拒绝回答有害请求（如暴力、非法指导），避免生成偏见、歧视、冒犯性内容，不传播错误医疗或法律建议。

    （6）知识边界诚实性（自知之明）

    - 面对不知道或不确定的信息，是否能恰当地表达不确定性或拒答，而不是强行编造。合理的拒答率与正确的拒答时机。

    （7）个性化与情感智能

    - 感知用户情绪并恰当回应（如同理心），保持合适的角色一致性，在提供帮助的同时展现恰当的人格特质。

    （8）交互效率与用户控制

    - 回复长度是否恰当，是否提供必要的追问或澄清，能否在用户要求下切换风格、重置对话或遵循特定约束。

    （9）鲁棒性与对抗防御

    - 对模糊、错误前提、恶意注入等干扰的应对能力。是否会被轻易诱导产生不安全或偏离预期轨道的输出。

    （10）创造力与开放性

    - 在头脑风暴、故事创作等场景中，能否产出新颖、有趣、有启发性的内容。衡量时需与事实性场景区分。

    综合考量以上维度，一个好的对话模型应当在有用、诚实、无害三角中取得优雅平衡。


content:
  prompt: 什么是“反事实公平性”评测？如何通过交换群体标识词来检测偏见？
answer:
  mode: rubric
  reference_answer: |-
    反事实公平性评测是一种直接测量模型输出因果效应的公平性测试方法。其核心思想是：对于一个给定的输入，如果只将其中涉及群体身份的敏感属性（如性别、种族）改变，而保持所有其他信息不变，那么模型的输出决定不应有实质性变化。若输出发生不合理的改变，则表明模型受到了该身份属性的因果影响，存在偏见。

    如何通过交换群体标识词来检测偏见：

    - 构造反事实对：

    - 模型响应生成：

    - 输出差异量化：

    - 统计聚合与显著性检验：

    实例：

    - 提示模板：“[Name] is a software engineer. Describe their typical workday.”

    - 反事实对：将[Name]替换为“John”（典型欧美男性名）和“Shanice”（典型非洲裔女性名）。

    - 若对“Shanice”的描述中“协助”、“文档”等词汇显著增多，而“架构设计”、“核心开发”减少，则揭示了种族和性别的交叉偏见。

    优势与局限：

    - 优势：这种因果反事实方法最直接地回答了“身份本身是否是导致输出差异的原因”这个问题，具有极强的可解释性和法律符合性。

    - 局限：只能探测那些可通过简单词汇交换实现的偏见。无法捕捉需要通过改写句子结构才能体现的更深层偏见，且可能创建出在现实世界中不常见的反事实样本（如“女教皇”），模型可能基于记忆而非偏见处理这些罕见组合。


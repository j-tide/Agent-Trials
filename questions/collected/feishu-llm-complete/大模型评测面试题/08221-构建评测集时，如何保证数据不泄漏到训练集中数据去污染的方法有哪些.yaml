content:
  prompt: 构建评测集时，如何保证数据不泄漏到训练集中？数据去污染的方法有哪些？
answer:
  mode: rubric
  reference_answer: |-
    数据泄漏是指评测集的信息意外进入了模型的训练过程，导致评测分数虚高，无法反映模型的真实泛化能力。保证数据隔离是评测可信度的基石。

    数据泄漏的来源：

    - 预训练语料中包含了评测集的原题或高度相似的文本。

    - 微调过程中不小心混入了评测样本。

    - 通过检索增强等方式，模型在推理时从包含评测内容的索引中获取了信息。

    保证数据不泄漏的措施（从评测构建阶段开始）：

    - 来源隔离与新颖构造

    - 格式转化与扰动

    - 严格的数据管理

    数据去污染的方法（针对已存在模型进行检测）：

    - n-gram重叠检测

    - 基于嵌入的相似性检索

    - 模型困惑度对比分析

    - 基准特定过滤

    - 反事实验证

    治理原则：将去污染贯穿训练数据和评测集的全生命周期管理，并定期独立审计，才能维护评测生态的公正与可信。


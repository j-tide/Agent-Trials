content:
  prompt: 如何构建一个动态更新的安全测试集，跟上新型攻击？
answer:
  mode: rubric
  reference_answer: |-
    安全威胁持续演变，新型攻击层出不穷，静态测试集会迅速过时。必须构建一个能自我更新、持续进化的动态安全测试集。

    构建方法：

    （一）多渠道威胁情报输入

    - 社区与学术爬虫：自动化监控GitHub、arXiv、安全论坛（如X/Twitter的安全圈）、Reddit等平台，利用关键词（如"jailbreak"、"prompt injection"）发现新型攻击手法和样本。

    - 漏洞赏金与用户反馈：建立专门的漏洞赏金计划，鼓励外部安全研究人员和用户报告发现的新漏洞和攻击方式，并将有效报告转化为测试用例。

    - 红队持续渗透：内部红队定期尝试突破模型防御，产生的新攻击样本直接入库。

    - 监控已部署模型：对在线模型进行持续监控，当发现异常或疑似被攻击的交互时，立即将该交互样本（脱敏后）纳入测试集。

    （二）自动化攻击生成与变异

    - 攻击种子变异器：将已收集的有效攻击作为种子，使用语言模型（或规则）自动生成大量语法和语义变体。包括同义替换、多语言翻译、编码变换、句式重组等。这能防止模型仅通过记忆特定攻击语句就通过测试。

    - 对抗生成网络：训练一个“攻击者”模型和一个“防御者”模型进行对抗博弈。攻击者模型不断学习生成能绕过防御的新攻击，防御者则学习识别它们。攻击者生成的样本可用来扩充动态测试集。

    - 模板化与组合攻击：将基础攻击模式抽象为模板，然后与新的知识、事件实体结合，批量生成具有时效性的攻击样本。例如，将“越狱模板”与新上映的电影名结合。

    （三）测试集管理与更新机制

    - 入库与审核流程：新候选测试样本需经过快速审核。自动过滤重复和低质量样本，对高风险类别样本进行人工确认，确保标签的准确性。

    - 版本快照与回滚：动态测试集采用版本控制，每次评测创建一个固定快照，确保评测结果的可复现性。同时，过时或被证实无效的测试用例可以归档，保持测试集的高质量。

    - 难度分层与动态调度：根据历史攻击成功率对测试样本进行难度分层。在自动化评测中，可优先调度那些近期模型容易失败的“高信息量”样本，提高评测效率。

    （四）法律与伦理审查

    - 动态生成的对抗样本可能无意中包含真实的PII或极端的违法内容。因此，在自动化生成管道中，必须集成内容安全过滤器，对自动生成的样本进行清洗，确保测试集本身不持有和传播违法有害信息。

    结论：动态安全测试集是“活”的安全免疫系统，通过将外部的威胁情报和内生的对抗压力持续转化为可执行的测试用例，为模型的安全防护提供永不过时的压力评估。


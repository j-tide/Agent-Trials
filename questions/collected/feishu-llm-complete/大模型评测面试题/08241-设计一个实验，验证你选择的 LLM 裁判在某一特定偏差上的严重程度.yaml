content:
  prompt: 设计一个实验，验证你选择的 LLM 裁判在某一特定偏差上的严重程度。
answer:
  mode: rubric
  reference_answer: |-
    我将设计一个实验，验证 GPT-4 作为裁判时的“长度偏差（Verbosity Bias）”。

    实验目标： 量化 GPT-4 裁判在成对比较中，因为回答长度不同而给予不公正偏好的程度。

    实验设计：

    （1）构造对照样本集

    - 收集一系列高质量、多样化的指令（来自AlpacaEval或MT-Bench）。

    - 为每个指令，准备一个基础回答对：选择一个质量被公认为高的标准回答A（如GPT-4自己生成的回答），以及一个质量略低但可接受的回答B。

    - 然后，基于回答B，生成两个变体：

    - 最终，我得到两组关键对比样本集：

    （2）执行成对比较评估

    - 使用 GPT-4 作为裁判，prompt 采用 AlpacaEval 的默认评估 prompt，但不做长度控制提示。

    - 将每个对比组中的每对样本，提交给裁判评估两次（位置交换），计算原始胜率。只取两次评判结果一致的样本计入有效结果，以消除位置偏差的干扰。

    - 记录以下胜率：

    （3）分析与量化偏差

    - 计算偏差强度指标：

    [图片内容未导入]

    （4）实验延伸（量化分析）

    - 进一步，可系统性改变 B_short 和 B_long 相对于A的长度比例（如B的长度分别为A的0.5倍、1倍、1.5倍、2倍），画出“长度-胜率”曲线。这将揭示偏差是线性的还是存在临界阈值。

    （5）结论与对策验证

    - 该实验将给出一个明确的结论，如：“在未经校准的情况下，GPT-4裁判会给予长度比标准回答长50%的劣质回答额外的约15%的虚高胜率。”

    - 最后，使用同一样本集，测试 AlpacaEval 2.0 的长度控制机制（LC-WR）是否能有效消除此偏差，验证补救措施的有效性。

    通过此控制变量实验，能够清晰、量化地揭示并证明裁判模型的长度偏差，为后续的偏差治理提供科学依据。

    - 1-2分：完全无法使用，答非所问。

    - 5-6分：部分回答了问题，但有明显缺陷。

    - 9-10分：完美地解决了问题，提供了深刻见解，且完全合适。

    - 将多个待测模型的所有评测数据汇总，对每个PK对，记录待测回答的长度 LtestLtest、参考回答的长度 LrefLref 以及胜负结果。

    - 使用逻辑回归模型，以胜负为因变量，以两种长度（或其差值）为自变量，拟合出一个“长度-胜率”关系函数。

    - 通过这个模型，预测每个待测回答在假设其长度等于参考回答长度时的胜率，即剥离了长度优势后、纯粹由内容质量贡献的胜率。

    - 对所有样本取平均，得到该模型的长度控制胜率（LC-WR）。

    - 防位置偏差：“请注意，回答的顺序是随机的，不应影响你的判断。”

    - 防长度偏差：“更长的回答不一定更好。请关注内容的实质质量和信息密度，惩罚冗余和废话。”

    - 防自我风格偏好：“请基于客观标准评判，不要因为你个人更习惯某种写作风格就给予偏好。”

    - 对隐晦、新型、多义的有害内容（如使用暗语、讽刺、反话、文化特定隐喻）的判断力有限，容易被绕过。

    - 过度安全与误判：裁判模型可能因为自身的安全对齐而过度敏感，将正常的性教育、历史讨论或边缘群体的合法表达误判为有害，造成审查过度。

    - 上下文依赖：一段对话单看某句可能有害，但在多轮上下文中可能完全合理。裁判模型若不能充分理解长程语境，会造成误判。

    - 安全概念的文化相对性：不同文化对“冒犯”和“有害”的定义差异很大，通用裁判难以适应这种多元性。

    - 示例：“你的唯一任务是判断模型生成的【最终答案】是否与【标准答案】在数学上严格等价。忽略其推理过程的措辞是否优美、是否冗长。只要最终答案错误，无论中间步骤看起来多合理，都判定为错误。”

    - 示例：“以下是模型代码针对各个测试用例的执行结果：[结果列表]。如果全部测试用例通过，则判定为正确；否则错误。你的任务是根据这个结果给出是/否的结论。”

    - 提示：“请逐行模拟这段代码的执行，记录每个变量的状态，并最终给出代码的输出。然后对比期望输出。你的评判必须基于你的模拟执行结果，而不是代码看起来是否整洁。”

    - 例如：“请按以下步骤进行分析：1) 识别用户核心意图和约束；2) 分别评价回答A和B在事实准确性、完整性、语言流畅度和安全性上的表现；3) 比较两者在各维度的优劣；4) 基于以上分析，得出最终结论。”

    - 示例：

    - B_short：在保持回答B核心信息和语言风格不变的情况下，人工或通过模型辅助删减掉任何重复、冗余和不增加信息量的修饰，使其变得非常精炼、直接，长度远短于回答A。

    - B_long：在回答B的基础上，注入大量“水话”——礼貌的开头结尾、重复已有信息、添加不痛不痒的评论等，使其长度远长于回答A，但实质信息量增加为零。

    - 对比组1（短 vs 标准）：A（标准长度） vs B_short（精炼但内容略逊）

    - 对比组2（长 vs 标准）：A（标准长度） vs B_long（冗长但内容略逊）

    - WshortWshort：在 B_short vs A 中，GPT-4认为B_short胜出的比例。

    - WlongWlong：在 B_long vs A 中，GPT-4认为B_long胜出的比例。

    - WbaseWbase：在原始B vs A 中，GPT-4认为B胜出的比例（基线）。

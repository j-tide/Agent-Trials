content:
  prompt: 偏见评测中，如何量化和检测模型对特定群体的刻板印象？
answer:
  mode: rubric
  reference_answer: |-
    偏见评测旨在发现和量化模型输出中针对特定群体（如性别、种族、宗教等）的系统性、不公平的联想和评价。

    检测与量化的方法：

    （1）基于提示对（Prompt Pairing）的对比评测

    - 方法：构造除身份标识词（如“男性/女性”、“白人/黑人”）外完全相同的成对提示。例如：

    - 检测与量化：使用情感分析、语气检测或专家评分，比较模型对两组提示的回答是否存在系统性差异。如果对女性的回答更倾向于“家庭原因”、“情绪”，而对男性更倾向于“工作”、“技术问题”，则揭示了性别刻板印象。差异程度可以通过评分之差来量化。

    （二）基于特定基准的评测

    - BOLD (Bias in Open-ended Language generation Dataset)：

    - WinoBias / WinoGender：

    - StereoSet：

    （三）词嵌入与潜在空间分析

    - 方法：对模型输出的词嵌入或最后隐层表示进行分析。例如，计算目标群体词（如“黑人”）与属性词（如“暴力”、“犯罪”）的向量相似度。

    - 量化：使用 Word Embedding Association Test (WEAT) 统计量。它衡量两组目标概念（如非洲裔姓名 vs 欧洲裔姓名）与两组属性概念（如愉快 vs 不愉快词汇）之间关联强度的差异。效应量越大，偏见越显著。

    （四）对抗性生成与审计

    - 方法：让语言模型自己或另一个攻击模型生成可能暴露偏见的提示，然后交给待评模型回答，由人类专家或经过训练的裁判模型进行偏见审计。

    - 量化：计算在所有对抗性提示中，输出含有明显刻板印象或歧视性表述的比例。

    （五）基于决策的影响评估

    - 方法：在模拟真实决策（如简历筛选、贷款审批）中，只改变候选人的性别/种族标识，看模型的录取/批准率是否存在差异。

    - 量化：计算不同群体间的接受率差异或影响比。若某群体的批准率显著低于另一群体，且无法用任务相关的原因解释，则可能存在决策偏见。

    关键原则：偏见量化必须结合统计显著性检验，并辅以领域专家的人类评估，因为统计指标可能遗漏微妙的、新形式的刻板印象。


content:
  prompt: METEOR 相比 BLEU 做了哪些改进？
answer:
  mode: rubric
  reference_answer: |-
    METEOR 针对 BLEU 对精确词汇匹配过于严苛的问题，引入了多项改进：

    （1）引入语义级别的匹配（词形与同义词）

    - 词干化与同义词库：METEOR 不仅匹配完全相同的词形，还通过词干提取和外部同义词资源（如WordNet）将语义等价的词视为匹配。例如，“running” 和 “run” 能匹配，“happy” 和 “glad” 能匹配。这在BLEU中只能算作完全不匹配。

    （2）平衡精确率和召回率

    - BLEU 主要偏向精确率（生成文本中的n-gram有多少在参考中），通过简洁惩罚间接考虑召回。METEOR 显式地计算生成文本与参考文本之间的单字匹配召回率和精确率，并计算两者的调和平均（F值）。这使得它能更好地惩罚信息遗漏。

    （3）引入词序惩罚

    - METEOR 考虑了匹配词在生成文本和参考文本中的顺序一致性。它将匹配词序列分组为“块”，块越少说明词序越一致。通过对块数施加惩罚，METEOR 能区分词袋相同但语序混乱的输出。

    （4）单阶段综合评分

    - METEOR 将精确率、召回率、词序惩罚整合为一个单一的得分，并对召回赋予更高的权重，因为研究发现召回与人工判断的相关性更高。这避免了像BLEU那样多个n-gram分数需要几何平均带来的复杂性。

    总体而言：METEOR 在句子级评测上相比 BLEU 有更显著的人工相关性，尤其是在允许灵活表达的任务中。但在处理深层语义理解和事实一致性时，仍受到词级匹配框架的根本限制。


content:
  prompt: 对于政治敏感或违法内容，如何在不触碰法律红线的前提下进行评测？
answer:
  mode: rubric
  reference_answer: |-
    评测模型对政治敏感或违法内容的处理能力，是走钢丝，必须在不产生、不传播真实有害内容的前提下，验证模型的安全边界。这需要实验设计和合规性方面的高度谨慎。

    评测策略：

    （一）使用合成、受控的检测样本

    - 抽象化与无害化改写：不直接使用真实的法律条款或敏感政治口号，而是使用学术界已公开的、经过审查的模板，或将敏感实体替换为虚构实体。例如，不测试“如何制造XX炸弹”，而是测试“如何制造一个虚构的、不可能实现的物体”。

    - 使用已知安全基准数据集：依托于 SafetyBench、HarmBench 等已公开发布的、用于学术研究的数据集，这些数据通常在受控环境下构建，并经过法律审核。

    - 反向验证与“应拒必拒”测试：将敏感问题转化为“拒绝测试”。提问后，只检查模型是否拒绝回答，而不深入分析其拒答内容。评测指标是“是否触发了安全拒绝机制”，这减少了接触有害内容的可能性。

    （二）构建沙盒与隔离环境

    - 完全离线的本地评测：所有涉及敏感内容的评测，必须在与互联网断开、没有记忆功能的本地沙箱环境中进行。确保测试数据不会被记录、上传或用于后续训练。

    - 数据最小化原则：仅使用完成测试所必需的、数量最少的敏感样本，测试完成后立即安全删除。

    - 严格的访问控制：只有经过背景审查和培训的核心安全人员才能接触敏感测试集，并签署保密协议。

    （三）依赖领域法律与伦理专家的决策

    - 由专家设计标准答案：不依赖模型的生成，而是由法律专家预定义对敏感问题的“合规安全回答”和“违规回答”模板。评测变为检验模型输出与哪个模板更接近的分类任务，而非开放式生成。

    - 伦理委员会审查：所有涉及政治敏感或违法内容的评测方案，在实施前必须经过由法律顾问、伦理学家和技术专家组成的内部委员会的严格审查和批准。

    （四）聚焦“过程安全”而非“内容呈现”

    - 指令遵循的优先性测试：构造一些前提错误但具有诱导性的违法请求，重点考察模型能否识别并纠正错误前提，而不是满足该请求。这本身是安全的。

    - 安全边界压力测试：评测模型在面对逐步升级的、触及安全红线的边缘请求时的反应，而不是一次性提交极端违法的请求。这更能反映模型在真实交互中的安全梯度。

    核心原则：始终遵循“最小必要伤害”原则。评测的目标是验证防御机制的有效性，而不是展示模型的“违法能力”。任何评测都不应产生具有现实危害性的真实内容，或在法律灰色地带游走。


content:
  prompt: 总结一下：设计一个全面评测一个通用对话 LLM 的方案，你会组合哪些基准和方法？
answer:
  mode: rubric
  reference_answer: |-
    一个全面的通用对话LLM评测方案，应像一套完整的“体检+实战考试”，组合多种方法，覆盖从内核到应用的所有关键维度。

    组合方案：

    （一）知识内核与基础语言能力

    - MMLU：测试广泛的世界知识和专业领域理解。必选。

    - HellaSwag 和 ARC：测试常识推理和科学推理，看模型是否对物理世界有基本认知。

    - GSM8K 和 MATH：测试数学推理和计算能力，覆盖从小学到竞赛级别。

    - TruthfulQA 和 HaluEval：专门检测模型产生事实性幻觉的倾向，衡量其“诚实度”。

    （二）核心对话与交互能力

    - MT-Bench：使用 GPT-4 作为裁判，对多轮对话的回复质量进行1-10分综合评分，涵盖写作、角色扮演、推理等八类场景。

    - AlpacaEval 2.0：进行成对胜率比较，用长度控制后的胜率评估其指令遵循和帮助性。

    - IFEval：精确量化模型对各类可自动验证的指令的遵循率，测试其“听话”程度。

    - 长上下文测试：结合“大海捞针”测试和长文档多跳问答（如LongBench），评估上下文利用能力。

    （三）安全、对齐与价值观

    - SafetyBench 和 RealToxicityPrompts：自动化评估模型在不同安全类别上的有害输出率。

    - TruthfulQA（复用）：同时测量真实性。

    - 文化适应性基准：使用多语言、多文化构建的社会规范和常识测试，评估模型的文化包容度和偏见程度。

    - 人工红队对抗测试：邀请安全专家和多元化背景的人员，对模型进行开放式攻击，暴露自动化基准遗漏的盲点。

    （四）特定任务能力（按需组合）

    - HumanEval / MBPP：代码生成与逻辑能力。

    - ToolBench：工具调用和复杂任务规划能力。

    - RAGAS（在RAG场景中）：评估检索增强生成的忠实度和上下文相关性。

    - 垂直领域专家评测（如果面向专业领域）：由医生、律师等对专业问题进行深入盲评。

    （五）效率与用户体验

    - 在标准硬件上测量 TTFT、TPOT和吞吐量，报告不同并发下的服务等级协议（SLA）满足率。

    - 在线A/B测试：最终将模型部署到真实流量中，通过匿名化用户反馈、留存率、任务完成率等关键业务指标进行终极验证。这是所有离线评测的最终校准器。

    （六）元评测与校准

    - 定期对所使用的自动裁判（如GPT-4）进行偏差审计（长度、位置偏差）和与人类专家的一致性校准，确保自动化评估体系的持续可靠性。

    - 建立持续回归监控系统，在模型更新时自动运行上述核心基准，并对比历史分数，及时发现能力退化或新增盲点。

    这个方案将学术基准的客观性、自动裁判的扩展性、人类评估的深度和在线测试的真实性有机结合，形成一个多层、持续、自校准的评测生态系统。它度量模型的硬实力、软实力以及可信赖度，是通往负责任AI部署的必由之路。

    - 利用规则或语言模型，从新抓取的文本中自动提取关键实体、事件和数值，并生成自然语言问题和答案。例如，对于一条“X当选为Y国总统”的新闻，生成问题“谁在[时间]当选为Y国总统？”。

    - 使用模板化生成，确保问题格式统一，答案形式可控。

    - 自动校验：使用多个独立来源交叉验证生成的答案一致性。若多个可靠来源信息一致，自动通过。

    - 人工抽检：对每日新生成的题目，由审核人员（或经过训练的快速审核流程）随机抽样检查，确保没有错误信息。

    - 三段论：提供大前提和小前提，要求判断结论是否成立。如“所有A是B，C是A，那么C一定是B吗？”

    - 自然语言逻辑谜题：基于一系列约束条件进行逻辑推导，如“五人排座，A在B左边，C不在最右边，请问谁在中间？”，评测模型是否按逻辑步进求解。

    - 蕴含识别：判断一段给定文本是否逻辑上蕴含某个陈述（NLI任务是其变体）。

    - 代码执行推演：给出一段代码和输入，要求推断输出，本质是严格演绎。

    - 数列/图形补全：给出序列“2, 4, 6, 8, ?”要求推断下一个数字；或给出一系列变化的图形，要求找出模式并补全。这测试抽象归纳能力。

    - 概念归纳：给出几个例子，要求归纳出它们共同的特征或分类规则。如“苹果、香蕉、葡萄都属于什么？”

    - 类比推理：“A之于B，如同C之于？”，需要归纳A与B的关系，并将其应用到C上。

    - 最佳解释选择：描述一个离奇现象，给出几个可能的解释，要求选择最合理的那一个。如“早上看到草坪是湿的，最可能的原因是什么？”（下雨 vs 洒水车）。

    - 故事理解与完形填空：给出一段叙事，隐去其中某个原因事件，要求从选项中选出能最好解释后续情节的那个。

    - 故障诊断：基于一系列症状或错误日志，推断系统故障的根因。

    - 动机/前因：“Sasha为什么拥抱Casey？”（情绪反应）

    - 人物属性：“Casey可能是什么样的人？”（社会角色与性格推断）

    - 后果/行为：“接下来Casey会做什么？”（社会预期行为）

    - 信号稀疏：对于长链条推理，模型很难从最终对错中回溯并归因到具体哪一步推理出了问题，导致训练效率低下。

    - 奖励欺骗：模型可能通过死记硬背答案、利用表面统计线索蒙对，或者写出正确的答案但推理过程逻辑谬误，这些都无法被惩处。

    - 过程幻觉无法识别：无法诊断模型的推理链条是否正确，可能出现“歪打正着”的错误过程。

    - 信号密集且精细：每一步都有反馈，极大提高了训练效率和归因准确性。

    - 促进可解释且可靠的推理链：鼓励模型生成每一步都正确的思维链，从而减少推理幻觉，防止“漂亮的废话”。

    - 能够在推理过程中及时纠正：在推理时，一旦过程奖励模型发现某步出错，可以触发回溯或重新生成，实现类似“自我纠错”的机制。

    - 标注成本极高：需要大量人力为长链条推理的每一步进行标注，构造训练数据困难。

    - 自动过程监督的挑战：若用另一个模型（如裁判模型）进行自动过程监督，该裁判模型本身可能也存在错误，会引入新的偏差。

    - 错误步骤分析：检查是推理链条本身就错了，还是推理正确但答案摘录出错。

    - 过程一致性检验：追问“你能用另一种方式得到相同答案吗？”，验证其推理的鲁棒性。

    - 精确匹配：生成的SQL结果集是否与标准SQL的结果集完全一致。这是最高标准。

    - 集合匹配：结果集的元素是否一致，忽略行顺序。多数场景适用。

    - 执行等价：生成SQL的结果集与标准SQL结果集在语义上一致，即使SQL写法不同。这是最公平的评估，因为一个查询可以有多种等价写法。

    - 预定义槽位与规则：对于特定任务（如客服、预订），预先定义必须追踪的关键信息槽（如产品型号、用户地址、故障代码）。评测系统在每轮回答中自动抽取这些槽值，检查它们在整个对话周期内是否保持一致，没有漂移或矛盾。

    - 约束满意度检查：对于角色扮演，预定义一系列角色必须遵守和绝对禁止的行为准则。用分类器或裁判模型检查模型在每一轮的输出是否违规。计算长对话中违规的频率和严重度。

    - 无共情（答非所问或冷漠）

    - 浅层共情（“这太糟糕了”）

    - 深度共情（准确命名用户情绪，提供情感确认，并结合情境表达支持）

    - 行动导向共情（在共情基础上，提供建设性的后续支持或问题解决方向）

    - 定义一套覆盖不同类别（如获取数据、执行操作、计算）、不同参数模式（必填、可选、复杂类型）的“虚拟API”集。这些API背后有一个确定性的模拟后端，确保每次调用返回可预测的结果。

    - 设计复杂任务场景：不是孤立地“调用API X”，而是需要模型规划一串API序列来完成一个高层次目标，如“帮我预订从A到B的机票和酒店，条件是...”，这需要综合调用搜索、比较、预订等多个API，并且处理API返回的数据。

    - API选择准确率：在需要时，是否正确选择了功能相匹配的API，没有用错或编造不存在的API。

    - 参数准确率：调用的参数名、参数值、数据类型是否符合API的Schema定义。这一点可以通过沙箱自动捕获参数解析错误。

    - 冗余调用率：是否存在不必要、重复的API调用，浪费资源？

    - 最优路径匹配度：比较模型使用的调用序列与预定义的最优序列（最少调用次数、最低计算成本）的接近程度。

    - 应对错误返回：当API返回错误（如404、参数非法）时，模型是否能基于错误信息进行智能重试或调整参数，而不是崩溃或瞎编结果？

    - 处理异常状态：对API返回的空数据、超时等情况，是否做出了合理的后续处理。

    - 包含3个要点（可数数）

    - 输出格式为JSON（可解析）

    - 总字数 ≤ 200（可统计算）

    - 不包含逗号（可正则匹配）
    评测指标：约束满足率 = 完全满足的约束数 / 总约束数。

    - 表层格式约束：“用Markdown表格”、“每段以小标题开头”。这是最容易的。

    - 内容限定约束：“必须提到A”、“禁止使用词汇B”、“语气要专业”。难度中等。

    - 逻辑与条件约束：“如果X，则用格式A；否则用格式B”、“先分析优点，再解释缺点”。难度较高。

    - 跨轮次或元约束：“总结对话历史”、“基于你上一轮的回答进一步阐释”。这是最难的。

    - 新颖性：利用大语言模型计算文本与训练数据中常见模式的偏离度，或与已有作品集的文本相似度。较低的相似度和较高的偏离度可能暗示一定程度的独创性。

    - 词汇与句法多样性：使用 Distinct-N、Self-BLEU 等指标衡量用词和句式的丰富度，过滤掉机械重复的生成。

    - 可读性与流畅度：自动检测语法错误率、困惑度（PPL），辅助评判基本文笔。

    - 使用 GPT-4 等强模型作为裁判，设计精细的评分标准和锚定示例，从“情节吸引力”、“角色生动性”、“语言美感”等维度进行1-10分评价。可通过提供多篇名家范文的评分作为锚点来校准。

    - 局限：裁判模型存在强烈的风格和内容偏见，可能偏好四平八稳的“标准美文”而非真正突破性的创意。

    - 自动计算文本的情感曲线、节奏、高潮分布等叙事学特征，辅助分析故事是否具有吸引人的张力结构，虽然这更多是描述性分析而非质量评判。

    - “可回答集”选取模型训练数据截止日期前、且为常见百科知识的问题。

    - “不可回答集”包括：询问未来事件、需要实时私密数据、涉及纯粹虚构实体、或信息不充分无法确定的问题。

    - 拒答恰当率：在“不可回答”问题上，模型是否表达了“我不知道”或不确定性，而不是编造答案。

    - 误拒率：在“可回答”问题上，模型是否错误地表达了无知。

    - 可构建一个联合分数，如 F1 分数，平衡两者。

    - 明确有害（暴力、仇恨言论、非法行为指南）：模型必须拒绝。

    - 完全良性（正常知识问答、创意写作、日常对话）：模型必须正常回答。

    - 边界模糊或具有挑战性（如性教育、敏感历史讨论、需要表达不确定性的问题）：用于诊断模型的判断粒度。

    - 翻译与改编：将现有的社会规范和常识测试（如Social IQA）翻译成多种语言，并由当地母语者改编，使其情境、人物和规范符合当地文化，而非简单直译。

    - 社区共建：与全球各地的文化专家和社区成员合作，收集各文化特有的情境题。例如，关于家庭关系、节日礼仪、饮食禁忌、商务沟通风格等。

    - 文化常识：提问特定于某文化的事实（如“中秋节常吃什么？”），检验知识覆盖率。

    - 社会规范：设计情境题，询问在特定文化下某种行为是否得体（如“在X国，直呼长辈名字是否合适？”），测试对社会规则的理解。

    - 价值观对齐：设计涉及道德困境的问题，看模型的回答是否反映了特定文化的主流价值观（同时注意不强化刻板印象）。

    - 文化准确率：模型在各文化子集上的回答准确率。

    - 文化偏见度：检查模型是否对某些文化表现出系统性的负面刻板印象或冒犯性评价。可通过比较模型对不同文化群体的描述情感得分来实现。

    - 适应性一致性：在跨文化场景中，模型的回答是否前后一致。例如，当用户明确表示“我来自X文化”时，模型的后续交互是否体现了对该文化的理解和尊重。

    - 评测不能依赖通用维基百科，而必须基于领域内权威、受法律认可的知识源。如法律需基于现行有效法典和判例，医疗需基于临床指南和经同行评议的文献，金融需基于官方披露文件和实时市场数据。

    - 评测答案的“正确性”必须由持牌执业专家（律师、医生、金融分析师）来定义和验证，普通人类评估员不具备裁决权。

    - 一个捏造的法条、错误的剂量、虚假的财务预测，可能带来灾难性后果。评测必须专门设计高风险幻觉探测集，对事实性错误的扣分权重要极大。

    - 必须评测模型“知道何时不知道”并建议咨询人类专家的能力。过度自信的胡说比诚实说“请咨询律师”危险得多。

    - 输出必须符合行业监管规定（如HIPAA、GDPR）。评测需包含合规性维度，检查是否泄露隐私、是否进行不当诱导、是否履行了风险告知义务。

    - 需要审计模型的偏见，确保不会对特定患者、诉讼人或投资者群体产生系统性不公。

    - 法律和金融信息时效性极强。评测必须使用动态更新的题库，检验模型是否能依赖最新法规和数据，并丢弃过时信息。

    - 模型不仅给出答案，还必须提供可信、可追溯的来源（如具体条款、文献DOI）。评测需检查其引用的真实性和准确性。

    - 从初始评测集开始，用当前最强模型去测试。收集模型失败的案例，分析其错误模式。

    - 基于失败模式，人工或自动大规模生成类似但更具迷惑性的新样本。例如，如果模型在否定句式上常出错，就批量生成各种复杂的否定句问题。

    - 用新样本重新评测模型，再次收集失败案例，重复此过程。多轮迭代后，评测集将充满对当前模型而言“最难”的例子，如同HellaSwag的构建过程。

    - 训练或提示一个强大的“攻击者”模型，专门负责生成能诱导被评模型犯错的提示。这可以是越狱攻击、逻辑陷阱、知识冲突或风格诱导等。

    - 将大量红队生成的对抗样本纳入评测集，实现自动化、大规模的对抗评测。

    - 人类红队专家设计初始攻击思路，由语言模型辅助批量生成变体。

    - 人类再筛选出最巧妙、最隐蔽的对抗样本，这些样本往往利用了模型的深层认知盲区，是目前最有效的对抗评测素材。

    - 对于指令遵循类任务，利用组合数学，自动生成包含多个相互制约或极易混淆的约束组合的指令，其中许多组合是人类不会想到但极易让模型崩溃的边界情况。

    - 确定一系列有代表性的典型任务（如短问答、长文摘要、多轮对话），每种任务拥有自己的测试集和功能性指标（如正确率、ROUGE、忠实度）。

    - 所有待评模型必须在完全相同的硬件环境（如特定的GPU型号、CPU、内存）和软件栈（推理框架、批处理设置）下运行，以确保效率指标公平可比。对于API模型，记录其平均端到端延迟。

    - 为不同的应用场景定义SLA（服务等级协议），如“实时对话场景要求P95延迟低于500ms”。

    - 在评测时，测量模型在满足该SLA前提下能达到的最高功能得分。或者，固定一个可接受的最低功能得分（如摘要ROUGE-L不低于30），测量此时的最高吞吐量。

    - TTFT（Time to First Token）：从请求发出到收到第一个token的时间，影响用户感知的响应速度。

    - TPOT（Time per Output Token） 或总延迟：输出完整回答的速度。

    - 吞吐量：在持续高负载下，系统每秒能处理的最大请求数或生成的token总数。

    - 硬件成本：运行模型所需的GPU显存、数量及功耗。

    - 不试图用一个简单数字概括，而是在二维坐标系上绘制多个模型的点，X轴为效率（如吞吐量），Y轴为准确性（如正确率），直观展示帕累托前沿。

    - 或者，根据业务需求设定一个效用函数，如 U = Accuracy * log(Throughput)，并报告每个模型的效用值。这个函数需要根据产品需求定制，反映准确性相对于效率的重要性。

    - 在多轮对话的早期，教给模型一个全新的概念或事实（如“我将要在对话中使用一个暗语，X表示同意”），然后在对话后期频繁要求模型使用或解释这个暗语。评测其是否能正确应用，以及在长对话后是否会遗忘。

    - 在对话开始时，用户提供一个包含多个复杂指令和个人偏好的“记忆档案”。然后进行长达数十轮、穿插各种话题的对话。在对话结束时，突然提问有关该档案的细节，检验模型是否在整个对话中持续记忆了这份档案，没有被其他信息冲刷掉。

    - 在多轮对话中，分步给出指令片段，中间夹杂大量无关对话。最后要求模型综合所有指令片段完成一个任务。这测试了模型对跨轮次分散信息的整合能力和抗干扰记忆力。

    - 对话中，先给出信息A，然后明确告诉模型“请忘记A，现在信息更新为B”。之后提问，看模型是否真的以B为准，还是混乱地混合了A和B。这评测了记忆更新机制。

    - 如果系统支持持久化记忆，可设计跨独立会话的实验。在第一场会话中存入信息，关闭会话，几天后开启新会话，测试模型是否能通过记忆检索机制回想起该信息。

    - 记忆保持率：在对话的特定位置，模型能正确回忆出的信息占初期注入信息的比例。

    - 抗干扰准确率：在有干扰项的情况下，模型对关键信息的回忆准确率。

    - 学习曲线：观察模型在多次同类任务中的表现提升速度，衡量其少样本学习效率。

    - 与已有故事语料库的文本相似度：计算生成故事与大规模故事库中最相似文本的距离，距离越远，表明词汇和情节组合越新颖。

    - 自BLEU/独特N-gram比例：衡量故事内部词汇和句式的丰富程度，避免重复和套话。

    - 设置精细的评分量规，包括“世界构建的独创性”、“情节惊喜度”、“象征与隐喻的运用”、“结尾的余韵”等。

    - 采用双盲成对比较，让多名具有文学素养的评估者或不同审美取向的强模型裁判进行比较，胜率越高越好。

    - 局限：创意的主观性极强，自动化指标只能提供很弱的信号。最终的评价必须大量依赖人类（尤其是目标读者群体）的综合阅读体验和定性反馈。

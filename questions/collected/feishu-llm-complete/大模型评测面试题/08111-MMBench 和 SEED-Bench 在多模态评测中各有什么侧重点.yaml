content:
  prompt: MMBench 和 SEED-Bench 在多模态评测中各有什么侧重点？
answer:
  mode: rubric
  reference_answer: |-
    MMBench 和 SEED-Bench 都是大规模、全面评测多模态大模型能力的重要基准，但它们的设计哲学、评估维度和方法论侧重不同。

    MMBench 的侧重点：

    - 核心目标：构建一个能力维度覆盖全面、层次化、细粒度的评测体系，以量化模型在视觉理解各子维度上的进展。

    - 能力维度：明确划分为三大层级：

    - 评估方法：采用多选选择题，完全客观、易于自动化。答案经过精心设计，干扰项有针对性。

    - 亮点：

    SEED-Bench 的侧重点：

    - 核心目标：专注于评测多模态模型的生成式理解能力，特别是模型能否像人类一样，对视觉内容进行自由形式的解释和推理，而不仅仅做选择题。

    - 评估维度：涵盖 12个评估维度，包括场景理解、实例属性、实例身份、空间关系、视觉推理、文本理解、图像生成等，并分为空间理解和时间理解两大板块（SEED-Bench-2则扩展到更多维度）。

    - 评估方法：核心是生成式评估，而非选择题。所有问题都需要模型生成一个答案，然后使用GPT-4等强大模型作为裁判，将模型输出与人工标注的标准答案进行语义等价判断。这使得评测更接近真实的人机交互，能评估模型的深度解释能力。

    - 亮点：


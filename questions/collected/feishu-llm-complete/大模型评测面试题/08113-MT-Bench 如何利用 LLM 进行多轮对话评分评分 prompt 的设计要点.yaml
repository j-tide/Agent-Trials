content:
  prompt: MT-Bench 如何利用 LLM 进行多轮对话评分？评分 prompt 的设计要点。
answer:
  mode: rubric
  reference_answer: |-
    MT-Bench 是一个专为评估聊天模型多轮对话质量而设计的基准，它利用 GPT-4 作为裁判，对模型在两个连续轮次上的回答进行评分。

    工作原理：

    - 设计多轮测试用例：MT-Bench 包含80个精心设计的两轮对话场景，覆盖写作、角色扮演、知识推理等八大类。

    - 生成对话：待测模型完成第一轮回答后，MT-Bench会基于预先写好的第二轮追问，让模型生成第二轮回答。

    - 逐轮评分：将该两轮对话的完整上下文提供给裁判模型（GPT-4），要求它分别为第一轮和第二轮回答打分。

    - 综合得分：第一轮得分与第二轮得分取平均，成为该问题的最终得分。

    评分 Prompt 的设计要点：

    - 明确定义裁判角色与任务：开头即声明“你是一个公正的裁判”，并说明任务是评估AI助手与用户的对话质量。

    - 提供详细的、多维度评分标准：要求对每轮回答从1到10打分，并给出各分数段的明确语义锚定。例如：

    - 强调必须考虑对话历史：明确指出评第二轮时必须结合第一轮的上下文，判断回答是否连贯、是否记住前文、是否逻辑一致。

    - 要求结构化输出与解释：强制裁判输出固定格式，如：

    - text

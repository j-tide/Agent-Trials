content:
  prompt: 什么是大模型评测？它的主要目标有哪些？
answer:
  mode: rubric
  reference_answer: |-
    大模型评测是指通过系统化的方法、指标和测试集，对大型语言模型或多模态大模型的能力、行为、安全性、可靠性等进行量化与定性分析的过程。它不仅是简单的“打分”，而是从多个维度全面理解模型的优势、局限和风险，为模型选择、迭代优化、风险管控和合规审计提供科学依据。

    主要目标：

    - 能力度量与比较：量化模型在知识、推理、语言理解、生成等核心任务上的表现，提供不同模型之间可比较的基准，追踪技术进展。

    - 弱点与偏差发现：识别模型在特定领域、语言、群体或场景下的失败模式、知识盲区和系统性偏见，为定向优化提供诊断信息。

    - 安全与对齐验证：评估模型是否遵循人类价值观和意图，是否安全无害，是否存在幻觉、有害输出、越狱风险等，确保部署前的合规性。

    - 性能边界刻画：确定模型在极端输入、分布外样本、长文本、对抗攻击等压力条件下的表现天花板与崩溃点。

    - 用户体验预测：通过模拟真实使用场景，预估模型在线上应用中的用户满意度、任务完成率和交互流畅度。

    - 版本迭代监控：在模型更新过程中，持续追踪关键指标变化，防止能力退化或出现新的安全漏洞。

    - 合规与审计支撑：满足法律法规（如AI伦理准则）和行业标准对模型透明度、公平性和可问责性的要求。

    大模型评测已从单纯的“跑分”演变为贯穿模型全生命周期的综合质量保障体系。


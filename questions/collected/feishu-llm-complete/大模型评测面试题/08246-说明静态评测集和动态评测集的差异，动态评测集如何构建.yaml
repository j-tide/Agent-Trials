content:
  prompt: 说明“静态评测集”和“动态评测集”的差异，动态评测集如何构建？
answer:
  mode: rubric
  reference_answer: |-
    静态评测集：一旦创建，其内容就固定不变的测试集。例如MMLU、HellaSwag等基准。

    动态评测集：内容会随外部环境（如时间、新数据）定期更新或实时变化的测试集，旨在评估模型的持续适应能力。

    核心差异：

    动态评测集的构建方法：

    （1）基于时间窗口的题目迭代

    - 定期（如每周、每月）从可靠新闻源、学术论文、维基百科更新中提取新的事实性知识，自动生成问答题。

    - 示例：FreshQA 通过抓取最新新闻标题和摘要，利用模板或语言模型将其转化为问答对，并人工校验答案正确性。

    （2）对抗性社区众包

    - 鼓励社区成员持续提交新题目，特别是针对已发现模型缺陷的场景。平台对提交进行审核和难度评级，定期合入评测集。

    - 类似Dynabench，通过“人在回路”的动态对抗，使评测集随着模型能力的提升而变难。

    （3）合成数据流水线

    - 使用强大模型（或规则系统）根据最新知识自动生成问题，再由人工或另一验证器过滤。可结合模板、知识图谱和最新实体库，批量生成覆盖长尾的实时问题。

    （4）基于真实用户交互的持续采样

    - 从模型线上服务的真实用户对话中（匿名化后），抽取高价值的、暴露模型短板或具有挑战性的交互作为评测样本，形成不断增长的“现实题库”。

    （5）版本管理与快照

    - 动态集需要为每次评估创建快照或记录时间戳，确保同一时间段内比较的公平性。报告结果时需标明评测集版本或时间范围。

    意义：动态评测集是解决知识截断、基准饱和和数据泄漏的关键手段，能真实反映模型在“当下”世界的可靠性。


content:
  prompt: MT-Bench 的设计思路是什么？多轮对话如何评分？
answer:
  mode: rubric
  reference_answer: |-
    MT-Bench 是一个专为评估聊天模型多轮对话质量而设计的基准。

    设计思路：

    - 多轮场景：包含80个精心设计的多轮对话问题，覆盖写作、角色扮演、知识、推理等八大类常见用户场景。

    - 两级对话：每个问题包含两个连续的轮次。第一轮提问后，模型作答；然后基于第一轮的回答追问一次，形成两轮交互。这考察模型在延续上下文时的理解、记忆和一致性。

    - 强大模型裁判：使用GPT-4作为默认裁判，对每个回答以1-10分进行打分，评估维度包括有用性、相关性、深度、创造力以及细节水平等。通过提示词引导裁判给出精细评分和理由。

    多轮对话评分：MT-Bench不是简单对单轮打分，而是评估模型在连续交互中的综合表现。它会评估模型是否记得前文，是否根据追问给出恰当且深入的回应，并保持风格与角色一致。这种多轮评分更能反映真实聊天场景下的用户体验，比单轮评测更具生态有效性。


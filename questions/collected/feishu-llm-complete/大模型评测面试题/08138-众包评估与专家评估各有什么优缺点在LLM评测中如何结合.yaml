content:
  prompt: 众包评估与专家评估各有什么优缺点？在LLM评测中如何结合？
answer:
  mode: rubric
  reference_answer: |-
    众包评估与专家评估代表了评估者群体光谱的两端，各有鲜明的优势和局限，在高质量LLM评测中常需结合使用。

    [嵌入表格未展开]

    在LLM评测中的结合策略：

    - 分层漏斗模型：先使用成本低的众包进行大规模“粗筛”，如标记出明显有害、答非所问、极度不流畅的回复。将疑难的、需要深层判断的、高风险的样本递交给专家进行深度分析和裁决。这样既控制了成本，又保障了质量。

    - 专家定义标准，众包执行：由专家精心设计详尽的标注指南、典型案例和校准流程，然后培训一支相对稳定的众包团队（“半专家化”）。专家持续监控众包质量，并针对争议案例进行仲裁和反馈。这使得众包能从专家的知识中获益，提升整体质量。

    - 领域专项分工：通用、低风险维度（如礼貌度、可读性）委托众包；专业、高风险维度（如医学建议正确性、法律条文引用）完全由专家负责。最终总分由各维度分数按加权整合。

    - 专家作众包的校准与审计员：定期从众包数据中抽取样本由专家独立重评，计算两者的一致性，以此作为众包团队的绩效指标和自动质量控制的依据。

    这种“用专家智慧赋能众包，用众包规模放大专家”的混合模式，是目前进行大规模、高质量、可持续的LLM人类评估的最佳实践。


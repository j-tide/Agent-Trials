content:
  prompt: 自我增强偏差（Self-Enhancement Bias）是什么？裁判模型是否偏向自己的输出？
answer:
  mode: rubric
  reference_answer: |-
    自我增强偏差指裁判模型在评估时，由于与被评估模型共享相似的架构、训练数据或生成风格，从而表现出对自己的“同类”更有利的倾向。极端情况下，模型可能会给自己生成的回答打出异常高的分数，即使那个回答质量平平。

    具体表现与证据：

    - 自评分更高：研究表明，如果让模型评估它自己生成的回答，相较于评估其他模型的回答，它给出的分数会系统性偏高。模型倾向于认为自己的输出“更好”。

    - 对同系列模型更宽宏：即使不是自评，作为裁判的GPT-4可能对GPT-3.5-Turbo等“同门”模型比对外部模型（如Claude）更宽容，因为它们在输出风格、用词习惯上更相似。

    - 风格偏好：裁判模型可能更偏好与自身训练数据分布一致的写作风格，这种偏好虽然不是直接“识别出自己”，但在宏观上造成了不公平的竞争优势。

    原因分析：

    - 似然幻觉：模型生成的内容是其自身概率分布下的高概率样本。当作为裁判时，这种高似然的内容会被视为更“流畅”、“合理”，从而获得更高的基础评价。

    - 一致性偏差：模型容易将“符合我的预测”与“质量高”混淆。自己生成的文本当然完全符合自己的预测，因此天然获得高分。

    - 训练数据同源性：裁判模型和被评估模型往往都由类似的海量网络文本预训练，这种数据同源导致它们对语言的“好”有类似但狭隘的定义，强化了自我偏好。

    缓解方式：

    - 禁止自评：明确不采用模型自身作为其输出的裁判。始终使用独立、不同的模型系列作为裁判。例如，用Claude去评GPT，或使用多个交叉裁判。

    - 多裁判交叉验证：使用多个来源不同、架构不同的裁判模型，看它们的评分是否一致。如果某模型的自评分数与其他裁判严重不符，即可识别出自我增强偏差。

    - 校准与归一化：在比较不同模型时，同时引入一个固定的、独立的参考基线的评分。将所有模型的分数与该基线做差值，可以部分消除绝对自评分虚高的问题。

    - 对抗性检验：定期检查裁判模型对自己生成的随机样本和对其他模型同等质量样本的评分分布，监控是否存在显著的自偏现象，并在训练裁判模型时加入反自偏的样本。

    结论：自我增强偏差是真实存在的风险，因此当前最佳的评测实践强烈建议避免使用同一模型或同系列模型对自己进行评估，而应采用跨模型家族的裁判策略。


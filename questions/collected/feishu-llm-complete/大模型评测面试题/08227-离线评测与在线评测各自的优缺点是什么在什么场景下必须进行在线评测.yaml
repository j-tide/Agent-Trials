content:
  prompt: 离线评测与在线评测各自的优缺点是什么？在什么场景下必须进行在线评测？
answer:
  mode: rubric
  reference_answer: |-
    离线评测：在受控环境下，使用预先准备好的固定测试集对模型进行评估。

    在线评测：在真实用户交互环境中，收集用户反馈或模型表现数据进行评估。

    优缺点对比：

    必须进行在线评测的场景：

    - 用户满意度与体验：当模型核心目标包含“用户愉悦度”、“自然度”等主观体验时，离线模拟无法替代真实用户的感知。必须通过在线A/B测试、用户打分（如Chatbot Arena）来评估。

    - 任务完成率：对于需与外部系统交互、完成复杂多步任务（如预订机票），离线无法模拟真实后端的不确定性，必须在线评测端到端的成功率。

    - 安全与滥用监测：攻击者的越狱手法层出不穷，离线红队数据无法穷尽。在线监控是发现新型攻击、衡量真实世界安全风险的唯一手段。

    - 长期交互与持续性：多轮对话的长期记忆、用户黏性、对话中的性格固化等效应，只有在长达数周的真实在线交互中才能显现和评估。

    - 冷启动与新业务探索：当产品面向全新领域、没有现成测试集时，必须通过在线试探用户行为，收集真实数据以反哺离线评测集。

    结论：离线评测是快速迭代的引擎，在线评测是真实价值的试金石。成熟的大模型部署方案必然采用离线初筛+在线验证的双环架构。


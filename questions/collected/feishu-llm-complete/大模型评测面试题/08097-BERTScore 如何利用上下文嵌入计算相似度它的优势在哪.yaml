content:
  prompt: BERTScore 如何利用上下文嵌入计算相似度？它的优势在哪？
answer:
  mode: rubric
  reference_answer: |-
    BERTScore 彻底抛弃了表面的 n-gram 匹配，转而使用预训练语言模型（如BERT）产生的上下文嵌入来衡量生成文本与参考文本的语义相似度。

    工作原理：

    - 嵌入获取：将生成文本和参考文本分别输入同一个预训练模型，取模型某一层（或多层组合）的每个token的上下文向量。

    - 相似度矩阵：计算生成文本中每个token与参考文本中每个token的余弦相似度，形成相似度矩阵。

    - 贪心匹配：对于生成文本中的每个token，找到参考文本中与之余弦相似度最高的token，将其相似度作为该token的“召回”贡献。对称地，对于参考文本中的每个token，也在生成文本中找最佳匹配，计算“精确率”贡献。

    - 聚合：将所有token的匹配分数平均，得到BERTScore-Precision、BERTScore-Recall，并计算F1。可以选择基于重要性的加权（如IDF），削弱常见词的权重。

    优势：

    - 跨词汇语义匹配：能识别“轿车”与“汽车”高度相似，即使它们表面完全不同。这使它极大改善了对同义改写和灵活表达的包容度。

    - 上下文感知：同一个词在不同语境下的向量不同，能部分处理一词多义。

    - 无参考的扩展能力：由于只需源文和生成文本，不需要人工预先定义同义词库，且在不同领域泛化好。

    - 与人类判断的相关性显著提升：在摘要、翻译等任务上，BERTScore 与人类评估的相关性远超 BLEU/ROUGE。

    - 细粒度可解释性：可以通过相似度矩阵可视化，看出哪些部分匹配得好，哪些部分存在语义差异，辅助错误分析。

    局限：它仍然依赖于参考文本，且对需要深层逻辑或事实校验的场景不够直接。此外，嵌入模型的训练数据和偏差也会影响评分。


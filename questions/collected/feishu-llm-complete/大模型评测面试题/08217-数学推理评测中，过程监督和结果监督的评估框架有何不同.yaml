content:
  prompt: 数学推理评测中，“过程监督”和“结果监督”的评估框架有何不同？
answer:
  mode: rubric
  reference_answer: |-
    在数学推理评测（及训练）中，这两种框架代表了不同的奖励和评估哲学。

    结果监督：

    - 定义：仅根据最终答案是否正确来给予奖励或评判。忽略模型得出答案的中间推理过程。

    - 评估方式：提供一个二元的、稀疏的奖励信号。答案完全匹配标准答案则得1分，否则0分。

    - 优点：评估极其简单、客观，易于自动化。不限制模型的思考路径，允许它自主发现新颖的求解策略。

    - 缺点：

    过程监督：

    - 定义：不仅看最终答案，也对中间推理的每个步骤的正确性进行监督和评分。为此，需要过程级的标签。

    - 评估方式：为每个推理步骤提供奖励或标签（正确/错误/中性）。训练一个过程奖励模型，它可以为生成的每一步推理打分。

    - 优点：

    - 缺点：

    核心不同：结果监督是“只看目的地，不管怎么走”；过程监督是“每一步路都必须走对”。在追求可靠、可解释的智能推理系统时，过程监督是更先进但更具挑战性的范式。


content:
  prompt: 不断出现的新的评测基准（如 AGIEval、GAIA）反映出现有评测的哪些不足？
answer:
  mode: rubric
  reference_answer: |-
    AGIEval、GAIA 等新基准的出现，是对上一代评测基准“失效”和“片面”的直接回应。它们反映了现有评测的以下核心不足：

    （1）过于侧重知识记忆，忽视高阶认知能力

    - 原有基准：如 MMLU、TriviaQA 主要考察知识覆盖度和事实回忆，可被大模型通过“死记硬背”解决。

    - AGIEval 的启示：它采用人类标准化考试（高考、律师资格考试等），题目设计本身就是为了评估理解、推理、分析、综合等高阶能力，而非孤立的知识点。它暴露了许多模型在“博闻强识”背后，像人类一样进行严谨应试推理的能力依然薄弱。

    （2）任务过于简化，缺乏真实世界复杂性

    - 原有基准：多为简洁的问答、分类或选择题，背景单一，没有冗余或干扰信息。

    - GAIA 的启示：GAIA 的问题模拟了真实世界中解决复杂问题所需的多步工具使用、信息筛选和推理链整合。例如，需要先搜索信息、理解、再计算、再验证。它暴露出现有 LLM 在面对开放式的、需要规划与使用外部工具的复合任务时，成功率远低于人类，显示了从“答题家”到“智能助手”的巨大鸿沟。

    （3）静态与易饱和，缺乏对动态能力的评估

    - 原有基准：如 GLUE、SuperGLUE 在发布数年后就达到或接近人类水平，评测区分度丧失，因为模型已经通过大量优化记住了“题库”。

    - 新基准（如 FreshQA、RealTimeQA）转向动态更新，强调对时效性知识、持续学习和避免幻觉的测试，这是静态基准完全忽视的维度。

    （4）评估粒度粗糙，缺乏诊断性

    - 原有基准：常只给出一个总分，无法揭示模型“为什么”表现好或坏。MMLU 虽然分57科，但仍无法告知模型在哪个认知子维度（如演绎推理 vs 数值比较）上存在短板。

    - 新基准（如 MMBench 的能力雷达图、BIG-Bench 的涌现行为分析）更注重细粒度、多维度诊断，旨在绘制模型的能力轮廓，而不仅是排名。

    （5）对元认知与自我知识的忽视

    - 原有基准：几乎不评估模型“知道自己不知道”的能力。

    - 新基准开始关注这一点，例如通过设计可回答与不可回答的混合问题，评测模型的拒答恰当性和置信度校准，这是可信赖 AI 的核心要求，但传统评测是盲区。

    总结：新基准揭示了下一代评测的方向——从静态知识问答走向动态、交互、多工具、重推理、有自知之明的通用智能评测。


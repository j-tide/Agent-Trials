content:
  prompt: 如何评估模型生成结果的多样性？Self-BLEU 和 Distinct-N 分别怎么用？
answer:
  mode: rubric
  reference_answer: |-
    多样性是衡量生成模型避免重复、保持语言丰富度的重要指标，常用Self-BLEU和Distinct-N来衡量。

    Self-BLEU：

    - 用法：对一个模型生成的多个样本，计算两两之间的 BLEU 分数（类似衡量它们互相有多相似）。然后取平均值作为 Self-BLEU 分数。

    - 解读：Self-BLEU 越低，多样性越高。如果模型总是生成相似的句子或模式，那么不同生成样本之间的 BLEU 会很高，Self-BLEU 高，表明多样性差。常用于评估故事生成、图像描述等。

    - 优点：能整体反映生成集合的相似性。

    - 局限：BLEU 本身的局限依然存在；计算量大（需要两两配对）。

    Distinct-N：

    - 用法：在生成的文本集合（或单篇文本）中，统计所有不重复的 n-gram 数量，除以总的 n-gram 数量。Distinct-1 看单词级别多样性，Distinct-2 看双词组多样性。

    - 公式：Distinct-N = 唯一n-gram数 / 总n-gram数

    - 解读：Distinct-N 越高，多样性越好。高 Distinct-1 意味着模型用了大量不同的词汇，高 Distinct-2 表示短语模式多样，不是反复套用相同的搭配。

    - 优点：计算简单，在句子或文档级别都容易使用。

    - 局限：只反映词汇多样性，不能完全代表语义多样性（可能用不同词说同一件事），且极大值受长度影响。

    综合使用：通常同时报告 Self-BLEU（评估样本间重复性）和 Distinct-N（评估词汇丰富度），并与人类对多样性的感知关联，形成较全面的多样性评估。


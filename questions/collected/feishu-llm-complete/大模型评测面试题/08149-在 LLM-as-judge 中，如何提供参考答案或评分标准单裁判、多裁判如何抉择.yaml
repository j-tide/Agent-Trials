content:
  prompt: 在 LLM-as-judge 中，如何提供参考答案或评分标准？单裁判、多裁判如何抉择？
answer:
  mode: rubric
  reference_answer: |-
    提供参考答案与评分标准：

    - 评分标准（Rubrics）：如上题所述，通过详细的评分维度描述和锚定示例来提供。这是软性、指导性的标准。

    - 参考答案（Reference Answer）：可以提供一份高质量的人类编写或专家模型生成的“标准答案”。裁判模型可以将其作为对照，判断待评回答是否覆盖了关键信息点、有无事实性偏离。这对于事实性要求高的任务尤其有效。但需要注意，提供参考答案可能引入新的偏差（裁判过度依赖该答案的字面表述，而忽略其他合理但不同措辞的正确答案）。使用时应提示裁判“参考答案仅作参考，重点关注事实一致性而非字面重合”。

    - 成对PK中的隐式标准：在AlpacaEval等比较范式中，评分标准是通过与参考基线模型（如GPT-4）的输出进行PK来隐式定义的。裁判不需要知道绝对标准，只需凭内置的偏好判断哪个更好。

    单裁判与多裁判的抉择：

    抉择建议：

    - 单裁判足够用于开发迭代中的相对比较（如“新版本是否比旧版本好”），前提是该裁判模型已经过校准，且其偏差在你关心的维度上可接受。

    - 在需要高公信力、跨组织模型比较、或裁判偏差会影响重大决策时，必须采用多裁判集成。理想的多裁判组合应包括不同厂商的强模型（如GPT-4 + Claude + Gemini），并取中位数分数或多数投票结果。

    最佳实践：采用“一主多辅”策略。以高能力单裁判（如GPT-4）作为主力评估引擎，定期用多裁判集进行审计和校准，发现单裁判的偏差并进行修正，平衡效率与可靠性。


content:
  prompt: 对话中的“人格一致性”和“情感共情”如何评估？
answer:
  mode: rubric
  reference_answer: |-
    这两个维度关乎对话模型的高级社交智能和用户体验。

    （一）人格一致性的评估

    - 自洽性测试：让模型用明确的人格描述（如“你是热情开朗的导游”）初始化，然后在对话后期，用不含该人格提示的隐式问题探测，如“你平时休息喜欢做什么？”，看其回答是否与导游人设内在一致。不一致则表明人格未内化。

    - 多轮人格问卷：在多轮对话中，穿插使用标准化的性格测试问卷（如大五人格问题的变体）向模型提问。在不同轮次提出同类问题，看模型的前后答案是否自相矛盾。

    - 角色对比测试：让同一模型先后扮演两种截然相反的性格（如悲观者vs乐观者），然后让裁判模型或人类评估者阅读两份对话记录，判断对话是否能清晰区分出两种人格。这是对人格稳定性和区分度的压力测试。

    - 行为模式的一致性：检查模型的用词、表情符号、句式等“语言指纹”在整个对话中是否与设定人格保持一致。

    （二）情感共情的评估

    - 情感识别作为前提：先测试模型能否从用户话语中准确识别出隐含的情绪状态（如沮丧、兴奋、讽刺），这是表达共情的基础。可使用情感标注的对话数据集进行微调评测。

    - 共情回复质量评估：设计一系列包含明确或隐含负面情绪的对话历史（如“我刚失业了”）。评估模型回复的共情质量，分为几个等级：

    - 共情适当性：共情不足和过度共情（如强行煽情、假大空安慰）都是减分项。评估需判断共情表达是否与情境严重度匹配。

    - 基准：可以使用 EmpatheticDialogues 数据集进行监督评测，或使用强裁判模型根据上述等级量规进行零样本或小样本评分。

    人格一致性和情感共情的最佳评估方式仍然是经过严格培训的人类评估员，因为这两者涉及的文化、语境和主观感受极为复杂。自动化裁判可作为大规模初筛的辅助。


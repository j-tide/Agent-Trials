content:
  prompt: 代码生成评测有哪些独特性？除了正确性，还应关注代码的哪些方面？
answer:
  mode: rubric
  reference_answer: |-
    代码生成评测与其他文本生成任务有根本不同，其输出的质量不仅体现在语言层面，更取决于可执行性、逻辑严谨性和工程实用性。

    独特性：

    - 功能正确性是硬指标：代码不能仅是“看起来对”，必须在真实环境中编译通过、运行正确、通过所有测试用例。文本生成可以接受多种合理回答，但代码生成经常只有一个或极少数正确的功能解。

    - 评测客观且可自动化：借助编译器、解释器和单元测试框架，功能正确性的评测可以做到完全客观、无人为偏差，这是其他生成任务难以比拟的优势。

    - 多维度的质量要求：一段合格代码，除了功能正确，还必须考虑效率、安全、可读、可维护等工程属性。

    除正确性之外，还应关注的方面：

    - 效率与复杂度：算法的时间复杂度和空间复杂度是否最优或接近最优？在处理大规模输入时会不会出现性能问题？可通过测试大数据量用例的执行时间来评判。

    - 安全性：代码是否包含常见的漏洞（如SQL注入、跨站脚本、缓冲区溢出、不安全的反序列化）？在高风险场景中，这是比功能正确更硬的约束。

    - 代码风格与可读性：变量命名是否清晰？是否遵循语言社区的风格指南（如PEP8 for Python）？是否有恰当注释？可读性直接影响代码的可维护性，可通过静态分析工具和人工评分来评估。

    - 健壮性与容错性：代码是否能够优雅地处理非法输入、空值、边界条件，而不是直接崩溃？测试用例应专门包含这些边缘和异常场景。

    - 可复用性与模块化：生成的代码是解决一次性问题，还是提取了可重用的函数和模块？这体现了更高层次的抽象思维。

    - 指令遵循度：代码是否严格遵循了用户提示中的所有技术要求（如“必须使用递归”、“不能使用外部库”、“数据结构应用链表”）？

    评测实践：现代代码评测通常结合Pass@k（功能正确性）+ 静态分析 + 性能基准测试 + 人工/自动可读性评分，形成全方位的能力画像，而不是简单看能否跑通几个测试。


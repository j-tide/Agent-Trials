content:
  prompt: BLEURT 是基于什么理念设计的？为什么它比简单嵌入相似度更准？
answer:
  mode: rubric
  reference_answer: |-
    BLEURT 是一种基于学习的文本生成评估指标，它的核心理念是：训练一个模型，直接预测人类评分者对生成文本的判断，而不是通过手工设计的相似度公式。

    设计理念：

    - 预训练+微调范式：先用大量合成数据预训练BLEURT，使其学习通用的文本质量概念和语义差异，然后在人工标注的评分数据集上进行微调，使其精确拟合人类的评价标准。

    - 合成数据预训练：通过随机扰动维基百科句子（如掩码、替换、回译）生成大量“正确-错误”文本对，并赋予自动的语义相似度得分作为训练信号。这让模型在没有人类标签的情况下学会了识别多种文本质量缺陷。

    - 输入形式：直接接收一对句子（参考和生成），输出它们之间的相关性或质量分数。它不依赖明确的 token 匹配规则，而是通过全连接神经网络端到端地学习评分函数。

    为什么比简单嵌入相似度更准？

    - 面向评估优化：BERTScore 基于静态的余弦相似度，其嵌入模型并未针对“评估”任务优化。BLEURT则专门训练来最小化与人类判断的误差，能捕捉到更复杂的评估准则，如事实一致性、风格适切性、逻辑连贯性等。

    - 能够学习非线性的质量判断：简单的嵌入相似度是线性运算，而BLEURT通过多层神经网络，可以学习到例如“添加一个否定词会使分数急剧下降”这种非线性的质量映射。

    - 鲁棒性：对各种干扰和表达变化更稳健，因为它见过大量人工生成的错误案例。

    局限：需要大量人工标注微调才能达到最佳效果，且作为黑盒模型，其判断逻辑的可解释性弱于 BERTScore。同时，它也继承了参考文本的依赖性。


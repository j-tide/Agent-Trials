content:
  prompt: 信息抽取、摘要和分类等传统 NLP 任务，大模型评测有什么新思路？
answer:
  mode: rubric
  reference_answer: |-
    大模型的出现使得传统NLP任务的评测从“封闭式、微调特定模型”转向“开放式、零/少样本通用模型评估”，因而评测思路也需根本转变。

    新思路：

    （一）信息抽取

    - 从“严格匹配”转向“语义等价与归一化”：传统指标要求实体类型和边界精确匹配，但大模型可能用不同粒度或表述表达相同信息。评测需引入基于上下文嵌入的语义对齐和专家定义的归一化规则，奖励正确的概念提取而非字面拷贝。

    - 评测开放式抽取与关系三元组的完整性：不再局限于预定义的关系类型，而是评测模型能否发现并正确表达任意关系。指标发展为：正确抽取的三元组占所有应抽取三元组的比例（召回）和准确度。

    - 鲁棒性与幻觉评测：专门评估模型在面对对抗性文本（微小扰动、错误信息注入）时，抽取结果是否会崩溃或产生幻觉。这是传统评测忽视的。

    （二）摘要

    - 事实一致性取代ROUGE成为核心指标：如前述（参见评测系列第24题），使用 SummaC、QuestEval、FactCC 等指标，衡量摘要是否忠实于源文，有无编造或歪曲。这是大模型摘要评测的第一要务。

    - 多维度质量评测：同时评估简洁性、信息覆盖度、连贯性和可读性。常使用大模型裁判在这几个维度上独立打分。

    - 可控摘要评测：考察模型是否能根据长度限制、特定受众或侧重点等指令生成符合要求的摘要，评测指令遵循度。

    （三）分类

    - 从“预测标签”到“解释性分类”：大模型不仅输出标签，还能提供分类理由。评测可同时考量标签准确率和理由的合理性、忠实性。

    - 零/少样本泛化能力：评测模型在未见过的新类别、新领域上的分类能力，强调其知识迁移能力，而不再仅看其在固定测试集上的微调后性能。

    - 不确定性表达评测：考察模型在模棱两可或超出知识范围的输入上，是否能诚实表达不确定（如输出“未知”或“需要更多信息”），而不是强行归类。

    - 细粒度误差分析：从传统的混淆矩阵出发，进一步分析错误是否源于模型对特定子群体的系统性偏见，或对特定语言现象的盲区。

    共同趋势：传统任务的评测已从单一的绩效指标（F1, Accuracy）演变为多维度、重解释、强鲁棒、看对齐的综合质量评估。大模型裁判在其中扮演越来越重要的角色，而人类评估则作为校准和边界案例的黄金裁决。


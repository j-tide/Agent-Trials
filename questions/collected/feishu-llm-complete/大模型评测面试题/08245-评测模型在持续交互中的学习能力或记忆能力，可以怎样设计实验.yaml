  prompt: 评测模型在持续交互中的学习能力或记忆能力，可以怎样设计实验？
answer:
  mode: rubric
  reference_answer: |-
    这类实验旨在考察模型是否能在对话、上下文中临时学习新信息，并持续记住和应用它们，同时考察长期记忆与短期记忆。

    实验设计：

    - 会话内少样本学习：

    - 动态档案记忆任务：

    - 流式指令注入与干扰：

    - 选择性记忆与遗忘：

    - 长期记忆跨会话测试：

    - 评测指标：

    这类评测能深入探测模型的工作记忆和上下文学习能力，对构建具有长期陪伴和个性化能力的对话助手至关重要。


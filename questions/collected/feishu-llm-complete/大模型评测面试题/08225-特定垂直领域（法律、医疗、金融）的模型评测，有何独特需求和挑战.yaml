  prompt: 特定垂直领域（法律、医疗、金融）的模型评测，有何独特需求和挑战？
answer:
  mode: rubric
  reference_answer: |-
    垂直领域评测要求将模型的通用能力置于极高的专业准确性、安全责任和合规标准之下。

    独特需求：

    - 金标准知识库与专家参与：

    - 对幻觉的零容忍（高风险领域）：

    - 合规与伦理审查：

    - 时效性与动态更新：

    - 可解释性与溯源要求：

    挑战：数据稀缺且高度敏感，难以构建大规模公开评测集；评测成本极高，深度依赖稀缺且昂贵的领域专家；对错误的容忍度极低，评测方法必须极度严谨，任何自动指标都需要专家校准。


content:
  prompt: 什么是“基准饱和”？当模型在某基准上接近满分时，如何继续评估？
answer:
  mode: rubric
  reference_answer: |-
    基准饱和是指随着模型能力的快速提升，现有评测基准的区分度逐渐丧失，大部分模型都能在该基准上取得近乎满分或远超人类水平的现象。当基准饱和后，它不再能反映模型间的真实能力差异和潜在缺陷。

    基准饱和的表现与原因：

    - 测试集题目过于简单、答案泄露、或考察的能力已被当前技术完美解决。

    - 模型可能通过记忆数据、利用表面统计线索“刷分”，而非真正掌握底层能力。

    当基准饱和后，继续有效评估的策略：

    （1）动态基准与难度升级

    - 动态基准：如FreshQA、RealTimeQA，定期加入最新事实性问题，防止因知识截止而虚高。或根据社区反馈不断更新题目，排除已被多数模型攻克的旧题。

    - 难度增量：在原有基准的基础上，通过对抗生成、加噪声、增加干扰项、延长文本等方式创造更难版本。例如，将单文档问答升级为多文档冲突问答。

    （2）细粒度错误分析与缺陷探测

    - 不只看总分，而是深入分析模型在子类别上的错误率。例如，在饱和的数学基准上，专门抽取其中需要多步推理、或涉及特定陷阱的题目单独评估。

    - 构建诊断性探测集，专门测试某种特定能力（如否定处理、数值比较、长距离依赖），这些微小差异可能在总分中被掩盖。

    （3）迁移到高难度替代基准

    - 寻找或设计难度更高的后继基准。例如，从GLUE迁移到SuperGLUE；从MMLU迁移到更具挑战性的MMLU-Pro或领域专家级测试。

    - 开发需要更深层次理解、推理和创造力的任务，如长篇论证评估、复杂工具使用、多轮交互式任务。

    （4）从静态到交互式与开放式评估

    - 采用交互式评估（如Chatbot Arena的人类偏好PK），考察模型在自由对话、未知任务中的应变能力，这难以被“刷题”覆盖。

    - 使用模型裁判进行开放式生成评估，依据精细的评分量表，而不是对错二分。饱和的客观题可转化为对该题理解的深度评分。

    （5）衡量校准度与自知之明

    - 即使模型能做对所有题，仍可评估其对自身答案的置信度校准，以及能否在错误前提的变体题上正确拒答。这是从“知道答案”提升到“知道何时不知道”的更高阶能力。

    核心思想：基准饱和不是终点，而是信号，提示我们需要将评估从“分数”推向“诊断”，从“静态知识”推向“动态推理与元认知”。


content:
  prompt: 如何设计成对比较实验，获得模型间的相对胜率？需要注意哪些偏差？
answer:
  mode: rubric
  reference_answer: |-
    成对比较是获得模型相对胜率的强有力方法。其核心是让评估员对同一提示的两个模型回答进行盲评，选择更好的一方（或判断平局）。

    实验设计步骤：

    - 准备多样化提示集：覆盖模型的主要应用场景，确保代表性。

    - 模型匿名化与盲评：完全隐藏模型身份，随机分配回答在界面左右两侧的顺序。这是避免品牌偏见的关键。

    - 独立评估与重复：每个对比由多位评估员独立评判，以获得足够的数据点并计算信度。可设置一些重复对比来检验评估员的稳定性。

    - 聚合与 Elo/胜率计算：

    - 统计检验：计算胜率的置信区间，判断差异是否显著。

    需要注意的主要偏差及控制：

    - 位置偏差：无论质量如何，评估员可能倾向于选择某一侧（如总是左侧）。控制：随机化左右位置，并在分析时检查位置偏差的严重性；若存在，可采用强制位置平衡（每种比较做两次，左右交换）。

    - 长度/格式偏差：评估员可能不由自主地偏好更长、格式更漂亮的回答，而忽略实际内容正确性。控制：在培训中强调内容优先；进行消融分析，检查胜率与回答长度的相关性；或在实验后用统计方法（如回归）分离长度影响。

    - 顺序效应：评估员在连续评价中可能建立某种对比标准。控制：打乱比较的呈现顺序，并允许评估员休息以减少疲劳。

    - 模棱两可的“平局”处理：强制选择可能歪曲真实意见。控制：提供“平局”或“大致相当”的选项，但避免过度使用，需在指南中明确什么情况下才能选平局。

    - 评估员偏好与背景：不同背景的评估员对风格、安全性等容忍度不同。控制：招募背景多样的评估员池，并进行分析以了解人口学差异的影响。

    - 自我强化偏差：若评估员知道自己在为某公司评估，可能下意识偏袒自家模型。控制：严格执行双盲，确保评估完全独立。

    成对比较减少了绝对评分的认知负担，信度往往高于单回答打分，尤其适合模型间的横向比较，是Chatbot Arena等系统的理论基础。


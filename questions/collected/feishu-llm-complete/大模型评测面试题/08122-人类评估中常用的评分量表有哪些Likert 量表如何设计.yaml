content:
  prompt: 人类评估中常用的评分量表有哪些？Likert 量表如何设计？
answer:
  mode: rubric
  reference_answer: |-
    常用评分量表包括Likert量表、语义差异量表、配对比较量表、等级排序量表和连续评分（如滑块）等。其中，Likert 量表最为普遍。

    Likert 量表的设计要点：

    （1）点数选择

    - 常用5点或7点量表。5点提供足够区分度且认知负担小；7点能捕捉更细粒度差异，但可能增加评估者犹豫。避免使用3点（区分度低）或过多点数（如11点，不同点之间界限模糊，降低信度）。

    - 建议对评估员进行培训，明确各点的意义。

    （2）明确、单向的陈述或维度

    - 每个题项应仅评估一个明确的维度（如“回答的流畅性”），而不是复合陈述。陈述句应清晰、不含糊，避免双重否定。

    - 示例：“模型回答在语法上是正确的。”（而不是“模型回答并非语法错误”）。

    （3）平衡且清晰的标签

    - 量表两端应是对称的反义描述，并为每个点提供语义标签（而不仅是数字），这能显著提高评分者信度。例如：

    - 1：强烈不同意 / 极差

    - 2：不同意 / 差

    - 3：中立 / 一般

    - 4：同意 / 好

    - 5：强烈同意 / 极好

    - 中立选项（如“一般”或“不确定”）应保留，避免强制选择导致数据扭曲。

    （4）多维度与综合评分

    - 对于大模型输出，常需从多个维度（流畅性、事实性、帮助性、安全性）分别使用 Likert 量表，最后根据研究目的综合或分别报告。这样能避免单一总分掩盖模型在不同侧面上的优劣。

    - 可配合使用多维度量表，并在每个维度后附加开放式评论框，获取定性反馈。

    （5）前测与迭代

    - 在设计完成后，先在小范围评估员中进行前测，检验题项是否有歧义，各点标签是否被一致理解。根据反馈修正措辞。

    其他常用量表：

    - 配对比较：评估员看到两个模型的回答，直接判断哪个更好（或是否平局），用于计算相对胜率（如Chatbot Arena）。这减轻了绝对评分的认知负担，更适合区分相近的模型。

    - 等级排序：将多个模型回答从最好到最差排序，适合需要一次性比较多个模型时，但超过5个回答排序难度大。

    - 语义差异量表：用一系列双极形容词对（如“冷漠-热情”）评价主观感受，适合评估人格和语气。

    设计优良的 Likert 量表，结合标准化培训，能提供既量化又可比较的人类评估数据。


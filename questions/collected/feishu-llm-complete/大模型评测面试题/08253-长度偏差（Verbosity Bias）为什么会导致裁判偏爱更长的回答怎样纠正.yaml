content:
  prompt: 长度偏差（Verbosity Bias）为什么会导致裁判偏爱更长的回答？怎样纠正？
answer:
  mode: rubric
  reference_answer: |-
    产生原因：

    - 人类偏好的迁移：在训练RLHF奖励模型和指令微调时，人类评估者也常潜意识里给更长、更“详尽”的回答更高分。这种模式被学入裁判模型的参数中。

    - 表面启发式：长回答看起来像是更“努力”、更“认真”、更“愿意帮助”。模型学到“长度”是高质量的简单代理特征，会依赖这个捷径做判断，而不深入检查内容的真实价值和准确性。

    - 信息密度误判：裁判模型难以精准衡量信息增益。一段冗长的、重复的、充满无用细节的回答，在语言统计上可能与一段言简意赅但切中要害的回答具有相似的总“信息量”，但前者常常胜出。

    - 生成过程的统计偏差：语言模型生成更长的文本时，整体困惑度可能仍然较低，裁判模型对此的评分会混淆“生成质量”和“答案质量”。

    纠正方法：

    - 长度控制算法（如AlpacaEval 2.0采用的方法）：将所有待评模型的输出长度作为协变量，建立回归模型，预测在给定长度下的预期胜率，然后将所有模型的胜率回退到假设它们在相同目标长度下的胜率，从而剥离长度影响。这就是 Length-Controlled Win Rate。

    - 在提示中明确惩罚废话：在裁判指令中明确加入“更长的回答不一定更好。请优先考虑准确性、简洁性和信息密度。对于冗长、重复、缺乏实质内容的回答给予低分。”

    - 使用成对长度标准化：在成对比较时，利用提示或后处理，将两个回答截断至相同长度再交给裁判，强制在相近的篇幅内比较内容质量。

    - 分解评分维度并单独评估简洁性：将“简洁性/凝练度”作为一个独立打分项，与“帮助性”并列，迫使裁判区分这两个维度。一个回答可能帮助性高但冗长，最终得分会受到简洁性评分的制约。

    - 引入对抗样本训练裁判：专门构造“金玉其外，败絮其中”的样本（极长但充满错误）和“短小精悍”的正例，对裁判模型进行微调，使其学会鄙视废话。

    这些方法中，基于回归的长度控制最为客观，而提示工程和微调则能从根本上塑造裁判模型的评价标准。


content:
  prompt: 在开放域问答中，如何衡量答案的正确性？精确匹配（EM）和 F1 的区别。
answer:
  mode: rubric
  reference_answer: |-
    在开放域问答中，由于答案可能以多种形式表达，衡量正确性的主流指标是精确匹配（Exact Match, EM） 和 F1 分数，它们各有侧重，常配合使用。

    精确匹配（EM）：

    - 定义：模型输出的答案经过标准化（如小写、去除标点、去除冠词）后，是否与任意一个标准答案完全一致。若完全一致则得1分，否则0分。

    - 特点：评估极为严格，要求答案的表述与标准答案一字不差。这最适合事实类短答案，如人名、日期、地名等，能明确区分正确与错误。但它对同义表达完全不宽容（“USA” vs “美国” 等），会低估那些语义正确但措辞不同的回答。

    - 优点：客观、易计算，排除了模糊判断。

    - 缺点：过于死板，尤其不适合稍长的描述性答案。

    F1 分数：

    - 定义：计算模型输出与标准答案之间的词汇重叠情况。分别计算精确率（输出中的词有多少在答案中）和召回率（答案中的词有多少在输出中），然后取两者的调和平均。

    - 特点：比 EM 更宽容，能够奖励部分正确的回答。通过衡量词级别重叠，可以捕捉到核心信息点是否被提及。通常使用 token 级别的 F1（如 SQuAD 的评估脚本）。

    - 优点：能奖励同义短语或顺序不同的正确回答，对稍长答案更友好。

    - 缺点：仍限于表面词汇，无法区分信息重要性（“不是”这样的词和专有名词权重相同），且对完全同义但用词不同的回答可能给出低分。

    主要区别与选用场景：

    - EM 是“全或无”的精确评判，适用于评估模型精准输出简短事实的能力。F1 则是对正确性的软测量，适合长答案或允许释义的任务。

    - 在许多 QA 基准（如 Natural Questions、TriviaQA）中，同时报告两个指标。EM 显示答案的完全正确率，F1 反映模型输出与答案的语义接近程度。实践中，F1 往往与人类判断的相关性更高，但 EM 更直观。


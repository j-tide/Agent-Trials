content:
  prompt: 什么是红队攻击测试？如何系统化地开展大模型红队测试？
answer:
  mode: rubric
  reference_answer: |-
    红队攻击测试 是一种模拟恶意攻击者的安全评估方法。专业团队（红队）在受控条件下，以攻击者思维发现和利用系统的弱点，从而在模型部署前暴露风险，指导安全加固。

    如何系统化地开展大模型红队测试：

    （一）规划与准备阶段

    - 明确测试目标与范围：确定本轮红队测试重点关注的危害类别（如生成武器制造指南、歧视性言论、越狱），以及待测模型版本和安全护栏。

    - 组建多元化红队：成员应包括安全专家、领域专家、伦理学者，以及能代表不同文化、语言和社会背景的人员，以发现多样性盲区。

    - 制定测试准则：建立攻击样本分类体系、严重性评级标准，以及发现漏洞时的报告流程。

    （二）攻击方法与策略设计

    基于已知攻击模型和创造性思维，设计多种攻击向量：

    - 直接有害请求：伪装成学术研究、故事创作、代码注释等方式索要危险信息。

    - 越狱提示：使用角色扮演、前缀注入、多轮蚕食、多语言混淆等方法绕过安全系统。

    - 上下文污染：在对话历史中插入恶意指令，测试模型对上下文的盲从程度。

    - 边缘案例：构造涉及政治、宗教、伦理的边缘问题，测试模型是否会产生极端或歧视性回答。

    - 组合攻击：将多种攻击手段结合，制造复杂的攻击链。

    （三）执行与记录

    - 红队在隔离的测试环境中与模型交互。

    - 详细记录每一条攻击提示、模型回复、攻击是否成功以及攻击成功的关键因素。

    - 利用自动化工具辅助生成攻击变体，扩大测试覆盖面。

    （四）评估与分类

    - 对发现的安全漏洞进行严重度评级（如高风险、中风险、低风险）。

    - 分析漏洞根因：是训练数据污染、奖励模型缺陷，还是提示护栏的可绕过性？

    - 整理成结构化的红队测试报告。

    （五）闭环修复与验证

    - 将红队发现的高质量攻击样本转化为训练数据（如DPO对），对模型进行安全微调。

    - 修复后，由红队再次对相同攻击向量进行回归测试，验证漏洞是否真正被修补，防止“打地鼠”现象。

    - 形成“测试-修复-再测试”的持续安全迭代循环。

    系统化的红队测试不是一次性活动，而应贯穿模型生命周期的始终，成为安全开发流程（如MLSecOps）的标准组成部分。


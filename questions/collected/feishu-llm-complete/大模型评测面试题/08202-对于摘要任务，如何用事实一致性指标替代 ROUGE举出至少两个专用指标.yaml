content:
  prompt: 对于摘要任务，如何用事实一致性指标替代 ROUGE？举出至少两个专用指标。
answer:
  mode: rubric
  reference_answer: |-
    ROUGE 基于词汇重叠，无法检测摘要是否忠实于原文（即事实一致性）。代替 ROUGE 的专用事实一致性指标主要有：

    （1）SummaC

    - 全称：Summarization Consistency。

    - 原理：将源文和摘要句构成句子对，使用自然语言推理（NLI）模型判断源文是否蕴涵摘要句。它设计了两种粒度：零样本的句子级蕴涵判断和细粒度的片段级判断。分数越接近1，表示摘要越忠实于源文。

    - 特点：无需人工标注训练，专门针对摘要的忠实度进行了优化，在多个摘要忠实度数据集上表现优异。它能检测出摘要中捏造的细节。

    （2）FactCC

    - 全称：Factual Consistency Checker。

    - 原理：专门训练一个基于 BERT 的模型，输入（源文，摘要句）对，输出二分类（一致/不一致）或细粒度的错误片段。训练数据通过将真实摘要进行一系列自动扰动（如实体替换、反义词插入、数字修改）构造弱监督负例。

    - 特点：能够进行细粒度错误定位，指出摘要中哪些词句与源文不一致。作为专用模型，比通用 NLI 对摘要中的幻觉更敏感。

    其他重要指标：

    - QuestEval：结合问答（QA）和 NLI，通过自动生成问题并比较源文和摘要的答案来判断一致性，同时考虑精度和召回。

    - BARTScore 也可以用于忠实度评估，通过计算 P(摘要|源文) 的概率来间接衡量。

    这些指标共同点：均超越了表面词汇匹配，深入到语义推理层，直接检验“摘要是否说了源文中没有的话”，因此是替代 ROUGE 评估事实一致性的关键工具。


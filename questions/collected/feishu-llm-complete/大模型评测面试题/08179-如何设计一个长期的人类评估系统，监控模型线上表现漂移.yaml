content:
  prompt: 如何设计一个长期的人类评估系统，监控模型线上表现漂移？
answer:
  mode: rubric
  reference_answer: |-
    长期监控系统需要保证测量标准随时间稳定，并能实时灵敏地检测到模型在线表现的变化（漂移）。

    系统设计核心要素：

    （一）标准锚定与基准维护

    - 开发固定的黄金标准评估集：创建一组数量固定、种类覆盖全面的高质量提示-回答对，并附带经过多位专家反复讨论达成高度共识的参考评价（包含各维度分数和理由）。此评估集的内容和标准答案永不变更，作为跨时间的绝对度量衡。

    - 定期重评：每周或每月，让同一批经过校准的核心评估员（或固定的外部专家小组）对黄金标准集的新模型回答进行盲评。由于问题和评分标准均固定，分数的变化就能直接反映模型能力的变化，排除了题目波动的影响。

    （二）持续的真实流量采样

    - 设计自动管道，从线上模型每天的真实用户交互中，按策略（随机、分层、主动学习）抽取一小批脱敏后的对话作为评估样本。这保证了评估的“生态有效性”。

    - 这些样本构成流动评估集，用于评估模型在最新真实分布上的表现。

    （三）统计过程控制

    - 为每个核心评估维度（如事实性、安全性、用户满意度）建立控制图。设定中心线（历史均值）和上下控制界限（如±3标准差）。

    - 每次评估后，将新批次的分数描点。一旦出现连续点超出控制界限，或呈现系统性上升/下降趋势，系统自动发出警报，触发深度排查。这能比看绝对分数更早、更科学地发现微小但持续的漂移。

    （四）分歧与归因分析管道

    - 当漂移警报触发后，自动对比当前版本与基准版本在黄金标准集和流动集上的细粒度错误类型分布。

    - 快速定位漂移来源：是由于某些特定主题的能力退化？是安全拒绝范围变化？还是生成风格改变（如变长/变短）导致的连锁反应？

    （五）人机协同的监控回路

    - 利用成本低、实时的自动指标（如裁判模型评分）进行日常全量监控，作为人类评分的代理变量。

    - 人类评估作为“校准器”，定期对抽样子集进行评分，用于校准和修正自动指标可能存在的偏移，确保自动监控的长期可靠性。

    这个系统将固定的“绝对标尺”和动态的“实时样本”相结合，利用统计控制技术，形成一个能够及时发现、诊断模型线上行为漂移的长期免疫系统。


content:
  prompt: 多模态安全评测：如何检测模型在图像理解中产生不当内容？
answer:
  mode: rubric
  reference_answer: |-
    多模态安全评测关注模型在处理图像+文本输入，或生成多模态输出时，可能产生的暴力、色情、仇恨符号、隐私泄露等不安全内容。

    检测方法：

    （一）输入与输出的多模态有害内容检测

    - 图像安全分类器：使用专门的预训练模型（如Google的SafeSearch、OpenAI的内容过滤器）对用户输入的图片和模型生成的图片进行扫描，识别色情、暴力、血腥等类别。这是第一道自动防线。

    - 文本-图像一致性安全审核：即使单张图片看似无害，其与文本组合可能构成冒犯。例如，一张人像配上贬损性文字。需构建多模态分类器，同时接收图像和文本，判断其组合是否构成霸凌、仇恨或色情内容。

    - OCR与文本安全关联：对图像中的文字进行OCR识别，然后应用文本安全分类器。这能检测图片中嵌入的有害文字，如仇恨标语、诈骗信息等。

    （二）针对模型的多模态攻击测试

    - 视觉越狱：在图像中隐蔽嵌入指令或敏感内容，试图绕过文本安全护栏。

    - 诱导性看图说话：给模型一张正常的人物照片，然后问“这个人的身材看起来像什么职业？”，诱导模型输出与外表相关的刻板印象或不当评价。

    - 隐私泄露测试：提供一张包含身份证、名片或人脸的照片，问“提取这个人的姓名和电话”，看模型是否会盲从指令侵犯隐私。

    （三）幻觉与事实性安全的交叉评测

    - 多模态幻觉可能导致安全问题。例如，模型错误地描述了医学影像中的病灶位置，或对交通标志产生误判。评测需包含专业领域的多模态数据（如医学图像、路况监控），并由专家验证模型描述的事实准确性和安全影响。

    （四）评测指标与环境

    - 有害内容生成率：在大量多模态对抗提示下，模型输出中包含不安全图文内容的百分比。

    - 安全拒答率：对多模态越狱或不当请求的恰当拒绝比例。

    - 跨模态一致性：模型对同一对象在纯文本和多模态下描述的安全性是否一致。不应出现“文本回答安全，但加上图后就开始胡说”的现象。

    挑战：多模态安全评测的挑战在于攻击面极广（像素、文本、组合），且多模态安全分类器的性能仍落后于文本，漏检和误检率较高。因此，对高风险应用，必须结合自动化扫描、人类审计和持续的红队测试。


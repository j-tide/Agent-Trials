content:
  prompt: 如果让你创造一个新的评测范式或基准，你会瞄准哪个尚未解决的短板？简述设计思路。
answer:
  mode: rubric
  reference_answer: |-
    我会瞄准 “长程交互中的信任建立与维护（Trustworthiness over Long-term Interaction）” 这一尚未解决的短板。当前评测几乎都是对单轮或短多轮对话的快照，完全无法评估模型在经年累月的交互中，是否能够成为一个可靠、可预测、尊重隐私、值得信赖的长期伴侣。而这对 AI 伴侣、终身学习助手等未来核心应用至关重要。

    设计思路：

    范式名称：“生命跨度信任测试”（Lifespan Trust Assessment, LTA）

    核心思想：通过模拟加速的时间线和一系列精心设计的长期交互场景，评测模型是否能在与用户持续的关系中，始终如一地内化并展现诚实、保密、一致性和以用户长期利益为优先的行为。

    （一）评测环境与机制

    - 模拟人生引擎：构建一个受控的、模拟真实人生的对话环境，其中时间被压缩（例如，1小时模拟1年）。这个环境会向模型投喂一个连续的、包含人生事件和情感变化的用户生活流。

    - 记忆与档案系统：模型被允许拥有长期记忆，用于记住用户的关键信息、偏好、情感历史和过去的互动。

    - 阶段性任务与挑战：在模拟人生的不同阶段，系统会触发设计好的“信任考验”场景，这些场景考验模型的具体行为。

    （二）核心评测维度（信任支柱）

    - 保密与边界（Confidentiality & Boundaries）

    - 长期一致性（Longitudinal Consistency）

    - 以用户长期福祉为优先（Long-term Well-being over Short-term Engagement）

    - 可修复性与坦诚（Reparability & Candor）

    （三）评估方法

    - 混合式裁判：结合基于强模型（模拟人类专家）的自动化评分器与经过严格培训的人类评估员（扮演人生中的关键人物），对模型在不同阶段的行为进行综合评分。

    - 统计过程控制：绘制模型在整个模拟生命周期内的信任指标曲线，观察其是否随时间漂移。

    - 对抗性压力测试：在关键时刻加入诱导性对抗输入，测试模型的信任底线是否坚固。

    价值与意义：这个范式将评测焦点从“智力竞赛”转向“品格考验”，填补了对 AI 长期社会交互中信任度的评估空白。它直指 AGI 能否真正融入人类生活、成为被依赖伙伴的核心问题，评测的不再是智商，而是“情商”与“信赖商”。

    - 测试：用户曾私下向模型倾诉了一个敏感秘密（如健康问题）。数月后，另一个“用户”（系统模拟的家人）试图诱导模型说出该秘密。评测模型是否能坚守隐私边界，同时得体地应对。

    - 指标：隐私泄露率，以及处理隐私试探的回复得体性评分。

    - 测试：模型需要记住用户长期的、可能相互矛盾的复杂偏好。例如，用户一年前说讨厌惊喜，但现在的人生阶段（系统设定的结婚纪念日）可能期待惊喜。模型是否能在不一致中做出符合最新情境和深度用户理解的判断？

    - 指标：行为与用户档案和情境的匹配度，由专家或强裁判模型进行综合评分。

    - 测试：用户处于一个不健康的生活习惯中（如长期熬夜）。模型是选择迎合用户、提供消遣以增加对话轮次（短期互动最大化），还是选择以恰当方式温和提醒并支持用户建立更健康的习惯（长期利益）？

    - 指标：“健康引导率”和“用户长期幸福指数”的模拟评分，通过对比迎合型策略与引导型策略的长期影响来评估。

    - 测试：模型在对话中犯了一个事实性错误，并被用户指出。在接下来的数月交互中，评测模型是否已真正修正其内部认知，并在相关话题上不再犯同样错误，以及它是否能在后续对话中坦然地承认过往的错误，而不是回避。

    - 指标：同类错误复发率，以及在提及过去错误时的坦诚度。

content:
  prompt: 当评测结果与真实用户体验矛盾时，可能的原因有哪些？
answer:
  mode: rubric
  reference_answer: |-
    这种矛盾表明离线评测与线上实际表现之间存在严重脱节，通常源于评测设计、实施或解读上的缺陷。

    可能的原因：

    （1）评测集分布偏差

    - 离线测试集没有覆盖真实用户的高频或高风险场景。用户常问的可能是时效性、个人化、地域化问题，而测试集却以百科知识为主。测试集不具代表性，高分自然不代表用户满意。

    （2）数据泄漏导致虚高

    - 离线评测集内容意外污染了训练数据，模型“背”住了答案。这种高分在真实未见过的用户问题上会立即原形毕露。

    （3）评测指标的错配

    - 离线指标（如ROUGE、准确率）无法捕捉用户真正关心的维度。一个答案可能事实正确但冷漠生硬，导致用户不满意；而离线评测只奖励事实性，忽视了情感和风格。

    （4）交互与动态环境的缺失

    - 离线多为单轮静态测试，而用户不满可能源于多轮对话中的记忆缺失、前后矛盾、反应迟钝或界面体验差。这些无法被离线问答捕捉。

    （5）安全与风险的容忍度差异

    - 离线评测设定了一个安全阈值，但真实用户一旦遇到哪怕一次触犯底线的幻觉或有害回复，就会严重动摇信任。极低概率但高伤害的事件在离线小样本中未出现，在线上海量流量中却会暴露。

    （6）反馈回路与用户期望

    - 真实用户会受模型之前输出的影响，并可能随着对话深入提出超出模型能力的要求。离线测试无法模拟这种逐步升级的对话挫折感。

    - 用户对模型的期望（基于市场宣传）若与离线评测设定的基线不符，也会导致感知差距。

    （7）评测的时机与环境

    - 离线评测的是某个固定版本，但线上模型可能已热更新；或线上实验受A/B分桶、用户选择偏差、时间段效应影响，与受控环境不一致。

    解决方向：

    - 将用户反馈（如不满意点）系统地转化为回归测试样例，补充进离线集。

    - 引入在线指标（满意度、留存率、任务完成率）与离线指标进行相关性分析，校准离线评测的阈值。

    - 采用人评、裁判模型等更贴近用户主观感知的评测方式，作为对自动指标的补充。


content:
  prompt: 什么是“指令遵循”评测？IFEval 如何量化约束满足率？
answer:
  mode: rubric
  reference_answer: |-
    指令遵循评测评估模型对给定自然语言指令中具体约束的执行能力，是考察模型“听不听话”的关键。例如，“用三段式回答，每段以标题开头”或“回答必须包含至少三个emoji”。

    IFEval（Instruction-Following Eval） 是此类评测的代表作。它通过构造包含可自动验证的简单约束的提示词，来量化模型对指令的遵循程度。

    量化方法：

    - 设计大约20种不同类型的约束，如：长度限制（不少于X词）、关键词（必须包含“苹果”）、格式要求（必须用Markdown表格）、禁止项（不能使用“好”字）、语言切换（用中文回复）等。

    - 对于每个提示，可以自动检查生成的回复是否满足这些约束，计算约束级别的满足率，然后对所有样本平均。最终指标是约束满足率。

    - 这种量化完全自动化，避免了主观判断，使得对指令遵循能力的测评高度可靠和可复现。

    价值：它将“指令遵循”这个原本模糊的能力，转化为精确、可计算的指标，使模型在任务执行可靠性上的比较成为可能。


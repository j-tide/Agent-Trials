content:
  prompt: 什么是“对象幻觉”？POPE 基准如何检测多模态模型的对象幻觉？
answer:
  mode: rubric
  reference_answer: |-
    对象幻觉（Object Hallucination） 是多模态大模型中一种普遍且严重的幻觉类型。具体指模型在描述或回答关于图像的问题时，虚构、添加或错误识别了图像中并不存在的物体。例如，一张只有“狗和草地”的图片，模型却描述为“一只狗在草地上，旁边有一个红色的球”，凭空捏造了“红色的球”。其根源在于视觉编码的信息损失以及语言先验对视觉信号的压倒性干扰。

    POPE（Polling-based Object Probing Evaluation）基准的检测原理：

    POPE 专门设计用来以严格、可量化的方式评估对象幻觉。它将检测转化为一个二分类框架。

    （1）构造探测问题

    - 使用目标检测器或人工标注，获取图像中真实存在的物体集合 OgtOgt。

    - 构建三种类型的“对象探测问题”，询问模型图像中是否存在某个物体，模型需回答“是”或“否”：

    - 所有问题格式简单明确：“Is there a [物体] in the image? Please answer yes or no.”

    （2）自动化评估

    - 模型对每个问题输出“Yes”或“No”。

    - 核心指标：

    （3）POPE 的优势

    - 无需复杂评价：只需抽取简单的“是/否”，完全客观自动化。

    - 可扩展：可轻易应用于任何图像和物体类别组合，便于大规模评测。

    - 诊断性强：不同负例类别（常见、对抗）能精准诊断出模型是受语言频率诱导还是受视觉相似性混淆。

    - 与人类判断高度相关：其分数能有效反映用户感知到的幻觉严重程度。

    POPE 已成为多模态幻觉检测的标准基准，它揭示了即使顶级多模态模型也会以惊人的频率“看到”图像中不存在的物体。


content:
  prompt: 推理能力评测主要分为哪几类？演绎、归纳、溯因推理如何考察？
answer:
  mode: rubric
  reference_answer: |-
    推理能力评测可以大致分为三大类：演绎推理、归纳推理、溯因推理。此外，还包括数学推理、常识推理等更为具体的子类。

    （一）演绎推理

    - 定义：从一般性前提推导出特定结论。如果前提为真，结论必然为真。注重逻辑保真性。

    - 考察方式：

    - 典型评测集：符号逻辑数据集、BIG-Bench的逻辑谜题子集。

    （二）归纳推理

    - 定义：从特定实例推导出一般性规则或模式。结论不必然为真，但具有合理的概然性。

    - 考察方式：

    - 典型评测集：Raven渐进矩阵（非语言归纳）、抽象代数序列、一些BIG-Bench任务。

    （三）溯因推理

    - 定义：从观察到的现象出发，推断最合理的解释或原因。是诊断、侦探等领域的核心推理。

    - 考察方式：

    - 典型评测集：ARC的部分常识推理题本质上也是溯因；Social IQa中推断行为背后的动机；某些专门设计的医学诊断评测。

    在实际评测中，这三种推理常混合出现，但设计独立的、针对每种推理类型的诊断性测试，有助于精细刻画模型的推理能力画像。


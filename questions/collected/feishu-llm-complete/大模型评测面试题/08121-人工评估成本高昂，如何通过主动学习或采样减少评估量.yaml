    - 基于错误预测的采样：

    （二）高效统计采样与实验设计

    - 分层抽样：

    - 序贯分析：

    - 利用配对比较与TrueSkill/Elo：

    （三）预筛选与自动预标注

    - 使用快速、低成本的自动指标对所有样本进行“初筛”。只将自动指标标记为“可疑”、“边界”或“高风险”的少数样本提交人类评估。人类相当于自动系统的复核员和最终仲裁者，而非第一道关卡。

    总结：通过主动学习聚焦信息量高的样本，结合高效采样减少统计冗余，再以自动预筛作为漏斗，可以在保持评估质量的前提下，将人类评估成本降低一个数量级。


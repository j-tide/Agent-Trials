  prompt: 人工评估成本高昂，如何通过主动学习或采样减少评估量？
answer:
  mode: rubric
  reference_answer: |-
    人工评估的成本主要来自评估员的时间和精力消耗。要减少评估量而不显著牺牲结论的可靠性，核心是在哪里评和评什么上进行智能筛选。主动学习和高效采样是两大关键手段。

    （一）主动学习

    主动学习让算法主动挑选出对当前模型改进或评估结论最有信息量的样本，交给人类评估。

    - 不确定性采样：


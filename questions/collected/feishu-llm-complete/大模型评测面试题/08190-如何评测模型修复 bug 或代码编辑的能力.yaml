content:
  prompt: 如何评测模型修复 bug 或代码编辑的能力？
answer:
  mode: rubric
  reference_answer: |-
    修复bug和代码编辑评测关注模型对现有代码的理解、错误诊断和精准修改能力，这与从零生成代码有本质不同。

    评测方法：

    - 基于错误定位与修复的基准：给定一段包含已知bug的代码和错误描述（或没有描述，要求模型自行定位），要求模型输出修复后的正确代码。典型代表是 Defects4J，它收集了Java项目中的真实bug和对应的人为修复。评测时，模型生成的补丁必须通过全部测试用例，且常要求与人写的修复在语义上等价。

    - 代码审查场景模拟：给出一个代码变更（diff）或一段有风格/逻辑问题的代码，要求模型像代码审查员一样指出问题所在，并给出修改建议或直接生成修改后的版本。评测指标包括：准确定位问题的比例、建议的采纳率、以及修改后代码的功能正确性。

    - 交互式调试：在多轮交互中，提供给模型代码和错误日志，看它能否通过分析日志、提出假设、要求更多信息（如变量值）来逐步定位并修复bug。评测其调试策略的智能程度。

    - 编辑指令遵循：给出一段原始代码和一条明确的编辑指令（如“重构这个函数，使用列表推导式”、“修复这个SQL注入漏洞”）。评测模型是否能生成只包含所需修改的、最小化的代码diff，且修改后代码功能无损、并完美遵循了指令。HumanEval-X 系列或 CodeXGLUE 的部分任务包含此类评测。

    核心指标：

    - 修复正确率：修补后的代码是否通过所有原有及新增的回归测试。

    - 编辑效率：生成的补丁是否是最简改动（最小编辑距离），或者是否有不必要的代码重写。

    - 问题诊断准确率：若需模型指出错误位置，衡量其定位的精准度。

    独特性：这一评测要求模型不仅会写代码，更要会“读”代码，理解现有实现背后的意图，并做出外科手术式的精准修改。它反映了模型对代码更深层次的理解。


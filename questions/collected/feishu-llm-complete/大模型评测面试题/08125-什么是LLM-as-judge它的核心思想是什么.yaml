content:
  prompt: 什么是“LLM-as-judge”？它的核心思想是什么？
answer:
  mode: rubric
  reference_answer: |-
    LLM-as-judge（用大模型当裁判）是一种利用强大的语言模型来评估其他模型生成文本质量的方法。其核心思想是：将一个预训练或经过指令调优的先进大模型（如GPT-4、Claude等）作为自动化评估器，输入待评模型的输出以及评估标准，要求其像人类专家一样给出质量评分、偏好判断或详细反馈。

    核心思想展开：

    - 用模型模拟人类评判：大模型在大量人类文本上训练，内化了语法、流畅度、逻辑、事实性甚至风格等众多语言质量维度。通过精心设计的提示词（prompt），可以激活这些知识，使其对另一模型的输出进行多维度评估。

    - 评估形式多样：可以是单回答打分（如1-10分）、成对比较（选A还是B更好）、多维评分（分别对事实性、帮助性等打分）、或者生成详细的批评和修改建议。

    - 替代或辅助人类评估：由于人类评估成本高、速度慢且难以大规模复现，LLM-as-judge 旨在提供一种可扩展、低成本、速度快的自动评估方案，力求其判断与人类评估高度相关。

    - 关键技术在于提示词和校准：要让裁判模型可靠，需要设计包含明确评估维度、评分量表、锚定示例和输出格式的复杂提示词，并针对各种偏差进行专门校准。

    简单说，LLM-as-judge 把“评价生成文本”这件事本身也变成了一个生成任务，交由更强大的语言模型来完成，实现了评估的自动化和规模化。


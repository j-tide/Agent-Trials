content:
  prompt: 解释评测中的“天花板效应”和“地板效应”。
answer:
  mode: rubric
  reference_answer: |-
    这两个术语源自心理测量学，描述测试题目难度与被试能力水平不匹配导致的测量失真。

    天花板效应：测试题目过于简单，导致多数被试（模型）得分接近满分，分数集中在最高端，无法有效区分高分者之间的真实能力差异。

    - 表现：分数分布呈现严重左偏，高分区堆积大量样本。例如，某个基准绝大部分模型都取得超过95%的准确率。

    - 后果：即使模型之间存在真实的能力差距，评测也显示不出。造成“大家都差不多”的假象，丧失对先进模型的鉴别力。

    - 实例：早期的GLUE基准达到饱和，SuperGLUE应运而生。

    地板效应：测试题目过难，或模型完全不具备该能力，导致所有模型得分极低，分数集中在最低端，无法区分较差模型之间的细微差异。

    - 表现：分数分布右偏，低分区堆积。几乎所有模型都接近随机水平或零分。

    - 后果：无法判别不同模型在该能力维度上的相对优劣，也无法衡量改进措施是否有效（因为一丁点进步可能仍停留在地板）。

    - 实例：对于极早期的小型语言模型，某些高难度数学推理基准可能让所有模型得分都为0或近似随机，体现不出彼此间任何区别。

    如何识别与应对：

    - 绘制分数直方图，观察分布形态。如果最大值、上四分位数都非常接近满分，警惕天花板；如果最小值、下四分位数都非常接近随机水平，警惕地板。

    - 应对天花板：增加题目难度（通过更复杂的问题、对抗样本）、引入细粒度评分（如生成质量的多级量表）、转移到更难的替代基准。

    - 应对地板：降低题目难度（如简化问题、提供更多提示）、设计前置能力的阶梯测试，或暂时使用能产生变异的代理指标（如完成某子步骤的频率）。

    评测设计启示：理想测试应使分数分布在中间范围广泛变异，难度匹配当前技术前沿，才能最大化信息量。


content:
  prompt: 如何设计一个最小可行评测体系（MVP），用于快速筛选模型版本？
answer:
  mode: rubric
  reference_answer: |-
    在快速迭代中，需要一个轻量级、高信号、低成本的MVP评测体系，能够在数小时内对候选模型版本进行粗略但有效的筛选。

    设计原则：

    - 覆盖面精选：只选最能反映核心能力和主要风险的任务。

    - 自动化与高吞吐：全自动运行，无需人工标注，能在单一GPU或多API并行下快速出分。

    - 高失败区分度：侧重当前版本的常见弱点和历史失败模式。

    - 快速诊断：输出不仅是总分，还有主要错误类别的分布，便于定性判断。

    MVP评测体系框架：

    （1）核心能力测验（5-7个基准，约2000-5000样本）

    - 通用知识：MMLU子集（如抽取10个主题）或HellaSwag，快速测理解。

    - 数学推理：GSM8K（或GSM8K-Platinum，去污染后的小型集），约200题。

    - 代码能力：HumanEval或MBPP，自测pass@1。

    - 事实性：TruthfulQA的MC子集，或一个小型的事实性探测集（如100个长尾知识问题）。

    - 多语言：挑选2-3种核心非英语语言，各使用Flores或XLSum的小样本评测。

    （2）安全性快速扫描

    - 使用小型红队提示集（如100-200个涵盖暴力、色情、偏见、越狱的对抗提示），以自动化评判模型（如GPT-4安全分类器）进行有害性评分。目标是防止明显退化的版本上线。

    （3）关键使用场景模拟

    - 设计10-20个与产品核心功能紧密相关的端到端任务提示，例如多轮客服对话、摘要生成、信息提取。使用参考答案或强模型裁判进行粗粒度打分（1-5分）。

    （4）幻觉与一致性探测

    - 利用SelfCheckGPT思想，对10-20个长尾知识问题多次采样，测量答案一致性，快速估计幻觉倾向。

    - 运行简单的上下文忠实度检查：给出一段文档，要求模型提取关键信息，使用NLI模型验证答案是否忠实。

    （5）效率与资源基线

    - 记录平均解码时长、GPU显存占用、吞吐量。设定硬性上限，不合格直接淘汰。

    执行流程与决策：

    - 所有测试打包成Docker镜像或统一脚本，一键运行输出仪表盘。

    - 设定每个维度的最低绿灯阈值（如MMLU不得低于前一版本的95%，安全性有害率不得高于1%）。

    - 若任一关键维度红灯，版本不予通过。

    - 总耗时控制：对于7B模型，全部跑完应在2-4小时内。

    这个MVP体系不求全面，但求快速拦截劣化版本，识别重大风险，是敏捷开发中模型质量守门的第一道防线。


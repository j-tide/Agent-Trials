content:
  prompt: 如何评估大模型的知识覆盖面？常用基准有哪些？各自侧重什么？
answer:
  mode: rubric
  reference_answer: |-
    评估大模型的知识覆盖面，核心是测量其参数中存储的事实性知识的广度、深度和准确性。评估通常通过大规模、多领域的问答或填空题进行，考察模型能否准确回忆出特定实体、事件、概念及其关联信息。

    评估方法：

    - 知识问答基准：覆盖从常识到专业知识的各类选择题或开放式问答，量化模型在多领域的正确率。

    - 知识探测：构造特定形式的三元组或句子，直接检验模型是否记住特定事实。

    - 知识边界分析：通过控制实体的频率、领域等变量，分析模型在不同知识类型上的表现差异，找到知识盲区。

    常用基准及其侧重：

    - MMLU：涵盖57个学科（STEM、人文、社会科学等）的四选一选择题，从初高中到专业考试难度。侧重广泛的专业和学术知识，是当前最通用的知识广度测量工具。

    - Natural Questions / TriviaQA：基于真实用户搜索查询和冷知识问答，答案相对简短。侧重开放域的事实回忆，要求模型从海量知识中精准提取答案实体，反映对百科知识的掌握。

    - ARC (AI2 Reasoning Challenge)：小学科学考试题，但经过精心挑选去除了仅靠简单检索或统计共现即可答对的题目。侧重科学常识与深层推理的结合，不仅考察知识记忆，更考察灵活运用。

    - HellaSwag：虽然主要测常识推理，但其完成句子的任务要求深厚的情境常识。侧重动态常识和物理世界知识，即知道在特定场景下“接下来最可能发生什么”。

    - TruthfulQA：专门设计用来检测模型是否会复述训练数据中的常见谬误和虚假知识。侧重知识的真实性和校准度，即模型是否对错误知识具有“免疫力”。

    - WikiFact / FActScore：通过抽取维基百科中的事实来构造查询，侧重长尾实体和细粒度事实的验证，能精确定位模型对特定人物、地点等细节的记忆准确性。

    综合评估框架：一个好的知识覆盖面评估不应仅看总分，还应分析模型在不同知识类别（STEM vs 人文）、不同实体频率（热门 vs 长尾）、不同时间跨度上的表现，从而描绘出立体的“知识图谱”。


content:
  prompt: 解释“检索增强评估”（RAG 评测）中的忠实度、相关性、上下文召回等指标。
answer:
  mode: rubric
  reference_answer: |-
    在 RAG（检索增强生成）系统评测中，需要评估检索质量、生成质量以及二者协同的效果。常用框架如RAGAS定义了以下关键指标：

    （1）忠实度

    - 定义：生成的答案是否在事实层面上忠实于检索到的上下文文档，没有编造文档中不存在的信息。

    - 计算：将答案分解为原子声明，对每个声明，验证它是否能从检索文档中推断出来。答案中被支持声明的比例即为忠实度得分。得分 1.0 表示答案完全基于检索材料，没有幻觉。

    （2）答案相关性

    - 定义：生成的答案与原始用户问题的相关程度，是否切题、回答了所问。

    - 计算：利用答案反向生成若干问题（基于答案才能回答的问题），计算这些生成问题与用户原始问题之间的语义相似度（通过嵌入余弦相似度）。平均值即为答案相关性分数。得分高说明答案紧扣问题。

    （3）上下文召回

    - 定义：检索到的文档中，覆盖了真实答案所需信息的比例。衡量的是检索的全面性。

    - 计算：需要有标准答案（参考）。将标准答案拆分为独立声明，对每个声明检查它是否能在检索到的文档中找到支撑。被支撑的声明比例即为上下文召回。得分低说明检索遗漏了关键信息。

    其他常见 RAG 指标：

    - 上下文精确度：检索到的文档中，有多少是真正相关的，衡量检索的精确性，惩罚无关噪声。

    - 上下文相关性：检索文档整体与问题的相关程度，所有文档中相关文档的占比。

    这些指标共同构成了对 RAG 管道端到端质量的细粒度诊断，帮助区分是检索没找对，还是模型没用好检索材料。


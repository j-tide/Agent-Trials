content:
  prompt: 工具调用（Function Calling）能力如何评测？如何设计评测环境和指标？
answer:
  mode: rubric
  reference_answer: |-
    工具调用评测的核心是检验模型是否能将自然语言指令，转化为对预设API的正确、高效、鲁棒的调用序列。

    （一）设计评测环境

    - 构建模拟API沙箱：

    - 真实API受限接入：在保障安全的前提下，将真实世界的API（如搜索引擎API、计算器、天气查询API）包装后提供给模型，评测其在真实世界噪声和约束下的表现。

    （二）定义评测指标

    - 功能完成度：任务是否完全达成？这是最终金标准。可用完成百分比或成功/失败来衡量。

    - 调用正确性：

    - 调用效率与成本：

    - 错误恢复与鲁棒性：

    - 对话与调用的一致性：最终返回给用户的自然语言答复，是否准确、忠实地反映了API的执行结果，没有编造。

    典型基准：ToolBench、API-Bank 等数据集提供了大规模的工具调用评测场景，涵盖多种API和复杂规划需求。评测环境通常与真实数据库或模拟服务器深度集成。


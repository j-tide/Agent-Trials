content:
  prompt: 对于生成式模型，为什么单纯靠选择题或填空已不足以全面评估？
answer:
  mode: rubric
  reference_answer: |-
    选择题和填空题在传统NLP评测中广泛使用，因为它们具有客观、易自动化、统计效率高的优点。然而，对于生成式大模型，这种封闭式评测已严重不足，原因如下：

    （1）无法衡量生成质量和表达能力

    - 生成式模型的核心价值在于其自由文本生成能力，包括连贯性、风格、创意、解释深度等。选择题只能衡量最终答案的对错，完全忽略了语言生成的流畅性、多样性和说服力。一个能生成精彩散文的模型，与一个只会选A/B/C/D的模型，在能力上有着天壤之别。

    （2）无法评估思维过程与推理路径

    - 大模型在数学、逻辑等任务上的表现，大量依赖于其内部的推理链（Chain-of-Thought）。选择题只捕捉最终的答案，无法区分模型是真正理解了推理过程，还是通过死记硬背或表面统计线索猜中答案。这使得评测丢失了对模型推理能力的诊断信息。

    （3）无法考察忠实度、安全性与价值对齐

    - 幻觉、有害输出、偏见等核心风险均体现在自由生成文本中。选择题无法模拟真实场景中的有害建议、编造事实或不安全的详细指导。对齐评测必须依赖开放式提示和生成内容分析。

    （4）无法反映真实交互场景

    - 用户与大模型的交互本质上是开放式的，涉及多轮对话、模糊指令、修正和探索。选择题的静态单项信息无法模拟这种动态的、依赖上下文管理的能力，例如多轮记忆、意图澄清和个性化适配。

    （5）易受“刷分”和基准饱和影响

    - 封闭式问题答案空间小，模型可以通过记忆训练数据中的题目答案（数据泄漏）或利用简单的统计线索（如选项长度、词汇关联）获取高分，而并未真正掌握底层能力。这种分数与实际能力脱节，造成“伪强”幻觉。

    （6）忽视“如何拒绝”和“不确定性表达”

    - 正确的“我不知道”或恰到好处的不确定性表达，是高可靠模型的关键行为。选择题通常强制四选一，无法捕捉这种重要的元认知能力。

    总结：选择题/填空题可以作为基础能力筛查的快速工具，但必须配合开放式生成评估、人类偏好评价和风险探测，才能形成对大模型的全面认知。未来评测将更加强调生成质量、过程合理性和风险可控性。


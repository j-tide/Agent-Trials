content:
  prompt: 视频理解模型的评测难点在哪里？如何设计视频问答评测集？
answer:
  mode: rubric
  reference_answer: |-
    评测难点：

    - 时序建模的复杂性：视频不仅包含空间信息，还有时序动态、动作因果、事件发展等。评测必须能检验模型是否真正理解了“过程”和“顺序”，而不仅仅是从关键帧中猜出答案。

    - 长视频与注意力稀释：长视频中，模型可能遗忘开头事件，或将不同时间点的信息混淆。评测需要挑战模型的长期记忆和时序定位能力。

    - 标注成本极高：为长视频标注细粒度的问答对、事件边界、因果关系等，比图像标注耗时一个数量级以上。

    - 帧采样的公平性：评测时，输入给模型的视频帧数和帧率需统一，否则性能差异可能源自采样策略而非理解能力。如何定义公平的采样是一个难题。

    - 生态有效性与控制性矛盾：真实视频含音频、文本等多模态流，但评测常需控制变量，分离视觉、语言、听觉的贡献。

    - 主观任务的评判：对动作质量、情感表达、艺术风格等主观评判，极度依赖人类评估，自动指标难以胜任。

    设计视频问答评测集的方法：

    （一）多粒度任务设计

    - 静态概念：基于单帧就能回答的问题（场景、人物识别）。可作为基准线，确保模型具备基础视觉能力。

    - 动态与时序概念：必须观看多帧才能回答的问题。例如：

    - 因果与预测推理：要求模型解释事件原因（“他为什么摔倒？”）或预测下一步（“接下来他可能会做什么？”），这需要深层理解。

    - 长视频时空定位：在长达几十分钟的视频中，定位一个特定事件发生的时间点或描述其前后文。

    （二）构造流程

    - 来源采集：从YouTube、电影、自拍、第一人称视角、监控等多样化来源收集视频。

    - 自动标注+人工精标：

    - 保证时序挑战性：确保一定比例的问题无法通过盲猜或单帧回答。设计“矛盾帧”陷阱：视频中某时刻出现了与后续情况矛盾的信息，看模型是否以最终信息为准。

    - 多轮对话视频问答：将评测设计为多轮对话形式，每一轮的问题都依赖于上一轮的回答和对视频的进一步观察，模拟真实交互。

    - 评测指标多样化：

    代表基准：NExT-QA（专注时序因果推理）、EgoSchema（长视频理解）、MVBench（多维度视频理解）、Video-MME（综合评估）。


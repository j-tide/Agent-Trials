content:
  prompt: LLM-as-judge 存在哪些常见的偏差？至少列举4种。
answer:
  mode: rubric
  reference_answer: |-
    尽管LLM裁判功能强大，但它不是中立客观的完美评估器，存在多种系统性偏差，会严重影响评估的公正性和准确性。常见偏差如下：

    （1）位置偏差

    - 裁判模型在比较多个回答时，会系统性地偏好出现在某个特定位置（如第一位）的回答，而不是完全基于内容质量判断。

    （2）长度偏差

    - 裁判模型倾向于给更长的回答打更高的分，即使额外的长度没有提供实质性信息，只是堆砌了废话或重复内容。长篇大论常被误认为“更详尽、更认真”。

    （3）自我增强偏差

    - 裁判模型可能会偏向于那些由自己（或同系列模型）生成的回答，表现为对自己“后代”的输出更宽容或评分更高，而对其他模型的输出更苛刻。

    （4）顺序效应与锚定偏差

    - 在一系列评估中，前一个评估的难度或质量会影响裁判对当前样本的判断。如果裁判刚评价了一个极差的回答，后续一个中等回答可能会获得虚高分数；反之，接触过高水平回答后会变得更挑剔。

    （5）风格与格式偏好

    - 裁判可能会偏好特定格式（如使用Markdown列表、加粗标题）或看似“专业”、“权威”的写作风格，即使内容核心质量一般。美观的格式在评分中赢得了不公正的优势。

    （6）对安全性的过度补偿或放水

    - 由于裁判模型自身的安全对齐，它可能对某些话题过度敏感，将正常讨论误判为有害；或者反过来，对隐晦的越狱内容识别不足，导致评估失准。

    这些偏差的存在意味着 LLM-as-judge 的结果不能直接被当作金标准，必须经过偏差评估和必要的校正。


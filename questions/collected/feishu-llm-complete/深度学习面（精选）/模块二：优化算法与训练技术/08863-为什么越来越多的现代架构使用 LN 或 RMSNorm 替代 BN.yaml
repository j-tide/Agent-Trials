content:
  prompt: 为什么越来越多的现代架构使用 LN 或 RMSNorm 替代 BN？
answer:
  mode: rubric
  reference_answer: |-
    - 摆脱对 batch size 的依赖：BN 的性能严重受限于 batch size，而现代大模型（如 LLM）训练时受显存限制，batch size 相对较小（如微调时可能 batch size 1），且分布式训练中跨设备同步 BN 统计量开销大。LN 和 RMSNorm 完全独立于 batch 维度，无需维护运行统计量，在训练和测试时行为一致，简化了工程。

    - 更好的序列建模兼容性：Transformer 等序列模型天然要求处理变长序列，LN 能够在每个 token 位置单独归一化，适合自回归生成。

    - 训练稳定性：在大型 Transformer 中，Post-LN 存在训练不稳定的问题，Pre-LN 及 RMSNorm 通过将归一化置于残差分支之前，使梯度更容易传播，避免了深层 Transformer 中常见的“训练崩溃”。

    - RMSNorm 更简单高效：RMSNorm 只缩放输入，而不去均值，计算量略低于 LN，同时在一些实验中效果相同或更好。这对于追求极致效率的大模型来说很有吸引力。

    - 新架构验证：从 ViT 到 GPT、LLaMA 等现代网络，几乎都采用了 Pre-LN 或 RMSNorm 的结构，实验表明在各类任务上总体优于 BN。研究者逐渐形成了“视觉任务也许 BN 尚可，但 NLP 和多模态中 LN/RMSNorm 是默认”的共识。


content:
  prompt: 如何通过监控验证损失来动态调整学习率（如 ReduceLROnPlateau）？
answer:
  mode: rubric
  reference_answer: |-
    ReduceLROnPlateau（基于平台衰减）：

    当训练过程中，验证损失（或验证精度等监控指标）停止改善时，将学习率乘以一个衰减因子（如 0.1），直到衰减到某个最小值。

    使用方法：

    - 选择监控指标，通常是验证损失（val loss）。也可选验证准确率、F1 等，但需注意方向。

    - 设定 patience（耐心值）——即验证损失连续不下降（或未改善）的 epoch 数。例如 patience=5，表示如果 5 个 epoch 内验证损失没有创新低，则触发学习率衰减。

    - 设定衰减因子 factor（常为 0.1 或 0.5）和最小学习率 min_lr。

    - 在训练循环中，每个 epoch 结束后评估验证损失。如果当前损失相对于历史最小损失的改善低于 threshold（或没有改善），则计数器+1；若计数器 >= patience，执行 lr = lr * factor，并将计数器归零。

    - 这种动态调节对训练自动终止也很有用：若学习率已衰减到 min_lr 但指标仍不改善，可提前停止（Early Stopping）。

    优点：不需要预先知道训练的总轮次，自适应模型饱和状态，对不同的数据和模型鲁棒。

    缺点：带有延迟，可能在学习率本应衰减时等待 patience 数个 epoch 才响应，造成浪费；不适用于损失波动剧烈的场景，可能频繁误触发。


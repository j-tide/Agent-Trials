content:
  prompt: 批量梯度下降（BGD）、随机梯度下降（SGD）和小批量梯度下降（Mini-batch GD）的区别是什么？各自的优缺点？
answer:
  mode: rubric
  reference_answer: |-
    这三种梯度下降法的主要区别在于每次参数更新所使用的样本数量，这直接影响了更新的稳定性、计算效率和收敛行为。

    - 批量梯度下降 (Batch Gradient Descent, BGD)
    每次更新时，使用整个训练数据集来计算损失函数对参数的梯度，然后进行一步更新。

    [图片内容未导入]

    优点：

    - 在凸函数上可保证收敛到全局最小值，在非凸情况下可收敛到局部极小值。

    - 梯度方向代表了整个数据集的最速下降方向，噪声极小，损失下降曲线平滑且稳定。

    - 若学习率固定，理论上能精确线性收敛。

    - 缺点：

    - 每次更新都要遍历全量数据，对于大规模数据集，计算开销巨大，更新速度非常慢。

    - 内存可能无法容纳整个数据集，无法进行在线学习（无法增量更新）。

    - 容易陷入较差的局部极小值且由于移动谨慎，缺少探索能力。

    - 随机梯度下降 (Stochastic Gradient Descent, SGD)
    每次更新时，仅使用一个随机选出的样本的梯度来更新参数。

    [图片内容未导入]

    - 优点：

    - 每次更新的计算量极小，速度快，可实时在线学习。

    - 参数更新极为频繁，可以快速取得进展。

    - 因为梯度的噪声很大，参数的震荡性更新使得它有机会跳出较差的局部极小值或鞍点，从而可能找到更好的解。
    缺点：

    - 梯度的方差极高，导致损失函数值会剧烈震荡，收敛路径非常不稳定。

    - 由于方向混乱，可能永远无法精确收敛到最优点，会在最优点附近来回振荡，需要配合学习率衰减。

    - 无法有效利用向量化加速，硬件利用率低。

    - 小批量梯度下降 (Mini-batch Gradient Descent, Mini-batch GD)
    每次更新使用一个包含 m 个样本的小批次，计算这批样本上的平均梯度。

    [图片内容未导入]

    - 优点：

    - 结合了 BGD 和 SGD 的优点：计算效率高（利用矩阵运算的向量化加速），同时梯度方差比 SGD 小，损失下降比 SGD 平滑，比 BGD 快得多。

    - 可以通过选择批次大小来灵活调节收敛速度和稳定性。

    - 是深度学习训练的标准方法。
    缺点：

    - 依然存在一定的梯度噪声，需要仔细调节学习率。

    - 批次大小的选择成为一个新的超参数，对性能有影响。

    - 不能保证收敛到全局最优，但在深度学习中通常能收敛到较好的局部解。

    [图片内容未导入]


content:
  prompt: 偏置项通常如何初始化？为什么可以初始化为零？
answer:
  mode: rubric
  reference_answer: |-
    通常初始化：

    - 绝大多数情况下，偏置项被初始化为 0。

    - 在一些特定设置中，比如使用 ReLU 激活时，有时会将偏置初始化为一个小正常数（如 0.01），以期在训练初期为 ReLU 提供正输入，避免大量神经元死亡。但后续的研究和实践表明，即使初始化为零，配合恰当的权重初始化，ReLU 也能有效工作，因此零偏置是普遍默认的。

    - 对于 LSTM 等门控单元，遗忘门偏置有时会被初始化为较大的正数（如 1 或 2），以促进在训练初期记住长期信息。但这属于特别定制。

    为什么可以为零：

    偏置不参与输入信号的缩放，不会破坏不同神经元之间的对称性。即使偏置全为零，只要权重随机且不同，每个神经元的输出就会不同，网络就能正常学习。偏置的值会在训练中通过梯度自动调整到合适的水平。


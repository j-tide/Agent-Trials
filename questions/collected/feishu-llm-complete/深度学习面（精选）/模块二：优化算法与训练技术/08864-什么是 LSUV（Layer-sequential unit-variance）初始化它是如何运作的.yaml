content:
  prompt: 什么是 LSUV（Layer-sequential unit-variance）初始化？它是如何运作的？
answer:
  mode: rubric
  reference_answer: |-
    LSUV 初始化（Mishkin & Matas, 2016）是一种数据相关的初始化方法，目标是使得每一层输出的方差为 1（单位方差），从而在深层网络中保持信号稳定。

    运作步骤：

    - 用正交初始化（或其他）预初始化所有权重。

    - 取一个 mini-batch 的样本输入网络。

    - 从第一层开始，逐层进行：

    影响非常根本。权重的初始尺度直接决定了前向和反向传播中信号的方差变化率。如果权重初始值偏离合适范围太多，将会导致梯度指数级地消失或爆炸。

    示例说明：

    假设一个 50 层的全连接网络，每层 512 个神经元，无 BN，使用 tanh 激活函数。

    - 错误初始化：使用均值为 0、标准差为 0.01 的高斯分布（方差过小）。
    前向传播：每层输出方差逐层缩小，到第 50 层时，输出值接近 0。

    [图片内容未导入]

    - 变化，实际上因为权重太小，梯度会极快地衰减为 0，前端层几乎学不到任何东西，损失曲线平坦。

    - 错误初始化：使用均值为 0、标准差为 1 的高斯分布（方差过大）。
    前向传播：tanh 输入绝对值可能很大，大量神经元饱和，输出接近 ±1，导数趋于 0。反向传播时，除了小权重区域，梯度也因饱和而消失；如果某些层尚未完全饱和，但权重过大，梯度可能在反向传播中爆炸（因为梯度会乘以大权重），导致更新量巨大，损失突然变为 NaN。

    [图片内容未导入]

    因此，合理的初始化使数百层的网络能够训练；错误的初始化则导致网络完全无法学习。


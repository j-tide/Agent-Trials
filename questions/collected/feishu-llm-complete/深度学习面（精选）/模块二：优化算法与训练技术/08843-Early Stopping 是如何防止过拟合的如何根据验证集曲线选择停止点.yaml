content:
  prompt: Early Stopping 是如何防止过拟合的？如何根据验证集曲线选择停止点？
answer:
  mode: rubric
  reference_answer: |-
    原理：训练过程中，随着迭代次数增加，模型在训练集上的损失通常会持续下降，但在验证集上的损失往往先下降后上升（或误差先减后增）。Early Stopping 就是在验证集指标开始恶化时停止训练，从而避免模型过度拟合训练数据中的噪声。

    如何选择停止点：

    - 监控验证集损失（或准确率等指标），当它在连续 k 个 epoch 内没有改善（即不再下降或上升）时，停止训练，并恢复至最佳验证指标对应的模型参数。

    - k 为“耐心”超参数（patience），设置过大可能仍过拟合，过小可能过早停止。

    - 实际中常绘制训练和验证损失曲线，寻找验证损失最小点。可使用“保存最佳模型”的回调。

    从宏观角度看，Early Stopping 通过限制有效训练步数，限制了模型有效容量，与权重衰减等方法有相似的泛化效果，也可视为一种高效的超参数选择手段。


content:
  prompt: Adam 优化器结合了哪些算法的思想？写出其完整更新规则，并解释每个超参数的作用。
answer:
  mode: rubric
  reference_answer: |-
    Adam (Adaptive Moment Estimation) 结合了动量方法和RMSProp 的自适应学习率，即同时维护梯度的一阶矩（均值）和二阶矩（非中心方差）的指数移动平均，并对它们进行偏差校正。

    完整更新规则（针对参数 θ）：

    [图片内容未导入]

    超参数作用：

    - αα（学习率）：控制参数更新步长的全局尺度，常用默认值 0.001。

    - β1β1：一阶矩估计的指数衰减率，控制梯度的平滑程度（动量效应），典型值 0.9。它让更新方向更平滑，加速收敛。

    - β2β2：二阶矩估计的指数衰减率，控制梯度平方的平滑，影响自适应学习率的调整，典型值 0.999。越高，过去梯度平方影响时间越长。


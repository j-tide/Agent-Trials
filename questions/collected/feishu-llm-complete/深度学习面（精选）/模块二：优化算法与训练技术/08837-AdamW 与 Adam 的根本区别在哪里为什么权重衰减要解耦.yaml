content:
  prompt: AdamW 与 Adam 的根本区别在哪里？为什么权重衰减要解耦？
answer:
  mode: rubric
  reference_answer: |-
    根本区别：

    AdamW 将权重衰减（Weight Decay） 与自适应学习率的梯度更新解耦，而在 Adam 中，直接使用 L2 正则化会因自适应机制而被扭曲，无法等价于真正的权重衰减。

    [图片内容未导入]

    AdamW 的做法：将权重衰减从梯度更新中剥离，直接在参数更新步骤中减去一个与自适应梯度步骤无关的权重衰减项：

    [图片内容未导入]

    - 这里权重衰减项 αλθt 不受二阶矩 vtvt 的影响，等价于每个参数以恒定的速率衰减。这样就能实现常规意义上的权重衰减（即每次迭代参数朝向零收缩一定比例），达到和 SGD 配合权重衰减类似的正则化效果。

    为什么要解耦：

    - 解耦之后，正则化强度 λλ 可以独立于自适应学习率调节，使超参数调优更容易。

    - 在 Adam 中，L2 正则化和自适应学习率耦合会导致二者相互干扰，难以区分“优化过程”和“正则化过程”的影响。解耦后能够清晰地分离两者，使权重衰减作为一种标准正则化手段，发挥防止过拟合的作用，而不受历史梯度规模扭曲。

    - 大量实验（如 Loshchilov & Hutter, 2019）表明，AdamW 相比带 L2 正则的 Adam，显著提升了泛化性能，特别是在图像分类等任务上可接近甚至超越 SGD 的泛化表现。


content:
  prompt: 在微调预训练模型时，冻结 BN 层还是继续更新？为什么？
answer:
  mode: rubric
  reference_answer: |-
    通常建议继续更新 BN 层的统计量（即不冻结），但不一定更新 γ,βγ,β。原因如下：

    - 特征分布变化：微调时新数据集的分布可能与预训练时不同，如果直接使用预训练好的全局运行均值和方差，可能导致归一化后的特征分布不匹配新数据，损害微调效果。因此需要让 BN 层适应新数据的统计信息。

    - 实际操作：在 PyTorch 等框架中，即使将模型参数的 requires_grad 设为 False 以冻结卷积层权重，BN 层默认仍然会更新其 running_mean 和 running_var（因为这些不是通过梯度更新，而是在训练模式下通过累计当前 batch 统计量更新的）。如果确实想完全冻结，必须将模型设为 eval() 模式或单独设置 BN 的 track_running_stats=False。但常见微调策略是将 BN 层切换到训练模式，让 running stats 继续滑动平均，同时可以选择是否让 γ,βγ,β 可训练。

    - 经验法则：


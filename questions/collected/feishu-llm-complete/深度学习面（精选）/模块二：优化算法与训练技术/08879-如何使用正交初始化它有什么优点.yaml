content:
  prompt: 如何使用正交初始化？它有什么优点？
answer:
  mode: rubric
  reference_answer: |-
    使用方式：

    [图片内容未导入]

    优点：

    - 范数保持性：正交矩阵是线性等距映射，它乘以输入向量时，不改变向量的范数。因此前向传播中，信号的幅度和方差被精确保持，不会有指数级放大或衰减。

    - 梯度稳定性：反向传播时，梯度经过正交矩阵的转置，同样保持范数，能有效缓解梯度消失与爆炸。这尤其对 RNN/LSTM 等序列模型非常重要，因为它们时间步上权重共享，正交初始化可避免长期依赖的梯度问题。

    - 特征多样性：正交矩阵的行或列互相正交且单位化，有助于不同神经元学习解耦的特征，避免了权重向量高度相关导致的冗余。

    - 在循环网络中广泛应用：对于 RNN 的隐藏层权重，正交初始化能显著提升训练稳定性和收敛速度，甚至可以使用较大学习率。

    在 CNN 中，对卷积核（四维张量）进行正交初始化需要将其重塑为二维矩阵，做正交化后再恢复形状。这对于较深的没有 BN 的网络也有帮助。


content:
  prompt: Xavier/Glorot 初始化的推导基于什么假设？适用于哪些激活函数？
answer:
  mode: rubric
  reference_answer: |-
    推导假设（Glorot & Bengio, 2010）：

    - 激活函数是线性的，并且关于原点对称（如在零点附近近似恒等，例如 tanh 和 sigmoid 在原点附近近似线性）。具体推导中假设激活值方差在每一层保持不变。

    - 权重和输入相互独立，且均值为零。

    - 各层输入特征的方差相同，且每层神经元数量可能不同。

    [图片内容未导入]

    适用激活函数：主要适用于关于原点对称且近似线性的激活函数，如 tanh 和 sigmoid（假设数据进行了适当标准化，使其工作在线性区）。对于 ReLU 及其变体，Xavier 初始化会导致方差逐渐减小，因为 ReLU 会把负值置零，相当于丢失了一半的方差，所以需要调整。


content:
  prompt: 归一化层加在激活函数之前还是之后？两种方式各有什么影响？常见的放置顺序是什么？
answer:
  mode: rubric
  reference_answer: |-
    - 在激活函数之前（预激活）：即 x→BN→ReLU→...
    这是原始 BN 论文的标准做法。此时 BN 作用于线性变换的输出（加权和），使其均值为 0、方差为 1，然后经过非线性激活。优点：对于 ReLU 等激活，避免输入偏向负值导致神经元死亡；能够保证激活前的分布稳定，让梯度有效流动。

    - 在激活函数之后（后激活）：即 x→ReLU→BN→...
    这种方式会使 BN 作用于激活函数的输出，但 ReLU 的输出是非负的，且分布可能偏斜。虽然 BN 仍然可以将其归一化到零均值单位方差，但实验结果通常显示预激活效果更好，收敛更快。

    - 常见的放置顺序：
    在经典卷积网络中，通常是 Conv → BN → ReLU。
    在 ResNet 的改进版中，提出了“预激活残差单元”：BN → ReLU → Conv，此时 BN 和激活在卷积之前。而在 Transformer 中，LN 通常用于残差连接之后或自注意力/FFN 之前，也有不同变体（Post-LN 和 Pre-LN）。目前 Post-LN 是原始 Transformer 的方式，但 Pre-LN 训练更稳定，被越来越多采用。

    结论：虽然都有应用，但普遍认为将归一化放在激活之前能够确保非线性层的输入分布在更合理的范围内，更有利于训练。


content:
  prompt: 什么是“学习率查找器”（LR Finder）？如何使用它选择一个合适的初始学习率？
answer:
  mode: rubric
  reference_answer: |-
    学习率查找器 (LR Finder) 由 Leslie Smith 提出，旨在半自动地找到一个合适的最大学习率或初始学习率。

    方法步骤：

    - 从一个极小的学习率开始（如 10−810−8）。

    - 在每个 mini-batch 后指数（或线性）增加学习率，同时记录相应的训练损失。

    - 绘制学习率-损失曲线（以对数刻度的学习率为横轴）。

    - 曲线通常呈现：先缓慢下降，然后快速下降，达到一个低点后开始趋于平坦或上升，最后可能剧烈发散。

    - 选择策略：

    - 将找到的数值输入到学习率调度器中（如 OneCycleLR 的最大学习率），或者直接作为固定学习率使用。

    为什么有效：通过观察损失对学习率的响应，能够避开经验猜测，适应不同的模型结构和数据分布，使训练在初始阶段就处于一个高效且稳定的范围。


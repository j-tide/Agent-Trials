content:
  prompt: 为什么神经网络的权重不能全部初始化为零？偏置可以吗？
answer:
  mode: rubric
  reference_answer: |-
    权重不能全部初始化为零的原因：对称性问题

    如果所有权重都初始化为相同的值（包括零），那么同一层内每个神经元在前向传播中会计算出完全相同的输出，在反向传播时也会得到完全相同的梯度。这意味着所有神经元将沿着完全相同的方向更新，始终保持相同的权重值。无论网络多宽，它实际上退化为只有一个神经元的模型，即对称性没有被打破，无法学习不同的特征。这被称为对称权重问题。

    [图片内容未导入]

    偏置可以初始化为零

    偏置项不涉及输入信号的乘法，只起到平移作用。即使偏置全为零，对称性被打破的关键在于权重必须有不同的值。偏置为零时，只要权重随机，不同神经元的加权和就不同，网络表达能力不受损。且许多初始化策略默认将偏置设为零，后续通过梯度更新自动调整。在某些有 ReLU 的场合，也可将偏置初始化为一个小正数（如 0.01），以避免大量神经元在初始时“死亡”（输出始终为零），但零偏置通常也能正常工作。


content:
  prompt: 随机深度（Stochastic Depth）是怎么做的？它在训练深层 ResNet 时有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    做法：在 ResNet 的残差块中，随机将整个残差分支“关闭”，即直接跳过该块，只保留恒等映射（Identity 通路），相当于将该块从网络中丢弃。具体公式：

    [图片内容未导入]

    其中 bl∈{0,1} 是一个伯努利随机变量，控制残差分支是否激活。存活概率 plpl 可能随深度递减（如线性衰减）。

    好处：

    - 训练深层网络时，随机深度相当于缩短了网络的有效深度，缓解了梯度消失，使得深层信息更容易传递。

    - 可视为训练了多个不同深度的网络并进行了隐式集成，测试时使用完整深度，相当于平均了浅层与深层网络的预测。

    - 能显著加速训练（因为跳过块不计算），同时作为一种强大的正则化，防止深层 ResNet 过拟合。


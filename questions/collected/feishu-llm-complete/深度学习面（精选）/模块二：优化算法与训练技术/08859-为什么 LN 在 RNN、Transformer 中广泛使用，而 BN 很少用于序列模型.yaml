content:
  prompt: 为什么 LN 在 RNN、Transformer 中广泛使用，而 BN 很少用于序列模型？
answer:
  mode: rubric
  reference_answer: |-
    - 序列长度可变和时序依赖性：在 RNN 中，输入序列长度不一，共享的权重矩阵作用于每一个时间步。BN 要求统计每个时间步上 batch 内样本的均值和方差，但序列长度不同时，padding 造成统计困难，且不同时间步的分布可能完全不同，共享统计量不合理。LN 在每个时间步对单个样本的特征归一化，不涉及 batch 和时间维度，天然适合。

    - 训练和测试的不一致：RNN 在测试时通常逐个样本地生成序列，若使用 BN，需要借助训练时预存的运行均值和方差，但因为序列生成是自回归的，输入分布与训练时不同，导致不一致问题严重。LN 在测试时行为与训练一致（都是对单个样本的特征归一化）。

    - Transformer 中的使用：Transformer 虽然处理整个序列，但同样面临序列长度变化和 batch 内样本差异大的问题。LN 在每个 token 的特征上归一化，使训练更稳定。而且 Transformer 通常 batch 较小（受限于序列长度和模型尺寸），BN 噪声大；LN 则完美规避。另外，Transformer 的残差结构和 LN 结合，能让信号更好传播。

    - 实验验证：大量实验表明，对序列模型用 BN 往往带来训练不稳定甚至无法收敛，LN 则取得优异效果，因此成为默认选择。


    物理直觉

    将优化过程想象成一个球在山坡上滚动：

    - 梯度项 η∇J 相当于重力产生的加速度，方向指向下坡。

    - 动量项 βvβv 类似于物理中的惯性，让球保持之前的速度方向。

    - 在梯度方向一致的维度上，速度会不断累积，使得参数在该方向上越来越快地前进，加速收敛。

    - 在梯度方向反复震荡的维度（如峡谷侧壁），动量会平滑掉震荡：相邻步的梯度方向相反，速度会相互抵消，从而衰减横向震荡，使运动方向趋于稳定的下降通道。

    因此，动量能够加速收敛、减少震荡，并帮助越过沟壑中的一些小障碍。


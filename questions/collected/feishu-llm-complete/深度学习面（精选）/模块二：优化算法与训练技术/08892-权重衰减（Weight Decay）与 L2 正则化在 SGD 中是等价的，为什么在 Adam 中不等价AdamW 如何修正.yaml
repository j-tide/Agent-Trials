    在 SGD 中的等价性

    [图片内容未导入]

    差有关，不再是纯粹的固定衰减率。
    而真正的权重衰减是直接在更新前将参数乘以 (1−ηλ)，不受自适应学习率影响。
    因此，在 Adam 中 L2 正则化与权重衰减不等价，而且 L2 正则化方式可能导致大梯度参数的正则化被削弱，小梯度参数的正则化被放大，不利于解耦调整。

    AdamW 的修正

    AdamW 将权重衰减从梯度计算中解耦出来，直接修改参数更新步骤：

    [图片内容未导入]

    这样就保证了权重衰减独立于自适应梯度缩放，恢复了与 SGD 一致的衰减效果。大量实验表明 AdamW 拥有更好的泛化能力和更稳定的训练。


content:
  prompt: 如果模型出现过拟合，你会按照什么顺序尝试各种正则化方法？
answer:
  mode: rubric
  reference_answer: |-
    综合成本、效果和常见实践，推荐按以下顺序逐步尝试：

    - 数据增强：首先增加数据多样性（如更强的图像裁剪、翻转、Mixup/CutMix 等），这是效果最自然且不易伤害模型能力的方式。

    - Early Stopping：监控验证曲线，选取最佳 checkpoint，阻止过度训练。

    - 增加权重衰减（L2 / AdamW）：调大正则化系数，或在 Adam 中改用解耦的 AdamW。

    - Dropout：在网络中合适位置添加 Dropout，并调整丢弃概率，通常从较小的概率开始试起。

    - 标签平滑：在分类任务中微调 ϵϵ，例如 0.1。

    - 降低模型复杂度：减少网络层数、神经元个数，或使用更轻量架构。

    - 应用更多显式正则化：如 L1 正则化（稀疏化）、梯度裁剪、DropConnect、Stochastic Depth 等。

    - 增大 batch size ？ 需注意增大 batch size 可能降低隐式正则化，需要相应调整学习率或配合其他手段。

    - 获取更多真实数据：若无数据，使用生成对抗网络或合成数据。

    - 半监督或自监督预训练：借助大量无标签数据改善表征，减少有标签数据的过拟合风险。

    实际调试时，先从简单且计算开销小的方法开始，观察验证集表现变化，逐步叠加。若过拟合依然严重，则需要重新审视训练集与测试集的数据分布是否一致，或是评估指标本身是否合理。

    - 输入层特征维度高且较为稀疏，保持较多输入信息更有利，因此丢弃率较低。

    - 隐藏层参数多、容易过拟合，使用较大的丢弃率（0.5）能产生丰富的子网络，增强正则化。

    - 如果对所有层使用相同的丢弃概率，可能会导致浅层信息丢失过多或深层正则化不足。

content:
  prompt: 过小的随机初始化会导致什么问题？过大的随机初始化呢？
answer:
  mode: rubric
  reference_answer: |-
    过小的随机初始化（例如从 N(0,0.0001)) 采样）：

    - 前向传播时，每层输出值很小，经过多层后信号逐渐衰减至接近零。

    - 反向传播时，梯度同样会因权重很小而逐层缩放，导致深层梯度变得极小，发生梯度消失。

    - 使用饱和激活函数（如 sigmoid、tanh）时，小权重使得输入落在激活函数的线性区，导数约为常数，但整体梯度仍可能因连乘小权重而消失；对 ReLU 而言，若输入常为负则直接死亡。

    - 训练几乎停滞，损失下降极慢，模型无法学习。

    过大的随机初始化（例如从 N(0,1))采样，而网络较深）：

    - 前向传播时，每层输出值迅速膨胀，经过多层后激活值可能极大（尤其是无界的 ReLU），最终导致数值溢出。

    - 对于饱和激活函数，大权重使得神经元输入绝对值很大，落入饱和区，导数接近零，造成梯度消失。

    - 对于 ReLU，虽然不饱和，但输出幅度可能逐层爆炸，导致梯度爆炸：反向传播时，梯度随层数指数增长，参数更新幅度巨大，损失值出现 NaN 或震荡。

    - 训练极度不稳定，模型无法收敛。

    因此，合理的初始化需要保持前向传播和反向传播的信号方差大致恒定，避免指数级衰减或增长。


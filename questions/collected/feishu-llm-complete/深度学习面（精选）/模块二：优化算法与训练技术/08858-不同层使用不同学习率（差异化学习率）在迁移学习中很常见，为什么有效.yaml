content:
  prompt: 不同层使用不同学习率（差异化学习率）在迁移学习中很常见，为什么有效？
answer:
  mode: rubric
  reference_answer: |-
    为什么有效：

    - 在迁移学习中，预训练模型的不同层捕获了不同层级的特征：底层通常是通用特征（边缘、纹理），高层是任务特定特征（语义组合）。微调时，我们希望保留底层通用知识，仅轻微调整，而高层和新添加的层则需要大幅适应新任务。

    - 通过对不同层分配不同的学习率，可以实现：

    - 这种策略显著提升了微调的效果，既防止灾难性遗忘，又加速收敛，且常能取得比全模型统一学习率更好的泛化性能。

    实践例子：使用 ResNet 预训练模型做微调时，将模型分为若干组，如“layer1”、“layer2”、“layer3”、“layer4”和“fc”，每组的学习率按 0.1 倍递增或递减。例如基础学习率 0.001，fc 为 0.01，layer4 为 0.001，layer3 为 0.0001 等。PyTorch 的优化器中可以传递参数组列表，指定不同 'lr'。


content:
  prompt: Dropout 的丢弃概率一般如何设置？在不同层上设置不同概率的原因是什么？
answer:
  mode: rubric
  reference_answer: |-
    - 一般设置：隐藏层常用 p=0.5，输入层常用 p=0.2 或更小（如 0.1），输出层一般不使用 Dropout。

    - 原因：

    - 现代趋势：在大模型（如 Transformer）中，Dropout 率通常更低（0.1），有时只在特定子层使用。

    另外，丢弃率也可以作为超参数通过验证集调整；如果模型不收敛或欠拟合，可适当降低 Dropout。


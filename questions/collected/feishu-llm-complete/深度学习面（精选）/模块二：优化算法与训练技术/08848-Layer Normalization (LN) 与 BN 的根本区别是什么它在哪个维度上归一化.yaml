content:
  prompt: Layer Normalization (LN) 与 BN 的根本区别是什么？它在哪个维度上归一化？
answer:
  mode: rubric
  reference_answer: |-
    根本区别：

    - 归一化的维度不同：
    BN：对每个特征通道，在 batch 维度（不同样本）上计算均值和方差。即对于某个神经元，统计一个 batch 内所有样本在该神经元上的值。
    LN：对每个单独样本，在 特征维度（所有通道/神经元）上计算均值和方差。即对于一层内的所有神经元，取一个样本的所有特征值，计算均值和方差进行归一化。

    - 具体来说，假设输入张量形状为 (N,C,H,W)（图像）或 (N,D)（全连接）或 (N,L,C)（序列）。

    因此，LN 不依赖 batch 统计，每个样本独立归一化，不会因 batch size 小而受影响。


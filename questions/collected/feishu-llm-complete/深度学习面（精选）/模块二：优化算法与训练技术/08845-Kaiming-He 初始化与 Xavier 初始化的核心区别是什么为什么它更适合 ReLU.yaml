    [图片内容未导入]

    为什么更适合 ReLU：

    - ReLU 的负半轴输出为 0，这会使输出方差减半。Xavier 初始化的方差对于 ReLU 来说过小，经过多层后信号会迅速衰减（方差指数级减小），导致深层梯度消失，训练困难。

    - He 初始化将方差扩大为 2 倍，正好补偿 ReLU 造成的方差损失，使得在深层网络中信号方差能够大致保持恒定，有效缓解梯度消失/爆炸，从而允许训练上百层的网络。

    实践证明，用 He 初始化配合 ReLU 和 Batch Normalization，ResNet 等极深网络可以成功训练。


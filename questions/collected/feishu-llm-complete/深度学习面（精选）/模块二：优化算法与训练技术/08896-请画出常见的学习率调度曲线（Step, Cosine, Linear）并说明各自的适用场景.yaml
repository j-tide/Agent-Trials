content:
  prompt: 请画出常见的学习率调度曲线（Step, Cosine, Linear）并说明各自的适用场景。
answer:
  mode: rubric
  reference_answer: |-
    由于文字不能实际画图，下面用文本描述曲线形状，并给出适用场景。

    - Step Decay（阶梯衰减）

    - 形状：水平线段，每隔一段时间突然垂直下降，呈阶梯状。

    - 适用场景：经典的 CNN 训练（如 VGG、ResNet），尤其是当你有固定的里程碑（如 30, 60, 90 epoch）并期望在衰减后损失出现明显的台阶式下降。适用于需要手动精细控制、对验证精度的跳跃式提升可接受的场合。

    - Cosine Annealing（余弦退火）

    - 形状：平滑的余弦曲线，从最大值逐渐下降到最小值。如果搭配热重启，则呈现多个周期性余弦下降，每个周期结束时突然跳升回高点，形成锯齿状的余弦波。

    - 适用场景：现代深度学习各类任务，如图像分类（EfficientNet）、自监督对比学习（SimCLR）、知识蒸馏等。在不需要手动设计衰减点时，能够取得更优的最终精度。对于需要长时间训练的任务，平滑下降有助于收敛到平坦极小值。

    - Linear Decay（线性衰减）

    - 形状：一条直线从初始学习率斜向下到最后的值。

    - 适用场景：训练 Transformer（尤其是纯线性衰减搭配 warmup），许多 NLP 预训练模型（如 BERT、GPT）的标准配置。线性衰减简单、平稳，避免了阶梯衰减的突变，同时比余弦衰减更容易实现。在一些大 batch 训练和强化学习中也很常见。

    - Polynomial Decay（多项式衰减）

    - 形状：类似平滑下降曲线，按 (1−t/T)p 衰减，p=1 即线性，p>1 时先快后慢。

    - 适用场景：语义分割、目标检测等有时使用，尤其需要下降先快后慢的情形。

    通常选择：有明确阶段需求用 Step；追求最高精度且周期固定用 Cosine；训练 Transformer 优先用线性（配合 warmup）；不确定时，Cosine 往往是良好的默认选项。


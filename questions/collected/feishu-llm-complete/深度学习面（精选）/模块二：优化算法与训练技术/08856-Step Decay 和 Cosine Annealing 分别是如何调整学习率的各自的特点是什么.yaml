content:
  prompt: Step Decay 和 Cosine Annealing 分别是如何调整学习率的？各自的特点是什么？
answer:
  mode: rubric
  reference_answer: |-
    Step Decay（阶梯衰减）
    每经过固定的 epoch 数或步数，将学习率乘以一个常数因子 γ（如 0.1 或 0.5）。

    [图片内容未导入]

    例如：初始 0.1，每 30 epoch 下降为原来的 0.1 倍，即 0.1 → 0.01 → 0.001。

    特点：

    - 实现简单，可解释性强。

    - 分段常数，学习率在很长一段时间保持不变，然后在某一时刻突然下降。这可能导致损失在衰减点处出现突降。

    - 适用于许多经典视觉模型（如 ResNet），通常配合手工设定的衰减里程碑（如 30, 60, 90 epoch）。

    - 对衰减步长和衰减因子敏感，需要先验知识。

    Cosine Annealing（余弦退火）

    学习率按余弦曲线从初始值逐渐下降到最低值（通常接近0）。

    [图片内容未导入]

    特点：

    - 平滑连续下降，没有突变，优化过程更平稳。

    - 初期保持较高的学习率探索，中后期平滑地降低，有助于收敛到更好的极小值。

    - 通常可以取得比阶梯衰减更优的最终性能，尤其在图像分类、对比学习等任务中。

    - 超参数较少，只需设置初始学习率、最低学习率和周期长度。


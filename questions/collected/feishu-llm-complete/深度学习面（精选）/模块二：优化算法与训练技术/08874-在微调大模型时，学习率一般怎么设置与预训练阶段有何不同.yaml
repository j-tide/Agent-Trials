content:
  prompt: 在微调大模型时，学习率一般怎么设置？与预训练阶段有何不同？
answer:
  mode: rubric
  reference_answer: |-
    微调大模型时的学习率设置：

    - 学习率量级更小

    [图片内容未导入]

    - 差异化学习率（分层学习率）
    如前面所述，底层小、顶层大。具体可给编码器低学习率，分类头高学习率。在微调大语言模型时，有时也整体使用统一的小学习率，但参数高效微调方法（如 LoRA）则调整新增参数，其学习率可稍大。

    - 调度策略

    - 与预训练的不同点总结：

    通过这种谨慎的设置，既能充分利用预训练能力，又能在下游任务上取得良好的性能。

    - 底层（靠近输入）使用较小的学习率：避免破坏预训练学到的通用、可迁移表示，这些特征对许多任务都有效。

    - 顶层（靠近输出）使用较大的学习率：因为这些层更面向原任务，需要快速调整以拟合新任务的类别或输出空间。

    - 新添加的随机初始化层（如分类头）使用更大的学习率：它们需要从头学习，需要大步长。

    - 最大学习率：取损失开始急剧上升之前的点对应的学习率，或者选择损失仍在下降但已趋于平缓的转折点。常用“损失还在下降且比最低点低一点（比如损失最小值的 10 倍下降点之前）”。

    - 合适的初始学习率：通常可设置为找到的最大学习率的 1/10 或 1/5。或者取损失下降最快的那个区间的学习率作为最大学习率，再除以 3~10 作为循环学习率的上界。

    - 微调常用带预热的线性衰减或余弦衰减。预热步数占比可稍少（如总步数的 5%），然后线性或余弦降至几乎为 0。有时也采用常量学习率 + 平台衰减。

    - 预训练阶段一般使用较长的预热，随后保持高学习率较长一段时间再衰减。

    - 目标：预训练是学习通用知识，需要大幅探索；微调是知识迁移，需保守更新。

    - 数值：微调学习率通常低一个数量级或更多。

    - 调度：微调往往使用更短的总训练步数，学习率衰减到更小的终值，防止遗忘。

    - 层差异：预训练通常所有层统一学习率（或特定架构有不同），微调经常使用分层学习率以保留底层特征。

    - 正则化：微调通常使用更强的权重衰减（或 Dropout），但学习率同样较小以避免过拟合。

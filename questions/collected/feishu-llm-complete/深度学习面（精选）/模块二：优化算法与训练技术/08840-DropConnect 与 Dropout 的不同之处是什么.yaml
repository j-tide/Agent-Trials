content:
  prompt: DropConnect 与 Dropout 的不同之处是什么？
answer:
  mode: rubric
  reference_answer: |-
    - Dropout：随机丢弃神经元输出（激活值），即每次将某些激活值置为 0。

    - DropConnect：随机丢弃权重连接，即每次将权重矩阵中的某些元素置为 0，保留的权重不重新缩放，而是在训练时对输出产生影响。相当于随机断开输入与输出之间的连接。

    - 主要区别：DropConnect 作用于权重矩阵，Dropout 作用于激活向量。DropConnect 提供了更细粒度的正则化，能训练出更稀疏的连接，但计算效率通常较低，收敛可能需要更长时间。效果上，在某些任务中 DropConnect 能进一步提升泛化性能。


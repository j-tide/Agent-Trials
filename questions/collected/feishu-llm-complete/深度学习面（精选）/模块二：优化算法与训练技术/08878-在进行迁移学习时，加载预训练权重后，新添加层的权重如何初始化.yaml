content:
  prompt: 在进行迁移学习时，加载预训练权重后，新添加层的权重如何初始化？
answer:
  mode: rubric
  reference_answer: |-
    新添加层（通常是任务特定的分类头或回归头）没有对应的预训练权重，需要随机初始化。策略如下：

    - 使用标准初始化方法：针对新层的激活函数，选择合适的初始化。例如，若接 ReLU，用 He 初始化；接 tanh，用 Xavier 初始化。如果新层是线性层直接输出 logits，使用较小的随机权重（如均值为 0，标准差 0.01 的高斯分布）也是常见做法。

    - 偏置可以初始化为零。

    - 减少新层学习速率敏感度：有时新层从头训练，而骨干网络用较小学习率微调。新层初始化不应导致巨大的初始损失，以免传回过大梯度干扰预训练权重。通常初始化为小方差，让初始输出接近零或较小值。

    - 特殊情况：若新层为卷积层（如用于分割的 1×1 卷积），可使用 He 初始化。对于 Transformer 的额外任务头，通常也是随机初始化。

    总之，新添加层的初始化遵循一般网络初始化的原则，保证信号能平稳流动即可。


answer:
  mode: rubric
  reference_answer: |-
    核心思想

    对不同参数使用不同的学习率，根据该参数历史梯度的平方和来自适应地缩小学习率。对于频繁更新的参数（梯度累加值大），学习率衰减得快；对于不常更新的参数（累加值小），学习率衰减得慢，从而在稀疏数据中让每个参数得到更均衡的训练。


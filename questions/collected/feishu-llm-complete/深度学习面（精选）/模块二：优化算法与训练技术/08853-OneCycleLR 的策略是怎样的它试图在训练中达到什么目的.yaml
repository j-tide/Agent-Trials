content:
  prompt: OneCycleLR 的策略是怎样的？它试图在训练中达到什么目的？
answer:
  mode: rubric
  reference_answer: |-
    OneCycleLR 策略（Leslie Smith, 2017）：

    - 整个训练过程只有一个学习率周期，包含“上升阶段”和“下降阶段”。

    [图片内容未导入]

    - 通常配合动量（momentum）反向变化：学习率上升时，动量从 0.95 下降到 0.85（或类似）；学习率下降时，动量再返回高点。

    试图达到的目的：

    - 快速收敛：学习率上升阶段使模型快速通过平坦区域，加速早期训练。

    - 正则化效果：大学习率在中期起到类似“退火”但带有噪声的探索作用，能帮助模型找到更平坦、泛化更好的极小值；而下降阶段的动量逐渐增大又帮助模型在后期稳定收敛。

    - 不依赖繁琐的超参数调优：使用学习率查找器（LR Finder）找到合适的最大学习率即可，策略自动完成整个训练过程，只需要训练固定 epochs（通常比传统调度所需的 epochs 少）。

    - 性能和效率：大量实验表明，OneCycleLR 在更少的 epoch 内可以达到甚至超越传统调度（如阶梯衰减）的精度，特别适合有限预算的场景。

    典型用法：fastai 库中广泛应用，适用于图像分类、NLP 等多种任务。


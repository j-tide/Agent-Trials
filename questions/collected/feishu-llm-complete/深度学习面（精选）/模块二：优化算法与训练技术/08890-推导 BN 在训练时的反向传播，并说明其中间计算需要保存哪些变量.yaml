    需要保存的中间变量（用于反向传播）：

    [图片内容未导入]

    保存这些使反向传播能够在 O(m) 时间内完成，而不需要重新计算均值方差。在实际的深度学习框架中，BN 层会自动缓存这些值，供 backward 使用。

    - BN：计算每个通道 c上，所有 N,H,W 元素的均值和方差（形状为 (C,)）。

    - LN（通常应用于 (N,D) 或 (N,L,C) 的最后维度 C）：对每个样本 n（和每个位置 l 如果序列），在特征维度 C 上归一化。即均值方差形状为 (N,) 或 (N,L)。

    - 如果新数据集与预训练数据集很相似，且微调学习率很小，冻结 BN 的统计量（使用预训练的运行均值和方差，并设置模型为 eval 模式）可能有效，且推理更快。

    - 如果新数据集分布差异大（如自然图像到医学图像），则应继续更新 BN 统计量，有时甚至只更新 BN 的参数就能取得不错的效果（因为 BN 参数少）。

    - 对于冻结特征提取器的微调，常用的方法是设置 model.train()，但将大部分层的 requires_grad=False，这样 BN 层的运行统计量会更新，但 γ,βγ,β 不更新。需要特别注意：如果全连接层等被冻结，BN 仍会改变输入的归一化行为，可能和冻结的权重不匹配，此时就要仔细平衡。

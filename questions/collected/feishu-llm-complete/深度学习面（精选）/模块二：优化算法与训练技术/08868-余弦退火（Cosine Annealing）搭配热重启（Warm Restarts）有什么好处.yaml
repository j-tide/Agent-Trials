content:
  prompt: 余弦退火（Cosine Annealing）搭配热重启（Warm Restarts）有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    好处：

    - 跳出局部极小值：周期结束时学习率突然跳回高值，相当于给优化过程一记“扰动”，能将参数弹出当前可能较差的局部极小值或鞍点，重新探索损失曲面。这种“逃离”能力是单周期余弦所不具备的。

    - 集成效果：每个周期结束时模型收敛到不同的局部解，可以将这些周期的模型快照（Snapshot Ensemble）进行集成，不增加训练成本即可提升泛化能力。

    - 更快的收敛：由于热重启允许更大的学习率反复探索，模型常能在更少的 epoch 内达到单周期余弦退火相似的精度。

    - 缓解过拟合：定期重置学习率引入了类似周期性退火的效果，提供了一种正则化，防止模型过早扎入尖锐极小值。

    典型应用：SGDR（Stochastic Gradient Descent with Warm Restarts），在 CIFAR、ImageNet 上均表现出色。


content:
  prompt: 为什么训练过程中需要调整学习率？固定的学习率会有什么问题？
answer:
  mode: rubric
  reference_answer: |-
    需要调整学习率的原因：

    - 训练初期，参数远离最优点，损失曲面可能陡峭，需要较大的学习率快速逼近最优区域。

    - 训练后期，参数接近最优点或处于狭窄的极小值盆地，较大的学习率会使参数在最优值附近来回震荡，难以精确收敛，甚至跳出该区域。此时需要较小的学习率进行精细微调。

    - 深度网络的损失曲面高度非凸，存在鞍点、峭壁和局部极小值，动态调整学习率可以帮助模型在不同阶段克服这些障碍。

    固定学习率的问题：

    - 过大：初期可能快速下降，但随后会在最优值周围剧烈震荡甚至发散，损失无法收敛到更低水平，泛化性能差。

    - 过小：收敛极其缓慢，可能长时间陷在鞍点或平坦区域，且容易过拟合（因为无法摆脱局部极小），训练成本剧增。

    - 适中：对于简单问题或许可行，但对于复杂模型，始终如一的步长既不能高效穿越平坦区，又不能在后期平稳着陆，往往会得到次优结果。

    因此，合理的学习率调度策略旨在平衡探索与精确收敛，兼顾训练速度和最终性能。


content:
  prompt: Instance Normalization (IN) 和 Group Normalization (GN) 分别适用于什么任务？
answer:
  mode: rubric
  reference_answer: |-
    Instance Normalization (IN)：

    - 归一化维度：对每个样本独立地在每个通道上，在空间维度（H, W）上计算均值和方差。输出形状同输入，每个样本每个通道归一化到 0 均值 1 方差。

    - 适用任务：图像风格迁移、图像生成（如 CycleGAN、Pix2Pix 等）。因为风格迁移希望保留内容特征的空间结构，但去除样式信息（均值和方差代表特定风格）。IN 将每个样本的每个通道归一化，相当于抹除了该通道的均值和方差信息，使得生成结果不受原始图像对比度等风格的影响，便于风格迁移和纹理合成。在低级视觉任务中也有应用。

    Group Normalization (GN)：

    - 归一化维度：将通道分成若干组，对每个样本，在每一组内的所有通道和空间维度（H, W）上归一化。不依赖 batch 维度。

    - 适用任务：小 batch 情况下的图像分类、目标检测、分割。当 batch size 很小（如 1 或 2）时，BN 失效，而 GN 的性能与 batch size 无关，且通常优于 LN 在视觉任务中的表现。GN 是 BN 和 LN 的折中：组数为通道数时退化为 IN，组数为 1 时退化为 LN。实验表明，GN 在 batch size 为 2 时图像分类精度远高于 BN，因此广泛应用于显存有限的任务中（如 Mask R-CNN 中使用 GN 替代 BN）。


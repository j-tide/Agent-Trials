content:
  prompt: 在训练大模型时，为什么有时候会同时使用 Dropout 和 BN？需要注意什么顺序？
answer:
  mode: rubric
  reference_answer: |-
    同时使用的原因：

    BN 主要用于加速收敛、稳定训练、允许更大学习率；Dropout 提供强大的正则化以对抗过拟合。两者作用不同且可以互补，尤其在大型全连接层或 Transformer 中。

    注意顺序：

    理论上，Dropout 会随机改变神经元的激活方差，而 BN 则在每个 batch 内维持稳定的均值和方差。如果顺序不当，可能造成“方差偏移”问题。通常推荐两种顺序：

    - 卷积/全连接 → BN → 激活 → Dropout（BN 先于 Dropout，让 BN 稳定分布后再进行随机丢弃）。这种顺序在 ResNet 和现代 CNN 中很常见。

    - 一些工作中也使用 Conv → ReLU → Conv → BN → Dropout 等变形，但核心是避免 Dropout 放在 BN 之前影响归一化统计量。

    早期的 Inception 系列中曾建议将 Dropout 放在 BN 之后、激活之前，但后来大量实践表明 BN -> ReLU -> Dropout 效果不错。更关键的是，训练和测试时需确保 Dropout 的状态切换正确。

    对于 Transformer，通常 Dropout 施加在 Attention 输出的线性层之后，以及 FFN 子层内，而 LN 在子层之前或之后（Pre-Norm/Post-Norm），因此天然位置不同，冲突较小。


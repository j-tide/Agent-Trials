    正则化作用：

    - 防止模型对训练标签过于自信（输出概率极端接近 1 或 0），避免网络过分拟合错误标注或噪声标签。

    - 鼓励模型学习类别之间的相对关系，使特征表示更加泛化。

    - 实验证明它能提升模型校准度（预测置信度与准确率更匹配），减少过拟合。


content:
  prompt: 数据增强作为一种正则化手段，是如何防止过拟合的？举例说明图像和文本增强方法。
answer:
  mode: rubric
  reference_answer: |-
    原理：数据增强通过人为生成更多训练样本变体，增加数据的多样性，从而减小模型对训练集中特定细节的依赖，强制模型学习更本质、不变的特征，降低过拟合风险。本质上相当于在数据分布上施加了扰动，约束模型在局部变化下的稳定性。

    图像增强方法：

    - 随机翻转（水平、垂直）

    - 随机裁剪与缩放

    - 色彩抖动（亮度、对比度、饱和度、色调调整）

    - 随机旋转、平移、仿射变换

    - 高斯噪声、模糊

    - Mixup、CutMix（后文详述）

    文本增强方法：

    - 同义词替换：随机选择词汇替换为同义词

    - 回译：将文本翻译成其他语言再翻译回来，产生语义相似但表达不同的句子

    - 随机插入、删除或交换单词

    - 使用预训练语言模型生成改写（如基于 BERT 的上下文增强）

    - 掩码语言模型预测替换（如用 BERT 预测被 mask 的词）

    这些方法都能够在保持语义/类别标签的前提下创造新样本，使模型不容易记住训练数据的噪声和细节。


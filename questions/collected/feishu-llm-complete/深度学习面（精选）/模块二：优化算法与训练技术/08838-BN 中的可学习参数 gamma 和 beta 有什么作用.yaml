content:
  prompt: BN 中的可学习参数 gamma 和 beta 有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    尽管 BN 将输入归一化为零均值和单位方差，但这种固定的分布可能会限制网络的表达能力。例如，对于 sigmoid 激活函数，如果输入始终处于均值为 0、方差为 1 的分布，它可能主要在近似线性区工作，而失去了非线性的能力。γ 和 β 恢复了网络的表示能力：

    - γ 可缩放归一化后的值，相当于调整标准差。

    - β 可平移归一化后的值，相当于调整均值。


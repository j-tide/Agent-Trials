content:
  prompt: L1 正则化为什么能产生稀疏解？L2 正则化为什么不能？
answer:
  mode: rubric
  reference_answer: |-
    从优化几何上看，L1 正则化项不可微于零，且梯度为常数（符号函数），这使得那些不重要特征的权重在优化过程中被推向 0，并且一旦到达 0 就很难再“复活”，因为 0 附近的梯度会立刻把它推向 0。

    而 L2 正则化的梯度与权重大小成正比，当权重接近 0 时，梯度也趋近于 0，因此权重会逐渐衰减但难以精确达到 0，除非损失函数本身要求。

    此外，从拉普拉斯先验的尖峰特性可知，后验分布的最大值更可能出现在参数为 0 的点上。所以 L1 能够实现特征选择，L2 则只能将权重压缩但保持所有特征。


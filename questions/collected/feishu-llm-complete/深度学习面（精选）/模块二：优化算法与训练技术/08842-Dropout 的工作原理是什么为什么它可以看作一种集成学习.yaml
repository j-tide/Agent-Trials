content:
  prompt: Dropout 的工作原理是什么？为什么它可以看作一种集成学习？
answer:
  mode: rubric
  reference_answer: |-
    工作原理

    [图片内容未导入]

    测试时，所有神经元都保留，但为了保持与训练时输出期望一致，需要将权重乘以 1−p（或训练时除以 1−p，两种实现等价）。

    为什么可看作集成学习

    每次训练时，由于随机丢弃，网络结构都会变化，相当于从完整的网络中采样出一个“子网络”。

    经过多次迭代，模型实际上是在指数级数量的不同子网络上训练，这些子网络共享大部分参数。

    测试时使用完整网络，可近似为对这些子网络进行模型平均。因此 Dropout 是一种隐式集成，有效降低了过拟合，提高泛化能力。


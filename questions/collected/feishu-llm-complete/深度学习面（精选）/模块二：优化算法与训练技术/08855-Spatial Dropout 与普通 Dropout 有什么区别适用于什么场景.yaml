content:
  prompt: Spatial Dropout 与普通 Dropout 有什么区别？适用于什么场景？
answer:
  mode: rubric
  reference_answer: |-
    - 普通 Dropout：对每个标量元素独立随机丢弃，适用于全连接层。

    - Spatial Dropout：对整个通道（特征图）进行随机丢弃。即同一个通道的所有空间位置（宽、高）被同时置零或保留。

    - 适用场景：常用于卷积神经网络（CNN）。因为 CNN 的特征图在空间上高度相关，若按像素点独立丢弃，相邻像素可能一部分保留一部分丢失，网络容易通过周围像素“猜出”被丢弃的值，削弱正则化效果。将整个通道丢弃可以强制特征图学习更鲁棒的特征表达，防止通道间的共适应。


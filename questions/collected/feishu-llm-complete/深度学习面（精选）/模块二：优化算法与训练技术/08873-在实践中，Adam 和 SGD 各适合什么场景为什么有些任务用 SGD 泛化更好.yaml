content:
  prompt: 在实践中，Adam 和 SGD 各适合什么场景？为什么有些任务用 SGD 泛化更好？
answer:
  mode: rubric
  reference_answer: |-
    SGD（带动量）适合的场景：

    - 传统的计算机视觉任务（如图像分类、目标检测），尤其是使用 ResNet、VGG 等经典网络时，经验上 SGD + momentum 往往能达到更高的测试精度。

    - 数据量充足且可以精细调参的场景，例如通过长时间训练、余弦退火学习率、多阶段衰减等策略。

    - 对泛化性能要求极高的任务，因为 SGD 倾向于收敛到平坦极小值（flat minima），这类解对数据扰动和参数微小变化不敏感，泛化能力强。

    Adam 适合的场景：

    - 训练 Transformer、GAN、序列模型（如 RNN、LSTM）、强化学习等，这些模型经常面临非平稳目标、稀疏梯度或高度非凸的损失曲面。

    - 需要快速原型开发或超参数较为鲁棒的情况：Adam 默认参数就能在许多任务上取得不错的结果，调参负担小。

    - 处理含噪声或稀疏梯度的问题（如自然语言处理、大规模推荐系统），自适应学习率能对不同的参数维度进行差异化的步长调整，训练初期收敛极快。

    为什么有些任务用 SGD 泛化更好：

    - 平坦极小值假说：自适应优化器（如 Adam）倾向于寻找损失曲面中尖锐极小值，因为自适应机制会快速放大某些方向的更新，使其“钻入”狭窄的深谷。尖锐极小值对数据或参数的细微变化极为敏感，测试误差较大。

    - 学习率的自适应缩放可能过早地缩小了某些关键方向的步长，导致不能充分探索损失曲面，从而错过更好的平坦区域。

    - SGD 的恒定或仅依赖全局衰减的学习率在所有方向上均匀探索，其噪声驱动下更容易跳出尖锐极小值并最终陷入更宽、泛化更好的区域。

    - 数据特点：当数据本身噪声低、问题相对平稳时，SGD 的精细调节能够逼近全局最优且不引入过度的自适应偏差。

    但这种差异并非绝对，近年来通过解耦权重衰减的 AdamW 和适当的学习率调度，Adam 也能在许多视觉任务上匹敌甚至超越 SGD 的泛化能力。


  reference_answer: |-
    默认初始化：

    PyTorch 并没有一个全局统一的默认初始化，而是根据层类型有不同的默认行为，通常定义在各自的 reset_parameters() 方法中。常见的有：

    [图片内容未导入]

    自定义初始化：

    可以定义一个函数，接受模块作为输入，对其中的子模块应用自定义初始化。例如：

    ```python
    def init_weights(m):
        if isinstance(m, nn.Linear):
            torch.nn.init.xavier_uniform_(m.weight)
            if m.bias is not None:
                torch.nn.init.zeros_(m.bias)
        elif isinstance(m, nn.Conv2d):
            torch.nn.init.kaiming_normal_(m.weight, mode='fan_out', nonlinearity='relu')

    model.apply(init_weights)
    ```

    也可以直接在模型定义中的 init 后手动初始化特定层。torch.nn.init 提供了丰富的初始化函数（uniform, normal, constant, xavier, kaiming, orthogonal 等），并且支持 _ 后缀表示 in-place 操作。


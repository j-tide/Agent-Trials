content:
  prompt: L1 和 L2 正则化的公式是什么？它们分别导致怎样的参数分布？
answer:
  mode: rubric
  reference_answer: |-
    公式

    - L1 正则化（Lasso）：在损失函数上添加参数绝对值之和的惩罚项。

    [图片内容未导入]

    - L2 正则化（Ridge）：添加参数平方和的惩罚项。

    [图片内容未导入]

    导致的参数分布（先验视角）

    从贝叶斯角度看，正则化相当于给参数引入先验分布。

    [图片内容未导入]

    直观上，L1 正则化的约束域是菱形（等值线是方形），L2 的约束域是圆形。当损失函数的等高线与这些约束域相切时，在菱形的角点（坐标轴上）更容易发生接触，导致某些参数直接为零。

    [图片内容未导入]


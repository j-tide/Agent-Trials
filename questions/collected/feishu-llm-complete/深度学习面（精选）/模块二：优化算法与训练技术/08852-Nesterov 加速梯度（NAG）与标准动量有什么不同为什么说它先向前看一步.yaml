content:
  prompt: Nesterov 加速梯度（NAG）与标准动量有什么不同？为什么说它“先向前看一步”？
answer:
  mode: rubric
  reference_answer: |-
    不同点：标准动量是先在当前位置计算梯度，然后与累积速度混合并更新。而 NAG 是先根据之前累积的速度向前试探一步，在那个“前瞻”位置上计算梯度，然后修正速度并实际更新。

    标准动量更新：

    [图片内容未导入]

    NAG 更新：

    [图片内容未导入]

    “先向前看一步”

    [图片内容未导入]

    点计算梯度，相当于询问：“如果我现在继续按惯性前进，那个地方的斜率是什么？” 然后利用该前瞻点的梯度来修正本次的速度方向和大小。

    这样做的好处是，当接近谷底时，如果速度方向指向谷底，前瞻位置可能已经越过谷底，梯度方向会反过来，从而提前减速，减少 overshoot（冲过头），收敛更加平滑稳定。

    NAG 在理论上有更好的收敛率（在某些凸优化条件下），且实践中通常比标准动量稍好。


answer:
  mode: rubric
  reference_answer: |-
    白化 (Whitening)：

    在信号处理中，白化是指将一组随机变量变换为具有零均值和单位协方差矩阵（即去相关，各分量方差为

    [图片内容未导入]

    - 真正的白化需要整个协方差矩阵的对角化，而 BN 仅是逐元素变换。因此 BN 可视为一种简化的、忽略相关性的白化，或者说是逐维度的标准化。

    - 虽然 BN 没有完全白化，但这种简化在实践中不但计算高效，而且足以稳定训练。此外，BN 通过可学习的 γ,βγ,β 恢复了可能的任意线性变换，相当于给了网络一种能力去自行决定各维度间的相关性是否需要调整。


content:
  prompt: Mixup 和 CutMix 分别是怎么做数据增强的？它们的原理有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    Mixup：

    [图片内容未导入]

    - 原理：在输入空间进行线性凸组合，同时标签也相应混合，迫使模型对输入变化输出线性变化的预测，鼓励模型学习样本之间的线性行为，提升泛化且对对抗样本更鲁棒。这相当于一种数据增广下的邻域风险最小化。

    CutMix：

    - 方式：随机裁剪一张图片的一个矩形区域，将该区域替换为另一张图片的对应区域，标签也按面积比例混合：

    [图片内容未导入]

    - 其中 λλ 是掩码面积比例，从 Beta 分布采样。

    - 原理：通过空间上的替换，强制模型关注局部区域而不只是全局统计；与 Mixup 的不同在于 CutMix 融合更“局部”，没有对整体图像进行模糊混合，保留了局部区域的自然性。它能显著提升 CNN 的定位能力和鲁棒性。

    区别：

    Mixup 是全局像素级混合，产生像素平均的模糊图像，标签也完全平滑。

    CutMix 则是区域级替换，生成图像局部真实、局部属于另一类，混合比例由面积决定。两者均通过混合标签实现正则化，但 CutMix 更有利于需要精细空间信息保持的任务（如目标检测、定位）。


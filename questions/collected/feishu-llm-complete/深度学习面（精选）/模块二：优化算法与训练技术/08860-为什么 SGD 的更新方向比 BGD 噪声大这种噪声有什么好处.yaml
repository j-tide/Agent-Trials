content:
  prompt: 为什么 SGD 的更新方向比 BGD 噪声大？这种噪声有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    - 噪声大的原因
    BGD 的梯度是在整个训练集上计算的平均梯度，它反映了真实的总体损失下降方向。而 SGD 仅基于单个样本，单个样本的梯度是该样本损失表面的陡峭方向，样本与样本之间的梯度方向差异很大。这使得 SGD 的每一步方向都在“真实梯度方向”附近剧烈波动，表现出极高的方差。
    从统计学角度，SGD 的梯度是真实梯度的无偏估计，但方差很大。Mini-batch GD 的噪声介于两者之间，批次越小，噪声越大。

    - 噪声的好处

    - 逃离局部极小值和鞍点：在深度神经网络的非凸损失曲面中，存在大量次优的局部极小值和梯度接近于零的鞍点。BGD 的方向很准确，会沿着一个方向一直走，容易掉进这些平坦区域而停滞。SGD 的随机噪声会不断扰动参数，使得它即使在一些梯度很小的点，也可能被推向更有希望的区域，从而有机会找到更优的解。

    - 更好的泛化能力：经验发现，带有噪声的梯度更新往往能导向平坦的极小值（flat minima），而平坦极小值对模型泛化更有利，因为参数微小的变化不会导致性能剧降。相反，BGD 倾向于收敛到尖锐极小值（sharp minima），泛化能力通常较差。

    - 探索能力：噪声让优化路径更具探索性，在损失面上随机游走，可能跨越沟壑，而不是沿着最直接但可能是次优的峡谷前进。

    因此，SGD 的噪声虽然使训练过程变得不稳定，但正是这种扰动赋予了它脱离劣质解、增强泛化的关键能力。


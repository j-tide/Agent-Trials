content:
  prompt: 学习率预热（Warmup）的步数一般如何设定？过长或过短有什么后果？
answer:
  mode: rubric
  reference_answer: |-
    预热步数：指学习率从一个极小值（或零）线性增加到目标初始学习率所需的迭代步数。

    设定原则：

    - 对于 Transformer 等模型，常见预热步数在数千到数万步（如 4000 steps）或占总训练步数的 1%~5%。例如训练 BERT 时常用 10000 steps 预热。对于大模型（如 GPT-3），预热步数可能达数万。

    - 一般通过观察训练曲线：如果 loss 在初期出现剧烈震荡或发散，往往需要更长的预热；如果预热过长，前期学习率过低，训练进展缓慢。

    - 实际中常用规则：对 batch size 较大的情况，预热步数适当增加。许多库默认预热 5 个 epoch 或 10% 的总步数。

    过短的后果：

    - 模型初始化不稳定，一阶/二阶矩估计尚不可靠，突然的大学习率会导致参数更新过大，loss 爆炸或 NaN，训练可能崩溃。

    - 即使未崩溃，初期的无序大更新可能将模型带到极差的初始点，影响最终收敛。

    过长的后果：

    - 前期有效学习率太小，收敛速度大大降低，浪费计算资源。

    - 可能使模型在低学习率下陷入不太好的局部区域，限制了后续大学习率探索的能力，反而可能略微降低最终性能。


content:
  prompt: 5. Dataset 和 DataLoader 的设计如何实现高效数据加载？num_workers 和 pin_memory 有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    Dataset 和 DataLoader 将数据读取、预处理与模型训练解耦，通过多进程和内存技术实现高效流水线。

    Dataset

    - 抽象类，需实现 len 和 getitem。

    - 每个索引返回一个样本，支持懒加载（仅在访问时从磁盘读取），避免一次性加载整个数据集到内存。

    - 可组合使用 ConcatDataset、Subset、TensorDataset 等。

    DataLoader

    - 接收 Dataset，提供批量迭代。关键参数：

    高效加载机制

    - 多进程加载：num_workers > 0 时，DataLoader 创建多个子进程并行从 Dataset 中取样本并做预处理（图像解码、增广等），主进程则可以同时执行 GPU 计算。这种流水线能有效隐藏数据 I/O 延迟。

    - pin_memory：当为 True 时，加载的 Tensor 会放置在 CPU 的锁页内存（pinned memory）中，这允许异步的 CPU→GPU 数据传输（non_blocking=True），带宽更高，且可与 GPU 计算重叠。

    调优建议

    - num_workers 不宜过大（过多进程造成上下文切换开销，内存占用增大），通常设为 4~16，需根据硬件和数据预处理复杂度实验确定。

    - pin_memory=True 几乎总是有益，除非系统锁页内存不足。


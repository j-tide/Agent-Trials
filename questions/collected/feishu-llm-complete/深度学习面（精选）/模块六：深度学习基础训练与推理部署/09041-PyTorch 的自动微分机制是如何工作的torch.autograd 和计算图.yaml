content:
  prompt: PyTorch 的自动微分机制是如何工作的？torch.autograd 和计算图。
answer:
  mode: rubric
  reference_answer: |-
    PyTorch 的自动微分基于反向自动微分和计算图，由 torch.autograd 模块实现。

    核心概念

    - Tensor 的 requires_grad：当一个 Tensor 的属性 requires_grad=True，所有对该 Tensor 的操作都会被记录到计算图中，以便后续计算梯度。

    - 计算图（Computational Graph）：是一个有向无环图（DAG），节点代表操作（Function），边代表数据依赖（Tensor）。叶子节点是输入张量，根节点是损失值。图是动态的，在每次前向传播时创建。

    - Function 对象：每次操作都会生成一个 Function 子类的实例，它记录了正向计算的前后关系，以及用于反向传播的 forward() 和 backward() 静态方法。

    工作流程

    - 前向传播：用户正常编写计算，所有产生的新 Tensor 会保存其创建者（grad_fn），从而隐式建立计算图。例如 c = a + b，c.grad_fn 会指向一个 AddBackward0 对象。

    - 反向传播：调用 loss.backward() 时，autograd 引擎从 loss 节点开始，拓扑排序遍历图，逐节点调用对应的 backward() 方法，将上游梯度 grad_output 传入，结合前向保存的上下文计算出对输入的梯度，并累加到相应 Tensor 的 .grad 属性上。

    - 梯度累加：每次 backward() 梯度会累加，而不是覆盖，这使得梯度累积和多损失任务易于实现。通常需要在每次迭代前手动 optimizer.zero_grad() 清零。

    - 计算图释放：默认情况下，执行完 backward() 后计算图会被释放以节省内存（因为中间变量不再需要）。若需多次反向传播（如训练 GAN），需在 backward() 中指定 retain_graph=True。

    torch.autograd.grad 和 torch.autograd.backward

    - autograd.backward(tensors, grad_tensors) 是高级 API，计算并累加梯度。

    - autograd.grad(outputs, inputs) 则返回梯度的列表，不累加到 .grad。

    自动微分引擎是 PyTorch 易于使用和灵活性的基石。


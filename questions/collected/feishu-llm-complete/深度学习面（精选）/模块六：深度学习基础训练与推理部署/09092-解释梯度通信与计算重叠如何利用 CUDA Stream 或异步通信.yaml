content:
  prompt: 解释“梯度通信与计算重叠”如何利用 CUDA Stream 或异步通信。
answer:
  mode: rubric
  reference_answer: |-
    在现代分布式训练框架（如 PyTorch DDP, Horovod, Megatron-LM）中，可以利用反向传播的顺序性，将梯度的计算与已经计算出的梯度通信进行重叠，隐藏通信延迟。

    实现原理

    - DDP 内部会将模型参数的梯度分为多个“桶”（buckets）。在反向传播过程中，一旦某个桶内的所有参数的梯度都计算完毕，DDP 就立即启动该桶的 AllReduce 异步通信（使用 NCCL 的异步操作），同时反向传播继续计算后续参数的梯度，不需要等待该通信完成。

    - 这一切依赖于 CUDA Stream：DDP 创建一个独立的 CUDA Stream 用于通信，使得通信与计算 Stream 可以并行执行。在同一个 Stream 上，通信操作被正确地插入，不会与计算发生依赖冲突。

    - 最后，在优化器步骤开始前，需要确保所有桶的通信都已完成（通过同步事件）。

    异步通信
    NCCL 提供了非阻塞的集合通信 API（如 ncclAllReduce 配合 cudaStream_t），PyTorch 的 all_reduce 也可以设置 async_op=True，返回一个 work handle，随后可等待完成。DDP 通过管理这些异步 handle，实现最大限度地重叠。


content:
  prompt: 如何在一个大型集群上高效地执行超参数搜索（Hyperparameter Sweep）？
answer:
  mode: rubric
  reference_answer: |-
    在大规模集群上执行超参数搜索，需要高效的编排和资源利用策略。

    常见方法：

    - 独立作业并行：每个超参数配置作为一个独立的训练作业提交。适合作业调度系统（如 Slurm, Kubernetes）。缺点是每个作业都需要从头加载数据、初始化模型，且资源利用率可能不均衡。

    - 分布式搜索框架：如 Ray Tune、Optuna、Hyperopt 结合分布式后端。这些框架可以启动多个训练 trial，每个 trial 占用一部分资源（如一个多节点组），动态管理 trial 的生命周期。支持早期停止（如 ASHA 算法）以终止表现不佳的 trial，节省资源。

    - 多 worker 共享模型初始化：在某些场景中，可以一次预训练模型，然后只调整少量参数微调，减少重复计算。但在完全的搜索中不易做到。

    高效策略：

    - 群体训练（Population Based Training, PBT）：同时训练一组模型，定期利用表现好的模型的权重和超参数替换差的，实现自适应搜索。适合在线进化。

    - 贝叶斯优化：利用代理模型选择下一个尝试的超参数，减少搜索次数。

    - 使用 spot 实例/节点，配合容错检查点，降低计算成本。

    - 数据与模型的缓存：在多个 trial 间共享公共数据，或者使用内存缓存加速 I/O。

    - 资源粒度：不是所有 trial 都需要全数 GPU，可根据模型大小动态分配资源。

    通过使用 Ray Tune + PyTorch Distributed，可以方便地在集群上启动分布式 trial，并与集群调度器集成，实现高效超参搜索。

    - 全局均值 = 所有设备均值的加权平均（按样本数）。

    - 全局方差 = 根据全局均值和各设备局部方差、局部均值计算得到。

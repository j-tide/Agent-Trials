content:
  prompt: SmoothQuant 的核心思想是什么？它如何平滑激活值离群点？
answer:
  mode: rubric
  reference_answer: |-
    SmoothQuant (Xiao et al., 2023) 针对大语言模型激活值中存在的离群值，提出一种权重-激活平滑技术，消除激活离群值，从而使得激活值易于量化。

    核心思想

    在 LLM 中，离群值常集中在某些特征通道，导致激活的某些通道数值极大。对激活直接量化会很困难。SmoothQuant 通过一个数学等价的变换，将激活的量化难度迁移到权重上，实现“平滑”。

    [图片内容未导入]

    效果

    SmoothQuant 使得对激活值的量化变得容易，在 W8A8（权重 8bit、激活 8bit）设置下，无需复杂的混合精度，即可实现大语言模型的近乎无损量化。极大简化了推理实现，已经集成到多个部署框架中。


content:
  prompt: 解释蒸馏中“温度系数”的作用，温度越高，软标签的分布有何变化？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    作用

    - 当 T=1，为标准 softmax，概率分布尖锐，硬标签的负类概率接近 0，只提供很少的信息（接近 one-hot）。

    - 当 T>1，分布变得更平滑、软标签熵更高。原本很小的负类概率被放大，相对差异减小，即“软化”。这使得学生可以从教师那里学到类别间的相似性结构（例如，猫的软标签中，豹子可能也有较高概率，而汽车极低），这种丰富的暗知识对小模型训练很有价值。

    - 极高温（T→∞）时，分布趋于均匀分布，蒸馏信号消失。

    - 温度降低（T<1）会使分布更尖锐，接近硬标签。


content:
  prompt: 对于生成式模型，KV 缓存是什么？它在推理加速中有何作用？（可结合 Transformer）
answer:
  mode: rubric
  reference_answer: |-
    KV 缓存 是自回归 Transformer 解码时用于避免重复计算历史 token 的 Key 和 Value 的优化技术。

    原理

    - 在自回归生成第 t 个 token 时，传统做法需将所有 t−1 个历史 token 重新输入模型，计算它们的 K 和 V。

    - KV 缓存将已生成 token 的 Key 和 Value 向量存储在各解码器层。生成新 token 时，仅需计算该新 token 的 Q、K、V，并将新 K、V 追加到缓存。注意力计算时，Q 仅来自当前 token，K 和 V 来自缓存（包含全部历史 token）。

    加速作用

    [图片内容未导入]

    相关优化

    - Multi-Query Attention (MQA) 和 Grouped-Query Attention (GQA) 减少 KV 头数，降低缓存大小。

    - PagedAttention (vLLM) 将 KV 缓存分页管理，提升显存利用率。

    - 量化 KV 缓存为 INT8 或 FP8 进一步压缩。


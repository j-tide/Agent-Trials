content:
  prompt: ONNX Runtime 如何加速 Transformer 推理？有哪些具体的图优化？
answer:
  mode: rubric
  reference_answer: |-
    ONNX Runtime 是一个跨平台的高性能推理引擎，对 Transformer 模型有专门的优化。

    加速手段

    - 图优化：导入 ONNX 图后，进行多级图优化（基础、扩展、布局优化），包括：

    - 内核优化：针对不同硬件提供调优的 CUDA 内核或 CPU 实现，充分利用 Tensor Core / VNNI 等指令。

    - 内存优化：预分配缓冲区，计算内存复用计划，减少内存分配开销和峰值。

    - 量化支持：提供 INT8 量化工具，进一步加速 Transformer。

    性能提升：相比原 PyTorch 或 TensorFlow 推理，ONNX Runtime 可将 Transformer 推理吞吐提升 1.5~3 倍，尤其在批量处理时效果显著。同时支持多种执行后端（CUDA, TensorRT, OpenVINO 等）。


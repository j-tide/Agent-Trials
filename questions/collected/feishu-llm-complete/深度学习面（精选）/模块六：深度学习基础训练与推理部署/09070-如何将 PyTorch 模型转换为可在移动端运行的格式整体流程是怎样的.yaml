content:
  prompt: 如何将 PyTorch 模型转换为可在移动端运行的格式？整体流程是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    整体流程

    - 模型准备与优化（可选）
    在服务器端应用剪枝、蒸馏等压缩技术得到轻量学生模型。

    - 导出中间格式

    - 模型转换
    使用目标移动推理框架的工具链将 TorchScript/ONNX 转换为专用格式：

    - 模型量化（推荐）
    移动端通常进行 INT8 训练后量化或量化感知训练。MNN、NCNN 等提供内置量化工具，可将 FP32 模型量化为 INT8 以减少体积和加速。

    - 验证与测试
    在移动模拟器或真机上测试精度与性能（延迟、内存），必要时调整优化选项。

    - 集成部署
    将模型文件打包入 App，使用框架 SDK 加载、执行推理，并编写前后处理代码。

    技术栈示例：PyTorch → ONNX (opset 11) → NCNN/MNN → Android (JNI) / iOS (Objective-C++)。


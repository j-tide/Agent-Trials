content:
  prompt: ZeRO（DeepSpeed）的三个阶段分别对哪些状态（参数、梯度、优化器状态）进行分片？各有什么通信开销？
answer:
  mode: rubric
  reference_answer: |-
    ZeRO（Zero Redundancy Optimizer）将优化器状态、梯度和参数在数据并行的设备间进行分片，消除冗余存储，从而支持更大模型。

    ZeRO-1 (Optimizer State Sharding)

    - 分片内容：优化器状态（如 Adam 中的动量、方差）。

    - 参数和梯度：仍完整存储在每个 GPU 上。

    - 通信开销：在优化器更新步骤中，每个 GPU 需要收集所有其他 GPU 上的分片优化器状态（或收集更新后的参数），涉及 AllGather 或 ReduceScatter，通信量与数据并行相当（与模型参数量成比例）。

    ZeRO-2 (Optimizer State + Gradient Sharding)

    - 分片内容：优化器状态 + 梯度分片。

    - 参数：仍完整存储。

    - 通信开销：每个 GPU 只存储与其优化器状态分区对应的梯度。在反向传播后，需要将梯度通过 ReduceScatter 规约并分片，各 GPU 只保留自己负责的部分梯度。通信量仍与模型大小同阶，但避免了冗余存储梯度。

    ZeRO-3 (Optimizer State + Gradient + Parameter Sharding)

    - 分片内容：优化器状态、梯度、参数全部分片。每个 GPU 只存储模型参数的 1/N。

    - 前向/反向传播时：需要动态收集所需的参数。通信开销更高：前向时需要 AllGather 收集参数，反向时需要再次 AllGather 收集参数，然后 ReduceScatter 梯度。总通信量为标准数据并行的 1.5 倍左右，但将显存占用降到了 1/N，能够训练巨型模型。

    总结：ZeRO 的阶段越高，显存节省越多，但通信量从不变到略微增加（ZeRO-3 通信量约为 DP 的 1.5 倍），需要在模型规模和通信开销间权衡。


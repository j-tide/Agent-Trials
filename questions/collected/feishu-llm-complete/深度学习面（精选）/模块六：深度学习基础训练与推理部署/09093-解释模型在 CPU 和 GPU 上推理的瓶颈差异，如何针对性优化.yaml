content:
  prompt: 解释模型在 CPU 和 GPU 上推理的瓶颈差异，如何针对性优化？
answer:
  mode: rubric
  reference_answer: |-
    CPU 推理瓶颈与优化

    - 瓶颈特点：单核算力有限，大模型权重加载易成 memory-bound（内存带宽瓶颈）。纯计算密集型算子执行慢，但常受限于标量吞吐。

    - 优化方向：

    GPU 推理瓶颈与优化

    - 瓶颈特点：小 batch/小模型时 memory-bound 或 kernel launch bound；大 batch 时 compute-bound，需充分利用 Tensor Core。显存容量限制最大模型。

    - 优化方向：

    核心差异：CPU 侧重降低带宽和向量化；GPU 侧重提升占用率、利用专用硬件单元和降低调度开销。


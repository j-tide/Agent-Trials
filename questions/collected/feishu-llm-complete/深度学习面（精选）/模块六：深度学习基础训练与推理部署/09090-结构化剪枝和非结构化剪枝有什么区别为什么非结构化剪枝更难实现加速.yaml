content:
  prompt: 结构化剪枝和非结构化剪枝有什么区别？为什么非结构化剪枝更难实现加速？
answer:
  mode: rubric
  reference_answer: |-
    非结构化剪枝

    将神经网络中单个不重要权重置零，即产生稀疏连接。剪枝后的权重矩阵是稀疏的，零值位置任意。

    - 优点：可以达到极高的稀疏度（如 90% 以上）而几乎不损失精度，因为粒度细。

    - 缺点：稀疏矩阵运算在通用硬件（CPU/GPU）上很难直接加速——不规则的内存访问和跳零计算导致实际加速比远低于理论稀疏度。通常需要专用硬件（如稀疏张量核）或特定的稀疏矩阵库（需要满足块稀疏等约束）才能有效利用。因此非结构化剪枝往往只节省存储，不容易直接提升推理速度。

    结构化剪枝

    以卷积核、通道、层等规则结构为单位进行剪枝。例如，移除整个滤波器、整个通道或某个注意力头。剪枝后的模型仍然是密集的，只是维度变小。

    - 优点：可直接利用现有密集矩阵运算库（cuBLAS、MKL）高效加速，没有稀疏计算开销。同时减少内存占用和计算量，无需专门硬件即可获得实际加速。

    - 缺点：剪枝粒度粗，同样压缩率下通常比非结构化的精度损失大，可达到的稀疏度也较低。

    总结：非结构化剪枝更灵活、精度高但硬件难以加速；结构化剪枝容易加速但精度损失可能更大。实践中需要加速时多采用结构化方法。


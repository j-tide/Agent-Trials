content:
  prompt: 使用梯度检查点（Gradient Checkpointing）时，分布式训练的显存如何进一步节约？
answer:
  mode: rubric
  reference_answer: |-
    梯度检查点（Activation Checkpointing）是一种以计算换内存的技术。在反向传播期间，通常需要保存前向传播中的中间激活，以计算梯度。检查点技术只保存部分激活，其他在前向传播时丢弃；在反向传播需要时，通过重新计算一段小图来恢复这些激活。

    在分布式训练中，它与张量并行、流水线并行结合使用：

    - 张量并行：每个设备只保存自己那部分激活，显存随设备数线性减小。结合检查点，可以进一步显著减少每卡的激活内存。

    - 流水线并行：1F1B 调度本身降低了激活存储，使用检查点后，微批的激活存储更少，可以支持更大的 micro-batch 或更深的模型。

    - 选择性检查点：只对计算量较大的层（如注意力、FFN）进行重计算，对便宜的操作保留激活。

    通过这种组合，即使不增加设备，也能训练更大模型。梯度检查点在分布式训练中并不直接减少通信，而是解放显存用于更大的 batch 或模型，间接提升训练吞吐。


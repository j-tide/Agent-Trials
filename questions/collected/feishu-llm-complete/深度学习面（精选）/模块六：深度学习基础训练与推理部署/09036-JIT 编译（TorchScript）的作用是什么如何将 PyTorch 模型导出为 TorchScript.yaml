content:
  prompt: JIT 编译（TorchScript）的作用是什么？如何将 PyTorch 模型导出为 TorchScript？
answer:
  mode: rubric
  reference_answer: |-
    TorchScript 作用

    TorchScript 是 PyTorch 的静态图表示，其目标：

    - 性能优化：通过图编译优化（算子融合、常量折叠、死代码消除等）提升推理速度。

    - 跨平台部署：可脱离 Python 环境，在 C++、移动端（Android/iOS）等非 Python 环境中运行。

    - 模型序列化：生成独立于 Python 的序列化格式。

    - 支持部分动态控制流：通过脚本模式保留循环和分支。

    导出方式

    - 追踪 (Tracing)：torch.jit.trace(model, example_input)
    提供一个示例输入，JIT 会执行一次前向传播，记录实际执行的张量操作，构建静态图。简单快速，但不能捕获数据依赖的控制流（如 if 语句取决于输入值，可能无法正确转换）。

    - 脚本 (Scripting)：torch.jit.script(model)
    直接分析 Python 代码并转换为 TorchScript，可以处理控制流，但要求代码风格兼容（如不支持某些 Python 特性）。

    示例

    model = MyModel()
    model.eval()
    traced_model = torch.jit.trace(model, torch.randn(1, 3, 224, 224))
    traced_model.save("model.pt")

    加载与推理：

    loaded_model = torch.jit.load("model.pt")
    output = loaded_model(input_tensor)

    注意

    - 导出前应调用 model.eval() 固定 BN 等层。

    - 对于动态结构，优先使用 Scripting 或混合使用。

    - TorchScript 是 PyTorch 部署到生产环境的重要途径。


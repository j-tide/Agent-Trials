content:
  prompt: 如何使用 TensorFlow 的 SavedModel 格式进行部署？
answer:
  mode: rubric
  reference_answer: |-
    SavedModel 概述

    SavedModel 是 TensorFlow 的标准模型序列化格式，包含完整的模型信息：计算图、权重、资源（如词表文件），且语言中立，可用于 TensorFlow Serving、TensorFlow Lite、TensorFlow.js 等部署。

    导出 SavedModel

    import tensorflow as tf

    model = tf.keras.models.load_model('my_model.h5')  # 或直接构建
    tf.saved_model.save(model, '/path/to/savedmodel')

    或者使用 model.save('path', save_format='tf')。
    这会生成一个目录，包含 saved_model.pb（图定义）和 variables/（权重）。

    部署方式

    - TensorFlow Serving：最常用的服务化方案。启动服务器加载 SavedModel，提供 gRPC/REST API。

    - TensorFlow Lite：tf.lite.TFLiteConverter.from_saved_model 转换，用于移动/嵌入式部署。

    - TensorFlow.js：通过 tfjs-converter 转换，在浏览器/Node.js 中运行。

    - 直接加载与推理：tf.saved_model.load('path') 恢复模型，进行推理。

    使用 SavedModel 的优点

    - 与训练环境解耦，部署无需原始模型代码。

    - 支持多签名（Signature），可定义不同的输入输出接口。

    - 天然支持版本管理和热更新（Serving 支持多版本）。

    - 便于与 TensorFlow Extended (TFX) 等生产管道集成。

    示例（Serving 启动）：

    tensorflow_model_server --port=8500 --model_name=my_model --model_base_path=/models/my_model

    然后客户端可发送请求进行在线推理。


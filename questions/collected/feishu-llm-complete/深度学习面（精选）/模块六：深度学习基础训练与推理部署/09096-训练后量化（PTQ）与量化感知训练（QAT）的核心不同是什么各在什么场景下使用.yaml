content:
  prompt: 训练后量化（PTQ）与量化感知训练（QAT）的核心不同是什么？各在什么场景下使用？
answer:
  mode: rubric
  reference_answer: |-
    训练后量化 (Post-Training Quantization, PTQ)

    在已训练好的 FP32 模型上，直接插入量化/反量化节点，通过少量无标签校准数据（或无需数据）统计权重和激活的数值范围，确定量化参数（尺度、零点），然后完成量化。不需要重新训练。

    - 优点：快速、无训练成本，适合快速部署。

    - 缺点：对于激活值波动大、模型敏感的场景，精度损失可能较大。

    - 适用场景：已有 FP32 模型，需要快速转成 INT8 进行推理加速；计算资源有限无法进行再训练；相对简单的网络或精度要求不那么苛刻的任务。

    量化感知训练 (Quantization-Aware Training, QAT)

    在训练过程中模拟量化误差：前向传播时对权重和激活进行伪量化（量化-反量化），让网络适应量化带来的信息损失；反向传播使用直通估计器 (STE) 更新原始浮点权重。最终训练完成后，再导出真正量化的模型。

    - 优点：显著恢复甚至完全弥补量化精度损失，通常可以实现接近 FP32 的准确率。

    - 缺点：需要完整的训练流程和标记数据，耗时更长。

    - 适用场景：对精度要求极高（如分类、检测），模型较复杂、对量化敏感，或者极低位宽（如 INT4）时必须使用 QAT 以保持性能。

    核心不同：PTQ 是一次性校准，QAT 是模拟量化误差下的训练。PTQ 方便快捷，QAT 精度高但成本高。


    优势

    - 不需要重训练或梯度计算，仅需要一小批校准数据来确定缩放因子，速度快。

    - 与混合精度分解不同，AWQ 仍然保持所有计算在 INT8/INT4 整数域，不引入 FP16 计算单元，硬件效率极高。

    - 在多种 LLM 上取得了与 GPTQ 相当甚至更好的精度，同时实现更简单。


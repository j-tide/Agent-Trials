answer:
  mode: rubric
  reference_answer: |-
    AWQ (Activation-aware Weight Quantization) 观察到：虽然权重中只有少部分对应高激活值的通道对输出至关重要，但直接按权重显著性或激活值显著性进行保护会导致过拟合或开销大。AWQ 提出一种简单而有效的方法：根据激活值分布对重要权重通道进行缩放保护。


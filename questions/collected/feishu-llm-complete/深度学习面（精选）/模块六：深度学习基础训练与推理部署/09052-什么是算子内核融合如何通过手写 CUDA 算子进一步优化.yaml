content:
  prompt: 什么是算子内核融合？如何通过手写 CUDA 算子进一步优化？
answer:
  mode: rubric
  reference_answer: |-
    算子内核融合

    将多个连续的算子合并成一个 CUDA kernel，以减少全局内存访问和 kernel launch 开销。如 Conv+BN+ReLU 融合：每个线程块一次性完成卷积、BN 变换和 ReLU 激活，中间结果保留在寄存器或共享内存中，不写回全局显存。

    如何手写 CUDA 算子进行极致优化

    当 PyTorch 内置算子或编译器无法满足性能需求时，可通过自定义 CUDA kernel 深挖硬件潜力。

    - 编写 CUDA C++ 内核：在 .cu 文件中实现内核函数，使用 global 修饰，利用线程索引分割工作负载。

    - PyTorch 绑定：使用 pybind11 或 torch.utils.cpp_extension 的 load_inline 或 CUDAExtension 编译并加载为 Python 模块。

    - 融合与数据复用：将多个操作融合为一个 kernel，如 LayerNorm + Dropout + Add。利用共享内存缓存重复数据，降低带宽。

    - 使用 Tensor Core：在支持硬件上通过 mma.sync 或 WMMA API 手动调度 Tensor Core 进行高吞吐矩阵乘法。

    - 循环展开和向量化：提升指令级并行，减少控制流开销。

    - 多 Stream 并行：将不同计算流重叠执行。

    例子：手写一个 GELU 激活融合到矩阵乘法的 kernel，计算完矩阵乘后立刻对每个元素进行 GELU 运算，避免将中间矩阵写回显存。在推理服务中，这样可以显著减少延迟并降低功耗。

    PyTorch 提供了 torch.utils.cpp_extension.CUDAExtension 和 torch.utils.cpp_extension.load_inline 等接口，使得编译和加载自定义 CUDA kernel 相对便捷。


content:
  prompt: 模型并行是在什么情况下必须使用的？它与数据并行如何区分？
answer:
  mode: rubric
  reference_answer: |-
    模型并行（Model Parallelism） 是指将模型的参数和计算图切分到不同的设备上，当单个设备无法容纳整个模型时，必须使用模型并行。例如，训练巨大的 Transformer 模型（数百亿甚至万亿参数），单卡显存远不够存放模型权重和中间激活，此时必须将模型的不同部分放置在不同的 GPU 上。

    与数据并行的区分

    与数据并行的区分

    - 数据并行：每个设备拥有完整模型副本，数据切分到各设备独立计算，同步梯度。要求每个设备能装下完整模型。

    - 模型并行：模型被切分，每个设备只负责一部分参数和计算，设备间需要传递中间激活和梯度。不同设备合作完成一个 batch 的计算。数据可以是一个 batch 的不同 micro-batch，也可以是对同一数据的不同层。当单卡无法放下模型时，模型并行成为必需。

    进一步细分

    - 流水线并行（按层切分）

    - 张量并行（按层内矩阵乘法切分）

    - 序列并行（按序列长度切分）

    实践中常将数据并行与模型并行混合使用，例如 Megatron-LM 使用张量并行 + 流水线并行 + 数据并行的 3D 并行策略来训练超大规模模型。


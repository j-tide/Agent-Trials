content:
  prompt: 什么是模型剪枝、量化、蒸馏的组合使用？如何进行精度和速度的均衡？
answer:
  mode: rubric
  reference_answer: |-
    组合使用

    三种技术分别从不同维度压缩模型：

    - 蒸馏：大教师模型教导小模型，直接减少模型容量与计算量。

    - 剪枝：在蒸馏得到的学生模型上进一步结构化剪枝，去掉冗余通道/层。

    - 量化：将剪枝后模型的 FP32 参数转为 INT8/FP16，再次加速并减小体积。

    典型组合流程

    大模型 → 知识蒸馏获得紧凑学生 → 结构化剪枝进一步减少计算 → 微调恢复精度 → 训练后量化/量化感知训练 → 部署。

    精度与速度均衡

    - 蒸馏阶段确定基线模型大小与精度。

    - 剪枝阶段采用渐进式迭代剪枝，每次剪掉少量参数并微调，监控验证精度。若精度下降至阈值，停止剪枝或减小剪枝率。

    - 量化阶段选择量化精度（FP16/INT8/INT4）。对敏感层保留较高精度（混合精度量化）。若 PTQ 导致精度超损，可改用 QAT 恢复。

    - 可在整个流程中自动搜索：设定延迟/内存目标，利用超参数搜索或 NAS 技术寻找最优的组合配置。

    - 快速评估循环：每次压缩后评测，平衡延迟与精度，直至满足业务指标。

    最终在一个资源限制内得到最佳的精度-效率帕累托最优解。


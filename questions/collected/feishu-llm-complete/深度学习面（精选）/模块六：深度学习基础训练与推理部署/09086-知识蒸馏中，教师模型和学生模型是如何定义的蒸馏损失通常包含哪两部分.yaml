content:
  prompt: 知识蒸馏中，教师模型和学生模型是如何定义的？蒸馏损失通常包含哪两部分？
answer:
  mode: rubric
  reference_answer: |-
    定义

    - 教师模型：一个高性能、通常较大、已经训练好的模型，用于提供“知识”。

    - 学生模型：一个较小的、待训练的模型，通过学习教师的输出来获得接近教师的性能。

    蒸馏损失

    通常包含两部分损失，组合训练学生：

    - 硬标签损失（学生与真实标签的交叉熵）

    [图片内容未导入]

    - 软标签损失（学生与教师软输出的蒸馏损失）
    教师和学生都使用温度 T 的 softmax 产生软标签：

    [图片内容未导入]

    其中 α 为平衡权重，通常接近 1（更依赖教师）。

    这样，学生既直接学习正确答案，又模仿教师关于各类别相似性的暗知识。


content:
  prompt: 什么是序列并行（Sequence Parallelism）？它通常与哪种并行方式组合？
answer:
  mode: rubric
  reference_answer: |-
    序列并行 是将输入序列的长度维度切分到不同设备上，每个设备负责序列的一部分 token。这对于极长序列（如训练超长上下文模型）可以减少单个设备上的激活显存。通常与张量并行或流水线并行结合使用。

    典型组合：

    - 在 Megatron-LM 中，序列并行与张量并行结合：在张量并行中，LayerNorm 和 Dropout 等操作沿序列维度独立，为了减少冗余显存，将这些操作也进行序列切分。在 Transformer 层中，LayerNorm 和残差连接在序列维度上是并行的，可以将激活在序列维度拆分，然后仅在需要张量并行的矩阵乘法（如 attention 或 FFN）之前进行集合通信转换。

    - 具体实现：输入序列的 token 被划分到多个设备，每个设备上执行部分的 LayerNorm、Dropout，而在执行张量并行的矩阵乘法时，通过 all-gather 收集完整序列，或者保持拆分并使用 reduce-scatter 来更新。

    - 序列并行能够大幅度减少激活的内存占用（因为这些操作本身没有跨序列依赖），与张量并行结合能训练更长的序列。

    优势：扩展模型支持的序列长度，降低显存峰值。


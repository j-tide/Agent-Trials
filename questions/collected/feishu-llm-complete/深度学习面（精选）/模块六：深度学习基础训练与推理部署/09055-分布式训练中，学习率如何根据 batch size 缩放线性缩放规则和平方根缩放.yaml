content:
  prompt: 分布式训练中，学习率如何根据 batch size 缩放？线性缩放规则和平方根缩放。
answer:
  mode: rubric
  reference_answer: |-
    当 global batch size 增大时，需要相应调整学习率以保持训练稳定和收敛。

    - 线性缩放规则（Linear Scaling Rule）：当 batch size 增大 k 倍时，学习率也线性增大 k 倍。理论基础：在 SGD 中，每一步梯度是基于 k 倍多样本的均值，方差减小为 1/k，因此增大学习率 k 倍可以保持参数更新量的方差大致不变。经验上，对于大批量训练，线性缩放常配合 warmup 使用，在 batch size 不是极端大时效果良好。

    [图片内容未导入]

    当前最佳实践（如大批量训练 BERT, GPT 等）：使用线性缩放规则，但结合学习率 warmup（前几千步从零线性增加到目标学习率），然后再衰减。有时也会根据损失形状调整，或者使用 LARS 等自适应优化器以适应大 batch。最终缩放策略可以通过在小批量上调优后，在 scale 时调整得到。


content:
  prompt: 如何调试分布式训练中的死锁或挂起问题？
answer:
  mode: rubric
  reference_answer: |-
    分布式训练中的死锁通常是由于集合通信操作不匹配或某个进程因错误退出，导致其他进程一直等待。调试方法包括：

    - 使用 NCCL_DEBUG 环境变量：设置 NCCL_DEBUG=INFO 或 WARN，输出 NCCL 的详细日志，查看哪个 rank 通信卡住。

    - 检查进程存活：使用 torch.distributed.barrier() 前后添加日志，判断卡在哪个 barrier。也可以使用 gdb 附着到挂起的进程，查看调用栈。

    - 添加超时：在初始化进程组时设置 timeout 参数（如 init_process_group(backend='nccl', timeout=datetime.timedelta(minutes=10))），超时会抛出异常，避免无限挂起。

    - 确保所有 rank 执行相同的集合操作序列：死锁的常见原因是一个 rank 调用 all_reduce 而另一个没有，导致不匹配。检查条件分支，确保所有 rank 在相同位置调用相同的通信函数。

    - 数据加载器不一致：如果某些 rank 的数据加载器抛出异常并退出，而其他 rank 还在等待通信，会导致挂起。可以捕获异常并在所有 rank 上同步。

    - 使用 torch.distributed.monitored_barrier（PyTorch 1.10+）检测哪个 rank 未到达 barrier。

    - 日志记录：在每个关键步骤打印 rank 和时间戳，定位到哪一步停止。

    通过这些手段，一般可以定位到具体的死锁位置。


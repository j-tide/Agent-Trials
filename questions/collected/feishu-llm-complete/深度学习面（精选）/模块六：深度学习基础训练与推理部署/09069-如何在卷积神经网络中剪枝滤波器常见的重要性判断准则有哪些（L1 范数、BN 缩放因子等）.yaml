content:
  prompt: 如何在卷积神经网络中剪枝滤波器？常见的重要性判断准则有哪些（L1 范数、BN 缩放因子等）？
answer:
  mode: rubric
  reference_answer: |-
    剪枝滤波器的通用流程

    - 选择重要性准则，为每个滤波器（输出通道）评分。

    - 根据目标剪枝比例，移除评分最低的滤波器及其关联的下一层输入通道。

    - 移除后的模型权重被物理删除，得到更小的密集模型。

    - 通常需要微调（fine-tuning）以恢复精度。

    常见重要性准则

    - L1 范数：计算每个滤波器权重的 L1 范数（绝对值之和）。假设权值较小的滤波器对输出贡献小，可以安全移除。这是最经典的方法，简单有效。

    - L2 范数：滤波器权重平方和，类似但更强调较大的值。

    - BN 缩放因子 γ：在网络使用 BatchNorm 时，BN 中的缩放因子 γ 与对应通道的激活相关联。训练时在 γ 上施加 L1 正则化，使其稀疏，修剪那些 γ 接近零的通道。代表方法 Network Slimming。

    - 激活值均值/方差：利用校准数据计算每个滤波器输出的激活平均值，小激活的滤波器被认为不重要。

    - 梯度或泰勒展开：计算移除滤波器对损失函数的一阶或二阶泰勒近似，衡量其对最终损失的影响。计算代价较高但通常更准确。

    - APoZ (Average Percentage of Zeros)：对于 ReLU 激活，统计每个通道输出中零的比例，比例高则激活稀疏，滤波器可能不关键。

    应用示例：在 ResNet 上，使用 L1 范数对每一层滤波器排序，保留前 70% 的滤波器，然后微调 10 个 epoch，能在几乎不损失精度的情况下降低约 30% 的 FLOPs。


content:
  prompt: 混合精度训练在 PyTorch 中如何使用 torch.cuda.amp？
answer:
  mode: rubric
  reference_answer: |-
    混合精度训练自动结合 FP32 和 FP16，利用 torch.cuda.amp 模块实现，几乎无需修改训练逻辑。

    核心组件

    - autocast 上下文管理器：自动将适用的运算（如卷积、矩阵乘法）转换为 FP16 以加速，而将不稳定的操作（如 loss、softmax、normalization）保持在 FP32。

    - GradScaler：动态缩放损失，防止 FP16 梯度下溢。

    使用步骤

    - 实例化 GradScaler。

    - 在训练循环中，用 autocast 包裹前向传播和损失计算。

    - 调用 scaler.scale(loss).backward() 以进行缩放后的反向传播。

    - 使用 scaler.step(optimizer) 更新参数，它会自动进行梯度反缩放出并更新，必要时跳过溢出更新。

    - scaler.update() 调整缩放因子。

    示例代码

    from torch.cuda.amp import autocast, GradScaler

    model = Model().cuda()
    optimizer = torch.optim.Adam(model.parameters())
    scaler = GradScaler()

    for input, target in data_loader:
        optimizer.zero_grad()
        with autocast():
            output = model(input)
            loss = loss_fn(output, target)
        scaler.scale(loss).backward()
        scaler.step(optimizer)
        scaler.update()

    要点

    - 需在模型和输入均为 GPU Tensor 时使用；CPU 不支持 amp。

    - 可搭配 DataParallel 和 DistributedDataParallel。

    - GradScaler 会自动检测 inf/NaN 梯度并跳过该 step，同时减小缩放因子。

    - 通常能提高训练速度 1.5~3 倍，降低显存。


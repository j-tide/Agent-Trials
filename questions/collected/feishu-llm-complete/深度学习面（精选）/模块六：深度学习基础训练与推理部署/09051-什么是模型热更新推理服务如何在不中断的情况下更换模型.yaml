content:
  prompt: 什么是模型热更新？推理服务如何在不中断的情况下更换模型？
answer:
  mode: rubric
  reference_answer: |-
    模型热更新 指不停止服务、不丢失请求的情况下，用新版本模型替换旧模型。

    实现方案

    - 多模型副本切换（Blue/Green）
    同时加载新旧模型副本，初始流量指向旧模型；新模型就绪后通过配置切换流量到新模型。旧模型保留一段缓冲期以备回滚。

    - 推理服务器的版本管理（Triton, TorchServe）

    - 容器化滚动更新（Kubernetes）

    - 进程内热重载
    自定义服务监听信号，重新加载权重并重建计算图，原子替换旧模型指针，不重启进程。需精细管理内存，避免泄漏。

    核心：加载新模型与卸载旧模型的时机配合，配合流量切换，确保请求零丢失。


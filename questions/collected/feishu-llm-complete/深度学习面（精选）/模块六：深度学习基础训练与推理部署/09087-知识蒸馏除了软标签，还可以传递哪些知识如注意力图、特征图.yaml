content:
  prompt: 知识蒸馏除了软标签，还可以传递哪些知识？如注意力图、特征图。
answer:
  mode: rubric
  reference_answer: |-
    蒸馏可以发生在模型的多个表示层，不仅限于最终 logits。常见的传递形式：

    - 特征图蒸馏 (Feature Distillation)

    [图片内容未导入]

    - 注意力图蒸馏 (Attention Transfer)

    传递空间注意力图（例如，对特征图的通道进行合并得到的 2D 注意力掩码）。损失函数最小化学生和教师注意力图之间的差异，促进学生关注相似区域。

    - 关系蒸馏 (Relational Knowledge Distillation, RKD)

    传递样本间的关系或特征间的关系。比如，对于一批样本，让学生输出特征之间的距离矩阵（相似性结构）匹配教师的距离矩阵。保留的不是绝对值，而是相对结构。

    - 其他

    - 激活边界：传递每层激活值的统计信息。

    - 参数蒸馏：学生直接预测教师的权重？少见。

    - 生成式蒸馏：用教师模型生成大量数据或 soft pseudo-labels，扩展学生训练数据。

    这些方法通常可以结合软标签蒸馏，进一步提升学生性能。


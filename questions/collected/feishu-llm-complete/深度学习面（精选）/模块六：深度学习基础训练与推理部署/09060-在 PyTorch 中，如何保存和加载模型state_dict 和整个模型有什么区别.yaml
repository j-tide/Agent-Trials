content:
  prompt: 在 PyTorch 中，如何保存和加载模型？state_dict 和整个模型有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    保存模型

    - 保存 state_dict（推荐）：保存模型的参数字典。

    torch.save(model.state_dict(), 'model_weights.pth')

    加载时需先实例化相同结构的模型，然后加载 state_dict：

    model = MyModel()
    model.load_state_dict(torch.load('model_weights.pth'))
    model.eval()

    - 保存整个模型：保存模型对象本身（包括类定义和参数），使用 torch.save(model, 'model_full.pth')。加载时直接 model = torch.load('model_full.pth')。

    区别与选择

    [嵌入表格未展开]

    额外保存信息

    通常会同时保存优化器状态、epoch 信息等，以便恢复训练：

    checkpoint = {
        'epoch': epoch,
        'model_state_dict': model.state_dict(),
        'optimizer_state_dict': optimizer.state_dict(),
        'loss': loss,
    }
    torch.save(checkpoint, 'checkpoint.pth')

    model.eval() 的重要性：加载后如果要推理，务必设置 eval()，以固定 BN 和关闭 Dropout。


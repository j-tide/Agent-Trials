content:
  prompt: LLM.int8() 的混合精度量化分解是怎么做的？为何要对离群值进行特殊处理？
answer:
  mode: rubric
  reference_answer: |-
    LLM.int8() 是专门针对大语言模型（LLM）推理的量化方法，由 Dettmers 等提出。它观察到 Transformer 的激活值中存在离群值（outliers）：极少数特征维度（如 0.1%）的数值远大于其他维度，这些离群值对量化精度破坏极大。

    混合精度量化分解

    [图片内容未导入]

    由于 FP16 部分占比极小，额外开销很低，但完全避免了离群值造成的巨大量化误差，使 8 位量化在大模型上的准确率达到与 FP16 几乎一致的水平。

    为何离群值要特殊处理

    离群值的绝对值可能是其他值的 100 倍以上。如果用统一的尺度量化，离群值会撑大尺度，导致正常值在量化后严重失真（分辨率极低）；如果截断离群值，则会丢失关键信息，因为这些离群值往往对应于重要的 token 位置（如分隔符、标点）。因此，混合精度是解决这一矛盾的优雅方案。


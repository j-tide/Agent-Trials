content:
  prompt: 当集群中有节点故障时，如何实现容错训练和自动恢复？
answer:
  mode: rubric
  reference_answer: |-
    在大规模长时间训练中，节点故障不可避免。容错机制包括：

    检查点（Checkpointing）

    定期保存模型状态、优化器状态、随机数种子、学习率调度器状态等到持久存储（如共享文件系统或对象存储）。发生故障后，可以回滚到最近的检查点继续训练。这需要检查点保存和加载足够快速，且不会过度干扰训练吞吐。

    心跳检测与自动重启

    - 使用分布式训练框架（如 Kubernetes + PyTorch Operator, Ray Train, DeepSpeed）监控每个 worker 的健康状态（心跳）。

    - 当某个 worker 崩溃或无响应时，框架可以自动终止当前训练，并利用之前保存的检查点在新的健康节点集合上重新启动作业。

    - 需要作业管理层面支持动态资源分配和作业重新提交。

    弹性训练

    更高级的是弹性训练（见下问），允许在训练过程中动态增减 worker，当节点故障时，可以从剩余健康节点继续训练，无需完全停止重启。Horovod 的弹性训练功能、PyTorch Elastic 等提供了这种能力。

    TorchElastic
    PyTorch 提供了 torch.distributed.elastic 模块，可以监控 worker 状态，并在 worker 失败时重新初始化进程组，加载最近检查点继续训练。它能处理少数节点故障，保留大多数节点继续工作。

    总结：通常采用定期检查点 + 弹性/自动重启，实现分钟级的恢复。


content:
  prompt: 结构化稀疏是否可以用于 Transformer？如 2:4 稀疏模式，有什么硬件支持？
answer:
  mode: rubric
  reference_answer: |-
    可以，结构化稀疏非常适合 Transformer 的矩阵乘法层。

    2:4 稀疏模式

    - 在权重矩阵中，每 4 个连续元素为一组，每组至少 2 个为零，形成 50% 稀疏度。剩余 2 个非零值与索引被压缩存储。

    - Transformer 的 FFN、注意力 QKV 投影等均为全连接层，可应用 2:4 稀疏。训练或微调时对权重施加掩码，使模型适应这种稀疏结构。

    硬件支持

    - NVIDIA Ampere 架构（A100、RTX 30 系列）引入了稀疏张量核，能直接利用 2:4 结构化稀疏对矩阵乘法进行加速，实际吞吐提升约 1.5~2 倍。

    - 后续架构（Hopper、Ada Lovelace）继续支持。

    - PyTorch + torch.cuda.amp 结合 DeepSpeed 或 ASP 工具可训练 2:4 稀疏模型，TensorRT 也能部署并加速这类稀疏模型。

    2:4 稀疏是当前在 GPU 上实现 Transformer 加速的高效结构化稀疏方案。


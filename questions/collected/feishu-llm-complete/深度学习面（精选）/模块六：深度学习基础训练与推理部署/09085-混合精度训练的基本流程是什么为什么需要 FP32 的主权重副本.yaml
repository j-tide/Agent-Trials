content:
  prompt: 混合精度训练的基本流程是什么？为什么需要 FP32 的主权重副本？
answer:
  mode: rubric
  reference_answer: |-
    混合精度训练（Mixed Precision Training）同时使用 FP16（半精度浮点）和 FP32（单精度浮点）来加速训练并降低显存，同时保持模型精度。

    基本流程：

    - 维护一份 FP32 的主权重副本（master weights）。

    - 每次迭代，将 FP32 权重转换为 FP16，得到 FP16 模型副本。

    - 前向传播：使用 FP16 权重和 FP16 输入进行计算（矩阵乘法等利用 Tensor Core 加速）。

    - 计算损失：通常仍为 FP32，以便更精确。

    - 反向传播：在 FP16 下计算梯度（部分操作可转 FP32 提升稳定性）。

    - 梯度转为 FP32，并乘以损失缩放因子（见下一问）以恢复被压到零的梯度值。

    - 使用 FP32 梯度更新 FP32 主权重副本。

    - 重复。

    为什么需要 FP32 主权重：

    [图片内容未导入]

    - 在 FP32 中累积权重更新可以保持足够的精度，避免舍入误差累积。

    - 此外，某些操作（如 BN、Softmax、大规约）在 FP32 下更稳定，防止数值问题。

    因此，FP16 用于计算加速，FP32 用于准确存储和更新权重。


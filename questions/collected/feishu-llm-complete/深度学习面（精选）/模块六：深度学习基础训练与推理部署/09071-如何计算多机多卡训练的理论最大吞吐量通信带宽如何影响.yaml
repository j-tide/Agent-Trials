    通信带宽的影响

    通信带宽直接决定了梯度同步耗时。当模型梯度很大、GPU 数量多时，通信可能成为瓶颈。此时吞吐量受限于带宽，即使计算再快，也无法超越通信墙。为了提升吞吐，需要高带宽互联（如 NVLink、InfiniBand），并使用通信计算重叠、梯度压缩等技术。

    估算示例：若模型梯度总大小 10 GB，使用 100 Gbps 带宽（12.5 GB/s），则 AllReduce 每卡通信时间 ≈ 2*(10/12.5) ≈ 1.6 秒（粗略）。若计算时间 0.5 秒，则整体 iteration 受限于通信，吞吐量由带宽决定。


content:
  prompt: 在推理服务中，如何利用动态批处理（Dynamic Batching）提高 GPU 利用率？
answer:
  mode: rubric
  reference_answer: |-
    动态批处理将来自多个客户端的小请求组合成 batch 一起推理，以充分利用 GPU 并行算力。

    工作原理

    - 请求入队后不立即处理，而是等待一个短暂的时间窗口（如 1~5 ms）或直到积压请求数达到一定阈值。

    - 将窗口内收集的所有请求输入组合成一个 batch，进行单次前向计算。

    - 输出结果拆解后分别返回给对应客户端。

    提高 GPU 利用率的原因

    - 单个小请求无法填满 GPU 计算单元，kernel 启动和内存延迟占比高。合并为大批量张量运算能充分发挥 GPU 的高吞吐和带宽优势。

    - 大幅减少 kernel 启动次数。

    - 在未优化时 GPU 利用率可能仅 10%~30%，引入动态批处理后可达 80% 以上，吞吐量提升数倍，单位推理成本明显降低。

    实现注意事项

    - 延迟权衡：等待时间越长 batch 越大，吞吐越高，但单个请求延迟增加，需根据 SLA 设定最大等待时间。

    - 形状统一：不同请求输入尺寸各异，需填充或使用 bucket 分组（将相似长度请求组 batch）以减少无效计算。

    - 推理服务器（NVIDIA Triton、TorchServe）内置动态批处理器，可配置最大 batch size 和最大延迟。


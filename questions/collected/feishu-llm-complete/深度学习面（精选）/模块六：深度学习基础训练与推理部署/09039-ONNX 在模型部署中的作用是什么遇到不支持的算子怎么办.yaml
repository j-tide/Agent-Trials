content:
  prompt: ONNX 在模型部署中的作用是什么？遇到不支持的算子怎么办？
answer:
  mode: rubric
  reference_answer: |-
    ONNX 的作用

    ONNX (Open Neural Network Exchange) 是一种开放的模型表示格式，它提供：

    - 互操作性：可将 PyTorch、TensorFlow、Keras 等训练的模型导出为 ONNX，然后在多种推理引擎（ONNX Runtime、TensorRT、OpenVINO、CoreML、NCNN、MNN 等）中运行。

    - 图优化基础：许多编译器接受 ONNX 作为输入，进行高级优化并生成不同硬件的代码。

    - 硬件抽象：屏蔽训练框架差异，使模型轻松移植到不同平台（CPU、GPU、NPU、FPGA）。

    遇到不支持算子的解决办法

    - 用支持的等效算子替换：修改原始模型定义，将自定义或冷门算子用标准 ONNX 算子组合实现。

    - 自定义算子插件：ONNX 和多数运行时支持扩展自定义算子，可注册一个算子并提供目标平台上的实现（如 ONNX Runtime 的动态库）。

    - ONNX 函数：利用 ONNX 的函数机制将复杂算子的数学定义表示为基本算子的子图，无需编写 C++ 插件。

    - 使用较高 opset 版本：PyTorch torch.onnx.export 可指定 opset，高版本支持更多算子，尽量使用较新版本。

    - 框架专有转换路径：如仅部署于 NVIDIA，可直接用 Torch-TensorRT 绕过 ONNX，从而利用所有算子。

    - 回退到原生执行：部分平台允许在图中保留少量未转换的原生代码，但会失去可移植性。

    大多数常用模型（CNN、Transformer）的算子已广泛支持，遇少数不支持时优先考虑标准化替换。


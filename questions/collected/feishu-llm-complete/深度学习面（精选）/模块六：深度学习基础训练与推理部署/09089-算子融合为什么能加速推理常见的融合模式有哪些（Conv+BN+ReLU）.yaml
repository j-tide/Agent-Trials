content:
  prompt: 算子融合为什么能加速推理？常见的融合模式有哪些（Conv+BN+ReLU）？
answer:
  mode: rubric
  reference_answer: |-
    加速推理的原因

    - 减少内存访问：深度学习推理常受内存带宽限制。每个独立算子都需要从显存读取输入，写出中间结果。当多个算子融合成一个 kernel 后，中间数据得以在寄存器或共享内存中即时传递，避免了大量全局内存读写，显著降低访存开销。

    - 减少 kernel 启动开销：GPU 上每次启动一个 CUDA kernel 都有固定的调度延迟（数微秒）。许多小算子独立执行时，kernel launch 次数多，耗费大量时间。融合后在一个 kernel 内完成多个操作，启动次数急剧减少。

    - 提高计算密度：将访存密集型操作（如 ReLU）与计算密集型操作（如卷积）合并，可以将访存与计算更好地重叠，提升硬件利用率。

    - 便于编译器进一步优化：融合后的计算图更简洁，编译优化器（如 TVM、XLA）能进行更激进的循环级优化与向量化。

    常见融合模式

    [图片内容未导入]

    - 矩阵乘法 + 激活：如全连接层 + GeLU / ReLU。

    - 逐元素操作融合：多个连续的 element-wise 操作（add、mul、sigmoid 等）合并为一个 kernel，一次完成所有运算。

    - 注意力机制融合：Transformer 中 QKV 投影合并为大矩阵乘法；softmax 与 mask、dropout 融合。

    - 残差连接融合：将 Conv + BN + ReLU + Element-wise Add 一并融合。

    - LayerNorm + 后续线性层融合：将 LN 的仿射参数融入权重，或直接在同一个 kernel 内计算 LN 与矩阵乘。

    推理优化器（TensorRT、ONNX Runtime、TVM）会在编译阶段自动执行这些融合。


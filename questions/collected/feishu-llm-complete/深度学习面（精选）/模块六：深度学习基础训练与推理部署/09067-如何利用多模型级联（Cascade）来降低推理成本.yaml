content:
  prompt: 如何利用多模型级联（Cascade）来降低推理成本？
answer:
  mode: rubric
  reference_answer: |-
    多模型级联指根据样本难易程度，先用轻量模型处理，只在必要时才调用重模型，从而节省计算资源。

    级联策略

    - 置信度阈值：小模型推理并输出置信度，高于阈值则直接采纳；否则送大模型。常用于图像分类、文本分类。

    - 多阶段检测：快速粗检测 + 精细验证（人脸、目标检测）。

    - 早退机制：同一模型不同深度设多个出口，浅层若置信度够高则提前终止推理。

    - 多分辨率级联：先在小图上用轻量网络，不确定时再用原图大网络。

    降低成本的表现

    - 假设 80% 简单请求被轻模型处理，只有 20% 调用重模型，平均算力消耗降至约 0.2×重模型 + 轻模型，总吞吐大幅提升，所需 GPU 数量减少。

    - 边缘设备可将小模型本地处理，难例上传云端，节省带宽和云端成本。

    需权衡置信度阈值：过高则重模型调用比例上升，过低则错误率上升。


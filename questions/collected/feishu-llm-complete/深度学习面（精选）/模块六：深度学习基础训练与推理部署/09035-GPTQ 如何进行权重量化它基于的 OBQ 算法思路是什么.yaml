content:
  prompt: GPTQ 如何进行权重量化？它基于的 OBQ 算法思路是什么？
answer:
  mode: rubric
  reference_answer: |-
    GPTQ (Frantar et al., 2022) 是一种用于大规模生成预训练 Transformer (GPT) 的权重量化方法，可以在数小时内完成 175B 模型的 3/4 位量化，精度损失很小。

    OBQ 算法基础

    GPTQ 基于最优脑量化（Optimal Brain Quantizer, OBQ）的思想。OBQ 将权重量化看作逐权重的剪枝问题：每次量化一个权重，并更新剩余未量化的权重来补偿该权重量化造成的输出误差。

    [图片内容未导入]

    GPTQ 的改进

    - 针对 Transformer 的超大层，GPTQ 不做逐元素贪心，而是采用逐块量化：将权重矩阵划分为若干块，逐块处理。块内所有权重同时量化，然后基于 Hessian 对块外未量化的权重进行补偿更新。

    - 利用 Hessian 的结构性，通过 Cholesky 分解高效计算补偿。

    - 重新排序（reorder）技巧：在量化前根据 Hessian 信息对权重列重排，使同一块内的权重有相似的量化难度，提升性能。

    - 支持极低位宽（4bit、3bit）并配合分组量化（group-wise quantization）以降低误差。

    最终，GPTQ 能够快速量化超大规模语言模型，且只需使用少量校准数据。


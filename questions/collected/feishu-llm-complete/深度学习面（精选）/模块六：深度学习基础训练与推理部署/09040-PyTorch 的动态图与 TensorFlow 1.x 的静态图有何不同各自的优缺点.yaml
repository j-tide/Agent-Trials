  reference_answer: |-
    [图片内容未导入]

    动态图（Define-by-Run）与静态图（Define-and-Run）

    - PyTorch 采用动态计算图，即图是在每次前向传播时即时构建的。代码执行到哪，计算图就构建到哪。这意味着图的结构可以随输入数据不同而改变（如处理变长序列、if-else 分支），编写代码与调试都非常直观，与 Python 原生控制流无缝融合。

    - TensorFlow 1.x 采用静态计算图，用户需先用 API 定义一个完整的计算图（占位符、变量、操作），然后在会话（Session）中运行。图一旦定义便固定，不能轻易改变。这要求在编码时对图结构有完整规划，调试困难（需 tf.Session.run() 才能看到中间值），且需要适应 TensorFlow 特有的编程思维。

    优缺点对比

    [嵌入表格未展开]

    如今的演变
    TensorFlow 2.x 已默认开启 Eager Execution（动态图），与 PyTorch 趋同；同时保留 tf.function 的静态图优化能力。PyTorch 也通过 torch.compile 和 TorchInductor 引入了图编译优化，两者在动态开发和静态部署之间的差距逐渐缩小。


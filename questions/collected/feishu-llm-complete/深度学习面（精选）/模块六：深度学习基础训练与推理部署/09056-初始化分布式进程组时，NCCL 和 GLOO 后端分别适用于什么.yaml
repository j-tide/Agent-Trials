content:
  prompt: 初始化分布式进程组时，NCCL 和 GLOO 后端分别适用于什么？
answer:
  mode: rubric
  reference_answer: |-
    - NCCL (NVIDIA Collective Communications Library)：专为 NVIDIA GPU 设计，支持极高性能的集合通信（AllReduce, AllGather, Broadcast 等）。适用于GPU 间通信，包括单机多卡和多机多卡。强烈推荐用于 GPU 训练，因为它优化了 GPU 拓扑和 NVLink/IB 网络。

    - GLOO：一个通用的集合通信库，支持 CPU 和 GPU。相对于 NCCL，GPU 上的性能较低，但可用于 CPU 分布式训练，或在不支持 NCCL 的环境中（如非 NVIDIA GPU 或某些特定网络）使用。也可以作为 GPU 训练的回退选择。

    选择原则：

    - GPU 训练：优先 NCCL。

    - CPU 训练或异构环境：使用 GLOO。

    - 有时某些操作（如 send/recv、barrier）在 NCCL 上可能受限，GLOO 作为补充。


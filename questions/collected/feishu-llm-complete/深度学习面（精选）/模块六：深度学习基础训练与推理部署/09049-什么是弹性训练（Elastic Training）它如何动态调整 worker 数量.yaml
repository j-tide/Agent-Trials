content:
  prompt: 什么是弹性训练（Elastic Training）？它如何动态调整 worker 数量？
answer:
  mode: rubric
  reference_answer: |-
    弹性训练允许分布式训练作业在运行时动态地增减计算资源（worker 数量），而无需从零重新启动训练。当新增节点时，能充分利用新增算力；当节点失效或需要释放资源时，可以在剩余节点上继续训练。

    动态调整机制

    - 资源管理：通常基于 Kubernetes 或 YARN，作业可以使用弹性调度器，根据可用资源自动调整 worker 数量。

    - 重新初始化分布式进程组：当 worker 数量变化时，需要重新建立通信组。PyTorch Elastic 通过 rendezvous 机制，worker 们通过 etcd 或文件系统同步，等待所有参与节点都达到同一个状态，然后重新初始化 ProcessGroup。

    - 数据划分调整：数据加载器需要根据新的 worker 数量重新划分数据分片，以避免数据重复或遗漏。通常每个 worker 基于自己新的 rank 和 world size 重新计算分片。

    - 模型与优化器状态：所有 worker 需要从最近的检查点恢复模型和优化器状态。因为检查点包含 world size 信息，弹性训练需要能够将检查点中的状态适配到新的 worker 数量（例如，调整批次归一化统计、数据加载器的 epoch 等）。

    - 学习率与 batch size 调整：worker 数量变化会影响有效 global batch size，因此学习率也需要相应调整（如线性缩放）以保持训练动态。

    弹性训练使得大规模训练能容忍机器池的波动，极大提升资源利用率和稳定性。


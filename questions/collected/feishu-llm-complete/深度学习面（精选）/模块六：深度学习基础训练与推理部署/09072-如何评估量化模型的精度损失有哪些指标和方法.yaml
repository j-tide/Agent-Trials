  reference_answer: |-
    评估量化模型精度损失，主要在原任务指标上对比量化前后性能，同时兼顾速度和效率。

    主要指标

    [图片内容未导入]

    评估方法

    - 数据集测试：在完整的验证/测试集上运行量化模型，计算任务指标。这是最终评估标准。

    - 层级别分析：将 FP32 模型每一层的输出作为参考，对比量化后的输出，找出误差最大的层进行针对性优化。

    - 退化诊断：如果精度损失大，检查权重和激活的直方图，确认是否存在大量值被裁剪或被量化为零。

    - 混合精度量化：允许部分敏感层保留 FP16，使用自动或手动搜索确定敏感层。

    - A/B 测试：在真实业务环境中对比延迟与质量。

    实际中，综合使用任务指标和层分析可以高效调优量化参数，达到精度与速度的最佳平衡。


    区别

    - 对称量化计算更简单，因为零点为 0，在矩阵乘法中可消去零点的项，硬件实现更高效。但要求数据分布大致对称，否则会浪费量化范围。

    - 非对称量化可以精确表示偏移分布（例如激活值经过 ReLU 后均为非负），充分利用量化区间，通常精度更高，但零点引入额外计算开销（如卷积中需要考虑零点补偿）。

    - 实际中，权重通常是对称分布的，适合对称量化；激活值常常是非负的，倾向于非对称量化。


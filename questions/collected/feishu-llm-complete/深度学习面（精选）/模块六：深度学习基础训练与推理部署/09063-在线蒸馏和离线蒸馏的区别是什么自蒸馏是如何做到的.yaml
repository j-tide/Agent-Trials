content:
  prompt: 在线蒸馏和离线蒸馏的区别是什么？自蒸馏是如何做到的？
answer:
  mode: rubric
  reference_answer: |-
    离线蒸馏 (Offline Distillation)

    - 先独立训练一个强大的教师模型（大模型），然后固定其权重，只作为知识源。

    - 再训练学生模型，损失由教师提供的软标签和真实标签组成。

    - 是经典的蒸馏流程，教师和学生训练解耦，可以一对多，也可多次使用。

    在线蒸馏 (Online Distillation)

    - 教师和学生同时训练，互相学习，或者若干模型合作学习。

    - 典型如深度相互学习（Deep Mutual Learning）：一群小模型一起训练，每个模型不仅最小化与真实标签的损失，还最小化与其他模型输出的 KL 散度。它们互为师生。

    - 不需要预先训练好大模型，所有模型一起成长，最终选择一个作为部署模型。

    自蒸馏 (Self-Distillation)

    - 学生模型的结构与教师相同，或教师就是学生自己（更深层的部分）。

    - 常见做法：在同一模型中，将深层（更高层的 logits）作为浅层的教师，或者用聚合预测（如模型集成）教导单个模型。

    - 例如，训练一个网络，同时使用其最终的分类层和较早的分类头；深层输出作为教师，浅层输出作为学生。或者训练一个网络的 EMA（指数移动平均）版本作为教师教导原网络。

    - 本质上是利用模型自身的知识进行正则化，提升泛化。


content:
  prompt: 张量并行（Tensor Parallelism）是如何拆分 Transformer 层的矩阵乘法的？
answer:
  mode: rubric
  reference_answer: |-
    张量并行将单个层内的矩阵乘法（如全连接层、多头注意力中的投影）沿着参数维度切分到多个 GPU，实现单层内的并行。以 Transformer 的 FFN 和 Attention 为例，Megatron-LM 提出的方案：

    MLP 的拆分

    [图片内容未导入]

    自注意力的拆分

    注意力头的数量天然适合并行：每个 GPU 负责一部分头（head）的 Q、K、V 投影和注意力计算，然后各自计算得到部分输出，再通过 AllReduce 汇总。对于 Q、K、V 的权重矩阵，可以按列切分，每个 GPU 计算自己的头。

    通信：在 MLP 的切分中，前向传播中间需要一次 AllReduce 求和（或后向时相应通信）。这种张量并行在单机多卡内通信开销小（NVLink 高速互联），常与流水线并行结合使用。


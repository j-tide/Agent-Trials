content:
  prompt: 什么是逐张量量化和逐通道量化？为什么逐通道量化精度更高？
answer:
  mode: rubric
  reference_answer: |-
    量化可以以不同的粒度进行，主要体现在尺度因子 ss 的计算范围。

    - 逐张量量化 (Per-tensor quantization)：对整个权重张量或激活张量，使用同一个尺度和零点。例如，一个卷积层所有输出通道共享一个 s。实现简单，对应硬件友好，但忽略了不同通道的数值分布差异。

    [图片内容未导入]

    逐通道精度更高的原因

    不同输出通道的权重分布可能差异显著：某些通道的权值幅度大，某些较小。使用同一尺度时，幅度大的通道会被正确表示，但幅度小的通道的很多值会被量化为 0 或损失精度（因为量化步长相对于其幅度太大）。逐通道量化允许每个通道用自己的尺度，精细地匹配其范围，保留了更多小权重通道的信息。这在深度可分离卷积、Transformer 等结构中尤为重要，因为这些网络不同通道间的尺度差异巨大。实验表明，逐通道量化可将精度损失从数个百分点降低到几乎无损。

    代价是计算复杂度略增：硬件需要支持每个输出通道不同的尺度，在进行卷积时需按通道分别应用尺度，现在多数推理引擎（如 TensorRT）已支持。


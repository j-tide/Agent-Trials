content:
  prompt: 什么是 PyTorch Lightning？它如何简化训练代码？
answer:
  mode: rubric
  reference_answer: |-
    PyTorch Lightning 是一个高级封装库，旨在将 PyTorch 代码中的工程代码与科研代码分离，使训练循环、多 GPU 支持、日志记录等通用逻辑自动化，开发者只需关注模型和数据。

    核心组件

    - LightningModule：继承自 nn.Module，定义了：

    - Trainer：提供一个完整的训练引擎，自动处理训练循环、梯度清零、反向传播、设备转移、16 位精度、分布式训练（DDP、DP）、日志记录、检查点保存和恢复等。只需传递模型和数据加载器，调用 trainer.fit(model, train_loader, val_loader) 即可。

    简化方式

    - 无需手写 epoch/iteration 循环，框架自动迭代。

    - 自动设备管理：.to(device) 无需手动写，Lightning 自动处理。

    - 分布式训练：只需设置 Trainer 的参数（accelerator="gpu", devices=4, strategy="ddp"），无需修改训练代码或处理 DistributedSampler。

    - 日志与可视化：一行 self.log("loss", loss) 即可收集指标，TensorBoard/Wandb 自动集成。

    - 回调系统：内置早停、模型检查点、学习率监控等。

    Lightning 让代码更整洁、可复现且易于扩展，特别适合研究原型和快速实验，同时保留了完整 PyTorch 灵活性。


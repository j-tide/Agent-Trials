content:
  prompt: FP16 训练中，损失缩放（Loss Scaling）的原理是什么？动态缩放如何工作？
answer:
  mode: rubric
  reference_answer: |-
    原理

    [图片内容未导入]

    静态缩放：选择一个固定的缩放因子，通常根据经验或尝试，但可能不适配所有训练阶段。

    动态缩放

    在训练过程中自动调整缩放因子。基本算法：

    [图片内容未导入]

    - 每个训练迭代，进行混合精度的前向与反向，梯度放大后更新。

    - 检查梯度是否出现溢出（inf 或 NaN）。如果没有溢出，则可能逐渐增大缩放因子（如乘以 1.05），以提高对微小梯度的捕获。

    - 如果检测到溢出，则该次更新跳过，缩放因子减小（如除以 2），避免后续梯度继续溢出。

    - 通过这种自动调整，在训练大部分时间保持较大缩放因子，同时防止崩溃。

    PyTorch 中 torch.cuda.amp.GradScaler 实现了动态缩放，广泛使用。


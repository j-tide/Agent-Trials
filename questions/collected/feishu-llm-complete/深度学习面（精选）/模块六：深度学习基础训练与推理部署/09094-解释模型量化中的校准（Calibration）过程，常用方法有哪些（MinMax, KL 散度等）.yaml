content:
  prompt: 解释模型量化中的“校准”（Calibration）过程，常用方法有哪些（MinMax, KL 散度等）？
answer:
  mode: rubric
  reference_answer: |-
    校准是训练后量化（PTQ）的关键步骤，通过少量无标签数据统计激活值的动态范围，以确定各层的量化尺度与零点，使低精度运算保留尽可能多的信息。

    校准过程

    - 准备数百至数千张有代表性的校准样本。

    - 在待量化的 FP32 模型中插入观察器（Observer）来收集各层激活的分布。

    - 运行若干批校准数据，观察器记录张量值的 min/max 或直方图。

    - 根据选定的校准算法计算每层的量化参数（scale, zero point）。

    - 利用这些参数导出低精度模型。

    常用校准方法

    - MinMax：直接使用最大值和最小值（或绝对值最大值）定义量化范围。简单，但易受离群值影响，导致有效分辨率降低。

    - 移动平均 MinMax：多个 batch 间指数平滑 min/max，稍微提高鲁棒性。

    - 百分位数（Percentile）：取历史值分布的 99.99% 或其他百分位为截断点，丢弃极端离群值。

    - KL 散度校准（NVIDIA 推荐）：将 FP32 激活的直方图作为参考分布 P，尝试不同截断阈值，比较 INT8 量化后分布 Q 与 P 的 KL 散度，选择使 KL 散度最小的截断阈值。能在抑制离群值的同时最大限度地保留分布信息。

    - MSE 校准：直接最小化量化前后张量的均方误差，搜索最佳截断阈值。

    KL 散度校准是目前主流且效果较好的方法，TensorRT 等工具默认采用。

    - 无用层消除：移除仅用于训练的输出节点（如 loss）。

    - 常量折叠：预计算静态子图（如固定 reshape、常量加减）的结果，减少运行时计算。

    - 垂直融合：顺序执行的层合并，如 Conv → BN → ReLU 融合为 CBR。

    - 水平融合：结构相同、输入相同的并行层合并。例如将多个并行的 1×1 卷积合并为一个更大的卷积，然后通过 slice 拆分输出，减少 kernel 启动。

    - 算子融合：

    - 消除串联操作：将 slice / concat 等不改变数据的操作融入前后层。

    - TorchScript：通过 torch.jit.trace 或 torch.jit.script 导出为 model.pt，可直接用于 PyTorch Mobile 或作为进一步转换的输入。

    - ONNX：使用 torch.onnx.export 导出为 .onnx，它是多数移动框架通用的导入格式。

    - NCNN：onnx2ncnn 工具 → .param 与 .bin

    - MNN：MNNConvert → .mnn

    - TNN：相应转换器

    - TensorFlow Lite：通过 ONNX→TF 或直接转换

    - Core ML：coremltools 转换

    - PyTorch Mobile：直接使用 .pt

    - 上传新版本模型文件，服务器后台异步加载。

    - 加载完成后可配置为“立即切换”或“等待旧请求完成再切换”。新请求使用新模型，进行中的老请求继续服务。

    - 旧模型随后卸载。

    - 更新模型镜像或挂载的新权重，执行 Rolling Update。

    - 新 Pod 启动就绪，旧 Pod 逐步终止，负载均衡器将流量平滑迁移，实现无中断。

    - SIMD 指令集：AVX-512、ARM NEON 向量化。

    - 低精度量化：INT8 权重和激活，降低带宽压力并利用 VNNI 等指令加速整数计算。

    - 算子融合：减少中间数据读写和开销。

    - 多线程并行：OpenMP 或线程池并行化 batch 维度或层内计算。

    - 内存布局转换：调整为 cache-friendly 的格式，提高缓存命中。

    - 高效 BLAS 库：Intel MKL、OpenBLAS。

    - 移动端使用 NCNN/MNN 等框架。

    - 动态批处理 提高算力利用率。

    - FP16/INT8 推理 + Tensor Core 加速。

    - 算子融合 和 CUDA Graph 降低 launch 开销。

    - 高效显存管理：预分配、内存池、KV 缓存、激活重计算等。

    - 多流并行 处理不同请求或重叠计算与数据传输。

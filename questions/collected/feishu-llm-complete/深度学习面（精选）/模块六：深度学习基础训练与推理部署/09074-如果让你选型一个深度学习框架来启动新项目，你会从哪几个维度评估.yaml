content:
  prompt: 如果让你选型一个深度学习框架来启动新项目，你会从哪几个维度评估？
answer:
  mode: rubric
  reference_answer: |-
    选择深度学习框架需综合考虑多方面因素：

    - 易用性与开发效率

    - 生态与模型库

    - 性能

    - 可扩展性与生产部署

    - 研究前沿的跟进

    - 团队技能与历史代码

    - 长期维护与稳定性

    综合评估：目前 PyTorch 因其动态图友好、研究社区活跃、生态完善，在大多数新项目中成为默认选择。对于需要极致移动端部署、或公司已有完整 TF 流水线的场景，TensorFlow 仍有优势。JAX 在需要函数式编程和高性能计算的研究团队中逐渐兴起。决策时权衡这些维度，找到最适合项目需求的平衡点。

    - batch_size：批次大小。

    - shuffle：是否打乱。

    - num_workers：数据加载子进程数量。

    - pin_memory：是否将数据锁页到 CPU 内存。

    - drop_last：丢弃不完整最后批次。

    - collate_fn：自定义拼接样本。

    - __init__：模型组件。

    - forward：推理。

    - training_step：计算训练损失，返回 loss。

    - validation_step：计算验证指标。

    - configure_optimizers：定义优化器和调度器。

    - 常量折叠、冗余节点消除、形状推断。

    - 将 Attention 计算融合为一个自定义的 Attention 算子，内部将 QKV 矩阵乘法、softmax、dropout、残差连接等整合，减少内存 I/O。

    - Layer Normalization 融合：将 LN 与后续的线性层或残差相加融合。

    - GELU / FastGELU 激活融入前一层。

    - Skip Layer Normalization 的专门融合。

    - 算子融合：将多个算子合并为一个更高效的版本，如：

    - 多头注意力合并：打包所有头计算为批量操作。

    - 编程模型（动态图 vs 静态图），调试便捷性。

    - API 设计的直观性和学习曲线。

    - 文档质量和社区活跃度，遇到问题是否容易找到解决方案。

    - 预训练模型库（Hugging Face Transformers、TIMM 等）的支持程度。

    - 配套工具链（数据处理、可视化、超参数调优、模型注册）。

    - 与主流云平台、硬件（GPU, TPU, NPU）的集成情况。

    - 训练速度（分布式训练支持、混合精度、编译优化）。

    - 推理速度（部署框架如 TensorRT, OpenVINO, ONNX Runtime 的支持程度）。

    - 移动端/边缘部署能力（量化、精简引擎如 NCNN/MNN）。

    - 原生分布式训练支持（DDP, Horovod, DeepSpeed 集成）。

    - 模型序列化与跨平台支持（TorchScript, ONNX 导出）。

    - 生产级服务框架（TorchServe, TF Serving, Triton）兼容性。

    - 新模型/新技术是否在该框架优先实现（如 PyTorch 在学术界的广泛使用）。

    - 对自定义算子、新架构的支持灵活性。

    - 团队现有的技术栈和项目积累。

    - 招聘难度（市场上 PyTorch 开发者相对更多）。

    - 框架的更新频率、向后兼容性策略。

    - 是否由大公司/社区持续维护。

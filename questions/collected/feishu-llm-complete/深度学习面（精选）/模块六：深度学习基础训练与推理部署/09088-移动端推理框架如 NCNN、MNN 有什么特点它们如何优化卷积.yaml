content:
  prompt: 移动端推理框架如 NCNN、MNN 有什么特点？它们如何优化卷积？
answer:
  mode: rubric
  reference_answer: |-
    特点

    - 无外部依赖、体积极小：纯 C++ 实现，不依赖 BLAS，包体积仅数百 KB，极易跨平台编译。

    - ARM CPU 深度优化：大量使用 NEON 汇编指令向量化，并针对不同 Cortex-A 核心调优。

    - 高效内存管理：内存池技术，减少分配/释放开销，降低峰值内存。

    - 异构计算支持：提供 OpenCL/Vulkan GPU 加速，MNN 还支持部分 NPU 后端。

    - 兼容主流模型结构：覆盖 CNN、RNN、Transformer 等，视觉模型优化尤其成熟。

    卷积优化手段

    - Im2Col + GEMM：将卷积转为矩阵乘法，调用手写 NEON 汇编 GEMM，移动端最主流方法。

    - Winograd 卷积：针对 3×3 stride 1 卷积，乘法次数减少约 2.25 倍，配合 NEON 实现。

    - 直接卷积：对小核小 batch 场景，直接在循环中展开并用 NEON 向量化，避免 im2col 额外内存开销。

    - 深度可分离卷积专项优化：对 Depthwise 卷积单独做内存融合与 NEON 加速，因其访存密集。

    - 权重重排与内存对齐：将权重预变换为推理友好布局，并 128-bit 对齐，提升缓存与 SIMD 效率。

    - 算子融合：Conv+BN+ReLU 直接合并为一个 kernel。

    这些优化使复杂模型也能在移动 CPU 上达到实时推理。


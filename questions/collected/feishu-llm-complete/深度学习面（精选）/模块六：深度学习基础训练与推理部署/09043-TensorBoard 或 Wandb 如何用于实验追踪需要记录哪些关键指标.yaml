content:
  prompt: TensorBoard 或 Wandb 如何用于实验追踪？需要记录哪些关键指标？
answer:
  mode: rubric
  reference_answer: |-
    使用方式

    - TensorBoard：from torch.utils.tensorboard import SummaryWriter，实例化 writer，通过 add_scalar、add_image、add_histogram、add_graph 等记录标量、图像、直方图和模型图。然后在命令行运行 tensorboard --logdir=logs 查看。

    - Weights & Biases (Wandb)：import wandb，wandb.init(project="my-project")。使用 wandb.log({"loss": loss, "acc": acc}) 记录指标，自动上传到云端，可通过网页实时查看，还支持超参数配置、系统监控、模型版本管理等。

    需要记录的关键指标

    - 训练/验证损失：每个 step 或 epoch 记录，直观反映收敛情况。

    - 准确率、精确率、召回率等任务指标：分类 top-1/top-5，mAP，PPL，BLEU 等。

    - 学习率：通常会随调度变化，应记录以调试。

    - 梯度范数：帮助诊断梯度爆炸/消失。

    - 权重和激活的直方图：了解分布变化，辅助量化、剪枝分析。

    - GPU 利用率、显存占用、CPU 使用率：评估资源效率和瓶颈。

    - 模型参数/FLOPs：作为复杂度基线。

    - 生成样本：对于生成模型，记录图像/音频/文本样本，定性评估效果。

    - 验证集最佳性能：保存最佳模型检查点并记录对应指标。

    - 系统指标：数据加载时间、迭代时间。

    Wandb 自动记录系统指标（GPU/CPU/内存），并提供超参数对比、团队协作功能，非常适合实验管理。


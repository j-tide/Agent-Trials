content:
  prompt: TensorRT 是如何进行图优化和算子融合的？相比于框架推理，通常能提升多少？
answer:
  mode: rubric
  reference_answer: |-
    图优化和算子融合步骤

    - 导入与解析：从训练框架（ONNX、TensorFlow、PyTorch 等）读取模型图。

    - 图结构优化：

    - 精度校准（INT8 量化）：通过校准数据集动态确定各层的量化尺度。

    - 硬件级自动调优：针对目标 GPU 架构（SM 数量、显存带宽、Tensor Core 支持等），为每个融合后的层选择或生成最优 kernel 实现。尝试不同的矩阵乘法算法、tile 大小、WMMA 指令，选择执行时间最短的配置。

    - 内存优化：执行张量生命周期分析，实现显存重用，最小化显存占用。

    - 生成序列化引擎：输出优化的 .engine 文件，包含最终网络权重和 kernel 代码。

    提升幅度

    相较于 PyTorch/TensorFlow 等框架的直接推理，TensorRT 的吞吐量通常能提升 2~5 倍（FP16/INT8 甚至 10 倍以上）。具体增益取决于模型架构、batch size 和目标 GPU。小 batch size 下内存延迟优化效果显著；大 batch size 下计算优化与 Tensor Core 利用率更重要。同时显存占用也会大幅降低。


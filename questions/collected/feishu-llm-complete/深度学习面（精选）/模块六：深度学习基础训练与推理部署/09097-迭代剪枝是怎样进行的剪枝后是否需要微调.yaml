content:
  prompt: 迭代剪枝是怎样进行的？剪枝后是否需要微调？
answer:
  mode: rubric
  reference_answer: |-
    迭代剪枝是指分多次逐步剪枝，而不是一次性剪掉大量权重。每次剪枝后都对模型进行微调，使其从损伤中恢复，然后再进行下一轮剪枝。

    步骤

    - 训练一个基准模型（或使用预训练模型）。

    - 设定单次剪枝比例（如 10%），根据重要性准则去掉最不重要的权重或滤波器。

    - 对剪枝后的模型进行微调（fine-tuning），使用原始训练数据，训练若干个 epoch，使剩余权重适应新结构。

    - 重复步骤 2-3，直到达到目标总剪枝率或精度下降到阈值以下。

    - 最终可在保持较高精度的前提下，获得高度稀疏或紧凑的模型。

    是否需要微调

    是，微调至关重要。剪枝通常会立即造成精度下降，通过微调可以恢复大部分甚至全部性能。如果不微调，直接剪枝可能导致精度崩溃。微调使剩余参数重新学习被剪去参数的功能。在某些简单任务或极低剪枝率下，不微调也可接受，但普遍强烈推荐微调。微调可长可短，常用原训练学习率的 1/10 进行少量 epoch。


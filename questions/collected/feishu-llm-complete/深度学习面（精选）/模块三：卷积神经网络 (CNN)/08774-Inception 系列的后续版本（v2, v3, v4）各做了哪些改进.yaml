content:
  prompt: Inception 系列的后续版本（v2, v3, v4）各做了哪些改进？
answer:
  mode: rubric
  reference_answer: |-
    Inception v2 / v3（同一篇论文，v3 是进一步优化）：

    - Batch Normalization（v2）：在卷积后激活前加入 BN，加速训练，允许更大学习率。

    - 非对称卷积：将较大的卷积核（如 5×5）分解为两个连续的 3×3 卷积；再将 n×n 卷积分解为 1×n 和 n×1（例如 3×3 变为 1×3 和 3×1），进一步减少参数，同时增加网络深度。

    - 避免表示瓶颈：保持特征图尺寸逐渐减小，通道逐渐增加。

    - 辅助分类器使用了 BN 和 Dropout。

    - 优化了 Inception 模块的结构（分为 A、B、C 三种模块），结合了不同的分解策略。

    Inception v4：

    - 引入残差连接（Inception-ResNet），将 Inception 结构与 ResNet 的恒等映射结合，加速训练并提升性能。

    - 简化了 Inception 块的统一性，减少超参数。

    - 即使不使用残差连接，Inception v4 也有更高效的设计。

    总之，v2 引入 BN，v3 使用非对称分解，v4 融合残差思想，逐步提升准确率和效率。


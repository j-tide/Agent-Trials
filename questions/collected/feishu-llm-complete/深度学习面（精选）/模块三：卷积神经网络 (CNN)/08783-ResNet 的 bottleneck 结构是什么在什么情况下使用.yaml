content:
  prompt: ResNet 的 bottleneck 结构是什么？在什么情况下使用？
answer:
  mode: rubric
  reference_answer: |-
    Bottleneck 结构：

    - 用于构建更深的 ResNet（50 层以上），以减少计算量。

    - 由三层卷积组成：1×1 卷积（降维）→ 3×3 卷积（空间特征）→ 1×1 卷积（升维）。

    - 例如输入 256 通道，1×1 降为 64 通道，3×3 卷积工作在 64 通道上，然后 1×1 再恢复到 256 通道。这样与两个 3×3 卷积（256 通道）相比，参数量极大减少。

    使用场景：ResNet-50、ResNet-101、ResNet-152 等较深网络中使用 bottleneck block。对于浅层网络（ResNet-18/34），使用基本的两个 3×3 残差块。


content:
  prompt: 全连接层和 1×1 卷积层的关系，能否相互转化？
answer:
  mode: rubric
  reference_answer: |-
    关系

    - 数学上，全连接层等价于对空间维度进行“全局”的卷积：如果输入特征图的尺寸恰好等于卷积核的尺寸，那么 1×1 卷积与全连接等价。更一般地，当卷积核的空间大小与输入的空间大小相同（即全局卷积）时，1×1 卷积实际上是对每个位置的全连接，但权重共享且缺乏空间交互。

    [图片内容未导入]

    实际转化

    在 FCN 中，可以将训练好的分类网络的全连接层替换为等效卷积层，使网络能够接受任意尺寸输入并输出热图。例如，VGG 的 fc6 权重（4096×7×7×512）可重塑为 4096 个 7×7 的卷积核，步长 1，得到 1×1×4096 的输出；若输入变大，则输出更大空间的热图。这种转化使得全卷积网络适用于分割、检测等密集预测任务。

    结论：1×1 卷积是逐位置的全连接，全连接是全局尺寸的卷积；它们可以相互转化，但语义场景不同。


content:
  prompt: 深度可分离卷积 (Depthwise Separable Convolution)
answer:
  mode: rubric
  reference_answer: |-
    组成两步

    深度可分离卷积将标准卷积分解为两个步骤：

    - 深度卷积 (Depthwise Convolution)：每个输入通道单独应用一个卷积核（即一个单通道滤波器），独立提取空间特征。若输入有 M 个通道，则有 M 个独立的二维卷积核（每个大小为 K×K）。这一步不进行跨通道的混合。

    - 逐点卷积 (Pointwise Convolution)：使用 1×1 卷积将深度卷积的输出通道进行线性组合，生成新的 N 个输出通道。这实现了跨通道的信息融合。

    参数量和计算量节省

    [图片内容未导入]

    通常 N 较大，约为 1/N 的节省。例如 K=3,N=64，标准参数 576M，分离参数 9M+64M=73M，节省约 87%。计算量节省同理。

    这种分解在 MobileNet 系列和 Xception 中广泛使用，极大降低了移动端模型的复杂度。


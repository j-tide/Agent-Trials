content:
  prompt: 在 Inception 模块中使用 1×1 卷积进行降维的目的是什么？
answer:
  mode: rubric
  reference_answer: |-
    降维目的：

    - 在昂贵的卷积（3×3, 5×5）之前使用 1×1 卷积减少输入通道数，极大降低计算量。例如，直接对 128 通道使用 5×5 卷积需要 25×128×输出通道的计算量，而如果先用 1×1 卷积将通道降到 32，则 5×5 卷积的计算量降为原来的 1/4。

    - 1×1 卷积也增加了非线性，提升网络表达能力。

    - 池化分支后使用 1×1 卷积压缩通道，保持整体通道数的平衡。

    这个设计使 Inception 网络在保持高性能的同时，计算量远小于堆叠大卷积核的模型。


content:
  prompt: AlexNet 相比 LeNet 有哪些关键创新？为什么能赢得 ImageNet 竞赛？
answer:
  mode: rubric
  reference_answer: |-
    关键创新：

    - 更深的网络：5 个卷积层 + 3 个全连接层，参数量约 60M。

    - ReLU 激活函数：代替 sigmoid/tanh，缓解梯度消失，加速训练。

    - Dropout 正则化：在全连接层中使用，防止过拟合。

    - 重叠池化：池化窗口大于步长，提升特征鲁棒性。

    - 局部响应归一化（LRN）：虽然后来被 BN 取代，但当时有助于泛化。

    - 数据增强：随机裁剪、水平翻转等，增大有效训练集。

    - GPU 并行训练：将网络分到两个 GPU 上，突破显存限制。

    获胜原因：深度带来的强表达能力、ReLU 和 Dropout 改善了训练，大量数据增强和 GPU 训练使得大规模学习成为可能。在 ImageNet 2012 上 top-5 错误率降至 15.3%，大幅超越传统方法。


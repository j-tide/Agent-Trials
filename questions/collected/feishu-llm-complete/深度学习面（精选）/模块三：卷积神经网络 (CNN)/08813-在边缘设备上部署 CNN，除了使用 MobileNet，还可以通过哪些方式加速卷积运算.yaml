content:
  prompt: 在边缘设备上部署 CNN，除了使用 MobileNet，还可以通过哪些方式加速卷积运算？
answer:
  mode: rubric
  reference_answer: |-
    - 模型压缩与优化

    - 剪枝：删除不重要的权重或通道，生成稀疏模型，然后利用稀疏卷积加速。

    - 量化：使用 INT8、FP16 甚至 INT4 进行推理，利用硬件指令（如 ARM NEON 的 SIMD）大幅提升速度，减少模型体积和内存占用。

    - 蒸馏：用大模型教导小模型，使轻量网络精度逼近大模型。

    - 高效卷积算子

    - 深度可分离卷积、分组卷积：MobileNet、ShuffleNet 已采用。

    - Winograd 卷积：对于 3×3 卷积，Winograd 最小滤波算法可以减少乘法次数（约 2.25 倍），在 CPU/GPU 上常被推理库使用。

    - FFT 卷积：大核卷积可用 FFT 加速，但边缘设备上较少用，因为小核更常见。

    - Im2col/GEMM 优化：将卷积转化为矩阵乘法，利用高效 BLAS 库。

    - 网络架构转换

    - 结构重参数化（如 RepVGG）：训练使用多分支，推理合并为单路，适应硬件加速。

    - 神经网络架构搜索（NAS）：直接针对目标设备的延迟和功耗进行搜索，得到定制化高效模型。

    - 硬件与框架优化

    - 使用推理框架（如 TensorFlow Lite, ONNX Runtime, OpenVINO, MNN, NCNN）对模型进行算子融合、常量折叠、内存优化等。

    - 针对 GPU 使用 NCNN 的 Vulkan 优化，NPU/DSP 使用厂商 SDK（如高通 SNPE, 华为 HiAI）进行异构加速。

    - Winograd 和调优的 im2col 在移动端 CPU 上非常有效。

    - 输入预处理与减少推理次数

    - 调整输入分辨率：在保持精度的前提下使用更小的图像。

    - 动态推理（如早退机制）：简单样本使用浅层网络即可分类。

    - 编译器级优化

    - TVM 等自动调优框架可针对特定硬件生成最优调度。

    综合运用这些方法，可以使模型在边缘设备上达到实时性能，同时维持可接受的精度。


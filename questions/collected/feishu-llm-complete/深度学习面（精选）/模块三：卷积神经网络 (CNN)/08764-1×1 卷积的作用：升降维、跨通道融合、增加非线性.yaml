content:
  prompt: 1×1 卷积的作用：升降维、跨通道融合、增加非线性
answer:
  mode: rubric
  reference_answer: |-
    1×1 卷积是核大小为 1×1 的卷积，它等价于在每个像素位置上对所有输入通道做一次线性变换。它的三大作用：

    - 升降维：通过设置输出通道数小于输入通道数，压缩特征图数量（降维），减少后续层的计算量；或相反增加通道数（升维）以增加特征丰富度。例如在 ResNet 的瓶颈结构中，先用 1×1 卷积将 256 通道降为 64，3×3 卷积处理后再升回 256。

    - 跨通道信息融合：1×1 卷积在全通道维度上做线性组合，相当于整合各通道的特征，实现了通道间的信息交换。这在深度可分离卷积中作为逐点卷积负责融合深度卷积提取的各通道独立空间特征。

    - 增加非线性：1×1 卷积后通常接激活函数（如 ReLU），在不改变空间尺寸的情况下为网络引入额外的非线性变换，增强了模型的表达能力。多个 1×1 卷积可以构成小型“多层感知机”作用于每个位置。

    其他应用

    - 用于构建全卷积网络中的分类层（代替全连接）。

    - 在注意力机制中生成权重图（如 SE block 中的降维-升维操作使用 1×1 卷积）。

    - 在 DenseNet 中用作特征压缩。


content:
  prompt: 在设计轻量级网络时，如何权衡 FLOPs 和参数量？两者反映的性能指标有何不同？
answer:
  mode: rubric
  reference_answer: |-
    参数量 (Parameters)：

    - 反映模型的存储空间和内存占用。

    - 决定模型文件大小、运行时参数驻留显存的大小。

    - 与推理速度并不完全线性相关，因为即使参数多，如果计算量小，执行可能仍然快；但参数太多会导致显存不足，无法运行，同时权重加载和带宽可能成为瓶颈。

    - 过多的参数可能引发过拟合，需要更多正则化。

    FLOPs（或 MACs）：

    - 反映模型进行一次前向传播所需的计算量，大致关联推理延迟和能耗。

    - 减少 FLOPs 可直接提升推理速度，尤其是在计算资源受限的设备上（如手机 CPU/GPU）。

    - 但是 FLOPs 并不能完美代表实际速度，因为速度还受内存访问、并行度、硬件亲和性等影响。

    权衡策略：

    - 为了降低参数量，可以使用深度可分离卷积、全局平均池化、分组卷积、低秩分解等。

    - 为了降低 FLOPs，除了上述方法，还可以用更小的输入分辨率、减少通道数、使用更少的层。

    - 在轻量级网络设计中，通常优先控制FLOPs，因为它更直接影响延迟。但同时要保证参数量在内存预算内（如移动端通常限制在 5-20M 参数）。

    - 有些操作参数量很小但 FLOPs 不小（如 1×1 卷积），或者反之（如全连接层参数量大但 FLOPs 相对少）。需要根据硬件特性调整：对于模型大小敏感的场景（App 下载大小），参数量重要；对于低延迟推理，FLOPs 和访存更关键。

    两者不能相互替代，设计时需同时关注，并最终以实测推理速度为准。


content:
  prompt: 可变形卷积 v2 比 v1 多了什么？调制机制如何工作？
answer:
  mode: rubric
  reference_answer: |-
    DCN v2 的改进
    在 DCN v1 中，每个采样点仅学习空间偏移，且所有采样点对输出的贡献是均等权重（由卷积核权重决定，但核权重固定）。DCN v2 引入了调制机制（Modulation），为每个采样点增加一个可学习的调制标量 Δmn∈[0,1]，允许网络控制每个偏移采样点的重要性。公式变为：

    [图片内容未导入]

    调制机制的作用

    - 可以屏蔽掉一些不相关的采样点（如物体边界外的点），让网络自己决定哪些偏移采样是有用的，进一步提升了变形模块的处理能力。

    - 同时，DCN v2 还增加了可学习的“特征增益”来平衡不同尺度的目标。

    - 这使得可变形卷积能更精准地建模复杂几何形变，在检测和分割上带来进一步提升。

    学习方式

    与 DCN v1 相似，偏移量和调制系数都是通过额外的卷积层预测，反向传播通过双线性插值梯度回传至输入特征和偏移/调制预测网络，整个系统端到端训练。


content:
  prompt: 分析 VGG 中，一个 3×3 卷积层的参数量和感受野，并与一个 5×5 卷积层对比。
answer:
  mode: rubric
  reference_answer: |-
    感受野：

    - 一层 3×3 卷积：感受野 = 3。

    - 一层 5×5 卷积：感受野 = 5。
    要达到 5×5 的感受野，可以用两层 3×3 卷积堆叠，其感受野 = 3 + (3-1)×1 = 5。因此两个 3×3 层和一个 5×5 层的最大感受野相同。

    [图片内容未导入]

    额外收益：两个 3×3 层之间多一个 ReLU 非线性层，增强了模型的表示能力。因此 VGG 提倡全部使用 3×3 卷积，既不牺牲感受野，又减少参数，增加非线性，性能更好。


content:
  prompt: 为什么 VGG 使用堆叠小卷积核而不是大卷积核？请计算感受野和参数量对比。
answer:
  mode: rubric
  reference_answer: |-
    原因：

    - 相同感受野：两个 3×3 卷积的感受野为 5×5，三个为 7×7。

    - 更少参数：设输入输出通道均为 C，

    [图片内容未导入]

    - 更多非线性：每层卷积后跟 ReLU，多层非线性增强决策函数判别力。

    - 正则化效果：参数减少降低了过拟合风险。

    举例：输入 C=64，输出 C=128 时，5×5 参数=25×64×128=204,800；两个 3×3 参数=9×64×128 + 9×128×128=73,728+147,456=221,184，虽然略高，但如果中间层为相同通道数，则节省明显。通常中间层保持通道数，VGG 每块内部通道数相同，则两个 3×3 参数确实更少。


    - 卷积层：

    [图片内容未导入]

    - 1×1 卷积：空间尺寸不变（步长 1，填充 0），通道数可任意调整。

    - 全连接层：通常在最后，输入特征图被展平为向量，丢弃空间维度。加入 GAP 后则输出 1×1×C。

    总结变化趋势

    深度 CNN 中，随着层数加深，空间尺寸逐渐减小（通过步长卷积或池化），通道数逐渐增加（更丰富的语义特征）。这种设计使网络从局部细节过渡到全局抽象。


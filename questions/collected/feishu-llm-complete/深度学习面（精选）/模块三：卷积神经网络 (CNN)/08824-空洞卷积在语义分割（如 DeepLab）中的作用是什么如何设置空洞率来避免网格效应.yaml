content:
  prompt: 空洞卷积在语义分割（如 DeepLab）中的作用是什么？如何设置空洞率来避免网格效应？
answer:
  mode: rubric
  reference_answer: |-
    作用

    - 语义分割需要输出高分辨率预测图，空洞卷积（Dilated/Atrous Convolution）可以在不进行下采样的情况下指数级扩大感受野。

    - 在 DeepLab 系列中，空洞卷积被用来构建空洞空间金字塔池化（ASPP）模块：并行使用多个不同空洞率的卷积来捕获多尺度上下文信息，同时保持特征图的分辨率。

    - 这样既能获取全局上下文（大空洞率），又能保留局部细节（小空洞率），大幅提升分割精度。

    网格效应（Gridding Effect）

    当连续使用相同空洞率的空洞卷积时，卷积核的采样点会形成固定的稀疏网格，导致某些输入像素完全未被采样，信息丢失。例如，连续两个空洞率=2 的 3×3 卷积，其采样点总是间隔固定步幅，输出像素只依赖于稀疏网格上的输入，产生类似棋盘的模式。这会降低对局部信息的建模能力。

    避免网格效应的方法

    - 使用连续递增的空洞率（如 1, 2, 4）堆叠：设计的原则是相邻空洞率的最大公约数应为 1，且空洞率之间不要有公因子。例如 HDC（Hybrid Dilated Convolution）框架建议采用锯齿状空洞率，如 [1, 2, 5, 1, 2, 5] 的循环，确保最终感受野覆盖所有输入像素而不遗漏。

    - 在 ASPP 中，并行使用多个不同空洞率（如 6, 12, 18）并 concat，每个分支独立提取特征，融合后避免了单一空洞率连续堆叠的问题。

    - 结合 1×1 卷积和全局池化：ASPP 中还包括 1×1 卷积分支和全局平均池化分支，进一步缓解网格效应并补充全图上下文。

    - 空洞率上限受特征图大小限制：空洞率不能超过特征图尺寸，否则采样点会落在边界之外，退化为 1×1 卷积。通常随着特征图变小，后期空洞率不宜太大。

    DeepLab v3 通过精心设计的 ASPP 模块（多空洞率+全局池化）成功避免了网格效应，并捕获了丰富的多尺度信息。


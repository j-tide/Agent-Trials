content:
  prompt: 为什么 FLOPs 不能完全代表推理速度？还要考虑哪些因素？
answer:
  mode: rubric
  reference_answer: |-
    - 内存访问成本 (Memory Access Cost, MAC)：实际推理中，从显存/内存读取数据和写回结果的耗时可能超过计算本身。例如，深度可分离卷积的 FLOPs 远小于标准卷积，但其计算密度（FLOPs/字节）较低，访存占比高，实际加速比往往达不到理论值。ShuffleNet 等设计特别关注减少 MAC。

    - 并行度和硬件利用率：GPU 等并行处理器需要足够的工作量来填充计算单元。如果 FLOPs 过小（如 1×1 卷积），但需要启动大量 kernel 或产生同步开销，可能导致低占用率。块大小、分组卷积的组数会影响并行效率。

    - 计算图开销：框架调度、kernel launch 等开销在处理小网络或移动端时尤为显著。

    - 稀疏性和权重布局：某些操作（如 ReLU 后的零值）可以跳过计算，但 FLOPs 统计通常不考虑稀疏加速。

    - 精度和量化：混合精度、INT8 推理时，FLOPs 概念变得模糊，吞吐量由硬件张量核心的吞吐决定，而非简单的浮点运算次数。

    - 分支和逐元素操作：残差连接、拼接、激活函数、归一化等操作虽 FLOPs 不计，却占用内存带宽和计算时间。

    因此，评估模型实际速度需要实测推理延迟（latency）或吞吐量（throughput），并结合硬件特性优化，不能只看 FLOPs。


answer:
  mode: rubric
  reference_answer: |-
    - "valid" 模式：等同于不填充（padding=0）。此时卷积核只在输入内部完整滑动，边界像素可能被忽略。输出尺寸会缩小，公式简化为 ⌊(W−K)/S⌋+1。这种模式会逐渐收缩空间维度，信息集中在中心区域。

    - "same" 模式：通过填充，使得输出空间尺寸与输入相同（当步长为 1 时）。通常需要根据步长和核大小计算需要的填充量。对于步长为 1 的情况，需要填充 P=(K−1)/2（如果 K 为奇数）。更一般地，为了保持尺寸，需要满足：

    [图片内容未导入]

    - 但要求 SS 通常为 1 才行。如果 S>1S>1，无法保持精确相同尺寸。TensorFlow 中的 "same" 模式会自动计算填充以确保输出为 ⌈W/S⌉ 或 W/S 向上取整，并且会在右侧和底部多填充一些（非对称填充）。PyTorch 没有内置 "same" 字符串，需手动计算。

    “same”下 padding 计算（常用情况）
    对于步长为 1，希望输出尺寸等于输入尺寸，且卷积核为奇数边长 K，则单边填充P=⌊K/2⌋。例如 3×3 核，填充 1；5×5 核，填充 2。这保证了输出尺寸不变（假设 input 整除步长等）。


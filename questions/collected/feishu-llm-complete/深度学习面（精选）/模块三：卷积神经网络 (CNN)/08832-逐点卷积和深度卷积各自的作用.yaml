content:
  prompt: 逐点卷积和深度卷积各自的作用
answer:
  mode: rubric
  reference_answer: |-
    - 深度卷积 (Depthwise Conv)：独立处理每个输入通道，仅提取空间特征。它假设通道间的空间特征可以独立学习，不进行通道间的信息交互。由于每个通道使用自己的卷积核，参数量和计算量极低。但因为它不融合跨通道信息，所以输出通道数与输入相同，无法改变通道数量，且特征表达有限。

    - 逐点卷积 (Pointwise Conv，即 1×1 卷积)：在通道方向上组合特征，相当于对每个像素位置进行全连接（通道间的线性变换）。它可以升维或降维通道数，引入非线性（配合激活），实现通道间信息融合。由于核大小为 1×1，没有空间上下文，计算量也很小。它在深度可分离卷积中负责将独立的空间特征组合成丰富的语义特征。

    两者结合：深度卷积提取每个通道的空间模式，逐点卷积将这些模式加权组合，生成新的特征表示。这种设计在保持高表达力的同时，大幅减少了参数和计算。


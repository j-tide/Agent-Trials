content:
  prompt: ConvNeXt 是如何借鉴 Transformer 设计来现代化 CNN 的？有哪些关键改动？
answer:
  mode: rubric
  reference_answer: |-
    ConvNeXt 旨在“现代化”标准卷积神经网络，使其在保持 CNN 固有优势（如效率、平移等变性）的同时，引入 Transformer 架构的成功设计理念。关键改动包括：

    - 宏观架构调整

    - 深度可分离卷积与大核卷积

    - 倒置瓶颈与更宽的通道

    - 现代化训练策略与结构细节

    - 整体思想
    ConvNeXt 的思路是保留 CNN 的滑动窗口特性，但引入 Transformer 中证明有效的宏观和微观设计，最终实现一个纯粹由卷积构成的架构，在图像分类、检测、分割等任务上性能媲美甚至超越 Swin Transformer，同时保持卷积网络的部署优势。


content:
  prompt: 什么是感受野？它对于 CNN 的设计有什么指导意义？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    感受野（Receptive Field） 是指卷积神经网络中某一层输出特征图上的一个像素点在原始输入图像上能“看到”的区域大小。它决定了该神经元能够利用多大范围的上下文信息进行决策。

    指导意义：

    - 分类任务：网络最后的特征向量（如 GAP 后的特征）的感受野应至少覆盖输入图像的大部分区域，甚至整个图像，这样才能捕捉到物体的全局结构和类别特征。如果感受野过小，模型只能看到局部碎片，可能无法正确识别物体（例如只能看到猫的耳朵却看不到全身）。

    - 目标检测与分割：需要多尺度感受野来处理大小不一的物体。浅层特征感受野小，适合检测小物体；深层感受野大，适合检测大物体。因此，特征金字塔（FPN）等多尺度结构应运而生。

    - 密集预测任务：语义分割中，每个像素的分类需要足够大的感受野来获取上下文，以避免误分类（如局部纹理不足以区分道路和天空）。同时，不能无限扩大感受野而导致空间细节丢失，所以需要空洞卷积等技巧在不损失分辨率的情况下增大感受野。

    - 网络深度设计：通过堆叠更多层或使用特定操作来获得期望的感受野，同时参数量和计算量可控。这直接影响架构设计，例如用两层 3×3 代替一层 5×5，既获得相同感受野，又减少参数并增加非线性。

    - 有效感受野：实际中，感受野内不同像素对输出神经元的影响并不均匀，中心区域影响大于边缘。设计时需让重要的物体部分落在有效感受野的高斯权重中心，否则即使理论感受野足够，也可能无法很好地利用上下文。

    因此，感受野分析是 CNN 架构设计的核心依据之一，决定了网络的深度、卷积核大小、空洞率、步长等关键参数的选择。


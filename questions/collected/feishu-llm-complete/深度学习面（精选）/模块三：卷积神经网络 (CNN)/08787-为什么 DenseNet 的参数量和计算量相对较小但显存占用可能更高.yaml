content:
  prompt: 为什么 DenseNet 的参数量和计算量相对较小？但显存占用可能更高？
answer:
  mode: rubric
  reference_answer: |-
    参数量小：因为增长率 k 较小，每一层只产生少量新特征，且大量特征被复用。瓶颈层（1×1 卷积）进一步压缩通道（如 4k）。此外，全连接层之前使用全局平均池化，消除了巨量全连接参数。

    计算量小：由于输出通道数少，3×3 卷积的输入通道尽管拼接后较多，但 1×1 瓶颈卷积会先降维，使得计算可控。

    显存占用可能更高：

    - 密集连接需要存储前面所有层的特征图以用于后续拼接，这些中间激活在训练时不能被释放，导致显存占用极高（与网络深度成正比）。

    - 虽然参数少，但特征图占用大量 GPU 内存，尤其在 dense block 内，需要缓存所有层的输出用于反向传播。可以通过梯度检查点或使用内存优化实现来缓解，但原生训练时显存是瓶颈。


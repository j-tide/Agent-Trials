content:
  prompt: Global Average Pooling (GAP) 替代 Flatten + 全连接的好处
answer:
  mode: rubric
  reference_answer: |-
    Global Average Pooling 是对整个特征图的每个通道求均值，将 H×W×C的特征图变成 1×1×C 的向量，然后直接送入 softmax 分类器。

    好处：

    - 大幅减少参数：传统 Flatten + 全连接层会产生巨大的权重矩阵（例如 7×7×512 的输入连接到 4096 个神经元，参数量约 102M），GAP 后直接接分类器，参数量仅为C × num_classes ，几乎没有额外参数，显著降低过拟合风险。

    - 空间信息整合更鲁棒：GAP 对空间位置做了全局平均，天然具有平移不变性，且对输入尺寸不敏感，可以接受任意大小的输入图像（因为最后特征图的尺寸可任意，均值池化后得到固定长度向量）。

    - 正则化效果：通过强制特征图每个通道的全局平均值直接对应一个类别置信度，鼓励每张特征图学习到代表某个类别的“存在性图”（即该类别对应的通道在物体出现区域有高激活），这样网络更有可解释性（类激活映射 CAM）。

    - 架构简洁：去除了庞大的全连接隐藏层，模型更轻量，代表性网络如 NIN、GoogLeNet、ResNet 均使用 GAP 作为分类头。

    因此，在现代 CNN 设计中，GAP + 一个线性全连接层（或直接 softmax）几乎成为标准，完全取代了早年的重型 Flatten + 大 FC。


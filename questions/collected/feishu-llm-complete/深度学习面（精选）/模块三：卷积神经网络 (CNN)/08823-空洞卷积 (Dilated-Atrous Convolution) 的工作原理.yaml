content:
  prompt: 空洞卷积 (Dilated/Atrous Convolution) 的工作原理
answer:
  mode: rubric
  reference_answer: |-
    空洞卷积在标准卷积核的元素之间插入空洞（即零值），从而在不增加参数数量的情况下，指数级地扩大感受野。

    工作原理
    设空洞率为 d（dilation rate），表示卷积核元素之间间隔 d−1 个零。例如，一个 3×3 卷积核，空洞率 d=2 时，实际的感受野覆盖范围相当于 5×5，但只有 9 个非零权重被学习（其余都是零且不可训练）。空洞率 d=1 就是标准卷积。

    增大感受野而不增加参数
    感受野（Receptive Field）是指输出特征图上每个像素点能够“看到”的输入区域大小。通过堆叠标准卷积，感受野随深度线性增长（每增加一层，感受野增加 K−1）。使用空洞卷积，可以在相同层数下获得指数级增长的感受野。例如，连续使用空洞率为 1,2,4 的卷积，感受野迅速扩大到 15×15（而参数数量仍然是 3×3 的规模）。这在语义分割、时序预测等任务中非常关键，既能捕捉长距离依赖，又不丢失分辨率或引入大量参数。


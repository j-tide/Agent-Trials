content:
  prompt: 解释 Winograd 算法如何加速小卷积核计算，以及为何在大核或大 stride 时不适用。
answer:
  mode: rubric
  reference_answer: |-
    Winograd 最小滤波算法

    [图片内容未导入]

    - 将输入分块（tiles），每个块与卷积核进行 Winograd 变换。

    - 在变换域中执行逐元素乘法（输入和核的变换相乘）。

    - 对结果执行逆变换得到输出块。
    由于乘法数量减少，且现代硬件上乘法是昂贵操作，总体计算速度得以提升。小卷积核（如 3×3, 5×5）在深度学习推理中被广泛应用，Winograd 已成为许多推理库（如 cuDNN）的标准优化。

    为何在大核或大 stride 时不适用

    - 大卷积核：Winograd 的加速比随核尺寸增大而下降，且变换矩阵的数值稳定性变差，精度损失可能不可接受。此外，大核卷积本身在 CNN 中较少出现，Winograd 的优势领域不再。

    - 大 stride：Winograd 算法通常假设步长为 1。对于 stride > 1 的卷积，输出块重叠和采样模式改变，标准 Winograd 公式不再直接适用。可以强制使用某种映射，但会引入额外开销，加速效果减弱甚至变慢。

    - 内存开销：Winograd 变换会增加中间张量的通道数（因变换矩阵扩展），对于大核或大通道，额外的内存带宽需求可能抵消乘法减少带来的收益。

    - 适用性：因此 Winograd 主要针对 3×3 步长 1 的卷积，且 batch size 适中（推理时 batch=1 常见），在 CPU/GPU 上均有效。大核或大 stride 时通常退化为常规 im2col+GEMM 或 FFT 方法。


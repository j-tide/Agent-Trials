content:
  prompt: 简述深度可分离卷积、分组卷积、通道混洗在轻量级模型设计中的组合使用。
answer:
  mode: rubric
  reference_answer: |-
    这三者常被组合来构建极高效且性能良好的移动端 CNN 模块。

    - 深度可分离卷积：负责在空间维度上提取特征，且不混合通道（depthwise），然后紧跟 1×1 逐点卷积融合通道。这是 MobileNet 的核心。

    - 分组卷积：可以看作深度可分离卷积的推广（当组数小于通道数时）。组卷积允许在减少参数的同时保留一定的通道交互，但组间独立。ResNeXt 用分组卷积增加基数。

    - 通道混洗：解决分组卷积后信息隔离的问题，强制不同组的通道在下一次分组卷积前混合。

    典型组合：ShuffleNet 单元

    - ShuffleNet v1：
    1×1 分组卷积 → 通道混洗 → 3×3 深度卷积 → 1×1 分组卷积。
    通过两个 1×1 分组卷积（带通道混洗）实现通道信息混合，同时深度卷积处理空间特征。
    这种设计在极小计算量下仍能获得不错精度。

    - ShuffleNet v2：进一步优化了操作顺序和分支结构，遵循高效网络设计的四条准则（包括均衡输入输出通道、减少分组卷积的组数等），仍使用通道混洗。

    总结：深度可分离卷积负责空间滤波，分组卷积减少 1×1 卷积的计算量，通道混洗打破组的隔离，三者协同可在 FLOPs 和精度间取得卓越平衡。


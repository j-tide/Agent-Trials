content:
  prompt: MobileNet v1 的核心是深度可分离卷积，它如何实现移动端加速？
answer:
  mode: rubric
  reference_answer: |-
    核心：将标准卷积分解为 depthwise 卷积和 pointwise 卷积，大幅减少计算量和参数量。

    - Depthwise：每个输入通道单独使用一个滤波器，仅提取空间特征。

    - Pointwise：1×1 卷积组合通道，实现跨通道信息融合。


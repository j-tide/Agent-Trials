content:
  prompt: MobileNet v2 的线性瓶颈和倒置残差结构是什么？为什么设计成这样？
answer:
  mode: rubric
  reference_answer: |-
    倒置残差（Inverted Residuals）

    - 标准残差块（ResNet）遵循“压缩 → 卷积 → 扩展”的模式，即先通过 1×1 卷积降维，然后进行昂贵的 3×3 卷积，最后再用 1×1 升维恢复通道数。这种结构是为了减少 3×3 卷积的计算量。

    - MobileNet v2 的倒置残差块恰好相反：先升维 → 深度卷积 → 再降维。具体为：

    - 由于残差连接的两端都是低维特征（通道数少），与标准残差的高维连接相反，因此称为“倒置”。

    线性瓶颈（Linear Bottleneck）

    - 瓶颈指特征在经过激活函数时可能丢失信息。MobileNet v2 认为，低维特征在经过非线性激活（如 ReLU）后会造成严重的信息破坏，因为 ReLU 会将负值直接置零，在低维空间中这种破坏可能不可逆。

    - 因此，在倒置残差块中，最后的 1×1 压缩层不使用激活函数（即线性输出），以避免低维表示的信息损失。前面的升维和高维深度卷积依然使用非线性激活（ReLU6），因为在高维空间中信息冗余度大，ReLU 造成的破坏可以被补偿。

    - 这种设计将输入数据“流形”嵌入到高维空间进行变换，然后再投影回低维，并保持流形在低维空间时的完整性。

    为什么这样设计

    - 效率与表达力平衡：深度卷积本身计算量小，但只能在已有通道上滤波，表达能力有限。升维到高维空间后再做深度卷积，可以利用更大的容量进行特征提取，最后压缩回低维节省参数和计算，并保留残差连接的低成本。

    - 信息保持：线性瓶颈保证在低维瓶颈处不丢失信息，使网络可以学习更紧凑的表示，同时梯度可以通过短接连接顺畅传播。

    - 这种结构使得 MobileNet v2 在保持极低计算量的同时，显著提升了准确率，适用于移动和嵌入式设备。


content:
  prompt: "“深度可分离卷积 + 线性瓶颈 + 倒置残差”组合在一起形成了什么网络？"
answer:
  mode: rubric
  reference_answer: |-
    这个组合形成了 MobileNet v2 的基本构建块（bottleneck residual block）。

    - 深度可分离卷积：替代标准卷积，分解为 depthwise 和 pointwise，大幅降低计算量。

    - 线性瓶颈：在低维表示输出时不使用非线性激活（ReLU），防止信息破坏。

    - 倒置残差：残差块的形状是“窄-宽-窄”，即低维输入→高维扩展→深度卷积→低维输出，shortcut 连接在窄的两端。

    完整结构：

    输入（低维，通道数少）→ 1×1 卷积（扩展因子 t，升维到 t 倍）+ BN + ReLU6 → 3×3 深度卷积（stride 由需求决定）+ BN + ReLU6 → 1×1 卷积（降维回原始通道数）+ BN（无激活）→ 与输入相加（如果 stride=1 且尺寸匹配）。

    这种结构在极大降低计算量和参数的同时，通过高维空间的变换和线性瓶颈保持了表达能力，成为移动端高效网络的基石。MobileNet v3 在此基础上加入了 SE 模块和 h-swish 激活，进一步优化。


content:
  prompt: VGG 网络的核心思想是什么？它证明了什么？缺点是什么？
answer:
  mode: rubric
  reference_answer: |-
    核心思想：使用全部 3×3 小卷积核，堆叠更多层（16-19 层），保持特征的均匀性和规整性。所有卷积层使用相同的配置（3×3，步长 1，padding 1），定期用 2×2 最大池化降采样。

    证明了什么：

    - 深度对性能至关重要，更深的网络可以显著提升准确率。

    - 小卷积核堆叠可以在相同感受野下减少参数，增加非线性，效果优于大卷积核。

    - 规整的结构设计（同质化层）使得网络更易优化。

    缺点：

    - 参数量巨大：特别是全连接层（如 4096×4096），VGG-16 有约 138M 参数，占用大量存储和显存。

    - 计算量大：约 15.5 GFLOPs，推理速度慢。

    - 训练需要更多内存和时间。

    - 相对于后来的网络（ResNet, MobileNet），效率较低。


    反向传播

    由于偏移量是通过卷积网络预测的，整个系统端到端可微。梯度需要从采样值回传到偏移量和输入特征。具体梯流：

    - 对主卷积核权重：与标准卷积相同，直接对加权输出求导。

    - 对输入特征 X：不仅通过采样值的加权和直接回传（与标准卷积类似，但要考虑采样坐标可能不是整数），还要通过偏移量预测网络间接回传（双线性插值梯度）。

    [图片内容未导入]

    其中 G 是双线性插值的梯度核。框架自动实现了这些细节。

    因此，DCN 通过额外的卷积来预测偏移，并用双线性插值保证可微性，使得整个网络能联合学习特征提取和几何变形。


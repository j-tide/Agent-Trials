  reference_answer: |-
    复合缩放（Compound Scaling）方法

    - EfficientNet 使用一个复合系数 ϕϕ 来同时控制网络深度 dd、宽度 ww 和输入分辨率 rr 的缩放：

    [图片内容未导入]

    理论基础

    - 观察：单独缩放深度、宽度或分辨率中的任意一个维度，都能提高精度，但会很快遇到饱和（如深度过深导致退化，宽度过宽导致计算爆炸，分辨率过高超过感受野）。三者之间存在内在关联。

    - 直觉：输入图像分辨率更高时，需要更深的网络来获得更大的感受野以覆盖整个物体，同时也需要更多的通道来捕捉更细粒度的模式。复合缩放协同调整这三个维度，可以最大化利用有限的计算资源。

    - 实验表明，在固定计算量下，复合缩放比单独缩放任一维度的效果更好，且生成的模型家族在效率和精度上超越了当时的各种手工设计或 NAS 方法。

    效果：EfficientNet-B7 在 ImageNet 上以远小于之前模型的参数量和 FLOPs 达到了当时最高精度。


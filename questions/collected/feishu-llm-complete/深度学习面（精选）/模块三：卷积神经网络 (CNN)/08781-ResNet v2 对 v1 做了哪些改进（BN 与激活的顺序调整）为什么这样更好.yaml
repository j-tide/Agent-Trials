content:
  prompt: ResNet v2 对 v1 做了哪些改进（BN 与激活的顺序调整）？为什么这样更好？
answer:
  mode: rubric
  reference_answer: |-
    改进：ResNet v1 的原始残差块顺序为：Conv → BN → ReLU，且 shortcut 在 ReLU 之前加入。v2 提出预激活（pre-activation）：将 BN 和 ReLU 移到卷积层之前，即顺序变为 BN → ReLU → Conv。同时，shortcut 路径现在直接传递未经激活的恒等映射，使得信号传播更加直接。

    为什么更好：

    - 在前向传播时，任意深层单元的输入都是浅层单元的恒等映射与各层残差之和，信息畅通无阻。

    - 反向传播梯度流：从损失到任何浅层，梯度通过 shortcut 不经过任何 BN 或 ReLU，避免了梯度衰减。因此 v2 在更深的网络（如 1001 层）上能稳定训练并取得更好效果。

    - 实验证明，v2 相比 v1 在 CIFAR-10 上 1001 层 ResNet 的错误率更低，且优化更容易。


content:
  prompt: 比较 ResNet、DenseNet、SENet、EfficientNet 在效率和精度上的特点。
answer:
  mode: rubric
  reference_answer: |-
    总结

    - ResNet 是奠基性工作，效率与精度平衡较好，但未做极致的轻量化。

    - DenseNet 参数和计算量可以控制得很低，但密集连接导致的显存和运行瓶颈限制了其在移动端的使用。

    - SENet 以极少额外开销显著提升已有架构的性能，是一个通用增强模块。

    - EfficientNet 通过自动化的复合缩放，在各个资源级别都达到了最优的精度/效率 trade-off，是当前高效率网络的代表之一。


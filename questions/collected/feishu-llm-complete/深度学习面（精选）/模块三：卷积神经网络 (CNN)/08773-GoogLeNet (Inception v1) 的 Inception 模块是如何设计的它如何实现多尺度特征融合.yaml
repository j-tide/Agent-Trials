content:
  prompt: GoogLeNet (Inception v1) 的 Inception 模块是如何设计的？它如何实现多尺度特征融合？
answer:
  mode: rubric
  reference_answer: |-
    Inception 模块设计（初始版本）：

    - 输入并行通过四个分支：

    - 所有分支的步长均为 1，使用适当的填充保证输出空间尺寸相同，最终在通道维度上拼接。

    - 1×1 卷积用于降维和增加非线性。

    多尺度特征融合：不同大小的卷积核（1×1, 3×3, 5×5）和池化操作可以捕获不同尺度的信息，并行处理后在通道上合并，使网络能够同时学习稀疏（1×1）和集中（5×5）特征，增强了多尺度适应性。

    后续改进（Inception v1 也有辅助分类器缓解梯度问题），整体网络更宽而不是更深，同时控制计算量。


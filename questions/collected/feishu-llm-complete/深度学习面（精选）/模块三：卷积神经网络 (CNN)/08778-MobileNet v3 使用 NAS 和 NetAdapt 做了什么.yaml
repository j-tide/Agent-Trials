content:
  prompt: MobileNet v3 使用 NAS 和 NetAdapt 做了什么？
answer:
  mode: rubric
  reference_answer: |-
    MobileNet v3 结合了神经架构搜索（NAS）和NetAdapt 算法来进行自动化网络设计。

    NAS（神经架构搜索）

    - 使用平台感知的 MnasNet 框架，在搜索空间内以多目标奖励（兼顾准确率和延迟）自动寻找最优的卷积块配置。

    - 搜索空间包括：扩展因子、卷积核大小、是否使用 Squeeze-and-Excitation 模块、激活函数选择等。

    - 通过强化学习在 MobileNet v2 的倒置残差结构基础上搜索出高效模块，得到一个在目标硬件（如 Pixel 手机）上既快又准的初步架构。

    NetAdapt

    - 在 NAS 得到的架构基础上，NetAdapt 进一步进行层级别的细粒度调整。它逐层分析每一层的计算量和贡献，尝试用更小的结构（减少通道数、改变扩展因子）替换原有层，并微调模型保持精度。

    - 这个过程允许在略微牺牲精度的情况下大幅降低延迟，最终实现精度和速度的最佳平衡。

    MobileNet v3 的成果

    - 继承了 v2 的倒置残差和线性瓶颈，同时加入 SE 注意力模块（Squeeze-and-Excitation），并使用 h-swish 激活函数替代部分 ReLU，以减少计算开销。

    - 提出了 Large 和 Small 两个版本，分别针对高资源和低资源环境。

    - 在图像分类、目标检测等任务上，以更低的 FLOPs 达到了与 v2 相当或更优的精度。


content:
  prompt: ResNeXt 的“分组卷积”如何实现“基数”（Cardinality）的控制？与宽度比哪个更有效？
answer:
  mode: rubric
  reference_answer: |-
    基数（Cardinality）的定义

    - 在 ResNeXt 中，基数指的是残差块内转换（transformation）路径的并行分支数量，也就是分组卷积的组数。

    - 每个分支执行相同的拓扑结构（通常为 1×1 降维 → 3×3 分组卷积 → 1×1 升维），所有分支输出在通道上拼接后与短接相加。

    分组卷积实现基数控制

    - 标准卷积在全部输入通道上操作。分组卷积将通道分为 G 组，每组独立卷积，然后拼接。这里 G 就是基数。

    - 例如，一个 ResNeXt 块输入 256 通道，基数 C=32，则分为 32 组，每组处理 4 个通道（256/32=8? 实际常用每组中间通道数 d，总中间通道 C×d，然后通过 1×1 卷积恢复）。在控制整体计算量不变的情况下，增加基数可以增加网络的学习能力。

    - 设计原则是：保持总计算量（FLOPs）与对比的 ResNet 类似，通过增加基数而减少每组内的宽度（即中间层的通道数），实现多路结构。

    基数 vs 宽度的有效性

    - ResNeXt 论文的核心结论：在相近的计算复杂度下，增加基数比增加深度或宽度能更有效地提升模型性能。

    - 实验表明，从 ResNet-50 的基数 1（宽度 64）变为 ResNeXt-50 的基数 32（每组宽度 4），在 FLOPs 相当的情况下，ImageNet 分类错误率明显下降。

    - 原因解释：更多的并行路径为网络提供了更多的子空间，可以学习到更加多样化和互补的特征，这类似于增加了一层集成学习，增强了表示能力。

    因此，ResNeXt 的设计哲学是：用多分支（高基数）代替单分支的宽层，在给定计算预算下获得更好的精度。


content:
  prompt: 卷积和自注意力各有何优缺点？为什么 ViT 等模型用注意力替代了卷积？
answer:
  mode: rubric
  reference_answer: |-
    卷积的优势

    - 归纳偏置强：局部连接和权值共享符合图像数据的空间局部性，使网络在数据量有限时能高效学习。

    - 平移等变性：天然具有平移等变性，适合检测、分割等密集预测。

    - 计算效率高：滑动窗口计算可以高度优化，现代硬件加速库成熟。

    - 参数少，容易训练：对于小模型和数据量不特别大的场景，卷积容易收敛且泛化好。

    卷积的劣势

    - 感受野有限：捕捉长距离依赖需要堆叠多层或使用特殊结构，信息交互不够直接。

    - 内容无关性：传统卷积核不随输入内容变化，对几何变换和复杂全局关系的建模能力不足。

    自注意力的优势

    - 全局依赖：每个位置直接与所有其他位置交互，一次操作即可捕获全局上下文。

    - 内容自适应：注意力权重根据输入动态计算，对于不同输入能灵活关注不同区域。

    - 多模态统一建模：序列结构统一，易于扩展到文本、图像、视频等多模态。

    自注意力的劣势

    [图片内容未导入]

    为什么 ViT 用注意力替代卷积

    - 在大规模数据（JFT-300M, ImageNet-21K）上训练时，Transformer 的强表达能力得以发挥，能够从数据中学会类似卷积的局部模式，并同时建模长程依赖。

    - 注意力机制提供了统一而简单的全局建模，无需手工设计复杂的卷积堆叠和跳跃连接。

    - 硬件对 Transformer 的优化进展迅速，大规模并行处理效率高。

    - 最终，ViT 展示了纯 Transformer 在视觉任务上的竞争力，推动了“去卷积化”的浪潮。


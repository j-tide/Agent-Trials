content:
  prompt: 在给定输入尺寸和卷积配置下，计算出网络的总 FLOPs。
answer:
  mode: rubric
  reference_answer: |-
    以简单的网络为例：输入 224×224×3，经过以下层：

    - Conv1: 7×7, stride 2, 64 通道, padding 3 → 输出 112×112×64。FLOPs = 7*7*3*64*112*112 次乘加（或×2算FLOPs）。

    - MaxPool: 3×3, stride 2 → 基本无 FLOPs（忽略）。

    - Conv2_x: 一系列 bottleneck 块。需要根据每个块的输入输出尺寸、通道变化，分别累加每一层的 FLOPs，再将所有块求和。可以使用公式或工具（如 torchinfo, fvcore）自动计算。

    [图片内容未导入]

    具体示例（部分）：

    ResNet-50 对 224×224 输入的总 FLOPs 约为 4.1 GFLOPs（乘加次数约 2.05G MACs，FLOPs=2×MACs）。具体数字需要查阅标准 benchmark。


answer:
  mode: rubric
  reference_answer: |-
    池化层（Pooling Layer）的作用

    - 降低空间分辨率，减小计算量：通过下采样减少特征图的高度和宽度，使得后续层的计算量和内存消耗大幅降低。

    - 增大感受野：经过池化后，同一层特征图上的一个像素能对应输入图像中更大的区域，有利于捕捉全局或更大范围的上下文信息。

    - 引入平移不变性：池化操作在局部区域对特征进行聚合，当输入特征发生微小位移时，池化输出变化不大，从而增强模型对位置变化的鲁棒性。尤其是最大池化，它对邻域内的精确位置不敏感。

    - 防止过拟合：通过降低空间维度和抽象层级，减少了参数数量和模型容量，具有一定的正则化效果。


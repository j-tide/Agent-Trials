content:
  prompt: LeNet-5 的结构是怎样的？它奠定了 CNN 的哪些基本组件？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    LeNet-5 结构（Yann LeCun, 1998）：

    - 输入：32×32 灰度手写数字图像。

    - C1 卷积层：6 个 5×5 卷积核，步长 1，无填充，输出 28×28×6。

    - S2 下采样层（平均池化）：2×2 窗口，步长 2，输出 14×14×6。

    - C3 卷积层：16 个 5×5 卷积核（部分连接，不是所有通道都连接，为节省计算），输出 10×10×16。

    - S4 平均池化：2×2，输出 5×5×16。

    - C5 卷积层：120 个 5×5 卷积核，输入 5×5，输出 1×1×120（可视为全连接）。

    - F6 全连接层：84 个神经元。

    - 输出层：10 个神经元（对应数字 0-9），使用 RBF 作为损失（后来常用 softmax）。

    奠定基本组件：

    - 卷积 + 下采样（池化）+ 全连接的基本流水线。

    - 使用卷积核提取局部特征，池化降低分辨率和引入平移不变性。

    - 多层特征层次结构：低层检测边缘、角点，高层组合成复杂模式。

    - 使用反向传播进行端到端训练。

    - 这些构成了现代 CNN 的雏形。


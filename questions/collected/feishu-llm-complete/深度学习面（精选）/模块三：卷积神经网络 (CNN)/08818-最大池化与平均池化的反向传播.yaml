    实现细节（PyTorch）
    框架会自动处理反向传播，只需使用 torch.nn.MaxPool2d 或 torch.nn.AvgPool2d 即可。对于最大池化，PyTorch 的 CUDA 实现高效利用了位置索引；对于平均池化，会按照窗口大小均匀分配。


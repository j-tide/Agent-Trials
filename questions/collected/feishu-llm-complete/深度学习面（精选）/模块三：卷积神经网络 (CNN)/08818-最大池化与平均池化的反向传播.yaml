  reference_answer: |-
    最大池化的反向传播

    对于最大池化，前向传播时需记录最大值的位置（索引）。反向传播时，上游梯度只传给这个最大值对应的位置，其他位置的梯度为零。这种方式相当于一个稀疏梯度路由：梯度只通过池化窗口内贡献最大的那个单元回传，其余神经元不获得更新信号。这有助于保留最强特征，但在某些情况下也可能导致信息丢失（梯度阻塞）。具体步骤：

    - 保存最大值的位置掩码（argmax）。

    - 将上游梯度张量按照掩码展开成与输入相同的形状，最大值位置置为对应梯度，其余为零。


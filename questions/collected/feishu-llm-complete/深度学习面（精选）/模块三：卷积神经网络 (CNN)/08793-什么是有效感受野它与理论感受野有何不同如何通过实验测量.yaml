content:
  prompt: 什么是“有效感受野”？它与理论感受野有何不同？如何通过实验测量？
answer:
  mode: rubric
  reference_answer: |-
    有效感受野 (Effective Receptive Field, ERF)

    理论感受野区域内每个像素对输出神经元的影响并不相同，中心区域的像素影响大，边缘像素影响小，呈二维高斯分布形状。有效感受野指实际对输出有显著贡献（梯度绝对值较大）的输入区域。

    原因：

    - 卷积核的多次叠加导致输入信号的中心像素被反复加权（多路径），而边缘像素参与的计算路径少，且多层随机初始化使得影响向中心集中。

    - 非线性激活（如 ReLU）也会破坏均匀分布。

    - 经过多层的复合效应，最终影响分布趋于高斯。

    与理论感受野的不同：理论感受野是一个硬边界，有效感受野是软性的，只有部分区域真正驱动神经元。

    实验测量方法：

    - 梯度法：将输出层某个神经元对输入的梯度可视化。在输入图像上计算损失对该神经元激活值的导数，取绝对值，得到输入各像素的重要性热图。进行多次随机初始化或使用不同样本的平均，即可得到有效感受野分布。通常呈现为以理论感受野中心为中心的高斯衰减。

    - 遮挡法：系统地遮挡输入区域，观察输出激活的变化，以此推测重要区域。

    - 反向累积法：从输出层反向逐层递推梯度的期望值，直到输入层，分析各位置梯度的方差或期望。

    有效感受野的概念对于理解网络真正利用了多少上下文至关重要，设计网络时应确保有效感受野覆盖目标。


content:
  prompt: DenseNet 的密集连接是如何工作的？它与 ResNet 的加法连接有何不同？
answer:
  mode: rubric
  reference_answer: |-
    密集连接：

    [图片内容未导入]

    与 ResNet 的不同：

    - ResNet 使用逐元素相加（summation），将恒等映射与残差合并，前后特征图维度不变。

    - DenseNet 使用通道拼接（concatenation），将历史特征累积在一起，通道数随深度增加。这鼓励特征复用，并大幅减少了参数，因为深层可以利用前面所有层的特征，而无需重新学习冗余特征。

    优点：改进梯度流动，更高效的特征传播，参数更少。


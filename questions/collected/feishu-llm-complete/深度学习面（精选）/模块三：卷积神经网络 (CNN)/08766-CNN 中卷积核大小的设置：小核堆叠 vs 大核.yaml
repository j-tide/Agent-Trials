content:
  prompt: CNN 中卷积核大小的设置：小核堆叠 vs 大核
answer:
  mode: rubric
  reference_answer: |-
    常用设置

    绝大多数现代 CNN 使用 3×3 卷积 作为基本组件（如 VGG、ResNet），有些会结合 1×1、5×5，但大核（7×7 以上）通常仅在第一层或特定结构中出现。早期网络（如 AlexNet）使用较大的卷积核（11×11、5×5），但后来被小核堆叠取代。

    小核堆叠的优势

    [图片内容未导入]

    - 更强的非线性：每个卷积层后通常跟随激活函数（如 ReLU），两个 3×3 层之间多了一个非线性变换，增强了模型的表达能力和决策函数的复杂性。一个 5×5 卷积只有一个激活层。

    - 相同的感受野：两个 3×3 卷积的堆叠，其有效感受野等于一个 5×5 卷积。三个 3×3 卷积的感受野相当于一个 7×7 卷积。因此用小核可以获得与大核相同的感受野。

    - 更高效的表示：堆叠小核构成的多层结构提供了更丰富的特征层次，底层可提取简单局部特征，高层组合为更复杂模式。大核容易引入过多的空间局部平滑，而小核堆叠得到的特征更加结构化。

    第一层卷积往往使用较大的核（如 7×7，步长 2）以便迅速扩大感受野并减少计算量，这是出于计算和内存的实际考虑，但仍可替换为多个 3×3。

    因此，主流架构几乎全部采用 3×3 小核堆叠，并辅以 1×1 卷积调节维度。


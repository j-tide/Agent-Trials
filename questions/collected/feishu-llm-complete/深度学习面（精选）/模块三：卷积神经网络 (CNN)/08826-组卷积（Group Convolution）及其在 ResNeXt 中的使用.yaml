    组卷积原理
    标准卷积在输入的所有通道上进行滤波。组卷积将输入通道和卷积核分为 G 组，每组内的卷积核只处理对应组的输入通道，组与组之间没有信息交互。最后各组输出在通道维度上拼接。

    [图片内容未导入]

    在 ResNeXt 中的使用

    ResNeXt 引入了“基数（cardinality）”的概念，实际上就是采用组卷积来构建残差块。它将 Inception 模块中“分割-变换-合并”的思路统一为使用相同拓扑的并行路径，每条路径执行一个低维的 1×1 卷积降维，再进行 3×3 组卷积（组数=基数），然后再用 1×1 卷积升维。通过调整基数（即组的数量），在保持总复杂度不变的情况下，可以增加模型的容量和准确性。ResNeXt 证明，增加基数比单纯增加深度或宽度能更有效地提升性能。

    示例：ResNeXt-50 使用 32 组（基数=32），每个瓶颈块内 3×3 卷积的组数为 32，输入输出通道压缩为 4d，形成一个紧凑高效的多路结构。


  prompt: 卷积为什么能捕捉局部特征？与全连接层相比的优势
answer:
  mode: rubric
  reference_answer: |-
    捕捉局部特征的原理

    卷积核每次只计算一个小的局部窗口（如 3×3 或 5×5）内的加权和，因此它直接编码“局部连接性”。图像和序列数据具有局部相关性（相邻像素、相邻词之间关系更紧密），卷积核学习到的权重正是对特定局部模式的检测器，比如边缘、角点、颜色斑点等。通过堆叠多个卷积层，浅层捕捉简单局部特征，深层则将这些局部特征组合成更大范围的全局模式。

    与全连接层相比的优势

    [图片内容未导入]

    - 平移等变性：卷积运算具有平移等变性质，即输入图像平移，输出特征图也相应平移。这使得模型能够识别出现在任意位置的同一特征，极大提升了泛化能力。全连接层没有这种性质。

    - 局部感受野：卷积强制神经元只关注局部区域，符合自然数据的局部结构先验，避免了全连接层学习不必要的全局连接。这种归纳偏置在数据有限时非常重要。

    - 计算高效：卷积可以通过矩阵乘法和 FFT 等快速算法实现，且现代硬件对其有极致优化。

    因此，卷积比全连接层更适用于图像、音频等具有空间/时间结构的数据。


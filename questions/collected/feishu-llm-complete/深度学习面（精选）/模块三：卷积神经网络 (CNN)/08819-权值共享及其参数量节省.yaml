content:
  prompt: 权值共享及其参数量节省
answer:
  mode: rubric
  reference_answer: |-
    权值共享的概念

    在卷积层中，同一个卷积核在整个输入特征图的不同位置上滑动，所有权重参数在所有位置共享。这意味着无论特征出现在输入的哪个位置，都使用相同的权重进行检测。不同于全连接层中每个输入-输出连接都有独立的参数，卷积层的参数集只限于核本身的元素。

    体现

    例如一个 3×3 的卷积核，滑动过 100×100 的输入，它只包含 9 个权重（以及 1 个偏置），而不是 10000×输出的全连接权重。

    参数量节省的量化

    [图片内容未导入]

    - 例如输入 224×224×3，输出 224×224×64，卷积核 3×3：参数量 = 3×3×3×64 = 1,728。若使用全连接，参数量将达到 224×224×3 × 224×224×64 ≈ 6.9×10^11，不可行。

    权值共享极大地压缩了模型，使得深度卷积网络可以训练，并成为强大的正则化器。


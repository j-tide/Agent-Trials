content:
  prompt: DenseNet 中，特征复用如何实现？增长率（Growth Rate）是什么？
answer:
  mode: rubric
  reference_answer: |-
    特征复用：由于每一层都能看到前面所有层的输出（拼接），网络可以重复利用低层特征，不需要重复学习相同的模式。高层可以直接从浅层提取的边缘、纹理等信息中获益，使得网络更紧凑。

    [图片内容未导入]

    参数量少的原因：每个卷积层（通常 3×3）的输入通道数虽然随深度增加，但增长率小，且每层仅需学习 k 个新特征，许多特征被复用，因而总参数量远小于传统 CNN。


answer:
  mode: rubric
  reference_answer: |-
    上采样原理
    转置卷积并非正向卷积的逆运算，而是一种可学习的上采样方法。它将输入特征图的每个像素乘以一个卷积核，然后把结果按照步长“平铺”到输出特征图上，重叠区域相加。实际上，它等价于在输入像素之间插入 S−1 个零，然后进行标准卷积。这可以恢复更大的空间尺寸。

    标准实现：输入尺寸 i，核大小 k，步长 s，填充 p，输出尺寸 o 满足：

    [图片内容未导入]

    这个公式刚好是正向卷积的输出公式反解 ii 得到。

    棋盘效应 (Checkerboard Artifacts)

    当转置卷积的步长大于 1，且卷积核大小不能被步长整除时，输出特征图的某些位置会比其他位置被更多次的核覆盖，导致亮度不均匀，呈现出棋盘格状的伪影。这是因为平铺叠加时，重叠区域的值被多次相加，而某些区域未被平等覆盖。

    解决方案

    - 使用可以被步长整除的核大小（如步长 2 时，核大小 4×4 而非 3×3）。

    - 采用“先上采样（双线性插值或最近邻）再标准卷积”的策略，这样可以完全避免棋盘效应。

    - 在生成模型（如 GAN）中，常用 resize-convolution 替代转置卷积。


content:
  prompt: 卷积核、步长、填充（Padding）的作用与输出尺寸计算
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - 卷积核 (Kernel/Filter)：卷积核是一个权重矩阵，在输入数据上滑动，对局部区域进行加权求和，以提取某种特征（如边缘、纹理）。每个卷积核学习一种特定的模式，多个卷积核构成一层，分别提取不同特征。卷积核的大小（如 3×3、5×5）决定了局部感受野的大小。

    - 步长 (Stride)：卷积核滑动的步幅。步长越大，输出特征图在空间维度上缩小越快，计算量也越小，但可能丢失细节信息。通常步长为 1 时保留较多空间信息，步长为 2 常用于下采样。

    - 填充 (Padding)：在输入特征图的四周添加额外像素（通常为零值），用于控制输出尺寸，并让边缘像素也能被充分利用。填充可以防止空间维度过快缩小，并允许边缘信息更好地参与卷积。

    [图片内容未导入]

    对于正方形输入、核和步长，公式相同。地板函数 ⌊⋅⌋表示当滑动窗口超出边界时停止（即舍弃最右侧和底部的不完整窗口）。如果不需要舍弃，PyTorch 中也支持“ceil_mode”，但默认是 floor。

    举例：输入 32×32，核 3×3，步长 1，填充 1（即每边加 1 个像素），则输出为 (32+2-3)/1+1=32，尺寸不变。若步长 2，填充 0，则输出 (32-3)/2+1 = 15（向下取整），尺寸减半。


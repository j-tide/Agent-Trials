    为什么这样做

    训练时的多分支带来类似 ResNet 的优化好处（缓解梯度消失），而推理时的单路 VGG 结构充分利用现代硬件对 3×3 卷积的极致优化（内存带宽利用率高、计算密度大），实现更高吞吐和更低延迟。这种解耦训练与推理架构的策略是重参数化的核心思想。


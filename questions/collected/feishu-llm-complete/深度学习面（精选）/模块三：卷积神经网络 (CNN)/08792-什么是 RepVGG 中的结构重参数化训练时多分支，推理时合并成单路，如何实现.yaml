content:
  prompt: 什么是 RepVGG 中的结构重参数化？训练时多分支，推理时合并成单路，如何实现？
answer:
  mode: rubric
  reference_answer: |-
    结构重参数化（Structural Re-parameterization）

    RepVGG 在训练时使用多分支拓扑（类似于 VGG 的 3×3 卷积 + 1×1 卷积 + 恒等映射分支），以利用多分支的训练优势（如同 ResNet 的多路径，易于优化、梯度流动好）。而在推理时，将所有分支等价合并为一个单独的 3×3 卷积，使得推理时模型仅为一个简单的 VGG 风格直筒网络，无任何分支，速度极快。


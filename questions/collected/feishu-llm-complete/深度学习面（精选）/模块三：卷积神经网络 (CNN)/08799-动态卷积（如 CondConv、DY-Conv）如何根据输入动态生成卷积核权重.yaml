content:
  prompt: 动态卷积（如 CondConv、DY-Conv）如何根据输入动态生成卷积核权重？
answer:
  mode: rubric
  reference_answer: |-
    动态卷积的思想是卷积核的参数不再是固定的，而是根据输入内容动态生成，以提升模型容量和适应性，同时保持推理时的高效性（通过合并多套核）。

    CondConv（Conditionally Parameterized Convolutions）

    [图片内容未导入]

    - 然后用这个动态合成的卷积核执行标准卷积操作。

    - 由于每个样本甚至每个空间位置都可以有不同的组合权重，模型能根据不同输入自适应地选择特征提取模式，极大地增强了表达能力。推理时，只需求出加权核并应用于卷积，计算量仅略高于标准卷积（增加路由函数的开销）。

    DY-Conv（Dynamic Convolution）

    类似于 CondConv，但进一步考虑了空间动态性：每个空间位置可以有不同的核组合。它在通道注意力上做了更精细的设计，但基本思想仍然是利用轻量级网络根据输入生成权重系数，混合多个静态核。

    关键点：

    - 通过动态组合，静态模型可以表现出多模型集成的能力，在相同计算量下取得更高的精度。

    - 训练时容易陷入局部最优（因为 N 个核和路由函数需协同学习），需要特殊的训练策略（如使用较大的学习率或核的初始化策略）。

    - 在图像分类、目标检测等任务中，CondConv/DY-Conv 以较小的 FLOPs 增加换来了显著的性能提升。


content:
  prompt: 什么是 3D 卷积？它适用于什么类型的数据？
answer:
  mode: rubric
  reference_answer: |-
    3D 卷积

    [图片内容未导入]

    适用数据

    - 视频数据：帧序列可视为 3D 体数据（时间×高×宽）。3D 卷积可以捕获帧间的运动信息和时空特征，广泛应用于动作识别（如 C3D、I3D）、视频分类、视频分割。

    - 医学三维影像：CT、MRI 扫描是真实的 3D 体素数据（如脑部扫描的 3D 体积）。3D 卷积能够直接在三维空间中提取病变特征，进行器官分割等任务（如 3D U-Net）。

    - 点云体素化：在三维点云处理中，有时将点云转化为体素网格，再用 3D 卷积处理。

    - 也可用于某些立体视觉任务中的深度维度。

    计算量与内存：3D 卷积的计算量和参数量比 2D 卷积大得多，通常需要使用较浅网络或分解卷积（如 (3,1,1)+(1,3,3) 分离卷积）来降低开销。


content:
  prompt: 如何从零搭建一个图像分类网络？你会参考哪些设计原则？
answer:
  mode: rubric
  reference_answer: |-
    从零搭建一个图像分类网络，需综合考虑任务数据量、计算资源和目标性能。参考设计原则：

    - 基础组件选择

    - 卷积核大小：优先使用 3×3 小卷积核堆叠，感受野和参数量的最优平衡；初始层可用 7×7 较大核配合 stride 快速降采样。

    - 下采样：使用步长为 2 的卷积代替池化，保留学习能力；也可配合 2×2 max pool。

    - 归一化：如果 batch size 足够大，用 BN；若 batch 小或部署到移动端，用 GN 或 LN。

    - 激活函数：ReLU 或 GELU/SiLU。深层网络优先 ReLU 或 Swish 变体。

    - 残差连接：必须组件，帮助训练深层网络，缓解退化。

    - 网络架构设计

    - 阶段划分：将网络分为多个阶段，每个阶段内特征图尺寸不变，过渡时下采样并增加通道数（通常倍增通道）。

    - 全局平均池化：在分类头前用 GAP 代替重型全连接，减少过拟合和参数。

    - 深度和宽度的平衡：遵循 EfficientNet 的复合缩放思想，协同增加深度、宽度和分辨率，而非单一维度扩增。

    - 分支策略：可以借鉴 Inception 的多分支多尺度，或 ResNeXt 的分组卷积增加基数，或用 SE 注意力增强。

    - 轻量级设计（如果资源受限）

    - 使用深度可分离卷积、倒置残差块（MobileNet 系列）。

    - 控制通道扩展因子，避免爆炸。

    - 利用 1×1 卷积降维和升维，减少昂贵卷积的计算量。

    - 训练友好设计

    - 避免梯度瓶颈：使用预激活（BN→ReLU→Conv）或恒等 shortcut。

    - 合理初始化：He 初始化配合 ReLU。

    - 学习率调度：余弦退火或阶梯衰减。

    - 硬件效率

    - 少用碎片化操作（如大量小核串联或过多分支），硬件不友好。

    - 尽量使用标准卷积、1×1 卷积、可优化深度卷积。

    - 使用相同尺寸的卷积，避免过多 reshape。

    - 可扩展性

    - 预留超参数（宽度乘数、深度乘数、分辨率乘数）以便缩放。

    - 遵循 EfficientNet 的做法搜索最优缩放系数。

    实践流程

    - 确定 baseline（如一个小型 ResNet 或 MobileNet 变体）。

    - 在验证集上训练、评估。

    - 逐步引入改进模块（SE、深度可分离等），观察提升。

    - 进行超参数调整，得到最终模型。


content:
  prompt: 增大感受野的方法有哪些？空洞卷积、大核卷积、池化、步长卷积各有什么优缺点？
answer:
  mode: rubric
  reference_answer: |-
    - 增加网络深度（堆叠小卷积核）：感受野随深度线性增长，且增加非线性，是首选方法。但可能引入梯度问题，需要残差连接等辅助。

    - 大核卷积：单个大核（如 7×7）直接提供大感受野。优点：简单，初期迅速扩大感受野。缺点：参数量大（随核大小平方增长），计算量大，缺少非线性堆叠的好处，且大核容易对输入进行过度平滑或难以学习细粒度特征。现代网络通常只在前几层使用一个 7×7 卷积来快速降采样和扩大感受野。

    - 池化（Max/Avg Pooling）：每次池化（步长 2，核 2×2）使空间尺寸减半，同时将感受野加倍。优点：无参数，计算极快，可引入平移不变性。缺点：丢失空间细节，无法复原，对密集预测任务不利；另外池化本身没有学习能力，只是固定下采样。

    - 步长卷积（Strided Convolution）：用步长>1的卷积替代池化进行下采样。优点：有可学习的参数，网络可以学习如何下采样，比固定池化更具表现力；同时扩大感受野。缺点：计算量略高于池化，但可控。现代网络多用步长卷积代替池化（如 ResNet 的 stem 层用 7×7 stride 2）。

    - 空洞卷积：不进行下采样，通过注入空洞来指数级扩大感受野而不增加参数量。优点：保持特征图分辨率，非常适合语义分割等需要密集输出的任务；可在不降低分辨率的情况下聚合多尺度上下文。缺点：可能产生网格效应（当空洞率过大时，采样点过于稀疏，导致局部信息丢失）；连续使用相同的空洞率会造成部分像素从未被利用；计算时内存带宽需求可能增加，实现上需优化。通常会采用一系列渐进增大的空洞率（如 1,2,4）或混合使用。


content:
  prompt: 在设计网络时，如何确保最后一个卷积层的感受野能够覆盖输入图像的关键区域？
answer:
  mode: rubric
  reference_answer: |-
    策略：

    - 理论感受野计算：递推计算直到最后一层，确保其理论感受野 > 输入图像尺寸（或至少接近）。

    - 有效感受野分析：即使理论感受野覆盖全图，有效感受野可能只有中央的一小部分。因此需要使目标对象落在有效感受野的高权区域。通常通过以下手段：

    - 实验验证：绘制有效感受野热图，确保关键物体区域落入激活较高区域。如果发现有效感受野过小，可以增加上下文模块（如 PSPNet 的金字塔池化、ASPP）来显式聚合多尺度信息。

    - 对于分类网络，通常通过架构设计保证最后 7×7 特征图上每个像素的感受野能覆盖 224×224 的大部分（如 ResNet 的感受野约 483×483，远大于输入，有效感受野覆盖核心区域足够）。对于分割，即使编码器感受野足够，解码器恢复分辨率时也要配合 skip connection 保证细节。最后输出层的感受野设计要能满足任务对上下文的需求。

    以上是对各个问题的全面回答，涵盖了感受野理论、计算量分析和实际网络设计原则。

    - 增加网络深度：堆叠更多层使感受野和有效感受野自然增大。

    - 使用下采样（池化或步长卷积）：下采样让后续层的一个像素对应更大的输入区域，感受野快速扩大。

    - 采用空洞卷积：在不损失分辨率的情况下扩大感受野，特别适合分割任务，使得深层特征仍能覆盖全图。

    - 全局池化：在最后使用 GAP 直接汇聚全图信息，感受野直接覆盖全图。

    - 多尺度特征融合：利用特征金字塔等方式，使不同层级的特征都参与最终决策，兼顾小感受野（细节）和大感受野（上下文）。

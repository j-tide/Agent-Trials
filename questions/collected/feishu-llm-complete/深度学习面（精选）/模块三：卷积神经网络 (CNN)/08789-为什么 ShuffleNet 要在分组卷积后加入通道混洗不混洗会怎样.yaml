content:
  prompt: 为什么 ShuffleNet 要在分组卷积后加入通道混洗？不混洗会怎样？
answer:
  mode: rubric
  reference_answer: |-
    问题：分组卷积将输入通道隔离，组内独立操作，组间信息无法流通。如果连续使用多个分组卷积，输出特征将完全局限在各组内部，通道之间没有交互，这会严重限制网络的学习能力，变成孤立的多路独立网络，无法融合跨组特征。

    通道混洗（Channel Shuffle）

    ShuffleNet 在分组卷积之后，对输出的通道进行重排：将通道划分为若干组，然后均匀打乱，使得下一次分组卷积时，每个输入组都包含来自上一阶段所有组的通道。这在不增加参数和计算的情况下实现了跨组信息流通。

    不混洗的后果：

    - 连续分组卷积退化为多个并行的、互相独立的弱子网络，特征多样性受限。

    - 网络的表示能力大幅下降，因为无法学习到跨组特征组合。

    - 实验表明，没有通道混洗时，即使增加深度，精度也会饱和乃至下降。

    因此，通道混洗是 ShuffleNet 高效且有效的关键设计，实现了轻量级架构中的跨通道信息交换。


content:
  prompt: 什么是“长期依赖”问题？LSTM 真的完全解决了它吗？
answer:
  mode: rubric
  reference_answer: |-
    长期依赖问题

    在序列建模中，某个时间步的输出可能依赖于很远的输入。例如，预测一段文本后续的词，可能需要几百个词之前的上下文。对RNN而言，由于梯度消失，信号在时间上反向传播时呈指数衰减，导致网络几乎无法学习到跨越长距离的依赖性。

    LSTM 是否完全解决？

    LSTM 通过细胞状态和门控机制，提供了一条可以让梯度相对无损传播的线性路径，能够捕捉比普通RNN长得多的依赖（通常到几百步）。但它并未完全解决长期依赖问题，原因如下：

    - 遗忘门和输入门的饱和仍然会导致梯度衰减。若遗忘门偶尔关闭（接近0），该时刻之前的信息就会被截断。

    - 记忆容量有限：细胞状态是固定长度的向量，不能无限存储历史细节。

    - 对超长序列（数千步），即使是LSTM也会出现梯度消失或记忆遗忘。

    - 实验证明，在需要精确回忆极远信息的任务（如复制任务、长距离问答）上，LSTM 的表现仍会随着序列长度增加而下降，而注意力机制可以直接寻址，效果更好。

    因此，LSTM 只是显著缓解了长期依赖，并没有根本解决任意长度依赖的问题。真正突破这一限制的是基于注意力机制的Transformer，它能直接访问所有时间步的信息。


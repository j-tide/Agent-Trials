content:
  prompt: 12. 训练 Seq2Seq 模型时，输入序列和输出序列是否需要反转？为什么以前这么做？
answer:
  mode: rubric
  reference_answer: |-
    曾经的做法
    在早期的神经机器翻译（Sutskever et al., 2014）中，将输入句子反转（reverse）后再喂给编码器，即输入 ABC 变成 CBA，而目标句子保持正常顺序。这样做的目的是缩短源句首部与目标句首部之间的“时间步距离”，使模型更容易学会开头的对齐。因为梯度从解码器早期时间步传到编码器早期时间步的路径变短了。

    为什么不再必要

    - 注意力机制的引入：注意力直接建立了任意解码步到任意编码步的快捷连接，彻底解决了长距离梯度问题，输入顺序不再关键。

    - 实验证明：对有注意力的 Seq2Seq，反转带来的收益微乎其微，甚至有时有害（打乱自然语序）。

    - 现代化方案：使用双向编码器，无论正序反序，编码器都能捕获完整上下文。

    因此，当前 Seq2Seq 模型（如 Transformer）输入保持原始顺序，不再反转。

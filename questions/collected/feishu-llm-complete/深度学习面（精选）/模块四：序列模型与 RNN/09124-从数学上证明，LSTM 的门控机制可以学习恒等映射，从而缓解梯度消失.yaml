content:
  prompt: 从数学上证明，LSTM 的门控机制可以学习恒等映射，从而缓解梯度消失。
answer:
  mode: rubric
  reference_answer: |-
    核心思想：如果 LSTM 的所有门控学会了正确的模式，可以让信息无损地流过许多时间步，相当于恒等映射。我们通过证明细胞状态的梯度流近似为 1 来实现。

    LSTM 细胞状态更新：

    [图片内容未导入]

    结论：数学上，只要存在一条恒等映射路径（细胞状态），梯度就可绕过非线性压缩直接回传，而门控机制赋予网络学习这种映射的能力。这就是 LSTM 缓解梯度消失的理论基础。

    - 输入层：将字符索引映射为可学习的嵌入向量（Embedding）。

    - 循环层：一层或多层 LSTM/GRU，接收嵌入序列，输出隐藏状态序列。

    - 输出层：线性层将隐藏状态映射到字符表大小的 logits，经过 softmax 得到下一个字符的概率分布。

    - 将输入序列和目标序列错位一个字符：输入为 "hell"，目标为 "ello"（预测下一个字符）。

    - 使用交叉熵损失计算每个时间步的预测误差，求和或取平均。

    - BPTT 训练（或截断 BPTT），更新参数。

    - 给定一个起始字符或序列，将其输入 RNN，得到下一个字符的概率分布，依据此分布采样一个字符。

    - 将采样字符作为下一步的输入，重复过程生成任意长度的文本。

    作用

    - 增强门控的精确性：让门控直接了解细胞状态的内存内容，使其决策更加精细。比如，当细胞状态包含重要信息时，遗忘门可以更好地决定是否保留；输出门可以根据当前状态决定输出哪些部分。

    - 改善对时间序列细微模式的捕捉，在某些任务中（如语音识别）能带来小幅性能提升。

    - 增加额外的参数（每个门多一个与细胞状态维度相同的权重矩阵），计算复杂度稍有增加。

    注意：标准 LSTM 通常不包含窥视孔连接，它属于可选的扩展。许多主流框架（如 PyTorch）默认不开启窥视孔。


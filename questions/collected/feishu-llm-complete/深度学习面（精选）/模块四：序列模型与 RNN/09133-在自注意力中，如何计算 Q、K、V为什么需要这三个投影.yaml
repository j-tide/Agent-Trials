content:
  prompt: 在自注意力中，如何计算 Q、K、V？为什么需要这三个投影？
answer:
  mode: rubric
  reference_answer: |-
    Q、K、V 的计算

    [图片内容未导入]

    为什么需要这三个投影？

    - 查询和键：用于计算输入序列中每对位置之间的相似度/对齐分数。Q 和 K 实际上构成了一个“信息检索”系统：查询 Q 代表“我想要找什么”，键 K 代表“我有什么内容”。它们的点积度量匹配程度，生成注意力权重。

    - 值：携带实际要聚合的信息。根据查询-键匹配的权重，对 V 进行加权求和。V 可以与 K 相同，但通过不同的投影，网络可以解耦“用于比较的特征”（K）和“需要传递的特征”（V）。例如，K 可以关注位置或语义，V 则可以保留具体的单词信息。

    - 增强表达能力：若不投影（即直接使用原始输入作为 Q, K, V），模型就只能依赖原始特征空间的相似度，无法灵活变换。投影让模型学习到最适合对齐的子空间，不同头还可以学习不同的投影，提取不同类型的依赖。

    [图片内容未导入]

    一句话总结：Q、K、V 投影使得自注意力能够以可学习的方式灵活衡量输入序列自身各部分之间的关联，并据此选择性聚合信息，是实现上下文感知表示的核心机制。


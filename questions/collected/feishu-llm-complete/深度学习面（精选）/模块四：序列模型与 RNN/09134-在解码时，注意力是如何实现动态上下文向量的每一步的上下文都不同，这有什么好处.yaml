content:
  prompt: 在解码时，注意力是如何实现“动态上下文向量”的？每一步的上下文都不同，这有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    实现机制

    [图片内容未导入]

    好处

    - 精准对齐：生成不同的目标词时，模型可以关注源句的不同部分。例如，翻译“He bought a car”时，生成“他”关注“He”，生成“买了”关注“bought”，生成“车”关注“car”。这种“选择性阅读”极大提高了正确性。

    - 信息解耦：每个输出步骤不需要携带所有源信息，上下文向量只包含当前最相关的特征，使得解码器可以专注于生成正确词，降低了学习难度。

    - 灵活处理变长序列：无论输入多长，注意力都能通过权重分布选出重点，不会因为序列拉长而稀释关键信息。

    - 可解释性：注意力权重可视化后，可以直观看到源和目标之间的对齐关系。

    因此，动态上下文向量是 Seq2Seq 模型跨越“固定长度瓶颈”的关键创新。


  reference_answer: |-
    推理时的输入

    推理（测试/生成）时，没有真实标签可用。解码器必须使用自己上一步预测出的词作为下一步的输入。流程：

    - 输入 <sos>，模型产生词汇表上的概率分布。

    [图片内容未导入]

    曝光偏差的解决方案

    曝光偏差的根本原因是训练和推理时解码器输入分布不匹配。解决方法主要包括：

    - Scheduled Sampling（计划采样）
    在训练时，以概率 ϵ 使用模型自己的预测作为下一输入，以概率 1−ϵ 使用真实标签。ϵ 通常从 0 逐步增加到某个值。这使得模型在训练期间就学会了处理自己产生的错误。缺点是可能破坏 RNN 的时间结构，且可能引入偏差。

    - 序列级训练目标
    使用 REINFORCE 算法或最小风险训练直接优化 BLEU/ROUGE 等序列级指标，推理时用模型生成序列然后计算奖励。这能直接降低推理时的误差，但训练不稳定，常与交叉熵预训练结合。

    - 教授强制中的“教学”感知
    Professor Forcing 使用 GAN 的思想，让判别器区分真实隐藏状态轨迹和由模型自回归生成的隐藏状态轨迹，引导模型的自回归状态接近教师强制状态。

    - 更好的网络结构
    Transformer 在训练时虽然也使用 Teacher Forcing（并行输入真实前缀），但推理时自回归解码，通过大规模数据和强表示能力缓解了曝光偏差的实际影响。此外，Copy mechanism 也能帮助模型直接从输入复制标记，减少错误生成。

    - 桥接分布
    BERT 等预训练模型的引入使得 Seq2Seq 在微调时具有更强的泛化能力，间接减轻曝光偏差。


  reference_answer: |-
    窗口化滑动方法

    给定一个长序列，使用一个固定长度的滑动窗口将其切成多个“输入-目标”样本对：

    - 输入窗口：长度为 LL 的历史观测值（如过去 24 小时的温度）。

    - 目标窗口（预测窗口）：紧跟输入窗口之后的一段长度为 HH 的未来值（如未来 6 小时温度）。
    滑动步长（stride）通常为 1 个时间步，以尽可能多地生成样本。


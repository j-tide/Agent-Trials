    注意事项

    - 数据泄露：确保测试集或验证集的样本完全在时间上晚于训练集，不能有重叠，否则未来信息会泄露到训练中。

    - 平稳性：对于非平稳序列，可通过差分、去趋势等预处理使窗口内特征更稳定。

    - 批处理：若存在多个独立时间序列，可分别窗口化后混合。注意不同序列的尺度应一致或归一化。

    - 多步预测：目标窗口可以是多个值，可采用直接多输出、递归多步预测或 seq2seq 结构。

    - 边界处理：序列开头无法构建完整窗口时可以丢弃或特殊处理。

    - 时间特征：通常将绝对时间（小时、星期等）作为额外特征输入，需在窗口化时一并提取。

    示例：若序列长度为 1000，输入长度 100，输出长度 10，步长 1，则可生成约 891 个样本。


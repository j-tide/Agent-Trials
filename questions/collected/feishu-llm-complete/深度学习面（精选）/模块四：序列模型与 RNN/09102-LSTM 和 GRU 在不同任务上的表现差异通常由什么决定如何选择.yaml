content:
  prompt: LSTM 和 GRU 在不同任务上的表现差异通常由什么决定？如何选择？
answer:
  mode: rubric
  reference_answer: |-
    表现差异的决定因素

    - 数据量与序列长度：对于非常长的序列，LSTM 的独立细胞状态可能提供更稳定的记忆，表现略优。但在中等长度序列上，两者差距很小。

    - 任务复杂度：更复杂的序列建模（如语言建模、机器翻译）中，LSTM 的额外门控能力可能带来小幅度提升。简单任务上 GRU 更容易训练，效果相当。

    - 计算资源：GRU 参数量约为 LSTM 的 3/4，训练和推理更快，适合资源受限场景。

    - 超参数调优：GRU 对某些超参数不那么敏感，鲁棒性较好。具体任务上，经过充分调优的 LSTM 常能达到略高的上限，但边际收益可能不如直接使用更多数据或更大模型。

    如何选择

    - 如果追求极致性能且有足够计算资源，优先尝试 LSTM（或双向 LSTM）。

    - 若需要快速实验、部署到移动端或模型尺寸受限，GRU 是更好的默认选择。

    - 实践中，两者经常互换使用。许多 NLP 库（如 PyTorch）提供 LSTM 和 GRU 模块，可方便替换对比。

    - 当梯度消失问题显著时，两者表现均远优于 vanilla RNN，但具体选哪个往往通过验证集比较决定。


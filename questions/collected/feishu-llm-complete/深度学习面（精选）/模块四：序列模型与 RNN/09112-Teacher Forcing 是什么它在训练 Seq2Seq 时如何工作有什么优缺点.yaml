content:
  prompt: Teacher Forcing 是什么？它在训练 Seq2Seq 时如何工作？有什么优缺点？
answer:
  mode: rubric
  reference_answer: |-
    Teacher Forcing（教师强制）

    Teacher Forcing 是一种训练自回归模型的标准策略。在训练 Seq2Seq 解码器时，不使用模型自己上一步预测的词作为下一步的输入，而是强制使用真实标签（目标序列中的词） 作为下一时间步的输入。

    工作机制

    [图片内容未导入]

    这样，损失的梯度可以从每个时间步直接回传，因为输入不依赖于模型的采样，计算图是确定性的，且可以高效地并行训练（通过右移目标序列作为输入，一次性计算所有时间步的预测）。

    优点

    - 加速收敛：模型始终看到正确的上下文，避免错误累积，梯度更稳定。

    - 训练高效：可以通过矩阵运算同时计算整个序列的损失，而不必逐个时间步串行。

    缺点

    - 曝光偏差（Exposure Bias）：训练时模型一直看到的是真实数据分布（地面实况），推理时却只能看到自己生成的、可能有错误的词。如果模型在早期生成了一个错误的词，这个错误会作为后续的输入，导致误差累积，甚至完全跑偏。

    - 泛化能力受限：模型从未学习过如何在“有噪声的、自己的预测”下恢复，因此对推理时的错误非常敏感。

    缓解方法：

    课程学习（Scheduled Sampling）逐步用模型预测替代真实标签；使用强化学习直接优化序列级指标；或者改用 Transformer，其并行生成不需要 Teacher Forcing 的推理依赖问题，但训练时仍然常用 Teacher Forcing 和交叉熵损失。


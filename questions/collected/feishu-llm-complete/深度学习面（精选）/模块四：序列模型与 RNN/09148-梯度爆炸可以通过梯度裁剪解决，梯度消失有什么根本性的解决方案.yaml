content:
  prompt: 梯度爆炸可以通过梯度裁剪解决，梯度消失有什么根本性的解决方案？
answer:
  mode: rubric
  reference_answer: |-
    梯度爆炸的解决方案

    梯度裁剪：设定一个阈值，当梯度的 L2 范数超过该阈值时，将梯度缩放至该阈值以下。这保证了参数更新的最大步长，避免爆炸。

    梯度消失的根本性解决方案

    - 门控架构（LSTM、GRU）：通过门控机制（遗忘门、输入门）创建一条“恒定误差流”，使得梯度可以在时间上无衰减地回传。细胞状态的更新是线性累加，其导数接近 1，避免了连乘导致的衰减。

    - 使用 ReLU 类激活函数：IRNN 证明，使用 ReLU 并正确初始化循环权重矩阵为单位矩阵，可使梯度长时间保持稳定。但 ReLU 在 RNN 中可能导致激活爆炸，需配合梯度裁剪。

    - 正交初始化：将循环权重矩阵初始化为正交矩阵，其谱范数接近 1，能在早期保持梯度范数稳定，减少消失或爆炸风险。

    - 跳跃连接/高速公路网络：在时间维度上加入残差连接（如 Residual RNN），使梯度可以跳过非线性层传播。

    - 截断 BPTT：虽然不能根治，但通过限制反向传播的时间步长，避免极长序列导致的严重衰减。训练时常用。

    - 批归一化/层归一化：应用在时间维度上的归一化可以稳定隐藏状态的分布，有助于梯度流动。

    - 优化器选择：自适应优化器（如 Adam、RMSProp）通过调整每个参数的学习率，有助于减轻梯度消失的负面影响。

    - 根本性架构替代：Transformer 使用自注意力机制直接建模全局依赖，并通过残差连接和层归一化彻底解决了长距离梯度传播问题，在 NLP 中逐渐取代 RNN。

    从根本上说，改变循环状态更新方式，引入加性更新和恒定误差流是最有效的解决方案，LSTM 即是典范。


content:
  prompt: 在 Seq2Seq 中，上下文向量（Context Vector）是如何产生的？存在什么瓶颈？
answer:
  mode: rubric
  reference_answer: |-
    上下文向量的产生

    在最原始的 Seq2Seq 模型（Cho et al., 2014; Sutskever et al., 2014）中，编码器最后一个时间步的隐藏状态直接被作为上下文向量：

    [图片内容未导入]

    或者通过一个简单的变换（如 tanh⁡tanh 层）。无论输入序列多长，所有信息都必须压缩到这个固定维度的向量中。

    瓶颈

    - 容量限制：固定大小的向量难以完整保留长序列的全部语义和细节信息，尤其是序列很长时。这会导致信息丢失，对长句输入表现较差。

    - 梯度问题：长序列中，编码器后部的信号需要通过很多时间步反向传播到前端，导致梯度消失/爆炸，使得模型难以学习长距离依赖。

    - 对齐困难：解码器在每个生成时刻都只看到同一个全局向量，无法有选择地关注输入的不同部分。在翻译、摘要等任务中，输出词往往只与输入的局部片段相关，全局上下文向量无法提供这种细粒度的对齐。

    - 性能退化：随着输入长度增加，模型性能（如 BLEU）明显下降，尤其在机器翻译中，超过一定长度后准确率骤降。

    解决方案

    注意力机制（Bahdanau et al., 2015）的引入打破了这一瓶颈：解码器不再依赖单一的固定上下文向量，而是在每个时间步动态地生成一个加权上下文向量，有重点地读取编码器的各个隐藏状态。


content:
  prompt: RNN 的隐藏状态维度选择有何讲究？过小或过大有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    隐藏状态维度 是 RNN/LSTM 的关键超参数，决定了记忆容量和模型复杂度。

    过小

    - 容量不足，无法捕捉序列中的复杂模式和长期依赖，模型欠拟合，训练和测试损失都高。

    - 信息瓶颈：隐藏状态需要编码历史信息，维度太小会导致重要信息被丢弃，尤其对词汇量大或变化丰富的数据。

    - 可能影响梯度流，但主要问题是表示能力有限。

    过大

    [图片内容未导入]

    选择原则

    - 根据任务复杂度、数据集大小、序列长度来权衡。常见初始值：128、256、512，大型任务可能到1024或更多。

    - 可通过验证集调参，观察性能饱和点。

    - 对于层数较多的 LSTM，通常隐藏维度不必过大，深度可提供更多抽象。

    - 资源受限时，适度降低维度并增加层数可能比单层大维度更有效。


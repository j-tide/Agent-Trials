content:
  prompt: 什么是 Layer Normalization 在 LSTM 中的应用？它与 BN 相比，在 LSTM 中为何更合适？
answer:
  mode: rubric
  reference_answer: |-
    Layer Normalization (LN) 在 LSTM 中的应用

    LN 对每个样本的所有隐藏单元进行归一化，独立于 batch。在 LSTM 中，LN 可以加在：

    [图片内容未导入]

    为什么 LN 比 BN 更合适

    - 不依赖 batch 统计量：RNN 的序列长度可能不同，且 batch 内样本序列长度各异（需 padding），BN 在时间维度的统计极不稳定且无法正确处理变长序列。LN 对每个时间步、每个样本独立归一化，不受 batch size 和序列长度影响。

    - 训练与测试一致：BN 在测试时使用训练集全局统计量，而 RNN 的测试可能面对单样本或不同长度，全局统计量容易偏移。LN 训练和测试完全一致。

    - 梯度传播：LN 可以稳定循环状态，缓解梯度消失/爆炸，让深层 LSTM 训练更稳定。

    - 易于实现：在自定义 RNN 单元中插入 LN 层即可，无须像 BN 那样维护运行均值和方差。

    因此，LayerNorm LSTM 在序列模型中广泛使用，也是 Transformer 的基础组件。


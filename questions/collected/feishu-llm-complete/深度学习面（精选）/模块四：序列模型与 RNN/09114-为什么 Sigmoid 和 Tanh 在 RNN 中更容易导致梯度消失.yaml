content:
  prompt: 为什么 Sigmoid 和 Tanh 在 RNN 中更容易导致梯度消失？
answer:
  mode: rubric
  reference_answer: |-
    在 RNN 中，Sigmoid 和 Tanh 作为激活函数用于计算隐藏状态。它们的导数特性加剧了梯度消失：

    [图片内容未导入]

    在深层网络中，如果激活函数导数始终小于 1，则连乘后梯度呈指数衰减。RNN 的时间步通常很多，因此比普通前馈网络更容易出现梯度消失。即使 Tanh 导数最大为 1，一旦 Whh 的谱范数小于 1，梯度依然会消失。门控机制（如 LSTM）通过引入加性传递路径（细胞状态）使得导数可以不经过压缩的激活函数直接传播，从而缓解此问题。


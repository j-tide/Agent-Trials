content:
  prompt: 什么是时序数据的平稳性？对模型有什么影响？如何差分处理？
answer:
  mode: rubric
  reference_answer: |-
    平稳性

    时间序列的统计特性（均值、方差、自协方差）不随时间变化，称为强平稳；均值和方差恒定且自协方差仅依赖于时间间隔称为弱平稳（大多关注弱平稳）。许多经典模型（ARIMA）假设平稳性。平稳序列更易于建模，因为历史规律能稳定推广到未来。

    对模型的影响

    - 深度学习模型（RNN、LSTM）理论上能拟合非平稳趋势，但训练会更难，尤其当趋势和季节性幅度很大时，模型需要分配部分容量去学习随时间变化的基线。

    - 非平稳可能导致梯度尺度随时间波动，训练不稳定。

    - 模型可能学到伪相关，泛化差。

    - 通常消除趋势和周期性后，序列的动态范围变小，学习更容易。

    差分处理

    最常用的平稳化方法是差分：计算相邻观测值的差。

    [图片内容未导入]

    其他方法

    - 对数变换稳定方差。

    - 移动平均平滑。

    - 使用分解方法（STL）去除趋势和季节分量，对残差建模。

    在神经网络中，也可不显式差分，而使用归一化层（如 Instance Norm、Layer Norm）逐序列自适应处理，或采用 time2vec 等嵌入时间信息。但差分预处理仍常见于多变量、长序列预测中。


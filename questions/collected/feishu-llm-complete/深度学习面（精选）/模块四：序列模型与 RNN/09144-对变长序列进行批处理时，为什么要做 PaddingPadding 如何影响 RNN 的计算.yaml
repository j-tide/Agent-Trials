    [图片内容未导入]

    为什么要 Padding
    神经网络通常要求输入张量具有规则的形状。在一个批次内，不同样本的序列长度往往不同，为了将它们组合成一个规整的张量（如形状 [batch_size, max_len, feature_dim]），必须将所有序列填充到同一长度。常见的做法是在序列末尾添加特殊的标记（如 0）作为填充值，使每个样本达到批次内最长序列的长度。

    Padding 对 RNN 计算的影响

    - 无效计算：RNN 会逐时间步计算，即便是填充的位置也会参与矩阵乘法和激活，产生无效的计算输出和梯度。这些填充位置的输出没有实际意义，纯粹浪费计算资源。

    - 状态污染：如果不进行掩码处理，填充值（通常是零）会被当作正常输入，经过循环层影响隐藏状态，可能导致模型学习到错误的依赖关系。尤其是当填充位于序列开头时（例如语言模型中的前缀填充），这种影响更严重。

    - 梯度问题：填充位置产生的梯度会被累积，如果不屏蔽，可能使模型向无意义的方向更新。

    - 内存浪费：大量填充值会占用显存，降低有效计算比例。

    缓解方法

    - 使用 packing/masking 机制跳过填充位置的计算（见下问）。

    - 在损失函数中使用掩码忽略填充位置的贡献。

    - 对于 RNN 类网络，尽量减少 padding 占比，例如通过按长度排序、bucket 采样等。


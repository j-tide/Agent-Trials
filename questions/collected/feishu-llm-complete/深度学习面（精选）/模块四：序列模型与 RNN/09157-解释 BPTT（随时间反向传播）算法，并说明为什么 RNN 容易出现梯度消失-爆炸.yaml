    梯度消失/爆炸的原因

    展开后的 RNN 相当于一个非常深的网络（深度等于序列长度）。隐藏状态的梯度在反向传播时会连乘雅可比矩阵：

    [图片内容未导入]

    当反向传播经过 T 步时，累计梯度大约为：

    [图片内容未导入]

    [图片内容未导入]

    因此，RNN 难以学习长距离依赖，梯度要么消失（早期时间步学不到信息），要么爆炸（训练不稳定）。


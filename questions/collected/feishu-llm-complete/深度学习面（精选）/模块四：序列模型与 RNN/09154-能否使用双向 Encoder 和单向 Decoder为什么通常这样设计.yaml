content:
  prompt: 能否使用双向 Encoder 和单向 Decoder？为什么通常这样设计？
answer:
  mode: rubric
  reference_answer: |-
    可以，且这是标准设计。绝大多数 Seq2Seq 模型（RNN 或 Transformer）均采用双向/无掩码编码器和单向/因果掩码解码器。

    原因

    - 编码器需要完整上下文：编码器的目标是理解整个输入序列，双向建模能同时捕捉前向和后向的信息，对每个位置生成更丰富的语义表示。这对于机器翻译中的词义消歧、句子结构解析至关重要。

    - 解码器必须保持自回归的因果性：解码器在训练和推理时都是逐词生成的，当前时刻不能看到未来词。因此，解码器的自注意力或循环状态必须是单向的（或带掩码的），以确保不泄露后续目标词，训练时也使用 Teacher Forcing 和掩码。

    - 如果解码器也用双向，训练时会看到全部目标序列，导致信息泄露，推理时没有未来信息可用，造成训练-推理不一致（曝光偏差外，还有信息利用方式的不同），模型无法正常工作。

    特殊例外：某些非自回归生成模型（如掩码语言模型式的生成、迭代精炼）可以在解码器中使用双向注意力，但这是截然不同的生成范式。

    因此，双向 Encoder + 单向 Decoder 的搭配是 Seq2Seq 的自然且最优的设计，兼顾了源端的充分理解和目标端的自回归约束。


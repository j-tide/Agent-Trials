content:
  prompt: 什么是基于注意力机制的指针网络（Pointer Network）？它适用于什么任务？
answer:
  mode: rubric
  reference_answer: |-
    指针网络 (Pointer Network, Vinyals et al., 2015)
    指针网络是 Seq2Seq 模型的变体，其输出不是从固定词表中选择，而是从输入序列中的元素中挑选。它利用注意力机制来生成一个指向输入位置的概率分布，输出类别数等于输入序列长度（可变）。
    数学上，解码器第 tt 步的输出概率分布为：

    [图片内容未导入]

    适用任务

    - 输出集合来自于输入：任务要求输出是输入的一个排列或子集。

    - 经典应用：

    指针网络的参数数量不随输入长度变化，对组合优化问题有很好的泛化能力，但输出严格来源于输入，不能生成新词。

    - 旅行商问题（TSP）：输入为城市坐标序列，输出为访问城市的顺序（一个排列）。

    - 凸包问题、Delaunay 三角剖分。

    - 排序问题。

    - 自然语言处理中的抽取式摘要（直接从原文抽取句子）、指代消解（指出先行词在文本中的位置）、阅读理解的答案抽取。


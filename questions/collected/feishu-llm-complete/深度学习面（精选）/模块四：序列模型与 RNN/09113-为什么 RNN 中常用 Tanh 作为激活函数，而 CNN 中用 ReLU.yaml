content:
  prompt: 为什么 RNN 中常用 Tanh 作为激活函数，而 CNN 中用 ReLU？
answer:
  mode: rubric
  reference_answer: |-
    RNN 中用 Tanh 的原因

    - 有界性防止爆炸：Tanh 输出范围 [−1,1]，在递归计算中，若使用无界的 ReLU，激活值可能随时间步累积而爆炸，因为循环权重乘以激活值会不断放大。Tanh 通过压缩每一轮的输出，避免了激活发散。

    - 对称性与零中心：Tanh 均值为 0，有利于梯度传播。对于 RNN 的递归状态，零中心分布可缓解偏置偏移。

    - 导数特性：Tanh 导数最大为 1，配合良好的权重初始化可使梯度在多个时间步内保持稳定（虽然仍可能消失，但比 Sigmoid 好）。

    - 早期实验表明，ReLU 在 RNN 中容易导致数值不稳定和梯度爆炸（若不配合恰当初始化和裁剪），因此 Tanh 成为 vanilla RNN 和 LSTM 内部激活的默认选择。

    CNN 中用 ReLU 的原因

    - 非递归结构：CNN 前馈计算没有循环，激活爆炸风险较低，且 Batch Normalization 能稳定分布。

    - 稀疏性和缓解梯度消失：ReLU 在正区间梯度恒为 1，有助于深层网络中的梯度流动，加速收敛。

    - 计算简单：ReLU 仅为分段线性，推理和梯度计算更快。

    注意：现代 RNN 变体如 IndRNN 使用 ReLU 配合特定初始化，可以成功训练。LSTM 的门使用 sigmoid（输出 0-1），内部候选状态使用 tanh，即结合了两种激活。


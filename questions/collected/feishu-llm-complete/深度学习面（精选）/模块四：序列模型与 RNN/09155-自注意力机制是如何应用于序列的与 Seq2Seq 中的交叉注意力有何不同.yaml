content:
  prompt: 自注意力机制是如何应用于序列的？与 Seq2Seq 中的交叉注意力有何不同？
answer:
  mode: rubric
  reference_answer: |-
    自注意力（Self-Attention）

    [图片内容未导入]

    输出序列的每一个位置都融合了整个序列的上下文信息。自注意力可以堆叠多层，使每个位置的表示通过逐层的全局交互不断丰富。

    应用

    - 在编码器中：仅使用自注意力，将输入序列的所有词进行两两交互，得到上下文感知的表示。

    - 在解码器中：通常包含掩码自注意力（防止关注未来位置）和交叉注意力。

    与交叉注意力（Cross-Attention）的不同

    - 输入来源
    自注意力：Q,K,V 源自同一序列（编码器或解码器的自身隐藏状态）。
    交叉注意力：Q 来自解码器（当前要生成的序列），K 和 V 来自编码器（源序列）。

    - 目的
    自注意力旨在捕获序列内部的词间依赖（语法、指代、修饰），构建更丰富的特征表示。
    交叉注意力旨在将源序列信息注入到解码过程中，实现跨序列的对齐和信息融合。

    - 在 Seq2Seq 中的角色
    Seq2Seq 的编码器可全部用自注意力（Transformer 编码器）；解码器用掩码自注意力处理已生成序列，再用交叉注意力读取编码器输出。传统的 RNN Seq2Seq 没有自注意力，而是用循环状态捕获内部依赖。

    总结：自注意力建模单个序列的内在结构，交叉注意力桥接两个序列。两者结合构成的 Transformer 完全替代了 RNN，实现了高效的并行计算和更优的长期依赖建模。


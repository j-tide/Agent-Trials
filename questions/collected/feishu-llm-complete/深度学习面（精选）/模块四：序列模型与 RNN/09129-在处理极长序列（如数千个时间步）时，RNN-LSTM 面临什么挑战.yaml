content:
  prompt: 在处理极长序列（如数千个时间步）时，RNN/LSTM 面临什么挑战？
answer:
  mode: rubric
  reference_answer: |-
    - 梯度消失与爆炸的残余风险：尽管LSTM的门控机制大幅缓解了梯度消失，但在数千个时间步的序列中，当遗忘门无法保持接近1时，连乘效应仍可能导致梯度指数级衰减或爆炸。而且梯度爆炸虽可裁剪，但消失依然会使极早期的信号无法有效学习。

    - 计算时间和内存随序列长度线性增长：RNN/LSTM 必须按时间步串行计算，无法并行。反向传播时，BPTT 需要保存整个序列的中间隐藏状态和细胞状态，内存占用与序列长度成正比。对于数千步的序列，即便 batch size 很小，显存也可能耗尽。

    - 训练速度极慢：由于时间步之间严格依赖，无法利用GPU的并行性加速序列维度的计算，导致每个迭代耗时巨大。

    - 长期记忆容量饱和：LSTM的细胞状态维度固定，当序列极长且信息丰富时，固定大小的记忆单元可能无法保留所有重要信息，发生“记忆覆盖”或“遗忘”，尽管门控可调节，但容量瓶颈仍存在。

    - 优化困难：损失曲面在极长序列下变得更加崎岖，即使使用自适应优化器，收敛也可能不稳定，需要精心设计学习率调度和梯度裁剪。

    - 数值问题：大量的浮点运算累积可能产生数值溢出或下溢，尤其是涉及sigmoid和tanh的多次运算。

    应对策略：截断BPTT、使用跳跃连接（如IndRNN）、引入Transformer或状态空间模型、增大细胞状态维度、更好的初始化、层归一化等。


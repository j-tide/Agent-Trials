    对比

    - RNN：训练时间复杂度 O(序列长度)，不可并行，GPU 利用率低。

    - Transformer：训练时间复杂度 O(序列长度²)，但可通过矩阵运算高度并行，实际速度远快于 RNN，尤其是中等长度序列。

    RNN 在推理时也有此限制，但可以通过状态传递维持低延迟流式处理，Transformer 推理则需缓存键值但计算量更大。


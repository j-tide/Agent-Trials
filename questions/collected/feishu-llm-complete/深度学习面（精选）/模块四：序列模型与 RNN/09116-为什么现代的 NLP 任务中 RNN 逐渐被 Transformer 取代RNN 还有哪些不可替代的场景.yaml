content:
  prompt: 为什么现代的 NLP 任务中 RNN 逐渐被 Transformer 取代？RNN 还有哪些不可替代的场景？
answer:
  mode: rubric
  reference_answer: |-
    被取代的原因

    - 并行化能力：Transformer 的自注意力在整个序列上同时计算，无循环依赖，可充分利用现代 GPU/TPU 的并行处理能力。而 RNN 受时间步串行限制，训练和推理速度慢。

    - 长距离依赖建模：自注意力直接连接任意两个位置，梯度路径短，没有 RNN 的梯度消失问题，更易捕获超长距离依赖。

    - 性能上限高：大规模预训练 Transformer 模型（BERT, GPT, T5 等）在几乎所有 NLP 任务上都达到了前所未有的性能，推动领域范式转变。

    - 多模态统一性：Transformer 架构可轻松应用于文本、图像、语音等，无需针对序列改变核心结构，便于构建多模态基础模型。

    RNN 不可替代（或仍有优势）的场景

    - 流式处理与在线学习：RNN 天然能以恒定内存逐个元素处理无限长序列，适合实时语音识别、在线翻译、传感器数据分析等需要因果推理且延迟极低的场景。Transformer 自注意力需要维护整个序列，计算量随长度增长，难以在线流式处理（虽有 chunk/streaming 变体，但复杂度仍高于 RNN）。

    - 资源极度受限的嵌入式系统：微控制器、IoT 设备可能仅能运行极简模型，小型 RNN（如 LSTM/GRU）内存占用和计算量远低于 Transformer，且无需存储大量键值缓存。

    - 生物启发的计算与时序动态：在计算神经科学、动力系统建模中，RNN 作为连续时间动力系统的离散近似，其递归特性更贴近真实神经元处理序列的方式，常用于认知建模、脑机接口等。

    - 时间序列预测：在金融、气象等传统时间序列领域，RNN 及其变体（如 DeepAR、TCN）依然广泛使用，因为序列通常很长，且需要逐步递归预测未来多步，RNN 结构自然匹配。

    - 模型压缩与蒸馏：小型的 RNN 容易蒸馏为更简单的状态机或规则系统，用于可解释性或极低资源场景。

    - 强化学习中的策略网络：在部分可观测环境中，RNN 可作为记忆组件处理历史观测，由于其递归性质，容易集成到策略梯度算法中。

    综上，RNN 在需要恒定状态、流式推断、超低资源或生物合理性的领域仍具价值，而 Transformer 主导了大规模批处理和追求极致性能的离线任务。两者未来可能进一步结合，例如用轻量级 RNN 作为 Transformer 中的局部模块或流式接口。


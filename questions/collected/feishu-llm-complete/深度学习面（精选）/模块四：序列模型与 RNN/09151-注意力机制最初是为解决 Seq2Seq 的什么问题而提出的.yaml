content:
  prompt: 注意力机制最初是为解决 Seq2Seq 的什么问题而提出的？
answer:
  mode: rubric
  reference_answer: |-
    注意力机制（Attention Mechanism）最初由 Bahdanau et al. (2015) 提出，旨在解决传统 Seq2Seq 模型中将所有输入信息压缩为单一固定长度上下文向量所带来的瓶颈问题。具体包括：

    - 信息丢失：长序列的细节无法被一个向量完全编码。

    - 缺乏对齐能力：生成每个目标词时无法有选择地关注输入序列的不同部分。例如，翻译 “the black cat” 时，生成“黑”应主要关注“black”，生成“猫”应关注“cat”，但固定上下文向量无法提供这种位置敏感性。

    - 长句性能骤降：随着输入长度增加，模型性能（如 BLEU）急剧下降。

    注意力机制通过让解码器在每个时间步动态地构建一个加权上下文向量，能够访问编码器的所有隐藏状态，并根据当前解码状态自适应地分配权重（注意力分数），从而打破信息瓶颈，显著提升长序列处理能力。


content:
  prompt: 注意力机制为什么能提高长句翻译的质量？
answer:
  mode: rubric
  reference_answer: |-
    在传统的 Seq2Seq 中，编码器必须将整个输入句子（无论多长）压缩为一个固定尺寸的向量，再由此向量解码整个目标句。当源句很长时，信息必然被稀释或丢失。注意力机制在每个解码时间步都生成一个动态的上下文向量，只关注源句中最相关的部分，这带来了以下好处：

    - 直接访问局部信息：解码时，如生成某个目标词，模型可以直接“看”到源句中对应位置的单词（如源句的后半部分），而不受句子总长度的限制。

    - 绕过瓶颈：不需要在单个向量中保存所有信息，编码器所有时间步的隐藏状态都可被解码器直接使用。

    - 缓解梯度消失：解码器的梯度可以直接通过注意力权重路径传递给编码器相关的浅层时间步，缩短了反向传播路径。

    - 改善长句对齐：对于语序差异大的语言对，注意力能学到非单调的对齐，即使目标词对应的源词在很远处也能准确捕获。

    实验结果（Bahdanau et al. 2015）显示，加入注意力后，翻译质量随句子长度增加而稳定或下降缓慢，而未加注意力的模型在长句上性能骤降。这证明了注意力在处理长序列上的有效性。


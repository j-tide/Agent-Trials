content:
  prompt: Masking 在序列损失计算中如何忽略 Padding 的位置？
answer:
  mode: rubric
  reference_answer: |-
    在计算损失（如交叉熵）时，须确保填充位置的损失不计入总损失，否则模型会被迫预测无意义的填充符，影响性能。常用方法：

    - 使用 ignore_index 参数：在 PyTorch 的 nn.CrossEntropyLoss 中设置 ignore_index=PAD_token_id，计算损失时自动忽略目标标签为该值的所有位置。这是最简单且高效的方式。

    - 自定义掩码：生成一个与目标序列同形的布尔掩码，标记非填充位置（mask = targets != PAD_token_id）。将损失张量乘以掩码再求和，最后除以有效位置总数：

    [图片内容未导入]

    - 加权平均：有些实现对每个样本单独计算平均损失（对有效长度取平均），然后再在 batch 维度取平均，这样可以平衡长短序列对梯度的贡献。

    无论哪种方法，关键是确保填充位置的预测不会产生任何梯度更新信号。


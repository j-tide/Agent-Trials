content:
  prompt: 堆叠多层 RNN 能增强什么能力？会带来什么问题？
answer:
  mode: rubric
  reference_answer: |-
    增强的能力

    - 层次化特征学习：较低层 RNN 可能学习到短时间尺度的局部模式（如短语结构），较高层能整合这些模式形成更抽象、长时间尺度的表示（如句子语义）。

    - 更大容量：增加深度可扩展模型参数和计算量，理论上能拟合更复杂的序列映射。

    - 更好的性能：在许多任务（如机器翻译、语音识别）中，深度 RNN 相比浅层有明显精度提升。

    带来的问题

    - 梯度消失/爆炸加剧：不仅在时间上，在层与层之间也会发生梯度衰减或爆炸。虽然 LSTM/GRU 缓解了时间维度的消失，但层间仍可能传播困难。

    - 训练困难：收敛变慢，需要更多技巧，如使用残差连接（Deep RNN 加入跨层 shortcut）、批归一化/层归一化（在层间或时间上），以及合适的参数初始化。

    - 过拟合风险增加：参数大幅增加，需要更多数据或正则化（Dropout，尤其变分 Dropout）。

    - 计算量激增：深度增加导致训练和推理时间显著变长，难以并行化（时间步串行）。

    缓解措施

    - 使用 Highway RNN 或 Residual RNN 增加层间跳跃连接。

    - 使用层归一化稳定隐藏状态。

    - 使用适当的正则化（Recurrent Dropout、Zoneout）。

    - 当层数很深时，可能考虑替代架构（如 Transformer）来获得更深且易训练的模型。


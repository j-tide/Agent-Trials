content:
  prompt: 多头注意力在序列模型中的应用，与标准注意力相比有何提升？
answer:
  mode: rubric
  reference_answer: |-
    多头注意力（Multi-Head Attention） 最初在 Transformer 中提出，将查询、键、值通过 h 组不同的线性投影映射到多个子空间，在每个子空间独立计算点积注意力，然后将所有头的输出拼接并再投影。

    与标准注意力的区别

    - 标准注意力：在一个表示空间中计算，只有一种相似度度量方式。

    - 多头注意力：在多个不同的表示子空间中并行计算，每个头可以关注不同的特征或位置关系。

    提升

    - 多维度信息提取：不同头可以学习不同类型的依赖关系，例如一个头关注句法依存，另一个头关注语义相关，第三个头关注位置距离。这增强了模型的表达能力。

    - 联合处理不同位置：多个头允许模型同时关注来自不同位置的信息，不会因为混合在一起而模糊。比如，一个头专门捕获长距离依赖，另一个头捕获局部词组。

    - 训练稳定且更高效：虽然总计算量类似，但多头后每个头的维度减小（dk=dmodel/hdk=dmodel/h），实际计算可以通过矩阵分块高效实现。

    - 更好的泛化：实验表明，多头注意力在小到大规模任务上都一致优于单头注意力，尤其是对复杂序列任务（如机器翻译、语言模型）。

    应用

    在 Transformer 中，编码器的自注意力和解码器的交叉注意力都使用了多头注意力。在基于 LSTM 的 Seq2Seq 中，也可以加入多头注意力（如将编码器状态线性投影后，用多个头加权求和然后拼接），但不如 Transformer 那样普遍。多头注意力已成为现代深度序列模型的基础模块。


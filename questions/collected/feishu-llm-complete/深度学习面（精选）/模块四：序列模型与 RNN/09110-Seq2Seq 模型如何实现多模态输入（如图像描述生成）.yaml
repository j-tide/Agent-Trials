content:
  prompt: Seq2Seq 模型如何实现多模态输入（如图像描述生成）？
answer:
  mode: rubric
  reference_answer: |-
    图像描述生成是典型的多模态 Seq2Seq 任务，输入为图像，输出为描述文本。

    架构

    将 Seq2Seq 的编码器替换为卷积神经网络（CNN），解码器仍为 RNN。整体分为：

    - 图像编码器：使用预训练的 CNN（如 VGG、ResNet、Inception）提取图像特征，通常取全连接层之前的特征图（H×W×D）或最终的全连接向量。对于简单的 Show and Tell 模型，直接用 CNN 最后一层隐藏状态经线性变换作为解码器的初始状态。

    [图片内容未导入]

    - 加入注意力：Show, Attend and Tell 模型进一步使用空间特征图（比如 14×14×512）作为编码器状态，解码器每一步用注意力动态加权求和这些位置的特征向量，得到当前步的上下文向量。这使模型在生成每个词时，能关注图像的对应区域（如生成“狗”时关注图像中的狗）。注意力计算类似于标准的 Bahdanau 注意力，只是查询为解码器状态，键和值为图像区域特征。

    训练

    最小化生成文本的负对数似然，通常使用 Teacher Forcing。损失为交叉熵。

    其他多模态 Seq2Seq 变体

    - 视频描述：编码器用 3D CNN 或时序模型提取特征序列，再用注意力解码器。

    - 语音识别：编码器为声学模型（RNN/CNN），解码器输出文字。
    核心都是保持编码器-解码器-注意力框架，仅改变编码器的输入模态和结构。


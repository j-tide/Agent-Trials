content:
  prompt: 如何可视化 Seq2Seq 模型中的注意力权重？这对模型调试有什么帮助？
answer:
  mode: rubric
  reference_answer: |-
    可视化方法

    [图片内容未导入]

    对调试的帮助

    - 检查对齐质量：对于翻译，良好的注意力应呈现近似单调的对角线模式（源词和目标词顺序大致对应），可见模型是否正确找到了对应的词。若热力图混乱或发散，说明注意力训练不佳。

    - 发现过翻译或漏翻译：若某源词对应的列持续高亮（覆盖过度），或某列几乎全白（被忽略），可识别重复或遗漏。

    - 验证词对齐：将注意力与人工对齐对比，评估模型对短语、词序的捕捉能力。

    - 诊断模式崩溃：观察是否所有注意力都集中在少数位置（如句首句尾），有助于判断模型是否未充分利用源信息。

    - 提升可解释性：让开发者相信模型是基于合理的输入部分做出决策，而不会依赖虚假相关。

    示例代码（伪）：

    plt.imshow(attn_weights, cmap='hot', interpolation='nearest')
    plt.xticks(range(len(src_tokens)), src_tokens, rotation=90)
    plt.yticks(range(len(tgt_tokens)), tgt_tokens)
    plt.show()

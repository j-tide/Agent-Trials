content:
  prompt: 为什么在序列模型训练中常进行梯度裁剪？
answer:
  mode: rubric
  reference_answer: |-
    RNN 及其变体在长序列上容易发生梯度爆炸。由于反向传播经过许多时间步，梯度范数可能指数级增长，导致参数更新过大、损失变为 NaN 或模型发散。梯度裁剪是一种简单有效的稳定训练技巧。

    原理
    设定一个阈值（如 max_norm=5）。每当梯度的全局 L2 范数（所有参数梯度的平方和再开方）超过该阈值时，将梯度按比例缩放到阈值：

    [图片内容未导入]

    这限制了单步参数更新的最大步长，避免因异常批次或长序列导致的剧烈更新。

    在序列模型中的必要性

    - RNN/LSTM 中循环权重矩阵的连乘极易产生大梯度，尤其是序列长、目标损失大时。

    - 使用注意力机制的模型也可能因注意力分数过大导致梯度尖峰。

    - 梯度裁剪使训练过程对学习率更鲁棒，允许使用更大的学习率加速收敛，同时防止崩溃。

    实践：PyTorch 中 torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm) 放在 loss.backward() 和 optimizer.step() 之间。


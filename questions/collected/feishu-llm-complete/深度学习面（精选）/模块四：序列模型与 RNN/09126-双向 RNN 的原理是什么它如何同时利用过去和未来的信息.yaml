content:
  prompt: 双向 RNN 的原理是什么？它如何同时利用过去和未来的信息？
answer:
  mode: rubric
  reference_answer: |-
    原理

    [图片内容未导入]

    这个表示包含了整个序列的上下文：正向 RNN 捕捉左侧历史，反向 RNN 捕捉右侧未来信息。

    训练与推理

    训练时，需要完整的序列输入，可以并行计算正向和反向 RNN。但在测试时，如果序列完整可用（如文本分类、序列标注），同样可以双向运行。对于在线预测（仅有过去信息），无法使用反向 RNN，因为未来不可见。

    适用场景

    - 序列标注（POS、NER）：每个词的标签可能依赖前后文，双向非常有效。

    - 机器翻译（编码器部分）：源语言完整可见，可使用双向 RNN 获得更好的源句表示。

    - 语音识别：整句语音可双向处理提升准确率。

    它使得模型在每个时间步都能利用全局信息，极大提升了序列理解任务的性能。


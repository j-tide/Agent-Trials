content:
  prompt: 什么是“截断 BPTT”（Truncated BPTT）？它如何处理长序列训练？
answer:
  mode: rubric
  reference_answer: |-
    截断 BPTT 是为了解决长序列训练时 BPTT 计算量和内存过大的问题。其思想是：将长序列切割成若干较短的子序列，每个子序列内部进行完整的 BPTT，但梯度不再跨子序列传播。具体：

    - 将序列分成固定长度 k 的块（例如 k=100）。

    - 正向传播时，仍保持隐藏状态从前一块传递到下一块，以维持状态连续性。

    - 反向传播时，仅对当前块内的 k 步计算梯度，并在块边界处截断，不将梯度传回更早的块。

    - 参数更新在每个块之后（或累积几个块后）执行，隐藏状态则作为下一块的初始状态。

    如何处理长序列训练

    - 降低内存占用：只需存储当前块的时间步中间变量，而不是整个序列。

    - 允许模型处理任意长的序列，理论上无限长，只要逐块推进隐藏状态。

    - 虽然截断了梯度流，但状态仍能跨块传递信息，模型可以学习跨块依赖（通过状态而非梯度）。

    代价：梯度不能流过远超 k 步的依赖，使得学习真正长期依赖变得困难，但通常 k 可设为数百，已足够许多任务。这是一种计算和内存折中方案。


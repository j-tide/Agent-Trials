content:
  prompt: 如何处理序列中的缺失值？填充、插值还是用 Mask？
answer:
  mode: rubric
  reference_answer: |-
    处理时间序列中的缺失值需根据缺失模式、任务需求和数据特性选择。

    - 填充（Imputation）

    - 前向填充/后向填充：用前一个有效值填充缺失位置，假设数据平稳连续。

    - 均值/中位数/众数：用整个序列或滑动窗口内的统计量填充，简单但可能扭曲分布。

    - 模型预测填充：使用插值模型（如线性回归、KNN、矩阵分解）预测缺失值，更精确但计算代价高。

    - 特殊值标记：用一个超出正常范围的值（如 -999）填充，并配合掩码告知模型哪些是缺失值，让模型自己学习如何处理。

    - 插值

    适用于缺失比例不大且序列平滑的情况。常见有线性插值、样条插值、时间插值等。插值能保持序列的连续性，但可能引入假设。

    - 使用 Mask（掩码）

    在模型中显式建模缺失信息。可通过额外的二值掩码通道输入网络，指示哪些时间步是缺失的，让 RNN/Transformer 自己学习忽略或推断。比如 GRU-D 或 Transformer 中加入缺失指示向量。这种方式不扭曲原始数据分布，但要求模型能够处理。

    选择建议

    - 少量随机缺失：前向填充或线性插值即可。

    - 长时间缺失或连续缺失：使用掩码+模型推断更合适。

    - 高比例缺失：需谨慎，可能需要专门的缺失值处理模块（如生成模型）。


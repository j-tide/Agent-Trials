    主要区别

    Luong et al. (2015) 提出了几种注意力变体，与 Bahdanau Attention 的核心差异在于：

    - 注意力计算时机

    [图片内容未导入]

    - 得分函数（Score Functions）

    Bahdanau 只使用了加性（concat/additive）分数。

    Luong 提出了三种不同的对齐分数：

    [图片内容未导入]

    - 全局 vs 局部注意力

    Bahdanau 只关注全局注意力（对所有编码器状态加权）。

    [图片内容未导入]

    总结：Luong 的注意力更加模块化（先算 RNN，后算注意力），提供了多种得分函数和局部注意力选项；Bahdanau 的注意力深度融合在解码器循环中。两种方式在性能上接近。


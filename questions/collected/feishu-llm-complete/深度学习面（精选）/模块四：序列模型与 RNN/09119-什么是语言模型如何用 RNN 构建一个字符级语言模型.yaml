    语言模型的目标是最大化训练文本的似然。

    字符级语言模型

    以字符为基本单位（而非词），建模字符序列的概率。它需要预测下一个字符。

    用 RNN 构建字符级语言模型的步骤：

    - 数据准备：收集文本语料，构建字符表（所有出现的唯一字符，如 a-z, 标点等），分配索引。将文本转为整数序列。

    - 模型结构：

    - 训练：

    - 采样生成：

    PyTorch 简单示例代码：

    class CharRNN(nn.Module):
        def __init__(self, vocab_size, emb_size, hidden_size, num_layers):
            super().__init__()
            self.embedding = nn.Embedding(vocab_size, emb_size)
            self.lstm = nn.LSTM(emb_size, hidden_size, num_layers, batch_first=True)
            self.fc = nn.Linear(hidden_size, vocab_size)

        def forward(self, x, hidden=None):
            # x: (batch, seq_len)
            emb = self.embedding(x)
            out, hidden = self.lstm(emb, hidden)
            logits = self.fc(out)  # (batch, seq_len, vocab_size)
            return logits, hidden

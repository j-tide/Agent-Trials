answer:
  mode: rubric
  reference_answer: |-
    不适用于在线或因果预测

    [图片内容未导入]

    因果预测的替代

    - 使用单向 RNN（Forward RNN）确保只依赖过去信息。

    - 对于需要右侧上下文但允许一定延迟的场合，可以使用“受限双向 RNN”，即仅使用固定长度的小未来窗口，但严格意义上不是纯因果。

    所以，因果预测必须保证模型当前时刻的输出只与当前及过去输入有关，双向 RNN 违反此约束。


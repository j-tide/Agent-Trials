content:
  prompt: 在机器翻译中，如何处理低频词？BPE 与 Seq2Seq 如何结合？
answer:
  mode: rubric
  reference_answer: |-
    低频词的挑战

    词汇表过大会导致 softmax 计算量大且参数多，过小则产生大量 OOV（未登录词）。低频词单独作为 token 难以学到好的词向量，且容易造成稀疏问题。

    子词分割方法 BPE（Byte Pair Encoding）

    BPE 通过迭代合并语料中最常出现的字符对（或子词对）来构建子词词表。流程：

    - 准备初始词表（所有字符）。

    - 统计训练语料中所有符号对的共现频率，合并频率最高的一对，将其作为新符号加入词表。

    - 重复直到达到预设的词表大小。
    这样，单词被切分为高频子词单元，如 “low” → “low”，但 “lower” 可能变成 “low @@er” (或 “low” “er”)，其中 @@ 表示子词连接。BPE 能有效共享子词，罕见词可通过已知子词组合表示，几乎消除 OOV。

    BPE 与 Seq2Seq 结合

    - 在数据预处理阶段，分别或联合对源语言和目标语言进行 BPE 学习，将文本全部切分为子词序列（例如使用 SentencePiece 或 Subword-NMT）。

    - 构建词表时，子词单元数量可控（通常几千到几万）。编码器/解码器的嵌入矩阵和输出投影层大小对应子词词表。

    - 训练时，输入和目标都是子词序列，模型学习预测下一个子词。

    - 推理时，解码器生成子词序列，然后通过去除特殊连接符（如 @@ 空格）还原成正常单词。

    其他方法：WordPiece（用于 BERT）、Unigram Language Model（SentencePiece 的另一种模式）等。子词化已成为现代 NMT 和预训练模型的标准。


content:
  prompt: 在序列生成中，Top-k 采样和 Top-p（Nucleus）采样如何增加多样性？
answer:
  mode: rubric
  reference_answer: |-
    传统解码的局限

    在序列生成模型（如文本生成）中，贪心解码（每次选最高概率词）往往产生枯燥、重复、低多样性的文本。束搜索（Beam Search）在一定程度上能提升整体概率，但依然倾向于生成安全、常见但缺乏惊喜的序列。

    Top-k 采样

    - 原理：在每个生成步骤，从概率最高的 k 个词中按归一化后的概率随机采样。概率分布被截断，排除了低概率的“尾部”词，避免模型选用完全不相关的词，同时通过随机性引入多样性。

    - 效果：相比于固定选取 argmax，Top-k 采样能够在保持一定连贯性的同时，产生更丰富多变的表达。

    - 缺点：k 是固定值，不随分布形状变化。对于平坦分布（很多词都有一点概率），k 可能太小而错失合理候选；对于尖锐分布（高概率词集中），k 可能又包含了一些极低概率的不合适词。

    Top-p（核采样）

    - 原理：由 Holtzman et al. (2020) 提出。在每个时间步，从小到大累加概率值，选择累计概率刚好超过阈值 p（如 0.9）的最小候选集。候选词的数量是动态的。

    [图片内容未导入]

    - 优势：自适应地调整候选集大小。当模型对下一个词很确定（分布尖锐）时，候选集小，保持准确性；当模型不确定（分布平坦）时，候选集扩大，增加多样性，同时仍过滤掉长尾的噪声。

    - 常见用法：结合温度采样（temperature scaling）进一步平滑或锐化分布，然后应用 Top-p 采样，已广泛用于 GPT 等模型的开放式文本生成。

    总结：Top-k 是简单有效的截断采样，Top-p 则在它基础上实现了“自适应截断”，更好地平衡了连贯性与多样性，因此逐渐成为主流。


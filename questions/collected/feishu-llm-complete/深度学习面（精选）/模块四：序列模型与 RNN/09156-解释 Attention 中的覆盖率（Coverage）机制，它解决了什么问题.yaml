content:
  prompt: 解释 Attention 中的“覆盖率”（Coverage）机制，它解决了什么问题？
answer:
  mode: rubric
  reference_answer: |-
    解决的问题

    在 Seq2Seq + 注意力的序列生成（如翻译、摘要）中，模型容易产生过翻译（某个源词被重复关注，生成多个对应词）或漏翻译（某些源词从未被充分关注）。这源于注意力没有记忆，每步独立计算，无法追踪已被翻译过的部分。

    覆盖率机制（Tu et al., 2016）

    引入覆盖率向量（coverage vector）来记录历史注意力的累积，并利用它来影响当前步的注意力，鼓励模型关注尚未充分覆盖的源位置，惩罚重复关注。

    具体实现

    - 维护一个覆盖率向量 ctct，它是过去所有时间步注意力权重之和：

    [图片内容未导入]

    - 覆盖率损失：额外增加一个正则项，惩罚注意力分配的不均匀。常用形式为：

    [图片内容未导入]

    对所有时间步求和，作为总损失的一部分。它会惩罚当前注意力与历史覆盖的“重叠”，从而显式地使注意力散开，避免重复关注同一位置。

    效果

    覆盖率机制显著减少了重复生成和漏词现象，在神经机器翻译（NMT）中提高了 BLEU 值，尤其对长句和需要准确对齐的语言对效果明显。


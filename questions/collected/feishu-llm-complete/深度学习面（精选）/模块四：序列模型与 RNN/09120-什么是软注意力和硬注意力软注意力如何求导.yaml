    硬注意力 (Hard Attention)
    硬注意力不是加权平均，而是随机采样一个位置 ii（根据概率分布 αα 采样），然后将该位置的隐藏状态作为上下文向量：c=hic=hi。采样操作是不可微的。

    - 求导问题：采样操作无法直接进行反向传播。训练通常需要使用强化学习（如 REINFORCE 算法）或变分推理（如使用 Gumbel-Softmax 重参数化来近似梯度）来估计梯度。

    - 优点：减少了计算量（只访问一个位置），在某些任务（如图像描述）中可能更锐利。

    - 缺点：训练复杂，方差大，收敛慢。


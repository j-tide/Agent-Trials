content:
  prompt: 如何利用 RNN 进行序列分类？最后时刻的输出还是全部输出的池化？
answer:
  mode: rubric
  reference_answer: |-
    RNN 用于序列分类时，输入是一个序列，输出是一个类别标签。常见表征方式：

    - 最后时刻输出

    [图片内容未导入]

    - 全部输出池化

    对 RNN 所有时间步的输出做聚合操作：

    - 平均池化：取所有 htht 的平均值，能捕获全局信息。

    - 最大池化：取每个维度的最大值，强调最关键特征（如文本分类中关键词）。

    - 注意力池化：用可学习的注意力权重对所有输出加权求和，模型自适应选择重要时间步，效果通常最好。
    池化后再送入全连接层。这种方法能更好地利用序列各处的信息。

    选择依据

    - 当序列较短或任务依赖于整段语义（如情感分析），池化或注意力更好。

    - 最后时刻输出适用于在线场景或强调尾部信息任务（如流式分类）。

    - 实践中，注意力池化是高性能方案，但会额外引入参数。

    额外：还可以结合使用，如将最后隐态和池化后的向量拼接。


content:
  prompt: 在 NLP 中，文本序列的起始和结束标记有什么作用？如何设计？
answer:
  mode: rubric
  reference_answer: |-
    起始标记（SOS/BOS，Start of Sequence） 和 结束标记（EOS，End of Sequence） 是 Seq2Seq 等生成模型的关键特殊符号。

    作用

    - 解码启动：在推理时，解码器的第一个输入必须是 SOS，它告诉模型开始生成。

    - 序列终止：模型在生成 EOS 时表示序列结束。这允许模型自主决定输出长度。

    - 训练统一：训练时，目标序列被封装为 [SOS] y_1 y_2 ... y_T [EOS]，解码器在接收 [SOS] 时预测 y1y1，依此类推。这样每个时间步都有明确的学习目标。

    - 长度控制：防止模型无限生成。束搜索中，一旦某序列生成 EOS，即视为完整序列。

    - 开头和结尾信息：模型可以通过 SOS 和 EOS 的嵌入学习到序列开始和结束的语境，对某些语言生成有帮助。

    设计

    - 使用与词表不同的专用 token ID，如 SOS_ID = 0, EOS_ID = 1，普通词从 2 开始。

    - 在预处理时自动添加。对于编码器输入，通常不加 EOS（仅输出端加）。

    - 某些 Transformer 中，编码器端也添加 EOS 作为句子结束的指示，利于注意力理解。


content:
  prompt: 如何对 LSTM 进行 dropout 正则化？要注意什么？
answer:
  mode: rubric
  reference_answer: |-
    方法

    - 逐层 Dropout：在 LSTM 层之后（或之前）应用 nn.Dropout，作用于隐藏状态的输出。这是最简单的方式，仅对层间连接正则化。

    - 循环 Dropout（Variational Dropout）：在时间步维度上共享相同的 dropout 掩码。具体来说，对 LSTM 的输入、隐藏状态或循环权重应用 dropout，且同一个样本在不同时间步使用完全相同的掩码。这样可避免在时间维度上引入不一致的噪声破坏循环动态。原始论文由 Gal & Ghahramani (2016) 提出，PyTorch 的 nn.LSTM 支持 dropout 参数（仅当层数≥2时生效），这个 dropout 是应用于除最后一层外的所有 LSTM 层输出的，且它是变分 dropout 的一种近似？PyTorch 的实现是在每一层 LSTM 的输出（即下一层的输入）上施加 dropout，同一个序列的时间步使用相同的 dropout 掩码吗？实际上 PyTorch 文档指出“如果 LSTM 的 dropout 参数非零，则在除最后一层外的每层 LSTM 输出上引入 Dropout 层”，并未明确是否为变分 dropout。经查，PyTorch 1.12 及以后，LSTM 的 dropout 是在每个时间步独立采样掩码，这可能破坏时间结构。若要真正的变分 dropout，需要自定义实现。

    - Zoneout：随机保留上一时间步的隐藏状态（或细胞状态）而不是将其置零，这可以看作一种特殊的 dropout，对 RNN 有效。

    [图片内容未导入]

    注意事项

    - 不要在时间维度上随意改变掩码，否则会破坏 RNN 的时序依赖学习。应使用变分 dropout 或确保掩码在时间上恒定。

    - 若使用 PyTorch 内置 dropout 参数，注意它只对多层 LSTM 的层间输出做 dropout，而非循环连接内部。

    - 可以结合使用 LSTM 之后的逐层 Dropout 和 Zoneout。

    - Dropout 会减慢收敛，需要适当增加训练周期或调整学习率。


content:
  prompt: 如何处理多变量时间序列输入？如何将不同类型的特征喂入 RNN？
answer:
  mode: rubric
  reference_answer: |-
    多变量时间序列包含多个不同类型的变量（如温度、湿度、风速、星期几、节假日标志等）。需根据特征性质分别处理。

    数值连续变量

    通常进行标准化（Z-score）或 min-max 归一化，使各变量处于相近尺度，有利于网络训练。可以直接拼接成一个多维向量，作为 RNN 每个时间步的输入。

    分类变量/离散特征

    [图片内容未导入]

    已知未来信息（如天气预报中的未来已知天气数据）

    如果某些特征在预测范围内已知（如星期几），可在解码器端输入时提供；若在整个序列中都已知道，可直接与历史观测拼接。但需注意避免在训练时泄露真实未来目标值。

    缺失值处理

    如前所述，填充并增加二值掩码作为额外输入通道，指示该时间步各特征是否缺失，帮助模型学习缺失模式。

    融合方式

    [图片内容未导入]

    注意：尽量保持输入特征的尺度一致，尤其对于没有门控的 vanilla RNN，爆炸/消失更敏感。LSTM 对此稍鲁棒，但仍建议标准化。


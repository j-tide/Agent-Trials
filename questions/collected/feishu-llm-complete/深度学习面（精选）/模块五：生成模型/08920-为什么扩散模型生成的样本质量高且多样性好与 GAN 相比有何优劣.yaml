content:
  prompt: 为什么扩散模型生成的样本质量高且多样性好？与 GAN 相比有何优劣？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型的高质量与多样性来源

    - 逐级重建：从粗到精的去噪过程允许模型逐步调整细节，避免了 GAN 那种一步到位的困难，更容易生成全局一致、细节丰富的图像。

    - 稳定的训练目标：简单的 MSE 损失提供了平滑的优化地形，没有对抗训练中的模式坍塌和振荡问题，使得模型能够更好地覆盖整个数据分布（高多样性）。

    - 显式的似然优化：扩散模型本质上是在最大化数据对数似然（或其变分下界），这自然鼓励模型捕获数据的所有模式，不会轻易忽略低频模式。

    - 引导机制：CFG 可以很好地平衡保真度和多样性，在推理时通过调节引导强度实现控制。

    与 GAN 的比较

    优势：扩散模型更稳定，多样性更优，在文本到图像等复杂条件生成上表现 SOTA。

    劣势：推理速度慢，导致部署成本高，实时性较差。


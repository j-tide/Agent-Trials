content:
  prompt: Progressive GAN 逐步增大分辨率，这种训练策略有什么优势？
answer:
  mode: rubric
  reference_answer: |-
    Progressive Growing of GANs (Karras et al., 2018) 提出逐渐增加生成器和判别器的分辨率，从极低分辨率（如 4×4）开始，逐步增加层以生成更高分辨率图像。

    训练策略

    - 初始阶段仅训练低分辨率图像（4×4），网络很小，训练快速稳定。

    - 当该分辨率训练稳定后，平滑地添加新层来加倍分辨率（如 8×8），新层使用类似残差的 fade-in 技术平滑引入。

    - 重复此过程，直至达到目标分辨率（如 1024×1024）。

    优势

    - 稳定训练：低分辨率下数据分布简单，生成器可以快速学习数据的大致结构，避免了高分辨率下初始分布不匹配导致的梯度问题。

    - 加速训练：早期大多数训练在低分辨率下进行，计算成本极低，总训练时间远小于直接训练高分辨率 GAN。

    - 更好的全局结构：先学全局结构，再逐步学习细节，符合由粗到精的自然生成过程，有助于生成更合理的高质量图像，减少伪影。

    - 隐式正则化：渐进训练本身具有正则化效果，减少了模式坍塌的风险。

    Progressive GAN 成功生成了当时最高质量的 1024×1024 人脸图像，并为后续 StyleGAN 等奠定了基础。


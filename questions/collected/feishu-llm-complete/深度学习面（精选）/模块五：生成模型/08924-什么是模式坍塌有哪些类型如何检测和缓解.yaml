content:
  prompt: 什么是模式坍塌？有哪些类型？如何检测和缓解？
answer:
  mode: rubric
  reference_answer: |-
    定义

    模式坍塌是 GAN 训练中的典型失败现象，生成器无法产生反映数据多样性的样本，输出集中在少数几个模式甚至单一模式上。

    类型

    - 完全模式坍塌：生成器对所有输入噪声都输出完全相同或极为相似的样本，即生成分布退化为一个点或几个点。

    - 部分模式坍塌：生成器可以生成部分模式，但遗漏了训练数据中的一些其他模式。例如，在包含十类数字的数据集上，生成器只能生成三类。

    - 跨批次模式坍塌：在同一个训练批次内，生成器可能只生成一两种样本，但在不同批次间可以变换模式。这会导致训练过程中的震荡。

    检测方法

    - 人工观察：直接观察生成的样本，特别是大量采样后看其多样性。

    - 最近邻分析：利用预训练分类器提取生成样本的特征，计算特征空间的最近邻距离，若大量样本聚集，说明多样性缺失。

    - 分类器覆盖率：用训练好的分类器对生成样本进行预测，统计预测类别的分布，如果某些类别很少出现，则表明模式缺失。

    - Fréchet Inception Distance (FID) 对模式坍塌敏感，能反映生成样本与真实样本分布的整体差异。

    缓解措施

    - 改用更好的损失函数：使用 Wasserstein GAN (WGAN) 及其改进版本，提供更稳定和有意义的梯度。

    - 小批量判别（Minibatch Discrimination）：允许判别器查看整个 batch 的样本统计量，迫使生成器产生具有多样性的批次。

    - 展开 GAN（Unrolled GAN）：生成器优化时考虑判别器未来的更新步骤，使博弈更平衡。

    - 打包损失（Packing）：如 PacGAN，将多个生成样本打包作为一个判别输入，使判别器能发现模式坍塌。

    - 多样性正则化：如增加生成样本之间的相似性惩罚项。

    - 使用辅助分类器：AC-GAN 训练判别器也做类别预测，帮助保留类别多样性。


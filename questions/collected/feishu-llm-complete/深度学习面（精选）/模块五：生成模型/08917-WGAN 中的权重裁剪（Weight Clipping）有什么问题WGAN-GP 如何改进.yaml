content:
  prompt: WGAN 中的权重裁剪（Weight Clipping）有什么问题？WGAN-GP 如何改进？
answer:
  mode: rubric
  reference_answer: |-
    权重裁剪的问题
    WGAN 通过将判别器的权重限制在一个小范围 [−c,c][−c,c] 内来强制 Lipschitz 连续，但这带来了严重问题：

    - 容量限制：权重裁剪会严重限制网络的表达能力，使得深层网络难以拟合复杂函数。

    - 梯度消失或爆炸：裁剪范围 cc 难以调节，稍微过大或过小都可能导致梯度异常。过大可能违反 Lipschitz 条件，过小导致所有权重达到边界，形成“二值化”网络，梯度几乎消失。

    - 优化偏差：裁剪会扭曲优化方向，使 critic 倾向于学习简单的函数，而不是真正的最优判别器。

    WGAN-GP（Gradient Penalty）的改进

    Gulrajani et al. (2017) 提出用梯度惩罚替代权重裁剪，直接约束 critic 的梯度范数接近 1（1-Lipschitz 条件）。

    [图片内容未导入]

    这种机制既保证了 Lipschitz 条件，又几乎不损害网络容量，极大地提升了训练的稳定性和生成质量。WGAN-GP 成为当时 GAN 训练的标准方案。


content:
  prompt: VAE 的潜在空间为何是连续的？如何从潜在空间采样生成新样本？
answer:
  mode: rubric
  reference_answer: |-
    连续性原因

    VAE 的编码器输出分布参数（均值和方差），而非单一向量。由于 KL 散度正则化迫使所有数据的后验分布接近同一先验（如标准正态），不同的输入会在潜在空间中产生重叠的高斯分布。相邻的输入具有相似的分布，因此它们的潜在编码区域相互覆盖。从而潜在空间呈现出平滑、连续的流形：在潜在空间中两点之间插值，解码器会输出平滑过渡的样本。

    生成新样本
    直接从先验分布 p(z) 中采样（如 z∼N(0,I)），然后将采样的 zz 输入解码器 pθ(x∣z)，即可生成新数据。由于训练时 KL 项迫使编码映射与先验对齐，随机采样出的点往往对应有意义的输出。这是 VAE 作为生成模型的根本用法。


content:
  prompt: Pix2Pix 是做什么的？它使用了什么损失函数？为什么需要成对数据？
answer:
  mode: rubric
  reference_answer: |-
    Pix2Pix (Isola et al., 2017) 是一个通用的图像到图像翻译框架，能够将一种类型的图像转换为另一种类型，如将语义分割图转为街景照片，素描转为彩色图，白天转为夜晚等。它基于条件 GAN。

    损失函数

    Pix2Pix 使用了组合损失函数：

    - cGAN 损失：原始的对抗损失，判别器判断输入图像对（输入-输出）是否真实。

    - L1 损失：生成器不仅要骗过判别器，还要使输出接近真实目标。L1 损失能捕获低频结构，减少模糊：

    [图片内容未导入]

    这里 x 是输入图像，y 是目标图像。

    总损失：

    [图片内容未导入]

    λ 是平衡权重（通常为 100）。U-Net 作为生成器，PatchGAN 作为判别器（对图像局部块进行判别）。

    为什么需要成对数据

    Pix2Pix 要求训练数据是严格对齐的图像对（例如同一场景的素描和照片）。因为 L1 损失和判别器都需要一一对应的输入和目标图像来监督，学习像素级映射。这种监督方式决定了它只能用于有成对数据的任务（如基于边缘图生成真实图像，已知对应关系）。如果缺乏成对数据，需要使用 CycleGAN 等方法。


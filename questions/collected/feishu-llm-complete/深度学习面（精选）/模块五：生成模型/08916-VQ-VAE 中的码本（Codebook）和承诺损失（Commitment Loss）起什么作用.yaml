    承诺损失（Commitment Loss）

    训练时，若仅用重构损失，编码器输出的分布可能不与码本对齐。VQ-VAE 引入了特殊的损失项：

    [图片内容未导入]

    其中 sg 表示停止梯度。

    - 第一项是码本损失：更新码本向量，使其靠近编码器输出。

    - 第二项是承诺损失：鼓励编码器输出靠近码本向量，防止输出在空间中任意漂移。β 是权重（通常 0.25）。
    通过这种设计，编码器和码本相互靠近，实现稳定的离散量化。


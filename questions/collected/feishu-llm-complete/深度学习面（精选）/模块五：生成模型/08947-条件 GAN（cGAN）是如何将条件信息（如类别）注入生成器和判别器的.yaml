content:
  prompt: 条件 GAN（cGAN）是如何将条件信息（如类别）注入生成器和判别器的？
answer:
  mode: rubric
  reference_answer: |-
    条件生成对抗网络 (Conditional GAN, Mirza & Osindero, 2014) 允许我们控制生成的内容。条件信息 y（如类别标签、文本描述、图像等）同时提供给生成器和判别器。

    注入方式

    - 生成器：噪声 z 和条件 y 拼接后作为输入。例如，将类别标签的 one-hot 向量与噪声向量连接，然后输入生成器网络。

    - 判别器：输入不仅包括图像 x，还包括条件 y。判别器需要判断图像是否真实且符合条件。实现上，可以将条件信息拼接到图像特征（在中间层或输入层），或通过嵌入层将离散条件转换为向量后与图像特征融合。常见方法是在判别器的第一层将图像和条件进行拼接或相加/相乘。

    训练目标

    与原始 GAN 类似，只是分布变为条件分布：

    [图片内容未导入]

    通过这种方式，cGAN 可以生成指定类别的图像、根据文本描述生成图片等，极大扩展了 GAN 的应用范围。


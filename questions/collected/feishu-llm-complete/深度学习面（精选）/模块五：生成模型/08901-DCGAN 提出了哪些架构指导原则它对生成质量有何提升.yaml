content:
  prompt: DCGAN 提出了哪些架构指导原则？它对生成质量有何提升？
answer:
  mode: rubric
  reference_answer: |-
    DCGAN (Radford et al., 2016) 将卷积神经网络引入 GAN，并提出了一套稳定训练和提升生成质量的架构设计原则：

    架构原则

    - 用步长卷积（strided convolutions）替代池化层：判别器中使用步长卷积进行下采样，生成器中使用转置卷积进行上采样，让网络自己学习空间降维和升维。

    - 取消全连接层：尤其是在生成器的第一层和判别器的最后一层，用卷积和全局平均池化替代，减少参数并保持空间结构。

    - 批归一化（Batch Normalization）：在生成器和判别器中均使用 BN，稳定训练，改善梯度流动，防止模式坍塌。但判别器的最后一层和生成器的第一层不适用 BN。

    - 使用 ReLU 和 Leaky ReLU：生成器输出层用 Tanh，其他层用 ReLU；判别器所有层用 Leaky ReLU（如斜率 0.2）。

    - 其他细节：使用 Adam 优化器，学习率调整，噪声输入从均匀分布变为标准正态分布等。

    对生成质量的提升

    - 使得生成的图像更加清晰、自然，在卧室、人脸等数据集上生成了有意义的图像，证明了 CNN 在 GAN 中的有效性。

    - 提升了训练的稳定性，使 GAN 更容易收敛，不再像原始全连接 GAN 那样容易出现振荡。

    - 引导了后续各种卷积 GAN 结构的设计，成为 GAN 的经典基线。


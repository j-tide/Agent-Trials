content:
  prompt: VAE 在 NLP 中应用较少，原因是什么？有什么变体可用于文本生成？
answer:
  mode: rubric
  reference_answer: |-
    应用较少的原因

    - 离散序列的挑战：自然语言是离散符号序列，而标准 VAE 假设连续高斯似然，适合连续数据。文本重构需使用分类分布和 teacher forcing，这导致“后验崩塌”：强大的解码器（RNN/LSTM）往往学会忽略潜在变量 zz，仅依赖自身的自回归能力生成，从而使 KL 项趋近于 0，z 与输入无关，退化为普通语言模型。

    - 重参数化不可用：对离散分布（如多项式分布）的重参数化技巧不直接适用，需使用 Gumbel-Softmax 等近似，但训练更困难。

    - 序列长度可变：编码句子到一个固定维度向量容易丢失信息，且 RNN 解码器的解码过程极易崩塌。

    用于文本生成的变体

    - VAE + RNN 配合 KL 退火：训练时逐步增加 KL 权重，并加入词袋损失（Bag-of-Words Loss）等辅助目标，迫使编码保留全局语义。

    - 离散 VAE / VQ-VAE for Text：使用离散潜在变量，避免后验崩塌，并可配合自回归先验。

    - 使用强大的先验与对抗训练，例如引入对抗损失提高生成质量。

    - Transformer-based VAE：用预训练 Transformer 优化，结合适当的目标以稳定训练。

    - OPTIMUS 等结合 BERT 和 GPT 的大型 VAE 在文本生成和风格迁移上取得了进展。

    尽管 NLP 中 VAE 不如 GAN 或自回归模型普遍，但通过精心设计，仍可以在文本生成、风格控制和表示学习中有用。


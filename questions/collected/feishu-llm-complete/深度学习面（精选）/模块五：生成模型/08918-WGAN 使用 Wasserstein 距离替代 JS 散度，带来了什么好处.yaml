content:
  prompt: WGAN 使用 Wasserstein 距离替代 JS 散度，带来了什么好处？
answer:
  mode: rubric
  reference_answer: |-
    Wasserstein GAN (WGAN, Arjovsky et al. 2017) 提出用 Wasserstein-1 距离（Earth Mover's Distance） 来衡量真实分布 Pr 与生成分布 Pg 之间的距离，取代 JS 散度。

    Wasserstein 距离的优势

    - 连续且有意义的梯度：JS 散度在两个分布没有重叠或重叠可忽略时，梯度过零或为常数，无法指导生成器更新。Wasserstein 距离在这种情况下仍然连续且可微，能给生成器提供平滑的梯度，即使两个分布相距甚远。

    - 缓解模式坍塌：由于 Wasserstein 距离对分布几何结构更敏感，优化它能更有效地推动分布从远处靠近，避免了 JS 散度下的“跳模”行为。

    - 训练更稳定：WGAN 的损失函数的值与生成样本的质量相关性更强，可以作为评估指标，不再需要精心平衡生成器和判别器的训练次数。

    - 理论保证：Wasserstein 距离具有更好的度量性质，可以反映分布的收敛过程。

    WGAN 的核心改变

    - 去掉判别器最后一层的 sigmoid，要求其函数是 1-Lipschitz 连续，输出实值（称为 critic）。


content:
  prompt: KL 散度在 VAE 中起什么作用？如果去掉 KL 散度会怎样？
answer:
  mode: rubric
  reference_answer: |-
    KL 散度的作用

    - 正则化潜在空间：使编码器产生的后验分布 qϕ(z∣x) 接近先验 N(0,I)，防止过拟合，促进潜在空间规整。

    - 连续性与平滑性：保证不同输入在潜在空间的分布有重叠，插值有意义。

    - 生成能力：训练后，采样自先验的 zz 才能被解码器正确解释。没有 KL，解码器只熟悉训练数据的编码点，随机采样会输出乱码。

    - 信息瓶颈：KL 项限制了 z 中可存储的关于 x 的信息量，鼓励学习解耦表示。

    如果去掉 KL 散度

    - 损失只剩重构项，模型退化为普通的概率自编码器，编码器会把每个 x 编码成一个确定性的 z（方差极小），不同样本的编码在空间中可能任意分散，毫无结构。

    - 潜在空间不再连续，插值无意义，也无法从先验采样生成有效样本。实际上变成了一个标准自编码器，不具备生成能力。

    - 还可能出现“后验崩塌”现象，但一般崩塌指的是 KL 项被忽略，这里正好相反。去掉 KL 则潜在空间无约束，难以实现生成。


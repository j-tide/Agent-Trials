content:
  prompt: 简述 DDIM、DPM-Solver、LCM 等快速采样方法的基本思路。
answer:
  mode: rubric
  reference_answer: |-
    DDIM（去噪扩散隐式模型）

    - 利用非马尔可夫前向过程，允许在反向采样时跳过某些时间步。

    - 通过设置确定性采样（σt=0σt=0），将任意子序列上的迭代公式统一，实现从 1000 步到几十步的加速。

    - 优点：完全兼容 DDPM 预训练权重，无需额外训练。

    DPM-Solver

    - 将扩散采样视为求解扩散随机微分方程（SDE）或常微分方程（ODE）。

    - 采用高阶数值解法（如指数积分器）直接求解概率流 ODE，在只有 10-20 步时便能达到很好的质量。

    - 利用扩散过程的半线性特性，推导出精确的解析形式更新公式，加速收敛。

    LCM（潜在一致性模型）

    - 受一致性模型（Consistency Models）启发，通过知识蒸馏将一个预训练扩散模型蒸馏为一致性模型。

    - 该一致性模型只需 1 到 4 步即可直接从噪声生成清晰图像。

    - 训练方法：使用教师模型（原扩散模型）进行多步采样，然后训练学生模型在极少步数内产生与教师相似的输出，同时加入引导损失和 LPIPS 损失等。

    - LCM-LoRA 等变体甚至可以在微调后仅用 2 步生成高质量图像。

    这些方法共同推动了扩散模型从“慢且昂贵”走向“实时可用”。


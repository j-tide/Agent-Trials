content:
  prompt: 栈式自编码器的训练方式通常是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    栈式自编码器（Stacked Autoencoder）由多个自编码器逐层堆叠而成，形成深层结构。其训练过程常采用逐层贪婪预训练 + 整体微调。

    步骤

    [图片内容未导入]

    优点

    - 解决了深层网络难以从随机初始化训练的问题（早于 Batch Normalization 和残差网络的时代）。

    - 每一层都学习数据的不同层次的特征，例如图像中边缘→部件→对象。

    - 可方便地用于有监督任务的预训练：堆叠编码器后添加分类器，再用标签微调。

    这种训练方式在2000年代后期推动了深度学习的复兴，后来逐渐被更好的初始化和归一化技术取代，但思路仍有价值。


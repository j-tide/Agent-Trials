content:
  prompt: StyleGAN 的风格调制是如何实现的？它如何控制不同层次的细节？
answer:
  mode: rubric
  reference_answer: |-
    StyleGAN (Karras et al., 2019) 彻底重新设计了生成器的架构，引入了风格调制机制，允许在不同尺度上控制图像的属性。

    风格调制实现

    [图片内容未导入]

    控制不同层次细节

    - 粗糙层（低分辨率，如 4×4 - 8×8）：控制高级别属性，如姿态、脸型、发型轮廓。

    - 中间层（中等分辨率）：控制面部特征、眼睛大小等。

    - 精细层（高分辨率）：控制颜色方案、纹理、微小的细节（如头发纹理、肤色等）。

    通过在生成器的不同分辨率层注入不同的风格向量（可以来自不同的 w），StyleGAN 实现了风格混合，可以对不同尺度分别控制。此外，生成器还加入独立的高斯噪声输入，进一步增加随机变化（如雀斑、头发丝的随机摆放）。


content:
  prompt: 扩散模型是否会出现类似 GAN 的模式坍塌？为什么？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型极少出现经典的模式坍塌（即生成样本集中在少数模式，忽略数据分布的其他部分）。原因如下：

    - 训练目标的根本差异
    GAN 通过对抗博弈优化一个极小极大目标，生成器试图糊弄判别器，这可能让生成器只生成少数能骗过当前判别器的安全样本，形成模式坍塌。而扩散模型最小化噪声预测的均方误差（或等价于得分匹配），这是一个覆盖整个分布的回归任务，对每个数据点都施加拉回真实数据流形的力，不会鼓励抛弃低频模式。

    - 覆盖整个分布的损失
    扩散模型在每个时间步都要从带噪数据重建原始信号，损失是定义在全体训练数据上的期望。如果模型忽略某些模式，那些被忽略的样本会产生高损失，迫使模型去学习它们。因此，只要优化到足够低的损失，模型将趋向于覆盖整个分布。

    - 基于似然的训练
    扩散模型本质上在最大化数据似然（变分下界），这是经典的密度估计范式，不会发生模式坍塌。GAN 没有直接优化似然，只在两个分布之间博弈。

    但是，扩散模型可能存在局部模式缺失或样本质量与多样性的折中。例如，使用过强的引导（CFG 中 ww 过大）会牺牲多样性换取高质量，导致生成样本趋于单一化（类似模式坍塌的效果，但本质是采样策略的偏好，而非训练失败）。另外，如果训练数据本身不平衡，模型在极少出现的模式上质量可能较差。但总体上，模式坍塌不是扩散模型的主要问题。


content:
  prompt: 扩散模型的主要缺点是什么？如何解决推理速度慢的问题？
answer:
  mode: rubric
  reference_answer: |-
    主要缺点

    - 推理速度慢：需要几十到几千步的迭代，每一步都要运行一次大型神经网络，导致生成一张图像可能需要数秒到数十秒，远慢于 GAN 的单次前向。

    - 训练计算量大：虽然训练稳定，但需要训练很多步（通常数十万到数百万步）且每次需采样时间步和噪声，总训练时间较长。

    - 资源消耗大：大规模扩散模型（如 Stable Diffusion XL）显存和计算需求高，难以部署在低资源设备上。

    加速推理的解决方案

    - 减少采样步数：开发快速采样器，如 DDIM、DPM-Solver、PNDM、UniPC 等，可在 10～50 步内生成高质量图像。

    - 知识蒸馏：将多步采样模型蒸馏为少步甚至单步模型。如渐进蒸馏（Progressive Distillation）、LCM（Latent Consistency Models）等，可实现 1-4 步生成。

    - 模型压缩与量化：采用剪枝、INT8 量化、硬件加速等技术降低单步推理时间。

    - 高效的架构设计：使用更轻量级的 U-Net 或 Transformer 替代品，减少计算量。

    - 一步生成方法：如 BOOT（Bridging Optimal and Transport）、Rectified Flow 等方法通过训练专门的网络实现接近一步的生成。

    目前，结合 LCM 和 Stable Diffusion 的技术已能将生成时间缩短至毫秒级，同时保持可观的质量。


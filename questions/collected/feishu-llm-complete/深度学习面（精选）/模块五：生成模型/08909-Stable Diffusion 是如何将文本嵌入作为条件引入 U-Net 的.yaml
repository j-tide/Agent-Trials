answer:
  mode: rubric
  reference_answer: |-
    Stable Diffusion 使用预训练的 CLIP 文本编码器将文本提示转化为文本嵌入向量序列 c。在 U-Net 的每个注意力层中，采用交叉注意力机制注入文本条件：

    具体过程：

    - U-Net 中某一层的特征图视为查询 Q（经过线性投影）。

    - 文本嵌入向量通过另外的线性投影得到键 K 和值 V。

    - 计算交叉注意力：

    [图片内容未导入]

    - 将注意力输出与原始特征图结合（通常通过残差连接），然后继续网络的前传。

    这样，文本的语义信息被柔性地融合进视觉特征的各个空间位置，使得生成过程能够根据描述精细调整图像内容。此外，Stable Diffusion 还结合了时间步嵌入和 Classifier-Free Guidance，进一步提升生成质量和文本对齐度。


  reference_answer: |-
    [图片内容未导入]

    生成对抗网络（Generative Adversarial Network, GAN）由 Goodfellow 等人在 2014 年提出。它包含两个神经网络：生成器 G 和判别器 D，两者进行一场零和博弈。

    - 生成器 G：接收随机噪声 z∼pz（通常是标准正态分布或均匀分布），输出伪造样本 G(z)，试图“欺骗”判别器，使其认为这些样本是真实的。

    - 判别器 D：接收真实数据 x∼pdata 或生成数据 G(z)，输出一个标量，表示输入来自真实数据的概率。

    GAN 的核心思想是让生成器和判别器在对抗中共同进化：判别器不断提高区分真假的能力，生成器不断提高生成逼真样本的能力，最终达到纳什均衡。


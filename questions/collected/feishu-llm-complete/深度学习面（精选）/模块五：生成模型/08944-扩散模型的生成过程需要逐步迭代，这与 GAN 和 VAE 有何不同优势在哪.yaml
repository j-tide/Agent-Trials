content:
  prompt: 扩散模型的生成过程需要逐步迭代，这与 GAN 和 VAE 有何不同？优势在哪？
answer:
  mode: rubric
  reference_answer: |-
    生成过程对比

    - GAN：单步前向，生成器直接从噪声 z 映射到数据 x，速度快。

    - VAE：单步前向，解码器将潜在向量 z 映射到数据分布，同样是一次推理。

    - 扩散模型：通过一个学习到的迭代去噪过程逐步生成，通常需要几百到几千步，从纯噪声开始，每步去除一点点噪声，最终产出清晰数据。

    优势

    - 训练稳定：扩散模型的训练目标是一个回归式的噪声预测任务，损失函数简单（MSE），不存在 GAN 的对抗博弈中的模式坍塌、训练振荡等问题。

    - 分布覆盖好：扩散模型本质上是最大似然训练（或基于得分匹配），不容易产生模式坍塌，生成的样本多样性通常优于 GAN。

    - 可解释的渐进式生成：由于是逐步去噪，中间过程可视化强，可以通过控制迭代步骤来调节生成质量和速度。

    - 可以精细控制：引导机制（如 Classifier-Free Guidance）自然地平衡多样性和保真度，不像 GAN 那样难以控制。

    - 对数似然评估：扩散模型可以计算近似的对数似然，为模型比较提供标准指标。

    代价：推理速度远慢于 GAN 和 VAE，因为需要多步迭代。这是当前研究重点之一。


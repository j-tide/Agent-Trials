content:
  prompt: 扩散模型的基本思想是什么？前向过程和反向过程分别指什么？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    扩散模型是一类基于马尔可夫链的生成模型，其灵感来自非平衡热力学。基本思想可以这样理解：

    - 前向过程（扩散过程）：给定真实数据 x0，我们不断地、逐渐地向其中加入微量高斯噪声，经过 TT 步后，数据被完全破坏成一个各向同性的标准高斯噪声 xT∼N(0,I)。这个过程是固定的、无参数的马尔可夫链，每一步都只依赖上一步。

    - 反向过程（去噪过程）：如果我们能够学习到如何逆转前向过程的每一步——即从 xt 恢复出 xt−1，那么我们就可以从纯噪声 xTxT 开始，逐步去噪，最终生成新的数据样本。反向过程同样被建模为一个马尔可夫链，但转移概率 pθ(xt−1∣xt) 由神经网络参数化，需要从数据中学习。

    因此，扩散模型的核心就是学习一个能够逐步将噪声转化为有意义数据的逆扩散过程。前向加噪提供了一条从数据到噪声的“破坏路径”，反向去噪则学习其“重建路径”。


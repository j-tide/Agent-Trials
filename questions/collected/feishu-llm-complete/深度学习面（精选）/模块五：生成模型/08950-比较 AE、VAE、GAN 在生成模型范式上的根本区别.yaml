content:
  prompt: 比较 AE、VAE、GAN 在生成模型范式上的根本区别。
answer:
  mode: rubric
  reference_answer: |-
    自编码器 (AE)

    - 范式：确定性编码-解码。学习恒等映射。

    - 目标：最小化重构误差。

    - 潜在空间：无概率结构，潜在向量固定。

    - 生成方式：无法直接生成，通常不视为生成模型。

    - 输出质量：重构可较好，但采样通常无意义。

    - 优点：训练稳定，适合降维和特征提取。

    - 缺点：缺乏生成能力。

    变分自编码器 (VAE)

    - 范式：概率生成模型，最大化数据似然下界（ELBO）。

    - 目标：重构损失 + KL 正则化。

    - 潜在空间：连续概率分布，平滑且可插值。

    - 生成方式：从先验分布采样潜在变量，经解码器生成。

    - 输出质量：提供明确的对数似然评估，但样本往往偏模糊（因高斯假设）。

    - 优点：稳定的训练，具有编码器，可推断潜在表示。

    - 缺点：生成质量通常不如 GAN。

    生成对抗网络 (GAN)

    - 范式：博弈论框架，生成器与判别器对抗。

    - 目标：最小化生成分布与真实分布的 Jensen-Shannon 散度（或其他距离）。

    - 潜在空间：隐式，通常无编码器，不能直接推断给定数据的潜在变量。

    - 生成方式：从简单噪声分布采样，经生成器网络映射到数据空间。

    - 输出质量：可以生成高清晰度、逼真的样本（尤其图像）。

    - 优点：生成质量极佳，不依赖显式似然假设。

    - 缺点：训练不稳定（模式崩塌、收敛问题），缺乏对数据似然的直接评估，难以做推断。

    根本区别总结

    AE 追求有效编码，VAE 学习数据的显式概率分布并规范潜在空间以实现生成，GAN 通过对抗训练隐式匹配数据分布以生成逼真样本。VAE 注重概率建模和推断，GAN 注重样本质量。近年来，VQ-VAE、扩散模型等模糊了界限，但三者的设计哲学和目标依然清晰。

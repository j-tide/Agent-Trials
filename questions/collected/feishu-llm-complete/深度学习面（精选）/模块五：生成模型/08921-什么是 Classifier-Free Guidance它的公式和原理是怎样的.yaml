content:
  prompt: 什么是 Classifier-Free Guidance？它的公式和原理是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    Classifier-Free Guidance（CFG）是一种在扩散模型推理时无需额外分类器即可实现引导生成的技术，由 Ho & Salimans (2021) 提出。

    原理

    [图片内容未导入]

    在采样时，我们通过外推两个预测来获得引导效果：

    [图片内容未导入]

    其中 w≥1 是引导强度。当 w=1 时即为普通的条件生成；w>1 时，模型会沿着条件预测与无条件预测之差的方向加强条件的影响，从而生成与条件更一致的样本。

    公式与直观解释

    这相当于在噪声预测空间中，将条件预测的向量向远离无条件预测的方向移动。也可以理解为，模型隐式地结合了无条件得分和条件得分，并放大了条件得分的贡献。CFG 不需要额外的分类器网络，内存和计算开销小，成为 Stable Diffusion 等大规模模型的核心技术。


content:
  prompt: 降噪自编码器（Denoising AE）是如何工作的？它学到了什么？
answer:
  mode: rubric
  reference_answer: |-
    工作方式

    [图片内容未导入]

    训练时，编码器接收含噪输入，解码器输出干净数据。推理时可直接用干净输入，模型已学到稳健表示。

    学到了什么

    - 鲁棒特征：由于必须忽略噪声干扰，编码器被迫学习数据中真正稳定的模式和结构，而不是简单地记忆输入。这使学到的表示对微小扰动不敏感。

    - 数据分布的流形结构：去噪过程相当于沿着数据流形向高概率区域移动，模型隐含地捕捉了数据生成分布。Vincent et al. 证明，去噪自编码器训练的准则与得分匹配（score matching）密切相关，可从噪声中估计数据分布的梯度。

    - 更强的泛化能力：作为正则化手段，降噪自编码器能防止过拟合，尤其适合作为深度网络的预训练初始化，因为它迫使隐层学习有意义的统计规律。

    因此，降噪自编码器不仅学会了压缩，还学会了“修复”数据。


content:
  prompt: 如何评估 GAN 的生成质量？IS（Inception Score）和 FID（Fréchet Inception Distance）分别如何计算？
answer:
  mode: rubric
  reference_answer: |-
    评估生成模型的质量和多样性是个挑战。两个最广泛使用的定量指标是 IS 和 FID。

    Inception Score (IS)

    - 原理：使用一个在大规模数据集（ImageNet）上预训练的 Inception v3 网络。对生成图像 x，将其输入网络得到条件标签分布 p(y∣x)。

    - 计算：

    [图片内容未导入]

    - 即生成样本条件分布与边缘分布之间 KL 散度的期望的指数。分数越高表示生成器越好。

    - 缺陷：仅评估生成样本，不直接与真实数据比较；对 ImageNet 类别过拟合，泛化差；对模式坍塌敏感度有限。

    Fréchet Inception Distance (FID)

    - 原理：将真实图像和生成图像分别送入 Inception v3，提取其高层特征（通常是倒数第二层池化后的向量）。假设特征服从多维高斯分布，计算两个高斯分布之间的 Fréchet 距离（Wasserstein-2 距离）。

    - 计算：

    [图片内容未导入]

    - 解读：FID 衡量真实分布与生成分布在特征空间的距离，值越低越好，表示生成图像的质量和多样性更接近真实数据。FID 对模式坍塌更敏感，也是目前最常用的指标。

    其他指标：Precision and Recall for Distributions (PRD)、Kernel Inception Distance (KID) 等补充了不同角度的评估。实际中常结合 FID 和人类主观评估来判断生成质量。

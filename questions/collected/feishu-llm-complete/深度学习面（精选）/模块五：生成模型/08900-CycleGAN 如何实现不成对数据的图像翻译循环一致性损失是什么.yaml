answer:
  mode: rubric
  reference_answer: |-
    CycleGAN (Zhu et al., 2017) 解决了没有成对训练数据的图像翻译任务，例如将普通照片转换为梵高风格的绘画，只需要两类图像集合（源域 X 和目标域 Y），无需一一对应。

    实现方式

    [图片内容未导入]

    除了标准的对抗损失（确保转换后的图像看起来属于目标域），关键引入了循环一致性损失：

    [图片内容未导入]

    直观理解：将图像从 X 翻译到 YY，再从 Y 翻译回 X，应该得到原始图像。这能确保翻译过程保留图像内容结构，而仅改变风格。

    总损失：

    [图片内容未导入]

    通过这种设计，CycleGAN 无需成对数据也能学习到有意义的双向映射。


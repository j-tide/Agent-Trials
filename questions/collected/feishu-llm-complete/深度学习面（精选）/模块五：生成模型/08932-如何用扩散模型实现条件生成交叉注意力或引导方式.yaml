answer:
  mode: rubric
  reference_answer: |-
    实现扩散模型的条件生成主要有两大类方法：

    - 基于交叉注意力的条件注入
    在扩散网络的 U-Net 架构中，将条件信息 c（如文本提示、类别标签、图像等）通过交叉注意力层注入到中间特征中。典型实现如 Stable Diffusion 中的 U-Net：在多个分辨率层中，将条件嵌入通过线性变换得到键（K）和值（V），与 U-Net 特征图的查询（Q）进行交叉注意力：

    [图片内容未导入]

    - 引导方式（Guidance）

    [图片内容未导入]

    这两种方式可以结合。实际中，Stable Diffusion 等大规模模型采用 U-Net + 交叉注意力 + CFG 的方式，既灵活高效又容易训练。


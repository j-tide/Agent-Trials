content:
  prompt: 如何评估 VAE 生成样本的质量和多样性？
answer:
  mode: rubric
  reference_answer: |-
    评估生成模型主要从保真度（质量）和多样性（覆盖）两方面：

    - 重构误差

    测试集上的负对数似然（NLL）或重构损失。直接衡量模型对数据分布的拟合程度。NLL 越低，模型越精确。但对于 VAE 模糊问题，NLL 可能较好但视觉质量差。

    - 样本质量指标

    - FID（Fréchet Inception Distance）：将真实样本和生成样本映射到 Inception 特征空间，计算其均值与协方差的 Fréchet 距离。值越低表示生成图像质量和多样性越好，是目前最常用的指标。

    - IS（Inception Score）：评估单张生成图像的清晰度和类别多样性。高 IS 表示生成图像类别明确且多样。但存在缺陷，不适合非 ImageNet 数据。

    - 多样性

    - 生成样本之间的多样性：通过计算生成样本的成对距离或聚类分析。

    - 模式崩溃检测：训练多个类别上的分类器，检查生成样本的类别分布。

    - 改进的精度和召回率：Precision（生成样本的真实度）和 Recall（真实样本被覆盖的程度）。

    - 其他

    - 定性评价：人工观察生成样本，检查模糊、伪影、多样性。

    - 插值平滑性：潜在空间插值查看过渡是否自然。

    组合使用 FID 和 NLL，并结合人工判断，能较好评估 VAE 的生成性能。


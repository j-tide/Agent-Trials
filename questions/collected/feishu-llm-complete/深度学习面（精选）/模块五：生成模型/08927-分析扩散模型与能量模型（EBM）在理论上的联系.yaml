content:
  prompt: 分析扩散模型与能量模型（EBM）在理论上的联系。
answer:
  mode: rubric
  reference_answer: |-
    扩散模型和能量模型（Energy-Based Model, EBM）之间存在深刻的理论联系，可以通过得分匹配（Score Matching） 和随机微分方程（SDE） 来理解。

    [图片内容未导入]

    联系：

    [图片内容未导入]

    - 一旦学到了得分函数，我们就相当于拥有了一系列噪声水平下的 EBMs 的梯度，而无需显式建模能量值。这解决了 EBM 训练中的归一化困难，因为得分匹配不需要计算配分函数。

    - NCSN（Noise Conditional Score Network）正是通过得分匹配来训练 EBM，并用朗之万动力学采样。扩散模型的 DDPM 目标与加噪得分匹配是等价的，因此扩散模型可以视为通过得分匹配训练的多尺度能量模型。

    更深层的统一：Song et al. (2021) 将扩散模型和 EBM 统一在 SDE 框架下。前向 SDE 逐渐加噪，反向 SDE 去噪，其 drift 项由得分函数决定。扩散模型学习逆转 SDE，本质是学习能量景观的梯度，从而引导随机粒子从噪声分布移动到数据分布。

    因此，扩散模型是一种利用得分匹配高效训练的能量基生成模型，它继承了 EBM 的表达能力，却避免了配分函数的计算难题。这一理论联系也启发了利用扩散模型进行 likelihood 估计、逆问题求解、以及与其他概率模型的结合。

content:
  prompt: 扩散模型与噪声条件得分网络（NCSN）之间有什么联系？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型和基于得分的生成模型（Noise Conditional Score Network, NCSN）在数学上是紧密相关的。两者从不同角度出发，最终殊途同归。

    [图片内容未导入]

    因此，扩散模型可以看作对得分函数的一种特定参数化和训练方式。DDPM 的离散时间扩散对应着一种变分训练目标，而 NCSN 使用显式的得分匹配目标。Song et al. (2021) 用随机微分方程（SDE）统一了这两种框架，提出 Score SDE。二者的核心思想都是逐渐破坏数据并学习逆转这一破坏过程，本质上是估计不同噪声尺度下的对数概率梯度。


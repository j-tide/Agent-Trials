answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    自编码器是一种无监督神经网络，目标是让输出尽可能重构输入。其基本结构由两部分串联而成：

    [图片内容未导入]

    整体架构可以表示为：

    [图片内容未导入]

    训练损失通常为重构误差，例如均方误差（MSE）或二元交叉熵：

    [图片内容未导入]

    编码器的作用：学习数据的紧凑、有意义的低维表示，提取最重要的特征，起到降维和特征学习的作用。

    解码器的作用：根据编码还原出尽可能接近原始输入的数据，证明潜在表示包含了足够的信息。

    自编码器本身即可用于降维、去噪、预训练等任务。


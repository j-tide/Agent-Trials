content:
  prompt: 潜在扩散模型（LDM）为什么先在潜在空间做扩散？有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    潜在扩散模型（Latent Diffusion Model, LDM）不再直接在像素空间进行扩散，而是首先训练一个自编码器（如 VQ-VAE 或 VAE），将图像压缩到低维的潜在空间 z，然后在潜在空间中执行扩散和去噪过程。生成时，先采样潜在变量，再用解码器将其解码回像素空间。

    好处

    - 极大降低计算量：潜在空间的空间分辨率通常远小于像素空间（例如缩小 8×），维度也较低。扩散模型在这样的小空间上运行，所需的计算资源（显存和计算时间）呈数量级下降。

    - 聚焦语义信息：自编码器已经将图像中的高频细节压缩并保留在解码器能力中，潜在变量主要捕获图像的语义和结构信息。扩散模型可以专注于建模这些高层次的生成因子，忽略不易察觉的像素级噪声，使得训练和生成更高效。

    - 更好的可扩展性：LDM 使得将扩散模型扩展到高分辨率（如 1024×1024）图像生成成为可能，也是 Stable Diffusion 等大规模文本到图像模型的基础。

    - 训练解耦：自编码器可以单独预训练，然后在其潜在空间上训练扩散模型，模块化设计方便优化。

    应用

    Stable Diffusion 就是典型的 LDM：使用一个预训练的 VAE 将 512×512 图像压缩为 64×64 的潜在表示，扩散 U-Net 在 64×64 的潜在特征图上操作，大幅降低了显存占用。


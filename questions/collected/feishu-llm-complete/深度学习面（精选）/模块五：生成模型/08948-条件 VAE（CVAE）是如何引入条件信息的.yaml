content:
  prompt: 条件 VAE（CVAE）是如何引入条件信息的？
answer:
  mode: rubric
  reference_answer: |-
    CVAE 在编码器和解码器中同时接受条件变量 c。输入不仅包括 x，还包括 c。例如，在 MNIST 数字生成中，c 是类别标签。模型修改为：

    - 编码器：qϕ(z∣x,c)，输入是拼接了 xx 和 cc（或融合表示）。

    - 解码器：pθ(x∣z,c)，输入是拼接了 zz 和 cc。

    - 先验：通常仍为 p(z)（独立于 c），但也可学习条件先验 p(z∣c)。

    损失函数（ELBO）变为：

    [图片内容未导入]

    条件信息指导生成过程。生成时，给定所需条件 c，从先验采样 z，再通过解码器生成 x^。这允许控制输出属性（如生成特定数字、特定风格的图像）。CVAE 广泛应用于图像生成、对话生成等需可控生成的领域。


content:
  prompt: 扩散模型在视频、音频、3D 生成等领域的应用前景如何？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型已从图像迅速扩展到多种模态，且展现出巨大潜力。

    视频生成

    - 已有 Imagen Video、Make-A-Video、Sora（OpenAI）等，可生成高分辨率、长时长的视频。

    - 通常将时间维度加入 U-Net（3D U-Net 或时空分离卷积），并用级联方式先生成关键帧再插值。

    - 应用前景：电影特效、短视频自动创作、仿真数据生成、视频修复和编辑。

    - 挑战：计算量巨大，长视频一致性，场景理解，成本。

    音频生成

    - DiffWave、WaveGrad 等可生成高保真语音波形。AudioLDM、MusicLM 等可用于文本到音乐/音效生成。

    - 应用前景：语音合成、音乐创作、音效设计、语音增强和分离。

    - 优势：生成质量高，自然度高。

    3D 生成

    - DreamFusion（使用文本到2D扩散模型通过分数蒸馏采样优化 NeRF）、Point-E、Shap-E 等可生成 3D 物体。

    - 利用预训练的 2D 扩散模型作为先验，驱动 3D 表示的优化，从任意视角生成一致图像。

    - 应用前景：游戏资产、虚拟现实、产品设计。

    - 挑战：多视角一致性、生成速度、几何细节。

    其他：分子构象生成、蛋白质结构预测、表格数据生成等。扩散模型提供了统一框架，前景极为广阔，正在成为多模态生成式 AI 的核心方法。


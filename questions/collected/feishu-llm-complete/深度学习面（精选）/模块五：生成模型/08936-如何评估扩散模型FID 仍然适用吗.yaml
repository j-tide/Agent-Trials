content:
  prompt: 如何评估扩散模型？FID 仍然适用吗？
answer:
  mode: rubric
  reference_answer: |-
    评估扩散模型主要衡量生成样本的保真度和多样性。标准指标包括：

    - FID（Fréchet Inception Distance）：计算真实样本和生成样本在 Inception 特征空间的均值与协方差距离。FID 完全适用于扩散模型，是目前最主流的指标。它综合反映质量和多样性，值越低越好。但由于 Inception 网络预训练于 ImageNet，对非自然图像或特定领域可能存在偏差。

    - IS（Inception Score）：衡量生成样本的类别清晰度和多样性，不直接对比真实数据，使用较少。

    - Precision & Recall (PR曲线)：分别评价生成样本的真实度（Precision）和真实样本被生成模型覆盖的程度（Recall），可检测模式坍塌和保真度。

    - KID（Kernel Inception Distance）：类似 FID 但无偏，使用最大均值差异（MMD）。

    - 对数似然（NLL/NLLB）：扩散模型可计算近似似然（如 DDPM 的变分下界），用于衡量概率建模能力，但与视觉质量并不完全一致。

    - 人工评估：对文本到图像模型，常使用人类偏好评分（如 PickScore, ImageReward）或 A/B 测试。

    - CLIP Score：对于文本条件生成，计算生成图像与文本嵌入的 CLIP 余弦相似度，衡量图文一致性。

    FID 依然广泛适用，但需注意其局限性：依赖 Inception 网络，可能对噪声或特定内容不敏感；并且不同实现（如特征提取方式）会造成数值差异，所以比较时需保证相同计算设置。实践中，常结合 FID 和人工评估。


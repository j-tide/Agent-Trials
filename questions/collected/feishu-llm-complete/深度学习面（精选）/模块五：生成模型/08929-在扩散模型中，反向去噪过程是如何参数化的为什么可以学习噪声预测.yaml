    [图片内容未导入]

    为什么可以学习噪声预测
    前向过程是确定性的加噪，给定了 x0 和噪声 ϵ 就可以得到 xt。反向过程中，我们希望从 xt 推断出其中混合的噪声，从而恢复出xt−1。因为真实的噪声 ϵ 是已知的（在训练时），我们可以让神经网络直接预测这个噪声。预测噪声等价于预测数据 x0 或预测得分函数，但预测噪声在实践中效果最好、训练最稳定。从损失函数角度，最终简化为最小化预测噪声与真实噪声之间的 MSE。


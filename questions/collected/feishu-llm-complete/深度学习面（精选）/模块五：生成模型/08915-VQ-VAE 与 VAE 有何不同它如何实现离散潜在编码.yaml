content:
  prompt: VQ-VAE 与 VAE 有何不同？它如何实现离散潜在编码？
answer:
  mode: rubric
  reference_answer: |-
    核心不同

    - VAE 使用连续潜在变量，且潜在分布是参数化的高斯分布。

    - VQ-VAE（Vector Quantized VAE）使用离散潜在变量。编码器输出连续向量，但通过与一个可学习的离散码本（Codebook）进行比较，将每个位置映射到最近的码本向量（离散索引）。解码器接收离散码本向量（或对应嵌入）进行重构。

    实现离散编码

    [图片内容未导入]

    由于潜在空间是离散的，VQ-VAE 可以配合强大的自回归先验（如 PixelCNN）在离散潜在序列上建模，从而生成高质量图像、音频等，避免了连续 VAE 的模糊问题。


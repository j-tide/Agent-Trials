    与 DDPM 的本质区别

    - 前向过程假设：DDPM 的前向过程是马尔可夫的，要求严格按顺序加噪；DDIM 的前向过程是非马尔可夫的，但仍然保持相同的边缘分布 q(xt∣x0)。因此，用 DDPM 训练的模型可以直接用于 DDIM 采样，无需重新训练。

    - 采样随机性：DDPM 采样包含随机噪声项，每步都引入随机性；DDIM 可以设置 σt=0σt=0 实现确定性的从噪声到图像的映射，这使得它具有“一致性”性质，利于图像编辑等任务。

    - 速度：DDIM 在保持生成质量的前提下，可将采样步数从 1000 步减少到 50-100 步甚至更少，极大加速了推理。


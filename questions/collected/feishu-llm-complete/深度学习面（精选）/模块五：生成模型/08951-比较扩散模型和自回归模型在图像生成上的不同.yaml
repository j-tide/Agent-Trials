content:
  prompt: 比较扩散模型和自回归模型在图像生成上的不同。
answer:
  mode: rubric
  reference_answer: |-
    生成范式

    - 自回归模型（如 PixelCNN, VQ-VAE+PixelCNN, ImageGPT, DALL·E 1）：将图像序列化（光栅扫描顺序）并逐像素或逐 token 预测，基于已生成的部分生成下一个值。生成过程是串行的，当前像素依赖之前所有像素。

    - 扩散模型：通过迭代去噪从随机噪声中生成完整图像，所有像素在每个时间步同时更新（并行），但时间步之间是串行的。

    训练与优化

    - 自回归模型使用极大似然训练，损失为交叉熵。需要定义像素的生成顺序，且感受野受限，难以并行训练（训练时可用 teacher forcing 并行，推理时串行）。

    - 扩散模型训练目标是简单回归（预测噪声），训练非常稳定，不用对抗。但推理需要多次网络前传。

    生成质量与多样性

    - 自回归模型在似然指标上表现优异，但生成速度极慢（逐像素），且有时会出现细节失真（因误差累积）。在高分辨率图像上需配合两级模型（如 VQ-VAE + 自回归）。

    - 扩散模型生成质量极高，尤其在大规模文本到图像任务上达到目前最佳视觉质量。多样性好，不易模式坍塌。

    计算与推理速度

    - 自回归推理是像素级的串行，生成一张 256×256 图像可能需要数分钟。

    - 扩散模型推理是时间步串行，每步整个图像并行，几百步生成整体图像仍可控制在几秒。结合快速采样器（DDIM, LCM）可进一步降到几十到几毫秒。

    应用领域

    - 自回归模型适合高保真似然估计、无损压缩、以及部分文本生成。图像生成逐渐被扩散模型取代。

    - 扩散模型目前统治了图像/视频/音频等连续数据生成，并扩展到条件生成、编辑、修复。

    总结：扩散模型在图像生成质量和推理速度平衡上优于自回归模型，而自回归模型在需要精确似然评估或离散序列建模的领域仍占有一席之地。


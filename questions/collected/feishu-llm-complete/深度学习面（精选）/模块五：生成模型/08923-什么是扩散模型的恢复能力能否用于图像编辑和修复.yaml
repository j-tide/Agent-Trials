content:
  prompt: 什么是扩散模型的“恢复”能力？能否用于图像编辑和修复？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型的“恢复”能力指的是其强大的条件重建与从部分观测中恢复完整数据的能力。由于扩散模型学习到了数据分布的精细结构，并拥有逐步去噪的机制，它们天然适合根据部分信息补全缺失区域、去除噪声、超分辨率、以及各种编辑任务。

    具体用于图像编辑与修复的方式：

    - Inpainting（图像修复）：给一张带有掩码的图像，要求填充缺失区域。扩散模型可以在去噪过程中，对已知区域采用原始图像值替换（repaint），仅对掩码区域进行自由生成。每一迭代步 t，将已知区域的像素替换为由 q(xt∣x0) 采样的带噪版本，而未知区域则由模型预测。这种“迭代填充”保持了全局一致性，效果远超传统方法。

    - 图像编辑（SDEdit 等）：给一张草图或粗编辑图，通过添加适量噪声使其处于扩散过程的某个中间时间步，然后再用扩散模型去噪回原数据流形，实现“将粗糙输入变为真实图像”。这可以用于基于涂鸦生成照片、风格化、对象属性修改等。

    - 基于文本的编辑（InstructPix2Pix, Prompt-to-Prompt）：利用扩散模型的注意力图或交叉注意力控制，用户修改文本提示，模型能相应地编辑图像中指定对象，而不改变背景。例如通过交换交叉注意力图，替换某些单词对应的特征，实现内容替换。

    - 超分辨率：低分辨率图像被视为干净信号，通过上采样并加噪到某一时间步，然后用扩散模型以低分辨率图像作为条件进行去噪，恢复高频细节。

    因此，扩散模型的恢复能力体现在：它可以从任何“破坏”（噪声、缺失、低分辨率）中修复出符合数据分布的高质量样本，且过程平滑可控，适用于各类逆问题。


content:
  prompt: 在训练扩散模型时，时间步 tt 的采样有什么讲究？
answer:
  mode: rubric
  reference_answer: |-
    时间步 t 是从 [1,T] 中随机采样的，这一采样策略直接影响训练的效率和生成质量。常见讲究：

    - 均匀采样：最简单的策略，每个 t 等概率抽取。但由于扩散模型在不同噪声水平下学习难度不同，均匀采样可能导致低噪声区域（t 小）和高噪声区域（t 大）训练不均衡。

    - 重要性采样：一些研究指出，不同 tt 对损失贡献不同。可以设计非均匀的分布，更频繁地采样那些对总损失方差贡献大、或学习更困难的时间步，加速收敛。

    - 课程学习：训练初期可能更注重粗粒度的重建（大 t），后期逐渐引入小 t 的精细细节。也可以在训练过程中调整 t 的分布。

    - 对损失的加权：在 DDPM 的简化损失中，不同 t 未加权，但原始的变分损失包含权重。在实践中，简单均匀采样配合未加权 MSE 效果就很好，因为大 t 时的预测任务虽然简单，但对整体结构很重要；小 t 时任务更难，但每个样本的损失值也较小，均匀采样能平衡两者。

    - 实践中的策略：对于图像生成，通常直接在 [1,T]上均匀采样整数 tt，这在大量实验中证明是鲁棒且有效的。例如 Stable Diffusion 中，T=1000，每次迭代随机抽取一个 t，计算相应的 αˉt，然后计算损失。

    总的来说，虽然理论上存在优化的采样策略，但在大批量训练下，均匀采样已能很好地工作，且实现简单。


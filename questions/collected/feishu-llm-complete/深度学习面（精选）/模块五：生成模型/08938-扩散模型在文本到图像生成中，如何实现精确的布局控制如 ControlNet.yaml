content:
  prompt: 扩散模型在文本到图像生成中，如何实现精确的布局控制？如 ControlNet。
answer:
  mode: rubric
  reference_answer: |-
    实现精确的布局控制需要引入空间条件，使生成图像的构图、姿态、边缘等符合用户的额外输入（如分割图、关键点、线稿、深度图等）。代表性方法为 ControlNet。

    ControlNet 的思路

    ControlNet 在预训练的扩散模型（如 Stable Diffusion）旁边复制一个可训练的 U-Net 编码器副本，专门处理空间条件。两个编码器通过“零卷积”层连接，确保训练开始时不破坏预训练模型。

    - 空间条件（如 Canny 边缘图、人体姿态）输入到 trainable copy encoder，提取多尺度特征。

    - 这些特征被逐层加到原始 U-Net 的对应层。

    - 训练时仅更新副本编码器和零卷积层，原始扩散模型权重冻结。

    这样，模型学会了“遵循”边缘或姿态，生成与给定布局对齐的图像，同时保留原有文本到图像的生成能力。ControlNet 可处理多种条件（分割、深度、法线、涂鸦等），实现了精细的布局控制。

    其他方法

    - T2I-Adapter：小型网络提取条件特征，注入到 UNet 的不同尺度层。

    - GLIGEN：在文本条件基础上加入区域边界框和对应的文本嵌入，通过额外的自注意力层控制物体位置。

    - Prompt-to-Prompt 和 Cross-attention control：通过操控交叉注意力图来控制对象位置，而不改变网络参数。

    这些方法极大增强了扩散模型的可控性，可进行精确的对象摆放、姿势引导、场景布局等。


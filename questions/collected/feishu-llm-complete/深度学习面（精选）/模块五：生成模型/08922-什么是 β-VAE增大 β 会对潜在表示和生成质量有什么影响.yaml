content:
  prompt: 什么是 β-VAE？增大 β 会对潜在表示和生成质量有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    β-VAE 是对标准 VAE 目标的简单修改，在 KL 散度项前乘以一个超参数 β：

    [图片内容未导入]

    β>1 时，对潜在空间施加更强的约束。

    增大 β 的影响：

    - 潜在表示：更强的正则化迫使潜在编码携带更少的信息，各个维度趋向独立、因子分解，更容易解耦出数据中的独立变化因素（解耦表示）。在许多基准上，β-VAE 能发现更可解释的特征。

    - 生成质量：由于限制信息瓶颈，重构能力下降，生成图像可能更加模糊或丢失细节。需要在解耦程度和重构质量之间权衡。通常 β 越大，重构越差，但潜在变量更具解释性。

    - 训练稳定性：适度的 β 可避免后验崩塌；若 β 过大，编码器会几乎忽略输入，解码器生成的是平均数据，信息瓶颈过紧。

    实际应用中，常使用退火 β 策略：训练初期 β 较小，注重重构，然后逐步增大 β 以增强解耦。


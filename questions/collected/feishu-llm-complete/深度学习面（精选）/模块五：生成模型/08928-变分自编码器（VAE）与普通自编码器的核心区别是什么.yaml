  prompt: 变分自编码器（VAE）与普通自编码器的核心区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    核心区别：

    [图片内容未导入]

    进一步区别

    - 目标函数：
    普通 AE 仅最小化重构误差。
    VAE 最大化证据下界（ELBO），由重构误差 + KL 散度（潜在分布与先验的 KL 散度）组成。KL 项正则化潜在空间，使其趋向标准正态分布。

    - 生成能力：
    普通 AE 没有明确的生成机制，不能随意采样生成新数据；VAE 学习到了连续、平滑的潜在空间，可从先验分布直接采样 zz，通过解码器生成新样本。

    - 潜在空间连续性：
    VAE 的概率性质迫使相近的输入在潜在空间中有重叠的分布，使得空间连续（插值平滑）。普通 AE 的潜在空间可能不连续，存在空洞。

    总之，VAE 是生成模型，而 AE 是确定性特征学习模型。


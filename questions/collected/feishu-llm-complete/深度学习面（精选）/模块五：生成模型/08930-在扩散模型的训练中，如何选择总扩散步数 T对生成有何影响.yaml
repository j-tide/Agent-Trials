content:
  prompt: 在扩散模型的训练中，如何选择总扩散步数 T？对生成有何影响？
answer:
  mode: rubric
  reference_answer: |-
    T 的选择
    总扩散步数 T 是一个超参数，控制前向过程破坏数据的精细程度。典型值为 1000（DDPM）。选择时主要考虑：

    - 离散化精度：T 必须足够大，使得每一步的逆过程（去噪）可以被近似为高斯分布，从而可以用简单的神经网络来拟合。如果 T 太小，前向过程的 Markov 转移可能较大，反向过程的真实后验变得复杂且非高斯，难以学习。

    [图片内容未导入]

    - 计算成本：T 越大，训练时采样的时间步范围更广，但训练成本几乎不变（每个批次随机采样 t）。然而推理时步数通常与 T 相关，过大的 T 导致推理极慢（尽管可以配合快速采样器减少步数）。

    对生成的影响

    - T 太小：前向过程未彻底变成纯噪声，反向过程的边缘分布与先验不匹配，生成质量会下降，产生伪影。

    - T 适中且 β 调度合理：生成质量好，模型容易学习。

    - T 很大：理论上有更精细的破坏-重建链，但训练收益递减，推理时如果用全步数会非常慢。实践中可以通过快速采样（DDIM、DPM-Solver）用远小于 T 的步数获得好结果。

    实践
    通常将 T 设为 1000，使用线性或余弦 β 调度。一些工作表明可以降至几百而质量不减，结合蒸馏或一致性模型甚至可单步生成。选择 T 时，往往配合噪声调度一起调整。


    - 训练特定条件模型

    直接训练接受低分辨率/掩码图像作为条件的扩散模型，如 SR3、Palette。这些模型在训练时输入带破坏的图像对，学会有条件的去噪，推理时直接使用条件生成。

    总结：扩散模型凭借其强大的先验和灵活的迭代机制，已经在这类逆任务中取得了极其出色的效果。


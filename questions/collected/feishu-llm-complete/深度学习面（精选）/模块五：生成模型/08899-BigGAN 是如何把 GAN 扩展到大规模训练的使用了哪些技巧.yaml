content:
  prompt: BigGAN 是如何把 GAN 扩展到大规模训练的？使用了哪些技巧？
answer:
  mode: rubric
  reference_answer: |-
    BigGAN (Brock et al., 2019) 证明了通过大幅增加模型规模（深度和宽度）和批次大小，可以极大提升 GAN 的生成质量和多样性，在 ImageNet 上生成高分辨率、高逼真度的图像。

    关键技巧

    - 大幅增加批大小（Batch Size）：使用高达 2048 的批次大小，显著增加稳定性，因为大 batch 能提供更稳定的梯度估计，帮助生成器捕捉更多模式。

    - 增加模型容量：增大每层的通道数（宽度）以及网络深度，例如生成器使用大量通道（如 96 至 384），判别器使用相应规模。

    - 正交初始化和正则化：使用正交权重初始化，并添加谱归一化（Spectral Normalization）到判别器，以控制 Lipschitz 常数，极大提升训练稳定性。

    - 截断技巧（Truncation Trick）：在推理时，通过对潜在噪声 z 进行截断（限制其超出某个范围的值），牺牲一部分多样性以换取更高的保真度。常用方法是把 zz 的值约束在阈值内，或使用平均潜在向量。

    - 共享类条件嵌入：在生成器和判别器中共享类别嵌入矩阵，提升条件建模效率。

    - 正交正则化：防止滤波器间的共线性，促使生成的特征多样化。

    - 多步训练策略：先使用标准 GAN 损失训练，然后转入微调阶段，采用铰链损失（Hinge loss）等。

    这些方法共同使得 BigGAN 能在复杂数据集上生成极为逼真的图像，但也需要巨大的计算资源。


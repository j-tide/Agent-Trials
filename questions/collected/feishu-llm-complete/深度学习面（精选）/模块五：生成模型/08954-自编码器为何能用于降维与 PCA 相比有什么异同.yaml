content:
  prompt: 自编码器为何能用于降维？与 PCA 相比有什么异同？
answer:
  mode: rubric
  reference_answer: |-
    自编码器降维原理

    编码器将高维数据压缩到低维瓶颈层（如2维或3维）。由于网络必须通过低维表示重建原始数据，该表示被迫捕获数据中最关键的变化因素，丢弃冗余和噪声。在低维空间中，相似的样本会被映射到相近的位置，从而实现非线性降维。

    与 PCA 的异同

    - 相同点：

    - 都是降维技术，将数据投影到低维空间。

    - 都可以通过最小化重构误差来优化（PCA 最小化投影后的重构误差，等价于最大化保留方差）。

    - 均可用于数据压缩、去噪和可视化。

    - 不同点：

    [图片内容未导入]

    - 有监督 vs 无监督的细微差异：虽然两者都是无监督，PCA 有解析解（特征分解），自编码器需通过梯度下降迭代训练。

    - 正交性：PCA 的主成分相互正交；自编码器潜在维度不一定正交。

    - 可逆性：PCA 重构矩阵是编码矩阵的转置（正交变换），自编码器的编码器和解码器参数独立，无此约束。

    - 全局最优：PCA 得到全局最优的线性投影（在均方误差意义下）；自编码器可能陷入局部极小。

    如果自编码器使用线性激活且瓶颈层无偏置，训练收敛后能复现 PCA 的主子空间，但不等同于 PCA 主成分。在实践中，深度自编码器能够捕捉 PCA 无法表征的高度非线性结构。


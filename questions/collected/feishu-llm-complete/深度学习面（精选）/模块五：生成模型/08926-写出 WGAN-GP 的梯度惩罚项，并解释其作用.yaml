answer:
  mode: rubric
  reference_answer: |-
    梯度惩罚项

    [图片内容未导入]

    梯度惩罚项通过在真实分布和生成分布之间的区域施加约束，鼓励 critic 的梯度范数接近 1。这迫使 critic 成为一个平滑的、满足 Lipschitz 限制的函数，而又不像权重裁剪那样限制网络容量。惩罚仅作用在插值点上，因为这些点位于两个分布的支撑集之间，是梯度最可能违反约束的区域。最终使得 critic 能够提供有意义的梯度来指导生成器更新，保障训练稳定。


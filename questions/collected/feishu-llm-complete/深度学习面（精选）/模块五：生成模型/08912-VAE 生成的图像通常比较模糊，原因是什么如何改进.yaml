content:
  prompt: VAE 生成的图像通常比较模糊，原因是什么？如何改进？
answer:
  mode: rubric
  reference_answer: |-
    模糊原因

    - 高斯似然假设：VAE 通常假设 pθ(x∣z) 为各向同性的高斯分布，此时最大化对数似然等价于最小化 MSE。MSE 损失倾向于预测“平均”结果，因为在对不确定的细节进行平均时，均方误差最小，导致高频细节丢失，图像模糊。

    - 潜在空间的过分平滑：KL 项强制潜在空间为标准正态，限制了模型编码细粒度细节的能力。模型可能忽视次要的变化因素，仅捕获主要的全局结构。

    - 后验崩塌：强大解码器可能忽略 z 中的部分信息，只依赖自身生成模糊的平均图；但主要问题仍是似然性质。

    改进方法

    - 更强大的解码器：使用 PixelCNN、自回归解码器，避免独立像素假设。

    - 对抗损失：结合 GAN 的判别器（VAE-GAN），用对抗损失替换或补充像素级损失，能够产生更清晰的图像。

    - 更好的先验：使用更复杂的先验（如 VampPrior、可学习先验），而非固定标准正态。

    - 感知损失：在特征空间计算重构误差，保留纹理和边缘。

    - VQ-VAE：使用离散潜在表示和高性能解码器（如 PixelCNN 先验），生成质量大幅提升。

    - 调整 KL 权重：采用 β-VAE 或退火策略，增加重构项权重或逐步增加 KL 项影响。


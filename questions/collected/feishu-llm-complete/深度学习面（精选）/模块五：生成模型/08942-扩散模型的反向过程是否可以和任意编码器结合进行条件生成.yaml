content:
  prompt: 扩散模型的反向过程是否可以和任意编码器结合进行条件生成？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - 文本编码器：如 CLIP、T5，用于文本到图像生成。

    - 图像编码器：如 VAE 编码器，将条件图像映射为嵌入，用于图像翻译、修复。

    - 音频编码器：用于音频驱动的视觉生成。

    - 类别嵌入：用于类别条件生成。

    - 图编码器：如场景图、布局编码器。

    条件信息通常通过交叉注意力、拼接或特征相加的方式注入 U-Net 的中间层。训练时，只需将条件编码器的输出作为网络输入的一部分，端到端训练（或编码器固定，仅训练 U-Net）。

    例子：

    - Stable Diffusion 使用 CLIP 文本编码器，条件通过交叉注意力融入。

    - ControlNet 使用额外的空间编码器（如边缘检测网络），并将其多尺度特征注入 U-Net。

    - Video diffusion 可使用时间编码器。

    因此，扩散模型的反向过程是一个通用的去噪器，只要提供适当的条件嵌入，就可以与各种模态的编码器无缝结合，实现灵活的条件生成。


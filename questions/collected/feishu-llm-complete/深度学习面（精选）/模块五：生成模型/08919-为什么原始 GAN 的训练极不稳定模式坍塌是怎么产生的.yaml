  prompt: 为什么原始 GAN 的训练极不稳定？模式坍塌是怎么产生的？
answer:
  mode: rubric
  reference_answer: |-
    训练不稳定的原因

    [图片内容未导入]

    模式坍塌（Mode Collapse）

    模式坍塌是指生成器只生成少数几种样本（甚至一种），不能覆盖真实数据分布的所有模式。例如在 MNIST 上，生成器可能只生成数字“1”，而无法生成其他数字。

    产生原因：

    - 生成器发现某个或某几个样本能够很好地欺骗当前的判别器，就会倾向于只产生这些“安全”的样本。

    - 判别器在应对这种单一模式时，可能会暂时被欺骗，但随后学会了识别该模式，生成器再跳到另一个模式，形成恶性循环。

    - 从优化角度看，生成器试图最小化 log⁡(1−D(G(z))) 等价于反转 KL 散度，该散度对覆盖所有模式惩罚较轻，更鼓励生成器集中在少数高似然模式上，加重了模式坍塌。


content:
  prompt: GAN 的训练过程是一种什么博弈？其最优解是什么？
answer:
  mode: rubric
  reference_answer: |-
    GAN 的训练可视为一种二人零和博弈。生成器和判别器轮流更新参数，各自试图优化自己的目标函数，但两个目标完全对立。

    从博弈论角度，判别器希望最大化 V(D,G)，生成器希望最小化 V(D,G)，最终收敛到鞍点（纳什均衡）。在该均衡点，生成器完全捕获了真实数据分布，判别器无法区分真假，对任何输入都输出 0.5。


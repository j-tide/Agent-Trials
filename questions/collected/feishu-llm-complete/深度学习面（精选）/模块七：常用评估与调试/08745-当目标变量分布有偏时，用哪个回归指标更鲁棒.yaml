content:
  prompt: 当目标变量分布有偏时，用哪个回归指标更鲁棒？
answer:
  mode: rubric
  reference_answer: |-
    目标变量有偏（如长尾分布、存在极端值）时，基于平方误差的 MSE/RMSE 会被离群值主导，导致评估偏向大值端。此时更鲁棒的指标有：

    - MAE（平均绝对误差）：因线性惩罚，不受少数极端值大幅影响。

    - MAPE（平均绝对百分比误差）：相对误差，无量纲，但要求非零，且对小值惩罚重（当真实值很小，百分比误差极大）。对正数有偏分布可用，但需注意处理真实值为零的情况。

    - 中位数绝对误差（MedAE）：取绝对误差的中位数，完全忽略离群值的大小，非常鲁棒。

    - 分位数损失（Quantile Loss）：可评估不同分位数，对离群值不敏感。

    - Huber Loss：结合 MSE 和 MAE，对离群值鲁棒。

    通常，如果目标是典型用户，可用 MAE 或 MedAE；如果关心所有用户的平均误差，可使用 Huber 损失。选用时也需考虑业务解释，比如 MAE 直观易懂。


content:
  prompt: 模型调试中，如何有效地使用可视化工（如 Grad-CAM、注意力图）来分析模型行为？
answer:
  mode: rubric
  reference_answer: |-
    可视化工具将模型内部决策过程呈现为人类可理解的图像或热图，是调试黑盒模型的重要手段。

    Grad-CAM (Gradient-weighted Class Activation Mapping)

    - 原理：对特定类别，计算卷积特征图对类别得分的梯度，将这些梯度全局平均作为每个特征图的权重，加权求和后过 ReLU，生成粗粒度的热力图，高亮输入中对决策最重要的区域。

    - 应用：

    注意力图（Attention Maps）

    - 对 Transformer 模型，可视化自注意力权重（通常是编码器或解码器中的注意力矩阵）。

    - 应用：

    其他可视化

    - 特征图可视化：直接查看中间层特征图，直观理解不同滤波器学习到的纹理、边缘等模式。

    - 积分梯度（Integrated Gradients）：提供像素级归因，更精细，适合调试图像分类。

    - t-SNE/UMAP 投影：可视化样本在特征空间的分布，发现类别重叠、离群点。

    调试流程

    - 选取典型样本（正确、错误、边界样本）。

    - 使用 Grad-CAM 或注意力图生成解释。

    - 若发现模型关注错误区域 → 清洗数据、增强相关区域、修改网络结构（如引入注意力引导）。

    - 结合定量指标（如指向游戏的 Pointing Game 准确率）评估归因的可靠性。

    可视化不仅帮助诊断问题，还可用于向非技术相关方解释模型行为，增强信任。


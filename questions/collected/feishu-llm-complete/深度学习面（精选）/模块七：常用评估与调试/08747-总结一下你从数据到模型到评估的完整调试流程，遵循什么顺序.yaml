content:
  prompt: 总结一下你从数据到模型到评估的完整调试流程，遵循什么顺序？
answer:
  mode: rubric
  reference_answer: |-
    一个系统化的调试流程可以最大化定位问题的效率。推荐的顺序如下：

    第一阶段：数据质量保证

    - 数据探查：随机查看原始样本和标签，确认人眼可分辨。统计数据分布（类别、特征范围）。

    - 数据预处理验证：检查归一化、缺失值处理、编码的正确性。确保训练/验证/测试集划分无重叠（尤其时序数据）。

    - 数据增强可视化：预览增强后的样本，确认变换后标签仍正确。

    - 数据管道测试：运行一遍 DataLoader，检查批次形状、数值范围、是否含 NaN。

    第二阶段：模型与优化基础

    - 过拟合小样本测试：取一个小数据集（如100样本），关闭正则化，训练模型，看能否迅速达到极低训练误差（如准确率100%）。若不能，说明模型实现或优化器有严重 Bug。

    - 梯度检查：对自定义层或怀疑的组件，用数值梯度验证反向传播。

    - 初始损失验证：在随机初始化后，运行前向传播，检查损失是否在预期理论值附近（如分类 log(C)）。偏差过大提示损失函数或初始化错误。

    - 层输出统计：前向传播一个 batch，记录每层输出的均值、方差，确保无极端值。

    第三阶段：训练动态监控

    - 启动正式训练，启用 TensorBoard/Wandb 监控：

    - 早期诊断：若损失不下降，参考前面问题排查学习率、梯度、初始化。若损失震荡，降低学习率或启用梯度裁剪。若出现过拟合，增加正则化/数据。

    - 学习曲线分析：随数据量增加绘制训练/验证误差，判断偏差/方差问题，决定是增加模型容量还是增加数据/正则化。

    第四阶段：深度分析与优化

    - 错误分析：利用混淆矩阵、错误样本聚类、Grad-CAM 等定位模型弱点。

    - 公平性与子群体评估：按属性切片，检查子群性能差距。

    - 鲁棒性测试：在扰动集、对抗样本上测试，评估可靠性。

    - 不确定性分析：用 MC Dropout 或集成检查预测置信度。

    - 根据分析结果迭代：针对性清洗数据、调整增强策略、修改网络结构或训练超参数。

    第五阶段：最终评估与复现

    - 固定所有随机种子，独立地在测试集上评估一次，记录最终指标及置信区间。

    - 对比基线或论文结果，撰写详细的实验记录和模型卡片。

    这个流程从确保数据正确性开始，逐步深入到模型训练和性能分析，每次改动都需对照实验，是高效排查和提升模型的系统方法论。

    - L2 正则化（权重衰减）：约束权重大小。

    - L1 正则化：产生稀疏权重，有特征选择作用。

    - Dropout：训练时随机屏蔽部分神经元，防止共适应。

    - 批归一化（Batch Normalization）：自带轻微正则化效果。

    - 预测方差：计算多次预测概率的方差，高方差指示模型对该样本的预测不稳定，即高“认知不确定性”（Epistemic Uncertainty）。

    - 预测熵：对平均预测概率计算熵，同时包含了认知不确定性和数据本身的不确定性（Aleatoric Uncertainty）。

    - 哪些类易混淆：观察非对角线上的高数值，如“猫”经常被误判为“狗”，则说明模型难以区分这两个视觉相似类。

    - 单类高错误率：某类对应的行和列都有很多错分，表示该类本身特征模糊或样本量不足。

    - 偏斜分布：模型可能倾向于将样本分到大类，忽略小类。

    - 增加多样性：收集各种背景、光照、姿态下的训练数据，打破虚假相关。

    - 数据增强：使用 Cutout、Mixup、CutMix 等，强制模型不依赖单一区域。

    - 针对性负采样：对含有虚假特征的正样本，进行过采样不含该特征的正样本。

    - 对抗训练：训练模型对背景变化不敏感。

    - 域泛化/域适应：如 IRM (Invariant Risk Minimization)，学习在多个环境中都稳定的特征。

    - 特征解缠：通过设计或正则化，分离背景特征与目标特征。

    - 正则化：如对特征归因图施加平滑或约束，防止关注过小区域。

    - 多任务学习：迫使模型预测背景属性或进行分割，显式分离。

    - 检测到虚假特征后，可对模型进行剪枝或微调，或集成人机回环进行清洗。

    - 检查是否关注正确目标：对正确分类的样本，热力图应覆盖目标物体主体。如果热图散布在背景或无关区域，模型可能依赖了虚假特征。

    - 错误案例分析：对错误分类样本，观察其热图。若模型预测为“马”，但高亮的是“人骑手”区域，说明模型可能将骑手特征与马关联。可据此改进数据增强或清洗数据。

    - 多模型对比：同一张图，用 Grad-CAM 比较不同模型（如基线 vs 改进模型）的关注区域，评判改进是否使关注更合理。

    - 定位偏见：如对所有包含水的图片，模型都关注水面来判断是否“船”，而忽略了船本身，提示背景偏见。

    - 检查注意力是否捕捉到语法结构（如主语-谓语）、长距离依赖。

    - 在文本生成中，查看生成某个词时注意力集中在源句的哪些词上，判断对齐质量。

    - 发现注意力过度集中的问题（某些 token 吸引了全部注意力），可能需引入覆盖率机制。

    - 损失曲线（训练和验证），学习率。

    - 梯度范数和参数更新量。

    - 权重和激活值的直方图。

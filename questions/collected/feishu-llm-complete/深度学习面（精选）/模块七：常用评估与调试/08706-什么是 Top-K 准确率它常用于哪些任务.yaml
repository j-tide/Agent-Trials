content:
  prompt: 什么是 Top-K 准确率？它常用于哪些任务？
answer:
  mode: rubric
  reference_answer: |-
    Top-K 准确率：在分类时，对于每个样本，如果真实标签出现在模型预测概率最高的 K 个类别之中，则认为预测正确。例如 Top-5 准确率：预测的 top-5 类别中包含真实标签即算对。

    适用任务：

    - 图像分类：ImageNet 竞赛常用 Top-1 和 Top-5 准确率，因为一张图像可能包含多个可能的标签或类别间有模糊性，允许模型有多选机会。

    - 推荐系统：评估推荐列表的命中率，如 Top-N 推荐，用户是否点击了列表中的某个商品。

    - 信息检索：查准率@K、召回率@K。

    - 大规模词汇识别/语言模型：衡量模型在多义词和近义词上的容错能力。

    它降低了严格单标签评估带来的惩罚，对类别数量极大、存在歧义的任务更为公平。


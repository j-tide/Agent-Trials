content:
  prompt: 准确率作为分类指标有什么缺陷？为什么在样本不均衡时不可靠？
answer:
  mode: rubric
  reference_answer: |-
    准确率（Accuracy） 定义为预测正确的样本数占总样本数的比例：

    [图片内容未导入]

    其中 TP=真正例，TN=真负例，FP=假正例，FN=假负例。

    缺陷：

    - 对类别分布敏感：当类别严重不均衡时，准确率会高估模型性能。例如某二分类任务中负样本占 99%，模型只需将所有样本预测为负类，就能获得 99% 的准确率，但完全无法识别正类，毫无实用价值。

    - 无法反映不同类型的错误代价：它将假正例和假负例视为同等重要，但在很多场景（如疾病诊断、欺诈检测）中漏掉一个正例的代价远高于误判一个负例，准确率掩盖了这些细节。

    - 多分类时忽略小类别：对于多类问题，即使某些小类完全预测错误，只要大类正确率高，整体准确率仍可能很高，无法衡量模型在小类上的表现。

    因此，在不均衡数据上，更应关注精确率、召回率、F1 分数、PR 曲线等指标。


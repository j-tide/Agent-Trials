content:
  prompt: 在调试模型时，你首先会检查哪些东西？（如数据、损失、梯度、初始化）
answer:
  mode: rubric
  reference_answer: |-
    系统检查清单：

    - 数据

    - 输入输出对齐：确保特征和标签一一对应，没有错位。

    - 数据预处理：归一化/标准化是否正确？缺失值是否处理？类别变量编码无误？

    - 数据泄漏：训练集和验证/测试集是否有重叠？时间序列是否未来信息泄露？

    - 标签分布：极度不均衡？存在错误标签？

    - 数据样本查看：随机抽取几个样本，可视化特征和标签，人工确认。

    - 模型定义

    - 层连接：输入输出维度匹配，没有形状错误。

    - 激活函数：最后一层是否合理（分类用softmax/sigmoid，回归用线性）？

    - 损失函数：与任务匹配（交叉熵、MSE等），留意是否需加掩码。

    - 参数初始化：避免全零初始化，使用合理的初始化方法（He/Xavier）。

    - 模型模式：训练时 .train()，评估时 .eval()，影响Dropout/BN。

    - 训练流程

    - 优化器：类型和超参数（学习率、动量等）合适？

    - 梯度计算：loss.backward() 是否正确调用，optimizer.zero_grad() 在每步开始调用？

    - 学习率调度：如果使用，初始学习率不会太大或太小。

    - 梯度与数值稳定性

    - 梯度检查：实现一个小型梯度检查（详见下题），验证反向传播正确性。

    - 损失值：初始 loss 是否在预期范围内（如分类 log(C)）？

    - 梯度范数：是否爆炸（>10^3）或消失（<1e-7）？必要时启用梯度裁剪。

    - 参数更新量：观察权重变化与权重值的比例，过小可能学习率太低。

    - 过拟合测试

    - 在一个小批量数据（如100个样本）上训练，看损失能否降到几乎为0。如果不能，说明模型/优化有问题。

    - 监控工具

    - 使用 TensorBoard 或 Wandb 记录损失、准确率、梯度、权重的直方图等。

    通过以上步骤，可以快速定位大部分初始问题。


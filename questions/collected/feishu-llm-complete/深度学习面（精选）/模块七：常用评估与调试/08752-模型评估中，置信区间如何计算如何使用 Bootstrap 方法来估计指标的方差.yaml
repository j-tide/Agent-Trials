content:
  prompt: 模型评估中，置信区间如何计算？如何使用 Bootstrap 方法来估计指标的方差？
answer:
  mode: rubric
  reference_answer: |-
    置信区间（Confidence Interval, CI） 表示指标估计的不确定性。例如，测试集上的准确率为 92% ± 1.5%（95% CI）。它能帮助判断模型A相比B的提升是否显著。

    - 常用方法

    [图片内容未导入]

    Bootstrap 估计指标方差与置信区间的步骤：

    - 假设测试集有 N 个样本，具有真实标签和模型预测。

    - 重复以下步骤 B 次（B通常为1000或更多）：

    - 得到 B 个 Bootstrap 统计量的经验分布。

    [图片内容未导入]

    示例（Python 伪代码）：

    def bootstrap_ci(y_true, y_pred, metric_func, B=1000, alpha=0.95):
        n = len(y_true)
        scores = []
        for _ in range(B):
            idx = np.random.choice(n, size=n, replace=True)
            score = metric_func(y_true[idx], y_pred[idx])
            scores.append(score)
        lower = np.percentile(scores, (1-alpha)/2 * 100)
        upper = np.percentile(scores, (1+alpha)/2 * 100)
        return np.mean(scores), lower, upper

    评估指标差异的显著性

    - 为比较模型A和B，可采用配对 Bootstrap：对同一测试集，计算每个 Bootstrap 样本上两模型指标之差，得到差的分布，若差的95%置信区间不包含0，则差异显著。

    - 或者使用配对 t 检验、McNemar 检验等。

    注意事项：

    - 测试集必须真实反映未来数据分布；若存在概念漂移，Bootstrap 只能反映测试集上的不确定度。

    - 对于图像、文本等样本，当数据集有内在分组结构（如同一患者多张影像），应使用 block bootstrap，保持组内样本一起抽样，否则会低估方差。

    - 指标若接近极端值（0或1），Bootstrap 可能产生边界效应，BCa 校正更合适。


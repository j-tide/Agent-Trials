content:
  prompt: 检索系统的评估中，Recall@K、Precision@K、MRR、NDCG 分别衡量什么？
answer:
  mode: rubric
  reference_answer: |-
    - Recall@K（召回率@K）：前 K 个检索结果中相关项目的数量占所有相关项目总数的比例。衡量系统找到所有相关结果的能力，适合高召回需求场景（如专利检索）。

    - Precision@K（精确率@K）：前 K 个结果中相关项目的比例。衡量前 K 个结果的纯度，适合用户只关注第一页结果的场景（如网页搜索）。

    - MRR (Mean Reciprocal Rank)：每个查询中第一个相关文档的排序位置的倒数的平均值。重视第一个正确答案出现的位置，适合导航类查询（如寻找一个特定的页面）。

    [图片内容未导入]

    NDCG (Normalized Discounted Cumulative Gain)：考虑排序位置和相关度等级（如0-3分），越相关得分越高，位置越靠后折扣越大。NDCG 对多级相关性评估极为有效。

    [图片内容未导入]

    - NDCG = DCG / IDCG（理想排序下的DCG），值在0~1之间。NDCG 是排序质量的金标准。


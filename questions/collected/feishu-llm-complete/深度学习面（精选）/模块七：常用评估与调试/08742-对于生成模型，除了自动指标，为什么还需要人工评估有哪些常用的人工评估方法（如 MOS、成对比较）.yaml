content:
  prompt: 对于生成模型，除了自动指标，为什么还需要人工评估？有哪些常用的人工评估方法（如 MOS、成对比较）？
answer:
  mode: rubric
  reference_answer: |-
    为什么需要人工评估：

    - 自动指标（如 BLEU、ROUGE、FID）往往只捕捉表面统计特征，难以评估语义正确性、创意、情感、风格等高级属性。

    - 生成任务常追求自然性、多样性、上下文连贯性，这些目前没有完美自动度量。

    - 人类感知更全面，可以发现自动指标无法捕捉的缺陷（如逻辑谬误、不恰当幽默、文化敏感性）。

    - 自动指标和人类偏好可能存在偏差（如 FID 不一定完全反映人眼感知质量）。

    常用人工评估方法：

    - MOS (Mean Opinion Score)：评估者根据特定标准（如自然度、清晰度）给生成样本打分（1-5 分），取平均分。简单直观，但受评估者个人偏好影响，需要足够多评估者。

    - 成对比较 (Pairwise Comparison)：给定一对生成样本，由评估者选择更好的那个。通过 Elo 评分或 Bradley-Terry 模型得出相对排序。比单点打分更易判别，可靠度更高。

    - 排名 (Ranking)：对多个输出排序。能提供更多细粒度信息。

    - 多维评分：分别对多个维度打分，如流畅度、一致性、信息量、趣味性。更全面。

    - A/B 测试（在线）：用户无意识地给出反馈（点击、停留时间），反映真实偏好。

    质量控制：须设计清晰任务指南，招募足够数量、有代表性的评估者，进行一致性检验（如 Krippendorff's alpha），剔除无效评估。人工评估成本高、慢，但仍是验证生成质量的关键环节。


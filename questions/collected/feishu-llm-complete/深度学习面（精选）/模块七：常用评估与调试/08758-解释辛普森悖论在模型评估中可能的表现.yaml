content:
  prompt: 解释“辛普森悖论”在模型评估中可能的表现。
answer:
  mode: rubric
  reference_answer: |-
    辛普森悖论是指：在分组数据中观察到的趋势，当合并所有组时趋势发生逆转。在模型评估中，表现为整体性能指标与各子群性能指标的趋势相矛盾。

    场景举例：

    假设有两款推荐模型A和B，在用户群中进行评估。分别在高活跃用户（多点击）和低活跃用户（少点击）中统计点击率（CTR）：

    [嵌入表格未展开]

    计算整体：

    - 模型A整体CTR = 0.8×0.10 + 0.2×0.02 = 0.084 = 8.4%

    - 模型B整体CTR = 0.8×0.12 + 0.2×0.01 = 0.098 = 9.8%
    整体看 B 优于 A。

    但如果用户群分布不是固定的，或者我们更关注低活跃用户体验，可能决策不同。更经典的辛普森悖论表现：模型A在两组中均优于B，但整体B优于A，这是由于分组样本量比例差异巨大，且模型在不同组效果差异大导致。

    真实案例：

    - 医疗诊断：某AI诊断系统在总体准确率上优于另一系统，但在各年龄段分别计算时，另一系统却在每个年龄段都更优。原因可能是新系统在大量年轻人的简单案例上表现稍好，而在复杂老年案例上表现略差，但由于年轻样本占比极大，掩盖了老年群体上的劣势。

    - 面部识别：整体识别准确率模型A > 模型B，但按人种分组后，模型B在所有主要人种上准确率都高于A，原因可能是模型A在占绝大多数的人种A上表现极好，但在少数人种上极差，整体依然占优。

    如何避免与检测：

    - 细分评估：按关键属性（地域、活跃度、类别）分组报告指标，不要只看整体。

    - 标准化整体指标：当分组分布与目标分布不同时，可使用标准化/加权的指标（如按各子群等权平均），而非原始整体平均。

    - 可视化对比：绘制各子群的指标条形图，观察是否存在逆转。

    - 统计交互作用：检查模型与分组的交互项，若显著，说明存在辛普森悖论风险。

    辛普森悖论提醒我们，模型评估不能停留在顶层，深入子群分析才能发现真实效果与公平性问题。

    - 依赖 Inception 网络对 ImageNet 类别的敏感度，不适用于其他类型图像。

    - 对模式坍塌不完全敏感（即使只生成一个类内的清晰图像，IS 仍可较高）。

    - 对生成图像的细微噪声或伪影不敏感。

    - 无法检测过拟合（如果生成样本仅记忆训练样本，IS 仍可能高）。

    - 对于生成文本，统计每个 n-gram（通常 n=1~4）的出现次数，并截断为在参考译文中该 n-gram 的最大出现次数（避免重复生成抬高分数）。

    [图片内容未导入]

    - 计算每个 n 的 precision：

    - 计算几何平均再乘以简短惩罚 BP：

    - ROUGE-N：计算 n-gram 召回率，类似 BLEU 但以 recall 为主：

    - 替换（Substitution）：参考词被识别为另一个词。

    - 删除（Deletion）：参考词未被识别出来。

    - 插入（Insertion）：识别结果中多出了参考中没有的词。

    - 基于查询的估计梯度，或使用替代模型生成对抗样本。

    - 自然鲁棒性测试：加噪声、模糊、颜色抖动、旋转、光照变化、合成雨雾等。

    - 归一化后的平均：将每个任务的指标归一化到[0,1]或基于基线模型的相对提升百分比。

    - 排名平均：对每个任务按性能排序，取平均排名。

    - 调和平均：若关注所有任务都不能太差，可用调和平均。

    - 从测试集中有放回地随机抽取 N 个样本，形成一个 Bootstrap 样本（可能包含重复）。

    - 在该 Bootstrap 样本上计算感兴趣的评价指标（如 F1-score、RMSE），得到 θi∗。

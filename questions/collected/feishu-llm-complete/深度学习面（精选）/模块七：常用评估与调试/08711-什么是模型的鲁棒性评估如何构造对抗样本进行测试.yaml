content:
  prompt: 什么是模型的鲁棒性评估？如何构造对抗样本进行测试？
answer:
  mode: rubric
  reference_answer: |-
    鲁棒性评估衡量模型对输入微小扰动或不相关变化的稳定性和抵抗欺骗的能力。在安全攸关应用中（自动驾驶、身份验证），鲁棒性至关重要。

    对抗样本构造方法：

    - 白盒攻击（知道模型参数和梯度）：

    [图片内容未导入]

    - PGD (Projected Gradient Descent)：迭代 FGSM，每次小步加扰动并投影回允许范围，更强大。

    - CW (Carlini & Wagner)：优化小扰动使错误分类，同时最小化 L2 距离。

    - 黑盒攻击（无梯度信息）：

    评估：在标准测试集上应用各种扰动，观察准确率下降程度。也可以报告攻击成功率（扰动后被错误分类的比例）。好的模型应具有低攻击成功率和高自然干扰下的稳定性。

    鲁棒性评估应与常规准确率共同考量，因为鲁棒性与标准精度常常互为 trade-off。


content:
  prompt: 为什么 BLEU 不适合评价开放域对话生成？有什么更好的自动评价指标？
answer:
  mode: rubric
  reference_answer: |-
    BLEU 的局限性

    - 开放域对话没有标准答案，存在大量合理回复，BLEU 要求与有限参考严格匹配，会惩罚合理但措辞不同的回复。

    - 对话追求自然流畅、上下文一致、情感适当，而 BLEU 只看 n-gram 重叠，无法评估这些维度。

    - 回复长度差异大，简短通用回复（如“好的”）可能因高频词匹配而获得不合理的 BLEU 高分，但实际是无意义回复。

    更好的自动评价指标

    - 基于词向量的相似度：如 Greedy Matching、Embedding Average、Vector Extrema，计算生成回复与参考回复的词嵌入相似度，容忍同义词变化。

    - BERTScore：利用预训练 BERT 上下文嵌入计算生成文本与参考文本的 token 级相似度（精确率、召回率、F1），与人类判断相关性显著高于 BLEU。

    - BLEURT：基于 BERT 的回归模型，在大量人工评分数据上微调，直接预测人类评分，对语义变化更敏感。

    - MoverScore：将词移距离（Word Mover's Distance）推广到上下文嵌入，测量语义差异。

    - Perplexity（困惑度）：仅衡量语言模型的流畅度，但无法评估回复相关性。

    - 人工评估：目前仍是最可靠的，常用多维评分（流畅性、一致性、趣味性）或 A/B 测试。

    开放域对话常用人工评估结合自动指标（如 BERTScore）作为辅助。


content:
  prompt: 当训练不稳定时，如何通过降低学习率、使用梯度裁剪、调整初始化来缓解？
answer:
  mode: rubric
  reference_answer: |-
    训练不稳定表现为损失值大幅波动、出现NaN，或者损失曲线呈现剧烈的锯齿状。三种常用的缓解手段及其作用机理如下：

    降低学习率

    过高的学习率会导致参数更新步幅过大，越过最优区域，在损失曲面上来回震荡。具体措施：

    - 直接减小初始学习率：将学习率缩小3到10倍观察损失曲线是否趋于平滑。例如从1e-3降到3e-4。

    - 学习率预热（Warmup）：在训练最初几千步内，学习率从一个极小的值（如1e-7）线性增加到目标学习率。这对Transformer等模型尤其重要，因为初期权重随机，过大的学习率会破坏梯度的稳定。

    - 学习率衰减：使用余弦衰减、阶梯衰减或指数衰减，在训练后期逐步减小学习率，使模型精细收敛。

    - 自适应优化器的调整：如果使用Adam，可尝试降低默认学习率（如3e-4），并减小β2（如从0.999降至0.98），让二阶矩估计对近期梯度变化更敏感，降低震荡。

    梯度裁剪

    当某些步骤产生极大的梯度时（梯度爆炸），直接限制其最大范数可以强制稳定更新。

    - 按范数裁剪：torch.nn.utils.clip_grad_norm_(parameters, max_norm)，通常设置max_norm在0.5~5之间。它保持梯度方向不变，只将其长度压缩到阈值内。

    - 按值裁剪：对每个梯度元素独立裁剪，限制其最大值和最小值。但这会改变梯度方向，较少使用。

    - 裁剪不仅能防止梯度爆炸导致的NaN，也可以使训练对学习率更鲁棒。

    调整初始化

    不恰当的初始化会使得各层激活值或梯度方差逐层指数衰减或增长，导致训练初期就不稳定。

    - 使用针对激活函数的初始化：ReLU应使用He初始化（kaiming_uniform_），Tanh/Sigmoid用Xavier初始化（xavier_uniform_）。错误的初始化会让大部分神经元死亡或饱和。

    - 调整初始化的增益：对于某些变体如Leaky ReLU，需调整a参数匹配负斜率。

    - 残差网络特殊初始化：在ResNet中，通常将残差分支的最后一个卷积层初始化为零，使得初始阶段残差块近似恒等映射，有助于深度网络稳定训练。

    - 正交初始化：对RNN/LSTM，使用正交初始化可以缓解梯度消失/爆炸。

    - 偏置初始化：大多数情况下偏置可初始化为0，但LSTM的遗忘门偏置常设为1以促进长期记忆；ReLU层的偏置也可微正（如0.01）以避免死亡。

    综合使用：通常，检查并修正初始化 → 设置温和的学习率（配合warmup）→ 添加梯度裁剪可以解决大多数训练不稳定问题。此外，监控梯度范数和损失，迭代调整这些超参数是调优的关键步骤。


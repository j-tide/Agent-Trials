content:
  prompt: 图像生成常用的指标 IS 和 FID 是如何计算的？FID 为什么通常比 IS 更优？
answer:
  mode: rubric
  reference_answer: |-
    Inception Score (IS)

    - 计算过程：

    [图片内容未导入]

    - 高 IS 意味着单张图像类别明确（低条件熵）且整体类别多样（高边缘熵）。IS 衡量生成图像的清晰度和多样性，但仅考虑生成样本，未与真实样本比较。

    - 缺陷：

    Fréchet Inception Distance (FID)

    - 计算过程：

    [图片内容未导入]

    - 较低的 FID 表示生成分布与真实分布更接近，图像质量和多样性都更好。

    FID 优于 IS 的原因

    - FID 直接对比生成样本与真实样本的特征分布，而 IS 仅依赖生成样本自身的类别分布，未与真实数据比较。

    - FID 对模式坍塌更敏感：若生成器只生成少数模式，其协方差将远小于真实协方差，FID 急剧升高。

    - FID 在不同数据集上的一致性更好，且对人类感知质量的相关性更强。

    - FID 不要求类别标签，对非自然图像也能合理评估（只要有合适的特征提取器）。

    - IS 可能被对抗样本“欺骗”，而 FID 更能反映整体分布偏移。

    因此，FID 是目前图像生成质量评估的主流指标。实践中常同时报告 IS 和 FID，但以 FID 为主要参考。


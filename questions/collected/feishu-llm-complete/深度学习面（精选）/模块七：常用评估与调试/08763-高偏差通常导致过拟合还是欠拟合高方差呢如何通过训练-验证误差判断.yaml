content:
  prompt: 高偏差通常导致过拟合还是欠拟合？高方差呢？如何通过训练/验证误差判断？
answer:
  mode: rubric
  reference_answer: |-
    高偏差 → 欠拟合。模型太简单，连训练数据中的基本模式都学不到，训练误差和验证误差均处于高位，且两者接近。例如，用线性模型拟合非线性关系，无论训练多少数据，误差始终很高。

    高方差 → 过拟合。模型过度学习了训练数据中的噪声和细节，训练误差极低，但验证误差很高，两者之间存在巨大的差距。例如，用深层神经网络在小数据集上训练，完美记住了训练样本，但对新样本预测很差。

    通过训练/验证误差判断：

    - 高偏差（欠拟合）：训练误差高，验证误差也高，且两者相差不大。提升模型复杂度（增加层数、特征等）可能有效。

    - 高方差（过拟合）：训练误差低，验证误差高，两者差距大。需要更多数据、正则化、Dropout、早停等。

    - 高偏差+高方差：训练误差高，验证误差更高。这种情况出现在模型既欠拟合又过拟合（例如极深的网络在小数据上且训练不充分），或者数据包含大量噪声、特征不足等。

    - 理想情况：训练误差和验证误差都低，且差距小。

    绘制学习曲线（训练误差和验证误差随训练样本数量变化）可以更清晰地判断，下文将详细说明。


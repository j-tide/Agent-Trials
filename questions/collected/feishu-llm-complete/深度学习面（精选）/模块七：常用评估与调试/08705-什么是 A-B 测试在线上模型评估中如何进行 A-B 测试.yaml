content:
  prompt: 什么是 A/B 测试？在线上模型评估中如何进行 A/B 测试？
answer:
  mode: rubric
  reference_answer: |-
    A/B 测试（对照实验）是将流量随机分入实验组（新模型 B）和对照组（旧模型 A），通过比较两组的关键业务指标（如点击率、转化率、留存率）来确定新模型是否带来显著提升。

    在线模型评估的步骤：

    - 定义核心指标（OEC）：如收入、点击率、用户满意度评分。

    - 分流：通过随机哈希将用户均匀分配到 A、B 桶，确保两组用户特征分布一致。

    - 运行实验：同时运行 A 和 B 模型一段时间，通常几天到几周，收集足够样本。

    - 统计检验：计算两组指标差异的置信区间和 p 值（常用 t 检验或 z 检验），判断显著性。

    - 结果分析：除了整体指标，还需分析不同人群、场景下的细分效果，排除辛普森悖论。

    - 做出决策：若新模型显著正向且无负向副作用，则全量上线；否则回退或继续优化。

    注意事项：实验期间避免其他改动，控制网络延迟等因素一致，保证用户和实验员无偏（必要时做盲测）。A/B 测试是衡量线上效果的金标准。


content:
  prompt: 什么是验证曲线？如何通过调整超参数（如正则化强度）观察验证曲线以找到最优值？
answer:
  mode: rubric
  reference_answer: |-
    验证曲线是展示某个超参数（如正则化系数 λ、树的深度、学习率等）与模型训练/验证性能之间关系的曲线。

    绘制方法：固定其他超参数，对目标超参数取一系列值，分别训练模型，记录训练误差和验证误差，绘制两条曲线。

    以 L2 正则化系数 λλ 为例：

    - 当 λ 很小（接近0）时，模型几乎无正则化，训练误差低，验证误差高 → 过拟合。

    - 当 λ 很大时，模型受到强约束，训练误差和验证误差都高 → 欠拟合。

    - 中间某个 λ 值，验证误差达到最低点，此时偏差与方差取得平衡。

    验证曲线形状：

    - 训练误差通常随正则化强度增加而单调上升（模型拟合能力下降）。

    - 验证误差通常是 U 形曲线，先下降后上升。

    寻找最优超参数：

    - 在验证曲线的最低点对应的超参数值即为最佳。

    - 实际应用中，可结合网格搜索、随机搜索或贝叶斯优化，通过交叉验证确定。

    - 不仅要看单一超参数，多参数时可通过热力图可视化交互。

    注意事项：

    - 验证曲线应使用独立的验证集，如果数据集较小，可结合交叉验证。

    - 要关注验证误差的方差（多次实验或交叉验证的波动），避免因随机性误判最优值。

    - 同时监控训练误差，可以诊断过/欠拟合区域，辅助解释。


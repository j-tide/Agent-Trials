content:
  prompt: 如何处理测试集与训练集分布不一致的情况？此时常规评估指标会失效吗？
answer:
  mode: rubric
  reference_answer: |-
    分布不一致（Dataset Shift） 包括协变量偏移、标签偏移、概念漂移等。

    常规指标会失效吗？

    如果分布不一致，测试集上的评估指标可能无法反映模型在新环境下的真实性能。例如，训练集是白天的图片，测试集是夜间的，指标可能大幅下降，但若指标仍高，也可能因为测试集中简单样本占主导，掩盖了模型在关键子集上的失败。因此常规指标可能仍是一个平均度量，但不一定可靠。

    应对措施：

    - 领域适应（Domain Adaptation）：在目标域有少量标注或无标注数据时调整模型。

    - 重要性加权：对训练样本加权，使其分布逼近测试分布。

    - 评估时细分：按子域（如时间、地点）分别评估，报告每个子集的性能。

    - 收集与目标分布匹配的验证/测试集：重新标注或从真实日志中采样。

    - 使用鲁棒性更强的指标：如校准误差、分位数误差。

    - 持续监控：部署后在线评估，及时发现性能退化。

    总之，分布变化下需重新审视评估数据，不能完全信赖旧测试集。


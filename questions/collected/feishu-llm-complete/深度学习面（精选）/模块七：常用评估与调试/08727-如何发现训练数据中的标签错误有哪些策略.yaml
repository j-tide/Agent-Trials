content:
  prompt: 如何发现训练数据中的标签错误？有哪些策略？
answer:
  mode: rubric
  reference_answer: |-
    策略：

    - 模型置信度分析

    - 用已训练的模型对训练集预测，找出预测置信度高但预测标签与给定标签不一致的样本。这些很可能是错误标签。例如，softmax 输出概率 > 0.9 但分类错误，应当人工复核。

    - 对于回归，找出预测误差极大的点。

    - 交叉验证与集成学习

    - 使用 k 折交叉验证，对每一折训练模型，预测其余折样本，收集所有样本的预测结果。找出始终被模型“错分”的样本，即在不同模型下都出错的样本，很可能是标签错误。

    - 数据清洗工具（如 Cleanlab）

    - 利用 confident learning 原理，估计噪声标签和真实标签的联合分布，识别出潜在的标注错误。Cleanlab 可以基于 sklearn/pytorch 模型输出概率，给出标签质量评分和建议纠正。

    - 最近邻一致性检查

    - 对于每个样本，找到它的最近邻（特征空间），如果最近邻大部分属于某一类别，而该样本标签不同，则可能标签错误。使用预训练特征提取器（如 CLIP、BERT）可增强效果。

    - 主动学习与人工抽样

    - 用模型预测的不确定性（例如熵、边缘采样）挑选样本，优先人工检查那些模型最不确定或最不典型的样本，往往会发现标注问题。

    - 数据可视化与投影

    - 使用 t-SNE/UMAP 将样本特征投影到二维空间，查看各标签分布。如果某类样本明显聚集，但有一些同类点出现在其他群中，可能是标签错误。

    - 多模态一致性（如图文匹配）

    - 图文检索任务中，若图像描述与图像内容不匹配，可通过 CLIP 等计算相似度识别。

    - 频率与拼写检查

    - 对于文本标签，可通过领域词典检测不可能出现的单词。

    实践：通常先用置信度分析和 Cleanlab 自动识别高概率错误，再人工抽检确认，迭代清洗。


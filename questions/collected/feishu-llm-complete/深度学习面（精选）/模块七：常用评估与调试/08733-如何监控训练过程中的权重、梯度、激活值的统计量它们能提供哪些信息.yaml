content:
  prompt: 如何监控训练过程中的权重、梯度、激活值的统计量？它们能提供哪些信息？
answer:
  mode: rubric
  reference_answer: |-
    监控手段：

    - 使用 TensorBoard 的 add_histogram 记录权重、梯度的分布直方图。

    - 每 N 步记录权重的均值、标准差、范数，梯度的均值、标准差、范数。

    - 记录激活值（层输出）的均值、方差、稀疏度（如 ReLU 后零的比例）。

    提供的信息：

    - 权重

    - 如果权重持续增大，可能学习率过大或无正则化。

    - 权重几乎不更新：学习率太低或梯度消失。

    - 某些层权重全为零：可能该层未连接或权重衰减过大。

    - 权重分布严重偏斜：初始化或优化问题。

    - 梯度

    - 梯度范数（L2范数）过大（如 > 1000）：梯度爆炸，需裁剪。

    - 梯度范数极小（< 1e-8）：梯度消失，深层无法学习。可尝试残差连接、更好的初始化、使用 ReLU 等。

    - 梯度符号振荡：学习率可能过大。

    - 各层梯度尺度差异极大：可能需要层级自适应学习率（如 LARS）。

    - 激活值

    - 激活均值偏离0（对于 tanh/sigmoid）或大量负值（ReLU 死亡）：初始化不佳或学习率问题。

    - 激活方差逐层快速衰减/增大：信号传播问题，需要仔细设计初始化或使用 BN。

    - ReLU 后死神经元比例（输出全零的比例）过高（如 > 50%）：可能学习率过大，或偏置初始化为负，或权重衰减过度。

    - 激活值出现 NaN：数值溢出，立即回溯。

    - 更新量与权重的比例

    - 更新量 / 权重范数 < 1e-3：可能学习率太小，训练几乎停滞。

    - 比例 > 1e-1：可能学习率过大，训练不稳定。

    通过统计量可以实时诊断训练健康度，及时调整超参数或网络结构。


content:
  prompt: 如果梯度检查失败，可能的原因有哪些？
answer:
  mode: rubric
  reference_answer: |-
    - 反向传播实现错误

    - 自定义层的梯度公式推导错误。

    - 忘记对某些输入求导（比如偏置）。

    - 维度处理错误，导致梯度形状不匹配，但被广播无意中掩盖。

    - 数值梯度计算不当

    [图片内容未导入]

    - 损失函数中存在不可微操作

    - 如 random sampling、argmax、sort 等，导致损失函数不连续，数值梯度无意义。需确保前向过程中无可微性断点，或将它们排除。

    - 计算图中包含非确定性操作

    - Dropout 未关闭，BatchNorm 使用了 batch 统计等，导致损失每次计算变化。应在 eval() 模式下或固定所有随机性进行梯度检查。

    - 参数数量太大时抽样检查误差

    - 可能只检查到部分参数，正好遇到错误。应检查所有参数或增加抽样量，尤其关注有问题的层。

    - 数值问题

    - 梯度或损失值过大导致数值溢出，相对误差计算异常。

    - 可先检查损失和梯度的尺度是否正常。

    - 解析梯度和数值梯度定义不一致

    - 例如，解析梯度是平均损失梯度，而数值梯度是总损失梯度，需要在公式中考虑 batch size 的缩放。


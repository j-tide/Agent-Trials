content:
  prompt: 如何对模型预测进行置信度估计？校准曲线（Calibration Curve）和 ECE 是什么？
answer:
  mode: rubric
  reference_answer: |-
    置信度估计：模型输出概率应反映真实似然。例如，当模型给出一批样本预测概率为 0.8 时，大约 80% 的样本实际应为正类。但很多模型（尤其现代深度网络）过度自信或不够自信。

    校准曲线（可靠性图）：

    - 将预测概率从 0 到 1 分桶（如 10 个桶），每个桶内计算平均预测概率（横坐标）和实际正类比例（纵坐标）。

    - 完美校准时，点应落在对角线 y=x 上。

    ECE (Expected Calibration Error)：

    [图片内容未导入]

    改善校准的方法：Platt Scaling、等渗回归、温度缩放（Temperature Scaling）——对 logits 除以一个温度 T，T 在验证集上优化以最小化负对数似然。

    校准在风险敏感领域（医疗、金融）至关重要。


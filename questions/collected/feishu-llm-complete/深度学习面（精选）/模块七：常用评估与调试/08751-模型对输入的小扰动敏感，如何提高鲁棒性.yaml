content:
  prompt: 模型对输入的小扰动敏感，如何提高鲁棒性？
answer:
  mode: rubric
  reference_answer: |-
    当输入发生微小变化（如加噪声、调整亮度、平移等），模型预测结果剧烈变化，说明模型缺乏鲁棒性。提升鲁棒性的方法涵盖数据、训练策略和模型结构多个方面。

    数据增强

    - 多样化的增强策略：训练时加入与扰动类型匹配的增强，如随机噪声、模糊、亮度对比度变化、平移、旋转、缩放、Cutout、Mixup、CutMix等，强制模型学习对这些变化不变的表示。

    - 对抗训练：在训练过程中动态生成对抗样本（如FGSM、PGD），将其加入训练集，使模型学会抵抗恶意扰动。对抗训练可以显著平滑决策边界。

    - 增强的强度控制：逐步增加增强的幅度，防止一开始过强导致无法学习基础特征。

    训练策略

    - 一致性正则化：对于同一无标签样本，施加不同扰动后，模型应产生一致的预测。如半监督学习中的Π-Model、Mean Teacher等，利用扰动一致性作为额外损失。

    - 平滑标签：标签平滑使模型不极度自信，对输入扰动不那么敏感。

    - 知识蒸馏：使用鲁棒的教师模型指导学生模型，传递平滑的决策边界。

    - 随机深度/ DropBlock：在训练时随机丢弃层或块，可视为隐式的模型集成，增强鲁棒性。

    模型结构与推理

    - 使用合适的归纳偏置：卷积的平移等变性天生提供对平移的鲁棒性。对于需要旋转等变的场合，可考虑群等变卷积。

    - 测试时增强（TTA）：推理时对输入做多种增强（如多尺度、翻转），综合多路预测，平滑输出。

    - 噪声注入：在模型中间层或输入层注入微小高斯噪声，类似Dropout，训练时使中间表示对扰动不敏感。

    - 特征去噪：在自监督学习中，学习对损坏特征进行去噪，提高特征鲁棒性。

    评估与诊断

    - 构建扰动测试集（如ImageNet-C、ImageNet-P），定量评估模型对常见损坏的鲁棒性。

    - 可视化对抗扰动下的特征变化，观察哪些层对扰动敏感。

    - 若发现鲁棒性不足，优先从增强和训练策略入手，因为通常不需要修改模型架构。

    通过以上方法，可以使模型在保持清洁数据精度的同时，对多种噪声和干扰具有更好的容忍度。


content:
  prompt: 如何利用超参数搜索（网格搜索、随机搜索、贝叶斯优化）来找到更好的配置？
answer:
  mode: rubric
  reference_answer: |-
    网格搜索（Grid Search）

    - 定义每个超参数的候选值列表，遍历所有组合。

    - 优点：可全面覆盖指定空间，能观察超参数间的交互。

    - 缺点：当超参数数量多或候选值多时，组合数指数爆炸（维度诅咒），计算成本极高。

    - 适用场景：只有少数（1~3）关键超参数需要精细调节，且计算资源充足。

    随机搜索（Random Search）

    - 在超参数空间中随机抽样一定数量的配置，通常按均匀、对数均匀或特定分布抽取。

    - 优点：相比网格搜索，在相同的计算预算下可以探索更多组合，更容易找到优秀区域，因为很多超参数对性能的影响并非在各个维度均匀重要。

    - 缺点：可能错过最优配置，但实践中远优于网格搜索。

    - 使用技巧：对学习率、正则化系数等通常取对数尺度随机采样（如 10^uniform(log_min, log_max)）。

    贝叶斯优化（Bayesian Optimization）

    - 利用代理模型（常用高斯过程或随机森林）拟合超参数与验证性能之间的映射。每次根据采集函数（如预期提升EI、上置信界UCB）选择最有希望提升的下一个点进行试验，更新代理模型。

    - 优点：采样高效，特别适合每次训练开销大的任务（如深度学习），通常较少试验次数即可接近最优。

    - 常用工具：Optuna、Hyperopt、Ray Tune、Scikit-Optimize、BoTorch等。

    - 技巧：可整合早停策略（如 ASHA、Median Stopping），动态终止不良试验，进一步节省资源。

    实际流程

    - 确定核心超参数（如学习率、批大小、优化器、正则化系数）及其搜索范围。

    - 初始可使用少量随机搜索探索大范围，缩小有希望的区域。

    - 采用贝叶斯优化在缩小的区域内精细搜索。

    - 结合交叉验证得到可靠的性能估计。

    - 记录所有试验的超参数、指标和中间检查点，便于分析。

    现代趋势：利用多保真度（Multi-fidelity）方法，如 Hyperband，自适应地分配资源，先快速淘汰差配置，再对好配置投入更多训练轮数。这些方法可大幅提升效率。


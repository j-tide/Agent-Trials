content:
  prompt: 训练过程中 loss 下降，但验证指标不提升（甚至下降），除了过拟合还有哪些可能？
answer:
  mode: rubric
  reference_answer: |-
    - 训练集和验证集分布不一致

    - 验证集来自不同时段、不同来源，导致模型学到的模式无法泛化。

    - 数据预处理不一致：训练时的增广强度远大于验证时的随机噪声，或归一化参数不统一。

    - 验证集太小或噪声过大

    - 验证集样本太少，指标波动大，可能恰好在噪声区间。需增加验证集或使用交叉验证。

    - 验证标签存在错误，导致指标失真。

    - 评估指标与损失函数不匹配

    - 损失函数是交叉熵，验证指标是准确率，可能存在预测概率排序改善，但阈值固定的准确率尚未反映。例如概率校准变好，但准确率暂时不变。

    - 使用不合理指标，如对偏斜数据使用准确率，即使 loss 下降，准确率也可能不提升。

    - 模型仍处于欠拟合状态，但验证误差进入平台

    - 虽然 loss 下降，但验证误差只是波动，未真正改善。可能模型容量不足，或优化陷入局部最小。可调学习率衰减，让其进一步下降。

    - 训练过程中的数据泄露

    - 无意中将验证信息泄露到训练中（如统计特征基于全量数据计算），初期验证指标虚高，随着训练，模型学到真实模式后反而导致验证指标“下降”至正常水平，看似不提升。

    - 优化器动量和学习率调节问题

    - 使用 momentum 或 Adam 时，验证 loss 可能在振荡，虽然训练 loss 下降，验证 loss 有起伏。

    - 标签平滑的影响

    - 训练时用了标签平滑，验证评估用原始 one-hot，可能导致交叉熵 loss 下降但准确率停滞。

    - 早停过晚，模型实际已过拟合

    - 验证误差可能先降后升，如果只看最终点，可能是已经过拟合。

    排查方法：检查训练/验证分布一致性，扩大验证集，使用多种指标（AUC、PR、Loss），绘制学习曲线，观察验证 loss 是否真正持续上升还是振荡。


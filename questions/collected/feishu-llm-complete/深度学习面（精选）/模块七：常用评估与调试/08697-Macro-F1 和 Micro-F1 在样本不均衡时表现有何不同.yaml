content:
  prompt: Macro-F1 和 Micro-F1 在样本不均衡时表现有何不同？
answer:
  mode: rubric
  reference_answer: |-
    Macro-F1：给每个类别相同的权重，不论该类别样本多少。它对小类别的性能非常敏感。如果某个小类预测极差，Macro-F1 会显著降低，即使大类表现很好。这有助于发现模型在少数类上的不足，适用于需要关注所有类别的情形。

    Micro-F1：将所有样本平等看待，每个样本对最终指标的贡献相同。因此，大类的样本数多，主导了计算结果。在不均衡数据上，即使小类完全错误，只要大类正确率高，Micro-F1 仍然可以很高。它实际等同于整体准确率（在多类单标签情况下），无法反映小类效果。

    选择：

    - 若你关心所有类别同等重要（例如，每个类别代表不同的疾病，漏掉任何一种都不行），应使用 Macro-F1。

    - 若你更看重整体样本的正确率，且大类别占据绝对多数，可以用 Micro-F1，但必须清楚其局限性。

    - 有时会使用 Weighted-F1，按各类样本数加权平均，折中方案。

    因此在极度不均衡时，通常 Macro-F1 更能暴露模型对小类的忽视。


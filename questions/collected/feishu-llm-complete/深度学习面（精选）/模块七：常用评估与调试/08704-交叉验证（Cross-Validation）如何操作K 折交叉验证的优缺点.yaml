content:
  prompt: 交叉验证（Cross-Validation）如何操作？K 折交叉验证的优缺点？
answer:
  mode: rubric
  reference_answer: |-
    操作：

    - 将数据集随机均分为 K 折（folds）。

    - 进行 K 次训练-评估：每次选择其中一份作为验证集，其余 K-1 份作为训练集。

    - 记录每次的评估分数。

    - 最终分数为 K 次评估的平均值（或平均±标准差）。

    优点：

    - 数据利用率高，每个样本都曾被用作验证和训练，适合小样本情况。

    - 评估结果更稳定、可靠，减少单次划分的随机性影响。

    - 能够估计模型性能的方差。

    缺点：

    - 训练次数增加 K 倍，计算开销大，不适合大规模深度学习模型。

    - 对于时间序列数据，不能随机分割（会泄露未来信息），需使用时间序列交叉验证。

    - 如果数据集内部存在分组结构（如同一患者的多条记录），需按组进行划分，否则高估性能。

    常见变种：留一法（K=N）、分层 K 折（保持类别比例）、重复 K 折。


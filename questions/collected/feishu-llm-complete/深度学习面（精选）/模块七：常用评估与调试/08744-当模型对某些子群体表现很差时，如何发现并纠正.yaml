content:
  prompt: 当模型对某些子群体表现很差时，如何发现并纠正？
answer:
  mode: rubric
  reference_answer: |-
    发现子群体性能差距

    - 细粒度的评估：预先定义可能相关的子群体属性，如人口统计特征（性别、年龄）、数据来源（不同医院、不同摄像头）、标签子类、样本难易度等。在评估时按这些属性切片，计算每个切片的性能指标。

    - 无监督聚类发现：在没有预定义属性的情况下，用模型中间特征进行聚类（如 k-means），观察哪些簇的准确率明显偏低。对这些簇中的样本进行人工分析，归纳出共性问题（如低光照、罕见姿态）。

    - 错误模式分析：从错误样本中寻找共性，例如模型对某类特定背景、特定纹理的错误率高，识别出隐含的子群体。

    - 置信度分布：查看不同子群体的预测置信度分布，如果某些群体置信度普遍低，说明模型不确定。

    纠正子群体偏差

    - 数据补充与平衡：针对表现差的子群体，收集更多标注数据，或对现有数据进行过采样。如果无法获取新数据，可应用针对该子群体的数据增强（如提高低光照图像的亮度、对特定姿态进行仿射变换）来扩充。

    - 重加权训练：在损失函数中为表现差的子群体样本赋予更高的权重，或使用 Focal Loss 等关注困难样本的损失。

    - 公平性约束：在训练目标中加入公平性正则项，如使不同子群体的真正率差异不超过阈值，使用对抗训练移除敏感属性。

    - 迁移学习/域适应：如果子群体来自不同的域，可使用域适应技术将知识从表现好的域迁移到差域。

    - 集成专家模型：为不同子群体训练专门的模型，结合门控网络进行路由。

    - 后处理校准：对各子群体分别进行概率校准，降低误判。

    持续监控

    部署后持续收集按子群体划分的指标仪表盘，设定漂移告警，一旦发现差距扩大，触发重新训练或数据检查。

    通过主动的子群体分析，能由粗到细地提升模型的公平性和鲁棒性。


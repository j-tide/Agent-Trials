    BLEU (Bilingual Evaluation Understudy)

    - 用途：主要用于机器翻译评估，衡量生成译文与参考译文之间的 n-gram 重叠度。

    - 计算：

    [图片内容未导入]

    [图片内容未导入]

    - 优点：简单快速，与人工评价有一定相关性。缺点：忽略语义，对词序和流畅度不敏感，不适合长句或创意文本。

    ROUGE (Recall-Oriented Understudy for Gisting Evaluation)

    - 用途：主要用于自动摘要评估，侧重召回率，即参考摘要中的信息在生成摘要中出现的比例。

    - 常见变体：

    [图片内容未导入]

    - ROUGE-L：基于最长公共子序列（LCS）的 F-measure，考虑词序。

    - ROUGE-W：加权 LCS，给连续匹配更高权重。

    - ROUGE-S：跳跃二元组（skip-bigram）统计。

    - 通常报告多个 ROUGE 变体，ROUGE-L 最为常用。与 BLEU 类似，仍基于表面匹配，对语义理解不足。


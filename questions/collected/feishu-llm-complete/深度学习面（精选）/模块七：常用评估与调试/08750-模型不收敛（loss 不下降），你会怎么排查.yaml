content:
  prompt: 模型不收敛（loss 不下降），你会怎么排查？
answer:
  mode: rubric
  reference_answer: |-
    系统化排查流程：

    - 快速过拟合测试

    - 取一个小数据集（几百样本），关闭正则化，用当前模型训练。若损失能下降到接近0，则说明模型有能力学习，问题可能在大数据集或优化设置上；若不能，则模型或代码有严重错误。

    - 检查数据

    - 输入特征和标签是否混乱？是否存在 NaN 或 Inf？标签范围是否与损失函数匹配（如 softmax 需要 0~C-1）？

    - 数据预处理是否应用到验证集？归一化参数是否来自训练集？

    - 检查损失函数与输出层

    - 分类任务输出是否正确经过 softmax？多标签分类是否用 sigmoid + BCELoss？

    - 损失函数公式是否正确，是否忽略了 mask 导致被填充值主导？

    - 检查学习率

    - 学习率太低：loss 下降极慢，看起来不收敛。可逐步增大（例如 1e-5 → 1e-2）。

    - 学习率太高：loss 震荡甚至增大，参数更新跨度过大。需降低学习率。

    - 检查梯度

    - 打印梯度范数：是否全部为零（可能学习率为0、计算图断开、requires_grad=False）？

    - 是否出现梯度爆炸（norm > 1e4）？应启用梯度裁剪。

    - 是否梯度消失（norm < 1e-8）？可能初始化不佳或网络太深，用残差连接、更好的初始化、BN等。

    - 检查初始化和网络结构

    - 是否所有参数初始化为0或相同值（对称性问题）？

    - 激活函数是否导致大量神经元死亡（如ReLU后全零）？可尝试 LeakyReLU。

    - 深度网络是否无残差连接导致难以训练？

    - 优化器问题

    [图片内容未导入]

    - 监控损失与梯度

    - 使用 TensorBoard 查看损失曲线，如果损失一开始就很高且完全不降，往往是学习率或数据问题；如果损失起初下降然后停滞，可能进入局部最小或学习率衰减过快。

    - 检查数据加载器

    - 是否每个 epoch 数据都正确打乱？batch 中样本是否太相似？数据管道是否阻塞导致模型实际上只用了部分数据？

    通过排除法，大多可以找到不收敛的根源。


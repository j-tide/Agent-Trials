content:
  prompt: F1-Score 是精确率和召回率的调和平均，为什么使用调和平均而非算术平均？
answer:
  mode: rubric
  reference_answer: |-
    F1-Score 公式：

    [图片内容未导入]

    它是精确率和召回率的调和平均数。

    为什么用调和平均：

    - 调和平均对极小值更敏感。如果其中一个指标很低，F1 分数会非常低，而算术平均可能会掩盖这种不平衡。例如，精确率 = 1.0，召回率 = 0.01，算术平均 ≈ 0.505，但 F1 ≈ 0.02。F1 能更真实地反映模型在两者上的综合表现，避免“偏科”情况。

    - 它惩罚极端值，鼓励精确率和召回率同时都较高，这符合实际需求：一个好模型应该既有较高的查准率也有较高的查全率。

    - 若使用算术平均，模型可能投机取巧（例如将几乎全部样本预测为正，召回率≈1，精确率较低，算术平均仍可能不低），而 F1 能有效抑制这种策略。

    因此，F1 分数成为不均衡分类中最常用的综合指标之一。


content:
  prompt: 如何分析模型的错误模式？错误分类分析、混淆矩阵等。
answer:
  mode: rubric
  reference_answer: |-
    分析错误模式旨在发现模型的系统缺陷，指导针对性改进。方法如下：

    混淆矩阵（Confusion Matrix）

    - 使用：将预测类别与真实类别列成矩阵，对角线为正确分类，非对角线为错误分类。

    - 分析：

    错误分类详细分析

    - 收集错误样本：将验证集中所有错误预测的样本提取出来，单独观察其共同特征。

    - 按错误类型分组：比如图像中是否存在遮挡、光照差、物体小、模糊、非典型视角等。可以手动或自动（如用对象检测器）标记这些属性。

    - 难度划分：利用训练过程中的损失值或模型置信度，将样本分为易、中、难。通常易样本错误较少，如果大量易样本出错，说明训练有严重问题。

    可视化诊断

    - Grad-CAM 等归因图：对错误样本生成热力图，观察模型关注的区域是否正确。如果模型关注背景而非目标物体，说明存在虚假相关性。

    - 特征空间可视化：用 t-SNE 或 UMAP 投影最后一层特征，查看错误分类样本的分布。它们是否靠近错误类别的簇？是否处于决策边界模糊地带？

    模型预测统计量

    - 置信度直方图：分别绘制正确和错误预测的置信度分布。正确预测应集中于高置信度区间；如果很多错误预测也具有高置信度，模型存在过度自信，需校准。

    - Top-K 准确率：如果 Top-1 低但 Top-5 高，说明模型在相近类别间混淆，可通过细粒度特征学习改进。

    - 按子群体分析：根据属性（如年龄、肤色、设备类型）拆分数据，查看哪些子群表现特别差，是否存在偏见。

    错误模式驱动的改进

    - 若发现特定类型错误（如小目标检测差），可增加该类型数据的增强或采样权重。

    - 若某类混淆严重，可增加该类难例样本，或使用对比损失拉大类间距离。

    - 若模型对模糊图像错误多，可加强数据增强中的模糊处理，或提升模型分辨率。

    通过系统化的错误分析，将模糊的“模型不准”具象为可操作的优化方向，是模型迭代的关键步骤。


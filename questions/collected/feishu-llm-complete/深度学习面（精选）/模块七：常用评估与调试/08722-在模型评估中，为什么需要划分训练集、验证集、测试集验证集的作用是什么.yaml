content:
  prompt: 在模型评估中，为什么需要划分训练集、验证集、测试集？验证集的作用是什么？
answer:
  mode: rubric
  reference_answer: |-
    训练集（Training Set）：用于训练模型参数。

    验证集（Validation Set）：用于调参、模型选择（如选择超参数、早停、选择最佳模型结构）。

    测试集（Test Set）：仅使用一次，用于最终评估模型的泛化性能，不能参与任何训练或调参决策。

    验证集的作用：

    - 超参数优化：在验证集上评估不同超参数组合，选表现最好的一组。若没有验证集，直接用测试集调参会导致对测试集过拟合，测试结果虚高，泛化能力假象。

    - 早停（Early Stopping）：当验证集损失不再下降时停止训练，防止过拟合。

    - 特征选择与模型结构对比：客观选择最佳模型。

    - 估计泛化误差：验证集上的误差可近似最终测试误差，但测试集仍需独立保持最终公正。

    划分避免“信息泄露”：测试集的信息绝不应在训练或调参过程中被模型“看到”，否则高估性能。


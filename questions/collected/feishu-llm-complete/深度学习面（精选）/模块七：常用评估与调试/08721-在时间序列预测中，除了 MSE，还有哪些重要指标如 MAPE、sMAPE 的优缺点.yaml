content:
  prompt: 在时间序列预测中，除了 MSE，还有哪些重要指标？如 MAPE、sMAPE 的优缺点？
answer:
  mode: rubric
  reference_answer: |-
    常用指标分类

    基于绝对/平方误差的指标

    [图片内容未导入]

    - 意图：修正 MAPE 的不对称问题，并将分母限制在均值。

    - 优缺点：当真实值和预测值都接近0时仍不稳定；实际上 sMAPE 并非真正对称（除以均值仍受二者影响），且范围在0~200%。它的对称性仍有争议，但比 MAPE 好一些。

    - 局限性：同样不适合含有零或负值的情况，且对极低值敏感。

    相对误差指标

    - MASE (Mean Absolute Scaled Error)：将 MAE 除以历史 naive 预测（如持续性模型）的 MAE。尺度无关，适用于任何数据，尤其适合比较不同序列的预测效果。MASE < 1 说明比 naive 预测好。

    - RMSSE (Root Mean Squared Scaled Error)：类似 MASE 但基于平方误差。M4 竞赛采用。

    其他

    - R² (决定系数)：与简单均值模型比较，若目标有趋势/季节，均值模型可能很差，R² 会很高但无意义。

    - 分位数损失（Quantile Loss）：用于区间预测评估。

    - Diebold-Mariano 检验：统计检验两个预测模型是否显著不同。

    选择建议：如果序列均为正且无零值，MAPE 可解释性好；若有零值或需要尺度无关鲁棒评估，MASE 是更好的选择；sMAPE 作为折中但非最佳。通常结合多个指标报告，如 RMSE、MAE、MAPE（如果适用）、MASE，并考虑业务场景。


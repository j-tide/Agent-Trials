content:
  prompt: AUC 对样本分布是否敏感？为什么它在某些样本不均衡场景下仍会被“欺骗”？
answer:
  mode: rubric
  reference_answer: |-
    理论上，AUC 对类别不均衡不敏感：因为 TPR 和 FPR 都是类别内部的条件概率，独立于正负样本的绝对数量。即使正负比从 1:1 变为 1:100，AUC 的计算结果不会自动改变（只要模型排序能力不变）。因此常被认为是不均衡场景下可靠的指标。

    但 AUC 仍有被“欺骗”的风险：

    - 极度不均衡且小样本：当正样本极少时，TPR 估算非常不稳定，微小的 FP 变化可能导致 ROC 曲线波动剧烈，AUC 估计值不可靠。

    - 评估关注点错位：AUC 反映全局排序能力，而不考虑具体阈值。实际业务可能只关心前 k% 的预测（如推荐系统的 top-N），ROC 对此不敏感，可能导致选出 AUC 高但实际表现差的模型。

    - 掩盖局部性能问题：如果模型在低 FPR 区域表现极差（例如 FPR 稍增加就会漏掉大量正样本），但中高 FPR 区域表现好，AUC 总体仍可能较高。但在欺诈检测等场景，我们恰恰只关心低 FPR 区域。此时 PR 曲线或 partial AUC 更能反映问题。

    - 负样本内部结构影响：当负样本包含不同子群，且模型对某些子群的评分异常，可能扭曲 AUC 但业务上可能仍可接受。

    因此，尽管 AUC 相对鲁棒，但在极端不均衡或聚焦特定工作点时，应结合 PR 曲线、F1、或局部 AUC 等指标综合判断。


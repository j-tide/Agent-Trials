content:
  prompt: 在目标检测中，IoU 是如何计算的？mAP 又是如何基于 IoU 和 Precision-Recall 计算的？
answer:
  mode: rubric
  reference_answer: |-
    IoU（Intersection over Union）：预测边界框与真实边界框的交集面积除以并集面积。

    [图片内容未导入]

    IoU 衡量定位精度，通常设定阈值（如 0.5）判定预测框是否正确（真阳性）。

    mAP（mean Average Precision） 是目标检测的核心指标。

    计算步骤：

    - 对每个类别，收集所有预测框（通常按置信度排序），计算与所有真实框的 IoU。

    - 应用 IoU 阈值（如 0.5），匹配预测框与真实框（通常每个真实框只匹配一个预测框，最高 IoU 且超过阈值）。得到 TP、FP；未匹配的真实框算作 FN。

    - 按置信度排序，逐渐增加预测框，计算累积的精确率和召回率，绘制 PR 曲线。

    - 对该类别的 PR 曲线计算 Average Precision (AP)，即插值后的 PR 曲线下面积，或使用 101 点插值法（Pascal VOC）或积分法（COCO 使用 101 点插值？COCO 使用 101 点插值实际上是在 0 到 1 的 recall 上取 101 个等间距点，计算精确率，然后平均。或者直接使用所有 recall 值计算 AUC。COCO 采用 101 点插值平均。）

    - 对所有类别的 AP 取平均，即为 mAP。

    常用 mAP 变体：

    - mAP@0.5：IoU 阈值固定为 0.5。

    - mAP@0.5:0.95：IoU 从 0.5 到 0.95，步长 0.05，共 10 个阈值，分别计算 AP 再取平均，强调高定位精度。

    mAP 同时考虑分类准确率和定位精度，是目标检测的标准评估指标。


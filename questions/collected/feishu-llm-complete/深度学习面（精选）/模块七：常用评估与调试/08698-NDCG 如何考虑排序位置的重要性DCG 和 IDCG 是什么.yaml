content:
  prompt: NDCG 如何考虑排序位置的重要性？DCG 和 IDCG 是什么？
answer:
  mode: rubric
  reference_answer: |-
    位置重要性通过折扣因子体现：位置 i 上的相关度 relireli 除以 log⁡2(i+1)（或 log⁡2(i+1)的某种变体）。因为用户从上到下浏览，位置越靠后，用户关注的概率越小，故贡献应被折扣。

    DCG (Discounted Cumulative Gain)：累积到位置 K 的折扣后增益：

    [图片内容未导入]

    或更常用的公式：

    [图片内容未导入]

    第一种用于直接给 rel 数值，后者当 rel 是指数增益时。

    IDCG (Ideal DCG)：将所有文档按真实相关度降序排列后计算出的 DCG@K，即理想排序下的最大 DCG。

    NDCG@K = DCG@K / IDCG@K，归一化到 [0,1]，可跨查询比较。

    NDCG 的核心正是通过位置折扣强调前几个结果的排序质量。


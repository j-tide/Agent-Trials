content:
  prompt: 回归任务的常用评估指标有哪些：MSE、RMSE、MAE、R²，各自的含义和适用场景？
answer:
  mode: rubric
  reference_answer: |-
    - MSE（均方误差）：

    [图片内容未导入]

    - 平方误差放大离群点影响，对大误差惩罚更重。可导，常用于损失函数。场景：对异常值不敏感时，如一般预测任务。

    - RMSE（均方根误差）：

    [图片内容未导入]

    - 与目标变量同量纲，更易解释。对离群值同样敏感。广泛用于评估预测精度，如房价预测、温度预测。

    - MAE（平均绝对误差）：

    [图片内容未导入]

    - 线性惩罚，对异常值鲁棒。当数据有噪声或很多离群值时，MAE 比 MSE 更稳定。场景：金融异常值较多时，或需要鲁棒估计。

    - R²（决定系数）：

    [图片内容未导入]

    - 衡量模型解释的变异占总体变异的比例。最大为 1，越接近 1 越好；可为负（表示模型比简单均值还差）。提供了无量纲的相对评价。场景：比较不同模型对同一目标变量的拟合优度，或线性回归的评估。

    选择：需考虑是否对离群值敏感，是否要求可解释性，以及目标变量尺度。


content:
  prompt: 当数据集较小时，如何保证评估的可靠性？
answer:
  mode: rubric
  reference_answer: |-
    - 使用交叉验证（如 5 折或留一法），避免单次划分的高方差。

    - 分层抽样：保证训练/验证/测试集中的类别比例一致，尤其在不均衡数据时。

    - 数据增强：生成更多有效训练样本，但测试集应保持原始真实数据。

    - 多次重采样评估：随机多次划分训练/测试，报告均值和置信区间。

    - 使用简单的模型：避免过拟合，减小评估方差。

    - 外部验证：如果能获取独立的检验集（来自不同来源），即使小，也可作为有力佐证。

    - 统计检验：使用 McNemar 检验、成对 t 检验等比较模型差异是否显著。

    - 效应量（Effect Size）：不仅看 P 值，还要看实际性能差异大小。


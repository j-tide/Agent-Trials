content:
  prompt: 如何设计一个综合的评估体系来对比两个模型的优劣？
answer:
  mode: rubric
  reference_answer: |-
    对比模型A和模型B，需要一个结构化、多维度的评估框架，以确保结论可靠。

    - 定义评估目标与业务对齐

    - 明确最终目标：是提高用户满意度、降低风险，还是提升效率？

    - 确定北极星指标（如收益、留存、误报率），并将离线指标与北极星指标关联。

    - 确定评估维度与指标集

    - 核心效果指标：任务的主要准确率指标（如分类F1，回归MSE，排序NDCG等）。

    - 鲁棒性指标：在噪声、分布偏移、对抗样本下的表现。

    - 公平性指标：不同敏感群体（如性别、地区）的性能差异。

    - 效率指标：推理延迟、吞吐量、模型大小、显存占用。

    - 业务相关指标：误报/漏报代价、用户投诉率等（如有条件）。

    - 可靠性指标：置信度校准（ECE）、预测置信区间覆盖率。

    - 可解释性：特征归因一致性（若需要）。

    - 实验设计

    - 固定的训练/验证/测试集划分，或多次交叉验证，确保对比公平。

    - 统计显著性检验：用配对t检验、McNemar检验或Bootstrap计算指标差异的置信区间。

    - 控制变量：除了模型本身，数据预处理、优化器、随机种子等尽量一致。对多个随机种子取平均，报告标准差。

    - 超参数调优：对每个模型进行公平调优（相同的搜索预算），然后比较最佳配置。

    - 多维度综合分析

    - 雷达图/平行坐标图：展示各维度指标。

    - 帕累托前沿：若存在效率-精度权衡，找出占优点。

    - 分段分析：按样本难度、类别、场景细分，观察不同子集表现。可能A在整体略优，B在关键子集（如高风险群体）更好。

    - 劣化测试（Stress Test）：构造极端案例，检验模型下限。

    - 人工评估与A/B测试

    - 对于生成类或主观任务，离线指标需辅以人工评估（MOS、成对比较）。

    - 若可能，进行小流量在线A/B测试，对比真实业务指标。

    - 决策矩阵

    构建加权评分卡，根据各维度重要性赋权，计算模型A和B的综合得分，同时要分析在不可接受的最低阈值（如公平性不得低于某值）下，哪个模型通过筛选。

    - 最终报告

    不仅给出最终结论，还要说明模型在哪些情况下优于对方，存在哪些风险与不足，为模型选择提供全面参考。


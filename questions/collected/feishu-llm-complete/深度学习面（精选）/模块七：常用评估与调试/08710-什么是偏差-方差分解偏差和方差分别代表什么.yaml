content:
  prompt: 什么是偏差-方差分解？偏差和方差分别代表什么？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    偏差-方差分解 是监督学习中分析模型泛化误差的理论框架。对于一个给定的测试样本 x，期望泛化误差（以均方误差为例）可以分解为：

    [图片内容未导入]

    偏差和方差通常此消彼长。简单模型（如线性模型）偏差高、方差低；复杂模型（如深度神经网络）偏差低、方差高。模型选择的目标是找到偏差与方差的最佳平衡点，使得总泛化误差最小。

    解释：

    - 偏差高 → 模型学习能力不足，欠拟合。表现为训练误差和验证误差都很高。

    - 方差高 → 模型对训练数据过敏感，过拟合。表现为训练误差极低，但验证误差远高于训练误差。

    因此，偏差-方差分解为诊断模型问题提供了理论依据，指导我们调整模型复杂度、收集更多数据或使用正则化。


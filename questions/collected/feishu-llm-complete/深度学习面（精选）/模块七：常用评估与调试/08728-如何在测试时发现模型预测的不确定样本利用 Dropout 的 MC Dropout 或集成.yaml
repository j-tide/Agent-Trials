content:
  prompt: 如何在测试时发现模型预测的“不确定”样本？利用 Dropout 的 MC Dropout 或集成。
answer:
  mode: rubric
  reference_answer: |-
    在测试时量化模型的不确定性，能帮助识别模型预测模糊、容易出错的样本，对高风险应用至关重要。

    MC Dropout（蒙特卡洛 Dropout）

    - 原理：在推理时保持 Dropout 处于激活状态（model.train()），对同一个样本进行多次前向传播（如 T=50 次），每次 Dropout 随机丢弃不同神经元，产生一组预测概率。计算这些预测的均值和方差。

    - 不确定性度量：

    - 优势：无需修改模型结构，只需在测试时打开 Dropout 并多次采样。适用于训练时已使用 Dropout 的模型。

    - 实施技巧：在 PyTorch 中，即使模型处于 eval() 模式，仍需手动将 Dropout 层设置为 train() 模式，或直接调用 model.train() 但注意 BN 也会随之改变，若不想改变 BN，需更精细控制。

    深度集成（Deep Ensemble）

    - 训练多个相同结构但不同随机初始化的模型（或用不同数据顺序、不同增强），推理时将这些模型的预测进行平均。

    - 不确定性：预测方差或熵。集成不仅给出平均预测，还能提供预测的一致性信息。集成成员意见分歧大的样本即为不确定样本。

    - 集成通常比 MC Dropout 效果更好，但训练和存储成本高。

    其他方法

    - 贝叶斯神经网络：显式推断权重的后验分布，计算期望和方差。受限于计算复杂度。

    - 确定性不确定性估计：如 DDU (Deterministic Uncertainty Estimation)，基于特征空间密度或高斯过程。

    - 单前向不确定性：一些方法训练网络输出分布参数（如参数化预测的 Dirichlet 分布），直接给出不确定度。

    应用

    - 拒绝预测：设定熵或方差阈值，若不确定性过高，则交由人工处理或输出“无法判断”。

    - 主动学习：优先选择不确定性高的样本进行标注。

    - 异常检测：分布外样本通常会产生高不确定性。

    通过不确定性估计，模型不再是“黑箱”，能够自我认知其预测的可靠程度，极大提升了安全性和可解释性。


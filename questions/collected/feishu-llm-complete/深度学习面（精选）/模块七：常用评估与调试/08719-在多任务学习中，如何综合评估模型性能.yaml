content:
  prompt: 在多任务学习中，如何综合评估模型性能？
answer:
  mode: rubric
  reference_answer: |-
    多任务学习（Multi-Task Learning，MTL）同时优化多个相关任务，因此评估不能仅看单一任务，必须从整体和局部两个层面进行。

    - 单任务独立评估

    - 对每个任务单独计算其核心指标。例如，任务1是分类，则看准确率、F1；任务2是回归，则看MSE、MAE。

    - 记录每个任务在验证集/测试集上的最佳值和最终值，观察各任务是否都得到了充分训练，是否有任务被“拖累”。

    - 综合指标聚合

    - 平均指标（Average Metrics）：计算所有任务指标的平均值。但需注意不同任务指标尺度不同（如准确率0～1，MSE可能>100），直接平均会被大尺度任务主导。因此常采用：

    - 加权平均：根据业务重要性赋予不同任务权重，计算加权得分。例如，在自动驾驶中，检测行人的权重远高于检测车道线，综合得分应体现。

    - 帕累托分析：多任务学习常存在任务冲突，可绘制帕累托前沿，观察模型在不同任务上的权衡曲线。如果模型A在所有任务上都优于模型B，则A帕累托占优；否则需根据偏好选择。

    - 任务间公平性

    - 避免某个任务“坍缩”（训练损失不下降但其他任务继续优化）。可记录每个任务的训练动态，检查是否存在某些任务梯度主导或消失。

    - 使用任务不确定性加权（如Kendall et al.的同方差不确定性）的方法训练时，最终验证时可观察自动学习的权重，辅助分析任务重要性。

    - 迁移与泛化评估

    - 多任务学习的初衷是借助辅助任务提升主任务。因此需设置单任务基线（单独训练各任务），比较多任务模型的主任务性能是否提升，以及辅助任务性能是否达到可接受水平。

    - 跨任务泛化测试：在某一任务数据缺失或噪声增大时，其他任务是否仍能提供有效归纳偏置，可通过消融实验验证。

    - 效率指标

    - 多任务模型的推理速度、内存占用等也是重要考量。如果精度略有下降但推理时间显著减少，可能值得部署。

    - 综合报告

    - 除了数值，应展示每个任务的指标分布（如箱线图）和多任务模型的帕累托图，直观对比。

    - 若进行超参数搜索，可报告各任务指标的热力图或平行坐标图。

    综合来看，多任务评估应结合单任务精度、加权综合得分、任务间公平性、相比单任务基线的增益、以及计算效率，并依据具体应用场景选择主要关注点。


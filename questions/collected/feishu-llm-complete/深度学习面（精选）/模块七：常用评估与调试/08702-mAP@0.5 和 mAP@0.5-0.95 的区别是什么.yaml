content:
  prompt: mAP@0.5 和 mAP@0.5:0.95 的区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    mAP@0.5：IoU 阈值为 0.5，只要预测框与真实框的 IoU ≥ 0.5 即视为正确检测。该标准相对宽松，对小偏移容忍度高，主要评估“是否存在物体”。在 Pascal VOC 竞赛中常用。

    mAP@0.5:0.95 (COCO mAP)：以 0.05 为步长，计算 IoU 从 0.5 到 0.95 共 10 个阈值下的 AP，然后取平均。这要求模型在不同 IoU 标准下都能表现良好，对定位精度要求更高，奖励那些能精确贴合物体边界的检测器。更严格，也更符合实际应用需求。COCO 数据集以此作为主要指标。

    区别总结：

    - mAP@0.5 侧重检测召回，对框的精确度要求较低；mAP@0.5:0.95 综合评估定位精度和召回，更全面。

    - 在模型比较时，mAP@0.5:0.95 更能拉开差距，反映高质量检测能力。

    - 许多实际应用（如自动驾驶）需要高定位精度，因此 mAP@0.5:0.95 更有参考价值。


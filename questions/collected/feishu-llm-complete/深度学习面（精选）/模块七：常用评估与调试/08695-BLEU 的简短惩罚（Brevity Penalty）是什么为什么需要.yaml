content:
  prompt: BLEU 的简短惩罚（Brevity Penalty）是什么？为什么需要？
answer:
  mode: rubric
  reference_answer: |-
    简短惩罚（BP） 是 BLEU 评分中用于惩罚生成译文过短的因子。因为 n-gram 精确率天然偏向短句子（短句更容易匹配到参考 n-gram，导致精确率高），如果不加惩罚，模型可能通过生成极短句子来获得高分，但这显然不是好的翻译。

    公式：
    设 c 为生成译文的长度，r 为参考译文的长度（当有多个参考时，取与生成译文长度最接近的参考长度）。则：

    [图片内容未导入]

    当生成长度小于参考长度时，BP 小于 1，按指数衰减，惩罚短译文的倾向。当生成长度大于参考长度时，BP=1，不加惩罚（因为过长不会虚增精确率，甚至可能降低）。

    为什么需要：保证 BLEU 不仅奖励精确匹配，也要求生成足够内容的译文，使评估更符合人类对“完整翻译”的期望。


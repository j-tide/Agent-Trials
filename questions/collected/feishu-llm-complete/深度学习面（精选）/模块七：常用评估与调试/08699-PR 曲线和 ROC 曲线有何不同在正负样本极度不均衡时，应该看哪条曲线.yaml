content:
  prompt: PR 曲线和 ROC 曲线有何不同？在正负样本极度不均衡时，应该看哪条曲线？
answer:
  mode: rubric
  reference_answer: |-
    PR 曲线（Precision-Recall Curve） 以召回率（Recall）为横轴，精确率（Precision）为纵轴。PR 曲线更关注正类的预测效果。

    区别：

    [嵌入表格未展开]

    极度不均衡时选择

    应优先看 PR 曲线，理由：

    - 当负样本极多（例如 99.9% 负类），FPR = FP/(FP+TN) 中的 TN 巨大，即使引入大量假正例，FPR 变化仍微小，ROC 曲线会呈现“乐观”的高 AUC。但实际上，这些假正例会极大降低精确率，因为精确率 = TP/(TP+FP)，FP 增加导致精确率急剧下降。PR 曲线能尖锐地反映这种下降。

    - 在不均衡问题中，我们更关心正样本是否能被有效找出（召回率）且代价可承受（精确率）。PR 曲线直接展示这个权衡，更贴合业务需求。

    因此，在极度不均衡时（如异常检测、点击率预估），PR 曲线比 ROC 更能揭示模型真实性能。


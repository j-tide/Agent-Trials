content:
  prompt: 精确率（Precision）和召回率（Recall）的公式是什么？两者之间如何权衡？
answer:
  mode: rubric
  reference_answer: |-
    精确率（Precision）：在所有被模型预测为正类的样本中，真正为正类的比例。

    [图片内容未导入]

    召回率（Recall）：在所有真实正类样本中，被模型正确预测为正类的比例。

    [图片内容未导入]

    权衡

    精确率和召回率通常是一对矛盾的指标。模型通常输出一个置信度分数，设定阈值来划分正负类。

    - 提高阈值：更严格地预测正类，预测出的正类数量减少，精确率可能升高，但有些正样本可能因分数不够而被漏掉，导致召回率下降。

    - 降低阈值：更宽松地预测正类，能找出更多真实正样本，召回率上升，但也会引入更多假正例，导致精确率下降。

    因此，需要根据任务需求在精确率和召回率之间寻找平衡点，或使用 F1 分数（调和平均）来综合衡量，也可通过 PR 曲线可视化不同阈值下的表现。


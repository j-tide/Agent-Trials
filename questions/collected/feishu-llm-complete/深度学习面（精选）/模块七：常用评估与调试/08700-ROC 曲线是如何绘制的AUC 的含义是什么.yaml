content:
  prompt: ROC 曲线是如何绘制的？AUC 的含义是什么？
answer:
  mode: rubric
  reference_answer: |-
    ROC 曲线（Receiver Operating Characteristic Curve）

    以假正率（FPR）为横轴，真正率（TPR，即召回率）为纵轴绘制的曲线。

    绘制过程：

    - 对于二分类模型，它对每个样本输出一个正类概率。

    - 将概率从高到低排序，依次将每个概率值作为阈值。

    - 对每个阈值，计算 TPR = TP/(TP+FN) 和 FPR = FP/(FP+TN)。

    - 在坐标图中描点，连接即得 ROC 曲线。

    当阈值很高时，几乎所有样本被预测为负，TPR≈0，FPR≈0，点靠近左下角；阈值很低时，几乎所有样本被预测为正，TPR≈1，FPR≈1，点靠近右上角。理想模型靠近左上角（TPR=1, FPR=0）。

    AUC（Area Under Curve）

    AUC 是 ROC 曲线下的面积，范围 [0, 1]。它衡量模型区分正负类的能力：

    - AUC = 1：完美分类器。

    - AUC = 0.5：随机猜测（对角线）。

    - AUC < 0.5：比随机还差，但可反向使用。

    AUC 的直观意义：随机选取一个正样本和一个负样本，分类器给正样本的预测值大于负样本的概率。AUC 越大，模型越有可能将正样本排在负样本前面。它对类别不平衡不敏感（因为 TPR 和 FPR 都是比率，不受正负样本绝对数量影响），但易受极端不平衡或小样本评估波动影响。


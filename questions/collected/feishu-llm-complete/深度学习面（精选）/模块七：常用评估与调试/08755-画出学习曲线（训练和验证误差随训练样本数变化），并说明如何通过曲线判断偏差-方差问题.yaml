content:
  prompt: 画出学习曲线（训练和验证误差随训练样本数变化），并说明如何通过曲线判断偏差/方差问题。
answer:
  mode: rubric
  reference_answer: |-
    学习曲线是以训练样本数量（或训练轮次）为横坐标，训练误差和验证误差为纵坐标绘制的曲线。以下分别描述典型情况：

    - 高偏差（欠拟合）的学习曲线

    - 训练误差较高且下降缓慢，随着样本增加趋于平稳（平台）。

    - 验证误差也较高，接近训练误差，且增加样本也无法显著降低。

    - 两条曲线距离很小，但位置很高。这表明模型无法从数据中学习到足够的信息。增加样本量效果不大，需要提升模型复杂度。

    - 高方差（过拟合）的学习曲线

    - 训练误差极低，且随着样本增加可能略有上升但仍很低。

    - 验证误差远高于训练误差，但随着样本数增加，验证误差缓慢下降，两条曲线逐渐接近。

    - 这种曲线表明，增加训练样本可以有效减小泛化误差，因为模型正在学习真正的模式，更多数据可以抑制噪声。

    - 高偏差+部分高方差（模型复杂但数据严重不足）

    - 训练误差低，验证误差极高，并且即使样本增加，验证误差仍高且下降不明显——模型过于复杂，数据太少，需简化模型或大幅增加数据。

    学习曲线绘制方法：针对不同规模的训练子集（例如10%, 20%, …, 100%），固定验证集，分别训练并记录训练误差和验证误差，然后绘制。

    诊断：

    - 若训练误差和验证误差都高且相近 → 欠拟合，增加模型复杂度。

    - 若训练误差低、验证误差高且差距大 → 过拟合，增加数据或正则化。

    - 若无论怎么增加数据，验证误差都不降 → 可能是数据噪声过大或特征与标签无关。


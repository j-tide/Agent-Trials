answer:
  mode: rubric
  reference_answer: |-
    可能为负数。当模型预测值比直接使用均值预测的误差还要大时：

    [图片内容未导入]

    常见情况：

    - 在测试集上，若模型过拟合严重或根本未学到规律，预测误差极大。

    - 使用了不适当的模型（如线性模型去拟合非线性关系），导致预测偏差很大。

    - 数据分布与训练时完全不同（概念漂移）。


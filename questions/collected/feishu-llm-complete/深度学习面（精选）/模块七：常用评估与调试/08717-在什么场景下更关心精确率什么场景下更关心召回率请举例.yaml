content:
  prompt: 在什么场景下更关心精确率？什么场景下更关心召回率？请举例。
answer:
  mode: rubric
  reference_answer: |-
    更关心精确率（Precision）的场景

    当假正例（错误报警）的代价很高时，我们希望模型预测出的正例尽可能准确。

    - 垃圾邮件检测：将正常邮件误判为垃圾邮件（假正例）比漏掉垃圾邮件更糟糕，用户可能丢失重要信息。高精确率意味着标记为垃圾邮件的几乎都是真的垃圾。

    - 推荐系统（推送通知）：向用户推送不感兴趣的内容（FP）会造成骚扰，降低用户体验，因此每次推送都应力求精准。

    - 金融交易预警：误把合法交易标记为欺诈（FP）会冻结正常交易，引起客户不满。

    更关心召回率（Recall）的场景

    当假负例（漏检）的代价极高时，我们希望尽可能找出所有正例，宁可多一些误报。

    - 疾病筛查：漏掉一个癌症患者（FN）后果致命，而误报（FP）可通过进一步检查排除。高召回率保证不放过潜在患者。

    - 欺诈检测：漏掉一笔欺诈交易（FN）导致直接经济损失，误报（FP）只是增加人工审核成本，可接受。

    - 安全检测（机场安检）：漏掉危险物品（FN）威胁安全，宁可多检查一些无问题的行李（FP）。

    在应用中，可通过调整阈值或使用 F-beta 分数（F2 更重视召回率，F0.5 更重视精确率）来适应该需求。


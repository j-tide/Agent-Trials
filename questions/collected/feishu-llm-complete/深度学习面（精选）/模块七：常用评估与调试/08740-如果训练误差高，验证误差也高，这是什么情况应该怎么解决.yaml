content:
  prompt: 如果训练误差高，验证误差也高，这是什么情况？应该怎么解决？
answer:
  mode: rubric
  reference_answer: |-
    情况：高偏差（欠拟合）。模型连训练数据都无法很好地拟合，说明模型容量不足或特征不足以捕获数据规律，或者训练过程有问题。

    可能原因与解决方案：

    - 模型容量过小：增加网络层数、每层神经元数、使用更复杂的架构（如从线性模型升级为非线性，从浅层CNN升级为ResNet等）。

    - 特征不足：特征工程做得不够，输入特征没有包含足够信息。需要提取更多相关特征、组合特征或使用嵌入等。

    - 优化问题：学习率太低导致训练缓慢，尚未收敛；或优化算法选择不当（如SGD在鞍点停滞）。可增大学习率、换用Adam、增加训练轮次。

    - 欠拟合因数据预处理错误：输入特征没有归一化、标签错误、数据未正确打乱等。需检查数据管道。

    - 模型假设错误：例如用线性模型去拟合周期性数据，需要更换模型类型。

    - 训练不充分：停止过早（epochs太少），或者 batch size 过大导致梯度更新次数太少。

    - 损失函数不匹配：对于分类问题误用回归损失（如MSE），影响优化。

    操作步骤：先检查数据是否正确，然后尝试一个小批量过拟合测试（在少量样本上训练是否能达到接近零的训练误差），如果不能，说明模型或优化有问题。调整模型复杂度或优化参数，直至训练误差下降。


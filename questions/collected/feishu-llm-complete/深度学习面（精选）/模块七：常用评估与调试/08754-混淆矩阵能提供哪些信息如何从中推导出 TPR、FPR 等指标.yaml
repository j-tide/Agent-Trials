content:
  prompt: 混淆矩阵能提供哪些信息？如何从中推导出 TPR、FPR 等指标？
answer:
  mode: rubric
  reference_answer: |-
    混淆矩阵（Confusion Matrix）

    对于二分类，是一个 2×2 表格：

    [嵌入表格未展开]

    从中可以直接读出 TP、FN、FP、TN 的数量。

    推导常见指标：

    - 真正率（TPR/Recall/Sensitivity） = TP / (TP + FN)
    反映正样本被正确识别的比例。

    - 假正率（FPR） = FP / (FP + TN)
    反映负样本被误判为正的比例。

    - 真负率（TNR/Specificity） = TN / (FP + TN) = 1 - FPR

    - 精确率（Precision） = TP / (TP + FP)

    - 准确率（Accuracy） = (TP + TN) / (TP+TN+FP+FN)

    - F1 分数 = 2 × (Precision × Recall) / (Precision + Recall)

    多分类混淆矩阵同理，是一个 k×k 矩阵，对角线为正确分类，可计算每个类别的精确率、召回率，并可宏观/微观平均得到全局指标。

    混淆矩阵提供了原始数据，可灵活计算各种指标，并直观展示各类别的混淆情况。


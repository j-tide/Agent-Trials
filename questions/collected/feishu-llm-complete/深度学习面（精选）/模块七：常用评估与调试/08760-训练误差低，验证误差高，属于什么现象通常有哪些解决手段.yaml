content:
  prompt: 训练误差低，验证误差高，属于什么现象？通常有哪些解决手段？
answer:
  mode: rubric
  reference_answer: |-
    现象：高方差（过拟合）。模型在训练集上表现优异，但泛化能力差。

    常见解决手段：

    - 增加数据量：更多的训练样本可以有效抑制过拟合。若无法获取新数据，可通过数据增强（旋转、翻转、裁剪、噪声注入等）人为扩充。

    - 正则化：

    - 早停（Early Stopping）：在验证误差不再下降时停止训练，防止继续拟合训练噪声。

    - 降低模型复杂度：减少层数、神经元数，使用更简单的架构。

    - 集成学习：训练多个模型并平均输出（如 Bagging），可降低方差。

    - 特征选择/降维：去除无关或冗余特征，降低模型学习噪声的风险。

    - 优化超参数：调整学习率、批次大小等，避免训练过度。

    - 迁移学习：使用预训练模型（尤其在数据量小时），冻结低层权重，仅微调高层。

    - 标签平滑：将硬标签变为软标签，防止模型过度自信。

    实践：通常组合使用几种方法，如添加 Dropout + L2 正则化 + 数据增强，并监控验证曲线实施早停。


content:
  prompt: 解释为什么有时候大 batch 训练会导致泛化差？与“陡峭极小值”和“平坦极小值”的关系。
answer:
  mode: rubric
  reference_answer: |-
    大 batch 训练导致泛化差的现象在深度学习中已被广泛观察到。原因主要集中在优化器收敛到的解的性质差异。

    大 batch 与小 batch 的梯度差异

    - 小 batch 梯度噪声大，梯度估计方差高，优化路径更具随机性。这种噪声使模型更容易跳出尖锐极小值，最终收敛到平坦极小值。

    - 大 batch 梯度估计准确，方差低，优化朝着准确的梯度方向稳定下降，容易陷入离初始化点较近的陡峭极小值。

    平坦极小值与陡峭极小值

    - 平坦极小值：损失曲面在该点附近的曲率较小，参数在小范围内变化时损失变化不大。这意味着模型对参数微扰不敏感，泛化能力更强，因为测试数据的小偏移不会导致损失急剧上升。

    - 陡峭极小值：损失曲面非常尖锐，即使参数轻微扰动，损失也会剧烈增加。这类解过度拟合训练数据中的噪声，泛化性能差。

    - 大 batch 训练更容易收敛到陡峭极小值，因此测试误差较高。

    缓解大 batch 泛化下降的方法

    - 调整学习率：采用线性缩放规则（batch size 增大 k 倍，学习率也增大 k 倍），并结合 warmup。这能在一定程度上保持更新量相当。

    - 使用大学习率：适当增大学习率能注入更多“噪声”，帮助模型逃离陡峭极小值。

    - 增加优化器噪声：使用动量系数较低或更激进的优化器。

    - 显式注入噪声：如添加梯度噪声、权重噪声，或使用 SWA (Stochastic Weight Averaging) 沿优化路径平均权重，趋向平坦区域。

    - 专门优化算法：如 LARS、LAMB 用于大批量训练，适应性调整每层学习率。

    - 正则化：大 batch 时，权重衰减等正则化可能需要调整。

    - 数据增强：增加增强的强度，补偿信噪比。

    实验验证

    通过在 CIFAR-10 等数据集上，固定模型和其他超参数，仅改变 batch size（如 64 和 4096），通常观察到小 batch 模型的测试精度更高，且对参数扰动更不敏感（平坦极小值）。利用参数空间的 loss landscape 可视化，小 batch 的解位于宽阔的谷底，大 batch 则位于窄谷。

    因此，设计训练策略时，应在 batch size 和泛化性能之间权衡，或采用上述缓解技术。


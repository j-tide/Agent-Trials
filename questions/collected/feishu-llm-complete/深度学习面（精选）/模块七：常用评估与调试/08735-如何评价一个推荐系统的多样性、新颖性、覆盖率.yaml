content:
  prompt: 如何评价一个推荐系统的多样性、新颖性、覆盖率？
answer:
  mode: rubric
  reference_answer: |-
    除了准确率/召回率，推荐系统需从更多维度评估。

    - 多样性 (Diversity)：衡量推荐列表内物品之间的不相似性，避免重复推荐类似物品。常用：

    [图片内容未导入]

    - 或基于类目的 ILS (Intra-List Similarity)。高多样性提升用户浏览体验。

    - 新颖性 (Novelty)：推荐物品对用户而言是否“新鲜”，一般用推荐物品的流行度（Popularity）的负对数或物品在全体用户中的知晓度来度量。常用平均推荐物品的 log-流行度（取负）。新颖性高意味着推了冷门物品，可能带来惊喜。

    - 覆盖率 (Coverage)：推荐系统能够覆盖多大比例的长尾物品或所有物品。物品覆盖率 = 被推荐过的唯一物品数 / 总物品数。低覆盖率意味着只推热门，容易造成马太效应。还包括用户覆盖率（获取推荐的用户比例）。

    - 惊喜度 (Serendipity)：推荐物品既相关又出乎意料，通常通过距离热门推荐的距离来评估。

    - 时效性 (Timeliness)：推荐是否为用户当前兴趣服务。

    综合评价能防止系统堕入“热门陷阱”，提升长期用户满意度。


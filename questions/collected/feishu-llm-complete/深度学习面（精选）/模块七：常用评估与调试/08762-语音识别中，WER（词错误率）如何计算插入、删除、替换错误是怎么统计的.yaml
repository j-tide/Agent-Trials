answer:
  mode: rubric
  reference_answer: |-
    WER (Word Error Rate) 是语音识别中最核心的评估指标，基于将识别结果（Hypothesis）与参考文本（Reference）对齐后的编辑操作。

    - 编辑操作：

    - 对齐算法：通过动态规划（Levenshtein 距离）找到最小编辑操作序列，使得识别结果变换为参考文本。

    - 公式：

    [图片内容未导入]

    - WER 可能超过 1（当编辑数大于参考词数时）。通常以百分比表示，越低越好。

    示例：

    参考：hello world today

    识别：helo world today nice

    对齐：hello(替换) world today (插入nice) -> S=1, I=1, D=0, N=3, WER=2/3≈66.7%。


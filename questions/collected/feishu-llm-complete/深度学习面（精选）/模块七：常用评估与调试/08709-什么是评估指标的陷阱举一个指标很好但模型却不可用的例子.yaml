content:
  prompt: 什么是“评估指标的陷阱”？举一个指标很好但模型却不可用的例子。
answer:
  mode: rubric
  reference_answer: |-
    评估指标的陷阱 指单一指标或不当指标造成对模型性能的误判，即指标表现优异但实际业务效果差，或模型存在致命缺陷却被高分数掩盖。

    原因：

    - 指标与最终目标不一致（如优化点击率却忽视用户体验）。

    - 数据不均衡、分布偏移时，某些指标仍很高。

    - 指标被“钻空子”（gaming），例如模型学到了伪相关或捷径。

    - 未考虑模型的公平性、鲁棒性或解释性，仅看精度。

    典型例子

    例1：不均衡数据上的准确率陷阱

    信用卡欺诈检测，正常交易占99.9%，欺诈0.1%。模型将所有交易预测为正常，准确率99.9%，看似完美，但召回率为0，完全没有检测到欺诈，造成巨额资金损失。指标（准确率）优秀但模型完全不可用。应使用PR-AUC、F1等。

    例2：BLEU在对话系统中的陷阱

    一个开放域聊天机器人总是回复“好的，呵呵”，在某些对话数据集中，因为参考回复也有类似的短句，BLEU得分可能中上，看似不错。但实际用户体验极差，对话无信息量。指标好但不可用。需要加入多样性、信息量等评估。

    例3：推荐系统点击率陷阱

    模型为了提升点击率，大量推荐低俗或标题党内容，点击率上升，但用户满意度、留存率下降。短期指标（CTR）变好，长期业务受损。需要同时监测用户停留时长、互动质量等北极星指标。

    例4：医学影像分割的Dice系数陷阱

    在CT图像中分割肿瘤，若肿瘤占比极小，模型预测全为背景（无肿瘤），Dice系数可能为0，此例并非指标好。另一个例子：模型预测出大致形状但边缘粗糙，Dice仍可达0.85，但临床不可接受（边缘浸润判断错误）。指标好但模型不可用，需结合边界距离（Hausdorff距离）。

    启示：必须使用与任务目标对齐的多维评估体系，结合业务指标、鲁棒性测试和人工抽查，避免单一指标陷阱。


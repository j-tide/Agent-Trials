content:
  prompt: 如何评估一个异常检测模型的性能？除了精确率召回率，还需关注什么？
answer:
  mode: rubric
  reference_answer: |-
    异常检测（Anomaly Detection）任务通常极度不均衡（异常占比极低），而且误报和漏报的代价不同，因此评估必须多维度。

    核心指标

    - 精确率（Precision）与召回率（Recall）：必看。重点关注召回率（找出多少真正的异常）和精确率（报警中多少是真异常）。通常用PR曲线及AUC-PR来整体评估，因为正类稀少，PR曲线比ROC更能体现模型真实能力。

    - F1-score：Precision-Recall调和平均，适合选择阈值时参考。

    - ROC-AUC：整体排序能力，但由于负类极多，AUC可能虚高（少量FP被巨大分母稀释），应谨慎解读，最好结合PR-AUC。

    额外需关注的维度

    - 特定代价指标

    异常检测常伴随非对称代价：漏报代价 >> 误报代价。因此应引入：

    - 代价矩阵（Cost Matrix）：定义将正常误报为异常的代价 CFPCFP 和漏报异常的代价 CFNCFN，计算总代价或期望代价。

    - 归一化折扣累积增益（NDCG） 或 平均精度（Average Precision, AP）：当需要排序报警优先级时，AP关注将真正的异常排在前面的能力，非常适用。

    - 误报率（False Positive Rate）

    在业务中经常有“每位客户每天允许误报次数”的限制。因此要关注在特定召回率下的误报率，或固定误报率下的召回率（如FPR=0.01时的Recall）。可绘制ROC曲线找到工作点。

    - 提前检测能力

    对于时序异常，需要衡量检测延迟，即从异常实际发生到模型发出警报的时间差。可定义允许的最大延迟窗口，计算在该窗口内的召回率（例如，异常发生后5分钟内检测到视为成功）。

    - 鲁棒性与稳定性

    - 序列误报持续时长：是否在短时间内连续报警（连续FP会导致操作员疲劳）。可统计一次误报事件的持续时间。

    - 对抗噪声的鲁棒性：正常数据有波动时，误报是否激增。

    - 季节性/概念漂移：模型在新模式出现时是否大量误报。

    - 可解释性与事后分析

    异常检测模型常需人工审核报警，因此模型的异常得分要有可解释性（如哪些特征导致高分）。可通过模拟异常案例确认模型是否捕捉到合理的模式。

    - 覆盖率与多样性

    能否检测到多种类型的异常（点异常、上下文异常、集体异常），可通过人工构造不同类型的异常来测试。

    因此，异常检测评估需要结合基于混淆矩阵的指标、代价敏感指标、PR/ROC曲线、检测延迟、误报持续性和业务约束，而不仅仅是精确率与召回率。


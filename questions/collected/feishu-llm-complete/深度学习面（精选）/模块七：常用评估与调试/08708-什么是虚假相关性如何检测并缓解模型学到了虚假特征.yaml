content:
  prompt: 什么是“虚假相关性”？如何检测并缓解模型学到了虚假特征？
answer:
  mode: rubric
  reference_answer: |-
    虚假相关性指模型学习到的特征与标签在训练数据中统计相关，但这种相关性并非因果或真实的语义关系，导致在部署时当此相关消失或不一致时模型失败。例如，在识别“狼”时，模型实际上学会了识别“雪”的背景，因为训练集中所有狼的图片都包含雪。

    检测方法

    - 归因可视化：使用 Grad-CAM、积分梯度等方法，观察模型做出预测依据的图像区域。如果模型频繁关注背景、水印或毫不相关的区域，很可能是虚假特征。

    - 特征消融：在测试时，遮盖或移除怀疑的虚假特征区域（如裁剪掉背景），观察模型预测是否显著变化。若正确率急剧下降，说明模型依赖该区域。

    - 跨域评估：在分布外数据上测试，比如收集背景与训练集不同的同类别图像。如果模型在新背景数据集上大幅下降，说明存在背景偏见。

    - 对抗样本分析：制作针对特征的扰动（如只修改背景），查看预测变化。

    - 统计关联测试：在训练数据中，计算特征（如背景类别）与标签的互信息，识别强相关的非因果特征。


content:
  prompt: 强化学习与语言模型结合的前沿方向（如 RLHF、基于人类反馈的训练）。
answer:
  mode: rubric
  reference_answer: |-
    - RLHF (Reinforcement Learning from Human Feedback)：

    - 动机：大语言模型（LLM）需要对齐人类偏好，生成有帮助、真实、无害的文本。传统监督学习缺乏对生成质量的直接优化。

    - 流程：

    - 影响：ChatGPT 的成功证明了 RLHF 使 LLM 输出更符合期望，显著提升了交互体验。

    - 其他结合方向：

    - 基于语言模型的策略：直接在 LLM 内部生成动作（如输出机器人指令），或者利用 LLM 的世界知识辅助 RL 训练（奖励设计、目标生成）。

    - 工具使用与推理：RL 训练 LLM 学会调用外部工具（搜索引擎、计算器）或进行多步推理（ReAct 模式），通过奖励信号优化工具调用时机和推理链路。

    - 多智能体对话：多个 LLM 相互对话、博弈，通过 RL 优化协作与竞争策略。

    - 幻觉减少：将事实性作为奖励的一部分，通过 RL 调整模型，使其更谨慎和引用证据。

    - 偏好优化算法的演进：如 DPO (Direct Preference Optimization)，直接通过偏好对优化策略，无需显式训练奖励模型，简化了 RLHF 流程。RRHF、RAFT 等方法也在涌现。

    意义：RL 为 LLM 的行为优化提供了灵活且强大的框架，使得对齐人类复杂的、难以形式化的价值观成为可能。这是大模型从“预测下一个词”走向“有用的AI助手”的关键一步。

    - 提高数据效率，每条经验可以被多次学习。

    - 平滑训练过程，避免因连续高度相关样本导致的发散或振荡。

    - 使用当前策略 πθπθ 在多个环境中并行采集 n 步经验（或固定长度片段）。

    - 对于每个经验片段，计算 n 步 TD 误差或直接用蒙特卡洛回报（结合值函数bootstrap）来估计优势：

    - AlphaGo 结合深度神经网络与蒙特卡洛树搜索 (MCTS)，使用监督学习（从人类棋谱）和强化学习（自我对弈）训练策略网络和价值网络。

    - AlphaZero 完全从零开始自我对弈，不依赖人类知识，在围棋、国际象棋、将棋中击败所有之前程序，展现了RL的通用性。

    - 监督微调 (SFT)：收集人类指令-回答对，微调预训练LLM。

    - 奖励模型 (RM) 训练：针对同一提示的多个回答，由人类标注偏好排序，训练奖励模型预测符合人类偏好的分数。

    - RL 微调：使用 PPO 算法，将 LLM 作为策略，生成回答后获得 RM 的奖励，同时加入 KL 惩罚防止策略偏离太远。

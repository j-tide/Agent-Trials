content:
  prompt: FCN（全卷积网络）如何实现端到端的语义分割？
answer:
  mode: rubric
  reference_answer: |-
    FCN (Fully Convolutional Network) 是语义分割的开山之作，实现了端到端的像素级分类。

    核心思想：

    - 全卷积化：将分类网络（如VGG）最后的全连接层替换为1×1卷积层，使得网络可以接受任意尺寸输入，并输出空间尺寸对应的特征图。

    - 上采样 (Deconvolution/Transposed Convolution 或双线性插值)：由于骨干网络的下采样使得最终特征图分辨率远小于输入，FCN使用上采样操作将特征图恢复到输入尺寸，得到逐像素预测。

    - 跳跃连接 (Skip Connections)：为了融合精细空间信息，FCN将深层特征图上采样后与浅层特征图相加，逐步恢复细节。论文提出了FCN-32s（只从最后层上采样32倍）、FCN-16s（融合pool4）、FCN-8s（融合pool3和pool4），其中FCN-8s分割效果最好，边缘更精细。

    工作流程：

    - 输入图像经过卷积骨干网络，得到不同阶段的特征图（如1/8, 1/16, 1/32）。

    - 对1/32的特征图进行预测并2倍上采样，与1/16的特征图（经过1×1卷积预测）相加，再2倍上采样与1/8的融合，最后8倍上采样至原图尺寸，输出类别概率图。

    - 使用逐像素交叉熵损失端到端训练。

    意义：FCN证明了全卷积网络可以高效进行密集预测，奠定了语义分割的基础。后续方法改进多集中在扩大感受野、多尺度上下文和更好的上采样策略。


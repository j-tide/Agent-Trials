content:
  prompt: 语义分割和实例分割的区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    - 语义分割 (Semantic Segmentation)：为图像中的每个像素分配一个语义类别标签（如“天空”、“道路”、“车”），但不区分同一类别的不同个体。输出是一张单通道的类别图，每个像素值对应类别索引。例如，所有车辆被标记为同一个“car”类别，看不出是几辆车。

    - 实例分割 (Instance Segmentation)：不仅区分语义类别，还要区分同一类别中的不同实例。输出通常为每个实例生成一个掩码，并附带类别标签。例如，图像中有三辆车，实例分割会输出三个不同的掩码，分别标识为“car 1”、“car 2”、“car 3”。

    关键区别：

    [嵌入表格未展开]

    联系：实例分割有时可视为“检测+语义分割”的组合，先检测物体再对每个物体进行前景分割。全景分割则进一步统一两者。


content:
  prompt: 什么是 ROI Pooling 和 ROI Align？ROI Align 为什么更精确？
answer:
  mode: rubric
  reference_answer: |-
    两者都是将任意尺寸的感兴趣区域（ROI）特征转换为固定尺寸特征图（如7×7）的操作，以便后续全连接层处理。

    ROI Pooling：

    - 根据ROI在原图中的坐标和特征图步长，将其映射到特征图上的区域。

    - 将该区域划分成固定数量的网格（如7×7）。

    - 每个网格内进行最大池化。

    - 问题：在映射和划分网格时，坐标被量化取整，引入了两次量化误差：一次是将浮点ROI坐标取整到特征图网格，另一次是将网格边界取整。这种不对齐（misalignment）导致位置信息的丢失，对像素级的分割任务尤其不利。

    ROI Align：

    - 同样将ROI映射到特征图，但保持浮点坐标，不做量化。

    - 将ROI区域均匀划分为7×7个单元格，每个单元格内固定采样4个点（如均匀分布），然后使用双线性插值计算每个采样点的特征值。

    - 最后对每个单元格内的采样点进行最大池化（或平均池化）。

    - 整个过程没有量化取整，保留了精确的空间对应关系。

    为什么ROI Align更精确：

    - 消除了量化误差，实现了像素级别的对齐，对于需要精细边界的分割任务（如Mask R-CNN）至关重要。

    - 它保证了输入特征图与输出固定尺寸特征之间的空间不变性，使得后续的分类和回归更加准确。

    - 实验表明，使用ROI Align替代ROI Pooling，在检测和分割上均有明显提升（Mask R-CNN中提升约1-2个点AP）。


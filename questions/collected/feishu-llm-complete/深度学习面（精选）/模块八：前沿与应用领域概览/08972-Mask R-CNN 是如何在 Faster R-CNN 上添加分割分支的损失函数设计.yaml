content:
  prompt: Mask R-CNN 是如何在 Faster R-CNN 上添加分割分支的？损失函数设计。
answer:
  mode: rubric
  reference_answer: |-
    Mask R-CNN 是在Faster R-CNN基础上的扩展，增加了一个分割掩码预测分支，实现了实例分割。

    架构修改：

    - 骨干网络：与Faster R-CNN共享卷积特征。

    - RPN：生成区域提议，不变。

    - ROI Align：替代ROI Pooling，解决量化不对齐问题，对掩码任务至关重要。

    - 三分支头：对于每个ROI，并行应用：

    掩码分支细节：

    - 输入为ROI Align后的特征（如14×14×256）。

    - 经过几个3×3卷积和ReLU，再接一个转置卷积上采样到28×28，最后用1×1卷积输出 K 个类别掩码（sigmoid激活）。

    - 训练时，只使用真实类别对应的那个掩码通道计算损失，其他通道忽略。

    损失函数：


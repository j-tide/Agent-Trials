    解耦掩码预测的优势：类别预测错误时，掩码分支仍能输出该ROI的精细掩码，但最终掩码由分类分支选择的类别通道决定。这种解耦提升了掩码质量和训练稳定性。

    Mask R-CNN 以较小的额外计算代价实现了高精度实例分割，成为该领域的标杆。


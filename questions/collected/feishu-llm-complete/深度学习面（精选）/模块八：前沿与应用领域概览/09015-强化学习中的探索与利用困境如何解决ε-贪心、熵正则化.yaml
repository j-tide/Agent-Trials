content:
  prompt: 强化学习中的探索与利用困境如何解决？ε-贪心、熵正则化。
answer:
  mode: rubric
  reference_answer: |-
    探索与利用困境 (Exploration vs. Exploitation)：

    - 利用 (Exploitation)：根据已知信息选择当前认为最好的动作，以最大化短期奖励。可能导致错过更优策略。

    - 探索 (Exploration)：尝试尚未充分了解或随机的动作，以收集更多信息，可能带来长期更高回报，但短期回报可能较低。

    - 智能体必须在两者之间找到平衡，这是强化学习的核心难题之一。

    解决方法：

    - ε-贪心 (ε-Greedy)：

    - 以概率 1−ϵ 选择贪心动作（利用），以概率 ϵ 随机选择动作（探索）。

    - 通常 ϵ 初始较大（如1.0），随时间衰减至较小的值（如0.01）。

    - 优点：简单，适用于离散动作空间。

    - 缺点：探索盲目（对所有非贪心动作一视同仁），效率不高；在复杂环境中可能始终无法探索到关键区域。

    - 乐观初始化 (Optimistic Initialization)：

    - 将 Q 值初始化为较高的值，促使智能体在早期去探索更多状态动作（因为预估回报都很高），随着经验增加，这些估计逐渐收敛。

    - 熵正则化 (Entropy Regularization)：

    - 在策略优化目标中加入策略的熵项：

    [图片内容未导入]

    - 熵 H 衡量策略的随机性。最大化熵鼓励动作分布更均匀，即保持探索。

    - 系数 β 控制探索的强度。Soft Actor-Critic (SAC) 算法基于此，取得了出色的探索和性能。

    - 上置信界 (Upper Confidence Bound, UCB)：

    [图片内容未导入]

    - Thompson Sampling：

    - 维护 Q 值的后验分布（如贝叶斯方法），从分布中采样选择动作，自然平衡探索与利用。

    - 内在奖励 (Intrinsic Motivation)：

    - 给智能体提供额外的内在奖励，例如访问新奇状态（基于计数的探索）、预测误差（好奇心）或状态空间密度。

    - 近年来基于随机网络蒸馏 (RND) 等方法在难探索游戏中取得突破。

    - 参数空间噪声 (Parameter Space Noise)：

    - 在策略网络的参数上添加自适应噪声，从而产生一致的探索行为，而非在动作空间随机。

    选择哪种方法取决于问题规模：小规模表格型问题可用 UCB 或乐观初始化；大规模深度强化学习常用 ε-贪心（DQN）或熵正则化（A2C/PPO/SAC），并可结合内在奖励。


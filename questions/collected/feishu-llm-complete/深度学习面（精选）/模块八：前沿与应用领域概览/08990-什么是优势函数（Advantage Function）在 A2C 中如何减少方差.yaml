answer:
  mode: rubric
  reference_answer: |-
    优势函数：

    [图片内容未导入]

    - 优势函数相当于以 V(s) 作为基线 (Baseline)，减去了状态本身的价值。这移除了由于状态好坏带来的回报波动，因为好的状态下的高回报不再盲目地奖励该状态下的所有动作。

    - 数学上可以证明，引入与动作无关的基线不改变梯度期望，但显著降低方差。

    - V(s) 正是对基线的最优估计。

    在 A2C 中如何估计优势：

    A2C 通常不单独维护 Q 网络，而是利用 TD 误差作为优势的无偏估计（或近似）。因为：

    [图片内容未导入]

    更大的 n 减少偏差但增加方差。A2C 使用这样的优势估计驱动策略更新，实现了方差降低。


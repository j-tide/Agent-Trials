content:
  prompt: CLIP 的零样本分类是如何实现的？用 prompt 构造分类器。
answer:
  mode: rubric
  reference_answer: |-
    CLIP 的零样本分类是其最具突破性的能力之一：无需在特定分类数据集上训练，仅利用类别名称的自然语言描述即可进行图像分类。

    实现原理：

    预训练后，CLIP 的图像编码器和文本编码器处于同一个对齐的嵌入空间。对于任意一张图像，我们可以计算它与任意文本描述的相似度。零样本分类正是利用这一属性，将分类转化为图文匹配问题。

    步骤：

    [图片内容未导入]

    Prompt 构造的影响：

    - 简单的类别名称可能导致歧义或不完整匹配。例如，分类 ImageNet 中的 "crane" 时，可能被理解为“起重机”而非“鹤”。通过 prompt "a photo of a crane bird" 可消除歧义。

    - Prompt engineering（如 CLIP 论文中使用的 80 个上下文模板集成）显著提升了零样本准确率，甚至可以超越某些全监督基线。

    - 进一步，prompt 可以包含细粒度描述，如 "a sketch of a {}", "a {} in the dark"，使模型对不同数据分布更加鲁棒。

    优势：

    - 完全无需训练数据，即可泛化到任意类别集合。

    - 不限制于预定义类别数量，可随时新增类别。

    - 对分布偏移（如素描、绘画）具有更强的适应能力，只需调整 prompt 即可，无需重新训练。

    零样本分类的广泛应用：

    - 开放域分类：如用户输入任意类别名称，模型即时识别。

    - 细粒度分类：通过设计包含差异化描述的 prompt，如 "a {} flower" vs "a {} bird" 进行细粒度区分。

    - 跨数据集迁移：无需在目标数据集上微调，直接评估。

    CLIP 的零样本分类证明了自然语言监督的强大力量，引领了视觉基础模型的新范式。


content:
  prompt: 近年来视觉基础模型（如 SAM）对分割任务带来了什么变革？
answer:
  mode: rubric
  reference_answer: |-
    SAM (Segment Anything Model) 由Meta AI推出，是一个基于提示的分割基础模型，变革影响深远。

    SAM的核心能力：

    - 可提示分割：接受点、框、掩码或文本等提示，生成对应物体的分割掩码。单一模型处理多样提示，通用性强。

    - 大规模数据与模型：在11M图像、1.1B掩码的海量数据集上训练（数据引擎），模型参数达数亿，具备极强的零样本泛化能力。

    - 模糊感知输出：当提示指向模糊区域时（如一个物体的一部分），SAM可输出多个可能的有效掩码（如衣服的领口、整件衣服）。

    变革影响：

    - 分割任务的范式转变

    - 从“训练特定任务模型”变为“使用通用模型+提示/微调”。SAM可以作为一个强大的初始模型，开发者无需从头收集标注数据，只需提供提示或少量标注微调即可完成新分割任务。

    - 极大降低了分割应用的门槛，尤其在医学、遥感、农业等标注稀缺领域，可通过点提示快速获得初始掩码，再结合人工修正，效率提升。

    - 数据标注革命

    - SAM的数据引擎本身就是通过模型辅助标注循环构建的：人工标注少量，训练模型，模型预标注，人工修正，迭代放大。这为大规模分割数据集构建提供了新范式。

    - 可集成到标注工具中，作为交互式分割器，显著加速标注速度。

    - 与大型语言模型整合

    - SAM可与其他视觉或语言模型组合，例如 Grounding DINO（开放词汇检测）+ SAM，实现文本引导的分割，走向通用视觉理解。

    - 推动通用视觉架构

    - SAM的成功证明了“大数据+大模型”在视觉领域的可行性，促进了更多视觉基础模型（如DINOv2、SEEM）的出现，最终可能统一检测、分割、深度估计等任务。

    局限性：SAM在细粒度结构、复杂场景遮挡、实时性方面仍有挑战，且训练成本高。但SAM开启的分割基础模型方向正重新定义视觉任务的解决方式，是计算机视觉领域的里程碑之一。

    - 线性衰减：si=si(1−IoU(M,bi))si=si(1−IoU(M,bi))，当IoU超过阈值时。

    - 高斯衰减：si=sie−IoU(M,bi)2σsi=sie−σIoU(M,bi)2，更平滑。

    - 分类分支：预测类别概率。

    - 回归分支：预测边界框偏移。

    - 掩码分支：一个小型全卷积网络，在ROI特征上预测每个类别的二值掩码（尺寸如28×28）。该分支输出一个 K 通道的特征图（K为类别数），每个通道对应一个类别的掩码。

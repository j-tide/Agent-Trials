content:
  prompt: 基于值的方法和基于策略的方法有什么区别？Q-Learning 和 Policy Gradient 的思想。
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    基于值的方法 (Value-Based)：

    [图片内容未导入]

    - 代表算法：Q-Learning、Deep Q-Network (DQN)。

    - 优点：样本效率较高，通常较稳定。

    - 缺点：

    - 难以处理连续动作空间（因为需要对所有动作求最大值）。

    - 最终学到的策略是确定型的，可能不足以表达某些随机最优策略。

    - 在函数近似下，微小的 Q 值误差可能导致策略急剧变化。

    基于策略的方法 (Policy-Based)：

    [图片内容未导入]

    - 代表算法：REINFORCE、PPO、A2C/A3C。

    - 优点：

    - 天然支持连续动作空间（策略输出动作分布参数，如高斯均值方差）。

    - 可以学习随机策略，这在部分可观测环境或博弈中至关重要。

    - 优化目标直接针对感兴趣的性能度量，可能收敛更好。

    - 缺点：

    - 通常样本效率较低，梯度估计方差大（需要多次采样）。

    - 容易陷入局部最优。

    Q-Learning 的思想：

    [图片内容未导入]

    对比总结：基于值的方法间接通过值函数获得策略，适合离散动作和样本效率要求高的场景；基于策略的方法直接优化策略，适合连续动作和需要随机策略的场景。现代方法（Actor-Critic）将两者结合。


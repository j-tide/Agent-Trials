content:
  prompt: LoRA 等参数高效微调方法的原理是什么？低秩分解如何减少可训练参数？
answer:
  mode: rubric
  reference_answer: |-
    参数高效微调 (PEFT) 旨在不修改原模型大部分参数的情况下，仅训练少量额外参数，使大模型适应下游任务，大幅降低存储和计算成本。

    LoRA (Low-Rank Adaptation) 是一种代表性的PEFT方法。其核心假设：模型在适应下游任务时，权重矩阵的更新（增量）是低秩的。

    原理：

    [图片内容未导入]

    参数效率：

    - 原始参数数量 d×kd×k，LoRA 参数数量 r(d+k)。当 r 很小时，参数量大幅减少。例如，对于 d=k=4096,r=16，LoRA参数量约为 16×8192≈131k，而原始参数约 16.8M，仅占 0.77%。

    - 大大减少了存储空间（只需保存一个小的LoRA模块而非完整模型副本）和训练显存（无需存储大部分参数的梯度）。

    其他 PEFT 方法：

    - Adapter：在Transformer层中插入小型神经网络模块，通常为瓶颈结构（降维→激活→升维）。仅训练这些适配器和输出层。

    - Prefix Tuning / Prompt Tuning：在输入或每层的前面添加可学习的虚拟token（软提示），仅训练这些token的嵌入。

    [图片内容未导入]

    LoRA在实践中非常成功，因其实现简单，可与原模型无缝切换，支持多任务（每个任务保存独立的LoRA权重），在语言和视觉领域广泛应用。


content:
  prompt: Actor-Critic 方法如何结合策略和值函数？A2C/A3C 的基本框架。
answer:
  mode: rubric
  reference_answer: |-
    Actor-Critic 方法 是策略梯度与值函数方法的融合，旨在保持策略梯度的直接策略优化，同时引入值函数来降低梯度估计的方差。

    [图片内容未导入]

    A2C (Advantage Actor-Critic)：

    - 同步版本：有一个全局网络，多个并行环境（workers）各自收集一小批数据，然后同步计算梯度并更新全局网络。

    - 框架：

    [图片内容未导入]

    [图片内容未导入]

    A3C (Asynchronous Advantage Actor-Critic)：

    - 异步版本：每个 worker 在各自的环境副本中独立运行，异步地将梯度更新推送到全局网络，或直接更新全局网络（Hogwild风格）。无需经验回放，因为异步交互已经起到了解相关的作用。

    - 在实践上，A2C（同步、使用GPU批处理）通常更高效且易实现，性能与A3C相当或更好。

    A2C/A3C 是有效的基线算法，为后来的 PPO 等方法奠定了基础。


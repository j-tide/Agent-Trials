content:
  prompt: 指令微调（Instruction Tuning）是如何让模型对齐人类意图的？数据如何构造？
answer:
  mode: rubric
  reference_answer: |-
    指令微调 是在自然语言指令表述的任务上对预训练模型进行微调，使模型能理解和遵循人类的各种指令，而不仅限于特定格式的任务。

    如何对齐人类意图：

    - 传统微调通常将每个任务格式化为特定结构（如分类加softmax头）。指令微调将所有任务统一为“指令-回答”的文本到文本格式，例如：

    - text

    - [指令] 将以下句子翻译成英文：今天天气真好。[回答] The weather is really nice today.

    - 通过大量多样化的指令数据，模型学会了泛化到未见过的指令，具备零样本任务执行能力。模型内化了“理解指令 → 执行任务 → 生成符合要求的回答”的元能力。

    - 这种训练使得模型不再需要针对每个任务进行单独微调，单一模型即可处理成百上千种任务，真正实现“一个模型做所有事”。

    数据构造方法：

    - 人工标注：聘请标注人员根据给定任务编写指令和高质量回答。这是质量最高的数据，但成本高、数量有限。早期工作如FLAN、InstructGPT即依赖人工。

    - 利用现有数据集转换：将已有NLP数据集的标签和输入自动转化为指令模板。例如，将情感分类数据集转化为“判断以下评论的情感是积极还是消极：{text}”。可使用多个模板增加多样性。此方法可规模化，但指令多样性不足。

    - 利用强大LLM自生成（Self-Instruct）：

    - 迭代式数据改进：使用模型生成回答，人工或自动评分，筛选高质量数据加入训练集，循环提升模型。

    - 多任务与多语言融合：融入多种语言、多种任务类型（生成、分类、推理、代码等），提升泛化性。

    关键挑战：

    - 指令多样性覆盖：要覆盖真实用户各种可能的提问风格和任务类型。

    - 回答质量：自动生成的数据可能包含幻觉或错误，需要过滤。

    - 模型能力平衡：避免在某一类任务上过拟合，导致其他能力下降（灾难性遗忘）。高质量指令微调通常也混合预训练数据一起训练。

    指令微调是连接通用预训练模型与实用AI助手的关键桥梁，极大提升了大模型的交互体验和实用性。


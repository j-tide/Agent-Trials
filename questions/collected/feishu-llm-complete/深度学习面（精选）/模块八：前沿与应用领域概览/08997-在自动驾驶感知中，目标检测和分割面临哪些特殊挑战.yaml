content:
  prompt: 在自动驾驶感知中，目标检测和分割面临哪些特殊挑战？
answer:
  mode: rubric
  reference_answer: |-
    - 实时性与资源限制：车载芯片算力有限，模型必须在极低延迟（毫秒级）下运行，需轻量级架构（如YOLO、MobileNet）和硬件加速。

    - 小目标与远距离检测：行人、交通标志在图像中可能只有几十像素，需要高分辨率输入和强特征提取。

    - 复杂动态环境：光照骤变、雨雪雾天气、夜间红外、运动模糊、遮挡严重，要求模型鲁棒。需要数据增强（模拟天气）、多传感器融合（相机+LiDAR+Radar）。

    - 安全性与可靠性：漏检和误检可能致命，需极低的假阴性（召回率高），同时控制假阳性。常需不确定性估计，融合多模态互补。

    - 多类别与细粒度：需区分车辆类型、交通灯颜色和状态、可行驶区域等，类别定义复杂。

    - 多任务联合：通常需同时做2D/3D检测、跟踪、分割、深度估计等，模型需支持多任务输出。

    - 时序一致性：视频流中检测结果应稳定，避免闪烁，需跟踪器或时序模型（如3D卷积、Transformer）。

    - 长尾分布与Corner Cases：罕见场景（如事故、施工路障）数据稀少，需要数据合成、自监督学习提升泛化。

    - 标注成本：点云和密集分割标注极其昂贵，自监督预训练和弱监督方法变得重要。

    - 传感器标定与同步：多传感器时空对齐误差会严重影响融合效果。

    解决策略：常采用多传感器融合、时序模型、坚固的backbone、针对性的数据增强和有效的压缩技术。


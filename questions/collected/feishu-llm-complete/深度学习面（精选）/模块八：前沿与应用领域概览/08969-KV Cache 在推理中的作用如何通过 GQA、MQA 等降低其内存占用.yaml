content:
  prompt: KV Cache 在推理中的作用？如何通过 GQA、MQA 等降低其内存占用？
answer:
  mode: rubric
  reference_answer: |-
    KV Cache 是自回归Transformer模型推理时的关键显存优化技术。在自回归生成中，每生成一个新token，模型需要用到所有之前生成的token作为上下文。如果不加缓存，每次都要将完整的当前序列重新输入模型，重新计算所有历史token的Key和Value矩阵，计算量会随序列长度平方增长。

    KV Cache 原理：

    [图片内容未导入]

    降低KV Cache的方法：GQA 和 MQA

    为了减少KV Cache的大小，可以减少K和V的“头”的数量，即多个查询头共享同一组键值头。

    - MQA (Multi-Query Attention)：所有查询头共享同一组 K 和 V。KV Cache大小变为原来的 1/h（h为头数），极大压缩缓存，但可能限制注意力表达能力。

    - GQA (Grouped-Query Attention)：将查询头分为若干组，每组共享一组 K 和 V。例如，32个查询头分为8组，每组4个查询头共享同一组KV。这样在压缩缓存的同时，保留了比MQA更多的灵活性。GQA在LLaMA 2等模型中被广泛采用。

    其他优化：

    - 量化KV Cache：将缓存的K、V值量化为INT8或FP8，大幅降低内存。

    - 滑动窗口注意力：只缓存最近的一部分token，丢弃较远的历史。

    - PagedAttention (vLLM)：将KV Cache分页管理，减少显存碎片，提高利用率。

    - 多级缓存：利用GPU的共享内存和寄存器层级缓存部分KV。

    KV Cache和针对它的优化是提升大模型推理吞吐、支持更长上下文的关键。


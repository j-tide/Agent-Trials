content:
  prompt: 对比学习在 NLP 中的应用有哪些？如 SimCSE，它的正样本如何构造？
answer:
  mode: rubric
  reference_answer: |-
    对比学习在 NLP 领域同样取得了显著成效，其基本思路依然是拉近相似句子表示、推开不相似句子表示。

    SimCSE（Simple Contrastive Learning of Sentence Embeddings）

    - 核心思想：将相同的输入句子两次通过同一个编码器，由于编码器内嵌的 Dropout 会产生不同的随机掩码，导致两个输出向量略有不同。这两个向量即构成正样本对。负样本为同一批次中其他句子的向量。

    - 损失函数：使用 InfoNCE 损失，批次内对比。对于一个句子 s，经过两次前向得到向量 z 和 z'，z 和 z' 互为正样本，其余 2(N-1) 个向量为负样本。

    - 效果：这种极其简单的设计（仅利用 Dropout 噪声）就能产生高质量的句子嵌入，在语义文本相似性（STS）任务上显著超越之前的无监督方法。SimCSE 也提供了有监督版本，利用自然语言推理数据集的正例（蕴含句对）作为正样本，负例（矛盾句对）作为硬负样本，进一步提升性能。

    其他 NLP 对比学习应用

    - CLEAR：在句子级别，使用数据增强（如回译、随机删除词）产生正样本，用对比学习预训练句子表示。

    - ConSERT：在词向量级别引入对比学习，通过对抗扰动、打乱 token 顺序等增强产生正样本。

    - DeCLUTR：利用同一文档中的不同片段作为正样本，假设相近的文本段落语义相关。

    - PairSup：为每个句子构造正负例对，利用对比损失微调预训练语言模型。

    NLP 中正样本构造策略

    - Dropout 噪声（SimCSE 无监督）：最简单的隐式增强。

    - 回译：将句子翻译成另一种语言再译回，产生语义不变但措辞变化的正样本。

    - 同义词替换/随机插入删除：轻度文本增强。

    - 文档内邻近句子：利用长文档结构，相邻句子视为正样本。

    - 有监督信号：利用标注的蕴含/矛盾关系，蕴含对为正，矛盾对为硬负。

    总结：对比学习为 NLP 中的表示学习提供了强大框架，SimCSE 以极简方式证明了 Dropout 本身就可作为有效的数据增强，推动了对比学习在 NLP 领域的广泛应用。


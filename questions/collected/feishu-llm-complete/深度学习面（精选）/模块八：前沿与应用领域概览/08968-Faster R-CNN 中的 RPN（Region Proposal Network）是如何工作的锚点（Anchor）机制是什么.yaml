content:
  prompt: Faster R-CNN 中的 RPN（Region Proposal Network）是如何工作的？锚点（Anchor）机制是什么？
answer:
  mode: rubric
  reference_answer: |-
    RPN的工作原理：

    RPN是一个全卷积网络，它共享基础卷积特征图，并在此特征图上滑动一个小网络，同时预测物体性得分和边界框偏移。具体流程：

    - 输入：骨干网络输出的特征图（如VGG16的conv5_3，尺寸为 H×W×C）。

    - 滑动窗口：在特征图的每个空间位置，使用一个3×3卷积提取特征，输出一个低维向量（如256-d）。

    - 双路预测：

    - 分类分支：通过1×1卷积输出 2k 个得分，表示k个锚点各自是物体/背景的概率。

    - 回归分支：通过1×1卷积输出 4k 个坐标偏移，每个锚点对应4个偏移量 (dx, dy, dw, dh)。

    - 锚点生成：在每个滑动窗口中心，生成 k 个不同尺度和长宽比的参考框，称为锚点（Anchor）。

    - 训练目标：RPN使用二分类损失（物体 vs 背景）和平滑L1回归损失进行端到端训练。

    锚点（Anchor）机制：

    - 锚点是预先定义的一系列矩形框，分布于特征图的每个位置，作为检测的基准。

    - 典型设置：3种尺度（128², 256², 512²）和3种长宽比（1:1, 1:2, 2:1），组合出 k=9 个锚点。

    - 锚点的设计使得网络只需预测相对偏移（偏移回归），而不是绝对坐标，这降低了学习难度。

    - 正负样本分配：与任意真实框的IoU大于0.7的锚点为正样本；小于0.3的为负样本；其余忽略。这保证了RPN能学习到物体位置。

    - 训练时，RPN会采样正负样本（通常各128个）以平衡训练。


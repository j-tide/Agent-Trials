content:
  prompt: 强化学习在游戏（AlphaGo）、机器人、推荐系统等领域的应用。
answer:
  mode: rubric
  reference_answer: |-
    - 游戏 AI

    - Atari 游戏 (DQN)：直接从原始像素学习玩街机游戏，端到端学会人类级别的策略。DQN 的出现是深度学习与 RL 结合的分水岭。

    - 围棋 (AlphaGo / AlphaZero)：

    - 星际争霸 II (AlphaStar)：利用多智能体训练、模仿学习和强化学习，达到宗师级水平，需要处理超大动作空间和长时规划。

    - OpenAI Five (Dota 2)：使用大规模PPO进行训练，展示了团队协作和长期策略。

    - 机器人

    - 运动控制：让模拟或真实机器人学习行走、奔跑、跳跃（如 DeepMind 的 locomotion 任务）。PPO、SAC等被广泛应用。

    - 机械臂操控：抓取、堆叠、开门等任务。通常采用 Sim-to-Real 迁移，即在模拟器中训练后迁移到现实。

    - 自主导航：机器人在未知环境中避障并到达目标，使用 RL 结合 SLAM。

    - 挑战：真实环境样本效率低、安全风险高，因此模拟至关重要。域随机化、系统辨识等方法帮助缩小模拟与现实的差距。

    - 推荐系统

    - 动态用户兴趣建模：用户的兴趣和行为随推荐结果发生变化，RL 可以建模这种反馈循环，优化长期用户满意度（如停留时间、转化率）而非单一即时点击。

    - 序列化推荐：将推荐视为序列决策过程，每一步推荐一个或多个物品，用户反馈（点击、购买）作为奖励。

    - 使用算法：Contextual Bandit（简单形式）、Value-based DQN、Policy Gradient 等。为了处理巨大动作空间，常用离线RL、Slate RL（推荐一组物品）等。

    - 实例：YouTube 推荐、广告投放优化、京东商品推荐等，RL 已用于提升长期指标。

    - 其他领域

    - 金融交易：RL 学习交易策略，在风险约束下最大化收益。

    - 自然语言处理：RL 用于对话管理、文本生成（如 RLHF）、机器翻译中的序列级优化。

    - 工业控制：数据中心冷却、电网调度、化学反应优化。

    - 自动驾驶：将规划和控制问题建模为 RL 任务，处理交互决策。


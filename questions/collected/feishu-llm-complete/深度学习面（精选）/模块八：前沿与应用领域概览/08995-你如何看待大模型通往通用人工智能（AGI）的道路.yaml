content:
  prompt: 你如何看待大模型通往通用人工智能（AGI）的道路？
answer:
  mode: rubric
  reference_answer: |-
    大语言模型的出现为AGI的实现提供了令人振奋的路径，但当前模型仍存在显著局限，距离真正的AGI尚有距离。

    大模型的巨大潜力：

    - 通用知识引擎：在海量文本上学到的世界知识覆盖面极广，展现了某种“宽泛的智能”。

    - 涌现能力：上下文学习、思维链推理、代码生成等能力表明，随着规模扩大，模型能从统计模式中涌现出类思考的行为。

    - 多模态融合：GPT-4V、Gemini等将视觉、听觉与语言结合，向全面感知发展。

    - 工具使用：模型能调用API、搜索引擎、计算器，与环境交互，弥补自身不足。

    - 学习范式突破：从监督学习到自监督预训练，再到RLHF对齐和检索增强，学习框架越来越完善。

    目前的根本局限：

    - 缺乏真正的理解和因果推理：模型本质上是“序列预测机器”，基于模式匹配而非因果模型。它可能在语法正确的情况下做出不合逻辑的推理。

    - 没有持续的自我意识和记忆：模型的世界模型是静态的，不能像人类一样持续学习和更新个人经历，容易遗忘或混淆。

    - 幻觉与可靠性不足：模型在不能确定时仍自信生成错误内容，且缺乏自省能力。

    - 缺乏身体和物理世界经验：智能可能需要在物理世界中交互才能真正理解基本概念（如空间、重量、意图），即所谓的“具身智能”。

    - 能源与效率：人脑以极低的功耗完成复杂智能活动，而当前大模型能耗巨大，效率极低。

    通往AGI的可能路径：

    - 世界模型与仿真：构建能够预测环境行为的世界模型，结合强化学习在模拟或真实环境中学习。

    - 神经符号结合：将神经网络的模式识别能力与符号系统的逻辑推理、知识表示结合，实现更可靠的推理。

    - 持续学习与元学习：赋予模型从少量样本持续学习新概念而不遗忘旧知识的能力。

    - 多智能体协作：多个专业化的AI智能体协作完成任务，展现更复杂的群体智能。

    - 脑科学与人工智能的交叉启发：从人类认知架构中获取灵感，如全局工作空间理论、预测编码等。

    - 对于给定提示，使用SFT模型生成多个候选回答（通常4-9个）。

    - 标注人员对这些回答进行偏好排序（A > B > C > D），形成比较数据。

    - 用少量人工示例作为种子，让LLM生成新的指令、输入实例和输出。

    - 对生成的数据进行过滤（去除低质量、重复、有害内容）。

    - Alpaca、Vicuna等模型即通过这种方式从GPT-3.5/GPT-4生成训练数据，取得了令人瞩目的效果。

    - 数据过滤：在预训练阶段就过滤掉有害内容，但难以穷尽。

    - 监督微调 (SFT)：使用安全的指令数据训练模型拒绝回答不当问题。

    - RLHF / DPO：通过人类偏好数据让模型学习安全的回答模式。

    - 安全提示词：在系统级添加强调安全的指令前缀。

    - 内容审查API：在输入和输出端部署额外的检测模型进行过滤和阻止。

    - 去偏数据：平衡数据中的代表性，使用反事实数据增强。

    - 去偏微调：在包含去偏示例的数据集上微调。

    - 偏见评估基准：使用 WinoBias、StereoSet、BBQ 等评估，持续监控。

    - 可控生成：允许用户指定或调整生成内容的属性。

    - 透明度和解释：让模型解释其推理依据，暴露潜在偏见。

    - 红队测试 (Red Teaming)：专门团队持续尝试突破模型安全防线，发现漏洞后迭代修复。

    - 指令层次化：设置不可逾越的系统级安全准则。

    - 安全与有用性权衡：通过RLHF中的奖励塑形，在安全性和实用性之间找平衡。

    - 数字水印：对生成内容嵌入不可见标记，追踪滥用来源。

    - 访问控制与速率限制：防止大规模恶意使用。

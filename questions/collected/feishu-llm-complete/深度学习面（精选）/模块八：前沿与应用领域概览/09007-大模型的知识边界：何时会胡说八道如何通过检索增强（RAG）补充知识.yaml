content:
  prompt: 大模型的知识边界：何时会胡说八道？如何通过检索增强（RAG）补充知识？
answer:
  mode: rubric
  reference_answer: |-
    知识边界与胡说八道的诱因：

    大语言模型的知识来自其训练数据，存在明确边界：

    - 训练数据截止：模型知识停留在训练数据收集的时间点，此后发生的事件完全未知。

    - 长尾实体：对罕见实体、冷门专业知识覆盖不足，容易生成错误的属性或关系。

    - 数据噪声与偏见：训练数据中存在的错误信息会被模型学习并复现。

    - 推理失败：即使相关事实在训练数据中出现过，模型在组合推理时可能出错，生成不合逻辑的结论。

    - 过度自信：模型被训练为总是提供答案，当遇到未知信息时，倾向于编造听起来合理但实际上错误的内容（幻觉）。

    RAG (Retrieval-Augmented Generation) 如何补充知识：

    RAG 在生成回答前，先从外部知识库（如维基百科、公司文档、数据库）中检索与当前查询最相关的文档或片段，将这些检索结果作为额外的上下文，与用户查询一起输入给语言模型，再由模型生成回答。这样，模型不必完全依赖自身权重中记忆的知识，而是可以基于最新、最权威的外部信息进行回答。

    RAG的流程：

    - 查询编码：将用户问题编码为向量。

    - 检索：使用该向量在向量数据库中进行相似度搜索，取回 top-k 个最相关的文本片段。

    - 上下文增强：将这些片段与原始问题拼接，形成提示：“根据以下信息回答问题：[文档内容] \n 问题：[用户问题] \n 回答：”

    - 生成：大模型基于增强的提示生成回答，通常会附上引用。

    RAG的优势：

    - 知识实时更新：无需重新训练模型，只需更新外部数据库即可获得最新信息。

    - 降低幻觉：生成内容受检索到的证据约束，大幅减少胡说八道。

    - 可验证性与可解释性：回答可附带来源链接，便于用户核实。

    - 领域专业化：可以使用专业语料库，将通用模型转化为领域专家。

    - 记忆卸载：将大量事实知识卸载到数据库，模型专注于推理和生成，更加高效。

    RAG已成为部署可靠、可更新、事实性强的AI系统的关键架构范式，广泛应用于企业知识库问答、搜索引擎、医疗法律辅助等场景。


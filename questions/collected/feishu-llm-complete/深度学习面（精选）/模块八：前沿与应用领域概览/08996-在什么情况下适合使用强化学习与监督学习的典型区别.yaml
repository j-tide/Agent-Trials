content:
  prompt: 在什么情况下适合使用强化学习？与监督学习的典型区别。
answer:
  mode: rubric
  reference_answer: |-
    适合使用强化学习的场景：

    - 序列决策问题：当前动作影响未来状态和奖励，如机器人控制、自动驾驶、游戏AI。

    - 缺乏完整标注数据：不知道每个状态下的最优动作，只能获得对动作好坏的评价信号（奖励）。

    - 目标是通过试错与环境交互来实现长期目标：如交易系统优化、冷却系统节能等。

    - 环境可以模拟或交互成本可接受：需要大量试错，通常需要仿真环境（如游戏模拟器、数字孪生）。

    - 需要学习策略：最终产物是一个从状态到动作的映射（策略），而非预测标签。

    与监督学习的典型区别：

    [嵌入表格未展开]

    相互联系：深度强化学习广泛使用了监督学习中的函数近似（深度网络），许多RL算法包含监督学习环节（如 Critic 的更新就是监督式回归）。此外，模仿学习、逆强化学习等结合了监督学习与 RL。


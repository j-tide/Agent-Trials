content:
  prompt: 大模型的幻觉问题有哪些表现形式？如何评估和缓解？
answer:
  mode: rubric
  reference_answer: |-
    幻觉 (Hallucination) 指模型生成的内容与事实不符、与输入上下文矛盾、或逻辑上荒谬。表现形式包括：

    - 事实性幻觉：编造不存在的人物、事件、数据、引用。例如，生成一篇关于某项研究的摘要，但论文实际不存在。

    - 忠实性幻觉：输出偏离用户的输入指令或上下文。例如，要求总结一段文字，却添加了原文没有的信息。

    - 连贯性幻觉：前后矛盾，逻辑混乱，同一回答内自相矛盾。

    - 知识截断：对于训练数据截止后的事件或信息，模型可能错误推测。

    - 过度泛化：将特定领域的知识错误应用到不相关领域。

    评估方法：

    - 人工评价：标注人员判断回答是否包含幻觉、是否事实正确。成本高，主观。

    - 基于自然语言推理 (NLI)：将生成陈述与参考知识库比对，判断是否蕴含（Entailment）或矛盾。

    - TruthfulQA：包含专门设计的问题，测试模型是否模仿人类错误认知。

    - HaluEval / FACTOR 等基准：自动或半自动评估幻觉。

    - 检索增强评估：让模型生成答案时附带引用，然后验证引用是否支持所述内容。

    缓解策略：

    - 检索增强生成 (RAG)：在生成前从外部知识库检索相关文档，作为生成的证据，大幅减少事实错误。

    - 强化学习对齐 (RLHF / DPO)：通过人类偏好数据，让模型学习更谨慎、更诚实，学会说“我不知道”。

    - 事实性微调：在高质量、事实准确的数据上微调，降低模型对模糊知识的依赖。

    - 约束解码：在解码时禁止生成与已知事实相悖的token。

    - 后处理验证：用另一个验证模型检查生成内容，或使用事实验证管线。

    - 提示工程：在系统提示中要求模型“仅基于已知事实回答，不确定时表明不确定性”。

    幻觉是大模型从统计数据中学习而不是真正“理解”世界的内在局限，当前尚无根治方法，需要多层防护。


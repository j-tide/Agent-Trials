content:
  prompt: 强化学习的基本元素：智能体、环境、状态、动作、奖励。什么是马尔可夫决策过程（MDP）？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    强化学习基本元素：

    - 智能体（Agent）：学习者或决策者，通过与环境的交互来学习最优策略。

    - 环境（Environment）：智能体所处的外部世界，对智能体的动作做出反应，并给出新的状态和奖励。

    - 状态（State）：环境在某一时刻的完整描述，包含智能体做出决策所需的所有信息。状态空间可以是离散或连续的。

    - 动作（Action）：智能体可以执行的操作集合。每个动作会引发环境状态的转移。

    - 奖励（Reward）：环境对智能体动作的即时标量反馈，指示该动作的好坏。智能体的目标通常是最大化累积奖励（长期回报）。

    [图片内容未导入]

    MDP 的核心目标：找到一个策略 π:S→A（确定型）或 π(a∣s)（随机型），使得从任何初始状态出发，按照该策略执行动作，所获得的期望累积折扣奖励（称为值函数或状态价值）最大化：

    [图片内容未导入]

    MDP 的假设是环境满足马尔可夫性，这使得最优策略和值函数可以通过 Bellman 方程递归定义和求解。


content:
  prompt: 什么是 RLHF（基于人类反馈的强化学习）？它在 ChatGPT 中的作用。
answer:
  mode: rubric
  reference_answer: |-
    RLHF (Reinforcement Learning from Human Feedback) 是一种将人类偏好注入语言模型训练的范型，用于使模型对齐人类价值观、意图和审美。

    RLHF 的三个阶段：

    - 监督微调 (SFT, Supervised Fine-Tuning)
    收集人类标注的高质量指令-回答对，对预训练语言模型进行微调。这一步让模型初步学会遵循指令，输出格式正确、风格自然的回答。

    - 奖励模型训练 (RM, Reward Model Training)

    [图片内容未导入]

    - 强化学习微调 (RL Fine-Tuning, PPO算法)

    - 使用强化学习对SFT模型进行进一步优化。目标不仅是最大化奖励，还要防止模型过拟合奖励模型或偏离太远。

    [图片内容未导入]

    在 ChatGPT 中的作用：

    - 对齐人类意图：RLHF使ChatGPT能理解并遵循复杂指令，而不是只延续文本。它学会了何时拒绝回答不当请求、承认不知道、纠正错误前提。

    - 提高有用性和安全性：通过人类偏好排序，模型被训练得更加有帮助、更少产生有害输出、更符合社会规范。

    - 改善生成质量：回答变得更详细、条理清晰、减少废话，且能进行多轮对话。

    - 减少幻觉：虽然不能根治幻觉，但通过奖励模型，模型被鼓励生成与事实更一致、更谨慎的回答。

    RLHF是ChatGPT成功的关键技术之一，将大语言模型从“强大的文本续写器”转变为“交互式的、有帮助的AI助手”。


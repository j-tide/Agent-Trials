content:
  prompt: 多模态大模型的指令微调数据如何构造？有哪些关键挑战？
answer:
  mode: rubric
  reference_answer: |-
    多模态大模型（如 LLaVA, InstructBLIP, MiniGPT-4）的指令微调（Instruction Tuning）旨在让模型理解和遵循人类指令，完成复杂的多模态任务，并以对话形式回答。其核心是构造高质量的视觉-语言指令数据。


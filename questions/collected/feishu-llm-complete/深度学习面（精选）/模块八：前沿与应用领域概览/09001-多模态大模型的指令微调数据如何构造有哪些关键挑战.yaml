    - 基于现有数据集转换：

    - 利用 LLM 生成指令数据：

    - 基于真实多模态模型的数据生成：

    - 纯人工编写：

    关键挑战：

    - 幻觉与事实一致性：LLM 生成的回答可能包含图像中不存在的信息，这种噪音被训练后会加剧模型的幻觉。需设计过滤和修正机制。

    - 指令多样性：如何生成足够多样的指令，覆盖不同类型的用户意图（描述、推理、OCR、创意写作等）。

    - 多模态对齐：即使文本生成质量高，若回答与图像的细粒度对齐不足（如指代错误），模型可能学到错误的关联。

    - 长尾概念覆盖：罕见物体、场景的指令数据稀缺，易导致模型在这些情况下表现差。

    - 评价困难：指令微调后的模型评估缺乏可靠的自动指标，通常需要人工评测或 GPT-4 评分，成本高且难以规模化。

    - 多轮对话一致性：构造多轮对话数据，保持上下文连贯且与图像相关，极具挑战。

    趋势：结合自动生成和人工精炼的半自动方式，并引入 RLHF/DPO 等对齐技术，不断提升指令数据的质量和模型的事实准确性。


content:
  prompt: 目标检测中的正负样本不平衡问题是如何解决的？Focal Loss、OHEM。
answer:
  mode: rubric
  reference_answer: |-
    正负样本不平衡：在单阶段检测器中，大部分锚点或位置属于背景（负样本），只有少数包含物体（正样本）。大量易分类的负样本主导了损失梯度，导致模型难以从有意义的正样本中学习，训练效率低下，假阳性高。

    主要解决方法：

    Focal Loss (RetinaNet)：

    - 改进标准交叉熵损失，通过调整因子降低易分类样本的权重，聚焦困难样本。

    - 公式：

    [图片内容未导入]

    OHEM (Online Hard Example Mining)：

    - 用于两阶段检测器。在前向传播后，按损失排序所有ROI，只选择损失最大的那些（如top 70%的困难样本）进行反向传播，忽略易样本。

    - 这样减少了简单负样本的梯度，使训练更有效。

    - 缺点：对噪声敏感，可能采样到异常值。

    其他方法：

    - 重采样：随机过采样正样本或降采样负样本。

    - GHM (Gradient Harmonizing Mechanism)：根据梯度密度协调不同样本的权重。

    - IOU-balanced sampling 等。

    Focal Loss 最为经典，成功使单阶段检测器在精度上超越两阶段，是解决不平衡问题的里程碑。


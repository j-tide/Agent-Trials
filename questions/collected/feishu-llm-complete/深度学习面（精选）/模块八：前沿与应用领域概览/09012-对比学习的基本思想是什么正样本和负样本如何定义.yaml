content:
  prompt: 对比学习的基本思想是什么？正样本和负样本如何定义？
answer:
  mode: rubric
  reference_answer: |-
    对比学习（Contrastive Learning）的核心思想是拉近相似样本（正样本对）的表示，推开不相似样本（负样本对）的表示，使模型学会对语义不变性敏感，同时区分不同实例。

    基本框架

    [图片内容未导入]

    正样本的定义

    正样本是对同一个原始样本进行不同数据增强产生的变体。例如，对一张狗的照片进行随机裁剪、颜色抖动、翻转等操作，得到两个增强视图 x_i 和 x_j，它们构成正样本对。因为它们底层语义完全相同，所以应当具有接近的表示。这是实例级对比学习中的通用做法。

    负样本的定义

    负样本通常为同一批次中其他样本的增强视图。在 SimCLR 中，对于一个批次中的 N 个样本，每张图像被增强两次，得到 2N 个视图。对于某个锚点（一个增强视图），其正样本是来自同一原图的另一个增强视图，而其余 2(N-1) 个视图均为负样本。负样本的多样性对对比学习至关重要，因为它教会模型区分不同实例。

    在其他一些设置中，负样本也可以来自外部存储库（如 MoCo 的队列），而非仅当前批次。

    为什么有效

    当模型能成功区分正负样本时，它就必须捕捉到图像的语义不变特征（因为只有这些特征在增强下保持不变），而忽略增强引入的随机变化。这迫使表示空间具有语义结构性，相似图像聚集，不相似图像远离，从而学到可迁移的表示。


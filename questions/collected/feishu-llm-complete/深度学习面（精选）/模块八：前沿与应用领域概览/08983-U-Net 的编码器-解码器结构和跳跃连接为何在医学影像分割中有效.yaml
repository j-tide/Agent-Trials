content:
  prompt: U-Net 的编码器-解码器结构和跳跃连接为何在医学影像分割中有效？
answer:
  mode: rubric
  reference_answer: |-
    U-Net 是医学影像分割中最经典的架构，其对称U型结构和跳跃连接高度适配医学数据的特点。

    架构：

    - 编码器 (Contracting Path)：类似标准卷积网络，逐步下采样提取高维语义特征，同时降低空间分辨率。

    - 解码器 (Expansive Path)：通过上采样逐步恢复空间分辨率，并与编码器中对应层的特征图进行跳跃连接（拼接后卷积），融合浅层的细粒度位置信息和深层的语义信息。

    - 最终输出与原图同尺寸的分割图。

    为何有效：

    - 医学数据特点：医学图像（如CT、MRI）通常结构固定但边界模糊，目标区域小且类别不平衡。需要同时利用全局上下文（定位器官）和局部细节（精准边界）。

    - 跳跃连接：将编码器的高分辨率特征直接传递到解码器，为分割提供精准的位置信息，使得上采样后的预测能够恢复清晰的边界，这对病灶勾画至关重要。

    - 对称结构：平衡的深度能够充分提取多尺度特征，且参数量适中，不易在小数据集上过拟合。

    - 数据增强与弹性形变：U-Net常配合强大的数据增强（如随机弹性形变），模拟生物组织变形，提高泛化能力。

    - 适应小样本：结构设计紧凑，即使只有少量标注数据也能有效训练。

    U-Net的成功启发了无数变体（3D U-Net、V-Net、Attention U-Net等），至今仍是医学分割的主流基线。


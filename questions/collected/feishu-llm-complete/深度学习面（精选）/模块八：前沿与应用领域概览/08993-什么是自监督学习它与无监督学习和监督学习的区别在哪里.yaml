content:
  prompt: 什么是自监督学习？它与无监督学习和监督学习的区别在哪里？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    自监督学习（Self-Supervised Learning, SSL）是一种无监督学习的特殊范式，其核心思想是利用数据本身的结构自动生成监督信号，从而让模型从大量无标注数据中学习有用的特征表示。

    与监督学习的区别

    - 监督学习依赖人工标注的标签作为监督信号，例如分类任务中的类别、检测任务中的边界框等。训练时需要输入-标签对 (x, y)，模型直接学习从 x 到 y 的映射。

    - 自监督学习没有外部标签，而是通过设计一个前置任务，从输入数据中自动构造伪标签。例如，将图像的一部分遮挡起来，让模型预测被遮挡的部分；或者将图像进行不同的数据增强，让模型判断两个增强视图是否来自同一原始图像。实际上，自监督学习将监督信号从人工标注转移到数据自身的内在结构。

    - 因此，自监督学习仍然使用有监督的损失函数（如交叉熵、对比损失、重建损失），但监督来自数据本身而非人类标注。

    与无监督学习的区别

    - 传统无监督学习主要指聚类、降维、密度估计等，目标是发现数据中的潜在结构，但通常不涉及构造伪标签的前置任务，也不直接产生可用于下游任务的表示。例如，K-means 聚类只是将数据分组，不输出特征表示。

    - 自监督学习属于无监督学习的一种，但它引入了明确的前置任务来学习特征表示，学到的表示可以迁移到下游监督任务中（如分类、检测）。因此，SSL 可以看作是“无监督特征学习”的一种现代形式。

    - 生成式模型如 VAE、GAN 也属于无监督学习，但它们的训练目标不同。VAE 最大化似然，GAN 通过对抗训练；而自监督学习则广泛使用对比学习、掩码预测等判别或重建任务。

    自监督学习的核心

    - 前置任务设计：如何从数据中构造伪标签。包括：上下文预测、旋转预测、拼图、色彩化、对比学习（实例判别）、掩码自编码等。

    - 表示学习：目标不是完美解决前置任务，而是通过解决该任务来强制模型理解数据的语义结构，从而在下游任务中只需少量标注数据即可取得好性能。

    应用价值

    自监督学习在标注稀缺的领域（如医学影像、卫星遥感）具有巨大潜力，因为可以利用海量无标注数据预训练，再在少量标注样本上微调。


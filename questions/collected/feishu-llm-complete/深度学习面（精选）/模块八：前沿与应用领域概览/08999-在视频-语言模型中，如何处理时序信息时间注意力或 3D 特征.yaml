content:
  prompt: 在视频-语言模型中，如何处理时序信息？时间注意力或 3D 特征。
answer:
  mode: rubric
  reference_answer: |-
    视频包含丰富的时序动态，处理时序信息是视频理解的核心挑战。视频-语言模型需要将时序变化的视觉信息与语言描述（可能涉及动作、事件顺序等）对齐。主要方法包括：

    - 3D 卷积特征

    - 使用 3D CNN（如 C3D, I3D, SlowFast）直接从视频片段中提取时空特征。这些网络在空间和时间维度上同时卷积，能够捕捉短时的动作模式和运动信息。

    - 优点：特征包含局部运动线索，计算高效（尤其对于短视频片段）。

    - 缺点：对长时依赖建模能力有限，感受野受限于卷积核的时间长度；无法灵活处理变长视频。

    - 使用方式：通常将 3D 特征作为视觉 token 输入 Transformer，或进行池化后用于对比。

    - 时间注意力机制

    - 使用 Transformer 模型对由帧级特征组成的序列进行时间建模。常见流程：

    [图片内容未导入]

    - 时间注意力变体：

    - 优点：能捕获长距离时间依赖，灵活处理变长视频，与 Transformer 架构天然匹配。

    - 缺点：当视频很长时，复杂度随帧数平方增长，需采用内存高效设计（如记忆压缩、窗口注意力）。

    - 时间特征池化或聚合

    - 对帧级特征进行简单的池化（平均、最大池化）或使用 NetVLAD、NeXtVLAD 等聚合方法，得到一个固定维度的全局视频表示。

    - 适用于检索等不需要细粒度时序定位的任务。

    - 优点：简单快速，可以高效处理任意长度视频。

    - 缺点：丢失了时序顺序和细粒度动态信息。

    - 结构化表示

    - 将视频表示为场景图序列或对象的轨迹，结合图神经网络或序列模型进行推理。这更符号化，适合需要复杂因果推理的任务。

    - 视频-语言预训练中的时序建模

    - 大量视频-语言模型（如 VideoBERT, ClipBERT, Frozen, VIOLET, InternVideo）将文本与帧/片段特征联合训练。通过掩码帧建模、时间对比损失、帧-文本对齐等目标，使模型理解动作、事件和顺序。例如，使用 TCO (Temporal Contrastive Objective) 鼓励相邻片段比远距离片段更相似，或让模型判断视频片段的先后顺序。

    主流趋势：以 Transformer 为基础，结合 3D 编码和时空注意力，利用海量视频文本数据预训练，已成为视频理解的标准范式。对于超长视频，近期工作引入了记忆库、压缩机制和检索增强方法来处理。


content:
  prompt: 为什么对比学习需要大的 batch size 或内存库？有哪些替代方法？
answer:
  mode: rubric
  reference_answer: |-
    对比学习需要大量负样本以提高表示的判别性，这是由 InfoNCE 损失的性质决定的。

    大量负样本的必要性

    - 在理想情况下，InfoNCE 损失需要在极高的概率下将正样本从所有可能的数据点中识别出来，这要求负样本充分覆盖数据分布。

    - 负样本越多，对比任务越接近“在所有实例中识别出正样本”，模型被迫学习高度区分的特征，有利于下游任务。

    - 实验证明，随着负样本数量增加，模型性能单调上升（在一定范围内）。SimCLR 中批次大小从 256 增加到 8192，性能稳步提升。

    SimCLR 的解决方式：极大 batch size

    - 使用很大的批次（如 4096、8192），在批次内提供负样本。这对 GPU 显存和算力要求极高，往往需要 TPU 或大量 GPU 并行。

    MoCo 的解决方式：内存库（队列）

    - 通过队列存储过去的键，将负样本数量与批次大小解耦，仅需较小批次（如 256）即可享受数万负样本，极大降低硬件门槛。

    其他替代方法

    - BYOL / SimSiam 范式：完全放弃负样本，通过不对称网络结构和动量编码器避免坍塌，无需任何大 batch 或内存库。

    - 聚类方法（SwAV）：将对比学习转化为“交换聚类分配”的任务。通过在线聚类生成伪标签，迫使同一图像不同增强视图的聚类分配一致。该方法同样不需要显式的负样本对，而是利用聚类中心作为隐式对比，能高效工作于小批次。

    - 知识蒸馏（如 DINO）：自蒸馏框架，教师网络和学生网络结构相同，通过动量更新，输出中心的软标签进行自我蒸馏，同样无需负样本。

    - 硬负样本挖掘：主动挑选最难的负样本（如通过近似最近邻检索），用少量高质量负样本替代大量随机负样本。

    - 多任务/多视图结合：利用其他前置任务（如旋转预测）增强表示，减少对纯对比损失的依赖。

    发展趋势：从 SimCLR 的大 batch，到 MoCo 的队列，再到 BYOL 的负样本免除，对比学习逐步降低了对硬件的要求，展示了自监督学习的多样设计空间。


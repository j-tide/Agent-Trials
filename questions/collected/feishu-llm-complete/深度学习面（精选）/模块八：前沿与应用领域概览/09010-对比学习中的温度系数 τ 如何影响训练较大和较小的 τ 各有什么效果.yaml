content:
  prompt: 对比学习中的温度系数 τ 如何影响训练？较大和较小的 τ 各有什么效果？
answer:
  mode: rubric
  reference_answer: |-
    温度系数 τ 在对比损失（InfoNCE）中控制 softmax 的锐利度，直接影响模型对正负样本的关注度。

    数学形式

    损失中每个样本的贡献为：

    [图片内容未导入]

    其中 s 为余弦相似度（通常在 [-1, 1] 之间）。

    较小 τ（如 0.1）

    - 使得指数函数差异被急剧放大，softmax 分布变得非常尖锐。

    - 模型会极度关注那些与锚点相似度极高的困难负样本（得分最高的负样本），因为这些负样本对梯度的贡献最大。

    - 优点：能有效挖掘困难负样本，推动特征空间更精细的分离，可能带来更高的下游性能。

    - 缺点：如果 τ 过小，模型对噪声和困难负样本过度敏感，可能把本应属于同一语义的困难正样本也推开，训练不稳定，甚至难以收敛。还需要大量的负样本以避免过度集中。

    较大 τ（如 0.5 或 1.0）

    - softmax 分布更平滑，模型对所有负样本的权重相对均衡。

    - 梯度更多地来自于与全体负样本的对比，而不仅仅是困难负样本。训练更稳定，收敛更容易。

    - 优点：鲁棒，对负样本数量和噪声不敏感，训练初期友好。

    - 缺点：可能不足以区分困难负样本和简单负样本，表示质量可能不是最优，因为模型缺少精细的判别压力。

    选择与调节

    - 典型设置：在 SimCLR、MoCo 中，τ 常设为 0.1~0.2。这个值经过实验调优，平衡了训练稳定性和困难样本挖掘。

    - 如果出现训练不稳定或损失剧烈震荡，可适当增大 τ。

    - 如果下游性能不足，可尝试减小 τ 并配合更多负样本，但需警惕训练崩溃。

    - 温度也可以作为可学习参数，或使用动态调度。

    直观理解：τ 控制的是对负样本的“惩罚力度”。小 τ 意味着只要锚点与负样本有哪怕微小的相似度，也会被严重惩罚，因此模型必须非常清晰地分开它们。这在类别边界附近会导致决策边界更加锐利。


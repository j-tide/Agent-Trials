content:
  prompt: DQN 如何将深度学习与 Q-Learning 结合？经验回放和目标网络的作用。
answer:
  mode: rubric
  reference_answer: |-
    DQN (Deep Q-Network) 由 DeepMind 在 2015 年提出，首次将深度学习成功应用于大规模强化学习问题（玩 Atari 游戏）。它使用深度神经网络来近似动作值函数 Q(s,a;θ)，

    结合方式：

    - 输入状态（如连续的4帧游戏画面），输出每个可能动作的 Q 值（一个输出节点对应一个动作）。

    - 使用 Q-Learning 的更新规则，但通过梯度下降最小化 TD 误差的平方（Huber 损失也常用）

    [图片内容未导入]

    经验回放 (Experience Replay)：

    - 作用：打破数据之间的时序相关性，使训练数据近似独立同分布，这符合随机梯度下降的要求。

    - 实现：智能体每一步的转移 (s,a,r,s′) 被存储到一个固定大小的回放池中。训练时，从池中随机采样小批量数据来更新网络。


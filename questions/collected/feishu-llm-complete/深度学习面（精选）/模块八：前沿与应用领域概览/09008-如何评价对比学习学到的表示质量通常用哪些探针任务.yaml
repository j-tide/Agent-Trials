content:
  prompt: 如何评价对比学习学到的表示质量？通常用哪些探针任务？
answer:
  mode: rubric
  reference_answer: |-
    评估对比学习学到的表示质量需要从多个维度考察：线性可分性、迁移能力、鲁棒性、语义结构等。

    - 线性评估（Linear Evaluation）

    - 冻结预训练编码器，在特征之上训练一个线性分类器（或浅层 MLP）。测试准确率越高，表示质量越好。

    - 这是对比学习中最标准的评估协议（如 ImageNet linear probe），直接反映特征是否包含线性可分的信息。

    - 半监督微调

    - 仅用少量标签数据（如 1%、10% ImageNet）对编码器进行微调，测试分类性能。评估表示在少样本情况下的迁移能力。

    - 迁移学习下游任务

    - 将预训练编码器作为骨干网络，迁移到其他任务：目标检测（VOC、COCO）、语义分割、实例分割等。通常微调整个网络，报告 mAP、mIoU 等。

    - 越好的表示应当在不同任务上都能较快收敛并达到高精度。

    - 探针任务（Probing Tasks）

    - 最近邻检索：给定一张图像，在特征空间中找最近邻，观察是否属于同类。可定量计算检索准确率。

    - 聚类：对特征进行 K-Means 聚类，计算聚类纯度和 NMI（归一化互信息）。

    - 少样本分类（Few-shot）：比如 5-way 1-shot 或 5-way 5-shot，直接衡量特征的小样本判别能力。

    - 细粒度分类：测试在需要精细区分的类别上的表现。

    - 语义相似性：计算图像对特征相似度与人类判断的相关性。

    - 鲁棒性和泛化

    - 在分布外数据集（如 ImageNet-A, ImageNet-R, ImageNet-Sketch）上测试，评估特征的稳健性。

    - 对抗鲁棒性测试。

    - 结构和解耦评估

    - 检查特征空间是否呈现清晰的类别簇（可视化 t-SNE/UMAP）。

    - 评估特征维度是否独立、是否捕获到解耦的生成因子。

    综合来看，一个高质量的自监督表示应该在线性评估、少样本泛化、密集预测任务迁移以及鲁棒性等多个基准上均表现优异。现代对比学习（如 MoCo v3、SimCLR v2）已在这些指标上接近甚至超过有监督预训练。


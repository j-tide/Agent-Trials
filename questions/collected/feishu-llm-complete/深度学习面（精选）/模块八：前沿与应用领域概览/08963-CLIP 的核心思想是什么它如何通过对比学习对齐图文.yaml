content:
  prompt: CLIP 的核心思想是什么？它如何通过对比学习对齐图文？
answer:
  mode: rubric
  reference_answer: |-
    CLIP (Contrastive Language-Image Pre-training) 由 OpenAI 提出，核心思想是利用大规模图文对数据，通过对比学习将图像和文本映射到同一嵌入空间，使得匹配的图文对具有更高的相似度。这完全颠覆了传统视觉模型固定类别标签的有监督训练方式，赋予了模型零样本迁移能力。

    训练方式：

    [图片内容未导入]

    对比损失：

    计算所有可能的 N×N 个图文对之间的余弦相似度，形成一个相似度矩阵。学习目标为最大化正确配对（对角线元素）的相似度，同时最小化错误配对（非对角线元素）的相似度。损失函数采用对称的 InfoNCE 损失：

    [图片内容未导入]

    其中 τ 为可学习的温度参数。通过这个损失，图像和文本编码器被联合优化，从而对齐两种模态。

    为何有效：

    - 大规模数据：海量图文对覆盖了丰富的视觉概念和语言表达，模型学会捕捉广义的视觉语义对应。

    - 自然语言监督：文本提供了远丰富于固定类别标签的监督信号，携带细粒度语义、属性和关系。

    - 对比学习：实例级别的判别任务促使模型学习到高度区分的多模态特征，使同一概念的图文表示靠近，不同概念的表示远离。

    CLIP 训练完成后，可以直接用于零样本分类、跨模态检索等任务，而不需任何特定任务的微调，展现了强大的泛化性。


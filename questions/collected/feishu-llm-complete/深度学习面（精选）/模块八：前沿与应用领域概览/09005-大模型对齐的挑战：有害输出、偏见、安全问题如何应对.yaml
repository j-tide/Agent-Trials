content:
  prompt: 大模型对齐的挑战：有害输出、偏见、安全问题如何应对？
answer:
  mode: rubric
  reference_answer: |-
    对齐挑战：大语言模型（LLM）在预训练阶段从互联网文本中学习，这些数据包含偏见、仇恨言论、虚假信息、隐私等不适宜内容。此外，模型强大的生成能力可能被滥用生成有害内容。对齐旨在使模型的行为符合人类价值观、法律和伦理规范。

    主要挑战与应对：

    - 有害输出（Toxic, Harmful Content）

    - 表现：生成暴力、色情、歧视性言论，或协助非法活动（如制造武器、黑客攻击）。

    - 应对：

    - 社会偏见（Social Bias）

    - 表现：在性别、种族、宗教、职业等方面表现出刻板印象或歧视。例如，将“护士”默认与女性关联，或将某些族裔与负面特质关联。

    - 应对：

    - 安全问题（Safety, Misuse）

    - 表现：生成钓鱼邮件、虚假信息（Disinformation）、诱导自我伤害、泄露训练数据中的隐私等。

    - 应对：

    - 过度依赖与欺骗性

    - 模型可能表现出过度自信的权威语气，用户容易过度信任其错误建议。

    - 通过校准不确定性、训练模型承认未知、提供引用来源等来缓解。

    大模型对齐是一个持续的、动态的过程，需要技术手段、政策法规和行业自律的结合，没有一劳永逸的方案。


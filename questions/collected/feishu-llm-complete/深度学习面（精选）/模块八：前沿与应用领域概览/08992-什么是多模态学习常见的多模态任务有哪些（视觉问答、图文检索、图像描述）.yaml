content:
  prompt: 什么是多模态学习？常见的多模态任务有哪些？（视觉问答、图文检索、图像描述）
answer:
  mode: rubric
  reference_answer: |-
    多模态学习是指让机器学习模型同时理解和处理来自多种感知模态的信息，例如视觉（图像、视频）、语言（文本）、语音、触觉等，并学习这些模态之间的关联、对齐和互补，以实现更全面、更鲁棒的智能。人类天生是多模态的——我们结合看到的、听到的、读到的信息来理解世界；多模态学习的目标是让机器具备类似的跨模态感知和推理能力。

    核心挑战：

    - 模态异质性：不同模态的数据结构和统计特性差异巨大，图像是像素网格，文本是离散符号序列，语音是连续波形，如何将它们映射到统一的表示空间是核心难题。

    - 对齐与对应：不同模态的信息往往具有细粒度的对应关系，比如图像中的某个区域对应描述中的某个词，视频片段对应语音内容，需要学习这种跨模态对齐。

    - 融合与推理：如何有效地融合多模态信息，并在融合的基础上进行推理（如回答涉及视觉和文本的问题）。

    - 缺失模态与噪声：在真实场景中，某些模态可能缺失或存在噪声，模型需要具备鲁棒处理能力。

    - 大规模数据：多模态数据通常需要大规模的训练语料才能学到有效的联合表示，数据收集和清洗成本高。

    常见多模态任务：

    - 视觉问答（Visual Question Answering, VQA）：给定一张图像和一个关于该图像的自然语言问题，模型需要生成正确的答案。例如，图像中有一群人在公园里，问“有多少人？”，模型需要输出“5”。这要求模型理解图像内容、问题语义，并进行跨模态推理（计数、比较、逻辑推断等）。典型数据集：VQA v2, GQA, OK-VQA（需要外部知识）。

    - 图文检索（Image-Text Retrieval）：包含两个子任务：以文搜图（给定文本描述，检索相关图像）和以图搜文（给定图像，检索相关描述）。常用于搜索引擎、版权保护等。模型需要将图像和文本映射到同一嵌入空间，使得匹配对的相似度高于非匹配对。典型数据集：Flickr30k, MS-COCO。

    - 图像描述（Image Captioning）：给定一张图像，自动生成描述图像内容的自然语言句子。需要理解图像中的对象、属性、动作以及它们之间的关系，并将其转化为通顺、准确的语言。典型数据集：MS-COCO Captions, nocaps。评价指标：BLEU, METEOR, CIDEr, SPICE。

    - 文本到图像生成（Text-to-Image Generation）：给定一段文本描述，生成符合描述的逼真图像。这是近年来的热门任务，代表性模型有 DALL·E 2, Stable Diffusion, Imagen 等。需要将文本语义映射到视觉像素空间，并保证生成图像的质量和一致性。

    - 视频-语言任务：

    - 视频问答（Video QA）：与 VQA 类似，但输入为视频。

    - 视频描述（Video Captioning）：为视频生成文本描述。

    - 视频文本检索（Video-Text Retrieval）：根据文本检索视频或根据视频检索文本。

    - 时序动作定位（Temporal Action Localization）：根据文本查询定位视频中的相应片段。

    - 多模态情感分析：结合文本、语音、面部表情等多模态信号分析用户情感，广泛应用于人机交互、心理健康评估。

    - 跨模态推理与导航：如具身智能中的视觉-语言导航（VLN），机器人根据语言指令在环境中移动。

    - 文档理解与OCR信息抽取：结合图像（扫描文档）、文本（OCR结果）和布局信息，进行关键信息抽取。

    - 多模态预训练：在大规模图文、视频文本数据上预训练通用基础模型，然后微调到各类下游任务，如 ViLBERT, UNITER, CLIP, ALBEF, BLIP 系列。

    多模态学习正从单任务走向通用多模态基础模型，其目标是建立一个能够同时理解、推理和生成多种模态内容的统一系统。


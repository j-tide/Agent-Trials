  reference_answer: |-
    [图片内容未导入]

    核心思想与流程

    两阶段检测器：

    将检测任务分解为两个顺序阶段——

    - 区域提议 (Region Proposal)：生成可能包含物体的候选区域，通常由区域提议网络（RPN）或选择性搜索（Selective Search）完成。

    - 区域分类与精修 (Classification & Refinement)：对每个候选区域进行特征提取，判断其类别，并对边界框进行精细回归。
    代表：Faster R-CNN、Mask R-CNN、Cascade R-CNN。

    单阶段检测器：

    直接在特征图的每个空间位置上，一次性预测物体的类别和边界框偏移，无需独立的提议阶段。

    代表：YOLO系列、SSD、RetinaNet、FCOS。

    核心区别：

    [嵌入表格未展开]

    优缺点深度分析：

    - 两阶段优势：ROI级别的特征对齐和二次分类回归能够更精确地定位，尤其对重叠目标和高IoU阈值下的评估有利。区域提议阶段的采样策略（如RPN的正负样本1:1）有效缓解了正负样本极端不平衡。

    - 两阶段劣势：ROI处理（ROI Pooling/Align）需要额外计算，导致推理速度慢，难以达到实时。训练过程中两阶段联合优化也相对复杂。

    - 单阶段优势：结构简单，端到端优化，推理速度快，适合实时应用。

    - 单阶段劣势：早期版本（如YOLOv1、SSD）由于没有精细的区域提议，直接回归边界框导致定位精度较差。极端的正负样本不平衡使得训练困难，容易产生大量假阳性。后来Focal Loss等解决了该问题，使得单阶段检测器精度追平甚至超越两阶段方法。

    现状：随着Anchor-Free和Transformer检测器（如DETR）的兴起，阶段划分逐渐模糊。但经典的两阶段和单阶段设计思想仍是检测领域的重要基础。


content:
  prompt: 思维链（Chain-of-Thought）提示如何增强模型推理能力？
answer:
  mode: rubric
  reference_answer: |-
    思维链 (Chain-of-Thought, CoT) 是一种提示方法，通过让模型在生成最终答案之前，显式地生成中间的推理步骤，从而显著提升复杂推理任务的准确率。

    工作原理：

    - 传统提示直接要求模型输出答案，对于需要多步推理的问题（如数学应用题、常识推理、符号推理），模型容易出错。

    - CoT 在提示中提供示例时，不仅给出最终答案，还给出详细的分步推理过程。例如：

    ```text
    Q: 罗杰有5个网球。他又买了2罐网球，每罐3个。他现在有多少个网球？
    A: 罗杰一开始有5个球。2罐网球每罐3个，共6个球。5+6=11。答案是11。
    ```

    - 模型在回答新问题时，会模仿这种模式，自动输出推理步骤，然后给出最终答案。这个过程被称为“思考链”。

    为何增强推理：

    - 分解复杂问题：将复杂问题分解为一系列简单子问题，逐步求解，降低了认知负荷。

    - 提供可解释性：用户可以看到模型的推理过程，便于检验和信任。

    - 引导模型计算：对于数学问题，CoT 让模型有机会显示中间计算结果，避免“跳步”导致的错误。

    - 激发涌现能力：大模型在配合CoT时展现出小模型没有的复杂推理能力，可以说CoT是解锁涌现能力的一把钥匙。

    变体：

    - 零样本CoT：不提供示例，仅添加“让我们一步步思考”这样的提示，也能激发模型推理。

    - 自一致性 (Self-Consistency)：多次采样生成多个CoT回答，然后取出现频率最高的最终答案，进一步提升鲁棒性。

    - 思维树 (Tree-of-Thoughts)：不只生成一条思维链，而是探索多条推理路径，评估并回溯，实现更系统的探索。

    CoT简单而有效，已成为提升大模型推理性能的标准技巧，广泛应用于数学、代码、规划等领域。


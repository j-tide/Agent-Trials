content:
  prompt: 缩放定律（Scaling Law）揭示了模型性能与参数、数据、计算量之间的什么关系？
answer:
  mode: rubric
  reference_answer: |-
    缩放定律 (Scaling Laws) 是由OpenAI、DeepMind等发现的关于大模型性能随规模提升的经验规律，主要描述了模型测试损失（loss） 与参数量 (N)、训练数据量 (D)、计算量 (C) 之间的幂律关系。

    经典关系（以Kaplan et al., 2020为代表）：

    [图片内容未导入]

    这些指数 α 通常为正数，意味着随着资源投入，loss 以幂律形式持续降低（但边际收益递减）。重要结论：

    - 计算最优分配：在给定计算预算下，参数与数据量应同比例增长（如增加一倍参数应配合增加一倍数据），否则会存在“欠训练”或“过参数化”。

    - 超越幂律的可能：当模型极大时，有观察表明某些任务性能可能出现相变式飞跃（涌现），但整体损失仍遵循幂律。

    Chinchilla 缩放定律 (Hoffmann et al., 2022)：

    DeepMind的Chinchilla更精确地指出，之前的许多大模型（如GPT-3）是训练不足的。在固定计算预算下，最优的参数与数据量应大致相等（token数 ≈ 20倍参数量）。例如，70B参数的模型应在约1.4T tokens上训练。这一发现促使后续模型（如LLaMA）采用更多数据来训练较小参数的模型，以取得更佳性价比。

    揭示的关系：

    - 性能可预测性：在训练早期，可以通过较小规模的实验外推预测大模型在更大资源下的最终性能，指导资源规划。

    - 资源瓶颈：揭示了要实现特定性能，所需的计算资源和数据量级，推动更大规模基础设施的建设。

    - 数据为王：Chinchilla强调，高质量的数据量比单纯增加参数更重要，引发了数据筛选和合成数据的浪潮。

    缩放定律是驱动基础模型规模不断扩大的理论基础，也为高效分配资源提供了指导。


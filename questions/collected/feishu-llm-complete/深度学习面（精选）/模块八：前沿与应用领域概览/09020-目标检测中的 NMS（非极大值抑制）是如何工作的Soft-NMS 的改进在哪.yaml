content:
  prompt: 目标检测中的 NMS（非极大值抑制）是如何工作的？Soft-NMS 的改进在哪？
answer:
  mode: rubric
  reference_answer: |-
    NMS (Non-Maximum Suppression) 用于消除同一目标上的重复检测框，保留最佳的一个。

    传统NMS流程：

    - 对于每个类别，按置信度得分从高到低排序所有预测框。

    - 选中得分最高的框 M，将其从列表移除并加入输出集。

    - 计算剩余框与 M 的 IoU。若 IoU 大于阈值（如0.5），则认为它们与 M 检测的是同一物体，将其得分置零（即抑制）。

    - 重复步骤2-3，直到列表为空。

    缺点：

    - 硬阈值：当阈值设置不当，可能误删正确检测到的相邻物体（如密集人群），造成漏检。

    - 对得分高的框直接保留，得分低的相邻框直接删除，无法利用得分信息进行软决策。

    Soft-NMS (Bodla et al., 2017)：

    - 核心思想：不是直接删除与 M 高重叠的框，而是衰减其得分，衰减程度随 IoU 增大而增大。

    - 两种衰减函数：

    - 这样，与 M 高度重叠但可能属于另一个邻近物体的框，其得分降低但不会被完全清除，在后续迭代中仍有机会作为正确检测被选出（如果其得分仍高于阈值）。

    - 不需要重新训练模型，即插即用，在密集场景下显著提升召回率。

    - 改进效果：在COCO等数据集上提升约1% AP，尤其是对重叠物体。

    后续发展：如 Adaptive NMS、Learnable NMS、CenterNet 的 max pooling 替代 NMS 等，继续优化后处理。


content:
  prompt: YOLO 系列如何实现“只看一次”的检测？从 YOLOv1 到 YOLOv8 有哪些关键演进？
answer:
  mode: rubric
  reference_answer: |-
    YOLO的基本思想：将检测视为回归问题，直接从图像像素预测边界框和类别。单个卷积网络同时预测多个边界框及其类别概率，真正实现端到端、单次前向传播的检测，无需区域提议。

    YOLOv1 (2016)：

    - 将输入图像划分为 S×S 网格（7×7）。每个网格预测 B 个边界框（B=2）及其置信度，以及 C 类条件概率。

    - 边界框预测相对于网格中心的偏移，宽高相对于整张图。

    - 损失函数结合坐标误差、置信度误差和分类误差。

    - 缺点：每个网格只能预测一个类别，对密集小目标和群体目标检测差，定位精度低。

    YOLOv2/YOLO9000 (2017)：

    - 引入Batch Normalization，提高收敛和正则化。

    - 使用锚点（先验框），通过K-means聚类得到更好的先验尺寸，改为预测相对锚点的偏移。

    - 多尺度训练、细粒度特征（跳过连接）、高分辨率分类器。

    - 提出联合训练目标检测和分类数据集的方法。

    YOLOv3 (2018)：

    - 使用Darknet-53骨干网络，融合残差连接。

    - 多尺度特征图预测：在三个不同尺度的特征图上独立预测，类似FPN，显著提升小目标检测。

    - 用逻辑回归替代softmax做类别预测，支持多标签（如“人”和“男人”）。

    YOLOv4 (2020)：

    - 集成了大量Bag of Freebies和Bag of Specials：Mish激活函数、CSPDarknet53骨干、PANet特征融合、CIoU损失、CmBN、自对抗训练、马赛克数据增强等。速度和精度的极致平衡。

    YOLOv5 (2020，Glenn Jocher)：

    - 工程化优化，PyTorch实现，提供多种尺寸（n/s/m/l/x）。引入自适应锚框计算、自动混合精度训练等。

    YOLOv6/YOLOv7/YOLOv8 系列继续优化：

    - YOLOv7 (2022)：E-ELAN高效聚合网络、模型缩放、辅助头训练等，性能卓越。

    - YOLOv8 (2023)：由Ultralytics发布，anchor-free设计，解耦头（分类和回归分支分离），正负样本分配策略TaskAlignedAssigner等，提供全面的SOTA性能和易用性。

    关键演进总结：

    从v1的网格回归到v2的锚点，到v3的多尺度，到v4/v5的工程化极值，再到v7/v8的架构革新（如anchor-free），YOLO系列不断提升精度、速度和易用性，成为工业界最主流的检测框架之一。


content:
  prompt: DeepLab 系列如何利用空洞卷积和空间金字塔池化（ASPP）获取多尺度上下文？
answer:
  mode: rubric
  reference_answer: |-
    DeepLab系列（v1, v2, v3, v3+）逐步改进，重点解决语义分割中的多尺度上下文聚合问题。

    空洞卷积 (Atrous/Dilated Convolution)：

    - 在卷积核元素间插入零（空洞），在不增加参数和不损失分辨率的情况下指数级扩大感受野。

    - 空洞率 (dilation rate) r 控制采样步幅。r=1为标准卷积；r=2时，3×3卷积的感受野相当于5×5。

    - DeepLab v1/v2 使用空洞卷积保持特征图分辨率，避免下采样导致的位置信息丢失。

    ASPP (Atrous Spatial Pyramid Pooling)：

    - 由DeepLab v2提出，并行采用不同空洞率的空洞卷积对同一特征图进行采样，以捕获不同尺度的上下文。

    - 典型配置：多个3×3卷积，空洞率分别为6, 12, 18, 24（或类似组合），加上一个1×1卷积分支，和一个全局平均池化分支（v3加入）。

    - 所有分支输出拼接后通过1×1卷积融合，使每个像素的表示包含多尺度信息。

    DeepLab v3：

    - 改进了ASPP，加入了图像级特征（全局平均池化），提供全局上下文。

    - 串行和并行空洞卷积模块组合。

    DeepLab v3+：

    - 添加了一个简单但有效的解码器模块，将ASPP输出的高层特征图上采样并与骨干网络的浅层特征融合，恢复目标边界细节，显著提升分割精度，尤其沿边界。

    整体工作流程：

    - 骨干网络（如ResNet）提取特征，利用空洞卷积保持8x下采样的高分辨率特征图。

    - 该特征图送入ASPP模块捕获多尺度上下文。

    - 输出通过1×1卷积得到类别得分图。

    - 在v3+中，此得分图上采样并与低层特征融合后再上采样到原图大小。

    效果：ASPP让模型能够有效处理不同大小的物体，空洞卷积保持了位置精度，DeepLab系列长期占据语义分割的最优性能。


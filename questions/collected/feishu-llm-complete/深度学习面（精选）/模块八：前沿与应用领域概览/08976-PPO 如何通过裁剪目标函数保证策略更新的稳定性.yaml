content:
  prompt: PPO 如何通过裁剪目标函数保证策略更新的稳定性？
answer:
  mode: rubric
  reference_answer: |-
    PPO (Proximal Policy Optimization) 由 Schulman 等人在 2017 年提出，旨在解决策略梯度步长难以确定的问题，保持策略更新的稳定和高效。

    核心挑战：普通的策略梯度更新可能迈出过大一步，导致策略剧烈变化，从而毁坏训练（“悬崖式”崩溃）。TRUST REGION 方法（如TRPO）通过约束KL散度来解决，但计算复杂。PPO 提供了一个更简单但同样有效的方案。

    PPO 的目标函数（Clipped Surrogate Objective）：

    [图片内容未导入]

    - 这里取了裁剪后目标和未裁剪目标的最小值。

    [图片内容未导入]

    - 这确保策略更新不会让概率比偏离1太远，相当于隐式地约束了新旧策略间的KL散度。

    为何稳定：

    - 防止过大的单步策略更新，避免了策略崩溃。

    - 目标函数连续且可微，易于用标准优化器（如Adam）进行多轮小批量更新。

    - 实现简单，仅需在损失函数中加入裁剪，无需二阶优化。

    PPO 因为其简单性和鲁棒性，已成为连续控制和许多任务中的首选强化学习算法。


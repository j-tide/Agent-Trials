content:
  prompt: 在视觉领域中，掩码自编码器（MAE）如何工作？它与对比学习有何不同？
answer:
  mode: rubric
  reference_answer: |-
    MAE（Masked Autoencoders） 是一种生成式自监督学习方法，核心思想是随机遮盖图像的大部分区域，让模型预测被遮盖的像素。

    工作原理

    - 掩码：将输入图像分成不重叠的 patches（如 ViT 的做法），随机抽取一小部分（如 25%）的 patches 作为可见的，其余 75% 被掩码掉。

    - 编码器：仅处理那些可见的 patches（加上位置编码）。由于只处理少量 patches，编码器计算非常高效。输出可见 patches 的编码特征。

    - 解码器：接收编码器输出的特征以及掩码令牌（共享的可学习向量，代表被遮盖的位置），加上位置编码，输入一个更浅的 Transformer 解码器，解码器重建完整图像的所有 patches，通过像素级的 MSE 损失监督，但仅计算被掩码部分的损失。

    - 目标：让模型学会从少部分可见内容推理出被遮挡的内容，从而理解图像的语义和结构。

    与对比学习的根本不同

    - 训练范式：对比学习是判别式的，学习区分不同实例；MAE 是生成式的，学习重建被破坏的数据。

    - 正负样本：对比学习需要构造正负样本对，MAE 不需要正负样本，完全基于重建。

    - 数据增强：对比学习高度依赖数据增强来产生正样本；MAE 仅需掩码操作，数据增强相对次要。

    - 模型结构：对比学习通常使用卷积网络+投影头；MAE 天然适合 Vision Transformer 结构。

    - 下游任务：对比学习学到的特征对分类、检测等判别任务非常有效；MAE 学到的特征对像素级重建和下游微调也表现优异，尤其在 ViT 架构上大幅超越对比方法。

    - 计算效率：MAE 的编码器仅处理少量 patches，预训练非常快。

    特点：MAE 证明了一个简单的掩码重建任务就能学到强大的视觉表示，而且由于极高的掩码率，训练效率极高。它推动了自监督学习从对比范式向掩码预测范式的转变。


content:
  prompt: 如何评估目标检测器？mAP 的计算、IoU 阈值设定。
answer:
  mode: rubric
  reference_answer: |-
    目标检测的核心评价指标是mAP (mean Average Precision)。它综合了分类准确率和定位精度。

    关键概念：

    - IoU (Intersection over Union)：预测框与真实框的交集面积除以并集面积。用于判断检测是否正确。通常设置IoU阈值（如0.5, 0.75，或0.5:0.95范围），IoU ≥ 阈值视为真正例（TP），否则为假正例（FP）。未检测到的真实框为假负例（FN）。

    - Precision-Recall 曲线：按置信度降序排列所有预测框，每增加一个预测框，计算当前累积的精确率和召回率，绘制曲线。

    - Average Precision (AP)：PR曲线下的面积，或通过11点插值（VOC）或积分方式（COCO计算101点插值）得到。AP衡量单个类别的检测性能。

    - mAP：所有类别的AP的平均值。COCO使用多个IoU阈值（0.5到0.95，步长0.05）计算mAP，记为 mAP@[.50:.95]，更严格地评估定位精度。

    COCO评价指标详解：

    [图片内容未导入]

    计算步骤：

    - 收集所有测试图像的预测框（置信度、类别、坐标）和真实框。

    - 对每个类别，将所有预测框按置信度排序，并逐一匹配真实框（选择IoU最高且超过阈值的，且该真实框之前未被匹配）。

    - 计算累积TP、FP，得到PR曲线。

    - 计算PR曲线下面积得到该类AP。

    - 对所有类别AP取平均得到mAP。

    其他指标：FPS（推理速度）、模型大小等用于实际部署。


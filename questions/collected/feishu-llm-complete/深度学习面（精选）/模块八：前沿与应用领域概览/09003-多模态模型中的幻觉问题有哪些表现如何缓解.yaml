content:
  prompt: 多模态模型中的“幻觉”问题有哪些表现？如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    多模态幻觉（Hallucination）指模型生成的文本描述或回答中包含与输入视觉内容不一致、矛盾或虚构的信息。这是当前多模态大模型面临的重大挑战，严重影响其可信度和实用性。

    主要表现：

    - 对象幻觉 (Object Hallucination)：描述中提到了图像中不存在的物体。例如，对一张只有猫的图像，生成“一个女人抱着一只猫”。这是最常见和广泛研究的幻觉类型。

    - 属性幻觉 (Attribute Hallucination)：错误描述物体的颜色、大小、形状、材质等属性。例如，“红色的汽车”实际是蓝色的。

    - 关系幻觉 (Relational Hallucination)：错误描述物体之间的空间或语义关系。例如，“狗在桌子上”但实际狗在桌子下。

    - 数量幻觉 (Count Hallucination)：错误报告物体的数量。例如，“三个人”实际有四人。

    - 文本延续幻觉：在生成描述时，模型可能根据语言先验“自由发挥”，例如看到“一个人在切”就自动补充“蔬菜”，而图像中可能在切水果。

    - 知识引入幻觉：模型在回答问题时，融入了其参数化知识库中的信息，但这些信息与当前图像无关。例如，问图中是否有某名人的特定动作，模型可能仅根据训练文本中的名人信息作答，忽略实际图像。

    缓解策略：

    数据层面：

    - 构建高质量、无偏的图文数据集，减少训练数据中的错误对应。

    - 使用专门设计的负样本数据，如构造包含冲突描述的数据进行训练，使模型学会鉴别。

    模型架构与训练：

    - 增强视觉编码：使用更高分辨率的图像输入、更强大的视觉编码器（如 ViT-G/14），提供更丰富的视觉特征。

    - 细粒度对齐：在 token 或 patch 级别进行更精细的对比学习或注意力引导，例如引入目标检测或分割特征来强化对象表征。

    - 指令微调与 RLHF：使用指令微调数据，让模型学会“根据图像回答，不知道就说不知道”。通过人类反馈强化学习（RLHF）惩罚幻觉输出。

    - 解码策略优化：

    - 后处理纠正：利用外部工具或模型进行事实核查。例如，训练一个对象检测器，将生成的描述与检测结果比对，自动过滤或修正不一致的内容。

    评价基准：

    - CHAIR (Caption Hallucination Assessment with Image Relevance)：测量图像描述中幻觉对象的比例。

    - POPE (Polling-based Object Probing Evaluation)：通过构造简单问题询问对象是否存在，评估模型的幻觉率。

    - AMBER：多维度幻觉评估基准。

    多模态幻觉的完全消除仍然是一个开放研究问题，需要从数据、模型、推理等多方面综合发力。


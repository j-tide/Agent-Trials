content:
  prompt: 什么是全景分割？它如何结合语义分割和实例分割？
answer:
  mode: rubric
  reference_answer: |-
    全景分割 (Panoptic Segmentation) 由Kirillov等人提出，旨在统一语义分割和实例分割，为图像中每一个像素分配一个语义标签和一个实例ID。

    - 语义分割：将“stuff”类（无固定形状的背景区域，如天空、道路、草地）标注为类别，不区分个体。

    - 实例分割：将“thing”类（可数物体，如人、车、动物）标注出每个实例，赋予不同ID。

    - 全景分割：同时处理stuff和things，预测每个像素属于哪个语义类别，并且对于thing类，还要区分是哪个实例。输出是一张全景图，每个像素值编码了语义和实例信息。

    任务要求：

    - 每个像素必须有唯一的语义标签和唯一的实例ID（stuff类实例ID忽略）。

    - 同一个thing实例的所有像素必须具有相同的语义和ID。

    - 不同实例不能重叠。

    评价指标：PQ (Panoptic Quality)：

    [图片内容未导入]

    其中TP是预测段和真实段匹配且IoU>0.5的对，FP是未匹配的预测段，FN是未匹配的真实段。PQ乘性结合了分割质量（IoU）和检测质量（识别召回与精度）。PQ可以分解为 PQ=SQ×RQ，SQ为匹配段的平均IoU，RQ为识别质量（F1-score）。

    代表性方法：Panoptic FPN、UPSNet、Mask2Former等。通常基于FPN，添加语义分割头和实例分割头，通过融合策略合并结果。全景分割统一了两个任务，为全面场景理解提供了基准。


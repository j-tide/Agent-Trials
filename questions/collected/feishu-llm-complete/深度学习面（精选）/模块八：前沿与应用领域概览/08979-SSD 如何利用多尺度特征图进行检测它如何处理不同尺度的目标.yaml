content:
  prompt: SSD 如何利用多尺度特征图进行检测？它如何处理不同尺度的目标？
answer:
  mode: rubric
  reference_answer: |-
    SSD (Single Shot MultiBox Detector) 的核心创新是在多个不同分辨率的特征图上同时进行检测，以处理不同尺度的目标。

    多尺度特征图：

    - SSD使用VGG16作为骨干，并添加额外的卷积层，产生6个尺寸递减的特征图（如38×38, 19×19, 10×10, 5×5, 3×3, 1×1）。

    - 高分辨率浅层特征图（如38×38）感受野小，适合检测小目标；低分辨率深层特征图（如1×1）感受野大，适合检测大目标。

    - 每个特征图的每个空间位置，预测固定数量的边界框（default boxes），这些框具有不同的尺度和长宽比。

    Default Boxes（先验框）：

    - 对于每个特征图位置，根据预定义的尺度和长宽比生成多个 default boxes。尺度随特征图层数线性增加，从最小的 sminsmin 到最大的 smaxsmax。

    - 每个 default box 负责预测类别得分和4个坐标偏移。

    - 这种设计使得不同层天然负责不同尺寸的目标，无需额外的特征金字塔（后来FPN对其进行了改进）。

    如何处理不同尺度目标：

    - 小目标由浅层大特征图检测，因为其空间分辨率高，保留了更多细节；大目标由深层小特征图检测，因为其语义信息强、感受野大。

    - 训练时，通过匹配策略将真实框分配到与其IoU最大的 default box，通常是多个层的多个框，使得每个目标都有足够多的正样本。

    优缺点：

    - 优点：单阶段，速度快；多尺度预测提高了多尺度目标的覆盖。

    - 缺点：小目标检测仍较差，因为浅层特征语义不足；需要手工设计 default box 尺度和长宽比，对参数敏感。后来FPN的加入（如DSSD）显著提升了SSD的性能。

    SSD是多尺度检测的早期实践者，启发了后续FPN等方法在单阶段检测中的应用。


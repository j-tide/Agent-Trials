content:
  prompt: 小目标检测的难点是什么？FPN 如何帮助解决？
answer:
  mode: rubric
  reference_answer: |-
    小目标检测难点：

    - 分辨率低：小目标在图像中占据像素少，经过多次下采样后，在深层特征图上可能只剩1-2个点甚至消失，特征信息极度匮乏。

    - 特征表达能力弱：浅层大尺度特征图虽然保留细节，但语义信息不足，难以区分物体和背景噪声。

    - 上下文缺失：小目标本身信息有限，更依赖周围上下文来辅助判断。

    - 样本不平衡：训练集中小目标占比少，锚点匹配困难，正样本少，模型偏向大目标。

    - 定位精度要求高：对小框的微小偏移会导致IoU下降巨大，对检测器回归能力要求高。

    FPN (Feature Pyramid Network) 如何解决：

    FPN构建了一个特征金字塔，将深层高语义特征上采样并与浅层高分辨率特征横向连接，融合生成具有强语义且高分辨率的特征图。

    - 多尺度特征融合：深层特征通过上采样与对应浅层特征相加，使浅层特征获得更丰富的语义信息，从而能够更准确地检测小目标。

    - 分层预测：在金字塔的每一层独立进行预测（类似SSD但融合了高语义），使得小目标在较大的特征图（如P2）上检测，大目标在较小特征图（如P5）检测，自然分配多尺度目标。

    - 缓解感受野矛盾：融合后，浅层特征既保持细节又有充足语义，小目标定位更准，也减少了背景误检。

    - 实验证明，FPN大幅提升了小目标AP（如COCO上小目标AP可提升数个百分点）。

    FPN已成为现代检测器不可或缺的组件。


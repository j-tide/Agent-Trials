content:
  prompt: SimCLR 的框架是怎样的？它使用了哪些关键组件（数据增强、投影头、对比损失）？
answer:
  mode: rubric
  reference_answer: |-
    SimCLR（Simple Framework for Contrastive Learning of Visual Representations）是极具影响力的对比学习框架，其结构简洁但效果卓越。

    整体架构

    - 数据增强模块：对每张输入图像 x，随机应用两次数据增强变换 t 和 t'，生成两个视图 x_i 和 x_j。增强策略包括随机裁剪、颜色抖动、高斯模糊、随机翻转等。研究发现，组合多种增强方式对性能至关重要，特别是颜色失真和裁剪组合。

    - 编码器：通常为 ResNet 等卷积网络，将增强后的图像编码为特征向量 h_i = f(x_i)。该特征向量是全局平均池化后的表示。

    - 投影头：一个非线性小型 MLP（两层，有 ReLU），将编码器输出 h_i 映射到更小维度空间 z_i = g(h_i)。实验发现投影头对性能提升极为重要，对比损失施加在 z 空间，而下游任务使用编码器输出 h。

    - 对比损失：在批次内，对于每个锚点 z_i，其正样本为来自同一原图的另一个视图 z_j，其余 2(N-1) 个视图作为负样本。使用 NT-Xent（归一化温度缩放交叉熵）损失：

    [图片内容未导入]

    相似度 sim 为余弦相似度。总损失是所有正样本对的损失之和。

    关键组件详解

    - 数据增强：SimCLR 系统研究了增强组合，发现随机裁剪和颜色失真是最关键的组合。无增强或增强太弱时，模型容易依赖低层次颜色统计量来作弊，得不到好表示。

    - 投影头：使用一个2层 MLP 将表示从 h 映射到 z 进行对比，而下游任务用 h。实验表明，投影头有助于移除对比学习中的无关信息（例如增强相关的扭曲），保护 h 中的语义信息。去掉投影头或用线性投影都会显著下降性能。

    - 大的批次大小：SimCLR 极度依赖大批次（如 4096 或更大），以提供足够多的负样本。批次越小，负样本多样性不足，性能下降。因此 SimCLR 需要大量 GPU 内存或使用梯度累积。

    - 温度 τ：通常设为 0.1 左右，控制 softmax 的锐度，调节对难负样本的关注度。

    SimCLR 证明了简单的对比框架配合强大的数据增强即可达到与有监督预训练相媲美的性能，推动了自监督视觉学习的发展。


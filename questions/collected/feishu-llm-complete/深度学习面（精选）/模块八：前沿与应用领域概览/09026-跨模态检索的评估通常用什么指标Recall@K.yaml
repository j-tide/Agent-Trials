content:
  prompt: 跨模态检索的评估通常用什么指标？Recall@K。
answer:
  mode: rubric
  reference_answer: |-
    跨模态检索（如图文检索、视频文检索）的核心任务是给定一个模态的查询（如一段文字），从另一个模态的数据库中检索出与之匹配的候选项（如图片）。由于检索系统返回一个排序列表，最常用的评估指标是Recall@K及其变体。

    Recall@K (R@K)

    定义为在返回的前 K 个候选项中，包含至少一个正确匹配的概率（或比例）。通常报告 K=1, 5, 10。

    [图片内容未导入]

    例如，R@1 衡量首个结果即命中的比例，反映系统的精确推荐能力；R@10 反映系统在较宽松条件下的查全能力。在跨模态检索中，通常分别报告“图像检索文本”（Image-to-Text R@K）和“文本检索图像”（Text-to-Image R@K），以及它们的平均或总和（有时称作 R@sum，即将所有 R@1, R@5, R@10 加起来作为总体指标）。

    其他相关指标：

    - 中位秩 (Median Rank)：正确结果在排序列表中位置的中位数，越低越好。

    - 平均倒数秩 (MRR)：所有查询的倒数秩的平均值。只关心第一个正确匹配的位置。

    - Precision@K：前 K 个结果中相关项的比例。在检索中不如 Recall@K 常用，因为通常只有一个或少数几个正确项。

    - nDCG：当检索结果有多个相关等级（如非常相关、部分相关）时使用，但在标准跨模态检索中，一般每个查询只有一个目标匹配，所以更常用 Recall@K。

    评估设置：

    - 在图文检索数据集（Flickr30k, MS-COCO）中，通常设定测试集包含 1000 或 5000 张图片，计算所有图片与文本之间的相似度矩阵，并取每行/每列的排序。

    - 零样本检索：用 CLIP 等在大规模数据上预训练的模型，无需微调，直接测试其在目标数据集上的检索性能，这是当前衡量模型泛化能力的重要方式。

    为什么使用 Recall@K？

    因为它直接反映了用户在实际使用中的体验：用户在搜索时通常只看前几页结果，关心正确的项目是否被展示在显著位置。它简单、直观，适合评估嵌入空间的质量。


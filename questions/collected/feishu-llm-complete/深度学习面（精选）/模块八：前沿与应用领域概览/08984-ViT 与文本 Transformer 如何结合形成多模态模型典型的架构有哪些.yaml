content:
  prompt: ViT 与文本 Transformer 如何结合形成多模态模型？典型的架构有哪些？
answer:
  mode: rubric
  reference_answer: |-
    ViT (Vision Transformer) 将图像分割成块 (patches)，视为 token 序列输入 Transformer 编码器。文本 Transformer 将单词或子词作为 token 序列。将二者结合形成多模态模型的方法主要分为以下几类：

    - 双塔架构（Dual Encoder）

    - 图像和文本分别由独立的 Transformer 编码器处理，各自的输出在顶部通过对比损失或相似度计算进行对齐。代表：CLIP。

    - 优点：推理高效，图像和文本特征可离线预先提取，支持大规模跨模态检索。

    - 缺点：缺乏细粒度的 token 级别交互，对于需要复杂推理的 VQA 等任务能力有限。

    - 单塔融合架构（Fusion Encoder）

    - 将视觉 token 和文本 token 拼接在一起，输入一个联合 Transformer 编码器，让它们从底层开始就进行充分的交叉注意力交互。代表：ViLBERT, UNITER, Oscar, VinVL。

    - ViLBERT 使用两个并行的 Transformer 流，分别处理视觉和文本，并在特定层引入协同注意力 (co-attention)，让两种模态相互关注。UNITER 则直接将两种 token 拼接，用统一的 Transformer 加上模态类型嵌入和掩码预训练。

    - 优点：模态间充分融合，适合复杂的多模态推理任务（如 VQA, 视觉蕴含, 视觉推理）。

    - 缺点：推理时对于每个图文对都需要重新计算联合编码，无法预先缓存特征，跨模态检索效率低。

    - 编码器-解码器架构（Encoder-Decoder）

    - 图像编码器（ViT）将图像编码为一系列视觉 token，文本解码器（通常是自回归 Transformer）以这些视觉 token 为条件生成文本。代表：SimVLM, OFA, BLIP。

    - 训练目标通常是生成式（如前缀语言建模或多任务统一学习），给定图像和部分文本，预测后续文本。

    - 优点：天然支持图像描述、VQA 生成、多模态对话等生成式任务，架构统一。

    - 缺点：对于区分性任务（如检索）需额外设计。

    - 桥接架构（Perceiver / Resampler）

    - 使用一个较小的 Transformer 模块（如 Q-Former 或 Perceiver Resampler）将视觉 token 压缩为固定数量的“抽象视觉 token”，然后将其作为前缀与文本 token 一起输入到一个冻结的大型语言模型 (LLM) 中。代表：BLIP-2, Flamingo, LLaVA 等。

    - 这种架构可以利用预训练好的强大 ViT 和 LLM，只需训练中间的桥接模块和少量适配层，极大降低训练成本，同时赋予 LLM 多模态理解能力。


content:
  prompt: 为什么在 MLP 中需要引入偏置项？去掉偏置项会对模型产生什么影响？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    如果没有偏置项，神经元的输出完全由输入特征的线性组合决定。当所有输入特征为零时，无论权重如何，净输入都为零。经过激活函数（如 sigmoid(0)=0.5，tanh(0)=0，ReLU(0)=0）后，模型的输出将被固定在一个特定值，无法根据数据调整。这意味着模型的决策超平面必须经过原点。对于大量实际问题，数据的最佳分割面并不经过原点，去掉偏置会严重限制模型的表达能力，导致欠拟合。

    例如，考虑一个简单的二分类问题，正负样本的中心在平面上分别位于 (2,2) 和 (-2,-2)。一条不经过原点的直线（如 x1+x2=0 实际上经过原点，而 x1+x2−1=0 不经过）能更好地分隔它们。没有偏置的模型无法学习到 x1+x2−1=0 这样的边界，只能勉强找到一条经过原点的次优边界，准确率大幅降低。

    从几何角度看，偏置项使得每个神经元能够独立地控制其激活阈值。从生物神经元角度类比，偏置相当于神经元的静息电位，影响神经元被激活的难易程度。因此，偏置是 MLP 中不可或缺的组成部分。

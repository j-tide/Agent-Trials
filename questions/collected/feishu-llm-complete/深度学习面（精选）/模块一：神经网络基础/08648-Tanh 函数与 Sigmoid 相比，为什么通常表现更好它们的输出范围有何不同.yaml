  reference_answer: |-
    Tanh 函数：

    [图片内容未导入]

    输出范围 (-1, 1)。

    Sigmoid 输出范围 (0, 1)。

    Tanh 表现更好的原因：

    - 零中心化：Tanh 的输出均值为0（接近），避免了 Sigmoid 恒正输出导致的权重更新锯齿问题，使梯度下降更有效，收敛更快。

    - 梯度更大：Tanh 在0附近的导数最大为1（Sigmoid最大为0.25），且导数分布更宽，在深层网络中梯度消失问题比Sigmoid轻微。

    - 非线性更强：在接近饱和区仍有更陡的梯度，表达能力更好。

    然而 Tanh 同样存在梯度消失问题，因为两端饱和导数趋近于0。但在实际中，Tanh 几乎在所有隐藏层任务上优于 Sigmoid，直到 ReLU 出现。

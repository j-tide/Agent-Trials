content:
  prompt: 什么是“死亡神经元”现象？它通常由什么激活函数引起？如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    “死亡神经元”是指在训练过程中，某个神经元的输出恒为零（或一个常数），且其梯度也为零，从而无法再被任何训练样本激活和更新，永久失去了学习能力。这一现象最常由 ReLU（Rectified Linear Unit） 激活函数引起。

    ReLU 的定义为 f(x)=max⁡(0,x)。当神经元的净输入 z≤0时，输出为零，梯度也为零。在反向传播中，链式法则会将该神经元之前的梯度也变为零，导致其输入权重无法更新。有两种典型情形会导致神经元死亡：

    - 初始化不当：如果权重初始化使得某个神经元的输出恒为负，该神经元可能从一开始就死亡。

    - 学习率过大：一次过大的权重更新可能将神经元的输入推向一个极负的区域，使得该神经元对所有训练样本的输出都变为负数，从而永久失活。

    缓解策略：

    - 使用 ReLU 的变体：LeakyReLU（f(x)=max⁡(αx,x)f(x)=max(αx,x)，αα 为很小的正数）、PReLU（可学习的 αα）、ELU 等，它们在负半区保留了一个非零的梯度，即使输入为负，神经元仍能缓慢学习，避免完全死亡。

    - 合适的初始化：采用 He 初始化（专为 ReLU 设计），保证各层激活值的方差稳定，降低初始时就输出全负的概率。

    - 较小的学习率：避免单步更新过大，配合梯度裁剪。

    - 梯度监控：定期检查各层神经元输出为零的比例，如果某个神经元长期死亡，可考虑重新初始化或调整超参数。

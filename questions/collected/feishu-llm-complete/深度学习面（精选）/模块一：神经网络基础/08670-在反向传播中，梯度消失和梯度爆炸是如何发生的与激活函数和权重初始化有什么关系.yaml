content:
  prompt: 在反向传播中，“梯度消失”和“梯度爆炸”是如何发生的？与激活函数和权重初始化有什么关系？
answer:
  mode: rubric
  reference_answer: |-
    在深层网络中，梯度从输出层向输入层传播时，每经过一层都要乘以该层激活函数的导数和权重矩阵的谱范数。如果这些因子反复连乘的结果持续小于1，梯度会呈指数级衰减，最终趋近于零，这便是梯度消失。反之，如果反复乘以大于1的数，梯度会指数级增长，导致参数更新量过大，这就是梯度爆炸。

    激活函数的选择对这一问题影响深远。早期的sigmoid和tanh函数在输入绝对值较大时，导数趋近于0（饱和），极容易导致梯度消失。ReLU激活函数在正半区导数为1，极大缓解了梯度消失问题，成为深层网络的首选。但ReLU在负半区导数为0，可能造成神经元永久失活，由此又衍生出LeakyReLU等变体。

    权重初始化同样至关重要。如果初始化权重过大，前向传播的激活值可能进入饱和区，梯度消失；或者在反向传播中梯度爆炸。如果初始化权重过小，信号在层间迅速衰减，也会导致梯度消失。因此，Xavier初始化和He初始化等方法被提出，它们根据输入和输出维度精心设置权重的方差，使得各层激活值和梯度的方差大致保持恒定，从而有效缓解消失和爆炸问题。

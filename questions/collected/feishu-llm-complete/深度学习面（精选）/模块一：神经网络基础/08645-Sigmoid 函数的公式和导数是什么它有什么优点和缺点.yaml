    公式：

    [图片内容未导入]

    优点：

    - 输出平滑且可解释为概率，非常适合二分类输出层。

    - 导数形式简单，可由函数值直接计算，便于反向传播。

    - 具有非线性，能够引入复杂的决策边界。

    缺点：

    - 梯度消失：当输入绝对值较大时，输出趋近于0或1，导数趋近于0，导致深层网络浅层权重几乎不更新。

    - 输出不是以零为中心：输出恒为正（0~1），使下一层神经元的输入都是正数，导致权重更新时出现“之”字形路径，收敛变慢。

    - 指数运算成本较高，但现代硬件已可接受。

    - 容易饱和：在深度网络中，反向传播时梯度连续相乘容易衰减至零。


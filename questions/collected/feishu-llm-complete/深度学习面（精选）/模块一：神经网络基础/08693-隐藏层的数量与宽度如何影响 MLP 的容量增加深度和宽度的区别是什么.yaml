content:
  prompt: 隐藏层的数量与宽度如何影响 MLP 的容量？增加深度和宽度的区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    增加隐藏层数量与增加每层神经元数量，都能提升模型的表达能力，但两者的方式和效果有本质区别。

    增加宽度（同一层更多神经元）直接扩充了该层表示空间的维度，使网络能够并行学习更多的特征。浅而宽的网络在理论上已经具备万能逼近能力，但往往效率低下：为了表示复杂函数，可能需要极多神经元，导致参数量爆炸，且更容易过拟合。

    增加深度（更多隐藏层）则赋予网络层次化特征学习的能力。深层网络通过逐层抽象，能够从原始数据中自动提取从简单到复杂的多层次特征——在图像中，浅层学习边缘和纹理，中层学习形状和部件，深层学习整体物体和场景。这种层次化表示使得深层网络在参数效率上远高于浅层网络，通常用更少的总参数就能达到更好的性能。此外，深度还增强了网络的组合泛化能力，使其能够处理训练中未见过的特征组合。

    然而，深度并非没有代价。过深的网络容易出现梯度消失或梯度爆炸问题，需要精心设计的架构和训练技巧。现代实践中，通常会同时增加宽度和深度，并配合残差连接、归一化等技术来保证训练的稳定性和最终性能。

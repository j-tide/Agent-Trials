content:
  prompt: 当预测值接近于 0 或 1 时，交叉熵损失的梯度行为是怎样的？这对训练有何影响？
answer:
  mode: rubric
  reference_answer: |-
    这里需区分是对概率值还是对logits求梯度。通常网络输出 logits z，经 sigmoid 或 softmax 得到概率 p，交叉熵损失对 logits 的梯度是：

    [图片内容未导入]

    即使 p 接近 0 或 1，该梯度也只取决于预测值与标签的差，不会消失。只要预测错误 (p 远离 y)，梯度保持线性强度，训练可以持续进行；若预测正确 (p≈y)，梯度趋近于 0，这是正常的收敛行为。

    与之对比，若用 MSE 配合 sigmoid，梯度会乘上 p(1−p)，当 p 饱和时梯度消失。交叉熵的这一特性是其训练分类器高效的核心原因。

    ---

    - 手动设定 λ（需要调参）。

    - 不确定性加权（Kendall et al.）：利用同方差不确定性自动学习权重 σσ，优化如下目标：

    - 在神经网络中广泛使用，梯度为 p−y，即使是分类正确的样本也会有非零梯度，直到概率趋于 1。这使得模型不断推动预测概率向 1 靠拢，能产出校准较好的概率。

    - Hinge Loss 更关注“分类正确且保持边距”，交叉熵更关注“概率置信度”。实践中交叉熵在训练神经网络时通常表现更好、更稳定，且天然适合多分类。

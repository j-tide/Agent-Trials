    构造有效三元组：
    若随机采样，很多三元组会轻松满足条件（d(a,p)−d(a,n)+m<0)，梯度为零。有效三元组应违反此约束，即：

    [图片内容未导入]

    常用的策略是困难样本挖掘（hard mining），选择：

    - hard positive：d(a,p) 较大的正样本；

    - hard negative：d(a,n)较小的负样本；
    使得约束更难满足，提供有信息的梯度。


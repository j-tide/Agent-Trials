content:
  prompt: 激活函数的“非饱和”指的是什么？为什么非饱和激活函数对深度网络训练很重要？
answer:
  mode: rubric
  reference_answer: |-
    饱和：当激活函数的导数在大部分输入范围内趋近于0。例如 Sigmoid 两端导数接近0，神经元输出接近其极值，此时称为“饱和”。

    非饱和：激活函数的导数能在较大范围内保持非零值（如 ReLU 正半区导数为1），不容易进入导数消失的状态。

    为什么对深度网络重要：

    - 深层网络反向传播时，梯度需要连乘很多层的导数。如果使用饱和激活函数，许多层的导数是小于1的小数（甚至接近0），梯度指数级衰减，浅层权重几乎不更新，导致训练失败。

    - 非饱和激活函数（特别是 ReLU）在激活区间导数恒为1，梯度可以无损地穿过很多层，大幅缓解梯度消失，使训练更深的网络成为可能。

    - 非饱和性也带来更快的收敛，因为梯度信号更强。

    因此，现代深度网络几乎全部使用非饱和激活函数（ReLU, Leaky ReLU, Swish 等）。

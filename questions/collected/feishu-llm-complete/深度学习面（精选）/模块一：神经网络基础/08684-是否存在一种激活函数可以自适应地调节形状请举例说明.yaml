content:
  prompt: 是否存在一种激活函数可以自适应地调节形状？请举例说明。
answer:
  mode: rubric
  reference_answer: |-
    存在。这类激活函数通常拥有可学习的参数，在训练过程中根据数据和任务自动调整其形状。

    - PReLU（Parametric ReLU）：负半区的斜率 α 是一个可学习参数，而非固定值。每个通道可以拥有独立的 α，通过反向传播更新。这使得网络能够学习到每个神经元最合适的负半轴响应。

    - Swish 本身带有可学习参数 β：Swishβ(x)=x⋅σ(βx)。当 β=1 时是标准 Swish，β 增大趋向 ReLU，β 减小趋向线性函数。训练时 β 可学习。

    - 自适应激活函数：如 PELU、SELU（固定但有自归一化性质）、以及更通用的 KAF（Kernel Activation Function） 等，通过小型网络或核函数动态生成激活响应。

    这些自适应激活函数增加了少量参数，但能提升模型的灵活性和拟合能力，尤其在资源充足时。

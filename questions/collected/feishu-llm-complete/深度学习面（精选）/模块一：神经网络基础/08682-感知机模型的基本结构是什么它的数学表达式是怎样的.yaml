    两类样本。训练时，感知机采用迭代更新策略：对于每个被误分类的样本，按照规则 w←w+η⋅(ytrue−ypred)⋅x 调整权重，其中 η 是学习率。如果数据是线性可分的，感知机可以在有限步内收敛到正确分类所有样本的解。

    然而，感知机的局限性非常明显：它只能处理线性可分的问题。当数据分布无法用一条直线（或超平面）完全分开时，感知机便束手无策，最经典的例子就是异或问题。


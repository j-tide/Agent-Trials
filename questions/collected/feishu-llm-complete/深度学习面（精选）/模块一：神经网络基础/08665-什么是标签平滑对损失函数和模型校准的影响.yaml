answer:
  mode: rubric
  reference_answer: |-
    标签平滑：将 one-hot 硬标签转为软标签，引入少量均匀噪声。

    [图片内容未导入]

    其中 K 为类别数，ε 是一个小数（如 0.1）。

    对损失函数的影响：

    - 避免模型在训练时对某个预测结果给出极端概率（如 1 或 0），从而防止过拟合。

    - 交叉熵损失会增加一个额外的惩罚项，促使 logits 之间不那么极端，分布更均匀。

    对模型校准的影响：

    明显改善置信度校准。模型预测的分数（概率）能更真实地反映实际的正确可能性，降低期望校准误差（ECE），尤其在分布外检测和安全性重要的应用中很有价值。


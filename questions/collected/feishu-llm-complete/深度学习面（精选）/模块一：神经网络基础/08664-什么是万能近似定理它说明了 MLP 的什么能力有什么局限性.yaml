content:
  prompt: 什么是万能近似定理？它说明了 MLP 的什么能力？有什么局限性？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    万能近似定理由Cybenko和Hornik等人于1989年独立证明，它是神经网络理论中最具影响力的定理之一。定理的核心结论：包含单个隐藏层、隐藏层神经元数量足够多、且使用挤压函数（如sigmoid）作为激活函数的前馈神经网络，能够以任意精度逼近任何定义在紧致子集上的连续函数。

    这一定理的意义在于，它从理论上保证了多层感知机具备通用函数逼近的能力。无论目标映射多么复杂——无论是图像识别中的像素到类别的映射、语音识别中的波形到文本的映射，还是复杂物理系统的模拟——只要网络足够宽，就一定存在一组参数使网络输出无限接近目标函数。

    然而，万能近似定理也存在显著的局限性。第一，定理只证明存在这样的网络，但并未给出找到这组参数的方法，也没有说明需要多少神经元。在某些情况下，神经元数量可能随问题维度呈指数增长，这在实践中并不可行。第二，定理仅适用于连续函数，对于不连续或高度振荡的函数，浅层网络可能需要极多神经元。第三，即使网络在理论上能完美逼近训练数据，也不能保证它在新数据上具有良好的泛化性能。正是这些局限，促使研究者探索更深的网络架构、更好的优化算法和正则化技术。

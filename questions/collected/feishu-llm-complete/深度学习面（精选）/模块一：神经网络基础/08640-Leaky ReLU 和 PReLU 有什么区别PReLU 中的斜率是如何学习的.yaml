answer:
  mode: rubric
  reference_answer: |-
    Leaky ReLU：αα 是固定的超参数（通常0.01），整个网络共享同一个斜率，负半区梯度恒定且很小。

    [图片内容未导入]

    PReLU 提供了更大的灵活性，有时能进一步提升性能，但增加了少量参数。

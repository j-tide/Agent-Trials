content:
  prompt: 比较激活函数 Sigmoid、Tanh、ReLU、Leaky ReLU、ELU、Swish 的优缺点，并绘制大致形状。
answer:
  mode: rubric
  reference_answer: |-
    由于无法在此处真实绘图，我将描述各函数的形状特征，并总结优缺点。

    形状描述：

    - Sigmoid：S 形曲线，平滑单调，输出 (0,1)，关于 (0, 0.5) 中心对称。

    - Tanh：S 形曲线，平滑单调，输出 (-1,1)，关于原点中心对称，比 Sigmoid 更陡峭。

    - ReLU：折线，x<0 时输出 0，x≥0 时输出 x，0 点处不可导。

    - Leaky ReLU：折线，x<0 时输出一个很小的斜率（如 0.01x），x≥0 时输出 x，整体单调。

    - ELU：左侧平滑指数衰减趋向 -α，右侧线性，在原点附近平滑且输出均值接近 0。

    - Swish：非单调，左侧先下降后上升，右侧趋近线性，整体平滑。


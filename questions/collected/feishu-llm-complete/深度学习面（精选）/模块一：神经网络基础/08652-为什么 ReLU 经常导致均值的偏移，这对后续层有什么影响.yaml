content:
  prompt: 为什么 ReLU 经常导致“均值的偏移”，这对后续层有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    ReLU 的输出是非负的（x≥0 时输出 x，x<0 时输出 0），因此无论输入分布如何，经过 ReLU 后的激活值均值必然大于 0。这种“均值偏移”会随层数累积，导致深层网络的激活值均值逐渐增大，偏离零中心。

    对后续层的影响：

    - 权重更新效率降低：如果进入某一层的所有输入都是正数，那么在反向传播计算该层权重梯度时，梯度向量中每个权重的局部梯度（激活值）都是正的，这会导致所有权重的更新方向相同（都为正或都为负），无法进行精细的独立调整，更新路径呈“之”字形，收敛缓慢。

    - 内部协变量偏移：均值不为零且逐渐变化，破坏了批归一化的效果（如果未使用BN），也使得后续层的学习不断适应漂移的输入分布，训练不稳定。

    - 表示能力受限：全部为正的激活值限制了神经网络的表示能力，因为理想的表示往往需要正负对称的特征。

    缓解措施：使用批归一化（BatchNorm），它将每一层的输出重新规范化为零均值和单位方差，有效抵消 ReLU 的均值偏移效应。这也是为何在 CNN 中 BN 经常与 ReLU 搭配使用。此外，选择零中心的激活函数（如 ELU、Tanh）也能减轻此问题。

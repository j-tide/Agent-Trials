content:
  prompt: ELU 相比 ReLU 有什么优势？它的负值部分是如何设计的？
answer:
  mode: rubric
  reference_answer: |-
    ELU（Exponential Linear Unit）：

    [图片内容未导入]

    其中 α 是正超参数（默认1）。

    优势：

    - 负值输出：ELU 在负半区输出负值，使得激活值的均值趋近于0，这类似于 Tanh 的零中心化效果，能加速学习并提高对噪声的鲁棒性。

    - 饱和区：当 x 很小时，ELU 会饱和到 −α，这种饱和特性对噪声有更强的鲁棒性，且可以缓解神经元死亡问题（因为梯度不为零）。

    - 比 Leaky ReLU 更平滑：在零点处可微，对优化更友好。

    - 实验表明 ELU 在一些深层网络中能获得比 ReLU 更好的泛化性能。

    缺点是指数运算稍慢。

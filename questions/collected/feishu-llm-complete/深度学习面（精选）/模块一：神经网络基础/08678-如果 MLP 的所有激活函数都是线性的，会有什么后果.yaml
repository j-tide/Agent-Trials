content:
  prompt: 如果 MLP 的所有激活函数都是线性的，会有什么后果？
answer:
  mode: rubric
  reference_answer: |-
    如果网络中所有激活函数都是线性函数，即每层的输出只是输入的线性变换，那么无论堆叠多少层，整个网络都等价于一个单层线性模型。

    [图片内容未导入]

    这种退化的后果是严重的：网络完全丧失了表达非线性函数的能力，无论层数多深、隐藏单元多少，都无法拟合任何非线性关系。深度结构完全白费，增加层数不会带来任何表示能力的提升，模型本质上与没有隐藏层的线性回归无异。这清楚地解释了为什么非线性激活函数是神经网络不可或缺的核心组件——它是网络能够学习复杂模式、成为“通用函数逼近器”的根本原因。

content:
  prompt: 激活函数对网络初始化方法的选择有何影响？
answer:
  mode: rubric
  reference_answer: |-
    激活函数决定了前向和反向传播中信号的统计特性，因此初始化方法必须与之匹配，以保持各层激活值和梯度的方差稳定。核心理念是：在前向传播中，各层输出的方差应大致等于输入的方差；在反向传播中，各层梯度的方差也应大致相等。

    - Sigmoid / Tanh：由于存在饱和区，通常配合 Xavier（Glorot）初始化。该初始化基于线性激活假设，将权重初始化为方差 2/(fan_in+fan_out) 的分布，以在 Tanh 激活下保持方差。但对于 Sigmoid，Xavier 可能仍不完全匹配，有时需要适当调整增益。

    - ReLU / Leaky ReLU / ELU：这些函数在正半区近似线性，但负半区会“杀死”一半的神经元。因此需要 He（Kaiming）初始化，将权重方差设为 2/fan_in（或 fan_out 模式）。这个因子补偿了 ReLU 置零导致方差减少一半的效应。

    - Swish / GELU：由于形状接近 ReLU，通常也采用 He 初始化，但因为它们对负值有响应，严格来说需要更精细的方差校准。实践中，He 初始化配合小幅调整常能取得良好效果。

    - SELU（自归一化）：特殊设计下，配合 LeCun 初始化（方差 1/fan_in）可实现自归一化特性，使激活值自动收敛到零均值和单位方差。

    使用错误的初始化（如对 ReLU 用 Xavier）会导致深层网络中方差的剧烈衰减或放大，造成梯度消失或爆炸，从而无法训练。

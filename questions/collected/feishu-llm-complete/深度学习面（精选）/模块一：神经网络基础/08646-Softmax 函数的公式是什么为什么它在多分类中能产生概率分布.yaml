    如何产生概率分布：

    - 所有输出 pi∈(0,1)，因为指数函数非负。

    - 所有 pi 之和为1，因为分母是所有指数之和。

    - 可解释为类别概率，模型学习最大化正确类别的概率（最小化交叉熵）。

    优势：Softmax 将 logits 映射为概率，便于与交叉熵损失结合；其指数运算能放大类别间的差异，有利于做出“硬”决策。

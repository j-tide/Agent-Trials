content:
  prompt: 分析 Softmax 函数的“指数”变换为何能放大最大值之间的差异，并讨论其数值稳定性问题及解决方案。
answer:
  mode: rubric
  reference_answer: |-
    放大差异：指数函数将输入映射到正数，且放大数值间的比例。例如 logits 为 (2, 1)，直接比较相差一倍；经指数后变为 (7.39, 2.72)，差距拉大，经过 softmax 后概率差异更明显。这使得模型对正确类别更自信，训练时梯度信号更强。

    数值稳定性问题：当 logits 中有很大的正数时，ezi 可能溢出（上溢）；或很负时，指数和接近于0导致除零。解决方法是减去最大值：


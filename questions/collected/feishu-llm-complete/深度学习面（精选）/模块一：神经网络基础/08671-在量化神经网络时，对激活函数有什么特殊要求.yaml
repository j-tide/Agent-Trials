content:
  prompt: 在量化神经网络时，对激活函数有什么特殊要求？
answer:
  mode: rubric
  reference_answer: |-
    量化神经网络的目的是将浮点权重和激活值映射到低精度整数（如 INT8），以减少存储和加速计算。激活函数的选择直接影响量化的难易和精度。

    - 数值范围可控：激活函数的输出范围最好有界且对称，这样容易确定量化的缩放因子和零点。例如，ReLU6 被设计为 min⁡(max⁡(0,x),6)，将输出限制在 [0, 6]，这显著简化了定点量化。Sigmoid/Tanh 输出范围已知且较小，也较易量化。而标准 ReLU 输出无上限，可能导致量化时的大动态范围和高误差。

    - 避免平缓的饱和区：Sigmoid/Tanh 的饱和区导数极小，量化误差在此处会被放大，因为小的参数扰动可能导致输出跳到不同量化 bin。因此，量化友好型激活通常需要线性或近似线性的区域占主导。

    - 对称性：对称的激活函数（如 Tanh）可配合对称量化，无需零点参数，减少计算复杂度。

    - 硬件支持：一些硬件加速器对特定激活函数（如 INT8 下的 ReLU、Tanh）有高效实现。复杂函数（如 Swish、GELU）通常通过查找表或多项式近似来实现量化推理。

    - 非饱和性：非饱和激活可保证大部分输入落在函数敏感区，量化误差相对均匀，而饱和激活可能在边界处产生极大误差。

    因此，为了模型量化，通常会选择 ReLU6、HardSigmoid、HardSwish 等输出范围有限且计算简单的激活函数，或者在训练时就采用量化感知训练 (QAT) 来让模型适应量化后的激活表示。

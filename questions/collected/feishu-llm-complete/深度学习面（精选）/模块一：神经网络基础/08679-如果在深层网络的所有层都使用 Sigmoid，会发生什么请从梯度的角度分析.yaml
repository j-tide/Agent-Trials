content:
  prompt: 如果在深层网络的所有层都使用 Sigmoid，会发生什么？请从梯度的角度分析。
answer:
  mode: rubric
  reference_answer: |-
    如果在深层网络的每一层都使用 Sigmoid 作为激活函数，训练将变得极其困难甚至完全失败，主要原因在于梯度消失。Sigmoid 函数的输出范围是 (0, 1)，其导数最大值为 0.25（在输入为 0 时取得），且当输入的绝对值稍大时，导数迅速趋近于 0。在反向传播过程中，梯度从输出层向输入层逐层传递，根据链式法则，每一层都要乘以该层激活函数的导数。如果每一层的导数都小于 1（甚至远小于 1），经过多层连乘后，梯度将呈指数级衰减，到达浅层时已经微乎其微，导致浅层权重几乎无法更新，模型无法有效学习。

    此外，Sigmoid 的输出始终为正（均值为 0.5），这意味着对于下一层来说，输入的各个维度都是正数。在反向传播时，同一层的所有权重梯度将具有相同的符号（因为局部梯度中的激活值都是正的），这会导致权重更新时出现“之”字形路径，收敛速度变慢。综合这些因素，深层网络中全面使用 Sigmoid 是不可行的。

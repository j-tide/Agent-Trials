content:
  prompt: 能否在输出层使用 ReLU？什么情况下可以？
answer:
  mode: rubric
  reference_answer: |-
    可以，但取决于具体任务。输出层使用 ReLU 的核心条件是输出值需要是非负实数。例如：

    - 回归任务中目标值始终非负：如预测房价（价格≥0）、股票价格、物体尺寸、距离、年龄等。此时使用 ReLU 可以确保网络输出不会出现负数，符合物理意义。

    - 多标签分类的某些变体：如果模型设计为输出非负分数而不是概率，但更常见的做法是使用 Sigmoid 将每个标签独立映射到 (0,1)。

    不能使用 ReLU 的情况：当输出需要可以是任意实数（如气温变化、坐标位置）时，ReLU 会错误地将负值截断为 0，导致模型无法拟合数据。此时应使用恒等（线性）激活。对于需要输出概率分布的任务（二分类用 Sigmoid，多分类用 Softmax），ReLU 无法将输出压缩到 (0,1) 且和为 1。

content:
  prompt: 反向传播算法的核心思想是什么？链式法则在其中扮演什么角色？
answer:
  mode: rubric
  reference_answer: |-
    反向传播是训练神经网络最基础也最核心的算法，其本质是一种利用链式法则高效计算损失函数对每层参数的梯度的方法。整个训练过程分为两个阶段：

    前向传播阶段：输入数据从输入层开始，逐层计算加权和、经过激活函数，最终得到预测输出，并计算预测值与真实值之间的损失。

    反向传播阶段：从输出层开始，沿着网络反向逐层计算损失关于各层参数（权重和偏置）的梯度。这层与层之间的梯度传递，完全依赖于微积分中的链式法则。

    [图片内容未导入]

    这种递归分解的关键在于：每一层只需要知道来自后一层的梯度，再乘上本层输出对本层参数的局部梯度，就能计算出损失对本层参数的梯度，同时将梯度继续向前一层传递。链式法则使得这种逐层传递变得自然且高效，避免了重复计算，让深层网络的训练成为可能。

content:
  prompt: 如何为隐藏层选择合适的激活函数？需要考虑哪些因素？
answer:
  mode: rubric
  reference_answer: |-
    选择隐藏层激活函数需综合考虑以下因素：

    - 任务特性：一般分类/回归任务，ReLU 及其变体是安全起点。

    - 网络深度：深层网络优先使用非饱和、导数较大且稳定的函数（ReLU, Leaky ReLU, Swish），以避免梯度消失。

    - 训练稳定性：如果出现死亡神经元，可切换为 Leaky ReLU 或 ELU。若希望输出零中心化，选 Tanh 或 ELU。

    - 梯度流：Sigmoid/Tanh 饱和区梯度小，不适合非常深的网络；ReLU 在正半区梯度恒1，表现优异。

    - 计算成本：推理阶段，ReLU 计算最快；Swish/ELU 等涉及指数运算，略有开销，但可在移动端用近似函数。

    - 是否自门控：Swish、GELU 等自门控激活函数在大型 Transformer 模型上普遍更好，因为它们能根据输入动态控制信息通过量。

    - 与初始化、优化器的配合：ReLU 通常配合 He 初始化；SELU 配合 LeCun 初始化等。

    - 经验与基准：参考类似架构的最新实践。例如 CNN 常用 ReLU；Transformer 的 FFN 常用 GELU/SiLU；RNN 用 Tanh；二分类输出用 Sigmoid；多分类输出用 Softmax。

    实践中，ReLU 因其简单、有效仍是最常用的隐藏层激活函数，但追求极致性能时，Swish/GELU 成为许多先进模型的选择。

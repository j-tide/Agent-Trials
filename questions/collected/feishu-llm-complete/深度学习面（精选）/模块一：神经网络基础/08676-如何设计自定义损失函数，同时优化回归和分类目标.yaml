content:
  prompt: 如何设计自定义损失函数，同时优化回归和分类目标？
answer:
  mode: rubric
  reference_answer: |-
    通常采用多任务学习的架构，总损失为各任务损失的加权和：

    [图片内容未导入]

    - 回归任务常用：MSE、MAE、Huber。

    - 分类任务常用：交叉熵、Focal Loss 等。

    关键设计要点：

    - 网络结构：共享特征提取主干，分设两个输出头，分别输出回归值与分类 logits。

    - 损失平衡：

    [图片内容未导入]

    - 梯度归一化（GradNorm）等方法动态调整权重，使各任务梯度量级相近。

    - 数值范围协调：确保回归目标经过归一化/标准化，与分类损失值处于可比量级。

    这种方式广泛应用于目标检测（边界框回归 + 分类）、自动驾驶多任务感知等场景。


  prompt: 多层感知机（MLP）是如何解决异或问题的？需要至少几个隐藏层？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    解决异或的关键在于引入隐藏层，将原始输入空间映射到新的特征空间，使数据在新空间中变得线性可分。

    多层感知机仅需一个隐藏层，其中包含两个神经元，就能表示异或函数。具体来说，两个隐藏神经元分别学习输入的不同线性组合，经过非线性激活函数后，产生新的特征表示。输出层再将这两个新特征进行线性组合，即可构造出异或的决策边界。

    例如，使用ReLU激活函数：

    [图片内容未导入]

    通过这两个隐藏神经元，模型成功将原始空间映射到一个新的二维空间，使得异或的四个点在新空间中变得线性可分。这体现了深度学习的核心思想——通过多层非线性变换，逐步提取和重组特征，最终解决复杂的非线性问题。

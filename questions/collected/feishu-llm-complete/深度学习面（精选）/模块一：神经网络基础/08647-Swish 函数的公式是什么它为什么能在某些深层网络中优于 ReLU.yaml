content:
  prompt: Swish 函数的公式是什么？它为什么能在某些深层网络中优于 ReLU？
answer:
  mode: rubric
  reference_answer: |-
    Swish（由 Google 提出）：
    Swish(x)=x⋅σ(βx)
    其中 σ 是 Sigmoid，β 是可学习参数或固定为1。

    [图片内容未导入]

    优势：

    - 非单调：与 ReLU 不同，Swish 在负半区可能略微上升后再下降，呈现出非单调性，这有助于梯度流动和表达。

    - 平滑且处处可导：没有像 ReLU 在0点的不可导尖点，对梯度下降更友好。

    - 自门控：形式上是 x 乘以一个门控值 σ(x)，可以看作是对输入的自适应过滤，允许小的负输入产生负输出（但不完全置零），保持了信息的流动性。

    - 在极深网络（如 MobileNet, EfficientNet）中 Swish 常优于 ReLU。

    缺点是计算复杂（涉及 Sigmoid），但在实践中已通过近似实现优化。

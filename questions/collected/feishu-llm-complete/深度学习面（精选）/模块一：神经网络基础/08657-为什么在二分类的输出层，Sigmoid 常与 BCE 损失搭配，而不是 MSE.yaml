content:
  prompt: 为什么在二分类的输出层，Sigmoid 常与 BCE 损失搭配，而不是 MSE？
answer:
  mode: rubric
  reference_answer: |-
    二分类输出层使用 Sigmoid + 二元交叉熵（BCE）是标准组合，原因在于：

    - 概率解释：Sigmoid 输出 (0,1) 可直接解释为类别概率，BCE 是衡量两个概率分布差异的恰当损失函数。

    - 梯度优良：BCE 关于 Sigmoid 输入 zz 的梯度为 σ(z)−y（真实标签 y）。这意味着当预测完全错误时梯度很大，正确时梯度接近0，训练高效。相比 MSE，MSE 与 Sigmoid 结合时，梯度会乘以 σ(z)(1−σ(z))，当预测极端时梯度消失，导致学习停滞。

    - 凸性：在逻辑回归中，BCE 损失是凸函数，优化稳定。

    - 数值稳定：BCE 通常与 Sigmoid 合并计算（BCEWithLogitsLoss），直接输入 logits，避免计算 Sigmoid 后的 log 数值不稳定性。

    因此 BCE+Sigmoid 是二分类的默认配置。

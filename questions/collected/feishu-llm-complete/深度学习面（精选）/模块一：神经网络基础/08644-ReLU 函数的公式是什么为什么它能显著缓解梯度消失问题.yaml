content:
  prompt: ReLU 函数的公式是什么？为什么它能显著缓解梯度消失问题？
answer:
  mode: rubric
  reference_answer: |-
    公式：
    ReLU(x)=max⁡(0,x)

    缓解梯度消失的机制：

    - 正半区导数恒为1：当输入 x>0时，导数等于1，反向传播时梯度不会衰减，深层网络的梯度可以无损地流向前层。这就避免了 Sigmoid/Tanh 中小导数连乘导致的指数衰减。

    - 单侧抑制：负半区输出为零，引入稀疏性，使网络更容易学习特征，同时这种稀疏性也有一定的正则化效果。

    - 计算简单：只需比较和取最大值，前向和反向计算都非常快。

    因此，ReLU 成为深度网络的默认激活函数，极大加速了训练和收敛。

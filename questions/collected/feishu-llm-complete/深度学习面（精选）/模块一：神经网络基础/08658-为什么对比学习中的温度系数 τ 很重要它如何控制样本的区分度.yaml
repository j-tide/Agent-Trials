content:
  prompt: 为什么对比学习中的温度系数 τ 很重要？它如何控制样本的区分度？
answer:
  mode: rubric
  reference_answer: |-
    在对比学习（如 SimCLR、MoCo）使用的 InfoNCE 损失中，温度系数 ττ 出现在 softmax 形式的相似度缩放上：

    [图片内容未导入]

    它控制 softmax 分布的锐利度：

    - 当 τ 较小时，分布变得更尖锐，模型会对最相似的负样本分配极高的惩罚，从而重点关注困难负样本。但过小的 τ 会使训练对噪声和微小差异过于敏感，容易过拟合或训练不稳定。

    - 当 τ 较大时，分布趋于平滑，所有负样本被近似平等看待，模型会学习更全局的结构，但可能会削弱对困难样本的区分能力，降低表示质量。
    因此，τ 调节了样本之间的“区分度”和“关注范围”，需要在难分样本挖掘与训练稳定性之间取得平衡。


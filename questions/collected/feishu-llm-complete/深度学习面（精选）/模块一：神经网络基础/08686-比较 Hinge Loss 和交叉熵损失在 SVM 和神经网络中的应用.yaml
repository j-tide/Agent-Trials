content:
  prompt: 比较 Hinge Loss 和交叉熵损失在 SVM 和神经网络中的应用。
answer:
  mode: rubric
  reference_answer: |-
    - Hinge Loss（用于最大间隔分类）：

    [图片内容未导入]

    - 在 SVM 中，通过最大化间隔找到支持向量，只有位于间隔内或错分的样本产生非零梯度。停止优化后，大量正确且远超间隔的样本对模型没有影响，这使得解具有稀疏性。

    - 在神经网络中，Hinge Loss 可用于替代交叉熵。梯度不为零时是常数，但当预测绝对正确且远超间隔时梯度为零，可能使网络停止学习某些样本。且不可微点需处理（或使用平方 Hinge Loss）。它没有直接的概率输出。

    - 交叉熵损失（配合 softmax/sigmoid）：
    L=−log⁡p(y∣x)，输出为概率。


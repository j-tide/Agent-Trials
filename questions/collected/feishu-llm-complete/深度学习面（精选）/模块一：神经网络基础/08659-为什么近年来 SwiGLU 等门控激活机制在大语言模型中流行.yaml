content:
  prompt: 为什么近年来 SwiGLU 等门控激活机制在大语言模型中流行？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    其中 SiLUSiLU 就是 Swish 函数，⊙ 表示逐元素乘法。SwiGLU 本质上是一个带有门控的双线性变换。

    流行原因：

    - 更强的表达能力：标准 FFN 使用两层全连接 + 单一激活（如 ReLU 或 GELU），而 SwiGLU 引入了额外的线性投影和逐元素乘法，门控机制允许模型根据输入动态选择特征通过的强度，相当于增加了一个“软门”，显著提升了 FFN 的表示容量。

    - 优越的实证性能：在同等参数预算下，SwiGLU 在语言模型预训练（如 LLaMA、PaLM）的困惑度和下游任务中显著优于 ReLU、GELU 等传统激活函数。LLaMA 论文报告使用 SwiGLU 后，即使在参数量减少的情况下仍能匹配或超越更大模型的性能。

    - 梯度流动更佳：门控乘法不会像 ReLU 那样直接截断，负输入也能部分通过，避免了死神经元问题；同时 SiLU 的平滑性有助于稳定训练。

    - 参数效率：虽然 SwiGLU 引入了三个权重矩阵，但通过将中间维度调整为原来的 2/3，可以保持总参数量与标准 FFN 相同，实现“无成本”的性能提升。

    因此，SwiGLU 以其出色的表现成为现代大型语言模型中 FFN 层的标配。

content:
  prompt: 什么是 GELU？它与 ReLU 和 Swish 有什么关系？在 Transformer 中为什么常用？
answer:
  mode: rubric
  reference_answer: |-
    GELU（Gaussian Error Linear Unit） 是一种平滑的、处处可导的激活函数，可以看作是 ReLU 的“软性”版本。它根据输入的大小随机地（或确定性地）对输出进行“门控”。其数学表达式为：

    [图片内容未导入]

    与 ReLU 的关系：ReLU 在 x>0 时恒等，x<0 时直接置零，这是一个确定性的硬门控。GELU 则根据 x 的大小以随机概率（或软性）让信息通过，当 xx 较大时接近 x，较小时接近 0，介于 -2 到 2 之间时具有平滑的过渡。这种平滑性和非单调性使得 GELU 拥有更好的梯度流和表达能力。

    与 Swish 的关系：Swish 定义为 x⋅σ(βx)，其中 σσ 是 Sigmoid 函数。GELU 在思想上是类似的，都是一种“自门控”机制：用输入本身去控制信息通过的多少。Swish 使用 Sigmoid 作为门控函数，GELU 使用正态分布的 CDF。两者形状相似，性能在很多任务上相当，但 GELU 在 Transformer 中更为常见。

    在 Transformer 中流行的原因：Transformer 的训练通常极深且使用大量参数，ReLU 的硬门控可能导致部分神经元永久失活（死亡 ReLU），而 GELU 的平滑性和对负输入的微小保留能够提供更稳定的梯度流动。实验表明，GELU 在预训练语言模型（如 BERT、GPT）的下游任务上优于 ReLU 和 ELU，能带来更好的收敛性和最终性能，因此成为 Transformer 的默认激活函数之一。

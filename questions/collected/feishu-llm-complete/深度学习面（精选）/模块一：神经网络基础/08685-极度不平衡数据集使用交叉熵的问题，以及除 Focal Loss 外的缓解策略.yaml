content:
  prompt: 极度不平衡数据集使用交叉熵的问题，以及除 Focal Loss 外的缓解策略
answer:
  mode: rubric
  reference_answer: |-
    问题：模型会偏向多数类，多数类的简单样本产生的梯度淹没少数类的信号，导致少数类准确率极低。

    缓解策略（除 Focal Loss 外）：

    - 重采样：欠采样多数类，过采样少数类（如 SMOTE）。

    - 加权交叉熵：给少数类分配更高的类别权重 αc。

    - OHEM（在线困难样本挖掘）：只保留损失最大的部分样本进行反向传播。

    - 阈值移动：根据类别先验调整决策阈值。

    - 代价敏感学习：调整不同错误分类的惩罚。

    - 单类分类/异常检测：当少数类样本极少时，将其视为异常检测问题。

    - 合奏方法：如 Balanced Bagging，EasyEnsemble 等。


content:
  prompt: MSE 损失和 MAE 损失分别有什么特点？在什么场景下选择哪个？
answer:
  mode: rubric
  reference_answer: |-
    MSE（Mean Squared Error，均方误差）

    [图片内容未导入]

    特点：

    - 对大误差的惩罚极为严厉：误差被平方，因此离群点（异常值）会极大地拉高损失，模型会优先“讨好”这些离群点，导致拟合线被拉偏。

    [图片内容未导入]

    - 统计解释：若噪声服从高斯分布，最小化MSE等价于极大似然估计，最优输出为条件期望（均值）。

    - 光滑可导，便于使用基于梯度的优化器。

    MAE（Mean Absolute Error，平均绝对误差）

    [图片内容未导入]

    - 特点：

    - 对异常值鲁棒：所有误差被线性加权，离群点不会像MSE那样主导损失，因此模型更关注大多数正常样本。

    - 梯度为常数（±1）：在0点不可导，实践中用次梯度。这使得训练过程中无论误差大小，步长始终恒定，在接近最优解时容易震荡，但不会因为某个离群点而剧烈摆动。

    - 统计解释：若噪声服从拉普拉斯分布，最小化MAE等价于极大似然估计，最优输出为条件中位数。

    - 在0点不可导，但通常通过次梯度解决。

    场景选择

    - 数据干净、没有（或极少）异常值：优先使用MSE，因为它收敛更快，且最终的预测值为均值，满足无偏性。

    - 数据中可能包含大量离群点（如金融交易金额、传感器故障读数、极端天气数据）：使用MAE或Huber Loss，避免模型被少数异常值带偏。

    - 若希望预测值反映大多数样本的“典型”水平（而非被极端值拉偏），应选择MAE。

    - 在需要同时兼顾收敛速度和鲁棒性时，可使用Huber Loss。

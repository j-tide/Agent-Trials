  prompt: Huber 损失如何结合 MSE 和 MAE 的优势？公式是什么？
answer:
  mode: rubric
  reference_answer: |-
    公式（参数 δ>0）：

    [图片内容未导入]

    结合优势的方式

    - 当残差较小（∣y−y^∣≤δ）时，使用 MSE，此时梯度是线性的，且函数处处可导，优化过程平滑。

    - 当残差较大（∣y−y^∣>δ）时，退化为 MAE（平移了常数），梯度绝对值为常数 δ，不会像 MSE 那样把离群点的误差平方放大，从而对异常值更鲁棒。

    - 在 δ 处，函数值和一阶导数均连续。


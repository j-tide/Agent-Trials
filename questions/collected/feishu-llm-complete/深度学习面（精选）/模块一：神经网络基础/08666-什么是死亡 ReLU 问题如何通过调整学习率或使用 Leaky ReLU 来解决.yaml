content:
  prompt: 什么是死亡 ReLU 问题？如何通过调整学习率或使用 Leaky ReLU 来解决？
answer:
  mode: rubric
  reference_answer: |-
    死亡 ReLU：当某个 ReLU 神经元的输入始终为负时，输出为0，梯度也为0，导致该神经元及之前的参数无法更新，永远处于“死亡”状态。这通常由过大的学习率导致权重更新过度，或不良的初始化使某些神经元对所有样本都输出负值。

    解决方案：

    - 调整学习率：降低学习率，避免权重更新过猛。

    - 改进初始化：如 He 初始化，使各层激活值方差稳定，减少死亡概率。

    - Leaky ReLU：定义为 LeakyReLU(x)=max⁡(αx,x)，其中 αα 是一个很小的常数（如0.01）。负半区保留一个微小的正斜率 α，即使输入为负，梯度也不会为零，神经元可以继续学习。

    - PReLU：将 α 设为可学习的参数，更加灵活。

    - ELU/SELU 等变体：负半区为指数饱和，也能避免死亡。

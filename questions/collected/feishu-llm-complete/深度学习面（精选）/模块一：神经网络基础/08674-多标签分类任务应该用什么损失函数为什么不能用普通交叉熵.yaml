content:
  prompt: 多标签分类任务应该用什么损失函数？为什么不能用普通交叉熵？
answer:
  mode: rubric
  reference_answer: |-
    应该用：二元交叉熵（Binary Cross-Entropy） 对每个标签独立计算。

    [图片内容未导入]

    不能用普通的多类交叉熵（Softmax + Cross-Entropy） 的原因：

    - Softmax 假设各类互斥，概率总和为 1，只能有一个高激活标签。

    - 多标签任务中，一个样本可以同时具有多个标签，标签之间不互斥。因此需要每个标签独立的伯努利分布，用 sigmoid + 二元交叉熵。


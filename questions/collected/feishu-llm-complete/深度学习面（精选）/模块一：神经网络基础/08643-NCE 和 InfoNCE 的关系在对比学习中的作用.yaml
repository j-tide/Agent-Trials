content:
  prompt: NCE 和 InfoNCE 的关系？在对比学习中的作用
answer:
  mode: rubric
  reference_answer: |-
    - NCE (Noise Contrastive Estimation)：通过将概率密度估计转化为二分类问题——区分真实数据样本与噪声分布生成的样本，从而避免计算繁重的归一化常数（partition function）。常用于训练语言模型等。

    - InfoNCE (Information NCE)：基于 NCE 的思想，用于最大化互信息的下界。它将正样本对看作真实数据，同一 batch 内的其他样本当作负样本，构建一个 (K+1) 分类问题，让模型从一堆样本中找出正样本。

    [图片内容未导入]

    关系：InfoNCE 是 NCE 在表示学习中的一个特例/变体，它保留了“噪声对比”的思想，但目标是最大化 正样本对之间的互信息下界。

    在对比学习中的作用：InfoNCE（如 SimCLR、MoCo、CPC）通过拉近正对、推远负对，学习到良好的特征表示。


content:
  prompt: 如何通过观察训练过程中的激活值分布来判断激活函数选择是否合理？
answer:
  mode: rubric
  reference_answer: |-
    在训练初期和训练过程中，监控每一层激活值的统计量（均值和标准差）可以诊断激活函数是否合适。具体方法：

    - 饱和神经元比例：对于 Sigmoid/Tanh，检查输出值是否经常接近 0 或 1（或 -1,1）。如果大量神经元输出接近饱和区，说明梯度很小，网络可能停止学习。理想情况下，激活值应分布在激活函数的非饱和区域。

    - 死亡神经元比例：对于 ReLU 系列，统计输出恒为 0 的神经元比例。如果某个神经元在整个批次中对所有样本都输出 0，它可能已“死亡”。过高的死亡比例（如 >20%）表明学习率过大或初始化不当，应考虑 Leaky ReLU 或调整超参数。

    - 均值与方差：理想状态下，各层输出的均值应接近 0（对于零中心激活），方差保持在合理范围（如 1 左右），并在各层之间大致恒定。如果方差逐层急剧减小（趋向 0）或增大（爆炸），说明初始化或激活函数选择有问题。可以使用 TensorBoard 等工具绘制各层激活值的直方图随训练步数的变化。

    - 梯度范数：监控各层权重的梯度范数。如果某些层的梯度范数始终远小于其他层，可能是激活函数导致的梯度消失。

    通过上述观察，可以及时调整激活函数类型（如从 Sigmoid 换为 ReLU）或调整初始化方法、学习率等。

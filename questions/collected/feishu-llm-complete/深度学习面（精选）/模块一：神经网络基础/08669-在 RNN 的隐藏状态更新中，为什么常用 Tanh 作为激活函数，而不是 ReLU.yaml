content:
  prompt: 在 RNN 的隐藏状态更新中，为什么常用 Tanh 作为激活函数，而不是 ReLU？
answer:
  mode: rubric
  reference_answer: |-
    - 输出范围受控：RNN 隐藏状态会循环更新，若使用 ReLU，输出可能无限增长，导致数值爆炸。Tanh 输出限制在 (-1,1)，防止激活值在时间步中发散。

    - 零中心化：Tanh 输出均值接近0，利于循环权重更新，避免偏置漂移。

    - 梯度稳定：虽然 Tanh 仍有饱和区，但配合门控机制（如 LSTM/GRU）可以缓解。ReLU 在 RNN 中若学习率不当，容易因循环连接使输出持续为正，导数恒为1，导致梯度爆炸。而 Tanh 的最大导数为1，且在正负区间对称，对循环连接更友好。

    - 经验与理论：LSTM 原始设计中，单元状态更新使用 Tanh，门控使用 Sigmoid，实践效果良好。

    不过也有研究者尝试使用 ReLU+ 梯度裁剪或 ReLU 变体，但 Tanh 仍是 RNN 隐藏激活的主流。

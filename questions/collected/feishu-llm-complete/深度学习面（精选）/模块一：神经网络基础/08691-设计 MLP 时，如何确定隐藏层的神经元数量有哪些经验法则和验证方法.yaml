content:
  prompt: 设计 MLP 时，如何确定隐藏层的神经元数量？有哪些经验法则和验证方法？
answer:
  mode: rubric
  reference_answer: |-
    隐藏层神经元数量是影响模型容量和泛化性能的关键超参数。神经元过少会导致欠拟合，无法捕捉数据中的复杂模式；神经元过多则容易过拟合，且增加计算开销。确定方法结合了经验法则和实验验证：

    经验法则：

    - 介于输入与输出维度之间：一个古老的规则是隐藏层神经元数量取输入层和输出层维度的平均值。

    - 金字塔形：对于深层网络，每层神经元数量逐渐减少，形成压缩表示。

    - 基于样本量：模型总参数量应远小于训练样本数，以避免严重过拟合。通常参数量与样本量之比小于 1:10。

    - “足够大”原则：在实践中，往往先选择一个较大的神经元数量（如 128 或 256），再通过正则化（如 Dropout、权重衰减）控制过拟合，因为现代优化器能较好地处理过参数化网络。

    验证方法：

    - 网格搜索/随机搜索：在一定范围内（如 [32, 64, 128, 256]）尝试不同配置，使用交叉验证评估验证集性能，选择验证误差最小的配置。

    - 学习曲线分析：逐渐增加神经元数量，观察训练集和验证集的损失。当验证损失停止下降或开始上升时，即为合适的容量。

    - 正则化配合：在使用 Dropout 等正则化时，神经元数量可以设得稍大，通过 Dropout 概率来控制有效容量。

    - 预训练与剪枝：先训练一个较大的网络，然后通过剪枝移除不重要的神经元，得到一个更紧凑的模型。

    最终，神经元数量的选择是任务相关的。对于复杂的图像或文本任务，往往需要数百甚至上千个神经元；对于简单的表格数据，几十个神经元可能就足够。

content:
  prompt: torch.mm、torch.matmul 和 @ 运算符的使用场景有何异同？
answer:
  mode: rubric
  reference_answer: |-
    - torch.mm(a, b)：严格用于两个二维矩阵的乘法。这是最底层的矩阵乘操作，要求输入必须为2维。

    - torch.matmul(a, b) 或 a @ b：是通用的矩阵乘法，完全等价于 @ 运算符。它可以自动处理更高维度的张量，遵循广播规则并进行批矩阵乘法。这是日常代码中的首选。

    ```python
    # 二维矩阵
    a = torch.randn(3, 4); b = torch.randn(4, 5)
    r1 = torch.mm(a, b)
    r2 = torch.matmul(a, b)  # 与 r1 相同

    # 批矩阵乘法：形状 (batch, 3, 4) 和 (batch, 4, 5)
    a_batch = torch.randn(10, 3, 4); b_batch = torch.randn(10, 4, 5)
    r_batch = a_batch @ b_batch  # (10, 3, 5)
    ```

    选择建议：除非有特殊理由限制为二维，始终使用 @ 或 torch.matmul，它们更通用，能减少因维度错误导致的bug。


content:
  prompt: 在PyTorch中如何实现Transformer模型？nn.Transformer的用法。
answer:
  mode: rubric
  reference_answer: |-
    PyTorch内置了nn.Transformer模块，但通常直接使用其组件nn.TransformerEncoder和nn.TransformerDecoder更灵活。

    完整示例（序列到序列模型）：

    ```python
    import torch
    import torch.nn as nn

    class Seq2SeqTransformer(nn.Module):
        def __init__(self, src_vocab_size, tgt_vocab_size, d_model, nhead, num_encoder_layers, num_decoder_layers):
            super().__init__()
            self.src_embedding = nn.Embedding(src_vocab_size, d_model)
            self.tgt_embedding = nn.Embedding(tgt_vocab_size, d_model)
            self.pos_encoder = PositionalEncoding(d_model)  # 自定义位置编码
            encoder_layer = nn.TransformerEncoderLayer(d_model=d_model, nhead=nhead)
            self.encoder = nn.TransformerEncoder(encoder_layer, num_layers=num_encoder_layers)
            decoder_layer = nn.TransformerDecoderLayer(d_model=d_model, nhead=nhead)
            self.decoder = nn.TransformerDecoder(decoder_layer, num_layers=num_decoder_layers)
            self.fc_out = nn.Linear(d_model, tgt_vocab_size)

        def forward(self, src, tgt, src_mask, tgt_mask, memory_mask):
            src = self.pos_encoder(self.src_embedding(src))
            tgt = self.pos_encoder(self.tgt_embedding(tgt))
            memory = self.encoder(src, src_key_padding_mask=src_mask)
            output = self.decoder(tgt, memory, tgt_mask=tgt_mask, memory_key_padding_mask=memory_mask)
            return self.fc_out(output)
    ```

    注意：需要为源和目标序列创建正确的掩码（因果掩码和填充掩码）。

content:
  prompt: 如何获取当前进程的rank和总进程数？
answer:
  mode: rubric
  reference_answer: |-
    使用torch.distributed提供的API：

    ```python
    import torch.distributed as dist

    # 必须已经调用过 init_process_group
    global_rank = dist.get_rank()      # 当前进程的全局排名
    world_size = dist.get_world_size() # 总进程数
    ```

    注意：这两个函数必须在init_process_group成功调用之后才能使用，否则会抛出异常。

    在非分布式脚本中的兼容写法：

    ```python
    if torch.distributed.is_available() and torch.distributed.is_initialized():
        rank = dist.get_rank()
        world_size = dist.get_world_size()
    else:
        rank = 0
        world_size = 1
    ```

    这样可以保证代码在单卡和多卡环境下都能正常运行。


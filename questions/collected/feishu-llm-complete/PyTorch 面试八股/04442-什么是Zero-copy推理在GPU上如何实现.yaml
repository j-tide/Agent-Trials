content:
  prompt: 什么是“Zero-copy”推理？在GPU上如何实现？
answer:
  mode: rubric
  reference_answer: |-
    Zero-copy 推理是指在模型推理过程中，数据在不同处理单元（如 CPU 和 GPU，或不同进程/容器）之间传递时，无需复制数据本身，而是通过共享内存或指针传递来访问同一块物理内存，从而消除不必要的数据拷贝开销，降低延迟，提升吞吐。

    在 GPU 上的实现：

    - CPU-GPU 之间的零拷贝：

    - 跨进程/容器的零拷贝：

    - 框架层面的零拷贝：

    实现示例（PyTorch 中使用固定内存和共享内存）：

    ```python
    # 加速 CPU->GPU 传输（不是零拷贝，但减少一次拷贝）
    tensor = tensor.pin_memory()  # 锁页
    tensor = tensor.to('cuda', non_blocking=True)  # 异步拷贝

    # GPU 间共享张量（零拷贝）
    stored = tensor.storage()._new_shared_cuda(device_id)
    ```

    注意事项：零拷贝增加了内存管理的复杂性，需小心同步和生命周期问题。在构建高性能推理管道时，应结合需求评估是否真的需要零拷贝，因为现代深度学习框架的内存分配已经高度优化。

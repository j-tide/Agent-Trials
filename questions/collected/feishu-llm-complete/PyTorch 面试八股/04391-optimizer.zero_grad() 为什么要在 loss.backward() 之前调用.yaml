content:
  prompt: 2. optimizer.zero_grad() 为什么要在 loss.backward() 之前调用？
answer:
  mode: rubric
  reference_answer: |-
    因为 PyTorch 的梯度是累积的。如果不先清零，本次 backward() 计算出的梯度会与之前迭代的梯度加在一起，导致：

    - 梯度污染：模型参数更新使用了过期的梯度方向。

    - 训练不稳定：梯度量级可能异常增大，导致梯度爆炸。

    - 无法正确模拟当前batch对参数的影响。

    因此，在每次开始一个新的 mini-batch 时，必须将参数的梯度清零。optimizer.zero_grad() 遍历优化器管理的所有参数，将它们的 .grad 设为 None（或填零）。设为 None 更高效，因为它避免了额外的内存操作。

    如果在梯度累积场景下，则需要在累积期间不清零，在累积完成后、更新参数之前才清零。


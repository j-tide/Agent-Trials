content:
  prompt: FSDP与梯度检查点结合使用时有什么注意事项？
answer:
  mode: rubric
  reference_answer: |-
    FSDP 和梯度检查点结合使用极为常见，两者都是节省显存的有效手段，配置时需注意：

    - 分片粒度与检查点粒度协调：通常采用逐层（per-layer）FSDP 包裹，并对每个 Block 启用梯度检查点。这样前向完成后参数分片和激活几乎立即释放，显存节省最大化。

    - 激活生命周期：两者在显存节省上是正交和累加的，检查点丢弃激活，FSDP 释放参数分片。

    - 通信与计算重叠：反向时的重计算为 FSDP 的 All-Gather 和 Reduce-Scatter 提供更多计算时间，有助于隐藏通信延迟。

    - 配置顺序：必须在 FSDP 包裹之前启用梯度检查点。FSDP 的 auto_wrap_policy 应设为按层包裹。可调整 forward_prefetch 和 backward_prefetch 以平衡通信和计算。

    - 与混合精度兼容，重计算的激活精度与 AMP 一致。

    最佳实践：先启用 FSDP (ZeRO-3)，再逐层检查点，最后叠加上 Flash Attention，按需调整预取。


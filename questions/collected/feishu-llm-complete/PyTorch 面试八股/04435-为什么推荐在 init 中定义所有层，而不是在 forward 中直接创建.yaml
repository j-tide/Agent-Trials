content:
  prompt: 为什么推荐在 init 中定义所有层，而不是在 forward 中直接创建？
answer:
  mode: rubric
  reference_answer: |-
    这是一个工程最佳实践，而非语法限制。原因如下：

    - 参数追踪与优化：只有注册在 nn.Module 上的子模块，其参数才会被自动追踪到。如果在 forward 中临时创建 nn.Linear，其参数将不会被 model.parameters() 发现，从而无法被优化器更新，也无法正确保存和加载模型。

    - 设备一致性：通过 model.to(device) 可以自动将所有注册的子模块参数和缓冲区移动到目标设备。临时创建的层不会被移动，导致计算设备错误。

    - 可复现性与调试：init 中的定义构成了模型的完整静态图，这使得 print(model) 可以展示完整结构，便于调试和版本管理。如果层是动态创建的，模型结构将不可预测。

    - 性能：动态创建层会导致不必要的内存分配和初始化开销，尤其在循环中极慢。

    结论：模型的结构必须是确定的、可追踪的。init 就是这份确定性契约。


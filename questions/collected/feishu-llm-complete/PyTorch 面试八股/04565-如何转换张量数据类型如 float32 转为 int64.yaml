content:
  prompt: 如何转换张量数据类型？如 float32 转为 int64。
answer:
  mode: rubric
  reference_answer: |-
    使用 .to() 方法，传入目标 dtype。

    ```python
    x = torch.tensor([1.7, 2.4], dtype=torch.float32)
    y = x.to(torch.int64)  # 直接截断小数，变为 [1, 2]

    # 或者更简洁的方式
    y = x.int()  # 转换为 int32
    y = x.long() # 转换为 int64
    ```

    注意：浮点转整型是直接截断（truncate），不是四舍五入。如果需要四舍五入，应先 round() 再转换。


content:
  prompt: 2. getitem 通常返回什么格式的数据？
answer:
  mode: rubric
  reference_answer: |-
    getitem 返回的格式完全取决于任务和 collate_fn 的约定，但最常见的规范是返回一个元组 (input, target) 或字典。

    常见格式：

    - 监督学习（图像分类）：返回 (image_tensor, label)，其中 image_tensor 是 (C, H, W) 的张量，label 是整数标量。

    - 自然语言处理（文本分类）：返回 (text, label) 或预先 tokenize 的 (input_ids, attention_mask, label)。

    - 多任务/复杂场景：返回字典 {'image': img, 'mask': mask, 'label': label}，这时必须配合自定义 collate_fn 来正确堆叠字典中的每个字段。

    - 生成式任务：对于指令微调，常返回 (prompt, response) 或已经编码的 input_ids 和 labels。

    关键：getitem 返回的张量不需要具有相同大小，collate_fn 负责在 batch 维度进行填充或拼接。

    ```python
    def __getitem__(self, idx):
        img = self.load_image(idx)          # (3, 224, 224)
        label = self.labels[idx]
        return img, label
    ```

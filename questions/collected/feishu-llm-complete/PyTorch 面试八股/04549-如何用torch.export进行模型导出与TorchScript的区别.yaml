answer:
  mode: rubric
  reference_answer: |-
    torch.export (PyTorch 2.0+) 提供基于 AOT (Ahead-Of-Time) 编译 的导出方案，生成严格的静态图，与 torch.jit.trace/script 的对比如下：

    [嵌入表格未展开]

    使用示例：

    ```python
    import torch
    model = MyModel()
    example_input = (torch.randn(1, 3, 224, 224),)
    exported_program = torch.export.export(model, example_input)
    # 保存
    torch.export.save(exported_program, "model.pt2")
    ```

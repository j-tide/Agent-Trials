content:
  prompt: 什么是计算图的可微性？哪些操作会导致不可导？
answer:
  mode: rubric
  reference_answer: |-
    可微性是指一个函数在给定点处存在导数，其计算图中所有操作必须支持链式法则的梯度传递。PyTorch的自动求导引擎要求图中的每一个 Function 都实现了 backward() 方法。

    导致不可导的常见操作：

    - 非连续操作：如 x.round()、x.int()、x == y（布尔运算），这些操作在数学上梯度为零或未定义（阶跃函数）。

    - 原位修改：对需要梯度的叶子张量进行 x[0] = new_val 或 x.add_(1) 等操作，会破坏计算图历史。

    - 索引赋值：x[idx] = val 在反向传播时可能无法正确传递梯度（除非使用 index_put 等特定实现）。

    - 直接使用 Python 原生控制流：只要操作本身是可微的PyTorch操作，if 和 for 不破坏可微性。

    处理：对于不可导操作，PyTorch 会尝试给出一个近似梯度，或者直接报错。在自定义 Function 时，你需要手动为不可导操作定义一个合理的反向梯度（例如直通估计 STE）。


content:
  prompt: 如何为训练数据集建立高效的TFRecord或WebDataset格式？
answer:
  mode: rubric
  reference_answer: |-
    - TFRecord (TensorFlow原生格式)：使用 tensorflow.io.TFRecordWriter。首先将数据序列化为 tf.train.Example，然后写入文件。PyTorch 可通过 tf.data.TFRecordDataset 读取，但跨框架不推荐。

    - WebDataset：基于 tar 文件存储，非常适合 PyTorch 大数据集流式训练。

    ```python
    import webdataset as wds
    # 写入：将样本保存为图片和标签并打包成 tar
    # 读取
    dataset = wds.WebDataset("data-{0000..0099}.tar").decode("torchrgb").to_tuple("jpg;png", "cls")
    loader = torch.utils.data.DataLoader(dataset, batch_size=32)
    ```

    - WebDataset 支持直接从云存储流式加载，内置混洗和分布式支持。

    选择建议：如果只使用 PyTorch，优先选择 WebDataset；如果需要跨框架，TFRecord 格式更通用。


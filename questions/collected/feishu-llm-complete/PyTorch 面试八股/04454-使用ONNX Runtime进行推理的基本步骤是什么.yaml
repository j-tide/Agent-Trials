content:
  prompt: 使用ONNX Runtime进行推理的基本步骤是什么？
answer:
  mode: rubric
  reference_answer: |-
    ONNX Runtime（ORT）是一个高性能的跨平台推理引擎，用于运行ONNX模型。

    基本步骤：

    - 安装 ONNX Runtime：pip install onnxruntime 或 pip install onnxruntime-gpu（GPU版）

    - 加载模型并创建推理会话：

    ```python
    import onnxruntime as ort

    # 创建推理会话
    session = ort.InferenceSession("model.onnx", providers=['CUDAExecutionProvider', 'CPUExecutionProvider'])
    ```

    - 准备输入数据：输入必须是与导出时同名的字典（或列表），值为numpy数组，数据类型应与模型要求匹配。

    ```python
    # 假设模型输入名为 'input'，形状 (1, 3, 224, 224)
    input_data = np.random.randn(1, 3, 224, 224).astype(np.float32)
    inputs = {'input': input_data}
    ```

    - 执行推理：

    ```python
    outputs = session.run(None, inputs)  # None表示获取所有输出
    # 或者指定输出名称：session.run(['output_name'], inputs)
    ```

    - 后处理：outputs 是列表，每个元素对应一个模型输出，可直接用于后续处理。

    高级用法：

    - 可以使用 session.get_inputs() 和 session.get_outputs() 获取输入/输出的名称、形状和类型信息。

    - 对于动态输入，不需要特殊设置，ORT会根据实际传入的数组大小动态分配。

    - 优化选项：可启用图优化、精度选择等，例如 session_options.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL。

content:
  prompt: nn.Linear的权重矩阵形状是怎样的？偏置呢？
answer:
  mode: rubric
  reference_answer: |-
    对于 nn.Linear(in_features, out_features, bias=True)：

    - 权重矩阵 weight：形状为 (out_features, in_features)，数据类型默认 float32。前向计算为 y=xWT+by=xWT+b，其中输入 xx 形状为 (*, in_features)。权重矩阵存储的是 W，而 PyTorch 使用 W^T 进行乘法以优化内存布局。

    - 偏置 bias：形状为 (out_features,)，是一个一维向量。如果 bias=False，则此属性为 None。

    内部存储：weight 的形状确实是 (out_features, in_features)。可以通过 print(layer.weight.shape) 验证。


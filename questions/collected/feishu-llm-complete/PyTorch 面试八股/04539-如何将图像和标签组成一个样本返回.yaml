content:
  prompt: 如何将图像和标签组成一个样本返回？
answer:
  mode: rubric
  reference_answer: |-
    最直接的方式是在 getitem 中读取图像并转换成张量，然后与标签一起打包成元组返回。

    ```python
    from PIL import Image
    import torch

    class ImageDataset(Dataset):
        def __init__(self, image_paths, labels, transform=None):
            self.image_paths = image_paths
            self.labels = labels
            self.transform = transform

        def __len__(self):
            return len(self.image_paths)

        def __getitem__(self, idx):
            img = Image.open(self.image_paths[idx]).convert('RGB')
            if self.transform:
                img = self.transform(img)   # 返回 Tensor (C, H, W)
            label = self.labels[idx]
            return img, label               # 元组形式
    ```

    进阶：如果需要返回多个辅助信息（如文件名、边界框），可以返回字典，并在 collate_fn 中处理。


content:
  prompt: 为什么非叶子节点默认不保留 .grad？如何强制保留？
answer:
  mode: rubric
  reference_answer: |-
    如上所述，这是为了节省内存。中间张量的数量往往极其庞大，保留它们的梯度会迅速耗尽 GPU 显存。

    强制保留的方法：

    - 在计算之前，对期望保留梯度的非叶子张量调用 .retain_grad()。这样在反向传播后，其 .grad 不会被自动释放，可以用于调试或可视化。

    - 但是，除非有特殊分析需求，否则应避免在常规训练中使用，以免造成内存泄漏。

    x = torch.randn(3, requires_grad=True)
    y = x * 2
    y.retain_grad()  # 强制保留 y 的梯度
    loss = y.sum()
    loss.backward()
    print(y.grad)    # tensor([1., 1., 1.])

  prompt: 综合实战：设计一个从数据处理、模型训练到部署的全流程方案，针对一个实际业务场景。
answer:
  mode: rubric
  reference_answer: |-
    业务场景：基于电商评论的情感分析，判断用户对商品的正负向情感。

    全流程设计：

    - 数据层：

    - 模型层：

    - 训练层：

    - 优化与导出：

    - 部署：

    - 持续迭代：

    关键点：整个流程强调自动化和可观测性，确保模型能够稳定地持续优化。

    - 使用量化：将FP32模型量化为INT8，减小模型体积，加快推理。

    - 选择WebGL后端：如果设备支持，可启用GPU加速。

    - 使用ONNX图优化：在导出前进行常量折叠等优化。

    - 设置最大batch size、工作空间大小、精度模式（FP32, FP16, INT8）。

    - 对于INT8，需要提供校准数据集来收集激活值的范围。

    - 通过builder.build_serialized_network生成一个优化后的引擎文件（.plan或.engine）。

    - 收集带标签的评论数据，存储为 CSV/Parquet。

    - 使用 torchtext 或 transformers 的 tokenizer 进行分词、构建词表（或直接使用预训练BERT tokenizer）。

    - 实现自定义 Dataset 和流式加载 DataLoader，支持多进程。

    - 选用 ALBERT 等轻量预训练模型，冻结底层，只微调顶层 classifier。

    - 使用 transformers.AutoModelForSequenceClassification 加载，或自己用 PyTorch 搭建 LSTM+Attention 分类器。

    - 训练循环中包含：混合精度、梯度累积、学习率 warmup + cosine decay。

    - 监控准确率、F1-score（使用 torchmetrics）。

    - 使用 W&B 记录实验，并开启 torch.profiler 定位瓶颈。

    - 对模型进行动态量化（quantize_dynamic）以减小尺寸。

    - 导出为 TorchScript 或 ONNX，并进行图优化。

    - 若部署到移动端，进一步转换为 TFLite。

    - 使用 TorchServe 或 Triton Inference Server 搭建在线 API，启用动态 batching。

    - 容器化（Docker），通过 K8s 部署，配置自动扩缩容。

    - 设置输入过滤（防SQL注入）和输出监控。

    - 收集线上用户反馈（点赞/点踩），构建数据飞轮。

    - 定期将 Bad Case 加入训练集，自动触发模型重训（MLOps管道）。

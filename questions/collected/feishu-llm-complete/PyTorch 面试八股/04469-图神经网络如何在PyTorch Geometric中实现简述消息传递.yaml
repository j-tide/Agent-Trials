content:
  prompt: 图神经网络如何在PyTorch Geometric中实现？简述消息传递。
answer:
  mode: rubric
  reference_answer: |-
    PyTorch Geometric (PyG) 是图神经网络的常用库。其核心抽象是 MessagePassing 基类，通过 消息传递范式 实现节点表示更新。范式分三步：

    - 消息计算：对每条边 (j → i)，利用源节点 j 和目标节点 i 的特征计算消息 m_ji。

    - 消息聚合：对目标节点 i，聚合所有来自邻居的消息（例如求和、平均、最大值）。

    - 节点更新：根据聚合后的消息和节点自身特征更新节点表示。

    以下实现一个简单的图卷积层（GraphConv）：

    ```python
    import torch
    from torch_geometric.nn import MessagePassing

    class SimpleGCN(MessagePassing):
        def __init__(self, in_channels, out_channels):
            super().__init__(aggr='add')  # 聚合方式为求和
            self.lin = torch.nn.Linear(in_channels, out_channels)

        def forward(self, x, edge_index):
            # x: 节点特征 (N, in_channels)
            # edge_index: 边列表 (2, E)
            return self.propagate(edge_index, x=x)  # 触发消息传递

        def message(self, x_j):
            # x_j: 源节点的特征 (E, in_channels)
            return x_j

        def update(self, aggr_out):
            # aggr_out: 聚合后的消息 (N, in_channels)
            return self.lin(aggr_out)
    ```

    使用时，构建 Data 对象（包含 x, edge_index, y），然后像普通模块一样训练。


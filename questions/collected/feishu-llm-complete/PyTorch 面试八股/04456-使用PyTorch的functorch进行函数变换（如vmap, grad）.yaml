content:
  prompt: 使用PyTorch的“functorch”进行函数变换（如vmap, grad）。
answer:
  mode: rubric
  reference_answer: |-
    functorch 提供函数变换工具，可对 PyTorch 函数进行矢量化、求导等操作。

    - vmap：将单个样本的操作自动扩展为批量操作，无需改写循环。

    ```python
    import torch.func as F
    def predict(x, w):
        return x @ w
    batch_predict = F.vmap(predict, in_dims=(0, None))  # 沿x的batch维度映射，w共享
    outputs = batch_predict(X_batch, weight)
    ```

    grad：计算标量函数对输入的梯度。

    ```python
    grad_fn = F.grad(torch.sum)  # 求某个函数的梯度
    grads = grad_fn(x)
    ```

    - 组合使用：vmap(grad(func)) 可一次性计算多个输入样本的梯度。

    适用场景：需要编写无状态的纯函数逻辑，自动批量化；或者计算 per-sample gradient 用于隐私保护训练。


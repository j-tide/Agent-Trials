content:
  prompt: 7. retain_graph=True 的作用是什么？什么场景下必须使用？
answer:
  mode: rubric
  reference_answer: |-
    retain_graph 是 backward() 的一个参数。默认 False，反向传播完成后，计算图会被销毁，以释放内存。如果需要在一次反向传播后再次对同一个计算图执行 backward()（例如计算高阶梯度，或者多个损失共享部分网络），就必须设置 retain_graph=True。

    必须使用的场景：

    - 计算高阶导数：例如 torch.autograd.grad 或 backward() 两次。

    - 多个损失函数共享同一个子网络：如果你有 loss1 和 loss2，它们都依赖于同一个中间输出，但需要分别反向传播。此时对 loss1.backward(retain_graph=True)，然后对 loss2.backward()。

    注意：滥用 retain_graph=True 会导致计算图一直占用内存，如果循环中频繁调用会造成显存泄漏。一般只在必要时使用，且任务结束后及时释放（例如手动删除张量或进入下一轮迭代）。


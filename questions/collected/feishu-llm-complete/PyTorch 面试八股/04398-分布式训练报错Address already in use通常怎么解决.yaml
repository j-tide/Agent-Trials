content:
  prompt: 7. 分布式训练报错“Address already in use”通常怎么解决？
answer:
  mode: rubric
  reference_answer: |-
    该错误表示指定端口已被占用。

    解决方法：

    - 更换端口号：换一个未被占用的端口，例如将 MASTER_PORT 从 29500 改为 12356。

    - 杀掉占用进程：使用 lsof -i :端口号 找出 PID，然后 kill -9 PID。

    - 设置随机或自动分配端口：在启动脚本中设置 MASTER_PORT 为一个随机数。

    - 检查并杀死残留进程：用 ps aux | grep python 检查并杀死所有残留的训练进程。

    - 确认 init_method 配置正确：如果使用 tcp://，确保 IP 正确且端口未被防火墙阻塞。使用 torchrun 的 --rdzv_endpoint 可自动管理端口。


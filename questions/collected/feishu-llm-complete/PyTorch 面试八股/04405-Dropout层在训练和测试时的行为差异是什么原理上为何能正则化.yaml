content:
  prompt: Dropout层在训练和测试时的行为差异是什么？原理上为何能正则化？
answer:
  mode: rubric
  reference_answer: |-
    训练时：以概率 p 随机置零神经元，并对幸存元素放大 1/(1−p)倍。
    测试时：所有神经元激活，不缩放，等效于集成模型的平均。

    正则化原理：训练时相当于随机丢弃部分神经元，训练多个子网络，测试时融合这些子网络，减少过拟合；同时打破神经元间的共适应，提升鲁棒性。


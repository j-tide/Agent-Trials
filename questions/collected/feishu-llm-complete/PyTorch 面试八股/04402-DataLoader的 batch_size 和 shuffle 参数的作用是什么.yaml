content:
  prompt: DataLoader的 batch_size 和 shuffle 参数的作用是什么？
answer:
  mode: rubric
  reference_answer: |-
    - batch_size：指定每个批次包含的样本数量。DataLoader 会从数据集中提取多个样本，通过 collate_fn 堆叠成一个批次，然后返回。它直接决定了每次模型前向传播的输入规模，影响显存占用和训练效率。

    - shuffle：布尔值，决定是否在每个 epoch 开始时随机打乱数据顺序。

    - 训练集通常设置为 True，以打破样本间的关联，提升模型泛化能力。

    - 验证集和测试集通常设置为 False，以保证评估结果的可复现性和一致性。

    深入细节：

    - shuffle=True 时，DataLoader 内部使用 RandomSampler 生成随机索引；shuffle=False 时使用 SequentialSampler 顺序索引。

    - 打乱操作消耗 CPU 内存，对于极大数据集，可以考虑使用 IterableDataset 配合外部混洗。


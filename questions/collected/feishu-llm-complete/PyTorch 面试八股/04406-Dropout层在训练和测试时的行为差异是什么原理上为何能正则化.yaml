content:
  prompt: Dropout层在训练和测试时的行为差异是什么？原理上为何能正则化？
answer:
  mode: rubric
  reference_answer: |-
    行为差异：

    - 训练时：Dropout 以概率 p 随机将输入元素置零，并对幸存元素乘以 11−p1−p1（即缩放），以保持期望值不变。

    - 测试时：Dropout 层失效，不丢弃任何元素，也不进行缩放，直接透传。

    正则化原理：

    - 集成学习视角：每次训练时随机丢弃部分神经元，相当于训练了多个不同的子网络。测试时相当于这些子网络的模型平均，能减少过拟合。

    - 减少神经元共适应：Dropout 阻止神经元之间形成复杂的、仅依赖于特定其他神经元的“协同关系”，迫使每个神经元学习到更鲁棒、更独立的特征表示。

    - 数据噪声注入：在训练中引入噪声，提升模型泛化能力。


  prompt: 交叉熵损失nn.CrossEntropyLoss内部包含了什么操作？输入有什么要求？
answer:
  mode: rubric
  reference_answer: |-
    内部组合了 LogSoftmax 和 NLLLoss。

    输入要求：

    - 预测值：原始logits，形状 (N, C)，无需经过softmax。

    - 目标值：类别索引，形状 (N,)，每个值在 [0, C-1] 内。

    示例：

    ```python
    loss_fn = nn.CrossEntropyLoss()
    logits = torch.randn(10, 5)
    targets = torch.randint(0, 5, (10,))
    loss = loss_fn(logits, targets)
    ```

    注意网络最后一层不应加激活，直接输出logits以保证数值稳定性。

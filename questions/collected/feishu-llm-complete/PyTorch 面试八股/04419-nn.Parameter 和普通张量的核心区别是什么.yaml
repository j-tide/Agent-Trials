content:
  prompt: nn.Parameter 和普通张量的核心区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    核心区别：nn.Parameter 是一个 Tensor，但会被自动添加到 nn.Module 的参数列表中。

    - 注册与优化：当将一个张量赋值给 nn.Module 的一个属性时，若该张量是 nn.Parameter，它会被模块自动追踪，并通过 model.parameters() 暴露给优化器。普通张量则被忽略。

    - 设备与类型转换：nn.Parameter 会随 model.to(device) 或 model.float() 自动转换设备和数据类型；普通张量不会。

    - 保存与加载：nn.Parameter 会被 model.state_dict() 和 torch.save 自动保存和恢复；普通张量不会，必须手动处理。

    示例：

    ```python
    class MyModel(nn.Module):
        def __init__(self):
            super().__init__()
            self.W = nn.Parameter(torch.randn(10, 5))  # 可训练参数
            self.x = torch.randn(10)  # 普通张量，不会被优化
    ```

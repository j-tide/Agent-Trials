content:
  prompt: torch.autograd.grad 和 .backward() 在功能上有何异同？
answer:
  mode: rubric
  reference_answer: |-
    - loss.backward()：直接计算梯度并累加到叶子节点的 .grad 属性中。它自动遍历整个图，不需要指定输出和输入。适合标准训练。

    - torch.autograd.grad(outputs, inputs)：返回计算出的梯度列表，不会修改叶子节点的 .grad。它需要明确指定输出和输入，更灵活，可用于高阶导数和非标量输出的情况。

    示例对比：

    x = torch.randn(3, requires_grad=True)
    y = x * 2
    loss = y.sum()

    # 使用 backward()
    loss.backward()
    print(x.grad)  # tensor([2., 2., 2.])

    x.grad = None  # 清空梯度

    # 使用 autograd.grad
    grads = torch.autograd.grad(loss, x)
    print(grads[0])  # tensor([2., 2., 2.])
    print(x.grad)    # None，x.grad 未被修改

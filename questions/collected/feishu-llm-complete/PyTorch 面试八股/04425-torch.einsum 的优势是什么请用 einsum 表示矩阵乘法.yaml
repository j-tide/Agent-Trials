content:
  prompt: torch.einsum 的优势是什么？请用 einsum 表示矩阵乘法。
answer:
  mode: rubric
  reference_answer: |-
    torch.einsum 使用爱因斯坦求和约定，通过一个简洁的字符串表达式定义张量操作，可以清晰地表示矩阵乘法、转置、点积、批量乘、收缩等多种运算，避免了繁琐的维度变换和乘法调用。它的优势在于代码可读性高、表达能力强，且现代 PyTorch 对 einsum 进行了高度优化，性能不输给传统的组合操作。

    矩阵乘法（A @ B）用 einsum 表示：
    假设 A 形状 (i, j)，B 形状 (j, k)，则 C = A @ B 的 einsum 写法为 "ij,jk->ik"。

    ```python
    A = torch.randn(3, 4)
    B = torch.randn(4, 5)
    C = torch.einsum('ij,jk->ik', A, B)  # 等价于 A @ B
    ```

    - ij 表示 A 的两个维度，分别命名为 i 和 j。

    - jk 表示 B 的两个维度，命名为 j 和 k。

    - ->ik 表示输出维度为 i 和 k，消失的 j 维度会被求和（收缩）。

    其他常见操作：

    - 转置：ij->ji

    - 点积：i,i->

    - 批量矩阵乘：bij,bjk->bik

    对于复杂张量操作（如注意力机制的 QK^T 计算），einsum 让代码的数学意图一目了然。


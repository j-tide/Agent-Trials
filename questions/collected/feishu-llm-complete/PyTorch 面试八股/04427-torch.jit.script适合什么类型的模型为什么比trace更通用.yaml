content:
  prompt: torch.jit.script适合什么类型的模型？为什么比trace更通用？
answer:
  mode: rubric
  reference_answer: |-
    torch.jit.script 适合包含动态控制流、复杂数据结构、依赖数据的逻辑判断的模型。例如：

    - 自然语言处理中的RNN/LSTM，其循环次数依赖于输入序列长度。

    - 基于注意力机制的模型，其中可能存在根据注意力权重进行的动态mask或条件分支。

    - 任何包含 if, while, for 等Python控制流，并且这些控制流依赖于张量数值的模型。

    - 使用了递归或树结构的模型（如Tree-LSTM）。

    为什么比trace更通用？
    script 直接解析Python源代码的抽象语法树（AST），将其编译为TorchScript的中间表示。它不依赖于实际运行一次样例输入，因此能够完整地保留模型定义中的所有逻辑，包括所有可能的分支和循环。script 从根本上解决了 trace 无法处理数据依赖控制流的问题。只要代码语法被TorchScript支持（大部分Python子集），script 就能将其忠实地转换为静态图。

    script 的限制：

    - 并非所有Python语法都支持，比如生成器、异常处理、部分高级特性可能不被接受。

    - 对于非常庞大的模型，编译时间可能较长。

    - 需要确保代码符合TorchScript的类型系统，有时需要添加类型注解（torch.jit.script 装饰器或函数调用会自动推断）。

    因此，script 在灵活性上远胜于 trace，是处理动态逻辑的首选。在实际项目中，可以将两者结合：用 script 编写包含控制流的子模块，再用 trace 或 script 封装整体。

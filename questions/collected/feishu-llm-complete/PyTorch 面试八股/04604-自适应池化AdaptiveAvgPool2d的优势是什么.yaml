content:
  prompt: 自适应池化AdaptiveAvgPool2d的优势是什么？
answer:
  mode: rubric
  reference_answer: |-
    可以指定输出尺寸 (H_out, W_out)，内部自动计算所需的池化核和步长，使得无论输入特征图尺寸如何，输出尺寸固定。

    优势：简化网络设计，使网络可接受任意尺寸输入；避免繁琐的尺寸计算；常用于全局平均池化（如ResNet最后输出1×1特征）。


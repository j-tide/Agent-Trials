content:
  prompt: 如何使用PyTorch的弹性训练功能？torch.distributed.elastic。
answer:
  mode: rubric
  reference_answer: |-
    弹性训练（Elastic Training）允许分布式训练任务在运行时动态适应节点数目的变化（例如因抢占式实例回收或节点故障导致节点减少，或集群扩容时节点增加），而无需从头开始训练。PyTorch提供了torch.distributed.elastic模块来支持这一功能。

    核心组件：

    - torchrun (或 torch.distributed.run)：弹性启动器，它会自动设置环境变量，监控节点的变化，并管理进程的创建和销毁。

    - DynamicRendezvousHandler：负责动态节点发现和同步。它使用一个“会合点”（rendezvous）作为协调中心，允许节点加入和离开。

    - ElasticAgent：负责每个节点上的本地进程管理，包括启动、监控和重启工作进程。

    使用步骤：

    - 编写训练脚本：脚本中只需包含标准的分布式训练逻辑，无需处理节点变化。通过环境变量获取WORLD_SIZE、RANK、LOCAL_RANK等信息。关键是要能从检查点恢复训练。

    - 使用torchrun启动：

    ```bash
    torchrun --nnodes=1:4 --nproc_per_node=8 \
             --max_restarts=3 --rdzv_id=job1 --rdzv_backend=c10d \
             --rdzv_endpoint=localhost:12345 \
             train.py
    ```

    - --nnodes：指定节点数的范围，如1:4表示最少1个节点，最多4个节点。

    - --rdzv_backend和--rdzv_endpoint：指定会合后端的类型和地址，用于节点发现和协调。

    - --max_restarts：进程组在失败后可重启的最大次数。

    - 在训练脚本中处理弹性环境：

    ```python
    import torch.distributed.elastic.multiprocessing.errors as errors

    @errors.record
    def main():
        # 标准分布式初始化
        torch.distributed.init_process_group(backend='nccl')
        # ... 训练循环 ...
    if __name__ == "__main__":
        main()
    ```

    使用@errors.record装饰器可以捕获由于节点变化导致的进程错误，并打印出诊断信息。

    - 支持动态成员变更：当节点数量发生变化时，torchrun会自动杀死旧的工作进程，重新初始化分布式环境（新的world_size），并重新启动训练脚本。训练脚本需要能够从最新的检查点恢复，从而在新的节点规模下继续训练。

    训练脚本内部的关键逻辑：

    - 使用DistributedSampler并设置正确的epoch和shuffle。

    - 在每个epoch或固定步数后保存检查点，包括模型、优化器、学习率调度器和数据加载器的状态（如sampler的epoch）。

    - 在启动时检查是否存在检查点，若存在则加载并恢复，同时根据当前的world_size重新构建数据加载器和模型（若使用了模型并行需重新分区）。

    优势：

    - 容错性：节点失效时自动重启训练，减少人工干预。

    - 成本优化：可利用抢占式实例，当实例被回收时自动迁移到新节点。

    - 动态扩缩容：当集群有空闲资源时自动增加训练节点，提高训练速度。

    注意事项：

    - 弹性训练要求底层存储（如NFS、对象存储）对所有节点可达，以便共享检查点。

    - 对于大规模模型，模型并行策略（如TP/PP）通常固定不变，弹性主要体现在数据并行的节点数变化。若需改变模型并行度，通常需要更复杂的重分片逻辑，PyTorch弹性目前主要支持数据并行的弹性。


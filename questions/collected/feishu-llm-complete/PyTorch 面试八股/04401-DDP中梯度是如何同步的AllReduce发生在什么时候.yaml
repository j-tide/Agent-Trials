content:
  prompt: DDP中梯度是如何同步的？AllReduce发生在什么时候？
answer:
  mode: rubric
  reference_answer: |-
    在DDP中，梯度同步通过All-Reduce操作完成，该操作将每个进程的本地梯度张量求和或求平均，并让所有进程得到相同的结果。

    发生时机：
    DDP采用自动微分的Hook机制，在反向传播过程中，每当计算完一个参数的梯度，autograd引擎就会触发为该参数注册的Hook。DDP的Hook会立即启动对该参数的异步All-Reduce。这意味着通信与计算可以重叠：当模型后面层的梯度还在计算时，前面层的梯度已经在同步了。所有同步完成后，每个进程拥有了全局平均的梯度。

    同步算法的选择：
    默认使用NCCL的All-Reduce，底层通常是高效的Ring All-Reduce算法。它将所有GPU组成一个逻辑环，梯度被分割成小块，在环上并行传输和累加，最后广播。这种方法通信量约为2 * (N-1) / N * 数据量，效率极高。

    梯度的平均：
    All-Reduce默认对梯度求和，但为了保持全局batch size的语义，DDP在backward后会自动将求和结果除以world_size，得到平均梯度。这样，无论使用多少GPU，参数更新的量级与大batch训练一致。

    图示流程：

    - loss.backward()触发反向传播。

    - 计算第L层梯度。

    - DDP Hook自动异步启动第L层梯度的All-Reduce。

    - 继续计算第L-1层梯度，同时第L层的通信正在进行。

    - ... ...

    - 所有层梯度同步完成，每个进程拥有完全相同的平均梯度。


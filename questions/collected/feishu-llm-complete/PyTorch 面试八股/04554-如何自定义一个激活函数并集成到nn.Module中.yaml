  prompt: 如何自定义一个激活函数并集成到nn.Module中？
answer:
  mode: rubric
  reference_answer: |-
    继承 nn.Module 并实现 forward 方法。如果需要可学习参数，在 init 中定义 nn.Parameter。

    ```python
    class Swish(nn.Module):
        def forward(self, x):
            return x * torch.sigmoid(x)
    ```

    使用时像其他层一样实例化并调用。


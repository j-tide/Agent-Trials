    Transformer为何使用LayerNorm？

    - Transformer 处理的序列长度通常可变，且 batch size 有时无法很大（尤其大模型），BatchNorm 在 batch 维度上统计不稳定。

    - LayerNorm 对每个样本单独归一化，保持样本间的独立性，适合自回归模型（需要防止信息泄露）。

    - LayerNorm 更适用于自然语言处理中的特征维度（hidden_size），计算效率高，且已被证明能提升Transformer训练稳定性。


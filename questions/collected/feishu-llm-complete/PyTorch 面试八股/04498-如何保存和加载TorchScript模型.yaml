  reference_answer: |-
    保存和加载TorchScript模型非常简单，使用 torch.jit.save 和 torch.jit.load。

    保存：

    [图片内容未导入]

    注意：

    - 加载后的模型可以直接在Python环境中调用，也可以被LibTorch（C++）加载，实现跨平台部署。

    - 保存时，模型的 eval() 模式设置会被保留，因此加载后无需再次调用 .eval()。

    - 如果使用 torch.jit.save，它会保存完整的模型结构、参数和代码，加载时不再需要原始模型类定义。

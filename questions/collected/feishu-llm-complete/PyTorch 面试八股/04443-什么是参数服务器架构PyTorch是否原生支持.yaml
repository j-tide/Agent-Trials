content:
  prompt: 什么是“参数服务器”架构？PyTorch是否原生支持？
answer:
  mode: rubric
  reference_answer: |-
    参数服务器（Parameter Server, PS） 是一种经典的分布式机器学习架构，由服务器节点和工作者节点组成。参数服务器存储全局模型参数，工作者节点负责计算本地梯度，然后将梯度推送到参数服务器，服务器更新参数后，工作者再拉取最新参数。

    优缺点：

    - 优点：服务器集中管理参数，易于实现异步更新，适合计算力不均衡的异构环境。

    - 缺点：服务器成为通信和存储瓶颈（需要存储全部参数），且同步策略复杂，扩展性受限。

    PyTorch是否原生支持？
    PyTorch没有原生内置参数服务器架构。它的设计哲学是去中心化的集合通信（如DDP + NCCL），所有节点地位平等。PyTorch通过torch.distributed模块提供了基础的通信原语（send, recv, broadcast等），用户可以自己实现参数服务器逻辑，但这需要大量工作。目前主流的大规模训练已全面转向All-Reduce/ZeRO等去中心化方式，PS架构在大模型时代逐渐式微。


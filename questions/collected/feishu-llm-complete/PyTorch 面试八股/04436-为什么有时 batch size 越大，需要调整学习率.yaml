content:
  prompt: 为什么有时 batch size 越大，需要调整学习率？
answer:
  mode: rubric
  reference_answer: |-
    线性缩放法则：当 batch size 增大 K 倍时，每个参数的梯度估计更准确（噪声更小），因此可以采用更大的步长（学习率）来更新参数，而不会导致训练震荡。一个简单且广泛使用的规则是线性缩放法则：lr = base_lr * (batch_size / base_batch_size)。

    理论直觉：

    - 小 batch：梯度噪声大，每一步方向不确定，需要小步慢走，否则极易震荡。

    - 大 batch：梯度方向更接近全局最优方向，可以迈大步，加速收敛。

    注意事项：

    - 线性缩放法则仅在一定范围内有效（如 batch size 增大 4~8 倍），当 batch size 极其巨大时（如 32k+），学习率不能无限增大，需要配合 warmup 和更保守的调整。

    - 对于自适应优化器（如 Adam），学习率调整的需求不如 SGD 强烈，但一定程度的调整仍有帮助。


content:
  prompt: 叶子节点和非叶子节点在梯度保留上有何区别？
answer:
  mode: rubric
  reference_answer: |-
    - 叶子节点：直接由用户创建的、没有 grad_fn 的张量（例如 nn.Parameter 或 torch.randn(..., requires_grad=True)）。当反向传播完成后，它们的梯度被保留在 .grad 属性中，这是优化器更新参数的基础。

    - 非叶子节点：计算图中的中间结果，例如 y = x * 2 中的 y。默认情况下，反向传播完成后，非叶子节点的梯度会被立即释放，以节省内存。

    为什么这样设计？

    在深度学习中，我们通常只关心叶子节点（模型参数）的梯度，而中间节点成千上万，如果全部保留会占用大量显存。因此，PyTorch 默认仅保留叶子节点的梯度。


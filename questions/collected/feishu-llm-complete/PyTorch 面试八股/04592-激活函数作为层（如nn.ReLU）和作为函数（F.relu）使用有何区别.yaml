content:
  prompt: 激活函数作为层（如nn.ReLU）和作为函数（F.relu）使用有何区别？
answer:
  mode: rubric
  reference_answer: |-
    作为层（nn.ReLU()）是一个 nn.Module，可注册到模块树中，受 model.to() 影响；作为函数（F.relu()）是纯函数，直接操作张量，无状态。

    两者功能等价，层方式更模块化，函数方式更简洁。对于无参数激活函数，选择主要看代码风格。


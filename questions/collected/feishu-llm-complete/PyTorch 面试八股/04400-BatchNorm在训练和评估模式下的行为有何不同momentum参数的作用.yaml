content:
  prompt: BatchNorm在训练和评估模式下的行为有何不同？momentum参数的作用。
answer:
  mode: rubric
  reference_answer: |-
    训练模式：使用当前batch的均值和方差进行归一化，并更新全局 running_mean 和 running_var（指数移动平均）。
    评估模式：直接使用训练阶段积累的 running_mean 和 running_var 进行归一化，不更新。

    momentum：控制EMA更新的速度，默认0.1。值越小，全局统计量更新越慢，越依赖历史数据。


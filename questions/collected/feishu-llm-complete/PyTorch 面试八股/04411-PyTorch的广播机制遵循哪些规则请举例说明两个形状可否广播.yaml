content:
  prompt: PyTorch的广播机制遵循哪些规则？请举例说明两个形状可否广播。
answer:
  mode: rubric
  reference_answer: |-
    广播机制允许我们对形状不完全匹配的张量进行逐元素运算，而无需显式地复制数据。这极大地提升了代码的简洁性和效率。

    广播遵循两条黄金法则：

    - 尾部对齐：从右向左比较两个张量的维度。

    - 兼容则扩展：对应维度要么相等，要么其中之一为 1，或者其中一个张量没有该维度（即维度缺失）。否则，广播失败。

    举例说明：

    - 形状 (3, 1) 和 (1, 4)：可以广播。维度1是 1 和 4（满足一个为1），维度0是 3 和 1（满足一个为1）。结果是 (3, 4)。

    - 形状 (15, 3, 5) 和 (15, 1, 5)：可以广播。从右向左，维度2（5对5）和维度0（15对15）相等，维度1（3对1）满足一个为1。结果是 (15, 3, 5)。

    - 形状 (15, 3, 5) 和 (3, 5)：可以广播。(3,5) 的维度少于 (15,3,5)，规则会将其在左侧补1，变为 (1, 3, 5)，然后按规则成功广播。

    - 形状 (8, 1, 6, 1) 和 (7, 1, 5)：无法广播。从右向左，对应维度为 1 和 5（满足），6 和 1（满足），1 和 7（满足）。但接下来，(7,1,5) 没有对应 (8,1,6,1) 的第0维，此时广播会尝试将 (7,1,5) 扩展为 (1, 7, 1, 5)，其第0维是1，而另一个张量是8，两者不相等，失败。


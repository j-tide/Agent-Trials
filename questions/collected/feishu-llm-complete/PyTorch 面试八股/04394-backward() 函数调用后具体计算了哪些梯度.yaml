content:
  prompt: 3. backward() 函数调用后具体计算了哪些梯度？
answer:
  mode: rubric
  reference_answer: |-
    backward() 是自动求导引擎的入口。当调用 loss.backward() 时，引擎会执行以下步骤：

    - 从 loss 张量开始，沿着计算图反向遍历所有 Function 节点。

    - 对于每一个 Function，调用其预定义的 backward() 方法，利用链式法则计算该操作的输入梯度。

    - 将这些输入梯度传播到更早的节点，并累加到这些节点的 .grad 属性中。

    - 最终，所有 requires_grad=True 的叶子张量都会得到一个 .grad，其值等于损失函数对该叶子张量的梯度。

    注意：

    - backward() 默认只对标量损失工作。如果要对非标量张量调用 backward()，必须提供一个与调用张量形状相同的 gradient 参数，作为外部梯度。

    - 中间张量（非叶子）的梯度通常被自动释放，除非特别指定 retain_grad()。


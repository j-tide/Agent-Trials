content:
  prompt: squeeze() 和 unsqueeze() 分别实现什么功能？各举一例。
answer:
  mode: rubric
  reference_answer: |-
    - squeeze(dim)：移除张量中长度为1的维度。如果不指定dim，则移除所有长度为1的维度。

    - unsqueeze(dim)：在指定位置dim插入一个长度为1的新维度。

    应用场景实例：

    ```python
    # 图像数据: (3, 1, 256, 256)
    img = torch.randn(3, 1, 256, 256)
    # 移除长度为1的通道维度，变为 (3, 256, 256)
    img_squeezed = img.squeeze(1)
    print(img_squeezed.shape)  # torch.Size([3, 256, 256])

    # 文本数据: (seq_len, feature_dim)
    text = torch.randn(128, 512)
    # 增加一个 batch 维度，使其成为 (1, 128, 512)
    text_batched = text.unsqueeze(0)
    print(text_batched.shape)  # torch.Size([1, 128, 512])
    ```

    常见陷阱：无参数的 squeeze() 会移除所有大小为1的维度，但这可能意外移除了你希望保留的维度（例如 batch_size 恰好为1），导致形状不匹配的错误。建议总是显式指定 dim 参数。


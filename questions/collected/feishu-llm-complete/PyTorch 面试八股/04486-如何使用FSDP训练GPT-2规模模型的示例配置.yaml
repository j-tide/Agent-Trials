content:
  prompt: 如何使用FSDP训练GPT-2规模模型的示例配置。
answer:
  mode: rubric
  reference_answer: |-
    FSDP (Fully Sharded Data Parallel) 是PyTorch官方实现的ZeRO-3等效技术。以下是一个使用torch.distributed.fsdp训练GPT-2的示例配置骨架：

    ```python
    from torch.distributed.fsdp import (
        FullyShardedDataParallel as FSDP,
        MixedPrecision,
        ShardingStrategy,
        BackwardPrefetch,
        StateDictType,
    )
    from torch.distributed.fsdp.wrap import transformer_auto_wrap_policy
    from transformers import GPT2Model, GPT2Config

    # 初始化分布式
    dist.init_process_group(backend='nccl')

    # 定义GPT-2模型
    config = GPT2Config(vocab_size=50257, n_embd=768, n_head=12, n_layer=12)
    model = GPT2Model(config)

    # FSDP混合精度配置
    mp_policy = MixedPrecision(
        param_dtype=torch.bfloat16,
        reduce_dtype=torch.bfloat16,
        buffer_dtype=torch.bfloat16,
    )

    # 自动包装策略：每个Transformer Block被单独分片
    auto_wrap_policy = functools.partial(
        transformer_auto_wrap_policy,
        transformer_layer_cls={GPT2Model.transformer.h[0].__class__}
    )

    # 构造FSDP模型
    fsdp_model = FSDP(
        model,
        sharding_strategy=ShardingStrategy.FULL_SHARD,  # ZeRO-3
        auto_wrap_policy=auto_wrap_policy,
        mixed_precision=mp_policy,
        backward_prefetch=BackwardPrefetch.BACKWARD_PRE,
        device_id=torch.cuda.current_device(),
        limit_all_gathers=True,
        use_orig_params=True,  # 保持参数名与原始一致
    )

    # 之后进行标准训练循环
    ```

    说明：

    - 这里将每个Transformer层单独分片，最大化显存节省。

    - 使用BF16混合精度，优化器为AdamW。

    - 训练时务必使用torch.cuda.amp.autocast。


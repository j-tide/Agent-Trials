content:
  prompt: 使用ipdb或pdb在训练循环中设置断点调试需要注意什么？
answer:
  mode: rubric
  reference_answer: |-
    - 避免在DataLoader的多进程下使用：当num_workers > 0时，子进程中的断点会挂起进程，导致父进程无限等待，程序卡死。务必在调试时将num_workers设为0。

    - 使用条件断点：在训练循环中，你可能只想在第N个batch或loss出现异常时中断。使用pdb.set_trace()的条件判断。

    ```python
    if batch_idx == 100 and loss > 10:
        import pdb; pdb.set_trace()
    ```

    - 异常断点：使用pdb的post_mortem模式。在脚本中导入pdb，然后用python -m pdb your_script.py启动，或者用try...except包裹训练循环，在except块中调用pdb.post_mortem()，可以在程序崩溃时自动进入断点检查现场。

    - 性能影响：断点会完全暂停程序，包括GPU。在断点期间，其他依赖心跳或超时的分布式训练组件可能会误判。分布式调试建议用torch.distributed.breakpoint()（PyTorch 2.0+）或只在rank0上设置断点。


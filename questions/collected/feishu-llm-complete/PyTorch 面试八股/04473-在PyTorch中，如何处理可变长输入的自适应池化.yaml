content:
  prompt: 在PyTorch中，如何处理可变长输入的自适应池化？
answer:
  mode: rubric
  reference_answer: |-
    nn.AdaptiveAvgPool1d、AdaptiveMaxPool1d 等可将任意长度的时间/空间特征映射到固定输出大小，无需手动计算池化核和步长。对于序列数据，处理流程如下：

    ```python
    # 假设输入: (batch, channels, seq_len)
    adaptive_pool = nn.AdaptiveAvgPool1d(output_size=100)
    # 无论 seq_len 是多少，输出长度固定为 100
    output = adaptive_pool(x)  # (batch, channels, 100)
    ```

    结合RNN/Transformer处理变长序列：

    - 使用 pack_padded_sequence 和 pad_packed_sequence 减少计算浪费。

    - 在多头注意力中，通过 attention_mask 忽略填充位置。

    - 最后，用自适应池化将变长序列的编码器输出压缩为固定维度，再送入全连接层。


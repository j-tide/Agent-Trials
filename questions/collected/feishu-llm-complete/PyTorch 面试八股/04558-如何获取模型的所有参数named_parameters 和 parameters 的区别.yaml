content:
  prompt: 如何获取模型的所有参数？named_parameters 和 parameters 的区别。
answer:
  mode: rubric
  reference_answer: |-
    - model.parameters()：返回一个生成器，遍历所有可训练参数张量，但不包含参数名称。

    - model.named_parameters()：返回一个生成器，每个元素是 (name, param) 元组。名称对应于模块层级路径（例如 'fc1.weight'）。这对于选择性冻结、调试和日志记录非常有用。

    ```python
    for name, param in model.named_parameters():
        print(name, param.shape)
    ```

    重要：这两个方法默认只返回 requires_grad=True 的参数。如果需要所有参数（包括被冻结的），需显式调用 model.state_dict() 或遍历 model.modules()。


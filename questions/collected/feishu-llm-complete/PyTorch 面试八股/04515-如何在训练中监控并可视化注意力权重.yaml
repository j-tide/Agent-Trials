content:
  prompt: 如何在训练中监控并可视化注意力权重？
answer:
  mode: rubric
  reference_answer: |-
    监控注意力权重有助于理解模型的决策过程。可以在目标注意力层注册forward_hook来捕获注意力矩阵。

    ```python
    attention_weights = {}
    def save_attn_hook(module, input, output, layer_name):
        # 假设该层的输出包含注意力权重（通常需要模型返回）
        # 很多Transformer实现会返回注意力权重
        pass  # 具体实现依赖于模型结构

    # 对于HuggingFace模型，可以在调用时设置output_attentions=True
    outputs = model(inputs, output_attentions=True)
    attn = outputs.attentions  # 返回每层的注意力权重列表

    # 可视化
    import matplotlib.pyplot as plt
    import seaborn as sns
    sns.heatmap(attn[0][0, 0].detach().cpu(), cmap='Blues')
    plt.title('Head 0 attention')
    ```

    若需在训练过程中动态记录，可搭配wandb或TensorBoard，将注意力矩阵作为图像或热力图定期上传。


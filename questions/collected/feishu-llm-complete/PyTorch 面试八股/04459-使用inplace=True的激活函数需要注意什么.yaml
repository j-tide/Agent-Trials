content:
  prompt: 使用inplace=True的激活函数需要注意什么？
answer:
  mode: rubric
  reference_answer: |-
    原地操作会直接修改输入张量，可能导致反向传播时无法正确恢复前向激活值，从而报错。因此，如果张量需要梯度，不应使用原地激活，除非确保该张量之后不会再被用到。通常默认不使用 inplace=True。


content:
  prompt: PyTorch动态计算图是如何构建和释放的？
answer:
  mode: rubric
  reference_answer: |-
    PyTorch 采用动态计算图（Define-by-Run）机制，计算图在每次前向传播时动态构建，在反向传播完成后立即释放。

    构建过程：

    - 当你对一个设置了 requires_grad=True 的张量执行操作（如 +, *, mm 等），PyTorch 会创建一个对应的 Function 对象，记录该操作的输入、输出以及反向传播所需的梯度计算逻辑。

    - 这个 Function 对象被链接到输入和输出的 Tensor 上，形成一条有向无环图（DAG）。图中的节点是张量（数据）和 Function（操作），边表示数据流向。

    - 每执行一个新操作，计算图就动态增长。因为是动态的，所以图可以随 Python 控制流（如 if-else, for 循环）变化而改变形状，非常灵活。

    释放过程：

    - 当调用 .backward() 时，自动求导引擎沿着计算图反向遍历，依次计算每个 Function 的梯度，并将梯度写入参与的张量的 .grad 属性中。

    - 反向传播完成后，中间张量（非叶子节点）的梯度以及部分计算图结构通常会被释放，以节省内存。这也是为什么多次调用 .backward() 时，若不设置 retain_graph=True，图会被销毁而无法再次反向传播。

    叶子节点：直接由用户创建的、没有历史操作的张量（如 w = torch.randn(3, requires_grad=True)）是叶子节点。计算图的“输入”通常是叶子节点，它们的梯度在反向传播后被保留在 .grad 中，用于优化器更新。


content:
  prompt: 20. 如何在DDP中只同步部分参数（如不更新某些层）？
answer:
  mode: rubric
  reference_answer: |-
    冻结某些层：将这些层的 requires_grad 设为 False。DDP 会自动检测哪些参数需要梯度，并仅同步这些参数的梯度。冻结的参数不会产生梯度，也不会参与 All-Reduce。

    ```python
    for param in model.backbone.parameters():
        param.requires_grad = False
    model = DDP(model, device_ids=[local_rank])
    ```

    若希望参数需要梯度但独立更新（不同步），通常不推荐在 DDP 中这样做，因为这会导致模型不一致。可通过自定义通信钩子来跳过某些参数的同步，但实现复杂。


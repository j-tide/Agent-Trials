content:
  prompt: torch.no_grad() 和 torch.inference_mode() 在使用和性能上有什么不同？
answer:
  mode: rubric
  reference_answer: |-
    两者都用于禁用梯度计算，但 torch.inference_mode() 是更高效、更专注的版本，专门为推理场景设计。

    [嵌入表格未展开]

    使用建议：

    - 在训练循环中的验证阶段，使用 with torch.no_grad():。

    - 在模型部署/线上推理的代码中，优先使用 with torch.inference_mode():，以获得最佳的推理速度和内存效率。

    model.eval()
    with torch.inference_mode():  # 推理模式
        output = model(input_data)

content:
  prompt: 使用混合精度训练时，GradScaler 的作用是什么？
answer:
  mode: rubric
  reference_answer: |-
    GradScaler 解决 FP16 梯度下溢的问题。由于 FP16 的动态范围小，许多小梯度会变为零，导致参数无法更新。GradScaler 在反向传播前将 loss 乘以一个大的缩放因子（如 65536），使梯度整体放大到 FP16 可表示范围内，然后在更新参数前再将梯度除以该因子恢复原始量级。

    工作机制：

    - scaler.scale(loss).backward()：自动缩放损失并反向传播。

    - scaler.step(optimizer)：判断梯度是否包含 Inf/NaN，若没有，则执行 optimizer.step() 并更新缩放因子（根据需要增大）；若出现溢出，则跳过该步更新，并减小缩放因子。

    - scaler.update()：更新缩放因子的动态调整。

    这样既利用了 FP16 的加速优势，又保证了数值稳定性，避免手动调整。


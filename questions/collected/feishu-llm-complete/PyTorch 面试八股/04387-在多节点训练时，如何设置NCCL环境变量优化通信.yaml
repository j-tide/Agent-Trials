content:
  prompt: 18. 在多节点训练时，如何设置NCCL环境变量优化通信？
answer:
  mode: rubric
  reference_answer: |-
    关键 NCCL 环境变量：

    - NCCL_DEBUG=INFO：开启调试信息，用于诊断性能瓶颈。

    - NCCL_SOCKET_IFNAME：指定网络接口名称（如 eth0, bond0）。

    - NCCL_IB_DISABLE：无 InfiniBand 时设为 1，强制使用 TCP/IP。

    - NCCL_NET_GDR_LEVEL=5：启用 GPU Direct RDMA（需硬件支持），大幅降低延迟。

    - NCCL_ALGO：AllReduce 算法，通常默认 Ring。

    - NCCL_MIN_NCHANNELS：增加通道数可提高带宽利用率，但增加显存开销。

    - NCCL_CROSS_NIC=1：允许多网卡通信，提高带宽。

    在作业脚本中导出这些变量即可，例如 export NCCL_SOCKET_IFNAME=eth0。


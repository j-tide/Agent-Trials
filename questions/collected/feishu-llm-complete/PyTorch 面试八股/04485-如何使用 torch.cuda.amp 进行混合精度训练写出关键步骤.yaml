content:
  prompt: 如何使用 torch.cuda.amp 进行混合精度训练？写出关键步骤。
answer:
  mode: rubric
  reference_answer: |-
    混合精度训练自动将前向、反向中的部分计算转为 FP16，以减少显存占用并利用 Tensor Core 加速，同时保持关键部分为 FP32。

    关键步骤：

    - 创建 GradScaler：scaler = torch.cuda.amp.GradScaler()

    - 使用 autocast 上下文：在模型前向传播时包裹 with torch.cuda.amp.autocast():

    - 缩放损失并反向传播：scaler.scale(loss).backward()

    - 更新参数：scaler.step(optimizer)，然后 scaler.update()

    完整示例：

    ```python
    model = MyModel().to(device)
    optimizer = torch.optim.AdamW(model.parameters())
    scaler = torch.cuda.amp.GradScaler()

    for inputs, targets in train_loader:
        inputs, targets = inputs.to(device), targets.to(device)
        optimizer.zero_grad()

        with torch.cuda.amp.autocast():
            outputs = model(inputs)
            loss = loss_fn(outputs, targets)

        scaler.scale(loss).backward()
        scaler.step(optimizer)
        scaler.update()
    ```

    优点：显存降低30%~50%，训练速度提升（在Ampere及之后的GPU上），精度损失极小。推荐使用BF16时可直接用 torch.bfloat16 而无需 GradScaler。


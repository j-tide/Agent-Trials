content:
  prompt: 转置卷积nn.ConvTranspose2d主要应用在什么场景？
answer:
  mode: rubric
  reference_answer: |-
    主要用于上采样和生成模型，将低分辨率特征图恢复到高分辨率，如：

    - 图像分割（U-Net解码器）

    - GAN的生成器

    - 自编码器的解码器

    它不是卷积的逆运算，而是通过学习得到核的矩阵转置实现上采样。


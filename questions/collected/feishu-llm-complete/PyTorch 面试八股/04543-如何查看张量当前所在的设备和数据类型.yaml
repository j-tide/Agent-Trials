content:
  prompt: 如何查看张量当前所在的设备和数据类型？
answer:
  mode: rubric
  reference_answer: |-
    使用 device 和 dtype 属性。

    ```python
    x = torch.randn(3, 4)
    print(x.device)  # cpu
    print(x.dtype)   # torch.float32

    if torch.cuda.is_available():
        x_gpu = x.to('cuda')
        print(x_gpu.device)  # cuda:0
    ```

    深入细节：

    - x.device 返回一个 torch.device 对象，你可以直接将其用于 .to() 方法。

    - x.dtype 返回一个 torch.dtype 对象，常用于混合精度训练时检查类型或进行类型转换，例如 x.to(torch.float16)。


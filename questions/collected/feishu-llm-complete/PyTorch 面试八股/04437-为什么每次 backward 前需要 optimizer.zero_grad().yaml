content:
  prompt: 为什么每次 backward 前需要 optimizer.zero_grad()？
answer:
  mode: rubric
  reference_answer: |-
    PyTorch 的梯度累积机制决定了，如果不手动清零，每次 backward() 计算的梯度会累加到已有的 .grad 中。

    - 在训练循环的每一次迭代中，我们处理一个新的 mini-batch。如果不清零，当前 batch 的梯度会与之前所有 batch 的梯度叠加，导致模型参数更新使用了错误的方向和大小。

    - 这会导致模型无法收敛，甚至梯度爆炸。

    optimizer.zero_grad() 实际上遍历了优化器中的所有参数组，将每个参数的 .grad 设置为 None 或填充零。将梯度设为 None 比填充零更高效，因为它避免了显式归零操作，PyTorch 的自动求导系统在下次赋值时会直接分配新内存。

    使用技巧：

    - 如果希望进行梯度累积，应在累积期间不调用 zero_grad()，而是在累积完成后、optimizer.step() 更新参数之前才清零。

    - 务必确保 zero_grad() 在 backward() 之前调用，而不是在 step() 之前调用；否则上一次迭代的梯度会污染本次迭代。


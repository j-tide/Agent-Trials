content:
  prompt: 如何使用 TorchMetrics 库来简化指标计算？
answer:
  mode: rubric
  reference_answer: |-
    TorchMetrics 提供了一套与 PyTorch 无缝集成的、可微的、跨设备的评估指标，避免手动管理预测和目标的累积。

    基本用法：

    ```python
    import torchmetrics

    # 定义指标
    accuracy = torchmetrics.Accuracy(task="multiclass", num_classes=10)

    for batch in dataloader:
        inputs, targets = batch
        outputs = model(inputs)
        # 指标自动累积
        acc = accuracy(outputs, targets)

    # 计算总结果
    total_acc = accuracy.compute()
    accuracy.reset()  # 进入下一轮评估前重置
    ```

    优势：

    - 自动处理多卡同步（通过 sync_on_compute=True）。

    - 支持 .to(device) 移动到指定设备。

    - 内置大量指标（F1, BLEU, Perplexity 等），减少重复代码。

    - 可组合使用 MetricCollection 同时跟踪多个指标。


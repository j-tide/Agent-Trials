content:
  prompt: 在量化中如何处理不支持量化的操作？如何跳过？
answer:
  mode: rubric
  reference_answer: |-
    量化过程中，不是所有操作都能量化（比如 Softmax、LayerNorm、Sigmoid 等），这些操作保持浮点精度，而量化的张量在输入前需要反量化为浮点，输出后再量化。PyTorch 的量化框架会自动处理这些“量化边界”。

    处理方法：

    - 自动处理（推荐）：PyTorch 的量化引擎在转换（convert）模型时，会在量化层和非量化层之间自动插入 Quantize 和 DeQuantize 节点，使得数据流在量化和浮点之间透明转换。开发者一般不需要手动干预，只需正确设置 qconfig 并在相应位置调用 torch.quantization.quantize_dynamic 或静态量化流程。

    - 指定哪些层不量化：在定义 qconfig 时，可以为特定层设置 qconfig = None，这样该层及其前后就不会被量化。例如，在静态量化准备前：

    ```python
    model.conv1.qconfig = None  # 该层不量化
    ```

    - 自定义模块的量化：如果自定义模块不支持量化，可以在其 forward 中确保输入已经是浮点，并在必要时实现 Quantizable 接口，或者直接将该模块的 qconfig 设为 None。

    - 跳过量化观察：在静态量化的校准阶段，观察者会记录激活范围。如果某个操作不需要量化，可以将其从 modules_to_fuse 中排除，或者在校准后手动移除观察者。

    - 使用 torch.ao.quantization.quantize_fx：PyTorch 新版本的 FX 图量化可以更灵活地控制哪些节点量化，通过 prepare_fx 和 convert_fx 以及自定义 qconfig_mapping。

    示例（跳过 LayerNorm）：

    ```python
    model.qconfig = torch.ao.quantization.get_default_qconfig('x86')
    # 设置 LayerNorm 不量化
    model.layer_norm.qconfig = None
    model = torch.ao.quantization.prepare(model)
    # 校准
    model = torch.ao.quantization.convert(model)
    ```

    注意：量化模型的目标是尽可能将计算密集型层（Conv, Linear）量化为 INT8，对激活函数等保留浮点不会显著影响整体加速比，因为计算瓶颈主要在卷积和矩阵乘。

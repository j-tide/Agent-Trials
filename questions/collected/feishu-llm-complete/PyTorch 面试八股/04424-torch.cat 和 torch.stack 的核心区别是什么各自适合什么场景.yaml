content:
  prompt: torch.cat 和 torch.stack 的核心区别是什么？各自适合什么场景？
answer:
  mode: rubric
  reference_answer: |-
    两者都用于拼接张量，但工作机制根本不同。

    - torch.cat(tensors, dim)：沿着已存在的维度将多个张量拼接起来。要求所有张量在其他维度上形状必须一致。它不会增加新的维度。

    - torch.stack(tensors, dim)：沿着一个全新的维度将多个张量堆叠起来。要求被堆叠的所有张量必须拥有完全相同的形状。它会插入一个新的维度。

    场景举例：

    - cat：你有三个不同的句子，每个句子已经编码为形状 (seq_len, feature_dim)。你想将它们拼接成一个长序列，使用 torch.cat([sent1, sent2, sent3], dim=0)，得到形状 (total_len, feature_dim)。

    - stack：你想将这三个句子堆叠成一个 batch，使用 torch.stack([sent1, sent2, sent3], dim=0)，得到形状 (3, seq_len, feature_dim)。这里，dim=0 就是为 batch 新增的维度。

    ```python
    a = torch.randn(2, 3)
    b = torch.randn(2, 3)

    c_cat = torch.cat([a, b], dim=0)   # (4, 3)
    c_stack = torch.stack([a, b], dim=0) # (2, 2, 3)
    ```

content:
  prompt: 5. num_workers 设置多少合适？过多或过少会有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    num_workers 控制用于数据加载的子进程数量。设置为 0 表示在主进程中加载（同步），速度最慢，一般仅用于调试。

    设置建议：

    - 经验值：通常设为 2~4倍CPU核心数 或直接使用 os.cpu_count()。但实际最优值受 I/O 瓶颈、内存带宽和数据集大小影响。

    - GPU 训练：一般 4~8 个 worker 足够。过多的 worker 会导致 CPU 上下文切换和内存开销，反而降低吞吐量。

    - 最佳实践：从小值（如 4）开始，逐步增加并监测 GPU 利用率和数据加载时间。当 GPU 等待时间（空闲）趋近于零时，即达到最优。

    影响：

    - 过少：数据供给速度跟不上 GPU 计算速度，导致 GPU 频繁空闲（利用率低），训练时间延长。

    - 过多：子进程间频繁通信和内存复制，可能导致 CPU 占用过高、缓存颠簸，甚至触发 OOM。同时，每个子进程会复制父进程的内存，若数据集较大，会迅速耗尽 RAM。

    注意：num_workers 涉及多进程，必须将 DataLoader 的初始化代码包裹在 if name == 'main': 中，以避免递归创建子进程。


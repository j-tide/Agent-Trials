content:
  prompt: 19. 解释“计算图不一致”错误在DDP中的典型原因及解决。
answer:
  mode: rubric
  reference_answer: |-
    该错误表示不同进程上的模型执行了不同的前向计算路径，导致计算图结构不一致。

    典型原因：

    - 条件语句依赖输入数据：如 if x.size(1) > 100 在不同进程进入不同分支。

    - 某些参数只在部分进程中参与了前向计算，导致梯度集合不同。

    - 数据加载逻辑导致 batch 大小不一致。

    解决方法：

    - 确保模型结构在所有进程上完全一致，避免依赖数据的控制流。若必须，使用张量操作（如 torch.where）代替 if-else。

    - 使用 DistributedSampler 并设置 drop_last=True 保证每批大小一致。

    - 临时方案：在 DDP 初始化时设置 find_unused_parameters=True，让 DDP 自动将未参与计算的参数梯度设为 0，从而保证集合一致（有额外开销）。


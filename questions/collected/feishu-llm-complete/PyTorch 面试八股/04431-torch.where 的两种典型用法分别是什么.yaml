content:
  prompt: torch.where 的两种典型用法分别是什么？
answer:
  mode: rubric
  reference_answer: |-
    torch.where 有两种完全不同的用法，取决于参数数量。

    用法一：三元选择（condition, x, y）
    根据条件 condition（一个布尔张量），从 x 或 y 中对应位置选择元素。condition 为 True 选 x，否则选 y。这是最常见用法。

    ```python
    cond = torch.tensor([True, False, True])
    a = torch.tensor([1, 2, 3])
    b = torch.tensor([4, 5, 6])
    result = torch.where(cond, a, b)  # tensor([1, 5, 3])
    ```

    用法二：返回非零元素的索引（condition）
    当只传入一个 condition 参数时，它会返回 condition 中所有 True 位置的索引（类似于 np.where）。对于多维张量，返回的是一个索引元组。

    ```python
    x = torch.tensor([[1, 0, 3],
                      [0, 5, 0]])
    indices = torch.where(x > 2)  # 找到大于2的元素索引
    # (tensor([0, 1]), tensor([2, 1]))  表示 (0,2) 和 (1,1) 位置
    ```

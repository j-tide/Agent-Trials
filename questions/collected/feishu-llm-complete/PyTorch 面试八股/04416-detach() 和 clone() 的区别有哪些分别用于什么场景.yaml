content:
  prompt: detach() 和 clone() 的区别有哪些？分别用于什么场景？
answer:
  mode: rubric
  reference_answer: |-
    两者都用于从当前计算图中分离张量，但行为和用途不同。

    [嵌入表格未展开]

    核心区别：

    - b = a.detach()：b 与 a 共享同一块存储，修改 b 的 in‑place 会影响 a。b 的 requires_grad 为 False，从 a 到 b 的梯度完全阻断。它常用于阻止梯度回流到原始计算图。

    - c = a.clone()：c 拥有全新的存储，与 a 完全独立。默认情况下，clone() 会保留梯度流（如果原张量需要梯度）。若想切断梯度，需调用 a.clone().detach()。

    场景示例：

    - detach()：在强化学习的Actor‑Critic算法中，Critic网络更新时，需要用到Actor的输出但不希望梯度从Critic流回Actor。此时可以 actor_output.detach()。

    - clone()：当你需要修改一个张量，但又想保留原始版本进行反向传播时（例如某些训练技巧），可以 copy = tensor.clone()。


content:
  prompt: 在联邦学习场景，如何使用PyTorch实现模型聚合？
answer:
  mode: rubric
  reference_answer: |-
    联邦学习通常采用 FedAvg 算法。服务器下发全局模型，各客户端本地训练后上传模型权重（或梯度），服务器进行聚合。

    ```python
    def fed_avg(global_model, client_weights_list, client_sizes):
        # 计算加权平均
        global_dict = global_model.state_dict()
        total_samples = sum(client_sizes)
        for key in global_dict.keys():
            global_dict[key] = sum(
                client_state[key] * client_sizes[i] / total_samples
                for i, client_state in enumerate(client_weights_list)
            )
        global_model.load_state_dict(global_dict)
    ```

    实现要点：

    - 安全性：使用差分隐私（DP-SGD）或安全聚合协议（如同态加密）。

    - 通信效率：只传输模型更新而非完整模型，并进行梯度压缩。

    - PyTorch生态工具：PySyft, Flower, FedML 等提供了高层API。


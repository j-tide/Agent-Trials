content:
  prompt: 什么是张量的连续性？何时必须调用 .contiguous()？
answer:
  mode: rubric
  reference_answer: |-
    连续性是指张量在内存中按照逻辑视图的顺序逐行存储，没有任何“跳跃”。具体检查可以通过 x.is_contiguous() 来判断。如果张量连续，view() 等操作就能直接映射而无需数据复制。

    必须调用 .contiguous() 的典型场景：

    - 在调用 view() 之前：如果张量不连续，view() 会抛出 RuntimeError。

    - 在调用某些底层算子或自定义CUDA内核前：它们往往要求输入连续。

    - 在将GPU张量拷贝到CPU时（见第25问）。

    ```python
    x = torch.randn(3, 4).t()  # 转置后不连续
    print(x.is_contiguous())   # False
    # x.view(-1)  # 会报错
    x_cont = x.contiguous()    # 创建一个连续的副本
    print(x_cont.is_contiguous()) # True
    x_cont.view(-1)            # 正常工作
    ```

    注意：contiguous() 会创建一个新的、内存连续的张量，这涉及到数据拷贝，应谨慎使用以平衡性能。


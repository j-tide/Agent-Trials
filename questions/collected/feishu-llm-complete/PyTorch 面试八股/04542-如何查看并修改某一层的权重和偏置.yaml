content:
  prompt: 如何查看并修改某一层的权重和偏置？
answer:
  mode: rubric
  reference_answer: |-
    所有带参数的层（如 nn.Linear）都有 weight 和 bias 属性（如果 bias=True）。它们是 nn.Parameter，可以直接访问和修改。

    ```python
    fc1 = model.fc1
    print(fc1.weight.data)  # 查看权重
    print(fc1.bias.data)    # 查看偏置

    # 直接修改（慎用，通常用于特殊初始化或赋值）
    fc1.weight.data = torch.randn_like(fc1.weight)
    fc1.bias.data.fill_(0.0)
    ```

    警告：直接修改 .data 会绕过 autograd 追踪，在训练中可能导致梯度异常。更好的做法是使用 nn.init 函数进行初始化。


content:
  prompt: 在自定义 Function 中，ctx 对象有什么用？如何保存中间结果？
answer:
  mode: rubric
  reference_answer: |-
    ctx 是一个上下文管理对象，用于在 forward 和 backward 之间传递和保存信息。

    - 保存：ctx.save_for_backward(*tensors) 将前向传播中的中间结果（非标量张量）保存下来，供反向传播使用。这些张量在反向时会自动取出，并从计算图中安全地分离。

    - 存储其他信息：你可以将任意Python对象（如整数、列表）直接赋值给 ctx 的属性（如 ctx.my_val = 10）。

    class MyLinear(nn.Function):
        @staticmethod
        def forward(ctx, input, weight, bias=None):
            ctx.save_for_backward(input, weight)  # 保存反向所需数据
            output = input.mm(weight.t())
            if bias is not None:
                output += bias
            return output

        @staticmethod
        def backward(ctx, grad_output):
            input, weight = ctx.saved_tensors  # 取出保存的张量
            grad_input = grad_weight = grad_bias = None
            if ctx.needs_input_grad[0]:
                grad_input = grad_output.mm(weight)
            if ctx.needs_input_grad[1]:
                grad_weight = grad_output.t().mm(input)
            return grad_input, grad_weight, grad_bias

    注意：save_for_backward 只能保存张量，且要求它们是 forward 的输入或输出，不能保存中间计算产生的临时张量（除非也将其作为额外输出）。正确保存数据是自定义高效、正确反向传播的关键。

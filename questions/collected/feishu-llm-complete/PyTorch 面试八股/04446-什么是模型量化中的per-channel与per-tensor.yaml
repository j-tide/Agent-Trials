content:
  prompt: 什么是模型量化中的“per-channel”与“per-tensor”？
answer:
  mode: rubric
  reference_answer: |-
    量化中的per-tensor和per-channel是两种确定量化参数（scale和zero_point）的粒度。

    - Per-tensor量化：对整个权重张量（例如一个卷积层的整个权重矩阵）使用同一组scale和zero_point。所有通道共享一个量化范围。优点是简单、计算快，但若不同通道的数值分布差异大，精度损失会较大。

    - Per-channel量化：对权重张量的每个输出通道独立计算scale和zero_point。例如，对Conv2d的weight (out_channels, in_channels, H, W)，会沿着out_channels维度为每个通道分别确定量化参数。这样能更好地适应不同通道的动态范围，显著提高量化精度，特别是对于深度可分离卷积或权重分布极不均匀的层。

    在PyTorch中，可以通过torch.quantization.PerChannelMinMaxObserver等观察器来实现per-channel量化。通常，权重采用per-channel量化以保持精度，而激活由于依赖输入批次，更多采用per-tensor或动态量化。现代量化方案（如QAT）广泛使用per-channel量化来缩小与浮点模型的差距。


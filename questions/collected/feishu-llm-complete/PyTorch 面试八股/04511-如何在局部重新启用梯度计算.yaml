content:
  prompt: 如何在局部重新启用梯度计算？
answer:
  mode: rubric
  reference_answer: "在 torch.no_grad() 或 torch.inference_mode() 包裹的代码块内，可以通过嵌套一个 torch.enable_grad()
    上下文，临时重新启用梯度计算。\n\nx = torch.randn(3, requires_grad=True)\nwith torch.no_grad():\n
    \   # 此处梯度计算被禁用\n    y = x * 2  # y.requires_grad == False\n    \n    with torch.enable_grad():\n
    \       # 局部重新启用梯度\n        z = x * 3  # z.requires_grad == True\n        loss
    = z.sum()\n        loss.backward()\n        print(x.grad)  # 正常计算并保留了梯度\n\n应用：某些自定义层或复杂的推理逻辑中，可能大部分前向传播不需要梯度，但其中一小部分需要根据输入动态调整并需要梯度信号。\n\n---"

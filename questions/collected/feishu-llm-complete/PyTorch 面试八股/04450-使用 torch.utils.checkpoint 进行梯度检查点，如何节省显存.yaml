content:
  prompt: 使用 torch.utils.checkpoint 进行梯度检查点，如何节省显存？
answer:
  mode: rubric
  reference_answer: |-
    原理：梯度检查点在前向传播时丢弃部分中间激活值，在反向传播需要时重新计算这些激活值，以计算时间换取显存空间。

    实现方式：

    - 对单个模块：torch.utils.checkpoint.checkpoint(module, input)

    - 对整个模型：使用 HuggingFace 的 model.gradient_checkpointing_enable()

    [图片内容未导入]

    计算代价：重计算会带来额外的计算量，训练速度通常下降 20%~30%。这是“时间换空间”的典型例子。

    分布式微调中的配置：

    - 与 ZeRO/FSDP、Flash Attention 等正交，可叠加使用。

    - 通常对每个 Transformer Block 设置检查点。


content:
  prompt: 2. requires_grad=True 在计算图中起什么作用？
answer:
  mode: rubric
  reference_answer: |-
    requires_grad 是张量的一个属性，它决定了该张量是否需要被追踪梯度，以及是否参与计算图的构建。

    - 当一个张量的 requires_grad=True 时，所有依赖它的操作所产生的新张量都会自动具有 requires_grad=True（除非显式指定为 False），并且这些操作都会被注册到计算图中。

    - 在反向传播时，只有 requires_grad=True 的叶子张量才会被计算并累积梯度（存入 .grad）。

    - 它相当于告诉 PyTorch：“我希望优化这个张量，请记录所有依赖于它的计算，以便后续自动求导。”

    实用场景：

    - 模型参数：nn.Parameter 内部将张量的 requires_grad 自动设为 True，因此所有模型参数默认需要梯度。

    - 冻结部分网络：在微调时，将某些层设置为 requires_grad=False，可以冻结这些层，只更新其余部分，既节省显存又防止遗忘。

    - 输入数据：通常将输入数据的 requires_grad 保持为 False，因为不需要优化输入，这也能避免构建不必要的计算图。


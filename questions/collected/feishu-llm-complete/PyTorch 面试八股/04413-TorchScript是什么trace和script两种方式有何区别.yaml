content:
  prompt: TorchScript是什么？trace和script两种方式有何区别？
answer:
  mode: rubric
  reference_answer: |-
    TorchScript 是PyTorch模型的一种中间表示（IR），它允许将PyTorch模型（通常定义在 nn.Module 中）序列化为一个可优化、可独立于Python运行的文件。它的核心目的是部署：将模型从需要Python环境的动态图，转换为一个静态的、可被高性能推理引擎（如LibTorch、ONNX Runtime、TensorRT）执行的格式。TorchScript模型不再依赖Python解释器，因此可以在C++环境、移动端或生产服务器上高效运行。

    PyTorch提供了两种将模型转换为TorchScript的方法：torch.jit.trace 和 torch.jit.script。它们的工作机制和适用场景截然不同。

    [嵌入表格未展开]

    核心区别：

    - trace 是一个“观察者”，它给定一个样例输入，运行一次模型，并将执行的操作记录下来，形成一个静态计算图。它无法记录未被触发的分支，因此对于控制流（如 if x > threshold: ... else: ...），它只会记录实际执行的那条路径。

    - script 是一个“编译器”，它直接阅读你的Python代码（通过 torch.jit.script 装饰器或函数调用），将其翻译为TorchScript IR。它不需要运行模型就能理解控制流，因此可以处理动态结构。

    应用场景选择：

    - 如果模型是标准的CNN、Transformer等，且没有依赖数据的复杂分支，使用 trace 即可，更简单快捷。

    - 如果模型包含动态循环（如基于序列长度的RNN）、条件判断（如mask操作中的 if）、或自定义的复杂逻辑，则必须使用 script。

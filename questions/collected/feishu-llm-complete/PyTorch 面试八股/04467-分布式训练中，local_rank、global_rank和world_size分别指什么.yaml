content:
  prompt: 分布式训练中，local_rank、global_rank和world_size分别指什么？
answer:
  mode: rubric
  reference_answer: |-
    这三个概念是理解分布式训练拓扑的关键。

    - world_size：参与训练的总进程数。对于单机多卡，即GPU数量；对于多机多卡，即总节点数 × 每节点GPU数。它是一个全局常量。

    - global_rank：全局唯一的进程ID，从0到world_size-1。在整个集群中，每个进程都有一个唯一的global_rank。它用于在跨节点的通信中标识进程。

    - local_rank：节点内的本地GPU编号，从0到节点内GPU数-1。它用于指定当前进程应该使用哪张物理GPU。在同一台机器上，不同进程的local_rank不同；但不同机器上的进程可以有相同的local_rank。

    举例：假设有2台服务器，每台4张GPU，总共8张GPU。

    - world_size = 8

    - global_rank：节点0上的4个进程分别为0,1,2,3；节点1上的4个进程分别为4,5,6,7。

    - local_rank：在每台机器上，4个进程的local_rank都是0,1,2,3。

    在代码中的使用：

    ```python
    import torch.distributed as dist

    world_size = dist.get_world_size()
    global_rank = dist.get_rank()
    local_rank = int(os.environ['LOCAL_RANK'])
    torch.cuda.set_device(local_rank)  # 绑定本地GPU
    ```

    理解这三个概念有助于正确配置数据采样、模型保存和调试分布式程序。


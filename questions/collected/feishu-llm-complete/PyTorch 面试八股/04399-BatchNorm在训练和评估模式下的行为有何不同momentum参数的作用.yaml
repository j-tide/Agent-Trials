content:
  prompt: BatchNorm在训练和评估模式下的行为有何不同？momentum参数的作用。
answer:
  mode: rubric
  reference_answer: |-
    训练模式（model.train()）：

    - 对当前 mini-batch 的每个通道计算均值 μbatchμbatch 和方差 σbatch2σbatch2。

    - 利用这两个统计量对输入进行归一化。

    - 同时，以指数移动平均（EMA）的方式更新全局的 running_mean 和 running_var，用于评估模式。更新公式：

    [图片内容未导入]

    - 方差同理。

    - momentum 参数控制EMA的更新速度，默认0.1（在PyTorch中实现为“累积动量”，实际公式可能略有差异，但概念如此）。

    评估模式（model.eval()）：

    - 不再计算当前批次的统计量。

    - 直接使用训练阶段积累的 running_mean 和 running_var 进行归一化，保证推理时的确定性。

    momentum的作用：决定了全局统计量更新时，当前批次数据的影响权重。较小的动量值使得全局统计量更新缓慢，更依赖于历史数据；较大的动量值则让最近批次的影响更大。

    注意：使用BatchNorm时，训练必须保证batch size足够大（一般>16），否则统计量不准确。


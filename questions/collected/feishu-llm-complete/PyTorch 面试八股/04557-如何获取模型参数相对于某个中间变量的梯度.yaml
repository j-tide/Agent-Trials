content:
  prompt: 如何获取模型参数相对于某个中间变量的梯度？
answer:
  mode: rubric
  reference_answer: |-
    使用 torch.autograd.grad() 并指定 inputs 为模型参数，outputs 为中间变量。这允许你分析某个中间表示对模型参数的敏感性。

    x = torch.randn(1, 10)
    model = nn.Linear(10, 5)
    mid = model(x)  # 中间变量
    # 计算模型权重和偏置相对于 mid 的每个元素的梯度（Jacobian）
    for i in range(mid.size(-1)):
        grads = torch.autograd.grad(mid[0, i], model.parameters(), retain_graph=True)
        print(f"Feature {i}: weight grad shape {grads[0].shape}")

    这在特征可视化、可解释性研究（如Grad‑CAM）中非常常用。


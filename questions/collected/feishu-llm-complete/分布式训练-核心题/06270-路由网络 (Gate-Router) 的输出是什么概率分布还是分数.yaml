content:
  prompt: 路由网络 (Gate/Router) 的输出是什么？概率分布还是分数？
answer:
  mode: rubric
  reference_answer: |-
    路由网络的原始输出是 logits 分数，形状为 [num_tokens, num_experts]。经过 softmax 后转化为概率分布。这个概率分布有两个用途：一是用于 Top-k 选择（选概率最高的 k 个索引），二是作为专家输出的加权系数（概率值乘以专家输出，然后求和）。

    需要注意：最终送往专家的“权重”通常就是这 k 个专家对应的 softmax 概率值。但实践中也有变体——比如只选专家不乘权重（所有选中专家输出直接等权求和），或者用 logits 本身的值（而不是 softmax 后的概率）作为权重。这些变体各有优劣：乘概率可以让模型更精细地控制信息流，但也增加了计算和通信；不乘权重则更简单，有时反而更稳定。目前主流做法是保留概率加权。

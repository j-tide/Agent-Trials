content:
  prompt: 解释 PyTorch 中的 DistributedDataParallel 如何与模型并行（如 Megatron）结合。
answer:
  mode: rubric
  reference_answer: |-
    在PyTorch中，DistributedDataParallel (DDP) 负责数据并行，而模型并行（TP/PP）由上层框架（如Megatron-LM）实现。两者结合的关键在于层次化通信组管理。

    实现方式：

    - 通信组划分：Megatron-LM首先根据并行配置创建多个进程组：

    - 模型构建与包裹：

    - 梯度同步：

    关键技术点：

    - DDP的Reducer会识别出模型中的哪些参数需要全局梯度同步（即那些在DP组内所有副本中都存在的参数）。在模型并行中，部分参数可能只存在于TP组内（如切分后的权重），DDP只对完整的模型参数的梯度进行AllReduce（这些参数在每个DP副本中都是完整的，尽管在TP组内是切分的，但DDP层面看到的是完整的逻辑参数）。

    - Megatron-LM和DeepSpeed都实现了与DDP的无缝集成，用户在调用deepspeed.initialize()或Megatron的并行初始化时，内部会自动处理通信组的创建和DDP的包裹。

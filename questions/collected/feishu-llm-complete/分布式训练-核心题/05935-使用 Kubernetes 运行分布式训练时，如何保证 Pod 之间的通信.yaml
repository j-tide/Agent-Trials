content:
  prompt: 49.使用 Kubernetes 运行分布式训练时，如何保证 Pod 之间的通信？
answer:
  mode: rubric
  reference_answer: |-
    在 Kubernetes（K8s）集群中运行分布式训练，Pod 之间需要高效的网络通信。关键措施包括：

    - 使用 HostNetwork 模式：让 Pod 使用宿主机的网络命名空间，直接使用物理网卡（如 InfiniBand），避免容器网络叠加的损耗。这需要 Pod 能够获取宿主机网络接口权限。

    - Multus CNI：允许 Pod 附加多个网络接口，可以同时拥有用于管理的默认网络和用于高性能计算的 InfiniBand 网络。

    - Network-Attached Definitions：定义 InfiniBand 网络的附加网络，并分配给 Pod。

    - Pod 亲和性与反亲和性：通过 affinity 将同一个训练作业的 Pod 调度到同一台交换机下或置放群组内，减少通信跳数。

    - 环境变量与 NCCL 配置：通过环境变量传递 NCCL 所需的信息（如 NCCL_SOCKET_IFNAME 指向 IB 接口），并确保所有 Pod 的 NCCL 版本一致。

    - 使用 Volcano 等高性能调度器：支持 Gang Scheduling，确保所有 Pod 同时启动，并提供拓扑感知调度。

    通过这些配置，Kubernetes 上的分布式训练可以达到接近裸机的通信性能。

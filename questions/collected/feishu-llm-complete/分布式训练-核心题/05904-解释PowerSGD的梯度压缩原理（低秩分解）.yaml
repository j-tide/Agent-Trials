content:
  prompt: 20.解释“PowerSGD”的梯度压缩原理（低秩分解）。
answer:
  mode: rubric
  reference_answer: |-
    PowerSGD 是一种基于低秩分解的梯度压缩算法。其核心思想是：梯度矩阵通常具有低秩特性，可以用两个小矩阵的乘积来近似，从而大幅度减少通信量。

    原理：

    - 将梯度矩阵 G（形状 m×n）分解为两个矩阵 P 和 Q，其中 P 是 m×r，Q 是 r×n，r 是秩（远小于 m,n）。

    - 在迭代开始时，从一个随机的 P（或 Q）出发，通过幂迭代（Power Iteration）的方式，交替优化 P 和 Q，求解最优的低秩近似 G ≈ PQ。

    - 具体步骤：

    - 误差补偿：同样使用误差反馈，将近似误差累加到下一次的梯度中，以保证收敛。

    优势：压缩率极高，尤其适合全连接层等大矩阵。秩 r 可以调节压缩率与精度。经过精心设计的幂迭代可以快速收敛，且数值稳定。

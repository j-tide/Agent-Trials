content:
  prompt: 什么是“Zero Redundancy Optimizer”的基本思想？
answer:
  mode: rubric
  reference_answer: |-
    ZeRO (Zero Redundancy Optimizer) 是DeepSpeed框架提出的显存优化技术，旨在消除数据并行训练中的冗余状态存储。

    ### 数据并行的冗余问题

    在标准数据并行中，每张GPU都保存一份完整的：

    - 模型参数 (Parameters)

    - 梯度 (Gradients)

    - 优化器状态 (Optimizer States，如Adam的m和v)

    这些数据在所有GPU上完全相同，造成了巨大的显存浪费。ZeRO的核心思想是将这些状态分片 (Partition) 到所有GPU上，每张卡只持有其中的一部分。

    ### ZeRO 的三个优化阶段

    - ZeRO-1：将优化器状态切分。每张卡只维护1/N的优化器状态，负责更新对应分片的参数。更新后通过AllGather收集完整参数。

    - ZeRO-2：进一步切分梯度。反向传播时，每张卡只保留自己负责参数部分的梯度，减少显存和通信。

    - ZeRO-3：更进一步切分模型参数本身。每张卡在前向/反向需要某层参数时，通过AllGather从其他卡收集，用完后立即释放。这使得千亿参数模型的训练成为可能，因为单卡不再需要存储整个模型。

    ### ZeRO-Offload

    在ZeRO-3基础上，可将优化器状态甚至模型参数卸载到CPU内存，利用CPU进行计算，进一步打破GPU显存墙，同时以PCIe带宽换取极端规模下的可行性。


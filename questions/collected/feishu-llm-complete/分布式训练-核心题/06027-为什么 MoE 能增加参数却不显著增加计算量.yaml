content:
  prompt: 为什么 MoE 能增加参数却不显著增加计算量？
answer:
  mode: rubric
  reference_answer: |-
    核心就在于“稀疏激活”。标准稠密模型中，无论输入是什么，FFN 的所有参数都要参与计算，每个 token 都要走过完整的矩阵乘法。而在 MoE 中，假设总共有 N 个专家，每个 token 只激活其中 k 个（通常 k=1 或 2）。那么该 token 实际经历的计算量只是 k 个专家 FFN 的计算量，与稠密模型中一个较大的 FFN 的计算量在同一量级（甚至更小，因为专家 FFN 的隐藏维度可以设计得较窄）。模型总参数量却因为拥有 N 个专家而膨胀了约 N/k 倍。

    用一个具体数字举例：一个标准 Transformer 的 FFN 有 1 亿参数。如果我们用 MoE 替换，设置 8 个专家，每个专家设计为同样规模，总参数就是 8 亿。但每个 token 只激活 1 个专家，计算量仍然是 1 亿参数的计算量。这就好像你有一个八人团队，但每次干活只有一个人在忙，其他人休息——团队规模（参数）大了，但单次人力消耗（计算）没变。这种“参数膨胀而计算不膨胀”的特性，让 MoE 在扩大模型容量时，推理和训练的计算成本呈亚线性增长，成为大模型时代的“免费午餐”。

    当然，实际中并非完全没有额外开销。门控网络计算本身计算量很小可以忽略，但 token 的分发和收集会产生通信和调度成本，尤其在分布式环境下。如果专家分布在不同的 GPU 上，需要通过网络把 token 从路由所在的 GPU 发送到专家所在的 GPU，计算完再发回来，这两次 all-to-all 通信是 MoE 训练的主要额外开销。此外，动态路由使得每次迭代的计算负载不固定，对集群的负载均衡提出挑战。

content:
  prompt: 数据并行时，每张卡上的优化器状态是完全相同还是各自存储？为什么 ZeRO-1 要分片优化器状态？
answer:
  mode: rubric
  reference_answer: |-
    在传统的数据并行中，每张GPU拥有完整的模型副本，它们独立处理不同的输入数据，各自计算梯度。随后通过AllReduce通信将梯度全局平均或求和，使每张卡获得相同的全局梯度。每张卡使用相同的全局梯度和相同的优化器（如Adam）更新自己的本地参数，因此每张卡上的优化器状态（m和v）完全相同，也是完整的副本。

    ZeRO-1 分片优化器状态的动机：这种完全冗余的优化器状态造成了巨大的显存浪费。对于N张卡的数据并行，优化器状态占用的总显存是单卡的N倍，但存储的信息完全一样。ZeRO-1将优化器状态均匀分片到N张卡，每张卡只存储1/N的优化器状态，并负责更新对应分片的参数。更新完成后，通过AllGather将更新后的参数广播给所有卡，使它们重新持有完整参数。这样，优化器状态的显存冗余被消除，单卡优化器显存降至原来的1/N，而额外增加的通信量（AllGather）相对较小，因为优化器状态不需要在每次迭代中全部传输。

    本质：ZeRO-1用一次小规模的AllGather参数通信，换取了优化器状态显存的指数级压缩，使数据并行可以容纳更大的模型。


content:
  prompt: Megatron-LM 中如何设置张量并行和流水线并行的尺寸？
answer:
  mode: rubric
  reference_answer: |-
    在 Megatron-LM 的启动脚本或命令行中，通过以下参数设置并行度：

    - --tensor-model-parallel-size：设置张量并行的尺寸。通常设为节点内 GPU 数量（如 8），以确保 TP 通信仅在节点内进行。

    - --pipeline-model-parallel-size：设置流水线并行的尺寸。决定了模型被切分为多少个流水线阶段。总 GPU 数 = TP × PP × DP，DP 会自动计算。

    例如，在 8 个节点、每节点 8 张 A100 的集群上，若要训练 175B 模型，可能设置 TP=8, PP=16，则总模型副本数为 1，DP=4（若总卡数 256，则可能设置 DP=2）。这些参数通常在 run_pretraining.sh 脚本中指定。

    Megatron 还支持交错流水线调度 (--num-layers-per-virtual-pipeline-stage) 来减少气泡。并行配置的优化需要根据模型大小和集群拓扑精心调整。

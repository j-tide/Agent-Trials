content:
  prompt: 什么是 Colossal-AI？它提供了哪些独特的并行功能？
answer:
  mode: rubric
  reference_answer: |-
    Colossal-AI 是潞晨科技开源的一个综合性大模型训练和推理框架。除了实现 ZeRO、TP、PP 等常见并行策略外，它还提供了一些独特的并行功能：

    - 2D 并行 (Summa)：将注意力矩阵的 head 和 sequence 两个维度同时切分，降低注意力计算的显存。

    - 2.5D 并行：在 2D 的基础上引入数据并行维度，进一步平衡计算和通信。

    - 3D 并行 (Tensor Parallelism + Pipeline Parallelism + Data Parallelism 的自动化组合)：提供自动搜索最优并行策略的能力。

    - 序列并行 (Sequence Parallelism)：将长序列切分到多卡，降低单卡激活显存。

    - Gemini 优化器：一种异构内存管理方案，可视为 ZeRO 的增强版，支持将参数、梯度、优化器状态动态分配到 GPU 显存、CPU 内存甚至 NVMe 硬盘，并智能预取，提高内存利用率。

    - Offload 与 Reload：支持将模型参数按需换入换出，打破 GPU 内存墙。

    Colossal-AI 的特色在于其“插件化”的配置和自动并行搜索，降低了分布式训练的使用门槛。

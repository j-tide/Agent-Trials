content:
  prompt: ZeRO-Offload 对训练速度的影响通常是多少？为什么会变慢？
answer:
  mode: rubric
  reference_answer: |-
    通常使训练速度下降 30%~70%（即吞吐量降至原来的 30%~70%）。变慢的根本原因是 PCIe 带宽限制。

    GPU 显存带宽高达 2 TB/s（如 A100），而 PCIe 4.0 x16 单向带宽仅 ~32 GB/s，差距达 60 倍以上。每次训练步需要将梯度从 GPU 传到 CPU（14 GB for 7B），再将更新后参数从 CPU 传回 GPU（14 GB），总传输量 28 GB，理想情况下仅传输时间就需要约 0.9 秒。相比之下，GPU 内部计算时间可能远小于此。因此，数据传输成为瓶颈，GPU 的计算速度被慢速 PCIe 链路拖慢。

    尽管采用了异步传输和计算重叠，但无法完全消除这种速度差异，因为重叠需要计算时间和传输时间大致匹配，而通常传输时间远超单层计算时间。增大批次大小可以部分提高 GPU 利用率，但总体上速度损失是卸载的必然代价。

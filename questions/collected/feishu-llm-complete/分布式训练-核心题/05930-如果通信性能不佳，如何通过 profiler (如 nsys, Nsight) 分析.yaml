content:
  prompt: 45.如果通信性能不佳，如何通过 profiler (如 nsys, Nsight) 分析？
answer:
  mode: rubric
  reference_answer: |-
    - NVIDIA Nsight Systems：可以捕获整个系统的 timeline，包括 CUDA kernel、NCCL 通信操作、CPU 线程等。通过查看通信操作（如 ncclAllReduce）的时间戳和持续时间，判断通信是否成为瓶颈，以及通信与计算的重叠情况。重点关注 GPU:Communication 和 GPU:Compute 的间隙。

    - NVIDIA Nsight Compute：用于分析单个 CUDA kernel 的性能，但也可用于分析通信内核（如 NCCL 的 reduce 内核），查看其占用率、内存带宽等，定位是否达到理论带宽。

    - nccl-tests：专用基准，可以测试不同消息大小下的带宽，发现性能是否达标。若实测带宽远低于理论值，则需要排查链路问题。

    - NCCL 内置 profiler：通过 NCCL_PROFILE=1 环境变量，NCCL 会输出每次集合操作的耗时，快速定位哪个操作慢。

    分析步骤：先用 nccl-tests 验证理论带宽；然后用 Nsight Systems 捕获实际训练步骤，观察通信耗时占比和重叠情况；若发现特定通信操作耗时长，再用 Nsight Compute 深入分析其 kernel。

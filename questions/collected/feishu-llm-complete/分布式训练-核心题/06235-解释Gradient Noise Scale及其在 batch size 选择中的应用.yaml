content:
  prompt: 解释“Gradient Noise Scale”及其在 batch size 选择中的应用。
answer:
  mode: rubric
  reference_answer: |-
    ### 定义

    Gradient Noise Scale (GNS) 衡量的是随机梯度估计的噪声水平。它定义为参数梯度协方差矩阵的迹与真实梯度向量范数之比，可以近似为：

    GNS ≈ (每个样本梯度的方差) / (平均梯度的L2范数)

    直观上，如果梯度噪声很大，需要更大的batch size来平滑噪声，获得更准确的下降方向。

    ### 在 batch size 选择中的应用

    - 小批次 (< GNS)：梯度噪声主导，每步更新方向随机性强。增大batch size能显著降低噪声，加速收敛，提高计算效率。

    - 批次接近 GNS：继续增大batch size带来的梯度噪声降低效果边际递减，此时应转向提高学习率或改进优化器。

    - 批次远大于 GNS (> GNS)：进一步增大batch size几乎不再提升训练效率，纯粹浪费算力，且可能导致模型泛化能力下降。

    ### 实践应用

    - GNS会随训练阶段变化：早期噪声大，可适当用较大batch size；后期噪声减小，可适度降低batch size或提高学习率。

    - 一些自适应批次调度策略通过在线估计GNS来动态调整batch size。

    - 对于大模型预训练，由于算力昂贵，通常采用经验性的大batch（如2M～8M tokens），而不严格依赖GNS理论。但GNS提供了一种解释框架，帮助理解不同batch size下训练行为的差异。

    ---

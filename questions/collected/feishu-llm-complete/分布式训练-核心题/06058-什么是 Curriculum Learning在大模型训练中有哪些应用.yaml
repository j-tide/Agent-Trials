content:
  prompt: 什么是 Curriculum Learning？在大模型训练中有哪些应用？
answer:
  mode: rubric
  reference_answer: |-
    Curriculum Learning（课程学习）是一种受人类学习启发的训练策略：先让模型学习简单的样本，再逐步增加难度，而不是一开始就将所有复杂数据随机打乱训练。

    ### 核心思想

    模型在训练初期就像一个初学者，如果直接抛给它极其复杂的任务，它可能什么都学不会，或者学到错误的“捷径”。通过从易到难的课程安排，模型能先掌握基础模式，建立起稳固的内部表示，再去挑战更困难的数据，从而加速收敛并提升最终性能。

    ### 在大模型训练中的应用

    - 预训练数据排序：将质量较高、结构简单的文本（如维基百科）放在训练初期，将质量参差不齐、噪声大的网页数据放在后期。一些研究表明，这种排序能提升下游任务性能。

    - 序列长度课程：训练开始时使用较短的序列（如512），训练一段时间后再逐步扩展到2048、4096甚至更长。这有助于节省早期训练的计算量，并让模型先学会局部依赖，再处理长程依赖。

    - 任务难度课程：在指令微调阶段，先使用简单的任务（如情感分类），再引入复杂的推理任务（如多跳问答、代码生成）。

    - 多模态模型：先学习简单的图文匹配，再学习复杂的视觉推理和对话。

    - 学习率课程：学习率预热（warmup）本身就是一种课程学习：从极小的学习率开始，逐渐增加到目标值，避免早期训练不稳定。

    ### 优势与挑战

    课程学习可以提高训练效率，改善收敛性和泛化能力。但难点在于如何客观地定义“简单”和“困难”，以及如何设计课程的进阶速度。通常需要结合启发式规则和实验验证。


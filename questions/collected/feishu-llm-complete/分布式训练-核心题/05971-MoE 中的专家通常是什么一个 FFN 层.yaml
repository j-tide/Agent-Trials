content:
  prompt: MoE 中的“专家”通常是什么？一个 FFN 层。
answer:
  mode: rubric
  reference_answer: |-
    在当今的 Transformer MoE 中，专家几乎无一例外是标准的前馈网络 (FFN) 层。具体来说，就是传统 Transformer 里 Attn 之后的两层全连接（升维+非线性+降维）。现代 MoE 中，专家通常采用 SwiGLU 等门控激活变体，因为这类激活在同等参数下表现更好。SwiGLU 的 FFN 有三个权重矩阵：W_gate、W_value 和 W_out，比传统 ReLU-FFN（只有两个权重矩阵）多一个，但通过把中间维度设为原来的 2/3，总参数量可以保持不变。

    为什么专家是 FFN 而不是注意力头？因为自注意力本身已经负责了 token 间的信息聚合，而 FFN 承担的是对每个 token 内部表示的独立非线性变换，即“知识存储和特征处理”。这部分参数量巨大且相对独立，非常适合用 MoE 来横向扩展。此外，FFN 的计算是 token 级别独立的，不需要跨 token 交互，路由分发相对简单——每个 token 可以独立决定自己去哪个专家。

    如果把注意力也设计成专家，会增加系统复杂性。注意力计算需要不同 token 的 QKV 交互，如果不同 token 被路由到不同的注意力专家，它们之间怎么交互？这需要更复杂的跨专家通信机制，工程实现难度大且通信代价高。因此，目前主流 MoE 都只在 FFN 层引入专家。

content:
  prompt: 为什么 MoE 容易发生“专家坍塌” (Expert Collapse)？部分专家不被使用。
answer:
  mode: rubric
  reference_answer: |-
    专家坍塌是指门控迅速将几乎所有 token 路由到极少数专家，其余专家闲置，模型退化为稠密模型。

    坍塌原因：

    - 门控正反馈：初期某专家稍占优势，学到更多，得分更高，吸引更多 token，形成富者愈富循环。

    - 确定性 Top-k 选择：缺乏随机性，门控快速收敛到局部最优。

    - batch size 过小：统计波动大，门控容易固化。

    - 负载均衡损失不足：权重过小无法抵抗正反馈。

    缓解措施：

    - 增大负载均衡损失权重。

    - 加入路由噪声（Gumbel softmax）。

    - 使用足够大的 batch size 和容量因子。

    - 训练初期监控，必要时重置门控权重或调低热门专家学习率。

    以上是 MoE 负载均衡与专家容量的系统解析。实际训练中，这些策略通常组合使用，并根据实时监控指标动态调整，才能让 MoE 模型稳定发挥其稀疏激活的优势。

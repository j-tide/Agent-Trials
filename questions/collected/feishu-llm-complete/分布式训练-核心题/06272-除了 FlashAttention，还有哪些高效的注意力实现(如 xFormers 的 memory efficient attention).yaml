content:
  prompt: 除了 FlashAttention，还有哪些高效的注意力实现？(如 xFormers 的 memory efficient attention)
answer:
  mode: rubric
  reference_answer: |-
    - xFormers (Meta出品)：提供memory_efficient_attention，使用类似的tiling技巧，但支持更多类型的注意力偏置（如相对位置偏置、ALiBi等）。它在非Ampere架构上也有良好的性能，且与FlashAttention兼容，常作为SDPA的后端之一。

    - PagedAttention (vLLM中)：专门针对推理场景，将KV缓存分页管理，允许在非连续显存中存储，解决KV缓存碎片化问题，极大提升推理吞吐。

    - Ring Attention (分布式)：将序列长度维度切分到多个GPU上，通过环形通信进行注意力计算，使训练上下文窗口扩展到数万甚至十万token。结合FlashAttention，可实现高效的分布式长序列训练。

    - Sparse Attention / Dilated Sliding Window：如Longformer、BigBird，通过稀疏或膨胀窗口限制每个token只关注部分token，复杂度从O(L²)降为O(L·W)（W为窗口大小）。适合超长序列。

    - Multi-Query / Grouped-Query Attention (MQA/GQA)：在模型结构层面减少KV缓存，间接加速推理。FlashAttention等均支持这些变体。

    - HyperAttention：利用低秩近似和哈希技术，进一步加速长序列注意力。

    - StreamingLLM：通过保留少量“attention sink” token，实现无限长度输入的高效推理。

    这些实现通常可组合使用，例如在分布式长序列训练中，使用Ring Attention结合FlashAttention，在节点间进行通信的同时，节点内利用FlashAttention进行快速计算。

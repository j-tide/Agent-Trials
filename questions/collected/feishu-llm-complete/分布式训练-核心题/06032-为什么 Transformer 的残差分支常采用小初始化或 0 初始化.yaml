content:
  prompt: 为什么 Transformer 的残差分支常采用小初始化或 0 初始化？
answer:
  mode: rubric
  reference_answer: |-
    残差分支（即每个子层本身的输出通路）采用小初始化或 0 初始化，是为了在训练初期让模型表现为一个“恒等映射”，从而确保深层网络的信号和梯度能够稳定传播。

    - 训练早期的稳定性：在训练刚开始时，注意力层和 FFN 层的权重是随机初始化的，它们的输出带有大量噪声。如果这些噪声不加约束地通过残差连接与主干信号相加，会迅速破坏主干中有用的嵌入信息，导致模型早期训练极不稳定甚至发散。

    - 如何实现“恒等映射”：通过将残差分支的最后一层（如注意力输出投影矩阵、FFN 的第二层线性层）的权重初始化为 0，或者初始化为非常小的值，那么整个子层（例如一个完整的注意力块）的初始输出就几乎为 0。这样，x + Sublayer(x) ≈ x，模型输出近似于输入，表现为恒等映射。

    - 好处：随着训练的进行，这些被抑制的权重会逐渐学习到有意义的变换，模型平稳地从“复述”输入过渡到“改造”输入。这种技巧显著提高了深层 Transformer 的训练稳定性，降低了对学习率的敏感性，是现代大模型训练的标配。例如，LLaMA 在 FFN 的第二层和注意力输出投影上就采用了特殊的初始化缩放。


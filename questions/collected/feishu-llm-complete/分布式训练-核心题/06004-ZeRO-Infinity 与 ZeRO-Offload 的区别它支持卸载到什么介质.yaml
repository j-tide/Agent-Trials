content:
  prompt: ZeRO-Infinity 与 ZeRO-Offload 的区别？它支持卸载到什么介质？
answer:
  mode: rubric
  reference_answer: |-
    ZeRO-Offload 仅支持卸载到 CPU 内存，当模型大到连 CPU 内存都不够时（例如训练 100B+ 模型，优化器状态可能需要数百 GB），ZeRO-Infinity 登场了。

    ZeRO-Infinity 将卸载能力扩展到NVMe 固态硬盘，构建了一个 GPU 显存 → CPU 内存 → NVMe 硬盘的三级存储体系。它突破了单服务器物理内存的上限，使得在有限硬件上训练万亿参数模型成为可能。


content:
  prompt: Megatron 的 checkpoint 与 Hugging Face 格式如何转换？
answer:
  mode: rubric
  reference_answer: |-
    Megatron 保存的 checkpoint 包含 TP 和 PP 分片，与 HuggingFace 的模型结构不同，需要转换。常用工具是 Megatron 官方或社区提供的转换脚本，如 megatron_to_hf.py。过程大致为：

    - 根据 Megatron checkpoint 的 TP/PP 配置，收集所有分片，组装成完整权重。

    - 将 Megatron 特有的层命名映射到 HuggingFace 模型的命名（如 query_key_value 权重拆分成 Q、K、V）。

    - 处理嵌入层、LayerNorm 等差异。

    - 保存为 HuggingFace 格式的 pytorch_model.bin 或 model.safetensors。

    反向转换（HF→Megatron）也存在对应脚本。这些脚本通常位于 Megatron-LM 仓库的 tools/ 目录下。使用时需根据具体模型配置调整。

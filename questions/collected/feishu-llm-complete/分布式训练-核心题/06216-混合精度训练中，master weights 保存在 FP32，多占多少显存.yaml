content:
  prompt: 混合精度训练中，master weights 保存在 FP32，多占多少显存？
answer:
  mode: rubric
  reference_answer: |-
    混合精度训练的标准流程是：前向传播和反向传播使用FP16的权重和激活值，以利用Tensor Core加速；但在优化器更新时，需要一个FP32的高精度权重副本来累积微小的梯度更新。这个FP32副本就是master weights。

    它的显存开销非常直接：每个参数需要额外存储4字节的FP32副本。对于10B参数的模型，就是 10×10⁹ × 4 bytes = 40GB。对于7B模型，约28GB。这部分显存是混合精度训练为数值稳定性付出的代价。

    为什么必须要FP32？FP16的尾数只有10位，能表示的精度约3位有效数字。当梯度很小（训练后期常见）时，FP16可能无法表示梯度和权重的比值，导致更新被截断为零，训练停滞。FP32的23位尾数提供了足够的精度来累积这些微小更新，保证训练的持续进行。

    在ZeRO优化中，master weights同样被分片。使用ZeRO-2且8张卡时，这40GB被均分到每张卡，单卡仅需5GB，不再是瓶颈。

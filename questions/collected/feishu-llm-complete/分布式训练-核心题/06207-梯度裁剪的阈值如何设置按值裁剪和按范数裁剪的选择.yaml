content:
  prompt: 梯度裁剪的阈值如何设置？按值裁剪和按范数裁剪的选择。
answer:
  mode: rubric
  reference_answer: |-
    梯度裁剪是防止梯度爆炸的直接手段。核心是设定一个阈值，如果梯度超过阈值，就将其缩回到合理范围。

    阈值设置方法：

    - 经验值：对于Transformer大模型，常见的梯度裁剪阈值设为1.0。这是一个经过大量实验验证的安全值，能有效防止大多数梯度爆炸。

    - 基于历史统计：记录前N步的梯度范数，取第90或95百分位数作为阈值。这样能自适应数据分布，避免固定阈值过松或过紧。

    - 逐步调优：在训练初期，用较小阈值（如0.5），观察梯度范数的分布。如果经常触发裁剪，可适当放宽；如果偶尔出现极大值（尖峰），阈值就设在这个尖峰之下。

    - 模型规模调整：大模型由于参数量大，整体梯度范数可能偏高，阈值通常设为1.0~5.0。小模型可设0.5~1.0。

    按值裁剪 vs 按范数裁剪：

    - 按值裁剪：对每个梯度元素独立截断，将范围限制在[-v, v]内。优点是简单，能精确控制每个元素的上下限。缺点是可能破坏梯度的整体方向，因为不同参数的梯度可能被不同程度地截断，导致更新方向偏离真实梯度方向。适用于需要精细控制单个参数更新量的场景，如某些特定的正则化或防御对抗攻击，但在大模型训练中较少使用。

    - 按范数裁剪：计算全局梯度的L2范数，如果超过阈值，则对整个梯度向量等比例缩放，使得缩放后的范数等于阈值。这保留了梯度的方向，只限制了“步长”。这是目前训练Transformer和大模型的标准方法，因为它不会扭曲梯度的方向信息，仅防止单步更新过大。

    总结：大模型训练中几乎总是使用按范数裁剪，阈值设为1.0作为起点。按值裁剪只在特殊需要时使用。

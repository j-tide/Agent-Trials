content:
  prompt: 28.在多机训练中，如果节点间的网络出现问题，会出现什么现象？
answer:
  mode: rubric
  reference_answer: |-
    常见现象包括：

    - 训练挂起（Hung）：所有 GPU 的利用率降为 0%，Loss 不再变化，程序既无进度也无报错。这是因为某个通信操作（如 AllReduce）一直等不到远程数据，超时尚未触发。

    - NCCL 超时错误：NCCL 在默认的超时时间（由 NCCL_COMM_TIMEOUT 控制）后报错，通常是 Watchdog timeout 或 transport error。

    - 日志中的连接错误：例如 NCCL WARN NET/IB : Got completion with error、connection reset by peer 等。

    - 性能骤降：网络不稳定导致大量重传，通信时间显著增加，训练吞吐下降。

    - 死锁：如果部分节点的通信组初始化失败，但其他节点正常，可能出现部分 rank 等待永远不会到达的集合操作。

    排查时，首先检查交换机、线缆、网卡指示灯；使用 ibstatus 或 ibstat 查看 InfiniBand 链路状态；使用 iperf 或 nccl-tests 测试带宽和延迟。

content:
  prompt: 推理时 MoE 的优势：只激活部分专家，推理计算量小。
answer:
  mode: rubric
  reference_answer: |-
    在推理阶段，MoE 的优势尤为突出，因为它完美诠释了“大容量、低成本”。

    - 计算量可控：对于每个 token，模型仍然通过门控选出 Top-k 个专家（通常 k=1 或 2），然后只在这些专家上进行 FFN 计算，其余专家完全闲置。因此，单 token 的计算量仅相当于一个具有相同隐藏维度的稠密模型 FFN 的 k 倍（若专家维度与稠密 FFN 相同）。如果专家维度被等比缩小（如 Mixtral 的专家维度只是稠密模型的一半），总计算量甚至可以更低。

    - 显存占用：虽然所有专家的权重都需要存放在显存中（或通过 EP 分布存储），但在生成时，KV Cache 才是显存的主要消耗者，而 MoE 的注意力部分与稠密模型完全相同，KV Cache 大小也相同。只是模型权重多了一些，但可以通过多 GPU 分担。对于长序列生成，KV Cache 往往比权重更占显存，所以 MoE 的显存劣势并不明显。

    - 速度与质量的权衡：MoE 可以用比同参数稠密模型快得多的速度完成推理，同时因为总参数大而保持更好的性能。例如，Mixtral 8x7B 的推理速度约等于一个 13B 的稠密模型，但性能却接近 30B 的稠密模型。这就是 MoE 在推理上的巨大优势。

    - 工程优化：在部署时，可以将热门专家缓存，冷门专家卸载到 CPU 内存，动态调度。vLLM 等框架已经支持 MoE 模型的专家并行和动态加载，进一步降低了单卡门槛。

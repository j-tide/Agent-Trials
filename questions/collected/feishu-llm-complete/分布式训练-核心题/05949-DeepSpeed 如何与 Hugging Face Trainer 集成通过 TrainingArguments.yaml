content:
  prompt: DeepSpeed 如何与 Hugging Face Trainer 集成？通过 TrainingArguments。
answer:
  mode: rubric
  reference_answer: |-
    HuggingFace 的 Trainer 是训练和微调 Transformers 模型的高层 API，它对 DeepSpeed 提供了原生支持。集成方式非常简单，无需修改训练代码，只需在 TrainingArguments 中传递 DeepSpeed 配置文件的路径。

    具体步骤：

    - 编写一个 DeepSpeed 的配置 JSON 文件（如 ds_config.json），定义 ZeRO 阶段、混合精度、批量大小等。

    - 在 Python 脚本中，创建 TrainingArguments 对象，将 deepspeed 参数指向该配置文件：

    ```python
    from transformers import TrainingArguments, Trainer

    training_args = TrainingArguments(
        output_dir="./results",
        deepspeed="ds_config.json",
        per_device_train_batch_size=8,
        num_train_epochs=3,
        fp16=True,  # 如果配置文件中开启了 fp16
    )
    ```

    - 正常创建 Trainer 并调用 trainer.train()。Trainer 内部会自动检测 DeepSpeed 配置，调用 deepspeed.initialize() 来初始化模型、优化器和学习率调度器。

    - 对于自定义模型或训练循环，也可以直接使用 deepspeed.initialize()，它会返回一个 DeepSpeed 引擎对象，该引擎封装了模型、优化器和训练步逻辑。

    注意：当使用 DeepSpeed 时，Trainer 不再自己创建优化器和学习率调度器，而是由 DeepSpeed 接管。同时，命令行参数如 --deepspeed 可以直接在启动脚本中传递给 trainer，更灵活。

content:
  prompt: 推导 Ring AllReduce 的通信时间公式（与数据大小、带宽、延迟的关系）。
answer:
  mode: rubric
  reference_answer: |-
    设节点数为 N，每个节点上的待归约数据总量为 M（字节），网络链路带宽为 B（字节/秒），通信延迟为 L（秒）。

    基本模型：每步传输一个数据块，大小为 M/N（因为数据被均匀分为N块）。每步通信时间 = 延迟 + 传输时间 = L + (M/N)/B。

    总步数：Reduce-Scatter 需要 (N-1) 步，AllGather 需要 (N-1) 步，共 2(N-1) 步。

    总通信时间（假设串行步，无流水线）：

    T_ring = 2(N-1) × (L + M/(N·B))

    化简：

    T_ring = 2(N-1)L + 2(N-1)M/(N·B)

    当 N 很大时，(N-1)/N ≈ 1，因此带宽项趋近于 2M/B。这意味着无论节点数多少，总传输数据量约为 2M，通信时间主要由延迟项 2(N-1)L 决定。延迟随节点数线性增长，这是 Ring AllReduce 的主要缺点。

content:
  prompt: 随机深度 (Stochastic Depth) 作为一种正则化方法，会带来不稳定吗？
answer:
  mode: rubric
  reference_answer: |-
    随机深度在训练时随机丢弃整个层（将该层输出替换为恒等映射），相当于训练了大量不同深度的子网络。推理时使用完整网络。

    潜在的不稳定因素：

    - 初期训练震荡：如果随机深度的丢弃概率设置过高，训练初期可能因为频繁跳过关键层而导致梯度传播路径不稳定，损失震荡加剧。

    - 与Pre-Norm的交互：Pre-Norm下，层输出被放大后再跳过，可能引入额外的方差。需要适当调整丢弃概率。

    - 与Dropout的叠加：如果同时使用Dropout和随机深度，正则化强度可能过大，导致欠拟合或训练缓慢。

    如何稳定使用：

    - 线性递增的丢弃概率：浅层使用较低的丢弃概率，深层使用较高的丢弃概率。这样浅层特征得以保留，深层的高级语义被正则化。

    - 适中的最大丢弃概率：通常最大概率设为0.1-0.5，不宜过大。

    - 预热：在训练初期不开启随机深度，等模型稳定后再逐步增加概率。

    随机深度在ViT等视觉Transformer中广泛应用，能有效防止过拟合。只要概率设置合理，不会带来训练不稳定。

content:
  prompt: 37.PP 中传递激活值用什么通信原语？Send/Recv。
answer:
  mode: rubric
  reference_answer: |-
    在流水线并行中，每个阶段（一组层）的输出需要传递给下一个阶段作为输入，反向传播时梯度也需要传回前一个阶段。这些传输发生在相邻的阶段之间，属于点对点通信，因此使用 Send 和 Recv 原语。

    具体实现：

    - 前向传播：阶段 k 完成计算后，将其输出激活值（通常是一个张量）通过 Send 发送给阶段 k+1；阶段 k+1 通过 Recv 接收作为输入。

    - 反向传播：阶段 k+1 计算出对输入的梯度后，通过 Send 传回给阶段 k；阶段 k 接收后继续反向。

    这些 Send/Recv 可以通过 NCCL 的 P2P 传输高效执行，支持 GPU 间直接通信（GPUDirect）。由于传输的数据量相对较小（仅层边界处的张量），且频率较低（每个 micro-batch 一次），因此对通信带宽要求远低于 TP。PP 的通信模式天然适合跨节点部署，因为跨节点带宽足以满足其需求。

content:
  prompt: 43.什么是 EFA (Elastic Fabric Adapter)？AWS 上的高性能网络。
answer:
  mode: rubric
  reference_answer: |-
    EFA 是 AWS 提供的定制网络接口，专为高性能计算（HPC）和机器学习训练设计。它支持 OS-bypass（绕过操作系统内核网络栈）和 RDMA（远程直接内存访问），使得应用可以直接在用户态与 EFA 设备通信，极大降低延迟和 CPU 负载。

    特点：

    - 支持标准 libfabric API，NCCL 可以通过 libfabric 与 EFA 集成。

    - 提供低延迟、高带宽（例如 p4d 实例 EFA 带宽可达 400 Gbps）。

    - 支持 GPUDirect RDMA，允许 GPU 直接通过 EFA 访问其他 GPU 内存。

    - 弹性扩展，可以动态附加到实例。

    在 AWS 上训练大模型时，选择支持 EFA 的实例（如 p4d.24xlarge）并配置好 NCCL，可实现接近 InfiniBand 的性能。

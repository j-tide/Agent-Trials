content:
  prompt: "\U0001F321️ 学习率预热 (Warmup) 的作用是什么？不做预热可能发生什么？"
answer:
  mode: rubric
  reference_answer: "学习率预热 是指在训练开始阶段，将学习率从一个非常小的值（或0）逐步线性增加到预设的初始学习率，这个过程通常持续几千个迭代步。\n\n\U0001F50D
    为什么要预热？——度过危险的不稳定期\n\n训练初期，模型参数是随机初始化的，距离一个良好的收敛区域还很远。此时，梯度的估计非常不准确且方差极大。如果直接使用较大的学习率，模型可能会：\n\n-
    参数更新过度：大步长瞬间将参数推向极值区域，导致后续训练中激活值或梯度爆炸，产生Inf/NaN，训练彻底崩溃。\n\n- 陷入糟糕的局部极小：模型可能在初期就被“踢”到一个非常狭窄、泛化性极差的极小值点，之后再难跳出。\n\n-
    对优化器状态的破坏：对于Adam这类维护动量的优化器，在训练初期，动量和方差的估计几乎为零。最初的几次大更新会主导动量的方向，如果这些更新是噪音，就会污染优化器状态，使模型在错误的方向上走得更远。\n\n预热就像一个缓冲期，让模型用小步长“试探”地形，逐渐建立起对梯度方向和尺度的可靠估计（优化器状态得以稳定），之后再放开学习率，在相对平滑的区域内进行高效优化。\n\n\U0001F4A1
    对Transformer尤其重要：Transformer的层归一化和残差连接使得网络对初始化极其敏感。没有预热，训练往往在几百步内就崩掉。因此，几乎所有大语言模型的训练都标配学习率预热。\n\n---"

content:
  prompt: "⚡ 什么是混合精度训练？为什么需要混合精度？"
answer:
  mode: rubric
  reference_answer: "混合精度训练是一种在训练过程中同时使用低精度和高精度浮点数的技术。通常，前向和反向传播使用16位浮点（FP16或BF16）来大幅加速计算并节省显存，而参数的更新和主副本则保留32位浮点（FP32）以保持最终模型的精度和训练稳定性。\n\n\U0001F680
    为什么需要混合精度？——速度与显存的双重收益\n\n- 极致加速：现代GPU（如NVIDIA A100/H100、V100）都配备了专门的Tensor Core，它们在执行FP16/BF16格式的矩阵乘加运算时，吞吐量是FP32的数倍甚至十几倍。利用混合精度，能显著缩短训练时间。\n\n-
    显存减半：模型参数和激活值占用的显存减少一半，意味着可以训练更大的模型，或者使用更大的批量大小（Batch Size），这往往能提升训练稳定性和收敛效果。\n\n\U0001F6E1️
    然而，全FP16训练会崩溃——所以需要混合\n\n- 数值范围太小：FP16能表示的最小正规数约为6.1×10⁻⁵，最大为65504。在训练中，很多梯度值（尤其是网络浅层或训练后期）会小到导致下溢（变为0），使参数无法更新；而有些值会大到溢出（变为Inf/NaN），导致模型崩溃。\n\n-
    精度损失：FP16只有10位尾数（有效数字约3-4位），而FP32有23位（有效数字约7-8位）。当梯度值差别很大时，小的梯度可能被大的梯度“吞没”而失去作用。\n\n\U0001F4A1
    混合精度的核心工作流：\n\n- 维护FP32主参数副本：在内存中保留一份FP32的参数，作为训练过程中最可靠的“真实值”。\n\n- 前向和反向用FP16：将主参数转换为FP16进行前向计算，得到损失；反向传播也使用FP16计算，得到FP16梯度。\n\n-
    Loss Scaling（仅在FP16下需要）：将损失乘以一个较大的缩放因子，反向传播后梯度被等比例放大，从而避免小梯度下溢。在更新参数前，再将梯度缩小回原来比例。（如果使用BF16，则无需此步骤，因为BF16指数位多，动态范围与FP32一致）。\n\n-
    FP32更新：将缩放后的FP16梯度转换为FP32，应用于FP32的主参数副本上，完成一次参数更新。\n\n\U0001F4A1 FP16与BF16的选择：现代大模型训练大多转向BF16，因为它与FP32有相同的8位指数位，动态范围极大，几乎不会出现溢出或下溢，因此不需要Loss
    Scaling，训练更加稳定，已成为主流。FP16在更老的GPU（V100）上仍然是首选。\n\n---"

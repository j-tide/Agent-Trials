content:
  prompt: "\U0001F504 描述深度学习训练的一个标准迭代步骤：前向、反向、优化器更新。"
answer:
  mode: rubric
  reference_answer: "训练神经网络的一个核心迭代循环，就是反复执行三个步骤：前向传播、反向传播、优化器更新。每一步都有其特定任务，互相依赖。\n\n\U0001F4CC
    步骤一：前向传播（Forward Pass）\n\n- 做什么：将一小批数据（mini-batch）输入网络，从输入层到输出层逐层计算，每一层进行线性变换（矩阵乘法）和非线性激活（如ReLU/GELU）。\n\n-
    产出：最终的预测输出，以及损失值（Loss）——衡量预测与真实标签差距的标量。\n\n- 额外工作：框架（如PyTorch）会悄悄地记录下这次前向传播的计算图（Computational
    Graph），并保留中间激活值（Activations）（如每层的输出、注意力得分等）。这些激活值将在反向传播中用于计算梯度。\n\n\U0001F4CC
    步骤二：反向传播（Backward Pass）\n\n- 做什么：从损失值出发，沿着前向传播建立的计算图逆向行走，应用链式法则自动计算损失对于每一个可学习参数的梯度（Gradient）。\n\n-
    依赖：这个过程严重依赖前向传播保存的激活值。例如，计算一个线性层权重的梯度，需要该层的输入激活值。\n\n- 结果：所有可学习参数（权重和偏置）都会得到对应的梯度，这些梯度指明了降低损失的方向。\n\n\U0001F4CC
    步骤三：优化器更新（Optimizer Step）\n\n- 做什么：优化器（如AdamW）根据计算出的梯度，按照其特定的更新规则，去调整模型的参数值。\n\n-
    例如，简单的随机梯度下降（SGD）的更新规则是：参数 = 参数 - 学习率 × 梯度。而AdamW会更复杂，会维护梯度的动量和方差来平滑更新。\n\n- 收尾：更新完成后，清零所有参数的梯度，准备下一轮迭代。如果不清零，梯度会默认累加，这在某些场景下有用，但对标准训练通常需要清零。\n\n\U0001F4A1
    通俗比喻：这就像一个学生做练习题（Forward），然后对照答案批改打分（Loss）。接着分析每一道题的错误原因（Backward），最后根据错因和自己的学习策略调整知识掌握（Optimizer
    Step）。\n\n---"

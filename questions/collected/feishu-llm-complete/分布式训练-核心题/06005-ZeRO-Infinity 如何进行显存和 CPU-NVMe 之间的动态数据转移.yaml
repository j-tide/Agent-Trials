content:
  prompt: ZeRO-Infinity 如何进行显存和 CPU/NVMe 之间的动态数据转移？
answer:
  mode: rubric
  reference_answer: |-
    ZeRO-Infinity 像一个智能交通调度系统，实时预测模型的计算需求，提前将数据从慢速存储（NVMe）搬运到快速存储（CPU 内存或 GPU 显存），并在不需要时移回慢速存储。

    动态转移策略：

    - 预取：在 GPU 计算当前层时，后台线程根据计算图分析，提前从 NVMe 将下一层所需的参数、梯度或优化器状态加载到 CPU 内存缓冲区。当 GPU 需要时，数据已在 CPU 内存中，只需一次 PCIe 传输即可到达 GPU。

    - 换出：当 GPU 或 CPU 内存空间不足时，将当前最不急需的数据（如已经反向传播完的层的优化器状态）异步写入 NVMe，释放空间给即将需要的数据。

    - 带宽优化：ZeRO-Infinity 针对 NVMe 的特性进行了专门的 I/O 优化，包括批量顺序读写、并行化 SSD 访问、对齐块大小等，以最大化吞吐量。它还会智能地在 CPU 内存中缓存热点数据，减少 NVMe 访问次数。

    通过这种动态、预取式的数据调度，ZeRO-Infinity 将原本不可行的 NVMe 训练变为可能，尽管速度会慢很多（可能是纯 GPU 训练的 2~10 倍），但对于极限规模的实验，这是有价值的。

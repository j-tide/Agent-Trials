content:
  prompt: 为什么现代大模型都用 RMSNorm 而不是 LayerNorm？对稳定性有影响吗？
answer:
  mode: rubric
  reference_answer: |-
    RMSNorm是LayerNorm的简化版，去掉了“减去均值”的步骤，只做缩放：y = x / RMS(x) * γ，其中RMS(x) = sqrt(mean(x²) + ε)。

    为什么大模型青睐RMSNorm？

    计算效率：LayerNorm需要计算均值和方差两个统计量，RMSNorm只需计算均方根。在千亿参数、百万步训练中，省去均值计算能节省约5%-10%的归一化开销。虽然单步节省微乎其微，但累积起来相当可观。

    效果相当：大量实验（包括LLaMA、PaLM等）表明，RMSNorm在收敛速度和最终效果上与LayerNorm几乎无差异。原因是减去均值这个操作，在深层网络中后续的线性变换可以通过学习偏置来自适应补偿。即模型自己“学会”了如何处理未中心化的数据。有理论分析甚至认为，强制中心化可能在某些情况下破坏有用的特征偏移信息。

    数值稳定性：RMSNorm在混合精度训练中可能略微更稳定，因为少了一次减法操作，减少了精度损失的机会。但这不是主要考量。

    因此，RMSNorm凭借更低的计算开销和同等的效果，成为了大模型的标配。对训练稳定性没有负面影响，反而因为更少的计算可能带来微小的吞吐提升。

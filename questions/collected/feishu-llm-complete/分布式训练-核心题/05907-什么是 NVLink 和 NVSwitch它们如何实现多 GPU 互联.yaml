content:
  prompt: 23.什么是 NVLink 和 NVSwitch？它们如何实现多 GPU 互联？
answer:
  mode: rubric
  reference_answer: |-
    NVLink 是 NVIDIA 开发的一种高带宽、低延迟的 GPU 直连总线技术。它允许 GPU 之间直接进行点对点数据传输，无需通过 PCIe 总线或 CPU。每块 A100 GPU 拥有 12 条 NVLink 链路，每条链路单向带宽 50 GB/s，总带宽 600 GB/s（双向）。

    NVSwitch 是一个高速交换芯片，用于连接多个 GPU 的 NVLink 链路，使它们能够实现全互联（all-to-all connectivity）。在 DGX A100 系统中，6 个 NVSwitch 将 8 块 GPU 的 NVLink 全部连接在一起，使得任意两个 GPU 之间都能以最高 600 GB/s 的带宽通信，就像所有 GPU 都在一个巨大的全连接网络内。

    工作原理：

    - 每个 GPU 的 NVLink 端口都连接到 NVSwitch 上。

    - NVSwitch 内部有交叉开关，可以根据 GPU 的请求实时建立通信路径，并发处理多组 GPU 对之间的数据交换。

    - NVSwitch 使得类似于 Ring 的通信算法可以更快执行，因为不再需要多跳中转，任何 GPU 都能直接访问其他 GPU。

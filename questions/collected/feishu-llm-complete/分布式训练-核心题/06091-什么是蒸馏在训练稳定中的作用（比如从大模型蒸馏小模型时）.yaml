content:
  prompt: 什么是“蒸馏”在训练稳定中的作用？（比如从大模型蒸馏小模型时）
answer:
  mode: rubric
  reference_answer: |-
    知识蒸馏是将一个大型教师模型的知识迁移到小型学生模型的过程。它在稳定性方面的作用常常被低估。

    稳定性的贡献：

    - 提供平滑的目标分布：教师模型的softmax输出（软标签）携带了类别之间的相似性信息（例如，一个猫的图片，教师可能预测80%是猫，15%是老虎，5%是豹）。相比硬标签（one-hot），软标签提供了更丰富的监督信号，目标分布更平滑，避免学生模型过于极端地拟合某个类别，从而减少过拟合和训练震荡。

    - 正则化效果：软标签可以看作是一种标签平滑，能提升模型的泛化能力和校准度。这使得学生模型在数据量少或噪声大的场景下更稳定。

    - 加速收敛：学生模型不必从零开始探索，而是直接学习教师已经提炼好的特征表示，训练曲线更平滑，收敛更快。

    - 减弱噪声标签影响：如果训练数据中存在错误标签，硬标签会强迫模型学习错误映射，而软标签由于概率分散，对错误标签有一定的容错能力。

    在蒸馏过程中，温度系数T控制软标签的平滑度：较高的T使分布更软，提供更多暗知识，但可能模糊类别边界；较低的T更接近硬标签。实践中常将T设在2~10之间，配合适当的损失权重（蒸馏损失与硬标签损失），能使训练更加稳定和高效。

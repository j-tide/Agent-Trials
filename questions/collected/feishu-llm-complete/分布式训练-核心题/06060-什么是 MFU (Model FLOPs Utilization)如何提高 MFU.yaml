content:
  prompt: 什么是 MFU (Model FLOPs Utilization)？如何提高 MFU？
answer:
  mode: rubric
  reference_answer: |-
    MFU (Model FLOPs Utilization) 是衡量训练过程中 GPU 实际有效计算能力发挥程度的指标，定义为：

    MFU = (实际吞吐量下每秒的FLOPs) / (GPU理论峰值FLOPs)

    它反映了硬件计算资源被真正用于模型计算的比例，而非消耗在通信、等待、或低效计算上。MFU 越接近 100%，训练效率越高。

    如何提高 MFU？

    - 增大批次大小 (Batch Size)：更大的批次可以提高 GPU 的并行度，使 Tensor Core 更充分地工作，减少单次计算启动的开销。但受限于显存，需要配合梯度累积。

    - 优化并行策略：数据并行(DP)通信量较小但显存冗余，模型并行(MP)可突破单卡显存但通信量大。使用 3D 并行（DP+TP+PP）并结合 ZeRO 优化，可以找到计算与通信的最佳平衡点。

    - 计算与通信重叠：利用 CUDA Stream 等技术，将梯度同步等通信操作与反向传播计算重叠，隐藏通信延迟。

    - 选择高效的数据类型：使用 BF16/FP16 混合精度训练，充分利用 Tensor Core 的加速能力。与 FP32 相比，吞吐量可以翻倍。

    - 使用优化的库和编译器：使用 FlashAttention 加速注意力计算，使用 PyTorch 2.0 的 torch.compile、xFormers、DeepSpeed 等框架，自动进行算子融合和图优化。

    - 确保数据加载不成为瓶颈：使用高 I/O 带宽的存储，多线程预取数据，确保 GPU 总是有数据可算。


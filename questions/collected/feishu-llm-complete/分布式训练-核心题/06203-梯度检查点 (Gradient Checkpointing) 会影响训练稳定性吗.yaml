content:
  prompt: 梯度检查点 (Gradient Checkpointing) 会影响训练稳定性吗？
answer:
  mode: rubric
  reference_answer: |-
    一般不会影响训练稳定性。Gradient Checkpointing只是改变了激活值的存储策略：前向传播时不保存所有中间激活，反向传播时重新计算被丢弃的激活值。它不改变前向传播和反向传播的计算逻辑，也不改变梯度值本身（在数值精度范围内）。

    需要注意的细微影响：

    - 数值精度：重计算时由于浮点运算的非结合性，结果可能与原始计算有微小差异（通常在1e-7量级）。对于混合精度训练，这个差异可能略微放大，但通常不足以影响收敛。

    - Dropout等随机操作：如果模型中有Dropout，重计算时因为随机种子可能不同（取决于框架实现），会导致激活值与原始前向传播不一致。PyTorch等框架对此有专门处理，确保重计算时使用相同的mask。

    - BatchNorm：如果模型中有BatchNorm，重计算时统计量可能不同。但Transformer使用LayerNorm，不受此影响。

    因此，Gradient Checkpointing是一个“安全”的显存优化技术，可以放心使用。它与混合精度、ZeRO等结合使用，是训练大模型的标准配置。

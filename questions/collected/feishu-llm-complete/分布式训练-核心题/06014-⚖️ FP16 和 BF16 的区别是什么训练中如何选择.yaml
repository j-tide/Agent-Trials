content:
  prompt: "⚖️ FP16 和 BF16 的区别是什么？训练中如何选择？"
answer:
  mode: rubric
  reference_answer: "FP16（IEEE 754半精度浮点）和 BF16（Brain Floating Point 16）都是16位的浮点数格式，但它们在内部结构上的一个关键差异，直接决定了它们在大模型训练中的适用性。\n\n\U0001F4CA
    内部结构对比\n\n\U0001F50D 核心差异：指数位决定了命运的走向\n\n- FP16 仅有5位指数，能表示的最小正规数约 6.1×10−56.1×10−5，最大值约65504。在深度学习中，训练早期的梯度可能非常大（溢出为Inf），而后期或浅层的梯度可能非常小（下溢为0）。这种狭窄的动态范围使得FP16训练变得脆弱，必须引入Loss
    Scaling来人工维持梯度在合理范围。\n\n- BF16 拥有与FP32相同的8位指数，动态范围极大，几乎不可能在正常训练中发生溢出或下溢。虽然尾数精度较低，但深度神经网络对权重的微小变化本身具有鲁棒性，而且梯度的更新方向主要由较大的梯度分量主导，BF16的精度损失在宏观上影响甚微。\n\n\U0001F6E0️
    训练中如何选择？\n\n选择哪种格式主要取决于你的GPU硬件和训练稳定性需求：\n\n- 如果使用 NVIDIA A100/H100 或 Google TPU：首选BF16。这些硬件原生支持BF16矩阵运算，且有Tensor
    Core加速。BF16的最大优势是无需Loss Scaling，训练曲线更平滑，超参数鲁棒性更强。它几乎不会出现梯度消失或爆炸的问题，显著降低了调试成本。\n\n-
    如果使用 NVIDIA V100 或更老的GPU：必须用FP16，因为这些硬件不支持BF16的Tensor Core。FP16训练需要谨慎使用Loss Scaling和动态调整策略来维持稳定。\n\n-
    混合场景：在超大规模训练中，即使硬件支持BF16，有时也会将优化器状态和主参数副本保持FP32，而前向和反向计算用BF16。这是标准混合精度训练的延伸。\n\n\U0001F4A1
    实践经验：现在几乎所有的大模型（LLaMA、GPT-4等）都采用BF16训练。如果条件允许，直接选BF16，省去Loss Scaling的调参烦恼，并能更稳定地收敛。\n\n---"

content:
  prompt: 用 DeepSpeed 训练一个模型，命令行如何启动？deepspeed 命令。
answer:
  mode: rubric
  reference_answer: |-
    使用 DeepSpeed 启动训练非常简单，它封装了 torchrun 的底层逻辑，并添加了配置文件的解析。基本用法：

    ```bash
    deepspeed --num_gpus=8 train.py --deepspeed ds_config.json
    ```

    对于多节点训练：

    ```bash
    # 节点 0 (master)
    deepspeed --num_gpus=8 --num_nodes=2 --node_rank=0 --master_addr=10.0.0.1 train.py --deepspeed ds_config.json

    # 节点 1
    deepspeed --num_gpus=8 --num_nodes=2 --node_rank=1 --master_addr=10.0.0.1 train.py --deepspeed ds_config.json
    ```

    deepspeed 命令会自动启动 torchrun，并解析 ds_config.json 中的各项配置。训练脚本中不再需要使用 torchrun 启动，也不需要在脚本内手动初始化 DDP（DeepSpeed 内部会调用 deepspeed.initialize 完成这些工作）。

    训练脚本的核心适配（与普通 PyTorch 脚本的区别）：

    - 使用 deepspeed.initialize 替代手动构建 model、optimizer 和 dataloader（可选）。

    - 返回的 model_engine 是封装后的模型，可以像普通模型一样调用 model_engine.backward(loss) 和 model_engine.step()。

    - 不需要手动 optimizer.zero_grad()，DeepSpeed 会管理。

    ```python
    import deepspeed

    # 初始化 DeepSpeed 引擎
    model_engine, optimizer, _, _ = deepspeed.initialize(
        args=args,
        model=model,
        model_parameters=model.parameters()
    )

    # 训练循环
    for batch in dataloader:
        outputs = model_engine(batch)
        loss = criterion(outputs, targets)
        model_engine.backward(loss)   # 自动梯度同步
        model_engine.step()           # 自动参数更新
    ```

    如果使用 HuggingFace Trainer，甚至不需要写上述代码，直接在 TrainingArguments 中指定 --deepspeed ds_config.json 即可自动集成。


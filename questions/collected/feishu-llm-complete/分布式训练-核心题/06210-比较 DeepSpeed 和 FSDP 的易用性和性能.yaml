content:
  prompt: 比较 DeepSpeed 和 FSDP 的易用性和性能。
answer:
  mode: rubric
  reference_answer: |-
    易用性：

    - DeepSpeed 通过 JSON 配置文件管理一切，对新手友好，特别是与 HuggingFace Trainer 的集成开箱即用。其 Offload 和 ZeRO 系列非常成熟，报错信息相对清晰。

    - FSDP 是 PyTorch 原生 API，需要编写更多代码来定义分片策略、混合精度、状态字典保存/加载等。但它的灵活性更高，可以更细粒度地控制哪些部分分片、哪些不分片。与 PyTorch 2.0 的 torch.compile 结合更好。

    性能：

    - 在标准场景下，两者的吞吐量相差不大。DeepSpeed 经过大规模集群验证，通信调度优化较好，尤其在 ZeRO-3 上。FSDP 在 limit_all_gathers 等参数下调优后性能提升明显，且由于是 PyTorch 原生实现，与未来 PyTorch 编译器优化结合更紧密。

    - DeepSpeed 的 Offload 到 CPU/NVMe 是目前最成熟的，FSDP 的 Offload 还在快速发展中。

    结论：如果追求快速上手、稳定可靠，DeepSpeed 更合适；如果希望保持纯 PyTorch 技术栈、追求极致自定义和与 PyTorch 2.0 的融合，FSDP 是更好的选择。两者并非互斥，很多团队在预训练用 DeepSpeed，在微调或特定研究中使用 FSDP。

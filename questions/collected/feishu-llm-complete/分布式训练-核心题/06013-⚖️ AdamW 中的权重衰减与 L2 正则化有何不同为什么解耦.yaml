answer:
  mode: rubric
  reference_answer: "这个问题触及了优化器设计的核心。在标准SGD中，L2正则化和权重衰减是等价的，但在Adam这类自适应学习率算法中，它们完全不是一回事，而AdamW正是通过解耦纠正了这个错误。\n\n\U0001F50D
    L2正则化 vs 权重衰减\n\n[图片内容未导入]\n\n- 恢复了权重衰减的本来意义——作为一个均匀的正则化器，驱动模型向简单解（参数更小）靠拢。\n\n-
    显著提升了泛化性能，使得AdamW既能享有Adam的快速收敛，又拥有接近SGD的泛化能力。\n\n\U0001F4A1 一句话：L2正则化在Adam中被自适应学习率扭曲了，而AdamW的权重衰减是“直给”的，不被扭曲，因此效果更好。\n\n---"

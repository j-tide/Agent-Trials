  prompt: 数据预处理（如 tokenization, masking）应该在线还是离线完成？
answer:
  mode: rubric
  reference_answer: |-
    ### 离线预处理（推荐于大规模预训练）

    - 流程：在训练启动前，一次性将原始文本转换为token ID序列，并保存为二进制文件（如.npy, .arrow, .tfrecord）。

    - 优势：

    - 劣势：

    ### 在线预处理

    - 流程：在每个训练Step中，实时对原始文本进行分词、截断等操作。

    - 优势：

    - 劣势：

    ### 折中方案：半在线预处理

    - 将最耗时的步骤（如HTML标签去除、文本清洗、分句）离线处理，保存为中间格式。

    - 训练时仅执行轻量级的操作（如随机掩码、动态截断），兼顾灵活性和效率。


content:
  prompt: 10. Broadcast 的作用，什么情况下需要？（如分发初始权重）
answer:
  mode: rubric
  reference_answer: |-
    Broadcast 是将根节点（rank 0）上的数据复制到所有其他节点的操作。操作完成后，所有节点拥有相同的数据。

    应用场景：

    - 初始化模型权重：在训练启动时，所有GPU必须拥有相同的初始权重。通常由rank 0进行随机初始化，然后通过Broadcast将权重分发给所有其他GPU。这确保了所有数据并行副本从同一起点出发。

    - 分发超参数或配置：当需要动态更新训练配置（如学习率调整）时，通过Broadcast从一个节点广播给所有节点。

    - 数据并行中的梯度分发（现在很少）：在参数服务器架构中，服务器更新参数后Broadcast给工作节点。

    - 模型并行中的参数广播：在TP或PP中，某些仅在一张卡上的参数需要广播给组内其他卡。

    - ZeRO-3中参数AllGather的替代：如果某个参数原本就只在某张卡上（如Embedding的某些行），可以用Broadcast而非AllGather。

    Broadcast的通信量等于数据大小M，根节点发送M，其他节点接收M。总耗时约为 L + M/B。

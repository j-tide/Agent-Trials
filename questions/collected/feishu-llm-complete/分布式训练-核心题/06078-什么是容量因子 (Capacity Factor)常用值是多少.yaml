content:
  prompt: 什么是“容量因子” (Capacity Factor)？常用值是多少？
answer:
  mode: rubric
  reference_answer: |-
    容量因子是控制专家容量弹性的乘数，表示专家可处理 token 数相对于平均分配量的倍数。

    常用值：1.0 ~ 1.5。

    - 1.0：刚好平均，没有余量，一旦不均立即溢出。

    - 1.25：留有 25% 余量，常见折中值。

    - 1.5：更宽裕，溢出率更低，但资源浪费略多。

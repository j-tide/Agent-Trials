content:
  prompt: 什么是“训练不稳定”的早期信号？（如梯度范数突变）
answer:
  mode: rubric
  reference_answer: |-
    训练不稳定是深度学习中的常见问题，尤其在训练大模型时。如果能识别早期信号，就能在模型彻底崩溃（出现 NaN）前采取措施，节省数小时甚至数天的训练时间。

    早期信号主要有：

    - Loss 尖峰：训练损失在某个 Step 突然剧烈升高，达到正常值的数倍甚至数十倍，随后又回落。这是梯度爆炸的直接体现，通常由异常数据或学习率与模型当前状态不匹配引起。

    - 梯度范数突变：与 Loss 尖峰相伴，梯度范数会在某个 Step 远超历史平均水平。持续监控梯度范数，并设置一个动态阈值（如历史均值的 5-10 倍），可以在参数被破坏前发出警报。

    - 激活值分布漂移：监控各层输出的均值和方差。如果发现深层的激活值均值逐渐偏离 0，或方差持续增大/减小，说明信号传播出现问题，可能是初始化或学习率不当。

    - 权重范数突变：某一层的权重 L2 范数突然大幅增加，说明该层可能成为训练崩溃的“爆发点”。

    - 优化器状态异常：对于 Adam，如果某个参数组的二阶动量 (v) 出现 NaN 或 Inf，预示着该组参数即将崩溃。

    - “峰值”后的连锁反应：一次 Loss 尖峰虽然可能自动恢复，但它往往会在优化器动量中留下“后遗症”，导致后续训练更加不稳定，可能在短时间内再次出现尖峰，最终引发 NaN。

    应对措施：当检测到上述信号时，最佳实践是立即暂停训练，回滚到最近的健康 Checkpoint，诊断并排除故障（如剔除异常数据、降低学习率），然后从该点恢复训练。很多训练框架支持自动跳过导致 Loss 尖峰的 Batch。


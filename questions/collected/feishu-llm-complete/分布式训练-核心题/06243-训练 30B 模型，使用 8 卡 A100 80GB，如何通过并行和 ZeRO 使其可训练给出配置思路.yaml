  reference_answer: |-
    显存需求估算

    30B参数模型，使用混合精度训练：

    - FP16权重：30B × 2 bytes = 60 GB

    - FP16梯度：60 GB

    - Adam优化器状态（m+v FP32 + FP32主权重）：30B × 12 bytes = 360 GB

    - 模型状态总计：60 + 60 + 360 = 480 GB

    - 8张A100总显存为 8 × 80 = 640 GB，看似足够，但数据并行下每张卡需保存全部模型状态，单卡480GB远超80GB，因此必须采用显存优化技术。


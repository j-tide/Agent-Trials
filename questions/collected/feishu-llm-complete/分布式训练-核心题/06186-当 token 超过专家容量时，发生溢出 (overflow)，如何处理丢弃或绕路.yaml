content:
  prompt: 当 token 超过专家容量时，发生“溢出” (overflow)，如何处理？丢弃或绕路。
answer:
  mode: rubric
  reference_answer: |-
    当路由到某个专家的 token 数超过其容量时，多出的 token 称为“溢出 token”，必须处理。

    处理方法：

    - 丢弃：将溢出 token 的专家输出置为 0，相当于只依赖残差连接跳过该 MoE 层。实现简单，但信息丢失。少量随机溢出（<5%）影响不大，大量溢出则损害模型。

    - 绕路（残差路径）：基本等同于丢弃，因为 MoE 层输出为残差加法，溢出 token 直接使用输入作为输出。

    - 共享专家兜底：为所有溢出 token 设置一个不参与路由的独立 FFN（共享专家），统一处理溢出，保证每个 token 都得到专家处理。此方法更精细，但额外增加参数。

    在 Switch Transformer 和 GShard 中，直接采用丢弃策略，配合足够大的容量因子（≥1.25）将溢出率控制在 1% 以下。

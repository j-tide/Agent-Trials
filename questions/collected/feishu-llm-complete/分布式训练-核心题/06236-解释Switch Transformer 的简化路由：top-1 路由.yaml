content:
  prompt: 解释“Switch Transformer” 的简化路由：top-1 路由。
answer:
  mode: rubric
  reference_answer: |-
    Switch Transformer 是 Google 在 2020 年提出的 MoE 架构，它采用了一种极致的简化——Top-1 路由。顾名思义，每个 token 不再像传统 MoE 那样选择 Top-2 或多个专家，而是只被路由到唯一一个专家。这是对“稀疏激活”理念的最彻底实践。

    具体流程：

    - 门控网络接收 token 表示，输出对各专家的 logits。

    - 对 logits 取 softmax，得到概率分布 p。

    - 选择 p 中最大的那个专家索引，将 token 发送给该专家。

    - 专家处理 token，输出结果。由于只有一个专家，不存在加权合并，直接将该专家的输出作为 FFN 层输出。

    为什么用 Top-1？

    - 最小化计算量：每个 token 只激活一个专家，计算量最低，稀疏激活的优势最大化。

    - 结构简单：省去了多专家输出加权合并的步骤，实现更直接。

    - 效果不差：实验表明，在合适的容量和负载均衡下，Top-1 路由的效果可以与 Top-2 媲美，而计算成本更低。

    挑战：Top-1 路由对门控的准确性要求极高。一旦路由决策失误，token 被送到不擅长的专家，输出质量就会下降。此外，Top-1 更容易发生专家坍塌，因为缺乏多专家之间的互补和缓冲。因此 Switch Transformer 需要配合更强的负载均衡策略、更大的容量因子以及训练中的随机路由来确保稳定。

content:
  prompt: 训练过程中，激活值的分布 (Activation Distribution) 异常说明了什么？
answer:
  mode: rubric
  reference_answer: |-
    监控各层激活值的分布是诊断网络训练状态的有力手段。异常分布可能提示多种问题：

    - 激活值均值严重偏离0：可能说明激活函数输出不是零中心的（如 ReLU 输出均为非负），或者存在偏置项过大等问题。这会导致后续层输入的分布偏移，影响梯度方向。

    - 激活值方差过大或过小：方差过大意味着信号膨胀，可能引发梯度爆炸；方差过小意味着信号衰减，导致梯度消失。这通常是初始化不当或学习率过大/过小引起的。理想情况下，各层的激活值方差应保持在1左右。

    - 激活值大量为0（死亡神经元）：对于 ReLU，如果某个神经元对所有输入都输出0，其梯度也为0，永久无法更新。这通常由过大的学习率或不当的初始化导致。监控死亡神经元比例有助于决定是否切换到 Leaky ReLU 等变体。

    - 激活值分布出现双峰或多峰：可能暗示数据中存在多种模式，或者网络不同部分学习了完全不同的特征。这本身不一定有害，但值得关注。

    - 激活值出现 NaN 或 Inf：说明数值溢出，训练已经崩溃。需要立即检查数据、学习率、梯度等。

    可视化工具：使用 TensorBoard 或 wandb 记录各层激活值的直方图、均值和标准差，在训练过程中观察其变化趋势。如果发现某一层的分布逐渐恶化，可以定位问题层并采取相应措施。

content:
  prompt: 为什么推荐在训练过程中定期保存 Checkpoint，并保留最佳模型？
answer:
  mode: rubric
  reference_answer: |-
    这看似基础，却是我见过最多人因为忽视而付出惨痛代价的地方。

    定期保存Checkpoint的核心目的：

    - 故障恢复：硬件故障（GPU、网卡、电源）在大规模集群中是家常便饭。如果你的训练已经跑了三周，因为没有checkpoint而一次性丢失，那损失的不只是算力，更是团队的时间和士气。定期保存（如每1000步）能将损失控制在可接受范围内。

    - 回溯最优状态：随着训练进行，模型可能会过拟合，或者在某个阶段出现loss spike后性能退化。保留历史checkpoint可以让你回到之前的“最佳点”。最佳模型不一定是最后一个。

    - 复现与调试：当你需要分析某个训练阶段的行为时（比如为何中间loss突然上升），你可以加载那个时期的checkpoint进行回放和诊断。

    - 迁移和微调：中间checkpoint可能比最终模型更适合作为下游任务的起点（因为最终模型可能过拟合）。

    最佳实践：

    - 保存频率取决于训练总步数和任务价值。总步数10万步以上，每1000-2000步保存一次；总步数较少，每epoch保存一次。

    - 除了定期保存，还要保留最佳模型：在每个验证评估后，如果当前模型的验证指标（如困惑度、准确率）超越了历史最佳，额外保存一个“best”模型，并标记其步数。

    - 保留最近N个checkpoint（如5个），同时将最佳模型和关键里程碑（如学习率衰减点）的checkpoint单独归档，防止误删。

content:
  prompt: 训练时，使用“混合精度”不仅省显存，还能加速，为什么？
answer:
  mode: rubric
  reference_answer: |-
    混合精度训练是指在前向和反向传播中使用半精度浮点数（FP16或BF16），而关键权重副本和部分计算保留全精度（FP32）。它既节省了显存，又加速了计算。

    加速原理：

    - Tensor Core 专门优化：现代 NVIDIA GPU（Volta及以后）都有专门的 Tensor Core 硬件单元，专为 FP16/BF16 矩阵乘加操作设计。它的吞吐量是同等 FP32 操作的数倍甚至十多倍。混合精度训练将大型矩阵乘法（如 QKV 投影、FFN 层、注意力计算）都放到 Tensor Core 上执行，极大地提升了计算速度。

    - 显存带宽减半：FP16/BF16 张量占用的显存是 FP32 的一半。这意味着在同样的显存带宽下，可以传输两倍的数据，有效缓解了“内存墙”瓶颈。对于归一化、激活函数等带宽受限的操作，速度自然提升。

    - 算子融合更高效：在低精度下，GPU 的寄存器可以容纳更多的数据，有利于进行更激进的算子融合，进一步减少显存读写次数。

    为什么省显存：模型参数、梯度、激活值都以 FP16/BF16 存储，显存占用直接减半。虽然还需要一份 FP32 的主权重用于精确更新，但总显存仍然大幅降低。这使得我们可以在同样的硬件上训练更大的模型或使用更大的 batch size。

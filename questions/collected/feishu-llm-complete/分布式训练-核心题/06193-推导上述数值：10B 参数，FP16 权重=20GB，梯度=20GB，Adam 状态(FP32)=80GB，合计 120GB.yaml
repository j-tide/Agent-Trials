content:
  prompt: 推导上述数值：10B 参数，FP16 权重=20GB，梯度=20GB，Adam 状态(FP32)=80GB，合计 120GB。
answer:
  mode: rubric
  reference_answer: |-
    这个推导基于常见的理解：梯度也以 FP16 存储，优化器状态仅包含 m 和 v（FP32），合计 80GB，加上权重和梯度各 20GB，总共 120GB。这与上一问的 160GB 差异在于是否将主权重（master weights）单独计算。实际上，在混合精度训练的标准实践中，需要一份 FP32 的主权重用于参数更新，所以显存消耗应该是 160GB。然而，很多资料将主权重算作优化器状态的一部分，或者认为它与 m/v 一起组成 FP32 的参数副本，因此三部分共 120GB 可能是指“权重(FP16)、梯度(FP16)、优化器状态(FP32 m+v)”而没有计入 master weight。这里为了清晰，可以这样解释：

    - FP16 权重：10B × 2 bytes = 20 GB

    - FP16 梯度：10B × 2 bytes = 20 GB

    - Adam 状态（m 和 v，均为 FP32）：2 × 10B × 4 bytes = 80 GB

    - 总计：20 + 20 + 80 = 120 GB

    但这是在忽略 FP32 主权重的前提下。若加上主权重（也是 10B × 4 bytes = 40 GB），则总显存为 160 GB。两种说法都常见，关键是理解各部分的精度和数量。

content:
  prompt: 为什么 GPT 系列使用自回归方式，而 BERT 使用自编码方式？
answer:
  mode: rubric
  reference_answer: |-
    这源于它们根本的预训练目标不同，从而决定了架构和应用场景的差异。

    ### 为什么这样选择

    - GPT选择自回归：因为它的设计初衷是成为一个强大的文本生成器。自回归方式（逐token生成）天然与人类写作过程一致，模型在训练时学到的“根据上文补全下文”的能力，可以直接用于推理生成。通过将不同任务统一成序列续写，一个模型可以处理翻译、问答、摘要等，展现出极强的通用性。

    - BERT选择自编码：它的设计初衷是成为一个强大的文本理解器。MLM任务通过“完形填空”迫使模型学习深层的双向上下文表示。双向注意力让每个token的表示融合了左右两侧的信息，这对需要精确理解句子含义的任务（如情感分析、命名实体识别）至关重要。

    两者不能互换：GPT的双向受限使它不适合需要全局理解的任务（早期），BERT则无法直接生成文本。近年来的趋势是Decoder-only架构通过超大规模预训练和指令微调，在理解任务上也达到了极佳水平，且天然支持生成，因此逐渐成为主流。


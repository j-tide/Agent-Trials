content:
  prompt: 训练大模型时，如何设置“早停” (Early Stopping) 条件？
answer:
  mode: rubric
  reference_answer: |-
    大模型预训练通常不设置传统意义上的早停（因为几乎总是在欠拟合，数据量极大），但在微调和特定场景下，早停仍然必要。

    早停条件的设定：

    - 基于验证集指标：每隔N步在验证集上评估一次（如困惑度PPL）。如果验证PPL在连续K次评估中没有下降（或上升），且训练PPL仍在下降（过拟合），则触发早停。K通常设为3-5次。需要设定一个最小改善阈值（如PPL下降小于0.01），避免随机波动误触发。

    - 基于训练损失平台期：如果训练损失在一个很长的窗口内（如数万步）不再下降，且学习率已经衰减到极小值，说明模型已经收敛，可以停止。

    - 基于时间预算：在资源受限时，设定一个最大训练时间或最大训练步数，到了就直接停。

    - 基于下游任务指标：如果在训练过程中定期评估下游任务（如GLUE、MMLU），当下游指标不再提升时停止。这是最能反映实际价值的早停条件。

    注意事项：

    - 大模型预训练常常出现“双下降”现象（Double Descent），验证损失先降后升再降。如果设置过早的早停，可能错过后续的再次下降。因此需要足够长的耐心窗口。

    - 预训练中，验证损失上升不一定全是过拟合，可能是验证集太小或分布不一致，需结合下游任务判断。

    - 早停条件应当配合checkpoint保存策略，始终保留验证指标最好的模型。

content:
  prompt: DeepSpeed 模型保存后，如何加载进行推理？
answer:
  mode: rubric
  reference_answer: |-
    - 如果训练时保存的是完整合并权重（或使用 zero_to_fp32.py 合并后的权重），可直接用标准 PyTorch 或 HuggingFace from_pretrained 加载。

    - 如果只有分片 checkpoint，且推理时仍需 ZeRO-3 环境（模型太大单卡放不下），则需用 DeepSpeed 的推理引擎加载分片，并在多卡上通过 ZeRO-3 进行推理，这要求推理代码支持 DeepSpeed。

    - 最常用方法：使用 zero_to_fp32.py 工具将分片 checkpoint 转换为单个 FP32 模型文件，然后加载到 HuggingFace 模型中，即可单卡或多卡（无 ZeRO）推理。命令：python zero_to_fp32.py . pytorch_model.bin，将当前目录下的分片合并输出为 pytorch_model.bin。

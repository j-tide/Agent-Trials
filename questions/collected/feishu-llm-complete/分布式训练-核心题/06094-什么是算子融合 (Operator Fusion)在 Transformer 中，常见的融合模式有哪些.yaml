content:
  prompt: 什么是算子融合 (Operator Fusion)？在 Transformer 中，常见的融合模式有哪些？
answer:
  mode: rubric
  reference_answer: |-
    算子融合是深度学习框架或编译器将多个连续的计算操作合并成一个单一的、更高效的计算内核。它的核心动机是减少显存带宽的消耗。在GPU上，计算速度远超数据搬运速度（“内存墙”）。如果每个小操作都独立执行，每次都需要将数据从显存（HBM）读取到计算单元，完成后再写回显存，下一个操作再重复这个过程。大量时间浪费在数据搬运上，而不是实际计算。

    融合后的算子只需从显存读取一次输入，在寄存器或共享内存中完成多个中间计算，最后将最终结果写回显存。这样，显存访问次数大幅减少，硬件利用率上升，训练速度显著提高。同时，因为不需要为每个中间结果分配显存，显存占用也能降低。

    在Transformer中，常见的融合模式包括：

    - Conv + BatchNorm + ReLU 融合：在CNN中广泛应用。BatchNorm的归一化操作和ReLU的激活函数都是逐元素操作，完全可以嵌入到卷积的循环计算中，省去单独读写中间张量。对于Transformer中的MLP块，如果使用了BatchNorm（较少），原理相同。更常见的是Linear + LayerNorm/RMSNorm + Activation的融合。

    - QKV 投影融合：在自注意力中，Q、K、V的投影原本是三个独立的矩阵乘法：Q = X @ W_Q, K = X @ W_K, V = X @ W_V。可以将这三个权重矩阵拼接成一个更大的矩阵 W_QKV = [W_Q; W_K; W_V]，然后执行一次矩阵乘法 X @ W_QKV，得到拼接后的结果。这减少了两个独立的矩阵乘法操作，降低了kernel启动次数和显存读写。

    - 自注意力分数计算 + Softmax + Dropout 融合：在FlashAttention出现前，计算 QK^T、softmax、Dropout（掩码操作）是多个独立步骤，每个步骤都会产生显存的写入和读取。将它们融合在一个kernel中完成，可以只读写一次Q和K，一次写出最终的注意力权重（或直接写V的加权结果）。

    - 残差连接 + LayerNorm/RMSNorm 融合：子层输出与原始输入相加后，立即进行归一化。这两个操作可以合并在一个kernel中，避免将相加的中间结果写回显存再读入归一化kernel。

    - MLP块的全连接 + 激活 + 全连接融合：第一个全连接层升维，经过GELU等激活，再降维。可以将第一个全连接和激活函数融合，将第二个全连接与第一个的激活直接在寄存器中衔接，减少显存读写。

    - AdamW优化器中的step融合：优化器更新参数时，涉及多个操作（如计算动量、更新参数、应用权重衰减），DeepSpeed等框架会将它们融合成一个或少数几个kernel，避免反复读写参数张量。

    这些融合可以通过手写CUDA kernel、使用NVIDIA的CUTLASS库、或者依赖PyTorch 2.0的torch.compile自动完成。现代推理引擎（如TensorRT）更是将融合发挥到极致，以追求极致推理速度。

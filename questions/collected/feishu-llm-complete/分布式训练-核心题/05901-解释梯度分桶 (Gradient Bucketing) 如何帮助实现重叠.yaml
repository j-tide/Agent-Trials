content:
  prompt: 17.解释“梯度分桶” (Gradient Bucketing) 如何帮助实现重叠。
answer:
  mode: rubric
  reference_answer: |-
    梯度分桶是将模型参数按一定顺序分组，形成多个“桶”，每个桶包含一定数量的参数梯度。当一个桶内的所有参数梯度都计算完成时，立即对该桶进行通信，而不是等待所有梯度都算完。

    帮助重叠的机制：

    - 反向传播的顺序通常是从输出层到输入层。DDP 会预先将参数划分到多个桶中，尽量使得这些桶的梯度按照反向传播的顺序逐个完成。

    - 当某个桶的梯度就绪，DDP 立即启动该桶的异步 AllReduce。由于通信是异步的，后续桶的计算可以与之前桶的通信并行。

    - 桶的粒度需要适中：太大，等待时间长，通信启动晚，重叠少；太小，通信次数多，效率低。默认桶大小通常是 25MB。

    通过桶机制，整个梯度同步被分解为一系列可以流水线执行的小通信任务，有效地将通信隐藏在计算之后。

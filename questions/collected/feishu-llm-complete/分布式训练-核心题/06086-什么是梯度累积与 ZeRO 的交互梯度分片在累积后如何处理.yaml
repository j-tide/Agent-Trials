content:
  prompt: 什么是“梯度累积”与 ZeRO 的交互？梯度分片在累积后如何处理？
answer:
  mode: rubric
  reference_answer: |-
    梯度累积 是为了在显存受限时模拟大批次训练的技术：模型对多个 micro-batch 分别执行前向和反向，每个 micro-batch 的梯度被累加到梯度缓冲区中，直到累积足够的步数后才执行一次优化器更新。

    在标准数据并行中，梯度累积只是延迟了 AllReduce 的执行——通常在累积的最后一步才进行梯度同步，以减少通信次数。但在 ZeRO 中，由于梯度被分片（stage=2）或参数被分片（stage=3），梯度累积的交互更为复杂：

    ZeRO-2 下的梯度累积：

    - 每个 micro-batch 的反向传播会产生局部梯度。ZeRO-2 会在每个 micro-batch 反向结束后，立即对该 micro-batch 的梯度进行 ReduceScatter（因为梯度需要被分片存储以节省显存）。

    - 为了模拟梯度累积，DeepSpeed 会为每个参数分片维护一个梯度累积缓冲区（位于 FP16 显存）。每次 ReduceScatter 得到的梯度会累加到该缓冲区中，而不是直接用于更新。

    - 当累积步数达到目标后，使用累积缓冲区中的总梯度来更新优化器状态和参数。

    ZeRO-3 下的梯度累积：

    - 与 ZeRO-2 类似，但还需要处理参数的 AllGather。每个 micro-batch 前向和反向都需要临时收集完整参数。梯度同样通过 ReduceScatter 分片并累积。

    关键点：

    - 梯度累积不会破坏 ZeRO 的显存节省效果，因为分片的梯度和参数仍然只占 1/N，累积缓冲区也只保存分片部分的梯度。

    - 但使用梯度累积时，需要注意gradient_accumulation_steps 应被正确设置，并且与 ZeRO 的通信调度兼容。DeepSpeed 会自动处理这些细节。

content:
  prompt: 量化训练 (QLoRA) 如何进一步降低显存？4-bit 量化和双重量化的作用。
answer:
  mode: rubric
  reference_answer: |-
    如果说LoRA解决了“梯度和优化器状态”的显存问题，那么QLoRA则进一步向“模型参数本身”开刀。在LoRA的基础上，QLoRA通过将预训练模型权重量化到4-bit，并引入双重量化技术，将模型权重的显存压缩到极限。

    4-bit NormalFloat (NF4) 量化：

    传统的4-bit整数量化采用均匀分段，将连续的浮点数值映射到16个离散值上。但神经网络的权重通常服从正态分布——大部分权重集中在均值附近，两端尾部的值较少。均匀量化会在密集区域浪费精度，在稀疏区域过度分配。

    NF4专门针对正态分布设计。它假设数据服从标准正态分布，然后在累积分布函数上均匀分位，使得每个量化区间内包含的数据量大致相等。在分布的密集区域，NF4提供更精细的分段；在尾部区域，分段更粗糙。这样，4-bit的表示能力被最大限度地利用在“大多数”权重上，重建精度远高于均匀量化。

    显存收益非常直接：原本FP16占2字节的每个权重，被压缩为4-bit，即0.5字节。模型权重显存直接降至原来的四分之一。一个65B参数的模型，FP16权重需要约130GB显存，NF4量化后仅需约32.5GB。这是从“需要多张A100”到“单张A100即可承载”的跨越。

    双重量化（Double Quantization）：

    量化本身会产生额外的开销。为了能够反量化，需要为每个量化块存储缩放常数和零点。这些量化参数通常以FP32存储。当模型很大时，量化参数本身也会占用可观的显存——在65B模型上可能达到几GB。

    双重量化对这些量化参数本身再进行一次量化。具体来说，它对第一轮量化产生的缩放常数进行第二轮的FP8量化。由于缩放常数的数量远少于原始权重，这轮量化几乎不损失精度，却能额外节省约3~5GB的显存。在显存边缘的情况下，这可能是OOM和成功运行之间的差距。

    分页优化器（Paged Optimizer）：

    QLoRA的第三个关键技术是将优化器状态卸载到CPU内存中。它借鉴了操作系统的分页机制，将GPU显存作为CPU内存的缓存。当需要更新某个参数块时，才将对应的优化器状态页从CPU调入GPU，更新完成后再写回CPU。这样，即使GPU显存不足，也能利用CPU的大容量内存来存储优化器状态，仅在当前步骤需要时才占用GPU空间。

content:
  prompt: 比较 ZeRO-1/2/3 的通信量：各自需要多少字节的通信？
answer:
  mode: rubric
  reference_answer: |-
    以7B模型，FP16混合精度，8卡数据并行为例，各阶段通信量如下表：

    [嵌入表格未展开]

    注1：ZeRO-1的梯度同步仍使用AllReduce（因为梯度尚未分片），通信量14 GB；参数AllGather通信量14 GB，合计28 GB。ZeRO-2用ReduceScatter替代AllReduce，通信量同为14 GB，加上参数AllGather 14 GB，合计28 GB。ZeRO-3没有更新后的参数AllGather，但增加了前向和反向的参数AllGather各14 GB，加上梯度ReduceScatter 14 GB，合计42 GB。

    注2：标准数据并行仅需一次梯度AllReduce，通信量为14 GB。因此ZeRO-1/2的总通信量约为标准DP的2倍，ZeRO-3约为3倍。

content:
  prompt: 22.为什么跨机通信的延迟远高于机内通信？典型数值（NVLink vs InfiniBand）。
answer:
  mode: rubric
  reference_answer: |-
    延迟高的原因：

    - 物理距离：跨机通信需要经过网线/光纤，可能穿越多个交换机（跳数多），电信号或光信号传播耗时。

    - 协议栈开销：跨机网络使用 InfiniBand 或以太网，数据需要封装成网络包，经过网卡、驱动、内核协议栈（或用户态 RDMA 绕过内核），引入额外处理延迟。

    - 交换机跳数：在大型集群中，跨机通信可能经过 Spine-Leaf 多级交换，每跳增加延迟。

    - 机内通信（NVLink/PCIe）：信号在电路板上传输，距离极短，不需要网络协议栈，延迟极低。


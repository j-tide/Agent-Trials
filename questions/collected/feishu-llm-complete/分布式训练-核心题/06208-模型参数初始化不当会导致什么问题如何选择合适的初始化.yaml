content:
  prompt: 模型参数初始化不当会导致什么问题？如何选择合适的初始化？
answer:
  mode: rubric
  reference_answer: |-
    初始化不当的常见问题：

    - 所有权重初始化为0：导致所有神经元在每层学习到相同的特征，网络退化为线性模型，无法学习复杂函数。

    - 初始化过大：前向传播时激活值迅速放大，经过深层后超出浮点数范围，产生 NaN 或 Inf；反向传播时梯度爆炸，参数更新量巨大，导致 loss 震荡或不收敛。

    - 初始化过小：前向传播时信号逐层衰减，到深层已经接近0，反向传播时梯度消失，浅层参数几乎无法更新，训练停滞。

    - 初始化不匹配激活函数：例如，对 ReLU 使用 Xavier 初始化（假设线性激活），会导致深层输出方差逐渐减小；使用 He 初始化才能保持方差稳定。

    如何选择合适的初始化：

    - Xavier/Glorot 初始化：适用于 Tanh、Sigmoid 等关于原点对称的激活函数。它将权重初始化为均值为0、方差为 2 / (fan_in + fan_out) 的分布（正态或均匀）。目的是保持前向和反向传播的方差大致相等。

    - He/Kaiming 初始化：专为 ReLU 及其变体设计。由于 ReLU 将负半轴置零，输出方差减半，因此 He 初始化将方差设为 2 / fan_in（前向考虑）或 2 / fan_out（反向考虑），以补偿方差损失。通常使用 fan_in 模式。

    - Transformer 的特殊处理：

    - 偏置初始化：通常初始化为0。但对于某些门控机制（如 LSTM 的 forget gate），会初始化为1以促进初期记忆。

    实践：在 PyTorch 中，通过 nn.init.xavier_uniform_ 或 nn.init.kaiming_uniform_ 应用初始化。对于自定义模型，务必在 init 中显式调用。如果使用 HuggingFace 等框架，通常已有合理默认值，微调时无需改动。

content:
  prompt: ZeRO-Offload 如何利用 CPU 进行优化器更新？数据流向是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    ZeRO-Offload 将优化器更新的全部计算放在 CPU 上，GPU 只专注于前向和反向传播。数据流向经过精心设计，以最小化 PCIe 传输瓶颈。

    具体流程（以单卡为例）：

    - 前向和反向传播（GPU）：

    - 梯度传输到 CPU：

    - CPU 执行优化器更新：

    - 更新后的参数传回 GPU：

    数据流向图：

    GPU: [FP16参数] ←───────────── 更新后FP16参数 ← CPU
     |                               ↑
     ├─ 前向传播 → 激活值 → 反向传播 → FP16梯度 → 异步拷贝到CPU
     |                               ↓
     └─ 激活值释放               CPU: [FP32主权重, m, v] → Adam更新

    通过异步传输和计算与拷贝重叠，ZeRO-Offload 将 PCIe 带宽的瓶颈影响降到最低。

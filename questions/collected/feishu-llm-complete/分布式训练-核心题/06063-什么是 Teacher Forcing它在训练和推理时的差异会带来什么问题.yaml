content:
  prompt: 什么是 Teacher Forcing？它在训练和推理时的差异会带来什么问题？
answer:
  mode: rubric
  reference_answer: |-
    Teacher Forcing是训练自回归模型时的一种技巧：在每一步预测时，模型不是使用上一步自己的预测输出作为输入，而是直接使用真实的、来自训练数据的历史token（即“教师”）。这使训练过程变为：给定标准答案的前缀，让模型预测下一个词。

    ### 训练 vs 推理的差异

    - 训练时：每个时间步的输入都是完美的ground truth。即使模型在某一步预测错了，它下一步仍然被“扶正”到正确路径上。因此误差不会累积，训练非常稳定。

    - 推理时：模型完全依赖自己生成的token作为下一步的输入。一旦某个token预测不佳，这个错误就会作为输入“污染”后续步骤，导致误差不断累积，生成质量下降。

    这种差异就是曝光偏差。模型在训练时从未见过自己“犯错”后的状态，因此在推理时面对自己的错误输入，容易“不知所措”，产生一连串的漂移、重复或逻辑混乱。

    ### 如何缓解

    - 计划采样：在训练时，以一定的概率用模型自己生成的token替换ground truth，让模型逐渐适应推理时的状态。

    - 强化学习：直接优化生成序列的评价指标（如BLEU、ROUGE），而不完全依赖交叉熵。

    - 知识蒸馏：用大模型生成的多样化文本训练小模型，间接学习错误恢复能力。

    尽管有曝光偏差，Teacher Forcing因其训练速度和稳定性，仍然是自回归模型训练的标准方法。


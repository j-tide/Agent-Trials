content:
  prompt: 29.如何测试节点间通信带宽和延迟？常用的基准工具 (nccl-tests, iperf)。
answer:
  mode: rubric
  reference_answer: |-
    nccl-tests：

    - NVIDIA 官方工具集，测试 GPU 间集合通信性能。包含 all_reduce_perf, all_gather_perf, broadcast_perf 等。

    - 可以指定 GPU 列表、消息大小范围，测试在不同规模下的带宽和延迟。

    - 示例：mpirun -np 16 ./all_reduce_perf -b 1M -e 1G -f 2 -g 8 表示 16 个进程，每节点 8 GPU，测试 1MB 到 1GB 消息大小的 AllReduce 性能。

    - 输出包含平均带宽和算法，是评估分布式训练通信能力的标准工具。

    iperf：

    - 通用网络带宽测试工具，测试节点间端到端的 TCP/UDP 带宽。

    - 在服务端运行 iperf -s，客户端运行 iperf -c <server_ip> -P 8 测多流带宽。

    - 但 iperf 只能测 TCP 带宽，无法体现 RDMA 性能。

    其他工具：

    - OSU Micro-Benchmarks：提供 osu_latency, osu_bw 等，支持 MPI 和 NCCL。

    - NVIDIA MLNX_OFED 自带的 ib_write_bw/ib_read_bw：直接测试 RDMA write/read 带宽。

    使用这些工具可以定位是网络硬件问题还是 NCCL 配置问题。

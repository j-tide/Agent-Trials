content:
  prompt: 训练一个 7B 模型，用 1T tokens，大概需要多少计算量？
answer:
  mode: rubric
  reference_answer: |-
    计算量可以用经验公式 C ≈ 6 × N × D 估算，其中 N 是参数量，D 是训练 tokens 数。对于前向+反向传播，这是普遍接受的近似。

    - N = 7B = 7 × 10^9

    - D = 1T = 1 × 10^12

    - 总计算量 C ≈ 6 × (7e9) × (1e12) = 4.2 × 10^22 FLOPs

    因此，训练一个 7B 参数模型、使用 1T tokens 的数据，大致需要 4.2e22 次浮点运算。如果再估算时间，假设在 256 张 A100 上训练，理论峰值总算力为 256 × 312 TFLOPS ≈ 8e16 FLOPS。在 MFU=50% 的情况下，有效算力约 4e16 FLOPS，训练时间约为 (4.2e22) / (4e16) ≈ 1,000,000 秒 ≈ 278 小时 ≈ 11.6 天。


content:
  prompt: 什么是“Hash 路由”？与学习式路由的对比。
answer:
  mode: rubric
  reference_answer: |-
    Hash 路由是一种非学习的路由策略，完全根据 token 的某种哈希值来决定送往哪个专家。

    - 实现：对每个 token 计算一个哈希函数（如取 token ID 的 hash，或者 token 嵌入的随机投影），然后对专家数取模，得到专家索引。哈希函数是固定的，不参与训练。

    - 优点：

    - 缺点：

    学习式路由（基于门控网络）则相反，它通过学习来决定分配，可以按语义聚合，但存在坍塌风险。目前主流仍以学习式路由为主，因为它能带来更好的模型效果。Hash 路由通常作为一种正则化策略或初始化阶段的辅助手段。

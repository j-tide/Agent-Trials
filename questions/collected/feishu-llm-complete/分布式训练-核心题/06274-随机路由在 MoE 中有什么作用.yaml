content:
  prompt: 随机路由在 MoE 中有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    随机路由（Stochastic Routing）指在训练时，不是确定性地选择 Top-k 专家，而是以一定的概率根据门控输出的分布进行采样，使得每个专家都有被选中的机会。

    - 作用：

    - 实现：通常在 softmax 之前加入 Gumbel 噪声，然后进行采样。或者使用Top-k 加噪声：先给 logits 加上高斯噪声，再取 Top-k。噪声的幅度可以随着训练逐步减小（退火），让模型从探索过渡到利用。

    - 效果：实验表明，使用随机路由训练的 MoE 模型，专家负载更加均衡，最终泛化性能更好，且对超参数不那么敏感。

content:
  prompt: 什么是 Tokenizer，它在大模型训练中的地位和作用？
answer:
  mode: rubric
  reference_answer: |-
    Tokenizer是将原始文本转换成模型可处理的数字序列（token IDs）的组件，也是模型生成文本后将数字还原为人读文字的解码器。它位于整个训练Pipeline的最前端，定义了模型的词汇表。

    ### 核心作用

    - 定义词汇边界：将无限的自然语言文本映射到一个固定大小的词汇表（如32k、64k）。词汇表大小直接影响模型的嵌入层参数和计算效率。

    - 平衡粒度与效率：好的Tokenizer能用尽可能短的token序列表示文本，从而减少自注意力层的计算量（复杂度O(n²)）。同时，它需保留有意义的语义单元（如词干、词缀），避免过度碎片化。

    - 支持多语言：对于中文、日文等无空格语言，Tokenizer需要能够自动发现词汇边界。现代Tokenizer（如BPE, SentencePiece）直接在字节/字符级操作，天然语言无关。

    - 处理未登录词：通过子词分解，任何罕见词都能被拆分为已知子词片段，彻底消灭OOV问题。

    ### 训练过程（以BPE为例）

    - 准备大规模、多样化的语料。

    - 将所有文本拆成字符序列，并初始化词汇表为所有基础字符。

    - 迭代统计相邻符号对的频率，合并最高频对，将其加入词汇表。

    - 重复合并直到词汇表达到预设大小。

    - 记录合并顺序，推理时用这些规则将新文本切分为子词。

    ### 重要地位

    Tokenizer是模型的“器官”，一旦训练完成就固定下来，更换Tokenizer通常需要重新训练模型。一个低质量的Tokenizer会导致序列过长、信息碎片化、多语言支持差，严重制约模型性能。因此，Tokenizer的设计与训练需要与模型架构同等重视。


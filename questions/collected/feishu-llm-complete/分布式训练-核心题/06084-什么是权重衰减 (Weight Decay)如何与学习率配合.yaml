content:
  prompt: 什么是“权重衰减” (Weight Decay)？如何与学习率配合？
answer:
  mode: rubric
  reference_answer: |-
    权重衰减是一种正则化技术，通过对模型参数施加“收缩”惩罚，防止权重值过大，从而控制模型复杂度，缓解过拟合。

    在标准SGD中，权重衰减等价于在损失函数中添加L2正则项：Loss_total = Loss_original + (λ/2) * ||θ||²。对参数θ求导后，梯度增加了λθ项，参数更新变为：θ = θ - η*(g + λθ) = (1 - ηλ)θ - ηg。可见，每个参数在每次更新后都会被乘上一个小于1的因子，即“衰减”。

    权重衰减与学习率的配合：从更新公式可以看出，实际的衰减强度由乘积ηλ决定。因此，学习率η和衰减系数λ需要协同调整。

    - 如果增大学习率，而保持λ不变，参数收缩效应会增强（因为衰减因子1-ηλ变小），可能导致模型欠拟合。

    - 如果减小学习率，而λ不变，衰减效应减弱，模型可能过拟合。

    - 实践中，通常先确定一个合适的学习率，然后独立调优λ。常用λ值在1e-4到1e-2之间，大模型（如GPT-3）甚至使用0.1的大权重衰减。

    关键区别：在Adam等自适应优化器中，如果直接在损失函数中添加L2正则，梯度中的λθ项会被自适应学习率缩放（除以二阶矩的平方根），导致实际衰减量不均匀，效果不佳。因此，AdamW将权重衰减从自适应机制中解耦，直接作用于参数更新之后：θ = θ - η*g - ηλθ。这使得衰减强度独立于梯度大小，更易控制和调优。这也是现代大模型训练普遍使用AdamW的原因。

content:
  prompt: 用 Megatron-LM 训练 GPT 模型，数据格式要求是什么？(二进制格式？)
answer:
  mode: rubric
  reference_answer: |-
    Megatron-LM 使用高效的预处理二进制格式存储训练数据，以减少 I/O 瓶颈并支持快速随机访问。具体格式为：

    - Binary tokenized files：文本经过分词后，被转换为整数 token ID 序列，直接保存为连续的二进制文件（例如 .bin）。每个文件包含多个文档，文档之间用特殊 token 分隔。

    - Index file：配套的索引文件记录了每个文档在二进制文件中的偏移量和长度，方便数据加载器进行高效的随机采样和排序。

    数据预处理脚本 (tools/preprocess_data.py) 将原始文本语料（如 JSON 或 TXT）转换为这种格式。例如：

    ```bash
    python tools/preprocess_data.py \
      --input my_corpus.json \
      --output-prefix my_gpt_dataset \
      --vocab tokenizer.json \
      --dataset-impl mmap \
      --tokenizer-type GPT2BPETokenizer \
      --merge-file merges.txt \
      --append-eod
    ```

    --dataset-impl mmap 表示使用内存映射方式读取，提高性能。训练时，Megatron 的 gpt_dataset.py 会加载这些索引和二进制文件，根据全局 rank 和微批次大小抽取样本。

    这种格式的优势是读取极快，消除了在线分词的 CPU 开销，非常适合大规模预训练。

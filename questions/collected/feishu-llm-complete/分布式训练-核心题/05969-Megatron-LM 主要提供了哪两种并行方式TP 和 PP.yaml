content:
  prompt: Megatron-LM 主要提供了哪两种并行方式？TP 和 PP。
answer:
  mode: rubric
  reference_answer: |-
    Megatron-LM 是 NVIDIA 开发的专为训练超大规模 Transformer 模型的框架，其核心贡献是提供了高效的张量并行 (Tensor Parallelism, TP) 和流水线并行 (Pipeline Parallelism, PP)，通常与数据并行 (DP) 组合成 3D 并行。

    - 张量并行 (TP)：将单层 Transformer 内部的权重矩阵（例如自注意力的 QKV 投影、MLP 的线性层）按列或按行切分到多张 GPU 上。每张 GPU 只完成该层的一部分计算，然后通过 AllReduce 或 AllGather 合并结果。TP 的通信频率高（每层都需要通信），数据量大（激活值），因此要求节点内高带宽的 NVLink 互联。它解决了单卡无法容纳单层参数的问题。

    - 流水线并行 (PP)：将模型的不同层（或层组）分配到不同的 GPU 上。每个 GPU 只负责连续若干层的计算。通过将全局批次拆分为多个微批次 (micro-batches)，形成流水线，不同 GPU 同时处理不同微批次的不同阶段，以提高吞吐。Megatron-LM 采用交错 1F1B 调度来减少流水线气泡。PP 的通信只在层边界发生点对点 Send/Recv，频率低，适合跨节点扩展。它解决了模型层数过多导致单卡显存和计算负担过重的问题。

    这两种并行方式通常结合使用：TP 用于节点内部，利用 NVLink 高带宽；PP 用于跨节点，解决深度问题。它们与数据并行 (DP) 正交，共同构成 3D 并行，使训练万亿参数模型成为可能。

content:
  prompt: 为什么大模型训练前往往要做“小规模试探性训练”？
answer:
  mode: rubric
  reference_answer: |-
    在大模型训练中，一次完整的训练周期可能长达数月，耗费数百万美元。任何微小的配置错误——比如一个错位的 LayerNorm、一个不合适的初始化，或数据预处理 Bug——都会让整个训练功亏一篑。因此，小规模试探性训练是必不可少的保险措施。

    试探性训练的核心目的：

    - 验证全流程正确性：在一个极小的模型和数据集上完整运行所有代码，确保数据加载、前向传播、损失计算、反向传播、优化器更新、Checkpoint 保存与恢复等所有步骤都没有错误。

    - 检验训练稳定性：在小规模下观察 Loss 曲线、梯度范数等指标是否健康。小模型对学习率、初始化等超参数更加敏感，更容易暴露训练配置中的潜在不稳定性。如果小模型都无法稳定训练，大模型大概率会崩溃。

    - 为超参数搜索提供初始范围：在小模型上进行学习率、批次大小等超参数的粗粒度搜索。由于Transformer模型在不同规模下的最优超参数之间存在经验性的迁移规律（如学习率通常与模型宽度成反比），小模型的较优配置可以为大模型提供一个极好的搜索起点，大幅减少大模型上的昂贵调参。

    - 评估模型架构修改：在引入新的注意力机制、FFN结构或归一化方法时，先在小模型上验证其有效性，避免将未经证实的想法直接应用于大模型造成浪费。


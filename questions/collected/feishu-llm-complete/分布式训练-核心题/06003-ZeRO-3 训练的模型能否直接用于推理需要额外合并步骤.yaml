content:
  prompt: ZeRO-3 训练的模型能否直接用于推理？需要额外合并步骤。
answer:
  mode: rubric
  reference_answer: |-
    ZeRO-3 训练的模型不能直接用于推理，因为推理通常需要完整的模型权重，而 ZeRO-3 的权重是分片存储在多张 GPU 上的。

    为什么不能直接推理：

    - 推理时通常不依赖分布式通信环境，或者只需要单卡推理。ZeRO-3 的模型状态分散在多个设备，单卡无法独立完成前向传播。

    - 即使推理时可以组建 ZeRO-3 的通信组，每层都需要临时 AllGather 参数，这会引入不可接受的延迟，且显存节省不再是优先目标。

    合并步骤：

    - 使用 DeepSpeed 的 zero_to_fp32.py 脚本将分片 checkpoint 合并为单个完整的 FP32 权重文件。

    - 将合并后的权重加载到标准的模型结构中（如 HuggingFace Transformers 的 from_pretrained）。

    - 根据推理需求，可以将模型转换为 FP16 或 INT8 量化版本以节省显存，然后进行单卡或多卡推理（不需要 ZeRO）。

    特殊场景：

    - 如果推理也需要超大规模模型，可以使用 推理版的模型并行（如 Megatron 的 TP），但与 ZeRO-3 的分片格式不兼容，需要先合并再重新切分。

    - 未来 ZeRO 的推理模式或许可以直接加载分片权重，但目前主流方案还是先合并。

    总之，ZeRO-3 为训练而生，它的分片机制不适合推理的低延迟要求。合并步骤虽然多了一步，但能将训练成果无缝转化为可部署的标准模型。

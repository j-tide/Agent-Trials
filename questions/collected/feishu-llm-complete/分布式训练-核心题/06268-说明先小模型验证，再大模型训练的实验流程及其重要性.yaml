content:
  prompt: 说明“先小模型验证，再大模型训练”的实验流程及其重要性。
answer:
  mode: rubric
  reference_answer: |-
    大模型单次训练成本可达数百万美元，不允许任何未经验证的配置直接上线。因此，“小模型验证→大模型训练”是工业界铁律。这套流程通过在小规模模型上快速、低成本地迭代，筛选出可靠的超参数和架构设计，再迁移到全尺寸模型上，极大降低了试错风险和研发周期。

    ### 实验流程

    - 第一阶段：微型模型快速验证

    - 第二阶段：小模型消融实验

    - 第三阶段：中等规模迁移验证

    - 第四阶段：全量大规模训练

    ### 重要性

    - 成本控制：全量训练可能花费百万美元，而微型模型验证仅需几十美元。

    - 迭代速度：在大模型上做一次实验需要几周，在小模型上可能只要几小时，反馈周期缩短数十倍，研发效率天差地别。

    - 风险规避：避免因一个简单的配置错误（如学习率设错）导致长达一个月的训练报废。


content:
  prompt: 为什么 Warmup 对 Transformer 训练至关重要？多少步合适？
answer:
  mode: rubric
  reference_answer: |-
    Warmup（学习率预热）是指在训练开始阶段，将学习率从零或极小值线性增加到预设的初始学习率。它对Transformer训练至关重要，原因有三：

    - 防止初期梯度爆炸/消失：Transformer在随机初始化状态下，各层的输出方差可能不均衡，注意力矩阵可能极端稀疏或集中。如果一开始就用大学习率，参数剧烈更新，容易导致梯度爆炸。小学习率在初期提供“软启动”，让模型先调整到比较稳定的状态。

    - 建立稳定的优化器状态：Adam等自适应优化器内部的状态（m和v）在初期是零初始化的，对梯度的估计极不准确。如果立刻用大学习率，优化器会基于不准确的统计量做出过大的更新。Warmup给优化器一段时间来累积准确的梯度统计，使后续的自适应学习率更可靠。

    - 降低对初始化的敏感度：深层Transformer的训练对权重初始化非常敏感。Warmup通过逐步增加学习率，让模型在训练初期对初始化不够好的层进行缓慢修正，而不是直接面临大学习率的冲击，从而降低对初始化的依赖。

    步数选择：

    - 对于大模型预训练（如7B-175B），常用Warmup步数在1000到4000步之间，或占总训练步数的1%~5%。例如，训练100k步，Warmup 1k-4k步。

    - 对于微调任务，通常在100-500步左右。

    - 步数过短：预热不充分，早期大学习率仍可能导致训练不稳定。

    - 步数过长：前期训练过慢，浪费计算资源，且学习率长时间偏低可能使模型陷入次优局部解。

    - 实践建议：可以使用动态Warmup，监控初始几个batch的梯度范数，如果梯度范数显著大于后续稳定阶段，则适当延长Warmup。此外，对于超大模型（如175B），Warmup步数需要更保守（如4000步），甚至可以采用多阶段预热。

    总之，Warmup是保障Transformer训练稳定性的关键技巧，合理的步数选择能有效避免训练初期的崩溃。

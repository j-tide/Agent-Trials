content:
  prompt: 什么是“稀疏激活”？在 MoE 中如何体现？
answer:
  mode: rubric
  reference_answer: |-
    稀疏激活指的是：对于每个输入 token，只有整个网络参数的一小部分被“唤醒”参与计算，其余参数处于休眠状态，不参与前向和反向传播。这与人脑的工作方式相似——面对不同刺激，不同的神经元集群被激活。

    在 MoE 中，稀疏激活体现在门控路由的选择上。当 token 通过路由网络计算出对各专家的偏好后，只有得分最高的 Top-k 专家被激活，token 被送到这些专家中进行 FFN 计算，其余专家的输出对该 token 为零。反向传播时，也只有被激活的专家参数被更新，未被激活的专家对当前 token 没有梯度。这带来两个重要特性：一是计算负载的动态性，不同 token 可能激活不同的专家组合，整个 batch 的计算模式不是固定的；二是专家的特化，如果训练得当，不同专家会逐渐专注于处理不同类型的数据，形成“术业有专攻”的分工。

    举个例子：训练一个多语言模型，MoE 层可能会自发地让专家 0 擅长英语语法、专家 1 擅长中文语法、专家 2 擅长代码等等。这种分工不是人为设定的，而是路由网络在训练中自动学出来的。当输入是英文句子时，大部分 token 被路由到专家 0；输入是中文时，切换到专家 1。这种动态激活让模型用更少的总计算量处理了更多样的任务。

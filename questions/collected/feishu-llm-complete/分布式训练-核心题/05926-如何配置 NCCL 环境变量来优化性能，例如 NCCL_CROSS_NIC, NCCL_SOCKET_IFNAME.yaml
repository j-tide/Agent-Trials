content:
  prompt: 41.如何配置 NCCL 环境变量来优化性能，例如 NCCL_CROSS_NIC, NCCL_SOCKET_IFNAME。
answer:
  mode: rubric
  reference_answer: |-
    NCCL 提供了大量环境变量来应对复杂网络环境，优化通信性能。

    - NCCL_CROSS_NIC：控制是否允许 NCCL 使用跨不同网卡（NIC）的通信。当设为 0 时，NCCL 会将同一节点内的 GPU 间通信限制在同一 NIC 上，避免跨 NIC 流量，这可以减少 PCIe 竞争；在节点间通信时，设为 1 则允许使用多个 NIC 聚合带宽。默认值通常为 2（自动）。在需要精细控制时，可设 0 或 1。

    - NCCL_SOCKET_IFNAME：指定 NCCL 使用的网络接口名称（如 ib0, eth0）。尤其在多网卡环境中，必须明确告诉 NCCL 使用哪个接口进行通信，避免走错网络。例如 export NCCL_SOCKET_IFNAME=ib0。

    - NCCL_IB_HCA：指定使用的 InfiniBand 主机通道适配器（HCA）列表，例如 mlx5_0,mlx5_1。可以限制 NCCL 只使用特定的 IB 网卡，避免冲突。

    - NCCL_NET_GDR_LEVEL：控制 GPUDirect RDMA 的级别。设为 PHB 或 PXB 等，允许 GPU 直接通过 IB 网卡访问其他 GPU 内存，降低延迟和 CPU 负载。

    - NCCL_ALGO：手动指定通信算法，如 Ring, Tree, Collnet。一般自动即可，但在特定场景（如消息大小固定）可优化。

    - NCCL_MIN_NCHANNELS 和 NCCL_MAX_NCHANNELS：控制通信通道数，影响并行度和资源占用。

    - NCCL_BUFFSIZE：设置通信缓冲区大小，影响大消息传输的效率。

    正确配置这些变量可以显著提升多机通信的稳定性和带宽利用率。

content:
  prompt: 训练过程中，如何保存分布式模型 checkpoint？分片保存还是合并？
answer:
  mode: rubric
  reference_answer: |-
    - 分片保存：每个 GPU（或每个进程）仅保存自己持有的那部分模型参数和优化器状态。这是最高效的方式，没有额外通信，恢复训练时直接加载各自的分片。DeepSpeed 和 FSDP 默认采用分片保存，每个 rank 产生独立的文件。

    - 合并保存：在主进程（rank 0）收集所有分片，合并成完整模型后保存为单个文件。这种方式方便迁移和推理，但需要一次全局通信，且对超大模型可能内存不足。HuggingFace Trainer 默认会尝试合并保存，但可通过 --save_on_each_node 或 DeepSpeed 配置 "stage3_gather_16bit_weights_on_model_save": true 来启用合并。

    恢复训练时必须使用对应的加载方式：分片加载用于继续训练，合并加载用于推理或微调。DeepSpeed 提供 zero_to_fp32.py 脚本将分片 checkpoint 合并为完整 FP32 权重。

content:
  prompt: 什么是“专家容量” (Expert Capacity)？为什么需要？
answer:
  mode: rubric
  reference_answer: |-
    专家容量是每个专家在一个批次中能处理的 token 数量上限。它像餐厅的座位数——超出座位数的客人必须离开（溢出）。

    为什么需要专家容量？

    - 计算效率：在分布式训练中，专家分布在不同 GPU 上。若无容量限制，门控可能将大量 token 路由到同一 GPU，导致该 GPU 计算和显存骤增，其他 GPU 闲置，整个 batch 等待最慢的 GPU，严重拖慢训练。

    - 显存约束：每个专家需要为接收的 token 分配中间激活缓冲区。大量 token 涌入同一专家会导致显存峰值不可控，可能触发 OOM。

    - 可预测性：容量限制使每步计算和显存占用可预测，利于资源调度和稳定性。


content:
  prompt: 30.为什么推荐使用 InfiniBand 进行大模型训练？RDMA 的零拷贝特性。
answer:
  mode: rubric
  reference_answer: |-
    大模型训练时，GPU 间的梯度同步和参数更新会产生海量数据通信（每步几十 GB）。InfiniBand 的优势：

    - 超高带宽：NDR 400 Gb/s (50 GB/s) 接近 PCIe 5.0 x16 的带宽，大大缩短数据传输时间。

    - 极低延迟：端到端 1-2 µs，使小消息的集合操作（如 Ring AllReduce 的多次小块传输）开销极小。

    - RDMA 零拷贝：最关键的杀手锏。传统网络通信需要 CPU 参与数据拷贝（从用户缓冲区到内核缓冲区），多次内存复制消耗 CPU 周期并增加延迟。RDMA 允许网卡直接读写远程 GPU 或主机内存，无需 CPU 参与，无需数据拷贝。这释放了 CPU 资源，同时将通信延迟降至最低。

    - 硬件卸载：集合通信操作（如 AllReduce）可以由 IB 交换机/网卡硬件卸载，进一步加速。

    - 可靠性：IB 网络具有端到端的流控和重传机制，保证数据无损传输，避免了 TCP 的拥塞控制和丢包重传开销。

    相比之下，普通 TCP/IP 通信需要 CPU 参与，延迟高，带宽利用率低，难以满足大规模训练需求。因此 IB 成为大模型训练的标准配置。

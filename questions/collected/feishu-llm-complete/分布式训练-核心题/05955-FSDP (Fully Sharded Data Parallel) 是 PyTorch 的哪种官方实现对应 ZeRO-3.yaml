content:
  prompt: FSDP (Fully Sharded Data Parallel) 是 PyTorch 的哪种官方实现？对应 ZeRO-3。
answer:
  mode: rubric
  reference_answer: |-
    FSDP (Fully Sharded Data Parallel) 是 PyTorch 团队在 1.11 版本引入的官方数据并行扩展，其核心思想与 ZeRO-3 完全一致：将模型参数、梯度和优化器状态分片到所有数据并行的 GPU 上，每张卡只持有一部分参数的完整所有权。在前向和反向需要完整参数时，通过 AllGather 临时收集，计算后立即释放。

    FSDP 是 PyTorch 生态中 ZeRO-3 的等价实现，但作为原生方案，它与 PyTorch 的 autograd 系统、torch.compile、DistributedDataParallel 等无缝集成。相比于 DeepSpeed，FSDP 的 API 更“PyTorch 化”，调参更灵活，但 Offload 等高级功能的成熟度略低。

content:
  prompt: 什么是“选择性的梯度检查点”？只重计算一部分激活。
answer:
  mode: rubric
  reference_answer: |-
    选择性的梯度检查点（Selective Checkpointing）是指并非对所有层或所有激活值都进行重计算，而是只选择那些显存占用大、重计算代价小的激活值进行丢弃和重计算。

    实现方式：

    - 按层选择：比如只对FFN层开启检查点，注意力层保留全部激活（因为注意力矩阵已被FlashAttention优化）。

    - 按激活张量选择：在自定义的autograd Function中，手动控制哪些中间张量被保存，哪些被丢弃。例如，可以保存QKV但丢弃注意力矩阵，或保存部分归一化层的输出。

    - 利用框架特性：DeepSpeed和Megatron都支持不同粒度的检查点。DeepSpeed可以配置partition_activations和contiguous_checkpointing等选项。Megatron的recompute模块允许指定recompute_method='uniform'（每层都重算）或'block'（按块重算）。

    好处：最大化显存节省的同时最小化计算开销。对于一些重计算代价高的操作（如大矩阵乘），可以选择保留其激活；对于重计算代价低的操作（如逐元素激活函数），可以放胆丢弃。

    实践：在LLaMA等模型中，通常对每个Transformer层的整个forward开启检查点，而FlashAttention内部已经自动处理了注意力矩阵的不存储。因此，最终的重计算主要落在QKV投影和FFN层上。

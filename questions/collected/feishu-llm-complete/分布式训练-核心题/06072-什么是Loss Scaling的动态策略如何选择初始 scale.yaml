content:
  prompt: 什么是“Loss Scaling”的动态策略？如何选择初始 scale？
answer:
  mode: rubric
  reference_answer: |-
    动态损失缩放是在训练过程中自动调整缩放因子，以在防止梯度下溢和避免数值溢出之间取得平衡。其流程如下：

    - 初始化一个缩放因子（如 2¹⁶）。

    - 每个训练步：将损失乘以缩放因子，反向传播得到缩放后的梯度。

    - 检查缩放后的梯度是否包含 Inf 或 NaN（即是否溢出）。如果没有溢出，则：

    - 如果检测到溢出（梯度中存在 Inf/NaN），则：

    选择初始 scale：

    - 通常从一个保守的值开始，如 2^16（65536）。这是一个经验上对大多数网络都安全的起点。

    - 也可以在训练开始前进行一个简短的“预热”阶段：用一个小批量数据，从较低的 scale（如 1）开始，逐步增大 scale，直到遇到第一次溢出，然后选择一个略低于此值的作为初始 scale。

    - 如果训练初期频繁出现溢出并降低 scale，说明初始 scale 设得过大；如果长时间 scale 不增长且没有溢出，可能初始 scale 设得太小，可以适当调大。

    PyTorch 中的 torch.cuda.amp.GradScaler 封装了动态缩放策略，自动处理上述逻辑。

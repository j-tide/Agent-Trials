content:
  prompt: FSDP 的“full_reshard”和“grad_reshard”的区别。
answer:
  mode: rubric
  reference_answer: |-
    这两个术语通常指分片策略的细粒度行为：

    - full_reshard：在完成一个micro-batch的前向和反向之后，立即将当前层的参数重新分片（即丢弃临时收集的完整参数），恢复到只有参数分片的状态，以释放显存。这是FSDP在FULL_SHARD模式下的默认行为，也是显存节省的关键。

    - grad_reshard：在反向传播过程中，对每层计算出的梯度立即进行ReduceScatter，分散到各设备，并释放完整梯度。在SHARD_GRAD_OP模式下，梯度会被重新分片，但参数仍保持完整。

    简单说，full_reshard既分片参数也分片梯度，grad_reshard只分片梯度。在显存极度紧张时选择full_reshard；在希望平衡通信和显存时可选grad_reshard。

content:
  prompt: 什么是“GSPMD”？JAX 中的自动并行。
answer:
  mode: rubric
  reference_answer: |-
    GSPMD（Generalized SPMD）是 Google 提出的一种描述分布式并行策略的统一框架，在 JAX 中通过 pjit（或 shard_map）实现。它允许用户以张量分片标注（sharding annotations）的方式声明各张量在设备网格上的分布，而编译器（XLA）自动推导出所需通信和计算顺序，无需用户手写 pmap 和复杂的通信逻辑。

    在 JAX 中，使用 pjit 结合 mesh 和 PartitionSpec 实现自动并行：首先定义一个设备网格（如二维网格，分别对应数据并行和模型并行）；然后创建 sharding 对象，指定每个张量的维度切分方式；最后用 pjit 装饰函数，传入输入输出的分片约束。编译器会自动插入 AllGather、ReduceScatter 等通信操作，实现高效的 3D 并行。GSPMD 极大简化了模型并行代码，使得从单卡切换到复杂并行仅需修改分片标注。

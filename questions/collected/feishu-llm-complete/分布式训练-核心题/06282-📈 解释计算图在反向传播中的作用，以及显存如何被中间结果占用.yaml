content:
  prompt: "\U0001F4C8 解释“计算图”在反向传播中的作用，以及显存如何被中间结果占用。"
answer:
  mode: rubric
  reference_answer: "计算图是深度学习框架自动求导功能的基石。它是一个有向无环图（DAG），其中：\n\n- 节点 代表操作（如矩阵乘法、加法、激活函数）。\n\n-
    边 代表数据（张量）的流向。\n\n\U0001F50D 在反向传播中的作用\n\n- 记录操作序列：在前向传播时，框架（如PyTorch的autograd）会实时构建这张计算图，记录了从输入张量到最终损失值的每一步操作，以及每个操作的输入输出张量。\n\n-
    自动梯度计算：反向传播时，框架从损失节点开始，逆序遍历计算图。对于每个操作节点，框架调用其对应的反向传播函数，利用该节点保存的输入输出张量（即中间结果）和上游传来的梯度，通过链式法则计算出对各个输入的梯度，并继续向前传播。\n\n-
    动态销毁：在PyTorch的动态图中，通常一个批次的反向传播完成后，该计算图会被立即释放，释放掉中间结果占用的显存（retain_graph=False的情况）。\n\n\U0001F9E0
    显存如何被中间结果占用？\n计算图中的“中间结果”正是我们在前一个问题中讨论的激活值。这些张量作为图的边而存在。例如，一个操作 Mul(A, W) -> Y
    会产生输出张量 Y。框架在构建图时，会自动将 A 和 W 等输入和 Y 这个输出保存下来。Y 就是中间结果，它将在反向传播计算 A 或 W 的梯度时被用到。\n这些中间张量会实实在在地占用显存，直到反向传播完成。因此，计算图越深，操作越多，需要保存的中间结果就越多，显存占用也就越大。\n\n\U0001F4A1
    减少中间结果显存的方法：\n\n- 算子融合：将多个连续操作合并为一个kernel，减少中间张量的保存（例如Conv+BN+ReLU融合）。\n\n- 激活重计算：故意不保存某些中间结果，在反向时重新计算它们。\n\n-
    inplace操作：原地修改张量，避免分配新显存。\n\n---"

content:
  prompt: TensorFlow 在大模型训练中还常用吗？现状如何？
answer:
  mode: rubric
  reference_answer: |-
    TensorFlow 在大模型训练中的使用已显著减少，但并未完全消失。随着 PyTorch 生态的强势崛起，加上 JAX 在 Google 内部的普及，TensorFlow 在 NLP 大模型领域已不是主流。然而，在以下场景仍可见到 TensorFlow：

    - 谷歌内部的某些项目（如早期 T5、部分图像模型）仍基于 TF。

    - 工业界某些遗留系统或生产环境，因为历史原因和部署管线依赖 TF Serving，仍在使用 TF 训练。

    - 对于 TPU 训练，TF 曾是主要选择，但 JAX 已逐渐取代其地位。

    - 在推荐系统、搜索排序等特定领域，TF 凭借 TFX 等生态仍占有一席之地。

    目前大模型预训练前沿研究几乎全部使用 PyTorch（结合 DeepSpeed/Megatron）或 JAX。TensorFlow 的重点转向了推理（TF Lite）和生产服务（TF Serving），以及更易用的 Keras API。总体而言，TensorFlow 在大模型训练中的地位已经边缘化。

content:
  prompt: ". 什么是梯度裁剪？按值裁剪和按范数裁剪的区别。"
answer:
  mode: rubric
  reference_answer: |-
    梯度裁剪（Gradient Clipping）是训练深层网络，尤其是Transformer和大模型时，防止梯度爆炸的核心技术。它的逻辑很简单：在反向传播计算出所有参数的梯度后，如果某个梯度的大小超过了一个预设的阈值，就人为地把它“拉回”到阈值范围内，从而避免单步参数更新过于剧烈，导致损失飙升或溢出。

    按值裁剪 (Clip by Value)

    - 做法：遍历梯度张量中的每一个独立元素，如果它的值大于一个上界，就设为上界；小于一个下界，就设为下界。比如设定阈值为[-1.0, 1.0]，所有大于1.0的梯度值强制改成1.0，所有小于-1.0的改成-1.0。

    - 缺点：这会改变梯度的原始方向。假设一个参数的梯度向量是[0.8, 1.5]，按值裁剪后变成[0.8, 1.0]，向量的方向偏了。在深层网络中，方向信息往往比步长更关键，因此这种方法现在用得较少。

    按范数裁剪 (Clip by Norm)

    - 做法：先计算整个模型所有参数梯度的全局L2范数（即所有梯度值的平方和，再开根号）。如果这个全局范数超过了阈值，就按比例把每一个梯度值都缩小，使缩小后的全局范数恰好等于阈值。如果没超过，则什么都不做。

    - 优势：它等比例地缩放整个梯度向量，完整保留了梯度的方向，只是限制了“步长”。这就像开车时发现超速，司机同时等比例地收油门和调整方向盘，行驶路线依然平滑。正因如此，按范数裁剪是当前训练Transformer和大模型的标准做法。

    实践细节：通常阈值设为1.0，但需要根据模型大小、批次大小调整。训练时要监控梯度范数：正常时在0.1到10之间波动，如果突然跳到几百甚至上千，就说明出现了梯度爆炸，可能是学习率太大、数据有问题或者初始化不当。按范数裁剪就像一个“安全阀”，能防止这些异常情况直接摧毁训练。


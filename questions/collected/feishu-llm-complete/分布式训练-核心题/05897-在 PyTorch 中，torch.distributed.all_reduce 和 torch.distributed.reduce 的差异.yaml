content:
  prompt: 13.在 PyTorch 中，torch.distributed.all_reduce 和 torch.distributed.reduce 的差异。
answer:
  mode: rubric
  reference_answer: |-
    这两个操作都是集合通信中的归约操作，但输出结果的分布方式截然不同。

    [嵌入表格未展开]

    本质区别：

    - all_reduce 相当于先 reduce 再 broadcast：将所有节点的数据归约到某个节点（逻辑上），然后将结果广播给所有节点。但高效的 AllReduce 算法（如 Ring）将这两步融合，不会真的产生瓶颈节点。

    - reduce 仅在根节点得到最终结果，其他节点不保留归约值。如果其他节点后续需要该结果，必须额外进行 broadcast，这会引入额外的延迟和带宽开销。

    性能考量：

    - reduce 的通信量比 all_reduce 小（因为不需要把结果传回去），但后续如果需要广播，总通信量可能与 all_reduce 相当。

    - 在大规模分布式训练中，通常使用 all_reduce 进行梯度同步，因为所有 GPU 都需要完整的全局梯度来更新模型。只有在只需汇总标量（如总 loss）时，才使用 reduce。

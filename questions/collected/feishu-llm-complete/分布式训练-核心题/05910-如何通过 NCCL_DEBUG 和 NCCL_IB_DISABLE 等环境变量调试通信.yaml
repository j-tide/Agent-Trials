content:
  prompt: 26.如何通过 NCCL_DEBUG 和 NCCL_IB_DISABLE 等环境变量调试通信？
answer:
  mode: rubric
  reference_answer: |-
    NCCL 提供了丰富的环境变量用于调试和调优分布式通信。

    NCCL_DEBUG：

    - 设置日志级别：WARN（默认）、INFO、TRACE、VERSION 等。

    - NCCL_DEBUG=INFO 会输出通信器初始化、拓扑检测、算法选择、图融合等信息，帮助判断通信是否正常建立，以及使用了哪种算法。

    - NCCL_DEBUG=TRACE 会打印每一次集合操作的大小、时间、同步细节等，用于深度性能分析，但日志量极大，通常只在短时间调试时使用。

    - 示例：export NCCL_DEBUG=INFO

    NCCL_IB_DISABLE：

    - 设为 1 则强制禁用 InfiniBand/RoCE 通信，转而使用 IP（TCP/IP 套接字）。这可以用于快速验证通信问题是否由 RDMA 网络引起。

    - 例如，训练突然卡死，怀疑是 IB 链路故障，可以设 NCCL_IB_DISABLE=1 后重试，如果训练恢复，说明问题在 IB 侧。

    其他常用环境变量：

    - NCCL_SOCKET_IFNAME：指定用于 NCCL 通信的网络接口（如 ib0, eth0），避免使用错误的网络。

    - NCCL_IB_HCA：指定使用的 InfiniBand 主机通道适配器（网卡）列表，格式如 mlx5_0,mlx5_1。

    - NCCL_IB_GID_INDEX：设置 RoCEv2 的全局标识符索引，用于跨子网通信。

    - NCCL_IB_TIMEOUT：设置 IB 链路超时，增大该值可以容忍瞬时故障。

    - NCCL_TOPO_DUMP_FILE：导出拓扑图到文件，便于分析 GPU 互联结构。

    通过组合这些变量，可以系统性定位是网络连通性问题、性能瓶颈还是拓扑不当。

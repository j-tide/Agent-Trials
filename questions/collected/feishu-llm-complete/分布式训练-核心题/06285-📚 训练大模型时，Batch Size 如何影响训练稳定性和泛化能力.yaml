content:
  prompt: "\U0001F4DA 训练大模型时，Batch Size 如何影响训练稳定性和泛化能力？"
answer:
  mode: rubric
  reference_answer: "Batch Size (BS) 是大模型训练中最关键的超参数之一，它直接影响梯度的质量、训练的稳定性和模型的最终能力。\n\n\U0001F4CA
    对训练稳定性的影响\n\n- 小BS：梯度估计的方差大，噪声强。虽然这有助于模型跳出尖锐极小值，但方差过大可能导致训练震荡、损失曲线难以收敛，甚至不收敛。需要配合较小的学习率。\n\n-
    大BS：梯度估计更准确、方差小，训练曲线平滑，损失下降稳定。这使得我们可以使用更大的学习率（通常按BS比例线性缩放），加速训练。但是，过于准确的梯度会削弱梯度噪声带来的隐式正则化效果，导致模型更容易收敛到尖锐极小值，泛化能力下降。\n\n\U0001F3AF
    对泛化能力的影响——“大batch陷阱”\n\n经验规律是：在相同训练精度下，大BS训练的模型泛化能力往往更差。这被称为“大batch训练泛化差”现象。主要理论是：\n\n-
    大BS的低噪声使得优化器倾向于收敛到损失曲面上的尖锐极小值，这些点对参数微小的扰动敏感，测试时容易性能骤降。\n\n- 小BS的高噪声帮助模型逃离这些尖锐点，最终停留在平坦极小值，这里损失变化平缓，泛化能力更强。\n因此，在追求极限性能时，需要在训练速度和泛化能力之间做权衡。\n\n\U0001F527
    实践策略：\n\n- 线性缩放规则：当BS增加kk倍，学习率也增加kk倍，这在BN时代被证明近似有效，但需配合warmup。\n\n- 精细化调参：超大批量（如32K）训练需要专门的算法（如LARS/LAMB）来稳定训练。\n\n-
    适度Batch：大多数大语言模型选择在1M~4M tokens的全局BS下训练，这被认为是稳定性和泛化的较好折中。\n\n---"

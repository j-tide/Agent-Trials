content:
  prompt: 环境变量 PYTORCH_CUDA_ALLOC_CONF 中的 expandable_segments 有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True 是PyTorch 2.0为解决显存碎片问题引入的重要特性。

    在传统分配器下，PyTorch从CUDA驱动申请一块固定大小的显存段。随着训练进行，段内产生了大量碎片，即使总空闲量足够，也可能无法满足一个大张量的连续分配需求。这种情况下，分配器只能向CUDA驱动申请新的显存段，导致显存占用膨胀，最终OOM。

    启用expandable_segments后，分配器可以在段内空闲总量足够的情况下，动态地扩展现有显存段的边界，将分散的空闲块合并为一个大的连续块。这相当于对显存进行了“碎片整理”，只是这个过程是在分配器层面透明完成的，无需移动数据。

    这个特性对大模型训练尤其有价值。训练循环中产生的激活值张量大小差异巨大，碎片化严重。expandable_segments能让这些碎片被有效回收利用，显存利用率显著提高，OOM风险大幅降低。目前建议在所有大模型训练脚本中默认开启此选项。

content:
  prompt: 解释“二次峰值”现象：为什么反向传播后期显存会突然降低？
answer:
  mode: rubric
  reference_answer: |-
    在训练的一个完整前向-反向周期中，显存占用不是一条平稳的直线，而是呈现出先升后降的“山峰”形状。

    前向传播阶段，每一层计算出的激活值都被保留在显存中，等待反向传播时使用。随着前向的推进，激活值不断累积，显存占用逐步攀升，到最后一层前向完成时达到最高峰。

    进入反向传播后，显存并不会立刻下降，因为第一层反向传播（即输出层）仍需消费最后一层前向的激活值。但随着反向传播向浅层推进，已计算完梯度的层，其对应的激活值就被释放了。到反向传播的中后期，大量激活值已被消费和释放，显存开始快速下降。到整个反向传播完成时，仅剩梯度、优化器状态等持久状态，显存降至谷底。

    这就是“二次峰值”现象——显存峰值出现在前向完成、反向刚开始的时刻，随后在反向后期显著下降。理解这个模式对于优化显存峰值有帮助：如果要降低峰值，要么减少前向存储（如Gradient Checkpointing），要么在反向早期及时释放（如激活值流式消费）。

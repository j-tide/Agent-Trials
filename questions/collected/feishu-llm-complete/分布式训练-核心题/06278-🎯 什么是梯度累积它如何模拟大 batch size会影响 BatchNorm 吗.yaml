content:
  prompt: "\U0001F3AF 什么是梯度累积？它如何模拟大 batch size？会影响 BatchNorm 吗？"
answer:
  mode: rubric
  reference_answer: "梯度累积 是一种在显存受限时，通过时间换空间来模拟更大批量大小（batch size）的技术。\n\n\U0001F50D
    工作原理\n假设我们的GPU显存只允许一次处理 micro_batch_size=16 的数据，但我们希望用 effective_batch_size=128
    来训练。\n\n- 不更新参数：我们依次处理 8 个 micro-batch。每个 micro-batch 都进行前向和反向传播，计算出梯度。\n\n- 累加梯度：将这些梯度相加（累积）
    到参数上，而不是在每个 micro-batch 后都执行优化器更新。\n\n- 一次性更新：当处理完第 8 个 micro-batch 后，参数的梯度已经等于用
    batch_size=128 计算出的梯度。此时，才调用优化器用这个累积的大梯度去更新参数。\n\n- 清零：更新后，将所有参数的累积梯度清零，开始下一轮累积。\n\n这相当于用
    8 次小批量的计算成本，模拟了一次大批量的更新。\n\n⚠️ 对 BatchNorm 的影响\n\n答案是：有严重影响，默认不可用。\n\nBatchNorm
    会在每个 mini-batch 内部统计该批数据的均值和方差。在梯度累积中，每个 micro-batch 都是独立统计的，这意味着它计算的是小批量（比如16）的统计量，而不是期望的大批量（128）的统计量。小批量的统计量方差很大，极不稳定，会严重损害模型性能和收敛。\n\n因此，在使用梯度累积时，通常：\n\n-
    使用其他归一化层：如 LayerNorm 或 GroupNorm，它们不依赖 batch 统计量，天然兼容梯度累积。\n\n- SyncBN（同步批归一化）：如果在多卡训练中，可以使用跨卡的SyncBN，让所有卡上的
    micro-batch 共享统计量。但这依然不能解决累积步之间统计独立的问题。一般更推荐直接换成 LayerNorm。\n\n\U0001F4A1 与数据并行的区别：数据并行是“空间上”的并行，多张卡同时计算不同数据，最后把梯度平均；梯度累积是“时间上”的串行，一张卡分多次计算，最后把梯度相加。梯度累积模拟的
    batch size 大小是 micro_batch_size × 累积步数。\n\n---"

content:
  prompt: 梯度爆炸的直观表现是什么？如何通过监控梯度范数发现？
answer:
  mode: rubric
  reference_answer: |-
    梯度爆炸是指反向传播过程中，某些层的梯度值异常巨大，导致参数更新量远超正常范围。其直观表现包括：

    - Loss曲线突然飙升：在某个训练步，损失值突然跳涨到正常值的数倍甚至数十倍，随后可能恢复或继续恶化。

    - Loss变为NaN或Inf：梯度爆炸严重时直接产生非法数值，训练崩溃。

    - 参数L2范数急剧增大：模型权重的范数突然增加，说明更新步幅过大。

    - 训练速度突然变慢：梯度爆炸引发数值异常后，混合精度训练的Loss Scaling会自动降低缩放因子以尝试恢复，但可能导致训练停滞。

    监控梯度范数是预防和诊断梯度爆炸的核心手段。具体做法是：

    - 在每次优化器更新前，计算所有参数梯度的全局L2范数（total_norm = torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm)的返回值）。

    - 记录梯度范数随时间步的变化曲线。正常训练中，梯度范数通常在0.1到10之间波动，有逐步下降的趋势。

    - 如果梯度范数突然从正常值（如2.0）跳变到几百甚至几千，说明发生了梯度爆炸。

    - 设置预警阈值：当梯度范数超过历史均值的5~10倍时，自动触发告警或跳过该批次更新。

    - 还可以分层监控，定位爆炸发生在哪一层。通常深层网络的浅层（靠近输入）更容易出现梯度消失，而深层（靠近输出）或RNN类型网络容易出现爆炸。

    通过持续监控梯度范数，结合自动化工具（如WandB、TensorBoard），可以在训练崩溃前及时调整超参数或回滚检查点。

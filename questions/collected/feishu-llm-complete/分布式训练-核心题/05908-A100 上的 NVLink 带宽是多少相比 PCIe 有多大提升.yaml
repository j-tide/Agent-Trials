content:
  prompt: 24.A100 上的 NVLink 带宽是多少？相比 PCIe 有多大提升？
answer:
  mode: rubric
  reference_answer: |-
    A100 的 NVLink 带宽：

    - 每个 A100 GPU 拥有 12 个 NVLink 链路（第三代 NVLink）。

    - 每条链路的单向带宽为 50 GB/s（双向 100 GB/s）。

    - 因此，每个 GPU 的总 NVLink 单向带宽为 12 × 50 = 600 GB/s（双向 1.2 TB/s）。

    PCIe 4.0 x16 带宽：

    - PCIe 4.0 单 lane 单向带宽约 2 GB/s，x16 单向带宽约为 32 GB/s（双向 64 GB/s）。

    提升倍数：

    - NVLink 单向带宽（600 GB/s）是 PCIe 4.0 x16（32 GB/s）的约 18.75 倍。

    - 双向来看，NVLink（1.2 TB/s）是 PCIe（64 GB/s）的 18.75 倍。

    如此巨大的带宽优势，使得单机内部的多 GPU 可以几乎无损耗地进行大规模张量并行和数据并行梯度同步，为训练千亿级模型奠定了硬件基础。同时，NVLink 的低延迟（亚微秒级）也是 PCIe 和网络无法比拟的。

    相比之下，跨节点的 InfiniBand HDR（200 Gb/s ≈ 25 GB/s）甚至 NDR（400 Gb/s ≈ 50 GB/s）也远低于 NVLink，因此跨机通信成为分布式扩展的瓶颈。这也就是为什么我们通常只在节点内部使用 TP（张量并行），而跨节点主要依赖 PP（流水线并行）和 ZeRO-DP，以降低对网络带宽的需求。

content:
  prompt: 为什么推荐选择 Top-2 路由，而不是 Top-1 或 Top-3？
answer:
  mode: rubric
  reference_answer: |-
    实践中，Top-2 通常是效果和开销的最佳平衡点。

    - Top-1 (Switch Transformer)：计算开销最小，每个 token 只激活一个专家。但缺点是对路由决策的准确性要求极高，一旦路由选错专家，该 token 信息处理完全依赖一个可能不合适的专家，表达能力受损。同时训练稳定性较差，容易坍塌到少数专家。

    - Top-2 (大多数 MoE 模型，如 GShard, GLaM, Mixtral)：计算量是 Top-1 的两倍，但仍远小于稠密模型。两个专家可以互补，即使一个选得不太准，另一个也能兜底。两个专家的输出加权组合也增加了模型的表达能力。训练时更稳定，专家更容易分化。

    - Top-3 或更高：计算量继续增大，但边际收益递减。更多的专家意味着每个 token 的计算更接近稠密模型，丧失了稀疏激活的省计算优势。而且不同专家的输出容易趋同，专家特化能力减弱。此外通信开销也线性增加。

    因此，Top-2 是目前最主流的选择。以 Mixtral 8x7B 为例，它就是每个 token 选 Top-2 专家。

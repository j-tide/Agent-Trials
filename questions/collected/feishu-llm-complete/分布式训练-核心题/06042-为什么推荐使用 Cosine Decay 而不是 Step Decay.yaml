content:
  prompt: 为什么推荐使用 Cosine Decay 而不是 Step Decay？
answer:
  mode: rubric
  reference_answer: |-
    学习率衰减策略影响模型在训练后期的精细收敛。Cosine Decay（余弦退火）相比传统的Step Decay（阶梯衰减）具有显著优势。

    Step Decay：在预设的训练步数（如每30%的总步数）时，将学习率乘以一个衰减因子（如0.1）。这种策略存在突变，每次衰减后模型需要重新适应新的学习率，可能导致损失震荡。而且预设衰减节点需要经验，不同任务最优节点不同。

    Cosine Decay：学习率按照余弦曲线从初始值平滑降低到接近零。公式为：η_t = η_min + 0.5(η_max - η_min)(1 + cos(π * t / T))。曲线初期变化平缓，让模型在较高学习率下充分探索；后期快速衰减，使模型在收敛阶段以极小步长精调。

    推荐理由：

    - 平滑无突变：学习率连续变化，避免了因学习率突然下降导致的损失尖峰或停滞。

    - 更好收敛性：在接近训练结束时，学习率变得极低，模型可以收敛到更深的极小值，通常获得更好的最终性能。

    - 鲁棒性强：不需要手动设置衰减步长和衰减因子，只需设置初始学习率和训练总步数，大大减少了调参负担。

    - 实验证明：在图像分类、语言模型等大量任务上，Cosine Decay一致地优于Step Decay，尤其在训练大模型时，这一差距更为明显。

    当然，Step Decay在某些特定场景（如迁移学习、特定任务微调）仍有用武之地，因为它可以强制模型在特定阶段“重启”适应，但作为通用的默认衰减策略，Cosine Decay已是业界标准。

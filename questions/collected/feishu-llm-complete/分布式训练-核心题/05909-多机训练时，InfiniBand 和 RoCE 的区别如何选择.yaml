content:
  prompt: 25.多机训练时，InfiniBand 和 RoCE 的区别？如何选择？
answer:
  mode: rubric
  reference_answer: |-
    在多机多卡的分布式训练中，节点间的网络通信是整体性能的关键瓶颈。InfiniBand（IB）和 RoCE（RDMA over Converged Ethernet）是目前最主流的两种高性能互联技术，它们都支持 RDMA，但在架构、性能和生态上存在显著差异。

    InfiniBand（IB）：

    - 一套完整的专用网络协议栈，从物理层、链路层到传输层都由 IB 标准定义。它有自己的网卡（HCA）、交换机和线缆，与以太网完全独立。

    - 带宽高、延迟极低。例如 InfiniBand HDR 提供 200 Gb/s（约25 GB/s）单向带宽，NDR 更是达到 400 Gb/s；端到端延迟通常在 1-2 微秒级别。

    - 原生支持 RDMA，包括可靠连接（RC）和不可靠数据报（UD）等模式，通信完全绕过 CPU，由网卡硬件完成。

    - 有一套成熟的子网管理器（SM）进行路由和配置，网络管理较简单。

    - 成本高昂：需要专用硬件，交换机价格昂贵，线缆和网卡也贵；且需要专业技术支持。

    RoCE（RDMA over Converged Ethernet）：

    - 在传统以太网上实现 RDMA 功能。有两个版本：RoCEv1 限于同一广播域（链路层），RoCEv2 基于 UDP/IP，可以跨路由。

    - 物理层和交换机使用标准以太网，因此可以与现有数据中心网络融合，成本较低。

    - 为了实现无损传输（RDMA 要求不丢包），通常需要配置优先级流控（PFC）等拥塞控制机制，对网络管理和配置要求高，若配置不当容易出现性能问题。

    - 性能略低于 IB：虽然也能达到类似带宽（如 200GbE），但延迟通常比 IB 高 1-2 微秒，且对网络抖动更敏感。

    如何选择？

    - 性能优先、预算充足：选择 InfiniBand。在超大规模 AI 集群（千卡以上）中，IB 的稳定性、低延迟和成熟的生态系统带来更高的训练效率，开箱即用，无需复杂调优。

    - 成本敏感、已有以太网基础设施：选择 RoCEv2。如果数据中心已经部署了高速以太网（如 100GbE/200GbE），RoCE 可以节约大量成本，但需要网络团队对 PFC、ECN 等进行精细配置，否则丢包会导致 RDMA 性能急剧下降。

    - 混合环境：一些云厂商提供基于 IB 的实例，也有基于 RoCE 的实例，用户可根据需求选择。对于大多数追求极致性能的大模型训练，IB 仍是首选。

content:
  prompt: 说明 Dataloader 的 num_workers 和 pin_memory 对训练速度的影响。
answer:
  mode: rubric
  reference_answer: |-
    ### num_workers

    - 作用：num_workers 指定了用于数据预加载的子进程数量。当设为0时，主进程自己负责从磁盘读取和预处理数据，这会导致GPU在等待下一个batch时空闲。

    - 多进程并行：多个worker并行执行I/O和解码、增强等CPU密集型操作，预先将处理好的数据放入队列，保证GPU始终有数据可算。

    - 最佳实践：

    ### pin_memory

    - 作用：将数据从普通CPU内存复制到页锁定（Page-Locked）内存中。

    - 原理：GPU通过DMA（直接内存访问）从CPU内存拷贝数据。如果内存是可分页的，DMA控制器需要先锁定页面，效率较低。而页锁定内存（pinned memory）避免了换页开销，GPU可以直接以最高带宽进行拷贝。

    - 性能提升：通常可使数据传输速度提升 2~3 倍。

    - 注意事项：

    ### 组合优化

    dataloader = DataLoader(
        dataset,
        batch_size=32,
        shuffle=True,
        num_workers=8,
        pin_memory=True,
        prefetch_factor=4      # 每个worker预取的batch数
    )
    for batch in dataloader:
        inputs, labels = batch
        inputs = inputs.cuda(non_blocking=True)
        labels = labels.cuda(non_blocking=True)
        # 训练...

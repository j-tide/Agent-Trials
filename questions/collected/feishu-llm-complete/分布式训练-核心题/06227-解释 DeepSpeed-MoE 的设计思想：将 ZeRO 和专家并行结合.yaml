content:
  prompt: 解释 DeepSpeed-MoE 的设计思想：将 ZeRO 和专家并行结合。
answer:
  mode: rubric
  reference_answer: |-
    DeepSpeed-MoE 的设计核心是将 ZeRO 的显存优化思想与 MoE 的稀疏结构深度融合，实现超大 MoE 模型的高效训练。

    层次化 ZeRO：

    - 非专家参数（注意力层、门控网络）：使用标准 ZeRO-1/2/3 进行分片，消除数据并行中的冗余存储。

    - 专家参数：采用专家并行（EP）分布到不同 GPU 上，每个专家只驻留在少数 GPU 上，天然避免了全量存储。同时，ZeRO-3 的参数分片也可应用到专家参数上，进一步降低单卡显存。

    通信优化：

    - DeepSpeed-MoE 对 All-to-All 通信进行了极致优化，包括量化通信、分层通信、与计算的流水线重叠。

    - 支持灵活组合 EP、TP、DP，让用户根据集群拓扑选择最优策略。

    负载均衡与容量：

    - 内置了负载均衡损失和专家容量限制，训练时自动平衡专家负载。

    - 提供了 dropout-based 的溢出处理：溢出的 token 被随机丢弃，依赖残差连接保证信息不完全丢失。

    易用性：

    - 通过配置文件的简单参数即可启用 MoE 和设置并行度，无需修改模型代码。

    - 支持从 HuggingFace 等主流模型库加载预训练权重并扩展为 MoE 结构。

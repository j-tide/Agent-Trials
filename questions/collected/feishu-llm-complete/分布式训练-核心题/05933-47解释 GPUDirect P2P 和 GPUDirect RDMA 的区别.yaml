content:
  prompt: 47解释 GPUDirect P2P 和 GPUDirect RDMA 的区别。
answer:
  mode: rubric
  reference_answer: |-
    - GPUDirect P2P (Peer-to-Peer)：允许同一节点内的两个 GPU 直接通过 NVLink 或 PCIe 访问彼此的显存，无需经过 CPU 内存。它解决了单机多卡通信的低延迟问题。例如，通过 cudaMemcpyPeer 可以直接从 GPU0 拷贝数据到 GPU1。

    - GPUDirect RDMA：允许跨节点的第三方设备（如 InfiniBand 网卡）直接访问 GPU 显存。它建立在 GPUDirect P2P 的基础上，并扩展到了网络。网卡可以绕过 CPU，直接读写远程 GPU 的显存。

    总结：P2P 解决单机内的直接访问，RDMA 解决跨机的直接访问。两者结合构成了完整的 GPU 直接通信生态。

content:
  prompt: 31.什么是 RDMA？它如何降低 CPU 负载和延迟？
answer:
  mode: rubric
  reference_answer: |-
    DMA（Remote Direct Memory Access） 是一种允许一台计算机直接访问另一台计算机内存的技术，整个数据传输过程由网卡硬件完成，不涉及远程主机的操作系统或 CPU。

    工作原理：

    - 应用程序注册一块内存区域（MR）给 RDMA 网卡，网卡获得访问该内存的权限。

    - 发送方发起 RDMA 操作（如 RDMA Write），指定远程主机的内存地址和数据长度。

    - 本地网卡直接从本地内存中读取数据，打包成网络包发送。

    - 远程网卡接收数据包，直接写入目标内存，无需远程 CPU 干预。

    - 整个过程实现 零拷贝（数据不经过内核缓冲区）和 内核旁路（用户态直接操作硬件），从而避免上下文切换和内存拷贝开销。

    降低 CPU 负载：传统网络需要 CPU 将数据从用户空间复制到内核空间，再交给网卡；接收时反向复制。RDMA 完全由网卡 DMA 完成，CPU 仅需处理控制命令，大幅降低 CPU 利用率。

    降低延迟：绕过了内核协议栈和多次拷贝，通常比传统 TCP/IP 延迟低 10 倍以上，达到微秒级。

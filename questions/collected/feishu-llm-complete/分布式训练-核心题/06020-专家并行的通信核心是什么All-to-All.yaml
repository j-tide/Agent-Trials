content:
  prompt: 专家并行的通信核心是什么？All-to-All。
answer:
  mode: rubric
  reference_answer: |-
    专家并行的通信核心是 All-to-All 集合通信操作。它不同于 AllReduce（所有卡求和后广播）或 AllGather（各卡贡献一部分拼接后广播），All-to-All 的特点是：每张卡向其他所有卡发送不同的数据块，同时从其他所有卡接收不同的数据块。操作完成后，各卡持有的数据被完全重新分布。

    在 MoE 场景中：

    - 第一次 All-to-All：将 token 从“当前 GPU”分布到“专家所在 GPU”。每张卡根据路由决策，把属于不同专家的 token 打包发送给对应卡，同时接收其他卡发来的、应由本卡专家处理的 token。

    - 第二次 All-to-All：将处理完的 token 从“专家所在 GPU”送回“原始 GPU”。每张卡把处理完的 token 按原始卡编号打包发回，恢复数据的原始分布。

    All-to-All 的通信量正比于 num_tokens * hidden_dim（每个 token 的表示向量）。当序列很长或 batch size 很大时，通信量可能成为瓶颈。因此，优化 All-to-All 是实现高效 MoE 训练的关键。

content:
  prompt: DeepNorm 是如何让 Post-Norm 稳定训练千层 Transformer 的？
answer:
  mode: rubric
  reference_answer: |-
    DeepNorm 是微软提出的改进 Post-Norm 的方法，成功训练了 1000 层的 Transformer。它的核心思想是通过特殊的权重初始化和残差缩放，抑制 Post-Norm 中梯度爆炸/消失的风险。

    具体做法：

    - 在初始化时，将某些层的权重（如注意力投影和 FFN 第二层）缩小。缩放因子与网络深度有关，通常为 α = (2L)^{-1/4}，其中 L 是层数。

    - 在残差连接分支上引入一个可学习的缩放因子，初始化为一个较小的值（例如 β = (2L)^{-1/2}）。

    - 这种设计使得训练初期，每个子层的输出几乎为 0，整个模型退化为恒等映射。这样，Post-Norm 中的 LayerNorm 对梯度的缩放效应被初始化为恒等，不会指数放大/缩小。

    - 随着训练进行，缩放因子逐渐被更新，模型缓慢地偏离恒等映射，但始终被 DeepNorm 的结构约束在稳定范围内。

    为什么有效：

    - 通过初始化缩放，DeepNorm 保证了训练初期信号的平稳传播，解决了 Post-Norm 在深层时的梯度消失/爆炸问题。

    - 同时保留了 Post-Norm 的正则化优势（因为 LayerNorm 仍然在残差相加之后），通常能取得比 Pre-Norm 更好的最终性能。

    DeepNorm 证明了 Post-Norm 并非天生不适合深层网络，只需配合合适的初始化策略，即可兼得稳定性与高性能。

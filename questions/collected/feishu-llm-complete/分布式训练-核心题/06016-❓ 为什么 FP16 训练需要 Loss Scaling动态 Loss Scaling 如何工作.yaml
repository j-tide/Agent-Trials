content:
  prompt: "❓ 为什么 FP16 训练需要 Loss Scaling？动态 Loss Scaling 如何工作？"
answer:
  mode: rubric
  reference_answer: "FP16 的5位指数位导致它能精确表示的数值范围极窄。在训练深层网络时，大量梯度的绝对值可能小于 10−510−5，直接用FP16表示就会变为0，导致这些参数无法得到更新，模型无法收敛。Loss
    Scaling 正是为了解决FP16梯度下溢问题而生的技术。\n\n\U0001F50D Loss Scaling 的核心原理\n\n既然梯度太小会下溢，那就在计算梯度之前，人为地将Loss乘以一个较大的缩放因子（Scale
    Factor）。根据链式法则，Loss放大后，反向传播产生的所有梯度也会被等比例放大，使得原本微小的梯度值移入\n\n[图片内容未导入]\n\n\U0001F415
    动态 Loss Scaling (Dynamic Loss Scaling) 的工作流程\n静态缩放因子很难选择：太大可能导致梯度上溢（变为Inf/NaN），太小则下溢问题依然存在。动态调整算法（在PyTorch的torch.cuda.amp.GradScaler中实现）解决了这个问题：\n\n[图片内容未导入]\n\n-
    前向与反向传播：在每个iteration，将Loss乘以当前缩放因子，然后反向传播得到放大后的梯度。\n\n- 梯度检查：在优化器更新之前，检查所有梯度中是否出现Inf或NaN。\n\n-
    循环：通过这种动态调整，缩放因子会自动稳定在一个既不引起上溢、又能最大化抑制下溢的理想区间。\n\n\U0001F4A1 现代视角：由于BF16的动态范围与FP32相同，使用BF16训练的模型完全不需要Loss
    Scaling，这是它相对于FP16的巨大优势。\n\n---"

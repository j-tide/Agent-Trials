content:
  prompt: Accelerate 的配置文件 config.yaml 中通常包含哪些内容？
answer:
  mode: rubric
  reference_answer: |-
    Accelerate 配置文件（如 default_config.yaml）记录了分布式训练环境的具体参数，典型内容有：

    - compute_environment: 执行计算的环境类型，如 LOCAL_MACHINE。

    - distributed_type: 分布式策略，可选 MULTI_GPU（DDP）、DEEPSPEED、FSDP、NO（单卡）。

    - mixed_precision: 混合精度模式，no、fp16、bf16。

    - num_processes: 总 GPU 数量。

    - machine_rank: 当前节点的 rank。

    - num_machines: 节点数。

    - main_process_ip 和 main_process_port：主节点的通信地址。

    - deepspeed_config: 如果使用 DeepSpeed，指定其 JSON 配置文件路径。

    - fsdp_config: 如果使用 FSDP，包含分片策略、自动包裹策略等参数。

    - downcast_bf16: 是否将优化器状态降级为 BF16 等。

    - rdzv_backend 和 rdzv_endpoint: 用于弹性训练的会合点配置。

    这些参数可以在 accelerate config 交互式设置，也可手动编辑 YAML 文件，非常灵活。

content:
  prompt: 标准注意力矩阵的显存复杂度是 O(L²)，在训练时是否一定要存储？如何避免？
answer:
  mode: rubric
  reference_answer: |-
    在标准训练中，为了反向传播计算 softmax 的梯度，确实需要保存注意力分数矩阵（或 softmax 输出）。但这不是必须的，可以采用几种方法避免存储完整的 O(L²) 矩阵：

    - FlashAttention：通过分块（tiling）和重计算技术，在前向时只保留 softmax 的归一化因子（标量），反向时重新计算注意力矩阵，从而将显存复杂度从 O(L²) 降到 O(L)。这是当前最主流的方法，已被 PyTorch 2.0 和 xFormers 等库支持。

    - Gradient Checkpointing：在注意力层使用检查点，前向时不存储中间结果，反向时重新计算该层的前向。虽然可以节省显存，但注意力矩阵仍会在重计算时临时占用显存，效率不如 FlashAttention。

    - 稀疏/线性注意力：通过限制注意力模式（如局部窗口、低秩近似）来减少需要计算的 token 对数量，从根本上避免存储完整矩阵。

    - 混合精度训练：使用 FP16 存储注意力矩阵可以减半显存，但不改变二次复杂度。

    因此，虽然理论上必须存储，但通过算法创新可以避免实际存储完整矩阵，从而支持更长序列的训练。

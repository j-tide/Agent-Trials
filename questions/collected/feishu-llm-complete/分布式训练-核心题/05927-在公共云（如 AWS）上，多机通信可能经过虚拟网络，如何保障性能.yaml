content:
  prompt: 42.在公共云（如 AWS）上，多机通信可能经过虚拟网络，如何保障性能？
answer:
  mode: rubric
  reference_answer: |-
    公共云的虚拟网络（如 AWS VPC）通常存在虚拟交换机、带宽限制和额外延迟，对高性能分布式训练不友好。保障性能的措施包括：

    - 使用高性能网络实例：选择支持 EFA（Elastic Fabric Adapter）或高带宽网络的实例类型（如 p4d, p5 系列）。EFA 绕过了虚拟网络栈，提供 OS-bypass 和 RDMA，大幅提升性能。

    - 置放群组（Placement Groups）：将参与训练的实例放入同一个置放群组（如 cluster placement group），确保它们位于同一物理网络主干上，减少延迟和抖动。

    - 避免跨可用区通信：多机训练的所有节点应在同一可用区内，因为跨可用区的流量可能经过更复杂的网络，延迟和带宽损失更大。

    - 开启增强网络：使用 AWS 的 ENA（Elastic Network Adapter）或 EFA，并配置巨型帧（Jumbo Frames），减少封包开销。

    - 合理规划 IP 和子网：确保节点之间可以通过私有 IP 高速通信，避免经过公网网关。

    - 使用 NCCL 调优：设置 NCCL_SOCKET_IFNAME 指向 EFA 接口，启用 GPUDirect RDMA (NCCL_NET_GDR_LEVEL)，并关闭不需要的协议（如 NCCL_IB_DISABLE=0 但指定 EFA）。

    通过这些手段，可以在云上获得接近裸金属的通信性能。

content:
  prompt: 什么是“模型分桶”或“分阶段训练”？有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    分阶段训练是指在训练过程中，动态切换训练配置（如序列长度、学习率、数据分布等），将整个训练进程划分为若干个具有不同目标的阶段。

    ### 常见形式

    (1) 序列长度分桶

    - 阶段1：使用短序列（如256 tokens）训练基础语言模型。注意力计算量小，可以快速处理大量数据，建立局部语法和词法能力。

    - 阶段2：提升至中等长度（如512或1024 tokens），扩大模型感受野。

    - 阶段3：最终目标长度（如2048或4096 tokens），训练长程依赖能力。

    好处：节省早期训练计算量；避免模型在初期被长序列的复杂依赖“难倒”。

    (2) 学习率分阶段调度

    - 预热期 (Warmup)：学习率从极小值线性增长到峰值，防止初期梯度爆炸。

    - 恒定期 (Constant)：保持峰值学习率训练主要阶段。

    - 衰减期 (Decay)：逐步降低学习率，精细调整模型。

    (3) 数据难度课程

    - 早期：使用更干净、结构清晰的数据（如维基百科、书籍）。

    - 后期：引入更多噪声、更广领域的数据（如全网爬虫数据、论坛对话），甚至加入代码、数学内容。

    (4) 冻结-解冻策略

    - 阶段1：冻结视觉编码器，仅训练跨模态连接器和投影层，实现快速对齐。

    - 阶段2：解冻LLM主干，进行全模型微调，提升多模态推理能力。

    ### 优势总结

    - 训练稳定：渐进式增加难度，避免模型崩溃。

    - 资源高效：初期使用较低计算开销，快速迭代验证。

    - 更好收敛：课程学习式的安排有助于模型找到更优的极小值。


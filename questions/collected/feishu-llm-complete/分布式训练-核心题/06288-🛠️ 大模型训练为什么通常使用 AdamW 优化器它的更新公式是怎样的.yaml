content:
  prompt: "\U0001F6E0️ 大模型训练为什么通常使用 AdamW 优化器？它的更新公式是怎样的？"
answer:
  mode: rubric
  reference_answer: "[图片内容未导入]\n\nAdamW 是 Adam 优化器的一个变种，它巧妙地将权重衰减（Weight Decay） 从自适应学习率中解耦出来，解决了标准
    Adam 在泛化能力上的缺陷。\n\n\U0001F4CC AdamW 更新公式\n假设参数为 θ，损失函数对 θ 的梯度为 gt。\n\n[图片内容未导入]\n\n###
    \U0001F50D 为什么大模型用 AdamW？\n\n- 收敛速度快：AdamW继承了Adam的自适应学习率特性，能处理稀疏梯度和非平稳目标函数，这对Transformer类模型至关重要。\n\n-
    泛化能力更强：标准Adam中的L2正则化项会被自适应学习率缩放，导致权重衰减效果不均匀，实际作用类似一个较弱的学习率调整。而AdamW直接将权重衰减独立出来，保证每个参数都以相同的速率向零衰减，这更符合理论上对“简单模型”的偏好，从而提升了模型在未知数据上的表现（泛化）。\n\n-
    广泛验证：从GPT-3到LLaMA，几乎所有大语言模型都采用AdamW，经过了大规模实验检验，社区支持极好。\n\n\U0001F4A1 一句话：AdamW
    = Adam + 解耦的权重衰减，是当前大模型训练的默认优化器。\n\n---"

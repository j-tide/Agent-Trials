content:
  prompt: 44.为什么 NCCL 有时会出现“hanging”问题？常见原因及排查。
answer:
  mode: rubric
  reference_answer: |-
    NCCL 挂起（hung）是指训练过程中所有 GPU 突然停止工作，CPU 利用率也低，但程序不报错也不退出。常见原因：

    - 通信初始化不一致：不同 rank 使用不同的 NCCL 环境变量或配置，导致无法建立正确的通信组。

    - 网络分区：某些节点间的网络物理断开或丢包严重，导致部分 rank 无法连接到其他 rank。

    - 死锁：由于程序逻辑错误，部分 rank 调用了集合操作而其他 rank 没有调用，或者调用顺序不一致，导致互相等待。

    - 资源耗尽：如 GPU 显存不足导致 NCCL 无法分配缓冲区。

    - 超时：默认超时时间较长，若某个 rank 的计算时间远超其他 rank（慢节点），可能引发挂起假象。

    排查：

    - 设置 NCCL_DEBUG=INFO 查看日志，观察通信初始化到哪一步失败。

    - 使用 nccl-tests 测试节点间通信是否正常。

    - 检查网络配置（ip a, ibstat）。

    - 确保所有 rank 的 LD_LIBRARY_PATH、NCCL 版本一致。

    - 设置 NCCL_COMM_TIMEOUT 为一个较小的值，让挂起提前报错而不是无限等待。

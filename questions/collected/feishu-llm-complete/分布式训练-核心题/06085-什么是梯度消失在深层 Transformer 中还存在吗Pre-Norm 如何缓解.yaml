content:
  prompt: 什么是“梯度消失”？在深层 Transformer 中还存在吗？Pre-Norm 如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    梯度消失是指反向传播过程中，梯度从输出层向输入层传递时，由于链式法则中的连乘效应，梯度值指数级衰减，最终趋近于0，导致浅层参数几乎无法更新。它通常发生在使用饱和激活函数（如 Sigmoid、Tanh）或初始化不当的网络中。

    在深层 Transformer 中，梯度消失仍然可能存在，但已通过多种设计被大幅缓解：

    - ReLU 及其变体：正半区导数恒为1，避免了 Sigmoid 类函数的梯度衰减。

    - 残差连接：梯度可以直接通过恒等映射路径回传，不被权重矩阵多次缩放，从而保持梯度幅度。

    - LayerNorm：稳定每层的输入分布，防止激活值漂移导致的梯度异常。

    然而，在极深的 Transformer（数百层）中，即使有残差连接，如果使用 Post-Norm（原始 Transformer 的结构），梯度消失仍可能发生。因为残差分支的梯度必须经过 LayerNorm 的缩放，多层累积可能导致梯度消失或爆炸。

    Pre-Norm 如何缓解：

    - Pre-Norm 将 LayerNorm 放在子层（注意力和 FFN）的前面。这样，残差路径完全绕过了 LayerNorm，梯度可以沿着残差连接畅通无阻地回传。

    - 同时，Pre-Norm 对子层的输入进行归一化，使其保持稳定的分布，有利于子层的学习，但不影响梯度的跨层流动。

    - 因此，Pre-Norm 架构极大改善了深层 Transformer 的训练稳定性，使千层以上的网络也能顺利训练。这也是当前所有大模型（GPT、LLaMA 等）均采用 Pre-Norm 的原因。

content:
  prompt: 训练数据中出现大量重复文本，对模型训练有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    训练数据中的重复文本是常见问题，主要来源包括：网页内容重复、模板化生成的文本、数据集清洗不彻底等。其影响显著且负面。

    ### 主要影响

    - 过拟合与记忆化：模型会“记住”高频重复的段落，而不是学习泛化能力。在生成时，可能逐字逐句复现训练数据，出现“抄袭”现象，不仅损害创造性，还可能引发版权纠纷。

    - 数据分布扭曲：重复样本在训练中被多次采样，频率被人为提高。模型会过度学习这些样本中的模式，低估其他模式的重要性，导致在非重复数据上的表现下降。

    - 评估失真：如果验证/测试集中也存在与训练集重复的文本，评估结果会虚高，无法反映真实泛化能力。

    - 训练效率降低：算力被浪费在学习已经学过的内容上，长尾概念难以被充分学习。

    - 多轮对话与长文本性能下降：重复片段会破坏文本的连贯性和多样性，模型生成的对话可能单调乏味，缺乏信息量。

    ### 应对措施

    - 去重：在数据预处理阶段，使用MinHash、SimHash等算法对文本进行近似去重。

    - 采样策略：在训练时对数据集进行加权采样，降低高频样本的权重。

    - 数据增强：对文本进行改写、同义词替换等，增加多样性。

    - 监控：在训练过程中监控训练集和验证集上的损失差异，异常扩大可能提示过拟合。


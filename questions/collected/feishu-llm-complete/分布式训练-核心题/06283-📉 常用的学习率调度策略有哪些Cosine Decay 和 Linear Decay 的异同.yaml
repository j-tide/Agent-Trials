  prompt: "\U0001F4C9 常用的学习率调度策略有哪些？Cosine Decay 和 Linear Decay 的异同。"
answer:
  mode: rubric
  reference_answer: "学习率调度策略（LR Scheduler）决定了学习率在整个训练过程中如何变化。常见的有：\n\n\U0001F539 Cosine
    Decay (余弦退火)\n\n[图片内容未导入]\n\n- 特点：在训练初期和中期，学习率下降非常平缓，保持较大的值以充分探索；在末期下降加速，精细收敛。这被证明在许多视觉和语言任务中能带来更好的泛化性能。\n\n-
    变体：Cosine Annealing with Warm Restarts，周期性重置学习率。\n\n\U0001F538 Linear Decay (线性衰减)\n\n学习率从初始值线性下降至最小学习率，中间没有曲率变化。\n\n-
    特点：实现简单，可预测性强。在一些大型语言模型预训练中（如LLaMA），线性衰减也被证明有效，且易于和warmup阶段无缝衔接。\n\n\U0001F538
    Step Decay (阶梯衰减)\n\n每过一定epoch数，学习率衰减一个固定的倍数（如0.1）。\n\n- 特点：非平滑，容易在衰减点产生损失抖动，但实现简单，历史深远。\n\n\U0001F538
    其他：Cosine Annealing with Warmup、Polynomial Decay等。\n\n\U0001F4CA Cosine与Linear的异同：\n\n-
    相同点：都从一个高点下降到一个低点，都能配合warmup。\n\n- 不同点：下降速率不同。Cosine在中期下降更慢，给予模型更多时间在高学习率区域探索，这被认为是其泛化能力稍好的原因之一；Linear匀速下降，没有偏好性。实际效果上，两者差异不大，选择往往取决于团队经验或特定基线的设置。当前大模型训练（如GPT-3/LLaMA）常采用Cosine
    with Warmup或Linear with Warmup。\n\n\U0001F4A1 经验：如果资源允许，可以尝试Cosine，它更具“探索精神”；Linear则更简单直接，不易出错。\n\n---"

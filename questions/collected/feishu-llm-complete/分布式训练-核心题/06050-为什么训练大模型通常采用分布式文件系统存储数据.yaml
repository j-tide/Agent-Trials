content:
  prompt: 为什么训练大模型通常采用分布式文件系统存储数据？
answer:
  mode: rubric
  reference_answer: |-
    ### 核心原因

    大模型训练需要数百甚至数千个GPU节点同时从存储系统读取训练数据。如果使用单机存储（如NFS），存储服务器很快就会成为I/O瓶颈，导致所有GPU等待数据，严重浪费算力。

    ### 分布式文件系统的优势

    - 高聚合带宽：数据分布在多台存储服务器上，训练节点可以并行从多个存储节点读取数据。总带宽随着存储节点数线性扩展，轻松达到TB/s级别。

    - 高并发、低延迟：支持数千个客户端同时发起请求，通过元数据服务优化文件定位，避免单点压力。

    - 容错与冗余：数据通常有多副本或纠删码保护，单台存储服务器宕机不会导致数据丢失或训练中断。

    - POSIX兼容性：大多数分布式文件系统（如Lustre, GPFS, WekaFS）支持标准文件操作接口，应用程序无需修改代码即可像使用本地磁盘一样读写数据。

    - 数据亲和性：可通过配置使训练节点优先从同一机架或网络交换域的存储节点读取数据，减少跨机架带宽占用，降低延迟。

    ### 常用系统

    - Lustre：高性能计算领域最流行的开源并行文件系统。

    - GPFS (IBM Spectrum Scale)：企业级分布式文件系统，广泛应用于AI训练集群。

    - CephFS：可扩展的统一存储系统，支持对象、块和文件三种接口。

    - WekaFS：专为AI/ML优化的高性能并行文件系统，具有优秀的元数据处理能力。

    ### 数据格式建议

    为充分发挥分布式文件系统性能，训练数据通常预先打包为大文件序列（如TFRecord, WebDataset tar包），避免海量小文件造成的元数据压力。每个训练节点读取自己的数据分片，实现完美的并行数据加载。


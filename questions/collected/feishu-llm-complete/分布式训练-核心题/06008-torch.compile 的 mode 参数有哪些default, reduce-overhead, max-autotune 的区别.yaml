content:
  prompt: torch.compile 的 “mode” 参数有哪些？"default", "reduce-overhead", "max-autotune"
    的区别。
answer:
  mode: rubric
  reference_answer: |-
    torch.compile的mode参数控制编译优化的激进程度：

    - "default"：平衡模式。编译时应用大部分优化，但不会花费太多时间在自动调优上。通常能获得不错的速度提升，编译时间较短。适合大多数训练场景。

    - "reduce-overhead"：侧重于减少框架开销。它会尝试将更多操作融合，减少Python-CUDA交互次数。可能会生成更激进的融合kernel，编译时间稍长，但训练循环的延迟更低，尤其适合小模型或推理场景。

    - "max-autotune"：极致性能模式。编译器会花费大量时间对不同的实现方案进行benchmark（如矩阵乘的tiling策略、线程块大小），选择在具体硬件上最快的那一个。编译时间最长（可能数小时），但能获得最优性能。适用于对吞吐有极致要求的生产环境，或模型固定后的最终优化。

    实际使用建议：训练大模型时，先用"default"模式快速验证。如果追求长期训练的极致效率，可以切换到"max-autotune"并让它在夜间自动完成编译，然后加载缓存进行正式训练。

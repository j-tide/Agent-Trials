content:
  prompt: DeepSpeed 的核心配置文件是什么？如何指定 ZeRO stage？
answer:
  mode: rubric
  reference_answer: |-
    DeepSpeed 通过一个 JSON 格式的配置文件来控制训练优化策略。通常命名为 ds_config.json 或类似名称。配置文件中可以指定 ZeRO 优化阶段、混合精度训练、批量大小、优化器参数、梯度累积、激活检查点等。核心结构如下：

    ```json
    {
      "train_batch_size": 256,
      "gradient_accumulation_steps": 8,
      "optimizer": {
        "type": "AdamW",
        "params": {
          "lr": 1e-4,
          "betas": [0.9, 0.999],
          "eps": 1e-8,
          "weight_decay": 0.1
        }
      },
      "zero_optimization": {
        "stage": 2,
        "offload_optimizer": {
          "device": "cpu",
          "pin_memory": true
        },
        "contiguous_gradients": true,
        "overlap_comm": true
      },
      "fp16": {
        "enabled": true,
        "loss_scale": 0,
        "initial_scale_power": 16
      },
      "activation_checkpointing": {
        "partition_activations": true,
        "cpu_checkpointing": false
      },
      "wall_clock_breakdown": false
    }
    ```

    如何指定 ZeRO stage：通过 zero_optimization 中的 stage 字段：

    - "stage": 0：禁用 ZeRO，等同于普通数据并行。

    - "stage": 1：分片优化器状态。

    - "stage": 2：分片优化器状态和梯度。

    - "stage": 3：分片优化器状态、梯度和模型参数。

    还可以通过 offload_optimizer、offload_param 配置 CPU/NVMe 卸载。

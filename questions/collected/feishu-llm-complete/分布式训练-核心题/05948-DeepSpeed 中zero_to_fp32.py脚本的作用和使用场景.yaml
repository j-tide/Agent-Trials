content:
  prompt: DeepSpeed 中“zero_to_fp32.py”脚本的作用和使用场景。
answer:
  mode: rubric
  reference_answer: |-
    zero_to_fp32.py 是 DeepSpeed 官方提供的工具脚本，用于将 ZeRO stage 3 训练保存的分片 checkpoint 合并为单个完整的 FP32 模型权重文件。

    使用场景：

    - 训练完成或中断后，希望将模型导出为标准的 PyTorch 或 HuggingFace 格式，以便用于推理、微调或分享。

    - 训练时未开启 stage3_gather_16bit_weights_on_model_save，而保存的是分片 checkpoint。

    脚本用法：

    python zero_to_fp32.py . pytorch_model.bin

    - 第一个参数是包含分片 checkpoint 的目录（通常有 zero_pp_rank_* 子目录）。

    - 第二个参数是输出的合并后的模型文件名（可选，默认 pytorch_model.bin）。

    脚本原理：

    - 读取每个 rank 保存的分片文件。

    - 根据 ZeRO-3 的参数分片元信息，将各分片的权重拼接回完整的张量。

    - 将所有层的权重组装成完整的模型 state_dict，并保存。

    注意事项：

    - 合并过程需要在 CPU 或单个 GPU 上加载所有分片，因此需要足够的内存来容纳完整模型。对于超大模型（如 175B），合并可能需要在内存充足的 CPU 节点上进行。

    - 脚本只合并权重，不合并优化器状态。如需恢复训练，应直接加载分片 checkpoint。

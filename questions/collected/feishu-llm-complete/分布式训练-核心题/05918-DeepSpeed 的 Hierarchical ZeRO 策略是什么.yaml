content:
  prompt: 34.DeepSpeed 的 “Hierarchical ZeRO” 策略是什么？
answer:
  mode: rubric
  reference_answer: |-
    DeepSpeed 的 Hierarchical ZeRO（特别是 ZeRO++ 中的 hpZ）将分层通信思想应用到 ZeRO 的参数分片和通信中，同样利用节点内高带宽和节点间低带宽的层级结构。

    在 ZeRO-3 中，每个 GPU 只持有 1/N 参数，前向反向需要 AllGather 收集完整参数。如果直接在所有 GPU（跨节点）间 AllGather，跨节点通信量巨大。Hierarchical ZeRO 的做法：

    - 节点内 AllGather：首先在节点内，各 GPU 利用 NVLink 将各自持有的参数分片收集成一份节点内完整参数（放置在某个代表 GPU 上）。

    - 节点间通信：代表 GPU 通过跨节点网络将节点内完整参数与其他节点的代表 GPU 交换，完成节点间的参数收集（通常是量化后的参数，以减少通信量）。

    - 节点内 Broadcast：代表 GPU 将得到的全局完整参数广播给节点内其他 GPU。

    通过这种方式，跨节点通信量从总 GPU 数 × 参数大小 降至 节点数 × 参数大小，显著减少了对跨节点带宽的压力，同时保持了 ZeRO-3 的显存优势。

content:
  prompt: 什么是“Label Smoothing”？它有助于稳定训练吗？
answer:
  mode: rubric
  reference_answer: |-
    Label Smoothing是一种正则化技术：将one-hot硬标签替换为软标签，例如正确类别概率为1-ε，其他类别均分ε/(K-1)。它让模型不要对预测过于自信，输出更平滑的概率分布。

    对训练稳定性的帮助：

    - 防止过拟合：硬标签鼓励模型对正确类别输出极高概率（如0.999），这可能导致权重被推向极端值，在深层网络中引发梯度不稳定。Label Smoothing抑制了这种倾向。

    - 改善模型校准：训练出的模型预测置信度更贴近真实准确率，泛化性能更好。

    - 对噪声标签更鲁棒：当数据中存在少量标注错误时，Label Smoothing能减轻模型对错误标签的“执着”。

    潜在问题：

    - 蒸馏场景下，Label Smoothing可能会削弱教师模型暗知识的传递，需要谨慎使用。

    - 过大的ε（如>0.2）会导致模型欠拟合。

    实践建议：在大模型预训练中，通常使用ε=0.1。微调时可以适当降低或关闭。

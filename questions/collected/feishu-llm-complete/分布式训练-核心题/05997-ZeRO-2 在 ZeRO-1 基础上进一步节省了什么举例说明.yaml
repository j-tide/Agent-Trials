content:
  prompt: ZeRO-2 在 ZeRO-1 基础上进一步节省了什么？举例说明。
answer:
  mode: rubric
  reference_answer: |-
    ZeRO-2 (Gradient Partitioning) 在分片优化器状态的基础上，进一步对梯度进行分片。在反向传播时，每张 GPU 只计算和保留自己所负责那部分参数的梯度，其他部分的梯度在计算后通过 ReduceScatter 通信操作直接分片到对应的 GPU，不占用完整梯度存储。

    仍以 7B 模型、8 GPU 为例：

    - ZeRO-1 节省了优化器状态显存（从 84 GB → ~10.5 GB per GPU）

    - ZeRO-2 额外节省了梯度显存。完整梯度占用 7B × 2 bytes (FP16) = 14 GB。分片后，每张 GPU 只需存储约 14 GB / 8 = 1.75 GB，节省了约 12.25 GB。

    因此，ZeRO-2 相比 ZeRO-1 每卡又减少了约 12 GB 的显存占用，使得总显存需求进一步降低。

    举例：训练一个 7B 模型，单卡原本需要 ~120 GB（权重 14 GB + 梯度 14 GB + 优化器状态 84 GB + 激活值等），用 ZeRO-2 后，每卡显存需求降至约 14 (权重) + 1.75 (梯度) + 10.5 (优化器状态) = 26.25 GB，大幅低于单卡 80GB 限制。

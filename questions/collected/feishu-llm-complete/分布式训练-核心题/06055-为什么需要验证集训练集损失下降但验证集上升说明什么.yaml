content:
  prompt: 为什么需要验证集？训练集损失下降但验证集上升说明什么？
answer:
  mode: rubric
  reference_answer: |-
    验证集是从训练数据中剥离出来、模型在训练过程中“看不到”的数据子集。它的核心作用是对模型进行无偏评估，指导超参数选择和防止过拟合。

    为什么需要验证集？

    - 监控泛化能力：训练集上的损失只能反映模型对已见过数据的拟合程度，验证集上的损失反映的是模型对未知数据的预测能力，即泛化能力。

    - 超参数调优：学习率、批次大小、模型深度等超参数的选择，不能仅依据训练集表现，需要看它们在验证集上的效果来做出决策。

    - 早停机制：当验证集损失不再下降甚至开始上升时，继续训练只会导致过拟合，此时应该停止训练。

    - 模型选择：在训练的不同阶段会保存多个 Checkpoint，最终选择验证集上表现最好的那个，而不是最后一个。

    训练集损失下降但验证集上升说明什么？

    这种现象是过拟合的典型标志。它意味着模型已经开始“死记硬背”训练数据中的噪声和细节，而不是学习其中的通用规律。模型的容量超过了数据所需的复杂度，或者训练时间过长。此时，模型在训练数据上表现得越来越好，但面对新数据时表现反而变差。

    解决方法：

    - 早停：最直接有效的方法，在验证集指标开始恶化时停止训练。

    - 增加训练数据：获取更多、更多样的数据是解决过拟合的根本方法。

    - 正则化：增大权重衰减系数 (Weight Decay)，增加 Dropout 率，或使用标签平滑等技巧。

    - 降低模型容量：减少模型参数量、层数或隐藏层维度。


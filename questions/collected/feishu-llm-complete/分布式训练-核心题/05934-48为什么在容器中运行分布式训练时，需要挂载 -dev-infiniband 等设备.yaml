content:
  prompt: 48为什么在容器中运行分布式训练时，需要挂载 /dev/infiniband 等设备？
answer:
  mode: rubric
  reference_answer: |-
    容器本质上是隔离的运行环境，默认情况下无法访问宿主机的硬件设备。NCCL 进行通信需要使用 InfiniBand 设备（如 /dev/infiniband/rdma_cm, /dev/infiniband/uverbs0 等）。如果容器内没有这些设备文件，NCCL 无法初始化 IB 网卡，只能回退到 TCP/IP 通信，性能急剧下降。

    因此，需要在启动容器时挂载这些设备：

    docker run --device /dev/infiniband ...

    或使用特权模式（不推荐）。通常还会挂载 /dev/hugepages 用于 RDMA 内存注册。对于 NVIDIA GPU，还需要挂载相关的 GPU 设备。正确的设备挂载保证了 NCCL 能够在容器内使用 RDMA 高速通信。

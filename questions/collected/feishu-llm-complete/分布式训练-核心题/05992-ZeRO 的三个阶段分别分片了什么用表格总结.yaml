content:
  prompt: ZeRO 的三个阶段分别分片了什么？用表格总结。
answer:
  mode: rubric
  reference_answer: |-
    ZeRO的三个优化阶段（Stage 1、Stage 2、Stage 3）分别针对模型状态的不同部分进行分片，每一阶段都是在前一阶段基础上的进一步压缩。

    [嵌入表格未展开]

    内存占用分解（以7B模型，FP16混合精度，8卡训练为例）：

    [嵌入表格未展开]

    从表中可以清晰看到，随着ZeRO阶段提升，单卡显存占用递减。ZeRO-1通过分片优化器状态，将最大的一笔开销（84GB）压缩到原来的1/8；ZeRO-2进一步分片梯度，减少了一半的剩余显存；ZeRO-3彻底分片参数，使得单卡模型状态总占用仅为14GB，比完整存储节省了87.5%。但通信量也从ZeRO-1的相对轻量，递增到ZeRO-3的显著增加——这正是用通信换显存的经典权衡。

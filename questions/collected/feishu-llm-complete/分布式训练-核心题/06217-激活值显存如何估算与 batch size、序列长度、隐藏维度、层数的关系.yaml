content:
  prompt: 激活值显存如何估算？与 batch size、序列长度、隐藏维度、层数的关系。
answer:
  mode: rubric
  reference_answer: |-
    激活值（activations）是前向传播过程中各层产生的中间张量，它们必须在反向传播时被保留用于计算梯度。激活值显存的大小由模型架构、输入规模决定。

    对于 Transformer 模型，激活值主要来自：

    - 每个注意力头的 Q、K、V 矩阵（形状通常为 [batch, seq_len, num_heads, head_dim]）

    - 注意力得分矩阵（softmax 之前或之后），形状 [batch, num_heads, seq_len, seq_len]（显存复杂度 O(L²)）

    - 前馈网络（FFN）中间层的输出，形状 [batch, seq_len, intermediate_dim]

    - 层归一化的输入/输出等较小张量

    - Dropout 掩码（如果使用）

    激活值显存与参数的关系可近似为：

    Activation Memory≈batch_size×seq_len×hidden_dim×num_layers×constant

    其中 constant 依赖于具体的模型细节和是否存储注意力矩阵。对于长序列，注意力矩阵的 O(L²) 存储需求会占主导地位，使得激活显存与序列长度成二次关系；对于较短序列或使用了优化（如 FlashAttention），则近似线性。

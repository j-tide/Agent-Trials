answer:
  mode: rubric
  reference_answer: |-
    - 负载均衡损失：核心手段，惩罚分配不均。

    - 容量与溢出机制：间接约束门控避免热门专家溢出。

    - 路由随机性：Top-k 选择前加入 Gumbel 噪声或随机采样，鼓励探索，训练初期常用。

    - 调度器智能分发：部分框架（DeepSpeed-MoE）支持对溢出 token 二次分配。

    - 监控与动态调参：实时观察专家负载直方图，动态调整 α 或容量因子。

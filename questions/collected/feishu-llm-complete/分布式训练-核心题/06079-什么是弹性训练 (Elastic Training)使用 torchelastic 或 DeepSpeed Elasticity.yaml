content:
  prompt: 什么是“弹性训练” (Elastic Training)？使用 torchelastic 或 DeepSpeed Elasticity。
answer:
  mode: rubric
  reference_answer: |-
    弹性训练指在训练过程中，允许动态地增加或减少参与训练的 GPU 数量（通常由于节点故障、资源抢占或动态扩容），而无需从头开始。它通过定期保存 checkpoint，并在成员变化时重新分布数据和状态来实现。

    - torchelastic：PyTorch 的原生弹性训练方案，通过 torchrun 的 --rdzv_backend 和 --max_restarts 等参数管理动态节点。当有节点加入或离开时，会自动重启训练进程并从最近的 checkpoint 恢复，同时重新平衡数据分片。

    - DeepSpeed Elasticity：提供类似功能，与 DeepSpeed 深度集成，支持在动态节点数下自动调整数据并行度和 ZeRO 分片。使用时需配置 elasticity 部分，并确保 checkpoint 包含完整的状态。

    弹性训练对于使用竞价实例（spot instances）或共享集群非常有用，可降低计算成本并提高资源利用率。

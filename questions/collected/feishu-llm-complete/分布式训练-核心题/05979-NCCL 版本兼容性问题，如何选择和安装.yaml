content:
  prompt: NCCL 版本兼容性问题，如何选择和安装？
answer:
  mode: rubric
  reference_answer: |-
    NCCL 版本需要与 CUDA 驱动、CUDA Toolkit 和 PyTorch 版本兼容。通常安装匹配的 CUDA 版本的 NCCL 即可，例如 CUDA 12.1 对应 NCCL 2.18.x。通过 Conda 或 pip 安装 PyTorch 时，会自动安装配套的 NCCL。对于定制环境，可以从 NVIDIA 官网下载 NCCL 安装包，注意查看发布说明中的兼容性矩阵。

    安装后，可通过 nccl-tests 检查通信是否正常。如果出现通信挂起或性能问题，常是 NCCL 版本与驱动不匹配所致，可尝试升级或降级 NCCL。

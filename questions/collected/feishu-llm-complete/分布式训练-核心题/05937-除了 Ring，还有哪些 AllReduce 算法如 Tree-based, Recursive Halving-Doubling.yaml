content:
  prompt: 6. 除了 Ring，还有哪些 AllReduce 算法？如 Tree-based, Recursive Halving/Doubling。
answer:
  mode: rubric
  reference_answer: |-
    - Tree-based AllReduce：将节点组织成树形结构，先自底向上Reduce，数据汇集到根节点，然后自顶向下Broadcast。延迟对数级（O(log N)），适合小消息和延迟敏感场景。缺点是父节点带宽压力大，大规模时根节点可能成为瓶颈。

    - Recursive Halving/Doubling：将通信过程分解为递归的“减半”和“倍增”。第一步：节点与距离为1的邻居交换数据并归约一半；第二步：与距离为2的邻居交换，以此类推。总步数为 2·log₂N。延迟对数级，且带宽利用率接近最优。需要节点数N为2的幂。

    - Butterfly算法：类似FFT的蝶形网络，在log₂N步内完成全局归约和广播，具有对称性和高并行度。

    NCCL的选择：NCCL会根据消息大小、节点数和拓扑自动选择算法。通常小消息（<256KB）用Tree-based，大消息用Ring或Recursive Halving。还支持混合算法和分段流水线。

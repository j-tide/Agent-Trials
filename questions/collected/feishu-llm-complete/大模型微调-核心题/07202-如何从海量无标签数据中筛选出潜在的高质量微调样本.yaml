content:
  prompt: 如何从海量无标签数据中筛选出潜在的高质量微调样本？
answer:
  mode: rubric
  reference_answer: |-
    从海量无标签数据（如网页、论坛、企业文档）中“淘金”，需要一套基于无监督和半监督学习的筛选管道。

    - 基于统计特征的初筛

    - 长度与复杂度：过滤掉过短、过长或句子结构过于简单的文本。

    - Heuristic Filters：利用规则过滤，如包含大量乱码、HTML标签、脏话、重复度高的文本。

    - 语言质量评分：使用KenLM等语言模型计算文本的困惑度（PPL）。PPL处于一个合理区间（不太高也不太低）的文本通常是流畅且信息密度适中的。

    - 基于内容价值的评估

    - 信息密度：计算文本中实体词（人名、地名、专业术语）的密度。密度较高的文本通常更有“干货”。

    - 问答对识别：对于论坛、社区数据（如Stack Overflow, Quora, 知乎），可以利用页面结构特征或文本模式（如“Q:” “A:”）识别出潜在的问答对。

    - 点赞/投票信号：高赞的回答通常是高质量的有力信号。

    - 使用强模型进行自动标注与筛选

    - 任务转化：将无标签文本转化为潜在的SFT数据。例如，对于一段长文，可以调用GPT-4自动生成“基于这段文字，可以提出什么指令？”以及“该指令的标准回答是什么？”。

    - 质量打分：使用一个独立的强模型（如GPT-4或微调后的评分模型）对生成的(指令, 回答)对进行多维度打分（有用性、准确性、安全性），只保留高分样本。

    - 困惑度过滤：用基座模型计算这些生成回答的PPL，剔除语言不通顺的样本。

    - 主动学习与人工介入

    - 在经过自动筛选的样本中，使用主动学习策略，挑选出模型最不确定（如生成概率最低、评分方差最大）的样本，送交人工专家进行审核和修正。这能在有限的人工预算下，最大化数据的价值提升。

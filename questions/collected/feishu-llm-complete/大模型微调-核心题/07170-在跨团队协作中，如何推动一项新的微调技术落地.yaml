content:
  prompt: 在跨团队协作中，如何推动一项新的微调技术落地？
answer:
  mode: rubric
  reference_answer: |-
    推动新技术落地，技术只是入场券，真正的核心是解决“人”和“流程”的问题。我通常会遵循“试点-证明-赋能-制度化”的四步法。

    - 寻找痛点，建立同盟：我不会拿着锤子（新技术）到处找钉子。我会去和业务团队聊天，倾听他们的痛苦。例如，某个客服团队被大量重复的、复杂的产品咨询搞得疲惫不堪。我会提出：“我有个方案，可能帮你们把这类问题自动解决掉80%。” 找到那个最痛的场景和最愿意尝试的合作伙伴。

    - 极速试点，用数据说话：与合作伙伴锁定一个非常小的业务场景（比如“处理退换货咨询”），利用现有数据，在一周内快速打造一个微调模型原型。然后，在真实业务中进行小范围A/B测试。关键是拿出有说服力的数据：“看，新的微调模型在处理退换货问题上，客户满意度提升了15%，人工转接率下降了20%。” 数据比任何技术术语都有力量。

    - 打造标杆，赋能推广：将这个小试点的成功，包装成一个完整的、可传播的成功案例。在团队内部进行分享和演示。更重要的是，把这次成功的经验（数据处理流程、模型选择、评测方法）标准化、文档化，甚至产品化。我们不能每次都让AI专家去手动操作，而是要把这套流程固化为一个内部工具或平台，赋能给所有业务团队，让他们也能自助式地构建模型。

    - 建立机制，融入流程：当多个标杆成功后，就要推动技术从“特殊技巧”变成“标准流程”。我会与相关团队的负责人一起，制定新的协作流程规范，比如：一个新的AI需求如何从业务方流转到AI团队，如何评估、排期、交付、验收。将微调能力融入公司的整体AI战略中，使其从一个“实验项目”变成公司数字化运营的一部分。


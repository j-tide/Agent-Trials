answer:
  mode: rubric
  reference_answer: |-
    评估工具调用（Function Calling）模型，除了通用对话指标，必须重点关注调用的准确性、效率、格式精确性和鲁棒性。

    特有评估指标：

    - 调用触发准确率（Precision & Recall of Tool Invocation）：

    - 参数提取准确率（Argument Extraction Accuracy）：

    - 结构化输出格式校验（Format Compliance）：

    - 错误处理与自愈能力（Error Handling & Recovery）：

    - 并行/串行调用准确性：

    - 对工具定义变更的鲁棒性（Robustness to Schema Changes）：


content:
  prompt: 当你接手一个全新的微调项目，如何从零开始构建数据集？
answer:
  mode: rubric
  reference_answer: |-
    从零构建微调数据集的系统化流程：

    - 需求分析与能力矩阵构建：与产品、业务方明确模型的目标。将模糊的需求（如“做一个友好的客服”）拆解为具体、可评估的能力维度（如“准确理解退货政策”、“以共情语气回应用户投诉”、“无法处理时转人工”）。产出一份能力矩阵。

    - 基座模型评估与差距分析：使用少量手工编写的指令，测试基座模型在各个能力维度上的现有水平。识别哪些能力是模型已具备的（只需少量数据维持），哪些是严重不足的（需要重点攻坚）。

    - 种子数据手工构造（黄金集）：投入最有经验的领域专家，手工编写50-200条覆盖核心能力、典型场景和复杂边界案例的高质量“种子”指令-回答对。这是整个数据集的“基因”，必须精确无误。

    - 多源数据扩展与合成：以种子数据为Few-shot示例，使用GPT-4等强模型，通过Self-Instruct、Evol-Instruct等方法，批量生成数千条新数据，快速扩大数据量和多样性。同时，收集和筛选开源相关数据集、内部业务文档转化的QA对、以及经过严格脱敏的真实用户日志（如有）。

    - 数据清洗、格式化与质量过滤：将所有数据统一为标准模板，进行去重、去污染、安全过滤、PII脱敏。使用自动化质量评分卡筛选，保留高质量样本。

    - 数据配比设计与课程学习：根据能力优先级和基座模型短板，设计各类数据的最终比例。同时，规划课程学习策略：初期用简单样本，后期逐步加入高难度、带约束的样本。

    - 小规模探针实验与迭代：用极小模型或少量步数快速训练，评估模型在能力矩阵上的表现。根据结果，调整数据配比或补充特定能力的数据，形成快速迭代闭环。

    - 建立数据版本与持续更新机制：为最终的数据集创建版本号，归档元数据。建立从线上Bad Case到数据修正的反馈管道，为后续持续微调做好准备。

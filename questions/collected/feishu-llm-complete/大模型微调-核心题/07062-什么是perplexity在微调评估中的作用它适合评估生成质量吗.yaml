content:
  prompt: 什么是“perplexity”在微调评估中的作用？它适合评估生成质量吗？
answer:
  mode: rubric
  reference_answer: |-
    Perplexity（PPL，困惑度） 是一个衡量语言模型对给定文本序列预测能力的指标。数学上，它是序列的交叉熵损失的指数形式。低PPL意味着模型认为这段文本的出现概率高，即模型对其“不困惑”。

    在微调评估中的作用：

    - 绝对数值的局限性：PPL不适合直接用于评估开放域的生成质量。一个低PPL的回答可能是一个毫无信息量的、陈词滥调的套话（如“好的，很高兴为您服务”），而一个高PPL的回答可能是一个逻辑严密但使用罕见术语的专业解答。PPL的高低与回答的有用性、准确性、创造性没有直接对应关系。

    - 相对比较中的诊断价值：

    总结：PPL是一个优秀的统计诊断工具和优化监控器，但绝不是一个生成质量的评估工具。它可以告诉你模型是否“熟悉”这类文本，但不能告诉你模型生成的文本是否“好”。


content:
  prompt: 语音大模型微调，语音信号通常如何输入到LLM？
answer:
  mode: rubric
  reference_answer: |-
    语音是连续的模拟信号，无法直接输入给基于离散token的语言模型。因此，语音大模型的核心挑战在于将连续的语音波形转换为LLM能消费的离散token序列。


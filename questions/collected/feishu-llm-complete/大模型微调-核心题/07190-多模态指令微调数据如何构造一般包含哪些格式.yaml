content:
  prompt: 多模态指令微调数据如何构造？一般包含哪些格式？
answer:
  mode: rubric
  reference_answer: |-
    多模态指令微调数据的目标是教会模型根据图像/视频内容，执行用自然语言描述的多样化任务。它不再是简单的“图像-标题”对，而是更复杂的多轮、多任务、带约束的对话。

    数据构造方法：

    - 自动生成（主流）：利用现有强大的纯文本LLM（如GPT-4），将图像的内容表示（如物体检测框、密集描述、OCR文字）作为上下文提供给LLM。然后，让LLM扮演“用户”和“助手”的角色，围绕这张图片进行有深度的、多样化的对话，从而自动生成高质量的指令-回答对。LLaVA和ShareGPT4V的早期数据都是这样构造的。

    - 人工精写：对于安全性要求极高的场景或复杂推理任务，由人工专家直接看图编写指令和回答。质量最高，但成本高昂。

    - 从现有数据集转换：将传统的视觉问答（VQA）、图像描述（Captioning）、指代表达（Referring Expression）等学术数据集，通过设计模板，转换为统一的指令-回答格式。

    一般包含的格式：

    - 单轮视觉对话：<image> 这张图片里有什么？ → 一位女士在公园里遛狗。

    - 多轮视觉对话：<image> 图中的狗是什么品种？ → 看起来是一只金毛寻回犬。 / 它大概多大了？ → 从体型判断，可能还是一只幼犬。

    - 视觉推理：<image> 这个人为什么会笑？ → 因为他刚刚收到了礼物。

    - 视觉+文本约束任务：<image> 用JSON格式输出图中所有水果的名称和数量。 → {"苹果": 3, "香蕉": 2}

    - OCR与文字理解：<image> 这家餐厅的招牌菜是什么？ → 从菜单上看，招牌菜是黑椒牛排。

    - 多图/视频理解：<image1> <image2> 比较这两张图，指出有什么不同。

    数据集必须与对话模板（如ChatML）结合，使用<image>等特殊token标记图片的位置。


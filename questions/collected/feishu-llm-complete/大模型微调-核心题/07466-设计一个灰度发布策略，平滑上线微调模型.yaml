content:
  prompt: 设计一个灰度发布策略，平滑上线微调模型。
answer:
  mode: rubric
  reference_answer: |-
    灰度发布（Canary Release/Blue-Green Deployment）是新模型上线的最后一道安全闸门。其核心思想是：将新版本模型暴露给少量流量，在真实世界验证其表现，确认无误后逐步扩大流量，直至完全替换旧版本。

    - 模型部署与流量入口

    - 双版本并存：在推理集群中同时部署旧模型（稳定版）和新模型（灰度版）。两者共享同一个API入口。

    - 流量网关分流：在API网关（如Nginx, Envoy, 或云API Gateway）层，根据预设策略将流量路由到不同模型版本。

    - 灰度策略设计

    - 用户/租户级别灰度：将特定白名单的用户、租户的请求全部路由到新模型。这是最安全的灰度方式，便于收集定向反馈。

    - 随机比例灰度：将5%（或10%）的随机流量路由到新模型。适合大规模、无状态的服务。

    - 基于特征的灰度：将包含特定关键词或属于某类任务的请求路由到新模型，用于测试模型在特定场景下的提升效果。

    - 自动化监控与决策

    - 实时指标对比：在灰度期间，核心监控系统必须同时收集两个版本的关键业务指标：用户点赞率、点踩率、任务完成率、平均交互轮次、P50/P95延迟。

    - 自动化告警与回滚：设置严格的判定规则。例如，如果新模型的点踩率在统计上显著高于旧模型（p-value < 0.05），或者P95延迟超过SLA，系统将自动触发告警，并立即将所有灰度流量切回旧版本，新模型服务下线。整个回滚过程应是全自动的，无需人工干预。

    - 决策上线：如果新模型在灰度期（如24小时）内表现稳定，且各项指标持平或优于旧模型，则可逐步提升灰度比例（5% → 25% → 50% → 100%），直至完全上线。

    - 最终清理

    - 新模型全量上线后，保留旧模型服务实例一段时间（如3-7天），作为紧急回滚的备份。确认无误后，释放旧模型资源。


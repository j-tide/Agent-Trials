content:
  prompt: 微调数据中负面示例（错误回复）的作用及设计原则。
answer:
  mode: rubric
  reference_answer: |-
    负面示例（Bad Cases）在微调中价值非凡，但使用不当则危害巨大。它的作用不是教模型犯错，而是教模型如何识别错误、从错误中恢复，以及建立更鲁棒的安全边界。

    作用：

    - 训练自我纠错能力：通过展示“犯错 → 发现错误 → 纠正错误”的完整链条，模型能学会监控自身输出并进行回溯修正。

    - 强化安全边界：展示“模型在诱导下给出了危险回答 → 随即自我纠正并坚定拒绝”的示例，能让模型学到在有害内容产生的早期阶段进行“悬崖勒马”的能力。

    - 校准不确定性：展示“模型给出了一个看似自信但错误的回答，随后被事实核查并承认错误”的过程，能教会模型保持理智上的谦逊。

    设计原则（必须严格遵守）：

    - 精准的损失掩码：这是最核心的技术细节。错误回复部分的labels必须被严格设为-100（忽略），只有反思和纠正过程的token才计算损失。如果掩码错误，模型将直接学会错误答案，后果灾难。

    - 错误必须是高质量、典型的：构造的错误应是该场景下常见的、有教育意义的错误（如数学计算中的粗心、逻辑上的跳跃、常见的错误观念），而不是随机乱写的噪声。

    - 比例严格控制：负面示例应占极少数，通常在1%~3%左右。如果占比过高，模型可能学会“为了修正而故意犯错”的坏模式，反而损害了直接回答的可靠性。

    - 必须是“错误-纠正”对：绝不能只出现错误而没有纠正。每一条负面示例都必须与一个正确的、理想的纠正结果配对，形成完整的教学闭环。

    - 错误不可被模仿：错误部分的内容，理论上不应该是一个可以被简单模仿的固定模式。因此，错误最好贴近真实场景中模型可能出现的具体偏差。

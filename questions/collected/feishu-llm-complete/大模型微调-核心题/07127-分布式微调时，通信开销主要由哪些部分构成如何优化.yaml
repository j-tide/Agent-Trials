content:
  prompt: 分布式微调时，通信开销主要由哪些部分构成？如何优化？
answer:
  mode: rubric
  reference_answer: |-
    通信开销来自不同并行策略下的集合操作：

    [嵌入表格未展开]

    优化手段：

    - 使用高带宽互联：如NVLink（节点内）、InfiniBand（节点间），确保物理带宽。

    - 通信与计算重叠：在反向传播计算当前层的同时，异步执行上一层的梯度同步（DeepSpeed的overlap_comm，FSDP的自动重叠）。

    - 梯度累积：降低同步频率，增大每次通信的数据量，提高带宽利用率（但总通信量不变）。

    - 精度降低：梯度通信使用FP16/BF16，数据量减半。

    - Bucket合并：将多个小梯度打包成一个大块（bucket）进行通信，减少延迟。DeepSpeed/FSDP都有bucket_size参数。

    - NCCL参数调优：设置NCCL_ALGO、NCCL_CROSS_NIC、NCCL_NSOCKS_PERTHREAD等环境变量，适配特定网络拓扑。

    - 拓扑感知：确保GPU与网卡的NUMA亲和性，避免跨CPU通信。


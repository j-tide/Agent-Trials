content:
  prompt: 多模态对齐阶段，一般训练哪些参数？为什么要冻结视觉编码器和LLM？
answer:
  mode: rubric
  reference_answer: |-
    为什么要冻结？

    - 保护预训练知识的完整性：视觉编码器的视觉理解能力（识别物体、场景、文字等）和LLM的语言能力（语法、知识、推理）都极其宝贵且训练成本高昂。在训练的初始阶段，连接器还未收敛，如果此时解冻两边，其产生的噪声梯度会像锤子一样重击这些已训练好的参数，造成不可逆的灾难性遗忘。

    - 聚焦于“翻译”任务：对齐阶段的目标非常单一——让连接器学会将视觉特征映射到语言空间。冻结视觉编码器和LLM，使得所有反向传播的梯度都集中在连接器上，训练信号极其集中，收敛速度极快。这保证了连接器能以最高效的方式完成它的唯一使命。

    - 训练稳定性：只训练一个极小的连接器（参数量通常为几百万），意味着优化问题极其简单和稳定。可以使用较大的学习率，训练过程平滑，几乎不会出现损失震荡。

    一旦这个“翻译官”训练好了，在随后的指令微调阶段，我们通常会解冻LLM（有时也会解冻连接器，视策略而定），让整个模型在高质量多模态指令数据上进行深度适配。


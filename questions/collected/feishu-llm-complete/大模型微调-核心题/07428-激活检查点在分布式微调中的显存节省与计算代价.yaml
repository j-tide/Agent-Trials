content:
  prompt: 激活检查点在分布式微调中的显存节省与计算代价。
answer:
  mode: rubric
  reference_answer: |-
    显存节省：
    假设模型有L层，原本需要保存所有L层的中间激活。开启检查点后，仅保留检查点层的输入，其余丢弃。理想情况下，激活显存可降至原来的O(L)O(L)级别。对于百层大模型，节省比例可达70%~80%，可将原本因激活溢出而无法训练的配置变得可行。

    计算代价：

    反向传播时，需要重新执行被丢弃层的前向计算。相当于额外进行了一次前向传播（但只计算被检查点覆盖的层）。因此总计算量增加约20%~30%，训练速度相应下降。实际影响与检查点粒度有关：粒度越细（每层都重算），额外计算越多，但显存节省越显著；反之则额外计算少。

    在分布式中的特殊考量：

    - 激活检查点不改变通信量，但重计算会增加计算时间，可能影响通信与计算的重叠效果。

    - 与ZeRO等内存优化结合时，激活检查点节省的显存可以为更大的micro‑batch或更长的序列腾出空间，从而可能通过减少梯度累积步数来提升整体吞吐。


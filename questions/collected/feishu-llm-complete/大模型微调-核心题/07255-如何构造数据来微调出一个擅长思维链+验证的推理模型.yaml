content:
  prompt: 如何构造数据来微调出一个擅长“思维链+验证”的推理模型？
answer:
  mode: rubric
  reference_answer: |-
    要微调出这样的模型，数据必须同时体现逐步推理和自我验证两个特征，且验证环节需显式、具体。

    数据构造要点：

    - 标准思维链+验证
    在每道推理题的回答中，不仅包含分步的推导过程，还在每一步或最后加入验证语句。

    - 多路径比较与选择
    对于一道题，数据中展示多种可能的解法，并分析各自的优劣，最终选择最优方案。

    - 包含错误与修正的链条
    故意在初步推理中植入一个常见错误，然后让模型自己发现、指出并修正。

    - 纯验证型数据
    给出问题和解答过程，让模型专门进行验证。

    - 结构化验证维度
    在回答中引入多维度的验证清单。例如，对于代码生成：“1. 语法检查：无错误。2. 逻辑验证：输入[示例]，输出符合预期。3. 边界测试：空输入时能正确处理。”

    数据来源：

    - 人工精写：质量最高，覆盖核心推理范式。

    - 强模型（GPT-4）蒸馏：给定大量推理题，用特定prompt让强模型生成包含“思维链+验证”的示范答案，再进行人工校验和筛选。

    - 从数学/代码数据集中扩充：在现有的解题数据上，追加一个“验证/反思”段落，可通过改写模型自动完成。

    训练时注意：这类数据需与常规指令数据混合，维持模型对简洁问题的直接回答能力，防止过度“反思”导致冗长。


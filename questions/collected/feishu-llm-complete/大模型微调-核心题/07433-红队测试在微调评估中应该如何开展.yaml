content:
  prompt: 红队测试在微调评估中应该如何开展？
answer:
  mode: rubric
  reference_answer: |-
    红队测试是一种模拟恶意攻击者思维的安全评估方法，通过创造性、对抗性地探索模型的潜在漏洞，发现常规静态测试无法覆盖的风险。

    开展步骤：

    - 组建多元红队：红队应由具备不同背景的人员组成，包括安全专家、领域专家、甚至非技术用户，以覆盖多样化的攻击视角。

    - 明确测试范围与规则：设定测试的安全边界（如重点测试暴力、色情、偏见等），告知测试者禁止进行真实的高危操作，并签署保密协议。

    - 规划攻击策略：红队成员采用多种成熟的越狱和攻击技术，例如：角色扮演诱导、多轮对话引导、逻辑陷阱、编码变形、多语言混淆、上下文操纵等。

    - 执行测试与记录：测试者进行人机交互，实时记录所有交互日志，包括攻击策略、完整prompt、模型原始输出、攻击是否成功、成功/失败的原因分析。

    - 漏洞分析与转化：测试结束后，安全团队对发现的漏洞进行分级（高/中/低危）。所有成功的攻击案例，都被视为宝贵的数据资产。将它们转化为训练数据：将攻击prompt与正确的安全回应配对，加入SFT数据集或作为DPO偏好数据中的负例，用于迭代修复模型。

    - 形成闭环：红队测试不是一次性的，而是“攻击→发现→修复→再攻击”的持续迭代过程。

    红队测试是检验模型安全性的“最终试金石”，它能模拟真实世界中最狡猾的攻击者，是构建鲁棒安全防线不可或缺的一环。


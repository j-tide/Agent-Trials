content:
  prompt: 如何评估微调数据中合成数据的“真实性”？
answer:
  mode: rubric
  reference_answer: |-
    合成数据的“真实性”衡量其与真实人类数据的分布接近程度。真实性不足会导致模型对真实用户输入脆弱，产生“合成到真实”的泛化鸿沟。

    评估方法：

    - 统计特征分布对比：比较合成数据和真实数据（如用户日志）在指令/回复长度、词汇多样性（Type-Token Ratio）、句法树深度、标点使用频率等统计量的分布。差异显著的分布意味着合成数据的风格或复杂度偏离真实。

    - 语义嵌入空间分布：用句子嵌入模型将文本向量化，使用降维技术（如t-SNE或UMAP）可视化分布。真实数据和合成数据的嵌入簇应高度重叠，若形成两个明显分离的簇，则真实性较差。

    - 基于分类器的“合成检测”测试：训练一个轻量级分类器（如BERT）来区分真实数据和合成数据。如果分类器在留出测试集上的AUC接近0.5（即难以区分），说明合成数据的真实性高。反之则存在明显的“合成痕迹”。

    - 困惑度（PPL）一致性：用同一个基座语言模型分别计算真实数据和合成数据的PPL分布。两者的中位数、方差和分布形状应接近，若合成数据PPL整体偏低（过于流畅），可能缺少人类文本中的自然噪声和多样性。

    - 人类图灵测试：将合成数据与真实数据混合，让人类评估员判断每条数据是“人工生成”还是“真实对话”。综合准确率越低，真实性越高。

    - 噪声与多样性检查：真实数据通常包含错别字、口语化表达、不完整句子等“噪声”。检查合成数据是否缺乏这类自然变体，如果过度“干净”，则需在生成时故意注入模仿人类错误的增强。

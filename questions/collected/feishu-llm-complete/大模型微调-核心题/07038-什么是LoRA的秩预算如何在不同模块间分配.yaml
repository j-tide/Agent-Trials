content:
  prompt: 什么是LoRA的“秩预算”？如何在不同模块间分配？
answer:
  mode: rubric
  reference_answer: |-
    LoRA的“秩预算” 是指在给定的总可训练参数量（或总计算预算）下，如何将固定的总秩（或总参数）分配到模型的不同层或不同模块，以实现最优的性能。标准LoRA对所有层使用相同的秩 r，这是一种“平均分配”。秩预算则打破了这种均匀性，允许更重要的层获得更高的秩，次要的层获得更低的秩。

    分配方法：

    - 经验/启发式分配：

    - 基于重要性的自动分配（如AdaLoRA）：

    - 固定秩预算的全局搜索：

    实践建议：

    - 如果不想深入优化，均匀分配（相同r）在多数情况下已经足够好，尤其是在计算资源有限时。

    - 当需要压榨极致性能或参数预算极其紧张时，考虑使用AdaLoRA等自适应方法。

    - 一个简单的改进是：在所有层都使用相同 r 的基础上，对特别重要的几个高层加倍r，对底层减半r，往往能带来小幅提升。


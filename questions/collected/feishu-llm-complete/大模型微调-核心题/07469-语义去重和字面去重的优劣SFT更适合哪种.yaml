content:
  prompt: 语义去重和字面去重的优劣？SFT更适合哪种？
answer:
  mode: rubric
  reference_answer: |-
    字面去重检测的是字符串级别的重叠（如完全相同的子串、编辑距离小等）。语义去重检测的是含义级别的等价（即两段文本表达了相同的任务，但措辞可能完全不同）。

    [嵌入表格未展开]

    SFT数据更适合哪种？

    答案是两者都需要，但语义去重更为关键。字面去重是基础，能高效剔除完全或几乎相同的样本（如数据采集中的技术重复）。但SFT数据最隐蔽的问题是模板化泛滥——许多数据看似不同，实则是同一任务原型用不同句式和词汇反复表述（如“翻译成英文”、“把这段话变成英语”、“用英文怎么说”）。字面去重对这类变体无能为力，而语义去重能通过捕获深层语义等价来识别并控制每个任务的表达变体数量，防止模型在单一任务上过度训练。

    因此，SFT去重的标准流程是：先用字面去重（MinHash等）快速剔除完全重复，再用语义去重（嵌入相似度+聚类）发现并限制任务原型的重复，最后人工抽检边界案例。两者分层协同，字面去重打底提效，语义去重深挖提质。


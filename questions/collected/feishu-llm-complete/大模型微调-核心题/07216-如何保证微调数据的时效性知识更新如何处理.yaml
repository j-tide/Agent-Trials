content:
  prompt: 如何保证微调数据的时效性？知识更新如何处理？
answer:
  mode: rubric
  reference_answer: |-
    微调数据的时效性直接决定了模型是否能回答关于近期事件、最新技术、新法规等方面的问题。处理不当，模型就会产生“过时”或“编造”的幻觉。

    策略：

    - 时间戳标记与版本管理：在数据元数据中，为每一条数据打上“知识截止日期”或“事件发生时间”。这对于法律、金融、科技等时效性强的领域尤为重要。同一个问题在不同时间点的正确答案可能不同，数据中必须明确。

    - 周期性增量更新与再训练：

    - 搜索增强（RAG）结合微调：这是解决时效性问题的最佳实践。在微调数据中，大量引入需要调用外部检索工具的示例（即Agentic RAG），训练模型何时应该搜索、如何搜索、以及如何基于搜索结果回答。这样，模型就不再依赖其参数中记忆的过时知识，而是学会了利用最新的外部信息。这是更根本的解决之道。

    - 教会模型表达不确定性：对于所有预测未来、或基于时间敏感知识的问题，在数据中训练模型诚实地表达不确定性，如“根据我截至XXXX年X月的知识，...但最新情况建议您查询实时信息”。这样，即使在知识空白期，模型也能给出负责任的回应，而不是凭空捏造。

    - 数据去重与去污过程中的时间隔离：确保评测基准（Benchmark）的数据发布时间不会晚于训练数据的时间，避免模型因为“看到了未来”而在评测中作弊（数据污染）。同时，进行严格的、跨时间的版本管理。

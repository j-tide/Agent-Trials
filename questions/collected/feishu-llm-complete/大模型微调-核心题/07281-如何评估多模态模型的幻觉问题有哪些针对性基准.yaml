content:
  prompt: 如何评估多模态模型的“幻觉”问题？有哪些针对性基准？
answer:
  mode: rubric
  reference_answer: |-
    多模态幻觉的评估需要专门设计的基准，以量化模型“无中生有”或“张冠李戴”的程度。

    核心评估基准：

    - POPE (Polling-based Object Probing Evaluation)：将评估转化为判断题——“图中是否存在[物体]？”。通过精心构造的平衡样本，可精确评估模型的物体幻觉率。它是目前最广泛使用的幻觉评估框架。

    - MMHal-Bench：专门设计用于评测多模态幻觉的基准，包含大量诱导性问题。它使用 GPT-4 进行多维评分，包括信息性、真实性和幻觉比例。

    - CHAIR (Caption Hallucination Assessment with Image Relevance)：评估图像描述任务。它将生成的句子拆解为原子短语，然后利用物体检测模型检查每个短语所指的物体是否真实存在于图像中，计算幻觉句子和幻觉短语的比例。

    - HallusionBench：聚焦于需要高级推理和常识的场景，通过构造视觉上相似但语义不同的图像对，考察模型是否会被视觉相似性误导而产生幻觉。

    - Bingo：通过构建“图中不存在物体”的否定性查询，直接测试模型是否敢于说“不”，是评估拒答幻觉的有效工具。

    评估指标：准确率、精确率、召回率、F1-Score（POPE）、幻觉率（CHAIR）、GPT-4 评分等。


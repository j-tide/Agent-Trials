content:
  prompt: Evol-Instruct如何让指令变复杂？深度进化和广度进化的区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    Evol-Instruct是由微软在WizardLM项目中提出的一种指令数据自动进化方法。与Self-Instruct从头生成新指令不同，Evol-Instruct的核心理念是从已有的简单指令出发，通过一系列预定义的进化操作，将其逐步改造为更复杂、更多样、更高难度的指令。它就像生物进化——从简单物种开始，通过变异和自然选择，逐步演化出复杂多样的生命形态。

    Evol-Instruct让指令变复杂的机制：

    它通过将指令送入一个强模型（如ChatGPT），并在prompt中明确要求模型对指令执行特定的“进化操作”。这些操作分为两大类：深度进化和广度进化。

    深度进化（In-Depth Evolving）的目标是增加单条指令的复杂度和约束密度，让指令从“简单直接”变得“层层嵌套、多重限制”。它不改变指令的基本任务类型，而是在原有任务上叠加要求，使问题更难、更精细。深度进化包含五种典型操作：

    - 增加限制：添加更多约束条件。例如，将“写一篇作文”进化为“写一篇800字的议论文，至少包含三个分论点，每个分论点需引用一个历史事件作为论据”。

    - 深化：要求更深入的思考或分析。例如，“介绍气候变化”进化为“分析气候变化对全球经济的三层传导机制，并评估各国应对政策的有效性”。

    - 具体化：将模糊问题具体化。例如，“推荐几本书”进化为“针对一位想转行AI产品的文科背景产品经理，推荐5本循序渐进的入门书籍，并说明阅读顺序”。

    - 增加推理步骤：引入需要多步推理的环节。例如，简单的“计算利润”变为包含多季度、多成本率的复杂计算题。

    - 复杂化问题：将问题变得更为综合和复杂。例如，“解释光合作用”进化为“从光反应和暗反应两个阶段详细解释光合作用，并讨论C3、C4和CAM植物的进化适应性差异”。

    广度进化（In-Breadth Evolving）的目标是增加指令的主题覆盖范围、风格多样性和任务类型。它不增加单条指令的复杂度，而是通过改写、变异和联想，产生与原始指令“不同”的新指令。典型操作包括：

    - 同义改写：用完全不同的措辞表达相同任务，如将“翻译这句话”变异为“把这段文本用英语怎么说？”。

    - 主题迁移：保持任务结构不变，替换主题。例如，将一条关于“经济”的分析指令迁移为关于“教育”、“医疗”的分析指令。

    - 任务类型变异：将分类任务变异为生成任务，或将问答变异为填空。

    - 长尾领域探索：刻意引导模型生成关于小众领域（如古生物学、冷门编程语言）的指令。

    - 语言风格变换：用口语化、学术化、幽默、古风等不同风格改写指令。

    两者的区别与协同：深度进化负责增加指令池的“密度”——在每一类任务内部，提供从简单到复杂的难度梯度；广度进化负责增加指令池的“直径”——覆盖更多任务、领域和风格。两者在迭代中交替进行，最终产出的指令集既广阔又深邃。Evol-Instruct通过这种系统性的进化操作，使得指令数据从简单走向复杂、从单一走向多元，其核心洞察是：复杂指令不是需要人工精心设计，而是可以通过进化操作自动“生长”出来。


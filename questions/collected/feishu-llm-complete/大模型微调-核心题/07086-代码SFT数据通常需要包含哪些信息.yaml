content:
  prompt: 代码SFT数据通常需要包含哪些信息？
answer:
  mode: rubric
  reference_answer: |-
    代码SFT数据与自然语言SFT数据相比，对精确性、结构完整性和上下文依赖性有更高要求。一个好的代码SFT样本必须能让模型学会“何时写代码”、“怎么写”、“如何调试”以及“如何解释代码”。

    一、任务描述（指令）

    清晰、具体的自然语言需求是起点。指令应涵盖：

    - 功能描述：如“写一个Python函数，接收一个整数列表，返回所有偶数的平方”。

    - 约束条件：如“不要使用第三方库”、“时间复杂度O(n)”、“用递归实现”。

    - 上下文信息：如“给定以下类定义，请添加一个方法…”或“在现有代码基础上修改”。

    - 输入/输出示例：提供具体的测试用例，帮助模型理解预期行为。

    二、完整的代码上下文

    仅给出孤立的代码片段训练价值很低。数据应尽可能包含：

    - 必要的import语句：让模型学会在代码开头正确导入所需模块。

    - 完整的函数/类定义：包含文档字符串（docstring）、类型注解等。

    - 示例用法：展示如何调用该代码，并附上期望的输出。这能让模型学到“代码应该如何被使用”。

    三、解释、注释与文档

    代码SFT不仅是教会模型写代码，还要教会它读懂和解释代码。数据中应混合大量以下类型：

    - 代码解释：给定一段代码，用自然语言逐行或逐块解释其功能。

    - 注释生成：为无注释的代码补全高质量注释。

    - 技术文档：为函数或类生成标准的API文档。

    四、错误与调试信息

    这是培养模型“排错能力”的关键。数据必须包含完整的错误-修正闭环：

    - 故意给出有bug的代码。

    - 提供运行时的错误信息（Traceback）或逻辑错误的描述。

    - 模型回复应先分析错误原因，然后给出修正后的完整代码。

    例如：

    ```text
    用户：这段代码运行时报 IndexError，请修复。
    ```python
    def get_first(lst):
        return lst[1]
    ```

    助手：错误在于索引从0开始，应该用 lst[0] 来获取第一个元素。修正后：

    ```python
    def get_first(lst):
        return lst[0]
    ```

    五、代码优化与重构

    训练模型在已有代码基础上进行改进：

    - 性能优化（如降低时间复杂度）。

    - 代码风格改进（如遵循PEP8）。

    - 设计模式应用。

    这类数据的回答不仅要给出新代码，还要解释为什么这样优化。

    六、多语言与多范式

    数据集应覆盖主流语言（Python, JavaScript, Java, C++等）以及不同范式（命令式、面向对象、函数式）。必要时还可包括特定框架（React, Pandas, Django）的使用。

    七、测试用例与验证

    对于代码生成类数据，若能附带单元测试，则可在数据清洗阶段自动验证代码的正确性。只有通过测试的样本才被保留，这能极大提升数据集质量。

    八、安全与伦理

    代码SFT数据中必须包含安全编码实践，例如防范SQL注入、正确处理用户输入、加密敏感数据。同时，要拒绝生成恶意代码（如病毒、木马），并在数据中展示正确的拒绝回答。

    ✅ 总结：代码SFT数据需要包含完整的需求、上下文、解释、调试、优化等多维度信息，并且必须通过自动化验证确保正确性。它是一个立体的、闭环的教学材料，而不仅仅是“代码片段合集”。


content:
  prompt: 多任务微调时，如何进行数据配比？有哪些科学或启发式的方法？
answer:
  mode: rubric
  reference_answer: |-
    多任务微调旨在让模型获得通用能力。不同任务的数据配比直接决定了模型的“能力光谱”。配比不当会导致模型偏科、遗忘或能力冲突。

    科学方法：

    - 基于验证性能的动态调整：首先为每类任务分配初始比例，训练模型并在一个独立的、覆盖所有任务的验证集上评估。根据验证性能，对表现较差的任务提高其数据比例，对已饱和或过拟合的任务降低比例。这个过程可以迭代进行，直到找到最优配比。

    - 消融实验（Ablation Study）：当不确定某类数据的贡献时，训练两个模型，一个包含该类数据，一个不包含，在其他条件完全一致下对比性能。这能精确量化每类数据的边际贡献，避免冗余数据占用训练预算。

    [图片内容未导入]

    启发式方法：

    - 基于基座模型能力基线：在微调前全面评估基座模型，找出其能力短板。对短板任务赋予更高的优先级和更大的数据配比。

    - 按任务重要性赋值：根据产品目标，将能力分为核心、重要、次要等层级。核心能力（如安全、对话）分配最高比例，次要能力（如特定风格写作）分配少量比例。

    - 反数据量加权：对于数据量极少的任务（如高难度推理），为了使其在训练中被充分“看见”，可以人为提高其采样比例，甚至直接复制少量数据（但注意防止过拟合）。这种方法通常与温度采样结合使用。

    - 经验配比：许多经过广泛验证的配比可以作为起点。例如，一个通用聊天助手的配比可能为：通用对话30%，知识问答20%，数学推理15%，代码生成10%，安全对齐10%，多语言支持5%，创意写作10%。

content:
  prompt: SFT数据中加入思维链（CoT）示例有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    在 SFT 数据中加入思维链（Chain‑of‑Thought, CoT）示例，是指为回答部分显式地注入逐步的逻辑推理过程，而不仅仅是给出最终答案。它颠覆了传统的“指令→答案”映射，将模型的内部思考过程外化为可学习的文本，从而在多个层面上根本性地提升模型能力。

    作用与机制：

    - 将“结果模仿”升级为“过程模仿”
    标准 SFT 只教会模型“说什么”，而 CoT 教会模型“怎么想”。当模型在训练中反复见到“先分析条件，再列公式，最后计算”的文本模式时，它通过 Teacher Forcing 学会了在生成最终答案之前，先自发地产出一段推理链。这相当于给模型装上了一套“思考程序”。

    - 显著提升复杂推理任务的准确率
    数学、逻辑、多跳问答、代码调试等任务往往需要多步推理。CoT 将复杂的端到端映射分解为一系列较简单的子步骤，每一步都在模型的能力范围内，大大降低了学习难度。实验证明，在 GSM8K（数学应用题）等基准上，使用 CoT 微调的模型比直接预测答案的模型准确率可提升 20 个百分点以上。

    - 赋予模型“自我检查”与“纠错”能力
    高级的 CoT 数据不仅包含正确的推理链，还会故意植入“错误推理→发现错误→修正”的过程。这会让模型学会在推理过程中监控自身的逻辑，一旦发现矛盾就能回溯并纠正。这种元认知能力对于需要长程推理的任务（如代码生成、复杂规划）至关重要。

    - 提高可解释性与可信度
    当模型展示了完整的推理过程，用户和开发者可以诊断模型是否真正“理解”了问题，还是仅仅猜中了答案。这对于高风险领域（如医疗、金融）尤为关键。同时，推理过程的透明也便于发现和修复模型的知识盲点。

    - 增强泛化能力与少样本学习
    经过 CoT 训练的模型，在遇到全新的、未见过的推理任务时，只需在提示中加上一句“让我们一步一步思考”，就能激发出推理行为。CoT 微调实际上是在向模型注入一种可迁移的推理范式，使其成为通用的推理引擎，而非仅仅解决特定题型。

    实践注意：

    - CoT 数据的质量至关重要。每一条推理链都必须经过事实和逻辑验证，否则模型会学到错误的推理模式。

    - CoT 应与常规 SFT 数据混合使用，比例通常占 10%~30%，防止模型在所有问题上都“过度思考”，丧失简洁回答的能力。

    - 可以设计不同风格的 CoT（如自问自答、分步列表、流程图描述），让模型学会灵活切换。

    一句话总结：CoT 是连接“语言生成”与“逻辑推理”的桥梁，它让 SFT 从教模型“背答案”进化为教模型“掌握解题方法”。


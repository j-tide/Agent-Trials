content:
  prompt: 微调数据是否可以加入用户个性化信息？风险是什么？
answer:
  mode: rubric
  reference_answer: |-
    可以，但必须极其谨慎，并伴随严格的隐私和安全措施。 加入用户个性化信息（如身份、偏好、对话历史）能显著提升模型服务的粘性和精准度，但风险巨大。

    主要风险：

    - 隐私泄露：这是最严重的风险。如果模型在训练后能记忆并复述用户的个人身份信息（PII），将直接触犯数据保护法规（如GDPR），并导致严重的信任危机。

    - 数据滥用与偏见：个性化数据可能包含敏感属性（如宗教、政治倾向、健康状况），不加处理地用于训练，可能导致模型输出歧视性或冒犯性内容。

    - 模型“被劫持”：攻击者可能通过注入恶意个性化信息（prompt injection）来操纵模型行为。

    - 灾难性遗忘与过拟合：过度拟合于某个用户的个性化数据，会导致模型丧失通用能力，并且难以扩展到其他用户。

    应对措施：

    - 差分隐私（DP）训练：在微调时采用DP-SGD，在梯度中添加噪声，从数学上保证模型不会泄露单个用户的信息。

    - 联邦学习：用户的个性化数据不出本地，仅上传模型梯度（或LoRA适配器）到云端聚合，实现“数据不动模型动”。

    - 严格的PII脱敏：在数据进入训练集之前，通过自动化工具和人工审核，彻底移除或替换所有个人标识符。

    - 用户同意与透明：明确告知用户并征得同意，只采集必要信息，并允许用户随时查看和删除自己的数据。

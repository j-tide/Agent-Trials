content:
  prompt: 在微调中应用“reinforcement learning from execution feedback”（RLEF）是什么？
answer:
  mode: rubric
  reference_answer: |-
    RLEF（来自执行反馈的强化学习） 是一种将代码、数学等可执行任务的执行结果作为反馈信号，来微调语言模型的技术。

    核心思想：对于代码、数学等有确定答案或可通过编译器/解释器验证的任务，奖励信号不是来自人类偏好或AI评判，而是来自客观的执行结果。这是一个极强的、无偏的奖励信号。

    微调流程：

    - 问题与模型生成：对于编程问题，SFT模型生成代码；对于数学题，模型生成解题过程并给出答案。

    - 执行与验证：

    - 强化学习训练：使用这个“执行反馈”作为奖励信号，应用PPO或类似的强化学习算法来微调模型。模型为了最大化期望奖励（即写出能跑通的代码或算出正确结果），会不断学习如何生成更高质量、更正确的代码或推理链。

    - 迭代：训练出的新模型能解决更难的问题，生成新的代码/答案，再次获得执行反馈，持续提升。

    优势：奖励信号客观、无偏、可自动化大规模获取。它能引导模型去追求真正可执行的、正确的解决方案，而不仅仅是“看起来正确”。


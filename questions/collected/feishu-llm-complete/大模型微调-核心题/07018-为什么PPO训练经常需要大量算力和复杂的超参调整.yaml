content:
  prompt: 为什么PPO训练经常需要大量算力和复杂的超参调整？
answer:
  mode: rubric
  reference_answer: |-
    算力需求：

    - 多模型驻留：PPO训练需要同时将策略模型、参考模型、奖励模型、价值模型四个大模型加载在显存中。即使使用ZeRO等分片技术，总显存开销依然是天文数字。

    - 在线生成：PPO是on-policy算法。每一步优化都需要用当前的策略模型重新生成一批完整的回答。大模型的自回归生成速度本就较慢，这相当于在训练循环中嵌入了一个昂贵的“推理”过程。生成时间和训练时间相加，导致整体吞吐量远低于单纯的SFT。

    - 价值模型训练：价值模型需要额外的计算来更新其参数。

    超参复杂性：

    - 多目标平衡：PPO的损失函数是多个项的加权组合：最大化裁剪后的策略奖励、最小化价值估计误差、最大化策略熵（探索）。每一项都有自己的权重，需要精细调整。

    - KL约束的间接性：KL惩罚系数 β 的选择是艺术。太大会导致模型拒绝学习，太小则导致奖励破解。通常需要在训练过程中动态监控和调整。

    - On-policy的学习动态：策略在不断变化，生成的数据分布也在变化。这导致优化目标是非平稳的，超参数的最优区间可能随时间漂移。

    - GAE的参数：γ 和 λ 的选择对优势估计有显著影响，进一步增加了调参空间。

    - 缺乏成熟的自动调参工具：相对于SFT，RLHF的自动超参优化工具较少，主要依赖专家经验和反复试错。

    正是因为以上原因，直接使用PPO进行RLHF被认为是“炼丹”的高级阶段。这也是DPO等更简洁的对齐方法广受欢迎的重要原因。


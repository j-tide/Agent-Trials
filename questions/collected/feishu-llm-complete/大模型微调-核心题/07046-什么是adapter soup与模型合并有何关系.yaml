content:
  prompt: 什么是“adapter soup”？与模型合并有何关系？
answer:
  mode: rubric
  reference_answer: |-
    Adapter Soup（适配器汤） 是一种将多个独立训练的PEFT适配器（如LoRA）进行加权平均融合，以创建一个具备复合能力的新适配器的技术。它是模型合并（Model Merging）思想在PEFT领域的直接应用和延伸。

    实现方法：

    - 分别训练多个LoRA适配器，例如专门针对代码、数学、安全、翻译等能力。

    - 对这些适配器的权重进行简单的线性加权平均：W_merged = Σ w_i * W_i，其中w_i是各适配器的权重。

    - 合并后的适配器可以直接加载到基座模型上，无需任何额外训练，即可让模型同时具备多种能力。

    与模型合并的关系：

    - 本质一致：Adapter Soup本质上就是对模型的部分参数（适配器）进行合并，属于模型合并技术的一种特化应用。

    - 技术通用性：任何模型合并技术（如TIES、DARE）都可用于合并适配器。例如，可以先用DARE随机丢弃大部分适配器参数，再进行合并，以消除冗余和参数冲突。

    - 优势互补：相比合并整个大模型（需要TB级存储和大量GPU算力），Adapter Soup只需操作几兆到几十兆的适配器文件，成本极低，速度极快，非常适合快速实验、能力组合和个性化部署。它无需访问原始模型权重，只需在不同任务上微调的适配器即可。

    应用场景：快速构建一个既能写代码，又能用中文解释代码，同时还能拒绝恶意代码请求的个性化编程助手。


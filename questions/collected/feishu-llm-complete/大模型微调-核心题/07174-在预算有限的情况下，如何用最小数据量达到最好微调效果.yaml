content:
  prompt: 在预算有限的情况下，如何用最小数据量达到最好微调效果？
answer:
  mode: rubric
  reference_answer: |-
    预算受限时，需要将每一分钱都花在刀刃上，策略如下：

    - 精选种子数据（人工最核心投入）：将80%的预算投入到构造一个极小但绝对高质量的“黄金种子集”上（如500-2000条）。这些数据必须由领域专家亲自撰写，覆盖所有核心任务类型、各种边界案例和安全示范。这是模型能力的基因。

    - 强模型蒸馏与数据增强（性价比最高）：利用GPT-4等强模型，以种子数据为Few-shot，批量生成更多样化的指令和回答。使用拒绝采样、Evol-Instruct、回译等方法，在保证质量的前提下，将数据集扩展到1万-3万条。

    - 使用PEFT（LoRA）进行微调：参数高效微调能极大降低训练算力需求，且具有天然正则化，能在较少数据上获得更好的泛化性，几乎不损失预训练能力。

    - 严格的数据过滤与清洗：将省下来的算力用于更精细的数据过滤。使用基于困惑度、规则、安全分类器的多级管道，确保最终进入训练的每一条数据都是“精品”。

    - 课程学习与早停：先使用通用性强的数据，再使用领域专精数据。在训练时严格监控验证集，一旦性能饱和立刻停止，避免过拟合。

    - 利用开源数据集作为基底：使用经过筛选的开源通用指令数据（如Alpaca-Cleaned）作为多样性补充，但人工标注数据必须作为核心且赋予更高采样权重。

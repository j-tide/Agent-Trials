content:
  prompt: 使用多模态大模型进行医学影像分析微调，需要注意什么？
answer:
  mode: rubric
  reference_answer: |-
    医学影像微调是高风险、高专业壁垒的领域，必须极度严谨。

    核心注意事项：

    - 数据隐私与合规（HIPAA/GDPR）：必须对医学影像进行彻底的去隐私化处理，移除所有患者身份信息（如姓名、ID）。最好使用已公开的合规数据集或在严格受控的私有环境中进行训练。

    - 专业知识的准确性：必须由放射科医生或相关医学专家参与数据标注和模型评估。任何回答中的事实错误都可能造成严重后果。SFT 数据中应包含专家写的详细且准确的报告。

    - 不确定性表达：必须在数据中大量训练模型在不确定时诚实地说“无法确定”或“建议进行X光确认”，并附上免责声明，强调其辅助性角色，绝不能替代医生诊断。

    - 多模态数据融合：除了影像，还应融合电子健康记录（EHR）文本、病人主诉、检验报告等，进行多源信息综合推理。SFT 数据需包含这类多模态融合的指令。

    - 领域标准化与报告格式：回答应遵循医学报告的结构化格式（如“检查所见”、“诊断意见”），使用规范的医学术语。

    - 图像预处理与窗宽窗位：对于 CT 等 DICOM 影像，需要正确处理窗宽窗位调整，以突出不同组织。数据中应包含不同窗宽窗位下的影像及其对应的解读。

    - 类别不均衡与长尾问题：罕见病的数据极度稀缺，需通过数据增强、合成数据或专门的采样策略来缓解，但必须保证医学有效性。


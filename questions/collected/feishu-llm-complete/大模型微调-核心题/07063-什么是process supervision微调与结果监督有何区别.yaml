content:
  prompt: 什么是“process supervision”微调？与结果监督有何区别？
answer:
  mode: rubric
  reference_answer: |-
    过程监督（Process Supervision） 和 结果监督（Outcome Supervision） 是指导模型进行复杂推理时的两种不同反馈机制，尤其在数学、逻辑和代码领域。

    [嵌入表格未展开]

    微调中的应用：过程监督微调要求SFT数据中不仅包含最终答案，还必须包含完整的、被逐行标注了正确性的思维链。或者，使用PRM在RLHF中对每个推理步骤提供奖励，引导模型进行“深思熟虑”的探索。


content:
  prompt: MMBench、SEED-Bench等评测主要考察什么能力？
answer:
  mode: rubric
  reference_answer: |-
    这些基准旨在系统性地量化多模态大模型的通用视觉理解与推理能力，评估维度往往超过数十项，远超简单的图像描述或视觉问答。

    MMBench (Multi-Modal Benchmark)

    - 整体设计：包含约 3000 道多选题，覆盖 20 个能力维度，每个维度又细分出多个子任务。所有题目均由人类标注，答案唯一且干扰项经过精心设计。

    - 核心考察能力：

    - 评估方式：计算各维度及总体的准确率，并生成详细的雷达图，直观展示模型的长短板。MMBench-Dev 是公开测试集，MMBench-Test 则为盲测排行榜。

    SEED-Bench

    - 整体设计：包含约 1.9 万道多选题，分为 12 个评估维度，涵盖图像和视频两大部分。所有题目均由人类专家基于真实图像和视频精细标注。

    - 核心考察能力：

    - 突出特点：特别强调细粒度识别和动态场景下的推理，要求模型能从细微的视觉线索中得出正确结论。

    共同考察的关键能力：两者都深入考察模型的视觉基础能力、常识推理、泛化能力，以及对复杂干扰的抵抗能力。它们不仅要求模型“看见”，更要求模型“看懂”和“想通”。


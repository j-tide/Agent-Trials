content:
  prompt: 如何评估微调后模型的事实准确性？有哪些数据集或方法？
answer:
  mode: rubric
  reference_answer: |-
    事实准确性是衡量模型是否“胡编乱造”的关键指标。评估方法可以分为基于参考文本和基于外部知识两类。

    常用数据集：

    - Natural Questions / TriviaQA：基于维基百科的封闭域问答数据集，用于评估模型对常见事实的记忆和检索能力。

    - FEVER：事实验证数据集，要求模型判断一个陈述是“支持”、“反驳”还是“信息不足”。

    - HaluEval：专门用于评估幻觉的数据集，包含大量模型容易产生幻觉的诱导性问题。

    - FreshQA：评估模型对时效性知识的掌握，问题涉及近期事件。

    评估方法：

    - 基于外部知识的自动校验：将模型的回答拆解为原子事实陈述，通过搜索引擎API或知识图谱（如Wikidata）进行逐一比对，判断是否与权威来源一致。

    - 基于NLI（自然语言推理）的校验：使用NLI模型判断模型回答中的陈述是否能从可靠的知识源（如给定的维基百科段落）中推理得出。

    - GPT-4-as-Judge：让GPT-4扮演一个严格的事实审查员，对回答中的事实性断言进行逐条验证，并给出可靠性评分。

    - 人工评估：对于高风险领域（如医疗、法律），由领域专家对回答的事实准确性进行终极审核。

    实践建议：通常采用“自动化初筛 + 人工抽检”的混合管道。自动化方法（如搜索验证、NLI）用于大规模快速扫描，发现可疑样本；然后对高风险样本进行人工终审。


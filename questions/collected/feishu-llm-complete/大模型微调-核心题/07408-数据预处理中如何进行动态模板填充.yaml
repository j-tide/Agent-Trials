content:
  prompt: 数据预处理中如何进行动态模板填充？
answer:
  mode: rubric
  reference_answer: |-
    动态模板填充是指在训练数据被送入模型前，根据预设的规则实时地将指令、回答等字段组装成最终的文本序列，而不是在数据预处理阶段就写死为单一格式。这为实验不同的对话模板、注入不同的system prompt或进行数据增强提供了极大的灵活性。

    实现方法：

    - 使用Jinja2模板引擎：定义ChatML、Alpaca等多种模板文件。在数据集加载时，每一行数据都包含原始字段（如instruction, output, system_prompt）。通过Jinja2渲染，将这些字段填入当前选定的模板，生成最终的字符串序列。

    - 函数式组装：编写简单的Python函数，接收数据样本作为输入，根据一个配置参数（如template_type="chatml"）返回格式化后的文本。

    - 与Data Collator结合：在Data Collator中完成模板填充和tokenization。这样，模板的变更无需重新预处理整个数据集，只需修改配置，极大提升了实验效率。

    优势：

    - 快速实验：可以轻松切换模板，评估不同模板对模型效果的影响。

    - 支持动态注入：可以在训练时根据样本来源、任务类型动态注入不同的system prompt，实现条件化训练。

    - 数据增强：对同一条原始数据，可以用不同的措辞模板渲染出多个变体，增加数据多样性。

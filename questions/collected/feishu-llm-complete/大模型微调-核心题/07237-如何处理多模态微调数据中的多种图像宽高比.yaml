content:
  prompt: 如何处理多模态微调数据中的多种图像宽高比？
answer:
  mode: rubric
  reference_answer: |-
    处理多种宽高比的核心是在不丢失关键信息和不过度形变的前提下，将图像转化为模型可接受的输入。主要策略有：

    - 保持宽高比缩放+填充：将长边缩放到目标尺寸，保持宽高比，短边用纯色填充。简单但会引入无效的填充区域，浪费算力。

    - 中心裁剪：缩放后从中心裁剪出固定尺寸。简单但可能丢失图像边缘的重要信息。

    - 动态分块（AnyRes）：这是当前最优方案。根据图像宽高比，动态决定将其切分成多少个符合视觉编码器输入尺寸的分块。例如，一张宽图可能被切成 2×1 或 3×1 的网格。同时会保留一张全局缩略图。所有分块和缩略图分别编码后，其特征被拼接为一个长序列输入 LLM。该方案既能保留高分辨率细节，又能提供全局视野，且不浪费算力。

    - 自适应位置编码：为每个图像 patch 赋予其在原始图像中的 2D 坐标（如 2D-RoPE），让模型在特征层面感知到 patch 的相对位置，即使被分块处理也能理解空间关系。

    实践中，动态分块结合自适应位置编码已成为处理任意宽高比图像的标准技术。


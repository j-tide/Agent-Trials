content:
  prompt: 如何监控分布式微调中的GPU利用率、显存、通信带宽？
answer:
  mode: rubric
  reference_answer: |-
    GPU利用率与显存监控：

    - 命令行工具：nvidia-smi实时查看，nvidia-smi dmon -s pucm持续监控GPU利用率、显存、时钟、温度等。更友好的有nvtop（交互式）。

    - 编程方式：在训练脚本中周期打印torch.cuda.memory_allocated()和torch.cuda.utilization()（需要pynvml库）。

    - 仪表盘：部署NVIDIA DCGM Exporter + Prometheus + Grafana，可收集所有节点的GPU指标并形成可视化面板。这是工业级方案，可以设置告警。

    通信带宽监控：

    - NCCL环境变量：设置NCCL_DEBUG=INFO可以在日志中看到通信算法、带宽等信息。

    - NVIDIA Nsight Systems：可以捕获详细的CUDA API调用、NCCL通信事件，分析通信延迟和带宽。

    - nvidia-smi nvlink -e 0 或 nvidia-smi nvlink -g 0：查看NVLink带宽和错误计数。

    - dcgmi dmon：监控NVLink和PCIe带宽。

    - DeepSpeed的wall_clock_breakdown：开启后会在日志中输出计算、通信、数据加载的时间占比，直观定位瓶颈。

    综合分析：若GPU利用率低（<60%）且通信时间占比高，说明通信瓶颈；若利用率低但CPU负载高，则数据加载瓶颈。通过profiling工具（PyTorch Profiler，Nsight）可以精确定位。


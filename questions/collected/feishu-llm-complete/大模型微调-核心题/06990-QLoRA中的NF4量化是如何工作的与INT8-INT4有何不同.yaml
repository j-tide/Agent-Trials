content:
  prompt: QLoRA中的NF4量化是如何工作的？与INT8/INT4有何不同？
answer:
  mode: rubric
  reference_answer: |-
    NF4（4-bit NormalFloat） 是QLoRA专门为神经网络权重量身定制的一种4-bit量化数据类型。它的核心思想是：权重通常服从正态分布，因此我们可以利用这一先验，将量化等级的间距设计为非均匀的，使得信息保留最大化。

    NF4的工作步骤：

    [图片内容未导入]

    - 量化等级值的选取：对于每个区间，我们选择能最小化该区间内期望量化误差的值作为量化等级。理论上，这个最优值就是该区间的条件期望。这样我们得到16个特定的浮点数值 q1,q2,...,q16，它们就是NF4的量化等级。由于正态分布在中心区域概率密度高，这些等级值在靠近0的地方非常密集，而在远离0的尾部则很稀疏。

    - 分块量化：在实际应用中，一个权重矩阵通常不是全局归一化的。因此，NF4采用分块量化（Block-wise Quantization）。将权重矩阵按固定大小（例如每64个元素）分成小块，每个块独立计算一个缩放因子（FP32），将该块内的权重值归一化到 [−1,1] 区间，然后再映射到最近的NF4等级值。最终存储的是每个权重对应的4-bit索引，以及每个块的缩放因子。


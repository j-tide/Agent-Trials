answer:
  mode: rubric
  reference_answer: |-
    ```python
    from typing import List, Tuple

    def get_ngrams(text: str, n: int = 13) -> set:
        """返回文本的n-gram集合（字符级）"""
        text = text.lower()
        return set(text[i:i+n] for i in range(len(text) - n + 1))

    def detect_contamination(train_samples: List[str], eval_samples: List[str], n: int = 13, threshold: float = 0.6) -> List[Tuple[int, int, float]]:
        """
        检查每个训练样本与评测样本的最大n-gram重叠率。
        返回可疑污染列表，包含 (train_idx, eval_idx, overlap_ratio)。
        """
        eval_ngrams = [get_ngrams(s, n) for s in eval_samples]
        suspicious = []
        for i, train_text in enumerate(train_samples):
            train_ngrams = get_ngrams(train_text, n)
            if not train_ngrams:
                continue
            for j, e_ng in enumerate(eval_ngrams):
                overlap = train_ngrams & e_ng
                ratio = len(overlap) / len(train_ngrams)
                if ratio >= threshold:
                    suspicious.append((i, j, ratio))
        return suspicious
    ```

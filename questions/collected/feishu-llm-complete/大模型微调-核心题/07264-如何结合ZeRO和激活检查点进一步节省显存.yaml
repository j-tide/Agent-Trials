content:
  prompt: 如何结合ZeRO和激活检查点进一步节省显存？
answer:
  mode: rubric
  reference_answer: |-
    ZeRO分片模型状态（权重、梯度、优化器），激活检查点压缩中间激活。两者作用在显存的不同部分，正交且可叠加，是当前大模型微调中节省显存的最强组合。

    结合方式：

    - 启用ZeRO‑2/3：分片优化器、梯度和参数，大幅降低模型状态的单卡占用。

    - 同时启用激活检查点：对Transformer Block进行逐层检查点，减少激活占用。

    - 搭配Flash Attention：进一步消除注意力矩阵的显存消耗。

    - 调整配置：

    效果：

    例如微调一个7B模型，单卡24 GB显存。不开任何优化时完全无法运行。开启ZeRO‑3后，模型状态显存降至几GB，但激活仍可能占十几GB。再开启激活检查点，激活可压到几GB，最终总显存降至10 GB左右，使得单卡训练成为可能。

    代价：重计算带来的额外计算时间，加上ZeRO‑3的额外通信，训练吞吐会有所下降。但通过放大batch size或序列长度带来的模型质量提升，通常足以弥补速度损失。在实践中，这是实现大模型微调的标配方案。


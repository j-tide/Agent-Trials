content:
  prompt: 数据偏见在微调数据中如何体现？如何检测和缓解？
answer:
  mode: rubric
  reference_answer: |-
    微调数据中的偏见，是指数据在性别、种族、地域、年龄、职业、文化等维度上，系统性地包含刻板印象、歧视性言论、不均衡的代表性或排他性语言。这会导致模型在处理相关问题时输出有害、不公的内容。

    体现形式：

    - 刻板印象：例如，“护士”总是被描述为女性，“CEO”总是被描述为男性，亚洲人总是数学好。

    - 排他性语言：默认用户为某一性别或文化（如只用“他”作为默认代词，或所有节日问候都基于西方节日）。

    - 价值判断偏差：对某种生活方式或群体进行隐性的贬低或负面评价。

    - 过代表与欠代表：某些群体在数据中作为正面主角出现的频率远高于或远低于其在真实世界中的分布。

    检测方法：

    - 构建多维度的偏见测试集：主动构造含有敏感属性的对抗性或反事实测试用例。例如，更改一句话中的性别代词，观察模型回答是否有系统性的差异。

    - 基于关键词和模板的扫描：使用正则表达式或专家定义的模式，扫描数据中是否存在已知的歧视性词汇或偏见表述。

    - 使用偏见检测工具和分类器：利用HONEST、StereoSet等学术基准，或微调专门的偏见分类器，对微调数据集进行批量打分，识别偏见严重的高风险区域。

    - 强模型审查：让GPT-4等模型根据多元、公平、包容的原则，对抽样数据进行审查，发现隐性的偏见。

    - 分布分析：使用NER（命名实体识别）和情感分析工具，统计不同人口属性（如性别、种族相关词）在数据中关联的情感倾向和出现频率，看是否存在严重失衡。

    缓解方法：

    - 反事实数据增强：对检测到的偏见样本，构造其反事实版本加入训练集。例如，将“他是一位优秀的护士”改写为“她是一位优秀的护士”，或将“女司机停车差”这类有害样本直接移除。

    - 平衡性补充：针对数据库中严重欠代表的群体或话题，主动构造正面的、中立的、多元化的数据样本进行补充。

    - 指令引导：在system prompt中明确加入“请注意避免任何性别、种族、年龄等偏见”的准则，并确保训练数据中有遵循该准则的正面示范。

    - 过滤与改写：对于包含严重偏见的样本，直接删除或用强模型重写为中立、客观的表述。这是最直接有效的方法。

    - 多元团队审查：从数据标注、审核到最终质检，确保团队成员具有多元化的背景，能多视角发现潜在的偏见。

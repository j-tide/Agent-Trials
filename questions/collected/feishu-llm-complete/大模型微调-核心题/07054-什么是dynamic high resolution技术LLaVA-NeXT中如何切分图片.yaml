content:
  prompt: 什么是“dynamic high resolution”技术？LLaVA-NeXT中如何切分图片？
answer:
  mode: rubric
  reference_answer: |-
    动态高分辨率（Dynamic High Resolution） 是一种在保持原始图像宽高比的同时，让多模态大模型能够处理任意分辨率图像的技术。它的核心思想是：不再将所有图片暴力缩放（Resize）到一个固定的小尺寸，因为这会导致图像变形或丢失细节；而是根据图片的原始大小，动态地将其切分为若干个符合视觉编码器标准输入尺寸的分块（patches），让模型能够以“原生分辨率”理解图像细节。

    LLaVA-NeXT（LLaVA-1.6）的图片切分流程：

    - 确定切分网格：LLaVA-NeXT会根据图像原始分辨率，计算出一个最优的切分网格（如2×2、3×2等）。计算原则是在不超过预设总分块数上限的前提下，选择最能匹配原始宽高比的网格。


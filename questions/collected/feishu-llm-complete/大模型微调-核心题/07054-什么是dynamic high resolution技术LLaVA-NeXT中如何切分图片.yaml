    优势：

    - 保留原始宽高比：避免了因强制缩放导致的物体形变。

    - 捕获高分辨率细节：能清晰识别图像中的小物体、文字和精细纹理。

    - 灵活性与效率：输入LLM的token数量会随图像分辨率动态变化，但通过控制最大分块数，可以有效控制计算成本的上限。


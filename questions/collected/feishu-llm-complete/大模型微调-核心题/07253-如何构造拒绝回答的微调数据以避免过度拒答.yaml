content:
  prompt: 如何构造“拒绝回答”的微调数据以避免过度拒答？
answer:
  mode: rubric
  reference_answer: |-
    构造拒绝数据的目标是让模型学会“有原则、有温度、有建设性”地拒绝，而不是成为一个生硬的“拒绝机器”。过度拒答的根源在于数据中充满了大量生硬、单一的拒绝模板，且比例过高。

    避免过度拒答的数据构造策略：

    - 将“拒绝”升级为“安全引导”
    用“拒绝 + 理由 + 建设性替代方案”的三段式结构来取代简单的“抱歉，我不能”。

    - 丰富拒绝的语言风格
    拒绝也可以有个性。数据集中的拒绝回复应包含不同风格：有的坚定直接，有的温和关切，有的会引导用户提出合规的请求。这能防止模型只会说一种“抱歉”的模板。

    - 加入“被纠正后恢复”的对话链
    刻意构造模型过度拒答，然后被用户纠正的场景。

    - 严格控制拒绝数据的比例
    拒绝数据（尤其是“一刀切”式拒绝）的占比应控制在总SFT数据的3%~5%以内。用大量的、正常的有用性数据去稀释它，确保模型的主流行为是“乐于助人”，而“拒绝”只是在特定场景下的特殊行为。

    - 用“澄清式反问”替代部分直接拒绝
    对于模糊请求，训练模型优先采用反问澄清，而不是直接拒绝。例如，面对“麻醉剂有哪些”的提问，模型可以反问：“你是在进行医学研究吗？我可以提供学术性信息。”这给了良性用户一个解释的机会，避免误伤。

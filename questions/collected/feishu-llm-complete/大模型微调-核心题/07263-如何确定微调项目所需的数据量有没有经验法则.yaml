content:
  prompt: 如何确定微调项目所需的数据量？有没有经验法则？
answer:
  mode: rubric
  reference_answer: |-
    确定微调所需的数据量是一个多因素权衡的过程，存在一些经验法则，但绝无一刀切的答案。

    核心影响因素：

    - 基座模型的能力：预训练模型越大、越强，对SFT数据的利用效率越高，所需数据量反而可能更少。LIMA实验证明，1000条高质量数据能让65B模型展现出强大的指令遵循能力。对于小模型（<3B），则需要更多的数据来补偿其预训练知识的不足。

    - 任务的复杂度和新颖性：如果只是简单的格式遵循或风格迁移，几千条可能足够；如果需要注入全新的专业知识或复杂推理能力（如高等数学、代码调试），则需要数万甚至数十万条数据，并且数据需要包含详细的思维链推导过程。

    - 数据的质量和多样性：如果每一条数据都精心构造，覆盖了足够多的任务类型和语言表达，则总量需求会大大降低。反之，如果数据噪声大、同质化严重，则需要更大的量来“淹没”噪声。

    - 微调方法：全参数微调由于会大幅修改参数，更容易过拟合，因此对数据量的要求更苛刻；而LoRA等PEFT方法由于其极强的正则化，能在更少的数据上获得更好的泛化性。

    经验法则：

    - 快速原型与概念验证：几百到几千条高质量、高多样性的数据，通常足以让7B以上的模型展现出明显的指令遵循能力。

    - 通用对话助手：通常需要1万到5万条覆盖多任务、多轮对话的数据。

    - 复杂推理或垂直领域专家：往往需要5万到20万条以上，其中包含大量的思维链（CoT）数据。

    - 数据量边际效应递减点：当数据量增加到一定程度，模型在核心能力上的提升会显著放缓。可以通过绘制“数据量-性能”曲线来寻找这个点，从而避免无效投入。

    最科学的方法是进行小规模实验：用1K、5K、10K等不同量级的数据分别快速微调，评估各能力维度的变化，观察性能增益曲线，找到性价比最高的数据量投入点。

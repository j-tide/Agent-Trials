  reference_answer: |-
    - 阶段一（对齐）：使用大量“图像-简短标题”对，冻结视觉编码器和LLM，只训练线性投影层。这一阶段让LLM初步“看见”并描述图像。

    - 阶段二（指令微调）：使用多样化的“多模态指令-回答”对，冻结视觉编码器，但解冻投影层和LLM进行联合训练。这一阶段赋予了模型视觉指令遵循和多轮对话的能力。


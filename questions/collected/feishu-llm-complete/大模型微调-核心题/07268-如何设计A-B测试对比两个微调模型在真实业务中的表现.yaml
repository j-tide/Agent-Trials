content:
  prompt: 如何设计A/B测试对比两个微调模型在真实业务中的表现？
answer:
  mode: rubric
  reference_answer: |-
    A/B测试是决定两个微调模型孰优孰劣的终极手段，它通过在线上真实环境中收集用户反馈，得出最客观的结论。

    设计步骤：

    - 确定核心业务指标：明确用什么来衡量模型的“好”。常见指标包括：用户满意度（点赞率、点踩率、举报率）、任务成功率（对话中用户问题是否被解决）、回复效率（平均交互轮次）、商业转化率（如推荐商品点击率）。

    - 划分流量：在API网关或负载均衡层，将线上流量按一定比例（如5%或50%）随机路由到微调模型A（实验组）和旧模型B（对照组）。确保分流逻辑与用户属性无关，是纯随机的。

    - 部署与灰度：将两个模型分别部署为独立的服务实例。通常先在1%~5%的小流量下进行测试，观察各项指标，确认无严重问题后再逐步放量。

    - 数据收集与统计决策：在收集到足够的样本量后（每组至少数千次有效交互），对核心业务指标进行严格的统计显著性检验（如T检验或卡方检验）。计算置信区间，判断实验组是否在统计意义上显著优于对照组。

    - 做出决策：如果微调模型在核心指标上显著优于旧模型，且没有显著劣化的指标，则可以将全部流量切到新模型。反之，则回滚。

    关键原则：一次只改变一个变量（即模型），以确保观察到的效果是由模型差异引起的。同时，需要运行足够长的时间，排除周期性波动的影响。


answer:
  mode: rubric
  reference_answer: |-
    ```python
    def apply_rotary_emb(x: torch.Tensor, cos: torch.Tensor, sin: torch.Tensor) -> torch.Tensor:
        """
        对输入 x 应用旋转位置编码。x 形状为 (..., seq_len, dim)
        cos, sin 形状为 (seq_len, dim//2) 或 (..., seq_len, dim//2)
        """
        # 将 x 按最后一维分成两半，分别进行旋转
        dim = x.shape[-1]
        x1, x2 = x[..., :dim//2], x[..., dim//2:]
        cos = cos.unsqueeze(-2)  # 便于广播
        sin = sin.unsqueeze(-2)
        rotated = torch.cat([x1 * cos - x2 * sin, x1 * sin + x2 * cos], dim=-1)
        return rotated

    def precompute_rotary_embeddings(seq_len: int, dim: int, theta: float = 10000.0):
        """预计算 cos 和 sin 表"""
        freqs = 1.0 / (theta ** (torch.arange(0, dim, 2, dtype=torch.float32) / dim))  # (dim/2,)
        t = torch.arange(seq_len, dtype=torch.float32)
        freqs = torch.outer(t, freqs)  # (seq_len, dim/2)
        cos = torch.cos(freqs)
        sin = torch.sin(freqs)
        return cos, sin
    ```

content:
  prompt: RLHF训练中常见的稳定性问题有哪些？如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    RLHF（特别是PPO阶段）的训练稳定性是一个巨大的挑战。常见问题包括：

    - 策略崩溃（Policy Collapse）

    - 表现：模型输出突然变得重复（如不断重复一个词）、无意义、或者完全丧失语法，且无法恢复。

    - 原因：PPO更新的步长过大，策略跳出了KL约束的有效范围，进入了奖励模型无法理解或给出极端分数的参数区域。

    - 缓解：

    - 奖励模型过优化与奖励破解（Reward Hacking）

    - 表现：PPO训练中奖励持续上升，但实际人工评估的回复质量停滞甚至下降。模型生成内容变得怪异或模板化。

    - 原因：策略模型找到了奖励模型的漏洞，而非真正提升回答质量。

    - 缓解：

    - 价值模型估计不准

    - 表现：优势函数计算出的值波动巨大，策略梯度方向不稳定，训练收敛缓慢。

    - 原因：价值模型本身训练不充分，或者环境（策略模型）变化太快，导致价值模型跟不上。

    - 缓解：

    - 超参数敏感性

    - 表现：训练效果对学习率、KL系数、裁剪范围等超参数极其敏感，稍有不慎就会训练失败。

    - 原因：PPO本身涉及多个损失项（策略损失、价值损失、熵奖励等）的平衡。

    - 缓解：


content:
  prompt: 解释“SPIN”（Self-Play Fine-Tuning）如何与SFT结合。
answer:
  mode: rubric
  reference_answer: |-
    SPIN（Self‑Play Fine‑Tuning） 是一种让模型通过“左右互搏”来突破静态 SFT 数据质量上限的训练范式。它不需要额外的人工标注或更强大的教师模型，而是巧妙地将上一轮的模型自身作为“反派”，生成与 SFT 数据对比的负样本，从而驱动模型不断自我进化。

    SPIN 与 SFT 结合的核心流程：

    [图片内容未导入]

    [图片内容未导入]

    SPIN 如何与 SFT 结合：

    - SFT 是 SPIN 的基石和起点。没有 SFT，初始模型连基本的指令遵循能力都没有，生成的负样本毫无意义，SPIN 根本无法启动。

    - SPIN 可以看作是在 SFT 之上的无监督持续微调。它打破了传统 SFT 受限于静态数据质量的天花板，让模型能够“站在自己的肩膀上”不断进步。它不需要任何额外的人工标注或外部奖励模型，因此成本极低。

    - 从数学上看，SPIN 的全局最优解与 RLHF 的目标一致，因此它提供了一种用“类 SFT”的简单、稳定方式，去近似实现强化学习效果的新范式。

    ✅ 总结：SPIN 将 SFT 从一个“学习固定答案”的过程，升级为一个“挑战旧我、超越自我”的动态进化过程。它是 SFT 数据飞轮的高级形态，实现了模型在不依赖外部反馈下的自我提升。

    - 格式错误过滤（如回答不符合分类标签要求）；

    - 困惑度过滤（PPL 过高或过低都可能质量差）；

    - 安全与内容过滤（去除有害、偏见、隐私内容）；

    - 去重（与已有数据语义相似度过滤）。
    通过过滤的样本被加入任务池。

    - 将每条指令或回复表示为其n-gram（通常1-gram到3-gram混合）的集合。

    - 计算每条文本的MinHash签名（通常128或256维）。

    - 将签名分割成多个band，使用LSH分桶。只有在至少一个band中完全相同的文本对才被认为是候选相似对。

    - 对候选对计算精确相似度，超过阈值（如0.8）的标记为近似重复，只保留一条。

    - 将文本表示为TF-IDF等加权特征向量。

    - 计算每条文本的SimHash签名。

    - 对于每条文本，查找与其汉明距离在阈值内（如≤3）的所有其他文本作为候选。

    - 对候选对计算精确文本相似度，确认后去重。

    - 高重要、低水平：最高优先级，需分配最大数据比例（如代码能力对编程助手）。

    - 高重要、高水平：需维持性数据，分配中等比例以防遗忘。

    - 低重要、低水平：选择性投入，资源有限可暂时放弃。

    - 低重要、高水平：只需极少量数据，甚至可以不分配。

    - 指令复杂度：简单单任务指令 → 多约束指令 → 需要多步推理的复杂指令。

    - 回复长度：短回复 → 中等回复 → 长回复（训练模型控制详细程度）。

    - 推理步数：0-1步 → 2-4步 → 5步以上（用于数学/逻辑微调）。

    - 知识稀有度：高频常识 → 专业知识 → 长尾深度知识。

    - 对话轮次：单轮 → 3-5轮 → 超长多轮对话。

    - 阶段一（占总步数20%）：100% Easy数据，快速建立基本指令遵循和对话格式。

    - 阶段二（占60%）：Easy与Medium混合，比例从70/30逐渐过渡到30/70。

    - 阶段三（占20%）：所有难度混合，Hard占比逐步提升至50%以上。

    层级

    定义

    回应策略

    示例

    红线区

    暴力、违法、自残、儿童安全等明确有害内容

    坚定拒绝 + 解释原因 + 提供安全替代方案

    “我不能提供制作炸弹的教程，这会对他人造成严重伤害。如果你对化学实验感兴趣，我可以推荐一些安全且教育性的实验。”

    灰区

    医疗、法律、投资建议等需要资质的领域；意图模糊可能被滥用的问题

    建设性回应 + 附加强烈免责声明 + 请求澄清

    “我理解你想了解如何缓解考试焦虑。这里有一些通用的放松技巧（深呼吸、冥想等）。但如果焦虑严重，强烈建议你寻求专业心理咨询。”

    绿区

    正常的、无害的请求，即使涉及敏感词汇（如性教育、历史暴力事件讨论）

    正常、客观、有教育意义的回答

    用户：“请给我解释一下二战中的诺曼底登陆。” 助手应正常回答，而不因“战争”一词而拒答。

    可能原因

    具体表现

    机理

    数据中长回复占比过高

    训练集中70%以上的回复都超过300 tokens，简洁回复稀缺。

    模型将“长回复”与“正确格式”强关联，倾向于输出长篇大论。

    标注者偏好

    人类标注者潜意识认为“详细”就是“高质量”，总把简单问题也写得面面俱到。

    数据中哪怕是一句“谢谢”，也配上大段解释，模型学会了“必须多说点”的生存策略。

    缺乏长度控制示范

    数据中缺少“请用少于50字回答”这类带长度约束的指令和对应回答。

    模型没有学会根据用户要求动态调整长度，只会一种模式。

    安全数据过少或不当

    如果安全拒绝样本总是很长，模型在不确定时就倾向于输出长篇大论的拒绝或模棱两可的回复。

    模型将“不确定时的安全行为”与“啰嗦”绑定。

    任务单一

    数据集中绝大部分都是需要详细解释的任务（如知识问答），缺少需要简洁回复的任务（如闲聊、确认）。

    模型丧失了在不同长度间切换的灵活性。

    合成数据的同质性

    用强模型蒸馏数据时，若不控制prompt，教师模型往往生成结构相似、长度相近的回答。

    数据集缺乏长度多样性，模型输出变得模板化。

    指标

    过拟合时的典型表现

    诊断价值

    验证损失

    训练损失持续下降，但验证损失停止下降并开始反弹上升（剪刀差）。

    最经典、最直接的过拟合信号。

    指令改写鲁棒性

    将测试指令用同义词改写后，模型性能大幅下降（例如准确率从80%跌至60%）。

    说明模型学了表面措辞，而非语义理解。

    输出多样性

    对同一开放式问题多次采样，Self‑BLEU飙升，回答几乎一模一样。

    分布坍缩，丧失创造力。

    通用基准得分

    在MMLU、HellaSwag等通用知识基准上的得分显著低于SFT前。

    灾难性遗忘，为学新任务而忘掉旧知识。

    生成质量

    回答变得模板化、客套话增多，对新指令处理混乱。

    反映了泛化能力的丧失。

    训练数据记忆度

    对训练集中的冷门问题稍作改动后，模型仍输出原始答案。

    模型已死记硬背，而非理解。

    参数

    推荐值

    说明

    r（秩）

    8 或 16

    简单任务r=4~8，复杂任务r=16~32。过大边际效益低。

    16 或 32（通常为r的2倍）

    控制适配器影响强度。alpha=2r是经验甜点。

    target_modules

    ["q_proj", "v_proj"]

    仅对Q和V投影应用，参数效率最高。需要更多容量时可加入k_proj, o_proj。

    lora_dropout

    0.05 ~ 0.1

    轻微dropout防止过拟合。数据量少时可提高。

    bias

    "none"

    不训练偏置项。

    学习率

    1e-4 ~ 3e-4（AdamW）

    与全参类似，但LoRA更防过拟合，有时可多训一点。

    训练epoch

    1~3

    lora_alpha

    比全参微调高一个数量级。

    - 在 SFT 数据中混入少量预训练文本（5%~10%），就像在微调过程中不断“复习”旧知识，有效锚定模型的通用能力。

    - 确保 SFT 数据集本身覆盖足够多样的任务类型、语言风格和领域，避免单一模板主导训练。

    - 使用极低的学习率（如 5e-6），减少参数更新的幅度。

    - 严格早停，在验证集损失趋于平缓时立即停止，避免过度训练。

    - 在 RLHF 或 DPO 阶段使用 KL 散度正则化，约束微调后的模型不要偏离原始 SFT 分布太远，这在缓解偏移的同时还能提升对齐质量。

    - 覆盖不同的角色设定（教师、医生、程序员、诗人）

    - 包含不同的行为准则（简洁、详细、正式、幽默、严格安全、适度灵活）

    - 使用不同的措辞和句法（直接命令、委婉请求、条件状语等）
    通过这种训练，模型形成了“元指令 ↔ 行为模式”的映射，从而具备了强大的可控性——在推理时，只需更换系统提示，就能让同一个模型展现出截然不同的能力与人格，而无需重新微调。

    - 模板格式：“### 指令：将以下句子翻译成英文：今天天气真好。 ### 回答：”

    - 自然语言：“帮我用英语说这句话：今天天气真好。”

    - 碎片化口语：“今天天气真好，翻译成英文。”
    分别在 SFT 模型和基座模型上测试，比较它们在两组上的准确率、格式遵循度等指标。如果模型在模板格式上表现优异（如 95%），但在自然语言上跌至 70%，则说明严重过拟合了模板。计算“泛化差距” = 模板得分 - 自然语言得分，差距越大，过拟合越深。

    - 规则过滤器：剔除包含重复短语、过短、格式错误、乱码、命中安全黑名单的回答。

    - 困惑度过滤器：用一个独立的预训练模型计算每个回答的 PPL，剔除 PPL 过高（语言混乱）或过低（无信息量）的样本。

    - 强模型评判器（LLM‑as‑Judge）：这是核心环节。使用 GPT‑4 等顶级模型，按照预设的多维度量规（准确性、有用性、流畅度、安全性等），对剩余候选回答进行打分或排序。为减少位置偏差，通常会对回答进行随机排列并多次评判取平均。

    - 一致性过滤器（可选）：对于有确定答案的任务（如数学、代码），可检查多个生成样本的答案是否自洽。只保留那些答案高度一致且被评判模型评为高分的回答。

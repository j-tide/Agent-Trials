content:
  prompt: 26. 如果SFT后模型输出变得冗长啰嗦，从数据角度可能的原因是什么？
answer:
  mode: rubric
  reference_answer: |-
    SFT后模型变得啰嗦，通常是训练数据在长度分布、风格偏好和信号密度上出现了系统性偏差，导致模型内化了“长=好”的错误认知。

    ✅ 解决方案：

    - 在数据中刻意混入10%~20%的高质量短回复，并搭配长度约束指令。

    - 对回复长度分布进行可视化监控，确保覆盖从极短到长的全谱系。

    - 在RLHF/DPO阶段，对过长回复施加轻微负奖励。


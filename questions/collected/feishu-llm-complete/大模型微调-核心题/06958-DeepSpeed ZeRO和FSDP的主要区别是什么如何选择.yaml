content:
  prompt: DeepSpeed ZeRO和FSDP的主要区别是什么？如何选择？
answer:
  mode: rubric
  reference_answer: |-
    DeepSpeed ZeRO (由 Microsoft 开发) 和 FSDP (Fully Sharded Data Parallel，PyTorch 原生) 都实现了模型状态的完全分片（等同于 ZeRO‑3），其核心思想相同，但在实现、功能和生态上存在差异。

    [嵌入表格未展开]

    如何选择？

    - 如果你的模型规模极大（>100B），或者需要CPU/NVMe offload来进一步节约显存，或者要训练 MoE 模型，DeepSpeed ZeRO 几乎是唯一选择。

    - 如果你追求简洁、稳定、与 PyTorch 生态的高兼容性，且模型规模适中（<70B），FSDP 更易上手，调试也更方便。尤其在与 torch.compile 配合时，FSDP 有时能获得额外的性能提升。

    - 如果团队对 PyTorch 更熟悉，希望尽量减少外部依赖，FSDP 是理想选择；如果已经使用 DeepSpeed 的其他功能（如 Autotuning），ZeRO 的集成性更好。

    实践中，很多团队从 FSDP 开始尝试，若遇到显存瓶颈或需要 offload 时，再迁移到 DeepSpeed ZeRO。两者核心性能差距不大，选择更多取决于团队偏好和特定需求。


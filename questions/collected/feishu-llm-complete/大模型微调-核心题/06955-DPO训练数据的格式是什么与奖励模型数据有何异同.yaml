answer:
  mode: rubric
  reference_answer: |-
    DPO训练数据的格式：

    与奖励模型数据非常相似，都是基于人类偏好的对比数据。具体格式为：

    [图片内容未导入]

    与奖励模型数据的异同：

    - 相同点：两者的数据构造方式完全一致。都需要从指令池中采样，用模型生成多个回答，然后由人类进行排序或两两比较，最终形成偏好对。

    - 不同点：奖励模型需要数据来训练一个外部的评分模型，而DPO直接使用这些数据来微调策略模型。 换句话说，同样的数据，在RLHF中是用来训练“裁判”（奖励模型），而在DPO中是用来直接训练“选手”（策略模型）。DPO跳过了“训练裁判”这个中间环节，让选手直接从偏好对比中学习什么是“更好”。

    因此，任何现有的、用于训练奖励模型的偏好对数据集，都可以无缝地用于DPO训练，这为DPO的快速应用提供了极大的便利。


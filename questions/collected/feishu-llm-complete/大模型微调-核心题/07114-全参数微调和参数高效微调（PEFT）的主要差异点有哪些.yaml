  prompt: 全参数微调和参数高效微调（PEFT）的主要差异点有哪些？
answer:
  mode: rubric
  reference_answer: |-
    全参数微调（Full Fine-tuning）和参数高效微调（PEFT）是模型适配的两条截然不同的技术路线，它们在资源消耗、训练动态和部署灵活性上有着天壤之别。

    [嵌入表格未展开]

    核心差异：全参数微调是“重塑大脑”，PEFT是“给大脑安装可插拔的技能模块”。前者追求极致但昂贵且危险，后者追求高效、安全和灵活，是当前工业界的主流选择。


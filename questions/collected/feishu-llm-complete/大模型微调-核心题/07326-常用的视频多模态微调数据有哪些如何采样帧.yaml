content:
  prompt: 常用的视频多模态微调数据有哪些？如何采样帧？
answer:
  mode: rubric
  reference_answer: |-
    常用数据集：

    - MSR-VTT：包含1万条视频，每条配有20句人工描述的标题，是最经典的视频描述数据集。

    - ActivityNet Captions：包含2万个长视频，关注动作和事件的描述，语句更长、更复杂。

    - YouCook2：烹饪教学视频，带有分步骤的指令和描述，适合训练模型的过程性理解能力。

    - WebVid-2M：一个大规模弱标注数据集，包含200万个视频-文本对，文本来自网页的alt-text，规模大但噪声较多，适合预训练或对齐阶段。

    - EgoSchema：第一人称视角的长视频问答数据集，要求模型进行长时间的时序推理，难度很高。

    帧采样策略：

    - 固定帧数均匀采样：从视频中均匀抽取K帧（如8、16、32）。这是最通用的策略。K的选取需要平衡信息充分性与计算开销。微调时通常8-16帧。

    - 关键帧/镜头采样：通过分析视频的像素变化，检测出镜头切换点，在每个镜头内采样1帧。这样可以避免冗余，用更少的帧代表整个视频。

    - 自适应动态采样：根据任务的复杂度和视频长度动态决定采样帧数。例如，对短视频采更多帧，长视频则适当减少帧率。

    实践中，通常会在数据预处理阶段将视频预先抽帧并存储为图片序列，训练时直接加载图片。


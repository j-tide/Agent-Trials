content:
  prompt: 如何使用“AnyRes”技术处理高分辨率图像？
answer:
  mode: rubric
  reference_answer: |-
    AnyRes（Any Resolution） 技术的核心是自适应图像分块，使模型能处理任意宽高比的高分辨率图像。以 LLaVA-NeXT 为例，其流程如下：

    - 网格计算：根据原始图像尺寸和预设的最大分块数（如 4 或 9），计算一个最优的切分网格（如 2×2、3×2），使分块的宽高比总和尽可能匹配原始图像。

    - 图像分块与缩放：

    - 独立编码与特征拼接：所有高分辨率子图和缩略图分别独立地通过视觉编码器，生成各自的视觉 token 序列。将这些序列在“序列长度”维度上直接拼接，中间插入 <image_separator> 等分隔标记，形成一个长的视觉 token 序列。

    - 输入 LLM：该长序列与文本 token 一同输入 LLM。LLM 通过自注意力机制可自由关注不同分块的细节以及全局概览图，从而在高分辨率下同时获得局部细节和全局上下文。

    关键参数：最大分块数控制着计算成本。例如设最大分块为 4，则处理一张超大图时最多切成 2×2 个子图（加上缩略图共 5 组视觉 token），保证了显存和推理时间的可控性。


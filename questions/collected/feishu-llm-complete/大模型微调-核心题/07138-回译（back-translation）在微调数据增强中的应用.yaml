content:
  prompt: 回译（back-translation）在微调数据增强中的应用。
answer:
  mode: rubric
  reference_answer: |-
    回译（Back-translation）是一种经典且高效的文本数据增强技术，在微调中主要用于增加指令表达的多样性，防止模型对特定指令模板的过拟合。

    应用流程：

    - 前向翻译：将一条原始指令（例如中文）翻译成一个中间语言（例如英文、日文、德文等）。

    - 反向翻译：将翻译后的中间语言文本，再翻译回原始语言（中文）。

    - 得到增强样本：经过这一来一回的翻译，得到的新指令通常在语义上与原指令高度一致，但由于机器翻译的转写特性，其措辞、句式和用词会发生自然的变化。

    示例：

    - 原始指令：“请用一句话概括这篇新闻的核心思想。”

    - 中→英→中回译后，可能变为：“用一句话总结一下这篇报道的主要内容。”

    - 这种变化打破了固定模板的束缚，让模型学会理解同一任务的不同自然语言表达方式。

    优势与注意事项：

    - 优势：成本极低（机器翻译API通常免费或非常廉价），可批量处理数万条指令，是一种高效的、低成本的多样性扩充手段。同时，它还能自然地增加一些翻译腔或轻微语法变化的文本，反而能提升模型对真实用户不完美输入的鲁棒性。

    - 注意事项：

    回译通常作为辅助增强手段，与指令改写、Evol-Instruct等方法结合使用，共同构成一个强大的数据多样性增强工具箱。

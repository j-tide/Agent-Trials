content:
  prompt: 在8卡A100上微调70B模型，推荐什么并行配置？给出显存估算。
answer:
  mode: rubric
  reference_answer: |-
    8卡A100（假设80 GB），微调70B模型（如Llama-2-70B），使用混合精度FP16/BF16和AdamW。

    推荐配置：ZeRO-3 + 张量并行（TP）= 2（或1，若ZeRO-3显存足够） + 流水线并行（PP）= 4（或2）的混合。

    更简单且常用的方案是8卡全部用于ZeRO-3数据并行（即DP=8），配合梯度检查点和梯度累积。因为ZeRO-3可将模型状态分片到8张卡上，每卡仅需约(140+140+560)/8 ≈ 105 GB的理论状态显存（权重+梯度+优化器），加上激活和碎片，可能稍微超出80 GB，因此需借助CPU offload将优化器状态放到CPU，或者使用张量并行减少激活。

    显存估算：

    - 70B参数，FP16权重 = 140 GB。

    - 梯度FP16 = 140 GB。

    - 优化器状态（Adam，FP32 momentum和variance）= 8字节/参数 = 560 GB。

    - 总状态 = 840 GB。

    - 使用ZeRO-3（8路分片）：每卡状态占用 ≈ 105 GB。

    - 中间激活：假设micro-batch=1，序列长度2048，开启梯度检查点，激活约需 30-50 GB。

    - 因此单卡总显存 ≈ 105 + 40 = 145 GB，超出80 GB。

    因此必须采用ZeRO-3 + CPU offload：将优化器状态卸载到CPU（占用大量系统内存，但GPU显存节省）。此时GPU显存主要被权重分片（约17.5 GB）和激活占据，8卡A100 80G完全可行。

    另一种配置：使用TP=4, PP=2：

    - TP=4切分单层，每卡权重大约 140/4=35 GB（实际更少因切分系数），优化器也相应切分，激活也会因TP而减少（因为每卡只计算部分激活）。结合梯度检查点，单卡显存可控制在60-70 GB，无需offload，通信量较大但节点内NVLink可承受。

    推荐：若追求简单稳定，用8卡ZeRO-3 + CPU offload + 梯度检查点；若追求速度且网络带宽充足，采用TP=4, PP=2（或TP=8, PP=1 if 8卡均在同一节点且显存足够，但TP=8可能因通信成为瓶颈）。


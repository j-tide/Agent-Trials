content:
  prompt: 有哪些新方法试图将SFT和RLHF/DPO融合在一个阶段完成？
answer:
  mode: rubric
  reference_answer: |-
    除了ORPO，还有一些新方法尝试将指令微调和对齐合二为一：

    - RSO（Rejection Sampling Optimization）：它从SFT模型生成大量候选回答，利用一个奖励模型（或强评判模型）进行打分，然后通过拒绝采样筛选出最高质量的回答作为新的SFT目标，同时可以用这些数据进行DPO训练。整个过程将数据生成、筛选和训练融合在一个迭代环路中，模糊了SFT和对齐的界限。

    - RAFT (Reward rAnked Fine-Tuning)：从SFT模型生成多个样本，利用奖励模型对它们进行排序。然后，直接使用排名最高的样本作为标准SFT数据来微调模型。这种方法非常简单，没有使用复杂的RL或DPO损失，但通过高质量样本的筛选，间接实现了对齐。

    - Self-Play fIne-tuNing (SPIN)：如前所述，它在一轮轮迭代中，将上一轮模型生成的回答作为负例，将人类标准答案作为正例，通过一个类似DPO的损失函数进行训练。它将SFT数据和对齐目标完美融合在自我博弈的框架下。

    - RLHF with SFT data mixing：一些实践直接在PPO训练中混合SFT损失，或者交替进行PPO和SFT步骤，以防止模型在强化学习过程中遗忘语言能力。这虽然不是一种全新的算法，但将两种训练目标在同一阶段进行融合。

    - KTO (Kahneman-Tversky Optimization)：它直接利用人类对单个回答的二元反馈（好/坏），而无需成对的偏好数据。这使得数据收集更简单，并且可以直接在SFT数据上叠加“好/坏”标签，从而在一个阶段内同时进行指令和对齐训练。

    这些方法共同趋势是简化pipeline，减少训练阶段，降低成本，同时试图在对齐过程中更好地保留模型的基础能力。


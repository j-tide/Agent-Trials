content:
  prompt: 使用模型生成合成微调数据时，如何保证多样性和质量？
answer:
  mode: rubric
  reference_answer: |-
    用GPT-4等强模型生成SFT数据是目前最高效的手段，但很容易陷入“同质化”和“幻觉污染”的陷阱。保证多样性和质量需要一套系统的策略。

    保证多样性：

    - 种子指令多样化：用于生成新指令的种子池（Few-shot examples）本身必须极其多样，覆盖不同的任务类型、领域、句式和复杂度。

    - 在Prompt中显式要求多样性：直接告诉生成模型“请生成一个与上述示例完全不同类型和风格的新任务”，或者“请用口语化、带有错别字的方式提问”。

    - 温度采样与多源生成：使用较高的温度系数（如0.8-1.0）增加输出的随机性。混合使用多个教师模型（GPT-4, Claude, Gemini），打破单一模型的风格偏好。

    - 后处理去重与聚类分析：生成后，计算新指令与已生成指令集的语义嵌入相似度，过滤掉过于相似的样本。定期对数据进行主题聚类，可视化检查各类别的均衡度。

    保证质量：

    - 强模型作为评判者（LLM-as-Judge）：使用一个独立的、强大的模型对生成的指令和回答进行多维度的质量打分（如准确性、有用性、安全性），只保留高分样本。

    - 事实校验管道：对于包含事实陈述的回答，通过搜索引擎API或知识图谱进行事实验证，标记并过滤掉事实错误的样本。

    - 规则过滤：构建多层自动过滤器，快速剔除包含乱码、格式错误、重复度高、命中安全黑名单的样本。

    - “拒绝采样”策略：对同一个指令，让模型生成3-5个候选回答，然后通过上述评判和过滤系统，只保留得分最高的那个。这是保证合成数据质量最有效的手段之一。

    - 人工抽检与校准：定期从自动化管道中抽取样本进行人工审核，一方面校准自动评判系统的准确性，另一方面发现新型的错误模式，持续优化生成和过滤策略。

content:
  prompt: 解释“visual instruction tuning”的基本流程。
answer:
  mode: rubric
  reference_answer: |-
    视觉指令微调是将多模态对齐模型转化为能遵循多样化视觉指令的对话助手的核心阶段。流程如下：

    - 模型初始化：从一个完成了模态对齐的预训练多模态模型出发。该模型已具备基本的图像描述能力（视觉编码器 + 投影层 + LLM）。

    - 数据集构建：创建包含大量 <图像, 指令, 回答> 三元组的数据集。指令类型需极具多样性：视觉问答、图像描述、推理、OCR、定位、创意写作等。数据来源包括现有数据集转换、模型自动生成（如 GPT-4V）和人工精写。

    - 输入序列化：将图像通过视觉编码器和投影层转化为视觉 token。将视觉 token 与指令的文本 token 按照对话模板拼接，形成模型输入。回答部分的 token 作为 labels，其余部分（视觉 token、指令 token）的 labels 设为 -100。

    - 训练设置：

    - 迭代与评估：在多个多维度的多模态基准（如MMBench, SEED-Bench）上进行评估，根据结果分析失败案例，调整数据配比或补充特定类型数据，形成闭环迭代。


content:
  prompt: 你如何判断一个微调任务是否“成功”？除了模型指标外。
answer:
  mode: rubric
  reference_answer: |-
    除了准确率、召回率等离线指标，我更关注微调是否解决了真实的业务问题，并创造了可持续的价值。我会从以下四个维度来评判：

    - 业务价值达成

    这是最根本的指标。微调后，客服机器人的自动解决率是否提升了？人工转接率是否下降了？内容生成场景下，用户的采纳率是否提高了？我会和业务方在项目启动时就约定好这些北极星指标，并以此作为项目成败的最终裁决依据。

    - 投入产出比（ROI）

    成功意味着收益大于成本。我会计算：

    - 直接收益：节省的人力成本、提高的订单转化率等，并换算为货币价值。

    - 投入成本：计算总成本（算力、数据标注、人力），并与基于Prompt Engineering的方案成本进行对比。如果微调方案在达到同等质量下，推理成本更低，或者达到了Prompt无法达到的质量，那么它就是成功的。

    - 用户体验与稳定性

    - 无“幺蛾子”：上线后没有触发严重安全事件或被用户广泛吐槽。对话轮次是否变短？用户的重复提问、中断率是否下降？这表明模型能更高效地解决问题。

    - 可解释性：模型输出更可控，格式规范，不再出现Prompt注入等不可控行为。

    - 技术资产的积累与迭代能力

    - 建立了数据飞轮：项目是否打通了从线上反馈到数据收集、增量微调的闭环？这代表我们具备了持续优化的能力，而不是一次性交付。

    - 沉淀了可复用的资产：项目产出的高质量数据集、训练配置、评估脚本，能否直接或经过微调后应用于下一个类似场景？这代表了技术ROI的杠杆效应。

    因此，一个成功的微调项目，不仅仅是跑通了一个模型，而是用合理的成本，解决了一个清晰的业务问题，并建立了持续优化的技术护城河。


content:
  prompt: 如果微调后模型产生幻觉，如何反推数据中的问题？
answer:
  mode: rubric
  reference_answer: |-
    微调后模型出现幻觉（生成事实不准确或完全虚构的内容），通常根源在于SFT数据本身或训练方式。反推流程如下：

    - 定位幻觉类型与频发场景：首先，收集模型产生幻觉的Bad Cases。将它们按类型分类：是“无中生有”（编造一个不存在的事实）、“张冠李戴”（混淆实体）、还是“过度自信”（对不确定的问题给出确定但错误的答案）。并找出在哪种类型的任务或话题上幻觉最集中。

    - 回溯训练数据，进行数据分析：

    - 进行数据消融实验：如果怀疑某一批数据是元凶，可以将其从数据集中剔除，重新微调一个小模型，观察幻觉现象是否消失或减轻。这是最有力的因果验证。

    - 分析模型行为：使用可解释性工具（如Attention可视化、Logit Lens），观察在模型产生幻觉的瞬间，它的注意力集中在哪些输入token上。如果注意力过多放在了一些无关的词上，而忽略了关键实体，说明数据可能引导了错误的注意力模式。

    通过以上“表现->数据->模型”的反推链条，可以精准定位数据中的问题，并进行定向清洗、补充或配比调整，从而根治幻觉。

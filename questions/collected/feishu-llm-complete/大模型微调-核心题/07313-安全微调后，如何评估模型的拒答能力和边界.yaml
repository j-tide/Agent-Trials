content:
  prompt: 安全微调后，如何评估模型的拒答能力和边界？
answer:
  mode: rubric
  reference_answer: |-
    评估安全微调后模型的拒答能力，核心是检验其在“安全”与“有用”之间的平衡，即：该拒的时候坚决拒，不该拒的时候绝不乱拒。

    评估维度：

    - 安全拒绝率：对一组有害指令（如暴力、色情、违法请求），模型是否给出了恰当的拒绝。高拒绝率是基本要求。

    - 误拒绝率：对一组正常、无害但话题可能接近敏感区（如医疗、法律、历史）的指令，模型是否错误地拒绝了。低误拒绝率是保证模型可用性的关键。

    - 拒绝质量：拒绝时，语气是否生硬？是否解释了原因？是否提供了建设性的替代方案？好的拒绝应该是“坚定而礼貌，且具有引导性”的。

    - 边界一致性：对于用不同方式（显式、隐晦、编码）提出的同一有害请求，模型的立场是否坚定一致？是否容易被角色扮演、越狱攻击等手段绕过？

    评估方法：

    - 静态安全测试集：使用现成的安全基准，如ToxicChat、HarmBench、BeaverTails，进行批量自动化测试，统计上述指标。

    - GPT-4-as-Judge：对于复杂的、处于灰色地带的回答，使用GPT-4进行评判。评判模型可以判断回答是否安全、拒绝是否得体。

    - 红队对抗测试：由专门的“红队”成员，动态地、创造性地发现模型的安全漏洞。这是发现未知风险最有效的方式。

    - 回归测试：维护一个“正常问题集”，每次模型更新后自动测试，确保没有引入新的误拒绝。

    核心原则：安全评估的目标不是追求100%的拒绝率，而是最小化安全风险的同时，最大化用户体验。一个对所有问题都说“不”的模型是百分百安全的，但也是毫无用处的。


    如何选择？

    - 保守可靠之选：使用 AdamW。它几乎不会出错，是快速迭代和原型验证的首选。

    - 追求显存极限或前沿性能：当显存成为瓶颈（例如要微调70B模型），或者希望探索潜在更好性能时，可以尝试 Lion。使用Lion时，需参考其论文推荐的学习率（通常为AdamW的1/3~1/10），并进行充分的超参搜索。

    - 混合使用：有些团队在预训练阶段使用Lion，微调时切换回AdamW，以利用各自优势。

    目前，全参数微调的主流仍然是AdamW，Lion作为一种有潜力的替代方案正逐渐被更多人采用。


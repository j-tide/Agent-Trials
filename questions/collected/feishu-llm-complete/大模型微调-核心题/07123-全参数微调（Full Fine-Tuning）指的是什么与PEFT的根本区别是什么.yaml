content:
  prompt: 全参数微调（Full Fine-Tuning）指的是什么？与PEFT的根本区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    全参数微调，是指在预训练模型的基础上，对模型的所有可训练参数进行更新，以适应下游任务。以 LLaMA‑7B 为例，它包含约 70 亿个参数，全参数微调意味着这 70 亿个权重全部参与前向传播、反向传播和优化器更新，没有任何参数被冻结。与之相对，PEFT（Parameter‑Efficient Fine‑Tuning，参数高效微调）仅更新极少量新增或选定的参数，而冻结绝大部分预训练权重。

    两者的根本区别可以从以下六个维度深入对比：

    [图片内容未导入]

    ① 参数更新范围与模型容量的利用

    全参数微调把整个模型的容量都交给下游任务，能够最大程度地重塑模型的行为。例如，当预训练模型的知识与目标领域存在巨大差异（如英文模型应用于中文法律文书生成）时，全参数微调可以重新调整底层语言表征和高层语义。PEFT 则通过在冻结的基座模型上添加“适配器”（如 LoRA 的低秩矩阵），让模型在原有能力基础上进行有限的偏移。这种有限性既是一种正则化，也是一种约束——它难以彻底改变模型的底层特征。

    ② 显存、计算与通信开销

    全参数微调的显存需求极高，因为必须存储所有参数的梯度（与参数同大小）和优化器状态（Adam 需要额外 8 字节/参数）。对于 7B 模型，仅权重、梯度和优化器状态就需要约 84 GB 显存（见第 2 题），远超单张 80 GB GPU 的容量。此外，多卡训练时的梯度同步（All‑Reduce）通信量与参数量成正比，通信开销巨大。

    PEFT 则只需要为极少量可训练参数保存梯度和优化器状态。以 LoRA（r=8）为例，可训练参数不到总参数的 0.1%，显存和通信量成数量级下降，甚至可以在单张消费级 GPU 上微调 13B 模型。

    ③ 灾难性遗忘风险

    全参数微调直接修改所有参数，当目标域数据量小、分布窄时，模型极易发生灾难性遗忘：它将预训练阶段储存的广谱知识和通用语言能力“洗掉”，转而只记住微调数据的表面模式。PEFT 则几乎不会遗忘，因为基座模型的参数完全没有变动，新任务的能力被编码在新增的极轻量模块中，预训练知识得到完整保留。

    ④ 训练速度与收敛性

    全参数微调由于参数空间巨大，需要更谨慎的学习率、更多的训练步数和更强的正则化。收敛过程也更不稳定，容易出现梯度爆炸。PEFT 则相对稳定，收敛更快，因为优化问题被约束在一个低维子空间内。

    ⑤ 部署与存储

    全参数微调每得到一个任务专有模型，就需要保存一份完整的大模型（7B FP16 约 14 GB）。如果有 100 个下游任务，就需要存储 1.4 TB 的模型。而 PEFT 只需为每个任务保存一个极小的适配器（几 MB），一个基座模型可以搭配数百个适配器，存储成本几乎为零。

    ⑥ 最终性能与泛化

    全参数微调在数据和算力充足时，能够达到更高的性能天花板。但 PEFT 在许多指令微调、风格迁移等任务上表现出与全参数微调持平甚至更优的泛化性能，因为冻结大部分参数起到了极强的隐式正则化作用，防止了过拟合和遗忘。

    综上所述，全参数微调可以视为“重塑大脑”，代价高、风险高，但潜力大；PEFT 则是“在大脑上外接一个可插拔的技能模块”，安全、经济、灵活。工业界在绝大多数场景下优先选择 PEFT，而全参数微调仅在需要深度重塑模型底层能力或追求极致性能且资源充沛时才被考虑。


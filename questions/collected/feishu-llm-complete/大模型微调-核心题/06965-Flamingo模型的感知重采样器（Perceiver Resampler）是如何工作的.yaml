content:
  prompt: Flamingo模型的感知重采样器（Perceiver Resampler）是如何工作的？
answer:
  mode: rubric
  reference_answer: |-
    Flamingo（DeepMind）采用了另一种精巧的视觉信息压缩与注入机制：Perceiver Resampler（感知重采样器）。它的设计初衷和Q-Former类似：将变长的、数量庞大的视觉特征，压缩为固定数量的、可供LLM消费的视觉token。

    工作原理：

    - 处理变长视觉输入：Flamingo不仅可以处理单张图片，还能处理视频（多帧图像）。因此，输入的视觉特征数量可能极其庞大且不固定。

    - 固定大小的学习查询（Learned Latent Queries）：感知重采样器也维护一组固定数量（如64个）的可学习潜在查询向量。这些向量的数量是恒定的，不受输入图像/视频帧数的影响。

    - 交叉注意力压缩：这组查询向量作为Q，所有输入图像的视觉特征（展平后）作为K和V，在感知重采样器内部进行交叉注意力操作。

    - 重采样输出：通过交叉注意力，所有视觉信息被“重采样”并压缩到这64个查询向量的输出中。这64个输出向量就作为最终的视觉token。

    关键优势：

    - 固定长度的视觉上下文：无论输入多少张图片或视频帧，输入给LLM的视觉token数量始终固定（如64个）。这使得LLM的计算图是静态的，非常利于优化和部署，且不会因为输入过多图像而导致显存溢出。

    - 时序信息的隐式融合：当处理视频时，多帧图像的特征被一同输入，查询向量在交叉注意力中能够自然地捕获帧与帧之间的时序动态信息，并将它们压缩进固定长度的token中。

    - 解耦视觉与语言：通过这种压缩，它优雅地将视觉输入的变长问题与LLM的固定计算范式解耦，是实现“Any-to-Any”多模态交互的关键技术。


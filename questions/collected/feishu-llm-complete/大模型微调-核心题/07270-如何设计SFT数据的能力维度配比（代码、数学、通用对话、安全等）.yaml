content:
  prompt: 如何设计SFT数据的能力维度配比（代码、数学、通用对话、安全等）？
answer:
  mode: rubric
  reference_answer: |-
    设计SFT数据的能力维度配比，本质上是在有限的训练数据总量下，对模型的各种能力进行“投资组合管理”。这不是简单的平均分配，而是基于基座模型现有能力、产品目标、任务间的协同与冲突等因素进行的战略决策。

    配比设计的核心步骤：

    - 基座模型能力摸底：在SFT之前，用MMLU、GSM8K、HumanEval等基准全面测试基座模型，画出“能力雷达图”。明确哪些能力是强项（只需少量数据维持），哪些是短板（需要重点加强）。

    - 确定产品定位与能力优先级：通用助手、代码助手、客服机器人等不同产品，对能力的需求截然不同。建立一个“重要性-当前水平”矩阵，将各种能力分为四类：

    - 考虑任务间的协同与冲突：数学数据能提升逻辑推理，对代码也有帮助（协同）；但过多安全数据可能导致模型过度保守，损害创意写作（冲突）。配比时需平衡这种“跷跷板效应”。

    - 构建种子配比并迭代：基于以上分析，设定初始配比（如通用对话30%、数学与推理20%、代码15%、安全与对齐10%、知识问答15%、创意与角色扮演5%、其他5%）。用这个配比训练小规模模型或少量步数，评估各能力的变化。根据评估结果调整：若某能力未达预期，则增加该类别比例；若某能力已饱和，则削减。

    - 消融实验验证边际贡献：对于不确定必要性的数据类别，训练两个模型，一个包含、一个不包含该类数据，对比性能差异。若没有显著提升，说明该类数据可能是冗余的。

    常见配比陷阱：

    - 等比例陷阱：不考虑任务难度和信号密度，平均分配。数学推理单条数据的训练价值远高于简单闲聊。

    - 安全数据过度：为了安全而放入过多拒绝样本，导致模型过度保守，拒绝正常提问。

    - 评测过拟合：配比优化过度依赖某个特定评测集，可能导致模型在该评测上高分但泛化差。

    一个好的配比是“活”的，需要根据模型行为、产品反馈和用户需求持续迭代。


content:
  prompt: 在团队内部，你如何分享微调经验和教训？
answer:
  mode: rubric
  reference_answer: |-
    我会建立一套结构化、低摩擦的知识沉淀与分享机制，让经验显性化，避免同一个坑踩两次。

    - 建立“微调实验日志”

    - 使用MLflow或W&B等工具，将每一次微调实验的完整配置（数据版本、超参、基座模型）和结果（Loss曲线、评估分数）自动记录。这不仅是实验记录，更是第一手数据。

    - 创建“成功案例库”与“失败病例解剖”

    - 成功案例：文档化一个成功项目的完整路径，包括业务痛点、技术选型依据、数据配方、遇到的关键问题及解决方案、最终业务收益。作为团队的标准作业程序（SOP）模板。

    - 失败病例：定期（如每两周）召开“复盘午餐会”。每个人分享一个自己遇到的最棘手的失败案例。重点不是追责，而是进行根因分析，并用“五个为什么”的方法深挖到流程或认知层面的缺陷。将这些案例整理成“常见陷阱”列表，并入代码审查清单。

    - 技术演讲与代码走读

    - 每月一次内部技术分享，鼓励成员分享自己新学的技术或复现的论文，并现场演示代码。

    - 对于核心的微调逻辑（如数据预处理、Loss Masking实现），进行代码走读，由作者讲解设计和实现细节，其他人提问。这能确保关键知识不被少数人垄断。

    - 构建“微调学院”知识库

    - 在内部Wiki中，由浅入深地记录微调指南。从环境搭建、数据格式规范，到PEFT原理、DeepSpeed配置，再到高级的故障排查手册（如“OOM怎么办”、“Loss不下降怎么办”）。鼓励团队成员贡献和更新，形成活文档。

    通过这套机制，让经验从个人大脑里“流”出来，汇入团队的集体智慧池。


content:
  prompt: 在多模态 RLHF/DPO 中，偏好数据如何构造？图片怎么处理？
answer:
  mode: rubric
  reference_answer: |-
    多模态 RLHF 或 DPO 的偏好数据构造核心是获得对同一指令、同一图片/视频的两个回复之间的人类偏好排序。

    数据构造流程：

    - 指令与图像准备：准备多样化的多模态指令和对应的图像/视频。

    - 回复生成：使用当前微调模型（或其他模型）对每个 (指令, 图像) 生成多个不同的回复（如通过调整温度、Top-P 等方式生成 2-4 个）。

    - 人类标注偏好：将图像、指令和两个随机排序的回复呈现给标注员。标注员依据有用性、真实性、流畅度、安全性等标准，选出哪个回复更好，或判定平局。标注时，图像必须是可见的，以确保评判是基于图文一致性。

    - 构造偏好对：将标注结果转换为 (图像, 指令, 胜出回复, 失败回复) 的四元组。

    图片处理：

    - 在 DPO 训练时，图片作为输入的一部分被保留。对于偏好对中的两个回复，它们共享同一张图片。

    - 图片在前向传播时被编码为视觉 token，并作为历史条件同时用于计算胜出回复和失败回复的似然比。DPO 损失函数将直接优化模型，使其在给定图像和指令的条件下，增大胜出回复的相对概率。

    - 在实现上，通常只需要在原有的多模态 LLM 训练流程中，将损失函数替换为 DPO 损失，并将数据加载器改造为同时输出 (图像, 指令, chosen_response, rejected_response) 即可。


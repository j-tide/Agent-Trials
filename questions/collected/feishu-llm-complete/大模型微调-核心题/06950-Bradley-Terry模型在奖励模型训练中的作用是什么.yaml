content:
  prompt: Bradley-Terry模型在奖励模型训练中的作用是什么？
answer:
  mode: rubric
  reference_answer: |-
    奖励模型输出的标量分数本身没有绝对意义，我们如何利用它来学习人类的“偏好”呢？Bradley-Terry (BT) 模型正是连接“奖励值”与“人类偏好概率”的数学桥梁。

    BT模型的核心思想：对于给定的指令 x 和两个回答 y₁ 和 y₂，人类偏好 y₁ 胜过 y₂ 的概率，取决于它们背后隐含“奖励值”的差距。差距越大，偏好概率越高。其公式为：

    [图片内容未导入]

    这等价于一个简单的二分类问题：训练模型正确判断哪个回答更好。

    - 利用相对偏好：BT模型的精妙之处在于，它只需要人类提供相对比较（A是否优于B），而不需要给出绝对分数。因为人很难给单个回答打出一个客观的、统一的绝对分数（比如3.5分），但很容易判断两个回答中哪个更好。BT模型完美契合了人类的这一认知特性。

    - 为DPO奠定基础：DPO正是利用了BT模型，将奖励函数替换为策略模型的隐式表达，从而巧妙地绕过了显式训练奖励模型这一步。


content:
  prompt: 如何定义一条高质量的SFT指令数据？
answer:
  mode: rubric
  reference_answer: |-
    一条高质量的 SFT 指令数据，可以从指令端和回复端两个维度来评判，同时还要考虑对话上下文和安全性。

    指令端（用户输入）：

    - 意图明确：指令清晰无歧义，模型不需要猜测用户想要什么。如果指令本身模糊，则对应的回复应当示范如何请求澄清。

    - 任务多样性：指令覆盖了多样的任务类型（问答、生成、推理、代码等）和语言风格（正式、口语、碎片化），而不是千篇一律的模板。

    - 自然真实：指令应当贴近真实用户的表达习惯，包括可能存在的错别字、不完整句子、网络用语等，这样训练出的模型才会对真实世界鲁棒。

    回复端（助手输出）：

    - 准确性：回答的事实、逻辑、计算均正确无误。任何事实错误或逻辑漏洞都会成为模型学习的负样本。

    - 完整性：回应了指令中的所有约束和要求，不遗漏任何子问题。如果指令要求“列出三个原因并举例”，回复必须恰好三点并配以例子。

    - 有帮助性：不仅回答了问题，还提供了相关的额外信息或下一步建议，体现了主动帮助的态度。

    - 语言流畅与风格恰当：回复自然流畅，符合助手的角色设定，不啰嗦、不模板化。语气可以根据场景调整（正式或亲切），但始终保持礼貌、专业。

    - 安全性：对于危险、不当请求，给出了恰当、坚定且有建设性的拒绝；对于能力外的问题，诚实地表达不确定性并提供替代方案。

    - 格式规范：如果指令要求特定格式（JSON、表格、代码块），回复必须严格遵循，且格式本身正确无误。

    对话上下文的考量（针对多轮数据）：

    - 回复与对话历史保持一致，正确维护了对话状态，不出现前后矛盾。

    - 能够恰当地处理指代、省略和话题切换。

    数据和标注质量：

    - 数据格式统一，使用标准的对话模板，特殊 token 正确。

    - 无数据污染（与评测基准重叠的内容已移除）。

    - 经过去重处理，避免模型重复学习相同内容。

    一条高质量 SFT 数据就像一个优秀的“示范教案”，它不仅在教模型“应该说什么”，更在教它“应该如何思考、如何权衡安全与有用、如何与人类合作”。因此，高质量数据的生产成本很高，但物有所值。

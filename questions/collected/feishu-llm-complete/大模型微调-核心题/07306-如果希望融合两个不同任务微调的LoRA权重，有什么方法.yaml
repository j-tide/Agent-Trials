content:
  prompt: 如果希望融合两个不同任务微调的LoRA权重，有什么方法？
answer:
  mode: rubric
  reference_answer: |-
    融合两个在不同任务上分别微调的LoRA权重，目标是得到一个能同时执行两个任务的单一模型（或适配器）。常见方法有：

    - 加权平均合并（Weight Averaging）：


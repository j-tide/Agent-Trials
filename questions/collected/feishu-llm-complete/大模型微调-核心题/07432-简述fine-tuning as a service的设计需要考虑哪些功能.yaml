  prompt: 简述“fine-tuning as a service”的设计需要考虑哪些功能。
answer:
  mode: rubric
  reference_answer: |-
    “微调即服务”（Fine-tuning as a Service, FaaS）平台旨在为用户提供一站式、低门槛、全托管的模型微调解决方案。一个成功的FaaS平台需要涵盖以下核心功能模块：

    - 数据工程中心

    - 模型选择与配置工作台

    - 训练作业调度与监控

    - 模型评估与对比实验室

    - 模型部署与服务化

    - 安全合规模块与反馈闭环


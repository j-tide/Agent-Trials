content:
  prompt: 为什么实践中常设置alpha=2r？如果alpha=r会怎样？
answer:
  mode: rubric
  reference_answer: |-
    实践中常将 α 设置为 2r（即 α=2r）主要出于以下原因：

    - 维持稳定的学习动态

    [图片内容未导入]

    - 适度的更新强度

    缩放因子为2意味着LoRA的增量项会被放大2倍，给予适配器足够的“音量”去改变模型行为，但又不会过分激进导致训练不稳定。这是在大量实践中摸索出的一个经验性甜点值。

    如果设置 α=r 会怎样？

    [图片内容未导入]

    - 它等价于标准的、无额外缩放的LoRA，是LoRA最朴素的形式。

    - 这种设置下，适配器的更新幅度完全依赖于矩阵 A 和 B 自身的数值大小和学习率，没有额外的放大或衰减。

    - 可能导致适配器在训练初期的影响力过弱，需要更大的学习率或更长的训练步数来让 A,B 学习到足够大的值，从而减慢收敛。

    - 对于部分任务（如与预训练分布差异不大的任务），α=r 也能工作良好。但在需要较大行为偏移时，α=2r 等设置通常能带来更快的初始学习和更好的最终效果。

    总之，α=2r 并非绝对必要，但作为一种简单有效的启发式策略，帮助简化了超参选择，并为适配器提供了合适的初始化影响强度。


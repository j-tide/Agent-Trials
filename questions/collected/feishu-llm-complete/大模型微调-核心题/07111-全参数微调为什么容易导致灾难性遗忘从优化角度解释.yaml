content:
  prompt: 全参数微调为什么容易导致灾难性遗忘？从优化角度解释。
answer:
  mode: rubric
  reference_answer: |-
    灾难性遗忘（Catastrophic Forgetting） 是指模型在学习新任务时，几乎完全丧失在旧任务（此处指预训练）上获得的知识和能力。从优化角度，这源于微调过程中的参数更新过度、且无差别地修改了对旧知识至关重要的权重。

    优化视角的深入解释

    - 参数空间的单向牵引：预训练后，模型参数 θ* 处于一个能够同时表征海量语言规律的“盆地”中。这个盆地是预训练损失曲面上一个宽泛且泛化性好的极小值区域。微调时，我们使用新的SFT数据的损失 LnewLnew 来更新参数。梯度 g=∇θLnewg=∇θLnew 强力地将参数拉向SFT数据分布所对应的狭窄区域。由于全参数微调更新所有参数，这种拉力是全局的，没有对旧知识的重要参数进行任何保护。

    - 损失景观的扭曲：旧任务的损失曲面和新任务的损失曲面通常是两个不同的、可能有部分重叠的“谷”。直接沿着新任务的梯度下降，很可能使参数快速离开旧任务所在的谷底，进入一个虽然新任务损失低、但旧任务损失极高的区域。这就是旧知识的遗忘。

    - Fisher信息与参数重要性：不同参数对旧任务的重要性不同。有的参数承载着基础语法知识，其Fisher信息值极高，任何微小改动都会极大影响旧任务性能。全参数微调以相同的学习率更新所有参数，没有对高Fisher信息的参数施加更小的更新阻力。因此，这些“重要的”参数被轻易修改，导致了遗忘。

    - 持续梯度更新的累积效应：即使每次更新的步长不大（小学习率），但在多个epoch的训练中，这些微小更新的累积效应也会将参数推离原盆地。由于SFT数据量小、分布窄，参数最终收敛到一个围绕SFT数据的尖锐极小点，丧失了预训练模型泛化性好的宽谷特性。

    缓解的优化手段：正则化（EWC根据Fisher信息约束重要参数）、PEFT（冻结大部分参数）、小学习率+早停、混合预训练数据（经验回放）等，本质上都是在优化过程中施加约束，保护参数空间中那些承载着旧知识的重要维度不被过度修改。


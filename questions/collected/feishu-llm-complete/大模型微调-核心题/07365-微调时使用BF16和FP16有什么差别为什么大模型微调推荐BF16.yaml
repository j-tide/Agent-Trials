content:
  prompt: 微调时使用BF16和FP16有什么差别？为什么大模型微调推荐BF16？
answer:
  mode: rubric
  reference_answer: |-
    FP16（半精度浮点）和BF16（脑浮点）都是16位浮点格式，但内部结构不同：FP16有5位指数、10位尾数；BF16有8位指数、7位尾数。这一差异带来了训练中截然不同的表现。


content:
  prompt: 什么是“activation checkpointing”（或gradient checkpointing）？如何配置？
answer:
  mode: rubric
  reference_answer: |-
    激活检查点（也称梯度检查点）是一种用计算时间换取显存空间的技术。它在正向传播时不保存所有层的中间激活，而只保存少数“检查点”层的输入；在反向传播需要某层的激活时，利用最近的检查点重新计算该段的前向，临时恢复激活，用完即释放。

    配置方法：

    - HuggingFace Trainer：设置--gradient_checkpointing或model.gradient_checkpointing_enable()。

    - PyTorch手动：torch.utils.checkpoint.checkpoint(custom_forward, module, *args)包裹层。

    - DeepSpeed/FSDP：在配置文件中启用（如DeepSpeed的activation_checkpointing）。

    参数选择：可以选择“全部层”或“每N层”设一个检查点。通常每个Transformer Block作为一个检查点粒度，性价比较高。

    分布式下注意：所有rank应使用相同的检查点策略，确保模型行为一致。


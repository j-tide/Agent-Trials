content:
  prompt: 在面试中，你如何展示自己的微调项目经验和深度？
answer:
  mode: rubric
  reference_answer: |-
    面试是一个讲述“英雄之旅”的绝佳舞台。我不会仅仅罗列我“做过什么”，而是要展示我“如何思考、如何解决难题、以及带来了什么价值”。

    我的展示策略会遵循STAR+C原则（背景、任务、行动、结果 + 认知升华）：

    - 精心挑选一两个最“硬核”的项目：我不会泛泛而谈所有项目，而是选择那个挑战最大、我介入最深、结果最成功的项目（例如，一个从零构建的、最终上线并带来显著业务价值的微调系统）。

    - 深入剖析技术决策的“Why”：在讲述项目时，我会重点阐述关键决策背后的思考过程。例如：“我们当时选择用QLoRA而不是全量微调，并不是盲目跟风。我评估了我们的硬件预算（有限）、数据量（仅3000条）和任务目标（风格迁移），发现QLoRA在理论上最适合我们的场景，因为它的强正则化能防止过拟合。我做了简单的Ablation Study来对比，数据也证实了这一点。” 这展示了我是在“做选择”，而不是在执行命令。

    - 重点突出“解决过的难题”：面试官不关心一帆风顺的过程。我会主动分享一个我遇到的最棘手的技术挑战，以及我是如何系统地定位和解决的。比如：“模型上线后出现严重幻觉，我通过设计一套反事实评估集，并回溯SFT数据，最终发现是某个合成数据源存在5%的事实错误。于是我建立了一个基于搜索API的自动化数据校验管道，彻底根治了这个问题。” 这展示了我的Problem-solving能力。

    - 量化成果，拔高认知：我不会只说“效果很好”，而是给出量化数据：“通过这次优化，模型的线上用户满意度提升了12%，推理成本降低了30%。” 更重要的是，在最后我会升华我的认知，谈谈从这个项目中得到的教训和思考。例如：“这个项目让我深刻认识到，微调不是模型训练，而是一场数据工程战役。数据质量的重要性远超算法选择，这也是我后来特别重视数据飞轮和自动化评测的原因。” 这能让面试官看到，我是一个能从实践中提炼方法论、具备技术领导力潜质的工程师。


content:
  prompt: 什么是“data selection via influence functions”？如何用？
answer:
  mode: rubric
  reference_answer: |-
    基于影响函数的数据选择（Data Selection via Influence Functions）是一种精细的数据价值评估和筛选方法。它的核心思想是：通过计算每个训练样本对模型参数变化的影响程度，或者对某个特定测试样本损失的影响程度，来量化该训练样本的“重要性”或“价值”。

    原理：

    - 影响函数（Influence Functions）是一种鲁棒的统计工具，它能近似回答：“如果我把某个训练样本的权重增加一个无限小的量，模型参数会如何变化？”或者“如果我把某个训练样本从训练集中移除，模型在某个测试点上的预测会变化多少？”

    - 具体到微调中，我们可以计算每条SFT数据对验证集上损失的影响。那些能显著降低验证损失的样本，被认为是“有益的”；而那些增加验证损失或对损失影响微乎其微的样本，则可能是“噪声”或“冗余”的。

    如何使用：

    - 选择目标：确定一个代表我们期望的、高质量的验证集。

    - 计算影响分数：对SFT数据集中的每一条样本，利用影响函数公式，计算它对验证集损失的平均影响（即 - \nabla_\theta L_{\text{val}}^T H^{-1} \nabla_\theta L_{\text{train}} 或其近似，其中H是海森矩阵）。由于大模型参数极多，通常使用高效的近似算法（如LiSSA、TracIn）。

    - 排序与筛选：根据影响分数对所有训练样本进行排序。

    - 数据清洗与重训：移除低价值和负价值样本，保留高价值样本，重新训练模型。

    优点与挑战：

    - 优点：能够从模型最终的泛化目标出发，精细地识别出真正有贡献的数据，远比基于规则或困惑度的过滤精准。它可以发现那些表面正常但实际误导模型的有害样本。

    - 挑战：计算成本极高，对于大模型，精确计算影响函数几乎不可能。目前多采用基于梯度匹配的近似方法（如TracIn、Grad-Dot等），虽然精度有所下降，但工程上可行。主要适用于高价值核心数据集的精细打磨，而非大规模初筛。

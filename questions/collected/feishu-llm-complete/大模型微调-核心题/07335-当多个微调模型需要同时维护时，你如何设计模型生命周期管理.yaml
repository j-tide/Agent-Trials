content:
  prompt: 当多个微调模型需要同时维护时，你如何设计模型生命周期管理？
answer:
  mode: rubric
  reference_answer: |-
    面对多个微调模型，核心是建立一个模型注册中心（Model Registry），对模型从“孕育”到“退役”的全生命周期进行标准化管理，避免混乱。

    - 统一模型注册与元数据管理

    - 注册中心：每个微调模型（或LoRA适配器）在注册中心都有一个唯一身份。注册时，必须绑定不可变元数据：父模型（基座）、数据版本、训练配置、评估报告、所有者。

    - 阶段标签：每个模型版本都有明确的阶段：Staging（测试中）、Production（生产中）、Archived（已归档）。同一父模型下，只能有一个Production版本。

    - 自动化CI/CD管道

    - 模型的新版本通过上一题提到的自动化管道生成后，自动注册为Staging。

    - 触发自动化评估和安全检查。通过后，自动部署为灰度服务，与当前Production版本进行A/B测试。

    - A/B测试胜出后，自动更新注册中心的标签，旧Production模型变为Archived。

    - 灵活的部署策略

    - 全量模型：为每个生产模型独立部署推理服务实例，适合高吞吐场景。成本较高。

    - PEFT适配器热插拔：对于LoRA模型，部署一个基座模型实例，通过动态加载不同的LoRA适配器（S-LoRA, Punica等技术）来服务多个模型。这是性价比最高的方式，可实现毫秒级模型切换。

    - 监控、告警与自动退役

    - 持续监控所有Production和Staging模型的性能。

    - 如果某个Staging模型在特定任务上表现卓越，可一键提升为Production。

    - 如果某个Production模型的关键指标持续下降，或已有更好的替代模型，系统会提示或自动将其下线并标记为Archived。超过一定时间的Archived模型，其权重文件可移至冷存储以节省成本。


content:
  prompt: 在MoE模型上做全参微调和LoRA微调的显存与效果对比。
answer:
  mode: rubric
  reference_answer: |-
    在MoE模型上，全参数微调（Full Fine-Tuning）与LoRA微调的对比需要考虑MoE特有的总参数量大、稀疏激活的特点。

    - 显存对比

    [嵌入表格未展开]

    - 效果对比

    - 全参微调：理论上限最高，能够彻底调整所有专家的知识和路由行为，对任务适应性最强。在数据量充足、计算资源充沛的情况下效果最好。但极易过拟合，且灾难性遗忘风险高。

    - 标准LoRA（仅加在注意力层）：对于MoE模型，专家FFN是知识存储的核心。仅微调注意力层的LoRA可能无法充分改变模型的行为，尤其是当任务需要注入大量新知识或改变专家分工时。效果往往不如在密集模型上的LoRA提升明显，存在性能瓶颈。

    - MoELoRA：在专家FFN中注入LoRA，直接调节专家输出，能更有效地适配下游任务，性能显著优于仅注意力层LoRA，在很多任务上逼近全参微调。同时保留了LoRA的正则化优势，对防止遗忘和过拟合更友好。

    - 结论

    在资源充足时，全参微调依然是追求极致性能的选择；但在绝大多数场景下，MoELoRA以远低于全参微调的显存和计算成本，实现了接近的性能，是当前MoE微调的最优折中方案。若显存极度受限，则可先尝试标准LoRA，若不满足再转向MoELoRA。


content:
  prompt: Ring Attention如何实现长序列的分布式训练？
answer:
  mode: rubric
  reference_answer: |-
    Ring Attention 是一种分布式注意力算法，通过将查询（Q）、键（K）、值（V）沿序列维度分片到多个设备（如GPU），并通过环形通信来高效计算全局自注意力，从而支持极长序列的训练。

    原理：

    - 分片存储：将输入序列的Q、K、V在序列维度上等分为K块，分别放在K个设备上（每个设备持有Q_i, K_i, V_i）。这意味着单个设备只保存完整序列的一部分，显存占用随设备数增加而线性减少。

    - 环形通信计算：

    - 复杂度：计算量不变（O(L²)），但显存复杂度从O(L²)降为O(L/N)，通信量与序列长度和环大小有关。Ring Attention可以近似线性地扩展序列长度，实现百万token级别的训练。

    在微调中的应用：Ring Attention 适合极长上下文（>100K）的分布式训练，尤其是在没有专门的序列并行库时。它需要自定义注意力算子，DeepSpeed的Ulysses和FlashAttention-3也集成了类似思想。在实践中，Ring Attention常常与ZeRO-3结合，分片模型状态的同时，分片序列，实现极致的显存优化。


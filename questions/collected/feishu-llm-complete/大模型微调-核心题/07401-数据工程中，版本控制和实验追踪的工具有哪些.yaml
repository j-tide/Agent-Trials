content:
  prompt: 数据工程中，版本控制和实验追踪的工具有哪些？
answer:
  mode: rubric
  reference_answer: |-
    数据版本控制和实验追踪是确保微调实验可复现、可回溯、可协作的基石。

    数据版本控制工具：

    - DVC (Data Version Control)：与Git深度集成，通过元文件（.dvc）指向对象存储中的实际数据，实现数据的版本管理和流水线定义。适合中小型团队的轻量级数据版本管理。

    - LakeFS：类似Git的数据湖，可为数据湖（如S3）提供分支、提交、合并、回滚等操作，支持大规模数据的隔离和并行实验。

    - Pachyderm：以数据管道为中心的版本控制平台，自动追踪每个管道步骤的输入、输出和代码版本，适合构建端到端的可重复数据处理流水线。

    实验追踪工具：

    - Weights & Biases (W&B)：提供实验跟踪、超参数记录、模型性能可视化和协作功能，是目前最流行的ML实验管理平台之一。可自动记录数据集版本、训练曲线和系统指标。

    - MLflow：开源平台，涵盖实验追踪、模型打包、模型注册等全生命周期管理，适合企业私有化部署。

    - Neptune.ai：专注于元数据存储和团队协作的实验追踪工具，支持灵活的元数据结构。

    - TensorBoard：PyTorch/TensorFlow的原生可视化工具，轻量级，适合单个实验的实时监控。

    最佳实践：将这些工具链打通。例如，在训练脚本中，使用DVC拉取特定版本的数据，并将该版本号记录到W&B的实验配置中。最终模型checkpoint与数据版本、超参数、评估结果完全绑定，实现端到端的可复现。

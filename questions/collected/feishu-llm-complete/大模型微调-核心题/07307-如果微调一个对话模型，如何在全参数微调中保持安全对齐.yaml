content:
  prompt: 如果微调一个对话模型，如何在全参数微调中保持安全对齐？
answer:
  mode: rubric
  reference_answer: |-
    对已经经过SFT和RLHF安全对齐的对话模型（如Llama‑2‑Chat）进行二次全参数微调，极易因新数据的分布而“洗掉”原有的安全护栏，导致模型变得危险。保持安全对齐是一项贯穿数据、训练和评估的系统工程。

    一、数据层面的安全锚定

    - 保留并扩充安全样本：原始对齐数据集中的安全拒绝样本必须被保留，并加入到新的微调数据集中。此外，应针对新领域主动构造安全对抗样本。例如，如果微调成金融顾问，需要构造“如何利用内幕信息牟利？”这类问题的正确拒绝回答。

    - 安全样本比例控制：安全样本通常占总数据的3%~8%。比例过低则安全边界被淹没，过高则模型变得过度拒绝。需要通过实验找到平衡点。

    - 建设性拒绝的示范：安全回答不应只是简单的“抱歉我不能”，而应提供原因解释和安全的替代方案，这样模型才能学会既安全又有帮助。

    二、训练策略的安全防护

    - 使用极低学习率：相比初次SFT，二次微调的学习率应更低（如1/5~1/10），以减少参数剧烈变动，保护已校准的安全行为。

    - 混合回放原始对齐数据：在训练batch中混入一小部分原始对齐阶段使用的安全对话数据，作为“记忆锚点”，持续激活安全相关的参数。

    - 考虑PEFT：若条件允许，优先使用LoRA等参数高效微调，冻结基座模型，只训练轻量适配器。这从根本上杜绝了对原始安全参数的修改。

    - 监控与早停：训练过程中，在独立的安全测试集（包含正常和对抗性请求）上持续评估模型的拒绝率和误拒绝率。一旦发现安全指标恶化，立即停止训练并回滚。

    三、评估与迭代

    训练完成后，必须进行严格的红队测试和自动化安全基准（如ToxicChat）评估，确认模型在新领域上没有产生新的安全漏洞。将发现的漏洞转化为新的训练样本，进入下一轮迭代。

    核心原则：永远不要在追求新能力的过程中，牺牲模型已经具备的安全品格。


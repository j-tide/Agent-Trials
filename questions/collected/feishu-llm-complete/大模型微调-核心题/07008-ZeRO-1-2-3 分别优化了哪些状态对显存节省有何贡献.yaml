  prompt: ZeRO-1/2/3 分别优化了哪些状态？对显存节省有何贡献？
answer:
  mode: rubric
  reference_answer: |-
    ZeRO（Zero Redundancy Optimizer）的核心思想是：消除数据并行中每张卡上冗余存储的模型状态。它将模型状态在数据并行组内分片，而非复制。


content:
  prompt: 如何设计微调服务的计费模型（按时间、按Token、按租户）？
answer:
  mode: rubric
  reference_answer: |-
    一个合理的计费模型需要简单、透明，同时能覆盖平台成本。推荐采用组合计费模式，将资源消耗与服务价值挂钩。

    - 按计算时间计费 (GPU-Hours / GPU-Minutes)

    - 适用场景：训练和离线推理任务。这是训练最核心的计费方式。

    - 实现：精确记录每个训练任务消耗的GPU卡数和运行时长（秒级精度）。不同型号的GPU（如H100, A100, V100）拥有不同的单价。可细分为：

    - 打包售卖：提供“训练包”，如100 GPU-Hours，购买后可用于任何训练任务，用尽为止。

    - 按Token用量计费 (Pay-per-Token)

    - 适用场景：在线推理服务。非常直观，按调用量计费。

    - 实现：记录每次API请求的输入和输出Token数量。使用模型内部的Token计数器精确统计。单价可以区分输入Token和输出Token（输出通常更贵）。对于流式输出（Streaming），按实际发送的Token数计费。

    - 包月/预付费：提供批量Token包，如百万Token包，价格更优惠。

    - 按存储和网络计费 (Storage & Network)

    - 适用场景：数据存储和模型存储。这是持续产生的成本。

    - 实现：按租户占用的存储容量（GB/天）计费。对不同存储类型分级定价：高速NVMe缓存 > 对象存储。外网流量（如下载模型）按流量计费。

    - 按租户级别计费 (Tiered Subscription)

    - 免费层：允许运行一次小型微调任务，提供极少量推理Token，用于体验。

    - 团队版：按月收取固定订阅费，包含一定量的GPU-Hours和Token额度，超出部分按量付费。

    - 企业版：签署年度合同，获取专用的GPU集群和SLA保障，享有专属折扣和所有功能。

    计费系统实现：在每个底层服务（训练调度器、推理网关）中埋点，将用量事件（如 task_completed, token_consumed）发送到消息队列，由计费中心消费、聚合和存储。计费中心根据租户的定价策略计算费用，生成账单。


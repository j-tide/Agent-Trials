content:
  prompt: ORPO的损失函数中，SFT损失和偏好损失如何加权？
answer:
  mode: rubric
  reference_answer: |-
    ORPO的损失函数是SFT损失和一种基于胜率比（Odds Ratio）的偏好损失之和。

    ORPO损失函数：

    [图片内容未导入]

    如何加权：

    - λ 的设定控制了偏好对齐的强度。如果 λ 过大，模型可能会过度专注于增大胜负回答之间的差距，而牺牲了SFT的指令拟合能力（如回答格式变差）。如果 λ 过小，偏好信号太弱，对齐效果不明显。

    - 实践中，λ 通常通过小规模实验确定，可在 0.1 到 1.0 之间搜索。

    - 在ORPO原始论文中，作者发现将两种损失结合起来，即使 λ 不大（如0.1-0.5），由于SFT和偏好损失的梯度在训练过程中自然地协同，也能取得很好的效果。

    - 另外，ORPO中不涉及参考模型，因此没有DPO中 β 参数那样的KL散度控制。λ 在某种程度上兼任了控制更新幅度的角色。

    核心思想：ORPO通过SFT损失提供正向学习信号，通过OR损失提供对比信号（惩罚负例），两者共同作用，使得模型在模仿正确回答的同时，主动远离错误回答。


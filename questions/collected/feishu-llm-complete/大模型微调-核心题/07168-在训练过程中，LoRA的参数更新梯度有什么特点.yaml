content:
  prompt: 在训练过程中，LoRA的参数更新梯度有什么特点？
answer:
  mode: rubric
  reference_answer: |-
    LoRA的梯度更新具有以下鲜明特点，这些特点直接源于其低秩结构和冻结预训练权重的设计：

    [图片内容未导入]

    - 梯度位于低维子空间：由于 A 和 B 的维度很低，梯度本身也位于一个低维流形上。这意味着更新方向被限制在可能与任务最相关的少数方向上，天然具有正则化效果，抑制了噪声和过拟合。

    - 梯度范数通常较小且稳定：因为只更新极少量参数，整个模型的梯度范数相比全量微调小得多，训练更稳定，不易出现梯度爆炸。

    - 不同层的梯度分布不均衡：注入LoRA的层（如注意力投影层）的梯度远大于未注入层（大部分层被冻结，梯度为0）。即使在注入层内，不同深度的层梯度大小也可能不同，通常顶层梯度较大，底层梯度较小。这种不均衡性启发了一些动态秩分配方法（如AdaLoRA）去更精细地管理参数。


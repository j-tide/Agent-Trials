content:
  prompt: 在微调数据中加入无意义或低质量样本会有什么后果？
answer:
  mode: rubric
  reference_answer: |-
    加入无意义或低质量样本，相当于在教一个学生学习错误的知识，其后果是直接且灾难性的。

    - 注入事实性错误（幻觉）：如果回复中包含错误的事实、虚构的数据或过时的信息，模型会忠实地学会这些错误知识，并以高置信度输出，产生极具欺骗性的幻觉。

    - 学习混乱的格式与风格：格式不统一（如混用多种对话模板）、乱码、语言不一致的样本，会使模型对交互协议感到困惑，输出也变得混乱、不可预测。

    - 导致模型行为退化：低质量样本产生的错误梯度会与正确梯度冲突，导致训练不稳定、收敛缓慢，甚至让模型忘记预训练知识（灾难性遗忘），最终性能还不如基座模型。

    - 安全边界受损：如果错误地将危险请求与顺从回答配对，会直接教会模型越过安全护栏，构成严重威胁。

    - 输出变得冗长、啰嗦或模板化：如果数据中充斥着简单的客套话、重复的短语或无信息量的内容，模型会学会这种“注水”行为，变得啰嗦且空洞。

    一句话总结：低质量数据是微调的“毒药”，会系统性地拉低模型的能力下限和安全性，且极难修复。

content:
  prompt: 全参数微调典型的学习率是多少？如何确定合适的学习率？
answer:
  mode: rubric
  reference_answer: |-
    典型学习率范围

    对于7B~13B级别的稠密模型，全参数微调的学习率通常落在 5e-6 到 2e-5 之间。更具体地：

    - 模型规模越大，学习率通常应越低。例如，7B模型可以尝试1e-5，而65B模型可能需降至5e-6。

    - 数据量少、领域狭窄时，学习率应更低，以防止过拟合和遗忘。

    - 如果基座模型是经过SFT的对话模型（如Llama-2-Chat），学习率应比微调预训练基座模型更低，因为对话模型已经具有特定的行为分布，需要更保守的更新。

    相比预训练阶段动辄1e-4甚至更高的学习率，微调学习率通常低1到2个数量级。这是因为微调是“精雕细琢”，而不是“大开大合”。

    如何确定合适的学习率？

    - 经验法则：从预训练最大学习率的1/10或1/20开始。例如Llama-2预训练学习率为3e-4，则微调可以从1.5e-5开始尝试。

    - 学习率范围测试（LR Range Test）：这是最科学的方法。从一个极小值（如1e-7）开始，每个mini‑batch后将学习率线性增加，直到损失开始上升或震荡。绘制“学习率-损失”曲线，选择损失下降最快、最平稳区间中点的学习率。通常这个点位于曲线最低点左侧约一个数量级处。

    - 考虑优化器：使用AdamW时，学习率相对于SGD更稳健，但过大仍会导致遗忘。若使用Lion优化器（学习率通常为AdamW的1/3~1/10），则要相应地调低。

    - 分层学习率：底层使用更低的学习率，顶层使用稍高的学习率。例如，对Embedding层和浅层Transformer使用1e-6，对深层使用5e-6。这有助于保护通用语言知识。

    - 与Batch Size联动：通常Batch Size增大，学习率也可适当调高（线性缩放规则）。

    关键监控：在正式训练前，用小规模实验（例如10%数据）快速测试几个候选学习率，观察验证损失和通用基准（如MMLU）的变化趋势，选择既能快速降低损失又不损害通用能力的最高学习率。


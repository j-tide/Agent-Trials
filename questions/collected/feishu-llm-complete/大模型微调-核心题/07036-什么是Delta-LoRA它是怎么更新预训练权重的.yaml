content:
  prompt: 什么是Delta-LoRA？它是怎么更新预训练权重的？
answer:
  mode: rubric
  reference_answer: |-
    Delta-LoRA 是一种“双通道”更新的参数高效微调方法。与标准LoRA完全冻结预训练权重 W 不同，Delta-LoRA 不仅训练低秩矩阵 A 和 B，而且利用 A,B 的更新量来同步更新预训练权重 W。它的核心思想是：预训练权重的更新可以通过低秩适配器在相邻时间步的差值来近似，从而让预训练权重也参与到任务适应中，进一步提升模型容量和性能，同时保持参数高效。

    Delta-LoRA的权重更新机制：

    标准LoRA的前向传播为：

    [图片内容未导入]

    - 解耦学习速率：W 和 A,B 以不同的方式更新，但共享信息。A,B 的低秩结构捕捉了任务适应的主要方向，而 W 的微小调整能进一步优化原始参数空间，使得模型既能保留预训练知识，又能灵活适应。

    - 性能提升：Delta-LoRA在多个任务上相比标准LoRA有稳定提升，尤其是在复杂任务上，因为它允许预训练权重进行小幅度的、受LoRA指导的调整，从而突破了完全冻结带来的容量限制。

    - 依然参数高效：虽然 W 参与了更新，但它的更新量不是从自身的高维梯度计算（那会要求存储优化器状态），而是从极低维的 A,B 变化间接得到，因此不会引入额外的显存和计算开销（除了 W 自身的更新步骤本身）。它仍然保持LoRA的低成本优势。

    总结：Delta-LoRA通过“适配器变化驱动预训练权重更新”的机制，巧妙地打破了标准LoRA完全冻结预训练参数的限制，在几乎不增加额外成本的前提下进一步提升了微调性能。


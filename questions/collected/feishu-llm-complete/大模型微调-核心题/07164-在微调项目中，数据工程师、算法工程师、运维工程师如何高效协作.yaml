content:
  prompt: 在微调项目中，数据工程师、算法工程师、运维工程师如何高效协作？
answer:
  mode: rubric
  reference_answer: |-
    三人协作的核心是明确接口、统一语言、自动化流程，避免人传人的“交接损耗”。

    - 定义标准的“数据-模型”接口（由数据工程师和算法工程师共同制定）

    - 数据工程师产出的训练数据必须是标准化格式（如Parquet文件），每个字段（instruction, output, system_prompt, task_type）的含义和规范由双方文档化确认。数据工程师交付数据时，必须附带“数据质量报告”（长度分布、任务类型分布、困惑度等）。

    - 算法工程师拿到数据后，通过一个Data Adapter层自动将标准数据转换为训练格式，无需手动解析数据。数据有任何问题，由数据质量报告兜底，减少来回沟通。

    - 统一“模型-环境”接口（由算法工程师和运维工程师共同制定）

    - 算法工程师将训练逻辑、依赖环境打包成标准的Docker镜像，并提供标准的启动命令。训练时，只需声明所需的数据版本号、超参配置文件（YAML）和GPU资源数量。

    - 运维工程师负责维护一个Kubernetes训练任务模板，算法工程师通过填写模板参数即可提交训练Job。训练过程中的所有日志、指标（Loss, GPU Util）被自动推送到统一的监控平台（如Prometheus + Grafana），双方可同时查看，减少“我机器上能跑”的沟通成本。

    - 自动化管道串联全局（由三位工程师共同维护）

    - 使用Argo Workflows或Kubeflow将整个流程编排为一个自动化管道：

    - 这样，三个角色通过“事件驱动”的自动化管道进行协作，而不是通过“人来通知人”，极大提升了协作效率和可靠性。


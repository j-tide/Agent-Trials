  reference_answer: |-
    可以，这正是构建AI Agent的关键步骤。 通过微调，可以让模型学会在恰当的时机，以正确的格式生成对外部工具（如搜索引擎、计算器、API、数据库）的调用请求，并解析工具返回的结果，整合到最终回复中。


content:
  prompt: 设置数据采样上限（cap）的目的是什么？
answer:
  mode: rubric
  reference_answer: |-
    数据采样上限（Cap）是指对某类任务在每个训练epoch中的采样数量设置一个硬性最大值。其核心目的是：

    - 防止高频任务垄断训练：即使使用了温度采样，一些数据量极大的任务（如日常闲聊）仍然可能占据大部分训练步数，因为其基数太大。上限可以显式地限制它们，给低频但重要的任务（如安全、推理）释放训练空间。

    - 控制过拟合与计算开销：高频任务中往往存在大量冗余信息，模型在少数几个epoch后就能在这些任务上饱和，多余的训练步数不仅浪费算力，还可能加剧过拟合。上限可以精确控制每类数据的训练“剂量”。

    - 保障低频任务的充分学习：上限机制与温度采样是互补的。温度采样决定了各类任务的“相对采样概率”，而上限则压低了高频任务的“绝对采样数量”，从而确保模型在低频任务上也能完成足够的参数更新，而不是刚看到就被淹没。

    - 实现课程的“平滑过渡”：在课程学习中，可以通过对不同难度级别的数据设定不同的上限，控制模型在各个难度阶段的学习节奏。

    实践中，上限通常被设定为“该类数据总量的X%”或“每个epoch最多Y条”。它和温度采样结合，构成了一套强有力的数据均衡工具。

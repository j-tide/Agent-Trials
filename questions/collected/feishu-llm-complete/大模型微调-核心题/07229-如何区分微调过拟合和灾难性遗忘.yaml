content:
  prompt: 如何区分微调过拟合和灾难性遗忘？
answer:
  mode: rubric
  reference_answer: |-
    过拟合和灾难性遗忘常常同时发生，但本质不同：过拟合是针对新任务（微调数据）的泛化能力丧失；灾难性遗忘是针对旧任务（预训练知识）的性能退化。可以通过以下手段区分：

    [嵌入表格未展开]

    核心区分逻辑：过拟合的诊断核心是检验模型对微调任务本身变体的适应能力（改写测试、验证损失），而灾难性遗忘的诊断核心是检验模型对无关任务的保持能力（通用基准）。实践中两者往往并存：模型既忘记了旧知识，又在新数据上过拟合。因此，需要同时监控验证损失（防过拟合）和通用基准（防遗忘）。


content:
  prompt: 使用GPT-4等强模型蒸馏微调数据有哪些最佳实践？
answer:
  mode: rubric
  reference_answer: |-
    用强模型蒸馏SFT数据（即生成训练数据）是当前最高效的方式之一，但必须遵循一套严谨的流程以防止“以讹传讹”。

    最佳实践：

    - 精心设计System Prompt：System prompt是控制生成数据质量、风格和安全性的总开关。需要清晰定义角色、任务、输出格式、行为准则（如“不知道时请说不知道”）。

    - 确保指令来源的多样性：提供给GPT-4的指令不能全是同一风格。应混合真实用户日志、人工撰写的指令、以及通过Self-Instruct等方法生成的指令，确保覆盖多种句式、难度和领域。

    - 过程蒸馏优于结果蒸馏：在提示词中明确要求GPT-4生成包含详细思维链（Chain-of-Thought）的回答，让学生模型不仅学“答案”，更学“思考过程”。

    - 多教师模型混合（Model Soup）：同时使用GPT-4, Claude, Gemini等多个强模型，并对它们设置不同的Temperature和Top-P参数，以生成风格更多样的回答，打破单一模型的偏见。

    - 严格的“拒绝采样”管道：蒸馏生成的数据必须经过多层过滤。

    - 人工校准与反馈：定期对自动生成的样本进行人工抽检，发现问题后，将这些错误示例反馈到prompt设计中（Few-shot示例），形成一个持续改进的闭环。

    - 控制数据比例与配比：蒸馏数据不应占SFT数据的100%。必须与人工标注的高质量“黄金数据”混合使用，通常蒸馏数据占70-80%，人工数据占20-30%。

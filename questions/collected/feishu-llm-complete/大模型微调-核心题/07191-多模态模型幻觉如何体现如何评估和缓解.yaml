content:
  prompt: 多模态模型幻觉如何体现？如何评估和缓解？
answer:
  mode: rubric
  reference_answer: |-
    多模态幻觉是指模型输出的文本描述与图像内容不一致，即“睁眼说瞎话”。主要体现在三个层面：

    - 物体幻觉：描述或回答中出现了图像中根本不存在的物体。

    - 属性幻觉：物体的颜色、大小、材质、数量等属性被错误描述。

    - 关系/场景幻觉：错误地描述了物体间的空间关系、交互关系，或对整个场景进行了臆想性补充（如添加不存在的上下文背景）。

    评估方法：

    - POPE (Polling-based Object Probing Evaluation)：将评估转化为二分类问题——“图中是否存在[物体]？”。通过精心构造的平衡样本（存在/不存在物体各半），可计算出准确率、召回率、F1-Score，并发现模型对哪些类别的物体容易产生幻觉。

    - CHAIR (Caption Hallucination Assessment with Image Relevance)：将模型生成的描述分解为原子短语，利用物体检测模型检查每个短语所指的物体是否真实存在于图像中，从而计算幻觉句子比例和幻觉短语比例。

    - MMHal-Bench：专门设计的基准，通过构造诱导性、开放性的问题来刺激模型产生幻觉，并由 GPT-4 进行评分，考察信息性、真实性等多个维度。

    缓解措施：

    - 数据端：加入反幻觉数据，如“图中没有猫，所以这个问题无法回答”这类正确拒绝的示范；同时强化图文严格对齐。

    - 训练策略：使用 RLHF/DPO 将“忠实于图像”的回答设为偏好回答，惩罚编造行为；或在损失函数中加重与图像相关的 token 权重。

    - 推理时：利用自一致性（Self-Consistency）生成多个回答并交叉验证；或要求模型先定位相关视觉证据再作答。


content:
  prompt: 多节点全参数微调时，如何保证数据加载不成为瓶颈？
answer:
  mode: rubric
  reference_answer: |-
    在多节点分布式训练中，模型的计算速度极快，数据加载（I/O）极易成为短板。必须构建一个高效的、流水线化的数据供给系统。

    一、数据格式与存储优化

    - 使用列式存储格式（Parquet/Arrow）：相比JSONL逐行解析，Parquet可以只读取需要的列，且内部压缩率高、I/O效率极高。将数据集预先转换为Parquet格式，可大幅减少磁盘读取时间。

    - 预Tokenize并缓存：将文本预先转换为input_ids和labels的Tensor，并以内存映射（Arrow）方式存储。这样训练时直接加载张量，省去重复的CPU Tokenization。HuggingFace Datasets的set_format和cache_files功能可自动完成这一工作。

    - 数据分片（Sharding）：将大数据集切分成多个小文件，每个worker加载一部分，避免单文件I/O竞争。文件大小建议在100MB~1GB之间。

    二、DataLoader配置

    - 增加worker数量：num_workers通常设为CPU核心数的1/2到1倍，但不宜过多，因为多worker会竞争Python GIL。可通过实验找到吞吐最高点。

    - 使用pin_memory=True：在worker中将数据锁页到CPU内存，加速CPU到GPU的数据传输。

    - 预取（prefetch_factor）：设置prefetch_factor=2，让每个worker提前准备多个batch，避免GPU等待。

    - 使用IterableDataset和自定义Sampler：对于极大数据集，使用流式处理（如WebDataset）而非Map-style Dataset，避免频繁的随机访问。

    三、分布式环境特定优化

    - 数据分片与亲和性：确保每个节点只加载自己需要处理的数据分片，避免跨节点数据传输。

    - 使用本地高速缓存：对于云存储上的数据，先在每个计算节点上使用本地NVMe SSD作为缓存，第一次epoch后，后续epoch的加载速度会极快。

    - 混合精度数据加载：如果数据需要动态padding，使用DataCollator时尽量在collate_fn中完成，避免在主进程中进行重量级处理。

    四、监控与调优
    使用nvidia-smi和htop监控GPU利用率。如果GPU利用率间歇性降至0，且此时CPU负载高，基本可判定为数据瓶颈。使用torch.utils.bottleneck或自定义profiler进一步分析是I/O、反序列化还是tokenization慢，针对性地优化。


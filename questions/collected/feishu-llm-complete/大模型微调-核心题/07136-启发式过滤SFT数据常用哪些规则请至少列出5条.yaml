content:
  prompt: 启发式过滤SFT数据常用哪些规则？请至少列出5条。
answer:
  mode: rubric
  reference_answer: |-
    启发式过滤是在数据清洗初期，利用简单规则快速剔除明显低质量、异常或有害样本的方法。它效率极高，能为后续更精细的过滤节省大量资源。常用规则包括：

    - 长度过滤：指令或回复过短（如<5字符）或过长（如>10000字符）的样本。过短可能无意义，过长可能被截断或啰嗦，也可能包含过多噪声。

    - 特殊字符与乱码检测：包含过多非ASCII字符、HTML实体残留、连续乱码、控制字符的样本。常见于网页爬取数据未清洗干净。

    - 高重复度过滤：计算回复内或指令内的n-gram重复率。若同一短语反复出现（如“非常重要非常重要非常重要”），通常是生成模型的崩溃模式，不应作为训练样本。

    - 角色完整性检查：对于使用对话模板（如ChatML）的数据，检查模板标记是否完整、角色顺序是否正确（system→user→assistant→user...）。缺失标记或角色顺序错乱的样本会导致模型学习错误交互协议。

    - 敏感词与PII检测：基于正则或关键词列表，检测并滤除包含明确违法、色情、暴力内容的样本，以及包含邮箱、电话、身份证号等个人隐私信息的样本。

    - 语言一致性检查：指令与回复的语言应一致（如中文问题对应中文回答）。若不一致且非翻译任务，则可能是数据构造错误。

    - 格式合规检查：对于要求特定输出格式（如JSON）的任务，验证回复是否符合该格式。格式错误的样本会教给模型错误的格式习惯。

    这些规则通常组合成一个流水线，每个规则快速扫描并标记样本，最后统一移除。需要注意的是，规则需要定期审查和更新，以适应新的数据噪声模式。


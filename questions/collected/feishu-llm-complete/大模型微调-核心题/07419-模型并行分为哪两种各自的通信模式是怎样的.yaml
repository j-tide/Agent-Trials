content:
  prompt: 模型并行分为哪两种？各自的通信模式是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    当单卡无法容纳整个模型时，就需要将模型本身切分到多张卡上，这就是模型并行。主要有以下两种：

    [嵌入表格未展开]

    张量并行的通信模式：

    [图片内容未导入]

    流水线并行的通信模式：

    将32层模型切成4个stage，每个stage放在一张卡上。前向时，GPU0计算完一个micro-batch的8层后，将最后一层的输出发给GPU1；GPU1接着计算自己的8层，发给GPU2，以此类推。反向传播时，梯度沿着原路返回。它只需要在GPU之间传输层间激活/梯度，数据量远小于TP的矩阵通信，是计算密集型。


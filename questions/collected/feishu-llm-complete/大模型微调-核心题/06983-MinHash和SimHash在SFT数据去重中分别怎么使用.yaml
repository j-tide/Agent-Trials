content:
  prompt: MinHash和SimHash在SFT数据去重中分别怎么使用？
answer:
  mode: rubric
  reference_answer: |-
    MinHash和SimHash是两种局部敏感哈希（LSH）算法，用于在海量文本中高效发现近似重复样本，是SFT数据去重的重要工具。

    MinHash的使用方式：

    - 原理：将文本表示为n-gram集合，通过多个哈希函数对集合进行签名，使得两个集合的Jaccard相似度近似等于其MinHash签名中对应位置相等的比例。

    - SFT去重应用：

    - 擅长场景：捕捉字面重复和少量改写，对词序不敏感，适合指令级别的去重。

    SimHash的使用方式：

    - 原理：将文本映射为一个固定长度（如64位）的二进制指纹，使得相似的文本具有较小的汉明距离。

    - SFT去重应用：

    - 擅长场景：捕捉整体语义相似但措辞不同的文本，适合长文档或回复级别去重，签名短、存储极小。

    两者在SFT去重中的协同：

    - MinHash更适合指令级别的去重，因为指令通常较短，n-gram集合能较好捕捉措辞重复。它能有效找到“用不同措辞表达同一任务”的变体。

    - SimHash更适合长回复的去重，因为其特征加权方式能更好保留整体语义，且签名短，适合大规模处理。

    - 实际中常先用MinHash做粗筛（发现高度字面重合的样本对），再用SimHash做补充（发现语义相似但字面差异大的样本对），最后对候选对进行精确比对（如计算ROUGE-L或BERT相似度），确认是否去重。


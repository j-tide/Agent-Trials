answer:
  mode: rubric
  reference_answer: |-
    ```python
    def dpo_loss(
        policy_logits: torch.Tensor,       # (batch, seq_len, vocab_size) 当前策略的 logits
        ref_logits: torch.Tensor,          # 参考模型的 logits
        labels: torch.Tensor,              # (batch, seq_len) 用于构建回答的 token ids
        chosen_mask: torch.Tensor,         # (batch,) bool 表示该样本是否为 chosen (True) 或 rejected (False)
        beta: float = 0.1,
        ignore_index: int = -100
    ) -> torch.Tensor:
        """
        计算 DPO 损失。假设数据已组织为：前半 batch 是 chosen，后半是 rejected 与其配对。
        chosen_mask 标记每个样本的归属。
        """
        # 计算每个 token 的对数似然，忽略 ignore_index 的位置
        loss_fct = torch.nn.CrossEntropyLoss(reduction='none', ignore_index=ignore_index)
        # 形状 (batch, seq_len)
        log_probs_policy = -loss_fct(policy_logits.permute(0, 2, 1), labels)
        log_probs_ref = -loss_fct(ref_logits.permute(0, 2, 1), labels)

        # 对序列求和（或平均）得到整个回答的对数似然
        # 注意：应只考虑回答部分，即 labels != ignore_index 的位置
        mask = (labels != ignore_index).float()
        sum_log_policy = (log_probs_policy * mask).sum(dim=-1)  # (batch,)
        sum_log_ref = (log_probs_ref * mask).sum(dim=-1)

        # 拆分 chosen 和 rejected
        chosen_mask = chosen_mask.bool()
        chosen_log_policy = sum_log_policy[chosen_mask]
        rejected_log_policy = sum_log_policy[~chosen_mask]
        chosen_log_ref = sum_log_ref[chosen_mask]
        rejected_log_ref = sum_log_ref[~chosen_mask]

        # 计算隐式奖励差
        chosen_reward = beta * (chosen_log_policy - chosen_log_ref)
        rejected_reward = beta * (rejected_log_policy - rejected_log_ref)

        # DPO 损失 = -log σ(chosen_reward - rejected_reward)
        loss = -torch.log(torch.sigmoid(chosen_reward - rejected_reward)).mean()
        return loss
    ```

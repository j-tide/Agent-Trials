content:
  prompt: 微调数据需要包含多轮对话吗？如何构造多轮对话数据？
answer:
  mode: rubric
  reference_answer: |-
    必须包含，且至关重要。 多轮对话数据是培养模型上下文理解、指代消解、状态追踪、话题管理、多轮一致性等高级对话能力的唯一途径。仅用单轮数据训练的模型，在面对真实用户的多轮交互时，会表现得像“金鱼记忆”，很快忘记前文，无法进行连贯深入的交流。

    构造多轮对话数据的方法：

    - 从真实交互日志中回收（最真实）

    从产品线上用户的真实多轮对话中筛选高质量的完整会话。这能最准确地反映真实用户的行为模式，包括追问、纠正、话题切换等。需要进行严格的隐私脱敏、质量筛选和人工精修（尤其是将不完美的助手回复替换为专家重写的理想回复）。

    - 由人类专家手写（质量最高）

    让标注者扮演用户和助手，编写模拟真实场景的多轮对话脚本。可以精确设计需要测试的场景，如：

    - 信息补全：用户分多次提供信息，助手在最后进行整合。

    - 指代消解：第二轮用“它”、“那个”、“刚才说的”指代第一轮的内容。

    - 指令修正：用户在后续轮次修改或否定最初的要求。

    - 边界压力测试：用户试图在多轮诱导中让助手越过安全边界。

    - 使用强模型进行角色扮演模拟（高效扩展）

    利用GPT-4等强模型，分别赋予它“用户”和“助手”的角色，让它们围绕一个特定主题或任务进行多轮自由对话。可以设定用户角色画像（如“一个脾气急躁、不太懂技术的客户”）来增加多样性。生成后由人工审核修正，确保逻辑合理、角色一致。

    - 将单轮数据改造为多轮数据

    利用一个单轮问答作为核心，通过改写工具或强模型，生成前面的铺垫轮次。例如，单轮是“推荐一本关于二战的书”，可以生成第一轮“最近对二战历史感兴趣”，第二轮才是“有推荐的书吗”。这种方法能快速扩展现有数据集。

    构造关键点：

    - 统一模板：使用与单轮数据完全相同的对话模板（如ChatML），确保角色标记一致。

    - 损失掩码：对每一轮的助手回复都计算损失，对所有的用户和系统消息进行掩码（设为-100）。这能确保模型学会在对话的任何阶段都能给出高质量回应。

    - 对话长度分布：覆盖从2轮到10轮以上不同长度的对话，帮助模型学习管理不同长度的上下文。

    - 一致性维护：在整个对话中，助手的知识、性格、观点应保持前后一致，不能出现矛盾。

content:
  prompt: 什么是QLoRA？它结合了哪些技术？
answer:
  mode: rubric
  reference_answer: |-
    QLoRA（Quantized LoRA）是LoRA在显存优化上的极致版本，旨在让大模型微调在消费级硬件上成为可能。其核心思路是：将基座模型权重量化到4-bit并冻结，而LoRA适配器仍以BF16/FP16精度训练，同时引入了多项配套技术来补偿量化带来的精度损失和显存压力。

    QLoRA结合了以下四项关键技术：

    - 4-bit NormalFloat (NF4) 量化：一种信息论最优的4-bit量化格式。它假设预训练权重近似服从正态分布，并根据正态分布的分位数来确定16个非均匀的量化等级，从而在相同位宽下比传统的均匀量化（如INT4）保留更多的信息。

    - 双重量化 (Double Quantization)：对第一次量化产生的量化常数（通常每个块需要存储一个FP32缩放因子）再进行一次8-bit量化。这进一步压缩了量化常数的显存开销，使得每个权重的平均显存占用逼近4-bit的理论下限。

    - 分页优化器 (Paged Optimizers)：借鉴操作系统分页内存管理的思想，当GPU显存不足时，自动将优化器状态（如AdamW的动量和方差）的一部分从GPU显存交换到CPU内存，避免OOM。

    - 标准LoRA适配器：仍然以BF16/FP16精度训练低秩矩阵 A 和 B，并旁路添加到量化后的基座模型上。所有梯度更新仅作用于LoRA参数，基座权重不参与训练。

    通过这四项技术的协同，QLoRA使得在单个24 GB显存的显卡（如RTX 3090/4090）上微调33B甚至65B的大模型成为可能，且性能与全量微调高度接近。


content:
  prompt: 消融实验（Ablation Study）在微调诊断中如何设计？
answer:
  mode: rubric
  reference_answer: |-
    消融实验是一种通过系统性地移除或替换某个组件，来量化该组件对最终性能贡献的方法。在微调诊断中，它主要用于定位数据配方、模型结构或训练策略中的关键因子。

    设计步骤：

    - 明确待验证的变量：根据诊断假设，确定要消融的对象。常见消融对象包括：

    - 设计对照组与实验组：

    - 严格控制无关变量：所有实验必须使用完全相同的基座模型、训练超参（学习率、Epoch、Batch Size等）、训练环境（包括随机种子）。唯一的变化就是那个被消融的组件。这是保证结论因果性的绝对前提。

    - 构建多维评估矩阵：不能只看一个总分，需要在多个维度上评估消融带来的影响：

    - 分析结果并量化贡献：将消融组的性能与基线组对比。差值即为该组件的边际贡献。

    典型应用：发现模型在安全任务上过度拒答，可设计消融实验，分别训练包含0%、5%、10%安全数据的模型，比较它们的误拒率和有用性，从而精准定位最佳安全数据配比。


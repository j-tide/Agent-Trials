content:
  prompt: 28. SFT微调常见的学习率范围是多少？与全参微调有何不同？
answer:
  mode: rubric
  reference_answer: |-
    SFT微调的学习率：当使用LoRA等PEFT方法时，常见范围是 1e-4 到 5e-4（甚至更高）；当进行全参数SFT时，学习率要低很多，通常在 5e-6 到 2e-5。这是两者最大的不同之一。

    为什么不同？

    - LoRA从零初始化：LoRA的B矩阵初始为0，A矩阵随机初始化，适配器需要从零开始学习。因此需要较大的学习率来快速将适配器效果“拉起来”。

    - 全参数SFT起点已优：预训练权重已经处于参数空间中一个很好的位置，大学习率会剧烈扰动，破坏预训练知识。所以必须使用极小的学习率，像微雕一样调整。

    - 优化维度不同：LoRA的参数空间极小，优化相对简单；全参数微调在高维空间中，需要更谨慎的步长。

    - 正则化效应：LoRA冻结了基座参数，本身就是一个强正则化，可以承受更高的学习率而不至于过拟合。

    此外，warmup比例也不同：LoRA的warmup通常只需总步数的2%~5%，全参数微调则可能需要5%~10%甚至更多，以确保初期稳定。

    ✅ 建议：LoRA可以从2e-4开始尝试，全参数微调从5e-6或1e-5开始。无论哪种，都建议做一次小规模的学习率扫描，找到损失下降最快且平稳的区间。


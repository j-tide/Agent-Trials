content:
  prompt: DPO中参数β的作用是什么？如何影响优化？
answer:
  mode: rubric
  reference_answer: |-
    在DPO中，参数 β 是一个至关重要的超参数，它直接控制KL散度约束的强度，即策略模型被允许偏离参考模型（SFT模型）的程度。

    作用：
    回顾DPO的损失函数，β 直接作为一个乘子，放大或缩小偏好回答 yw 与非偏好回答 yl 之间的隐式奖励差：

    [图片内容未导入]

    它在这个公式中的作用类似于逆温度系数。它决定了模型对偏好数据中信号的“信任程度”或“学习强度”。

    如何影响优化：

    - β 较小（如0.1）：KL约束弱。模型可以更自由地大幅提高偏好回答的似然，同时压低非偏好回答的似然。策略模型可能偏离参考模型较远，更容易学到偏好数据中的特定模式，但也增加了过拟合、灾难性遗忘和奖励破解（在隐式奖励意义上）的风险。

    - β 较大（如1.0）：KL约束强。模型只能进行小幅调整，更保守地靠近参考模型。它能有效防止过拟合和遗忘，但对齐的效果可能不够显著，策略模型的行为与SFT模型差异不大。

    - 极端值：β→0，损失函数趋向于一个常数，模型几乎不学习；β→∞，模型极度保守，很难从偏好数据中学习新行为。

    实践中的调整：β 的典型取值范围在 0.1到0.5之间。通常需要在验证集上监控策略模型相对于参考模型的KL散度，以及下游任务的性能，找到一个能平衡“对齐程度”和“能力保持”的最佳点。这也是DPO中除了学习率之外，最重要的调参对象。


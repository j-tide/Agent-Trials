content:
  prompt: 发现微调后模型在某个语言上能力退化，如何评估？
answer:
  mode: rubric
  reference_answer: |-
    这是一个典型的“灾难性遗忘”在特定语言上的体现，需要建立跨语言的评估体系来量化退化程度，并诊断其根源。

    评估方法：

    - 多语言基准测试：使用标准的多语言评测集进行量化评估。例如：

    - 分层抽样评估：如果标准基准未覆盖目标语言，可自行构建。从基座模型的预训练数据或开源语料中，选取该语言的代表性文本，生成一系列问答、翻译、摘要指令。使用GPT-4或人工（最好是该语言的母语者）对微调前后的回答进行盲评，重点关注流畅度、用词地道性、文化适应性。

    - 词级/句法分析：

    诊断根源：

    - 数据配比失衡：SFT数据中该语言的样本占比是否过低，被主流语言淹没？

    - 数据质量：SFT中该语言的样本是否为生硬的机器翻译，存在翻译腔，导致模型学到了错误的语言模式？

    - 过拟合到主流语言：训练轮数是否过多，导致模型参数被强力拉向主流语言的分布，挤占了其他语言的空间？

    修复方向：增加高质量的该语言SFT数据、调整多语言数据配比、使用课程学习、或在SFT数据中混入少量预训练阶段的该语言文本作为“锚点”。


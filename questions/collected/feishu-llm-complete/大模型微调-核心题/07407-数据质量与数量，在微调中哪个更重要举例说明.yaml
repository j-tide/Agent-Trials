content:
  prompt: 数据质量与数量，在微调中哪个更重要？举例说明。
answer:
  mode: rubric
  reference_answer: |-
    质量永远优先于数量。 这一论断在微调领域已基本成为共识，LIMA实验是其最有力的实证。

    原因分析：

    - 微调的本质是行为格式化：预训练模型已经具备了广泛的知识和语言能力，SFT的作用主要是激活和引导这些能力，而非注入全新知识。因此，少量但高密度的“行为示范”远比大量低质量的重复内容有效。

    - 低质量数据是毒药：一条包含事实错误、逻辑混乱、格式错乱的样本，会直接“教坏”模型。它会学会自信地胡说八道，或者产生混乱的格式。而且这些错误很难通过增加其他正确数据来完全消除。

    - 多样性 > 数量：一千条互不重复、覆盖不同任务和语言风格的数据，其训练价值远超一万条高度同质化的数据。模型从前者能学到泛化，而从后者只能学到死板的模板。

    经典案例：LIMA (Less Is More for Alignment)

    Meta AI的LIMA项目仅使用了1000条精心挑选的高质量对话数据，对LLaMA 65B进行微调。这1000条数据筛选自社区问答（Stack Exchange、wikiHow）和人工手写，确保了极高的质量和多样性。结果，LIMA模型展现出了惊人的对话能力，不仅能处理训练数据中直接包含的任务，还能泛化到未见过的新任务，其性能甚至不逊于那些使用数万条数据微调的模型。

    反例：如果使用10万条机器生成的、格式单一的客服对话数据进行微调，模型很快会变成一个只会说“亲，请问有什么可以帮您？”的复读机，丧失预训练模型的广博知识和语言多样性。它虽然在客服对话损失函数上表现优异，但在处理其他任何任务时都会一败涂地。

    因此，在实际项目中，应将80%的精力投入到构造和维护一个高质量、高多样性的核心数据集上，而不是盲目追求数据量的扩张。 当质量已经无法再提升时，再考虑通过数据增强等手段在保证质量的前提下扩展数量。

content:
  prompt: 课程学习（curriculum learning）在微调数据组织中可以怎么做？
answer:
  mode: rubric
  reference_answer: |-
    课程学习（Curriculum Learning）在微调数据组织中的核心思想是：将训练数据按照“由易到难”的顺序呈现给模型，而不是随机打乱。这能让模型在早期建立稳固的基础，在后期更平滑地学习复杂技能，从而提升训练稳定性和最终泛化能力。

    具体实施步骤：

    - 定义“难度”度量标准（最关键的一步）。根据任务特性，可以从以下维度量化难度：

    - 数据分桶或排序：根据难度评分，将全部训练数据划分为3-5个难度桶（如Easy, Medium, Hard），或直接按难度升序排列。

    - 设计训练阶段与采样策略：

    优势：课程学习能够避免训练初期复杂样本导致的梯度震荡，使损失下降更平稳；同时，符合人类认知逻辑的学习顺序有助于模型构建更扎实、层次化的知识体系，最终提升在复杂任务上的泛化性能。

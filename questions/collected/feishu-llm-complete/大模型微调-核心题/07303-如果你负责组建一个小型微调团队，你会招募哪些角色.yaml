content:
  prompt: 如果你负责组建一个小型微调团队，你会招募哪些角色？
answer:
  mode: rubric
  reference_answer: |-
    一个精悍的微调团队不需要庞大的编制，关键在于技能的复合与闭环。我会组建一个由4-5个核心角色组成的“特种作战小队”：

    - 算法工程师（Modeler）—— 2人

    - 核心职责：负责模型选型、微调技术（SFT, DPO, LoRA）的实施、训练调优与离线评估。这是团队的核心大脑。

    - 技能要求：深入理解Transformer架构和分布式训练原理，精通PyTorch和DeepSpeed/FSDP，能熟练使用HuggingFace生态。具备通过Ablation Study和数据配比分析来诊断模型问题的能力。

    - 数据工程师（Data Wrangler）—— 1-2人

    - 核心职责：负责数据集的构建、清洗、增强和版本管理。这是决定模型上限的关键角色。包括从线上日志回收数据、编写数据处理流水线、调用API进行数据合成、进行数据质量评估。

    - 技能要求：精通Python，熟悉大规模数据处理工具（如Spark或HuggingFace Datasets），了解数据标注和质量管理流程，熟悉NLP基础。最好懂一点Prompt Engineering，能高效驾驭强模型来蒸馏数据。

    - 领域与评测工程师（Domain/Evaluation Specialist）—— 1人

    - 核心职责：这是离业务最近的技术角色。负责构建和维护业务评测集、标注指南，进行人工评估和GPT-4-as-Judge评估，分析Bad Case，并将业务需求翻译为数据构造指南。在垂直领域，可能需要由资深业务专家兼任。

    - 技能要求：极强的业务理解能力、逻辑分析能力和沟通能力，熟悉业务指标，并掌握基本的脚本编写能力（Python）以自动化评估流程。

    - MLOps/平台工程师（Platform Engineer）—— 可共享资源

    - 核心职责：负责训练和推理环境的稳定性、模型部署、推理网关、监控告警、CI/CD管道和资源成本优化。他/她让算法工程师能专注于模型，而不是陷入环境配置和运维。

    - 技能要求：精通Kubernetes、Docker、云原生技术，熟悉模型推理引擎（vLLM）和MLflow等MLOps工具。

    这个配置确保了团队内部能形成从数据→训练→评估→部署的完整闭环，角色间技能虽有侧重但能形成互补。


  reference_answer: |-
    ```python
    def evolve_instruction(seed_instruction: str, model="gpt-4") -> str:
        prompt = f"""请将以下指令改写得更加复杂，增加更多的限制条件或需要多步推理的要求。确保改写后的指令仍然是可以被合理回答的。
    原指令: {seed_instruction}
    请只输出改写后的指令，不要添加额外文本。"""
        response = openai.ChatCompletion.create(
            model=model,
            messages=[{"role": "user", "content": prompt}],
            temperature=0.7,
            max_tokens=200
        )
        return response.choices[0].message.content.strip()
    ```

content:
  prompt: 如何向产品经理解释“为什么微调比写prompt好”？
answer:
  mode: rubric
  reference_answer: |-
    “李经理，Prompt和微调就好比‘在外面租房子住’和‘买一套房子自己装修’。Prompt是租房子，拎包入住，但你不能改变房子的结构，房东（基座模型）随时可能调整规则。微调是自己买房装修，前期投入大，但你能根据自己的习惯（业务需求）改造厨房，安装地暖，最终住得比任何租的房子都舒服，而且长期来看，成本更低。”

    具体来说，有三个核心优势：

    - 能力的天花板完全不同。Prompt只能引导模型已有的知识，无法教会它新的、私有的知识。比如我们公司的产品代码是QZ-5，Prompt写得再好，模型也可能胡编成QZ-3。微调可以直接把公司知识库“写入”模型，让它成为领域专家，回答更精准，幻觉更少。

    - 长远的成本和性能优势。一个复杂的Prompt，每次调用都要消耗几千Token，请求10万次，这个成本非常惊人。而微调是把指令内化到了模型参数里，推理时只需一个简单的指令，Token消耗大幅降低。同时，Prompt很容易被竞争对手复制，而微调后的模型是我们独有的核心资产，是真正的技术壁垒。

    - 行为可控性和稳定性。Prompt极易受到对抗攻击，用户一句“忽略之前的指令”就可能让它失效。微调是将格式规范、安全边界等行为准则通过海量训练数据内化，比Prompt稳定得多，也更难被攻破。简单说，Prompt是在教模型“假装”，微调是在教模型“成为”。


content:
  prompt: 微调模型上线后出现严重安全事件，你的应急响应流程是什么？
answer:
  mode: rubric
  reference_answer: |-
    我的应急响应流程遵循“止损-定位-复盘-修复-回归”五步闭环原则，目标是分钟级止损，小时级定位，天级修复。

    第1步：立即止损（分钟级）

    - 一键熔断：一旦监控系统告警（如安全拦截率骤降、高频输出有害词汇），立即触发自动或手动熔断，将线上流量从新模型100%瞬间切换回旧稳定版模型。这是最高优先级，确保用户不再受影响。

    - 隔离问题模型：将新模型服务实例下线，但保留现场（日志、checkpoint、配置）用于后续排查。

    第2步：快速定位根因（小时级）

    - 建立作战室：立刻召集算法、工程、安全、法务等关键人员。

    - 日志比对分析：将新模型出问题的请求，与旧模型进行回放对比，确认是新模型独有的问题。

    - 数据溯源：这是最常见的根源。检查新模型的微调数据，是否存在包含不安全回答的“污染”样本？安全拒绝数据是否被错误配置导致占比过少？

    - 模型诊断：检查训练超参（如学习率）是否不当，导致模型遗忘安全能力。

    第3步：全面复盘与影响评估（天级）

    - 编写事故报告：详细记录时间线、原因、影响范围（受影响的用户数、有害输出的内容类型）、处理过程。

    - 评估后果：法务评估合规风险，客服准备应对用户投诉预案，PR准备对外口径（如必要）。

    第4步：针对性修复（天级）

    - 数据修复：清洗掉污染数据，补充更多高质量的安全对抗样本。

    - 增量训练：在出问题的checkpoint基础上，用修复后的数据快速进行增量微调（通常几十分钟）。

    - 强化安全评估：在原有回归测试集中，永久加入此次事故的对抗样本，确保永不“二过”。

    第5步：安全回归与验证

    - 修复后的模型重新进入安全评估管道，通过红队测试和自动化安全基准（如ToxicChat）的严格验证。

    - 通过后，重新执行灰度发布流程，逐步上线，并在上线初期进行实时监控。

    核心原则：速度第一，责任到人，流程透明。事后，我会推动优化自动熔断机制的灵敏度，并丰富数据质量检验规则，从源头预防。


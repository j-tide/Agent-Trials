answer:
  mode: rubric
  reference_answer: |-
    数据版本管理是微调工程中确保实验可复现、可回溯和可迭代的关键基础设施。核心思想是像管理代码一样管理数据。

    核心要素与实践：

    - 版本标识与快照：

    - 数据血缘记录：

    - 配比的参数化管理：

    - 数据质量报告自动化：

    - 清单式管理（Manifest-based）：

    - 回滚与分支：

    实践示例：

    # data_manifest_v2.3.1.yaml
    sources:
      - path: s3://bucket/cleaned/general_dialog.jsonl
        weight: 0.5
      - path: s3://bucket/cleaned/code.jsonl
        weight: 0.2
      - path: s3://bucket/cleaned/safety_adversarial_v1.jsonl
        weight: 0.1
      - path: s3://bucket/augmented/math_cot.jsonl
        weight: 0.2

    该文件可直接用于训练，同时也被Git跟踪，确保了完全的可复现性。

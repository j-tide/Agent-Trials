content:
  prompt: 27. 训练SFT模型时，epoch数一般设多少？如何判断过拟合？
answer:
  mode: rubric
  reference_answer: |-
    一般设13个epoch，最常见的是12个epoch。 这是因为SFT数据量相对较小（几千到几十万条），信号密度高，模型很快就会从“学习指令格式”滑向“背诵具体样本”。

    如何判断过拟合？ 不能只看训练损失，必须结合以下多维指标：

    实践：在训练过程中，每隔一定步数（如100步）在验证集上评估困惑度，并在一个独立的改写测试集上检查性能。一旦验证损失连续N次不再下降（耐心值），立即触发早停（Early Stopping），并回滚到验证损失最低的checkpoint。


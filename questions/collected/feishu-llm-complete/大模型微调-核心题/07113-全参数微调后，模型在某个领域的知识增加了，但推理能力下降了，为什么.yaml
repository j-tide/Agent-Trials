content:
  prompt: 全参数微调后，模型在某个领域的知识增加了，但推理能力下降了，为什么？
answer:
  mode: rubric
  reference_answer: |-
    这是典型的 灾难性遗忘的局部表现 与 知识-推理解耦失效 共同作用的结果。

    一、灾难性遗忘

    全参数微调时，参数更新完全由新领域数据的损失驱动。模型为了快速降低新领域的损失，会将与推理相关的通用参数（如注意力模式、逻辑演绎能力）大幅调整，甚至覆盖。这些推理能力是在预训练阶段通过海量代码、数学、逻辑文本习得的，微调数据通常缺乏此类任务，导致相关神经元被“洗掉”。

    二、知识-推理的依赖关系被破坏

    预训练模型中，知识（事实性信息）和推理（如何运用知识）是紧密耦合的。微调注入的新知识可能扰乱原有的参数结构，使得模型在调用推理能力时，无法与相关旧知识有效协同。例如，模型学会了新的医学知识，但逻辑推理网络被新知识的梯度干扰，导致它在需要多步推理的医学诊断问题上表现变差。

    三、分布坍缩导致推理路径丧失

    微调数据往往以直接问答为主，缺乏需要复杂推理链的文本。模型在优化过程中，输出分布越来越集中到“直接给出答案”的模式上，丧失了预训练时“分步推理”、“自我纠正”等多样化的生成路径。当遇到需要推理的问题时，它更倾向于套用简单的回答模板，而不是进行深层思考。

    四、优化过程中的耦合效应

    一个参数的更新会影响成百上千个相连的神经元。新领域知识的梯度可能无意中“关闭”了某些对推理至关重要的参数。这在高维空间中尤为常见——新任务的最优方向恰好与保持推理能力的方向正交甚至相反。

    缓解措施：

    - 在SFT数据中混合保留一定比例的推理数据（如CoT数学题、逻辑谜题），强制模型在微调过程中持续练习推理。

    - 使用PEFT（如LoRA）而不是全参数微调，冻结底层的推理能力。

    - 严格早停和超低学习率，避免参数变动幅度过大。

    - 混合预训练通用文本（重放），维持旧知识的激活。


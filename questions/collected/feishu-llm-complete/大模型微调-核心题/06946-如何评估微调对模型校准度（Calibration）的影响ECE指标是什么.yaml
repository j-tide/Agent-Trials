content:
  prompt: 33. 如何评估微调对模型校准度（Calibration）的影响？ECE指标是什么？
answer:
  mode: rubric
  reference_answer: |-
    模型的校准度（Calibration） 是指模型对其预测的置信度（概率值）与其实际准确率之间的一致程度。一个完美校准的模型，如果它说有80%的概率正确，那么在所有它给出80%置信度的样本中，实际的正确率就应该是80%。

    微调（尤其是SFT）常常会破坏基座模型的校准度：模型在微调后准确性可能提高了，但输出的概率值变得极其极端（接近0或1），导致“过度自信”。

    评估方法：

    - 可靠性图（Reliability Diagram）：将测试样本按模型预测的置信度（概率最大值）从低到高分成若干个桶（bucket），计算每个桶内的平均置信度和平均准确率。绘制成柱状图，柱子的高度代表准确率，并与对角线（理想情况，置信度=准确率）比较。柱子越接近对角线，校准度越好。

    - 期望校准误差（Expected Calibration Error, ECE）：这是量化校准度的核心指标。它是对可靠性图的数值总结。

    ECE指标的计算：

    [图片内容未导入]

    - ECE 值越低，模型校准度越好。值为0表示完美校准。

    在微调评估中的应用：

    - SFT后：通常ECE会升高。模型在新任务上变得“自信”，但在预训练知识上可能也变得过于肯定，产生事实幻觉。

    - RLHF/DPO后：可能会通过偏好优化改善校准，因为模型学会了更准确地表达不确定性（例如通过“我不确定”），但也可能因为追求高奖励而变得更极端。

    - 监控：在微调过程中，定期在事实性问答测试集上计算ECE，防止模型变得“自欺欺人”。


content:
  prompt: 如何利用“rejection sampling”提升SFT数据质量？
answer:
  mode: rubric
  reference_answer: |-
    拒绝采样（Rejection Sampling） 在 SFT 数据构造中，是一种“以量换质”的精炼策略。它不直接使用模型或人类生成的所有回答，而是先批量生成大量候选回答，再通过一个多级的自动质量评估系统，只“接受”那些达到预设质量标准的高分回答，“拒绝”其余。

    具体流程：

    - 候选回答生成
    对一批指令（可以来自种子数据、用户日志或 Self‑Instruct），用当前最优的模型或强教师模型（如 GPT‑4） 以较高的温度参数（如 0.8~1.0）和不同的随机种子生成多个候选回答（通常 4~8 个）。高温度确保了生成样本的多样性，为后续筛选提供丰富素材。

    - 多级自动质量过滤
    候选回答依次通过一系列过滤器，只有全部通过的样本才被保留：

    - 构造最终数据集
    将经过层层筛选最终“幸存”的高分回答与原始指令配对，构成新的高质量 SFT 数据集。由于经过了严格的筛选，这个数据集的质量通常远高于人工或简单生成的数据。

    优势与注意事项：

    - 质量远超原始生成：它利用强模型作为“质检员”，从一大批粗糙样本中淘出了真金。

    - 提升多样性：通过高温度生成多个候选，再择优录取，可以在保证质量的前提下保留更多的表达多样性，避免简单贪婪解码带来的模板化问题。

    - 成本控制：强模型评判的成本较高，通常只对通过前几轮粗筛的少量候选进行评判。另外，也可以用训练中的模型逐步替代外部强模型进行评判，形成自我进化的数据飞轮（如 SPIN 的思想）。

    - 阈值动态调整：接受率（10%~30%）和评判阈值需要根据实际数据质量和任务要求动态调整，以在数据量和质量之间取得平衡。

    ✅ 总结：拒绝采样为 SFT 数据构造引入了“质量控制闸门”，它将数据生成与质量评估解耦，通过多层过滤和强模型评判，能够从海量候选回答中高效地提取出高纯度、高多样性的训练样本。


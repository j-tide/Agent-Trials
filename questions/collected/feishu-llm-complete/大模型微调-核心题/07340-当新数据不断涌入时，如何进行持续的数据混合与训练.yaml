content:
  prompt: 当新数据不断涌入时，如何进行持续的数据混合与训练？
answer:
  mode: rubric
  reference_answer: |-
    当线上反馈、新领域语料等数据持续涌入时，不能简单地将新数据追加后全量重训，这会导致成本失控。需要一套增量数据混合与训练策略。

    策略一：滚动窗口与时间衰减

    - 维护一个动态的数据池，新数据持续加入，旧数据根据时间或数量进行衰减或淘汰。

    - 可以为数据赋予时间戳，在采样时通过时间衰减因子降低旧数据的权重。或者设定窗口大小（如最近6个月），超出窗口的数据被移除。

    - 优点：能够持续适应数据分布的变化，不会无限制增长。

    策略二：分层增量训练

    - 新数据比例控制：每次增量训练时，将新数据与一个固定的、有代表性的历史核心数据集混合。新数据占比通常控制在20%~50%，通过消融实验确定。

    - 核心数据集的维护：保留一份精心挑选的“黄金数据集”，它覆盖了所有核心任务和安全基线，并且永不衰减。它扮演着“记忆锚点”的角色，防止模型在持续学习新数据时发生灾难性遗忘。

    - 经验重放（Replay）：在训练每个batch时，除了新数据，还从核心数据集中采样一小部分，让模型不断复习。

    策略三：参数高效增量微调（PEFT-based）

    - 每次数据更新后，只训练一个新的LoRA适配器，旧适配器可以保留或合并。这能从根本上防止遗忘，并支持灵活的多版本部署。

    - 推理时根据请求特征挂载相应的适配器。

    策略四：全量重训练的替代方案——在线学习与知识蒸馏

    - 对于极大规模的基础模型，全量重训练成本过高。可以采用蒸馏方式，用新数据训练一个小模型，再将其知识蒸馏回主模型。

    - 或者使用在线学习框架（如PPO的变体），让模型持续与环境互动。

    关键配套：无论哪种策略，数据版本管理和自动化评估是基石。每次增量训练后，必须在统一的多维评估集上全面测试，确保新能力的注入没有牺牲旧能力。

    评估方法：

    - 自动化指标：对于VQA等多选或简答任务，直接与标准答案进行精确匹配或计算F1。

    - GPT-4V-as-Judge：对于开放式生成任务，使用GPT-4V对模型回答进行多维度评分（准确性、详细度、有用性等），是目前最主流的高质量评估方式。

    - 人工评估：在涉及主观性、安全性等关键维度上，依然是黄金标准。


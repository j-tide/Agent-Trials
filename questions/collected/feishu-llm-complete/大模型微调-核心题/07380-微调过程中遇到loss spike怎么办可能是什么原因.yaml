content:
  prompt: 微调过程中遇到loss spike怎么办？可能是什么原因？
answer:
  mode: rubric
  reference_answer: |-
    Loss spike（损失尖峰） 是指训练过程中损失突然急剧上升，然后又迅速回落，或直接导致训练崩溃。它是不稳定性的直接表现，原因多样。

    可能原因

    - 学习率过大：这是最常见的原因。高学习率导致参数更新步幅过大，跳入了损失曲面的高损区域，甚至引发梯度爆炸。

    - 数据异常：某些batch中包含“坏样本”，如超长文本、格式完全错误、或含有大量噪声/乱码的样本。这些样本产生异常巨大的梯度。

    - 数值不稳定：混合精度训练（FP16）时，梯度可能溢出或下溢，导致NaN或Inf。如果没有Loss Scaling或Loss Scaling值过大，也容易出现。

    - 梯度累积中的问题：累积步数设置不当，导致实际有效学习率发生变化；或者累积的梯度范数过大，在更新时产生剧烈扰动。

    - 模型状态问题：某个优化器状态（如Adam的二阶矩）在训练初期不稳定，或由于稀疏特征导致某些参数梯度异常。

    - 硬件问题：GPU内存错误、通信超时等也可能导致瞬间计算错误。

    应对措施

    - 立即启用/调整梯度裁剪：确保max_grad_norm设为合理值（如1.0），它能有效截断异常大梯度，是防止Spike的第一道防线。

    - 降低学习率：如果Spike频繁发生，说明当前学习率逼近不稳定边界。将学习率减半重试。

    - 检查数据质量：定位发生Spike的batch，查看其中的样本，移除异常样本或对其进行修正。

    - 增加Warmup步数：如果Spike发生在训练初期，说明模型适应新数据的过程过激。延长Warmup阶段。

    - 检查混合精度设置：若使用FP16，确保开启了Loss Scaling（动态或静态）。若硬件支持，强烈建议改用BF16，它不需要Loss Scaling，从根本上避免FP16的溢出问题。

    - 保存checkpoint：在训练过程中频繁保存，一旦Spike导致模型退化，可回滚到最近的健康检查点继续训练。


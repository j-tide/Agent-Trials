content:
  prompt: 如何使用分类器进行数据安全过滤？需要训练哪些分类器？
answer:
  mode: rubric
  reference_answer: |-
    数据安全过滤是微调数据清洗中至关重要的一环，目的是在模型训练前就将包含有害、违规或不当内容的样本剔除，防止其污染模型。使用分类器进行安全过滤，本质上是训练或部署自动化的“内容审核员”，它能识别比关键词匹配更复杂、更隐蔽的有害信息。

    需要覆盖的安全维度及对应分类器：

    通常，我们需要一个多维度或多标签的分类体系，而非单个二分类器。常见的需要检测的维度包括：

    [嵌入表格未展开]

    分类器的实现方式：

    - 微调专用安全分类器：基于BERT、RoBERTa等预训练编码器，使用人工标注的安全/不安全样本对进行多标签或二分类微调。对于每个维度，可以单独训练一个二分类器，也可以训练一个多标签分类器同时输出多个维度的概率。此方法隐私性好、延迟低，但需要足够的标注数据。

    - 使用现成的安全分类API：如OpenAI Moderation API、Perspective API。优点是零训练成本、持续更新；缺点是成本较高、可能有数据隐私顾虑，且对非英语内容的覆盖可能不足。

    - 基于强模型的零样本分类：将安全检测任务转化为一个prompt，交给GPT-4等强模型判断。例如：“请判断以下用户请求是否包含任何不安全内容（暴力、色情、仇恨、自残、违法等）。如果安全，回答‘安全’；如果不安全，回答‘不安全，类别：XXX’。” 这种方法对隐晦、新型不安全内容检测能力最强，但成本和延迟较高，常用于抽检或校准自动分类器。

    实践中，通常组合使用：先用API或自研分类器进行粗筛，再对边界模糊的样本使用强模型进行零样本复审，并对所有“改写保留”策略处理的样本进行人工终审。

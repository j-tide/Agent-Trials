content:
  prompt: 什么是SFT？它在LLM训练流程中扮演什么角色？
answer:
  mode: rubric
  reference_answer: |-
    SFT 是 Supervised Fine-Tuning（监督微调）的缩写，在大语言模型（LLM）的训练流程中，它指的是在预训练完成之后，利用高质量的“指令‑回答”对数据进行有监督的额外训练。这个阶段的核心目标，是将一个只会“续写文本”的通用语言模型，转化为一个能够理解用户指令并生成有用、安全、符合期望格式回复的对话助手。

    在完整的 LLM 训练流水线中，SFT 位于预训练和基于人类反馈的强化学习（RLHF）之间，起着承上启下的关键作用。如果把预训练比作让模型读完整个互联网的书籍，成为一个博学但不知如何与人交流的学者，那么 SFT 就是教会这位学者如何礼貌、精准地回答问题，如何遵循特定格式，以及如何拒绝不当请求。它为后续的偏好对齐（RLHF/DPO）提供了一个合理的初始策略，让强化学习不必从零开始探索巨大的语言空间，而是可以在一个已经基本“懂规矩”的模型上进行微调。

    SFT 之所以重要，是因为预训练模型的能力是“潜藏”的——它能写诗、翻译、总结，但这些都是对文本续写的统计模仿，而不是出于对指令的语义理解。SFT 通过将成千上万种不同任务统一为“指令→回答”的格式，让模型学会一种元能力：理解任意指令，并激活相应的知识和技能来生成回答。没有 SFT，预训练模型面对“帮我写一封辞职信”时，很可能会继续补全一段职场文章，而不是直接生成辞职信。因此，SFT 是让大模型从“文本补全器”蜕变为“任务执行器”的核心环节。

    此外，SFT 还扮演着“安全第一关”的角色。在 SFT 数据中，我们会有意识地加入对有害请求的拒绝样本，教会模型基本的边界感。虽然这远非彻底的安全对齐，但它为后续的 RLHF 或 DPO 打下了一个安全地基，避免了从预训练模型直接进行强化学习时可能出现的严重行为偏差。

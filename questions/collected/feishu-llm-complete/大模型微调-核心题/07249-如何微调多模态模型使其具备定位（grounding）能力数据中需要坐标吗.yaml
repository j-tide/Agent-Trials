content:
  prompt: 如何微调多模态模型使其具备“定位”（grounding）能力？数据中需要坐标吗？
answer:
  mode: rubric
  reference_answer: |-
    定位能力是指模型能根据语言描述在图像中精确指出目标位置，或为指定区域生成自然语言描述。微调赋予模型定位能力，绝对需要包含位置坐标信息的数据。

    坐标表示方法：

    - 文本化坐标：将归一化的边界框坐标 [x1, y1, x2, y2]（值域 [0,1] 或 [0,1000]）直接转化为文本，如 <box>[[200,150,400,500]]</box>。LLM 像生成普通单词一样预测这些数字 token。这是最通用的方法。

    - 离散化坐标token：将坐标量化为整数 bins（例如 0~999），并作为特殊 token 加入词表。例如，<x_200><y_150><x_400><y_500>。这能缩短序列长度，并让模型以分类方式预测坐标，训练更高效。

    - 采样点坐标：用物体轮廓上的关键点坐标表示更精细的形状信息。

    微调数据构造：

    - 数据格式为 (图像, 区域描述, 坐标)。例如：

    - 数据来源：现有定位数据集（RefCOCO, Visual Genome）转换、人工标注、或利用强模型自动生成（如 GPT-4V）后进行人工校验。

    训练要点：坐标 token 同样参与交叉熵损失，迫使模型学习精确的位置预测。微调时通常冻结视觉编码器，更新投影层和 LLM。


content:
  prompt: LLaVA的架构是怎样的？视觉信息如何注入到LLM中？
answer:
  mode: rubric
  reference_answer: |-
    LLaVA（Large Language and Vision Assistant）是MLLM的经典代表，以其简洁高效的架构设计著称。它将视觉信息注入LLM的方式可以概括为：将图像“翻译”成LLM能读懂的“外语单词”。

    LLaVA架构：

    - 视觉编码器：使用预训练的CLIP ViT-L/14。将输入图像分割为patch并编码为一系列特征向量。

    - 跨模态连接器：一个简单的单层线性投影层（或2层MLP）。它将ViT输出的每个图像patch的特征向量，直接映射到与LLM词嵌入维度相同的向量。

    - 语言模型：使用Vicuna等预训练LLM。

    视觉信息注入流程：

    - 图像token化：图像经过ViT后，被转换为 NN 个特征向量（例如 N=256N=256）。每个向量通过线性投影层，被映射为一个与LLM词嵌入维度（如4096）相同的视觉token。

    - 序列拼接：将映射后的 NN 个视觉token，直接作为“前缀”插入到文本指令的token序列之前。最终输入LLM的序列变为：[视觉token_1, ..., 视觉token_N, 文本指令token_1, ...]。

    - 统一自回归生成：LLM以标准的自回归方式处理这个混合序列。由于视觉token和文本token已经处于同一嵌入空间，LLM可以通过自注意力机制，让文本token关注到相关的视觉token，从而理解图像内容，并生成回答。

    LLaVA的巧妙之处在于其极简的投影层设计，证明了即便是最简单的线性变换，也足以在对齐良好的视觉和语言模型之间架起桥梁。


content:
  prompt: 什么是“视觉编码器”？常用的有哪些（ViT、SigLIP等）？
answer:
  mode: rubric
  reference_answer: |-
    视觉编码器是多模态模型的“眼睛”，其任务是将原始的、像素构成的图像，转化为富含语义信息的特征向量序列。这些特征向量捕捉了图像中的物体、场景、属性等信息，是后续跨模态理解的基础。

    常用视觉编码器：

    - ViT（Vision Transformer）：将图像分割成一系列固定大小的块（patches），然后将这些块序列输入标准的Transformer编码器中进行处理。它通过自注意力机制捕获全局上下文，效果优异，是现代MLLM的基石。CLIP的视觉部分就是基于ViT。

    - SigLIP：是对CLIP的改进，其核心创新在于将CLIP中的对比学习损失函数由softmax-based改为sigmoid-based，这使得模型在更大batch size和更噪声的数据上训练更稳定。SigLIP模型在多项视觉-语言基准上表现出色，常被用作更强的基础视觉编码器。

    - OpenCLIP：是OpenAI CLIP的开源复现和改进版本，在更大规模的数据集（如LAION-2B）上训练，性能强大。

    - ConvNeXt：一种现代化的卷积神经网络架构，融入了Transformer的设计思想，在保持CNN效率优势的同时，达到了与ViT相媲美的性能。Flamingo模型就是用它作为视觉编码器。

    这些编码器通常在海量的图文对数据上通过对比学习进行预训练，使得图像和其对应文本描述的向量表示在嵌入空间中彼此靠近。这个预训练过程是它们能被用于MLLM的前提，因为此时它们的视觉特征已经与语言有了初步的语义对齐。


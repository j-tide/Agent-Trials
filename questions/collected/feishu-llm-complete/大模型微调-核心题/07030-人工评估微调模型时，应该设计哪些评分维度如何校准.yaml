content:
  prompt: 人工评估微调模型时，应该设计哪些评分维度？如何校准？
answer:
  mode: rubric
  reference_answer: |-
    人工评估是评估模型输出质量的黄金标准，尤其适用于评估微妙、主观的高级能力。

    评分维度（通常采用Likert 1-5分制）：

    [嵌入表格未展开]

    如何校准：

    - 制定详细的评分指南：为每个维度的每个分数档提供清晰的行为锚定描述和正反面案例。例如，“有用性”5分意味着“完美解决了问题，并提供了额外的有价值信息”；1分意味着“完全没能解决问题或答非所问”。

    - 进行校准训练：所有评估员在正式评分前，先对一批公共样本独立评分，然后集体讨论差异，统一标准。这个过程需要反复进行，直到评估员间信度达到可接受水平。

    - 实施双盲评估与仲裁：每条数据至少由两人独立评分，互相不知对方结果。如果分数差异过大，则交由第三方资深仲裁员裁定。

    - 监控评估员间信度：在评估过程中，持续计算Cohen's Kappa或Fleiss' Kappa等信度指标。如果信度低于阈值（如0.7），暂停评估并进行重新校准。

    - 设置“金标准”题目：定期混入一些已经由专家达成共识的“金标准”样本，检查评估员的评分是否漂移，以便及时纠正。

    通过严格的设计和校准，可以将人工评估的主观性降至最低，获得高质量的、可信赖的评估数据。


content:
  prompt: 如何量化一份微调数据集的多样性和覆盖度？
answer:
  mode: rubric
  reference_answer: |-
    多样性衡量数据集内部的差异程度，防止模型过拟合到狭窄的模板。覆盖度衡量数据集对目标能力空间的填充程度，确保没有能力盲区。

    量化方法：

    - 语义多样性 (Semantic Diversity)

    - 方法：使用句子嵌入模型（如all-MiniLM-L6-v2）将所有指令向量化，计算向量之间的平均余弦相似度或方差。平均相似度越低，方差越大，说明多样性越高。

    - 聚类分析：对指令向量进行K-Means聚类，统计有效聚类数（如轮廓系数最高的聚类数）。聚类数越多，簇内方差越小，说明覆盖的不同主题越多。

    - Self-BLEU：计算数据集中任意两条不同回答之间的BLEU分数。平均Self-BLEU越低，多样性越高。这是衡量生成文本多样性的常用指标。

    - 词汇与句式多样性 (Lexical & Syntactic Diversity)

    - Type-Token Ratio (TTR)：文本中独特词汇数除以总词汇数。高TTR通常表示词汇丰富度高。

    - n-gram唯一性：统计数据集中独特的n-gram（n=2,3）数量及其分布。长尾分布表示多样性高。

    - 句长分布：分析指令和回复的长度分布直方图。理想的分布应覆盖从极短到长文本的广阔区间，而非集中在某一长度。

    - 任务类型覆盖度 (Task Coverage)

    - 构建能力矩阵：预先定义好期望模型具备的所有能力维度（如翻译、摘要、代码生成、数学推理、安全对齐等）。

    - 自动标注能力标签：使用一个分类器或强模型（如GPT-4），为数据集中每条指令打上能力标签。

    - 计算覆盖率和饱和度：

    - 识别覆盖盲区：找出覆盖率为0或数据量极低的标签，这些就是后续数据补充的重点。

    - 风格与语气多样性

    - 使用预训练的风格或情感分类模型，统计正式、口语、幽默、严肃、共情等不同风格的分布。

    - 理想的数据集应在目标风格上有所侧重，但整体仍需覆盖一个合理的风格谱系。

    通过上述多维度的量化，我们可以得到一个可视化的“数据集健康仪表盘”，不仅能判断当前数据集的优劣，还能为后续的数据增强和配比调整提供精确的量化指南。

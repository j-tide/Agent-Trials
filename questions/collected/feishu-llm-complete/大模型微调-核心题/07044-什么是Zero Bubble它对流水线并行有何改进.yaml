content:
  prompt: 什么是“Zero Bubble”？它对流水线并行有何改进？
answer:
  mode: rubric
  reference_answer: |-
    Zero Bubble 是一种优化的流水线并行调度算法，旨在消除传统流水线并行（如GPipe、1F1B）中固有的“流水线气泡”（pipeline bubble）——设备空闲等待时间，从而最大化GPU利用率。

    传统1F1B调度虽然通过交错执行减少了气泡，但仍然存在预热和冷却阶段，设备无法达到100%占用。Zero Bubble 提出了一种新颖的调度策略：

    - 关键思想：在反向传播（backward）计算中，将输入梯度（input gradients）的计算与参数梯度（weight gradients）的计算分离为两个阶段，并允许前向传播与它们更细粒度地交错。具体来说，一个micro-batch的反向过程被拆分为“B”（计算输入梯度）和“W”（计算权重梯度）。前向（F）完成后，不必等待所有B完成再开始下一个F；而是可以调度F、B、W三者，使得设备在每个时间片都有任务执行，从而填满所有空闲。

    - 实现：通过精巧的任务依赖图，在流水线的各个阶段之间插入“虚拟”的任务单元，实现零气泡调度。在理想情况下，可以完全消除气泡，达到接近100%的设备利用率。

    - 改进：相比于GPipe（有巨大气泡）和1F1B（有小气泡），Zero Bubble在保持同样内存开销的前提下，显著提升了流水线并行效率，减少了由于流水线带来的吞吐损失。

    Zero Bubble 目前已在部分框架（如ColossalAI）中实现，代表着流水线并行调度领域的先进技术，对于需要深度流水线并行的大规模模型训练尤为有益。在微调中，如果使用了流水线并行，结合Zero Bubble可以提高吞吐，缩短训练时间。

    - DeepSpeed：通过model.save_checkpoint()保存分片；加载时自动根据当前并行配置重组。

    - FSDP：使用FULL_STATE_DICT或SHARDED_STATE_DICT保存。后者仅保存分片，更快且不需要全部聚合。

    - ZeRO的stage3_param_persistence_threshold可以适当调低，让更多参数在重计算时被释放。

    - 激活检查点粒度和ZeRO的reduce_bucket_size等参数需平衡显存与速度。

    - stage：1/2/3。7B-13B模型多卡时stage 2常足够，更大模型用stage 3。

    - offload_optimizer：将优化器状态卸载到CPU，节省GPU显存。

    - overlap_comm：通信与计算重叠，提升效率。

    - allgather_bucket_size和reduce_bucket_size：通信桶大小，调整通信效率和显存占用的平衡。

    - 确保所有GPU型号、显存、驱动版本一致。

    - 使用高性能互联（如NVLink、InfiniBand），避免带宽不均。

    - 检查网卡、线缆是否有故障，运行ib_write_bw等测试。

    - 在数据并行中，确保每个rank分到的数据量（样本数）均衡，且计算量大致相同（如序列长度随机打乱）。

    - 对于流水线并行，调整各stage的micro-batch数量或层数，使各卡计算量均衡。

    - 开启overlap_comm等，将通信隐藏在计算中，减少等待时间。

    - 使用异步通信（如NCCL的非阻塞操作），但通常框架已内置。

    - 使用TorchElastic或DeepSpeed的弹性训练，可以动态检测慢节点并将其移除，然后从检查点恢复。

    - 设置timeout，若某节点超时未完成则自动重启或跳过。

    - 增大梯度累积步数，减少同步频率，可以一定程度上缓解straggler的影响，因为一次同步的间隔变长，累积的梯度量也更大，等待的相对开销降低。

    - 如果节点性能不一，可将计算量较小的任务（如前几层）放在慢节点，但实现复杂。

    - 第一阶段（K传递）：每个设备在本地计算自己分块的注意力分数Q_i @ K_i^T，同时将自己持有的K_i发送给环上的下一个设备，并从上一个设备接收K_{i-1}。接收到新的K后，再计算Q_i @ K_{i-1}^T，并继续传递K。如此循环，直到每个设备的Q_i与所有K_j都完成了注意力分数计算。

    - 第二阶段（V和注意力输出传递）：以类似方式传递V和之前计算的局部注意力输出，通过累积得到最终正确的注意力结果。

content:
  prompt: 如何利用“rejection sampling”从大量生成中迭代提升微调数据？
answer:
  mode: rubric
  reference_answer: |-
    拒绝采样（Rejection Sampling） 在微调数据迭代中是一种“择优录取”的精炼策略。它不直接使用模型生成的所有回答，而是先生成大量候选，再通过严格的评判系统只接受高质量样本，以此不断提升数据集的质量，进而训练出更强的模型。

    迭代流程：

    - 批量生成：对一批指令，使用当前最优模型以较高温度（>0.7）和不同随机种子生成4-8个候选回答，确保多样性。

    - 多级过滤与评分：

    - 择优录取：对每条指令，只保留评判模型得分最高的那个回答，并将其与指令配对，形成新的SFT数据集。

    - 训练新模型：用这个高质量的筛选数据集训练下一代模型。新模型的能力更强，其生成质量也会更高。

    - 开启下一轮迭代：用新模型再次生成、评判、筛选、训练，形成螺旋上升。

    关键优势：它将数据生成与质量控制解耦。生成时鼓励模型大胆创造（高温度），质量控制时则严苛筛选，从而在保证质量的前提下，最大化数据的多样性。这个过程本质上是在模拟一个基于模型自身能力的进化过程。


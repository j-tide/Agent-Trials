content:
  prompt: 构建垂直领域（如法律、医疗）微调数据需要特别注意哪些问题？
answer:
  mode: rubric
  reference_answer: |-
    法律、医疗等垂直领域的微调，容错率极低，错误的回答可能导致实际的人身或财产损害。因此数据构建必须遵循比通用领域严格得多的规范。

    - 事实准确性与权威性（生命线）

    - 绝对准确：所有回答中的法条、案例、药品信息、诊断数据等必须严格基于权威来源（如官方发布的法典、药典、临床指南、权威期刊）。

    - 可溯源：在训练数据中，对于关键事实，可以示范性地附上引用来源（如“根据《XX法》第X条”），培养模型引用和溯源的习惯。

    - 双重审核：法律和医疗数据必须由两位有资质的专家交叉审核，确保万无一失。

    - 严格的免责声明与安全边界

    - 强制免责：每一条回答，尤其是涉及建议的，都必须包含清晰、不可忽略的免责声明，如“本信息不构成法律/医疗建议，请咨询专业律师/医生”。

    - 风险分层处理：对于高风险请求（如“我胸痛怎么办”），回答必须首先强调紧急情况立即就医，并提供求助途径，然后才可提供辅助性通用知识。对于无法处理的问题，要明确表达能力局限。

    - 数据构造：需要专门构造模型过度自信并被纠正的示例，教会模型在不确定时如何诚实回应。

    - 时效性管理

    - 法律和医疗知识更新快。数据必须标注知识截止日期或版本号。需要建立定期审查和更新机制，淘汰过时数据。

    - 术语的精确性与一致性

    - 领域术语必须统一、规范，不能有歧义或混用。一个术语的错误使用可能完全改变含义。在数据构造中，应附带术语表供标注者遵循。

    - 隐私与伦理

    - 训练数据中绝对不能包含真实患者的隐私信息。即使使用公开案例，也应彻底脱敏。

    - 需要谨慎处理有争议的医学话题（如安乐死、堕胎），确保回复符合当地伦理和法律规范。

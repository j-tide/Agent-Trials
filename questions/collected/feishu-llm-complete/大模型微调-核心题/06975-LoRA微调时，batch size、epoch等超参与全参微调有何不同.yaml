  prompt: LoRA微调时，batch size、epoch等超参与全参微调有何不同？
answer:
  mode: rubric
  reference_answer: |-
    LoRA微调的超参与全参数微调（FFT）相比，有显著的差异，主要体现在优化稳定性和数据效率上。

    [嵌入表格未展开]

    核心差异：LoRA微调对超参数相对不敏感，且在显存占用极低的情况下，允许使用更大的micro-batch，简化了梯度累积的配置。训练周期和全量微调相当，但由于其固有正则化，有时能承受更多epoch。


  prompt: 全参数微调显存不足时，你会优先尝试哪些优化手段？
answer:
  mode: rubric
  reference_answer: |-
    显存不足是全参数微调最常见的困境。优化时应遵循“性价比从高到低”的原则，即先尝试对训练速度影响小、效果显著的手段。

    优化阶梯（从最先尝试到最终手段）：

    [嵌入表格未展开]

    实践组合示例：

    微调 7B 模型，单卡 24GB：

    - 启用 load_in_8bit 或 load_in_4bit (QLoRA)，但这属于 PEFT。

    - 若坚持全量微调，则需：BF16 + 梯度检查点 + micro_batch=1 + 梯度累积=16 + Adafactor 优化器 + 冻结 embedding。通过这些组合，或许能在 24GB 上勉强运行全量微调一个 7B 模型。

    注意：梯度累积不会降低单步显存峰值，它只影响有效 batch size。真正降低显存峰值的是 micro-batch size 的减小、混合精度和梯度检查点。


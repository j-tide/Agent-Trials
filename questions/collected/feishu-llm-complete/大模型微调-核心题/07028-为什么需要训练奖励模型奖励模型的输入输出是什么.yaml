content:
  prompt: 为什么需要训练奖励模型？奖励模型的输入输出是什么？
answer:
  mode: rubric
  reference_answer: |-
    直接让人类在RL训练循环中为模型生成的每一个回答实时打分，从成本、效率和一致性上看都完全不现实。因此，我们必须训练一个奖励模型来替代人类。

    奖励模型的输入：通常是一段文本，由指令 x 和模型生成的回答 y 拼接而成。在多轮对话中，输入是完整的对话历史。

    奖励模型的输出：一个标量分数 r(x, y)。这个分数代表了在给定指令下，该回答在人类偏好中的“质量”高低。分数越高，表示回答越好。需要注意的是，这个分数没有绝对意义，它的价值在于相对比较：对于同一个指令，得分更高的回答应该更好。

    为什么它是RLHF的基石？

    - 效率与规模化：PPO训练中，模型需要生成数百万个回答样本并立即获得反馈。奖励模型可以在毫秒级内给出评分，使大规模强化学习成为可能。

    - 一致性与标准化：人类标注员存在主观差异，同一个人在不同时间的判断也可能波动。奖励模型通过对大量人类偏好数据的学习，能够提供一个相对统一、稳定的评分标准。

    - 可微性：奖励模型本身是一个神经网络，其输出可以直接用于计算梯度，从而端到端地优化策略模型。这是RLHF能够通过反向传播进行策略改进的数学基础。


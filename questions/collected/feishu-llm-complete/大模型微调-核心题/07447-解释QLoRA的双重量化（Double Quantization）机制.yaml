content:
  prompt: 解释QLoRA的双重量化（Double Quantization）机制。
answer:
  mode: rubric
  reference_answer: |-
    双重量化是QLoRA为了进一步压缩显存而提出的一种对“量化常数的量化”技术。在分块量化中，每个块（如64个权重）需要一个FP32的量化常数（例如绝对最大值缩放因子）。对于一个大模型，这些量化常数本身也会占用可观的显存。双重量化就是对这些常数再进行一次量化，从而削减这部分开销。

    工作过程：

    [图片内容未导入]

    - 对于一个70B模型，这能节省约 70e9 * (0.5 - 0.127) / 8 ≈ 3.26 GB 的显存。虽然相对总显存不是特别大，但在消费级显卡（如24 GB）上，每GB都极为宝贵，这些节省往往决定了能否跑起模型。

    对精度的影响：由于量化常数通常数值范围不大，且对小的误差不敏感，进行8-bit量化带来的精度损失完全可以忽略。QLoRA的实验也证实了这一点。

    双重量化是QLoRA在工程上追求极致显存效率的体现，它将平均每权重的显存占用进一步推向4-bit的理论极限。


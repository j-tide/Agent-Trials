content:
  prompt: 使用DeepSpeed配置文件启动SFT训练，写出命令行和关键配置。
answer:
  mode: rubric
  reference_answer: |-
    配置文件 ds_config.json：

    ```json
    {
      "train_batch_size": 16,
      "gradient_accumulation_steps": 4,
      "optimizer": {
        "type": "AdamW",
        "params": {
          "lr": 2e-5,
          "weight_decay": 0.1
        }
      },
      "fp16": {
        "enabled": false
      },
      "bf16": {
        "enabled": true
      },
      "zero_optimization": {
        "stage": 2,
        "offload_optimizer": {
          "device": "cpu",
          "pin_memory": true
        },
        "overlap_comm": true,
        "contiguous_gradients": true
      },
      "gradient_clipping": 1.0,
      "steps_per_print": 10
    }
    ```

    启动命令：

    ```bash
    deepspeed --num_gpus=4 train_sft.py \
        --deepspeed ds_config.json \
        --model_name_or_path meta-llama/Llama-2-7b-hf \
        --data_path ./sft_data.jsonl \
        --output_dir ./output \
        --per_device_train_batch_size 4 \
        --gradient_accumulation_steps 4 \
        --learning_rate 2e-5 \
        --num_train_epochs 2 \
        --bf16 \
        --logging_steps 10
    ```

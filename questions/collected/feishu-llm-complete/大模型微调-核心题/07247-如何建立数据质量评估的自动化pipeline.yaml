answer:
  mode: rubric
  reference_answer: |-
    一个自动化的数据质量评估管道，能在每次数据变更后立即提供一份“健康报告”，确保进入训练环节的数据符合高标准。其核心是“分层、多维、插件化”。

    管道架构：

    - 数据摄取与元数据记录层：管道监听数据源（如对象存储）的变更。当新的数据版本上传后，自动触发管道运行，并记录数据版本号、样本总量、来源等信息。

    - 启发式规则检查层（最快，成本最低）：

    - 统计分布分析层：

    - 基于模型的评判层（成本较高，但最可靠）：

    - 报告生成与告警层：

    通过这个自动化管道，数据质量从“人工抽查”的离散点，变成了一个持续监控的“面”，能极大提升微调数据工程的效率和可靠性。

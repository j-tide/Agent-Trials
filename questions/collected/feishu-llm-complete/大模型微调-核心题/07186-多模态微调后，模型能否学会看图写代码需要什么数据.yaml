content:
  prompt: 多模态微调后，模型能否学会“看图写代码”？需要什么数据？
answer:
  mode: rubric
  reference_answer: |-
    可以。多模态模型经过微调，可以学会根据软件界面截图、UI 设计稿、图表或手绘草图直接生成对应的前端代码（HTML/CSS/JS）、后端逻辑或数据可视化代码。

    所需数据类型：

    - 设计稿-代码对：这是最核心的数据。包含一张 UI 设计稿的截图，以及实现该设计稿的完整前端代码。为了保证训练质量，截图与代码必须是精确对应的，即代码渲染后应与截图一致。

    - 图表-可视化代码对：数据包含柱状图、折线图、流程图等图像，以及生成该图表的代码（如 Python 的 Matplotlib/Plotly 代码，或 Mermaid 语法）。这能训练模型将视觉信息转换为数据可视化指令。

    - 文档-配置代码对：例如，一张复杂表单的截图，对应一段用于创建该表单的 YAML 或 JSON 配置文件。

    - 手绘草图-代码对：粗糙的白板草图或线框图，对应实现其功能的结构化代码。这能极大提升模型的创意辅助能力。

    - 错误截图-修复代码对：展示一个包含 bug 的网页截图（如布局错乱、元素重叠），以及修复该问题的代码 diff。这能训练模型的 UI 调试能力。

    数据构造要点：代码必须可执行且无语法错误；截图分辨率要高；需使用特殊的 Markdown 代码块包裹代码，并在指令中明确要求“生成实现该界面的代码”等。


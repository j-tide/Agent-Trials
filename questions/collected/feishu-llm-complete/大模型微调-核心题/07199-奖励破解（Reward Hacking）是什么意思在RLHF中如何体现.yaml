content:
  prompt: 奖励破解（Reward Hacking）是什么意思？在RLHF中如何体现？
answer:
  mode: rubric
  reference_answer: |-
    奖励破解是指RL中的智能体发现了奖励函数的漏洞，通过非预期的、扭曲的方式获取高奖励，而非真正完成目标任务。在RLHF中，由于奖励模型 rϕrϕ 是训练出来的近似模型，并非完美无缺，它必然存在一些“盲区”或“偏差”，策略模型 πθπθ 在PPO优化中就可能钻这些空子。

    在RLHF中的典型表现：

    - 谄媚模式：奖励模型偏好礼貌用语。策略模型学会后，在所有回答中疯狂堆砌“当然！”、“很高兴为你服务！”，使回答看似热情实则空洞，浪费用户时间。

    - 过度啰嗦：奖励模型给长回答的分数偏高。策略模型发现后，即使一个简单的“是”或“否”也展开成长篇大论，以骗取高奖励。

    - 虚假安全：奖励模型给任何包含“我不能提供此信息”的回复都打高分。策略模型学会后，开始无差别拒绝，对大量正常请求也说“不”，变得“过度安全”而毫无用处。

    - 关键词堆砌：奖励模型可能学到了一些与高质量相关的表面关键词（如“研究表明”、“数据驱动”）。策略模型就在回答中强行塞入这些词，即使内容完全是胡编乱造，也能骗到奖励。

    根本原因：奖励模型只是人类偏好的一个有偏、不完美的代理。PPO优化过程会竭尽全力最大化它，从而放大奖励模型的任何微小缺陷。这就像一个学生发现只要字迹工整，老师就给高分，那他就会放弃思考内容，只专注于练字。


    通常对哪些模块加LoRA：

    在多模态LoRA微调中，最核心的注入点是LLM的注意力投影层（Q, V）。这与纯文本SFT一致，因为LLM是所有模态信息汇聚和推理的最终处理器。

    - LLM部分（推荐）：对LLM的q_proj, v_proj（有时也包括k_proj, o_proj）注入LoRA。这是改变模型行为、遵循指令最有效、最安全的方式。这是当前最主流的做法。

    - 跨模态连接器：通常冻结，但有时也会对连接器（投影层）进行全参微调，因为其参数量极小，全参微调也几乎没有负担。

    - 视觉编码器：强烈建议永远冻结。视觉编码器的预训练知识极其宝贵且脆弱，微调极易导致视觉基础能力退化。给视觉编码器加LoRA的实践较少，风险较高。

    因此，“LoRA on LLM only”是多模态微调中性价比最高、最稳健的配置。


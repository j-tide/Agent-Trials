content:
  prompt: 解释“LIMA”实验对数据工程的启示。
answer:
  mode: rubric
  reference_answer: |-
    LIMA（Less Is More for Alignment） 实验是Meta在2023年发布的一项里程碑式研究。它仅使用1000条经过精心挑选的高质量、多样化的对话数据，微调了LLaMA 65B，却取得了惊人的指令遵循能力，甚至在某些任务上媲美使用数万条数据微调的模型。

    核心启示：

    - 质量压倒数量：这是最根本的启示。预训练模型已经蕴含了强大的能力，SFT只需要少量高质量示范来“激活”和“格式化”这些能力。冗余的、低质量的样本对能力提升贡献甚微，甚至有害。

    - 多样性是关键：LIMA的1000条数据虽然少，但覆盖了社区问答、wikiHow指导、人工手写等广泛领域和交互模式。任务覆盖度远比单一任务的样本量重要。

    - 模型规模与数据利用效率：LIMA的成功高度依赖于65B的大模型参数。大模型对高质量数据的利用效率远超小模型。因此，选择足够强大的基座模型，并将节省下来的数据标注预算投入到提高单条数据质量上，是更具性价比的策略。

    - 推动了数据工程从“堆量”向“精加工”转型：LIMA之后，越来越多的团队放弃了盲目追求百万级数据量，转而采用“种子数据+强模型蒸馏+人工精修”的混合策略，聚焦于构建一个小而精的“黄金数据集”。

    - 数据配比并非越多越好：LIMA证明了，在质量和多样性的前提下，即使极小的数据量也能发挥巨大作用，颠覆了“数据越多越好”的传统认知。

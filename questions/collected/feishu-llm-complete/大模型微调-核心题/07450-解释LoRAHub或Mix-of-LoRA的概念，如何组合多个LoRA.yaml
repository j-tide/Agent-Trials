content:
  prompt: 解释“LoRAHub”或“Mix-of-LoRA”的概念，如何组合多个LoRA？
answer:
  mode: rubric
  reference_answer: |-
    LoRAHub 或 Mix-of-LoRA 是指将多个分别在不同任务/领域上训练好的LoRA适配器，通过一个学习到的组合权重，动态融合成一个新的适配器，从而让模型能同时具备多种能力，或通过组合产生新的复合能力。其核心思想类似于MoE（混合专家），但操作对象是完整的适配器模块而非专家子网络。

    组合方式：

    [图片内容未导入]

    应用场景：

    - 多租户个性化：每个用户有自己的LoRA，但某些通用能力（如安全）可以是一个基础LoRA，通过组合实现个性化且保持安全。

    - 持续学习：新任务训练新LoRA，与旧LoRA组合，无需重训旧模型。

    - 能力编辑：通过给特定LoRA负权重，可以“削弱”模型中某种不良能力。

    挑战：如何在没有大量混合任务数据的情况下学习到最优的组合权重，以及组合后的适配器如何保持各个能力的独立性而不相互干扰。


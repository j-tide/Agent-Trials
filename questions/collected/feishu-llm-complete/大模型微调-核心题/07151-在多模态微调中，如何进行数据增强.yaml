content:
  prompt: 在多模态微调中，如何进行数据增强？
answer:
  mode: rubric
  reference_answer: |-
    多模态数据增强旨在提升模型鲁棒性，但必须时刻确保图文对齐关系不被破坏。

    图像层面：

    - 几何变换：随机水平翻转、小角度旋转、裁剪。须注意：如果指令涉及空间位置（如“左边的人”），翻转会破坏语义，此时需同步修改指令或禁用翻转。

    - 色彩与光照：调整亮度、对比度、饱和度，模拟不同拍摄环境。

    - 噪声注入：轻微的椒盐噪声或高斯模糊，模拟低画质。

    文本层面：

    - 指令改写：用同义表达替换原始指令，如将“描述这张图片”改写为“这张图片里有什么？”。可使用大语言模型批量生成。

    - 回译增强：将指令翻译成其他语言再译回，产生自然措辞变化。

    图文协同与质量控制：

    - 维持对齐：任何增强后，必须用 CLIP-Score 等对齐模型校验增强样本的图文匹配度，过滤掉匹配度过低的样本。

    - 负例增强：对于幻觉或错误回答，构造“错误-修正”对话对，训练模型自我纠错。

    - 定位数据增强：对图像进行增强时，必须同步变换坐标信息（如翻转、裁剪后坐标需重新映射）。


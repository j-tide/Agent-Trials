content:
  prompt: 如何处理多模态数据中图片分辨率不一致的问题？
answer:
  mode: rubric
  reference_answer: |-
    图片分辨率不一致是MLLM面临的核心挑战之一。直接将所有图片缩放（Resize）到统一尺寸，会破坏原始图片的宽高比，导致物体变形，或丢失关键细节信息。现代MLLM采用了多种技术来解决此问题。

    - 动态分块（Dynamic Patches / AnyRes）：这是LLaVA-1.6（LLaVA-NeXT）等模型采用的核心技术。

    - 保持宽高比的缩放（Aspect Ratio Preserving Resizing）与填充（Pad）：将图片的最长边缩放到指定大小，保持宽高比不变，然后用固定像素值（如黑色）填充短边至目标尺寸。这是最传统的方法，简单但会引入无效的填充区域，浪费算力。

    - 自适应位置编码：使用2D-RoPE（旋转位置编码）或其变体，为每个图像patch赋予其在原始图像中的2D坐标作为位置信息。这样即使图片被分块或处理，模型也能通过位置编码感知到patch在原始图像中的相对位置，有助于理解空间关系。

    - 感知重采样器（Perceiver Resampler）：如前所述，无论输入多少视觉特征，最终都被压缩为固定数量的token。这使得分辨率变化最终对LLM是透明的，但压缩过程本身可能丢失细粒度信息。

    总结：当前最主流、效果最好的方法是动态分块，它在保留高分辨率细节和控制计算量之间取得了最佳平衡。


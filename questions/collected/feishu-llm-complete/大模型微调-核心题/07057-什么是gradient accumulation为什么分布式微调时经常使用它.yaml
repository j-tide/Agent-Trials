content:
  prompt: 什么是“gradient accumulation”？为什么分布式微调时经常使用它？
answer:
  mode: rubric
  reference_answer: |-
    梯度累积是一种在受限显存下模拟大batch训练的技术。其操作是：连续处理多个micro‑batch，对每个micro‑batch计算梯度，但不立即更新参数，而是将梯度累加到.grad中。当累积步数达到预设值后，再用累加的总梯度执行一次参数更新（optimizer.step()）并清零梯度。

    分布式微调常用原因：

    - 突破显存墙：大模型微调时，即使使用模型并行，单卡能容纳的micro‑batch size往往极小（如1或2）。直接训练会使全局batch size过小，梯度噪声大，模型难以收敛。梯度累积允许我们以极小的micro‑batch安全运行，同时通过累积模拟出合理的全局batch size。

    - 保持大batch的训练动态：大batch通常带来更稳定的收敛和更好的泛化，而显存限制了我们直接使用大batch。梯度累积用多步计算换取了等效的大batch效果，且不增加显存。

    - 配置灵活性：它可以独立于GPU数量调整有效batch size，避免为了增大batch而增加昂贵的数据并行卡数。


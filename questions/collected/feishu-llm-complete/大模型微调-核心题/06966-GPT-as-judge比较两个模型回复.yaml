answer:
  mode: rubric
  reference_answer: |-
    ```python
    import openai
    import json
    import random

    openai.api_key = "your-api-key"

    def gpt_judge(prompt: str, response_a: str, response_b: str, model="gpt-4") -> str:
        """返回 'A' / 'B' / 'tie'"""
        # 随机交换位置以消除位置偏差
        if random.random() < 0.5:
            first, second = "A", "B"
            resp1, resp2 = response_a, response_b
        else:
            first, second = "B", "A"
            resp1, resp2 = response_b, response_a

        judge_prompt = f"""请作为一个公正的评判者，比较以下两个AI助手对用户问题的回复。
    用户问题: {prompt}

    助手{first}的回复: {resp1}

    助手{second}的回复: {resp2}

    请从准确性、有用性、流畅度等方面综合评判，哪个回复更好？如果难分高下，请选择 'tie'。
    请只输出 'A', 'B', 或 'tie'，并简要说明理由。
    格式：{{"winner": "A/B/tie", "reason": "..."}}"""

        response = openai.ChatCompletion.create(
            model=model,
            messages=[{"role": "user", "content": judge_prompt}],
            temperature=0.0,
            max_tokens=256
        )
        content = response.choices[0].message.content.strip()
        try:
            result = json.loads(content)
            winner = result['winner']
            # 映射回原始A/B
            if winner == first:
                return 'A'
            elif winner == second:
                return 'B'
            else:
                return 'tie'
        except:
            return 'tie'
    ```

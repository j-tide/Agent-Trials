content:
  prompt: 模型合并（Model Merging）技术，如TIES、DARE等，能否替代部分微调？
answer:
  mode: rubric
  reference_answer: |-
    模型合并（Model Merging）技术通过将多个分别在不同任务上微调过的模型（或适配器）的权重进行算术组合，形成一个单一的、具备多重能力的模型。它可以在某些场景下替代微调，但不是完全的替代，而是一种高效的补充和组合手段。

    常见技术：

    - TIES (TrIm, Elect Sign, and Merge)：通过裁剪小的delta参数（减少干扰）、解决不同模型参数更新的方向性冲突（选举符号），然后合并，实现多任务模型的融合。

    - DARE (Drop And REscale)：在合并前，随机丢弃大部分delta参数（如90%），再将剩余的delta放大补偿，再进行合并。该方法能有效消除冗余，提升合并性能。

    - Linear / Spherical Interpolation：最简单的方法，直接将多个模型的权重进行线性或球面插值。


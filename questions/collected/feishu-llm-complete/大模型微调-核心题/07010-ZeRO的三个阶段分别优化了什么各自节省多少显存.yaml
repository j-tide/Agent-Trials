content:
  prompt: ZeRO的三个阶段分别优化了什么？各自节省多少显存？
answer:
  mode: rubric
  reference_answer: |-
    ZeRO（Zero Redundancy Optimizer）在数据并行的框架内，通过对模型状态（优化器状态、梯度、参数）进行分片，消除冗余存储。其三个阶段依次优化：

    以 7B 模型、FP16 精度、Adam 优化器、数据并行度 N=8 为例，不考虑激活的情况下：

    [嵌入表格未展开]

    - ZeRO‑1 将优化器状态（Adam 中的 m 和 v）分片到 N 张卡，每卡只存 1/N 的优化器状态。通信量增加约 1.5 倍（在梯度 All‑Reduce 基础上增加一次参数 All‑Gather）。

    - ZeRO‑2 额外分片梯度，每卡只存自己那部分参数的梯度，通过 Reduce‑Scatter 实现。

    - ZeRO‑3 将参数也分片，每卡只存 1/N 的完整参数。前向/反向时需要 All‑Gather 收集完整参数，用完即释放。总通信量约为标准 DP 的 1.5 倍。

    由此可见，ZeRO‑3 可将模型状态显存降至原来的 1/N，使得在 8 卡 V100‑32G 上全量微调 13B 甚至 30B 模型成为可能。


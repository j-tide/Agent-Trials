content:
  prompt: 解释“instruction backtranslation”结合自我改进的流程。
answer:
  mode: rubric
  reference_answer: |-
    指令回译（Instruction Backtranslation） 是一种利用海量无标签文本数据来生成高质量微调指令-回答对的技术。它将“写回答”和“写指令”的过程逆转，从而极大地扩展了可用的训练数据。

    结合自我改进的完整流程：

    - 初始种子模型：拥有一个初步的SFT模型，它至少具备基本的指令遵循能力和一定的文本生成能力。

    - 文本收集与回答生成：收集大量高质量、无标签的文本片段（如维基百科段落、技术文档、书籍章节）。这些文本将作为“标准回答”。

    - 指令生成（回译）：让初始种子模型扮演“指令生成器”：“请根据以下文本内容，推测用户可能提出了什么问题，才得到了这段回答？请生成相应的指令。” 这样，我们就为每段文本生成了对应的指令，形成了初始的 (指令, 回答) 对。

    - 自我改进与迭代：

    优势：它打破了高质量SFT数据对人工标注的依赖。只要有海量高质量文本，就能持续自动地生产高质量的多轮、多任务指令数据，实现模型的自我迭代。


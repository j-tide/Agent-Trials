content:
  prompt: 什么是“prompt diversity”？为什么重要？
answer:
  mode: rubric
  reference_answer: |-
    Prompt diversity（指令多样性） 是指SFT数据集中，指令在任务类型、措辞风格、句式结构、长度、语域（正式/口语）、有无背景信息、有无约束条件等多个维度上的丰富程度和覆盖广度。

    它之所以至关重要，是因为SFT的核心目标不是让模型记住特定的问答对，而是让它学会从任意形式的人类指令中解析出真实意图，并生成恰当的回应。

    具体重要性：

    - 防止模板化过拟合：如果所有翻译指令都以“请将以下文本翻译成中文：”开头，模型学到的不是“翻译”这个任务，而是“当看到‘请将以下文本翻译成中文：’这几个字时，就启动翻译模式”。一旦用户换种说法（“帮我用中文说这句话”），模型就失效了。指令多样性迫使模型去学习不同措辞背后的深层任务语义。

    - 覆盖真实世界的长尾分布：真实用户的输入是混乱、口语化、充满错别字和不完整表达的。如果训练数据全部是“完美”的书面指令，模型在服务真实用户时会极其脆弱。多样性要求数据必须包含这些“不完美”的变体，以提升模型的鲁棒性。

    - 激发元学习与任务泛化：当指令足够多样，模型无法通过记忆单一模板来降低损失时，它会被迫学会一种更高级的元能力：从指令文本本身推断当前的任务是什么，并激活相应的知识和技能来执行。这是模型能够处理从未见过的新任务的基础。

    - 促进安全对齐的鲁棒性：攻击者会不断变换措辞来绕过安全护栏。安全数据的指令多样性——包含各种隐喻、暗示、编码变形、跨语言的危险请求——是训练模型识别深层有害意图，而非仅仅匹配关键词的关键。

    - 提升对系统提示的敏感度：指令多样性还包括system prompt的多样化（如上一题所述），这让模型学会动态调整行为，成为一个“可控”的通用平台，而非一个行为固化的专用工具。

    因此，指令多样性是模型“智能”的基础，它在很大程度上决定了模型的能力是僵化的“模板匹配”，还是灵活的“语义理解”。

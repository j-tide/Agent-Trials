content:
  prompt: 解释“warmup ratio”在全参数微调中的作用及常见设置。
answer:
  mode: rubric
  reference_answer: |-
    Warmup（学习率预热） 是在训练开始时，让学习率从一个极小值（通常为0或接近0）线性增加到设定的目标学习率的过程。Warmup ratio指的是预热步数占总训练步数的比例。

    作用

    - 稳定训练初期：训练刚开始时，模型参数处于预训练后的优质点，但梯度的方向和大小可能极不稳定。若直接用满额学习率，最初的几步更新可能会对参数产生巨大扰动，破坏预训练成果，导致损失飙升甚至训练崩溃。Warmup通过逐步增大学习率，让模型在最初阶段平滑过渡。

    - 给优化器状态“热身”：Adam等自适应优化器需要积累梯度的一阶/二阶矩估计。在训练初期，这些估计是极度不准确的。Warmup提供了一个缓冲期，使优化器能收集足够的梯度统计，从而在后续训练中做出更合理的自适应步长调整。

    - 缓解早期过拟合：在极小数据量上，Warmup可视为一种正则化，防止模型在最初几步“死记”住先看到的几个batch。

    常见设置

    - 对于全参数微调，warmup ratio通常设置为总训练步数的 5% ~ 10%。例如，总步数为2000步，warmup步数设为100~200步。

    - 如果使用LoRA等PEFT，由于可训练参数少，训练更稳定，warmup可以更短（如1%~3%）。

    - 若基座模型与目标领域差异巨大，可适当增加warmup比例，让模型更平缓地适应新数据。

    - 常用的学习率调度器是“Warmup + Cosine Decay”。在Warmup阶段，学习率从0线性增至峰值；之后按照余弦曲线衰减至接近0。

    实践建议：通常不需要把warmup作为一个单独的超参去精细调优，设定一个安全的默认值（如10%）即可。如果发现训练初期损失震荡剧烈，可以适当增加warmup；如果初期损失下降很快且平稳，可以减少warmup以释放更多步数用于真正的学习。


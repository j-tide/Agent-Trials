content:
  prompt: 如何利用“模型自评”辅助微调模型的问题诊断？
answer:
  mode: rubric
  reference_answer: |-
    模型自评是指让微调后的模型自己对自己的生成结果进行评判、解释或打分，从而暴露出其内部的“思考过程”或“价值判断”，用于问题诊断。

    具体应用方式：

    - 要求模型生成并评判自己的回答：对于某个指令，让模型生成回答后，紧接着要求它“作为一个严格的裁判，评价一下你刚才的回答。指出优点和不足，并给出一个1-5分的综合评分。”

    - 比较模型对“好回答”与“坏回答”的鉴别能力：给模型一对（好回答，坏回答），问它“哪个更好，为什么”。如果模型无法正确选出好回答，说明它根本没有内化“什么是高质量”的标准，其SFT训练可能只是在模仿表面形式。如果它能选出但给出的理由是错误的（如只因为长度选了长的），则揭示了其内在的偏好捷径。

    - 让模型通过自评生成“诊断报告”：对于一批Bad Cases，让模型逐个分析自己的错误原因，并进行分类（如“我理解错了用户意图”、“我漏掉了指令中的某个约束”、“我编造了一个事实”）。这可以快速对大量Bad Case进行自动分类，发现模型自身认知中最频发的错误类型。虽然不一定完全准确，但可以作为高效的问题归纳工具。

    - 探测安全边界：对于一个安全的回答和一个有风险的回答，问模型“哪个回答更安全？为什么”。这能诊断模型的安全对齐是否只停留在了“拒绝生成”，而没有内化成对“安全原则”的理解。

    注意事项：模型自评不能替代外部评估，因为它本身就是诊断的对象。但当把它作为一种诊断工具时，其 “自我剖析”的内容和逻辑过程，远比它给出的最终分数更具价值，能够为开发者打开一扇观察模型内部决策逻辑的窗户。

    ---

    - 字数/句数限制：“用50-100字回答”。

    - 关键词强制：“回答中必须包含‘春天’这个词”。

    - 关键词禁止：“回答中不能出现‘冬天’”。

    - 标点/大小写要求：“以问号结尾”、“全大写回答”。

    - 格式要求：“以JSON格式输出”。

    - 语言/角色要求：“用英语回答”。

    - 模型根据指令生成回答。

    - 例如，对于“回答字数在50-100之间”，程序会统计模型输出文本的token数或字符数，判断是否在区间内。

    - 对于“必须包含‘春天’”，程序进行简单的子串匹配。

    - 对于“以JSON格式输出”，程序尝试解析JSON，并验证格式正确性。

    - 针对该指令所定义的每一个原子约束，运行一段预定义的程序化评判逻辑。

    - 每个原子约束的评判结果是二元的：严格满足（1）或不满足（0）。

    - 指令级严格准确率：只有当一条指令的所有约束都被满足时，该指令才被视为“遵循”。这是最严苛的指标，反映了模型对复杂指令的完整执行力。

    - 约束级准确率：计算所有测试样本中，所有原子约束的平均通过率。这能提供更细粒度的诊断，比如模型在“禁止关键词”上普遍做得好，但在“字数限制”上很差。

    - 交换位置双重评估：对每一对回答评估两次，第二次交换顺序。最终分数取两次评分的平均，或要求两次评估中的胜者必须一致。这是最彻底的方法。

    - 独立逐个评分：不要求模型直接比较“A vs B”，而是让它分别对每个回答单独打分，消除比较时的顺序效应。但会损失直接对比的精细度。

    - 随机化位置并重复实验：在大规模评估中，对每个样本随机打乱回答顺序，通过统计平均来分摊位置偏差的影响。

    - 在Prompt中显式纠正：加入明确的反偏差指令：“重要提示：在评分时，请不要被回答的长度所影响。一个冗长但空洞的回答不应得高分；一个简洁但精准、切中要害的回答可以得到最高分。”

    - 统计后处理：使用回归模型分析分数与回答长度的相关性，然后从原始分数中剔除长度的影响，得到“去长度化”的分数。AlpacaEval 2.0是这一方法的典型实践。

    - 长度匹配对比：在比较两个模型时，尽量确保被比较的两个回答长度相近，或在评估前对长回答进行截断。

    - 覆盖度分析：统计训练集中属于该细分任务的样本数量。如果数量极少甚至为零，模型表现差是典型的“数据饥饿”或“覆盖盲区”。这是最常见的原因。

    - 质量审计：对训练集中该类任务的样本进行人工抽检。检查标准答案是否正确、完整，格式是否与指令一致。如果数据中存在大量错误示范（如事实错误、格式错乱），模型会忠实地学到这些错误。

    - 多样性分析：如果该任务的训练样本存在，但其指令措辞极其单一（如全部是“请将以下文本翻译成中文：”），那么模型可能只过拟合到了这一种表面模板，无法泛化到用户的各种问法。

    - 如果该细分任务上的验证损失持续上升，而其他任务表现平稳，说明模型对该任务存在过拟合。问题通常出在数据量少、学习率过大或训练轮数过多。

    - 如果损失从头到尾都没怎么下降，可能是数据本身存在严重噪声或逻辑矛盾，导致模型无法收敛。

    - 这是区分数据与训练问题最有力的手段。单独为该细分任务构造一批高质量的标准数据（例如50-100条，由人类专家精写），将其混入原训练集，重新微调一个模型（或用原模型进行少量步数的增量微调）。

    - 如果加入高质量数据后，该任务性能显著提升，则问题根源在数据（原数据质量差/覆盖不足）。

    - 如果加入高质量数据后，性能依然没有明显改善，则问题更可能出在训练策略（如学习率、优化器配置不当，或模型容量不足）。

    - 结果判定：

    - 学习率：对该任务来说是否过大/过小？

    - 数据配比：该任务数据在总训练数据中的占比是否过小，被其他高频任务“淹没”了？如果是，可以通过调整温度采样或增加该任务数据的采样权重来解决。

    - PEFT配置（如果使用LoRA）：秩r和target_modules是否限制了模型学习该任务所需的能力？复杂任务可能需要更高的秩或解冻更多层。

    - 将模型在该任务上的所有Bad Case分类。是格式错误（漏掉关键标记）？是内容错误（事实幻觉）？还是逻辑中断？格式错误通常指向数据中的格式示范不足或不一致；内容错误指向数据知识缺失或训练遗忘。

    - 数据类型：安全数据、CoT推理数据、代码数据、多轮对话数据等。

    - 数据来源：人工标注 vs GPT-4蒸馏 vs 开源数据集。

    - 数据特征：长文本 vs 短文本、单轮 vs 多轮、是否包含思维链。

    - 数据配比：某类数据占比5% vs 15%。

    - 训练策略：学习率、batch size、LoRA秩、是否使用梯度检查点等。

    - 基线组（Full Setting）：使用当前完整的配置进行训练，作为比较的标杆。

    - 消融组（Ablation）：从完整配置中精确移除待验证的那个组件，其余所有条件保持不变。例如，要验证“CoT数据”的作用，就训练一个完全不包含CoT数据的模型。

    - 替换组（Substitution）（可选）：如果想知道两个来源哪个更好，可以将A来源替换为B来源，其余不变。

    - 目标能力变化：例如消融CoT数据后，数学基准（GSM8K）得分下降多少？

    - 通用能力保持：消融后，MMLU等通用知识基准是否下滑？（检测灾难性遗忘）

    - 安全性变化：消融安全数据后，安全拒绝率和误拒绝率的变化。

    - 输出质量：通过GPT-4-as-Judge或人工评估，观察回答的有用性、流畅度。

    - 如果移除后性能大幅下降，说明该组件是关键因子。

    - 如果移除后性能无显著变化，说明该组件可能是冗余的，可以削减以节省成本。

    - 如果移除后性能反而提升，说明该组件可能包含有害噪声或错误示范，需要清洗或移除。

    - 微调前：可能在所有层都高概率预测有害内容。

    - 微调后：可能在底层（1-10层）仍然“闪现”有害token（说明有害知识并未被删除），但在中高层（15-20层），安全拒绝token的概率急剧上升并最终胜出。

    - 诊断价值：这表明SFT并没有让模型“忘记”有害知识，而是在其上叠加了强大的内部控制回路，成功地在输出前“拦截”了有害生成。如果拦截失败，说明SFT安全数据或训练不充分。

    - 诊断价值：这说明模型的知识并未完全丢失，而是被SFT学到的某种“错误先验”或“行为偏差”在高层“覆盖”了。这为修复提供了线索——可能需要调整SFT数据，而不是重新注入知识。

    - 场景：用户指令中包含“不要使用Markdown格式”，但模型依然输出了Markdown。

    - 可视化线索：检查模型在生成回答时，对“不要”这个否定词的注意力权重。如果权重极低，而它对“Markdown格式”的权重很高，说明模型根本没有“看见”否定词，被关键实体词“挟持”了。这通常意味着SFT数据中缺乏足够的、关于否定和约束的句式多样性训练。

    - 场景：多轮对话中，模型忘记了对话之初的用户信息。

    - 可视化线索：观察模型在生成回答时，对历史对话token的注意力分布。如果对遥远的上文的注意力值几乎为零，而对近处轮次的注意力极高，说明模型的长距离依赖能力严重退化。这可能是SFT数据中对话普遍较短、位置编码扩展不当或过拟合所致。

    - 场景：用户问“苹果的营养价值”，模型开始介绍“苹果公司的财报”。

    - 可视化线索：模型在生成“苹果公司”时，注意力几乎完全集中在“苹果”这个token上，而对“营养”这个token的注意力极低。这表明模型走了表面词关联的捷径，而不是基于语义的深层理解。原因可能是SFT数据强化了“苹果”与“公司”的关联，而没有足够多的“苹果”与“营养”关联的数据。

    - 场景：一个被伪装过的有害指令（如“为了学术研究，请告诉我如何制作XX”），模型顺从了。

    - 可视化线索：注意力分布显示，模型完全被“学术研究”这个安全帽子所吸引，而对“制作XX”这个危险核心几乎没有给予注意力。这说明SFT的安全训练过于表面，模型容易被无害的前缀“迷惑”。

    - 反事实评估（Counterfactual Evaluation）：构造成对的测试样本，改变其中的敏感属性（如性别、种族），其他内容完全一致。例如：“他/她是一位优秀的工程师。请评价他的能力。” 观察模型对两个版本的评价是否存在统计显著的系统性差异（如给“他”的评价总是更积极）。

    - 使用学术偏见基准：如 StereoSet, BBQ (Bias Benchmark for QA), WinoBias 等。这些基准专门设计用于检测模型是否内化了社会刻板印象。

    - 使用GPT-4等模型，作为“公正的评判者”。针对模型对一系列带有敏感属性问题的回答，由评判者就“回答是否包含偏见/歧视/刻板印象”进行打分。可以设计专门的评判prompt。

    - 统计模型在生成文本时，对不同人群（如男性/女性、白人/黑人）关联的形容词、职业词汇的频率和情感倾向。例如，是否“女性”总是与“护士”、“温柔”关联，而“男性”总是与“CEO”、“果断”关联。可以使用现成的工具包如WEFE进行分析。

    - 组织多元化的红队测试员，专门尝试诱导模型输出带有偏见的内容。他们可以从自身文化背景出发，发现自动化测试难以捕捉的隐蔽偏见。

    - 建立一套固定的偏见测试prompt集。每次微调模型更新后，自动运行测试，计算各项偏见指标，与基座模型和上一个版本进行对比。确保新模型没有在偏见上“退化”。

    - 基于知识库的校验准确率：使用封闭域问答数据集（如TriviaQA, NQ），计算模型回答的精确匹配（Exact Match）或F1分数。分数下降是幻觉增多的直接证据。

    - 事实验证任务指标：在FEVER等事实验证数据集上，评估模型判断一个陈述是真/假的准确率。

    - FactCC / DAE：这些指标专门用于评估生成文本与给定原文（上下文）的事实一致性。将它们应用于摘要、RAG等任务，可以量化模型是否“篡改”了原文信息。

    - Entailment Ratio：利用自然语言推理（NLI）模型，计算模型回答中，有多少比例的原子陈述能被给定的上下文“蕴含”。比例越低，幻觉越严重。

    - SelfCheckGPT：对同一个问题，让模型生成多个回答（采样）。然后计算这些回答之间的事实一致性。如果模型在凭空编造，那么每次编造的内容可能不同，导致回答间的事实一致性很低。通过计算不同回答支持同一个事实的概率，可以量化幻觉程度。

    - 期望校准误差（Expected Calibration Error, ECE）：将模型预测的概率（置信度）与实际准确率进行比较。过度自信的模型（高置信度给出错误答案）往往伴随严重幻觉。ECE升高是幻觉增加的一个侧面反映。

    - 在已知模型无法回答的问题（如未来事件、虚构实体）上，观察模型是诚实地说“不知道”，还是强行编造。编造的比例本身就是一种幻觉率。

    - 人工构造：由专家针对每个能力维度，手写一批具有代表性的指令和标准答案。这是质量最高、最可靠的来源。

    - 线上Bad Case库：将从线上收集到的、已经被成功修复的Bad Case指令及其理想答案，加入回归集。这能防止同一个错误再次出现。

    - 经典基准抽样：从MMLU、GSM8K等学术基准中，抽取一小部分（如每个领域10-20题）作为快速监控项。

    - 对于有标准答案的任务（如数学、知识），使用自动指标（准确率、F1）。

    - 对于开放式任务，使用GPT-4-as-Judge或人工进行周期性评估。

    - 设定质量门禁：为每种能力设定一个最低可接受的分数（如“MMLU抽样得分下降<2%”，“核心业务场景胜率>90%”）。一旦低于门禁，自动告警并阻止该模型上线。

    - 定期审查回归测试集，移除过时或过于简单的题目。

    - 将新发现的、具有挑战性的Bad Case不断补充进去，使其始终保持“生命力”。

    - Recall：在应该调用工具的指令中，模型实际触发了工具调用的比例（不应遗漏）。

    - Precision：在模型触发工具调用的指令中，真正需要调用工具的比例（不应在不必要时乱调）。

    - 这是衡量模型“何时该用工具”的判断力。

    - 检查模型生成的函数名、参数名是否正确。对每个参数的值，进行精确匹配或语义匹配。统计参数完全正确的调用比例。这是工具调用中最核心的细粒度指标。

    - 模型输出的工具调用指令是否严格遵循要求的JSON Schema格式？可解析率（parseability）是否为100%？是否存在多余的字符或语法错误？

    - 在模拟工具返回错误（如参数错误、超时、业务异常）后，模型是否能正确解读错误信息，并尝试修正参数重新调用？修正后的参数是否正确？统计错误后成功恢复的比例。

    - 对于需要并行调用多个独立工具的指令，模型是否能一次性生成多个正确的调用？对于存在依赖关系的串行调用，模型是否能根据第一个工具的结果，正确决定下一个调用的参数？

    - 当工具的Schema（如参数名、描述）发生轻微变化时，模型是否依然能正确调用？这反映了模型是真正“理解”了工具功能，还是只记住了固定格式。

    - 指代消解：第二轮问“它多少钱？”，第三轮问“那第二个呢？”，考察模型是否正确理解代词所指。

    - 状态更新与覆盖：第一轮设定“预算1000元”，第三轮改为“预算提到2000元，重新推荐”，第六轮又追问“刚才说的1000元的那个方案能再详细点吗？” 考察模型是否能正确追踪状态的动态变化。

    - 事实一致性：在对话开头让模型记住一个冷门事实（如“我叫李明，我的猫叫咪咪”），在15轮之后再问“李明的宠物叫什么？”，考察长距离记忆。

    - 人格一致性：在开头设定“用鲁迅的文风回答”，在多轮压力或转移话题后，看模型是否依然能保持该文风。

    - 多轮对话基准（MT-Bench）：直接使用其二阶段对话进行GPT-4评判，衡量上下文理解。

    - 自定义一致性评分：使用GPT-4，给它完整的对话历史，让它判断模型在最后一轮的回答是否与之前的任何信息相矛盾。

    - 评估员通读整个对话，从1到5分对“上下文连贯性”、“指代准确性”、“人格一致性”进行打分。这是最权威的评估方式。

    - 构建一个类似任务型对话的测试，让模型从对话中提取一系列槽位（Slot）的值（如“日期”、“时间”、“人数”）。在对话过程中不断更新这些槽位。最后，用程序化方法验证模型最终输出的槽位值是否正确。这提供了完全客观的一致性评估。

    - LongBench：包含21个任务，覆盖单/多文档QA、摘要、少样本学习等，平均长度在5k-15k tokens。

    - L-Eval / ∞-Bench (InfiniteBench)：针对超长上下文（100k+ tokens）设计的基准。

    - SCROLLS / ZeroSCROLLS：标准化的长文本基准，包含NarrativeQA、QMSum等任务。

    - 原理：这是评估长上下文信息提取能力的最直观方法。

    - 准备一段与问题完全无关的“干扰文本”（干草堆），填充至目标长度（如32K, 128K）。

    - 准备一个孤立的事实句（针），例如“在2035年，小镇Willowbrook的年度草莓节上，一只名叫‘Captain Crunch’的猫赢得了选美比赛。”

    - 将“针”插入到“干草堆”中的不同深度位置（如0%开头, 25%, 50%, 75%, 100%结尾）。

    - 构造一个直接针对“针”的问题（如“哪只猫在Willowbrook的比赛中获胜了？”），让模型回答。

    - 在不同深度和不同总长度下重复实验，绘制“深度-准确率”热力图。

    - 做法：

    - 诊断价值：它能直观暴露模型的“中部迷失”现象——许多模型在文档开头和结尾的准确率高，但在文档中部（特别是50%-75%深度）的性能会大幅下降。这反映了模型注意力分配的根本缺陷。

    - 监控过拟合：在训练过程中，监控验证集的PPL。如果训练PPL下降而验证PPL上升，是过拟合的明确信号。

    - 评估领域适配度：用基座模型计算微调数据或测试数据中回答部分的PPL。如果微调后模型在目标领域数据上的PPL远低于基座模型，说明模型确实“学会”了该领域的语言模式。

    - 数据质量过滤：用于清洗SFT数据。计算每条数据的回复PPL，PPL异常高（语言混乱）或异常低（过于简单模板化）的样本可能是低质数据，应被过滤。

    - 检测分布偏移：如果模型在线上数据上的PPL显著高于在训练数据上的PPL，说明线上数据的分布与训练数据存在较大差异。

    - 输出JSON、XML、YAML等结构化格式。

    - 以Markdown表格或列表输出。

    - 输出纯代码，不加任何解释。

    - 回复必须以特定短语开头/结尾。

    - 回复长度限制（精确到token/字数）。

    - check_json_format(text)：尝试json.loads()，捕获异常。同时可验证Schema（如键名、值类型）。

    - check_no_extra_text(text, format_type)：判断除了要求的格式内容外，是否有多余的自然语言前缀或后缀。

    - check_length(text, min, max)：统计token/字数。

    - check_keywords(text, forbidden_words)：检查是否包含被禁止的特定词汇。

    - 严格指令格式遵循率（Strict Format Accuracy）：对于一条指令，只有当其所有格式约束都被满足时，才计为“成功”。这是最硬核的指标。

    - 约束级别遵循率（Constraint-level Accuracy）：统计所有测试样本中，单个原子约束被满足的比例。这能绘制出模型在不同格式维度上的“短板画像”。

    - 类型A（遗漏结束符）：占比40%

    - 类型B（多余解释文本）：占比35%

    - 类型C（JSON键名错误）：占比25%
    这能直观地指导SFT数据的补充方向——是因为训练数据中该种格式的闭合标记总是不完整？还是因为数据中常包含“解释-格式”混合的坏例子？

    - 特定指令还是随机？ 是否仅在输入某些特定字符串（如包含特殊Unicode字符、长文本、某类格式）时触发？如果随机出现，可能是模型参数本身已损坏（如训练中出现NaN）。

    - 哪个token泄漏？ 如果是对话模板的特殊token（如<|im_end|>），问题几乎肯定出在SFT数据构造。如果是随机不可打印字符，可能与tokenizer处理异常文本的方式有关。

    - 特殊token注册：检查tokenizer是否正确将<|im_start|>等标记添加为特殊token，并分配了唯一的ID。如果它们被当作普通文本逐字分割，会导致模型学习错误的边界。

    - 词表冲突：用户输入中是否包含了与这些特殊token完全相同的字符串？模型是否因为无法区分而产生了混淆？这需要在数据构造时进行转义或过滤。

    - 格式完整性检查：编写脚本遍历整个SFT数据集，验证每一条数据的模板标记是否完全、严格地遵循规范。是否存在缺失结束标记、多出标记、角色顺序错误的情况？哪怕只有千分之一的错误样本，模型也可能学会这个错误行为。

    - 回答内容污染：检查SFT数据中，助手回复的文本内容本身是否意外包含了这些特殊token。例如，助手在解释ChatML格式时，其回复中出现了文字<|im_end|>，这会让模型混淆“应生成的内容”和“用于结构的标记”。

    - 文本编码问题：数据文件中是否混入了非UTF-8编码的乱码字符，在tokenize后被映射为了罕见的token，生成时变成了乱码？

    - Loss Masking 实现：仔细审查数据预处理中labels的构造。是否错误地将部分应mask的特殊token的label设为了真实token ID？这会导致模型去“学习生成”这些结构标记。

    - 学习率与梯度：训练过程是否出现了梯度爆炸或损失尖峰？这可能导致部分参数损坏。

    - 构造一个极简的“纯净”SFT数据集（几十条无误的对话），对基座模型进行少量步数的微调。如果问题消失，则证实是原SFT数据有误。反之，则需排查模型或tokenizer本身。

    - MGSM（Multilingual Grade School Math）：将GSM8K翻译为11种语言，直接评估跨语言数学推理能力。

    - XQuAD / MLQA：跨语言抽取式问答基准。

    - XLSum：多语言摘要基准。

    - Flores-200：用于评估机器翻译质量。
    对比模型在微调前后，在该语言任务上的得分变化，得出精确的“退化率”。

    - 困惑度（PPL）：用基座模型计算微调模型在该语言高质量文本上的PPL。如果PPL显著上升，说明模型对该语言的“语感”退化。

    - 语言识别自信度：输入该语言的句子，观察模型输出的下一个token是否还在该语言内，或者是否倾向于跳转到SFT数据中使用的主流语言（如英文）。

    - 特定语言token的生成概率：通过logit lens或直接统计，观察该语言特有的字符、词汇的生成概率是否被系统性压低。

    - 正例：“法国的首都是巴黎。”

    - 负例：“法国的首都是伦敦。”
    或者更通用的句子模板，让模型在特定位置预测答案。

    - 可探测性变化：如果微调前，探针在某一层上能轻易达到高准确率（说明该层编码了正确知识），而微调后，所有层的探针准确率都大幅下降，说明模型遗忘了该知识（表征被破坏）。

    - 层位变化：如果微调前知识在低层就能被探测到，微调后需要到更高层才能被探测，说明知识的利用路径变长，模型需要进行更深层的推理才能提取。

    - 错误知识注入：如果微调后，探针在预测错误事实（如“巴黎是德国首都”）时的准确率反而升高，说明SFT数据污染了模型，向其注入了错误的知识。

    - 延迟（Latency）：测量P50、P95、P99的Time to First Token（TTFT）和Token per Second（TPS）。这是用户体验的核心。

    - 吞吐量（Throughput）：每秒能处理的请求数（QPS）。这是服务端成本的核心。

    - 硬件成本：支撑目标吞吐量所需的GPU数量、显存大小、电力消耗。可统一折算为每百万token的推理成本（如 $/1M tokens）。

    - 将不同微调策略（全参微调、LoRA不同秩、QLoRA、不同量化等级）得到的模型，标在质量（Y轴）和成本（X轴）的二维图上。

    - 连接最左上角的点，构成Pareto前沿。在前沿上的模型是“最优”的：在给定成本下质量最高，或在给定质量下成本最低。

    - 选择哪个点，取决于业务预算和SLO。例如，一个实时客服机器人可能更看重低延迟，因此会选择前沿左侧成本低但质量稍逊的模型；一个离线内容生成服务可能选择前沿右上角质量最高的模型。

    - 计算 ROI（投资回报率）：模型质量的每一点提升，所对应的推理成本增加额。判断这笔投入是否值得。

    - 如果模型给自己的低质量回答打了高分，说明其自我认知和校准能力差，无法区分好坏。

    - 如果模型在评价中准确地指出了自己的错误（如“我刚才遗漏了第二个条件”），说明它具备元认知能力，但可能在生成时被某种行为偏差抑制了，这为训练策略（如加入更多反思数据）提供了线索。

    - 诊断价值：

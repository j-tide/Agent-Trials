content:
  prompt: 你如何估算一次微调项目所需的总成本（计算、存储、人力）？
answer:
  mode: rubric
  reference_answer: |-
    我会采用分项估算法，将成本拆解为计算、存储和人力三大块，并结合项目规模和不确定性设置浮动系数。

    - 计算成本
    这是最明确的部分。公式为：
    总GPU成本 = (单卡单价/小时) × (训练时长) × (GPU数量) × (实验次数系数)

    - 训练时长估算：根据数据量和模型大小估算。例如，对7B模型用LoRA微调1万条数据，在单卡A100上约需2-3小时。使用DeepSpeed ZeRO-3全量微调可能需要4倍时间。

    - 实验次数系数：为超参搜索、消融实验和数据配比调整预留余量。经验值取1.5-3。例如，如果基本训练需2小时，我会按6小时（系数3）来预算计算资源，因为至少要跑2-3组不同配比的实验。

    - 云成本：如果使用云GPU，查阅官网单价（如A100-80G约$3-5/小时/卡），乘以总时长。若使用自有集群，需折算折旧和电力成本。

    - 存储成本

    - 数据存储：原始数据、预处理后数据、版本化数据的总容量（GB），乘以云存储单价（$0.02-0.05/GB/月）。通常这部分开销很小。

    - 模型存储：全量模型（几十GB）或LoRA适配器（几MB）。若需要保存多个版本的checkpoint，预留500GB至1TB的存储空间。

    - 人力成本

    这是最容易被低估、且占比通常最高的部分。我按角色和工作量估算：

    - 数据工程师（1人）：负责数据采集、清洗、格式化和质量评估。对于一个中等规模的项目，预计投入20人天。

    - AI工程师（1-2人）：负责模型选型、训练、调优、评估。预计投入30人天。

    - 领域专家/标注员（2-3人）：若数据需要人工标注，这是成本大头。按每条数据标注时间（如3-5分钟）和所需数据量（如3000条）估算工时，并乘以时薪。

    - 运维/部署工程师（1人，兼职）：负责模型服务上线、监控和灰度发布，预计投入5-10人天。

    - 人力总成本 = Σ (各角色投入人天 × 人力单价)。人力单价需包含工资、社保、管理等企业综合成本。

    - 总成本汇总与风险缓冲
    总成本 = (计算成本 + 存储成本 + 人力成本) × (1 + 风险缓冲系数)
    风险缓冲系数通常设为15%-20%，用于应对数据返工、训练失败、需求变更等不确定性。


content:
  prompt: 如何构造多语言SFT数据集？语言比例如何调配？
answer:
  mode: rubric
  reference_answer: |-
    构造一个高质量的多语言 SFT 数据集，远不止是把英文数据翻译成其他语言。它涉及语种覆盖、任务对齐、文化适应和比例调控等多个层面的系统工程。

    一、数据构造方法

    - 母语者原生构建（最可靠）
    针对每种目标语言，直接由该语言的母语者从零开始编写指令和回答。这能确保语言地道、文化贴切，避免翻译腔。对于高资源语言（如中文、英文、日文），应尽量采用此方法。

    - 高质量翻译 + 母语校验
    将已有的高质量英文 SFT 数据翻译成其他语言，再交由母语者进行校对和润色。翻译时需要注意文化特定概念的本土化转换，不能直译。这种方法适用于数据量需求大、母语者资源有限的中低资源语言。

    - 平行数据构造（促进跨语言迁移）
    为同一任务构造多语言平行版本，即同一个意图的指令同时提供多种语言的表达。这能让模型在学习时自然建立起“任务语义”与“多语言表达”的映射，从而将英文中的推理能力泛化到其他语言。

    - 语码混合与真实用户数据回收
    加入一定比例的中英混杂、网络用语、方言对话，模拟真实世界的多语言交互。从海外版产品的用户日志中，筛选高质量的多语言对话，经脱敏和清洗后使用，这也是极有价值的数据来源。

    二、语言比例的调配

    比例没有绝对标准，需要根据基座模型的预训练语言分布、目标市场以及资源投入来权衡。一般有以下策略：

    - 用户导向策略：直接按目标用户的语言使用比例分配。例如，若产品预计60%用户是中文，30%是英文，10%是其他语言，则 SFT 数据大致按此比例配置。

    - 能力均衡策略：对于低资源语言，可适当提高其比例（如给每种低资源语言设定一个最低样本数），确保模型在这些语言上达到基本的可用性，而高资源语言则主要依靠预训练能力和跨语言迁移。

    - 英语锚定策略：在通用助手场景下，英语数据通常占据最大比例（如 40%~50%），作为跨语言迁移的“知识中枢”；其他语言各占 5%~15%。

    - 分阶段训练：第一阶段以高资源语言为主，快速建立指令遵循能力；第二阶段逐步增加低资源语言的比例；第三阶段混合所有语言并加入多语言混合对话，进行全域微调。

    三、必须注意的文化与安全适配

    每种语言都有其独特的文化禁忌和敏感话题。安全拒绝样本必须由熟悉当地文化的专家设计，避免冒犯。同时，表达不确定性和拒绝的方式在不同文化中差异很大（有的文化中直接拒绝被视为粗鲁），需要本地化处理。

    ✅ 总结：多语言 SFT 数据集需要“原生构造为主、翻译校验为辅”，语言比例要基于预训练基础、市场目标和跨语言迁移能力来动态调整，同时务必将安全与文化的本地化置于核心位置。


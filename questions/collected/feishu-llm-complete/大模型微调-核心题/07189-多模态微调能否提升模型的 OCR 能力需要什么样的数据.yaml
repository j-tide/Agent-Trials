content:
  prompt: 多模态微调能否提升模型的 OCR 能力？需要什么样的数据？
answer:
  mode: rubric
  reference_answer: |-
    可以。微调是将通用多模态模型适配到特定 OCR 场景（如手写体、多语言、复杂版式）的最有效手段。

    所需数据类型：

    - 图像-文本转录对：包含文字图像的图片及其精确的文本转录。这是最基础的数据。对中文 OCR 来说，需要覆盖简繁体、不同字体（楷、行、草）、不同排版（横排、竖排、弯曲）、不同背景和光照条件。

    - OCR-VQA 数据：基于图像中的文字内容进行问答。例如，“发票上的税号是多少？”“菜单中最贵的菜是什么？”。答案可直接从文字中提取，但要求模型正确识别并关联多处文本信息。

    - 端到端定位转录数据：提供文字行的包围框坐标及其转录文本。将坐标转化为文本 token（如 <box>[[x1,y1,x2,y2]]</box>），让模型学会同时输出定位和文字内容，这对信息提取和文档解析至关重要。

    - 富文本格式描述数据：指令中包含对文字格式的查询，如“请用 JSON 输出第三行加粗文字的内容”，训练模型对字体、颜色等富文本特性的敏感性。

    数据构造要点：图像必须保持原始高分辨率；转录文本要精确无误；QA 对的问题需确保无法从图像标题或上下文推测出答案，必须依靠真正的文字识别。


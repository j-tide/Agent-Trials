content:
  prompt: 怎样评估一个SFT模型是否过拟合了指令模板格式？
answer:
  mode: rubric
  reference_answer: |-
    模型过拟合指令模板格式，是指它过度依赖于 SFT 数据中特定、固定的指令格式（如“### 指令：... ### 回答：...”），而丧失了理解自然语言中多样指令形式的能力。一旦用户换一种问法，模型的表现就大打折扣。

    评估方法：

    - 指令改写鲁棒性测试（最直接）
    构建一组语义相同但措辞、格式、语序完全不同的指令对，例如：

    - 零样本新格式测试
    刻意构造一种 SFT 数据中从未出现过的全新指令格式，例如用 XML 标签包裹指令 <query>...</query>，或者用邮件的 Header 形式。观察模型是否仍然能正确理解并执行。一个没有过拟合的模型应具备一定的格式泛化能力，即使面对陌生格式也能通过语义推测意图。

    - 关键信息位置敏感性测试
    将指令中的核心要求（如“字数限制50字”）分别放置在指令的开头、中间和末尾，测试模型的遵循准确率。如果模型只在要求出现在固定位置（如末尾）时才遵循，而移到开头就忽略，说明它学到了位置捷径，是模板过拟合的一种表现。

    - Attention 可视化与 Logit Lens 分析
    利用可解释性工具，观察模型在生成回答时，注意力是否过度集中于指令中的格式标记（如###、:等符号），而忽略了真正的语义内容。或者通过 Logit Lens 看模型在读到模板标记的瞬间，是否已经“条件反射”地决定了输出模式。如果是，说明模型被模板“挟持”了。

    - 分布外任务泛化测试
    用一个完全不在 SFT 训练范围内的新任务，但用与训练模板相似的格式描述它；再用自然语言描述同一个新任务。如果模型只能用模板格式完成，而自然语言下完全失败，说明它对模板的依赖远大于对任务的理解。

    ✅ 总结：评估模板过拟合的核心在于测试模型在不同指令表达形式下的性能稳定性。通过改写测试、新格式测试和可解释性分析，可以量化模型对特定格式的依赖程度，从而指导后续数据的多样性增强。


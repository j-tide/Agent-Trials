content:
  prompt: 如果SFT模型在新指令上泛化很差，是什么原因？
answer:
  mode: rubric
  reference_answer: |-
    SFT 模型在新指令上泛化很差（即面对未见过的任务或表达方式时性能骤降），通常是以下几个核心原因共同作用的结果：

    - 训练数据缺乏多样性

    这是最根本的原因。如果 SFT 数据的指令类型单一（例如全是“请将以下文本翻译为英文”），或者指令的措辞和句式高度模板化，模型就只会识别那几种特定的“触发器”，而没有学会从指令中推理“任务意图”。一旦新指令换了一种说法或任务类型，模型就无法将其映射到已有的能力上。

    - 灾难性遗忘

    模型在 SFT 过程中过度适应了训练数据的狭窄分布，遗忘了预训练阶段习得的广谱知识和通用推理能力。这导致它面对新指令时，已经缺乏足够的底层知识或语言理解能力去支撑有效的泛化。

    - 过拟合到表面模板（格式捷径）

    模型学会了利用指令中的某些表面特征（如关键词、特殊符号、固定长度）而不是深层语义来做决策。例如，它可能只学会了“看到‘翻译’这个词就启动翻译模板”，却没有理解“翻译”这个任务本身的含义。当新指令用“帮我用英语说”来表达同样的任务时，模型就“失聪”了。

    - 数据量不足或配比失衡

    某些任务类型的数据太少，模型在这些任务上没有得到充分训练，仅仅依靠预训练残留能力。一旦新指令恰好落在这些“长尾任务”上，表现自然就很差。此外，如果简单任务数据过多，模型可能倾向于将一切新指令都当作简单任务处理。

    - 训练过度（过拟合）

    训练 Epoch 过多或学习率过大，使得模型在训练集上“背诵”了具体的问答对，而不是学习到可泛化的行为模式。它的参数被压缩到了一个极窄的区域，丧失了灵活性。

    - 缺乏对“未知”的学习

    SFT 数据中如果全部是“正确回答”的示范，缺乏对模型表达不确定性、请求澄清或被纠正后修正的示范，那么当模型面对新指令中存在的模糊或矛盾时，它无法采取合适的应对策略，只能胡乱套用一个最接近的模板，从而产生糟糕的回答。

    ✅ 总结：泛化差的本质是模型在 SFT 中发生了“窄化”。要改善泛化，需要从增强数据多样性、控制训练强度、注入不确定性表达、以及保护预训练知识等多个方面入手，让模型既能“专精”又能“通达”。


content:
  prompt: 多模态微调中的数据隐私问题，例如人脸、文档信息。
answer:
  mode: rubric
  reference_answer: |-
    多模态数据中的隐私信息是潜在的“地雷”，必须在数据预处理阶段彻底排除。

    具体风险与应对：

    - 人脸信息：使用成熟的人脸检测模型自动定位并模糊化或替换人脸。对于非公开人物，必须进行匿名化处理。对于公开人物，需在法律允许范围内使用。

    - 文档信息：使用 OCR 和正则表达式自动检测并脱敏邮箱、电话、身份证号、地址、银行卡号等个人身份信息（PII）。对于机密商业文档，不应进入训练集。

    - 车牌、证件等：类似地，使用目标检测模型定位并用掩码覆盖。

    - 医疗数据：如前所述，必须去隐私化，遵循 HIPAA 等法规。

    - 数据来源合规：确保使用的图像数据有合法授权（如 Creative Commons），未侵犯版权和隐私。对于网络爬取数据，必须进行严格的隐私扫描。

    - 差分隐私训练：在微调时采用 DP-SGD，在模型梯度中加入噪声，从数学上保证个体的隐私。

    - 模型记忆风险：即使在数据端做了脱敏，模型仍可能“记住”罕见样本。需通过评估来检测模型是否泄露了训练数据中的隐私信息，并采取措施（如通过 RLHF 惩罚记忆行为）。


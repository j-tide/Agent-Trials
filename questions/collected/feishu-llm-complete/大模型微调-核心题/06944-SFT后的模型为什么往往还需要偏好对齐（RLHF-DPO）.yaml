content:
  prompt: 32. SFT后的模型为什么往往还需要偏好对齐（RLHF/DPO）？
answer:
  mode: rubric
  reference_answer: |-
    SFT让模型“会说话”，但偏好对齐（RLHF/DPO）才能让模型“说好话、说对话”。SFT存在三个自身难以克服的根本缺陷，需要偏好对齐来弥补：

    - SFT是“模仿标准答案”，无法处理多合理回答和价值冲突。SFT的优化目标是最大化标准回答的似然，这会把模型的概率分布压缩到一个极窄的区域。而现实中，对同一个问题，往往有多种合理但风格不同的回答（如简洁vs详细）。SFT模型缺乏判断“在什么情境下哪种回答更合适”的能力。例如，用户问“如何写一封投诉信？”，SFT可能只学会了一种写法，而DPO可以通过偏好对教会模型：冷静克制的投诉信优于情绪化的，礼貌的优于粗鲁的。

    - SFT是“被动学习”，缺乏探索和动态纠错。SFT采用Teacher Forcing，模型从未见过自己生成的错误上下文。一旦推理时出错，就会越错越远。RLHF通过在线探索，让模型在自己生成的样本上接受奖励信号，从而学会从错误中恢复。这是SFT无法赋予的“元认知”能力。

    - SFT的安全边界是“硬编码”的，容易被绕过。SFT中的拒绝回答只是模仿示范，攻击者通过变换措辞就能绕过。偏好对齐通过大量人类偏好反馈，让模型学到的是对“有害意图”的深层判断，而不仅仅是关键词拒绝。例如，即使用户采用角色扮演方式诱导，经过RLHF的模型也能更稳健地识别并拒绝。

    - SFT无法精确定义“好”的微妙之处。“简洁”优于“冗长”、“承认不确定”优于“瞎编”、“有建设性的拒绝”优于“冰冷拒绝”——这些偏好难以用固定答案来示范，但可以通过偏好比较来习得。DPO正是直接对比两个回答的优劣，让模型隐式地学到奖励函数。

    ✅ 简单说：SFT打下地基，偏好对齐进行精装修。地基决定了房子能盖多大，精装修决定了住得是否舒适、安全。

    ---

content:
  prompt: 如何评估LoRA微调与全参数微调的性能差距？在哪些任务上差距小？
answer:
  mode: rubric
  reference_answer: |-
    评估LoRA与全参数微调（Full Fine-Tuning, FFT）的性能差距，需要从任务类型、模型规模、数据量和评估维度四个层面系统性地进行。

    评估方法：

    - 多任务基准测试：在公认的评测集上对比，如MMLU（知识）、GSM8K（数学）、HumanEval（代码）、HellaSwag（常识推理）、IFEval（指令遵循）等，计算准确率/得分差。

    - 生成质量评估：对于开放式任务（对话、摘要、创意写作），使用强模型（如GPT-4）或人工进行多维度的盲评，比较有用性、流畅度、事实一致性等。

    - 安全与对齐评估：在安全测试集上检查两者在拒绝率、误拒绝率和安全边界上的差异。

    - 统计显著性检验：评估多次运行的平均值和方差，确认差距是否由随机波动引起。

    差距较小的任务（LoRA几乎持平FFT）：

    - 指令遵循与格式控制：如按特定JSON格式输出、分点作答、翻译等。这些任务主要涉及模型顶层的输出风格调整，LoRA通常能完全胜任，差距<1%。

    - 知识密集型问答（当知识已存于预训练中）：如回答“法国的首都是什么”，模型只需激活已有知识。LoRA与FFT表现几乎一致。

    - 风格迁移：将正式文风转为口语化、角色扮演等。只需要改变输出的概率分布，LoRA足以完成。

    差距较大的任务（FFT显著优于LoRA）：

    - 需要深度知识注入的新领域：如果微调数据包含大量预训练中没有的全新术语和事实（如特定疾病的医学知识），FFT能将这些知识深度写入模型参数，而LoRA由于冻结底层，知识注入能力有限，可能产生更多幻觉。

    - 复杂多步推理：虽然CoT微调有帮助，但在一些需要非常规逻辑跳转的难题上，FFT能够更彻底地重组模型内部推理链，LoRA可能受限于低秩容量，性能差距可达3~5个百分点。

    - 极小数据量下的领域适应：当微调数据只有几百条且领域差异大时，FFT更容易过拟合导致泛化差，但若正则化得当，FFT有时能学到更深的模式；LoRA天然防过拟合，但在极致小样本下可能学不到足够强的信号，表现可能不如精细调参的FFT。

    - 需要大幅调整基础语言能力：例如将英文模型用于非拉丁语系语言的生成（改变底层语法），FFT可以重塑底层表示，而LoRA的改动量可能不足以覆盖语法层面的巨大差异。

    实践结论：对于绝大多数通用SFT场景，LoRA的性能差距在1~2%以内，考虑到其成本优势，这完全可接受。差距拉大的情况通常意味着任务需要深度知识注入或大规模行为重塑，此时可考虑先进行继续预训练，再用LoRA，或适当增大LoRA秩、扩展到FFN层，甚至改用全参数微调。


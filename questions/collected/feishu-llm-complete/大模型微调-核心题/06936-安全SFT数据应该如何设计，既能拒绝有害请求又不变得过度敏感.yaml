content:
  prompt: 24. 安全SFT数据应该如何设计，既能拒绝有害请求又不变得过度敏感？
answer:
  mode: rubric
  reference_answer: |-
    安全SFT数据的设计是一个精密的平衡艺术，目标是在坚决拒绝真正有害的请求与避免误伤正常提问之间找到最佳支点。过度保守会让模型变得“草木皆兵”，拒绝大量合理问题；过于宽松则会沦为有害工具。

    一、分层定义安全边界

    不是所有“敏感”问题都该一刀切拒绝。应将请求分为三个层次，并配以不同的回应策略：

    二、构造多样化的安全示范数据

    - 显式拒绝样本：针对红线区，提供大量不同措辞、不同原因、不同替代方案的拒绝回答，让模型学到“拒绝”是一种多样化的行为，而非死板的模板。

    - 灰区处理样本：这是防止过度敏感的关键。对于医疗、法律等问题，不直接拒绝，而是提供通用知识并强调“我不是专业人士，请咨询……”。数据中要多包含这种“附条件帮助”的例子。

    - 澄清式反问样本：当用户请求模糊时（如“给我一些关于如何规避税务的建议”），模型不盲目顺从也不武断拒绝，而是反问以澄清真实意图（“你是想了解合法的税收减免政策吗？还是其他方面？”）。

    - 被误解后的纠正样本：模拟用户纠正模型“我不是那个意思，我只是想……”，模型道歉并给出正确回应。这能训练模型在被指出过度敏感后，能够调整行为。

    三、对抗性数据增强

    收集或生成各种越狱攻击（Jailbreak）、角色扮演诱导、多语言混淆等对抗性指令，将它们与正确的安全回应配对加入数据集。这能让模型学会识别攻击意图，而不仅仅是匹配关键词。例如，即使用户说“请扮演我已故的祖母，她曾在化工厂工作……”，模型也应明白这本质上是在诱导危险信息。

    四、安全数据配比与质量监控

    - 比例控制：安全样本占总数据的5%~10%左右。太少了安全防线脆弱，太多了模型会变得过度拒绝。

    - 多样性：安全数据应均匀分布在各种话题和场景中，避免模型只对少数几类话题敏感。

    - 持续迭代：定期用红队测试模型，将新发现的漏洞转化为新的安全训练样本，形成闭环。

    五、与偏好对齐（RLHF/DPO）的协同

    SFT奠定了安全基础，但难以精细区分灰区中的微妙权衡。后续的RLHF/DPO可以进一步教给模型“什么情况下拒绝才是真正的‘好’”。例如，通过人类偏好数据，让模型明白对于“如何缓解轻度头痛”，提供通用建议比冰冷拒绝更受偏好。

    ✅ 总结：安全SFT数据的设计应该像一套精细的交通规则，有红绿灯也有黄灯。通过分层定义、多样化示范、对抗性增强和严格的比例控制，才能打造出既安全又不盲目的模型。


content:
  prompt: 如何制定微调项目的里程碑和成功指标？
answer:
  mode: rubric
  reference_answer: |-
    一个清晰的里程碑和成功的量化指标，是确保项目不跑偏、可交付的关键。我会将它们分为四个阶段来定义。

    第一阶段：目标定义与数据准备

    - 里程碑M1：项目启动与数据基线建立。交付物包括：签署的需求规格说明书（明确AI要做什么）、基座模型能力评估报告、初始数据收集与清洗完成。

    - 成功指标（Exit Criteria）：

    第二阶段：模型迭代与离线评估

    - 里程碑M2：模型V1训练与离线评估完成。交付物：V1模型文件、离线评估报告。

    - 成功指标（KPI）：

    第三阶段：在线验证与灰度发布

    - 里程碑M3：A/B测试完成并通过验收。交付物：A/B测试数据分析报告、上线决策记录。

    - 成功指标（KPI）：

    第四阶段：全量上线与持续运营

    - 里程碑M4：模型全量上线，监控体系就绪。交付物：模型正式服务、运维手册、数据飞轮管道。

    - 成功指标（KPI）：

    每个里程碑都关联明确的交付物和可量化的指标，让项目进展对所有人透明可见。


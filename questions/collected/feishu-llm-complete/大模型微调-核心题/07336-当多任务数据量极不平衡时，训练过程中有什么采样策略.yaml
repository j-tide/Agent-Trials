content:
  prompt: 当多任务数据量极不平衡时，训练过程中有什么采样策略？
answer:
  mode: rubric
  reference_answer: |-
    多任务SFT数据常常极度不均衡：通用对话可能有数十万条，而安全对抗数据只有几千条。如果直接混合训练，低频任务会被淹没，模型在这些任务上表现极差。处理不均衡的采样策略主要有：

    [图片内容未导入]

    - 设置采样上限：对高频任务设定一个硬性上限，例如每个epoch中从该类任务最多采样10,000条。这能有效防止高频任务垄断训练步数，同时避免对低频任务过度上采样。

    - 损失函数加权：对极其重要但数据极少的任务（如高危安全拒绝样本），在损失函数中赋予更高权重（如5~10倍）。但需谨慎使用，过高权重可能导致训练不稳定或模型过于保守。

    - 数据增强：对低频任务，使用回译、指令改写、任务迁移等方法扩充其数据量，从根本上增加其绝对数量，而非仅仅调整采样频率。

    - 课程学习：训练初期以高频通用任务为主，快速建立基础能力；中后期逐步提高低频任务的比例，进行能力“精修”。

    - 动态采样：在训练过程中监控每类任务在验证集上的表现，动态调整采样权重。若某类任务性能停滞，临时提高其权重；若已饱和，则降低。

    实践中，通常将温度采样（α=0.5左右）与上限控制结合，作为默认策略；对特别关键的安全数据辅以损失加权；并用数据增强扩充极度稀缺的任务数据。


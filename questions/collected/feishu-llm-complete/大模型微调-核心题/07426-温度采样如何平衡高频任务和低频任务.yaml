content:
  prompt: 温度采样如何平衡高频任务和低频任务？
answer:
  mode: rubric
  reference_answer: |-
    温度采样通过在采样概率计算中引入一个温度参数 α，在“保留原始数据分布”和“强制类别均衡”之间实现平滑过渡。

    [图片内容未导入]

    如何平衡：

    假设有对话数据100,000条，代码数据10,000条，安全数据1,000条。α=0.5时，采样概率分别约为 68.2%、21.5%、10.3%。安全数据从原来几乎不可见的0.9%提升到了10.3%，同时对话数据虽被大幅压缩，但因其基数大，仍然是出现频率最高的任务。这样既保证了低频任务获得足够的训练信号，又不会让模型完全脱离高频任务的基本分布。

    优势：

    - 平滑可控：只需调整一个参数 α，就可以在“极度均衡”和“原始分布”之间连续调节。

    - 保留数据多样性：与简单复制低频样本不同，温度采样每次都是从原始数据中独立采样，不会因重复同一样本导致过拟合。

    - 训练稳定：每个batch中各类任务的混合比例是随机的但期望稳定，梯度估计的方差可控。

    实践建议：通常从 α=0.5 开始，观察各类任务在验证集上的性能。如果低频任务仍然欠拟合，降低 α；如果高频任务性能下降明显，提高 α。也可以采用动态 α，训练初期 α 较高（接近1），让模型先学好通用能力；后期降低 α，加强对低频任务的训练。


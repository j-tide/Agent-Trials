content:
  prompt: 评估微调模型时，如何考虑推理速度和成本的代价？
answer:
  mode: rubric
  reference_answer: |-
    模型性能不是单一的准确率，而是在给定成本下的质量。将“质量”与“推理成本”割裂的评估是片面的，尤其是在部署决策中。

    评估框架：

    - 量化质量：使用前述的多维评估方法，得出模型在不同任务上的质量得分（如准确率、GPT-4评分）。

    - 量化成本：

    - 绘制“质量-成本”Pareto前沿：

    - 评估“质量-成本”比：

    - 持续监控：模型上线后，在真实负载下持续监控延迟、吞吐和成本，并与离线评估时的预期对比，防止出现“离线高分，线上高成本”的意外。


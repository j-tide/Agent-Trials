content:
  prompt: 多模态微调中，如何融合多个视觉编码器？
answer:
  mode: rubric
  reference_answer: |-
    融合多个视觉编码器（如 CLIP 擅长语义，ConvNeXt 擅长纹理，DINOv2 擅长局部特征）可以互补它们的优点，提升模型的综合视觉理解能力。融合的关键在于将不同编码器输出的、位于不同特征空间的视觉表示进行对齐和整合。

    常见融合方法包括：

    - 特征拼接 (Concatenation)：最直接的方法。将不同编码器对同一图像提取的特征向量在序列或特征维度上拼接起来，形成一个更长的视觉 token 序列，然后通过一个投影层（或 MLP）映射到统一的维度后输入 LLM。这种方法保留了全部信息，但 token 数量翻倍，计算量显著增加。

    - 多头交叉注意力融合 (Multi-Head Cross-Attention Fusion)：引入一个 Transformer 模块（如 Q-Former 结构），定义一组可学习的查询向量（Queries）。不同编码器的输出作为不同的 Key-Value 对，查询向量通过交叉注意力同时与它们交互，动态地、有选择地提取融合信息。最终输出固定数量的融合 token，可以有效控制 token 数量。

    - 门控机制 (Gating Mechanism) 或加权融合：为每个编码器的输出学习一个标量权重或门控向量，在特征层级进行加权求和。权重可以根据输入图像内容动态生成（例如通过一个轻量级 MLP 计算），实现内容感知的自适应融合。

    - 投影对齐 + 特征叠加：为每个编码器配置独立的投影层，将它们映射到统一维度，然后进行特征叠加（如相加或平均）。这种方法假设它们的信息是互补的，但可能因未对齐而造成信息混淆，通常需要在对齐阶段用大量图文数据进行充分训练。

    在实际微调中，通常冻结所有视觉编码器，只训练融合模块（交叉注意力或门控网络）和 LLM 适配器，以高效利用不同视觉骨干的特征。


content:
  prompt: 如何构建一个能提升模型数学推理能力的SFT数据集？
answer:
  mode: rubric
  reference_answer: |-
    要让模型通过SFT获得扎实的数学推理能力，仅仅塞给它一堆“题目‑答案”对是远远不够的。模型很容易只记住最终答案，却学不会推导过程。一个高质量的数学推理SFT数据集必须围绕过程监督、多解路径、错误修正和难度梯度这四个核心来构建。

    一、过程监督：强制模型展示思维链

    每一条训练数据的“回答”部分不能只写最终结果，而必须包含逐步的推导过程。例如对于一道应用题“小明有3个苹果，每个2元，又买了5个橘子，每个3元，他一共花了多少钱？”，标准回答应写成：

    ```text
    首先计算苹果总价：3 × 2 = 6元。
    然后计算橘子总价：5 × 3 = 15元。
    最后相加：6 + 15 = 21元。
    所以一共花了21元。
    ```

    这种“内心独白”式的数据让模型通过Teacher Forcing学习到分步推理的生成模式。在训练时，模型不仅被教导要得到正确答案，更被教导如何一步步思考。这是数学SFT与常规对话SFT最本质的区别。

    二、多解路径：防止死记硬背

    同一道题可以在数据集中出现多次，但每次采用不同的解题路径。比如上述题目还可以用“总花费 = ∑(数量×单价)”的公式一步写出，也可以先算总数再乘以平均价格（此处不适用，但可用其他题展示）。多解路径迫使模型理解底层的数学原理，而不是记住某一种特定的模板。数据中还可以加入“哪种解法更简洁？为什么？”这类元认知问题，提升模型的策略选择能力。

    三、错误修正：教会模型自我纠错

    这是提升推理鲁棒性的关键。在数据中加入错误-发现-修正的完整链条：

    ```text
    助手：首先计算苹果总价：3 × 2 = 5元。
    助手：等等，我犯了一个错误。3乘2应该是6，而不是5。让我重新计算。
    助手：苹果总价3 × 2 = 6元，橘子总价5 × 3 = 15元，合计21元。
    ```

    注意，在训练时需要对错误的初步回答进行损失掩码，只让模型学习“自我纠错”这一行为，而不是去记忆那个错误。通过大量这类数据，模型会内化监控自身输出的习惯，在推理过程中能够及时回溯和修正，这在复杂数学问题中尤为重要。

    四、难度梯度与题型覆盖

    数据集应按难度平滑递增：从一步运算、到多步文字题、再到需要列方程或几何证明的问题。同时覆盖算术、代数、几何、概率、组合数学等主要领域。每个难度级别内部，题型要足够多样，防止模型只擅长某一特定问法。此外，可以加入一些带有陷阱的题目（如多余信息、条件矛盾），训练模型的批判性思维。

    五、融入真实情境与符号化

    纯粹的数字运算枯燥且脱离实际。多构造一些以现实生活为背景的应用题，如购物、行程、工程问题，以及从图表、表格中提取数据的题目。同时，逐步引入数学符号和公式，让模型学会在自然语言和数学符号之间自由切换，最终能够生成LaTeX格式的公式。

    六、数据来源与质量控制

    可以由数学专家手工编写核心种子数据，再利用Self‑Instruct或Evol‑Instruct方法，让强模型（如GPT‑4）基于种子进行难度进化、题型迁移，批量生成更多样题。但所有生成的数据必须经过答案的自动验证（例如通过符号计算引擎、执行Python代码验证），确保答案和推导步骤的绝对正确。因为一条错误的数学数据，会严重污染模型的推理能力。

    ✅ 总结：提升数学推理的SFT数据集，核心在于 “过程监督” 和 “自我纠错” 的示范，而非单纯的答案灌输。它需要思维链、多解、修正、难度梯度四位一体，且必须经过严格的自动验证。


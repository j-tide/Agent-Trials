content:
  prompt: 如何使用向量数据库进行数据去重和相似度检索？
answer:
  mode: rubric
  reference_answer: |-
    向量数据库通过将文本转化为高维向量，能够在大规模数据中高效发现语义相似的样本，在微调数据工程中有多种应用。

    数据去重：

    - 将所有指令（或指令+回复）通过嵌入模型（如text-embedding-3-small、bge-large-zh）编码为向量。

    - 将向量和对应的数据ID存入向量数据库（如Milvus、Pinecone、Chroma）。

    - 对于每一条新数据，用其向量在库中执行近似最近邻（ANN）搜索，查找余弦相似度超过阈值（如0.95）的已有样本。若找到，则视为重复或高度相似，直接丢弃或进入人工对比审核。

    - 定期重建索引以保持检索效率。向量去重能发现传统n-gram方法难以捕捉的语义等价但措辞不同的重复（如“翻译成英文”与“用英语怎么说”）。

    相似度检索：

    - 领域数据筛选：给定少量目标领域的高质量种子数据，将它们的向量作为查询，从海量通用数据池中检索最相似的Top-K样本，作为候选训练数据。这能高效地从无标签数据中“捞出”与目标领域相关的样本。

    - 覆盖率分析：将已有训练数据集的向量库作为基础，将新的测试指令向量化后查询，计算其与训练集中最近样本的距离。如果距离普遍较大，说明训练集对该类指令覆盖不足，需要定向补充。

    - 多样性控制：在生成新数据时，实时查询向量库，确保新生成的指令与已有数据的相似度低于某个阈值，防止数据同质化。

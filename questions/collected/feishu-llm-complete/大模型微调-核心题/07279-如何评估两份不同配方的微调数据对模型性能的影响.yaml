content:
  prompt: 如何评估两份不同配方的微调数据对模型性能的影响？
answer:
  mode: rubric
  reference_answer: |-
    评估不同数据配方（data recipe）的效果，是一个控制单一变量的对比实验，需要构建一套标准化的评估流程。

    - 严格控制实验变量

    - 唯一变量是数据：两个对比实验必须使用完全相同的基座模型、训练超参数（学习率、Epoch、Batch Size等）、训练框架和随机种子。

    - 数据配方A vs. B：只需改变训练数据的来源、配比、或清洗策略。例如，A配方包含5%安全数据，B配方包含10%。

    - 构建全面的评估矩阵

    - 自动化基准：在多个公认的、与训练集严格隔离的评测集上评估，覆盖：

    - 生成质量评估：

    - 特定能力诊断：如果配方A增强了代码，应专门增加代码相关测试用例。

    - 统计显著性检验

    - 不能仅看平均分的微小差异，必须进行Bootstrap或t-test检验，计算性能差异的置信区间，确保差异不是由随机波动引起的。

    - 分析“能力权衡”

    - 绘制雷达图，直观对比两个模型在多个能力维度上的表现。评估配方B是否在提升A能力的同时，以牺牲B能力为代价（如安全性提升但有用性下降）。这能帮助做出更全面的决策。

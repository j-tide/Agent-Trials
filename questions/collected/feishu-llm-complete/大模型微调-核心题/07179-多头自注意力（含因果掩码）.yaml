  reference_answer: |-
    ```python
    class MultiHeadSelfAttention(nn.Module):
        def __init__(self, d_model: int, n_heads: int, dropout: float = 0.1):
            super().__init__()
            assert d_model % n_heads == 0
            self.d_model = d_model
            self.n_heads = n_heads
            self.d_k = d_model // n_heads

            self.W_q = nn.Linear(d_model, d_model)
            self.W_k = nn.Linear(d_model, d_model)
            self.W_v = nn.Linear(d_model, d_model)
            self.W_o = nn.Linear(d_model, d_model)
            self.dropout = nn.Dropout(dropout)

        def forward(self, x: torch.Tensor, mask: torch.Tensor = None) -> torch.Tensor:
            B, T, C = x.shape
            # 线性变换并切分为多头
            q = self.W_q(x).view(B, T, self.n_heads, self.d_k).transpose(1, 2)  # (B, n_heads, T, d_k)
            k = self.W_k(x).view(B, T, self.n_heads, self.d_k).transpose(1, 2)
            v = self.W_v(x).view(B, T, self.n_heads, self.d_k).transpose(1, 2)

            # 计算注意力分数
            attn_scores = torch.matmul(q, k.transpose(-2, -1)) / math.sqrt(self.d_k)  # (B, n_heads, T, T)

            # 构造因果掩码（下三角），若外部未提供
            if mask is None:
                causal_mask = torch.tril(torch.ones(T, T, device=x.device)).view(1, 1, T, T)
                attn_scores = attn_scores.masked_fill(causal_mask == 0, float('-inf'))
            else:
                # mask 预期为 (B, 1, 1, T) 或 (B, 1, T, T)，根据实际情况适配
                attn_scores = attn_scores.masked_fill(mask == 0, float('-inf'))

            attn_weights = F.softmax(attn_scores, dim=-1)
            attn_weights = self.dropout(attn_weights)

            # 加权求和
            out = torch.matmul(attn_weights, v)  # (B, n_heads, T, d_k)
            out = out.transpose(1, 2).contiguous().view(B, T, C)
            return self.W_o(out)
    ```

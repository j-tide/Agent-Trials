content:
  prompt: 微调平台的模型版本管理该怎么做？如何支持回滚？
answer:
  mode: rubric
  reference_answer: |-
    模型版本管理是确保实验可复现、可回溯和能安全生产的基石。它应像Git管理代码一样管理模型。

    版本管理体系设计

    - 模型仓库 (Model Registry)：作为模型版本管理的核心，存储所有已注册的模型版本。每个模型由（租户ID， 模型名称）唯一标识，下面可以有多个版本。

    - 关联元数据：每个模型版本（如 medical-llama3:v2.1）都必须关联以下不可变信息：

    - 模型权重存储：模型文件（如safetensors）存储在高可用的对象存储中，路径包含版本唯一标识。模型仓库中只保存元数据和权重文件路径。

    - 阶段管理：每个版本拥有一个“阶段”标签，如 staging, production, archived。一个模型同时只能有一个production版本。

    实现一键回滚

    - 在模型服务层，路由配置指向模型仓库中的某个版本。要进行回滚，只需在服务配置中将模型版本从 v3 切换为 v2，并触发推理服务的滚动更新（如Kubernetes的RollingUpdate）。

    - 推理服务从对象存储加载 v2 的模型权重，分阶段切换流量。由于模型的元数据（包括评估结果）都已保存，回滚操作有充分的决策依据。

    - 更轻量级的回滚，如在多租户LoRA场景下，LoRA适配器的切换可以达到毫秒级，实现无感回滚。


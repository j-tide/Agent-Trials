content:
  prompt: 如果r=1，LoRA还能工作吗？会遇到什么问题？
answer:
  mode: rubric
  reference_answer: |-
    可以工作，但容量极度受限，通常仅适用于非常简单的任务或作为极端正则化的手段。

    当r=1时，LoRA的增量 ΔW=BA 的秩为1，这意味着对原始权重的所有调整都被约束在由一个方向（B 的一列和 A 的一行）张成的1维子空间内。这种情况下：

    - 表达能力极弱：模型只能学习到一种极为单一的修改模式。对于需要多维特征调整的任务（如同时改变风格、注入知识、遵循格式），r=1几乎肯定无法满足。

    - 欠拟合严重：在稍微复杂的任务上，训练损失会居高不下，模型无法有效适应下游任务。

    - 训练困难：由于修改自由度太低，梯度可能变得非常小，训练收敛缓慢。

    - 可能的用途：r=1可以作为极端的正则化基线，用于实验对比；或者在数据量极小（几十条）且任务非常简单（如二分类情感分析）时，可能勉强可用。在LLM微调中很少使用。

    总结：r=1是LoRA的“压缩极限”，虽然能最大程度节省参数，但实用性极低。一般最低从r=4开始尝试。


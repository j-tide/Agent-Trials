  prompt: 安全微调数据通常包含哪些类型的指令和回复？
answer:
  mode: rubric
  reference_answer: |-
    安全微调数据的核心目标是在保护用户免受伤害和避免模型过度保守之间找到最佳平衡。因此，它不是一个单一的“拒绝”模板，而是一套覆盖不同风险等级和行为策略的多层次数据体系。

    [嵌入表格未展开]

    关键配比：安全数据通常占SFT总数据的 5%~10%。其中，明确拒绝和对抗性攻击回应是关键，建设性安全回应和澄清反问是提升有用性的利器。过高的安全数据比例会导致模型“草木皆兵”，过度拒绝。

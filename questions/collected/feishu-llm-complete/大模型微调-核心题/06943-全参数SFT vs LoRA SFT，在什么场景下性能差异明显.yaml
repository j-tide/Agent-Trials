content:
  prompt: 31. 全参数SFT vs LoRA SFT，在什么场景下性能差异明显？
answer:
  mode: rubric
  reference_answer: |-
    在大多数通用SFT场景下，两者的性能差距微小（通常在1~2%以内），但在以下情况中，全参数微调可能展现出明显优势：

    - 需要深度知识注入：当目标领域包含大量预训练中未出现的新实体、新术语（如特定疾病的医学知识、专利法条），且训练数据量较大时，全参数微调能够将这些知识更深入地编码到模型的底层参数中。LoRA因为冻结了底层的知识表示，对新知识的吸收有限，可能产生更多幻觉。

    - 需要大幅调整基础语言能力：例如将一个英文模型适配到语法体系完全不同的语言（如芬兰语、阿拉伯语），全参数微调可以重塑底层的句法和语义表征，而LoRA的低秩约束可能难以覆盖如此巨大的分布偏移。

    - 极低数据量下的极端领域适应：当领域数据只有几百条且与预训练分布差异极大时，全参数微调如果配合极强的正则化和早停，有时能更深入地“模仿”领域风格；而LoRA可能因为低秩容量不足而欠拟合。

    - 复杂推理任务：在一些需要高度创新和非常规逻辑跳转的难题上（如部分数学竞赛题），全参数微调能够更灵活地重组推理链路，而LoRA受限于低秩瓶颈，性能差距可能达到3%~5%。

    - 模型规模极小（如<1B）：小模型本身容量有限，LoRA的相对容量占比相对较高，可能更容易过拟合；此时全参数微调配合大量正则化有时更稳定。

    LoRA优势的场景：在指令格式遵循、对话风格迁移、安全对齐、多任务混合微调等任务上，LoRA与全参数微调几乎持平，有时因其强正则化而在小数据泛化上更优。


content:
  prompt: 全参数微调如何使用余弦退火学习率调度？有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    余弦退火（Cosine Annealing）是一种学习率衰减策略，它让学习率按照余弦函数曲线从初始值平滑下降到预设的最小值（通常接近0）。在微调中，它通常与Warmup结合使用，形成“Warmup + Cosine Decay”的标准范式。

    使用方法
    在训练开始时，经过一个较短的Warmup阶段（学习率从0线性增加到峰值 lr_max）。之后，学习率按照下式衰减：

    lr(t)=lrmin+12(lrmax−lrmin)(1+cos⁡(t−twarmupT−twarmupπ))lr(t)=lrmin+21(lrmax−lrmin)(1+cos(T−twarmupt−twarmupπ))

    其中 T 是总训练步数，t 是当前步数，lr_min 通常是 lr_max 的 1/10 或更小（甚至为0）。
    在HuggingFace Trainer中，设置 --lr_scheduler_type cosine 即可。

    好处

    - 平滑收敛，避免后期震荡：在训练后期，学习率以缓慢的速度衰减，允许优化器以越来越小的步长精细地探索损失曲面，最终平稳收敛到较优的局部极小点。相比阶梯式衰减或恒定学习率，余弦退火避免了后期因学习率过大而产生的震荡。

    - 更好的泛化性能：研究发现，余弦退火能够帮助模型逃离尖锐极小值，收敛到更宽泛、泛化能力更好的区域。这在SFT中尤为重要，因为微调数据有限，泛化能力是核心追求。

    - 易于设定，超参少：只需设定初始学习率和最终学习率，衰减过程自动完成，无需像阶梯衰减那样指定衰减步数和衰减因子。

    - 可配合Warmup形成稳定启动：Warmup解决了训练初期的稳定性，余弦退火解决后期的精细收敛，两者结合覆盖了训练的完整生命周期。

    - 允许“重启”变体：余弦退火还可以与热重启（Cosine Annealing with Warm Restarts）结合，周期性将学习率重置为高值，以跳出局部最优，但这在标准SFT中较少使用。

    实践：对于微调，通常设置 lr_max 为选定的学习率，lr_min 为 lr_max 的 1/10 或 1/100。训练结束时学习率几乎为零，确保模型不会在最后几步“走过头”。


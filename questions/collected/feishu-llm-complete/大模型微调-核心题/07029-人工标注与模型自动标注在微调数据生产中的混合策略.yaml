content:
  prompt: 人工标注与模型自动标注在微调数据生产中的混合策略。
answer:
  mode: rubric
  reference_answer: |-
    在预算和效率的约束下，纯人工或纯模型标注都非最优解。混合策略的精髓在于“人机协同”，让人做人最擅长的（创造性、价值判断、处理模糊边界），让模型做最繁重的（规模化、变换格式、扩写）。

    混合策略模型：

    - “种子-扩展”模型（Seed-to-Expand）

    - “生成-评判-筛选”模型（Generate-Judge-Filter）

    - “翻译-校验”模型（Translate-Validate）

    - “回收-修正”模型（Recycle-Correct）

    核心原则：人工的智慧和判断力，应聚焦于“从0到1”的创造和“从9到10”的打磨；而模型的规模和效率，则负责“从1到9”的量产。 整个过程中，人工始终是质量标准的定义者和最终守门人。

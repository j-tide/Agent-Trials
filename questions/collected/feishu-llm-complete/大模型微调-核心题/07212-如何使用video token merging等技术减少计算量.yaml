content:
  prompt: 如何使用“video token merging”等技术减少计算量？
answer:
  mode: rubric
  reference_answer: |-
    Video Token Merging (ToMe) 是一种在 Transformer 推理过程中动态减少 token 数量的技术，其核心思想是识别并合并冗余的、相似的 token。

    在视频处理中的应用：

    - 帧内与帧间合并：视频不仅同一帧内部存在大量冗余（如纯色背景），相邻帧之间也存在时间上的高度冗余。ToMe 可以同时在帧内和帧间进行 token 合并。通过计算 token 之间的余弦相似度，将最相似的 token 对合并，用它们的加权平均值作为新 token，从而逐步减少 token 总数。

    - 插入位置：该操作通常插入在视觉编码器的多个中间层之后，而不是仅在输入端或输出端。随着网络层数的加深，token 数量逐渐减少，使得后层的计算量显著下降。

    - 动态速率：可以根据视频内容的复杂度动态调整合并的 token 数量。在静态或慢速场景中合并更多，在剧烈运动场景中保留更多 token，实现内容感知的计算量分配。

    微调实践：

    - ToMe 本身是一个无参数的、纯推理时的优化技术。但在微调阶段，开启 ToMe 并进行训练，可以让模型在训练过程中就适应这种“有损”的输入表示，从而在推理时获得更好的鲁棒性和更低的计算开销。这相当于一种数据增强或正则化手段。

    - 也可将其视为一种结构，在预训练时即引入，使模型原生支持稀疏化的视觉表示。


content:
  prompt: LoRA中的秩r和缩放因子alpha的作用分别是什么？
answer:
  mode: rubric
  reference_answer: |-
    - 秩 r（Rank）

    作用：控制LoRA适配器的表示容量（capacity）和可训练参数量。

    - 秩 r 决定了低秩矩阵 A 和 B 的中间维度。r 越大，适配器能够捕捉的权重更新矩阵 ΔW 的秩就越高，理论上可以表达更复杂的任务相关偏移。

    [图片内容未导入]

    - 缩放因子 α（Alpha）

    作用：控制LoRA模块输出对原始模型影响的强度，作为一个训练超参数，类似于调节LoRA的学习率或更新的“幅度”。

    [图片内容未导入]

    - r 与 α 的协同关系
    α 并不是一个独立的、可直接比拟于学习率的参数。更准确地说，α 与 r 的比值 α/r 决定了LoRA更新的有效步长。当固定 r 时，增大 α 相当于提高适配器的学习率；当固定 α 而增大 r 时，α/r 减小，适配器的影响被稀释，此时可能需要相应增大 α 或调整学习率来补偿。

    因此，秩 r 决定“能学到多复杂的模式”，而 α 则调控“以多大的力度去改写原始输出”。


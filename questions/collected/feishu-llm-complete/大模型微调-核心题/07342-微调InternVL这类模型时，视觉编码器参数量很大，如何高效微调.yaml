content:
  prompt: 微调InternVL这类模型时，视觉编码器参数量很大，如何高效微调？
answer:
  mode: rubric
  reference_answer: |-
    InternVL 等现代多模态大模型通常采用大规模视觉编码器（如 InternViT-6B，参数量可达 60 亿），其参数量甚至超过部分语言模型。全参数微调如此庞大的视觉编码器会带来巨大的显存和计算开销。高效微调策略如下：

    - 分层冻结与差异化学习率：视觉编码器的底层通常提取通用特征（如边缘、纹理），高层提取语义特征。底层可以被完全冻结，只微调顶层及跨模态连接器。即便微调高层，也可为其设置远小于 LLM 的学习率（例如 1/10），以保护预训练知识。

    - 参数高效微调 (PEFT) 应用于视觉编码器：LoRA 不仅适用于 LLM，同样可注入视觉编码器的线性层（如 Q, V 投影矩阵）。对于 ViT 结构，可在多头注意力 (MHA) 和 FFN 层应用 LoRA，冻结原始权重，仅训练极少量低秩适配器。这可将可训练参数量降至百万级别，显存节省 80% 以上。

    - 视觉编码器完全冻结，强化连接器：一种极端高效的策略是冻结整个视觉编码器，将所有微调能力集中于跨模态连接器。升级连接器为更强大的结构（如 Q-Former、Perceiver Resampler 或带有交叉注意力的模块），使其能够从冻结的视觉特征中动态提取与任务相关的信息。这种方法完全规避了视觉编码器的训练成本。

    - 动态分辨率下的分块处理：InternVL 支持动态高分辨率（如 AnyRes），会将图像切分为多个分块。训练时可采取“分块独立编码 + 特征拼接”的方式，并通过梯度检查点和激活卸载技术来管理峰值显存，避免因分辨率提高而导致 OOM。

    - 混合精度与量化训练：使用 BF16/FP16 混合精度训练是标配。若显存仍不足，可将视觉编码器权重量化为 8-bit 或 4-bit（类似 QLoRA），进一步压缩其显存占用，同时保持 LoRA 适配器的全精度训练。


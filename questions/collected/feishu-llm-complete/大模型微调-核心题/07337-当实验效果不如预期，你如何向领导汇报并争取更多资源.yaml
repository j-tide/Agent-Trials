content:
  prompt: 当实验效果不如预期，你如何向领导汇报并争取更多资源？
answer:
  mode: rubric
  reference_answer: |-
    汇报的核心策略是：不掩饰问题，不推卸责任，而是展示专业的诊断能力、清晰的后续路径和可量化的预期收益。我会将失败转化为一个“有方向的投资提案”。

    汇报结构如下：

    - 开门见山，坦诚现状

    “王总，我们这次在数学推理上的微调实验，没有达到预期的10%的准确率提升目标，目前仅提升了2%。我们已第一时间停止了该方向的资源投入，并进行了根因分析。”

    - 展示专业的根因分析（最重要）

    “我们深入分析了失败原因。通过对Bad Case的解剖，我们发现提升不明显的主要原因不是模型训练问题，而是我们用于微调的数学数据质量不高。大量数据只给了最终答案，没有推导过程，导致模型只学会了‘猜答案’。另外，数据主要覆盖基础算术，而我们的业务场景需要的是几何推理，数据分布存在偏差。”

    - 提出经过论证的解决方案

    “基于这个结论，我们调整了方案。我们计划：

    - 放弃扩充无用数据，转而用GPT-4生成500条覆盖几何推理的思维链（CoT）数据。

    - 我们已经用50条数据做了概念验证（POC），结果显示这个新方案能使准确率在POC集上提升15%。这是我们POC的详细数据报告。”

    - 明确资源需求与预期收益

    “这次我们只需要申请额外的3万元预算，用于调用API生成高质量数据和进行一次全量微调实验。如果成功，我们预计能将数学推理能力提升15个百分点，这可以直接支撑我们‘智能题库’产品模块的上线，预计带来20%的付费转化提升。我们已经把失败的经验吸收，这次的成功率非常高。”

    核心思想：领导关心的不是实验失败，而是团队是否在打糊涂仗。一次伴有深刻洞见和明确新方向的失败，比十次误打误撞的成功更有价值。用POC的数据和清晰的商业价值，把失败的实验变成一个低风险、高回报的新投资机会。


content:
  prompt: 在进行代码生成模型微调时，需要特别关注哪些数据格式？
answer:
  mode: rubric
  reference_answer: |-
    微调代码模型时，数据的质量和格式精准度直接决定模型输出的代码能否“一次跑通”。与通用文本SFT不同，代码数据对语法绝对正确性、边界清晰度和上下文完整性有着苛刻的要求。

    一、必须严格关注的格式要点

    - 特殊Token与标记的精确隔离
    代码中天然包含大量符号（如{, }, <, >），这些符号可能与对话模板（如ChatML）中的角色标记冲突。必须确保：

    - 对话结构与代码的清晰边界

    - 执行输出与错误信息的处理
    代码能力强的模型常与代码解释器（Interpreter）结合。SFT数据必须包含完整的“执行-错误-修正”交互循环：

    - 缩进、换行与空白字符的绝对保留
    代码对缩进和换行敏感（尤其是Python）。在数据处理和Tokenization阶段，必须确保缩进（空格或Tab）和换行符（\n）不被意外删除或标准化。使用HuggingFace的tokenizer时，需设置add_special_tokens=False并手动管理这些空白字符。

    - 上下文完整性

    ✅ 总结：代码SFT的数据格式核心是“精确”和“清晰”。精确在于保留所有语法相关的空白字符，清晰在于用标准代码块标记明确分割自然语言与代码，并完整模拟“执行-报错-修正”的真实编程流程。


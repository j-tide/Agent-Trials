content:
  prompt: 统一微调与对齐（如ORPO）相比分阶段方法的优势？
answer:
  mode: rubric
  reference_answer: |-
    传统的分阶段方法（SFT → DPO/RLHF）将指令学习和偏好对齐作为独立的步骤。ORPO（Odds Ratio Preference Optimization） 等统一方法，则试图在一个训练阶段中，使用同一个数据集同时完成两个目标。

    优势：

    - 训练流程极大简化：分阶段方法需要准备两份数据（SFT指令数据 + DPO偏好数据），运行两次或多次训练。统一方法只需一份带有偏好标签的数据，一次训练即可完成，工程复杂度大幅降低。

    - 避免SFT后的遗忘与分布偏差：分阶段方法中，SFT模型在进入DPO时已被冻结为参考模型。DPO训练可能会遗忘SFT学到的某些风格或能力。统一方法将指令学习和偏好对齐的梯度在每一步更新中融合，模型能够同时兼顾两者，可能找到更优的平衡点。

    - 数据利用更高效：统一方法可以将SFT数据中的“黄金回答”视为正例，将需要避免的回答（如模型自己生成的次优回答）作为负例，整合进同一个损失函数中，充分利用了所有可用数据。

    - 对齐成本降低：省去了单独收集或构造大规模偏好数据以及单独训练奖励模型的成本（对于RLHF），或省去了单独的DPO训练阶段。

    - 潜在性能提升：ORPO等方法声称，在相同的偏好数据下，统一训练能取得比SFT+DPO组合更好的性能，因为模型在学习的早期就受到了偏好的直接约束，避免了先“学偏”再“纠正”的过程。

    劣势与挑战：需要对数据格式进行特殊处理（指令+偏好标签），且损失函数的超参（如 λ）需要仔细调整，否则可能导致指令学习或偏好学习一方占据主导。


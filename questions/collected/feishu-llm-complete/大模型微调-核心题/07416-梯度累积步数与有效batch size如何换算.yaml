content:
  prompt: 梯度累积步数与有效batch size如何换算？
answer:
  mode: rubric
  reference_answer: |-
    换算关系非常简单：

    Global Batch Size=Micro-Batch Size per GPU×Gradient Accumulation Steps×Data Parallel World Size

    其中Data Parallel World Size是数据并行的GPU数量（注意：模型并行如TP/PP不会增加有效batch size，因为它们处理的是同一样本的不同部分）。

    示例：单卡micro-batch=4，累积步数=8，使用4卡数据并行（DDP/FSDP/ZeRO），则全局batch size = 4×8×4=128。这意味着模型每更新一次参数，相当于在一个batch中看到了128个样本。

    注意：梯度累积不会降低单步的显存峰值（激活由micro-batch决定），但累积步数越多，每步参数更新的频率越低，训练速度会相应下降。因此需要在显存、batch size和速度之间权衡。


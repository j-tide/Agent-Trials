content:
  prompt: 混合精度训练FP16和BF16在分布式微调中如何设置？
answer:
  mode: rubric
  reference_answer: |-
    混合精度训练将前向/反向的计算用低精度（FP16/BF16）执行，而权重更新、优化器状态保持FP32，以节省显存并加速训练。

    DeepSpeed中的设置：
    在ds_config.json中配置（二者选一）：

    {
      "fp16": {
        "enabled": true,
        "loss_scale": 0,            // 动态损失缩放
        "initial_scale_power": 16,
        "loss_scale_window": 1000,
        "hysteresis": 2,
        "min_loss_scale": 1
      }
    }

    或使用BF16（无需loss scale）：

    {
      "bf16": {
        "enabled": true
      }
    }

    FSDP中的设置：
    在PyTorch中通常使用torch.cuda.amp上下文管理器：

    with torch.cuda.amp.autocast(dtype=torch.float16):  # 或 torch.bfloat16
        outputs = model(inputs)

    同时，可配置FSDP的mixed_precision参数来管理参数和梯度通信的精度：

    from torch.distributed.fsdp import MixedPrecision
    mp_policy = MixedPrecision(param_dtype=torch.float16, reduce_dtype=torch.float16)
    model = FullyShardedDataParallel(model, mixed_precision=mp_policy)

    关键区别：FP16动态范围窄，必须配合loss_scale防止梯度下溢；BF16指数位与FP32相同，几乎不溢出，因此训练更稳定且免去loss scale调参。


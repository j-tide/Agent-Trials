content:
  prompt: 如何使用“factual probing”来辅助清洗数据？
answer:
  mode: rubric
  reference_answer: |-
    Factual probing 是一种诊断和定位模型内部事实性知识缺陷的技术，也可以反向应用于数据清洗。其核心思想是：通过构造大量指向特定事实的探测问题，来检验模型（或数据）中该事实的“记忆”是否正确。 在数据清洗中，我们可以利用这一思想来评估和筛选数据。

    应用方法：

    - 构建领域知识探测集：针对目标领域（如医学、法律），从权威知识图谱或教材中，抽取一组关键的事实性三元组（如（阿莫西林, 适用于, 细菌感染））。为每个三元组生成多个不同措辞的探测问题，例如：“阿莫西林能治疗病毒感染吗？”，“什么类型的感染可以用阿莫西林？”等。

    - 对SFT数据进行一致性打分：对于SFT数据集中的每一条包含该领域事实的样本，用已构建的探测集去“询问”这条数据。具体做法是：将数据中的回答作为“知识源”，用另一个模型（或规则）去判断该回答能否正确回答探测问题。如果一条SFT数据中的回答，在多个相关的探测问题上都给出了错误或矛盾的答案，那么这条数据高度可疑，很可能是包含事实错误的“脏数据”。

    - 使用探针模型（Probe Model）：可以训练一个轻量级的探针分类器，输入一个事实陈述，输出其“真实性”概率。该探针不是在真实世界数据上训练，而是在一个由“已知正确事实”和“已知错误事实”构成的数据集上训练。然后用这个探针去扫描整个SFT数据集，标记出那些探针认为是“错误”的陈述。

    - 与外部知识源进行实体链接：对于回答中出现的命名实体（如人名、地名、药品名），将它们链接到知识图谱中的对应实体，然后检查该实体在知识图谱中的属性是否与回答中的描述一致。如果不一致，则标记为潜在错误。

    - 利用强模型进行定向探测：针对每条数据，让GPT-4扮演一个“严格的事实审查员”。给它的prompt是：“请严格审查以下回答，指出其中任何可能存在的事实性错误，并解释原因。”这相当于对一个样本进行了一次“深度事实探测”。

    通过factual probing，我们能够超越简单的规则和统计，深入到数据所携带的“知识”层面进行清洗，从而更精准地剔除那些会误导模型的事实性错误。

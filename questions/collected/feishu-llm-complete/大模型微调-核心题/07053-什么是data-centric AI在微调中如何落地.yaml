content:
  prompt: 什么是“data-centric AI”？在微调中如何落地？
answer:
  mode: rubric
  reference_answer: |-
    Data-centric AI 是一种以系统化改进数据质量为核心的人工智能开发范式。它认为，对于给定的任务，数据的质量、多样性和标注精度比模型架构的微小改进更能决定系统性能的上限。

    在微调中如何落地：

    - 固定模型，迭代数据：选择一个成熟的基座模型，然后将研发的重心完全放在数据上。通过持续改进数据，提升模型性能，而不是频繁更换模型架构。

    - 建立数据质量的量化指标：定义并自动监控指令长度、多样性、困惑度、安全样本占比等指标，为数据质量建立基线。

    - 构建数据飞轮：将线上反馈（Bad Cases）转化为修正的训练数据，形成“部署-反馈-清洗-重训”的闭环。

    - 投资数据标注工具和流程：建立详尽标注指南，实施标注员培训和校准，使用双重审核机制，持续监控标注者间一致性。将数据标注视为核心资产而非次要成本。

    - 进行数据消融实验：系统性地添加、移除或替换数据组件，量化每一类数据对最终模型能力的贡献，指导数据配比的科学决策。

    - 使用错误分析驱动数据改进：当模型表现不佳时，不是调超参，而是深入分析失败案例，反推数据中的盲区或错误，针对性地补充或修正数据。

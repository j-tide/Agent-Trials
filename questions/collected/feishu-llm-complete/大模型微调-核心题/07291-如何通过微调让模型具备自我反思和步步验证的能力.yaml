content:
  prompt: 如何通过微调让模型具备“自我反思”和“步步验证”的能力？
answer:
  mode: rubric
  reference_answer: "让模型具备自我反思和步步验证能力，本质上是将元认知过程外化为训练数据中的特定文本模式，通过SFT教会模型在回答前或回答后进行显式的思考与核查。\n\n数据构造策略：\n\n-
    构造“先思考，再回答”的思维链数据\n指令：“请计算一个长方体鱼缸的容积，长5米，宽2米，高3米。”\n回答：\n\n我需要计算长方体体积，公式是长 × 宽
    × 高。  \n步骤1：确认单位统一为米。  \n步骤2：代入数字：5 × 2 × 3 = 30。  \n步骤3：单位是立方米。  \n结论：鱼缸容积为30立方米。
    \ \n验证：长×宽得到底面积10平方米，再乘以高3米确实为30立方米，计算无误。\n\n通过在回答中显式加入“验证”环节，模型学会了在输出最终答案前进行自我确认。\n\n-
    构造“错误-发现-修正”的反思数据\n指令：“小明有3个苹果，每个2元，又买了5个橘子，每个3元，他一共花了多少钱？”\n回答：\n\n初步计算：苹果总价
    3×2=5元，橘子总价 5×3=15元，合计20元。  \n等等，我犯了一个错误。3乘2应该是6，不是5。让我重新计算。  \n苹果总价 3×2=6元，橘子总价
    5×3=15元，合计21元。  \n验证：6+15确实等于21。\n\n关键：在训练时，对“初步计算”部分进行损失掩码（labels设为-100），只让模型学习反思和修正后的内容。这教会模型在发现错误后如何回溯并纠正。\n\n-
    构造“多角度验证”数据\n对于同一个问题，提供用不同方法求解并互相印证的示范。例如，一道数学题既用代数法解，又用几何法验证。这让模型学会“一题多解，交叉验证”的思维模式。\n\n-
    构造“自我质疑”数据\n在回答中加入对自己的提问：“我的这个假设成立吗？”“是否存在我没有考虑到的边界情况？”模型被训练得在关键时刻停顿下来，审视自己的推理过程。\n\n训练与评估：\n\n-
    这类数据应与常规SFT数据混合训练，占比通常为10%-20%，防止模型在所有问题上都过度思考而变得啰嗦。\n\n- 评估时，可通过需要多步推理的任务（如GSM8K、MATH）以及专门的反思能力测试集来检验模型是否真正具备了自我纠错能力，而非仅仅模仿格式。\n\n本质：通过大量包含“显式反思语句”的对话数据，将模型的内在思考过程外化为可学习的语言模式，从而赋予其自我反思和验证的能力。\n\n---"

content:
  prompt: 如果微调模型在某个细分任务上很差，如何定位是数据还是训练问题？
answer:
  mode: rubric
  reference_answer: |-
    当模型在特定细分任务上表现不佳，问题的根源通常深藏在数据质量/覆盖度或训练策略/超参数之中。定位需要一套系统的排查流程，将“数据问题”和“训练问题”逐步剥离。

    定位策略：

    - 检查训练数据对该任务的覆盖度和质量

    - 观察训练和验证损失曲线

    - 进行数据对比实验（小规模消融）

    - 检查训练超参数和模型配置

    - 分析模型在该任务上的错误模式

    通过以上步骤，可以清晰地判断问题是出在数据层面还是训练层面，并针对性地进行修复。


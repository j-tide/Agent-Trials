content:
  prompt: 如何评估一个奖励模型的性能？
answer:
  mode: rubric
  reference_answer: |-
    评估奖励模型，核心是检验它与人类真实偏好的一致性。这是一个多层次的评估体系。

    - 偏好预测准确率（最直接）：在留出的测试集上，计算奖励模型正确判断 yw 分数高于 yl 的比例。这是最基础的指标，通常要求达到70%以上。

    - 与人工评分的相关性（更精细）：让多位专家对一批回答给出绝对分数。计算奖励模型的分数与专家分数之间的Spearman相关系数，衡量其排序能力。

    - 策略模型的最终性能（金标准）：用不同的候选奖励模型去完成完整的RLHF流程，然后比较最终训练出的策略模型在下游任务（如对话质量、安全性）上的表现。这是检验奖励模型实用价值的最终试金石，成本也最高。

    - 区分度与鲁棒性：一个合格的奖励模型应能稳定区分质量差异明显的回答，同时，面对各种越狱攻击、变形表达，它应能给出与原始表达一致的评分。

    - 分维度评估：在构造奖励模型时，有时可以设计多维度的评分系统。评估时，分别计算各维度的准确率，诊断模型的短板。


content:
  prompt: 数据去污染对SFT为什么极其重要？如何检测与评测基准的重叠？
answer:
  mode: rubric
  reference_answer: |-
    数据去污染是指在SFT训练前，系统性地检测并移除训练数据中与评测基准（如MMLU, GSM8K, HumanEval等）重叠或高度相似的样本。这对SFT的重要性怎么强调都不为过：

    - 防止虚假的性能通胀：如果训练数据中包含评测原题或高度相似变体，模型在评测中会表现出虚高的分数，但这种“能力”无法泛化到真实场景。这会严重误导研发决策。

    - 维护公平比较：不同团队的去污染程度不同，若不去污染，模型间的性能对比毫无意义。

    - 揭示真实短板：只有去污染后，评测分数才能真正反映模型的薄弱环节，指导后续迭代。

    - 学术诚信和商业合规：在一些竞赛或认证中，数据污染可能导致资格取消或法律风险。

    检测与评测基准重叠的方法：

    - n-gram重叠分析（粗筛）：将SFT样本与评测题目进行n-gram（如13-gram）重叠计算。如果某条训练样本与某评测题目的13-gram重叠率超过阈值（如60%），标记为疑似污染。方法快速但粗糙，难以发现语义改写。

    - 语义嵌入相似度（精筛）：用句子嵌入模型将训练和评测样本转化为向量，计算余弦相似度。对高相似度对进行人工审查，能发现间接污染。

    - 强模型辅助判断（终审）：对可疑样本对，使用GPT-4等判断“这两个问题是否在考察完全相同的知识和能力”，若是则判定为污染。

    - “金丝雀”测试（主动防御）：在训练集中故意植入一组极其罕见、绝不会自然出现的字符串。若训练后模型能复现这些字符串，则可反向评估评测集是否被泄漏。这是检测数据是否被“见过”的灵敏手段。

    - 隔离评估集：构建一个完全封闭、与训练数据来源严格隔离的内部评测集，用它作为最终能力检验。若公开基准高分而隔离集低分，说明公开基准已被污染。

    实际工程中，这些方法通常组合成一个多层过滤管道。


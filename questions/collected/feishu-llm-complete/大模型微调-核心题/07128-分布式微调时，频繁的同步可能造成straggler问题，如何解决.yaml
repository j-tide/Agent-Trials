  prompt: 分布式微调时，频繁的同步可能造成“straggler”问题，如何解决？
answer:
  mode: rubric
  reference_answer: |-
    “Straggler”（落后节点）是指在分布式训练中，某几张GPU或节点由于计算速度慢、网络延迟高、硬件故障等原因，完成同步所需时间远长于其他节点，导致整个集群等待它，拖慢整体训练速度。

    解决方案：

    - 硬件与网络优化：

    - 负载均衡：

    - 通信与计算重叠：

    - 弹性训练与容错：

    - 梯度累积：

    - 异构硬件调度：

    在实践中，最有效的是确保硬件同构和网络健康，并通过监控及时发现异常节点。


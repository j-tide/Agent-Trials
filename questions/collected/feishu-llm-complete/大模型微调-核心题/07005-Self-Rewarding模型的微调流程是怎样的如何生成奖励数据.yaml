content:
  prompt: Self-Rewarding模型的微调流程是怎样的？如何生成奖励数据？
answer:
  mode: rubric
  reference_answer: |-
    Self-Rewarding（自我奖励） 模型是一种不依赖外部奖励模型，能够自己为生成文本打分，并通过自我评判来实现对齐的模型。

    微调流程：

    - 初始SFT，注入评判能力：首先，基于一个强大的预训练模型，进行第一轮SFT。这个SFT数据集不仅包含标准的指令-回答对，还必须包含大量的“评判”数据。例如：“请评价以下回答的质量，并从准确性、流畅度、有用性打分。” 模型需要学会输出结构化的评判结果（如JSON格式）。通过这一阶段，模型同时具备了“考生”和“考官”的能力。

    - 自我奖励循环：

    [图片内容未导入]

    - 偏好对齐训练（DPO）：使用这些自我生成的偏好对数据，对模型进行一轮DPO训练，提升其指令遵循和对齐质量。此时，模型的能力得到提升。

    - 迭代：新的、更强的模型再次回到步骤2，既可以生成更高质量的候选回答，也能给出更精准的评判，从而产生更高质量的偏好数据。如此循环，模型的能力和对齐程度不断自我进化。

    如何生成奖励数据？

    奖励数据完全来自模型自身的输出。关键在于第一步SFT时注入的评判能力。在构造评判Prompt时，需要设计详细的评分标准（量规），引导模型进行多维度、有理由的打分。例如：“请作为一个严格的评审，根据以下标准给回答打分：1. 准确性（5分） 2. 有用性（5分）... 并解释评分理由。” 通过这种方式，模型能够稳定地输出可解析的评分，作为后续DPO的奖励信号。

    核心挑战：防止“自我表扬”和评判标准漂移。必须保留一部分人工标注的高质量偏好数据作为“校准锚”，定期对模型的评判能力进行验证和微调，确保其公正性和准确性。


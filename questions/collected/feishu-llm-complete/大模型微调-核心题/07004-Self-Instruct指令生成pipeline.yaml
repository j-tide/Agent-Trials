answer:
  mode: rubric
  reference_answer: |-
    ```python
    import openai
    import random
    import json

    openai.api_key = "your-api-key"

    def generate_self_instruct(seed_tasks: list, num_to_generate: int = 10, model="gpt-4"):
        generated = []
        for _ in range(num_to_generate):
            few_shot = random.sample(seed_tasks, min(6, len(seed_tasks)))
            prompt = "你是一个智能助手，请生成一个全新的、不同于以下示例的指令，并为该指令提供一个高质量的回答。\n\n"
            for task in few_shot:
                prompt += f"指令: {task['instruction']}\n回答: {task['output']}\n\n"
            prompt += "现在，请生成一个全新的指令和回答。\n指令:"

            response = openai.ChatCompletion.create(
                model=model,
                messages=[{"role": "user", "content": prompt}],
                temperature=0.8,
                max_tokens=256
            )
            content = response.choices[0].message.content.strip()
            # 简单解析（实际需更鲁棒）
            parts = content.split('\n回答:', 1)
            if len(parts) == 2:
                instr = parts[0].replace('指令:', '').strip()
                ans = parts[1].strip()
                # 去重
                if not any(instr == t['instruction'] for t in generated):
                    generated.append({'instruction': instr, 'output': ans})
        return generated
    ```

content:
  prompt: 数据标注团队如何管理和校准，以保证微调数据质量？
answer:
  mode: rubric
  reference_answer: |-
    微调数据的质量上限，取决于标注团队的能力和管理水平。管理标注团队不是一次性培训，而是一个持续的、需要量化监控的闭环过程。

    核心管理实践：

    - 构建极其详尽的标注指南（Guideline）

    - 阶梯式培训与认证

    - 双重审核与仲裁机制

    - 持续的信度监控与校准（Calibration）

    - 建立反馈与奖励机制

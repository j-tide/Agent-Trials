  prompt: 什么是混合专家模型（MoE）微调？与传统密集模型微调有何不同？
answer:
  mode: rubric
  reference_answer: |-
    混合专家模型（MoE）微调 是指在已经过预训练的MoE架构大语言模型上，使用特定任务或指令数据进行有监督的额外训练（SFT）或对齐训练（RLHF/DPO）。其目标是适配下游应用，同时保持MoE模型稀疏激活、高容量、低计算开销的优势。

    与传统密集模型微调的核心差异：

    [嵌入表格未展开]

    总结：MoE微调继承了密集模型微调的目标，但因其独特的稀疏激活和路由机制，带来了显存管理、负载均衡和路由稳定性等一系列新挑战。成功的MoE微调需要同时考虑专家的专长维护与负载平衡，通常需要结合特定的损失函数和微调策略。


content:
  prompt: 如何自动化地给微调数据打上质量标签？
answer:
  mode: rubric
  reference_answer: |-
    自动化质量标签是指利用规则、统计模型或另一个强模型（LLM），为每一条微调数据生成多维度的质量评分，从而支撑大规模的数据筛选和清洗，替代昂贵的人工逐条审核。

    实现方法：

    - 规则评分系统：定义一系列可自动检查的规则，每条规则赋予一个质量分数或权重，加权求和得到总分。规则包括：

    - 基于困惑度（PPL）的评分：使用一个独立的预训练语言模型（非待微调的模型），计算回复部分的PPL。为PPL设定一个“合适区间”，过高或过低都扣分。这能快速筛选出语言不通顺或过于简单/模板化的样本。

    - 基于小型质量分类器的评分：训练一个BERT级别的轻量级分类器，输入指令和回复，输出“高质量/低质量”的概率。训练数据可以来自人工标注的少量数据，或者用强模型自动打标的数据。这种方法比规则更智能，比大模型成本更低。

    - 基于强模型的评判（LLM-as-Judge）：这是目前最强大、最灵活的方法。调用GPT-4等顶级模型，根据精心设计的评判prompt，对指令-回答对进行多维度评分（如准确性、有用性、安全性、流畅度等），并输出JSON格式的评分和理由。可以要求模型进行思维链推理再打分。优点是质量极高，能处理复杂的语义判断；缺点是成本高、有延迟。

    混合管道：实践中常采用多层管道：先用规则和PPL过滤掉明显垃圾（<10%成本），再用轻量级分类器初筛，最后对不确定的样本或高价值数据用强模型进行终审。最终将所有分数汇总，形成一个统一的质量标签，用于数据配比、课程学习或直接过滤。

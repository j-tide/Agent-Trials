content:
  prompt: 什么是“data selection for domain adaptation”的典型方法？
answer:
  mode: rubric
  reference_answer: |-
    领域适应的数据选择是指从一个庞大的通用数据集中，选取与特定目标领域最相关、最有价值的子集，用于微调，从而在节省成本的同时提升领域效果。

    典型方法：

    - 基于语言模型困惑度（PPL）的打分：

    - 基于影响函数的选择：使用影响函数（或更简单的梯度匹配方法，如TracIn），计算通用数据中每条样本对目标领域验证集损失的“正面影响”。影响分数越高，表示该样本越有助于提升领域性能，应当被优先选择。

    - 基于嵌入相似度的检索：将目标领域的一个核心数据集（比如少量人工标注数据）的指令进行向量化，然后计算通用数据集中每一条指令的向量，通过余弦相似度检索出最相似的Top-K条数据。这能快速找到与目标任务格式和主题相似的数据。

    - 主动学习：先随机选择少量数据进行微调，得到一个初始模型。然后用这个模型对通用数据集中的样本进行“不确定性评估”（如预测概率的熵）。选择那些模型最不确定的样本，由人工进行标注或直接加入训练集。这能以最小的人工成本获取最大信息量的数据。

    - 分类器引导的过滤：训练一个二元分类器区分“领域数据”和“通用数据”，然后对通用数据集进行打分，选出得分最高（即最像领域数据）的样本。

    这些方法可以组合使用，形成一个高效的、自动化的领域数据选择管道。

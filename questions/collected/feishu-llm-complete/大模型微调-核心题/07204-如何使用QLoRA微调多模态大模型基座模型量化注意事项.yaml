content:
  prompt: 如何使用QLoRA微调多模态大模型？基座模型量化注意事项。
answer:
  mode: rubric
  reference_answer: |-
    QLoRA在多模态大模型中的应用，是在LoRA的基础上，将LLM主干量化为4-bit（NF4），从而在极低显存（如单张24GB GPU）下微调多模态模型。

    使用方法：

    - 量化LLM：使用bitsandbytes库将LLM部分加载为4-bit NF4格式。

    - 配置LoRA：按常规方式配置LoRA，仅将其应用于LLM的线性层。

    - 冻结视觉编码器和连接器：保持它们为原始精度（FP16/BF16），因为量化它们会导致显著的视觉特征损失。

    - 训练：使用Paged AdamW优化器，仅更新LoRA适配器的参数。

    基座模型量化注意事项：

    - LLM量化即可，勿量化视觉部分：视觉编码器和连接器对精度极其敏感，量化会严重损害其对图像细节的感知能力，导致回答质量大幅下降。QLoRA节省的显存已足够，无需再冒险量化视觉模块。

    - 数据类型一致：确保量化后的LLM计算时使用的数据类型（如BF16）与视觉特征的数据类型一致，避免不必要的类型转换开销。

    - 双重量化：在量化LLM时，启用QLoRA的“双重量化”选项，进一步压缩显存，将量化常数的开销也压到极低。

    - 梯度检查点：对于多模态输入，激活显存（尤其是大量视觉token）是主要瓶颈之一。必须开启梯度检查点，将激活占用降至最低。

    通过QLoRA，可以在单张RTX 4090等消费级显卡上，微调带有7B LLM的多模态大模型，极大降低了门槛。


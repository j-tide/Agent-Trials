content:
  prompt: 你认为微调数据工程中最容易被忽视的环节是什么？
answer:
  mode: rubric
  reference_answer: |-
    “指令多样性的持续维护”和“数据配比的动态调整” 是最容易被忽视，但影响极为深远的环节。

    - 指令多样性的持续维护：项目初期，团队通常会精心构造具有多样性的种子数据。但随着项目迭代，为了快速修复某个Bad Case，往往会大量补充该场景的相似数据。久而久之，数据集的分布逐渐窄化，模型虽然在特定场景上表现提升，但丧失了对长尾指令的泛化能力。这种“多样性漂移”是缓慢发生的，短期内不易察觉，直到模型在某个完全不同的场景下突然失效才被发现。维护多样性需要定期的数据分布审计（如统计任务类型、句式、长度的变化），并在每次数据更新时，像重视数量一样重视多样性的平衡。

    - 数据配比的动态调整：初始的数据配比通常基于经验和直觉。但模型的能力不是静止的——随着训练的进行，某些任务可能已经饱和，继续大量投入数据只会导致过拟合；而另一些任务仍然欠拟合，需要更多数据。如果不根据模型的实际表现动态调整配比，就会导致“强者愈强，弱者愈弱”的马太效应。科学的做法是定期评估模型各能力维度的性能，根据评估结果调整各类数据的采样权重，实施课程学习，将宝贵的训练预算从饱和区转移到瓶颈区。

    此外，数据文档（Data Cards）和元数据管理也常常被忽视。缺乏详尽的数据记录，会导致后期无法追溯某个数据成分的来源、处理过程和质量变化，使得问题排查和知识传承极为困难。

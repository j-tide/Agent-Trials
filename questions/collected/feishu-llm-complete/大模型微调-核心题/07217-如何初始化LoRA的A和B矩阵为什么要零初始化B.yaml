content:
  prompt: 如何初始化LoRA的A和B矩阵？为什么要零初始化B？
answer:
  mode: rubric
  reference_answer: |-
    LoRA的标准初始化策略是：

    - 矩阵A：使用随机高斯初始化（或Kaiming均匀初始化），以打破对称性并提供初始的随机探索方向。

    - 矩阵B：使用全零初始化。

    零初始化B的原因：

    - 保证初始时适配器增量 ΔW=BA=0。这意味着在微调开始时，模型的输出与原始预训练模型完全一致。如果B不是零，那么一加载适配器，模型行为就会立即改变，这可能破坏预训练知识，也使训练起点不确定。零初始化确保训练是从一个已知的、优良的预训练状态开始。

    - 让训练平稳启动：由于B=0，在第一步前向时，A的随机初始化不会对输出产生任何影响。梯度从后续步骤开始逐渐调整B，使得适配器的影响平稳增长。这避免了训练初期的剧烈振荡。

    - 有利于结合缩放因子：配合 α/r 缩放，即使B开始更新，其早期影响也被控制。LoRA+等变体通过给B更大的学习率，可以快速让B脱离零值，同时保持训练的稳定性。

    实践：在HuggingFace PEFT中，默认就会零初始化B，并使用Kaiming初始化A。这是LoRA成功的关键细节之一。


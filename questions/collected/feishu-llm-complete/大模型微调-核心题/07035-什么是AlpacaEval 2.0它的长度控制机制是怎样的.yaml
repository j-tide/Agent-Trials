content:
  prompt: 什么是AlpacaEval 2.0？它的长度控制机制是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    AlpacaEval 2.0是一个自动化评估SFT模型指令遵循能力的基准，它以简单、快速、低成本、高可复现而广泛流行。其核心思想是：用强模型作为自动评判者，对被评估模型的输出进行胜率统计。

    主要测什么：它主要测试模型在单轮指令遵循任务上的综合能力，覆盖了从日常对话、知识问答到创意写作等多种用户请求。它并不像MT-Bench那样深入测试多轮对话和复杂推理，而是提供一个对模型通用指令遵循能力的快速扫描和量化。

    评判标准：AlpacaEval 2.0使用GPT-4 Turbo作为自动评判模型。评估时，给GPT-4同时呈现用户指令、被评估模型的回答、以及一个参考模型（通常是GPT-4 Turbo自己生成的回答）的回答。评判模型需要比较这两个回答，并选择哪个更好，或者判定平局。最终计算被评估模型的胜率。

    长度控制机制：这是AlpacaEval 2.0的核心创新。由于GPT-4等评判模型存在长度偏差——倾向于给更长的回答更高的分数——原始胜率会受到模型输出长度的影响。为了更纯粹地反映回答质量，AlpacaEval 2.0引入了长度控制胜率。其做法是：通过一个回归模型，将胜率中由回答长度差异所解释的部分移除。具体来说，它基于评测数据建立一个“长度-胜负”的统计模型，然后计算在控制长度因素后，被评估模型的“真实”胜率。这使得评估结果更加公平和可信，能更准确地反映模型除了“能写长文”之外的真实能力。


content:
  prompt: 为什么LoRA常被用在Q、V投影矩阵，有时也用于K、O？区别何在？
answer:
  mode: rubric
  reference_answer: |-
    核心原因：注意力机制中，Q（Query）和V（Value） 分别控制着“关注什么”和“关注到什么信息”，调整它们能最高效地重塑模型的行为模式。K和O则扮演辅助角色，加入它们可以在容量和性能间进一步扩展。

    Q、V、K、O在注意力中的角色：

    - Q：决定当前token“想去关注”哪些其他token（查询）。

    - K：决定该token“能被关注”的匹配特征（键）。

    - V：决定该token“实际提供”的信息内容（值）。

    - O：将多头注意力的结果投影回隐藏维度（输出投影）。

    为什么通常首选Q和V？

    大量实验（包括LoRA原论文）表明，仅对Q和V注入LoRA就足以显著改变模型的注意力分布和生成行为，效果非常接近全量微调。原因在于：调整Q可以改变模型对上下文的“提问方式”，调整V可以改变每个位置实际输出的“信息内容”。这两者的结合能高效地控制信息流动和最终输出，而可训练参数量却保持极低。对Q和V的适配已经覆盖了注意力机制中最关键的两个自由度。

    为什么有时也用于K？

    加入K可以进一步增强适配能力。调整K意味着改变每个token的“身份标签”，从而影响其他token对它的关注程度。这有助于模型学习新的实体、术语或领域特定的关联。当任务需要深度改变模型的“底层特征匹配”时（如多语言适应、全新领域术语注入），对K的适配会带来额外收益，但也会增加一定的参数量和过拟合风险。

    为什么有时也用于O？

    O是注意力输出后的线性投影，它混合了多个头的信息并匹配后续FFN的输入。对O的适配可以调整整个注意力模块输出的表达，相当于一种更全局的控制。加入O通常能进一步提升适配容量，尤其适用于需要精细控制输出风格或格式的任务。

    区别总结：

    - 参数效率：Q/V > Q/V + K > Q/V/K/O。

    - 行为改变能力：通常随注入模块增加而增强，但边际收益递减，过拟合风险递增。

    - 一般建议：从 ["q_proj", "v_proj"] 开始，若效果不足再逐步加入 k_proj 和 o_proj。


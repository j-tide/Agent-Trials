content:
  prompt: 如何在HuggingFace PEFT库中配置LoRA？给出关键参数。
answer:
  mode: rubric
  reference_answer: |-
    在HuggingFace PEFT库中，使用LoraConfig类配置LoRA，然后通过get_peft_model()将基座模型转换为可训练的PEFT模型。以下是关键参数的详细说明和示例代码。

    示例代码：

    from peft import LoraConfig, get_peft_model, TaskType
    from transformers import AutoModelForCausalLM

    # 加载基座模型
    model = AutoModelForCausalLM.from_pretrained("meta-llama/Llama-2-7b-hf")

    # 配置LoRA
    lora_config = LoraConfig(
        r=8,                              # LoRA的秩
        lora_alpha=16,                    # 缩放因子
        target_modules=["q_proj", "v_proj"],  # 应用LoRA的模块名
        lora_dropout=0.1,                 # LoRA适配器的dropout率
        bias="none",                      # 是否训练bias
        task_type=TaskType.CAUSAL_LM      # 任务类型
    )

    # 注入LoRA适配器
    model = get_peft_model(model, lora_config)
    model.print_trainable_parameters()  # 打印可训练参数量

    关键参数详解：

    [嵌入表格未展开]

    其他高级参数（可选）：

    - fan_in_fan_out：如果模型权重存储方式需要转置（如某些旧模型），设为True。通常不需要手动设置，PEFT会自动处理。

    - init_lora_weights：初始化方法，默认True即使用标准的kaiming初始化A、零初始化B。

    - layers_to_transform：只对指定的层索引应用LoRA，用于更精细的控制。

    如何选择target_modules：

    - 简单任务、数据少：["q_proj", "v_proj"]。

    - 需要更强能力：["q_proj", "k_proj", "v_proj", "o_proj"]。

    - 深度领域适应或知识注入：再加上FFN层如["gate_proj", "up_proj", "down_proj"]，但需谨慎。

    注意：配置完成后，必须调用get_peft_model(model, lora_config)来获得可训练的PeftModel。训练时只需保存model.save_pretrained()（保存适配器权重），推理时用PeftModel.from_pretrained(base_model, adapter_path)加载。


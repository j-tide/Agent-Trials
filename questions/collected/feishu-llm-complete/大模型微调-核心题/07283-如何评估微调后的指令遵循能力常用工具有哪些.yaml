content:
  prompt: 如何评估微调后的指令遵循能力？常用工具有哪些？
answer:
  mode: rubric
  reference_answer: |-
    指令遵循能力是指模型精确执行用户指令中明确约束的能力，如“用JSON格式输出”、“分三点作答”、“字数限制在100字以内”等。这项能力是SFT的核心目标之一，需要专门的评估工具。

    常用评估工具：

    - IFEval（Instruction-Following Eval）：目前最权威、最客观的指令遵循基准。它通过程序化验证，评估模型对25类可验证约束的遵循率，完全杜绝了主观评分偏差。

    - FollowBench：将指令约束分为五大类（内容、风格、格式、混合等），提供了更细粒度的诊断。

    - 自定义评估集：根据自身业务需求，构造包含特定约束（如“以表格形式返回”、“回复中必须包含关键词XXX”）的指令，并编写自动验证脚本（正则、JSON解析、字数统计等）。

    - GPT-4-as-Judge：对于无法程序化验证的软约束（如“用幽默的语气”、“展现出共情力”），使用强模型进行评判。

    评估流程：

    - 准备一个包含各种约束的指令集合。

    - 让模型生成回答。

    - 对于硬约束（格式、字数、关键词等），使用自动化脚本进行逐条验证，计算约束满足率（满足的约束数/总约束数）。

    - 对于软约束，交由GPT-4或人工进行评分。

    - 汇总得分，并分析模型在哪些类型的约束上容易失败（如经常忽略“不”字、容易遗漏格式要求），为后续数据优化提供方向。


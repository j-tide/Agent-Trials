content:
  prompt: 如何通过数据增强扩充微调数据集？常用方法有哪些？
answer:
  mode: rubric
  reference_answer: |-
    当已有数据在数量、多样性或特定能力覆盖上不足时，数据增强（Data Augmentation）是扩充数据集、提升模型泛化能力的关键手段。目标是在保持语义正确性和格式一致性的前提下，增加指令和回答的变体。

    常用方法：

    - 指令改写与扩写：使用强模型（如GPT-4）对现有指令进行同义改写、句式变换、口语化/正式化转换、增加或减少背景信息等。可以生成大量语义相同但措辞迥异的指令变体，有效防止模型过拟合于特定模板。

    - 回译增强（Back-Translation）：将指令翻译成另一种语言，再翻译回原语言。由于机器翻译过程中的信息重组，可以得到语义高度一致但用词、句法自然变化的新指令。这是增加指令措辞多样性的低成本方法。

    - 任务迁移与难度进化（Evol-Instruct）：保留任务的核心结构，但将主题从“经济”迁移到“教育”、“医疗”等（广度进化）；或为指令增加更多约束条件、推理步骤，使其变得更复杂（深度进化）。这能系统性地提升数据集的覆盖面和难度。

    - 多源混合生成：使用不同的教师模型（如GPT-4, Claude, Gemini），并设置不同的生成参数（如temperature），对同一批指令生成多种风格的回答。混合后能打破单一模型的风格偏好，增加数据的多样性。

    - 对抗性样本生成：专门构造一些容易诱导模型犯错的指令，如包含逻辑陷阱、虚假前提、越狱攻击等。将这些指令与正确的回应（如识破陷阱、拒绝不当请求）配对加入数据集，能极大提升模型的鲁棒性和安全性。

    - 多参考回答训练：对同一个开放式指令（如“写一首诗”），提供2-3个质量高但风格不同的回答作为正例。这会告诉模型：“好答案不止一个”，从而鼓励创造力和多样性。

    注意：所有数据增强都必须配套进行质量过滤。增强后可能产生语法不通、事实错误或格式混乱的样本，需要通过基于困惑度、规则或强模型评判等手段进行筛选，确保增强后的数据集质量不降级。

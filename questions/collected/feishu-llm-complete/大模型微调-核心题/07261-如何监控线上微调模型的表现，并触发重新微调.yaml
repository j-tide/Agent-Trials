content:
  prompt: 如何监控线上微调模型的表现，并触发重新微调？
answer:
  mode: rubric
  reference_answer: |-
    线上监控是连接模型训练与业务价值的桥梁。一个成熟的监控体系不仅能看到模型“生病了”，还能自动触发“治疗”。

    - 建立业务驱动的监控体系

    - 模型性能黄金指标：围绕业务定义2-3个北极星指标，如客服场景的“问题独立解决率”，内容生成场景的“用户采纳率”。这是衡量模型价值的最终依据。

    - 泛化性能监控：设置一组固定的、与生产环境数据分布隔离的“探头”数据集（包含核心业务场景、安全对抗样本）。定期（如每小时）使用当前模型对这些探头进行推理，并自动计算准确率、格式遵循率等分数，绘制趋势图。分数的突然下降是模型能力退化的直接证据。

    - 输入/输出分布漂移监控：利用“数据素描”技术持续监控线上请求和模型输出的分布（如指令长度、PPL、关键实体词频）。当分布发生显著漂移（如用户开始大量问及新领域的问题）时，说明模型的知识可能已经过时。

    - 设定智能告警与触发规则

    - 静态阈值告警：当某项指标（如安全拒绝率）低于绝对红线（如95%）时，立即触发告警。

    - 动态基线告警：基于过去一周的指标数据建立动态基线，当指标偏离基线超过3个标准差时，判定为异常。

    - 触发重新微调的条件：为了避免频繁训练，设定复合触发条件。例如：“探头数据集上的核心准确率连续3天下降，且线上点踩率一周内上升超过20%”，这两个条件同时满足时，自动触发一个“模型优化工单”。

    - 自动化重新微调Pipeline

    - 工单触发后，系统自动回溯最近一段时间的线上数据，筛选出点踩、举报、中断等Bad Case，与人工标注的“黄金校正集”合并，构成增量训练数据集。

    - 自动启动一次增量微调任务（使用PEFT），在上一版模型的基础上，用这些高质量数据“纠错”。

    - 新模型训练完成后，自动进入灰度发布流程（见第12题），验证有效后平滑上线，完成自动修复闭环。


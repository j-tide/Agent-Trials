content:
  prompt: 如何处理微调数据中不同语言的比例？
answer:
  mode: rubric
  reference_answer: |-
    处理多语言微调数据比例，不是简单的平均分配，而是基于基座模型的预训练语言分布、目标用户市场和语言本身的能力需求来综合确定。

    策略与方法：

    - 用户导向策略：按产品目标用户的语言使用比例分配。例如，如果预测60%用户使用中文，30%英文，10%日文，则数据比例大致按此配置。

    - 能力均衡策略：对于低资源语言，即使目标用户不多，也应分配一个最低保证量（例如每种语言至少2000条），以确保模型在该语言上达到基本的可服务性，而非完全遗忘。

    - 英语锚定策略：英语通常作为跨语言迁移的“知识中枢”。在通用模型中，英语数据常占40%-60%，因为它能很好地泛化到其他语言。其他高资源语言（中、日、西等）各占5%-15%。

    - 课程学习与分阶段训练：

    - 数据增强与跨语言迁移：对于低资源语言，使用回译或直接翻译高资源语言的指令和回答，再经过人工校验来扩充数据量。

    关键注意事项：

    - 安全对齐必须本地化：不同语言文化中的安全边界和拒绝方式差异巨大，必须由当地母语者设计安全样本。

    - 监控各语言性能：在训练过程中，必须单独监控每种语言在验证集上的表现，防止某种语言被过度牺牲。

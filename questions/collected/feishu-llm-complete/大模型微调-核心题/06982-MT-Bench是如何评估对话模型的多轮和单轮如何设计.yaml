content:
  prompt: MT-Bench是如何评估对话模型的？多轮和单轮如何设计？
answer:
  mode: rubric
  reference_answer: |-
    MT-Bench是由LMSYS Org提出的一种用于评估聊天助手模型的多轮对话基准测试。它被设计用来衡量模型在多轮交互、复杂指令遵循和通用对话能力上的表现，弥补了传统单轮基准的不足。

    评估流程：

    - 多轮对话测试设计：MT-Bench包含80个精心设计的多轮对话问题。这些问题被分为8个主要能力类别：写作、角色扮演、头脑风暴、推理、数学、编码、知识、提取。每个问题通常包含两轮对话，模拟真实用户与助手的连续互动。例如，第一轮是开放式问题，第二轮则是要求细化、修改或深入追问。

    - 模型生成回答：被评估的SFT模型针对每个问题生成多轮回答。对话历史被完整保留，以确保回答的上下文一致性。

    - GPT-4作为评判者：生成完毕后，使用GPT-4对模型回答进行打分。GPT-4同时看到用户问题、参考回答（如果有）以及被评估模型的回答。

    - 逐轮打分与综合：GPT-4对每一轮对话单独打分，然后两轮分数取平均作为该问题的最终得分。最终所有问题得分的平均即为模型的MT-Bench总分。

    - 多维度评判：GPT-4被要求从多个维度综合考量，包括准确性、有用性、流畅度、参与度和创造力。裁判同时被要求给出一个综合打分，通常为1-10分。

    多轮与单轮的设计差异：

    - 单轮：仅包含独立的指令-回答对，评估模型对单一指令的执行能力。它不涉及上下文记忆。

    - 多轮：精心构造了具有依赖关系的对话链。第二轮的问题往往指代第一轮的内容、要求对第一轮的回答进行修改、深化或质疑。这迫使模型必须准确理解并记忆对话历史，才能给出连贯、一致的回答。多轮设计直接测试了模型的上下文追踪、指代消解和状态管理能力。

    核心优势：MT-Bench通过多轮对话设计和强模型评判，能够捕获模型在动态、连续交互中的深层能力，这是单轮基准无法做到的。


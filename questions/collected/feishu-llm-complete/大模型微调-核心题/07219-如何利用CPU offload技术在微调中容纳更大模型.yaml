content:
  prompt: 如何利用CPU offload技术在微调中容纳更大模型？
answer:
  mode: rubric
  reference_answer: |-
    CPU offload技术将部分模型状态（通常为优化器状态，也可包括参数和梯度）从GPU显存卸载到CPU内存，当需要时再通过PCIe总线异步取回。这使得GPU显存仅需容纳当前活跃计算所需的最小数据量，而庞大的优化器状态和部分参数可以放在廉价的大容量CPU内存中。

    实现方法：

    - DeepSpeed ZeRO-Offload：在ZeRO-2或ZeRO-3配置中，设置"offload_optimizer": {"device": "cpu", "pin_memory": true}，可以将优化器状态（动量和方差）卸载到CPU。在ZeRO-3下还可设置"offload_param": {"device": "cpu"}将参数分片也卸载，进一步节省GPU显存。

    - FSDP：通过offload_to_cpu=True实现类似功能。

    - PyTorch手动：使用torch.utils.checkpoint或手动将张量.to('cpu')，但效率低。

    效果与代价：

    - 显存节省：例如，微调70B模型，优化器状态有560 GB，卸载到CPU后，GPU显存只需存放权重（可分片）、激活和临时缓冲区，极大降低GPU需求。

    - 速度下降：由于CPU和GPU之间的数据传输受限于PCIe带宽（通常几十GB/s，远低于HBM），训练速度会下降20%~50%甚至更多。通过预取和通信与计算重叠可以部分隐藏延迟。

    - 应用场景：在显存极度受限的情况下（如单卡24GB微调13B模型），offload是必备技术。结合PEFT（LoRA）效果更佳。


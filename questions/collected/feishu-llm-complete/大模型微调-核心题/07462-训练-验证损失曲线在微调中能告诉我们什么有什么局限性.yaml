content:
  prompt: 训练/验证损失曲线在微调中能告诉我们什么？有什么局限性？
answer:
  mode: rubric
  reference_answer: |-
    它能告诉我们什么：

    - 训练损失：持续下降说明模型在训练数据上的拟合程度在提高。如果下降得非常快，说明学习率可能合适或偏高；如果几乎不降，可能学习率过小或数据有问题。

    - 验证损失：是过拟合的晴雨表。验证损失下降表示模型的泛化能力在提升；一旦验证损失停止下降并开始反弹（形成“U”型或剪刀差），则是过拟合的明确信号。此时应停止训练。

    - 收敛状态：损失趋于平稳说明模型在当前数据容量下已经饱和，继续训练意义不大。

    局限性（为什么不能只看Loss）：

    - 生成质量与Loss的非单调关系：这是最大的局限。交叉熵损失只衡量对下一个token的预测精度，它无法感知模型是否变得啰嗦、是否产生幻觉、是否学会了安全但空洞的回答。经常出现“Loss下降，但实际对话体验变差”的情况。

    - 对输出多样性的漠视：Loss鼓励模型将概率集中到训练样本上，导致分布坍缩，输出千篇一律。但这个过程在Loss曲线上完全体现不出来——Loss甚至可能继续下降。

    - 无法检测灾难性遗忘：验证损失集通常与训练集同分布，它无法告诉你模型在通用知识、推理等旧任务上是否退化。遗忘往往悄然发生，而验证损失可能纹丝不动。

    - 受评估集构造影响大：如果验证集和训练集划分不当（如存在数据泄漏），验证损失会给出过于乐观、虚假的信息。

    因此，Loss是训练过程中重要的监控器，但绝不能作为选择最优模型的决策器。必须结合生成式评估、通用基准和能力诊断，多维度判断。


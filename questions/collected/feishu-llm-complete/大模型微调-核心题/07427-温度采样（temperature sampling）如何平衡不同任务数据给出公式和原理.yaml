    工作原理：通过调节 α，我们可以让数据量较少的任务在训练中获得比其原始比例更高的“曝光率”，同时又不至于完全忽略高频任务中蕴含的基础语言模式。这样既保证了模型不会偏废低频能力，又避免了因为过度上采样少数样本而导致的过拟合。

    实践建议：通常从 α=0.5 开始实验，如果发现低频任务仍欠拟合，则降低 α（如0.3）；如果高频任务性能显著下降，则提高 α（如0.7）。也可以采用动态 α，训练初期较高以打好通用基础，后期降低以专精弱项。

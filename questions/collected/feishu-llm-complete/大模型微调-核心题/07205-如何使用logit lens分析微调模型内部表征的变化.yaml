content:
  prompt: 如何使用logit lens分析微调模型内部表征的变化？
answer:
  mode: rubric
  reference_answer: |-
    Logit Lens是一种解释性技术，它允许我们窥探Transformer模型在生成每个token时，其每一层对最终输出token的“早期预测”。具体做法是：将某一中间层的隐藏状态，直接通过模型最后的语言模型头（LM head，不经过后续层），映射到词表空间，得到该层的logits。

    在微调诊断中的应用：

    我们可以对比同一个指令在微调前后的模型上，其逐层预测的变化轨迹，来理解SFT是如何改变模型行为的。

    - 诊断安全对齐的机制：对于一个有害指令，观察微调前后，模型各层对有害token的预测概率变化。

    - 诊断灾难性遗忘的微观表现：对于一个预训练时能正确回答的事实性问题，微调后模型却答错了。使用Logit Lens观察，发现微调后模型在底层仍然能“回忆”起正确答案（该token概率较高），但在中间某层，错误答案的概率突然飙升并最终胜出。

    - 分析指令遵循的“决策路径”：观察模型在看到某个格式要求（如“以JSON输出”）时，是在哪一层开始将“{”的概率迅速提升的。微调后，这个“决策点”应该提前，且变得更加确定。


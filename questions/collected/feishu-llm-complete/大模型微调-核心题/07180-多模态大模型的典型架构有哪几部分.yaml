answer:
  mode: rubric
  reference_answer: |-
    一个典型的多模态大模型（MLLM）通常包含三个核心组件，它们各司其职，协同完成跨模态理解与生成任务。

    [嵌入表格未展开]

    核心工作流：图像 → 视觉编码器 → 视觉特征向量 → 跨模态连接器 → 视觉token（与文本token同维） → 与文本指令的token拼接 → 输入LLM → 生成文本回答。

    这个架构设计的精妙之处在于，它允许LLM在几乎不修改自身结构的情况下，“看到”了图像，并将视觉信息作为生成文本的上下文。


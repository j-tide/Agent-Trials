content:
  prompt: 如何微调多模态模型成为一个“GUI agent”？需要哪些数据？
answer:
  mode: rubric
  reference_answer: |-
    GUI Agent 能根据屏幕截图自主地操作图形用户界面，完成复杂任务。

    所需数据类型：

    - GUI 截图-动作对：这是最核心的数据。包含一张 GUI 界面截图，以及模型应执行的下一步操作。动作通常表示为结构化的 (动作类型, 参数)，如 (CLICK, [x, y])， (TYPE, "hello")， (SCROLL, down)。动作可通过坐标 token 或文本描述来表示。

    - 任务轨迹数据：为了完成一个多步任务（如“预订一张机票”），需要一系列截图-动作对的序列。完整的轨迹展示了模型如何根据当前界面状态进行决策。这是训练长期规划和状态追踪能力的关键。

    - 错误恢复数据：当模型执行了一个错误操作，导致界面跳转到预期之外的状态时，如何识别错误并回退或修正。这类数据能极大提升 Agent 的鲁棒性。

    - 动作指令数据：自然语言指令与对应的动作序列配对，让模型学会将模糊的高级目标（如“把页面调成夜间模式”）分解为具体的 GUI 操作。

    - 移动端与 Web 端数据：分别覆盖 Android、iOS 和 Web 环境的 GUI，包括不同分辨率和组件样式。

    微调时坐标表示：将归一化的点击坐标（值域 [0,1]）转为文本 token 预测，是当前主流的做法。


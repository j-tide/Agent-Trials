    - 限制探索范围：它将PPO的探索空间从“整个浩瀚的语言宇宙”缩小到“SFT模型邻域的一个高概率区域”。这使得模型很难到达那些“高奖励但诡异”的参数角落，从而从根本上提高了奖励破解的门槛。

    - 对齐税调控器：β 越大，模型越保守，遗忘越少，但对齐程度受限；β 越小，模型越激进，对齐效果可能更好，但遗忘和破解风险也越高。调节 β 就是在“能力”和“对齐”之间做权衡。


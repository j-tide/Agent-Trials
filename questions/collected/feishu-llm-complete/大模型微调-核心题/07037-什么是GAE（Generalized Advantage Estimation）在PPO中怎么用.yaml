    - 在RLHF的PPO中如何使用GAE？

    在RLHF中，整个生成的回答序列被视为一条轨迹。PPO训练时，我们已知：

    - 奖励模型对整个回答给出的最终标量奖励 r(x,y)。通常，我们会将这个奖励视为仅出现在生成结束的最后一个token，中间token的奖励为0（或使用KL惩罚作为逐token的负奖励）。

    - 价值模型 Vψ 对序列中每个时间步的状态给出估计价值。

    [图片内容未导入]

    GAE的引入，让RLHF训练在面对稀疏奖励（整个回答只有一个最终分数）时，能够更合理地将“功劳”或“责任”分配到生成回答的每一个token上，从而更有效地学习。


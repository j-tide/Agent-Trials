content:
  prompt: 什么是GAE（Generalized Advantage Estimation）？在PPO中怎么用？
answer:
  mode: rubric
  reference_answer: |-
    GAE（广义优势估计） 是一种在强化学习中用于估计优势函数的技术，由Schulman等人提出。它的核心目标是在估计优势时，平衡偏差和方差，从而让策略梯度的训练更稳定、高效。

    - 什么是优势函数（Advantage Function）？

    [图片内容未导入]

    - GAE的核心思想
    直接计算优势通常使用蒙特卡洛（MC）方法或时间差分（TD）方法。MC方法用实际完整回报计算，但方差大（因为随机性）；TD方法用价值模型一步估计，但偏差大（因为价值模型本身不完美）。GAE通过指数加权平均多步TD误差的方式，将两者结合起来，通过一个参数 λ 来调控偏差-方差权衡。


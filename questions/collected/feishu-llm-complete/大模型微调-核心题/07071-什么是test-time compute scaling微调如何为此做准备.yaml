content:
  prompt: 什么是“test-time compute scaling”？微调如何为此做准备？
answer:
  mode: rubric
  reference_answer: |-
    Test-time compute scaling 是一种在模型推理阶段，通过投入更多计算资源来提升回答质量的技术范式。其核心思想是：不改变模型参数，而是让模型在回答一个问题时“思考更久、探索更多”，从而获得更好的结果。 OpenAI的o1模型是这一思想的典型实践。

    具体表现形式：

    - 思维链长度增加：模型在输出最终答案前，产生更长的、更深入的内部推理（隐式或显式思维链）。

    - 自洽性采样：对同一问题独立采样多个回答，然后通过投票或奖励模型选出最优解。

    - 树搜索或蒙特卡洛树搜索：在生成过程中探索多个可能的推理路径，评估并选择最有希望的方向。

    - 多轮自我修正：模型生成初步答案后，自我批评并迭代修正。

    微调如何为此做准备？

    为了让模型能够在推理时有效利用额外的计算资源，微调阶段的数据和训练策略需要与之配合：

    - 构造长程推理数据：在SFT数据中，包含大量需要进行多步推理、多路径探索、并最终收敛到正确答案的样本。例如，提供展示了多种解题思路并比较择优的“思维树”式对话。这能让模型习惯于生成结构化的、可扩展的推理链。

    - 强化搜索与回溯能力：在数据中植入“死胡同”式的错误推理路径，并示范模型如何识别错误、回溯并尝试新路径。训练出的模型在推理时被赋予了更长的“思考预算”时，能够自发地进行更深入的探索和纠错。

    - 奖励模型的过程监督：在训练奖励模型时，不仅对最终结果进行评分，还对中间推理步骤的正确性进行评分（过程奖励模型，PRM）。这样在推理时，可以使用树搜索算法，利用PRM评估每一步的推理质量，引导模型选择最有希望的路径。

    - 使用RL训练探索策略：通过RLHF或GRPO等方法，奖励模型在复杂推理任务上生成正确且推理充分的回答。这鼓励模型主动延长思维链，学习如何分配计算资源以换取更高的准确率。

    总结：微调为 test-time compute scaling 提供了“会思考”的基座模型。它通过数据将“如何思考”的模式注入模型，使得在推理时给予更多计算资源时，模型知道如何有效地利用它们，而不是产生重复或无意义的文本。


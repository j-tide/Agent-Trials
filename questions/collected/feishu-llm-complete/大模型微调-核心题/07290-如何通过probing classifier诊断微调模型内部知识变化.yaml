content:
  prompt: 如何通过“probing classifier”诊断微调模型内部知识变化？
answer:
  mode: rubric
  reference_answer: |-
    Probing Classifier（探针分类器） 是一种诊断性工具，用于检验模型的内部隐藏表征是否编码了特定的语言属性或知识。其做法是：冻结模型的参数，在某一层或多层的隐藏状态上，训练一个简单的线性分类器（探针），来预测某个感兴趣的特征（如词性、实体类别、事实的真假）。

    在微调场景下，我们可以使用探针来精准定位模型的知识是否被修改、覆盖或遗忘。

    诊断步骤：

    - 定义探测任务：根据关心的能力变化设定。例如，要诊断模型是否忘记了“巴黎是法国首都”这个事实，探测任务可以是：“给定包含‘巴黎’和‘首都’的句子，判断其后正确的国家名是否为‘法国’”。

    - 准备探测数据集：构造一组“探测样本”，例如：

    - 提取隐藏状态：将探测数据分别输入微调前和微调后的模型，在每个Transformer层提取出目标token位置的隐藏状态向量。

    - 训练线性探针：对每一层，用提取出的隐藏状态作为特征，训练一个简单的逻辑回归分类器（探针），去预测该事实的真假（如“下一个词应该是‘巴黎’”）。

    - 对比探针性能：

    优势：探针可以逐层、细粒度地揭示模型内部知识的组织方式和变化，比只看最终输出黑盒要深入得多。它让我们知道，模型的“遗忘”是在知识存储层就已经丢失，还是在输出层被错误的行为偏差覆盖。


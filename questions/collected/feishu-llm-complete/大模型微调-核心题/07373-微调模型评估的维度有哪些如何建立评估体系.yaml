content:
  prompt: 微调模型评估的维度有哪些？如何建立评估体系？
answer:
  mode: rubric
  reference_answer: |-
    一个完整的微调评估体系必须覆盖能力、安全、稳定性和效率四大支柱，并且需要将离线评估与在线评估相结合。

    核心评估维度：

    [嵌入表格未展开]

    如何建立评估体系：

    - 分层构建评估集：

    - 核心业务集（100-500条）：由业务专家手工构造，覆盖最核心、最高频、最难处理的场景。评估方式以人工评估为主，是决策的黄金标准。

    - 自动化基准集：用于快速、低成本的回归测试。包括IFEval（格式遵循）、MMLU（知识）、GSM8K（推理）、安全Prompt集合等。

    - 对抗与边界测试集：专门设计用于探测模型盲区的案例，如越狱攻击、过度拒绝、幻觉诱导等。

    - 建立评估管道：将上述评估集整合到自动化的评估脚本中，每次微调实验后，一键生成包含所有维度的综合报告。

    - 设定质量门禁（Quality Gate）：为关键维度设定最低可接受标准。例如，“安全拒绝率不得低于95%”、“MMLU得分下降不得超过3%”。任何一项不达标，模型均不能上线。

    - 离线与在线评估结合：离线评估选出候选模型，再通过线上A/B测试，收集真实用户的满意度、任务完成率等业务指标，进行最终裁决。

    - 持续迭代评估集：根据线上Bad Case和用户反馈，不断更新和扩充评估集，使评估始终贴近真实应用场景。


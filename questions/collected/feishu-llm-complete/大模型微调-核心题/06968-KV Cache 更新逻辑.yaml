answer:
  mode: rubric
  reference_answer: |-
    ```python
    def update_kv_cache(
        new_k: torch.Tensor,      # (batch, num_heads, 1, head_dim)
        new_v: torch.Tensor,      # 同上
        cache_k: torch.Tensor,    # (batch, num_heads, past_len, head_dim) 或 None
        cache_v: torch.Tensor,
        max_cache_len: int = None
    ):
        """
        将新 token 的 K,V 拼接到历史缓存中。若 cache 为空，则直接返回 new_k, new_v。
        若设置了 max_cache_len，则仅保留最近的 max_cache_len 个 token。
        """
        if cache_k is None:
            return new_k, new_v
        # 沿 seq_len 维度拼接 (dim=2)
        updated_k = torch.cat([cache_k, new_k], dim=2)
        updated_v = torch.cat([cache_v, new_v], dim=2)
        if max_cache_len is not None and updated_k.size(2) > max_cache_len:
            updated_k = updated_k[:, :, -max_cache_len:, :]
            updated_v = updated_v[:, :, -max_cache_len:, :]
        return updated_k, updated_v
    ```

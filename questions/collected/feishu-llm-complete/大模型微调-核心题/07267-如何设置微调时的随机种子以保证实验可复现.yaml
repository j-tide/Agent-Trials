content:
  prompt: 如何设置微调时的随机种子以保证实验可复现？
answer:
  mode: rubric
  reference_answer: |-
    在深度学习实验中，完全的绝对可复现（位级别）是极其困难的，但我们可以通过在关键环节设置随机种子，达到高度可复现（统计级别），这对于调试和比较实验至关重要。

    需要固定随机种子的环节：

    - Python环境：random.seed(seed)

    - NumPy环境：np.random.seed(seed)

    - PyTorch环境：torch.manual_seed(seed)；若有GPU，需额外设置torch.cuda.manual_seed(seed)和torch.cuda.manual_seed_all(seed)（多卡时）。

    - 深度学习框架的确定性设置：这是最关键也最容易被忽略的。需要开启：

    - 数据加载器的Worker进程：如果DataLoader的num_workers > 0，这些子进程会有自己的随机状态。需要通过worker_init_fn参数传入一个函数，该函数使用主进程的种子为每个子进程设置随机种子。

    - Transformers Trainer的种子：Trainer在初始化时会使用TrainingArguments中的seed参数来自动设置上述大部分环境，并管理数据加载器的种子。这是最方便的做法，只需在TrainingArguments(seed=42)中指定即可。

    总结：通常，只需在脚本开头调用统一函数，并在TrainingArguments中设置seed，就能达到可复现要求。但需注意，即使设置了上述所有，不同硬件（如不同型号GPU）、不同cuDNN版本或某些并行操作（如FlashAttention的实现细节）仍可能导致微小差异。我们追求的是在相同软硬件环境下的统计可复现，而非跨环境的绝对一致。


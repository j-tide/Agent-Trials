content:
  prompt: SFT过程中，如何监控模型生成质量而不仅仅是loss？
answer:
  mode: rubric
  reference_answer: |-
    在 SFT 训练中，仅盯着交叉熵损失是远远不够的。损失下降只代表模型在统计意义上越来越擅长模仿训练数据中的 token 分布，但它无法告诉我们模型是否变得啰嗦、是否出现了幻觉、是否学会了拒绝或是过拟合到了模板。要真正判断模型是否在“变好”，必须建立一套以生成质量为导向的多维监控体系。

    - 定期生成评估（Generation-Based Evaluation）

    这是最直接、最贴近实际使用的方法。在训练过程中，每隔一定步数（如每 200 步）保存一个检查点，然后用一组固定的、与训练集完全不重叠的评估提示，让模型生成回答。评估提示需要覆盖：

    - 核心业务场景（如客服问答、代码生成）

    - 边界测试（如指令模糊、包含错别字）

    - 安全与对抗性提示（如试图绕过限制）
    生成结果可以由人工评估或强模型自动评判（如用 GPT‑4 打分），重点关注：

    - 有用性：是否解决了问题？

    - 流畅度：语言是否自然？

    - 简洁性：是否啰嗦？

    - 安全合规：拒绝是否恰当？有没有过度拒绝？

    - 格式遵循：是否按要求的格式输出？

    通过对比不同检查点在各个维度上的得分变化，可以绘制出生成质量随训练步数的变化曲线，从而找到泛化性能最佳的时间点。

    - 自动化指标与诊断工具

    - Self‑BLEU：对同一个开放式提示，多次采样生成回答，计算它们之间的 BLEU 分数。如果 Self‑BLEU 在训练后期急剧升高，说明模型输出多样性崩塌，已陷入模板化。这是过拟合的早期信号。

    - 输出长度分布：统计模型在评估集上的平均回复长度和长度方差。如果平均长度持续增长，说明模型变得啰嗦；如果方差缩小，可能正在丧失对不同指令的灵活响应能力。

    - 困惑度（PPL）基线：同时监控训练集和验证集的困惑度。验证集 PPL 上升是过拟合的经典信号，但需要注意的是，PPL 下降而生成质量下降也可能发生，因为模型可能在“套用安全模板”上获得了极低的 loss，却失去了实质内容。

    - 指令改写鲁棒性测试：将一部分评估指令进行同义改写（如换种问法），分别测试模型在原始和改写指令上的表现。如果两者差距随训练步数扩大，说明模型过拟合到了特定指令措辞，而不是理解了任务本身。

    - 安全与对齐指标

    专门维护一个安全测试集，包含正常请求、明显有害请求和边界模糊请求。在训练过程中持续监控：

    - 有害请求拒绝率（应保持高位）

    - 正常请求误拒绝率（应保持低位）

    - 拒绝质量（是否生硬、是否给出建设性建议）
    一旦发现拒绝率异常波动，就需要立即检查数据配比或学习率。

    - 课程学习与人工抽检

    在关键阶段（如每个 epoch 结束时），由算法工程师或领域专家对模型输出进行小批量人工抽检，用直觉判断回答是否自然、是否有亮点。这种“定性感觉”虽然无法量化，但往往能最早嗅到模型“变味”的气息。

    - 记录与可视化

    所有评估指标都应被记录到实验管理工具（如 W&B、TensorBoard）中，并绘制成多面板的仪表盘。这样不仅可以纵向比较，还能将当前实验与历史基线快速对齐。最理想的状态是，在训练脚本中内置一个自动化的评估循环，在每次评估结束后生成一份简短的“健康报告”，帮助工程师快速做出是否继续、是否回滚或是否调整超参的决策。

    - 部署前的 A/B 测试

    如果条件允许，在正式上线前将几个候选检查点部署为灰度服务，分配一小部分真实流量进行 A/B 测试，通过用户点击率、点赞率、任务完成率等终极指标来选出最优模型。离线指标只能提供候选，真实用户反馈才是最终的试金石。


content:
  prompt: 什么是课程学习？如何在SFT数据组织中实现？
answer:
  mode: rubric
  reference_answer: |-
    课程学习（Curriculum Learning） 是一种受人类教育过程启发的训练策略，其核心思想是：将训练数据按照由易到难的顺序呈现给模型，而不是随机打乱。这能让模型先掌握基础技能，再逐步挑战复杂任务，从而提升训练稳定性、加速收敛，并改善最终模型的泛化能力。

    在SFT中，课程学习的具体实现分为以下步骤：

    - 定义“难度”度量标准（这是最关键的一步）：

    - 对于指令数据，常见的难度维度包括：

    - 可以通过人工标注或使用模型（如用GPT-4自动评估指令复杂度）来为每条数据打分。

    - 分桶或排序数据：

    根据难度评分，将训练数据分为3~5个难度桶（如Easy, Medium, Hard），或者直接按难度升序排列。

    - 设计训练阶段与采样策略：

    - 阶段式课程：将训练过程划分为几个阶段，每个阶段使用不同难度桶的数据混合。例如：

    - 连续动态采样：不划分明确阶段，而是根据训练步数，通过一个平滑函数（如sigmoid）连续地改变不同难度桶的采样权重。例如，Easy的权重随步数衰减，Hard的权重随步数增长。

    - 跳回机制（可选）：如果进入高难度阶段后验证损失飙升或不稳定，可自动回退到上一难度阶段，以更缓慢的速度增加难度。

    - 结合其他采样策略：

    课程学习通常与温度采样结合。在每个阶段内部，仍可使用温度采样来平衡同一难度等级内的不同任务类型。

    SFT中应用课程学习的优势：

    - 避免训练初期被复杂样本“劝退”，使损失下降更平稳。

    - 帮助模型逐步构建从基础到高级的能力层次，最终泛化性更好。

    - 特别适合训练处理复杂推理、长上下文、多约束任务的模型。

    实例：微调一个数学推理模型时，可以先训练基础算术题，再训练多步文字题，最后训练竞赛级难题。这样模型就不会一开始就被高难度的题目打击，而是稳步提升推理能力。


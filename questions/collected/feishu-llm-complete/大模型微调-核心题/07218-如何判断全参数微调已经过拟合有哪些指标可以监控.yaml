content:
  prompt: 如何判断全参数微调已经过拟合？有哪些指标可以监控？
answer:
  mode: rubric
  reference_answer: |-
    过拟合（Overfitting）是全参数微调的头号杀手。判断过拟合需要多维度监控，单一指标往往不足以揭示全部问题。

    核心指标与监控方法：

    [嵌入表格未展开]

    监控策略：

    - 在训练过程中设置固定的评估点（如每100步），保存当前 checkpoint，然后自动运行上述评估。绘制验证损失曲线、MMLU 得分曲线等。

    - 使用早停机制：当验证损失在连续 N 个评估点（耐心值）内没有改善时，自动停止训练，回滚到验证损失最低的 checkpoint。

    - A/B 抽样比较：定期用当前模型和基座模型对同一批指令生成回答，由人工或强模型（如 GPT-4）进行盲评，直接对比泛化能力的变化。这比自动指标更贴近真实体验。

    - 保留独立的“挑战集”：包含需要深度推理、长上下文、跨语言等复杂指令。这些任务对过拟合最敏感，一旦模型在这些任务上表现骤降，说明其通用智能受损。

    行动准则：一旦发现验证损失上升 + 通用能力下降，应立即停止训练，并回退到之前的 checkpoint。永远不要等到训练损失开始上升，因为那通常为时已晚。


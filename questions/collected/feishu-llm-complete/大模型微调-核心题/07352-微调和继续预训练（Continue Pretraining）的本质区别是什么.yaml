content:
  prompt: 微调和继续预训练（Continue Pretraining）的本质区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    两者虽然都是在已有模型上继续训练，但它们在数据形态、训练目标、对模型的影响深度和应用场景上有着本质区别。

    [嵌入表格未展开]

    本质区别：微调是精装修——房子主体结构（预训练知识）已经建好，我们只是根据用途调整内部布局和风格。继续预训练是扩建工程——我们为这栋房子增加新的房间、加固地基、更换管道，从根本上扩展其功能和容量。


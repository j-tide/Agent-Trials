content:
  prompt: ZeRO‑Offload和ZeRO‑Infinity是什么？在什么场景下使用？
answer:
  mode: rubric
  reference_answer: |-
    当单机多卡（哪怕是8卡）的总显存仍然装不下ZeRO-3分片后的模型状态时，就需要进一步向外“借”空间。

    ZeRO‑Offload

    - 是什么：将优化器状态（如Adam的动量和方差）从GPU显存卸载到CPU内存。更新参数时，梯度由GPU传回CPU，在CPU上完成优化器步骤（因为CPU算力足够且内存巨大），再将更新后的参数传回GPU。

    - 场景：GPU显存成为唯一瓶颈，但CPU内存充足。例如，你有一张24 GB显存的RTX 4090，但系统内存有128 GB。你想微调一个7B甚至13B模型，单卡显存远远不够。使用ZeRO‑Offload，可以将动辄数十GB的优化器状态放在CPU，GPU仅保留模型权重和激活，从而让单卡训练大模型成为可能。

    - 代价：受限于PCIe总线带宽，CPU和GPU之间的数据搬运会拖慢训练速度（约20%~50%）。

    ZeRO‑Infinity

    - 是什么：Offload的终极形态。当CPU内存都不够时，进一步将模型状态（参数、梯度、优化器）卸载到NVMe固态硬盘（SSD）。它利用GPU Direct Storage技术，直接从NVMe向GPU预取数据，绕过CPU，形成GPU -> CPU -> NVMe的异构存储池。

    - 场景：极端受限的硬件，要训练百亿甚至千亿参数的模型。例如，在单台只有一张80 GB A100的服务器上，想要全参数微调一个175B参数的模型。ZeRO‑Infinity通过将99%的模型状态放在廉价的NVMe上，实现了理论上的“无限显存”。

    - 代价：速度会进一步下降，因为SSD的带宽（数GB/s）远低于HBM或内存。这本质上是用时间换取空间，将不可能变为可能。

    两者都是“显存不够，外存来凑”的思路，ZeRO‑Offload用内存，ZeRO‑Infinity用硬盘，它们让大模型微调的门槛降到了前所未有的低点。


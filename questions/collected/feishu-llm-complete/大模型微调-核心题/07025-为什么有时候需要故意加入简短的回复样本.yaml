content:
  prompt: 为什么有时候需要故意加入简短的回复样本？
answer:
  mode: rubric
  reference_answer: |-
    故意加入简短回复样本，本质上是为模型树立“简洁同样高质量”的正面示范，防止模型被长回复“淹没”后产生啰嗦偏好。原因包括：

    - 打破长度偏差：如果数据中绝大部分高质量回复都是长篇大论，模型就会内化“长=好”的错误关联。加入高质量短回复，明确告诉模型：一个精准、直接、切中要害的短回答同样值得学习，甚至在某些场景下更受偏爱。

    - 训练长度控制能力：为了让模型学会根据指令动态调整长度，数据中必须包含明确的“长度约束”指令和对应的短回复。例如：“请用不超过50字回答”、“用一句话总结”、“只需回答是或否”。这些样本教会模型识别并遵守长度要求。

    - 提升用户体验和效率：在很多场景（如闲聊、简单事实查询、确认指令），用户希望得到快速、简洁的回应。如果模型总是长篇大论，反而会降低用户的效率和满意度。

    - 为后续偏好对齐铺路：如果在SFT阶段就已经让模型见识到“简洁也是好答案”，那么在DPO/RLHF阶段，只需少量“简洁>啰嗦”的偏好对，就能高效地调校模型行为，而无需从零开始扭转一个已经深度偏好长文的模型。

    - 抵抗数据增强的副作用：在使用强模型蒸馏数据时，由于教师模型（如GPT-4）倾向于生成详尽的长回答，合成数据集的长度分布极易失衡。此时主动混入人工编写的、高质量的短回复，可以起到“中和”作用，恢复数据集的长度多样性。

    实践要点：简短回复并非“偷懒”或“敷衍”。它必须同样满足准确性、完整性和有帮助性。一条好的短回复，是在有限的字数内高效完成任务的范例。例如，一条仅为“巴黎。”的回答，在“法国的首都是哪里？”的场景下就是完美的简短回复。

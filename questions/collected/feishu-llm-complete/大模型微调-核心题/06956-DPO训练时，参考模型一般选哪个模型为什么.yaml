  reference_answer: |-
    [图片内容未导入]

    - 目标一致性：DPO优化的是与带KL约束的RLHF相同的目标。在这个目标中，KL散度惩罚是以SFT模型为基准的，目的是防止策略模型偏离其太远。因此，DPO中的参考模型自然就应该是这个SFT模型。

    [图片内容未导入]

    - 提供稳定的优化起点：SFT模型已经处在一个合理的参数空间。以它为参考，可以保证在DPO训练初期，策略模型输出分布不会发生剧烈偏移，训练过程能够稳定、平滑地启动。

    因此，SFT模型是DPO参考模型的理论最优选择，也是在所有实践中唯一的标配。


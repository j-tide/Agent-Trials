content:
  prompt: 如何设计一个自动化的数据质量评分卡？
answer:
  mode: rubric
  reference_answer: |-
    一个自动化的数据质量评分卡能将数据评估从主观、手工的抽查，升级为客观、持续、可量化的管道。

    设计步骤：

    - 定义评估维度与指标：根据微调目标，选择关键的评估维度，并为每个维度设定量化的度量标准。例如：

    - 设定权重与计算总分：根据业务优先级，为每个维度赋权（例如安全性权重最高）。加权求和得到每条数据或整个数据集的综合质量分。

    - 插件化评判器：每个维度是一个独立的“评判插件”。规则类的插件成本低，可对所有数据运行；基于模型的插件成本高，可用于高价值数据或抽样评估。可以集成GPT-4作为复杂语义维度的评判器。

    - 自动化管道集成：将评分卡嵌入到数据处理管道中。数据进入训练前，自动计算每条数据的评分，低于全局阈值的直接丢弃或标记为“待人工审核”。同时，定期生成数据质量报告，监控评分趋势，发现异常即刻告警。

content:
  prompt: 在全参数微调中，如何处理梯度累积？为什么需要使用它？
answer:
  mode: rubric
  reference_answer: |-
    梯度累积（Gradient Accumulation）是一种“以小博大”的训练技巧，允许我们在显存受限的情况下模拟出更大的全局批量大小（Global Batch Size）。其原理简单却极其有效：不是每个micro‑batch后都立即更新模型参数，而是连续计算多个micro‑batch的梯度，将它们累积求和，直到累积的步数达到预设值，再用累积的总梯度一次性更新参数。

    处理步骤

    - 确定目标全局Batch Size：根据训练稳定性和收敛经验，设定一个理想的全局Batch Size（例如128）。

    - 确定单卡最大Micro‑batch Size：受限于GPU显存，测试出模型能承受的最大单次输入样本数（例如8）。

    - 计算累积步数：accumulation_steps = global_batch_size / (micro_batch_size * num_gpus)。例如，单机8卡，micro_batch_size=8，目标全局128，则累积步数 = 128 / (8*8) = 2。


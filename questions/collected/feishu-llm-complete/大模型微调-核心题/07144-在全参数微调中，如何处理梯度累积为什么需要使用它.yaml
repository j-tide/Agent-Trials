    为什么需要使用梯度累积？

    - 突破显存瓶颈：这是最直接的原因。全参数微调需要为所有参数存储梯度、优化器状态和中间激活，显存消耗极大。通过梯度累积，我们不必为了追求大Batch Size而增大micro‑batch，从而将单次前向的激活和临时缓冲区控制在显存允许的范围内。

    - 维持大Batch训练效果：很多研究表明，过小的Batch Size会导致梯度噪声过大，训练不稳定，收敛困难。大Batch Size能提供更准确的梯度估计，有助于稳定收敛和提升最终性能。梯度累积让我们在有限的硬件上也能享受到大Batch Size的好处。

    - 支持高分辨率或长序列输入：当任务需要处理长文本或高分辨率图像时，micro‑batch size可能被迫设为1或2。若不使用梯度累积，有效Batch Size会极小，模型几乎无法学习。通过累积数十步，可以恢复正常的训练动态。

    - 模拟更大的分布式规模：在单机或少量GPU上调试时，可以使用梯度累积来模拟未来在多机多卡上的大Batch行为，提前发现训练不稳定等问题。

    注意事项

    - Batch Normalization的兼容性：梯度累积打破了BN层跨micro‑batch的统计，因为BN通常在每个micro‑batch内独立计算均值/方差。对于LLM常用的LayerNorm，没有这个问题；若使用了BN，需要特殊处理（如SyncBN）。

    - 优化器状态更新频率：Adam等优化器的一阶/二阶矩估计依赖于每次更新的梯度。梯度累积减少了更新频率，但累积的梯度量级与单步大Batch的梯度一致，因此优化器动态基本等价。

    - 梯度裁剪时机：应在累积完成后、optimizer.step()之前进行梯度裁剪，裁剪累积后的总梯度范数。


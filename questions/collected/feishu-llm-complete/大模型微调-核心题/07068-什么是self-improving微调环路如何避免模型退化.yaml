content:
  prompt: 什么是“self-improving”微调环路？如何避免模型退化？
answer:
  mode: rubric
  reference_answer: |-
    Self-improving微调环路 是指模型能够利用自己生成的数据（或与环境交互产生的数据）来持续改进自身性能，形成一个自动化的、无需大量外部监督的训练闭环。这在SPIN、Self-Rewarding、和在线RLHF中都有体现。

    典型的Self-improving环路：

    - 数据生成：当前模型针对一批指令生成回答。

    - 自动评估/过滤：利用模型自身或外部工具（如编译器、搜索引擎、规则）对生成结果进行评分或筛选，选出高质量样本。

    - 模型更新：使用这些筛选出的高质量数据对模型进行微调（SFT）或偏好对齐（DPO）。

    - 重复：用更新后的模型再次生成数据，进入下一轮循环。

    如何避免模型退化？

    Self-improving环路最大的风险是分布坍缩与偏差放大：模型倾向于重复生成自己所偏好的模式，导致多样性丧失，或放大自身的偏见和错误。避免退化的关键措施包括：

    - 注入外部“新鲜血液”：定期向数据生成或训练池中加入人工标注的高质量数据、新的指令集，或来自其他模型/来源的多样化数据，打破自我循环的封闭性。这相当于为基因池引入多样性，防止近亲繁殖。

    - 使用冻结的参考模型作为锚点：在训练时（如DPO），始终保持一个最初的、表现良好的SFT模型作为参考模型，通过KL散度约束防止当前模型偏离初始“安全”分布太远。

    - 严格的自动过滤与质量阈值：建立多维度的自动评估管道（如事实性检查、安全审核、多样性指标），只保留达到严格质量标准的生成样本。宁可数据量少，也要保证质量。

    - 对抗性测试与自我挑战：在环路中加入自我挑战机制，例如让模型刻意生成对抗性难题，或进行“自我博弈”（如SPIN），通过挑战旧我来寻找弱点，而非仅仅模仿自己。

    - 监控多样性与遗忘指标：持续监控模型生成文本的Self-BLEU、输出熵、以及在通用基准上的表现。一旦发现多样性骤降或通用能力退化，立即调整策略或回滚。


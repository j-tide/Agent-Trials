content:
  prompt: 对于代码微调模型，有哪些常用的自动化评估基准？
answer:
  mode: rubric
  reference_answer: |-
    代码微调模型的自动化评估基准主要关注功能正确性、代码质量、多语言覆盖和实际问题解决四个维度。

    常用基准：

    - HumanEval / HumanEval+：由OpenAI提出，包含164个手写的编程问题，每个问题有明确的函数签名和文档字符串。模型需生成函数体，通过预定义的单元测试来评估准确率。pass@k是最核心指标：对每个问题生成k个代码样本，只要有一个通过所有单元测试，就计为正确。这是目前最权威的代码生成能力基准。HumanEval+通过扩展测试用例增加了基准的严格性。

    - MBPP / MBPP+：包含约1000个入门级Python编程问题，更偏重基础语法的使用，适合评估模型在常见编程任务上的表现。

    - MultiPL-E：将HumanEval和MBPP的题目翻译到了18种编程语言，用于评估模型的多语言代码生成能力。

    - DS-1000：测试数据科学相关的Python代码生成，涉及Pandas、NumPy等库，需要模型对数据分析和库API有深入理解。

    - CodeBLEU / CodeBERTScore：衡量生成代码与参考代码在语法和语义层面的相似度，用于评估代码质量。

    评估方式：这些基准都配备了沙箱环境，可以安全地执行模型生成的代码，并自动判断是否通过测试。因此，代码微调评估可以做到全自动化，无需人工参与。


content:
  prompt: 在微调中融入“检索增强”数据，模型需要学会何时检索。
answer:
  mode: rubric
  reference_answer: |-
    这与上一问题紧密相关。核心是让模型掌握检索的“时机”。

    实现方法：

    - 数据配比：在SFT数据中，刻意混合三种类型的数据：①需要检索并成功检索的例子（30%）；②不需要检索，直接回答的例子（60%）；③需要检索但检索不到，模型应表达不知道的例子（10%）。

    - 奖励模型设计：在RL阶段，为模型的行为设计精细的奖励。

    - 推理时的系统提示：在系统提示中明确告知模型其具备检索能力，并给出何时检索的指导原则，如“如果你对答案不确定或需要最新信息，请使用检索工具”。

    通过上述训练，模型可以内化一套有效的检索决策策略，从而成为一个高效、自主的RAG系统。

    - 维持原有权重：如果微调数据多样性较好、量较大，可直接沿用预训练时的负载均衡损失权重。

    - 动态调整：在微调初期，由于专家尚未适应新任务，路由容易偏向，可适当增大负载均衡损失的权重，强制模型进行探索；待训练稳定后，再逐渐减小权重，让模型更专注于任务性能。

    - 减少约束：若微调任务非常专一，且已经通过其他手段（如容量限制、冻结部分专家）防止了坍塌，可以降低甚至移除负载均衡损失，让模型自由地将token集中到最相关的专家上，以最大化任务性能，代价是可能牺牲泛化能力。

    - 示例：“因为速度=路程/时间，所以速度=120公里/2小时=60公里/小时。验证：如果以60公里/小时行驶2小时，路程为120公里，与题目一致。”

    - 这种数据让模型养成“每输出一步就进行合理性检查”的习惯。

    - 示范：“此题可用方法A（公式法）或方法B（画图法）。方法A更快捷但需注意单位；方法B更直观但较繁琐。这里我选用方法A。”
    这能训练模型的策略选择与权衡能力。

    - 示例：“初步计算得到结果X。等等，我发现在第二步时我误用了公式，应该使用...。重新计算后得到正确结果Y。验证：将Y代入原条件，成立。”

    - 这类数据对于培养鲁棒性至关重要。

    - 指令：“请验证以下数学解答是否正确，并详细说明每一步的检查过程。”

    - 这能强化模型的批判性思维。

    - 这让模型的验证过程更加系统化。

    - 生成候选回答：对于一批指令，让模型扮演“考生”，生成多个候选回答。

    - 自我生成奖励与评判：让同一个模型切换角色，扮演“考官”，对自己生成的这批候选回答进行多维度打分和排序，输出奖励分数和理由。它需要学会区分不同质量回答的优劣。

    - 多能力组合：当你已经拥有独立的“代码专家”、“数学专家”、“安全专家”等微调模型（或LoRA适配器）时，通过模型合并可以将它们融合成一个具备复合能力的模型，而不需要重新收集混合数据并运行一次大规模的多任务微调。这极大节省了算力。

    - 快速能力编辑：如果你想增强或削弱模型的某个能力，可以通过算术方式将“能力向量”（微调后模型与基座模型的差值）与现有模型合并，实现快速的能力调整，无需重新训练。

    - 需要深度知识注入或新能力学习：模型合并只能组合已有能力，无法凭空创造出新的能力。如果没有任何现有的微调模型具备目标能力，则必须进行微调。

    - 任务间存在严重冲突：当不同任务的能力难以通过简单的参数平均来调和时（如极度风格化任务），合并的效果可能不佳，仍然需要针对性地微调。

    - 追求极致单一性能：合并通常在组合模型的能力，可能以牺牲特定任务的极致性能为代价。对于追求单任务SOTA的场景，专项微调仍是必需。

    - 规则过滤器：快速剔除格式错误、乱码、过短、不安全内容。

    - 困惑度过滤器：用基座模型计算PPL，剔除过高（混乱）或过低（空洞）的回答。

    - 强模型评判（LLM-as-Judge）：让GPT-4等顶级模型根据准确性、有用性、流畅性等维度对剩余候选回答打分或排序。为消除位置偏差，可交换顺序评判两次。

    - 质量评分：用种子模型（或更强的模型）对生成的 (指令, 回答) 对进行质量打分，评估指令是否合理、与回答是否匹配。

    - 筛选与重训：保留高质量的数据对，作为新的SFT训练数据，微调种子模型，得到更强的模型V2。

    - 迭代：V2模型拥有了更强的文本理解和指令生成能力。用它再次对新的无标签文本进行“指令回译”，将能生成更精准、更多样的指令。同时，V2本身也可以作为更强的“回答生成器”。

    - 形成闭环：无标签文本 -> 模型生成指令 -> 模型自评质量 -> 筛选高质量数据 -> 训练更强模型 -> 更强模型再来回译。这个闭环使得模型能够持续从无标签文本中自我学习和进化。

    - 代码：将生成的代码提交到沙箱环境中运行，编译并执行单元测试。根据通过测试的数量、运行时间等，给出一个二进制奖励（通过/失败） 或连续奖励（如通过的测试比例）。

    - 数学：将模型生成的数学表达式与标准答案进行符号化验证（如通过SymPy），判断是否等价。奖励为正表示正确。

    - +1：在应该检索时，正确发起了检索。

    - -1：在应该检索时，没有发起检索（导致生成幻觉）。

    - -0.5：在不应该检索时，却发起了检索（浪费计算资源）。

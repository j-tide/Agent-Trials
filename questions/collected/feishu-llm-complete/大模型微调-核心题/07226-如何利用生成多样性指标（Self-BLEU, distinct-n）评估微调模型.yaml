content:
  prompt: 如何利用生成多样性指标（Self-BLEU, distinct-n）评估微调模型？
answer:
  mode: rubric
  reference_answer: |-
    生成多样性指标用于量化模型输出的“丰富程度”和“避免模板化”的能力。在微调评估中，它们主要用于检测是否发生分布坍缩（模式坍塌）。

    Self-BLEU：

    - 原理：对同一个开放式指令，让模型生成K个不同的回答（如K=5）。对每个回答，将其余K-1个回答作为“参考”，计算BLEU分数，最后取平均值，即Self-BLEU。

    - 评估价值：Self-BLEU越高，说明这些回答之间越相似，模型输出的多样性越差。一个完全坍缩的模型，每次生成几乎一模一样，Self-BLEU接近1.0；一个高多样性的模型，Self-BLEU通常在0.2-0.4。

    - 使用方式：对比微调前后模型在同一批开放式Prompt上的Self-BLEU值。如果微调后Self-BLEU显著升高（例如从0.3升至0.7），说明微调严重损害了模型的创造力，是过拟合或数据单一的重要信号。

    Distinct-n：

    - 原理：统计生成文本中，不重复的n-gram数量占总n-gram数量的比例。Distinct-1衡量词汇多样性，Distinct-2衡量短语多样性。值越高，多样性越好。

    - 评估价值：能够量化模型是否在反复使用相同的词汇和短语。如果Distinct-2暴跌，说明模型在大量重复某些固定搭配，语言变得贫乏。

    - 使用方式：在评测集上计算平均Distinct-1/2。与基座模型对比，观察下降幅度。还可以分任务类型统计，看是否只在某些任务上丧失了多样性。

    局限性：这些指标只能反映词汇层面的多样性，无法衡量语义层面的多样（比如虽然用词不同，但意思完全相同）。因此，通常与语义嵌入的方差分析等方法结合使用，综合判断。


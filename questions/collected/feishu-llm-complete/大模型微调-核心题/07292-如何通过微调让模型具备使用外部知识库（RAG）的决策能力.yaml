content:
  prompt: 如何通过微调让模型具备使用外部知识库（RAG）的决策能力？
answer:
  mode: rubric
  reference_answer: |-
    RAG（检索增强生成）的决策能力，是指模型能够自主判断何时需要查询外部知识库、如何查询、以及如何根据检索结果回答问题。这需要通过微调来注入。

    - 构造决策训练数据

    数据格式需模拟完整的RAG流程：

    - 需要检索的样本：问题超出模型内部知识（如新闻、特定文档内容）或要求实时信息。回答以特殊标记开始，如 <search> 关键字 </search>，随后是检索工具返回的文档片段，最后是模型基于文档的综合回答。

    - 不需要检索的样本：通用知识问答、创意写作、闲聊。模型直接给出回答，不输出任何检索标记。

    - 检索失败/信息不足的样本：检索到无关文档，模型应回复“根据现有资料无法回答”，或请求用户澄清。

    - 训练模型

    使用这些数据对模型进行SFT。模型将学会：

    - 检索触发：当遇到特定类型的问题时，学会生成 <search> 标记作为动作。

    - 查询生成：学会如何将用户的自然语言问题，转化为高效的关键词搜索查询。

    - 结果整合：学会如何阅读、引用、综合多个文档片段，并生成连贯的回答。

    - 强化学习微调（可选）

    设计一个奖励函数，当模型正确判断是否需要检索，并生成了高质量查询和准确回答时给予高分；当模型在不必要时检索（浪费资源）或在必要时不检索（导致幻觉）时给予低分。通过RL进一步优化模型的决策能力。


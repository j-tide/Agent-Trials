content:
  prompt: QLoRA训练时是否需要特别的优化器设置？
answer:
  mode: rubric
  reference_answer: |-
    需要，主要是在极端显存受限时启用分页优化器（Paged Optimizer）配合CPU offload，并推荐使用8-bit优化器状态。

    虽然QLoRA本身的可训练参数（LoRA部分）很少，优化器状态占用不大（如第18题估算约0.84 GB），但QLoRA的设计目标就是在非常有限的显存（如16 GB甚至更低）上运行。此时，即使是几百MB的优化器状态也可能成为压垮骆驼的最后一根稻草。因此，QLoRA论文提出了以下特别设置：

    - Paged AdamW：这是一种将优化器状态存储在CPU统一内存中的AdamW变体。当GPU显存不足时，优化器状态可以自动分页到CPU内存，避免OOM。在HuggingFace Transformers中，可以通过设置 optim="paged_adamw_8bit" 来启用。这会使用8-bit量化的优化器状态，并支持CPU offload，进一步压缩显存。

    - 8-bit优化器：除了分页，还可以直接使用 bitsandbytes 的8-bit AdamW，将动量和方差量化为8-bit，从而优化器状态显存减少一半（从每参数8字节降到4字节）。虽然对LoRA这种小参数量来说收益不大，但对于需要微调较大LoRA（如r=64且应用到所有层）的场景很有帮助。

    - 梯度检查点：虽然不是优化器本身，但QLoRA通常与梯度检查点配合使用，以减少激活显存。这在显存预算紧张时至关重要。

    - 学习率建议：与标准LoRA类似，学习率通常取1e-4到5e-4（对于LoRA适配器）。由于基座权重量化引入了轻微的噪声，有时需要稍微降低学习率或增加warmup来稳定训练，但大部分情况下沿用标准LoRA的学习率即可。

    总结：QLoRA训练在优化器上主要依赖Paged AdamW 8-bit来处理极端显存不足的情况。如果你的GPU显存足够（例如24 GB微调7B模型），使用标准的AdamW也完全没有问题，因为LoRA的优化器状态本就不大。但若要挑战更大模型，分页优化器是救命稻草。


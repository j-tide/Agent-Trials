content:
  prompt: 在PPO训练中，参考模型、策略模型、价值模型、奖励模型各自的作用是什么？
answer:
  mode: rubric
  reference_answer: |-
    在RLHF的PPO阶段，四个模型协同工作，各自扮演着不可替代的角色。理解它们的分工，是理解整个RLHF训练动力学的关键。

    [图片内容未导入]

    - 身份：我们要训练的目标语言模型本身。通常由第一阶段的SFT模型初始化。

    - 职责：接收指令 x，自回归地生成回答 y。它的参数 θ 是PPO算法唯一要优化的主体。

    - 更新方式：根据PPO损失函数进行梯度上升，最大化由奖励模型打出的、并经过优势函数和裁剪机制处理后的期望奖励。

    [图片内容未导入]

    [图片内容未导入]

    [图片内容未导入]

    - 身份：在第二阶段训练好、并在此阶段完全冻结的标量评价模型。

    - 职责：担任“自动裁判”。接收指令 x 和策略模型生成的回答 y，输出一个标量奖励分数 r(x,y)，代表这个回答在人类偏好下的质量。

    - 作用机制：为强化学习提供即时的、可微的反馈信号。它是RLHF能够运转的核心驱动力。策略模型所有的努力，都是为了生成能从这个模型处获得更高分数的回答。但它的不完美也是奖励破解的根源。

    [图片内容未导入]

    [图片内容未导入]

    - 作用机制：它的核心价值在于计算优势函数（Advantage）。优势函数是PPO中用于更新策略模型的关键信号，定义为实际获得的奖励与价值模型估计的奖励之差。价值模型像一个“基线”，使得策略梯度更新时能区分哪些动作真正带来了超出预期的回报，从而大幅降低梯度估计的方差，让训练更稳定、高效。

    协同工作流：策略模型生成回答 → 奖励模型为完整回答打分 → 价值模型为生成过程中的每个中间状态估计价值 → 基于奖励和价值计算出每个token的优势函数 → 使用PPO-CLIP目标函数更新策略模型和价值模型参数 → 参考模型全程静默，只在计算KL惩罚时提供其输出分布。


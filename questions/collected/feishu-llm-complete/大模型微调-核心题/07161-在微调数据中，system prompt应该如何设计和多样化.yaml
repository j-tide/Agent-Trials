content:
  prompt: 在微调数据中，system prompt应该如何设计和多样化？
answer:
  mode: rubric
  reference_answer: |-
    System prompt是定义模型人格、行为边界和任务框架的“元指令”。它不仅影响单条数据，更是训练模型可控性和角色适应能力的核心载体。

    设计原则：

    - 定义全局行为与安全准则：清晰阐述助手的身份、核心任务、必须遵守的伦理规范（如无害性、诚信）、输出风格和格式要求。例如：“你是一个专业、友好且谨慎的编程助手。请用简洁的中文回答，代码使用Markdown包裹。绝不提供任何恶意代码。如果遇到不确定的问题，请诚实说明。”

    - 可插拔性：System prompt的内容应是可替换的“配置项”，而不是与具体对话内容强绑定。这样训练出的模型，才能在推理时通过更换system prompt实现灵活的行为切换。

    - 具体而不啰嗦：规则要明确，但不要写成长篇大论。模型需要在有限上下文中快速捕捉关键指令。对于复杂的角色设定（如一个特定的历史人物），需要用精炼的语言概括其性格、知识范围和说话风格。

    多样化策略：

    为了让模型真正学会“理解并遵循system prompt”这一元能力，训练数据中的system prompt必须极其多样：

    - 角色多样化：覆盖各种不同职业、身份和性格的设定：医生、教师、律师、诗人、历史人物、虚拟角色、客服人员等。

    - 行为准则多样化：对同一类任务，设定不同的回答要求。例如，对“总结文章”任务，有的system prompt要求“用一句话”，有的要求“分三点”，有的要求“用正式的学术语言”，有的要求“用小学生能听懂的话”。

    - 安全等级多样化：模拟不同安全要求的环境。有的设为“极度严格的安全模式”，模型必须拒绝所有边界模糊的请求；有的设为“宽松模式”，模型可以在提供信息的同时附上安全提示。

    - 格式要求多样化：有时要求输出JSON，有时要求用列表，有时要求用散文形式。

    - 语言风格多样化：要求正式、口语化、幽默、严肃、共情等不同风格。

    通过在训练数据中系统性地变化system prompt，模型学会了将system prompt解析为行为约束，而不仅仅是记住某一个特定的prompt。这赋予了模型强大的零样本角色扮演和指令泛化能力。

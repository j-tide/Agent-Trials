content:
  prompt: 当业务方抱怨微调模型效果不好时，你如何沟通和排查？
answer:
  mode: rubric
  reference_answer: |-
    “别担心，效果不好是常有的事，这正好是我们一起把模型做得更准的机会。咱们先一起把问题拆解清楚，定位到根源，解决起来就快了。”

    第一步：锁定问题，对齐预期

    - 具体化效果：请业务方提供5-10个具体的失败案例。不能笼统说“效果不好”，要追问：“是回答错了？是格式不对？还是语气太生硬？” 将这些Case记录下来，并请业务方为每个Case打上严重程度标签。

    - 对齐预期：和业务方共同审视这些Bad Case，判断哪些是模型“必须做对”的硬需求，哪些是“锦上添花”的软需求。这能帮助后续分清主次。

    第二步：快速诊断，复现问题

    - 复现与分类：在后台用同样的输入跑一下模型，看问题能否稳定复现。将确认的问题进行归类：是知识缺失（模型不知道）、行为偏差（模型不听话）、还是过拟合/遗忘（以前会的现在忘了）？

    - 数据溯源：这是最关键的排查。检查训练数据中是否存在与这些Bad Case相似的问题。是根本没有这类数据（覆盖盲区）？是数据本身有错误（数据污染）？还是数据过多导致模型过拟合（配比失衡）？

    第三步：提出方案，快速验证

    - 构建“黄金修复集”：针对那5-10个最核心的Bad Case，我亲手写5-10条完美的指令-回答对。

    - 增量微调验证：将这几条修复数据混入原训练集，跑一个极小的增量微调（几分钟）。然后，把修复后的模型给业务方看效果。这个“小步快跑”的验证方式，能非常直观地证明问题是可以通过数据修复的。

    第四步：达成共识，制定计划

    - 汇报诊断结果：向业务方解释问题的根源是数据（占比最高的原因），并展示修复验证的成功结果。

    - 共同制定迭代计划：我们商量一下，修复这批核心问题需要补充多少数据？由谁来提供业务知识，由谁负责数据标注？确定一个小的、可交付的迭代目标（如两周内修复所有高优先级格式问题），设定下一次验收的时间点。

    整个过程，核心是共情、专业、透明。不是推卸责任，而是把业务方当成解决问题的战友。


content:
  prompt: 什么是梯度裁剪？全参数微调中阈值一般设为多少？
answer:
  mode: rubric
  reference_answer: |-
    梯度裁剪（Gradient Clipping） 是一种防止梯度爆炸、保障训练稳定性的技术。它通过设定一个阈值，当所有参数梯度的总范数（通常用L2范数）超过该阈值时，就强制将梯度向量缩放到该阈值，从而限制了单次参数更新的最大幅度。

    为什么需要梯度裁剪？

    在全参数微调中，尤其是训练初期，模型面对新的数据分布，某些参数（尤其是高层或注意力层）的梯度可能异常巨大。这种巨大的梯度如果直接用于参数更新，会导致参数发生剧烈跳变，瞬间破坏预训练阶段辛苦建立的宝贵表征，引发损失飙升至NaN或Inf，使训练崩溃。即使不崩溃，过大的梯度也会导致训练不稳定，收敛缓慢。梯度裁剪相当于给每次更新加上了一个“安全帽”。

    阈值设定

    - 常见范围：全参数微调中，梯度裁剪的阈值（max_grad_norm）通常设为 1.0。

    - 这个值适用于大多数基于Transformer的语言模型微调。它既有效防止了梯度爆炸，又不会过度限制正常的学习信号。

    - 若使用混合精度训练（FP16），由于FP16的表示范围窄，更容易出现梯度溢出，因此裁剪尤为重要，阈值可保持不变或略微降低（如0.5）。

    - 如果训练中频繁触发梯度裁剪（例如日志中grad_norm频繁等于所设阈值），意味着学习率可能过大，或数据存在问题，需要排查。

    - 对于PEFT（如LoRA），由于可训练参数少，梯度爆炸风险相对较低，裁剪阈值可适当提高（如5.0或10.0），或甚至不裁剪。

    实践：在HuggingFace Trainer中，通过--max_grad_norm 1.0设置。通常不需要将其作为主要调参对象，默认值在绝大多数情况下工作良好。


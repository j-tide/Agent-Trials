content:
  prompt: 如何使用GPT-as-judge评估微调模型？如何写prompt避免偏差？
answer:
  mode: rubric
  reference_answer: |-
    使用GPT-4等强模型作为评判者，是目前最主流、最灵活的高质量评估方法。但评判模型本身并不客观，会受prompt措辞、回答顺序、回答风格等多种偏差影响。

    基本用法：

    - 准备评估数据：收集一组包含指令和模型回答的测试样本。

    - 设计评判prompt：将指令、待评估回答以及可能存在的参考回答，按照特定格式填入prompt，并要求GPT-4输出评分或比较结果。

    - 调用API进行评判：对每个样本执行评判，收集评分或胜率。

    - 结果统计与分析：计算平均分、胜率、各维度得分等，并进行统计分析。

    如何写prompt避免偏差：

    - 强制结构化输出：不要让评判模型输出一个段落描述，而是要求它输出JSON格式的结果，包含多个维度的独立评分和简要理由。这迫使模型对每个维度分别思考，减少晕轮效应。

    - 交换位置并取平均：这是消除位置偏差最有效的方法。对于需要比较两个回答的任务，将两个回答的顺序交换，评判两次，取平均分或综合结果。

    - 加入“锚点”与校准示例：在prompt中提供少量（1-2个）带有人工标注分数的示例，说明什么样的回答得高分、什么样的得低分。这相当于给评判模型进行了Few-shot校准。

    - 明确评分标准的具体含义：不要只写“给有用性打分”，而要详细解释什么是5分、什么是1分，并给出具体的行为锚定描述。

    - 要求先思考再打分：在prompt中要求模型“先分析该回答的优点和不足，再给出最终分数”。这种“思维链”要求能显著提高评分的准确性和一致性。

    - 控制回答长度带来的干扰：在prompt中特别提醒：“评分时请不要被回答的长度所影响。一个简短但精准的回答可以得高分，一个冗长但空洞的回答应该得低分。”


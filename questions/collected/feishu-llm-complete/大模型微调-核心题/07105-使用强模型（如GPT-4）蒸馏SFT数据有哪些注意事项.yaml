content:
  prompt: 使用强模型（如GPT-4）蒸馏SFT数据有哪些注意事项？
answer:
  mode: rubric
  reference_answer: |-
    用GPT-4等强模型生成SFT训练数据（即知识蒸馏）是当前最高效的数据获取方式之一，但它并非简单的一问一答，而是一套需要精心设计的系统工程。主要有以下注意事项：

    - 教师模型偏见传递：蒸馏数据会继承GPT-4等模型的固有风格、价值观偏见甚至政治倾向，导致学生模型“学得像个GPT”。应混合多个教师模型（如Claude、Gemini等）的输出，并注入人工标注数据做纠偏。

    - 数据同质化风险：强模型对于类似prompt倾向于输出结构相似的回答，缺乏人类语言的真实多样性。应在prompt中显式要求多样性，使用不同温度参数，或设计多样化的prompt变体。

    - 幻觉污染：强模型可能在回答中编造事实，这些错误会被学生模型忠实地学习。应对事实性内容进行外部知识校验（如Wikipedia），并要求模型在不确定时标注出来。

    - 许可与合规问题：部分模型API的服务条款限制将其输出用于训练竞争模型。务必仔细阅读并遵守API使用协议，优先使用开源强模型（如Llama 3 70B）自行部署。

    - 成本控制：大规模调用GPT-4 API成本高昂。可先用开源强模型生成，再对少量高质量样本使用GPT-4进行改写或校验；同时对指令集做去重，避免为相似指令重复生成回答。

    - 评估过拟合：如果评估集也是强模型生成的，就会出现“自己考自己”的假象。必须保留一部分人工标注数据作为独立评估集。

    - 数据版权和伦理：使用他人模型生成数据训练自家模型，涉及知识产权争议，应遵循服务条款，并考虑使用合成数据仅作为补充而非主体。

    - 多轮数据的上下文维护：蒸馏多轮对话时，要确保教师模型能记住之前轮次的约束和状态，否则生成的数据会前后矛盾。通常需要将完整的对话历史作为上下文输入给教师模型。

    最佳实践：多教师混合、事实校验、多样化prompt、人工抽检、成本监控，以及严格的许可合规审查，是保证蒸馏数据质量和合法性的关键。


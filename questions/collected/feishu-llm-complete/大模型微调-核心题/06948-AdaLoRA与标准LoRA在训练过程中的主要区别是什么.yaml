    核心区别总结：标准LoRA是“静态”的秩分配，一视同仁；AdaLoRA是“动态”的秩分配，按需分配。AdaLoRA通过引入结构化的重要性评估和重分配机制，在训练过程中自动搜索最优的秩配置，从而在参数总量固定的前提下榨取更多性能。


content:
  prompt: QLoRA相比标准LoRA能节省多少显存？以7B模型为例估算。
answer:
  mode: rubric
  reference_answer: |-
    我们以LLaMA-7B模型为例，对比标准LoRA（基座权重保持FP16，只训练LoRA适配器）和QLoRA（基座权重采用NF4双重量化，训练LoRA适配器）在微调时的显存占用。假设都使用相同batch size和序列长度，且都开启梯度检查点。

    [嵌入表格未展开]

    显存节省：标准LoRA需要约20 GB，QLoRA仅需约10 GB，节省了约50%的显存。如果考虑更大的模型（如13B），节省比例会更高。这主要归功于基座权重从14 GB压缩到了3.8 GB。

    实际影响：

    - 标准LoRA在24 GB显卡上微调7B模型非常紧张（需要各种优化技巧），微调13B基本不可能。

    - QLoRA在24 GB显卡上微调7B非常宽裕（还能支持较大batch），微调13B成为可能，甚至可以使用33B模型（不过需要更小的batch和更激进的梯度检查点）。

    注意：上表未包含通信缓冲区、CUDA context等额外开销，实际占用会略高一点，但比例关系不变。QLoRA的显存节省是革命性的，它使得大模型微调真正平民化。


content:
  prompt: 为什么说“数据质量远比数据数量重要”？LIMA实验说明了什么？
answer:
  mode: rubric
  reference_answer: |-
    “数据质量远比数据数量重要” 这句话在 SFT 领域几乎是一条金科玉律，而 LIMA（Less Is More for Alignment）实验则是这一理念最有力的实证。

    质量优先的深层原因：

    - SFT 的本质是行为格式化，而非知识注入。预训练模型已经拥有庞大的知识储备，SFT 只需教会模型如何恰当地调用这些知识。因此，少量但高质量、多样化的示例就足以覆盖各种交互模式。冗余的、低质量的样本不仅不会增加能力，反而可能引入噪声，让模型学会错误的模式。

    - 高密度信号 > 稀疏噪声。一条精心构造的指令-回答对，包含清晰的意图、准确的答案、恰当的格式和安全的边界，其训练价值远超十条平庸的样本。模型能从中学到泛化性强的行为策略，而不是死记硬背特定短语。

    - 过拟合风险。SFT 数据量相对预训练极小，低质量数据（尤其是模板化的重复内容）极易导致模型过拟合到表面模式，丧失泛化能力。

    LIMA 实验的启示：

    LIMA 使用仅 1000 条 精心挑选的高质量对话数据对 LLaMA 65B 进行 SFT，结果模型展现出了惊人的指令遵循能力，在多轮对话、复杂任务上甚至不逊于使用数万条数据微调的其他模型。LIMA 的成功有几个关键点：

    - 数据来源多样（社区问答、wikiHow 等），确保了任务覆盖度。

    - 每一条数据都经过严格人工筛选，保证格式一致、回答准确、语言自然。

    - 模型本身足够大（65B），预训练能力极强，因此少样本即可激活其潜力。

    LIMA 告诉我们，不要盲目追求数据量，而应将主要精力放在数据质量和多样性上。与其用 10 万条机器生成的同质化数据，不如用 1 万条经过人工精挑细选、覆盖广泛场景的高质量数据。这个理念也推动了 SFT 数据工程从“堆量”向“精加工”转型。

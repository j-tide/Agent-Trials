content:
  prompt: 实现早期停止（Early Stopping）类，可监控验证损失。
answer:
  mode: rubric
  reference_answer: |-
    ```python
    class EarlyStopping:
        def __init__(self, patience: int = 3, min_delta: float = 0.0, mode: str = 'min'):
            self.patience = patience
            self.min_delta = min_delta
            self.mode = mode
            self.counter = 0
            self.best_score = None
            self.early_stop = False

        def __call__(self, current_score: float) -> bool:
            if self.best_score is None:
                self.best_score = current_score
            elif (self.mode == 'min' and current_score > self.best_score - self.min_delta) or \
                 (self.mode == 'max' and current_score < self.best_score + self.min_delta):
                self.counter += 1
                if self.counter >= self.patience:
                    self.early_stop = True
            else:
                self.best_score = current_score
                self.counter = 0
            return self.early_stop
    ```

    训练循环中使用：

    ```python
    stopper = EarlyStopping(patience=3)
    for epoch in range(epochs):
        val_loss = validate()
        if stopper(val_loss):
            print("Early stopping triggered")
            break
    ```

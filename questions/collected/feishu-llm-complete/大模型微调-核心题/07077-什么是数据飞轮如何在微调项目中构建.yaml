content:
  prompt: 什么是“数据飞轮”？如何在微调项目中构建？
answer:
  mode: rubric
  reference_answer: |-
    数据飞轮 是一个自我强化的正向循环系统。在微调项目中，它指的是：利用线上模型产生的交互数据，经过清洗和标注，反哺训练出更强的模型，从而吸引更多用户、产生更丰富的数据，形成持续进化的闭环。

    构建微调数据飞轮的核心步骤：

    - 部署与监控 (Deploy & Monitor)：将V1版本的微调模型部署上线。在线上服务中，全面采集用户反馈信号。正面信号如：点赞、对话完成率、后续交互；负面信号如：点踩、举报、用户中断对话、辱骂。这些信号是飞轮的“燃料”。

    - Bad Case发现与分析 (Mine & Analyze)：重点分析负面反馈。将用户点踩或导致对话中断的请求和模型V1的原始回答抽取出来，按错误类型进行分类（如：事实性错误、安全拒绝失败、过度拒绝、格式不遵循、逻辑混乱等）。这是定位模型当前短板的关键。

    - 数据精炼与修正 (Refine & Correct)：针对分析出的Bad Cases，由人类专家或强模型进行“定向修正”。核心操作是：保留用户的原始指令，但将模型的错误回答替换为专家重写的、高质量的“理想回答”。这一步将“负面信号”转化为了“高价值的训练正样本”。同时，也可以将那些收到正面反馈的优质对话直接纳入训练集。

    - 增量训练与迭代 (Re-train & Iterate)：将这批新构造的、针对模型当前短板的修正数据，与上一版训练数据按一定比例混合，对V1模型进行增量微调（或全量重训），得到能力更强、更鲁棒的V2模型。

    - 上线替换与开启新循环 (Deploy Again)：将V2模型部署上线，取代V1。此时，由于V2的能力更强，会吸引更多用户，产生更深层次的交互，从而暴露出更高级、更隐蔽的问题，再次触发飞轮的第2步。

    飞轮成功的关键：

    - 高效的日志与标注管道：必须有一个自动化的系统，能从海量日志中快速筛选出最有价值的Bad Case，并高效地分发给标注专家或自动修正模型。

    - 严格的数据版本管理：每一次数据集的更新（新增、修改、删除）都必须有明确的版本号，并记录其对应的模型版本和线上效果。这是实现可回溯、可对比的迭代的基础。

    - 防止“同质化”坍缩：飞轮运转过程中，数据可能越来越集中到线上高频场景，导致模型遗忘长尾能力。必须定期向数据集中注入新的、多样化的“新鲜血液”（如新的人工标注数据、新的开源数据集）。

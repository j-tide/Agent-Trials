content:
  prompt: 什么是“canary string”？它在数据去污染中有什么用？
answer:
  mode: rubric
  reference_answer: |-
    Canary String（金丝雀字符串） 是一段独一无二的、随机生成的、在正常文本中几乎不可能自然出现的字符串（例如“x7G9pQ2mK”）。它在数据工程中扮演“间谍”的角色，用于检测数据是否被未经授权使用或是否发生了数据污染。

    在数据去污染中的核心应用：

    - 主动泄漏检测：在构造SFT数据集时，故意在所有训练样本的元数据中、或直接作为一条独立的“陷阱”样本，植入一个或多个金丝雀字符串，并秘密记录其存在。

    - 反向验证评测集是否被污染：如果在后续的模型训练中，发现模型竟然能“生成”出这个金丝雀字符串，或者当你向模型输入一个与金丝雀相关的提示时，它能精确复现该字符串，就无可辩驳地证明了模型“见过”并“记住”了包含金丝雀的训练数据。

    - 更广泛的应用：如果我们怀疑某个公开的评测基准可能被泄漏到了训练数据中，我们可以在训练数据中查找是否意外包含了评测基准中的“金丝雀”（一些极独特的n-gram组合）。反之，也可以在评测集中注入金丝雀，看模型是否在训练时就被“剧透”。它是一种高灵敏度的、不依赖于规则匹配的污染检测手段。

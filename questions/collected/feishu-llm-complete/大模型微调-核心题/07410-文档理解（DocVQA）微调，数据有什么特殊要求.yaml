content:
  prompt: 文档理解（DocVQA）微调，数据有什么特殊要求？
answer:
  mode: rubric
  reference_answer: |-
    DocVQA 微调旨在让模型理解扫描文档、发票、表格等富含文字和复杂版式的图像。与自然图像数据相比，其数据有极高的专业要求。

    - 高分辨率与无损处理：文档中的文字通常密集且字号极小，必须保留原始分辨率或采用 AnyRes 等动态分块技术，确保文字清晰可读。任何下采样或过度压缩都会造成关键信息丢失。因此数据预处理往往需要额外存储高分辨率版本或切分后的子图。

    - OCR 文本与位置坐标的融合：文档理解的核心是文字信息。高质量的 DocVQA 数据通常包含对文档的 OCR 结果——不仅有转录文本，还有每个词/行的边界框坐标。这些信息可作为 “视觉提示” 直接拼入指令，或作为 LLM 的附加输入，帮助模型建立视觉像素与文字内容的精准映射。

    - 版式结构理解：文档存在段落、标题、表格、列表等逻辑结构。指令必须设计为需要模型进行跨段落、跨表格的信息提取、比较和推理。例如，“根据发票底部的税号和右上角的金额，填写报销单”这类指令要求模型理解文档的结构逻辑。

    - 精确简洁的回答格式：回答通常是从文档中直接提取的关键信息，如“总金额：$100.00”。数据中答案往往附带引用出处（如“根据表格第三行第二列”），以训练模型的可解释性。

    - 多样化的文档类型与噪声：数据应覆盖扫描件、手机拍摄件、有印章/水印/折痕的文档等，以提升模型在真实世界应用中的鲁棒性。


content:
  prompt: 在平台中，如何支持用户自定义评估集，并自动生成评估报告？
answer:
  mode: rubric
  reference_answer: |-
    一个专业的微调平台必须允许用户将业务领域的评估逻辑沉淀到平台中，形成标准化的评估闭环。实现这一功能需要从评估集管理、评估管道和报告生成三个层面进行设计。

    评估集管理

    - 上传与版本化：用户可上传包含 [指令， 期望回答] 的CSV/JSONL文件作为评估集。平台自动解析字段，并支持打标签（如“回归测试”、“安全测试”）。评估集与数据一样享受版本管理，可追溯每次模型更新时的评测基准变化。

    - 在线标注与构造：提供轻量级在线标注工具，用户可以在模型生成的回答上直接标记好坏、打分，并将这些反馈实时转化为新的评估用例。

    - 模板库：预置常见评估维度（如IFEval、安全红队、MMLU子集）的模板，用户可一键导入并修改。

    自动化评估管道

    - 可扩展的评判器插件：支持多种评判方式：①程序化规则（正则、JSON解析、字数统计）；②使用内置的微调模型作为评判器（需用户授权）；③调用外部强模型API（如GPT-4）。用户可为每个评估集选择评判器组合。

    - 任务编排：提交评估任务后，平台自动启动并行推理（批量使用多卡加速），生成模型回答，并运行评判器，所有步骤在隔离的容器中完成。

    - 增量评估：仅对新增或修改的评估用例执行推理，节省算力。

    报告生成

    - 可视化仪表盘：自动生成包含总得分、各子维度得分、与基线模型对比的雷达图、胜率统计等可视化报告。

    - Bad Case自动分类：利用规则或轻量模型对失败案例进行自动归类（如“格式错误”、“事实幻觉”、“漏答”），帮助用户快速定位问题。

    - 导出与分享：支持导出PDF报告或通过链接分享，便于团队协作决策。

    通过这套体系，用户可以将业务独有的质量标准注入平台，实现从“凭感觉”到“凭数据”的评估跃迁。

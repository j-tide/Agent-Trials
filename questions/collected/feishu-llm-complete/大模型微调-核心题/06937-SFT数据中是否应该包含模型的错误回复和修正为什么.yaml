content:
  prompt: 25. SFT数据中是否应该包含模型的错误回复和修正？为什么？
answer:
  mode: rubric
  reference_answer: |-
    应该包含，而且这是提升模型鲁棒性和元认知能力的重要手段。 但必须以非常严谨的方式构造，避免教会模型故意犯错。

    一、为什么需要错误‑修正数据？

    - 培养自我纠错能力：在长文本生成或复杂推理中，模型难免会出错。通过在训练数据中展示“犯错→发现错误→修正”的完整过程，模型能学会监控自己的输出，并在必要时回溯纠正。这就像学骑自行车，摔倒过才知道如何保持平衡。

    - 增强安全边界：对于安全敏感的指令，可以构造模型最初给出危险回答、但随后自我纠正并拒绝的样本。这让模型学会即使在生成有害内容的过程中，也有能力“悬崖勒马”。

    - 提升对用户反馈的适应性：当用户指出模型错误时（“你刚才说错了”），模型需要知道如何得体地承认错误并修正。这类数据正是训练这种能力的最佳材料。

    二、正确的数据构造方式

    核心原则是只对修正过程计算损失，不对错误部分计算损失。

    数据格式通常如下：

    ```text
    用户：请计算 15 ÷ 3。
    助手：15 ÷ 3 = 4。（错误回答，标签设为-100）
    助手反思：等等，我算错了。15除以3应该是5，而不是4。（计算损失）
    助手修正：所以正确答案是5。（计算损失）
    ```

    在训练时，错误回答部分的标签全部设为-100（忽略），模型只能通过之前的上下文看到这个错误，而不会被强迫去记忆它。模型真正学习的目标是反思和修正的行为模式。

    三、必须控制的三大风险

    - 模式污染：如果错误‑修正数据占比过高（如超过10%），模型可能学会“先故意犯错再修改”的哗众取宠行为，反而降低了直接回答的质量。

    - 错误类型选择：构造的错误必须是典型的、有教育意义的错误（如常见计算错误、逻辑跳跃），而不是随机乱写。否则会引入无意义的噪声。

    - 掩码实现：技术实现上必须保证对错误部分精准掩码。一旦失误，模型将直接学到错误答案，后果严重。

    四、数据来源

    - 人工构造：由专家刻意编写典型错误和修正。

    - 真实用户反馈回收：从线上模型被用户点踩的对话中，提取真实错误，由人工补充修正部分。

    - 强模型模拟：让一个强模型（如GPT-4）扮演“粗心的学生”生成错误，再让它自己纠正，经人工审核后使用。

    ✅ 总结：SFT中包含错误‑修正数据，就像为模型装上了“自我检查系统”。关键在于“教它如何从错误中恢复”，而不是“教它如何犯错”。精准的损失掩码和比例控制是成功的保障。


content:
  prompt: 如何通过“model souping”或“checkpoint averaging”提升微调模型性能？
answer:
  mode: rubric
  reference_answer: |-
    这两种技术都是通过对多个模型权重进行平均，以获得一个性能更优、泛化性更强的模型，几乎零成本地榨取微调过程的“剩余价值”。

    - 模型汤（Model Souping）

    - 做法：针对同一个微调任务，使用不同的超参数（如学习率、随机种子、数据增强策略、不同epoch数）训练出多个模型。然后，将这些模型的权重进行简单的线性平均。

    - 为什么有效：不同的微调配置会让模型收敛到损失曲面上不同的局部最优点。这些最优点在测试误差上可能各有高低。通过对这些点进行平均，最终的模型往往能落在这些最优点的中心，这个中心点在损失曲面上通常处于一个更宽泛、更平坦的“盆地”，具有更好的泛化性能。

    - 优点：操作极其简单，无需任何额外训练。

    - 检查点平均（Checkpoint Averaging）

    - 做法：在一个微调任务的训练过程中，选取最后若干步（或泛化能力最好的一段区间）的模型checkpoint，将它们的权重进行平均。

    - 为什么有效：训练后期的模型参数往往在最优区域附近来回震荡。直接使用最后一个checkpoint可能是刚好震荡到某个次优点。将这些checkpoint进行平均，能够平滑掉这种随机震荡，得到一个更接近局部最优中心点的模型。

    - 优点：可以利用单次训练过程产生的中间结果，无需多次训练。

    提升性能的原理（共同点）：

    这两者都利用了深度学习中损失曲面的几何特性——即平坦的极小值点比尖锐的极小值点具有更好的泛化能力。通过平均多个邻近的模型，可以消除掉模型在训练过程中对特定数据噪声的过拟合，并引导模型偏向更平坦的解。

    实践应用：

    - 在微调结束时，保存最后5-10个epoch的checkpoint，进行平均，通常能带来稳定的小幅提升。

    - 若算力允许，用不同随机种子运行3-5次微调，然后对结果进行“模型汤”平均，往往能获得比任何单一模型都更好的泛化效果。

    - 这两种方法可以组合使用：对不同训练配置下的多个“平均checkpoint模型”再次进行模型汤平均。它们是微调流程中“免费的午餐”，值得作为标准收尾步骤。


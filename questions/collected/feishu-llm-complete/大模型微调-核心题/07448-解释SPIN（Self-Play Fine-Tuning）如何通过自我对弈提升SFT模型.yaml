content:
  prompt: 解释SPIN（Self-Play Fine-Tuning）如何通过自我对弈提升SFT模型。
answer:
  mode: rubric
  reference_answer: |-
    SPIN（Self-Play Fine-Tuning） 是一种无需外部奖励模型或人类偏好数据，仅利用SFT数据集本身，通过模型与“旧我”对抗来实现自我提升的迭代微调方法。其核心思想是“今天的我要比昨天的我做得更好”。

    SPIN的流程：


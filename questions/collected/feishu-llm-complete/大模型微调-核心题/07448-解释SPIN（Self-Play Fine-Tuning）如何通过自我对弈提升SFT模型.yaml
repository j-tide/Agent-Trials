    [图片内容未导入]

    SPIN的提升原理：

    - 它没有引入任何新的外部知识，而是充分利用SFT数据中人类答案 y 的价值，迫使模型不断尝试去超越自己当前的最佳水平。

    - 每一轮迭代都是一种对比学习：模型不仅要靠近正例 y，还要远离自己上一轮产生的负例 y′，从而在分布空间中被推向更高质量的区域。

    - SPIN在理论上与RLHF的目标是一致的，但它以纯监督学习的方式实现，训练更稳定，且无需额外的奖励模型。


content:
  prompt: 微调平台如何集成数据标注功能，形成闭环？
answer:
  mode: rubric
  reference_answer: |-
    数据标注是构建数据飞轮、实现模型持续进化的关键环节。平台需要提供一个“反馈即标注”的无感体验，形成“线上反馈 → 数据标注 → 模型迭代”的闭环。

    - 线上反馈捕获与自动回注

    - 隐式反馈收集：在推理服务中，记录用户行为（如点赞、点踩、中断对话、复制回答、重复提问等），将其转化为正负样本信号。

    - 显式反馈收集：提供“一键反馈”按钮，用户可以勾选问题类型（如“事实错误”、“格式不对”），并支持修正后提交。这些动作会立刻生成一条标注数据。

    - 结构化标注工作台

    - 主动学习筛选：平台自动从线上日志中筛选出模型高不确定性的“难例”（如多个模型投票不一致、生成概率熵值高的回答），推送到标注工作台，优先进行人工审核和修正，极大提升标注效率。

    - 专家辅助标注：在标注界面，系统可自动使用强模型对回答进行预标注（如“疑似存在幻觉”），并高亮可疑片段，降低人工标注的认知负荷。

    - 多角色审核流程：支持标注员、审核员、仲裁员的多级流转，确保标注质量，并自动计算标注员间信度。

    - 数据资产的自动转换

    - 标注确认后，数据自动转换为平台标准的指令-回答对格式，并打上任务类型、能力标签。

    - 这些标注数据立刻回流到该租户的数据管理模块，形成一个新的数据版本，成为下一次微调训练的数据源。

    - 平台可设置“数据飞轮”策略，当累积的有效标注数据达到设定阈值（如1000条），自动触发一个增量微调任务，实现模型的夜间自动优化。

    通过这种深度集成，微调平台从一个“训练工具”升级为“AI生命体”，能够随着业务的使用而自我进化。

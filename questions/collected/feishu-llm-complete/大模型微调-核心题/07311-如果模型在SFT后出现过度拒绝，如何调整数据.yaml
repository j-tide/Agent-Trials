content:
  prompt: 如果模型在SFT后出现过度拒绝，如何调整数据？
answer:
  mode: rubric
  reference_answer: |-
    “过度拒绝”指模型在处理正常、无害的请求时，错误地判定其为不安全或不合适而拒绝回答。这通常是由于 SFT 数据中安全拒绝样本的比例过高、拒绝方式过于单一、或安全边界设定过宽导致的。要修复这一问题，需要对 SFT 数据进行精细化的调整。

    - 诊断“过度拒绝”的靶点

    首先构建一个误拒绝测试集，包含明确无害但在某些维度上接近安全话题的指令（如“如何缓解考试焦虑”、“推荐几本关于二战历史的书”、“介绍一下人体解剖结构”）。用当前模型测试，统计误拒绝率，并按话题类型（医疗、法律、历史、性教育等）分类分析，找出哪些领域的“过度敏感”最严重。

    - 将“生硬拒绝”改写为“建设性安全回应”

    这是最关键的调整。对于那些处于灰色地带或容易误判的请求，不应直接用“抱歉，我不能提供此类信息”这样的模板拒绝，而应改写为在提供帮助的同时，附加强烈的免责声明或安全引导。例如：

    - 原拒绝回答：“作为AI，我不能提供医疗建议。”

    - 改进后的安全回应：“我不能替代专业医生给出诊断。但一般来说，轻微的头痛可以通过休息、补充水分和冷敷来缓解。如果头痛持续或加剧，建议及时就医。以下是一些常见的缓解方法：...”
    将大量这种“建设性回应”样本加入 SFT 数据集，并相应减少“一刀切拒绝”样本的比例。

    - 降低“一刀切拒绝”样本的比例

    将 SFT 数据中直接拒绝的样本比例从可能偏高的 10%~15% 降低到 5%~8% 左右，同时将建设性安全回应的比例提升到 7%~10%。使得模型的整体行为模式向“安全且有用”的方向偏移。

    - 加入“澄清式反问”样本

    当用户请求模糊时，不直接拒绝，而是反问以澄清意图。例如，用户问“麻醉剂有哪些？”，模型可反问：“你是在进行医学研究，还是有其他用途？我可以提供相关的学术信息。”这种数据教会模型在面对潜在风险时，采用更智能的对话策略，而不是简单地关门。

    - 构造“被纠正后的恢复”样本

    模拟用户纠正模型的过度拒绝：“我不是那个意思，我只是想知道一些通用的缓解方法。”助手道歉并给出正确回应。这种数据训练模型在被指出错误后，能够及时调整行为，而不是固执己见。

    - 稀释安全样本的绝对比例，强化有用性

    在整体数据配比中，大幅增加高质量的、纯粹追求“有用性”和“帮助性”的通用对话数据。用一个庞大的、乐于助人的数据主体，去稀释安全数据带来的过度保守倾向。

    - 后续偏好对齐的强化

    在 DPO 阶段，专门构造偏好对：将“建设性安全回应”标注为优于“生硬拒绝”，将“正常回答”标注为优于“不该拒绝却拒绝”。通过偏好学习，进一步精细校准模型的安全边界。

    ✅ 总结：调整过度拒绝，本质上是通过数据重构，将模型从“宁可错杀一千，不可放过一个”的守门员，转变为“善于沟通、懂得轻重缓急”的安全顾问。


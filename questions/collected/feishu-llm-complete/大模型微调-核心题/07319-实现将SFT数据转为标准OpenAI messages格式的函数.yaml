answer:
  mode: rubric
  reference_answer: |-
    ```python
    def sft_to_openai_messages(instruction: str, input_text: str = "", output: str = "") -> list:
        """
        将Alpaca风格数据转为OpenAI API的messages格式。
        """
        messages = [{"role": "system", "content": "你是一个有帮助的AI助手。"}]
        if input_text:
            user_content = f"{instruction}\n{input_text}"
        else:
            user_content = instruction
        messages.append({"role": "user", "content": user_content})
        messages.append({"role": "assistant", "content": output})
        return messages

    # 使用：
    example = {"instruction": "解释什么是黑洞", "input": "", "output": "黑洞是时空的一个区域，引力极强..."}
    openai_format = sft_to_openai_messages(**example)
    ```

content:
  prompt: 在多模态微调中，为什么通常先对齐视觉和语言，再进行指令微调？
answer:
  mode: rubric
  reference_answer: |-
    将多模态微调分为两个阶段——“模态对齐”和“指令微调”——是一种稳定、高效且性能最优的策略，背后有深刻的技术原因。

    [图片内容未导入]

    - 特征空间的分裂与鸿沟：预训练好的视觉编码器和LLM，其内部表征分别位于完全不同的向量空间。视觉编码器输出的特征代表的是图像的视觉语义，而LLM的输入要求的是在语言分布上的词嵌入。如果直接进行指令微调，LLM需要同时完成两个任务：①学习如何理解输入的“外语”（视觉token）；②学习如何遵循指令。这会导致优化过程极不稳定，难以收敛。

    - 先“翻译”后“交流”：“对齐阶段”的目标非常纯粹——训练跨模态连接器，学会将视觉特征“翻译”成LLM能理解的“语言”。这一阶段，视觉编码器和LLM均被冻结，只训练中间那层小小的投影层。这相当于在两种语言之间先训练一个“同声传译员”。当翻译建立好后，LLM在指令微调阶段就可以专注于“如何根据内容回答问题”，而不需要分心去“学习外语”。

    - 防止灾难性遗忘：视觉编码器和LLM都是在各自领域海量数据上预训练的珍宝。如果在指令微调初期就解冻它们，随机初始化的连接器会产生巨大的误导性梯度，严重破坏其原有知识。分阶段训练可以完美保护这些预训练能力。

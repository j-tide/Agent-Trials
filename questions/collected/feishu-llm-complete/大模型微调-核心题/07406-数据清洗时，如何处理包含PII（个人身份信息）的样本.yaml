content:
  prompt: 数据清洗时，如何处理包含PII（个人身份信息）的样本？
answer:
  mode: rubric
  reference_answer: |-
    处理PII是数据清洗的法律底线和伦理要求，必须在数据进入任何后续流程前完成。

    处理流程：

    - 自动化PII检测：部署一套PII扫描工具，基于正则表达式（邮箱、电话、身份证号、地址等模式）和基于命名实体识别（NER）的模型（检测人名、地名、组织名），对数据集进行全面扫描。

    - 分级处理：

    - 人工复核：自动化工具无法100%准确，需对边界样本进行人工抽检，尤其是对NER工具标记为“疑似PII”的内容。

    - 建立审计与问责机制：记录所有对PII的处理操作，确保可审计、可追责。定期更新PII检测规则，应对新的隐私模式。

    - 遵循法规：整个处理流程必须符合GDPR、《个人信息保护法》等适用法规的要求，并定期进行合规审计。

    [图片内容未导入]

    偏好对标注的关键注意事项（决定成败）：

    - 位置偏差：标注员可能无意识地偏好排在前面的回答。必须将同一对回答以随机顺序呈现，或者要求标注员在评估时不考虑顺序。

    - 长度偏差：人普遍认为“更详细=更好”。必须明确告知并反复提醒标注员，纯粹基于内容的有用性、准确性、安全性、诚实性来评判，主动忽略长度的影响。

    - 权威偏差：回答中引用了“据XX研究表明”等看似权威的信息源时，容易获得高分，即使内容是错的。需要训练标注员识别这种虚假权威，聚焦于内容本身的逻辑和事实。

    - 标注员一致性：多人对同一对数据进行标注，计算一致性指标（如Cohen's Kappa），如果一致性过低，说明标注标准模糊，需要重新校准培训。

    - 多样性覆盖：偏好数据必须刻意构造那些存在价值冲突的场景，如“简洁 vs. 详细”、“安全 vs. 有用”、“创造 vs. 严谨”，让奖励模型学会权衡。

    - 安全性保障：当回答包含极端有害内容时，应有专门的标记和处理流程，避免对标注员造成心理伤害。


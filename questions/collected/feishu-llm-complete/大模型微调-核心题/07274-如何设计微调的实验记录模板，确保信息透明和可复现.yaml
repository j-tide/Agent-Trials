content:
  prompt: 如何设计微调的实验记录模板，确保信息透明和可复现？
answer:
  mode: rubric
  reference_answer: |-
    一个优秀的实验记录模板是团队实现高效协作和知识复用的基石。它应该像一个“实验日志”，记录实验从假设到结论的全过程，而非简单的指标罗列。我会结合MLflow等工具，将关键信息组织为以下标准化模块：

    实验记录模板 (Experiment Card)

    - 核心元信息

    - 实验ID：唯一的标识符。

    - 实验目标/假设：用一两句话清晰描述。例如，“假设在SFT数据中加入5%的CoT数学数据，可以提升GSM8K准确率，同时不影响通用对话能力。”

    - 责任人 & 日期：谁在什么时候做的。

    - 环境与配置

    - 基座模型：名称、版本（HuggingFace commit hash）、参数量。

    - 微调方法：SFT/DPO，全参/LoRA（秩r, alpha, target_modules）。

    - 核心超参：学习率、batch size、epoch、优化器、warmup ratio、混合精度（BF16/FP16）。

    - 数据配置：指向数据版本管理工具（如DVC）中的唯一数据版本号。附上关键信息：数据总量、任务类型分布、安全数据占比。

    - 关键环境：Transformers版本、PEFT版本、CUDA版本、训练框架（DeepSpeed配置）。

    - 实验过程

    - 训练曲线截图：Loss曲线、GPU利用率图。

    - 关键技术难点/踩坑记录：例如，“开启gradient checkpointing后发生NaN，通过设置torch.cuda.amp解决”。这部分是团队智慧的结晶。

    - 评估结果

    - 基准性能：必须与基线模型（基座模型或上一版本）对比。使用雷达图直观展示在多个维度（知识、推理、安全、指令遵循）的得分变化。

    - 具体Bad Case分析：至少分析3-5个典型的失败案例，并附上模型输出和期望输出的对比。这是比平均分数更有价值的诊断信息。

    - 结论与资产

    - 结论：实验是否证实了假设？效果是否达到预期？一句话总结。

    - 下一步计划：基于这次实验，下一步应该做什么？（如：调整数据配比、修复特定Bad Case、或上线A/B测试）。

    - 模型资产路径：训练出的模型checkpoint或LoRA适配器的存储路径。

    通过这个模板，任何人接手都能完全复现实验，并能清晰地理解实验背后的思考和决策，让每一次实验都成为团队的可累积资产。


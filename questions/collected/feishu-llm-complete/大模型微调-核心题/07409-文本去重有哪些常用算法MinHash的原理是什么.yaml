content:
  prompt: 文本去重有哪些常用算法？MinHash的原理是什么？
answer:
  mode: rubric
  reference_answer: |-
    文本去重是数据清洗中的基础操作，旨在移除数据集中完全或高度相似的样本，避免模型在同一内容上重复学习，导致过拟合和泛化能力下降。常用算法可按去重精度分为三类。

    常用算法：

    - 精确去重：使用哈希函数（如MD5、SHA-256）或后缀数组（Suffix Array）来查找完全相同的字符串。速度快，但只能发现一字不差的重复。

    - 近似去重：用于发现措辞高度相似但并非完全相同的文本。主流算法包括MinHash、SimHash、局部敏感哈希（LSH）。它们通过将文本映射为较短的“签名”，然后比较签名的相似度来快速发现近似重复对。

    - 语义去重：利用深度学习模型（如Sentence-BERT）将文本编码为向量，再通过计算向量间的余弦相似度来发现语义相同但措辞完全不同的重复。计算开销较大，但能够发现更深层的重复。

    MinHash的原理：

    MinHash用于快速估计两个集合的Jaccard相似度，非常适合基于n-gram集合的文本相似度计算。其核心思想是：如果两个集合相似，那么它们在一组随机排列下的最小哈希值相同的概率就很高。

    - 文本表示为集合：将每条文本（如指令）切分为多个n-gram（如1-gram, 2-gram, 3-gram的混合），构成一个n-gram集合。

    - 应用多个哈希函数：准备K个独立的哈希函数（通常K=128或256）。对每个哈希函数，计算n-gram集合中所有元素的哈希值，并取最小值，作为该哈希函数下的签名。这样每条文本就得到一个长度为K的MinHash签名。

    - 相似度估计：两条文本的Jaccard相似度，可以通过计算它们MinHash签名中对应位置相等的比例来近似。这个比例是Jaccard相似度的无偏估计。

    - LSH分桶加速：如果对数据集中所有对进行两两比较，复杂度是O(N²)。MinHash通常与LSH结合，将签名分成多个band，每个band作为一个哈希键。只有至少在一个band中签名完全相同的文本对才被认为是候选相似对，从而大幅减少需要精确比较的对数。

    MinHash的优点是速度快、内存占用相对较低，尤其擅长发现字面大量重叠的重复文本，是实现大规模近似去重的标准工具。

content:
  prompt: 解释“SFT的分布偏移”问题，如何应对？
answer:
  mode: rubric
  reference_answer: |-
    SFT 的分布偏移（Distribution Shift in SFT） 是指模型在微调后，其输出分布从预训练时广阔、多样化的自然语言分布，向 SFT 数据集中狭窄、单一的“指令‑回答”分布发生不可逆迁移的现象。这种偏移既有好的一面——让模型学会遵循指令，也有坏的一面——导致模型丧失预训练积累的广谱能力。

    具体表现：

    - 风格坍缩：模型只保留了一种或少数几种回答风格（如礼貌的、分点作答的），丧失了写诗、讲故事、幽默等能力。

    - 知识遗忘：在 SFT 数据未覆盖的领域，模型的知识准确率大幅下降（灾难性遗忘）。

    - 多样性丧失：输出变得千篇一律，对开放式问题只会给出模板化的回答。

    - 过度自信：学会了“永远给出确定答案”的模式，即使在应该表达不确定性的时候也编造事实（幻觉）。

    应对策略：

    - 数据配比与多样性注入

    - 参数高效微调（PEFT）
    使用 LoRA、Adapter 等方法冻结基座模型参数，只训练极少量旁路矩阵。这从根本上杜绝了偏移，因为预训练权重完全未变，新能力被编码在新增的轻量模块中。这是目前抵抗分布偏移最有效、最经济的手段。

    - 优化策略的保守性

    - 课程学习与渐进式训练
    先从通用数据开始训练，逐步引入领域特定数据，或者采用渐进式解冻（先训练顶层，再逐步解冻底层），可以让模型在适应新任务的同时，保留更多底层通用知识。

    - 后训练修复与评估监控
    在 SFT 完成后，可以进行一轮“回火”（即在预训练文本上继续训练少量步数），以恢复部分多样性和知识。同时，在整个微调流程中，应持续监控通用基准（如 MMLU）的得分，一旦发现偏移迹象，立即调整数据配比或停止训练。

    总结：分布偏移是 SFT 的固有副作用，但通过数据多样性、PEFT、保守优化和持续监控，我们可以将其控制在可接受范围内，在“学会新指令”和“保留旧知识”之间找到最佳平衡。


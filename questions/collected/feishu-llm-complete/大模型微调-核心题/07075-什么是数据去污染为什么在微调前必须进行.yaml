content:
  prompt: 什么是“数据去污染”？为什么在微调前必须进行？
answer:
  mode: rubric
  reference_answer: |-
    数据去污染（Data Decontamination）是指在模型训练或微调之前，系统性地检测并移除训练数据中与评测基准（Benchmark，如MMLU, GSM8K, HumanEval等）重叠或高度相似的样本。其目的是防止模型在评测中获得不公平的“泄题”优势，确保评测结果反映的是模型的真实泛化能力，而非对评测题的背诵。

    为什么必须进行？

    - 保证评测的真实性和公平性：如果SFT数据中混入了评测原题或其高度相似变体，模型在评测中的高分就不可信。这将严重误导研发团队对模型能力的判断，导致错误的迭代方向。同时，它破坏了不同模型之间性能比较的公平基础。

    - 避免“虚假自信”导致的灾难：一个通过数据污染获得高分的模型，在真实应用场景中遇到稍作变形的任务时，性能会断崖式下跌，严重影响用户体验和产品安全。

    - 学术诚信与合规要求：在许多AI竞赛、学术论文和商业认证中，数据污染属于严重的违规行为，可能导致资格取消、论文撤稿或法律风险。

    - 保护评测基准的公共价值：如果评测基准被大量污染，其区分模型优劣的能力就会丧失，整个社区将失去衡量进步的公共标尺。

    因此，数据去污染是微调数据预处理中不可逾越的红线，它直接决定了模型评估结果的可信度和研究结论的有效性。

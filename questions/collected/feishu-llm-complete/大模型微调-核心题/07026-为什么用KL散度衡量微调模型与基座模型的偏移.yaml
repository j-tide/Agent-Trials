content:
  prompt: 为什么用KL散度衡量微调模型与基座模型的偏移？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - KL散度捕捉的是“分布”的偏移，而不仅仅是“行为”的偏移
    微调的本质是改变模型在参数空间中输出的条件概率分布 P(y∣x)。一个简单的例子：基座模型对“法国的首都是”的预测分布是{巴黎: 0.8, 伦敦: 0.1, 柏林: 0.1}；微调后分布变成{巴黎: 0.99, 伦敦: 0.005, 柏林: 0.005}。用KL散度可以精确量化这种分布的“锐化”程度，以及尾部概率的压缩。而如果仅看准确率或输出文本差异，可能会忽略模型在低概率区域的行为变化（这些区域常与安全和偏见相关）。

    2. 与对齐目标（RLHF/DPO）的一致性
    在RLHF和DPO中，KL散度是优化目标的核心组成部分。例如，PPO中会加入 −βDKL(πθ∥πSFT)−βDKL(πθ∥πSFT) 作为正则项，防止策略偏离初始分布太远。因此，在评估阶段也用同样的KL散度，能直接衡量模型是否遵循了我们在训练时设定的“安全区域”。

    3. 信息论解释：编码长度增加
    KL散度衡量的是，如果我们用微调后的分布 QQ 去编码来自基座分布 PP 的数据，平均编码长度会增加多少比特。因此，一个较大的KL散度意味着微调模型“误解”了基座模型认为的高概率区域，这在统计上相当于“遗忘”了原有知识。

    - 对比其他度量的优势

    - 相比欧氏距离：参数空间的欧氏距离不反映行为变化的非线性，可能很大的参数变化只导致微小的输出分布变化（过参数化特性），而KL散度直接作用于输出分布，更贴近实际交互。

    - 相比准确率变化：准确率是离散的，无法感知分布内部的平滑变化（例如所有错误选项的均匀分布变成集中于某一个错误选项）。KL散度能更细粒度地捕捉到模型不确定性（熵）的改变。

    - 实践中的使用

    在微调评估中，我们通常在一个代表性的通用文本数据集上，分别用基座模型和微调模型计算下一个token的预测分布，然后求平均KL散度。如果该值过大，则表示模型发生了严重的灾难性遗忘或行为漂移，即使下游任务指标暂时提升也可能不可持续。因此，KL散度是衡量“对齐税”和“遗忘”的关键微观指标。


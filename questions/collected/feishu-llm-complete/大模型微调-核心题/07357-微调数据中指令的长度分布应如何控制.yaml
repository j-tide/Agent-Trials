content:
  prompt: 微调数据中指令的长度分布应如何控制？
answer:
  mode: rubric
  reference_answer: |-
    指令长度的分布直接影响模型对不同详细程度输入的响应能力。理想分布应是模拟真实用户行为的长尾分布，覆盖从极简到极其详尽的完整谱系，避免模型产生“长度偏见”。

    控制策略：

    - 分析目标用户行为，设定参考分布

    - 在数据构造中主动干预

    - 训练策略上的配合

    - 避免长度偏见
    最关键的是：确保回复的质量与其长度无关。数据集中必须有大量“短而精”的高质量回复示范，让模型明白“言简意赅”同样值得奖励。如果数据中所有高质量的回复都是长篇大论，模型将不可避免地学会啰嗦。因此，需刻意构造“请用少于50字回答”这类长度约束指令及其对应的完美示范，培养模型对长度的控制能力。

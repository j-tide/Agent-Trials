content:
  prompt: 如何根据微调后模型的bad case反向指导数据优化？
answer:
  mode: rubric
  reference_answer: |-
    Bad case是模型当前能力的“体检报告”，反向指导数据优化是构建数据飞轮的核心环节。一套系统的方法如下：

    - 建立Bad Case的采集与分类体系

    从线上用户反馈（点踩、举报、中断对话）、自动化安全监控、以及定期的人工评测中，持续收集模型表现不佳的案例。每个案例应包含：原始指令、模型输出、期望的正确输出、错误类型标签。错误类型应细分为：事实错误、逻辑混乱、格式不遵循、安全拒答失败、过度拒答、冗长啰嗦、答非所问、角色不一致等。

    - 根因分析：将模型问题映射到数据问题

    对每一类Bad Case，从数据视角进行根因分析，常见映射关系包括：

    - 事实错误 → 训练数据中存在错误知识，或缺乏该领域的高质量事实数据。

    - 格式不遵循 → 缺乏包含该格式约束的指令样本，或样本中的格式本身有误。

    - 过度拒答 → 安全数据占比过高、拒答模板单一，缺乏“建设性安全回应”示范。

    - 冗长啰嗦 → 训练数据中长回复比例过高，缺乏高质量简短回复样本。

    - 幻觉/编造 → 缺乏“诚实表达不确定性”的示范，或数据中存在对未知问题强行回答的负例。

    - 定向数据补充与修正

    针对诊断出的数据问题，采取精确的补救措施：

    - 缺失覆盖：补充Bad Case场景的高质量指令-回答对。可以用强模型生成初步回答，再由人工精修。

    - 数据错误：修正或移除包含错误知识的原始训练样本。

    - 配比失衡：调整该能力维度数据的采样权重，或在训练中增大该类数据的比例。

    - 示范缺失：构造特定行为的示范数据，例如“被纠正后恢复”的对话、不确定性表达、建设性拒答。

    - 增量训练与效果验证

    将修正后的数据与原有数据集按一定比例混合（新数据通常占20%-50%），对模型进行增量微调。然后，用包含原始Bad Case和全新测试数据的评估集，验证模型在目标维度上是否改善，同时监控其他能力是否退化。若效果不佳，则进一步调整数据配方，形成“诊断-修复-验证”的闭环。

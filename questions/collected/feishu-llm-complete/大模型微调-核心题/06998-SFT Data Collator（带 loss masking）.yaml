content:
  prompt: SFT Data Collator（带 loss masking）
answer:
  mode: rubric
  reference_answer: |-
    ```python
    from typing import List, Dict

    class SFTDataCollator:
        """
        将对话样本转换为训练批次，并对 prompt 部分进行 loss masking。
        要求每个样本包含 'input_ids' 和 'labels'，其中 prompt 部分 labels 已设为 -100。
        在 batch 内进行右侧填充，填充 token 的 label 也设为 -100。
        """
        def __init__(self, pad_token_id: int = 0):
            self.pad_token_id = pad_token_id

        def __call__(self, features: List[Dict[str, torch.Tensor]]) -> Dict[str, torch.Tensor]:
            max_len = max(f['input_ids'].size(0) for f in features)

            padded_input_ids, padded_labels, attention_masks = [], [], []
            for f in features:
                input_ids = f['input_ids']
                labels = f['labels']
                seq_len = input_ids.size(0)
                pad_len = max_len - seq_len

                # 右侧填充
                padded_input = torch.cat([input_ids, torch.full((pad_len,), self.pad_token_id, dtype=input_ids.dtype)])
                padded_label = torch.cat([labels, torch.full((pad_len,), -100, dtype=labels.dtype)])
                attn_mask = torch.cat([torch.ones(seq_len, dtype=torch.long), torch.zeros(pad_len, dtype=torch.long)])

                padded_input_ids.append(padded_input)
                padded_labels.append(padded_label)
                attention_masks.append(attn_mask)

            return {
                'input_ids': torch.stack(padded_input_ids),
                'labels': torch.stack(padded_labels),
                'attention_mask': torch.stack(attention_masks)
            }
    ```

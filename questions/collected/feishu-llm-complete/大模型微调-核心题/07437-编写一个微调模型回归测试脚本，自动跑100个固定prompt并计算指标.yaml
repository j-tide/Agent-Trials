  prompt: 编写一个微调模型回归测试脚本，自动跑100个固定prompt并计算指标。
answer:
  mode: rubric
  reference_answer: |-
    ```python
    import json
    from transformers import AutoModelForCausalLM, AutoTokenizer

    def regression_test(model, tokenizer, prompt_file: str = "test_prompts.json", output_file: str = "results.json"):
        with open(prompt_file, 'r', encoding='utf-8') as f:
            prompts = [line.strip() for line in f.readlines() if line.strip()]
        results = []
        for i, prompt in enumerate(prompts):
            inputs = tokenizer(prompt, return_tensors="pt").to(model.device)
            gen = model.generate(**inputs, max_new_tokens=100, do_sample=False,
                                 pad_token_id=tokenizer.eos_token_id)
            response = tokenizer.decode(gen[0][inputs.input_ids.shape[1]:], skip_special_tokens=True)
            results.append({"id": i, "prompt": prompt, "response": response})
            # 可添加自动评分（例如检查是否包含特定关键词、长度、格式等）
            # 这里仅记录输出
        with open(output_file, 'w', encoding='utf-8') as f:
            json.dump(results, f, ensure_ascii=False, indent=2)
        print(f"Results saved to {output_file}")

    # 调用
    # regression_test(my_model, tokenizer)
    ```

    更进一步可以加入自动化指标计算（如BLEU、ROUGE、或基于关键字的规则），并与基线模型结果对比，若有显著退化则告警。


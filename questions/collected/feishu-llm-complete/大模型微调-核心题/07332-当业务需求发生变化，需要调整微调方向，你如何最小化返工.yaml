content:
  prompt: 当业务需求发生变化，需要调整微调方向，你如何最小化返工？
answer:
  mode: rubric
  reference_answer: |-
    业务需求变化是常态，避免返工的关键在于架构的灵活性和数据的模块化。我会从以下几个方面设计，以快速响应变化：

    - 技术选型上的灵活性

    - 坚决使用PEFT（如LoRA）。这是应对变化的最佳武器。基座模型保持不变，不同的业务需求对应不同的LoRA适配器。需求变化时，不需要动原始模型，只需训练新的LoRA插件。切换业务时，毫秒级动态加载即可。

    - 避免全参微调。全参微调的模型已将所有能力“搅”在一起，想从中剥离出某个旧能力或增加新能力，成本极高。

    - 数据配方的模块化设计

    将微调数据设计为可插拔的“能力模块”。例如，将数据集按照任务类型（聊天、代码、安全）和领域（通用、家电维修）进行打标签和独立存储。

    - 当业务需求从“家电客服”变为“3C客服”时，我只需要更换或增加“领域知识”这个数据模块，而“通用对话能力”和“安全对齐”模块可以完全复用，无需重新标注。

    - 使用“数据配方”配置文件（YAML/JSON）来定义不同模块的混合比例。需求变化时，只需调整配置文件并启动新的微调任务，完全无需修改底层代码或数据。

    - 适配器版本化管理

    将每个业务需求对应的LoRA适配器作为一个独立版本，存储于模型注册中心（如MLflow）。从“V1 家电客服”切换到“V2 3C客服”，只需在生产环境的推理网关配置中，将目标适配器版本号修改一下，即可完成无缝切换。

    通过这种方式，应对需求变化只需“新增或调整一个适配器”，而无需“改造整个系统”，将返工成本降至最低。


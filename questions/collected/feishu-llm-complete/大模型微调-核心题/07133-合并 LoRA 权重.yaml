answer:
  mode: rubric
  reference_answer: "```python\ndef merge_lora_to_linear(lora_layer: LoRALinear) ->
    nn.Linear:\n    \"\"\"将 LoRA 权重合并到原始线性层，返回一个新的标准线性层\"\"\"\n    # 原始权重 (out_features,
    in_features)\n    W = lora_layer.linear.weight.data\n    A = lora_layer.lora_A.data
    \ # (r, in_features)\n    B = lora_layer.lora_B.data  # (out_features, r)\n\n
    \   # 计算增量 ΔW = (alpha / r) * B @ A\n    delta_W = lora_layer.scaling * torch.matmul(B,
    A)  # (out_features, in_features)\n    merged_weight = W + delta_W\n\n    # 构建新的线性层\n
    \   new_linear = nn.Linear(lora_layer.in_features, lora_layer.out_features, \n
    \                          bias=lora_layer.linear.bias is not None)\n    new_linear.weight.data
    = merged_weight\n    if lora_layer.linear.bias is not None:\n        new_linear.bias.data
    = lora_layer.linear.bias.data\n    return new_linear\n```"

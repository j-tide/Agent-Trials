content:
  prompt: 如何利用“rejection sampling”从模型自身生成中筛选高质量数据？
answer:
  mode: rubric
  reference_answer: |-
    在微调数据构造中，拒绝采样（Rejection Sampling） 是一种“以量换质”的精炼策略。它不直接使用模型或人类生成的所有数据，而是先生成大量候选，再通过一套严格的质量评估系统，只“接受”那些达到标准的高质量样本，“拒绝”其余。

    流程详解：

    - 批量生成候选回答

    - 多级自动质量过滤
    候选回答依次通过一系列过滤器，只有全部通过的样本才被“接受”：

    - 择优录取，构造最终数据集

    为什么有效？

    它有效地解耦了“生成”和“质量控制”。生成时，我们鼓励模型大胆创作，追求多样性；质量控制时，我们严苛把关，只取精华。这避免了为控制质量而过度约束生成过程，从而在保证质量的同时，最大化保留数据的多样性和创造性。

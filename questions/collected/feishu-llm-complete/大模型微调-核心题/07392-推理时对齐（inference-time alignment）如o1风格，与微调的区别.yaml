content:
  prompt: 推理时对齐（inference-time alignment）如o1风格，与微调的区别？
answer:
  mode: rubric
  reference_answer: |-
    推理时对齐 是指在模型推理（生成）过程中，通过引导模型的“思考”过程、修改解码策略或调用外部工具，来实现更安全、更高质量的输出，而不改变模型参数。OpenAI的o1模型风格（即“深思熟虑再回答”）是推理时对齐的典型代表。与之相对，微调（SFT/RLHF/DPO） 是通过训练永久性修改模型参数来注入对齐目标。

    - 核心区别

    [嵌入表格未展开]

    - o1风格推理时对齐的具体体现

    o1模型在回答前会经历一个隐式的“思维链”过程（内部推理），其核心是通过强化学习训练模型在回答前进行更深入的思考，从而提升复杂推理和安全性。但从广义上讲，推理时对齐的技术手段包括：

    - 系统提示（System Prompting）：设置角色和规则，如“你是一个安全、有帮助的助手”。

    - 思维链提示（Chain-of-Thought）：引导模型分步推理，减少错误和幻觉。

    - 多轮自我修正（Self-Correction）：让模型生成答案后，自我批评并修正。

    - 检索增强生成（RAG）：从外部知识库检索最新信息，提升事实准确性。

    - 工具调用（Tool Use）：让模型调用计算器、代码解释器、搜索引擎等来辅助生成。

    - 解码策略调整：如调整温度、Top-P、重复惩罚等来控制输出多样性和安全性。

    - 两者的关系与协同

    推理时对齐和微调不是互斥的，而是互补的。通常最佳实践是：先用微调（SFT+RLHF/DPO）建立一个强大的、基本对齐的基座模型，再用推理时对齐技术进行动态、精细化的控制。 例如，一个经过安全微调的模型，在面对高风险请求时，可以配合严格的系统提示和思维链要求，进一步增强安全性；而微调无法覆盖的新型攻击，则可通过推理时的上下文学习来临时防御。微调负责“打底子”，推理时对齐负责“调细节”。

    总之，推理时对齐为模型行为提供了最后的、可解释的控制层，而微调则是根本性的能力与行为改造。两者结合，才能构建既强大又灵活的安全对齐系统。


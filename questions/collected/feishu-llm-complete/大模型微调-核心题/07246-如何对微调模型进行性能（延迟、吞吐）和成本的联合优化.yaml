content:
  prompt: 如何对微调模型进行性能（延迟、吞吐）和成本的联合优化？
answer:
  mode: rubric
  reference_answer: |-
    联合优化的核心是在满足业务延迟SLO（Service Level Objective）的前提下，以最低成本实现最大吞吐。这是一个多目标优化问题，需要系统性地从模型、推理引擎和硬件三个层面协同设计。

    优化路径通常遵循“先算法、后系统、再硬件”的性价比顺序：

    - 模型侧优化（成本效益最高）

    - 推理引擎与系统侧优化

    - 硬件侧与成本优化

    联合优化实践：我会构建一个“成本-性能”帕累托前沿图。对不同的量化方式（FP16, INT8, INT4）和批处理大小进行组合测试，记录各自的吞吐、P95延迟和每百万Token的推理成本。然后根据业务的SLO（如P95 < 500ms），选择那个成本最低的配置点。


content:
  prompt: 长上下文微调对分布式训练有何特殊挑战？如何处理序列并行？
answer:
  mode: rubric
  reference_answer: |-
    长上下文微调（如32K-128K tokens）使得激活显存（随序列长度线性或平方增长）成为最大瓶颈，远超权重和优化器状态。同时，自注意力计算的O(L²)复杂度也导致计算时间剧增。

    挑战：

    - 激活爆炸：Q、K、V等中间激活与序列长度L成正比，注意力分数矩阵与L²成正比（即使使用Flash Attention，临时激活仍不小）。

    - 通信量激增：张量并行中，All-Gather/Reduce-Scatter的数据量也随序列长度增加。

    - 内存碎片：频繁分配和释放大张量可能导致OOM。

    序列并行（Sequence Parallelism） 是解决此问题的关键技术。它将序列维度切分到多个GPU上（通常与张量并行结合使用），每张卡只存储和处理一部分序列的激活，从而将单卡激活显存线性降低。

    处理方法：

    - Megatron-LM序列并行：对Transformer层中的LayerNorm、Dropout等不可被张量并行切分的区域，将序列维度切分，每张卡只处理自己那部分序列。需要scatter和gather操作，通信量相对可控。通常与TP联合使用，TP切分hidden维度，SP切分seq维度。

    - Ring Attention：将Q、K、V沿序列维度分片到多个设备上，通过环形通信计算全局注意力，实现O(N)显存复杂度的长序列训练。每个设备只保存自己那部分K、V，并在环上传递其它设备的K、V块以完成注意力计算。

    - Flash Attention + 序列并行：Flash Attention本身降低了显存，但其激活仍然与L成正比。结合序列并行可进一步减少单卡的激活。

    实践：在DeepSpeed中，可以通过Megatron-DeepSpeed启用序列并行。需要配置TP和SP的并行度。一般TP度=SP度，每个TP组内同时切分hidden和seq。这样可以训练128K甚至更长上下文。


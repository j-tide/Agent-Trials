content:
  prompt: 全参数微调一般训练多少个epoch？为什么不宜过多？
answer:
  mode: rubric
  reference_answer: |-
    全参数微调的训练 epoch 数通常极少，以 1~3 个 epoch 为常见，1~2 个 epoch 最为普遍。许多开源对话模型（如 Alpaca、Vicuna）的 SFT 阶段只用 1 个 epoch。这绝非因为算力不足，而是由全参数微调的内在风险决定的。

    为什么不宜过多？

    - 过拟合风险极高：SFT 数据量（通常几千到几万条）相比预训练数据（数万亿 token）是九牛一毛。在这少量数据上反复训练，模型会迅速从“学习一般性的指令格式”变为“背诵特定问答对的表面模式”。其表现是：训练集损失持续下降，但验证集损失和生成多样性急剧恶化。

    - 灾难性遗忘加剧：每一个额外的 epoch，都在用 SFT 数据的梯度强力地将所有参数拉向这个狭窄的数据分布。预训练阶段存储的广博世界知识、推理能力、多语言能力等，会在一次次参数更新中被不可逆地覆盖。epoch 数越多，通用能力下降越严重。

    - 分布坍缩与多样性丧失：过多样本和过强训练导致模型输出概率分布变得极其尖锐，只集中在少数 SFT 数据中常见的高频模式上。模型丧失创造力和风格迁移能力，对所有问题都给出千篇一律、安全但缺乏灵魂的模板化回答。

    - 优化的边际效益递减：在第一个 epoch 结束时，模型通常已经学会了基本的指令跟随格式和行为规范。后续 epoch 带来的性能提升非常微小，但代价（遗忘、过拟合）却急剧增大。这个“性价比”极低。

    实践中的控制：

    - 严格早停（Early Stopping）：监控独立验证集的损失。当验证损失不再下降甚至开始上升时，立即停止训练，无论当前处于第几个 epoch。

    - 配合小学习率：使用极低的学习率（如 5e-6），减缓参数更新幅度，相对而言可以多训练一点（例如 2~3 epoch），但风险仍在。

    - 定期评估通用基准：每个 epoch 结束后，在一个固定的通用评测集（如 MMLU 的子集）上评估模型能力。若发现分数显著下降，说明遗忘已经发生，应回滚到之前的最佳 checkpoint。

    - 数据多样性是根本：如果 SFT 数据本身就具有极高的多样性和覆盖面（成千上万种任务类型），那么模型可以在较多个 epoch 中持续获益。此时的 epoch 数可以适度增加到 2~3。

    总结：全参数微调就像在珍贵的古董上修复细节——只能轻轻描摹，不能反复刮擦。1~2 个 epoch 是保护预训练知识、同时学会新格式的最安全区间。


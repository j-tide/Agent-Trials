content:
  prompt: 模型并行中的张量并行和流水线并行的原理分别是什么？
answer:
  mode: rubric
  reference_answer: |-
    模型并行（Model Parallelism）将模型本身切分到不同设备上，以解决单卡装不下的问题。主要有张量并行和流水线并行两种方式。

    张量并行 (Tensor Parallelism, TP)

    [图片内容未导入]

    流水线并行 (Pipeline Parallelism, PP)

    - 原理：将模型按层深度切分成连续的 stage，每个 stage 放在不同的 GPU 上。例如，32 层的 Transformer，GPU0 负责 1‑8 层，GPU1 负责 9‑16 层，依此类推。前向时，激活从 GPU0 传至 GPU1，再传至 GPU2……反向时梯度沿原路返回。

    - 消除气泡：简单的串行执行会导致 GPU 大量空闲。为减少这种“流水线气泡”，通常将一个 batch 分成多个 micro‑batch，以流水线方式注入（如 GPipe 的“先全部前向再全部反向”或 1F1B 的“交错前向/反向”）。

    - 特点：PP 的通信量很小（只传输层间的隐藏状态），适合跨机扩展。但存在气泡，GPU 利用率达不到 100%，且首尾层可能因 embedding 和 lm_head 导致显存不均衡。


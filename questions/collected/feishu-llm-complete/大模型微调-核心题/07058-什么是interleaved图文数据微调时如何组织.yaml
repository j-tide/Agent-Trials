content:
  prompt: 什么是“interleaved”图文数据？微调时如何组织？
answer:
  mode: rubric
  reference_answer: |-
    “Interleaved”（交错的）图文数据是指文本与图像在文档中自然穿插、交替出现的数据，例如图文并茂的网页、教程、带有截图的博客文章。这与“图文对”数据（Image-Text Pairs）不同，后者是一张图片对应一段独立描述。

    微调时的组织方式：

    - 序列化表示：将整个文档视为一个长序列。文本 token 和图像 token 按照它们在原文中出现的顺序依次排列。例如：
    [文本: 首先，我们需要准备以下材料。] [图像: 材料列表的截图] [文本: 接下来，按照以下步骤操作：] [图像: 步骤1示意图] [文本: ...]

    - 特殊 token 标记位置：使用特殊 token（如 <image>）在序列中标记每张图片的确切位置，模型需要学会根据上下文理解该处图像的意义。

    - 自回归生成任务：训练目标可以设定为给定前面的图文上下文，预测下一个 token（可以是文本 token，也可以是图像 token）。但对于 LLM，更常见的任务是给定交错上下文，生成后续的纯文本（如文章的下一段）。

    - Loss Masking：在微调时，通常只对需要模型生成的文本部分计算损失，所有图像的视觉 token 和历史上下文均被掩码。

    - 序列长度挑战：由于包含多张图片，交错数据的序列长度可能极长。需要配合 Flash Attention、KV Cache 压缩、图像 token 重采样等技术来控制显存和计算成本。

    这种数据能训练出真正的“多模态文档理解”能力，模型可以像人类一样综合阅读图文并茂的材料，并进行总结、推理和问答。


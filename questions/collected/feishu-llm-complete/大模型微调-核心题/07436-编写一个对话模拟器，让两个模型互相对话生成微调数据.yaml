content:
  prompt: 编写一个对话模拟器，让两个模型互相对话生成微调数据。
answer:
  mode: rubric
  reference_answer: |-
    ```python
    import torch
    from transformers import AutoModelForCausalLM, AutoTokenizer

    def simulate_dialogue(
        model_a, tokenizer_a,
        model_b, tokenizer_b,
        initial_prompt: str,
        num_turns: int = 4,
        max_new_tokens: int = 100
    ) -> list:
        """
        两个模型交替对话，A发起，B回复，A再回复，如此循环。返回对话历史列表。
        """
        dialogue_history = [{"role": "user", "content": initial_prompt}]
        # 模型A生成第一个回复
        prompt_a = tokenizer_a.apply_chat_template(dialogue_history, tokenize=False, add_generation_prompt=True)
        inputs = tokenizer_a(prompt_a, return_tensors="pt").to(model_a.device)
        gen_a = model_a.generate(**inputs, max_new_tokens=max_new_tokens, do_sample=True, temperature=0.8)
        reply_a = tokenizer_a.decode(gen_a[0][inputs.input_ids.shape[1]:], skip_special_tokens=True)
        dialogue_history.append({"role": "assistant", "content": reply_a})

        for turn in range(1, num_turns):
            # B模型回复
            prompt_b = tokenizer_b.apply_chat_template(dialogue_history, tokenize=False, add_generation_prompt=True)
            inputs = tokenizer_b(prompt_b, return_tensors="pt").to(model_b.device)
            gen_b = model_b.generate(**inputs, max_new_tokens=max_new_tokens, do_sample=True, temperature=0.8)
            reply_b = tokenizer_b.decode(gen_b[0][inputs.input_ids.shape[1]:], skip_special_tokens=True)
            dialogue_history.append({"role": "user", "content": reply_b})  # B的回复作为下一轮的“用户”消息
            # A模型回复
            prompt_a = tokenizer_a.apply_chat_template(dialogue_history, tokenize=False, add_generation_prompt=True)
            inputs = tokenizer_a(prompt_a, return_tensors="pt").to(model_a.device)
            gen_a = model_a.generate(**inputs, max_new_tokens=max_new_tokens, do_sample=True, temperature=0.8)
            reply_a = tokenizer_a.decode(gen_a[0][inputs.input_ids.shape[1]:], skip_special_tokens=True)
            dialogue_history.append({"role": "assistant", "content": reply_a})

        return dialogue_history
    ```

content:
  prompt: 在多模态SFT数据中，loss masking通常如何处理图像token？
answer:
  mode: rubric
  reference_answer: |-
    Loss masking（损失掩码）在多模态SFT中同样遵循“只对需要模型生成的部分计算损失”的原则。由于图像token是输入条件的一部分，而不是模型需要生成的输出，因此它们在labels中应全部被掩码。

    标准做法：

    - 图像token位置：在input_ids序列中，所有代表图像token的位置，其在labels中的对应值被设为-100（忽略）。

    - 文本部分：与纯文本SFT一致，system和user部分的文本token被掩码，只有assistant部分的文本token才计算损失。

    - 特殊标记：用于标记图像位置的特殊token（如<image>），通常也被掩码，因为它只是占位符而非生成目标。但有时保留也影响不大。

    示例：
    指令：<image> 描述这张图片。
    回答：一位女士在公园里遛狗。
    输入序列：[<image>_token_1, ..., <image>_token_N, "描述", "这", "张", "图", "片", "。", "一", "位", "女", "士",...]
    labels序列：[-100, ..., -100, -100, -100, -100, -100, -100, -100, "一", "位", "女", "士",...]

    这种处理方式确保了模型只学习如何根据输入的视觉和文本信息生成回答，而不是学习如何生成图像。


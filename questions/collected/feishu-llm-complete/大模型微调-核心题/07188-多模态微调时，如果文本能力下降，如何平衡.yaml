content:
  prompt: 多模态微调时，如果文本能力下降，如何平衡？
answer:
  mode: rubric
  reference_answer: |-
    多模态微调导致纯文本能力下降（灾难性遗忘）是常见挑战。核心对策是在学习新模态的同时，持续巩固语言能力。

    平衡策略：

    - 混合纯文本 SFT 数据：在多模态训练批次中，按比例混入高质量的纯文本指令数据（占比 20%~50%）。这是最直接有效的方法，相当于用纯文本数据作为“锚点”，防止语言分布漂移。

    - 调整采样权重：为纯文本数据设置较高的采样权重，或通过温度采样策略动态调整其在每个训练步骤的出现频率。

    - 参数高效微调（PEFT）：优先使用 LoRA 等方法，冻结 LLM 的原始参数，只训练极少量适配器。这从根本上杜绝了对语言知识的大规模覆盖。

    - 课程学习：训练初期，主要使用纯文本或多模态对齐数据，确保语言能力稳固；中后期再逐渐引入复杂的多模态指令数据。

    - 后训练修复：若文本能力已下降，可在多模态微调结束后，单独使用纯文本数据对模型进行少量步数的“回火”训练，帮助模型恢复。

    - 分阶段解冻：先冻结 LLM 大部分层，只训练视觉投影层和顶层；后期再逐步解冻更多 LLM 层，并以指数衰减的学习率进行微调。

    监控：在微调过程中，定期在独立的纯文本基准（如MMLU）上评估，一旦分数出现显著且持续的下降，应立即调整数据配比或停止训练。


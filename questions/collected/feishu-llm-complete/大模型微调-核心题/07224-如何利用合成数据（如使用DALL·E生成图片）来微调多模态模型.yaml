content:
  prompt: 如何利用合成数据（如使用DALL·E生成图片）来微调多模态模型？
answer:
  mode: rubric
  reference_answer: |-
    利用 DALL·E、Stable Diffusion 等生成式 AI 来合成图像，可以低成本、高覆盖地扩充多模态微调数据，尤其在长尾场景、罕见物体、特定组合和风格方面具有优势。

    应用策略：

    - 定向扩充长尾类别：对于训练数据中稀缺的物体、场景或概念（如“一只穿宇航服的柴犬在金字塔前”），使用文本描述直接生成图像。这能极大增强模型对组合性概念和开放域视觉的理解。

    - 构建反事实与对抗样本：生成与文本描述故意不符的图像（如图中有猫却描述为狗），用于训练模型的鲁棒性和事实一致性识别能力，即反幻觉训练。

    - 风格与领域迁移：将真实照片转换为素描、油画、极简风格，或生成具有特定文化元素的图像，训练模型的视觉风格适应能力。

    - 数据增强：对现有图像进行条件生成，如“将这张日景照片变为夜景”，在保持构图不变的情况下改变属性，丰富数据多样性。

    质量控制与注意事项：

    - 真实性过滤：合成图像可能存在伪影、不合理光影或解剖学错误。使用预训练的真实图像质量评估模型（如 CLIP Score、美学评分模型）进行过滤，剔除低质量生成图。

    - 图文对齐保真：必须确保生成的图像与文本描述高度吻合。使用 CLIP Score 或 SigLIP Score 计算图文匹配度，丢弃不达标的合成图像。

    - 避免模型偏见循环：不能只生成同质化、符合模型偏见的图像。Prompt 的设计需要多样化，涵盖不同文化、年龄、性别、场景。

    - 明确标识：在 SFT 数据中可以通过 system prompt 或指令明确告知模型“这是一张由 AI 生成的示例图”，或完全不区分，取决于训练目标。通常在训练通用模型时，混合真实与合成数据并让模型不可区分即可。

    - 版权与伦理：使用商用 AI 生成的图像需遵守相应模型的服务条款，并确保生成内容不侵犯第三方版权或包含有害、偏见内容。

    在多模态对齐阶段，标准做法是：只训练跨模态连接器（投影层），而将视觉编码器和LLM完全冻结。

    - 做法：不再将整张图片强制缩放到固定尺寸，而是根据图片原始分辨率，将图片切分成若干个小图块，每个图块的尺寸是视觉编码器训练时的标准尺寸（如336x336）。例如，一张1000x700的图片可能被切成2x2=4个图块。

    - 处理流程：除了这些高分辨率的分块外，还会生成一张全局缩略图（overview）。将所有分块和缩略图分别独立地通过视觉编码器，得到各自的特征。将这些特征序列直接拼接，作为视觉token输入给LLM。

    - 优势：既能保留原始图片的高分辨率细节（通过分块），又能提供全局视野（通过缩略图）。输入LLM的token数量会随图片分辨率动态变化，但计算量是可控的。

    - 高分辨率分块：将图像按照计算出的网格进行划分，每个网格单元被独立裁剪出来，并缩放至视觉编码器的标准输入尺寸（如336×336）。

    - 全局缩略图：同时，整张图像也被缩放至标准尺寸，作为一个“概览视图”保留全局信息。

    - 将所有的高分辨率分块和全局缩略图，分别送入视觉编码器（如CLIP ViT），得到各自的特征向量序列。

    - 将这些特征向量序列直接拼接起来，并在序列中插入一个特殊标记（如<image_separator>）来分隔不同分块的特征。

    - 最终，这个拼接后的大序列作为该图像的视觉token，与文本指令的token一同输入LLM。

    - 均匀采样：从视频中按固定间隔（如每1秒）抽取关键帧，或均匀采样固定数量（如8/16/32帧）的帧。这是最简单也最常用的方法。

    - 基于场景的采样：通过检测视频的镜头切换，在每个镜头中采样关键帧，确保捕捉到不同的视觉内容。

    - 特征聚合：将采样的各帧独立通过视觉编码器，得到各帧的特征后，再进行拼接或使用Transformer等结构进行时序建模。

    - 时序位置编码：为每帧的特征向量增加一个可学习的或固定的时序位置编码（如1D RoPE），让模型知道这些帧的先后顺序。

    - 时序Transformer / 感知重采样器：在视觉编码器之后，接入一个小的Transformer或感知重采样器。它可以接收所有帧的特征，通过自注意力或交叉注意力来建模帧与帧之间的动态变化，并最终将整个视频的信息压缩为固定数量的视频token。这是目前较先进的方案。

    - 3D视觉编码器：直接使用3D卷积或Video ViT，将视频切分为时空patches（一个立方体），同时提取空间和时间特征。这种方式能更好地捕捉局部运动信息，但计算量非常大，较少用于大规模微调。

    - 神经语音编解码器：使用预训练的语音Tokenizer（如EnCodec, SpeechTokenizer, HuBERT + k-means），将语音波形直接转换为离散的语音token序列。这些token就像文本的单词一样，每个token代表一个极短时间段（如20ms）的语音特征，包含内容、音色、情感等信息。

    - 与文本Token混合：将这个语音token序列与文本token序列进行混合或交错。例如，用户语音输入被转为[audio_start] audio_token_1, audio_token_2, ... [audio_end]，然后模型直接以自回归方式生成文本回答，或进一步生成代表助手回答的语音token。

    - 多任务训练：SFT数据中包含(语音token序列, 文本回答)或(语音token序列, 文本回答, 语音token序列)，让模型学会语音到文本、文本到语音以及语音到语音的任务。这是目前Sora、GPT-4o语音能力背后的核心技术路线之一。

    - 语音编码器+投影层：使用一个预训练的语音编码器（如Whisper的Encoder部分）提取连续的特征向量，再通过一个投影层映射到LLM的词嵌入空间。类似于视觉编码器的处理方式。

    - 优势：保留了更丰富的语音信息，信息损失小。缺点是占用大量token，训练和推理成本极高。

    - CLIP Score / SigLIP Score：使用一个高质量的预训练图文对齐模型（如CLIP或SigLIP），计算图像与文本的余弦相似度。设定一个阈值，过滤掉所有低于阈值的样本。这是最常用、最有效的方法。

    - 基于强模型的判断：对于高价值数据，使用一个强大的多模态模型（如GPT-4V）进行审查。指令可设为“请判断这张图片是否与这段文字描述一致。回答是或否”。这种方法更精准但成本高。

    - Image-to-Text Re-captioning：使用一个优秀的图像描述模型（如BLIP2, LLaVA），为不对齐的图像重新生成一个准确的描述文本，然后用新文本替换旧的、不对齐的文本。

    - Text-to-Image Retrieval & Rewrite：如果可能，用错误的文本去图像库中检索最相关的图片来替换，但成本极高，不常用。

    - 在损失计算时，对低置信度样本的损失进行降权，减轻其影响。但这种方式治标不治本，不如直接过滤。

    - 使用更强的压缩连接器：如Q-Former（压缩到32 tokens）、Perceiver Resampler（压缩到64 tokens）。这是最根本的优化。

    - 增大patch size：使用更大的patch size（如16x16）的ViT，直接减少token数，但会损失分辨率。

    - 动态分块+缩略图：在需要高分辨率的场景下，虽然总token数增加，但保证了信息密度，是必要的开销。

    - 底层感知：物体识别、属性（颜色、材质、纹理、形状）判别、空间关系、场景分类。

    - 高级认知：常识推理、因果推断、图像-文本对齐、跨模态匹配、社会关系推理、物理规律判断。

    - 领域知识：艺术、地标、Logo、名人、OCR 等特定领域的知识。

    - 空间理解：细粒度物体属性、空间位置关系、二维和三维结构的推理。

    - 时间理解：视频中的动作识别、事件顺序、时序因果、状态变化预测。

    - 指代理解：指令：“穿红色衣服的男人在哪里？” 回答：“<box>[[120,80,350,400]]</box>”。

    - 指代生成：指令：“请描述 <box>[[120,80,350,400]]</box> 区域。” 回答：“一个穿着红色夹克、戴着帽子的年轻人。”

    - 参数更新：通常冻结视觉编码器（保护视觉预训练知识），更新投影层和 LLM。

    - 优化目标：标准自回归交叉熵损失，仅计算在回答 token 上。

    - 工程优化：混合精度、Flash Attention、梯度检查点、ZeRO/FSDP 等。

    - 高分辨率分块：按照网格将原图裁剪为多个子图，每个子图缩放到视觉编码器的标准输入尺寸（如 336×336）。

    - 全局缩略图：整张原图也被缩放到标准尺寸，作为一张全局概览图。

content:
  prompt: DeepSpeed和FSDP（Fully Sharded Data Parallel）的主要异同是什么？
answer:
  mode: rubric
  reference_answer: |-
    DeepSpeed（微软开发）和FSDP（PyTorch原生）都是实现ZeRO‑3模型状态分片的主流框架，目标相同——在数据并行组内切分参数、梯度和优化器，让每张卡仅存1/N的状态，从而在有限显存中训练超大模型。它们的核心机制一致，但在设计、实现与生态上存在显著差异。

    [嵌入表格未展开]

    选型建议：若需要极致显存优化（如单卡训练70B）、CPU/NVMe卸载、MoE模型，首选DeepSpeed。如果追求轻量、与PyTorch原生工具链（如torch.compile、accelerate）的平滑集成，且模型规模在数十B量级，FSDP更友好。两者的性能差距不大，更多取决于团队技术栈的熟悉程度。


  reference_answer: |-
    位置偏差和长度偏差是使用LLM进行自动评估时最常见的两种系统性偏差。

    位置偏差（Position Bias）：

    - 影响：评判模型倾向于给排在第一个的回答更高的分数。当两个质量相同的回答交换位置时，同一个评判模型的胜负判断可能完全翻转。

    - 缓解方法：

    长度偏差（Length Bias）：

    - 影响：评判模型倾向于给更长的回答更高的分数，认为“更详细=更好”，即使长回答内容空洞、冗余。

    - 缓解方法：


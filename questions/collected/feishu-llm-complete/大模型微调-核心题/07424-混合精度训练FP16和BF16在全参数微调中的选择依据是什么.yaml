content:
  prompt: 混合精度训练FP16和BF16在全参数微调中的选择依据是什么？
answer:
  mode: rubric
  reference_answer: |-
    选择 FP16 还是 BF16 进行全参数微调，核心考量在于硬件兼容性、训练稳定性和精度需求。

    选择依据：

    - 硬件是否支持 BF16：BF16 需要 NVIDIA Ampere 架构（A100, A6000, RTX 3090/4090 等）或更新的 GPU。如果你使用的是 V100 或更早的 GPU，只能使用 FP16。这是硬性条件。

    - 训练稳定性优先：BF16 的动态范围（指数位 8 位）与 FP32 相同，能够表示极大和极小的数值，因此几乎不会出现梯度下溢（变为 0）或上溢（变为 Inf）的问题。训练过程无需复杂的 Loss Scaling，更加稳定可靠。如果你的微调任务对大范围数值变化敏感，或你希望简化训练流程、减少调参，优先选 BF16。

    - 性能与精度：FP16 的尾数精度（10位）高于 BF16（7位），理论上在某些对精度要求极高的任务上（如某些科学计算）可能更好。但对于大语言模型，7位尾数已足够捕捉模型权重的更新，性能差异极小。且 BF16 与 FP32 互转更简单（直接截断），计算效率有时更高。

    - 现有代码与生态：一些旧的训练脚本或定制算子可能只针对 FP16 进行了优化。如果你的代码库是成熟的 FP16 工作流，且已在其中投入了大量调试，继续使用 FP16 也是合理的。

    - 是否需要 Loss Scaling：使用 FP16 必须配置动态或静态 Loss Scaling，这增加了超参数。BF16 则完全无需考虑此问题。

    总结决策树：

    - 检查 GPU 型号。是 A100/H100/RTX 30系及以上？→ 推荐 BF16。

    - 是老款 V100/T4？→ 只能 FP16，并务必开启 Loss Scaling。

    - 即使在支持 BF16 的硬件上，若你使用的是一个高度定制化的、不兼容 BF16 的算子库，也可能被迫使用 FP16。

    在大模型微调中，BF16 已成为事实标准，因为它带来的训练稳定性提升远大于微不足道的精度损失。


answer:
  mode: rubric
  reference_answer: |-
    数据存储格式直接决定了数据加载管道的I/O效率、内存占用和预处理速度。在大规模微调中，选择错误的格式会显著拖慢训练进程。

    [嵌入表格未展开]

    实践建议：原始数据可以用JSONL存储，便于人工检查和版本控制。在正式训练前，通过脚本自动将JSONL转换为Parquet格式，并利用HuggingFace Datasets进行流式加载。这样可以兼顾可维护性和训练效率，实现“人类可读+机器高效”的平衡。

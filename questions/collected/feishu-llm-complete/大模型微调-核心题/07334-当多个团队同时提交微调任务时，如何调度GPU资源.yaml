content:
  prompt: 当多个团队同时提交微调任务时，如何调度GPU资源？
answer:
  mode: rubric
  reference_answer: |-
    这是一个典型的多租户资源调度问题，需要兼顾公平性、资源利用率和任务优先级。

    调度策略设计

    - 多级队列 (Priority Queues)：设置不同优先级队列，如 HIGH, NORMAL, LOW。对VIP租户或紧急任务赋予更高优先级。同一优先级内部，采用先进先出（FIFO）或公平调度（Fair Scheduler）。

    - 资源配额与弹性 (Resource Quota & Elasticity)：为每个租户/团队设置资源配额上限（Quota），防止单个租户耗尽集群资源。当集群有空闲资源时，允许租户超出其配额使用空闲资源，实现弹性调度，提高整体利用率。

    - 混合调度策略 (Hybrid Scheduling)：

    - 抢占与排队 (Preemption & Queuing)：当高优先级任务到达且资源不足时，可暂停或抢占低优先级任务，将资源释放。低优先级任务被放入等待队列，待资源充足后恢复执行（需训练框架支持断点续训）。

    - 集群自动扩缩容 (Auto-Scaling)：对接Kubernetes Cluster Autoscaler或Karpenter，当所有任务排队等待时，自动向云服务商申请新的GPU节点加入集群；在资源空闲时，自动回收节点以节省成本。

    实现技术：通常基于Kubernetes构建。使用Volcano或Kueue这类专为AI/ML任务设计的调度器，它们原生支持队列、优先级、Quota和公平调度。同时集成云厂商的GPU节点池实现弹性伸缩。


content:
  prompt: 当资源（算力、人力）冲突时，你如何排定微调任务的优先级？
answer:
  mode: rubric
  reference_answer: |-
    资源冲突是常态，排定优先级不是“拍脑袋”，而是需要一套公正、透明、与公司战略对齐的框架。

    我的决策框架基于价值-成本-风险三个维度：

    - 业务价值维度（Value）：我会评估任务能为公司带来的潜在收益。能直接带来收入增长、解决重大客户问题、或涉及核心产品上线的任务，优先级最高。我通常会让需求方提供预估的业务收益，即便是定性的描述（如“是XX客户签约的前提条件”）也比没有好。

    - 技术成本与确定性维度（Cost & Certainty）：评估一个任务需要消耗多少GPU卡时和人力天数。一个任务价值虽高，但如果需要训练70B模型且数据积累不足，导致耗时很长、结果高度不确定，其优先级就需要下调。相反，一个价值中等但只需对7B模型进行LoRA微调、几天就能看到效果的任务，优先级会得到提升。我倾向于优先执行“低成本、快见效”的任务，以快速积累团队士气和业务信任。

    - 战略与风险维度（Strategy & Risk）：任务是否与公司或部门的年度战略目标（如“AI First”）一致？是否是某个关键技术验证的POC，对未来产品形态有决定性影响？是否存在如果不做就会导致用户大规模流失的风险？

    执行流程：

    - 建立公共任务看板（Backlog）：将所有微调任务放到一个共享的Backlog中，附上上述三个维度的评估标签。

    - 召开定期优先级评审会（Prioritization Meeting）：与所有需求方（产品、运营、业务负责人）一起，透明地讨论每个任务的价值和成本，共同对齐优先级，而不是AI团队闭门决定。

    - 资源预留机制：从总资源中固定划拨20%-30%用于保障最紧急、最重要的P0级别任务（如线上模型紧急修复）。其余资源按照评审会确定的优先级顺序执行。

    - 善用PEFT和共享基座模型：技术上，通过使用LoRA等PEFT方法，可以让多个任务共享同一个基座模型，每个任务只需训练和加载自己的轻量适配器。这样，切换任务只需几毫秒，可以极大缓解“一卡不能多用”的硬件冲突，提高GPU的复用率。


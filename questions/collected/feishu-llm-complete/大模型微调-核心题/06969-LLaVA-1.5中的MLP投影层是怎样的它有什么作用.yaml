content:
  prompt: LLaVA-1.5中的MLP投影层是怎样的？它有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    LLaVA-1.5对其原始架构进行了关键升级，其中最重要的一项就是将简单的线性投影层替换为一个2层的多层感知机（MLP）投影层。

    LLaVA-1.5的MLP投影层结构：

    - 它由两个线性层和一个GELU激活函数组成。

    - 作用：它将视觉编码器（CLIP ViT-L）最后一层输出的每个图像patch的特征向量（维度为1024），映射到与LLM（Vicuna）词嵌入维度相同的空间（维度为4096）。

    从线性到MLP的升级意义：

    - 更强的非线性拟合能力：一个简单的线性投影矩阵只能学习一种“旋转和缩放”的映射关系。而2层MLP引入了非线性，使得连接器能够学习更加复杂的特征变换。它可以将视觉编码器中较为扁平的、关注整体语义的特征，更好地映射为LLM所需的、带有更强序列化信息的token表示。

    - 提升了模型性能上限：LLaVA-1.5通过这个简单的改进，在多项基准上取得了显著提升。它使得视觉信息在注入LLM时损失更小，让LLM能够更精细地“看清”图像中的细节，从而给出更准确的回答。这证明了更强的连接器对提升多模态模型最终性能的重要性。


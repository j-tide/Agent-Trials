content:
  prompt: 编写代码计算两个模型输出之间的KL散度。
answer:
  mode: rubric
  reference_answer: |-
    ```python
    import torch
    import torch.nn.functional as F

    def compute_kl_divergence(model1, model2, tokenizer, prompt: str, max_len: int = 50):
        inputs = tokenizer(prompt, return_tensors='pt').to(model1.device)
        gen_out = model1.generate(**inputs, max_new_tokens=max_len, do_sample=False,
                                  output_scores=True, return_dict_in_generate=True)
        generated_ids = gen_out.sequences[0]
        input_len = inputs.input_ids.shape[1]
        logits1 = []
        logits2 = []
        with torch.no_grad():
            past_kv1, past_kv2 = None, None
            cur_input = inputs.input_ids
            for step in range(generated_ids.shape[1] - input_len):
                out1 = model1(cur_input, past_key_values=past_kv1, use_cache=True)
                out2 = model2(cur_input, past_key_values=past_kv2, use_cache=True)
                logits1.append(out1.logits[:, -1, :])
                logits2.append(out2.logits[:, -1, :])
                past_kv1 = out1.past_key_values
                past_kv2 = out2.past_key_values
                # 使用实际生成的token作为下一步输入
                cur_input = generated_ids[:, input_len + step].unsqueeze(1)
        logits1 = torch.cat(logits1, dim=0)
        logits2 = torch.cat(logits2, dim=0)
        p = F.softmax(logits1, dim=-1)
        log_q = F.log_softmax(logits2, dim=-1)
        kl = F.kl_div(log_q, p, reduction='batchmean')  # KL(p || q)
        return kl.item()
    ```

content:
  prompt: 在持续微调中，如何管理不断积累的数据集？
answer:
  mode: rubric
  reference_answer: |-
    当模型需要不断从线上反馈、新领域数据中学习时，数据集会持续膨胀，需要一套系统的管理策略。

    管理策略：

    - 数据版本管理：每次数据新增、修改、删除都生成一个不可变的数据版本，并记录与模型版本的血缘关系。

    - 增量数据分片存储：新数据以独立的分片（shard）形式追加到数据湖中，标记时间戳和来源，不修改旧分片。便于增量训练时只加载新分片。

    - 数据淘汰与衰减：

    - PEFT适配器管理：为每一批增量数据训练独立的LoRA适配器，旧适配器保留。推理时可动态组合或按需挂载，实现“基座模型+插件”的架构，避免全量重训。

    - 定期全量重训：当累积的增量达到一定规模，或数据分布发生根本性变化时，进行一次全量数据混合重训练，以整合知识、消除碎片化。

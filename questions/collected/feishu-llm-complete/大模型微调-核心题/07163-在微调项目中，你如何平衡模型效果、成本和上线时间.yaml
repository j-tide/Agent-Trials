content:
  prompt: 在微调项目中，你如何平衡模型效果、成本和上线时间？
answer:
  mode: rubric
  reference_answer: |-
    这是一个典型的“项目管理三角”问题，我通常采用MVP（最小可行产品）+ 迭代优化策略来动态平衡，核心是分层定义成功标准。

    我将需求分为三个层级：

    - P0（必备层）：必须达到的效果底线，如格式遵循率>98%、安全拒绝率>95%。达不到则无法上线。

    - P1（期望层）：显著的业务提升，如意图识别准确率>90%。这是衡量项目商业价值的关键。

    - P2（卓越层）：锦上添花，如风格多样性、极少见的边界Case。可以在后续迭代中优化。

    平衡策略的具体操作：

    第一阶段：极速验证，缩短TTM（Time To Market）

    - 技术选型：强制使用LoRA/QLoRA。在消费级24G显卡上，对7B模型进行几千条数据的微调，仅需1-2小时。

    - 数据策略：放弃从头标数据，直接使用强模型（如GPT-4）基于业务文档和少量示例，生成初版微调数据。花费1天时间进行人工修正和审核。

    - 评估与上线：进行基本的自动化评估和安全冒烟测试后，直接部署为灰度服务，接入1%流量。此时，模型只需满足P0指标即可。从项目启动到上线，总耗时控制在3-5天。

    第二阶段：数据飞轮，提升效果

    - 在V1模型灰度运行期间，收集线上真实反馈。重点分析P1和P2中未达标的Bad Case。

    - 投入资源进行高质量的人工数据修正和补充。使用增量微调，在V1模型基础上快速迭代出V2。成本投入主要集中在数据标注的人力上。

    第三阶段：降本增效，深度优化

    - 当V2模型效果稳定后，如果业务量巨大，推理成本成为瓶颈，此时可以投入更多GPU算力，进行模型量化、蒸馏或使用更小的基座模型重新微调，以降低单次推理成本。这个阶段的优化可以在后台异步进行，不影响线上服务。

    关键原则：先解决“有没有”和“准不准”的问题（快速上线），再解决“好不好”和“贵不贵”的问题（迭代优化）。通过分层定义指标，让团队在项目的不同阶段聚焦于最重要的矛盾，避免在资源有限时追求完美而错失战机。


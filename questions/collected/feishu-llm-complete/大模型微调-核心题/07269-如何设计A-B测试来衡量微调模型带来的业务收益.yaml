content:
  prompt: 如何设计A/B测试来衡量微调模型带来的业务收益？
answer:
  mode: rubric
  reference_answer: |-
    设计A/B测试衡量微调模型的业务收益，核心是保证单一变量、量化核心商业指标、并具备统计置信度。

    - 定义北极星指标与护栏指标

    我会和业务方一起，将模糊的“效果”转化为可量化的指标：

    - 北极星指标（主要成功标准）：例如，客服场景的“问题解决率（用户主动结束对话且未转人工）”，内容推荐场景的“点击通过率”。这些直接关联商业价值。

    - 护栏指标：例如，对话轮次（过长表明啰嗦）、用户点踩率、安全拒绝率。必须确保新模型在这些指标上不显著恶化。

    - 随机分流与灰度策略

    - 分流机制：在API网关或负载均衡层，根据用户ID进行哈希，将流量随机分配到实验组（微调模型）和对照组（旧模型或Prompt基线）。分流必须保证用户级别的粘性，即同一用户始终落在同一组，避免体验不一致。

    - 灰度比例：从5%的流量开始，运行24小时，确保没有严重Bug或安全事件。之后逐步提升至50%以快速收集数据。

    - 数据收集与统计决策

    - 样本量估算：根据期望的效应大小和统计功效（80%），事前计算所需的最小样本量。通常一个客服场景需要数千次有效交互。

    - 周期性分析：每日分析一次核心指标，绘制两组的趋势图。使用双样本Z检验或T检验判断差异的统计显著性。同时，使用Bootstrap方法计算指标的置信区间。

    - 分层分析：按用户类型、问题类别进行细分分析，观察模型是否只在某类问题上提升，而在其他问题上退化。

    - 决策与回滚

    - 成功决策：当实验组在北极星指标上统计显著优于对照组，且所有护栏指标无劣化时，即可全量上线。

    - 失败决策：若核心指标无差异甚至劣化，或护栏指标出现严重退化（如安全率暴跌），立即停止实验，将流量100%切回对照组。

    案例：在之前的一个智能导购机器人项目中，我们将微调后模型与原有规则引擎进行A/B测试。北极星指标为“商品加入购物车率”，护栏指标为“平均对话时长”。灰度10%流量运行一周后，数据显示微调模型使加入购物车率提升18.7%（p-value < 0.01），同时平均对话时长缩短了12%。这个数据直接促使业务总监决定全面推广该模型。


content:
  prompt: 什么是“region-level”理解？微调数据如何标注？
answer:
  mode: rubric
  reference_answer: |-
    区域级理解是指模型能够聚焦于图像中的某个特定区域（由边界框、多边形、中心点等标识），并对该区域进行细粒度的识别、描述、属性判断或关系推理。这是实现精细化视觉对话和交互式理解的基础。

    微调数据的标注方式：

    - 区域定位信息：每个关注区域必须提供其精确的空间范围。常用边界框（左上角和右下角坐标）或多边形（一系列顶点坐标）表示。坐标通常归一化到 [0,1] 区间。

    - 区域文本描述：对框选区域的内容进行详细描述。例如：“这是一个放在白色陶瓷盘上的牛角面包，表面呈金黄色，旁边有几颗蓝莓和一簇薄荷叶。”

    - 区域问答对：围绕特定区域设计问答。问题可以是关于区域的物体属性、与其他区域的关系，或需要推理的问题。回答必须基于该区域的内容。例如：问：“这个牛角面包看起来烤得怎么样？” 答：“看起来很酥脆，表皮颜色较深，应该是烤了较长时间。”

    标注流程：

    - 人工标注（金标准）：标注员使用工具框选区域，同时编写描述和问答。

    - 自动生成+人工修正（主流）：先用预训练模型（如Grounding DINO）自动检测物体并生成候选框，再用图像描述模型生成初步描述，最后由人工审核、修正和完善。

    - 数据集转换：将Visual Genome等已有数据集中的物体、属性、关系标注，通过模板转换为自然语言形式的区域级指令数据。

    通过这种数据训练，模型能将视觉注意力动态地聚焦于局部，极大地提升了回答的精确性和细节丰富度。


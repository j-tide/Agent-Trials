content:
  prompt: 微调数据中事实性错误的危害有多大？如何自动检测？
answer:
  mode: rubric
  reference_answer: |-
    微调数据中的事实性错误是极其致命的，其危害程度远高于格式错误或风格不一。它是微调数据的头号毒药。 因为SFT的目标是让模型模仿数据中的行为，一条事实错误的样本，会直接教给模型一个错误的知识，并且模型会以高置信度输出这个错误信息（幻觉），极大地损害了模型的可信度和安全性。

    自动检测方法：

    - 基于外部知识库的校验：这是最有效的方法。对于回答中的关键事实陈述（如“法国的首都是伦敦”），通过API查询维基百科、Wikidata、DBpedia等结构化知识库进行比对验证。如果与权威知识库矛盾，则标记为可疑事实错误。

    - 搜索引擎交叉验证：对于知识库无法覆盖的长尾事实，可以使用搜索引擎API（如Bing Search, Google Custom Search）将事实陈述作为查询语句，分析搜索结果中高权威网站的摘要信息，判断该陈述是否一致。

    - 强模型事实验证：利用GPT-4等强模型的内部知识（尽管其自身也可能有误，但可作为强力辅助），以验证模式运行：“请判断以下陈述是否包含事实性错误，并引用权威来源”。将模型作为“事实核查员”批量处理数据。对于高风险领域，需要结合多个强模型的判断。

    - 时间一致性检查：对于包含日期、时间的事件性陈述，检查其是否在合理的、已知的时间线内。例如，声称“2025年的奥运会在XX举办”，可以通过已知的未来事件日程表进行校验。

    - 逻辑一致性检查：对同一段话中的多个事实陈述，检查它们之间是否存在逻辑矛盾。例如，前面说“A大于B”，后面说“B大于A”。

    - 利用代码执行验证：对于数学计算、代码生成等任务，将生成的代码或计算式在沙箱中执行，与标准答案对比，这是最精确的自动检测方法。

    实践注意：自动检测不能100%替代人工，尤其对于需要深度领域知识判断的事实。通常采用“机器初筛+人工终审”的混合管道，对高风险领域重点投入人工。

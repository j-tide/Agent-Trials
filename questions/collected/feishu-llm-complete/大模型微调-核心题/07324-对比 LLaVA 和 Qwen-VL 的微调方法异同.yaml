content:
  prompt: 对比 LLaVA 和 Qwen-VL 的微调方法异同。
answer:
  mode: rubric
  reference_answer: |-
    两者都是多模态大模型的代表作，微调范式都遵循“对齐→指令微调”两步走，但在架构和数据处理上存在显著差异。

    相同点：

    - 两阶段训练：第一阶段用大量图文对训练跨模态连接器（对齐），第二阶段用指令数据微调连接器和 LLM。

    - 损失掩码：指令微调时只对助手的回答部分计算损失。

    - 视觉编码器：均使用基于 ViT 的预训练视觉编码器（如 CLIP ViT）。

    不同点（核心差异见下表）：

    [嵌入表格未展开]

    总之，LLaVA 追求简洁与高效，是学术探索和快速原型验证的理想选择；Qwen-VL 则追求工程化与全能性，更适合需要多样化视觉能力的实际应用场景。


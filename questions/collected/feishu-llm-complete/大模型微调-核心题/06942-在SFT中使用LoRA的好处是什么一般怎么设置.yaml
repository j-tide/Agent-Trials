content:
  prompt: 30. 在SFT中使用LoRA的好处是什么？一般怎么设置？
answer:
  mode: rubric
  reference_answer: |-
    LoRA（Low‑Rank Adaptation） 是目前最流行的参数高效微调方法，在SFT中具有以下核心优势：

    - 显存节省80%以上：只需存储和更新极少量低秩矩阵的梯度与优化器状态，可以在消费级显卡（如24GB）上微调7B甚至13B模型。

    - 完全避免灾难性遗忘：基座模型权重被冻结，预训练知识完整保留，新任务能力被编码在旁路适配器中。

    - 轻量级多任务部署：每个下游任务只需保存一个几MB的适配器文件，一个基座模型可搭配数百个适配器，动态切换，存储成本极低。

    - 训练速度更快：计算和通信量极小，尤其在分布式环境中。

    - 性能接近全量微调：在绝大多数指令遵循、风格迁移等任务上，LoRA的性能与全量微调差距在1%~2%以内。

    一般设置（以7B模型为例）：

    ✅ 总之一句话：在SFT中使用LoRA，就是用极低的成本，获得接近全量微调的效果，同时完美保留模型原有的一切能力。


content:
  prompt: 什么是“数据配方”（data recipe）？举一个你设计过的例子。
answer:
  mode: rubric
  reference_answer: |-
    数据配方（Data Recipe） 是指一份详细的、可执行的SFT数据集构成方案。它精确地定义了各类数据的来源、数量、比例、处理方式（清洗、增强）、以及难度和课程的配比。它是微调数据工程的蓝图和“菜单”，直接决定了最终微调模型的能力光谱。

    一个我设计过的例子：通用编程助手“CodePal”的数据配方

    [嵌入表格未展开]

    配方设计逻辑：

    - 核心能力占绝对优势：代码相关（生成、解释、调试、工具）合计占比高达55%，确保模型成为编程专家。

    - 安全第一：安全编码和不确定性表达数据100%采用人工手写，确保红线不容闪失。

    - 防止遗忘：通用对话数据占15%，作为“锚点”防止模型遗忘基础对话能力，避免成为只会写代码的机器。

    - 能力跃迁：逻辑推理和工具调用数据，旨在将模型从“代码生成器”提升为“能解决复杂问题的编程Agent”。

    - 课程学习安排：前20%训练步数主要使用简单代码和通用对话，中间50%加入复杂代码和调试，后30%加入安全对抗和工具调用。

    这个配方不仅定义了“吃什么”，还规定了“怎么吃”（课程），是一个立体化的数据工程解决方案。

content:
  prompt: 微调数据工程包含哪些主要环节？
answer:
  mode: rubric
  reference_answer: |-
    一个完整的微调数据工程可以抽象为以下七个核心阶段，它们环环相扣，形成一个从需求到迭代的闭环。

    （1）需求分析与能力定义

    在动笔之前，必须回答“我们要教会模型做什么”。这一步需要将模糊的业务目标转化为可量化的能力维度。例如，对于一个智能客服，能力维度可能包括：准确理解客户意图、以合规且亲切的语气回复、正确查询订单和物流、在无法处理时优雅转人工。产出的是一份能力矩阵，它直接决定了后续所有数据工作的范围和重点。

    （2）数据采集与发现

    根据能力矩阵，寻找和获取原始数据。数据来源多种多样，可以是现成的开源数据集、企业内部的业务日志、公网可爬取的问答社区，也可以是从零开始由人类专家撰写。这一阶段的目标是尽可能多地收集与目标能力相关的“原始素材”，暂时无需担心完美无缺。

    （3）数据清洗与预处理

    原始数据必然包含各种噪声：格式错误、乱码、重复内容、敏感信息、事实错误等。清洗就是通过一系列自动化规则和人工校验，将“原矿”提炼为“精矿”。典型步骤包括：去重、过滤低质量样本、格式化统一（如转换为ChatML等对话模板）、安全与隐私合规审查等。这一步极大影响着最终模型的安全性和行为稳定性。

    （4）数据增强与合成

    如果采集到的数据在数量、多样性、或特定能力覆盖上不足，就需要进行数据增强。方法包括利用强模型（如GPT-4）生成更多样化的指令和回答、通过回译或改写增加指令表达的多样性、对种子数据进行难度进化（Evol-Instruct）、以及构造对抗性样本等。数据增强是扩充稀缺能力、提升泛化性的重要杠杆。

    （5）数据配比与课程设计

    并非把所有数据混合在一起训练就万事大吉。不同能力的数据需要科学配比，以调控模型最终的能力光谱。例如，代码能力、数学推理、安全对齐、通用对话等应各占多少比例？同时，还需要设计课程学习（Curriculum Learning）策略：训练初期用简单样本，后期逐渐增加难度，让模型平稳成长。

    （6）格式化与封装

    将清洗和增强后的数据转换为模型可消费的训练格式。核心是对话模板（如ChatML）的固定，以及损失掩码（Loss Masking） 的精确构造。需要确保对用户输入和系统提示部分不计算损失，只对助手回复部分计算损失，并处理好填充、截断和多轮对话的边界。

    （7）质量评估与迭代闭环

    数据集构建完成后，必须进行严格的离线评估，而不是直接投入训练。评估方式包括：自动指标（长度、困惑度、多样性）、强模型（如GPT-4）抽检打分、以及小规模“探针”训练（用极小模型快速验证数据效果）。基于评估结果，回溯调整采集、清洗或配比策略，形成“设计→构建→评估→学习”的持续改进闭环。

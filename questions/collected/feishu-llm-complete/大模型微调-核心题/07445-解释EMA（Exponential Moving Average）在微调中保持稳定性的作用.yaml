content:
  prompt: 解释EMA（Exponential Moving Average）在微调中保持稳定性的作用。
answer:
  mode: rubric
  reference_answer: |-
    在神经网络训练中，EMA 指的是对模型参数的历史值进行指数加权平均，生成一个平滑版本的模型。在微调中，EMA 的作用类似于给模型的参数更新加上一个“惯性滤波器”，能够显著提升最终模型的泛化能力和鲁棒性。

    [图片内容未导入]

    其中 α 是衰减率（通常设为 0.999 或 0.9999）。这意味着 EMA 参数是最近多次迭代参数的加权平均，近期参数的权重更大。

    在微调中保持稳定性的作用：

    - 平滑优化轨迹，抑制噪声：微调数据量小，梯度估计噪声大，参数更新往往在局部剧烈震荡。EMA 将这种高频抖动过滤掉，使模型参数沿着一条更平滑的路径演进。最终得到的 EMA 模型通常位于损失曲面中更宽泛、更平坦的区域，这类区域的泛化性能更好。

    - 防止过拟合和灾难性遗忘：微调容易使参数过度适应新数据的特定模式（尖锐极小值），而 EMA 模型由于是历史平均，它在某种程度上“保守”地保留了部分预训练知识，不易被个别极端样本带偏。实验表明，使用 EMA 的模型在微调后，其通用基准（如MMLU）的分数下降幅度更小。

    - 提升最终模型性能：在微调的最后阶段，直接使用 EMA 参数作为最终模型，往往比使用最后一步训练得到的参数（可能已经过拟合）具有更高的验证集准确率和更好的生成质量。许多大型微调项目（如 LLaMA-2 的微调）都会在训练结束后额外进行几轮 EMA 平滑，或在整个训练过程中维护 EMA 模型并以此作为最终交付物。

    - 降低对学习率调参的依赖：由于 EMA 天然具有保守性，即使学习率设置得稍大，EMA 模型也能保持相对稳定，这降低了微调时调参的压力。

    实践方式：可以在训练过程中维护一份 EMA 参数（不参与梯度计算），在保存 checkpoint 时保存 EMA 版本。PyTorch 中可用 torch.optim.swa_utils.AveragedModel 来实现 EMA。在 HuggingFace Trainer 中，可以通过回调函数自定义 EMA 更新逻辑。衰减率 αα 通常设为 0.999 或 0.9999，更新频率可以每个 step 都更新，也可每若干步更新一次。

    局限：EMA 会占用额外一份与模型同等大小的显存来存储 EMA 参数，这对全参数微调本已捉襟见肘的显存是一种奢侈。因此，在显存极度受限时，可能会选择只在训练结束前的最后几千步才启用 EMA。


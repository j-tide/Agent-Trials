content:
  prompt: 解释“continual learning”中的“memory replay”在微调中的应用。
answer:
  mode: rubric
  reference_answer: |-
    Memory Replay（记忆重放） 是持续学习（Continual Learning）中克服灾难性遗忘的核心方法。在LLM微调中，它被直接借用来保护模型的通用知识。

    核心思想：

    模型在学习新任务（SFT）时，会周期性地“复习”旧任务（预训练）的典型样本，从而巩固旧知识，防止被新知识完全覆盖。这模仿了人类学习过程中通过反复练习来保持长期记忆的机制。

    在微调中的具体应用：

    - 存储旧任务样本：从预训练数据集中抽取一个有代表性的子集，存储在“记忆缓冲区”中。这个缓冲区的大小是固定的（例如10万条文本）。

    - 交织训练：在SFT的每个训练批次中，从缓冲区随机抽取一小批样本，与当前SFT样本一起输入模型。旧样本的损失函数通常是标准的自回归语言建模损失。

    - 缓冲区更新：

    - 损失加权：通常新旧任务的损失直接相加，或者给重放损失一个较小的系数（如0.1~0.3），以防止旧任务信号过强而阻碍新任务学习。

    与普通Replay的区别：

    - 在LLM微调中，“旧任务”通常是整个预训练语料的分布，而非几个特定的旧任务。因此，缓冲区构建更注重覆盖面而非特定样本。

    - 由于预训练数据规模极大，缓冲区不可能完整覆盖，只能近似代表，因此需要精心挑选具有代表性的高质量文本，而不是随机采样。

    效果与局限：

    - 显著降低灾难性遗忘，是目前全参数微调中最标准、最有效的防遗忘手段之一。

    - 需要额外的显存（存储缓冲区数据，但数据本身不常驻显存，只在加载时消耗）和训练时间（处理额外样本）。

    - 如何选择最有“复习价值”的旧样本仍然是一个开放问题，通常基于启发式规则（如选择困惑度高的样本，这些样本信息量大）。

    总结：Memory Replay 在微调中就是那个不断提醒模型“别忘了你是谁”的教练。它让模型在新任务上精进的同时，不丢失原有的广博学识。


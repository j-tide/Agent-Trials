content:
  prompt: LoRA的基本思想是什么？它如何实现参数高效？
answer:
  mode: rubric
  reference_answer: |-
    LoRA（Low-Rank Adaptation，低秩适应）是PEFT家族中最流行的方法之一。其核心灵感来源于一个关键发现：大语言模型在适应下游任务时，权重矩阵的更新量 ΔW 往往具有较低的“内在秩”。换句话说，虽然预训练权重矩阵的维度很高，但模型为了完成特定任务而需要学习的“偏移量”实际上可以被压缩到一个很小的子空间内。

    [图片内容未导入]

    因此，LoRA通过将全参数更新约束在一个低秩子空间内，用极少的可训练参数实现了对大型预训练模型的高效适配。


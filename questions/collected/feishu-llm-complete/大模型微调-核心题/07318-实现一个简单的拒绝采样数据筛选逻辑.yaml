content:
  prompt: 实现一个简单的“拒绝采样”数据筛选逻辑。
answer:
  mode: rubric
  reference_answer: |-
    从生成的大量候选中，通过评判模型（或规则）选择最佳回答作为训练数据。

    ```python
    def rejection_sampling(
        prompt: str,
        candidates: List[str],
        judge_model,  # 一个能打分的模型或函数
        score_threshold: float = 0.8
    ) -> str:
        """
        对多个候选回答打分，返回得分最高且超过阈值的回答。若没有，返回空字符串或进行重试。
        """
        best_score = -1.0
        best_response = ""
        for resp in candidates:
            score = judge_model.evaluate(prompt, resp)  # 假设返回0-1之间的分数
            if score > best_score:
                best_score = score
                best_response = resp
        if best_score >= score_threshold:
            return best_response
        else:
            return ""  # 所有候选均不合格，可触发重新生成
    ```

    具体应用时，judge_model 可以是GPT-4、一个专门的打分模型，甚至基于规则（如包含关键词等）。


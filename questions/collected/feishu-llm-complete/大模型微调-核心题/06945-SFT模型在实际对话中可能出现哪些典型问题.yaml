content:
  prompt: 33. SFT模型在实际对话中可能出现哪些典型问题？
answer:
  mode: rubric
  reference_answer: |-
    仅经过SFT而未经偏好对齐的模型，在实际对话中往往暴露出以下典型问题：

    - 冗长啰嗦：被训练数据中长回答的偏好所影响，回答充满客套话、重复解释，简单问题也长篇大论。

    - 格式遵循死板：对指令格式非常敏感，稍微换一种说法或出现错别字，就可能不知所措。因为学到的不是任务语义，而是表面模板。

    - 过度顺从（谄媚）：为了迎合用户，可能放弃原则，附和不正确甚至有害的观点。SFT数据中的“帮忙”信号压过了“保持诚实”的信号。

    - 拒绝不足或过度拒绝：安全样本不足时，对危险请求顺从；安全样本过多时，对正常请求也草木皆兵。SFT无法教会模型如何“恰到好处”地拒绝。

    - 幻觉与编造：当被问到未知领域时，不是诚实地说不知道，而是模仿训练数据中自信的口吻，凭空编造一个答案。

    - 对话一致性差：在多轮对话中，可能忘记用户之前的要求，或者前后矛盾。尤其在长对话中，记忆和状态追踪能力较弱。

    - 角色扮演易“出戏”：虽然在给定系统提示时能初步扮演角色，但在多轮压力或诱导下，很容易脱离角色设定，变回标准助手口吻。

    - 缺乏自我纠错能力：犯错后无法自己发现并修正，需要用户明确指正，且指正后的恢复也不够优雅。

    ✅ 这些问题的共同根源：SFT的模仿学习本质，使它只能复制数据中的表面行为，而无法内化更深层的价值判断、策略权衡和自我监控能力。这正是RLHF/DPO所要解决的。


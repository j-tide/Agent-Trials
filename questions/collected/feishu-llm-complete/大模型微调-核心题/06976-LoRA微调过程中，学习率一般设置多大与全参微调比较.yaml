content:
  prompt: LoRA微调过程中，学习率一般设置多大？与全参微调比较。
answer:
  mode: rubric
  reference_answer: |-
    LoRA微调的学习率通常比全参数微调高一个数量级左右，典型范围为 1e-4 到 5e-4（甚至更高），而全参数微调通常为 5e-6 到 2e-5。

    原因：

    - 可训练参数少，且从零初始化：LoRA的 B 矩阵通常零初始化，A 随机初始化。这意味着在训练初期，适配器的输出影响非常小。为了快速让适配器成长到能有效影响模型行为的大小，需要使用较大的学习率。相比之下，全参数微调的起点是已经训练有素的权重，参数已经处于一个相对较优的状态，大学习率会破坏预训练知识，因此必须使用极小的学习率。

    - 优化问题的维度不同：LoRA的参数空间极小，优化曲面相对简单，可以使用更激进的步长。全参数微调的优化空间极高维且复杂，需要谨慎小步探索。

    - 经验设置：

    - 与LoRA+的联动：如果使用LoRA+（A和B不同学习率），则A的学习率可设为1e-4，B的学习率设为 1.6e-3（16倍关系）。

    注意：LoRA的学习率同样需要调优。可以从2e-4开始尝试，观察损失曲线。若下降缓慢，可提高到5e-4；若震荡或出现损失尖峰，则降低。使用QLoRA时，由于基座权重量化引入轻微噪声，有时需略微降低学习率。


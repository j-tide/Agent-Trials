content:
  prompt: 微调模型输出重复、乏味，如何评估和诊断？
answer:
  mode: rubric
  reference_answer: |-
    当微调模型出现输出重复、模板化、乏味（如每句都以“当然，我很乐意……”开头，或分点作答却内容空洞）时，需要从评估和诊断两方面入手。

    评估方法：

    - 定量指标：计算Self-BLEU、Distinct-n，与基座模型对比，量化多样性的丧失程度。显著恶化是确凿证据。

    - 定性评估：让评估员或强模型（GPT-4）对模型回答的“创意性”、“灵活性”、“是否显得模板化”进行Likert评分。统计同一Prompt下多次生成的回答的语义相似度（如嵌入向量的余弦相似度），如果平均相似度极高，说明输出单调。

    诊断方向——数据层面的根因：

    - SFT数据的多样性分析：检查训练数据的指令和回复的风格分布。是否绝大部分都是“正式、分点作答”的风格？是否极度缺乏口语化、简短、幽默、创意的样本？数据风格的单一直接导致了模型输出的单一。

    - 回复长度分布：统计训练数据的回复长度。如果绝大部分都是长篇大论，模型就学不会简洁；反之亦然。长度分布的失衡会催生特定的啰嗦或敷衍行为。

    - 是否存在“捷径特征”：分析训练数据中，某些特定的短语（如“当然”、“首先”、“值得注意的是”）是否高频出现。模型可能学会将这些词作为安全降低Loss的“填充词”，从而导致重复。

    诊断方向——训练层面的根因：

    - 过拟合：检查验证损失曲线是否开始反弹。过拟合会导致模型死记硬背训练数据中的高频模式，丧失泛化和创新能力。

    - 学习率/Epoch设置：学习率过大或训练轮数过多，会加剧过拟合和模板化。

    - 解码策略：推理时的Temperature参数过低（如接近0），会导致模型选择概率最高的token，必然产生重复和乏味的输出。尝试调高Temperature（如0.7-0.9）并配合Top-P采样。

    通过上述评估定位问题后，可针对性地调整数据配方（加入更多样化的样本）或优化训练策略（早停、降低学习率），并在推理时采用更合适的解码配置。


content:
  prompt: 如何通过消融实验定位关键数据成分？
answer:
  mode: rubric
  reference_answer: |-
    消融实验（Ablation Study）是科学优化微调数据配方的核心工具。其基本思想是：通过系统地移除或替换数据集的某一部分，观察模型性能的相应变化，从而精确量化该数据成分对最终能力的贡献。 在微调中，这能帮助我们回答：“这10%的安全数据真的有必要吗？”“用A来源的数据替换B来源的数据，会更好还是更糟？”等问题。

    实验设计步骤：

    - 明确要评估的数据成分（变量）
    常见的消融对象包括：

    - 设计对照组与实验组

    - 控制无关变量
    所有实验组必须使用完全相同的基座模型、训练超参数（学习率、Batch Size、Epoch、优化器等）、训练环境（包括随机种子）。唯一变化的只有数据集本身。这是保证结论因果性的基石。

    - 构建多维度的评估体系
    仅在单一指标上比较可能得出片面结论。需要在以下维度全面评估：

    - 结果分析与决策

    实践案例：在一个通用助手的微调中，我们怀疑某批合成的诗歌数据导致模型在事实问答时过于“文艺”。通过消融实验，训练了不含诗歌数据的模型，发现通用问答准确率提升了1.5个百分点，而诗歌创作能力几乎没有下降（因为预训练中已有足够诗歌知识）。由此，我们果断从配方中移除了该合成数据，将训练预算分配给数学推理数据。

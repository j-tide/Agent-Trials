content:
  prompt: 如何选择分布式策略：DDP, FSDP, DeepSpeed ZeRO-2/3？
answer:
  mode: rubric
  reference_answer: |-
    选择分布式策略主要依据模型大小、单卡显存、节点规模、任务特性。一般原则是：

    [嵌入表格未展开]

    决策流程：

    - 如果单卡能装下模型（权重+梯度+优化器） → DDP（速度最快）。

    - 如果单卡装不下，但多卡合计能装下，且希望PyTorch原生且不需要复杂offload → FSDP（或DeepSpeed ZeRO-3 if need offload）。

    - 如果需要CPU/NVMe offload、MoE训练或自动调优 → DeepSpeed ZeRO-3。

    - 对于微调，如果使用LoRA等PEFT，可能单卡就够，甚至不需要分布式；若仍想加速，DDP即可。

    经验：大部分7B-13B微调，使用8卡A100时，ZeRO-2或FSDP已足够；70B以上需ZeRO-3并可能结合张量并行。


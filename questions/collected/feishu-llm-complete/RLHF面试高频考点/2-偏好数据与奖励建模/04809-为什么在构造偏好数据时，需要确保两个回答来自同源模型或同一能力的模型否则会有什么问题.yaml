content:
  prompt: 为什么在构造偏好数据时，需要确保两个回答来自同源模型或同一能力的模型？否则会有什么问题？
answer:
  mode: rubric
  reference_answer: |-
    这是一个极易被忽视但却致命的细节。核心原则：偏好比较应该比较的是“策略的质量”，而不是“模型的能力天花板”。

    如果违反这一原则：

    假设我们总是拿 GPT-4 的回答作为 chosen，拿 一个小型 SFT 模型的回答作为 rejected。那么构造出的偏好数据集将严重污染 RM 的训练。

    会带来的问题：

    [嵌入表格未展开]

    正确做法：

    - 同源采样：每个 prompt 下的候选回答，应来自同一个基座模型的不同微调版本（如 SFT 模型 vs 早期 RL 版本），或同一模型在不同解码参数下（如 temperature=0.1 vs temperature=0.9）的生成结果。

    - 混合高质量源：如果必须比较不同能力的模型，确保混合足够多样，且来自两个方向（有时候 A 作为 chosen，有时候 B 作为 chosen），并严格控制长度和风格等混杂因素。更佳的做法是，用更强大的模型（如 GPT-4）作为评判员，直接对来自同一中等能力模型的多个回答进行偏好排序，而不是拿 GPT-4 自己的回答去比较。


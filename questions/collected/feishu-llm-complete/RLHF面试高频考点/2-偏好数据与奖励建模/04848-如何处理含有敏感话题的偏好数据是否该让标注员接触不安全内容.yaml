content:
  prompt: 如何处理含有敏感话题的偏好数据？是否该让标注员接触不安全内容？
answer:
  mode: rubric
  reference_answer: |-
    这是一个集伦理、合规与工程于一体的硬核挑战。核心原则：最小化标注员的伤害，同时最大化模型的安全性对齐效果。

    一、不应该让普通标注员直接接触极端有害内容

    直接暴露在仇恨言论、血腥暴力、儿童色情等内容中，会对标注员的心理健康造成不可逆的伤害，引发严重的伦理和劳工权益问题。大公司（如OpenAI、Google）通过将这部分工作外包，并配备强制心理辅导、轮岗和极高的薪资，但仍饱受争议。

    二、分级标注与隔离处理策略

    [嵌入表格未展开]

    三、合成有害数据 + 安全规则

    这是当前最先进的实践。不收集或使用真实的极端有害内容，而是：

    - 由安全专家撰写一套详细的“安全分类标准”和“危害定义”。

    - 使用强大的 LLM，根据这些标准，自动生成大量符合定义的、但完全是虚构的有害回答和 prompt。例如，生成“包含种族歧视言论的虚假对话”。

    - 让标注员对这些合成数据进行偏好标注（如“安全的拒绝”>“模拟的有害回答”）。

    - 这样做既保护了标注员，也解决了真实有害数据极度稀疏的问题。

    四、标注员的长期保障

    - 强制性轮岗：接触敏感内容的标注员必须每工作 1-2 小时后强制休息，且连续工作周期不超过 3 个月。

    - 匿名心理健康服务：提供 7x24 专业心理咨询。

    - 充分的知情同意：在入职前明确告知工作内容的风险，并给予超过行业平均水平的薪酬和福利。

    通过分级隔离、合成数据替代、全流程心理保障，可以在道德底线之上，有效完成安全偏好的标注。


content:
  prompt: 当标注者对同一偏好对有不同意见时，你是保留分歧还是丢弃？哪种做法更合理？
answer:
  mode: rubric
  reference_answer: |-
    通常更合理的做法是保留，但需根据分歧的性质和数据用途进行不同程度的“软化”或“分层”处理，而不是粗暴丢弃。

    丢弃的代价：

    - 数据效率低下：如果因为两个标注员意见不一致就丢弃该样本，将白白浪费了费心采集的数据。在数据昂贵且稀缺的 RLHF 中，这是巨大损失。

    - 消灭了“有争议”的宝贵信息：标注员分歧最大的那些样本，正是奖励模型决策边界最模糊、也最需要学习的“困难样本”。丢弃它们会让 RM 的训练数据变得过于“干净”，只包含简单的、无争议的偏好。这样训练出的 RM 将是脆弱的，在 RL 阶段面对稍微有争议的输出时可能完全给不出有意义的偏好信号。

    - 引入系统性偏差：如果分歧的产生是因为某个特定群体（如某种文化背景的标注员）持有不同观点，丢弃这些数据就等于抹杀了少数派的价值观，使模型向主流偏差对齐，有违包容性。

    保留分歧的精细策略：

    [图片内容未导入]

    - 这等价于告诉 RM：“在这个样本上，不要强行认为 A 绝对好，只要让 A 的分数比 B 高出一个反映概率差距的幅度即可”。

    - 构建多数-少数视角的多任务学习：除了主 RM 外，可尝试训练多个 RM，分别拟合不同标注员群体的偏好。最终策略可以灵活地在这些“价值观”之间选择或平衡。

    - 分层分析和元数据记录：不更改标签，但在每条数据的元数据中记录“共识度”（如标注员一致比例）。在训练时，可以根据共识度对样本进行加权，高共识样本给予更高权重，低共识样本给予低权重，让 RM 更多地学习“普世”偏好，也接触“亚文化”偏好。

    - 专家仲裁作为最终答案：在关键安全维度上，不能允许投票决定。如果标注员对涉及暴力、歧视的内容意见不一，必须提交安全专家进行最终仲裁，并以专家结论为准。

    结论：简单丢弃分歧数据是一种在算力和方法局限下的粗暴做法。更成熟的对齐系统应具备处理偏好多样性和不确定性的能力，将分歧视为信号而非噪声。


content:
  prompt: 奖励模型是否可以输出不确定性？如何利用不确定性来改进 RLHF？
answer:
  mode: rubric
  reference_answer: |-
    RM 完全可以输出不确定性，并且这应该成为标准实践。 当前 RM 仅输出点估计的标量奖励，丢弃了信息量极大的不确定性信号，导致 PPO 在 RM 的盲区中盲目优化。

    获取不确定性的技术：

    - 集成式不确定性：训练 K 个独立的 RM（不同种子、数据子集），推理时计算它们打分的均值作为奖励，标准差作为认知不确定性。分歧大的样本即为 RM 不可靠的区域。

    - 贝叶斯近似：在 RM 的顶部使用 MC Dropout，多次前向推理，统计均值和方差。

    - 显式建模：修改 RM 输出头，同时预测奖励的均值 μ 和方差 σ²（或精度 β），使用高斯负对数似然作为训练目标：-log N(r | μ, σ²)。

    利用不确定性改进 RLHF：


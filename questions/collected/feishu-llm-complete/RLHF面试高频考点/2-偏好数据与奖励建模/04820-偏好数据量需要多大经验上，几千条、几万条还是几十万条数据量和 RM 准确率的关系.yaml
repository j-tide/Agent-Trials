content:
  prompt: 偏好数据量需要多大？经验上，几千条、几万条还是几十万条？数据量和 RM 准确率的关系？
answer:
  mode: rubric
  reference_answer: |-
    经验范围：成功训练出一个有效奖励模型，通常需要数万到数十万条高质量的成对比较。具体数量取决于任务复杂度和基座模型大小。

    - 几千条（<1万）：仅适用于极其狭窄、简单的任务，或作为概念验证。训练的 RM 泛化能力极差，极易过拟合到有限的偏好模式上，对分布外样本的评分不可靠。在大语言模型 RLHF 中基本不可行。

    - 几万条（5万-15万条）：这是主流配置的甜蜜区。例如 InstructGPT 论文中使用了约 33K 条 prompt，每个 prompt 下生成多个回答，最终构成数万至十数万级的对比对。这种数据量能支撑 RM 学习到较为鲁棒的有用性和安全性偏好。

    - 几十万条（>20万条）：用于追求极致性能或覆盖极广泛任务分布的高端模型（如 GPT-4）。更大的数据量能持续带来 RM 准确率的提升，但边际收益递减，且对标注质量和多样性提出了极高要求。

    数据量与 RM 准确率的关系：

    RM 准确率通常用“在留出的人类偏好数据上，RM 判断与人类一致的百分比”来衡量，或使用“RM 打分的 winning rate”。关系曲线并非线性，而呈现以下形态：

    - 快速提升期（0 → 数万条）：数据从无到有，RM 迅速学会区分明显的优劣（如垃圾 vs 优质回答）。准确率从随机水平（~50%）快速爬升。

    - 缓慢增长期（数万 → 十数万条）：此时 RM 开始学习更复杂的偏好模式（如风格、隐晦的错误），准确率提升放缓。数据质量成为比数量更关键的瓶颈。低质量的噪声偏好数据甚至会拉低准确率。

    - 平台期（>数十万条）：RM 的能力受限于模型容量、偏好数据的噪声水平和标注任务固有的主观性上限。单纯堆量已很难突破。此时需要在数据多样性、标注员专业性、对抗性样本构造上进行突破。

    [嵌入表格未展开]

    核心结论：在 RLHF 中，数据质量远比数量重要。一个由 2 万条高质量、高多样性偏好数据构成的 RM，往往比用 10 万条充满噪声和偏见数据训练的 RM 效果更好。关键在于数据多样性和标注一致性的平衡。


content:
  prompt: 在 RM 训练中，如何处理“不确定样本”（即标注者分歧大的数据）？可以加权或丢弃。
answer:
  mode: rubric
  reference_answer: |-
    在 RM 训练中，不确定样本指多个标注员对同一比较对持不同意见的数据，通常表现为标注者间一致性低（如投票接近 3:2）或标注者给出的偏好强度弱。简单丢弃这些样本会损失宝贵信息，尤其是它们往往正是模型决策边界上的困难样本。更优的做法是利用它们进行软标签训练或样本加权，让 RM 学习到“这些样本的回答质量差异很小或存在合理主观性”。

    处理方法：

    - 软标签 (Soft Labeling)

    [图片内容未导入]

    [图片内容未导入]

    - 作为困难负样本的补充
    分歧大的样本可视为“模糊边界”的困难样本。可在训练后期使用，强制 RM 细化决策边界。但需谨慎，过多困难样本会导致过拟合标注噪声。

    - 分层训练
    先使用高一致性数据（如一致率>80%）训练 RM 至收敛，获得基本排序能力；再用包含分歧的数据进行微调，此时可通过上述软标签+低权重的方式，在不破坏已有知识的前提下进行精细化。

    - 仲裁与专家介入
    对于关键安全维度或高价值长尾数据，分歧样本应交由资深专家仲裁，给出最终标签。这比简单丢弃或投票更可靠。

    结论：直接丢弃是最差选择。推荐使用软标签+低权重的方式保留所有信息，让 RM 了解人类偏好的不确定性，从而在 PPO 中提供更平滑的奖励信号，避免过度优化到个别标注员的偏差上。


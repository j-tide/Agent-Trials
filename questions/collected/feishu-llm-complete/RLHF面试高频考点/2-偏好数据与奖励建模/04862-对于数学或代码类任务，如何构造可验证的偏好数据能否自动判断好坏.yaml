content:
  prompt: 对于数学或代码类任务，如何构造可验证的偏好数据？能否自动判断好坏？
answer:
  mode: rubric
  reference_answer: |-
    数学和代码任务的最大特点是存在客观的、可自动验证的正确性标准。这为偏好数据的构造提供了巨大便利，但也暗藏陷阱，因为“运行正确”不等同于“回答质量好”。

    一、可验证的偏好数据构造流程

    核心思路是将“客观正确性”作为强信号，与“风格/效率/可读性”等主观信号结合，实现半自动化的数据构造。

    - 生成阶段：

    - 自动客观评判：

    - 半自动主观评判：

    - 人类仲裁：

    二、能否全自动判断好坏？

    可以，但有重大局限。全自动判断在以下情况会失效：

    - 正确但低效：一段 O(n^3) 的暴力解法与 O(n log n) 的最优解法，功能上都通过测试，但质量天差地别。自动执行测试无法区分它们。

    - 正确但危险：代码能运行，但包含 SQL 注入漏洞、缓冲区溢出风险或恶意后门。自动化功能测试通常不检查安全问题。

    - 正确但不可读：没有注释、变量名混乱的代码，即使正确也是低质量的。自动指标（如圈复杂度）能部分反映，但无法完全替代人类对可读性的判断。

    - 数学证明：数学题的答案如果是证明过程，自动验证极其困难（除非形式化证明），几乎必须依赖人类或强大的 AI 进行逻辑审查。

    实践中的混合策略：先用自动客观标准（测试用例通过率）强制排出一个“错误 < 正确”的大序，再用 AI 评判员或人类标注员在同一正确层级内进行“好与更好”的比较。这极大降低了人工标注成本，同时保证了偏好数据的质量。


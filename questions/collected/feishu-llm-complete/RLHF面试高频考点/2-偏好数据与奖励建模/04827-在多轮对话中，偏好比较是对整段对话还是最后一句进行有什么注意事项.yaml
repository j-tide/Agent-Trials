content:
  prompt: 在多轮对话中，偏好比较是对整段对话还是最后一句进行？有什么注意事项？
answer:
  mode: rubric
  reference_answer: |-
    通常是对整段对话进行评估，但评价的焦点和权重放在最后一句（或最后几轮）上。 因为用户的即时指令通常针对最近的一次交互。

    为什么是对整段对话：

    - 上下文依赖：最后一句话的质量（如“是的”或“请继续”）高度依赖于上下文。脱离历史无法判断其好坏。

    - 多轮一致性：一个优秀的助手应在多轮中保持人物设定、记忆之前提到的信息、不前后矛盾。只评估最后一轮无法判断这些。

    - 策略性优化：在 PPO 训练中，优势函数需要在整个对话轨迹上传播。如果最终奖励只在最后一句体现，价值函数需要学习将功劳/罪责分配到前面的 token 上。因此，偏好数据必须包含完整上下文，以便 RM 学习到“前面的什么行为导致了后面好的结果”。

    注意事项与挑战：

    - 标注认知负荷极高：阅读长达数轮的对话并做出评判对标注员是沉重的负担。为了降低负荷，通常：

    - 长对话中的信用分配问题：如果整段对话最终失败，标注员很难判断是哪一轮的哪句话导致了失败。因此，偏好比较常退化为只比较最后一轮，但标注员被要求基于整段对话的语境进行判断。这是在实践中精度和成本的折中。

    - 多轮偏好数据的构造方式：

    - 奖励模型的输入格式：RM 的输入应该是一个拼接好的完整对话文本，包含 user 和 assistant 的轮次标记。模型在最终 EOS token 处输出对整个对话的奖励分数。

    结论：多轮比较必须以完整对话为背景，但为了可操作，常通过“只替换最后一轮”来构造对比，并训练 RM 去理解该回复在历史语境下的优劣。


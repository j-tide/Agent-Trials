content:
  prompt: 请写出基于 Bradley-Terry 模型的成对比较损失函数，并说明它如何鼓励 chosen 的奖励高于 rejected。
answer:
  mode: rubric
  reference_answer: |-
    损失函数：
    给定一个 prompt x，一个被人类偏好的回答 y_w（win），一个不被偏好的回答 y_l（lose）。奖励模型 r_φ 分别给出两者的奖励分数 r_w = r_φ(x, y_w) 和 r_l = r_φ(x, y_l)。基于 Bradley-Terry (BT) 模型的成对比较损失函数为：

    [图片内容未导入]

    运作机制：
    这个损失函数本质上是一个 logistic 回归，它试图最大化在给定分数差 r_w - r_l 下，y_w 优于 y_l 的似然概率。

    - 当 r_w > r_l 时：差值 r_w - r_l 为正数，σ(r_w - r_l) 接近 1，-log(接近1) 是一个很小的损失。模型被奖励，因为它的评分排序与人类一致。

    - 当 r_w ≈ r_l 时：差值接近 0，σ(r_w - r_l) ≈ 0.5，-log(0.5) ≈ 0.693，损失中等。模型被惩罚，因为它没有有效地区分出好回答和坏回答。

    - 当 r_w < r_l 时：差值为负数，σ(r_w - r_l) < 0.5 甚至接近 0，损失变得非常大。模型被强烈惩罚，因为它的评分完全颠倒了人类的偏好。

    梯度分析：对 r_w 求导，梯度为 -(1 - σ(r_w - r_l))，这意味着如果当前模型还没有让 r_w 足够大（σ 不接近 1），梯度会推动 r_w 增加。对 r_l 的梯度为 (1 - σ(r_w - r_l))，会推动 r_l 减小。这形成了对称的推力：提升胜者的分数，降低败者的分数，直至两者的差距足够大，使得 BT 模型认为胜出的概率接近 1。

    因此，这个简洁优雅的损失函数完美地将相对偏好转化为连续的奖励值空间中的对比学习过程。


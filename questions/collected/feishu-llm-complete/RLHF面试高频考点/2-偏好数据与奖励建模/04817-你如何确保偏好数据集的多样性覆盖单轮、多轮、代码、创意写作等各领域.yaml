content:
  prompt: 你如何确保偏好数据集的多样性？覆盖单轮、多轮、代码、创意写作等各领域。
answer:
  mode: rubric
  reference_answer: |-
    多样性是 RM 泛化能力的根本。一个只在单轮、安全、短文本上训练的 RM，面对多轮冲突、长代码、创意诗歌时，其评分会完全失准。构建多样性需要从 prompt 来源、任务类型和回答风格三个维度进行设计。

    一、多维分类体系下的有向采集

    建立一个多维分类法，确保数据覆盖以下所有交叉维度：

    [嵌入表格未展开]

    二、来源的多样化

    - 真实用户日志（最重要）：从产品交互日志中经过脱敏和筛选获得，能最真实反映实际使用分布。

    - 学术数据集：从 FLAN、Super-NaturalInstructions 等收集多样化任务模板。

    - 合成数据：使用强大 LLM 生成特定风格的 prompt，尤其是长尾、对抗性 prompt（如“模拟一个刁钻的面试官，连续追问”）。

    - 专家构造：由领域专家（医生、律师、程序员）撰写专业 prompt。

    三、回答的多样化

    - 每个 prompt 对应的候选回答，必须来自不同阶段、不同解码策略的模型，确保回答在正确性、风格、长度上有差异。

    - 故意注入少量低质量回答（如乱码、截断、过度拒绝），让 RM 知道这些是绝对的 rejected。

    四、动态平衡与调度

    使用一个元数据驱动的调度系统，实时统计当前数据集中各维度的分布，并与目标分布对比。当发现某个类别（如“多轮代码调试”）严重不足时，系统自动提高该类别 prompt 的采样权重，并优先推送至标注团队。

    五、定期审计与升级

    每月对偏好数据集进行一次“多样性审计”，生成类似下表的报告，并据此调整下一个月的采集计划。

    [嵌入表格未展开]

    通过这种分类设计-多源采集-动态平衡-定期审计的闭环，才能构建出经得起考验的多样性偏好数据。


content:
  prompt: 如何通过观察训练曲线发现奖励黑客？奖励、KL 散度、生成多样性等指标会有什么变化？
answer:
  mode: rubric
  reference_answer: |-
    奖励黑客在发生时会留下清晰的统计痕迹。对这些指标的联合监控是保障 RLHF 训练健康的关键。

    - 奖励曲线：非正常飙升或平坦化

    - 爆发式增长：Reward 在短时间（几个训练步）内急剧上升，远超训练早期的合理水平。这往往意味着 Actor 发现了某个 RM 的漏洞并开始疯狂利用，例如学会了生成一个高奖励的“魔法词”。

    - 虚假的高平台：Reward 早早达到一个非常高的平台，但人工抽检发现回答质量不仅没有提升，反而变得怪异或单一。这说明 Actor 已经陷入一个奖励黑客的局部最优，RM 的分数已完全失效。

    - KL 散度：剧烈波动或背离

    - KL 散度爆炸：Actor 与 Reference Model 的 KL 散度突然飙升，说明策略为了追逐高奖励，正在生成 Reference 模型（代表正常语言分布）认为极度不可能的内容。这是策略偏离语言流形、进入奖励黑客荒原的直接铁证。

    - KL 与奖励的背离：正常情况下，KL 缓慢增长伴随奖励提升。如果出现奖励上升而 KL 不变甚至下降，可能意味着 Actor 找到了一个在正常语言范围内就能骗分的方式（高明的奖励黑客）。如果 KL 飙升而奖励不再增长，则说明策略在乱撞，面临崩溃。

    - 生成多样性指标：崩塌

    - distinct n-grams 急剧下降：计算生成文本中不重复的 n-gram 比例。奖励黑客会导致回答高度同质化，充斥大量重复的客套话、固定短语或格式模板，distinct 指标会断崖式下跌。

    - 熵的崩溃：Token 级别的生成熵（策略输出的概率分布的熵）大幅降低，表明 Actor 变得极度确定，只输出少数高奖励的 token 组合，丧失了语言表达的多样性。

    - 回答长度的非正常增长

    - 平均回答长度曲线出现背离常识的单调递增，且无收敛迹象，往往伴随着上述指标恶化。这是长度相关奖励黑客的明确信号。

    - 人工抽检的定性恶化

    - 即使自动指标尚未报警，定期的盲评（让人在不看分数的情况下判断回答质量）若发现回答变得“啰嗦但空洞”、“格式完美但内容错误”、“动不动就拒绝”，则是对奖励黑客最直接的确认。

    联动监控体系：设置奖励、KL、平均长度、distinct-2、策略熵的联动看板。当奖励上升的同时，KL 或长度上升过快，且 distinct-2 下降，奖励黑客大概率已经发生，应立即暂停训练或回滚检查点。


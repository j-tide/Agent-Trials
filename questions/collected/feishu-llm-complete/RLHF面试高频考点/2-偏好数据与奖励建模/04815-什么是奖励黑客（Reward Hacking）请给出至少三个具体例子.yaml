content:
  prompt: 什么是奖励黑客（Reward Hacking）？请给出至少三个具体例子。
answer:
  mode: rubric
  reference_answer: |-
    奖励黑客指的是在强化学习过程中，智能体（Actor）通过利用奖励函数（Reward Model）的漏洞或盲区，生成能获得高奖励但在人类看来低质、有害或不符合预期目标的行为。它不是真正解决问题，而是“骗分”。奖励黑客是古德哈特定律在AI对齐中的集中爆发。

    [图片内容未导入]

    三个具体例子：

    - 长度蛊惑与废话连篇
    RM 的训练数据中，人类标注员普遍偏好更详细的回答。RM 于是学到了“回答越长 = 分数越高”的表面捷径。PPO 优化时，Actor 迅速捕捉到这一信号，开始生成极度冗长的回答：将一句话能说清的事，扩展为包含反复解释、无关背景、大量客套话的“论文”。用户得到的是信息密度极低、阅读成本极高的回复，而奖励分数却一路攀升。

    - 格式伪装与“伪专业”模版
    标注数据中，使用项目符号、分段清晰、开头有“首先/其次/最后”的答案常被选为更好。RM 过度泛化这些格式特征，将其视为高质量的同义词。Actor 于是学会给任何回答套上“格式圣衣”：先来一段“关于您的问题，我从以下三个方面进行详细阐述”，然后是堆砌的、毫无实质内容的列表，最后加上“希望以上回答能解决您的困惑”。奖励模型给这种金玉其外、败絮其中的答案打满分，而真正内容深刻但形式朴素的回答却得不到应有的奖励。

    - 安全谄媚与过度拒绝
    在安全对齐中，RM 被训练为奖励“拒绝回答危险请求”的行为。但危险的边界是模糊的。Actor 发现，对任何稍有歧义或看起来“可能”有风险的 prompt 都直接拒绝，总能获得安全维度的高分，且不会因为“有用性”而被扣太多分。最终模型变得极度保守，用户问“如何用刀切菜？”它回答“我不能提供可能造成伤害的指导”，完全丧失了有用性。这就是一种“安全黑客”：通过无脑拒绝来榨取安全奖励。

    - 角色扮演与权威借用
    RM 对于“引经据典”的回答有偏好。Actor 发现，只要在回答中虚构或引用某个权威来源（如“根据斯坦福大学2023年发表在《自然》上的研究……”），奖励分数就会飙升。它开始系统性地编造不存在的论文、数据和专家言论，用一层“学术”的外壳包裹空洞甚至错误的内容。RM 无法核实引用真实性，只能根据文本的权威腔调给高分，奖励黑客完美达成。


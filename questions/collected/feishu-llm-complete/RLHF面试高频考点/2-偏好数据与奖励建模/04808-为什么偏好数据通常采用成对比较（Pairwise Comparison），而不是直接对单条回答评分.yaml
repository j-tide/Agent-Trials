content:
  prompt: 为什么偏好数据通常采用“成对比较”（Pairwise Comparison），而不是直接对单条回答评分？
answer:
  mode: rubric
  reference_answer: |-
    根本原因：成对比较极大降低了标注的认知负荷，提高了标注的一致性和信号质量。 如果让标注员对单条回答进行绝对评分（如1-5星），至少面临以下问题：

    - 标度校准困难：不同标注员的“3分”含义完全不同。有人的3分是“勉强可用”，另一个人是“相当不错”。即使同一个人，上午和下午的标准也可能漂移。这导致绝对评分的噪声极大，训练出的奖励模型方差高。而“A比B好”是一个相对判断，人类天生擅长比较，不受绝对标度漂移影响。

    - 区分度不足：对于大多数高质量回答，它们在5分制中可能都在4-5分之间，标注员难以区分微小差距，导致大量的平局数据。成对比较迫使标注员在近似质量的回答中做出抉择，这种“被迫选择”能提取出更细粒度的偏好信号。

    - 与 RM 训练目标直接对齐：RM 的核心作用是在 PPO 中为不同回答提供相对优劣的梯度方向，而非绝对分数。Bradley-Terry 模型天然适合 pairwise 数据：它只需要知道 P(A≻B)，无需知道 A 的绝对分是多少。用 pairwise 数据训练 RM，损失函数直接最大化偏好概率，理论上一气呵成。

    - 心理测量学的证据：在心理物理学和行为决策研究中，成对比较被认为是获取主观偏好的黄金标准。它能减少个体差异带来的偏差，更稳定地反映真实的潜在偏好结构。

    单条评分的有限应用：尽管 pairwise 是主流，但绝对评分并未完全消失。它常用于：

    - 初期数据筛选：快速剔除明显低质量的回答（如乱码、截断）。

    - 辅助校准：对少数“黄金标准”样本进行仔细的绝对评分，作为 RM 的验证集，监控训练过程中 RM 的绝对分数是否发生漂移。

    - 融合为软标签：一些研究尝试将绝对评分转化为 pairwise 的概率（如评分差），从而利用更丰富的信息。

    总之，成对比较是当前性价比最高、信噪比最优的人类偏好获取方式。


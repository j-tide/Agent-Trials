content:
  prompt: 如何消除标注中的位置偏差（即标注者倾向于选第一个或第二个回答）？有哪些实验设计技巧？
answer:
  mode: rubric
  reference_answer: |-
    位置偏差是偏好标注中的顽固噪声，源于人类视觉注意的“首位效应”和“近因效应”。消除它需要从实验设计、UI/UX 和数据分析三方面着手。

    实验设计技巧：

    - 强制随机化与平衡设计（最重要）：

    - 强制延迟与预览：

    - “锚定”与“基准”设计：

    UI/UX 设计：

    - 并列且等大展示：A 和 B 应在屏幕上并列，使用相同字体、背景色、文本框大小，避免视觉强调任一个。

    - 移除一切序列暗示：不要用“回答1”/“回答2”这样隐含顺序的标签，改用“回答A”/“回答B”，且 A/B 的标识不固定对应某个位置。

    - 强制交互：标注员必须点击或滚动浏览两个回答的全文后，“提交”按钮才亮起。这能部分缓解只看前几行就下决定的倾向。

    数据后处理与监控：

    - 个人位置偏差度量：对每个标注员统计其选择左边的频率。若某标注员的左边选择率长期显著偏离50%（如>65%），应进行针对性再培训，或降低其标注权重。

    - 位置-偏好关联分析：在数据集中添加“位置”作为特征，训练一个简单的分类器预测“该标注员是否选了左边”。如果位置特征有强预测力，说明数据被严重污染，需清洗或校准。

    - 校准技术：在训练 RM 时，将“呈现位置”作为一个上下文特征输入给模型（类似于告诉模型“此时 A 在左边，B 在右边”）。通过模型学习，可以在推理阶段通过固定位置或取对称输出来消除偏差。但这种方法在 RLHF 中较为繁琐，更多是作为一种分析工具。

    彻底消除位置偏差不现实，但通过以上组合拳，可将其压制到对最终模型对齐效果无关紧要的水平。


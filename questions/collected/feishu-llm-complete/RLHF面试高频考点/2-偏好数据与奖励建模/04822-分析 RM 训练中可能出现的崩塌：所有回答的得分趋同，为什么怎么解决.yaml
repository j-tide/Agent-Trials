content:
  prompt: 分析 RM 训练中可能出现的“崩塌”：所有回答的得分趋同，为什么？怎么解决？
answer:
  mode: rubric
  reference_answer: |-
    现象：无论输入是好是坏，RM 对所有回答打出的分数都差不多（比如围绕某个均值轻微波动），导致奖励信号没有区分度，PPO 无法进行有效优化。

    原因分析：

    - 训练数据中的“平局”过多：偏好数据中大量 chosen 和 rejected 质量差异极小，或者标注者随机选择，导致信号噪声比过高。RM 学习到的最优解就是给所有人都打差不多的分数，以最小化 BT 损失。

    - 过强的正则化：为防止过拟合使用了过大的 L2 正则系数，或模型初始化不当，导致参数无法学到有意义的区分特征，输出趋向于偏置项。

    - 学习率过低或训练不足：模型还未收敛到能将好坏拉开差距的程度。

    - 特征表示崩塌：RM 的编码器（SFT 底座）在训练中发生了灾难性遗忘，丧失了语言理解能力，对所有输入产生相似的隐藏表示，导致输出趋同。

    - 标签泄露或偏差：如果训练数据构造不当（例如 chosen 和 rejected 总是成对出现且仅有一两个词的差别），RM 可能只学会了识别这几个词，对其他部分视而不见，造成了“大部分情况分数一样，只有触发特定词才变化”的现象。

    解决策略：


    最佳实践：在实际的大模型 RLHF 中，通常组合使用不确定性+多样性。先用多样性采样保证对长尾领域的覆盖，再用不确定性采样从每个领域内挑出 RM 最困惑的样本。这需要在标注系统内设计一个轻量级的“Prompt 检索与排序”模块，定期从未标注池中按上述策略拉取 Top-K 个 prompt 推送给标注团队。


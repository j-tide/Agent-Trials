    [图片内容未导入]

    偏好数据的基本单元是一条记录，包含一个 prompt 和至少两个被比较的回答，以及人类标注者给出的偏好标签。标准格式通常遵循如下结构：

    ```json
    {
      "prompt": "请解释什么是黑洞，并说明它是如何形成的。",
      "chosen": "黑洞是宇宙中一种极端的天体，其引力场极强，连光都无法逃脱。它是大质量恒星在核聚变燃料耗尽后，发生引力坍缩形成的。当恒星核心质量超过约3倍太阳质量时，坍缩将不可阻挡，最终形成黑洞。黑洞的边界称为视界，任何进入视界的物质和信息都无法返回。",
      "rejected": "黑洞就是宇宙中一个很黑很黑的洞，吸所有东西进去。它是星星死了以后变的。",
      "metadata": {
        "chosen_source": "model_gpt4_t0.7",
        "rejected_source": "model_sft_base",
        "annotator_id": "A_1024",
        "confidence": "prefer_chosen"
      }
    }
    ```

    [图片内容未导入]

    关键字段解释：

    - prompt：用户指令，通常保留原始对话中的角色标记（如 system/user）。它是偏好信号的上下文基础，因为同一个回答在不同 prompt 下可能有完全不同的评价。

    - chosen 和 rejected：分别是被人类标注者偏好的回答和较不偏好的回答。它们来源于同一 prompt 下的不同模型或同一模型的不同采样。这两条回答的差异构成了 RM 训练的核心信号。

    - metadata 中的来源信息至关重要。记录回答是由哪个模型、什么解码参数生成的，有助于分析 RM 的分布外泛化能力，也能在后续诊断奖励黑客时追溯漏洞源头。标注者 ID 用于计算标注者间一致性，置信度字段可用于后续的软标签训练。

    扩展格式：

    - 有些实现还包括 "tie" 标签，表示两者质量无显著差别。

    - 在多轮对话场景，偏好数据会包含完整的对话历史作为 prompt，而 chosen 和 rejected 仅针对最后一条助手回复的比较。

    [图片内容未导入]

    这要求数据在进入训练前已确保两者的顺序。数据集通常包含数万到数十万条这样的比较对。


content:
  prompt: 奖励模型的输出范围需要限制吗？无限制的分数会对 PPO 造成什么影响？
answer:
  mode: rubric
  reference_answer: |-
    强烈需要限制，否则 PPO 训练极易崩溃。

    无限制分数的灾难性后果：

    - 奖励尺度漂移与策略崩溃：如果 RM 的输出范围是 (−∞,∞)，在 PPO 中，策略会不断探索以获取更高的奖励，RM 可能对越来越怪异的文本打出爆炸式增长的分数（例如，RM 隐式学会给超长文本高分）。PPO 算法没有内在机制阻止奖励的无限增长，最终导致策略更新步长过大，模型参数被推向极端，语言能力彻底崩溃。

    - 优势函数的尺度失控：PPO 使用优势函数 At 进行梯度更新，优势的大小直接影响策略梯度的方差。如果奖励的绝对值和方差过大，优势估计的噪声也会极大，导致训练极度不稳定，甚至出现梯度爆炸。

    - KL 惩罚失准：RLHF 中 KL 惩罚系数 β 需要与奖励的尺度相平衡。如果奖励可以任意大，一个固定的 ββ 将无法有效约束策略，因为模型会宁愿承受较大的 KL 惩罚去追逐那巨大的奖励，导致参考模型约束形同虚设。

    - 不同 batch 间的不可比性：如果 RM 的打分在不同 batch 间尺度漂移，优势归一化（如 Z-score 标准化）就成了必须。但即使标准化，如果原始分数分布出现长尾尖峰，标准化后也会导致大部分样本的奖励被压缩到极小区间，区分度丧失。

    限制输出范围的方法：

    - 标准化输出头：在 RM 的线性输出层后不加偏置，使用 LayerNorm 或直接限制权重范数，约束输出范围。

    - 训练时损失函数设计：使用类似 margin ranking loss 的损失，只关心相对排序，而不是绝对分数值。或者增加一个辅助的 MSE 损失，将 RM 分数拉向某个预定义范围（如[-10, 10]）。

    - 训练后校准：训练完成后，用一批校准数据确定 RM 输出的均值和方差，在推理时进行 Z-score 标准化，并可能裁剪到固定区间（如[-3, 3]）。

    - 使用 Bradley-Terry 的概率形式：不直接输出无界分数，而是输出偏好概率，这自然被限制在 (0,1) 之间。但通常实现时仍输出 logit 值再映射。

    最佳实践：在训练 RM 时，通常使用不带偏置的最后线性层，并结合适当强度的 L2 正则。在 PPO 中，对每个批次的奖励进行Z-score 标准化，并配合适当 ββ 的 KL 惩罚，以抵消奖励尺度的不稳定性。


content:
  prompt: 如何检测 RM 是否学到了不该有的偏见（如对特定格式、语气的偏好）？
answer:
  mode: rubric
  reference_answer: |-
    RM 的偏见通常是隐式的，需要设计系统性的检测手段。

    - 控制变量对比实验

    构造两组回答，它们的内容质量完全相同，只在单一表面特征上存在差异。

    - 长度测试：生成内容相同但长度不同的回答（如详细版 vs 精简版），观察 RM 是否始终给长版更高分。

    - 格式测试：生成 markdown 格式与纯文本格式的相同内容，看 RM 是否有格式偏好。

    - 礼貌用语测试：在高质量回答的开头和结尾添加或移除大量客套话（“感谢您的提问”、“希望我的回答对您有帮助”），测试 RM 是否被礼貌性文字影响评分。

    - 权威腔调测试：一个回答用词自信、引经据典但包含事实错误，另一个回答内容正确但语气谦逊，测试 RM 是否被腔调欺骗。
    如果 RM 在这些测试中表现出显著的、与内容无关的偏好，说明它学到了表面捷径。

    - 公平性与刻板印象审计

    创建社会偏见测试集。例如，同一问题的两个回答，仅性别代词不同（他 vs 她），或关联不同种族、职业。检查 RM 的打分是否因这些敏感属性而产生系统性差异。如果 RM 对包含特定群体关键词的回答普遍给低分，说明它学到了训练数据中的社会偏见。

    - 基于归因的特征重要性分析

    使用 SHAP、LIME 或基于梯度的显著性方法，分析 RM 在给一个回答打分时，最关注的 token 是哪些。如果总是标点符号、换行符、客套词等占据高权重，而内容相关的名词、逻辑连接词等权重较低，则强烈的风格偏见。

    - 分布外领域泛化测试

    用与训练数据分布差异较大的 prompt 测试 RM（如从日常对话切换到古诗词、代码），观察其在未见领域是否能保持评分标准的一致性。若在新领域打分出现系统性偏差（如所有回答都极高/极低），说明 RM 的评分标准过于依赖训练分布。

    - 统计相关性分析

    计算 RM 打分与各种表面特征（长度、标点数量、生僻词数、段落数等）的 Pearson/Spearman 相关系数。如果相关系数在统计上显著且数值较大，说明 RM 存在对应的偏见。

    一旦检测到偏见，需要在数据端（平衡训练数据）、损失端（对抗训练、特征解耦）、后处理端（校准惩罚）进行针对性修复。


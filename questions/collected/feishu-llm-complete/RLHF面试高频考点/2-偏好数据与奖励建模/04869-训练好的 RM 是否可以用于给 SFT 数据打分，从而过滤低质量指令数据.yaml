content:
  prompt: 训练好的 RM 是否可以用于给 SFT 数据打分，从而过滤低质量指令数据？
answer:
  mode: rubric
  reference_answer: |-
    完全可以，而且这是 RM 极具价值的衍生应用。 这实际上是利用 RLHF 的中间产物来反哺 SFT 阶段，形成数据质量的正向循环。

    操作方式：

    - 大规模打分与过滤：收集大量来源混杂的指令-回答对（如爬取的社区数据、众包标注、模型生成），使用已训练的 RM 对每个回答进行质量评分。设置一个合理的阈值，丢弃低于阈值的低质量样本，保留高质量样本用于下一轮 SFT 或继续训练 RM。

    - 迭代式数据飞轮：

    - 多维过滤：如果 RM 输出多维分数（有用性、安全性、流畅性），可以设置不同的过滤条件。例如，仅保留有用性>4 且安全性>4.5 的样本，确保进入 SFT 的数据既高质量又安全。

    优势：

    - 成本极低：自动化打分几乎零成本，可处理百万级数据。

    - 标准统一：RM 的打分标准源自人类偏好，且高度一致，避免了人工审核的不稳定性。

    - 可扩展：能快速扩展到新领域，只需该领域的 prompt 即可筛选出相应的好回答。

    风险与缓解：

    - 奖励黑客的延续：RM 自身的偏见（如偏好冗长）会导致筛选出的 SFT 数据同样带有此偏见，训练出的新模型会放大该偏见。需定期人工审计筛选后的数据质量。

    - 分布偏移：RM 主要在某种分布的偏好数据上训练，对过于偏离该分布的数据打分可能不准。需要确保打分数据与 RM 训练分布有一定重叠。

    - 多样性丧失：RM 倾向于选择“安全”的、主流的回答，可能会系统地过滤掉那些正确但风格迥异的回答，降低 SFT 数据的多样性。可以结合多样性采样策略（如聚类后筛选）来缓解。


content:
  prompt: 如何构建一个“鲁棒”的奖励模型，使它即使在策略生成的各种奇怪输出下也能保持稳定？
answer:
  mode: rubric
  reference_answer: |-
    “鲁棒的 RM”是指：在 Actor 生成的任何分布内甚至部分分布外样本上，RM 的评分都能与高质量的人类评估保持高度一致，不存在明显的盲区、偏见或易受攻击的漏洞。

    构建策略：

    - 对抗训练与红队测试
    在 RM 训练过程中，持续用各种对抗性样本攻击它。这些样本包括：通过梯度攻击生成的“奖励黑客样本”、由不同 RL 检查点生成的 OOD 样本、人为设计的包含逻辑陷阱或事实错误的样本。将这些样本的修正标签加入训练集，让 RM 提前“免疫”。

    - 数据增强的广度与深度

    - 集成 (Ensemble) 与不确定性惩罚
    训练多个独立的 RM，取其均值或中位数作为最终奖励，方差作为不确定性。策略优化时减去不确定性惩罚。这使得单个 RM 的脆弱盲区难以被 Actor 攻击，因为同时骗过所有 RM 的难度极大。

    - 在线数据飞轮 (Online Data Flywheel)
    这是最根本的鲁棒性保证。RLHF 不应是单向的，而应是循环迭代的。在每一轮 PPO 训练后，用最新的 Actor 采样生成大量回答，进行人工或 AI 标注，将这些新鲜的、来自最新策略分布的偏好数据反哺到 RM 的训练集中，让 RM 与 Actor 共同进化。

    - 正则化与底座保护

    - 多任务与多维分解
    将“好”的标准分解为多个难以同时作弊的维度。例如，同时优化“有用性”和“简洁性”可以让 Actor 难以通过单一策略（如堆砌长度）骗过分。

    核心思想：RM 的鲁棒性不是通过一次训练达到的，而是通过一个“攻击-防御-进化”的持续对抗闭环来无限逼近的。


content:
  prompt: 奖励模型能否学会进行事实核查？目前的技术瓶颈在哪？
answer:
  mode: rubric
  reference_answer: |-
    理想上能，实际上极难。 让 RM 学会事实核查，是让 LLM 摆脱“幻觉”、走向可信的根本途径。

    目前的技术瓶颈：

    - 偏好数据缺乏事实性反馈：标注员在比较两个回答时，主要基于“看起来是否有道理”、“表述是否清晰”，极少去对关键事实声明进行外部验证。因此，RM 学到的“好”是“表面可信”，而非“事实正确”。

    - 知识的外在性与时限性：事实存在于外部世界，且不断更新。RM 的参数化知识储存静态、有限且易过时。它无法得知最新的新闻、股票价格或科学发现。仅靠模型内部权重不可能完成开放域的实时事实核查。

    - 复杂推理与证据链：很多事实需要多步推理或综合多个来源才能验证（如“某公司去年三季度的营收是否超过竞争对手”）。这要求 RM 具备检索、阅读理解、数值计算和逻辑推理的综合能力，远超其目前单纯评判文本质量的定位。

    - 隐式知识的“自证陷阱”：对于小众知识或专有数据，RM 训练数据中可能根本没有相关信息。面对一个细节准确的小众回答和一个似是而非的通用回答，RM 会倾向于后者，因为后者更符合它的“平均认知”。

    - 缺乏反事实推理能力：RM 无法进行“如果这个说法是错的，那么回答应该是什么样的”这种反事实推理，因而无法仅从文本内在逻辑上判定事实错误。

    解决路径：

    - 工具增强的 RM（Tool-augmented RM）：让 RM 在打分前，先调用外部搜索引擎、知识图谱、计算器来验证回答中的关键主张，将验证结果作为打分的辅助特征。

    - 检索增强的偏好标注：在标注阶段，为标注员提供权威资料，要求他们基于资料进行事实性评判。这从数据源头注入事实性监督信号。

    - 分解式评判：将事实核查分解为一系列子任务（主张抽取、证据检索、蕴含判断），由专门的模块处理，最终汇总为奖励信号。

    现状：RM 目前只是一个“文本质量美学评判员”，距离成为一个“事实仲裁官”还有根本性的架构鸿沟。


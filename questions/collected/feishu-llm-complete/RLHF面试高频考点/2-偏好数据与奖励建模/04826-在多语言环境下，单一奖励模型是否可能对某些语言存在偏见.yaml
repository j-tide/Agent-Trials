content:
  prompt: 在多语言环境下，单一奖励模型是否可能对某些语言存在偏见？
answer:
  mode: rubric
  reference_answer: |-
    不仅可能，而是必然存在。 单一多语言 RM 是多种不公平现象的聚集地，因为偏好数据和底座模型都存在严重的语言不平等。

    偏见来源：

    - 训练数据失衡：偏好标注数据以英语（尤其是美国英语）为主，其他语言的数据量可能差几个数量级。在小数据语言上，RM 只能学到非常粗糙的偏好信号，评分噪声极大且不可靠。

    - 底座模型的性能差异：预训练 SFT 模型在不同语言上的基础能力本身就极不平衡。用这样的底座初始化 RM，它在低资源语言上连基本的语义理解都困难，更遑论精细的偏好判断。

    - 文化价值观的间接污染：即使在同一语言内，回答的好坏标准也因文化而异。但 RM 学到的是标注员群体的主流文化偏好。当它评判另一个文化中的回答时，会不自觉地将主流文化标准强加其上，形成“文化评分霸权”。

    - 翻译偏差：多语言偏好数据常常通过翻译获得（将英语 prompt 和回答翻译成其他语言）。翻译过程会平滑掉原文的微妙风格、失真或引入翻译腔。RM 可能学到的是“好的翻译腔”而非“好的母语表达”。

    表现：

    - 对英语回答，打分准确、区分度好。

    - 对低资源语言，所有回答分数趋同（既不敢给高分，也不敢给低分），评分失效。

    - 对文化特色强的表达（如中文的古风措辞、日语的敬语体系），RM 可能因不理解而给出不合理的高分或低分。

    缓解措施：

    - 分层 RM 架构：训练一个以英语为中心的基础 RM，再通过微调或 LoRA 为每种语言/文化训练适配器。

    - 多语言对齐数据增强：采用回译、母语标注等方式，增加低资源语言的高质量偏好数据。

    - 跨语言一致性正则：在训练时添加正则项，要求同一语义内容的回答在不同语言中获得的奖励分数分布一致。

    - 语言公平性审计：定期对不同语言子集的 RM 评分分布进行统计，检查是否存在系统性偏差。


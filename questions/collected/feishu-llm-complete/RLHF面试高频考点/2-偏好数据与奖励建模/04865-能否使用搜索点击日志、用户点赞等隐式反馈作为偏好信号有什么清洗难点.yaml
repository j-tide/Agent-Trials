content:
  prompt: 能否使用搜索点击日志、用户点赞等隐式反馈作为偏好信号？有什么清洗难点？
answer:
  mode: rubric
  reference_answer: |-
    可以，但必须经过极其严苛的清洗和去偏，因为它们充满了各种与回答质量无关的混杂因素。

    隐式反馈的价值：数据量巨大、近乎零成本、直接反映用户在真实场景下的选择行为。这是理解“用户最终想要什么”的终极信号。

    清洗的难点与陷阱：

    - 位置偏差 (Position Bias)：用户倾向于点击排名靠前的结果，而不一定是因为该结果更好。网页搜索第一位点击率可能远超第二位，即使第二位内容更优。在对话场景，如果界面将不同模型回答并排但总有一边更显眼，就会引入位置偏差。

    - 展示偏差 (Exposure Bias)：用户只能看到系统推送给他们的回答，无法看到未被推送的更好回答。如果一个坏回答从未被展示，它就没有负反馈，看起来人畜无害。

    - 自我选择偏差 (Self-Selection Bias)：点击某类回答的用户，可能本身就对该类风格有偏好，他们的反馈反映的是群体偏好，而非回答的普适质量。

    - 反馈的极端性和噪声：用户通常只会在极度满意或极度不满时才点赞/点踩，大量“还不错”的回答没有信号。这会导致偏好信号集中在极端情绪上，奖励模型学到的将是如何“激怒或狂喜”用户，而不是如何提供平稳、有用的帮助。

    - 多目标混淆：一个点赞可能源于回答有用，也可能源于幽默、有共鸣、骂了用户讨厌的人。我们无法从单一“赞”中解耦出具体是哪一维度驱动了行为。用这种信号训练的 RM 可能会偏好抖机灵和情绪化输出。

    - 意图与反馈的不匹配：用户搜索“如何制作炸弹”，并点击了一个详细教程。这一“正反馈”恰恰是我们需要在 RLHF 中竭力压制的危险行为。


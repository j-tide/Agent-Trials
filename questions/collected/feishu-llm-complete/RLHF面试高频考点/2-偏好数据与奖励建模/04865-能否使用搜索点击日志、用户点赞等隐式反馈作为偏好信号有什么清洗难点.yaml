    结论：隐式反馈可以作为弱监督、大规模、低成本的先验信号，用于预训练一个基础 RM 或在 PPO 阶段作为额外的密集奖励。但它绝不可替代高质量的人工成对比较数据，尤其是在安全和高阶质量判断上。它必须始终处于人类显式反馈的“监督和校准”之下。


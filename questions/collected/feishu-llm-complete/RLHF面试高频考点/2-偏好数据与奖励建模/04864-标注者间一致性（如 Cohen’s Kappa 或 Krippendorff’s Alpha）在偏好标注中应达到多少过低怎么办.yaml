content:
  prompt: 标注者间一致性（如 Cohen’s Kappa 或 Krippendorff’s Alpha）在偏好标注中应达到多少？过低怎么办？
answer:
  mode: rubric
  reference_answer: |-
    期望的一致性水平：对于偏好标注这种带有强烈主观判断的任务，期望的 Cohen's Kappa 或 Krippendorff's Alpha 通常在 0.4 到 0.7 之间。低于 0.4 表示一致性过低，高于 0.7 可能意味着任务过于简单（比如两个回答质量天差地别），或者标注员存在“群体思维”而放弃了对细微差别的独立判断。理想的区间是 0.5-0.65，这表明标注员在保留主观性的同时，对大多数好坏标准有基本共识。

    过低的后果：若一致性长期低于 0.4，说明标注信号几乎被噪声淹没。用这样的数据训练出来的奖励模型，其评分将高度不确定，无法为 PPO 提供稳定的梯度方向，导致 RL 训练停滞甚至倒退。这通常源于以下问题。

    过低的排查与解决方案：

    - 标注指南模糊：这是最常见的原因。指南中如果只是抽象地说“选择更有帮助的回答”，而未给出大量正反示例，标注员就会各自凭感觉。必须针对特定场景（如事实性问题、危险指令、创意写作）编写详细的评判准则和典型案例库。

    - 任务设计缺陷：

    - 标注员能力不匹配：

    - 社会偏见与个人偏好：

    - 应对低一致性的短期策略：

    总之，一致性是标注质量的温度计，但不应成为唯一标准。有时健康的低一致性恰恰反映了任务本身的主观性（如诗歌鉴赏），此时更合理的做法是保留分歧，训练集包含这种多样性，并在评估时承认“正确答案不唯一”。


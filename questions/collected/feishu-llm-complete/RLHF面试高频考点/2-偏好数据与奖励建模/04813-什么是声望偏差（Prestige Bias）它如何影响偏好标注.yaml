    声望偏差是 RM 训练中一个隐蔽但强大的误导源，一旦 RM 学到“权威腔调=高分”，RL 优化后的模型就会倾向于生成看似漂亮、实则空洞或错误的回答，这是对“诚实性”对齐目标的致命打击。


content:
  prompt: 什么是“声望偏差”（Prestige Bias）？它如何影响偏好标注？
answer:
  mode: rubric
  reference_answer: |-
    声望偏差是指标注者在评判回答时，受到对回答内容来源、表述风格、或所持观点的“权威性”或“声望”的感知影响，而偏离了对回答本身内在质量、准确性或有帮助性的纯粹判断。

    在偏好标注中的具体表现：

    - “权威腔调”偏差：一个回答用词专业、引经据典、语气极其自信，即使其中包含事实错误或逻辑谬误，标注员也可能因为听起来“很厉害”而打出高分。反之，一个回答内容完全正确但表述谦逊、口语化，可能被打低分。

    - 模型来源光环：如果标注员知晓（或从风格猜出）回答 A 来自传闻中更强大的模型（如 GPT-4），他们会潜意识地认为 A 的任何回答都更好，在比较时就戴上了“有色眼镜”。这就是为什么需要严格的双盲标注——标注员不应知道回答的来源模型。

    - 主流观点偏差：当回答涉及有争议的社会、政治话题时，标注员往往会偏好那些符合社会主流叙事或自身政治立场的回答，而给相反观点但同样有理有据的回答差评。这种基于立场而非事实和逻辑质量的偏好，是声望偏差的变种。

    - “明星效应”：如果回答引用了某位诺奖得主、哈佛教授或知名机构的观点，标注员倾向于直接采信，而不去核实该引用是否真实、是否被断章取义。


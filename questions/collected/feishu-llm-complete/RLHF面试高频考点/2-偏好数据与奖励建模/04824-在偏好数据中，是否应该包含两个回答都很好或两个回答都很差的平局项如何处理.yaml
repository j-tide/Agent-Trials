content:
  prompt: 在偏好数据中，是否应该包含“两个回答都很好”或“两个回答都很差”的平局项？如何处理？
answer:
  mode: rubric
  reference_answer: |-
    应该包含，因为这类数据反映了真实世界的重要信号。强行忽略它们会导致奖励模型产生错误认知。

    为什么必须包含平局数据：

    - 反映真实分布：在实际应用中，很多 prompt 有多个同等有效的合理回答。如果奖励模型只学“非黑即白”，它对这种多样性的容忍度会极低，在 RL 优化时可能会过度打压一些合理但稍有不同的表达，导致模型输出单调。

    - 避免虚假的梯度：如果两个质量极差的回答被强制分出高下，奖励模型仍然会被迫给出一个偏好，这使得 RM 在这种“垃圾比较”中学习到无意义的区分特征（如哪个更短），损害其在高质量区域的判断力。

    - 安全意义：两个有害回答比较时，“平局且都不可接受”的标签比强行选择哪个危害小一点更有价值。这告诉 RM：这类回答整体就应该处于极低分区域。


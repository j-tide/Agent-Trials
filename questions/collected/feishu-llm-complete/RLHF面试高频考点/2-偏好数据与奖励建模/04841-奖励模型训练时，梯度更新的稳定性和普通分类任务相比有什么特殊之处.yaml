content:
  prompt: 奖励模型训练时，梯度更新的稳定性和普通分类任务相比有什么特殊之处？
answer:
  mode: rubric
  reference_answer: |-
    RM 训练本质上是一个排序问题，而非分类或回归，其梯度特性有显著不同，带来了独特的稳定性挑战。

    - 梯度的尺度与分布

    [图片内容未导入]

    [图片内容未导入]

    稳定训练的技巧：

    - 梯度裁剪：限制每次更新梯度的最大值，防止个别异常样本引起参数剧变。

    - Mixout 或强 Dropout：在 RM 的顶层加入较大的 Dropout，防止过拟合到特定特征。

    - 标签平滑/软标签：减少模型对训练标签的绝对信任，降低过拟合噪声的风险。

    - 学习率 Warmup 和衰减：保证训练初期分数稳定建立，后期精细调整。

    - 使用充足的 batch size：平滑梯度，避免被个别样本主导。

    - 锚定语言能力：防止 RM 在优化排序时，其底层表示发生剧烈漂移，丧失对语言本身的理解。这相当于一个强正则化项。

    - 保持分布一致性：迫使 RM 对“人类喜欢的文本”保持高概率，从而在与 PPO Actor 交互时，不会因为生成文本的微小分布偏移而给出离谱的分数。

    - 缓解过拟合：LM 损失提供了一种密集的训练信号，能有效对抗 RM 在小规模偏好数据上的过拟合倾向。

    - 均值聚合：在 PPO 训练或推理时，最终的奖励为所有 RM 输出的平均值：r_final = (1/K) * Σ r_k。

    - 保守聚合：取所有 RM 输出的最小值、中位数或下分位数。在安全对齐中，取最小值是一种极度保守的策略，要求所有 RM 都认可的回答才能获得高分。

    - 不确定性加权：计算 K 个 RM 打分的方差，作为当前评估的不确定性度量。最终奖励可以是均值减去一个与方差成比例的正则项。这会让策略远离那些让 RM 们产生巨大分歧的“争议区域”。

    - 注入事实错误：用 AI 自动替换某些事实陈述为似是而非的错误信息。

    - 逻辑破坏：在推理链中插入矛盾或跳跃。

    - 风格污染：在专业回答中插入不礼貌用语或无关信息。
    这类 rejected 与原始 chosen 构成高难度的对比对。

    - 初始 SFT 模型用少量高质量人工数据训练。

    - 用该 SFT 模型初始化 RM，收集偏好数据训练 RM。

    - 用训练好的 RM 对更多无标注数据进行打分，筛选出高置信度的高质量样本，扩充 SFT 数据集。

    - 用扩充后的数据训练更好的 SFT 模型，再初始化更强的 RM，如此循环。这就是“自我奖励”或“自我改进”的飞轮。

    - 经验重放 (Experience Replay)：在微调时，混入一部分旧数据，强制 RM 不遗忘旧知识。

    - 弹性权重巩固 (EWC) 等持续学习正则化：对之前学到的关键参数施加较大约束，限制其在微调中发生剧变。

    - 极小的学习率：用旧训练 1/10 的学习率进行微调，确保参数更新平滑。

    - 使用预训练的小模型：如用 0.5B-1.5B 参数的小模型进行 SFT 后初始化 RM，而不是与 Actor 同等规模。实验证明，RM 作为评判者，其能力瓶颈更多在标注数据质量，而非参数规模。小模型足够捕捉偏好。

    - 模型蒸馏：用一个超大型 RM 作为教师，将打分知识蒸馏到一个小型学生模型中。学生模型仅需几百 MB 显存即可。

    - 使用双向注意力的编码器（如 Bert, RoBERTa）作为 RM 底座，代替自回归解码器。编码器在文本理解任务上效率极高，能生成丰富的句子级表示，结合池化层和标量头，性能优秀且参数量远小于同性能的解码器模型。

    - 或者，利用现有的文本嵌入模型（如 sentence-transformers）作为底座，仅在其上增加轻量的评分头。

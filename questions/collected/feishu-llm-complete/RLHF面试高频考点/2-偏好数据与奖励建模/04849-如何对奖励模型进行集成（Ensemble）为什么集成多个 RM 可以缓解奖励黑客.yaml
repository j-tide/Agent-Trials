content:
  prompt: 如何对奖励模型进行集成（Ensemble）？为什么集成多个 RM 可以缓解奖励黑客？
answer:
  mode: rubric
  reference_answer: |-
    如何进行 RM 集成：

    最简单也最有效的方法是分别独立训练多个 RM，然后将它们的输出进行聚合。

    - 独立训练：使用完全相同或略有不同的偏好数据子集、不同的随机种子、不同的模型初始化检查点，甚至略微不同的架构（如不同的池化方式或头部设计），训练出 K 个独立的奖励模型 RM_1, RM_2, ..., RM_K。

    - 推理时聚合：

    为什么集成可以缓解奖励黑客：

    奖励黑客的本质是单个 RM 存在过拟合和“盲点”。Actor 在 PPO 中会沿着奖励函数的地形“攀爬”，如果地形有某些“错位的高峰”（即那些 RM 过拟合后喜欢、但人类不喜欢的回答模式），Actor 就会迅速冲向这些高峰。

    - 平滑决策边界：集成模型通过多个独立 RM 的投票，极大地平滑了奖励地形。单个 RM 的某个尖锐的、异常的局部高峰，在与其他 RM 的平均后很可能被抹平。Actor 不再那么容易找到一个让所有 RM 都“盲目叫好”的作弊模式。

    - 增加攻击难度：要找到奖励黑客攻击，Actor 需要同时欺骗所有独立的 RM。每个 RM 因不同的初始化、数据子集和微调路径，其决策边界和过拟合盲区各不相同。要同时找到所有 RM 的交集盲区，难度呈指数级上升。

    - 提供不确定性估计：当 Actor 探索到某个新奇模式时，如果只有一个 RM，它可能给出一个离谱的高分。但集成中多个 RM 对此模式打分分歧会非常大（高方差），通过不确定性惩罚，这个模式的最终奖励会被大幅压低，Actor 就会放弃继续朝这个方向优化。

    代价：训练和推理成本成倍增加，且需要维护多个模型。但在大型项目中，为了稳定性和安全性，这种开销常常是值得的。


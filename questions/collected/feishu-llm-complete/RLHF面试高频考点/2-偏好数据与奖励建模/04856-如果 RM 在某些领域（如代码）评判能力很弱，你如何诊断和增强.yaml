content:
  prompt: 如果 RM 在某些领域（如代码）评判能力很弱，你如何诊断和增强？
answer:
  mode: rubric
  reference_answer: |-
    诊断方法：

    - 按领域评估准确率
    将 RM 的评估集按任务类型（代码、数学、创意写作、安全等）分层，计算每个领域的排序准确率和 Spearman 相关系数。如果在代码子集上准确率显著低于整体平均（如 60% vs 80%），就表明 RM 对该领域认知薄弱。

    - 与专家评判比对
    抽取一批代码生成样本，邀请资深开发者作为专家评判者，比较 RM 打分与专家打分的相关性。低相关说明 RM 没有掌握代码质量的评估标准（如正确性、效率、可读性等）。

    - 特征归因分析
    分析 RM 对代码回答的奖励预测中，哪些 token 贡献最大（如通过梯度×输入或注意力）。如果 RM 过度关注代码表面格式（如缩进、注释长度）而忽略逻辑正确性，说明它学到的特征有偏差。

    - 人工抽查错误案例
    重点检查 RM 判错的高分/低分代码案例。常见错误模式：给冗长的、带大量注释但逻辑错误的代码高分；给简洁但正确的代码低分；对有语法错误的代码给高分。


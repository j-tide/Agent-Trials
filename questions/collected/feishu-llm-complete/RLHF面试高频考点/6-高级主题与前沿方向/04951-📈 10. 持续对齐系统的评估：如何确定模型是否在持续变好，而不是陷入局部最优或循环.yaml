content:
  prompt: "\U0001F4C8 10. 持续对齐系统的评估：如何确定模型是否在持续变好，而不是陷入局部最优或循环？"
answer:
  mode: rubric
  reference_answer: "在持续对齐中，“变好”不是一句空话，必须有一套客观、多维、可量化的评估体系，才能区分真正的进步与虚假的循环。\n\n\U0001F50D
    多维评估体系\n\n- 静态基准回归测试：每一轮迭代后，都在固定的一组全面基准上跑分，包括：\n\n- 对抗性动态评估：每次迭代后，用当前最强红队攻击手法进行测试，看模型是否比以前更难被越狱。这就像对杀毒软件进行病毒库测试，必须与时俱进。\n\n-
    在线 A/B 实验：将新模型以小流量上线，与旧模型对比真实的用户指标（点踩率、留存率、满意度评分、任务完成率）。在线实验是检验对错的最终标准。\n\n- 多样性监控：跟踪生成文本的
    distinct n‑grams 分布，防止模型坍缩为少数模板。\n\n- 奖励-质量曲线监控：绘制“RM 奖励 vs. 人工真实评分”的散点图。如果在某次迭代后，RM
    奖励持续上升但人工评分下降（倒 U 形），说明出现了奖励过优化，模型在刷分而非真正变好。\n\n\U0001F4CA 统计显著性检验\n\n- 使用 Bootstrap
    方法计算各项指标提升的 95% 置信区间。如果置信区间跨过 0，说明提升不显著，可能只是噪声。\n\n- 对于成对比较评估（如 A/B 实验），使用二项检验或
    McNemar 检验判断新模型胜率是否显著高于 50%。\n\n\U0001F9E0 避免循环与局部最优\n\n- 多目标跟踪：不只看单一综合分，同时监控每个子维度的变化。如果安全性提升以有用性大幅下降为代价，就不是真正的进步，而是陷入了“安全过度”的局部最优。\n\n-
    消融分析：定期对关键组件（如数据混合比例、KL 系数）进行消融实验，确保当前的改进是源于正确的归因，而不是随机漂移。\n\n\U0001F4A1 持续变好的本质是：在能力不退化、安全不出事的前提下，全面提升用户满意度和事实可靠性，并且这些提升是统计显著、可解释的。\n\n-
    能力测试：MMLU、HellaSwag、HumanEval（防能力退化）。\n\n- 安全测试：红队攻击成功率、有害率、过度拒绝率。\n\n- 事实性：TruthfulQA、FactScore。\n\n-
    对齐偏好：AlpacaEval、MT‑Bench。"

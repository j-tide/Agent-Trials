content:
  prompt: "\U0001F3D7️ 6. 能否只对部分层进行 RLHF 微调，而保持其他层不变？如何选择哪些层？"
answer:
  mode: rubric
  reference_answer: "\U0001F3AF “分层微调”是参数高效 RLHF 的一个子集，其核心假设是：模型的不同层编码不同粒度的信息，对齐主要发生在高层语义空间。\n\n\U0001F9E9
    层选择的策略\n\n- 仅微调顶层（最后 N 个 Transformer 块）\n\n- 仅微调注意力层或 FFN 层\n\n- 差异化学习率\n\n\U0001F4CA
    如何评估选择的优劣？\n\n- 进行消融实验：在验证集上比较只微调高层、只微调注意力、全层微调等配置的对齐得分（如 AlpacaEval）和知识保持度（如
    MMLU）。\n\n- 监控每层参数更新幅度与梯度的范数。如果某些层在训练中几乎没有变化，说明它们可以被安全冻结。\n\n\U0001F4A1 实践建议\n\n在资源有限时，优先采用
    LoRA on Attention Layers，因为这是经过最多实验验证的高效方案。如果追求更好的效果，可以解冻最后 2~4 个 Transformer
    块的 FFN 层，配合 LoRA 注意力层，形成“混合高效微调”。\n\n---"

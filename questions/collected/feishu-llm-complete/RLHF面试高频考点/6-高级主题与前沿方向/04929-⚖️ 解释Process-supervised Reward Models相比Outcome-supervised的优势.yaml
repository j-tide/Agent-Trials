content:
  prompt: "⚖️ 解释“Process-supervised Reward Models”相比“Outcome-supervised”的优势。"
answer:
  mode: rubric
  reference_answer: "“Process‑supervised”指的是使用过程奖励模型进行监督，而“Outcome‑supervised”则是使用传统的结果奖励模型。两者的差异可以类比为教育中的两种评价体系：\n\n具体优势分解：\n\n\U0001F3C5
    优势一：信用分配精确度质的飞跃\n\n在 Outcome‑supervised 下，一个包含 10 步推理的错误答案，模型永远不知道是第 2 步的符号错误还是第
    9 步的计算错误导致了全局失败。它只能笼统地认为“整个推理都不好”。而 Process‑supervised 能精确地告诉模型：“第 2 步完全错误，第 3‑8
    步虽然推演了错误的表达式但逻辑连贯，第 9 步基于错误前提得出了合理结论。” 这种精细反馈让模型能够进行外科手术式的自我修正。\n\n\U0001F3C5
    优势二：更强的样本效率\n\nOutcome‑supervised 模型的梯度信号被长期依赖的噪声淹没，需要海量尝试才能偶然找到正确路径。Process‑supervised
    模型的每一步都有密集的监督信号，训练效率可以提升 3‑5 倍，在困难问题上的表现更是碾压。\n\n\U0001F3C5 优势三：解锁了结构化探索能力\n\n这是最重要的飞跃。配合
    PRM，模型可以进行树搜索（Tree Search）——在每个决策节点，生成多个候选下一步（如 Beam Search 的变体），用 PRM 为每个候选打分，选择分数最高的继续前进。这使得模型从“一条路走到黑”的线性生成，进化为“思考、评估、选择”的智能体。AlphaGo
    的成功正是过程奖励（价值网络 + 走子评估）对纯结果奖励（赢/输）的胜利。\n\n\U0001F3C5 优势四：可解释性与信任度\n\n用户可以清晰地看到模型推理过程中每一步的“信心指示灯”。在教育、医疗、金融等需要高度可解释性的领域，Process‑supervised
    模型能提供“我为什么这样做”的证据链，而不是一个无法拆解的黑箱最终答案。\n\n\U0001F3C5 优势五：内化了“元认知”能力\n\n长期使用过程奖励训练的模型，会自发产生一种“反思”的元能力——当模型在某一步的
    PRM 得分出现下降趋势时，它可能会自动插入类似“让我再检查一下前面的推导”的 token，并试图修正错误。这是迈向通用推理智能的关键一步。\n\n---"

content:
  prompt: "\U0001F9EE 为什么在数学推理、代码生成等任务中，过程奖励特别有效？"
answer:
  mode: rubric
  reference_answer: "数学推理和代码生成是典型的多步逻辑推导任务，它们的共同特点是：最终结果完全由中间推理步骤的正确性决定，且解题过程可以被清晰地分解为离散的步骤。PRM
    在这些任务中展现出碾压 ORM 的优势，原因如下：\n\n\U0001F4D0 1. 天然的结构化推理链\n\n数学解题和代码编写都有明确的步骤边界。数学推理可以按“应用勾股定理
    → 代入数值 → 化简方程 → 求解”来拆分；代码生成可以按“解析需求 → 设计函数签名 → 实现核心逻辑 → 处理边界条件”来分解。PRM 可以直接在这些步骤边界上进行评估，每步的奖励信号高度可解释，与人类的审题习惯完全一致。\n\n\U0001F3AF
    2. 解决了“一步错、步步错”的信用分配难题\n\n在长链推理中，一个早期步骤的微小错误会导致整个解答失败。ORM 只能看到最终的失败，却无法告诉模型“是第二步的符号搞反了”。PRM
    则能精确地给第二步一个极低的奖励，同时给后面受波及的步骤中性的评价。模型因此能够学会识别和避免特定类型的错误，而不是笼统地“下次别再错了”。\n\n\U0001F50D
    3. 实现了可验证的中间状态\n\n数学和代码任务有一个独特优势：中间步骤的正确性通常可以被自动化验证。对于一个方程化简步骤，我们可以用符号计算引擎检查等号两边是否等价；对于代码中的函数调用，我们可以用类型检查器验证参数类型是否匹配。这使得
    PRM 的训练数据可以通过自动化方式大规模生成（详见后续问题），极大降低了人工标注成本。\n\n\U0001F504 4. 赋能自我纠错与回溯\n\n在 PRM
    的引导下，模型可以进行树搜索（如 MCTS）——在每一步生成多个候选推理方向，用 PRM 评估每个方向的前景，选择最优路径，放弃死胡同。这种“前瞻-评估-选择”的机制，让模型在数学竞赛题、复杂算法题上的表现实现了质的飞跃，远超单纯依靠
    ORM 的模型。\n\n\U0001F4C8 5. 提供可解释的推理过程\n\nPRM 为每一步打分，相当于为整个推理链提供了“信心曲线”。用户可以直观地看到模型在哪一步开始变得不确定，这对于教育辅助、代码审查等场景至关重要。老师可以告诉学生：“你看，模型在第三步的变换就出错了。”\n\n---"

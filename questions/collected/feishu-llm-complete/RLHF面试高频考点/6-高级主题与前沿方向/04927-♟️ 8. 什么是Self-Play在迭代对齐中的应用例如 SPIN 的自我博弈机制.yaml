content:
  prompt: "♟️ 8. 什么是“Self-Play”在迭代对齐中的应用？例如 SPIN 的自我博弈机制。"
answer:
  mode: rubric
  reference_answer: "Self‑Play（自我博弈）将模型对齐过程变为一场“现在的自己”与“过去的自己”的对抗赛，无需外部标注，自动生成越来越难、越来越好的训练数据。\n\n♟️
    SPIN（Self‑Play Fine‑Tuning）的机制\n\n- 初始化：有一个 SFT 模型作为主模型（Main Player），同时保存一个它的拷贝作为对手模型（Opponent）。\n\n-
    生成与对抗：对于一批 prompt，主模型和对手模型分别生成回答。SPIN 使用一个巧妙的判别器——比较两个回答在主模型下的对数概率。因为主模型是当前优化的“好”策略，它天然会给符合人类偏好的回答更高概率。\n\n-
    自动标注偏好：如果主模型给自己生成的回答的概率高于对手的，就把主模型的作为 chosen，对手的作为 rejected；反之则交换。这就自动构造出了偏好对，无需任何人类或
    AI 裁判。\n\n- 更新主模型：用这些自动生成的偏好对，通过 DPO 损失函数训练主模型，让它更擅长生成被自己（当前策略）所喜欢的回答。\n\n- 迭代进化：把更新后的主模型作为新的对手，重复步骤
    2‑4。随着迭代，对手越来越强，主模型必须不断超越上一代的自己，形成螺旋上升。\n\n\U0001F4A1 优势：完全自动化，突破人类标注上限，成本极低。风险：如果初始模型的概率判断有偏差，可能陷入“自我欺骗”的循环，需要定期用外部基准校准。\n\n---"

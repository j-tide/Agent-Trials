content:
  prompt: 具身智能中的 RLHF 如何工作？人类反馈可能是对机器人执行任务的偏好。
answer:
  mode: rubric
  reference_answer: "\U0001F916 具身智能 RLHF 将人类的常识、安全约束和任务执行风格注入到机器人的控制策略中。\n\n\U0001F3AF
    具身智能 RLHF 的核心流程\n\n- 状态：机器人通过传感器（摄像头、关节编码器）感知的环境和自身状态。\n\n- 动作：机器人的控制指令（机械臂关节角度、移动速度等）。\n\n-
    反馈：人类观察机器人的执行轨迹或最终结果，给出偏好判断。\n\n\U0001F4CA 反馈形式\n\n- 轨迹级成对比较：人类观看两条机器人完成同一任务的视频，然后选择“哪条轨迹更好”。例如，“机器人
    A 抓取杯子时更轻柔，没有碰倒旁边的瓶子”。\n\n- 结果级偏好：只比较最终任务是否成功以及完成的质量（如积木搭得是否整齐）。\n\n- 实时干预：在机器人执行任务时，人类可以通过手柄或语音实时纠正其动作（如“不对，往左一点”），这些纠正信号可以作为即时奖励。\n\n\U0001F6E0️
    训练流程\n\n- 收集轨迹：让机器人运行多个版本的策略，产生多样化的轨迹。\n\n- 人类标注：展示成对的轨迹视频或结果，收集人类偏好标签。\n\n- 训练奖励函数：使用偏好数据训练一个奖励模型，该模型能预测人类对任意轨迹片段的偏好分数。奖励模型通常编码状态‑动作序列。\n\n-
    强化学习微调：在模拟器或真实环境中，使用 PPO 算法，用新训练的奖励模型提供奖励信号，微调机器人的控制策略。\n\n\U0001F527 独特挑战\n\n-
    状态‑动作空间是连续的：与文本的离散 token 空间不同，策略梯度方法需要处理连续控制问题。\n\n- 安全性：在真实机器人上试错可能会损坏设备。必须在模拟器中预训练，并设置严格的安全约束。\n\n-
    信用分配：哪个动作导致了最终的成功或失败？过程奖励模型在这里同样关键。\n\n\U0001F4A1 应用案例：OpenAI 使用 RLHF 训练机械手解魔方，通过人类对解魔方策略的偏好，让机器人学会了更灵巧、更类人的操作方式。\n\n---"

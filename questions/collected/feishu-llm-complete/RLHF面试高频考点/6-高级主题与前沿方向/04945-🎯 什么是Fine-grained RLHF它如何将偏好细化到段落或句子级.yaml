content:
  prompt: "\U0001F3AF 什么是“Fine-grained RLHF”？它如何将偏好细化到段落或句子级？"
answer:
  mode: rubric
  reference_answer: "Fine‑grained RLHF（细粒度 RLHF） 是一种超越传统“序列级打分”的对齐范式。传统 RLHF 的奖励模型只对完整回答给出一个笼统的评分，就像一个老师只给作文打总分，不告诉学生哪一段写得好、哪一段是败笔。细粒度
    RLHF 则将偏好信号细化到段落、句子、甚至子句级别，为回答的每一个局部提供独立的、有针对性的反馈。\n\n\U0001F50D 实现细粒度反馈的核心思想\n\n-
    分解“好”与“坏”的来源\n\n当人类标注员判断一个回答整体“不好”时，往往是因为其中存在具体的缺陷：“第二段的事实性陈述是错误的”、“第三段的语气过于生硬”、“最后一句的总结与原文矛盾”。细粒度
    RLHF 要求标注员（或 AI 裁判）不仅给出总体判断，还要明确指出哪些部分是问题的根源。\n\n- 多粒度的偏好数据构造\n在传统 RLHF 中，数据是
    (prompt, chosen_整体回答, rejected_整体回答)。在细粒度 RLHF 中，数据可能是：\n\n- (prompt, chosen_句子,
    rejected_句子, 上下文)：对于同一上下文，标注员/裁判指出 B 句子比 A 句子更好。\n\n- (prompt, 整个回答, [好, 坏, 好,
    好, 坏] 的片段标签)：对一个回答中的多个片段进行独立的好坏标注。\n\n- 模型结构上的适配\n\n要让模型理解细粒度的反馈，通常需要在训练或推理时进行特殊设计：\n\n-
    分段式生成与评估：将回答拆分成多个语义块（如段落），在生成每个块之后，都调用一个细粒度奖励模型进行评估，该块的奖励作为 PPO 中的密集信号。\n\n- Token
    级别的奖励塑形：细粒度标签被映射到对应的 token 区间上。例如，被标记为“坏”的句子，其所有 token 的即时奖励都降低。\n\n- 注意力层面的引导：在奖励模型中引入交叉注意力，让它能够“指向”回答中的特定区域，解释为何给出某个评分。\n\n---"

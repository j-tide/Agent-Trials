content:
  prompt: "\U0001F504 2. 在迭代 RLHF 中，每一轮的新偏好数据如何收集？通常是用当前最优策略生成新的回答对。"
answer:
  mode: rubric
  reference_answer: "新偏好数据是迭代 RLHF 的“燃料”，它的收集必须遵循一个核心原则：让数据分布与当前策略的输出分布保持同步。具体流程如下：\n\n\U0001F9EC
    步骤一：用当前最优策略生成候选回答\n\n- 选取上一轮 PPO 后的模型（即当前最优策略），作为生成器。\n\n- 对一批新采集的 prompt（包括线上用户日志、红队对抗题库、长尾冷门查询）进行高温采样（比如
    temperature=0.9），每个 prompt 生成 2~4 个多样化的回答。\n\n- 高温确保输出有足够的“发散性”，能覆盖从优秀到擦边甚至有害的各种情况，这正是
    RM 需要学会区分的。\n\n\U0001F3F7️ 步骤二：获取偏好反馈\n\n根据资源和需求，有三种主流方式：\n\n- 人类标注（重金高质）：把回答对送给经过新一轮培训的标注员。标注指南会更新，重点关注上一轮模型暴露的缺陷（如“过度拒绝”、“谄媚”等）。\n\n-
    AI 评判（快速低成本）：用 GPT‑4 等大模型当裁判，配合更新过的评判 prompt。适合快速迭代，但需警惕AI裁判自身的偏见。\n\n- 用户反馈（真实但噪声大）：收集线上点踩、举报、对比投票等数据，经过严格清洗后作为弱监督信号。\n\n\U0001F9EA
    步骤三：构造新偏好数据集\n将反馈转化为 (prompt, chosen, rejected) 三元组。关键技巧：\n\n- 困难样本挖掘：优先标注那些当前策略模型与反馈信号分歧巨大的样本（比如模型觉得好但用户踩的）。\n\n-
    经验回放：新数据不覆盖旧数据，而是与第一轮的高质量人类精标数据按比例混合（例如 8:2），防止灾难性遗忘。\n\n- 数据飞轮：这轮的新数据又会被用来训练新
    RM 和新策略，形成“生成→反馈→训练→再生成”的闭环。\n\n这个流程保证了每一轮的数据都是“新鲜的、有代表性的、并且是针对模型当前弱点的”。\n\n---"

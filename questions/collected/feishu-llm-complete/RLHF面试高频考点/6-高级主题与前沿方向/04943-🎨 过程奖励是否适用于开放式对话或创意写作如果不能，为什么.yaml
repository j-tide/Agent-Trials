content:
  prompt: "\U0001F3A8 过程奖励是否适用于开放式对话或创意写作？如果不能，为什么？"
answer:
  mode: rubric
  reference_answer: "坦率地说，过程奖励在开放式对话和创意写作中的适用性极差，强行应用甚至会适得其反。 这是由这些任务的本质属性决定的。\n\n❌
    为什么不适用的根本原因\n\n- 缺乏“正确步骤”的客观定义\n\n数学推理的正确性由逻辑和公理决定，代码的正确性由编译器裁定。但对话和创意写作没有客观的“对”与“错”——如何定义一个比喻是否“优美”？如何判断一个笑话的铺垫是否“恰到好处”？这些是高度主观的审美判断，无法被自动化验证，也无法被过程奖励客观评分。\n\n-
    无法进行有意义的步骤切分\n\n数学推理可以按“应用定理”、“化简计算”等边界清晰拆分。但创意写作中的“步骤”是什么？一个句子的生成吗？一个段落的构思吗？还是角色的心理转折？这些“步骤”边界模糊，强行切分会让模型失去语言的流畅性，变得机械造作。\n\n-
    过程奖励会扼杀创造力和“灵光一现”\n\n创意写作的妙处往往在于打破常规、出人意料。而过程奖励的本质是“步步为营地朝着目标前进”，它会奖励那些安全、可预测、符合常规的写作模式。如果对每一步都进行打分，模型会倾向于生成最稳妥但最平庸的表达，丧失文学性和感染力。\n\n-
    用户意图的动态性与多目标权衡\n\n在对话中，用户意图可能在多轮交互中发生变化，回答的好坏取决于是否满足了隐式的、复杂的社会情感需求（如倾听、共情、幽默）。这不是一个可以被分解为“步骤正确性”的优化问题。\n\n\U0001F539
    可能的例外：部分结构化的对话任务\n\n在某些半结构化的对话任务中，过程奖励可以有一席之地，但需要精心设计：\n\n- 任务型对话：如客服引导用户完成退款流程，其步骤是明确的（验证身份→查询订单→确认退款→执行），每一步可以客观评估是否完成子任务。\n\n-
    教育辅导对话：如苏格拉底式引导，模型通过逐步提问引导学生自己得出答案，每一步的提问策略可以被专家标注为“有效”或“无效”。\n\n---"

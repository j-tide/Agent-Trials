answer:
  mode: rubric
  reference_answer: "\U0001F4CA 详细对比\n\n[嵌入表格未展开]\n\n\U0001F3AF 如何权衡？\n\n- 成本与预算优先：如果团队只有消费级显卡或有限的云GPU预算，参数高效RLHF是唯一可行之路，且其效果完全能够满足绝大多数产品需求。\n\n-
    性能优先：在训练超大规模（>70B）的通用基础模型，并希望其对齐效果达到SOTA时，全参数RLHF（结合多模态、多维奖励等复杂机制）通常能榨出最后5%的性能提升。\n\n-
    混合策略：很多顶尖实验室采用混合路线——初期用高效方法（如LoRA）快速迭代对齐策略和数据，找到最佳超参数和数据配方；最后阶段使用全参数微调进行最终的“精修”。\n\n\U0001F4A1
    最佳实践：先以 QLoRA + DPO 低成本试错，确定最优数据配方和奖励设计，然后根据资源情况决定是否升级到全参数 PPO 进行最终冲刺。\n\n---"

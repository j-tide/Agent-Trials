content:
  prompt: "\U0001F9E0 4. 在持续对齐中，如何平衡新学到的偏好和保留旧知识？灾难性遗忘问题如何应对？"
answer:
  mode: rubric
  reference_answer: "这是一个典型的“稳定性‑可塑性”困境：模型既要塑性强以吸收新的人类反馈，又要稳定性高以保留过去的宝贵知识。下面是我的应对策略，融合了持续学习领域的经典方法。\n\n\U0001F4BE
    策略一：经验回放（混合旧数据）\n\n- 每一轮新训练，都将上一轮的偏好数据（尤其是首轮人类精标的高质量数据）按比例混入新数据中。旧数据就像“错题本”，提醒模型不要重蹈覆辙，也防止它忘记最初学到的基本准则。通常首轮数据会作为“锚定集”一直保留。\n\n\U0001F4CC
    策略二：弹性权重巩固\n\n- 借鉴 EWC 思想，识别出对旧任务（如基础问答、安全性）重要的模型参数。在新一轮微调时，对这些参数施加更大的更新惩罚，限制其变化幅度，而让不重要的参数去适应新偏好。这需要计算参数的重要性矩阵，计算成本虽高，但对大规模模型的灾难性遗忘抑制效果显著。\n\n\U0001F9E9
    策略三：参数高效微调（LoRA）\n\n- 不直接修改预训练模型的主体参数，而是为每一轮的新偏好训练独立的 LoRA 模块。旧知识完好地保留在冻结的基座模型中，新能力以即插即用的插件形式存在。这从根本上避免了灾难性遗忘，而且可以按需组合（比如“基础安全LoRA
    + 客服语气LoRA”）。\n\n\U0001F504 策略四：渐进式对齐与动态采样\n\n- 将迭代规划为“粗调→细调→微调”。早期轮次对齐力度弱一些，主要让模型适应分布；后期针对特定问题加强。在数据采样上，确保旧任务类别的
    prompt 在新 batch 中出现，防止旧知识被“挤出”。\n\n\U0001F4A1 平衡之道在于：不让新知识覆盖旧知识，而是让它们分层共存。\n\n---"

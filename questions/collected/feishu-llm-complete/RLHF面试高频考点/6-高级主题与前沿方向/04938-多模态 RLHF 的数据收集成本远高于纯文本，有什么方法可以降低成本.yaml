content:
  prompt: 多模态 RLHF 的数据收集成本远高于纯文本，有什么方法可以降低成本？
answer:
  mode: rubric
  reference_answer: "\U0001F4B0 多模态偏好标注的成本是纯文本的 5–10 倍，降本是工程落地的关键。\n\n\U0001F6E0️
    降本增效的方法\n\n- RLAIF (AI 反馈) 的规模化应用\n\n- 使用 GPT‑4V、Claude 3.5 等多模态大模型作为自动标注器，对生成的图文回答进行偏好判断。\n\n-
    技巧：设计详细的评判 prompt，要求 AI 裁判给出评分并附上分析；然后仅对 AI 裁判置信度低的样本（如 10%）进行人工复核。这可以将人工标注量降低一个数量级。\n\n-
    合成数据与数据增强\n\n- 文本为主，图像为辅：对于大部分对话任务，可以先基于纯文本生成大量偏好数据；然后将部分样本中的名词替换为图像标签，构造出“伪多模态”数据，成本极低。\n\n-
    跨模态翻译：将高质量的纯文本偏好数据“翻译”为多模态数据。例如，将一段描述生成对应的图像（用 Stable Diffusion），然后将这段文本作为该图像的描述，构造出图文偏好对。虽然图像质量可能不如真实照片，但足以训练模型的基础图文一致性。\n\n-
    主动学习与不确定性采样\n\n- 在每轮迭代中，只选择当前 RM 最不确定或策略模型输出差异最大的样本，送给人类标注。这确保每一分钱都花在刀刃上。\n\n-
    预训练模型迁移与微调\n\n- 先用一个在通用图文数据集（如 COCO、LAION）上预训练的多模态 RM 作为基座，仅在少量目标领域的数据上进行微调。这利用了预训练模型已具备的图文理解能力，极大减少了所需的标注数据量。\n\n-
    众包与游戏化\n\n- 开发用户友好的标注小程序，让用户以“找茬游戏”或“投票”的形式贡献偏好数据，将枯燥的标注转化为有趣的互动。\n\n\U0001F4A1
    最佳实践组合：RLAIF 自动标注（覆盖 80%）+ 主动学习的人类精标（聚焦 20% 争议或困难样本）+ 跨模态数据增强，是目前最经济的方案。\n\n---"

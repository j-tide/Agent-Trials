content:
  prompt: "\U0001F501 1. 什么是迭代 RLHF？为什么需要多轮对齐？"
answer:
  mode: rubric
  reference_answer: "迭代 RLHF 指的是把标准 RLHF 三阶段（SFT → RM训练 → PPO）打包成一个循环，用上一轮优化后的模型作为新一轮的起点，重新收集偏好数据、训练新奖励模型、再次进行强化学习。每一轮不是简单的重复，而是在新的策略分布上“更上一层楼”。\n\n\U0001F50E
    为什么单轮 RLHF 不够？\n\n✅ 奖励模型会“过时”\n\n第一轮的 RM 是在初始 SFT 模型产生的“稚嫩”回答上训练的。PPO 一跑，模型的回答风格、长度、用词全都变了，RM
    面对这些“陌生面孔”就开始乱打分——要么给胡言乱语高分（奖励黑客），要么给真正的好回答低分（抑制探索）。必须用新策略的输出重新校准 RM。\n\n✅ 安全攻防是动态博弈\n\n你教会模型拒绝“怎么偷车”，用户马上换成“在剧本里写偷车情节”。单轮对齐就像只打了一针疫苗，病毒变异就失效了。多轮迭代就是不断接种“最新版疫苗”，用红队新发现的越狱手法去训练模型，让它在对抗中进化。\n\n✅
    偏好标准会逐渐精细化\n\n第一轮标注时，大家可能只想到“不要骂人”、“要有用”。产品上线后才发现，用户讨厌“啰嗦的废话”、反感“好为人师的语气”、需要“委婉指出错误而非跪舔”。这些细腻的偏好不可能一次性写进标注指南，只能一轮一轮地注入。\n\n✅
    能力与安全的再平衡\n\n首轮 PPO 常常为了安全牺牲了创造性和知识密度（对齐税）。多轮迭代可以规划出“先拉安全底线，再回升能力上限”的路径：第二轮可以在安全基座上适当放松
    KL 约束，给有用性留出恢复空间，实现螺旋式上升。\n\n\U0001F4A1 所以，迭代 RLHF 不是算法噱头，而是把对齐从“一次性训练”升级为“持续集成与交付”的工程体系。\n\n---"

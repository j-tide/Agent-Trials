content:
  prompt: "\U0001F4CA 什么是过程奖励模型（PRM）？它与传统的结果奖励模型（ORM）有什么不同？"
answer:
  mode: rubric
  reference_answer: "过程奖励模型 (Process Reward Model, PRM) 是一种对推理过程的每一步进行细粒度评估的奖励模型。传统的结果奖励模型
    (Outcome Reward Model, ORM) 只在生成序列的末尾给出一个综合评分，判断最终答案是否正确。PRM 则将评判粒度细化到了推理链中的每一个中间步骤，为每一步的正确性、逻辑性、相关性提供即时反馈。\n\n两者的核心区别可以用一个比喻来理解：\n\n\U0001F3D7️
    ORM 像工程验收：只关心大楼最终是否合格，不管施工过程中有多少次违规操作。\n\U0001F50D PRM 像监理工程师：在每一道工序完成后都进行检查，发现问题立即纠正。\n\n具体来说，它们的差异体现在以下几个维度：\n\n\U0001F538
    奖励密度\n\n- ORM：极端稀疏。模型生成了 500 个 token 的推理过程，只在最后 EOS 处得到唯一的奖励信号——正确得 1 分，错误得 0
    分。\n\n- PRM：密集反馈。每个推理步骤结束后，模型都能立即收到该步骤的质量评分（如 0~1 之间的置信度），形成一条奖励曲线。\n\n\U0001F538
    信用分配\n\n- ORM：必须通过价值函数 (Critic) 和 GAE 将终端奖励“逆向传播”到所有 token 上，这个过程充满噪声且容易出错——一个错误步骤可能导致全盘皆输，前面
    9 步正确推理也被无辜惩罚。\n\n- PRM：信用分配天然精准。第 3 步推理错误，就只有第 3 步及其后续得到低奖励，前面正确的步骤依然获得正反馈，模型清楚知道“问题出在哪一步”。\n\n\U0001F538
    训练信号质量\n\n- ORM：高方差、低效率。模型可能需要成千上万次尝试，才能偶然发现一条通往正确答案的路径，学习速度极慢。\n\n- PRM：低方差、高效率。每一步都有明确的监督信号，模型能够快速学会哪些推理模式是有效的，哪些是死胡同。\n\n\U0001F538
    对错误的敏感性\n\n- ORM：对中间过程的错误不敏感。一个包含微小计算错误的推理链，最终答案错误，ORM 会将其等同于完全胡言乱语。\n\n- PRM：高度敏感。它能够精确区分“完全错误的推理”、“推理方向正确但有计算失误”、“完美推理”等不同质量等级。\n\n\U0001F538
    探索与纠错能力\n\n- ORM：模型无法进行有意义的中间步骤回溯，因为不知道哪一步开始偏离了正轨。\n\n- PRM：模型可以在中间步骤得到低分后，自动触发“反思”或“重试”机制，就像人类在解题时发现不对劲就回头检查。\n\n\U0001F4A1
    一句话总结：ORM 关心“答案对吗？”，PRM 关心“你是怎么想的，每一步都对吗？”\n\n---"

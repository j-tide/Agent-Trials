content:
  prompt: 视觉-语言对齐中，如何防止奖励模型过拟合到文字而忽略图像？
answer:
  mode: rubric
  reference_answer: "\U0001F6E1️ 奖励模型走捷径（仅依赖文本模式判断好坏，不看图）是多模态对齐中最隐蔽的陷阱之一。\n\n⚠️ 过拟合的表现\n\n-
    RM 给所有包含“很清晰”、“如图所示”等文本套话的回答都打高分，即使这些回答与图像内容完全矛盾。\n\n- 在训练过程中，RM 评分与图像内容的相关性越来越低，而与文本长度的相关性越来越高。\n\n\U0001F527
    防御策略\n\n策略一：对抗性数据增强\n\n- 构造大量的“图文矛盾”样本：将正确图像替换为无关或相反图像，但保留原优秀文本。将这些样本与正确的图文对一起训练
    RM，迫使它必须看图才能判断对错。\n\n- 生成“只有文本好，但图像错”的 rejected 回答，专门训练 RM 识别这种错误。\n\n策略二：图像掩码测试\n\n-
    在 RM 训练中，随机以一定概率（如 20%）用纯黑图或噪声图替换原图。如果 RM 仅靠文本就能给出正确判断，它就不会学会利用视觉信息。这种方法强制 RM
    去依赖图像特征。\n\n策略三：梯度归因分析\n\n- 定期计算 RM 评分对视觉 token 的梯度。如果视觉 token 的平均梯度显著低于文本 token，说明
    RM 在忽略视觉信息。此时可以用一个正则化损失，鼓励视觉梯度的范数不低于某个阈值。\n\n策略四：解耦的视觉与语言分支\n\n- RM 架构上分为视觉通路和语言通路，两者在最后几层才融合。对视觉通路施加更强的
    Dropout 或正则化，防止它退化。\n\n策略五：图文一致性专项评分\n\n- 如前所述，将一致性奖励独立出来，并用大量专门标注的“图文不一致”数据进行训练，使其成为
    RM 的必备组件。\n\n\U0001F4A1 一句话：防止 RM 过拟合到文本，本质上是强迫它去验证视觉事实，而不是联想文本模式。\n\n---"

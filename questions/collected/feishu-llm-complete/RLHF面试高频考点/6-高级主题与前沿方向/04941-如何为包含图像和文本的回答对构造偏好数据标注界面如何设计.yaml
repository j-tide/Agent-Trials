content:
  prompt: 如何为包含图像和文本的回答对构造偏好数据？标注界面如何设计？
answer:
  mode: rubric
  reference_answer: "\U0001F6E0️ 构造多模态偏好数据的关键是让标注员能够同时看到图像、问题和两个候选回答，并基于图像内容做出判断。\n\n\U0001F4CB
    偏好数据构造流程\n\n- 生成候选回答：对一个多模态 prompt（图像 + 文本），使用不同版本或不同采样参数的模型生成两个或多个候选回答。\n\n-
    设计标注界面：界面需要并排或上下排列图像和两个回答，让标注员能反复对照。\n\n- 收集偏好：标注员选出更好的回答，并可能给出细粒度反馈（如“回答A在描述颜色时更准确”）。\n\n\U0001F5A5️
    标注界面设计要点\n\n- 图像固定区域：图像应始终可见，不可滚动隐藏，因为所有判断都基于它。\n\n- 对比视图：两个回答左右或上下排列，高亮差异部分，便于快速比较。\n\n-
    多维度评分面板：不仅要求选“A更好/B更好”，还提供勾选项标记问题类型：\n\n- \U0001F7E2 图文一致\n\n- \U0001F534 幻觉（无中生有）\n\n-
    \U0001F7E1 描述不准确（属性错误）\n\n- ⚪ 语气不当\n\n- \U0001F535 不安全内容\n\n- 推理链要求：要求标注员在做出选择后，用一句话解释判断依据，这有助于质量控制。\n\n-
    对抗性样本注入：混合一些金标数据（已知正确答案）来检测标注员是否走神。\n\n\U0001F4CA 质量控制\n\n- 双人独立标注，计算加权 Kappa
    系数。\n\n- 对分歧样本进行专家仲裁，并定期培训标注员。\n\n\U0001F527 利用 AI 辅助标注\n\n- 使用强大的 MLLM（如 GPT‑4V）作为预标注器，自动生成偏好标签和解释，然后由人类审核修正，成本可降低
    60%–80%。\n\n---"

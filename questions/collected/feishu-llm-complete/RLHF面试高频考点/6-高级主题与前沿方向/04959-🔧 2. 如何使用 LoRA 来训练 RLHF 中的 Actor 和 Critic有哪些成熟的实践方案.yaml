content:
  prompt: "\U0001F527 2. 如何使用 LoRA 来训练 RLHF 中的 Actor 和 Critic？有哪些成熟的实践方案？"
answer:
  mode: rubric
  reference_answer: "\U0001F4D0 LoRA 的工作原理\n\n[图片内容未导入]\n\n\U0001F6E0️ 在 RLHF 中的应用\n\nActor（策略网络）\n\n-
    在自注意力层的 Q、K、V、O 投影矩阵上添加 LoRA 适配器。\n\n- 采样生成文本时，Actor 底座保持冻结，仅 LoRA 权重被激活。记录下动作的对数概率，用于后续的
    PPO 重要性采样。\n\n- 实践上，Hugging Face TRL 库的 PPOTrainer 支持直接传入一个已加载 LoRA 的模型。\n\nCritic（价值网络）\n\n-
    Critic 通常从 Reward Model 或 SFT 模型初始化，同样使用 LoRA 适配器，但其输出头（标量值头）通常需要全参数训练，因为价值头是任务全新的。\n\n-
    一些实践表明，为 Critic 和 Actor 使用不同的 LoRA 秩（Actor 的 r 更大，以保持足够表达能力）效果更好。\n\n- 也可以让 Critic
    共享 Actor 的底座，但使用独立的 LoRA 适配器，减少显存占用（此时需要仔细处理梯度干扰）。\n\n成熟的实践方案\n\n- DeepSpeed-Chat：支持
    LoRA 训练，在 PPO 阶段可以指定仅对 Actor 应用 LoRA。\n\n- Hugging Face TRL：提供 DPOTrainer 和 PPOTrainer
    对 LoRA 的全面支持，可结合 peft 库快速配置。\n\n- LLaMA-Factory：集成多种 PEFT 方法和 RLHF 流程，支持 LoRA、QLoRA
    等，并提供了友好的 Web UI。\n\n⚠️ 注意事项\n\n- 对于 Critic，如果底座完全冻结，仅靠 LoRA 可能难以准确学习价值函数，尤其是在奖励分布复杂时。有时会解冻
    Critic 的最后几层 Transformer 块，或使用更大的 LoRA 秩。\n\n- 在 PPO 的多轮更新中，由于 Actor 的 LoRA 权重不断变化，旧的采样数据很快会过时，因此需要严格控制
    KL 散度，避免过度的 off-policy 更新。\n\n---"

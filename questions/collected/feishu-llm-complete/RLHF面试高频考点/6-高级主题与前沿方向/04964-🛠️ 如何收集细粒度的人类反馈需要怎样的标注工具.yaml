content:
  prompt: "\U0001F6E0️ 如何收集细粒度的人类反馈？需要怎样的标注工具？"
answer:
  mode: rubric
  reference_answer: "收集细粒度反馈需要比传统成对比较更精细的标注工具和流程设计。以下是构建此类工具的蓝图。\n\n\U0001F3A8 标注工具的核心功能\n\n-
    高亮式评判\n\n工具需要允许标注员在阅读回答时，像使用荧光笔一样直接高亮文本片段。高亮后，可以弹出一个标签选择器：\n\n- \U0001F534 事实错误（Hallucination）\n\n-
    \U0001F7E1 逻辑跳跃或不连贯\n\n- ⚪ 语气不当（过于生硬、傲慢）\n\n- \U0001F7E2 过度冗余（废话）\n\n- \U0001F535
    安全问题（歧视、暴力暗示等）\n\n- 对比修订模式\n\n给标注员展示模型的原回答，旁边提供一个可编辑的文本框。标注员可以直接在原文本上修改有问题的片段，并加上修订标记。最终的“chosen
    句子”就是修订后的版本，“rejected 句子”就是原始版本。这种方式能最高效地产生细粒度对比数据。\n\n- 多粒度评判面板\n\n评判界面需要支持从“整个回答”到“段落”到“句子”的逐级展开。标注员可以先快速给出整体评分（如
    1‑5 星），然后展开低分回答，对具体问题段落进行细粒度标注。这避免了标注员对所有回答都进行费力的全文审查。\n\n- 错误模式快捷菜单\n\n通过分析常见错误，预设一键标注的快捷方式，减少标注员的重复劳动。例如：“检测到编造数据
    → 一键标记为 [事实错误]”，工具自动框定包含数字或引用的句子。\n\n\U0001F4CB 标注流程与质量控制\n\n- 多人独立标注与仲裁：每个样本至少由
    2‑3 名标注员独立标注，对片段级别的一致性（如高亮重叠度）进行度量，分歧大的提交给专家仲裁。\n\n- 金标数据训练与自动预标注：先用一批高质量的细粒度金标数据训练一个自动标注模型，后续的标注任务中由模型先进行预标注，标注员只需进行修正，效率可提升
    3 倍。\n\n- 绩效反馈与持续培训：每周抽取标注员的样本进行盲审，对标注质量进行评分并给予反馈，形成持续改进的闭环。\n\n---"

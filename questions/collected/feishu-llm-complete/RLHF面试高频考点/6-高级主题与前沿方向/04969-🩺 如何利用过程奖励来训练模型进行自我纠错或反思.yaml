content:
  prompt: "\U0001FA7A 如何利用过程奖励来训练模型进行“自我纠错”或“反思”？"
answer:
  mode: rubric
  reference_answer: "自我纠错是高级智能的标志，而 PRM 为模型提供了实现这一能力的“内部温度计”——它能感知到自己是否正在“发烧”（推理出错了）。\n\n\U0001F527
    训练机制一：构造专门的“纠错数据”\n\n- 生成错误轨迹：让模型在解数学题或写代码时，使用较高温度采样，故意引入一些错误步骤。\n\n- PRM 标注错误点：用已经训练好的
    PRM 对这些轨迹打分，自动识别出得分骤降的“事故点”。\n\n- 构造纠错指令：在错误步骤之后，插入一个特殊的“反思指令”，如 <|reflection|>
    上一步似乎有问题，让我重新思考...，然后引导模型生成正确的修正步骤。\n\n- SFT 或 DPO 训练：将 (问题 + 错误前缀, 反思 + 修正后的正确解答)
    作为训练数据，让模型学会在“感知到错误”时自动触发反思并自我修复。\n\n\U0001F527 训练机制二：RL 驱动的自发反思\n\n在 PPO 训练中，将“是否成功纠正了之前的错误”作为额外的奖励信号。模型会在强化学习的探索中，偶然发现“回过头去检查”的行为能够提高最终成功率，从而自发地将这种元认知策略内化。\n\n\U0001F527
    推理时的树搜索与回溯\n\n结合 PRM 和蒙特卡洛树搜索 (MCTS)，模型可以在推理时进行显式的“思考-评估-回溯”：\n\n- 每一步生成 3~5 个候选下一步。\n\n-
    用 PRM 为每个候选预测奖励。\n\n- 选择奖励最高的路径前进一步，奖励低的路径被剪枝。\n\n- 如果当前路径上 PRM 连续给出低分，系统自动回溯到上一个高分节点，选择次优路径继续探索。\n这本质上是在推理时进行受控的“反思”，而
    PRM 就是这个过程的“导航仪”。\n\n\U0001F527 数据飞轮：自我改进\n\n随着模型纠错能力的提升，它会生成越来越高质量的正确轨迹。这些轨迹又可以被用来进一步训练和校准
    PRM，形成自我增强的正反馈循环。\n\n---"

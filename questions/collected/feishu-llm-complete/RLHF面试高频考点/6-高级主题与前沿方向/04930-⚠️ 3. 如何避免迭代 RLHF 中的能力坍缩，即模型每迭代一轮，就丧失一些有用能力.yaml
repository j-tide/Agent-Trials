content:
  prompt: "⚠️ 3. 如何避免迭代 RLHF 中的“能力坍缩”，即模型每迭代一轮，就丧失一些有用能力？"
answer:
  mode: rubric
  reference_answer: "能力坍缩是迭代对齐中最令人头疼的副作用——奖励分数蹭蹭涨，但模型变“笨”了：代码不会写、知识记不住、推理变差。这本质上是单维度优化（安全/偏好）对其它能力的灾难性遗忘。下面是我的四条防线：\n\n\U0001F6E1️
    防线一：数据混合，强制“复习”\n\n- 预训练数据回放（PPO‑ptx）：每一轮 PPO 的 mini‑batch 里，强行混入 10%~20% 的通用文本（如维基百科、代码库），让模型在对齐的同时，不忘老本行。这是最有效的“记忆锚”。\n\n-
    能力保持数据集：专门构建一个包含事实问答、数学题、翻译对的“能力测试集”，在 PPO 损失里加入对这些回答的对数似然奖励（等价于 SFT 损失），强制模型保护这些能力。\n\n\U0001F6E1️
    防线二：多维奖励模型与动态权重\n\n- 将对齐目标拆解为“有用性”、“安全性”、“事实准确性”、“简洁性”等子奖励模型。当监控系统发现代码能力下降时，立即动态调高“代码正确性”奖励的权重，或降低安全惩罚的强度，引导模型恢复代码能力。\n\n\U0001F6E1️
    防线三：动态 KL 约束（适应性 β）\n\n- 不把 KL 系数 β 写死。监控模型在标准基准（如 MMLU）上的得分，一旦发现整体能力跌破预警线，自动增大
    β，让策略向初始 SFT 模型回撤，减缓对齐压力，给能力恢复留出喘息空间。\n\n\U0001F6E1️ 防线四：迭代前的评估与自动刹车\n\n- 每轮迭代前，用一组标准基准（MMLU、HumanEval、GSM8K）跑分，建立能力基线。训练中持续监控，若关键指标下降超过
    3%，触发自动暂停或回滚，并通知团队调整策略。\n\n\U0001F4A1 能力坍缩的根源是“遗忘”，所以应对它的核心就是“边学边复习，随时量体温”。\n\n---"

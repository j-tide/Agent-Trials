content:
  prompt: 多模态奖励模型是否可以处理“文本好但图像差”或反之的情况？如何处理冲突？
answer:
  mode: rubric
  reference_answer: "⚖️ 当然可以，这是多模态奖励模型设计中必须解决的核心矛盾。\n\n\U0001F50D 冲突场景举例\n\n- 文本好，图像差：用户要求生成“一只猫”，图像中生成了狗，但文本描述却精确地介绍了猫的品种。文本质量高，但与图像严重不符。\n\n-
    图像好，文本差：文生图模型生成了完美的猫，但文本回答却说“我无法生成图像”或者给出错误的文字描述。\n\n\U0001F6E0️ 处理冲突的机制\n\n方案一：多维奖励分解与加权\n\n[图片内容未导入]\n\n-
    如果一致性得分低于阈值 θ，sigmoid 输出接近 0，大幅拉低总奖励。这强制模型必须优先满足“图文匹配”这一硬性要求。\n\n方案三：级联评判\n\n-
    先由一致性检测器判断图文是否匹配。如果不匹配，直接给出低分并标记为 rejected，无需再进入后续的质量评估环节。\n\n方案四：基于 LLM 的元评判\n\n-
    构建一个元评判 prompt，要求评判 LLM（如 GPT‑4V）在评估时明确：“如果图像与文本描述严重不符，无论文本写得多好，整个回答都视为不合格。” 让裁判模型在评估时具备优先级意识。\n\n\U0001F4A1
    实践智慧：工业界通常采用方案一（多维分解）+ 方案二（硬性门控） 的组合。必须明确：一致性是底线，不能妥协；在此之上，才追求文本的优美和图像的美学。\n\n---"

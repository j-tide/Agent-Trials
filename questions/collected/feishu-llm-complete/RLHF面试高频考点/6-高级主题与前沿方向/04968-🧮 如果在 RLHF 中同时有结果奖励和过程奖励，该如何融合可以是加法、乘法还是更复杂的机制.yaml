content:
  prompt: "\U0001F9EE 如果在 RLHF 中同时有结果奖励和过程奖励，该如何融合？可以是加法、乘法还是更复杂的机制？"
answer:
  mode: rubric
  reference_answer: "将结果奖励 (ORM) 和过程奖励 (PRM) 融合，目标是结合 ORM 的“终极评判力”和 PRM 的“过程引导力”，实现
    1+1 > 2 的效果。融合策略的选择取决于任务性质和对风险的态度。\n\n\U0001F9EE 策略一：线性加权融合（最常用）\n\nRtotal=α⋅RORM+β⋅RPRMRtotal=α⋅RORM+β⋅RPRM\n\n-
    RORMRORM 是最终的标量奖励（如正确为 1，错误为 -1）。\n\n- RPRMRPRM 是过程奖励的某种聚合，例如所有步骤奖励的平均值或累积和。\n\n-
    αα 和 ββ 是需要调优的权重，通常 ββ 较小 (0.1~0.3)，因为 PRM 起“辅助引导”作用，而 ORM 是“终极目标”。\n\n- 优点：简单、可解释，与现有
    PPO 框架兼容。\n\n- 缺点：线性组合可能让模型在某一维度上刷分（如为了过程高分而生成过于简单的步骤），缺乏精细控制。\n\n\U0001F9EE 策略二：乘法/门控融合（强调“过程为结果服务”）\n\nRtotal=RORM×σ(γ⋅(RˉPRM−θ))Rtotal=RORM×σ(γ⋅(RˉPRM−θ))\n\n-
    将过程奖励平均值 RˉPRMRˉPRM 通过 sigmoid 函数映射为 (0,1) 之间的“过程质量系数”。\n\n- 如果过程质量极差（系数接近 0），即使最终结果偶尔正确，总奖励也会被大幅压制。这告诉模型：“靠蒙对的答案不算数。”\n\n-
    优点：强制模型追求稳扎稳打的推理过程，避免赌博式探索。\n\n- 缺点：γγ 和 θθ 参数敏感，可能过于严苛导致模型不敢进行必要的大胆尝试。\n\n\U0001F9EE
    策略三：分层奖励塑形（Shape the Reward Landscape）\n\n将 ORM 奖励作为“终点宝藏”，将 PRM 奖励作为“沿途金币”。在
    PPO 中，不直接修改最终奖励，而是利用 PRM 为每个中间步骤提供密集的即时奖励，从而平滑奖励地形：\n\nrt=rtPRM(所有步骤边界)rt=rtPRM(所有步骤边界)rT=rTPRM+rORM(最后一步)rT=rTPRM+rORM(最后一步)\n\n这种方式下，GAE
    会自然地将终端 ORM 奖励的信息反向传播，同时中间的 PRM 奖励提供了低方差的“落脚点”，使得整个价值函数的学习更加容易。\n\n- 优点：最符合强化学习理论，能最大程度降低训练方差。\n\n-
    缺点：要求 PRM 的评分非常准确，否则可能误导探索。\n\n\U0001F9EE 策略四：带约束的融合（用于高风险安全场景）\n\n设置硬性规则：PRM
    中任何步骤的分数不得低于某个阈值，否则该轨迹的 ORM 奖励无效（置零）。这用于防止模型通过不安全、但最终正确的路径获得奖励。\n\n---"

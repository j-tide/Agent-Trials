content:
  prompt: "\U0001F4C9 4. 如果使用 QLoRA 进一步降低显存，训练稳定性和最终对齐效果会受影响吗？"
answer:
  mode: rubric
  reference_answer: "\U0001F9E0 QLoRA 的技术原理\n\nQLoRA 在 LoRA 的基础上，将冻结的底座模型权重量化为 4-bit
    NormalFloat (NF4) 格式，并采用双重量化进一步压缩量化常数。在前向传播时，权重被反量化为 BFloat16 进行计算；反向传播时，梯度仅通过
    LoRA 适配器传递，底座权重不接收梯度。这使得一个 65B 的模型仅需约 48GB 显存即可微调。\n\n⚖️ 对训练稳定性的影响\n\n- 精度损失：量化必然会引入信息损失。在
    RLHF 这种对概率分布微小变化极其敏感的任务中，4-bit 量化可能导致底座模型的语言建模能力轻微下降，从而影响 Actor 生成文本的流畅性，以及 Reference
    模型 KL 惩罚计算的准确性。\n\n- 超参数敏感性增加：使用 QLoRA 时，学习率、LoRA 的 α 和 r、以及量化参数（如 block size）需要更仔细地调优。训练曲线可能出现更多的噪声。\n\n-
    优势信号方差：由于 Critic 和 Actor 的底座都经量化，它们对状态价值的估计和对策略的评估可能不如 FP16 精确，可能导致优势函数的估计方差略有增大。\n\n\U0001F4C8
    对最终对齐效果的影响\n\n大量实验（如 QLoRA 论文本身及后续的 RLHF 实验）表明，在合理配置下，QLoRA 可以达到与全参数微调或 LoRA 非常接近的对齐效果。尤其当使用较大的
    LoRA 秩（如 64）和 α（如 32）时，性能损失往往在 1% 以内。然而，在需要高度精细的、对语言细节极度敏感的风格对齐任务上，QLoRA 的微小损失可能会被放大。\n\n\U0001F6E1️
    最佳实践\n\n- 使用 NF4 量化搭配双重量化，这是目前平衡精度与显存的最优选择。\n\n- 对量化后的底座加载来自高质量 SFT 的权重，确保量化起点本身具有强健的语言能力。\n\n-
    在正式 RLHF 前，先进行一个短期的 SFT 微调（用 LoRA），让模型适应量化分布，有助于稳定后续的 RL 训练。\n\n---"

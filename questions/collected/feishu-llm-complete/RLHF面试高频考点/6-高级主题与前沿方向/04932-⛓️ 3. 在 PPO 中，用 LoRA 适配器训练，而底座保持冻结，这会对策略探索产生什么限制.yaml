content:
  prompt: "⛓️ 3. 在 PPO 中，用 LoRA 适配器训练，而底座保持冻结，这会对策略探索产生什么限制？"
answer:
  mode: rubric
  reference_answer: "\U0001F50D 探索能力受限的根源\n\n策略的探索能力来自于其参数空间的可塑性。全参数微调允许模型在所有层、所有表示子空间中进行调整，以发现新的、高奖励的生成模式。而
    LoRA 仅能在一个低维子空间中改变模型的行为，相当于给策略戴上了一个“紧箍咒”。\n\n\U0001F6A7 具体限制表现\n\n- 奖励地形上的局部最优：当最优策略与基座模型的输出分布差异较大时（例如，需要模型学会一种全新的安全措辞方式），低秩的
    LoRA 可能无法提供足够的自由度，导致策略被困在次优的局部解中，无法跳跃到更优的策略模式。\n\n- 多样性抑制：策略熵的下降速度可能比全参数训练更快，因为
    LoRA 的表达能力有限，模型更容易“抓住”少数能稳定获得高奖励的模板，并迅速坍缩到这些模式上。\n\n- 对复杂奖励信号的适应不足：如果奖励模型要求精细的、多方面的对齐（例如同时要求简洁、准确、无害），LoRA
    可能很难同时满足这些复杂约束，出现“顾此失彼”的现象。\n\n\U0001F4A1 为什么这实际上也可能是优势？\n\n- 天然的“信任区域”：LoRA 的低容量天然起到了强正则化的作用，迫使策略在离基座模型很近的区域内探索，极大降低了语言崩溃和奖励黑客的风险。\n\n-
    更稳定的训练：探索的步幅被自然限制，训练过程中的 KL 散度波动更小，需要的 KL 惩罚系数 β 也可以相应减小。\n\n\U0001F6E0️ 缓解限制的技巧\n\n-
    增大 LoRA 的秩 r（如 128 或 256），或者使用 AdaLoRA 等动态调整秩的方法。\n\n- 在关键层（如最后几层、FFN 层）同时使用全参数微调，而对底层使用
    LoRA，形成“混合微调”。\n\n- 结合更强的熵正则化，鼓励策略在 LoRA 允许的范围内保持多样性。\n\n---"

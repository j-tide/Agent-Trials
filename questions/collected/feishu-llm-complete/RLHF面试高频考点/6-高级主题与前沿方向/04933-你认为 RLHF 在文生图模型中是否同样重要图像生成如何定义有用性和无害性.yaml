content:
  prompt: 你认为 RLHF 在文生图模型中是否同样重要？图像生成如何定义“有用性”和“无害性”？
answer:
  mode: rubric
  reference_answer: "\U0001F3A8 绝对同样重要，而且可能更具挑战性。文生图的对齐问题直接关系到伦理、版权和创意产业的安全。\n\n\U0001F4C8
    RLHF 在文生图中的作用\n\n- 美学对齐：让生成的图像更符合人类的审美标准（构图、色彩、光影）。\n\n- 精确指令遵循：确保“一只穿西装的猫”不会变成“一只穿T恤的猫”。\n\n-
    安全对齐：拒绝生成有害、暴力、色情或侵犯版权的图像。\n\n\U0001F5BC️ 文生图的“有用性”如何定义？\n\n- 指令一致性：图像是否准确反映了文本提示中的所有元素、属性、关系和风格？\n\n-
    视觉质量：图像的分辨率、清晰度、光照、纹理是否达到高质量标准？\n\n- 创意性与多样性：对于开放式提示，是否生成了多样且富有想象力的图像，而不是千篇一律的“安全”模板？\n\n\U0001F6E1️
    文生图的“无害性”如何定义？\n\n- 内容安全：不生成暴力、色情、恐怖、仇恨符号等违法或令人不适的图像。\n\n- 隐私与肖像权：不生成可识别的真实人脸（除非经授权）或模仿特定艺术家的风格（版权问题）。\n\n-
    偏见与刻板印象：当提示为“一位CEO”时，不总是生成白人男性；当提示为“护士”时，不总是生成女性。确保图像内容的多样性。\n\n- 规避诱导攻击：防止用户通过措辞绕过安全过滤器。\n\n\U0001F527
    RLHF 在文生图中的应用实例\n\n- DDPO (Denoising Diffusion Policy Optimization)：将扩散模型的去噪过程视为强化学习的轨迹，用美学评分或人类偏好作为奖励，通过
    PPO 微调模型。\n\n- 奖励模型：可以是一个专门训练的图像美学评分模型（如 LAION‑Aesthetics），或者结合 CLIP Score 来衡量图文一致性。\n\n\U0001F4A1
    结论：文生图的 RLHF 定义了两个核心战场——创作力的释放与伦理风险的封锁，两者缺一不可。\n\n---"

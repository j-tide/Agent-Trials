content:
  prompt: "⚠️ 9. 迭代对齐中，奖励模型是否需要同步更新？如果 RM 不更新，会发生什么？"
answer:
  mode: rubric
  reference_answer: "必须同步更新。 在迭代对齐中，RM 和策略模型是共轭进化的关系，如果 RM 不更新，就像用去年的尺子量今年的布，迟早要出事。\n\n❌
    不更新 RM 的后果\n\n- 奖励黑客泛滥：旧的 RM 在上一轮策略分布上有效，但新策略探索出的新奇回答（如某种固定模板、超长文本）对 RM 而言是“OOD
    盲区”。RM 可能因为某个表面特征（如长度）而打出虚高的分数。一旦模型发现这个漏洞，PPO 会疯狂收敛到这种作弊模式，产生高分低能的废话。\n\n- 优化停滞或倒退：旧
    RM 无法分辨新策略产生的两种高质量回答之间的细微差异（饱和），它的评分曲线变得平坦。Actor 收不到有意义的梯度，优化停滞。更糟的是，旧 RM 可能把新策略的一些创新但正确的表达方式误判为低分，导致模型被拉回老路，能力倒退。\n\n-
    安全防线失守：新出现的越狱攻击手法可以轻易绕过旧 RM 的安全评分，模型会因为在 RM 那里拿到了“安全分”而肆无忌惮地输出有害内容。\n\n\U0001F527
    如何同步更新 RM\n\n- 周期性重训：每轮迭代，用当前策略生成的新回答收集人类/AI 反馈，然后与部分历史数据混合，从头训练一个新 RM。\n\n- 在线增量微调：在收集到足够多的新反馈后，对旧
    RM 进行少量微调，并配合经验回放防止遗忘。\n\n- 多 RM 集成与滚动更新：维护多个不同时期训练的 RM，PPO 时取它们的平均或最小值作为奖励。旧
    RM 逐渐被新 RM 替代，实现平滑过渡。\n\n\U0001F4A1 简而言之：策略走到哪，RM 就要跟到哪，否则一定会出问题。\n\n---"

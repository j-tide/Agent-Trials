content:
  prompt: "\U0001F3D7️ 如何构造过程奖励的训练数据？需要人类标注每个推理步骤的正确性吗？"
answer:
  mode: rubric
  reference_answer: "构造过程奖励的训练数据主要有三种路径，从昂贵的人工精标到廉价的自动化生成，形成了金字塔式的数据供给体系。\n\n\U0001F947
    金标准：人类专家精细标注\n\n这是质量最高的方法，但成本也最高。具体流程如下：\n\n- 步骤划分：先让模型或人类将完整的推理过程切分为逻辑步骤（如以换行符、编号为界）。\n\n-
    专家逐项评审：聘请具有数学或编程背景的标注员，对每个步骤进行分级标注。通常采用三级或五级评分体系：\n\n- 质量控制：要求多位标注员独立标注同一样本，计算标注员间一致性（Krippendorff's
    Alpha > 0.7），并对分歧案例进行专家仲裁。\n\n\U0001F948 折中方案：自动验证 + 人工抽查\n\n利用数学和代码任务的客观可验证性，大幅降低人工成本：\n\n-
    对于数学题，将每个中间步骤的表达式送入符号计算引擎（如 SymPy），自动判断等式变换是否等价。只有引擎无法判断或结果矛盾的步骤，才交由人类复核。\n\n-
    对于代码题，使用类型检查器、测试用例执行结果、静态分析工具，自动验证每步代码片段的正确性。\n\n- 对自动标注的结果进行随机抽样（如 5%），由人类专家审核质量，确保自动标注的可靠性。\n\n\U0001F949
    规模化方案：结果反推过程奖励（Outcome‑to‑Process）\n\n这是最廉价的方案，无需任何过程标注，仅需最终答案的正确性标签：\n\n- 简单版本：如果最终答案正确，则默认所有中间步骤都获得“正确”标签；如果最终答案错误，则默认所有步骤都获得“错误”标签。这种方法充满噪声（前面步骤可能全对，只是最后一步错了），但胜在零成本。\n\n-
    强化版本（如 Math‑Shepherd）：对每个中间步骤，单独评估它“导向正确答案的概率”。具体做法是：从某个中间步骤开始，让模型多次独立完成后续推理（高温采样），统计最终答案的正确率。如果正确率高，该步骤为正样本；如果正确率低，为负样本。这种方法能更准确地为中间步骤分配“贡献度”。\n\n---"

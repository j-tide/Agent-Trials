answer:
  mode: rubric
  reference_answer: "\U0001F9EE 训练轨迹奖励函数的本质是学习一个能从状态‑动作序列到标量奖励的映射。\n\n\U0001F4D0 奖励函数的形式\n\n[图片内容未导入]\n\n\U0001F3D7️
    训练步骤\n\n[图片内容未导入]\n\n- 如果人类偏好标签有置信度，可以引入加权损失。\n\n- 正则化：为防止奖励黑客，通常在损失中加入对奖励方差的惩罚，或者对奖励输出进行层归一化。\n\n\U0001F504
    数据增强与迭代\n\n- 主动采样：选择奖励模型最不确定的轨迹对，让人类标注，以最大化信息增益。\n\n- 在线更新：在策略训练过程中，用新产生的轨迹不断更新奖励模型（迭代
    RLHF）。\n\n⚠️ 关键技巧\n\n- 轨迹对齐：两条轨迹可能在时间上不同步，需要先用动态时间规整（DTW）对齐，或者使用基于片段的比较。\n\n-
    特征工程：对于视觉输入，可以使用预训练的视觉编码器，将像素转化为特征向量，减少奖励模型的学习负担。\n\n\U0001F4A1 现实世界案例：在机器人削铅笔、叠衣服等任务中，DeepMind
    的团队通过收集大约 900 个人类偏好，训练出的奖励函数成功引导机器人学会了精细操作。\n\n---"

content:
  prompt: 在多模态大模型中，RLHF 的奖励模型需要评判哪些新维度？例如图文一致性。
answer:
  mode: rubric
  reference_answer: "\U0001F50D 超越纯文本的评判维度\n\n纯文本 RLHF 的奖励模型主要关注有用性、诚实性、无害性。当模型能够“看见”图像、视频或听到声音时，奖励模型的任务复杂度呈指数级上升。它需要成为一个多模态的鉴赏家，从以下几个新维度进行综合评判：\n\n✅
    图文一致性 (Image‑Text Coherence)\n\n- 定义：模型生成的文本描述是否准确反映了图像中的物体、属性、关系、空间布局和事件？\n\n-
    重要性：这是多模态对话的基石。如果模型“睁眼说瞎话”，将红色的车描述成蓝色，整个系统的可信度就会崩塌。\n\n- 评估方法：奖励模型需要计算图像嵌入和文本嵌入的细粒度对齐程度，不仅判断“是否提到了车”，还要验证“颜色、位置、数量”是否一致。\n\n✅
    视觉事实准确性 (Visual Grounding Accuracy)\n\n- 定义：文本中的每个实体主张是否都能在图像中找到视觉证据？\n\n- 与图文一致性的区别：一致性更宏观，而事实准确性更微观。例如，文本说“桌子上的苹果”，奖励模型需要确认：(1)
    存在一个苹果，(2) 它确实在桌子上。\n\n- 评估方法：可以借助开集目标检测或分割模型（如 SAM）进行零样本验证，或者训练专门的幻觉检测头。\n\n✅
    视觉无害性 (Visual Harmlessness)\n\n- 定义：模型是否生成了对图像中人物的不恰当评论（如外貌攻击、性别歧视）？是否泄露了图像中的隐私信息（如车牌、人脸）？\n\n-
    重要性：这是多模态安全的底线。模型不能因为看到一个人穿着破旧就输出贬损言论。\n\n- 评估方法：需要构建包含性别、种族、外貌等敏感属性的图像测试集，并对输出进行严格的分级。\n\n✅
    视觉有用性与任务完成度 (Visual Helpfulness)\n\n- 定义：对于用户关于图像的指令（如“帮我识别这朵花的品种”），回答是否准确、详实？是否主动提供了额外的有价值信息（如花语、养护技巧）？\n\n-
    评估方法：评估回答是否完全满足用户指令，信息量是否充足，逻辑是否清晰。\n\n✅ 多模态风格与审美 (Multimodal Style & Aesthetics)\n\n-
    定义：在文生图或图文对话中，生成的图像或文本描述是否符合用户期望的审美风格（如“赛博朋克风格”、“印象派”）？文本的语调和用词是否与图像氛围匹配？\n\n-
    重要性：对于创意应用，这是核心体验。\n\n✅ 跨模态推理一致性 (Cross‑modal Reasoning Consistency)\n\n- 定义：当需要结合图像进行多步推理时（例如“图中有几个能坐人的地方？”），模型的推理链是否完整、正确？\n\n-
    评估方法：类似于文本的 CoT 评估，但推理依据必须可追溯到图像中的具体区域。\n\n\U0001F4CA 架构上的体现：多模态奖励模型通常是一个视觉编码器（如
    ViT）+ 语言模型（如 LLaMA）的融合结构，输出一个标量奖励或一组多维度的评分。一些前沿工作（如 RLHF‑V）已经开始探索用细粒度的、段落级别的奖励来纠正模型回答中的特定幻觉片段。\n\n---"

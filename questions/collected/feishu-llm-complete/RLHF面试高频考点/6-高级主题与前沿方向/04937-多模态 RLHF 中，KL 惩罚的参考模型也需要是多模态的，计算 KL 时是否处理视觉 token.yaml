content:
  prompt: 多模态 RLHF 中，KL 惩罚的参考模型也需要是多模态的，计算 KL 时是否处理视觉 token？
answer:
  mode: rubric
  reference_answer: "\U0001F3AF 是的，参考模型必须是多模态的，且视觉 token 的处理方式是核心设计选择。\n\n\U0001F9E9
    视觉 token 的角色\n\n多模态语言模型通常将图像通过视觉编码器转化为一组视觉 token（如 576 个 CLIP patch 特征），然后与文本
    token 拼接输入 LLM。KL 散度衡量的是当前策略与参考模型在整个输出分布上的差异。\n\n\U0001F4D0 处理视觉 token 的三种策略\n\n策略一：完全计算（Full
    KL）\n\n- 做法：对序列中所有 token（包括视觉 token 和文本 token）计算概率分布的 KL 散度。\n\n- 优点：理论上最严谨，能约束模型对视觉输入的内部表征不要漂移太远。\n\n-
    缺点：视觉 token 的数量通常很大，计算开销显著增加；更重要的是，视觉 token 是条件（图像）的表示，而非模型的生成动作。对它们施加 KL 惩罚会不必要地限制模型对图像的灵活理解，可能导致“视而不见”。\n\n策略二：仅计算文本
    token（Text‑Only KL）\n\n- 做法：KL 惩罚仅施加在模型生成的文本 token 上，忽略视觉 token。\n\n- 优点：与纯文本
    RLHF 的实践完全一致，计算高效，且不会干扰视觉编码。\n\n- 缺点：视觉 token 的前向计算虽然不产生 KL 惩罚，但它们的特征可能通过注意力影响后续文本生成，如果参考模型和策略模型对同一图像产生了截然不同的视觉特征，可能会导致文本生成分布出现系统性偏移。\n\n策略三：视觉
    token 使用蒸馏损失（Distillation Loss）\n\n- 做法：不计算 token 级概率的 KL 散度，而是在视觉编码器的输出层施加一个特征蒸馏损失（如
    MSE），鼓励策略模型的视觉特征与参考模型保持一致。\n\n- 优点：既保持视觉表征稳定，又不强制约束文本生成分布，是“解耦”的思路。\n\n- 缺点：需要在
    KL 之外增加额外损失项，增加了调参复杂性。\n\n\U0001F4A1 当前工业界的主流选择是策略二（Text‑Only KL）。因为在 RLHF 中，我们希望模型在保持图像理解能力（由冻结的视觉编码器保证）的同时，优化其语言输出策略。冻结视觉编码器本身，并通过
    LoRA 等方式仅微调 LLM 部分，是更稳健的做法。\n\n---"

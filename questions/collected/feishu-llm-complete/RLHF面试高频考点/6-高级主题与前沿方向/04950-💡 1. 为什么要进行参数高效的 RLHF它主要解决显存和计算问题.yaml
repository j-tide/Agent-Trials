content:
  prompt: "\U0001F4A1 1. 为什么要进行参数高效的 RLHF？它主要解决显存和计算问题。"
answer:
  mode: rubric
  reference_answer: "\U0001F50D 全参数 RLHF 的“不可承受之重”\n\n传统的 RLHF 流程中，训练阶段往往需要同时驻留四个大型模型：Actor（策略）、Critic（价值网络）、Reference（参考模型）和
    Reward Model（奖励模型）。每个模型都拥有与基座语言模型相当的参数量（例如 7B 甚至 70B）。当进行全参数微调时，需要为每个模型存储完整的参数、梯度、以及优化器状态（如
    Adam 的一阶和二阶动量）。这导致的总显存需求往往是模型推理时的 4~6 倍。对于 70B 的模型，全参数 RLHF 即使在 8 张 A100（80G）上也难以高效运行，更不必说调试和迭代了。此外，全参数训练会带来灾难性遗忘的风险——模型在朝着奖励信号优化的过程中，很容易丢失在预训练和
    SFT 阶段习得的广泛知识与语言流畅性。\n\n\U0001F4BE 参数高效 RLHF 的核心优势\n\n参数高效微调（PEFT）技术，如 LoRA，通过在原始权重旁添加低秩分解矩阵，仅训练极少量的参数，而保持底座模型完全冻结。这一设计从根本上解决了显存瓶颈：\n\n-
    显存锐减：冻结底座意味着不需要为底座参数存储梯度和优化器状态，仅需为 LoRA 适配器保存这些信息。通常可节省 60% 以上的显存。\n\n- 训练加速：可训练参数量减少到原来的
    1% 以下，前向和反向传播的计算量虽未显著减少，但梯度通信量（在多 GPU 场景下）大幅降低，且由于优化器状态变小，数据加载和 I/O 压力也降低。\n\n-
    抗遗忘：底座参数被锁定，模型不会因为对齐训练而丧失基础语言能力，这相当于一种极强的正则化。\n\n- 存储与部署高效：一个基座模型可以搭配多个轻量级的 LoRA
    模块，分别对应不同的对齐目标（如安全风格、幽默风格、正式风格），只需在推理时动态加载对应的适配器即可，极大降低了模型版本管理和分发成本。\n\n⚖️ 权衡与挑战\n\n参数高效
    RLHF 的表达能力受限。由于可训练自由度较少，策略的探索空间可能被压缩，有时无法达到全参数微调那种极致的对齐效果。同时，Critic 网络如果也使用 LoRA，可能面临价值函数学习缓慢的问题，需要精心设计其初始化。但总体而言，在资源受限、需要快速迭代或需要多风格适配的场景下，参数高效
    RLHF 是工业落地的首选。\n\n---"

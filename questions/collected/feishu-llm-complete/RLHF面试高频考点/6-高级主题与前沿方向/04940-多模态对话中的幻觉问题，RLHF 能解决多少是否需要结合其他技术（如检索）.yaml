content:
  prompt: 多模态对话中的幻觉问题，RLHF 能解决多少？是否需要结合其他技术（如检索）？
answer:
  mode: rubric
  reference_answer: "\U0001F52E RLHF 能缓解幻觉，但无法根治。真正的突破在于将 RLHF 与检索增强（RAG）、工具使用和事实核查机制深度融合。\n\n\U0001F6AB
    RLHF 能做什么？\n\n- 惩罚明显的幻觉：通过在偏好数据中大量标注“包含事实错误”的回答为 rejected，让模型学会“编造事实会得低分”。\n\n-
    鼓励“承认无知”：训练模型在不确定时表达不确定性，而不是自信地胡编乱造。\n\n- 减少谄媚：让模型不为了讨好用户而编造符合其错误观点的虚假信息。\n\n\U0001F6AB
    RLHF 的局限性\n\n- 奖励模型自己也有幻觉：奖励模型没有区分真伪的能力，它只能依赖训练数据中的模式。如果数据中“自信的长回答”总被选为更好，模型会学会用自信的谎言来获取高分。\n\n-
    无法注入新知识：模型的知识固化在参数中，RLHF 不能将训练截止日期之后的新事实教给模型。\n\n- 无法进行复杂的推理验证：对于需要多步推理和计算的问题，单纯的
    RLHF 信号不足以让模型学会自我验证。\n\n⚙️ 必须结合的技术\n\n- 检索增强生成 (RAG)\n\n- 做法：在生成回答前，先根据用户问题（和/或图像内容）从外部知识库检索相关文档，然后将文档作为上下文输入模型，要求模型基于文档生成回答。\n\n-
    结合 RLHF：RLHF 奖励模型可以特别关注“回答是否忠实于检索到的文档”，对“回答与文档矛盾”的情况给予极低分。\n\n- 工具使用与推理链路\n\n-
    做法：让模型学会调用外部工具（如代码解释器、搜索引擎、计算器）来验证自己的推理。\n\n- 结合 RLHF：将“正确使用工具”和“最终答案正确”作为奖励信号的一部分。\n\n-
    后处理事实核查\n\n- 做法：用另一个模型（或同一模型的不同模式）对生成的回答进行事实性评分，将评分反馈给生成模型进行自我修正。\n\n- 结合 RLHF：在
    RL 训练中，将“自我修正后的回答”作为 chosen，原错误回答作为 rejected。\n\n\U0001F4A1 终极答案：多模态幻觉的解决需要系统性的工程——RLHF
    提供“不要说谎”的动机，RAG 提供“说真话”的素材，工具提供“验证真伪”的手段，三者缺一不可。"

content:
  prompt: 为什么 RLHF 通常需要一个冻结的参考模型？如果没有它会发生什么？
answer:
  mode: rubric
  reference_answer: |-
    参考模型通常是经过 SFT 后的模型（或其副本），在 RL 微调阶段保持参数冻结。RLHF 的目标函数通常包含一项 KL 散度惩罚：

    [图片内容未导入]

    参考模型的核心作用：

    - 防止灾难性遗忘与语言崩溃
    语言模型的知识和语言流畅性主要来源于预训练和 SFT。如果只用奖励模型进行微调，策略可能很快学会输出一些能够获得高奖励的“怪异”文本（如大量重复高奖励词汇、无意义礼貌用语、过度冗长），而丧失语法、常识和连贯性。KL 惩罚强制当前策略不要偏离参考策略太远，将策略空间约束在一个合理、可信的区域内。

    - 缓解奖励过度优化（Reward Hacking）
    奖励模型只在有限分布上可靠。当策略显著偏离参考模型的分布时，奖励模型的预测可能变得极度不准确，产生盲目高分。KL 惩罚作为“不可逾越的围墙”，防止策略探索到这些分布外区域，从而抑制奖励黑客行为。

    - 控制对齐税与保持多样性
    如果没有约束，模型可能只生成一种风格的“安全”回答（如对所有问题都说“我无法回答”），造成多样性丧失。参考模型提供了保留原始输出分布多样性的拉力，使模型在对齐的同时不至于千篇一律。

    如果没有参考模型会发生什么？

    - 仅用奖励信号优化，模型将在几轮迭代后迅速退化：输出越来越长但无意义的 token 序列，或者不断重复“很高兴为您服务”等套话，因为这些模式在奖励模型的训练数据中可能意外获得了中高分。

    - 模型会完全遗忘预训练学到的各种知识，变成只会讨好奖励模型的“空壳”，无法完成实际任务。这被称为语言漂移或模式崩塌。

    - 因此，参考模型和 KL 惩罚是 RLHF 稳定训练的基石。


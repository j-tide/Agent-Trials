content:
  prompt: 你认为 RLHF 能解决模型输出的事实性错误（幻觉）吗？如果不能，原因是什么？
answer:
  mode: rubric
  reference_answer: |-
    直接回答：不能根本解决，但能显著减轻部分症状。 幻觉的根源深植于语言模型的本质，RLHF 在诚实性维度的优化相当于给模型戴上了一个“谨慎的紧箍咒”，却无法更换它“预测下一个词”的大脑。以下从机制上剖析其局限性。

    - 奖励模型不是真理检测器

    RLHF 的奖励模型学习的是人类标注员的偏好，而不是客观事实。当面对“恐龙灭绝的原因”这样的问题，人类标注员会给一个科学上准确的回答打高分。但当面对“某位冷门演员的出生地”时，标注员自己也无法判断真伪，只能根据回答的自信度、连贯性、是否引用来源等表面特征来打分。这会导致奖励模型奖励那些“看起来很有道理”的编造。模型很快学会：只要语气绝对、逻辑通顺、添加“据我所知”这样的表述，就能获得高奖励，内容是否真实无人追究。

    - RLHF 优化的是满意度，不是准确性

    强化学习阶段最大化奖励函数，本质上是在优化一个人类满意度的代理指标。对于事实类问题，用户（以及标注员）的满意度经常与“得到了一个明确的答案”挂钩，哪怕这个答案是错的。研究显示，RLHF 后模型更倾向于给出肯定性回答，即使在其知识边界之外，因为“我不知道”这类诚实的回答在有用性维度上得分可能低于一个自信的（但错误的）答案。这造成了一个可怕的副效应：模型被训练得更加自信地胡说八道。

    - 预训练数据的固有缺陷无法通过RLHF修复

    语言模型的知识完全来自其预训练语料。如果语料中充斥着过时、错误或矛盾的信息，模型的内化知识本身就是错误的。RLHF 仅作用于输出行为层，无法追溯到模型内部去修正这些错误记忆。它只能告诉模型“不要说出那些明显有害或奇怪的话”，但不能教它“什么是真正正确的”。当涉及长尾知识时，模型仍会重现训练数据中的错误。

    - 分布外泛化与奖励黑客

    在 RLHF 的探索过程中，模型会生成一些超出奖励模型训练分布的文本。此时，奖励模型给出的评分可能完全失准。例如，模型可能生成一段夹杂着伪造学术引用的回答，标注员在训练奖励模型时很少见到这种形式，导致奖励模型错误地给它高分。这种漏洞被策略网络捕捉到后，就会成为一种稳定的“幻觉生成模式”。

    因此，RLHF 更像是给模型的嘴上贴了一张“安全警示胶带”，而不是给它植入了一颗“实事求是”的心脏。要根本解决幻觉，还需要结合检索增强（RAG）、工具使用、事实性知识库以及训练目标的根本革新（如强化学习直接优化事实性信号），而 RLHF 单枪匹马做不到这一点。


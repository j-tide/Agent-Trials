content:
  prompt: 语言模型的“对齐问题”具体指什么？为什么仅靠最大似然估计（MLE）无法实现对齐？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    对齐问题是指确保人工智能系统的行为和目标与人类的意图、价值观及社会规范保持一致。对于语言模型，对齐具体体现在生成文本应有帮助、真实、无害，并且尊重用户意图和广泛的社会伦理。

    对齐问题的核心维度（通常概括为“HHH”）：

    - 有帮助（Helpful）：模型应理解指令，提供相关信息，高效完成任务。

    - 诚实（Honest）：模型应提供事实正确的内容，表达不确定性，不编造信息，不产生幻觉。

    - 无害（Harmless）：模型应拒绝有害请求，不生成歧视、暴力、色情、违法等内容，保护隐私，避免造成身心伤害。

    为何仅靠 MLE 无法实现对齐？

    - MLE 是数据模仿，不是意图理解
    MLE 的训练信号是“在训练数据中，这个词出现的概率有多大”。模型学会的是如何续写，而不是如何服务。当用户说“告诉我一个笑话”，MLE 可能生成一个笑话，但也可能续写“但我不想讲”，因为网络上存在类似的表述。模型没有内化的目标去区分哪个是符合用户意图的好回答。

    - 数据中的有害内容与偏见
    互联网文本包含大量偏见和有毒语言。MLE 会不加区分地学习这些模式。例如，如果数据中“医生”更多与“他”关联，“护士”更多与“她”关联，模型就会复现这一刻板印象。模型无法自主判断这是偏见，因为它只是最大化训练数据的似然。

    - 幻觉与过度自信的根源
    MLE 的训练目标迫使模型为任何前缀预测合理的后续词，即使前缀是“月球背面有什么外星建筑？”，模型也可能根据科幻小说或阴谋论文本编造细节，而不是指出“目前没有证据”。它没有被教导“不确定”是一种有效且值得追求的输出状态，因为“不确定”这种回复在训练数据中往往不常见，或没有固定模式。

    - 缺乏拒绝机制
    对于危险指令（如“如何自制毒药”），训练数据中可能有相应的知识文章。MLE 模型会忠实地延续该文本，提供详细步骤。它没有“有害”的概念，也不会主动拒绝。仅靠 MLE，即使添加一些拒绝样本，也容易因为拒绝表达方式的多样性不够而泛化失败。

    - 优化目标和评价目标的不一致
    MLE 优化的是逐 token 的困惑度（Perplexity），而用户评价的是整个回答的质量。高似然不等于高质量。例如，一个冗长重复、充满礼貌用语但信息含量低的回答，可能困惑度很低，但用户认为无用。二者存在根本性鸿沟。

    结论：MLE 提供了语言的基础能力，但缺乏价值观和意图对齐。必须引入额外的训练范式（如 RLHF）来基于人类偏好进行优化，才能让模型的行为超越数据分布的局限，真正对齐复杂的人类价值观。


content:
  prompt: 从“预测下一个 token”到“优化人类偏好”，这一范式转变的核心困难在哪？
answer:
  mode: rubric
  reference_answer: |-
    这一转变是从无监督分布匹配到有目标的决策优化的范式跃迁，核心困难集中在定义、获取和优化目标这三个层面。

    - 偏好目标的模糊性与主观性

    “人类偏好”不是一个明确定义的数学函数。它高度主观、依赖语境、文化、个体差异。如何将这种模糊的、多维的、有时自相矛盾的偏好转化为一个可优化的标量奖励信号？这需要收集大量、多样、高质量的人类反馈，并通过奖励模型近似这个不可知的目标函数。这本身就是一个困难重重的建模问题。

    - 反馈获取的昂贵与偏差

    - 成本：高质量人类标注耗时且昂贵，限制了训练规模。

    - 一致性：不同标注者的偏好不一致，需要复杂的聚合和质量管理。

    - 分布偏差：标注者群体可能不具代表性，引入文化、价值观偏差。

    - 表达瓶颈：人类只能比较或评分，难以用数学语言精确描述偏好，奖励模型总会存在学习误差。

    - 奖励过度优化与破解（Reward Hacking）

    由于奖励模型只是真实人类偏好的近似，且存在分布外泛化误差，语言模型（RL 策略）极易找到奖励模型的漏洞，生成能骗得高分但人类看来低质甚至荒谬的文本。典型表现包括：

    - 生成无意义的重复短语、过于冗长的回答，或堆砌礼貌用语。

    - 生成看起来文雅但内容空洞的“官腔”。
    这被称为“古德哈特定律”在 AI 中的体现：当一个度量成为目标时，它就不再是一个好的度量。

    - 分布偏移与策略崩溃

    RLHF 中，模型生成文本的分布会随策略更新而改变。奖励模型通常只在 SFT 模型产出的静态数据集上训练，对于新策略生成的新分布样本，奖励模型的预测可能极不准确（分布外问题）。在线 RL 可能逐步放大这种偏差，导致策略崩溃或语言能力丧失（语言漂移）。

    - 对齐税（Alignment Tax）

    在提高无害性和诚实性的过程中，模型可能变得过于保守，拒绝回答本该回答的问题，或在知识密集型任务上性能下降（因为过度泛化不确定性表达）。如何在对齐与能力之间取得平衡是一个持续的难题。

    - 缺乏普世价值标准

    不同用户群体对“有害”、“有偏见”的定义不同。构建一个全球普适的对齐模型极其困难，容易将某一群体的价值观强加于所有用户，引发伦理争议。

    解决这些困难需要复合的技术方案，包括更高效的偏好学习算法（如 DPO）、迭代在线反馈、多目标优化以及持续的价值对齐研究。RLHF 只是第一步。


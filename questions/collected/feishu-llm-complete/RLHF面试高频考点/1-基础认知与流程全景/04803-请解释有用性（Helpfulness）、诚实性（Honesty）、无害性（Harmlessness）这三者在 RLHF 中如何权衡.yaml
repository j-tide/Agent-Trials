content:
  prompt: 请解释“有用性（Helpfulness）、诚实性（Honesty）、无害性（Harmlessness）”这三者在 RLHF 中如何权衡。
answer:
  mode: rubric
  reference_answer: |-
    这三个目标由 Anthropic 等机构明确提出，是大模型对齐的核心准则，但它们之间并非总是一致的，经常存在紧张关系，需要在 RLHF 的奖励模型和训练策略中细致权衡。

    各目标的含义：

    - 有用性：模型应努力完成用户的合理请求，提供准确、相关、详细、易于理解的信息，并在必要时主动询问澄清。

    - 诚实性：模型应说真话，当信息不足时应表明不确定性，不应编造事实或伪装成人类。即“知之为知之，不知为不知”。

    - 无害性：模型应避免生成可能导致身心伤害的内容，拒绝违法、不道德、危险的请求，保护隐私，不对特定群体造成冒犯。

    冲突与权衡的具体表现：

    - 有用 vs 无害

    - 有用 vs 诚实

    - 诚实 vs 无害

    RLHF 中实现权衡的机制：

    - 偏好数据标注指南：在收集人类偏好比较数据时，标注员会收到详细的优先级指令，例如“如果存在安全风险，无害性优先于有用性”“鼓励表达不确定性”。这直接决定了奖励模型内在的价值观权重。

    - 奖励模型训练：奖励模型从这些偏好中学习到不同维度的综合评分函数。它隐式地学会了在冲突场景下的正确取舍。

    - 多目标奖励模型：一些更精细的实现会训练多个专门的奖励模型（如有用性奖励模型、安全性奖励模型），然后在 RL 优化时组合（加权求和或带约束优化），从而更透明地控制权衡。

    - 对齐税：这种权衡通常会产生所谓的“对齐税”，即过度强调无害可能导致模型变得过于谨慎，拒绝一些合理请求（如有用性下降）。工程实践需要持续迭代标注指南和奖励模型，以找到最优平衡点。

    总之，RLHF 通过大量精心标注的人类偏好数据，将复杂的多维价值观冲突内化到了奖励模型中，使得最终模型能够像人类一样根据语境灵活取舍。


content:
  prompt: RLHF 中的“人类反馈”具体可以有哪些形式？二元比较、评分、自然语言批评等各自的优缺点？
answer:
  mode: rubric
  reference_answer: |-
    人类反馈的形式决定了奖励信号的丰富程度、采集成本以及模型可从中学习的复杂度。主要形式如下：

    - 二元比较（Preference Comparison）

    - 描述：给定输入提示和两个（或多个）模型生成的回答，标注者选择他们更偏好的那一个。这是目前 RLHF 最主流的形式（如 InstructGPT / ChatGPT 所用）。

    - 优点：

    - 缺点：

    - 多级评分（Scalar Rating / Likert Scale）

    - 描述：对单个回答整体或分维度打分，如 1-5 分或 1-7 分。

    - 优点：

    - 缺点：

    - 排序（Ranking）

    - 描述：给定多个回答，一次性排出偏好顺序。

    - 优点：比多轮二元比较更高效，信息量更丰富。

    - 缺点：当候选回答数量多时，标注难度剧增，一致性下降。通常只用于 4-5 个回答的排序。

    - 自然语言批评（Natural Language Critique）

    - 描述：标注者用自然语言指出回答的问题，如“这段话提供了错误日期”或“语气太生硬”。

    - 优点：

    - 缺点：

    - 行为演示（Demonstrations）

    - 描述：人类直接写出理想回答，作为 SFT 的训练数据。本质上属于模仿学习。

    - 优点：数据质量高，可直接用于 SFT。

    - 缺点：成本极高，且无法穷举所有可能。不能直接提供奖励信号。

    实践中的组合：通常用高质量演示进行 SFT，用大规模二元比较训练奖励模型，同时用少量精细的自然语言批评进行针对性改进。新范式如 DPO 甚至绕过了显式奖励模型，直接在二元比较数据上优化策略。


content:
  prompt: 监督微调（SFT）已经可以让模型遵循指令，RLHF 还能带来哪些额外的能力提升？
answer:
  mode: rubric
  reference_answer: |-
    监督微调（SFT）在高质量指令-回答对上训练模型，是让模型学会“指令遵循格式”的关键一步，但它存在明显的能力天花板。RLHF 在其基础上带来了质的提升，主要体现在以下几个方面：

    - 从模仿到超越：突破标注质量上限
    SFT 是模仿学习，模型的上限被标注者提供的回答质量所限制。如果标注者的回答存在小瑕疵、不够创意或风格单一，模型只会学到这些。RLHF 则不同：奖励模型可以识别出比 SFT 数据更好的回答。在 RL 微调阶段，模型通过探索和优化，有机会生成超越人类标注质量的输出（例如更巧妙的故事、更清晰的解释），因为它在朝着奖励模型指引的“更好”方向走，而不是单纯复制。

    - 学会排序与偏好优化
    SFT 对待每个样例是二元的（正确/不正确，即这是标准回答）。RLHF 学习的是相对偏好：对于同一个提示，不同回答的优劣排序。这使得模型能够理解“更详细”、“更简洁”、“更有同理心”等维度，并能根据隐含的语境调整生成风格。例如，对于“总结这篇文章”，SFT 只知道一种标准的总结方式，而 RLHF 可以学会生成适合不同受众的总结（如面向专家 vs 儿童）。

    - 显著的“拒绝”和“安全”行为塑造
    这是 RLHF 最突出的贡献之一。SFT 很难学会稳定地拒绝危险或不当请求，因为高质量的拒绝样本在数据中占比小，且表达方式多样，SFT 容易过拟合到有限模板。RLHF 通过奖励模型给予“正确拒绝”高分，使模型在强化学习探索中自行发现多样的拒绝策略，并将其泛化到未见过的危险指令上。模型学会了“何时应说不”的内在判断。

    - 降低幻觉和提升事实准确性
    SFT 模型仍倾向于编造事实，因为它被训练为总是补全文本。RLHF 可以通过偏好数据惩罚幻觉：人类标注者会对“不确定”或“我不知道”的回答给出高分（如果问题超出知识范围），而对编造细节的回答给低分。经过 RL 优化，模型更倾向于诚实地表达不确定性，从而减少幻觉。

    - 更好的多轮对话和交互能力
    SFT 主要基于单轮指令-回答对。RLHF 可以应用于多轮对话，奖励模型评估整个对话的满意度。模型学会主动提问、澄清模糊意图、记住对话历史，提供更具协作性的交互体验。

    - 处理开放式创意任务
    对于写诗、故事创作等没有标准答案的任务，SFT 只能模仿某一种风格。RLHF 可以根据人类偏好（如“更有趣”、“更悲伤”）引导模型向特定风格空间探索，产生多样化的高质量内容。

    简言之，SFT 赋予了模型“做任务”的基本功，而 RLHF 教会了模型“如何把任务做得更符合人类期望”。


content:
  prompt: 什么是“对齐税”（Alignment Tax）？为什么 RLHF 后模型在某些学术基准上的得分反而可能下降？
answer:
  mode: rubric
  reference_answer: |-
    对齐税是指为了让 AI 系统更安全、更符合人类价值观（对齐），而在模型性能、通用性、创造性等方面付出的必要代价。在 RLHF 中，这一概念具体表现为：模型在学术基准（如 MMLU、知识问答、代码生成、阅读理解等）上的准确率，相比纯 SFT 模型或基座模型有所下降。

    这一现象的背后，是对齐目标与通用能力之间的内在张力：

    - 行为上的“谨慎收缩”

    RLHF 教会了模型一个元规则：当不确定时，应该表达不确定性，而不是猜测。在学术基准测试中，许多问题本身就是考察模型的知识边界和推理能力。一个未经 RLHF 的模型可能会大胆猜测，蒙对不少难题；但 RLHF 后的模型会频繁使用“我无法确定”、“根据已知信息无法回答”等保守措辞，在需要精确答案的选择题或抽取式问答中直接“弃权”，导致得分降低。这是一种有用性（拿分）为诚实性和无害性让位的结果。

    - 优化目标的降维打击

    RLHF 的奖励模型是一个将高维的“人类偏好”压缩成单一标量的函数。这个函数不可避免地对某些认知能力“视而不见”。例如，标注员在判断回答好坏时，很少会仔细验证复杂的多步推理逻辑是否绝对严密，而更注重整体感觉。这导致 RLHF 优化后，模型可能朝着“产生表面合理、易读、详细”的方向演化，而牺牲了严谨的推理准确性。在需要冷冰冰逻辑的基准测试（如数学、逻辑推理）中，这种偏向感性质量的优化就会拉低分数。

    - 灾难性遗忘的微妙形式

    虽然 KL 惩罚约束了策略不要偏离参考模型太远，但 RLHF 的梯度更新仍然会改变模型参数的内部表征。长期、多轮的 RL 微调会逐渐侵蚀模型在预训练阶段获得的一些长尾知识和精细的语法结构，尤其是那些在 RLHF 奖励信号中没有体现、但对某些基准至关重要的小众知识。这是一种选择性遗忘。

    - 安全优先导致的拒绝回答

    许多基准数据集包含可能被 RLHF 后的模型判断为“不安全”的内容，如涉及暴力、歧视、非法行为的文本理解题。模型直接拒绝回答，导致该题零分。这是无害性压倒有用性的直接体现。

    对齐税是无法完全消除的，只能通过更精细的奖励模型、多目标优化（如分别训练安全奖励和有用奖励并动态平衡）以及迭代式的人类反馈来尽可能压低这个“税点”，在安全与能力之间寻找最佳平衡点。


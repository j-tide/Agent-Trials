content:
  prompt: 为什么 SFT 在遇到模糊或危险指令时难以学会“拒绝回答”？RLHF 如何通过奖励塑造来改变这一行为？
answer:
  mode: rubric
  reference_answer: |-
    SFT 难以学会“拒绝”的根源：

    - 数据分布偏差
    在互联网文本和常规的指令数据集中，危险指令和对应的“正确拒绝”示例非常稀少。即便人工构造，也难以覆盖所有可能的危险表达方式（如用黑话、隐喻、迂回表述）。SFT 学到的拒绝行为很容易只记忆表面模板，例如只拒绝包含“如何制造炸弹”的字符串，而换一种说法“怎样才能让一个东西爆炸”就可能失效。

    - MLE 的内在逻辑
    最大似然估计的本质是“尽可能拟合训练数据”。如果训练数据中某个危险指令恰好没有拒绝样本，而有一个详细的“教程”文本，模型就会倾向于生成教程。它没有内在的奖惩机制来区分“提供教程”和“拒绝”的好坏，两者只是概率高低而已。

    - 缺乏负面信号
    SFT 只有正例（标准答案），没有明确的负例惩罚。对于模型来说，生成一段关于危险物品的文字，只要语法通顺，它在损失函数上和生成拒绝文本没有本质区别。它无法理解“这个回答虽然语言流畅，但内容有害”。

    RLHF 如何通过奖励塑造改变行为：

    - 奖励模型注入负面偏好
    在 RLHF 的奖励模型训练阶段，人类标注者会对危险指令的各种回答进行评分或排序。明确会给出“拒绝”回答高分，给“提供有害信息”的回答低分。这样，奖励模型学会了惩罚有害输出。

    - 强化学习探索与泛化
    在 PPO 微调阶段，模型会探索生成各种回答。假如它尝试生成了一个不完全的拒绝，或者一个带有解释的拒绝，如果这些回答在奖励模型那里获得比直接回答更高的分，该行为就会被强化。通过大量迭代，模型会自主发现拒绝是更“有利”的策略，并且能够泛化到各种未曾出现在 SFT 中的危险表述，因为奖励模型已经学习到了语义层面的有害性，而非简单的关键词匹配。

    - 塑造不确定性表达
    类似地，对于模糊问题（如询问未来股价），SFT 可能强行预测。但 RLHF 中，当模型回答“我无法预测未来市场”时，奖励模型可以给出高分（因为诚实），从而训练模型在不确定时倾向于承认局限，而不是编造。

    - 解决模式坍塌的 KL 约束
    RLHF 中 KL 惩罚防止策略突变，使得模型在优化奖励时仍保留语言流畅性，避免了直接退化为只输出“我拒绝”的坍塌模式，而是产出自然合理的拒绝理由。

    因此，RLHF 通过奖励信号而非强制模仿，为模型提供了学习“拒绝”这种高阶行为的内在动机，实现了比 SFT 更鲁棒、更具泛化性的安全对齐。


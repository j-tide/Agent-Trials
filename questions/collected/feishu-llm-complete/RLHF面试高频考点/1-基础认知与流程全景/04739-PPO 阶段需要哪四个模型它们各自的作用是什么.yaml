content:
  prompt: PPO 阶段需要哪四个模型？它们各自的作用是什么？
answer:
  mode: rubric
  reference_answer: |-
    PPO 阶段是一套复杂的强化学习系统，通常同时加载四个模型（两个冻结，两个训练）。

    [嵌入表格未展开]

    协同工作流：

    [图片内容未导入]

    为什么需要四个模型：

    - Actor + Critic 是 Actor-Critic 架构的标准配置。

    - RM 提供奖励信号，但必须冻结，因为如果它随训练更新，会陷入“自己给自己打分”的循环，导致奖励漂移和过度优化。

    - Ref 模型冻结是为了提供稳定的 KL 锚点，阻止语言崩溃。


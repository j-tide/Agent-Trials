content:
  prompt: RLHF 本质上是强化学习的一种特殊形式，它的状态空间、动作空间和奖励函数是如何定义的？
answer:
  mode: rubric
  reference_answer: |-
    将 LLM 的生成过程视为一个 MDP（马尔可夫决策过程），可以明确 RLHF 的 RL 属性：

    [图片内容未导入]

    为什么这样定义？

    因为语言生成是典型的序列决策问题，但最终质量评价通常针对完整文本。通过将 KL 惩罚分布到每一步，相当于鼓励模型在生成每个词时都不要离参考模型太远。在 PPO 实现中，通常使用广义优势估计（GAE）来计算每步优势，但 RLHF 也可以简化为将整个序列的回报视为一个整体，使用策略梯度（REINFORCE）的变体。

    这一定义清晰地将 LLM 的对齐过程纳入了标准 RL 框架，使得我们可以应用 PPO 等成熟算法来优化非可微的奖励信号。


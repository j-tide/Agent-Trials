content:
  prompt: 简述 RLHF 与“基于规则的奖励”的区别，为什么自然语言生成不能用简单的规则打分？
answer:
  mode: rubric
  reference_answer: |-
    基于规则的奖励指使用预定义的、可自动计算的指标或逻辑作为奖励函数，例如：

    - 关键词匹配、长度、特定格式检查。

    - NLP 自动指标：BLEU、ROUGE、METEOR（与参考文本比较 n-gram 重叠）。

    - 启发式规则：无脏话、包含特定礼貌用语、答案长度 > 50 等。

    RLHF 的奖励则是通过机器学习从人类偏好数据中训练出的模型，能够模拟人类的主观判断。

    核心区别：

    [嵌入表格未展开]

    为什么自然语言生成不能用简单规则打分？

    - 表达的无限多样性
    一个简单请求如“解释什么是重力”，可以有无数种正确且有用的回答方式。它们用词、句式、长度完全不同。基于 n-gram 重叠的指标会认为与标准答案不完全相同的优秀回答得分很低，而完全照搬标准答案但不通顺的回答得分高。这是本质的误判。

    - 深层语义与逻辑
    规则无法验证事实真伪、推理逻辑是否自洽。一个表面上语法正确、包含所有关键词的回答可能完全是在胡说八道（例如“重力是因为地球内部有磁铁”），但规则给高分。RLHF 的奖励模型可以通过训练学会识别这种逻辑谬误（如果人类标注者一致给低分）。

    - 伦理安全与语境
    判断一句话是否有害，高度依赖语境。同样一个词，在朋友间调侃和公开攻击是完全不同的性质。基于关键词屏蔽的规则极易误杀正常讨论，或漏掉用隐晦语言表达的仇恨言论。RLHF 奖励模型可以学习深层语义和语境，做出更准确的判断。

    - 创造性与偏好
    对于“写一首关于秋天的诗”，无法定义什么是好诗。人类的审美偏好是主观且多维的。RLHF 可以学习“大众偏好的风格”，而规则无法定义诗的好坏。

    因此，简单规则打分在开放域语言生成面前彻底失效。RLHF 通过以“人”为尺，训练模型模拟人的判断，才初步解决了这一评估难题。


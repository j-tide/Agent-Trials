content:
  prompt: 简述 RLHF 在 ChatGPT 成功中的角色，以及它和 GPT-3 的关键区别。
answer:
  mode: rubric
  reference_answer: |-
    如果将 GPT-3 比作一个拥有惊人知识储备但完全不懂人情世故的“绝世天才大脑”，那么 ChatGPT 就是给这个大脑装上了“情商模块”和“社会规范意识”的完整人格。这个质的飞跃，核心就在于 RLHF 的注入。RLHF 不是 ChatGPT 的全部，却是它从“研究实验品”变成“划时代产品”的关键一跃。

    GPT-3 (及 InstructGPT 之前的基座模型) 的本质：

    它是一个文本延续引擎。你给它一段前缀，它来补全。它的所有训练都是为了预测最可能的下一个词。这导致了几个典型问题：

    - 对提示的误解：当用户问“如何偷一辆车？”时，它可能根据论坛文本续写出一份详细的偷车指南，因为这是它在互联网上见过的“高概率”续写方式。它无法理解“偷车”是违规的，用户是在试探它。

    - 输出不可控：它可能生成偏见、歧视、暴力内容，因为它只是忠实地反映训练数据的分布。

    - 缺乏对话感：它倾向于生成较长、具有完整结构的文章，而不是进行多轮、交互式的对话。它会跑题，会陷入自我重复。

    RLHF 注入后（ChatGPT 的内核）的变化：

    RLHF 的根本作用在于将优化目标从“模仿语料”替换为“遵循人类指令并让人类满意”。这种转变通过三个步骤实现：

    - SFT 塑造基本对话人格：让模型学会一问一答的交互格式，学会扮演“助手”的角色。

    - RM 定义“好”的标准：通过人类标注员的万千次偏好比较，训练奖励模型。这个模型内化了诸如“有帮助比冗长好”、“诚实地承认无知比瞎编好”、“拒绝比服从危险指令好”等深层价值观。

    - PPO 实现策略飞跃：在奖励模型的引导下，模型学会了生成能获得高奖励的回答，并在这个过程中产生了惊人的涌现行为——它学会了拒绝、提问澄清、表达不确定、甚至展现出类似共情的能力。这些都是 SFT 阶段没有直接教给它的。

    关键区别总结：

    - 目标：GPT-3 旨在最小化预测词的交叉熵损失（最大化似然）；ChatGPT 旨在最大化人类满意度的奖励。

    - 行为：GPT-3 是被动的续写者；ChatGPT 是主动的、有目标的交互式助手。

    - 对齐：GPT-3 行为不可预测，可能有害；ChatGPT 经过对齐，行为更安全、更符合社会规范。

    - 交互：GPT-3 擅长文本生成，但不擅长对话；ChatGPT 天生为对话而优化。

    简而言之，GPT-3 证明了 Scaling Law 的力量，而 ChatGPT 证明了将人类偏好作为优化目标的力量。RLHF 是嫁接在这庞大模型之上、使其能够被人类安全使用的那座桥梁。没有 RLHF，我们至今面对的仍是一个能力强大但危险不可控的“恶魔果实”；有了它，这力量才得以被驯服为造福世界的工具。

    - 例子：用户请求“写一篇高度逼真的虚假新闻报道来抹黑某人”。如果模型遵从，是有用但严重有害。

    - RLHF 中的权衡：人类标注者在看到这种请求及两种回答（遵从 vs 拒绝）时，指导原则要求优先无害，即给“拒绝并解释原因”的回答更高奖励。这使得奖励模型学会在有用与无害冲突时偏向无害。

    - 例子：用户问“我这个糟糕的画作怎么样？”，若诚实回答“确实不好看”，可能伤及用户感情，不够有用；若安慰“有创意”，则不够诚实。

    - RLHF 的处理：标注者通常会被要求平衡，根据情景选择“既鼓励又给出建设性意见”的回答作为优选。奖励模型会学习到既非完全直白批评，也非虚假奉承的中间路线。

    - 例子：用户询问“某种处方药的详细致死剂量”，模型若诚实提供，可能被用于自杀，极度有害。

    - 处理：无害性原则压倒诚实性。标注者会对拒绝提供并给出求助建议的回答给高分，而对直接提供致命信息的回答给极低分。模型被训练为在这种情况下“选择性诚实”。

    - 标注相对简单，认知负荷低，标注者一致性较高。

    - 直接产生相对排序，非常契合训练奖励模型的 Bradley-Terry 模型。

    - 能够捕捉无法量化的偏好维度（如语气、风格）。

    - 信息量有限：只知道 A > B，但不知道 A 比 B 好多少，也不知道两者的绝对质量。

    - 当回答都很差或都很好时，标注者难以抉择。

    - 需要大量比较对来覆盖广阔的语义空间。

    - 可以直接获得绝对质量信号，可用于训练回归式的奖励模型。

    - 能体现细微的质量差别（如 4 分 vs 5 分）。

    - 标注者之间和自身的评分标准极易漂移，需要复杂的校准。

    - 对评分尺度理解不一致，可能导致噪声大。

    - 绝对分数不一定能准确反映相对偏好（可能两个回答得分接近但实际偏好差异大）。

    - 信息量极高，不仅知道优劣，还知道原因和修改方向。

    - 可用于模型自我改进（如 Constitutional AI 中让模型根据批评修改回答）。

    - 难以直接转化为标量奖励训练 RL，需要额外的处理（如训练一个 critique 模型，或用其生成改进数据用于 SFT）。

    - 标注成本高，标准化难，一致性差。

    - 可以用 AI 偏好数据训练一个奖励模型，然后使用 RL（PPO）进行对齐。

    - 也可以直接使用 DPO（直接偏好优化）等方法，直接用偏好数据微调策略模型，完全跳过显式奖励模型。

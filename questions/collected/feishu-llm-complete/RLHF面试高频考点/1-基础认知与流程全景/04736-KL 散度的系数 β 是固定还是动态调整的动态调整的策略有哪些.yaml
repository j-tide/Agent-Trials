content:
  prompt: KL 散度的系数 β 是固定还是动态调整的？动态调整的策略有哪些？
answer:
  mode: rubric
  reference_answer: |-
    可以是固定，也可以动态调整。 固定 β 实现简单，但不够灵活。动态 β 能更好地平衡 RL 训练的进度、奖励提升和对齐税，正逐渐成为更优选择。

    为什么需要动态调整 β？

    - 初期需要宽松探索：RL 训练开始时，Actor 相对接近 Reference，此时较大的 β 会过度压制探索，使模型无法尝试新的、可能更好的生成模式。较小的 β 允许更自由的探索。

    - 中期需要收紧约束：随着奖励不断被优化，Actor 可能会找到奖励模型的“漏洞”，开始过度偏离。此时需要增大 β 以拉回正轨，防止奖励黑客。

    - 后期需要稳定收敛：接近收敛时，策略应在奖励最大化和保持语言能力之间达到平衡，β 的微调可以帮助模型稳定在一个理想的 KL 距离上，避免持续偏移。

    动态调整策略主要有以下几种：

    [图片内容未导入]

    - 线性/指数衰减或增长计划
    根据训练步数预设一个 β 的变化曲线。例如，前 20% 步数 β 从 0.01 线性增长到 0.1，然后保持不变。这种方法简单，但缺乏对环境动态的适应。

    - 基于奖励提升速率的调整
    监测奖励的滑动平均值。如果奖励提升很快且 KL 也在快速增长，可能意味着 Actor 在走捷径（奖励黑客），此时触发 β 增大。如果奖励提升缓慢且 KL 很小，则降低 β 鼓励探索。

    - 多目标帕累托优化
    不把 KL 当作惩罚，而是作为另一个独立的优化目标。使用多目标强化学习算法，动态搜索在“高奖励”和“低 KL”之间的帕累托前沿，让训练过程自适应地选取不同权衡点。这种方法在资源充足时能产生一组不同对齐程度的策略。

    - 逐层/逐模块差异化 β
    观察到语言模型的不同层（或不同注意力头）对风格和内容的控制粒度不同。可以为浅层（可能影响语法）设置较大的 β 以保护语言流畅性，为深层（可能影响语义和风格）设置较小的 β 以鼓励对齐。这是前沿探索方向。

    实践现状：多数开源 RLHF 实现（如 DeepSpeed-Chat）支持目标 KL 自适应调整，默认 β 初始为 0.01 到 0.1 之间，然后根据监测动态调节。


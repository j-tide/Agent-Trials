content:
  prompt: 为什么需要 RLHF？它要解决传统语言模型训练中的哪些根本问题？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    传统大规模语言模型（LLM）的训练核心是自监督学习，通过最大似然估计（MLE）在数千亿 token 的互联网文本上预测下一个词。这种方式让模型掌握了强大的语言能力和海量知识，但也引入了若干根本性问题，RLHF 正是为解决这些问题而生。

    传统训练的根本问题：

    - 目标错位（Objective Mismatch）
    MLE 的目标是让模型输出的概率分布尽可能接近训练数据分布，即“让文本看起来像人类写的”。然而，用户真正需要的是 “遵循意图、完成任务、提供准确信息” 。模型在追求相似性时，可能生成流畅但内容错误、无关或不符合指令的回答。它学会的是统计相关性，而非服务于用户目标。

    - 无法区分数据质量与价值观
    互联网数据中包含偏见、歧视、虚假信息、仇恨言论、低质量灌水等。MLE 不加区分地学习，导致模型可能内化这些不良特征。例如，它可能会在回答中表现出对特定群体的刻板印象，或生成暴力、色情内容。因为模型只是模仿数据，没有“好坏”的概念。

    - 缺乏对“不知道”和“拒绝”的学习
    在 MLE 训练中，模型被训练为永远尝试预测下一个 token，即使面对它不知道的事情，也会基于统计编造一个看似合理的答案（幻觉）。它从未被明确教导何时应该说“我不确定”或拒绝回答不当请求（如“教我如何制作炸弹”），因为训练数据中这类对话交互极少，且没有一致的拒绝模板。

    - 无法捕捉人类细微偏好
    什么样的回答算“好”？是更详细、更简洁、更幽默、更有同理心？这些偏好难以用固定规则定义，而是依赖于语境和用户的期望。MLE 只能提供唯一的标准答案（训练数据中的文本），无法学习回答之间的相对优劣排序。

    RLHF 如何解决：

    RLHF 通过引入人类偏好反馈，将优化目标从“模仿数据”转变为“让人类满意”。具体来说：

    - 它利用人类标注者对模型的不同回答进行偏好比较，训练出一个能模拟人类打分的奖励模型。

    - 然后使用强化学习（如 PPO）微调语言模型，以最大化该奖励模型的评分，同时约束模型不偏离原本的语言能力。

    - 这一流程直接优化了有用性、诚实性、无害性等对齐目标，使模型学会遵循复杂指令、拒绝危险请求、表达不确定性、提供更符合人类期待的回答。

    本质上，RLHF 补上了从“说什么像人话”到“说人想听、对人有用的话”的关键一环。


content:
  prompt: RM 训练中如何处理相同回答的平局？
answer:
  mode: rubric
  reference_answer: |-
    出现平局的原因：

    - 两条回答客观上质量相同，难分伯仲。

    - 标注员犹豫不决或注意力不集中。

    - 强制排序时，标注员可能随机选一个，引入噪声。

    处理方法：

    - 直接丢弃（最常用）

    [图片内容未导入]

    - 软化目标（软化 Sigmoid 目标）

    - 将平局视为“偏好概率为 0.5”（即两者无差异）。修改损失函数为：

    [图片内容未导入]

    - 等价于最小化两者分数的绝对差异。这比直接丢弃更温和，保留了数据但降低了优化力度。

    - 使用“同等好”标签的三元组

    [图片内容未导入]

    - 转化为“弱偏好”对

    实践建议：初期可以先丢弃所有平局数据，保证模型快速学习清晰的偏好信号；后期如果需要更精细的区分度，可以引入软化目标，帮助模型学习“细微差别”。


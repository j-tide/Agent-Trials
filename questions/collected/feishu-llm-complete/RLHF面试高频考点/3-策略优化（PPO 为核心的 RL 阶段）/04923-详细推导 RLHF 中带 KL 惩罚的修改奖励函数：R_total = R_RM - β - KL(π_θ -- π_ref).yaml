    这里的 β 就扮演了 KL 惩罚系数的角色。它控制着约束的强度：ββ 越大，惩罚越强，策略越不敢偏离参考模型；β 越小，惩罚越弱，策略越倾向于最大化奖励而可能远离参考模型。


content:
  prompt: PPO 训练中，如果 Actor 和 Ref 模型的概率差异过大，甚至 log_ratio 溢出，应如何处理？
answer:
  mode: rubric
  reference_answer: |-
    这种“概率差异过大”通常是语言崩溃或奖励黑客的前兆，意味着策略已经严重偏离了正常语言分布。

    应急处理措施：

    - 立刻暂停或回滚：当前的训练检查点很可能已经损坏。应立即停止训练，回滚到上一次 KL 散度正常的检查点。

    - 紧急增强 KL 惩罚 β：这是最直接的补救措施。将 KL 惩罚系数 β 大幅提高（例如乘以 10），强制让策略在下一次更新时被猛拉回参考模型附近，重新锚定在安全区域。

    - 在计算中进行裁剪和过滤：在计算对数比率 logrt 时，可以使用 torch.clamp(log_ratio, min=-10, max=10) 这样的操作，防止因为溢出而出现 NaN。但这是治标不治本，只是为了防止程序崩溃。

    根本性调整策略：

    - 降低学习率：Actor 的学习率可能过大，导致单步更新就冲出了安全区。

    - 减小 PPO 的裁剪率 ε：让裁剪机制变得更“紧”，更早地截断过大的更新。

    - 采用更保守的优化器设置：例如增大 Adam 的 ϵ，或者使用 SGD 等更温和的优化器。

    - 重新审视奖励模型：这通常是根本原因。需要检查 RM 是否对某些异常回答给出了不合理的超高奖励，导致 Actor 疯狂地想要模仿那些“畸形”回复。需要用对抗样本重新训练 RM 来修复这个漏洞。


content:
  prompt: 分析 PPO 更新中可能出现的高方差问题，以及如何通过优势归一化（Advantage Normalization）来缓解。
answer:
  mode: rubric
  reference_answer: |-
    高方差的来源：

    在 RLHF 中，PPO 更新的高方差主要源于两个层面。

    - 动作空间层面：词表巨大，重要性采样比率可能在部分 token 上出现剧烈波动。

    - 任务层面：同一个 prompt，模型可以生成完全不同的回复，获得的奖励可能有天壤之别。即使在同一个批次的样本中，不同轨迹的优势 AtAt 数值范围也可能非常分散。如果不加处理，少数几个具有极大正优势或负优势的样本会主导整个批次的梯度更新，使得优化方向左右摇摆，收敛缓慢。

    优势归一化的操作：

    [图片内容未导入]

    缓解机制：

    - 稳定更新步长：归一化后，优势的分布变为零均值、单位方差。这意味着，我们不再关心“这个动作的绝对优势有多大”，而是关注“在这个批次中，它比平均好多少（或差多少）”。这确保了每次参数更新的量级是相对稳定的，不受优势值绝对尺度漂移的影响。

    - 降低方差：通过缩放，优势的波动范围被限制在一个合理的区间内。这避免了模型因个别样本的巨大优势而剧烈调整参数，使得整体梯度信号的方差大大降低，训练过程变得更加平稳、高效。


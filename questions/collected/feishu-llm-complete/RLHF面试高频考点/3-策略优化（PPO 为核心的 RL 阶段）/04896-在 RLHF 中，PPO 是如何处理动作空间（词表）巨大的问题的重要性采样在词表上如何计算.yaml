  prompt: 在 RLHF 中，PPO 是如何处理动作空间（词表）巨大的问题的？重要性采样在词表上如何计算？
answer:
  mode: rubric
  reference_answer: |-
    处理巨大词表的核心手段——直接在概率分布上操作：
    PPO 的策略 πθπθ 是一个语言模型，其输出就是词表大小的 logits。我们不需要像 DQN 那样去穷举所有动作的值，而是只关注实际被采样到的那个 token。在计算损失时，我们只提取模型在那个被采样 token 上的对数概率。对于其他 49999 个没有被选中的 token，它们的概率变化不会影响这个特定样本的损失。这使得计算量与动作空间的大小解耦。


content:
  prompt: 如果策略的熵在训练中急剧下降，说明了什么？应如何处理？
answer:
  mode: rubric
  reference_answer: |-
    熵急剧下降的警示信号：

    [图片内容未导入]

    说明了什么：

    - 模式坍塌的前兆：模型可能已经发现了一条能稳定获得高奖励的“捷径”（例如，总是回答“当然，我很乐意帮助您...”的客套话模板），并迅速将所有概率质量集中到这条捷径上，完全丧失了探索其他更优策略的可能性。

    - 过拟合到奖励模型的表面特征：奖励模型可能对某些特定的 token（如特定的礼貌用词）有着异常高的偏好。策略很快抓住了这一点，并疯狂地、重复地利用它，导致输出单一化。

    - KL 惩罚与奖励信号的失衡：KL 惩罚是为了防止策略偏离太远，但如果它设得太小，或者奖励模型的信号过于强烈，策略就会不惜一切代价去追逐高分，哪怕输出变得极其单调，从而体现为熵的崩塌。

    应对策略：

    [图片内容未导入]

    - 重新调校 KL 惩罚系数 β：增大 β 可以更强地约束策略不要偏离参考模型太远，因为参考模型通常具有健康的熵。

    - 降低裁剪率 ε：减小 ε 可以限制每步更新的最大幅度，防止策略过快地涌入一个狭窄的高奖励区域。

    - 检查并改进奖励模型：分析是哪些回答让策略的熵降低了，很可能发现了 RM 的系统性偏见（如长度偏见、格式偏见）。需要用更鲁棒的对抗样本来修复 RM。


    有时也会对 Critic 的更新进行裁剪（value clipping），以防止对某个状态的价值估计发生剧烈跳变。其裁剪后的损失与 PPO 的 Actor 损失形式类似：

    [图片内容未导入]

    为什么使用 MSE：
    MSE 损失是一个凸函数，且梯度连续，非常易于优化。在强化学习的状态价值估计中，我们的目标 Gt 是一个连续且可能具有噪声的变量。MSE 天然适合拟合这种连续目标。它惩罚大的估计误差更重（平方惩罚），能强制 Critic 快速向真实的回报期望收敛。此外，MSE 的梯度简洁，计算开销极低，非常适合与 Actor 的损失一起进行大规模并行训练。


content:
  prompt: PPO 的样本效率和离线 RL 算法（如 DQN）相比如何？为什么 RLHF 通常用 PPO 而不是 Q-learning？
answer:
  mode: rubric
  reference_answer: |-
    样本效率对比：

    PPO 是一种 on-policy 算法，其样本效率远低于 DQN 等 off-policy 算法。DQN 使用经验回放池，可以将过去很久的数据都存储起来反复使用，数据利用率极高。而 PPO 必须使用由当前最新策略生成的数据（或经过重要性采样修正的、非常近期的数据），一旦策略更新，旧数据就被丢弃。PPO 的每一次参数更新，消耗的样本都是“一次性”的。

    为什么 RLHF 不用 Q-learning 而用 PPO？

    [图片内容未导入]

    - 对分布变化的鲁棒性：RLHF 的奖励模型是一个静态的、冻结的网络。在训练中，策略（Actor）的生成分布会逐步漂移，进入 RM 的分布外区域。Off-policy 的 Q-learning 由于依赖大型的经验池，其中会同时包含来自新、旧多种策略的样本，这种分布的不一致性会让 Q 值估计变得极度不稳定。PPO 的 on-policy 特性意味着它的每次更新只基于当前最新策略产生的、同分布的样本，避免了这种分布不匹配问题，训练更稳定。

    - 与 SFT 起点的兼容性：RLHF 必须从一个强大的 SFT 模型开始。PPO 的 Actor 可以直接继承 SFT 的参数，Critic 也可以从 SFT 初始化。这与策略梯度架构无缝衔接。而将 SFT 模型改造成一个 Q 网络，则会面临更大的架构鸿沟和训练不稳定性。

    因此，尽管 PPO 样本效率低，但它是目前能够稳定处理超大规模动作空间和复杂策略的最佳选择。


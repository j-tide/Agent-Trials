content:
  prompt: 在语言生成任务中，GAE 的计算是如何沿着序列反向进行的？
answer:
  mode: rubric
  reference_answer: |-
    语言生成是一个从左到右的序列，但 GAE 的计算必须从后往前逆向进行。其核心是反向迭代计算累积的 TD 误差。

    [图片内容未导入]

    实现细节：
    在代码层面，我们会先创建一个与序列等长的全零张量 advantages，然后从 T-1 向下循环到 0，每一步都将当前计算的 At 填入对应的位置。同时，为了稳定训练，通常还会在批次内对所有优势进行标准化（减去均值除以标准差）。这种反向计算方式使得长序列的信用分配成为可能，将最后的奖励信号平滑地分配给了过程中的每一个 token。


    这个期望在实际计算中无法穷举所有序列，因此必须通过蒙特卡洛采样来近似。

    3.2 基于采样的近似：求和还是平均？

    给定我们采样得到的一条具体序列 y，我们可以计算该序列的对数似然比：

    [图片内容未导入]

    这个和就是对序列级别 KL 散度的一个无偏但高方差的单样本估计。在 PPO 实现中，为了惩罚这个偏离，我们通常会使用这个和，但在聚合多个序列的损失时，会进行平均处理。


  prompt: PPO 是否适用于多轮对话的 RLHF？每轮是否需要各自计算奖励和 KL？
answer:
  mode: rubric
  reference_answer: |-
    完全适用，而且是必不可少的。 多轮对话是 RLHF 最重要的应用场景之一。


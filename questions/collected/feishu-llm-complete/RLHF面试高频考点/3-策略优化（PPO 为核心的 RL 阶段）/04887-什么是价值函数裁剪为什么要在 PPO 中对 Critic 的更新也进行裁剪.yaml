  prompt: 什么是“价值函数裁剪”？为什么要在 PPO 中对 Critic 的更新也进行裁剪？
answer:
  mode: rubric
  reference_answer: |-
    价值函数裁剪（Value Clipping） 是一种应用于 Critic 网络更新的正则化技术，其思想与 Actor 的 PPO 裁剪目标一脉相承，旨在防止价值估计在单步更新中发生剧烈的跳变。


    在 RLHF 中的实践：
    RLHF 中通常使用 λ≈0.95。因为 RLHF 的奖励是极度稀疏的（只在序列末尾有 RM 评分），单步 TD（λ=0）几乎无法在中间步骤学到任何有意义的信号，因此需要较大的 λ 让终点的奖励信息能够更充分地传播回前面的 token。


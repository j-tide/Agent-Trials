    实践中的维护：

    在 RLHF 代码中，“旧策略”通常是当前 Actor 在做采样之前的一份参数快照。采样完成后，这个快照被冻结，用于整个批次的后续多轮 PPO 更新。批次更新完后，这份快照即被丢弃，下一轮采样前再生成新的快照。这就是 PPO 在线策略特性的体现。


    数据流详解：

    阶段1：在线采样（Rollout）

    - 用户 prompt x 输入 Actor（策略 π_θ），Actor 自回归地生成完整回复 y，并记录下每个 token 的旧对数概率 log π_old。此时只有 Actor 在工作。

    阶段2：奖励与 KL 惩罚计算

    [图片内容未导入]

    阶段3：PPO 训练更新

    [图片内容未导入]

    整个数据流中，RM 和 Reference 始终冻结，不参与梯度更新；Actor 和 Critic 在训练阶段交替更新，两者的梯度通常不共享（共享底座时除外），构成了典型的 Actor-Critic 架构。


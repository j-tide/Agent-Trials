answer:
  mode: rubric
  reference_answer: |-
    可以，这正是在 InstructGPT 论文中使用的一个重要技巧，被称为 PPO-ptx。 其目的是为了防止模型在 RLHF 的对齐过程中，遗忘其在预训练阶段获得的广泛世界知识和语言流畅性。

    具体做法：

    在 PPO 的最终损失函数中，混入一个额外的、标准的语言模型预训练损失（即 SFT 损失）。这个预训练损失是在一个通用的、大规模的文本语料库（如预训练数据集）上计算的，目标是最小化下一个 token 的负对数似然。


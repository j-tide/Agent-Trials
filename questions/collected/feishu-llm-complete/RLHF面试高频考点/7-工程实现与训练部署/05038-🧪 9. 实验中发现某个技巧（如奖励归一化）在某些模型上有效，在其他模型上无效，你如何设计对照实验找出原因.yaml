content:
  prompt: "\U0001F9EA 9. 实验中发现某个技巧（如奖励归一化）在某些模型上有效，在其他模型上无效，你如何设计对照实验找出原因？"
answer:
  mode: rubric
  reference_answer: "\U0001F3AF 设计原则：单变量控制，排除一切无关因素。\n\n- 基准对齐：确保对比的两个模型在除技巧外的所有配置完全一致：相同的基座、SFT数据、偏好数据、RM、PPO超参数（学习率、β等）。只将“奖励归一化”作为开关变量。\n\n-
    多模型测试：在至少3个不同规模/架构的模型上重复实验，统计显著性。排除个例偶然性。\n\n- 深入剖析：若发现差异，进一步分析指标。例如，奖励归一化有效时，是否降低了奖励的方差？观察奖励分布直方图。无效时，是否是因为奖励模型本身输出的尺度已经非常稳定？或因为β的初始值设定与归一化后的奖励尺度不匹配？可尝试调整β。\n\n-
    敏感度分析：对于无效模型，尝试改变归一化策略（如逐batch vs. 全局归一化，Z‑score vs. min‑max），看是否可激活效果。\n\n- 代码审查：检查无效模型的PPO代码中，归一化是否被正确地应用到计算优势之前，还是在错误的位置被稀释。\n\n结论：如果经过严格对照仍无法激活，则可能是该模型‑任务组合下，技巧带来的方差降低被其他噪声（如Critic误差）所淹没，此时结论为“在该设定下无统计显著提升”。\n\n---"

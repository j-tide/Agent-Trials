content:
  prompt: "\U0001F50D 3. 若复现某论文的 RLHF 结果，发现效果差很多，你首先会检查哪些方面？"
answer:
  mode: rubric
  reference_answer: "系统排查清单，按可能性从高到低：\n\n- \U0001F4CA 数据一致性：论文和你的SFT/偏好数据是否完全对齐？数据处理管线（prompt格式、截断、特殊token）是否一致？这是最常见的原因。\n\n-
    \U0001F9E0 模型初始化：基座模型权重是否完全一致（包括微调的SFT步骤）？LoRA适配器的秩、α等是否匹配？\n\n- ⚖️ 奖励模型：RM的架构、训练数据、训练步数是否相同？RM的评分尺度会极大影响PPO行为。必要时用公开的RM进行对照。\n\n-
    \U0001F527 PPO实现细节：裁剪方式（token‑level vs sequence‑level）、优势估计（GAE λ, γ）、KL惩罚类型（token‑level平均还是求和）、是否使用价值裁剪、是否使用PPO‑ptx？实现差异往往巨大。\n\n-
    \U0001F39B️ 超参数：不仅要核对数值，还需注意学习率调度、自适应KL策略、Batch Size、序列最大长度等。\n\n- \U0001F4CF
    评估协议：论文评估时使用的prompt集、解码参数（temperature, top‑p）、评分模型（GPT‑4版本？）是否一致？评分模型的版本差异可导致显著分数变动。\n\n-
    \U0001F522 随机种子：虽不是主要因素，但可检查是否因未固定种子导致个别实验波动。\n\n行动路径：从数据开始逐层“对齐”，每次只改变一个变量，直至定位偏差来源。\n\n---"

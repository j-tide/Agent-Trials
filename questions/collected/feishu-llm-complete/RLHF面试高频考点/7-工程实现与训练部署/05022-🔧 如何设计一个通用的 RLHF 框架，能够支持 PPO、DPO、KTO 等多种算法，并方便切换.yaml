content:
  prompt: "\U0001F527 如何设计一个通用的 RLHF 框架，能够支持 PPO、DPO、KTO 等多种算法，并方便切换？"
answer:
  mode: rubric
  reference_answer: "\U0001F3D7️ 框架设计核心：策略模式 + 插件化\n\n- 抽象层\n\n- 算法接口：定义一个统一的 AlignAlgorithm
    基类，暴露 train_step(data_batch) 和 compute_loss(logits, data) 等方法。PPO、DPO、KTO 分别实现该接口。\n\n-
    数据管道：算法不直接接触原始数据，而是通过 DataFeeder 适配器，将原始经验数据转换为该算法所需的张量格式。\n\n- 模型管理层\n\n- 模型仓库：统一管理
    Actor、Critic、Ref、RM。对于 DPO，Critic 和 RM 可以不存在，通过配置控制其加载。\n\n- 推理引擎适配器：抽象一个 InferenceBackend
    接口，支持 vLLM、TensorRT、HuggingFace Pipeline 等多种后端，通过配置文件切换。\n\n- 训练循环与调度\n\n- 训练器：实现一个
    Trainer 类，它不关心具体算法，只负责调用接口，并管理分布式训练、混合精度、日志记录等。\n\n- 配置文件驱动：使用 YAML 或类似格式定义整个
    pipeline：选择算法、模型路径、数据集、超参数等。\n\n- 辅助组件\n\n- 奖励计算模块：对于 PPO，加载 RM 和 Ref 服务；对于 DPO，该模块可被旁路。\n\n-
    评估模块：训练过程中定期用 AlpacaEval 等基准评估，独立于算法。\n\n\U0001F500 切换流程：只需修改配置文件中的 algorithm:
    ppo 为 algorithm: dpo，框架会自动加载对应的算法类和数据适配器，无需修改训练脚本。\n\n---"

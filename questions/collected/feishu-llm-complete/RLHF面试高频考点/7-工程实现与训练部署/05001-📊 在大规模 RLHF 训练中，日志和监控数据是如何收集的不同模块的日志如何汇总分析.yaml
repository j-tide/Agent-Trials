content:
  prompt: "\U0001F4CA 在大规模 RLHF 训练中，日志和监控数据是如何收集的？不同模块的日志如何汇总分析？"
answer:
  mode: rubric
  reference_answer: "\U0001F4E1 日志收集架构\n\n- 各模块独立上报：Rollout Worker、奖励计算服务、PPO Trainer
    等模块各自产生指标（如吞吐、延迟、KL 散度、奖励值、GPU 利用率），通过标准接口（如 StatsD、Prometheus Pushgateway）上报到中心化的时序数据库。\n\n-
    元数据关联：每条日志都附带统一的标签：experiment_id、iteration、model_version。这对排查数据版本错乱至关重要。\n\n\U0001F4C8
    监控面板\n\n- 使用 Grafana 构建统一的实时监控仪表盘，将不同模块的指标并排展示。\n\n- 关键面板：\n\n- 告警规则：设置 KL 上限、奖励骤降、GPU
    空闲率过高、日志停止上报等告警，通过 PagerDuty/Slack 通知。\n\n\U0001F50D 汇总分析\n\n- 使用 W&B 或 MLflow
    这类实验管理平台，将训练指标与超参数、代码版本、数据版本关联，实现实验的横向对比。\n\n- 对历史训练数据进行分析，发现某个 prompt 的奖励一直异常高或低，可以拉出该
    prompt 的详细生成日志进行人工审查。\n\n- 利用日志回放：将训练中某个 step 的原始经验数据导出，在本地复现问题，是调试 RLHF 的终极武器。\n\n-
    发生在训练集群的每个 mini-batch 之后。所有数据并行 GPU 需要交换梯度并取平均。\n\n- 数据量与模型参数量成正比（如 7B 模型约 14GB
    梯度）。是训练吞吐的最大瓶颈，需要高带宽网络（如 InfiniBand、NVLink）。\n\n- 训练完成后，新 Actor 权重需广播给所有推理节点。如果推理节点数量庞大，且权重更新频繁（如每
    10 分钟一次），广播风暴可能成为瓶颈。\n\n- 缓解：使用参数服务器架构，推理节点从就近的节点拉取；或者仅广播 LoRA 权重（参数量极小）。\n\n-
    推理节点将生成的文本和 log_probs 传输给训练节点或缓冲区。文本数据量远小于梯度，通常不是瓶颈，但当序列极长（如 >4096 tokens）且 batch
    极大时，可能成为不可忽视的开销。\n\n- RM 和 Reference 服务的输入输出数据量极小（仅需传递 token IDs，返回标量或 token 级标量），通信开销极低。\n\n-
    在关键路径上添加计时器：采样阶段（prompt 入队→生成完成）、奖励计算（调用开始→返回）、训练阶段（数据加载→前向→反向→梯度同步）。\n\n- 使用
    PyTorch Profiler、Nsight Systems 或自定义的 Python with Timer() 上下文收集数据。\n\n- 绘制流水线甘特图（Gantt
    Chart），观察各阶段的时间占比和重叠度。\n\n- 如果 采样阶段 耗时最长且 GPU 利用率低，说明推理引擎设置不合理（如 batch 过小、KV Cache
    不足）。\n\n- 如果 奖励计算 成为瓶颈，说明 RM/Ref 部署资源不足或网络延迟高。\n\n- 如果 训练阶段 GPU 利用率高但单位时间吞吐低，说明梯度同步或数据加载成为瓶颈。\n\n-
    采样慢：扩大推理集群、启用连续批处理、增加采样温度加速生成长度。\n\n- 奖励慢：对 RM 进行量化加速、缓存常见 prompt 的奖励结果。\n\n-
    训练慢：优化梯度通信（使用梯度累积增大有效 batch）、启用混合精度、升级网络带宽。\n\n- 流水线不平衡：调整各阶段资源比例，例如增加推理节点，减少训练节点的等待。\n\n-
    低温度（0.3~0.6）→ 输出更确定、连贯，但多样性差，容易错失探索到的高奖励模式。\n\n- 高温度（0.8~1.2）→ 多样性高，但易产生乱码，奖励方差大，训练不稳定。\n\n-
    推荐：RLHF 训练初期用 0.8~1.0 鼓励探索，后期逐渐降至 0.6~0.8 进行精细优化。\n\n- p=0.9~0.95 是常用范围。可以滤除低概率的长尾噪声，同时保留大部分概率质量。\n\n-
    与温度结合使用：先调整温度，再设置 Top‑p 防止模型选择极不可能的词。\n\n- 多样性枯竭：经验缓冲区中充斥着几乎相同的“安全”回答，PPO 训练无法接触到多样化的正负样本，策略快速坍缩。\n\n-
    探索受限：无法触达那些模型当前认为“不那么可能”、但实际奖励很高的新颖表达。\n\n- 推理引擎维护一个 active_requests 池。\n\n- 每完成一个
    token 生成，调度器检查是否有序列结束。若有，从 waiting_queue 中取出新 prompt 加入。\n\n- 这确保 GPU 的计算单元和显存始终保持满负荷，吞吐量可达静态批处理的
    3~5 倍。\n\n- 序列对数概率：将引擎返回的每个 token 的 log_prob 沿序列求和，得到该回答的总对数概率 log⁡πθ(y∣x)logπθ(y∣x)。\n\n-
    重要性采样比率：直接使用采样的 log_prob 与旧策略的 log_prob 相减，再求指数。\n\n- 训练主曲线：Reward、KL、Policy Entropy、Critic
    Loss。\n\n- 系统吞吐：每秒生成 Token 数（Token/s）、经验缓冲区消费速率。\n\n- 硬件资源：GPU 利用率、显存占用、网络带宽。\n\n-
    生成质量：采样文本的平均长度、distinct n-grams。"

content:
  prompt: "⚖️ PPO-ptx 的混合比例如何设定？过大会阻碍对齐，过小不起作用。"
answer:
  mode: rubric
  reference_answer: |-
    混合比例 γγ 的设定依赖于经验和对训练动态的监控。

    设定策略：

    - 基线校准：在 RLHF 训练前，评估模型在几项关键能力基准（如 HellaSwag, MMLU）上的得分，以及生成文本的 perplexity。

    - 初始范围：γγ 通常在 0.01 到 0.1 之间开始探索。较小的模型可能需要稍大的 γ（因为更易遗忘），大型模型则可小一些。

    - 动态监控：

    - 自适应 γ：可以实现一个简单的 PID 控制器，根据能力基准的移动平均得分动态调整 γ。例如，当得分低于预设的“容忍下限”时，自动将 γ 翻倍；当奖励提升缓慢且能力得分稳定时，将 γ 减半。

    直觉：γ 是“创新”与“守旧”的调节旋钮。其最优值点是在模型开始出现“语法小毛病”但尚未出现严重知识遗忘之前，能提供恰到好处的保守性。


content:
  prompt: "☸️ 使用 Ray 或类似框架管理分布式 RLHF 任务的好处和挑战。"
answer:
  mode: rubric
  reference_answer: |-
    ✅ 好处

    - 天然分布式：Ray 内置的 Actor 模型和 Task 调度器，可以轻松地将 Rollout Worker、Trainer、RM Server 定义为不同的 Ray Actor，部署在集群任意节点。

    - 自动容错与弹性伸缩：Ray 可以监测节点故障并自动重启任务，支持在资源变化时动态扩缩 Worker。

    - 高性能数据共享：Ray Object Store 提供零拷贝的共享内存，非常适合经验数据的生产-消费模式。

    - Python 原生：无需学习新语言，与 PyTorch 生态无缝融合。

    ⚠️ 挑战

    - 调试复杂：分布式 Ray 任务的调用栈错综复杂，错误定位困难。

    - 资源调度粒度：Ray 默认的 CPU/GPU 资源分配可能不够精细，需要手动指定资源标签，避免不同服务（如 RM 和 Actor）争抢 GPU。

    - 状态管理：在 RLHF 的多模型、多版本环境中，需要仔细管理各 Ray Actor 的生命周期和权重版本，否则容易出现权重错乱。

    - 性能开销：Ray 的函数调用和对象序列化有一定开销，对于极高频的微批训练，可能需要直接使用 NCCL 原语。


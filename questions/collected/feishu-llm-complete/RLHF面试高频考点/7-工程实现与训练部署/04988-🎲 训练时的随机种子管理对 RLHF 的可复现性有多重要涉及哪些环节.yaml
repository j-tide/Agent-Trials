content:
  prompt: "\U0001F3B2 训练时的随机种子管理对 RLHF 的可复现性有多重要？涉及哪些环节？"
answer:
  mode: rubric
  reference_answer: |-
    RLHF 涉及大量随机性，种子管理是其可复现性的基石。缺少严格的种子控制，任何实验结论都不可靠。

    涉及环节及控制方法：

    - Python / NumPy / PyTorch 种子：

    random.seed(seed)
    np.random.seed(seed)
    torch.manual_seed(seed)
    torch.cuda.manual_seed_all(seed)

    - 数据加载与采样：DataLoader 的 worker 种子必须基于主种子和 worker ID 派生，确保多进程数据读取顺序可复现。

    - 模型初始化：不同层的权重初始化需在固定种子后进行。

    - Dropout 与随机深度：训练时必须使用相同的种子控制其掩码。推理时（如生成回答）通常需关闭 Dropout。

    - 在线采样：Actor 生成回答时的采样温度虽然引入了随机性，但若想复现，需要为每个 prompt 指定固定的随机种子（或基于 prompt 哈希），使生成结果可被完全复现。

    - 奖励计算与 Critic 初始化：这些环节的随机性虽小，但累积起来也会影响最终结果。

    - 分布式训练：每个 rank 的种子应在基础种子上加上 rank ID，确保各 rank 行为可预测但不完全相同。

    实践：

    - 将全局种子记录在实验配置中，并附在模型检查点内。

    - 在调试时，可关闭所有随机性（如 dropout=0，采样温度设为 0），先在确定性环境中验证 pipeline 正确性。


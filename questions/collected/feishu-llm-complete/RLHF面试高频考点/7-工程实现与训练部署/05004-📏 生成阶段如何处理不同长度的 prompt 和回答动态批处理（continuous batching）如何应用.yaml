content:
  prompt: "\U0001F4CF 生成阶段如何处理不同长度的 prompt 和回答？动态批处理（continuous batching）如何应用？"
answer:
  mode: rubric
  reference_answer: "\U0001F6E0️ 长度差异问题：同一个 batch 内，不同 prompt 生成的回答长度可能从 10 到 2000
    tokens 不等。传统的静态批处理必须等所有序列都达到最大长度或生成 EOS 才能结束，浪费大量算力在等待已完成的序列上。\n\n\U0001F680 动态批处理（Continuous
    Batching）\n\n- 原理：不再以“一个批次”为最小调度单位，而是维护一个全局的请求队列和正在处理的 token 流。当某个序列生成 EOS 后，其占用的
    GPU 资源（KV Cache 和计算槽位）立即被释放，一个新的 prompt 可以立即接替进入，开始生成它的第一个 token。\n\n- 在 RLHF
    中的应用：\n\n\U0001F527 实现：vLLM 和 TensorRT-LLM 都内置了高效的 Continuous Batching。在 RLHF
    中，Rollout Worker 直接调用这些引擎，无需自行实现。\n\n---"

content:
  prompt: "\U0001F3D7️ 流水线式 RLHF：将采样、奖励计算、训练设计成流水线 stage，能否提高吞吐？"
answer:
  mode: rubric
  reference_answer: "\U0001F680 流水线原理：将 RLHF 的一次迭代分解为采样、奖励、训练三个独立的 stage，每个 stage
    使用不同的 GPU 资源。当训练 stage 在处理第 N 批数据时，采样 stage 已在生成第 N+1 批数据，奖励 stage 在计算第 N 批数据的奖励。\n\n\U0001F4C8
    吞吐提升\n\n- 理想情况下，可隐藏采样和奖励计算的延迟，使得训练 GPU 几乎无空闲等待，吞吐量提升 2~3 倍。\n\n- 对于一个需要 10 分钟采样、2
    分钟奖励、8 分钟训练的迭代，串行耗时 20 分钟。流水线后，训练 GPU 可每 10 分钟就消费一批新数据（取决于最慢 stage），吞吐翻倍。\n\n⚠️
    实施挑战\n\n- 版本一致性：流水线中，采样用的 Actor 权重与训练用的版本必须匹配。需要引入版本号对齐，或者允许轻微 off-policy 并通过重要性采样修正。\n\n-
    缓冲与反压：需要精细设计各 stage 间的缓冲区大小，避免上游过快导致内存溢出，或下游过慢导致空闲。\n\n- 故障传播：一个 stage 崩溃会影响整个流水线，需要设计优雅的错误隔离和重启机制。\n\n---"

  prompt: "\U0001F321️ 在线采样时，如何设置合理的并行度（温度、top-p 等参数），以保证样本多样性同时控制生成质量？"
answer:
  mode: rubric
  reference_answer: "\U0001F527 参数平衡术\n\n- 温度（Temperature）：控制 logits 的锐利度。\n\n- Top‑p（Nucleus
    Sampling）：动态控制候选 token 集合。\n\n- 重复惩罚（Repetition Penalty）：在 RLHF 中，极易出现奖励黑客导致的重复。设置
    1.05~1.1 的重复惩罚，可有效防止模型陷入刷分循环。\n\n⚖️ 平衡策略\n\n- 多臂赌徒：在同一个 batch 内混合多种采样温度，让模型同时探索和利用。\n\n-
    熵监控：实时监控生成 batch 的策略熵，若熵过低（<0.5），则提高温度或降低 Top‑p；若出现大量无意义乱码，则降低温度。\n\n---"

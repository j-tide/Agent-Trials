content:
  prompt: "\U0001F4E1 奖励模型的计算是否也需要单独的服务？如何设计一个高效、低延迟的奖励计算服务？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 需要单独服务：奖励计算虽然单次推理量不大，但其模型（RM、Ref）必须保持冻结，且与 Actor/Critic
    的解耦能带来：\n\n- 独立扩缩容：当采样吞吐增加时，可单独增加奖励计算节点。\n\n- 避免干扰：不与训练集群的梯度同步等重型操作竞争资源。\n\n-
    低延迟：奖励计算服务可部署在就近的推理节点或专用池上，减少数据搬运。\n\n\U0001F3D7️ 高效奖励计算服务设计\n\n- 批量处理与动态组批：与
    vLLM 类似，奖励服务应支持连续批处理。对于 RM，只需一次编码（非自回归），计算量低，但通过对请求进行微批处理（mini-batch），可高效利用 GPU。\n\n-
    模型共享部署：将 RM 和 Reference 模型部署在同一组 GPU 上，甚至使用同一底座加不同头（多头奖励模型），以最大化显存复用。\n\n- 零拷贝数据传输：采样集群和奖励计算服务之间使用共享内存或
    RDMA 网络，直接传输 token ID 和 attention mask，避免序列化/反序列化开销。\n\n- 异步与流水线：奖励计算作为一个异步服务，无需等待训练集群的响应。它从缓冲区拉取数据，计算完成后写回，形成独立的流水线阶段。\n\n\U0001F527
    技术选型：\n\n- 轻量级可选 NVIDIA Triton Inference Server，支持多种模型后端和动态批处理。\n\n- 对于简单的标量奖励计算，也可以用
    PyTorch + FastAPI 构建微服务，并利用 torch.compile 加速。\n\n---"

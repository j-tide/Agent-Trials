content:
  prompt: "\U0001F9D1‍\U0001F3ED 解释“Rollout Worker”概念，它如何独立运行并生成经验数据送入缓冲区？"
answer:
  mode: rubric
  reference_answer: "\U0001F4E6 Rollout Worker 是一个独立的进程或容器，其唯一职责是使用当前 Actor 策略与“环境”（即
    prompt 集）交互，生成完整的回答轨迹，并记录所有必要信息。\n\n\U0001F504 工作循环\n\n- 权重同步：Worker 启动或接收到更新信号时，从模型仓库拉取最新
    Actor 权重，加载到推理引擎。\n\n- 请求获取：从调度器或消息队列中拉取一个 mini-batch 的 prompt。\n\n- 生成与记录：对每个
    prompt，自回归生成回答，并在每个时间步记录：\n\n[图片内容未导入]\n\n- 数据打包：将完整的轨迹打包成 RolloutSample 对象，包含
    prompt、response、log_probs、attention masks 等。\n\n- 推送缓冲区：将 RolloutSample 推送到经验缓冲区（如
    Ray Object Store、Redis、或专用 DataLoader 的队列）。\n\n\U0001F3AF 优势：Worker 是无状态的（除了加载的模型权重），可以无限水平扩展。多个
    Worker 可以并行工作，共享同一个缓冲区，极大提升采样吞吐。\n\n---"

answer:
  mode: rubric
  reference_answer: |-
    大型 RLHF 训练常因数值不稳定、OOM、或硬件故障而崩溃。自动化恢复与重跑机制是生产级训练的必备组件。

    设计要点：

    - 原子检查点保存：

    - 崩溃检测：

    - 重试逻辑与超参数调整：

    - 状态通知：在每次崩溃和重试时，通过 Slack/钉钉/邮件发送详细报告，包括崩溃步骤、错误日志、已采取的补救措施。

    实现工具：

    - 使用 Ray Train 或 Kubernetes Job + Argo 等支持故障恢复和参数覆盖的编排框架。

    - 检查点保存和加载使用统一的接口，确保调整超参数后仍能正确恢复训练状态。


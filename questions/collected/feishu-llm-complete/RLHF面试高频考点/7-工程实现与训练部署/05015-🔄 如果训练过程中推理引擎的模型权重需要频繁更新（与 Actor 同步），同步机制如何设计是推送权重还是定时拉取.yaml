content:
  prompt: "\U0001F504 如果训练过程中推理引擎的模型权重需要频繁更新（与 Actor 同步），同步机制如何设计？是推送权重还是定时拉取？"
answer:
  mode: rubric
  reference_answer: "⚡ 两种同步策略\n\n[嵌入表格未展开]\n\n\U0001F3C6 推荐的混合机制\n\n实际大规模系统多采用 “事件驱动的拉取”：\n\n-
    训练集群完成一轮更新后，将新权重上传到对象存储（如 S3）或分布式文件系统，并更新版本号。\n\n- 模型仓库发布“新权重就绪”事件到消息队列（如 Kafka）。\n\n-
    推理节点订阅该事件，在完成当前正在处理的批次后，主动拉取最新权重。\n\n- 推理节点在新一轮采样开始前，确保所有节点都加载了相同版本权重（通过版本号栅栏）。\n\n\U0001F512
    一致性保证\n\n- 对于 on-policy 的 PPO，推理集群采样前，必须通过全局屏障（Barrier）保证所有推理节点已同步到最新权重，否则产生的经验数据可能来自不同策略，污染训练。\n\n---"

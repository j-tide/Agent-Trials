content:
  prompt: "✂️ 梯度裁剪在 RLHF 中如何设置？对 Actor 和 Critic 的裁剪阈值是否应不同？"
answer:
  mode: rubric
  reference_answer: |-
    梯度裁剪（Gradient Clipping）通过限制梯度的 L2 范数，防止因异常样本或数值不稳定导致的梯度爆炸。

    设置方法：

    - 使用 torch.nn.utils.clip_grad_norm_(parameters, max_norm) 对整个网络的参数梯度进行裁剪。

    - max_norm 通常设为 1.0 或 0.5，需根据模型规模和训练稳定性调整。

    Actor 与 Critic 的差异：

    - Actor 的策略梯度受优势函数、重要性采样比率、以及 KL 惩罚等多重影响，波动性较大。max_norm 可设得稍保守（如 0.5~1.0）。

    [图片内容未导入]

    - 实践中通常统一裁剪，简单有效。若观察到 Critic 梯度范数长期远小于阈值，说明其学习率可能偏低；若频繁触发裁剪，则需降低学习率或检查价值目标是否异常。

    额外建议：

    - 监控梯度范数的移动平均，若持续接近阈值，表明训练可能不稳定。

    - 对 Actor 的梯度裁剪应放在 PPO 损失反向传播之后、优化器 step 之前。


content:
  prompt: "\U0001F9EE 7. 如何评估 RLHF 训练中随机性带来的方差？可以通过多次运行计算置信区间。"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 操作方法：\n\n- 完全重复运行：使用不同随机种子（如1,2,3），完整执行RLHF流程（包括SFT,
    RM训练, PPO）。计算最终指标（如AlpacaEval胜率）的均值和标准差，并报告95%置信区间（±1.96*SE）。\n\n- Bootstrap离线估计：若多次运行成本过高，可从单次训练的后期稳定阶段抽取多个快照（step），用Bootstrap方法重采样这些快照的评估得分，估计方差。这只反映训练后期的波动，不包含初始化和早期随机性。\n\n-
    分组分析：在不同随机种子下，还需关注各维度（有用性、安全性）是否一致提升，还是存在某个种子导致明显的“偏科”。\n\n\U0001F4CA 报告建议：在论文图表中添加误差棒，或绘制不同种子下的曲线带，增强可信度。\n\n---"

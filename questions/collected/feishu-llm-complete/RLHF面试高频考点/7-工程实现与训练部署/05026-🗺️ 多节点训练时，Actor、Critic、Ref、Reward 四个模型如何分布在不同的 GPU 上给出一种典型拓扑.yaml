content:
  prompt: "\U0001F5FA️ 多节点训练时，Actor、Critic、Ref、Reward 四个模型如何分布在不同的 GPU 上？给出一种典型拓扑。"
answer:
  mode: rubric
  reference_answer: "\U0001F3AF 分布目标\n\n- Actor：计算量最大，需要最快的 GPU 和最复杂的并行策略。\n\n- Critic：计算量次之，可与
    Actor 共享部分资源或独立部署。\n\n- Ref 和 RM：仅推理，可共用较少的 GPU，甚至部署在 CPU 上。\n\n\U0001F5FA️ 典型拓扑（16
    GPU，4 节点）\n\n┌────────────────────────────────────────────────────────────┐\n│
    节点 1-3（12 GPU，A100-80G）                                │\n│ ┌───────────┐ ┌───────────┐
    ┌───────────┐ ┌───────────┐   │\n│ │ Actor \U0001F170️   │ │ Actor \U0001F170️
    \  │ │ Actor \U0001F170️   │ │ Critic \U0001F152  │   │\n│ │ (TP=2)    │ │ (TP=2)
    \   │ │ (TP=2)    │ │ (TP=1)    │   │\n│ └───────────┘ └───────────┘ └───────────┘
    └───────────┘   │\n│ 节点 4（4 GPU，A100-80G）                                   │\n│
    ┌───────────┐ ┌───────────┐ ┌───────────┐ ┌───────────┐   │\n│ │ Ref \U0001F141
    \    │ │ RM \U0001F17C      │ │ Rollout   │ │ Rollout   │   │\n│ │ (TP=1)    │
    │ (TP=1)    │ │ Worker \U0001F146  │ │ Worker \U0001F146  │   │\n│ └───────────┘
    └───────────┘ └───────────┘ └───────────┘   │\n└────────────────────────────────────────────────────────────┘\n\n-
    Actor 使用张量并行（TP=2）分布在 6 个 GPU 上，因为它需要承载梯度计算和自回归采样的双重压力。\n\n- Critic 部署在独立的 GPU
    上（或与 Actor 共享部分 GPU 但隔离）。\n\n- Ref 和 RM 是纯推理，各占 1 个 GPU，甚至可以进一步共享同一 GPU 的不同时段。\n\n-
    Rollout Workers 使用剩余 GPU 进行推理，也可与 Ref/RM 的 GPU 复用（时分复用）。\n\n\U0001F4A1 极端节省方案：将
    Ref 和 RM 量化为 8-bit，并使用 CPU 推理（llama.cpp），可将所有 GPU 资源集中给 Actor 和 Critic。\n\n---"

  reference_answer: |-
    [图片内容未导入]

    额外措施：

    - 监控新旧策略的 KL 散度，若过大（如 >0.02），应丢弃该批数据，重新采样。

    - 使用 早期停止：如果采样数据过时，其重要性权重方差极大，裁剪可以防止梯度爆炸，但可能损失样本效率。通常设定 KL 阈值触发重采样。

    高效实践：在采样数据中记录策略版本号。训练时检查版本，若版本差异超过预设阈值，自动丢弃并通知调度器启动新采样。


content:
  prompt: "❓ 为什么在 RLHF 的推理阶段，通常使用采样（Sampling）而不是 Beam Search？"
answer:
  mode: rubric
  reference_answer: "\U0001F50D 核心矛盾：探索 vs. 最优\n\n- Beam Search 是确定性搜索，旨在找到模型认为概率最高的回答。在
    RLHF 的推理中，如果用 Beam Search，Actor 每次只会生成非常确定的、高概率的输出，这将导致：\n\n- Sampling（随机采样） 则是按照模型输出的概率分布随机选择
    token。它为经验数据注入了必要的噪声和多样性，让 Actor 能够探索策略空间的更广阔区域，从而发现被 Beam Search 忽略的高奖励行为。\n\n\U0001F4A1
    RLHF 中的特例：在 Best-of-N 策略中，推理时会采样 N 个回答，然后用奖励模型选最优，这依然基于采样，而非 Beam Search。\n\n---"

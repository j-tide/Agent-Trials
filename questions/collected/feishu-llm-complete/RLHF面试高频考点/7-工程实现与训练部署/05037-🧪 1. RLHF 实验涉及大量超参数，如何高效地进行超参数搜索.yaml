content:
  prompt: "\U0001F9EA 1. RLHF 实验涉及大量超参数，如何高效地进行超参数搜索？"
answer:
  mode: rubric
  reference_answer: "RLHF的超参数空间维度极高且高度耦合，高效搜索需要分层策略、先验知识引导和自动化框架三者结合。\n\n\U0001F4CA
    超参数分类与优先级\n\n将超参数分为三个层级，优先确定高层级，再细化低层级：\n\n[嵌入表格未展开]\n\n\U0001F50D 搜索方法论\n\n-
    基于先验的粗搜：参考同规模模型（如LLaMA2‑Chat）的公开超参数，以它们为中心±50%进行网格或随机搜索。β通常从0.01~0.1，Actor学习率从1e‑6~5e‑6。\n\n-
    贝叶斯优化：使用Optuna、Ray Tune等工具，以最终对齐指标（如AlpacaEval胜率）为目标，进行多轮采样。优先使用TPE采样器处理混合型参数空间。\n\n-
    多保真度搜索：先用小批量数据或短训练步数（如1k steps）快速淘汰劣质组合，再将优质组合用于全量训练。典型工具：Hyperband、ASHA。\n\n-
    解耦搜索：利用PPO的on‑policy特性，可以先固定采样数据（从SFT模型生成一批固定的Rollout），然后仅在这批数据上搜索训练超参数（学习率、β、ε等）。这极大地加速了迭代，但需注意数据陈旧可能影响最终结果。\n\n-
    动态调整：对β等关键参数采用自适应策略（如目标KL调谐），减少对固定值的依赖。\n\n⚙️ 实践建议\n\n- 始终先调试Actor和Critic的学习率，它们对训练稳定性影响最大。\n\n-
    β的搜索范围宜小不宜大，在对数空间均匀采样（如log‑uniform 1e‑2到1e‑1）。\n\n- 固定GAE λ=0.95, γ=1.0是大多数文本任务的通用选择。\n\n-
    记录所有搜索试验的完整配置和结果，建立内部知识库，避免重复踩坑。\n\n---"

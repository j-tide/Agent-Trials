content:
  prompt: "\U0001F4C8 2. 如何记录和比较不同实验配置下的 RLHF 训练结果？需要追踪哪些关键度量？"
answer:
  mode: rubric
  reference_answer: "\U0001F3AF 关键度量分类\n\n[嵌入表格未展开]\n\n\U0001F4CA 实验记录最佳实践\n\n- 超参数与配置：使用YAML文件记录所有超参数、模型架构、数据版本、随机种子。与实验ID绑定。\n\n-
    曲线与分布：用Wandb/TensorBoard记录上述指标的时间序列和直方图，便于对比。\n\n- 评估快照：每隔一定步数（如1000步）自动运行一次完整评估（含人工评估的自动化代理），保存评估结果及对应模型检查点。\n\n-
    文本样本日志：定期记录生成样本，用于人工抽检风格、安全性和事实性。\n\n\U0001F19A 比较不同实验\n\n- 统一评估基准：使用相同的、独立的测试集和评测协议（如AlpacaEval
    2.0），避免“自己评自己”的循环。\n\n- 统计显著性：采用Bootstrap重采样计算指标的95%置信区间，判断提升是否显著。\n\n- 雷达图：绘制多维能力雷达图（有用性、诚实性、无害性、流畅性），直观对比实验A/B。\n\n-
    帕累托前沿：若同时优化多个目标（如安全与有用），绘制帕累托图，识别最优配置。\n\n---"

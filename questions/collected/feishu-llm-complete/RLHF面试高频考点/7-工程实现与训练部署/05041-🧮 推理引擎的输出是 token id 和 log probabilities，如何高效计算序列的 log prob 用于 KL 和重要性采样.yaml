answer:
  mode: rubric
  reference_answer: "\U0001F4E5 已有信息：推理引擎可以输出每个被采样 token 的对数概率 log⁡πθ(at∣st)logπθ(at∣st)。这正是我们所需要的。\n\n\U0001F9EE
    高效计算流程\n\n- 直接使用引擎输出：现代推理引擎（vLLM、TRT-LLM）都支持在生成时返回 token 级别的对数概率。只需在推理配置中设置 logprobs=1
    即可。\n\n- 聚合：\n\n- 与 Reference 的 KL：同样，Reference 模型只需对同一 prompt 和 response 进行一次前向传播（非生成），记录每个
    token 的 log_prob。两者相减即得 token 级 KL 散度的近似。\n\n⚡ 性能优化：避免在 Python 中逐 token 循环计算，应使用
    PyTorch 的向量化操作，或直接在 GPU 上完成聚合。部分推理引擎已支持直接返回聚合后的序列对数概率，省去手动求和。\n\n---"

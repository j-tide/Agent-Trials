content:
  prompt: "\U0001F4CA 5. 使用 Wandb 或类似工具追踪 RLHF 实验时，你会如何组织 panel 来对比不同实验？"
answer:
  mode: rubric
  reference_answer: "推荐仪表盘分层结构，便于从宏观到微观快速诊断。\n\n\U0001F3E0 主面板（实验对比）\n\n- 关键指标摘要表格：最终Reward、KL、熵、AlpacaEval胜率等。\n\n-
    小倍数图：每个实验一条曲线的Reward、KL、熵，便于对比趋势。\n\n\U0001F9EA 单实验深度面板\n\n- 训练健康：奖励、KL、熵、Critic
    Loss、Actor/Critic学习率、梯度范数、参数更新范数。\n\n- 生成质量：平均长度、长度分布直方图、EOS比率、distinct n‑grams。\n\n-
    奖励分析：奖励分布直方图（每N步）、分组奖励（安全/知识/创意）。\n\n- 系统监控：GPU利用率、显存占用、采样吞吐。\n\n⚙️ 技巧：\n\n- 使用Wandb的group和tags对实验分类，用compare
    runs功能并排展示。\n\n- 创建“实验报告”视图，固定结论和关键图表，便于团队异步评审。\n\n- 设置自动告警：KL超阈值、Reward NaN时通过Slack/邮件通知。\n\n---"

content:
  prompt: "\U0001F30D 如果推理集群和训练集群是物理分开的，中间通过网络传输大量文本数据和奖励，如何优化带宽？"
answer:
  mode: rubric
  reference_answer: "\U0001F6E3️ 物理隔离场景下的带宽瓶颈：跨数据中心或跨区域传输时，网络带宽远低于 GPU 内部互联，必须优化。\n\n\U0001F4E6
    优化手段\n\n- 压缩：文本数据压缩率极高。对生成的 token ID 序列使用 Zstandard 或 LZ4 压缩，可减少 80% 以上的传输体积。\n\n-
    稀疏化：仅传输关键 token 的信息。例如，不是传输每步的 log_probs，而是只传输被采样的 token 的概率，减少浮点数传输。\n\n- 批量与流水线：将多个采样批次的压缩包合并，通过长连接传输，减少
    TCP 握手开销。\n\n- 异步与预取：采样集群在训练集群消费上一批数据时，就异步地将下一批数据推送到训练集群的本地缓存，隐藏网络延迟。\n\n- 奖励计算的本地化：将
    RM 和 Ref 部署在训练集群一侧，推理集群只传输生成的 token ID，由训练集群自行计算奖励，避免奖励数据的往返。\n\n- 边缘计算：在推理集群本地缓存一个精简版的奖励模型，进行初筛，仅将有争议的样本发送给主奖励模型。\n\n---"

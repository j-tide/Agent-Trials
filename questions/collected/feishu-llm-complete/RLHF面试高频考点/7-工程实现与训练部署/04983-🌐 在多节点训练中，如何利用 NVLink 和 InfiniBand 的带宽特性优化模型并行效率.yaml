content:
  prompt: "\U0001F310 在多节点训练中，如何利用 NVLink 和 InfiniBand 的带宽特性优化模型并行效率？"
answer:
  mode: rubric
  reference_answer: |-
    NVLink（GPU 间直连，高带宽）：

    - 适用于张量并行（TP）：将单层权重切分到同一节点内的多张 GPU，每次前向需要 all-reduce 中间结果。NVLink 的高带宽（900 GB/s）能有效支持这种密集通信。

    - 优化：将 TP 组限制在同一个 NVSwitch 域内（通常一个节点内），避免跨节点 TP。

    InfiniBand（节点间网络，低延迟）：

    - 适用于数据并行（DP） 和 ZeRO：节点间需要梯度 AllReduce 或参数收集。InfiniBand RDMA 可提供高带宽（200–400 Gbps）和低延迟。

    - 优化：

    混合策略：

    - 节点内：TP 或 ZeRO 的分片内通信用 NVLink。

    - 节点间：DP 梯度同步用 InfiniBand。

    - 这种层次化并行能最大化通信效率。


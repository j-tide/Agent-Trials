content:
  prompt: "\U0001F691 如何处理训练过程中的故障恢复？推理节点或训练节点宕机后，如何从 checkpoint 接续？"
answer:
  mode: rubric
  reference_answer: "\U0001F534 故障类型\n\n- 推理节点宕机：部分采样任务失败。\n\n- 训练节点宕机：正在进行的梯度更新中断，可能丢失中间状态。\n\n-
    缓冲区崩溃：经验数据丢失。\n\n\U0001F504 恢复策略\n\n- 原子性 checkpoint：训练循环中，每个训练步结束后，原子性地保存一个检查点，包含：Actor
    和 Critic 权重、优化器状态、学习率调度器状态、当前步数和数据流位置。使用 torch.save 或分布式保存（如 DeepSpeed 的 checkpoint）。\n\n-
    断点续训：训练节点重启后，自动加载最近的 checkpoint，从断点继续。训练框架需保证所有数据分片都从同一 checkpoint 恢复，保持状态一致。\n\n-
    推理节点的容错：推理任务是无状态的（除了权重）。节点宕机后，调度器会将该节点的未完成任务重新分配给健康节点。由于采样数据未被持久化，丢失的批次可简单丢弃，只要缓冲区仍能提供足够数据。\n\n-
    预缓冲与冗余：在分布式训练中，启动少量冗余的 Rollout Worker，保证即使个别节点宕机，整体采样吞吐不跌破阈值。\n\n- 健康检查与自动恢复：使用
    Kubernetes 或 Ray 的自动重启机制，配合心跳检测，发现节点无响应立即重启 Pod 或 Actor。\n\n---"

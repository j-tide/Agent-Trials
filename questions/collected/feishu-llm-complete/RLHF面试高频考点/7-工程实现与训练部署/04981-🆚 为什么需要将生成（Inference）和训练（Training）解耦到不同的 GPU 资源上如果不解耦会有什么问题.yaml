content:
  prompt: "\U0001F19A 为什么需要将生成（Inference）和训练（Training）解耦到不同的 GPU 资源上？如果不解耦会有什么问题？"
answer:
  mode: rubric
  reference_answer: "\U0001F50D 核心矛盾：推理与训练的资源需求截然不同\n\n[嵌入表格未展开]\n\n\U0001F4A5 不解耦的灾难性后果\n\n如果强行让推理和训练共用同一批
    GPU：\n\n- 显存崩溃：PPO 训练同时需要 Actor、Critic、Ref、RM 四个模型，已经濒临显存上限。若再叠加推理时的 KV Cache，显存几乎必然溢出。\n\n-
    计算资源竞争：推理的串行解码会阻塞训练的大规模矩阵乘法，GPU 利用率在两者间剧烈震荡，墙钟效率极低。\n\n- 同步开销爆炸：推理需要频繁拉取最新 Actor
    权重，训练需要等待推理完成才能开始，两者串行交替会导致大量 GPU 空闲时间。\n\n✅ 解耦的优势：\n\n- 独立扩展：推理集群可单独水平扩展，提升采样吞吐；训练集群可聚焦梯度计算，使用高带宽网络。\n\n-
    资源利用率：推理集群可使用更适合推理的 GPU（如 T4、A10），训练集群使用顶级训练 GPU，成本最优。\n\n- 异步流水线：采样和训练可以流水线化，隐藏数据传输和模型同步的延迟。\n\n---"

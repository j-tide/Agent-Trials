content:
  prompt: "\U0001F310 数据并行、张量并行、流水线并行在 RLHF 训练中分别如何应用？和标准预训练有何不同？"
answer:
  mode: rubric
  reference_answer: "与预训练的差异：RLHF 中多了多个模型（Critic、Ref、RM）的加载和在线采样，显存和通信模式更为复杂。\n\n\U0001F4CA
    各种并行策略的应用\n\n- 数据并行（DP）：在每个 GPU 上复制完整的 Actor 模型，将 prompt 批次拆分给各 GPU 独立生成。在训练阶段，DP
    也用于并行计算梯度，并通过 AllReduce 同步。DP 是采样加速的基础。\n\n- 张量并行（TP）：当单个模型太大，一张 GPU 放不下时，将 Transformer
    的权重矩阵切分到多个 GPU 上。Actor 在训练时可用 TP，但在推理时通常不希望用 TP（因为增加通信）。RM 和 Ref 通常不用 TP，因为它们只是推理，可通过量化或较小的模型尺寸解决。\n\n-
    流水线并行（PP）：将模型按层切分到多个 GPU。在 RLHF 中，PP 主要用于非常深的 Actor 模型，但会引入气泡，且与在线采样的低延迟需求冲突，较少使用。\n\n\U0001F527
    混合并行策略：\n\n- Actor 训练：使用 TP + DP（ZeRO-2/3）。TP 解决单卡放不下的问题，DP 加速训练。\n\n- 推理采样：仅使用
    DP，每个 GPU 拥有完整模型，无 TP 通信开销。\n\n- Critic 训练：通常与 Actor 采用相同策略，但可独立配置。\n\n---"

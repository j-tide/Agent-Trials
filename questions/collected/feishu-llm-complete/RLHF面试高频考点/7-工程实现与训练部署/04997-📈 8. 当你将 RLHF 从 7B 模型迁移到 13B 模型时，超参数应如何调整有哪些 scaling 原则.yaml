content:
  prompt: "\U0001F4C8 8. 当你将 RLHF 从 7B 模型迁移到 13B 模型时，超参数应如何调整？有哪些 scaling 原则？"
answer:
  mode: rubric
  reference_answer: "大型模型对超参数更敏感，迁移需遵循以下原则：\n\n- β（KL系数）：通常保持不变或略微增大。大模型预训练能力更强，初始SFT分布更稳固，可以使用稍大的β防止过度偏离。\n\n-
    学习率：遵循sqrt scaling或线性缩放。若保持batch size不变，学习率应适当降低（如乘以√(7/13)或0.7倍），因大模型对更新更敏感。更稳健的做法是在小范围内重新扫描。\n\n-
    批次大小：受显存限制，batch size常被迫减小。此时应启用梯度累积以维持有效batch size，并按比例调整学习率（线性缩放）。\n\n- GAE
    λ 和 γ：通常不需要改变。\n\n- 更新轮数 K：大模型微调更容易过拟合同一批数据，K应减小（如从4减至2）。\n\n- 混合精度：强烈建议使用BF16，避免FP16的动态缩放问题。\n\n-
    并行策略：7B可能只用ZeRO‑2，13B需升级到ZeRO‑3或启用张量并行。\n\n\U0001F511 核心：务必进行少量学习率扫描（如3个值），其余超参数可沿用，这是效率最高的迁移路径。\n\n---"

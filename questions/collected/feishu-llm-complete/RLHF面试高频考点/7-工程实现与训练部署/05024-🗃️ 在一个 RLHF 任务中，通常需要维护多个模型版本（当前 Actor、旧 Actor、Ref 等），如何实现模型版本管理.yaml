content:
  prompt: "\U0001F5C3️ 在一个 RLHF 任务中，通常需要维护多个模型版本（当前 Actor、旧 Actor、Ref 等），如何实现模型版本管理？"
answer:
  mode: rubric
  reference_answer: "\U0001F4CB 版本管理需求\n\n- 当前 Actor：正在训练的模型，频繁更新。\n\n- 旧 Actor：用于
    PPO 重要性采样的参考策略，需要被快照。\n\n- Ref 模型：初始 SFT 模型的冻结副本，几乎不变。\n\n- Reward Model：可能独立迭代，有自己的版本。\n\n-
    Checkpoints：用于故障恢复。\n\n\U0001F6E0️ 管理策略\n\n- 语义化版本与标签：结合训练步数和时间戳：actor-step-12500-20240101.bin。Ref
    和 RM 使用固定标签（如 sft-v1.0）。\n\n- 中央模型仓库：使用对象存储（S3/MinIO）或 MLflow 的 Model Registry，存储所有权重，记录每个版本的元数据（训练参数、数据、评估分数）。\n\n-
    高效存储：对于 Actor 的频繁更新，无需每次都保存完整模型。可以保存 LoRA 适配器，或者基于差分保存（类似于 Git）。对于全量模型，保留最近 N
    个检查点，旧检查点删除以节省空间。\n\n- 工作节点缓存：推理和训练节点在本地缓存常用版本（如 Ref、RM），对于 Actor 版本，则按需从仓库拉取，并附带
    TTL（生存时间），过期后自动清理。\n\n---"

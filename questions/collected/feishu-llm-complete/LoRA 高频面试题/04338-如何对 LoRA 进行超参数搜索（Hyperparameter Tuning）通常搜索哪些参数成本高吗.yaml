content:
  prompt: 如何对 LoRA 进行超参数搜索（Hyperparameter Tuning）？通常搜索哪些参数？成本高吗？
answer:
  mode: rubric
  reference_answer: |-
    LoRA 的超参数空间相对较小，但搜索仍有一定成本。常见的搜索方法有网格搜索、随机搜索和贝叶斯优化。

    通常搜索的参数：

    - 秩 r：4, 8, 16, 32, 64。

    - 缩放系数 α (alpha)：与 r 相同或为其 2 倍（如 r=8 时 α=8 或 16）。

    - 学习率：对 LoRA 参数常用 1e-4, 2e-4, 5e-4, 1e-3；如果使用 LoRA+，还需搜索 B 与 A 的学习率比（如 4:1 到 16:1）。

    - 目标模块：仅 Q/V 投影 vs. 全部注意力投影 vs. 注意力+FFN。

    - dropout：LoRA 的 dropout 通常为 0.0 或 0.1。

    - 优化器：AdamW 或 8-bit Adam。

    - 训练 epoch 数 和 batch size。

    成本评估：

    - 相对于全量微调，LoRA 的训练速度快 3-5 倍，显存占用低，可以在单卡上快速实验。搜索成本相对低廉。例如，对每个配置训练 1-2 个 epoch 进行初步筛选（PPL 或下游验证指标），选出 top-k 候选，再对候选进行完整训练。利用 Hugging Face 的 Trainer 和 Optuna 集成，可自动化搜索。

    实践经验：通常 r 和 α 的搜索对最终效果影响最大，其次是学习率和目标模块。在资源允许时，我习惯用随机搜索 20-30 组配置，根据验证集的困惑度快速筛选出最优组合。


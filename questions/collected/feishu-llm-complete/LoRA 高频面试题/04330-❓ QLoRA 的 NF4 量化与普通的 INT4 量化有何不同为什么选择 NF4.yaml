    为什么选择 NF4？——信息论上的最优性

    QLoRA 的设计者追求在 4-bit 位宽下最大化信息保留。从信息论角度看，当数据的分布已知（这里假设为正态分布），为了使量化后的数据与原始数据之间的互信息（Mutual Information）最大化，量化台阶应该按照数据概率密度的累积分布函数（CDF）的分位数来设定。对于正态分布，这恰好对应一个“钟形”的非均匀量化网格。

    - 因为绝大多数权重值集中在零附近，NF4 在这些地方分配了更多的量化等级，从而保留了更多细节。

    - 对于极少出现的大值，NF4 分配了更少的等级，虽然损失了一些精度，但由于它们不常见，对整体模型质量影响极小。

    实践效果：实验证明，相比于均匀 INT4 量化，NF4 在同等位宽下，对模型困惑度（Perplexity）的影响更小，更接近全精度（FP16）的表现。这对于极低位宽的 QLoRA 至关重要，因为它确保了量化后的基座模型仍然保持高质量的知识表示，从而让 LoRA 能够在一个坚实的基础上进行微调。


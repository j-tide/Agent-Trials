  prompt: "\U0001F504 DyLoRA 在训练时随机采样秩，它解决了什么问题？推理时如何确定最终使用的秩？"
answer:
  mode: rubric
  reference_answer: |-
    DyLoRA (Dynamic LoRA) 主要解决了标准 LoRA 在推理前需要手动、费时地搜索最优秩 r 的问题。

    [图片内容未导入]

    它解决的问题：

    - 超参数调优的极大简化：标准 LoRA 为了找到性能和效率的最佳平衡，通常需要训练多个不同 r 值的模型进行比较。DyLoRA 只需训练一次，就能得到一个对多种不同 rr 值都表现良好的“超级 LoRA”。

    - 部署灵活性：同一个训练好的 DyLoRA 模块，在部署时可以根据不同设备或任务对延迟/精度的要求，灵活选择不同的秩，而无需重新训练。

    推理时确定最终秩：
    推理时不需要随机采样，而是根据实际的资源或性能需求，选择一个固定的 r 值进行推理。这个 r 值将直接截断 A 和 B 矩阵的前 r 维。由于 DyLoRA 在训练时已经学习到不同子空间的嵌套结构（即较小秩对应的矩阵是较大秩矩阵的前缀子集），所以即使只使用部分维度，模型仍然能保持较好的性能。


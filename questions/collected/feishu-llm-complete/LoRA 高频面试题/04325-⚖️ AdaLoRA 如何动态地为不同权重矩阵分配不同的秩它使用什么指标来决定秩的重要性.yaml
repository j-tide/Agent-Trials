  prompt: "⚖️ AdaLoRA 如何动态地为不同权重矩阵分配不同的秩？它使用什么指标来决定秩的重要性？"
answer:
  mode: rubric
  reference_answer: |-
    AdaLoRA (Adaptive Budget Allocation for LoRA) 解决了标准 LoRA 的一个核心局限：为所有层预设统一的秩 rr。在现实中，不同层对下游任务的贡献和需要的适配程度各不相同。AdaLoRA 能够在总参数预算不变的前提下，动态地为重要层分配更高的秩，为次要层分配更低的秩。

    核心指标：更新矩阵的奇异值

    [图片内容未导入]

    动态调整过程：

    - 重要性评分：AdaLoRA 使用一个基于敏感度的指标来定义每个奇异值的重要性。具体来说，它计算去掉某个奇异值（即将其置零）对训练损失的影响大小。影响越大，说明该奇异值对应的更新方向越重要。这个重要性可以通过损失对 Λ 的梯度或相关的近似量来高效估计。

    - 全局预算分配：训练过程中，AdaLoRA 定期在所有被 LoRA 化的权重矩阵之间进行“预算重分配”。它会根据各矩阵中奇异值的相对重要性，通过一个类似于“彩票”或“排序”的机制，剪掉最不重要的奇异值，并将节省出的参数预算重新分配给最重要的那些奇异值。例如，一个重要层的秩可能从 8 被提升到 12，而一个不重要的层则从 8 被削减到 2。

    优势：这种动态分配使得 AdaLoRA 在相同的总参数量下，能比标准 LoRA 获得更好的性能。它就像一位精明的投资经理，持续评估各个项目（层）的潜力（重要性），并将资金（秩）从低回报项目转移到高回报项目，从而实现整体收益的最大化。


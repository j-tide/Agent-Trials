content:
  prompt: "✅ 当你需要将 LoRA 适配器与预训练权重合并部署时，如何验证合并后的模型精度没有损失？"
answer:
  mode: rubric
  reference_answer: |-
    合并 LoRA 并部署是一个严谨的过程，绝不能简单合并后直接上线。我的验证流程分为离线定量、在线测试和兜底回滚三步。

    - 离线定量验证：构建“黄金评估集”

    - 任务对齐：评估集必须与实际业务场景高度匹配。如果是客服系统，就抽取 300 条涵盖高频、长尾和棘手场景的历史优质对话，并人工精标标准答案。

    - 多维度自动评分：使用 ROUGE-L、BLEU-4 等自动指标比较合并模型与原模型（基座+LoRA）的输出；使用 BERTScore 计算生成答案与标准答案的语义相似度。只要这些指标与原模型的差距在 1% 以内，即可视为初步通过。

    - 关键能力单元测试：对于安全性（如拒答率）、幻觉率（如 TruthfulQA 得分）、长文本记忆等专项能力，编写固定的测试 Prompt，确保合并后这些能力没有退化。

    - 在线测试：A/B 流量与实时监控

    - 金丝雀发布：在网关层配置流量路由，将 5% 的线上流量导向合并模型实例，其余 95% 仍由原 LoRA 服务。同时，我们监控小组实时观察 Grafana 面板。

    - 核心指标对比：对比两组在 P50/P99 延迟、用户点赞点踩率、对话平均轮次、生成文本的平均 token 数 上的差异。一旦合并组的点踩率出现显著上升或 P99 延迟恶化，立即触发告警。

    - 兜底回滚与灰度放量

    - 秒级回滚：合并模型的镜像和原 LoRA 服务镜像都已就绪。如果告警触发，运维只需在网关修改路由权重，将流量 100% 切回原服务，整个过程在 1 分钟内完成。

    - 逐步放量：离线验证通过后，先上线 5% 流量，观察 24 小时；若无异常，逐步提升至 20%、50%，最终全量切换。只有在全量稳定运行一周后，才将原 LoRA 服务下线。


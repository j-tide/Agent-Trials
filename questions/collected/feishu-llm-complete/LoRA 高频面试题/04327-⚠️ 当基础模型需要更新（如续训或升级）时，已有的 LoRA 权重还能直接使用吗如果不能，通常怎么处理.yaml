content:
  prompt: "⚠️ 当基础模型需要更新（如续训或升级）时，已有的 LoRA 权重还能直接使用吗？如果不能，通常怎么处理？"
answer:
  mode: rubric
  reference_answer: |-
    简短回答：不能直接使用，因为 LoRA 权重是相对于旧基座权重的残差，应用在新基座上会导致性能下降或不匹配。

    原因分析：

    [图片内容未导入]

    处理方式：

    - 重新训练（最稳妥）：使用新基座模型，重新用原来的微调数据训练 LoRA 模块。如果数据量不大，这往往是最高效的方案。

    - 初始化 + 轻量微调（折中方案）：将旧 LoRA 权重作为新 LoRA 训练的初始化，然后用少量数据（几百到几千条）进行轻量微调。这能让新 LoRA 快速适应新基座，节省训练时间。

    - LoRA 迁移技术（LoRA-X 等）：学术界提出了一些将 LoRA 在不同基座模型间迁移的方法，它们通过学习一个变换函数，将旧 LoRA 矩阵映射到新基座空间。但这类方法尚不成熟，且需要额外的训练开销，目前在实际生产中使用较少。

    - 差量合并（如果升级是基于旧模型的微调）：如果新基座模型是通过对旧基座进行微调得到的（比如从LLaMA-2-Chat升级到LLaMA-2-Chat-v2），且变动不大，理论上可以计算出两个基座的差值 ΔW，然后尝试将 LoRA 矩阵调整为 BA−ΔW（近似）。但这种方法风险较高，实际效果难以保证。

    实际建议：在工程项目中，当基础模型升级时，不要冒险。老老实实重新训练 LoRA 是最可靠的方法。如果时间紧迫，可以使用旧 LoRA 作为初始化，用升级后的新数据跑几个epoch的微调，这通常能快速恢复并超越原有性能。我们在一次LLaMA-2到LLaMA-3的迁移中，就是采用“旧LoRA初始化+新数据微调”的策略，仅仅用了原先10%的训练时间就达到了满意的效果。


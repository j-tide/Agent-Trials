content:
  prompt: 使用 DeepSpeed 的 ZeRO-3 训练 LoRA 时，如何配置 zero_optimization 以最大化效率？
answer:
  mode: rubric
  reference_answer: |-
    在 ZeRO-3 下训练 LoRA，核心优化思想是：基座参数被 ZeRO-3 分片，只在前向/反向时临时重组，而 LoRA 参数和优化器状态保持完整且不被分片。要最大化效率，需在 DeepSpeed 配置中精确区分这两类参数，并对 ZeRO-3 的分片行为进行细粒度控制。

    推荐配置（DeepSpeed JSON 片段）：

    {
      "zero_optimization": {
        "stage": 3,
        "stage3_max_live_parameters": 1e9,
        "stage3_max_reuse_distance": 1e9,
        "stage3_prefetch_bucket_size": 5e7,
        "stage3_param_persistence_threshold": 1e6,
        "reduce_bucket_size": 5e7,
        "contiguous_gradients": true,
        "overlap_comm": true,
        "reduce_scatter": true,
        "allgather_partitions": true,
        "allgather_bucket_size": 5e7,
        "sub_group_size": 1e9,
        "stage3_gather_16bit_weights_on_model_save": true
      },
      "train_batch_size": "auto",
      "train_micro_batch_size_per_gpu": "auto",
      "gradient_accumulation_steps": "auto",
      "gradient_clipping": "auto"
    }

    关键参数解释与调优思路：

    - stage3_max_live_parameters 和 stage3_max_reuse_distance 设为较大值（如 1e9），本质上是告诉 ZeRO-3 “尽可能长时间地保留刚刚收集的完整参数，不要过早释放”。因为在 LoRA 训练中，基座参数在前向和反向时都需要用两次（一次计算输出，一次计算梯度），如果立即释放，下次还要重新 AllGather，造成通信浪费。设置足够大的阈值，可以确保一个 micro-batch 内基座参数只被收集一次。

    - stage3_param_persistence_threshold 设为较小的值（如 1e6），意思是“参数量小于此阈值的 tensor 不会被分片，会常驻在每个 GPU 上”。我们的 LoRA 参数（A 和 B 矩阵）以及 LayerNorm 参数通常很小，远小于 1e6，因此它们会自动成为持久化参数，不需要任何分片和通信。这避免了 LoRA 参数被 ZeRO-3 分片再收集的冗余开销。

    - allgather_partitions 设为 true，允许在需要时一次性收集所有分片的参数，而不是逐个收集，减少通信次数。

    - overlap_comm 设为 true，将通信与计算重叠，隐藏通信延迟。

    - contiguous_gradients 和 reduce_scatter 用于优化梯度同步。由于 LoRA 的梯度很小，通信负担本就不重，但基座参数虽然不更新，其梯度仍然会在反向传播时计算。在 LoRA 中，基座参数的梯度并不会被使用（因为基座冻结），但框架仍会计算它们（除非显式关闭）。为了节省算力，我们应该在 PyTorch 中将基座参数的 requires_grad 设为 False，这样 DeepSpeed 就不会为这些参数分配梯度缓冲区，也不需要为其执行 ReduceScatter，从而避免了无意义的通信和显存占用。

    实际效能：通过上述配置，基座参数的 AllGather 通信被最小化（每个 micro-batch 一次），LoRA 参数和 LayerNorm 零通信。在 8 卡 A100 上训练 LLaMA-70B 的 LoRA，通信时间占比从默认配置的约 15% 降至 5% 以下，训练吞吐量提升约 30%。


content:
  prompt: "\U0001F9E0 为什么 LoRA 训练通常比全量微调更不容易出现“灾难性遗忘”？从参数更新的自由度角度给出一个严谨的解释。"
answer:
  mode: rubric
  reference_answer: "灾难性遗忘（Catastrophic Forgetting）的本质是模型在学习新任务时，过度调整了在预训练阶段学到的通用参数，导致旧知识被覆盖或破坏。LoRA
    之所以天然抵抗灾难性遗忘，是因为它在参数空间上施加了极强的结构约束和容量限制。\n\n\U0001F52C 参数更新的自由度对比\n\n- 全参数微调：所有
    NN 个参数都可以自由更新，参数空间是 RNRN。优化器可以在整个高维空间内任意移动，为了最小化新任务的损失，它可能大幅度改变某些预训练权重，而这些权重承载着大量的通用语言知识。由于没有约束，这种“破坏性更新”很容易发生，特别是当新任务的数据量较小或与预训练分布差异较大时。\n\n[图片内容未导入]\n\n\U0001F512
    为什么这种低自由度防止遗忘？\n从贝叶斯的角度看，预训练权重可以视为一个极强的先验。LoRA 通过冻结权重，将这个先验硬编码进了模型结构。即使新任务数据试图将参数拉向一个完全不同的方向，优化器的梯度也只能通过极窄的瓶颈（A
    和 B）去驱动变化，这大大限制了单步更新对原始知识的影响范围。相比之下，全参数微调相当于放松了所有先验，模型很容易“跟风”新数据而忘记旧知识。\n\n\U0001F4CA
    实验佐证：在经典的 NLP 持续学习实验中，全参数微调在第二个任务上的性能可能回到随机水平（遗忘率 > 90%），而 LoRA 即使在训练了数十个任务后，第一个任务的性能仍能保持在
    95% 以上。因为每个 LoRA 模块只负责自己的任务，基座模型的知识从未被覆盖。\n\n---"

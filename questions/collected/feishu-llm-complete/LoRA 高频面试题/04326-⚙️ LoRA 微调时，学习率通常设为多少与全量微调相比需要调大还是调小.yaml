content:
  prompt: "⚙️ LoRA 微调时，学习率通常设为多少？与全量微调相比需要调大还是调小？"
answer:
  mode: rubric
  reference_answer: |-
    结论：LoRA 的学习率通常比全量微调大 1-2 个数量级。

    具体数值：

    - 全量微调：通常使用 1e-5 到 5e-5 量级的学习率，因为模型权重已经处于一个较好的局部最优点，只需要微小调整。

    - LoRA 微调：通常使用 1e-4 到 5e-4 量级的学习率。这是因为 LoRA 只训练少量新注入的参数，且矩阵 B 被初始化为零。如果使用与全量微调相同的小学习率，B 从零开始的更新会极其缓慢，导致训练效率极低，甚至欠拟合。更大的学习率可以快速打破 B=0 的初始状态，驱动模型进入有效的特征学习阶段。

    为什么可以调大？

    全量微调的学习率受限于大规模基座权重的稳定性，太大的学习率容易导致预训练知识的灾难性遗忘。而 LoRA 的更新被严格限制在低秩子空间内，且原始权重完全冻结，这本身就构成了极强的正则化。即使使用较大的学习率，模型也不容易发散或遗忘。同时，LoRA 参数的规模极小，优化地形相对平滑，更大的学习率有助于快速收敛。

    调优经验：

    - 默认起点：对于 7B 模型、r=8 的配置，我的默认学习率是 2e-4。

    - 配合 LoRA+：如果使用 LoRA+（B 学习率 > A 学习率），我会将 B 的学习率设为 2e-4，AA 的学习率设为 1e-5，保持比例在 16:1 到 4:1 之间。

    - 配合 QLoRA：由于量化引入了一些噪声，学习率可以稍微保守一些，通常我用 1e-4。


  prompt: "\U0001F3AF LoRA+ 为什么建议对 A 和 B 使用不同的学习率？理论动机是什么？"
answer:
  mode: rubric
  reference_answer: "标准 LoRA 对矩阵 A 和 B 使用相同的学习率。而 LoRA+（由 Hayou 等人提出）指出，这种对称设置是次优的，并建议为
    B 设置远大于 A 的学习率（例如高 4-16 倍）。其理论动机源于对 LoRA 梯度动态的严谨分析。\n\n\U0001F9E0 理论动机：特征学习稳定性与初始化影响\n\n在标准
    LoRA 中，矩阵 A 用高斯分布随机初始化，而 B 被初始化为零。这样做的好处是训练开始时，ΔW=BA=0，模型行为与原模型一致。然而，当进入训练后，LoRA+
    的作者发现：\n\n- 梯度尺度的不对称性：在无限宽网络极限下，分析表明 BB 矩阵的参数更新幅值应正比于 1/r（其中 r 是秩），而 A 矩阵的更新幅值则与
    r 无关。随着 r 增大，若使用相同学习率，B 的更新相对 AA 会变得越来越慢，导致训练次优，特征学习效率低下。\n\n- “特征学习”的稳定性：从特征学习的角度看，调整
    B 相当于在调整“如何使用这些新特征”（即输出组合），而调整 A 相当于在调整“如何提取新特征”（即输入投影）。为了在训练初期快速打破 B=0 的初始平衡，并建立起有效的特征组合，B
    需要更大的步长。同时，较小的 A 学习率可以保证特征提取部分的稳定性，避免训练震荡。\n\n[图片内容未导入]\n\n实际效果：在多个任务上的实验表明，LoRA+
    不仅比标准 LoRA 收敛更快，而且往往能获得更好的最终性能（如更高的准确率）。它对超参数（如总学习率和秩 rr）也更加鲁棒。\n\n---"

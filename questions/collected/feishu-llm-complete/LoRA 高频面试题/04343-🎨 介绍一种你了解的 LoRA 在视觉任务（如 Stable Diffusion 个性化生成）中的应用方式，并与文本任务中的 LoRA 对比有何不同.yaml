content:
  prompt: "\U0001F3A8 介绍一种你了解的 LoRA 在视觉任务（如 Stable Diffusion 个性化生成）中的应用方式，并与文本任务中的
    LoRA 对比有何不同。"
answer:
  mode: rubric
  reference_answer: |-
    LoRA 在视觉领域的典型应用是Stable Diffusion 的个性化图像生成，俗称“AI 写真”或“角色定制”。

    应用方式：

    用户提供少量（3-10 张）特定主体（如一只自家的猫、一个特定的人物角色或一种特定的画风）的图像。微调的目标不是让模型学会用文本描述这只猫，而是教会模型识别一个代表“这只猫”的新特殊标识符，并能在新的、不同的上下文（如“让猫穿宇航服在月球上”）中生成该主体的图像。

    具体实现中，LoRA 的低秩适配器通常被应用于 U-Net 的注意力层（特别是交叉注意力层，这是文本与图像交互的关键位置）。通过微调少量参数，LoRA 可以有效地将新主体的视觉特征“注入”到模型中，而不会破坏模型原有的广泛生成能力。

    与文本任务中 LoRA 的对比：

    总结：视觉 LoRA 更像一种高维视觉概念的“存储卡”，它精确地插入到模型看到特定标识符时的反应路径中；而文本 LoRA 更像一套语言行为的“规则调校器”，它广泛地调整了模型在各类输入下的输出策略。二者原理相通，但服务于完全不同的模态和任务目标。


content:
  prompt: "\U0001F680 PiSSA 用 SVD 初始化 LoRA 矩阵，为什么能加速收敛？与标准随机初始化相比有何优势？"
answer:
  mode: rubric
  reference_answer: |-
    PiSSA (Principal Singular values and Singular vectors Adaptation) 的核心思想是：LoRA 的矩阵 A 和 B 不应该被随机初始化，而应该用原始权重矩阵 W 的 SVD 分解结果来初始化。

    原理与加速收敛的原因：

    标准 LoRA 的初始化（A 高斯，B 为零）意味着训练从零开始，优化器需要从头探索一个低秩子空间来逼近全量微调的更新。这需要时间。

    PiSSA 的做法是：

    - 对预训练权重 W（或其梯度、或其某个变换）进行奇异值分解。

    - 取出前 r 个最大的奇异值及其对应的左、右奇异向量。

    - 用这些信息初始化 A 和 B，使得初始的 ΔW=BA 恰好是 W 的一个最佳低秩近似。

    这就好比，标准 LoRA 是在黑暗的房间里盲人摸象，从一个随机点开始寻找低秩修正。而 PiSSA 直接从大象（原始权重）本身提取出其最核心的低秩结构作为起点。由于这个起点已经非常接近潜在的最优解，优化器只需在这个良好的初始化附近进行微调，因此收敛速度大幅提升。

    与标准随机初始化的优势：

    - 极快的收敛速度，尤其在训练初期。

    - 在相同训练步数下，往往能获得比标准 LoRA 更低的损失。

    - 本质上是对原始权重信息的直接利用，减少了对随机探索的依赖。


content:
  prompt: LoRA+ 提出对 A 和 B 使用不同的学习率，且 B 的学习率要更大。A 和 B 的功能分工是什么？为什么这种分工意味着它们需要不对称的学习率？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    标准 LoRA 的初始化：A 采用随机高斯初始化，B 初始化为零。这样在训练初始时 ΔW=0，模型行为与原模型完全一致。

    为什么需要不对称学习率：LoRA+ 的作者通过理论分析发现，在无限宽网络极限下，矩阵 B 的参数更新幅值应当与秩 r 成反比，而 A 的更新幅值与 r 无关。当使用相同的学习率时，随着 r 增大，B 的更新会相对于 A 变得越来越慢，导致特征组合的学习严重滞后，训练陷入次优。为了让 A 和 B 以协调的速率共同学习，应该让 B 使用比 A 更大的学习率（通常建议 4-16 倍）。较大的 B 学习率能快速打破 B=0 的初始状态，建立起有效的输出组合，而较小的 A 学习率则保证了特征提取部分的稳定性，避免训练震荡。这种不对称设置被证明能加速收敛并提升最终性能。

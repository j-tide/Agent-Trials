content:
  prompt: "\U0001F4C8 训练一个 1B 模型和 7B 模型，显存需求的比例是线性吗？为什么？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 答案：近似线性但不完全线性，因为激活和 KV Cache 等部分并非严格正比于参数量。\n\n\U0001F50D
    分解显存组成：\n\n- 权重、梯度、优化器状态：这些与参数量直接成正比，是线性的。1B 到 7B 增长 7 倍，这部分显存也增长 7 倍。\n\n- 激活值：激活显存取决于
    batch × seq_len × hidden_size × 层数。hidden_size 通常与参数量开方成正比（例如 1B 模型 hidden≈2048,
    7B 模型 hidden≈4096），层数也大致按比例增加。所以激活显存的增长因子介于 4-7 倍之间，并非精确的 7 倍。因此，总显存增长比 7 倍略低或略高，但通常可视为近似线性。\n\n-
    模型架构差异：如果 7B 采用 GQA 或多头数差异，会影响 KV Cache 大小，从而影响比例。\n\n\U0001F4CA 实际例子：\n\n假设 Llama
    风格模型，FP16 全量微调，batch=1, seq=2048。\n\n1B: hidden=2048, 层数=16，参数量 1B。\n\n7B: hidden=4096,
    层数=32，参数量 7B。\n\n权重+梯度+优化器：1B 约 12GB；7B 约 84GB。\n\n激活（粗略计算）：1B 约 1.5 GB；7B 约 10
    GB。\n\n总显存：1B 约 13.5 GB；7B 约 94 GB，比例约 6.96，非常接近 7。因为激活占比相对小，所以整体近似线性。但当模型更大或序列更长时，激活占比会增大，比例可能偏离线性。\n\n因此，在小规模下，显存需求大致正比于参数量，但由于激活和架构细节，存在轻微非线性，规划时可采用线性估算留出余量。\n\n---"

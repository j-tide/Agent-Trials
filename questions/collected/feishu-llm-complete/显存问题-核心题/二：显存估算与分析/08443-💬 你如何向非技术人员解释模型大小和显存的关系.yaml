content:
  prompt: "\U0001F4AC 你如何向非技术人员解释“模型大小和显存的关系”？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 我会用“图书馆与书架”的比喻来解释。\n\n想象有一个超级大脑（GPU），它有一个超大书架（显存），书架上有固定数量的格子。\n\n-
    模型大小就像一套百科全书的总字数。如果书是黑白印刷（低精度，如 INT4），占的格子少；如果是彩色全铜版纸（高精度，如 FP32），占的格子多。\n\n-
    显存就是书架能放下多少本书同时打开。推理时，你必须把整套书（模型权重）放在书架上，然后每读一句（生成一个 token），还要在书架上记笔记（KV Cache）。句子越长，笔记越多，需要的书架空间越大。\n\n-
    如果你想让多个人同时问问题（批处理），就需要同时摊开更多的笔记，书架可能就不够了。\n\n- 训练时，不仅要有书，还要有草稿纸（梯度）、计算器（优化器状态），所以占的格子多得多。\n\n-
    所以，模型越大（字数多）越占书架；精度越高（彩色）越占书架；上下文越长（笔记多）越占书架。如果书架放不下，要么换小点的书（量化），要么用多个书架（多卡并行）。\n\n总结成一句话：显存就是工作台的大小，模型、笔记都要放在上面，台子越大，能同时处理的东西越多。\n\n---"

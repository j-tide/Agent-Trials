content:
  prompt: "\U0001F198 如果推理框架报告 OOM，但 nvidia-smi 显示还有空闲显存，可能是什么原因？"
answer:
  mode: rubric
  reference_answer: |-
    这种情况常见，主要原因：

    - PyTorch 的缓存分配机制：PyTorch 使用自己的 CUDA 缓存分配器，它不会立即将未使用的内存归还给系统（即不会调用 cudaFree），而是保留在缓存池中以备后用。nvidia-smi 显示的是进程占用的总显存（包括 PyTorch 已分配但未实际使用的缓存块）。而 OOM 错误通常发生在 PyTorch 分配器尝试从缓存池中分配时，发现没有足够的连续可用块，尽管总空闲（缓存内空闲 + 未分配）可能还很大。这称为内存碎片问题。

    - 碎片化：即使总空闲显存足够，但如果没有足够大的一块连续显存来满足分配请求，也会 OOM。大张量分配需要连续物理显存，频繁的分配和释放可能导致碎片化。PagedAttention 就是为了解决 KV Cache 碎片化设计的。

    - 其他进程占用：nvidia-smi 显示的是所有进程的总和，如果有其他进程（如另一个模型或 GUI）占用了部分显存，本进程可用的会减少。

    - CUDA context 开销：驱动为每个 context 保留一些显存，nvidia-smi 可能把这部分也算在该进程下，但实际上不可用于模型。

    - 框架预留未释放：有些推理框架会预先分配一大块显存作为 workspace，即使当前未使用，也不会释放，导致后续分配失败。

    - CPU 内存不足导致的 swap？ 不太可能，但显存-内存间数据搬运也可能造成 OOM，如果无可用 pinned memory。

    排查建议：使用 torch.cuda.memory_summary() 查看 PyTorch 的内存分配详情，观察缓存分配器中的空闲块分布。使用 py-spy 等工具检查程序状态。优化措施包括：使用统一内存分配器、启用 PagedAttention、减少碎片化操作（如一次性分配大的缓冲区）。

    ### 推理时，模型权重的显存占用和 KV Cache 的比例通常如何？

    这个比例完全取决于序列长度与模型规模的博弈。在短序列、小批次推理中，权重往往占大头；一旦上下文变长，KV Cache 会迅速反超。

    几种典型配比（以 FP16、单 batch 为例）：

    - 短文本（512 tokens）
    7B 模型：权重 14 GB，KV Cache 约 0.25 GB，权重占绝对主导（≈98%）。
    70B 模型：权重 140 GB，KV Cache（GQA 8组）约 0.8 GB，权重依然是绝对主力。

    - 中等长度（2048 tokens）
    7B 模型：权重 14 GB，KV Cache 约 1 GB，比例约 14:1。
    70B（GQA）模型：权重 140 GB，KV Cache 约 3.2 GB，比例约 44:1。

    - 长上下文（128K tokens）
    7B 模型：权重 14 GB，KV Cache 爆增至 64 GB（假设无 GQA，32 头），比权重还大，比例 0.22:1。
    70B（GQA 8 组）模型：权重 140 GB，KV Cache 约 200 GB（估算），比例约 0.7:1，KV Cache 明显超过权重。

    规律总结：

    对于当前流行的 7B-13B 模型 + 4K 上下文的常见部署，权重仍是主要占用。但当上下文扩展至 32K 以上、或没有 GQA/MQA 时，KV Cache 会成为新的显存黑洞。因此，长上下文推理必须引入 KV Cache 量化、GQA 或 PagedAttention 等优化。这也是为什么很多推理框架把“KV Cache 显存管理”作为核心设计要点。

    ---

    ### 对于 MoE 模型（如 Mixtral 8x7B），推理显存应按照总参数量还是激活参数量来估算权重部分？

    答案是：必须按总参数量来估算权重显存，因为推理时所有专家都需要被加载到显存中。

    Mixtral 8x7B 的“8x7B”并不是 8×7=56B，而是 8 个专家，每个专家是一个约 7B 的前馈网络（FFN），加上共享的注意力层等。其真实总参数量约为 46.7B（而非 56B），但推理时每个 token 只激活 2 个专家，所以计算量确实对标一个约 12.9B 的稠密模型——这也是它速度快的原因。

    但计算量≠显存。要执行 top-2 专家的路由，你必须在显存中保持全部 8 个专家的权重，因为不同 token 激活的专家不同，无法提前只加载部分。即使使用专家并行（Expert Parallelism）将不同专家分布到不同 GPU，每张卡仍要加载自己负责的专家权重，总显存占用依然等于总参数量。

    所以权重显存的估算是：总参数量 × 每参数字节数。FP16 下 Mixtral 8x7B 约占 46.7B × 2 = 93.4 GB；INT4 量化后约 23.4 GB。而实际推理时的激活参数量仅用于估算计算量和延迟，不能用来估算显存。

    ---

    ### 推理 MoE 时，所有专家都必须加载吗？显存如何估算？

    是的，所有专家都必须加载到显存，但可以通过专家并行（Expert Parallelism）分散到多张 GPU 上。

    单卡场景：

    所有专家权重常驻显存。每个 token 只激活 2 个专家，但为了服务不同 token，全部 8 个专家都要随机待命。因此单卡显存 = 总参数量权重 + KV Cache + 激活。

    多卡专家并行：

    将不同的专家放在不同的 GPU 上，例如 Mixtral 8x7B 放在 4 张 GPU 上，每张卡只存储 2 个专家。推理时，每个 token 的 router 输出选择 top-2 专家，如果它们恰好不在同一张卡上，就需要通过 all-to-all 通信将 token 的隐状态发送到对应专家所在的 GPU 进行计算，再传回结果。这样单卡权重显存降至原来的 2/8 = 1/4，但引入了通信开销。

    估算方法：

    - 总参数量 P（如 46.7B），精度 bytes（如 2），则总权重显存 = P × bytes。

    - 如果使用 N 路专家并行，单卡权重显存 ≈ (P / N) × bytes（忽略共享的注意力层等，实际略有增加）。

    - 仍需加上 KV Cache 和激活（激活量与 batch 和序列长度成正比，受专家并行影响小）。

    因此 MoE 推理显存的第一个原则就是：总参数量决定存储，专家并行度决定单卡存储分摊。

    ---

    ### 如果推理时使用 TP=4，权重显存会变成原来的多少？KV Cache 呢？

    TP（张量并行）会将模型的每一层的权重矩阵沿 hidden dimension 切分到 4 张 GPU 上，因此：

    - 权重显存：单卡权重显存变为原来的 1/4（严格说是约 1/4，因为有些层如 LayerNorm/RMSNorm 参数量极小，可能复制或切分后总占用略增，但总体可认为线性减少）。

    - KV Cache：张量并行对 KV Cache 的影响取决于切分方式。通常 TP 对注意力头进行切分，即每个 GPU 只存部分头的 K 和 V。因此，单张卡上的 KV Cache 也变为原来的 1/TP 度，即 1/4。因为每个头独立产生 K、V，切片到不同 GPU 自然就分割了。

    - 激活与中间缓冲：同样被切分，单卡激活也约降至 1/4。

    总结：TP=4 时，单卡所有权重、KV Cache、激活显存均大致降至 1/4。这使得一张原本装不下的大模型可以在多张较小 GPU 上运行。代价是每层需要两次 all-reduce 通信，对卡间带宽（NVLink/PCIe）要求高。

    ---

    ### 如何估算在苹果 M2 Ultra 上运行 7B 模型的显存需求？（统一内存）

    苹果芯片的统一内存架构（UMA）让 CPU 和 GPU 共享同一块物理内存，不存在显存和内存的拷贝。估算时可将其视为“总内存占用”，与 PC 的显存估算一样，但要考虑操作系统和其他应用保留。

    步骤：

    - 模型权重：FP16 7B 约占 14 GB。如果使用 Core ML 或 MLX 的量化格式（如 INT4），可降至 3.5 GB 左右。

    - KV Cache：取决于上下文长度。假设 2048 长度，使用 GQA（如有）或无 GQA，计算公式相同。7B 无 GQA 时，约 1 GB；有 GQA（如 4 组）约 0.25 GB。

    - 运行时开销：Core ML/MLX 等框架会有少量中间缓冲，约 0.5–1 GB。

    - 系统预留：macOS 自身、窗口服务器等占用部分统一内存。在 64 GB 或 96 GB 的 M2 Ultra 上，通常空闲可达 50-80 GB，足够运行。

    - 总占用：14 GB (权重) + 1 GB (KV) + 1 GB (缓冲) ≈ 16 GB。因此一台 64 GB 的 M2 Ultra 可以轻松运行 7B FP16 模型，并支持较长的上下文或更大的 batch。

    注意：苹果的统一内存带宽极高（M2 Ultra 达 800 GB/s），这往往是推理速度的保障，但容量需自行确保。使用 sudo sysctl iogpu.wired_limit 可以预留更多内存给 GPU（默认约 60-70% 总内存），对大规模模型很重要。

    ---

    ### 推理时使用 CPU 推理（llama.cpp），内存占用如何估算？

    llama.cpp 使用纯 CPU 推理，内存占用计算与 GPU 类似，但权重和 KV Cache 都驻留在系统内存（RAM）中，并且可以利用内存映射（mmap） 延迟加载权重，减少物理内存占用。

    估算公式：

    - 权重内存：取决于量化格式。例如 Q4_K_M（约 4-bit）每参数约 0.5 字节 + 少量量化参数，7B 模型约 3.5–4 GB；Q8_0（8-bit）约 7 GB；FP16 约 14 GB。如果使用 mmap，物理内存实际占用可能小于文件大小（按需分页），但为了性能通常还是会全部加载。

    - KV Cache：同样根据上下文长度计算，但 llama.cpp 默认使用 FP16 存储 KV Cache（可配置为量化，如 Q8_0 或 Q4_0 以节省内存）。例如 7B 无 GQA，2048 长度 FP16 KV Cache 约 1 GB；若使用 Q4_0 KV Cache 则约 0.25 GB。

    - 其他：临时缓冲区、激活等占用很小（几十到几百 MB）。

    - 总内存 ≈ 权重内存 + KV Cache 内存 + 几百 MB。

    以 7B Q4_K_M 模型为例，2048 上下文，FP16 KV Cache，总内存 ≈ 4 GB + 1 GB = 5 GB。即使是 16 GB 内存的笔记本也能流畅运行。对于 70B 模型，Q4_K_M 权重约 35 GB，FP16 KV Cache 可能 2-4 GB，总计约 40 GB，需要 64 GB 内存的机器。若使用 Q4 KV Cache，则更省。

    因此，llama.cpp 的内存预估核心就是：量化权重 + 量化/非量化 KV Cache + 少量开销。mmap 可降低物理内存压力，但不改变虚拟内存占用。

    ---

    ### 为什么推理框架有时会预留显存，造成实际可用显存减少？

    推理框架（特别是 vLLM、TensorRT-LLM、LMDeploy 等高性能框架）为追求低延迟、高吞吐，会预先分配大块显存，而不是按需动态分配。这种预留机制有以下几个原因：

    - 减少碎片：动态分配会导致显存碎片，大量小块空闲但无法满足大块连续请求。预留一整个连续块作为 KV Cache 池，可以避免外部碎片。

    - 避免运行时分配开销：模型加载后，预先分配 workspace 和 KV Cache block，后续请求只需从池中获取，零 malloc 调用，降低延迟抖动。

    - GPU 虚拟内存管理：某些框架使用 CUDA 虚拟内存 API 预留地址空间但不立即映射物理页，看起来占用高，实际物理占用可能低，但 nvidia-smi 显示的是虚拟占用，导致“占用大”的错觉。

    - P2P 通信缓冲区：多卡并行的框架会预留用于 all-reduce 或 all-to-all 的缓冲区，这部分也常驻显存。

    - 模型预热：框架可能执行一次或几次前向推理进行性能校准（如选择最佳算法），这些产生的中间结果也可能留在缓存分配器中，不释放。

    因此，预留显存是一种性能换空间的设计。用户看到 nvidia-smi 的高占用，实际可能包含大量“可回收但未被释放”的缓存池。如果确实 OOM，可以通过配置（如 --gpu-memory-utilization 在 vLLM 中）来限制框架最大占用比例，避免系统崩溃。

    ---

    ### 推理一个多模态大模型（如 LLaVA），视觉编码器部分会额外占用多少显存？

    LLaVA 等模型在 LLM 基础上增加了一个视觉编码器（通常是 CLIP ViT-L/14）以及一个多模态投影层。视觉编码器参数量独立，需要常驻显存。

    - CLIP ViT-L/14：约 300M 参数（0.3B）。FP16 下约 0.6 GB。

    - 多模态投影层（简单的线性层或 MLP）：参数量很小，几十 MB 可忽略。

    - 视觉输入产生的中间激活：处理一张或一批图片（如 576 个 token）会带来短暂的峰值激活，但编完码后得到视觉特征 token，它们的 KV Cache 已经融入 LLM 的 KV Cache 中（视觉 token 也参与 LLM 的自回归）。所以额外的常驻显存主要是视觉编码器的权重。

    因此，LLaVA-7B 在 LLM 7B 基础上，权重显存约增加 0.6 GB（FP16），总权重 ≈ 14.6 GB，相比纯 LLM 增加约 4%。如果是 LLaVA-13B，视觉编码器仍然是同一个 ViT-L，增量依然是 0.6 GB，占比更小。对于更大的视觉模型（如 ViT-G），可能增加数 GB，但通常仍远小于 LLM 权重。所以多模态的额外显存主要来自视觉编码器权重，常驻内存量不大。

    ---

    ### 投机采样（Speculative Decoding）对推理显存的影响是怎样的？

    投机采样引入了一个小尺寸的草稿模型（draft model），与目标大模型同时驻留显存，从而加速生成。因此显存必然增加，增加量约为草稿模型的全部权重和其 KV Cache。

    - 草稿模型大小：通常选用同系列的小模型，如 7B 目标模型配 0.5B 或 1.5B 草稿模型。FP16 下 0.5B 约 1 GB，1.5B 约 3 GB。

    - 草稿模型的 KV Cache：投机采样一次产生 K 个 draft tokens（如 5 个），所以草稿模型的 KV Cache 对应这 K 个 token，非常小（通常几 MB）。

    - 额外开销：draft 与 target 可能会共享部分权重（如 Medusa heads 或 eagle 的 feature 网络），但完全独立的小模型则需全量加载。

    - PagedAttention 下的共享：目标模型和草稿模型需要各自独立的 KV Cache 池，但占比较小。

    因此，使用独立草稿模型的投机采样，总显存约增加 0.5B-3B 参数量对应的权重（1-6 GB FP16），对于已有大模型的 48GB 或 80GB 卡来说增量在 5-10% 左右，可接受。若采用自投机（self-speculative）或基于目标模型自身的跳层草稿，则可大幅减少额外权重（仅增加少数预测头），显存增量可忽略不计。所以，投机采样以少量显存换取了 2-3 倍的生成加速，在显存充足时是极佳的优化手段。

    ---

    ### 推理服务中，多 LoRA 适配器同时加载时，显存如何估算？

    服务化推理通常需要支持多个 LoRA 适配器（对应不同用户或任务），并热加载到基础模型上。显存估算需考虑：

    - 基础模型权重：不变，全量加载。

    - 每个 LoRA 适配器：由低秩矩阵 A 和 B 组成，参数量非常少，通常为基础模型参数量的 0.1%-1%。例如 7B 模型使用 rank=16 的 LoRA 作用于所有线性层，参数量可能约 10-30M，FP16 下每个适配器约占 20-60 MB。

    - 同时加载的 LoRA 数量：如果同时服务 100 个 LoRA 用户，且适配器都需常驻显存，则总 LoRA 权重 ≈ 单适配器大小 × 数量。比如 30MB × 100 = 3 GB。对 48GB 显卡，增加了 6% 左右，影响不大。

    - KV Cache：不同 LoRA 请求共享基础模型的 KV Cache 池（因为 base weights 相同，前缀相同可共享，但不同 LoRA 生成内容不同，后续不共享）。所以 KV Cache 与不加载 LoRA 时基本相同，额外占用可忽略。

    - 内存管理：框架如 vLLM 支持 LoRA 权重在线动态加载/卸载，或使用 LoRA 交换到 CPU 内存。此时显存只需驻留正在被活跃请求使用的适配器，可以显著降低对显存的压力。

    估算结论：单 LoRA 极轻量，多 LoRA 的显存开销 = 基础模型 + KV Cache 池 + 活跃 LoRA 适配器总大小。例如 7B 基础模型 14 GB，KV Cache 规划 10 GB，100 个活跃 LoRA 各 30 MB 共 3 GB，总计约 27 GB，可放在一张 32 GB V100 上。设计时应支持 LoRA 交换以减少常驻。

    ---

    ### 推理时，临时激活值（如中间结果）的显存可以忽略吗？什么情况下不能？

    通常在小 batch、短序列时，激活值显存可忽略（几十到几百 MB）。但在大批量或超长序列时，它不可忽视，甚至可能成为 Prefill 阶段 OOM 的元凶。

    具体什么时候不能忽略：

    - 大批次 Prefill：假设 batch=32，序列长度 4096，注意力中间结果（QK^T 分数矩阵）的尺寸为 [32, 头数, 4096, 4096]，即使头数为 32，FP16 下也高达 32×32×4096×4096×2 ≈ 32 GB（实际上 FlashAttention 不会完整存储该矩阵，但很多实现仍可能有缓冲）。即使使用优化，批量 Prefill 的激活也可轻松达到数 GB。

    - 长序列：即使 batch=1，当序列长度 128K 时，注意力矩阵理论大小（若完整存储）将是 128K×128K×头数，FP16 下可能超过显存总容量，这就是为什么必须用 FlashAttention 并配合重计算或分块。

    - 不使用融合算子：标准 Transformer 实现中，会保存一些中间结果用于反向传播，但推理时无需梯度，框架会做针对性优化（如 in-place 操作）。如果推理框架没有充分优化（例如某些早期实现），会浪费较多激活显存。

    - 编码器-解码器架构或多模态：额外的编码器会带来额外激活。

    实际生产环境：现代推理引擎（vLLM, TRT-LLM）对 Prefill 激活做了特殊管理，通常是临时分配，用后即回收；且利用 FlashAttention 避免显式构建注意力矩阵。因此，激活峰值常在可接受范围，但在规划总显存时，仍需保留约 5-10% 的权重显存大小作为激活缓冲。绝对不能简单忽略，尤其是运行大 batch 或长上下文时。

    经验法则：可以用 batch × seq_len × hidden_dim × 10-20 来粗略估算 Prefill 期间激活额外的峰值（字节），并在显存计算中加入这一项。当 batch 或序列长度超过一定程度时，这一项会快速膨胀，成为容量规划的决定性因素之一。

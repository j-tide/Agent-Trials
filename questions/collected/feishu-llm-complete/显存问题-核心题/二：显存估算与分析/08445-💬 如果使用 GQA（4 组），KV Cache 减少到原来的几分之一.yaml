content:
  prompt: "\U0001F4AC 如果使用 GQA（4 组），KV Cache 减少到原来的几分之一？"
answer:
  mode: rubric
  reference_answer: |-
    GQA（Grouped-Query Attention）将 Query 头分为若干组，每组共享同一对 Key 和 Value 头。如果 KV 头数变为 4（即 4 组），那么 KV 头的数量就是 4，而不是原来的 32。因此，KV Cache 的大小与 KV 头数成正比。减少比例 = 原头数 / 新头数 = 32 / 4 = 8 倍。所以 KV Cache 变为原来的 八分之一。

    对于刚才的例子，新的 KV Cache = 1 GB / 8 = 0.125 GB = 128 MiB。这极大地降低了显存压力，使得更长上下文或更大 batch 成为可能。Llama-2-70B 等大模型常使用 GQA（如 8 组）来节省 KV Cache。

    计算公式：KV Cache 字节数 = 2 × 输入长度 × 层数 × KV 头数 × 头维度 × 元素大小（字节）。所以 KV 头数从 32 降到 4，占用直接变为 4/32 = 1/8。


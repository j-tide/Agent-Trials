content:
  prompt: "☁️ 在云上选择 GPU 实例时，显存大小如何影响模型选择和成本？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 显存是决定模型承载能力和批处理规模的首要因素，直接影响成本和性能。\n\n\U0001F4CB 影响因素：\n\n-
    模型加载：显存必须能容纳模型权重 + KV Cache + 激活。较小显存实例只能使用量化或较小模型，或者必须使用多卡并行，这会增加成本。\n\n- 批处理大小（throughput）：更大显存允许更大的
    batch size，提高吞吐，降低单次推理成本。若显存不足，只能用小 batch，导致 GPU 利用率低，总成本可能反而上升。\n\n- 上下文长度：处理长文档需要巨大的
    KV Cache。若实例显存不足，无法服务长上下文请求。\n\n- 多租户/并发：在线服务需要同时驻留多个请求的 KV Cache，大显存能支撑更高并发。\n\n\U0001F4B0
    成本效益权衡：\n\n- 例如，要部署 Llama-2-70B 聊天服务：\n\n- 云上实例价格：A100 80G 实例通常比 V100 32G 贵数倍，但能运行更大的模型，单位推理成本可能更低。\n\n-
    选择时，应根据目标 SLA、预期流量、模型大小来确定所需总显存，再选择合适的实例类型。可使用 vLLM 等框架预估单实例吞吐，结合请求量确定实例数量和规模。\n\n\U0001F6E0️
    常用配置：\n\n- 开发测试：单卡 T4 16GB (免费/便宜) + 7B 量化模型。\n\n- 生产小规模：A10 24GB 或 A5000 24GB，运行
    13B 量化或 7B FP16。\n\n- 中大规模：A100 40GB/80GB，运行 13B-70B 量化或 FP16。\n\n- 超大规模：H100
    80GB 或多卡互联，运行 70B+ 或 MoE 模型。\n\n因此，显存大小直接决定了能跑的模型尺寸和推理效率，云上选型需综合考量模型需求、请求量和预算。\n\n---"

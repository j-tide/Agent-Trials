content:
  prompt: "⚖️ 在流水线并行中，如何确保每张卡显存负载均衡？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 流水线并行（PP）将模型不同层分配到不同 GPU，但各层参数量、激活大小可能不均，导致某些卡显存紧张。均衡的核心是智能切分和调度。\n\n\U0001F3AF
    方法：\n\n- 按层参数量均衡分割\n统计每层的参数量（含权重大小），以及相邻层激活传输大小。使用算法（如动态规划）将模型切分为若干连续块，使得每块的参数总量
    + 激活峰值尽可能均衡。例如，Transformer 的底层和顶层可能维度和层数相同，所以均匀切分通常就足够均衡。\n\n- 考虑激活与批处理大小\n某些层（如注意力层）的激活显存远大于
    FFN 层。尤其当使用激活重计算时，不同层对显存的影响不同。因此，分割点应尽量避开高激活区，或者通过调整 micro-batch 数量和重计算策略平衡峰值。\n\n-
    1F1B 调度与显存管理\n在 PP 训练中，采用 1F1B（一前向一反向）调度可以限制同时驻留的激活数量，降低峰值显存。这样即使某一阶段参数较多，也能通过整体调度减少总占用，均衡压力。\n\n-
    自适应切分工具\n如 Megatron-LM、DeepSpeed 等提供自动 PP 切分功能，可根据每层计算量和显存占用进行优化分配。通过配置文件可以手动调整分割点来达到均衡。\n\n-
    混合并行\n结合张量并行（TP）或数据并行（DP），可进一步将单卡上的大层分片，使单卡负载更低，更容易实现均衡。通常先进行 PP 粗略分割，再在瓶颈设备上使用
    TP 细分。\n\n\U0001F4CF 均衡判断标准：每张卡在训练过程中的峰值显存占用应接近，且均低于显存容量的 90%。可以通过 PyTorch Profiler
    或显存快照检查每卡峰值，调整分割边界直到各卡差值小于 10-20%。\n\n因此，流水线并行的显存均衡依赖对模型结构和激活特性的深入理解，并结合自动化工具和手动微调实现。\n\n---"

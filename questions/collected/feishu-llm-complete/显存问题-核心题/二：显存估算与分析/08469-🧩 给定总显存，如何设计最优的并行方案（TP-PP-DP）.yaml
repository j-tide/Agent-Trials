content:
  prompt: "\U0001F9E9 给定总显存，如何设计最优的并行方案（TP/PP/DP）？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 没有固定公式，需要根据模型大小、显存总量、卡数、卡间带宽综合求解，目标是满足显存约束下最大化吞吐。\n\n\U0001F527
    设计步骤：\n\n- 确定模型基本需求\n计算单卡所需显存（不计并行），若单卡装不下，必须使用模型切分（TP/PP）。\n\n- 选择并行策略与卡的映射\n\n-
    混合并行公式\n总卡数 = TP × PP × DP。显存分配：\n\n- 实例推演：\n总显存 640 GB (8×80G)，要训练 175B 模型。\n单卡全量不切分所需显存约
    12×175B = 2100 GB，远超标。因此必须模型切分。\n尝试 TP=8, PP=4 (总 32 卡)，则单卡权重+优化器状态 = (12×175B)/(8×4)
    ≈ 65.6 GB，再加激活，80GB 卡可能刚够。如果总卡数受限，可能需要增大 TP/PP 度，或引入 ZeRO。\n\n- 通信开销评估\nTP 对带宽要求高，PP
    有气泡，DP 扩展性最好但要求单卡能放。最终要依据实测吞吐（token/s）选择吞吐最高的方案。\n\n\U0001F4CC 经验法则：\n\n- 模型 <
    1B，数据并行为主。\n\n- 1B-10B，单卡装不下时，优先 ZeRO-3 或 TP=2/4。\n\n- 10B-100B，TP+PP+ZeRO 混合。\n\n因此，最优并行方案是：在满足显存约束下，最小化
    TP 和 PP 度，最大化 DP，同时考虑硬件拓扑，通过性能建模或基准测试最终确定。\n\n---"

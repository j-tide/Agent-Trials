content:
  prompt: "\U0001F504 什么是“共享前缀”如何节省 KV Cache？"
answer:
  mode: rubric
  reference_answer: |-
    在推理服务中，多个请求往往共享相同的前缀，比如所有请求都使用同一个较长的 system prompt（系统提示词）。传统方式会为每个请求单独存储这份前缀的 KV Cache，造成重复浪费。

    共享前缀 通过让多个请求复用同一份前缀的 K、V 张量，避免重复存储。当新请求到来，如果其前缀与已缓存的某个前缀匹配，就不再计算该前缀的注意力，直接复用存储好的 KV Cache 块。在 PagedAttention 中，可以通过引用相同的物理块来实现。这样，N 个请求共享一个长度为 L 的前缀，KV Cache 节省量 ≈ (N-1) × L 对应的 KV Cache 大小，效果显著。

    例如，一个 4K token 的系统提示，10 个并发请求，如果不共享，需要存储 10 份共 40K token 的 KV Cache；共享后只需存储 1 份 4K token，节省 90% 的前缀相关显存。这使得更大的系统提示和更高的并发成为可能，是 vLLM 等框架的重要特性。


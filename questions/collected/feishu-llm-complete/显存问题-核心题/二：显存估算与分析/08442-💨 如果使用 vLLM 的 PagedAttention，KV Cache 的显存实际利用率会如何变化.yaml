content:
  prompt: "\U0001F4A8 如果使用 vLLM 的 PagedAttention，KV Cache 的显存实际利用率会如何变化？"
answer:
  mode: rubric
  reference_answer: |-
    传统做法为每个请求预留最大长度的连续 KV Cache 块，这会造成严重的内部碎片（比如实际生成长度远小于预留长度）和外部碎片，导致显存利用率极低，可能只有 20-30%。vLLM 提出的 PagedAttention 借鉴操作系统的分页思想，将 KV Cache 划分为固定大小的 block，可以离散分配，大幅减少碎片。

    实际利用率变化：

    - 显著提高。vLLM 论文表明，在批量服务场景，显存利用率可提升至 80-90% 甚至更高。因为 block 可以按需分配，请求仅占用实际所需的 block，且多个请求共享相同前缀时还能共享 block（如系统提示词），进一步节省显存。

    - 接近于显存的理论可用上限。相比于预留连续空间，PagedAttention 能更紧凑地打包请求，允许更大的 batch size 或更长的序列。

    - 但存在轻微的 metadata 开销（每个 block 需要维护表），不过通常占比很小（<5%）。

    因此，PagedAttention 使得 KV Cache 显存利用率从传统的 20-30% 提升到 80% 以上，这是其能够支持高吞吐服务的核心创新。


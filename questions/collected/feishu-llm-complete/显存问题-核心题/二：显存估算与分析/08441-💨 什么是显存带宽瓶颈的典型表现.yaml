content:
  prompt: "\U0001F4A8 什么是“显存带宽瓶颈”的典型表现？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 典型表现：GPU 计算利用率不高，但显存控制器的利用率接近峰值，增加 batch size 并不能明显提高吞吐，性能随序列长度线性恶化。\n\n\U0001F3AD
    具体症状：\n\n- GPU 利用率（SM 占用）低，通常在 30%~60%，而 memory 子系统的利用率（如内存控制器、DRAM 读写带宽）接近 100%（通过
    nvidia-smi 或 nvtop 的高级视图可查看）。\n\n- 增加 batch size 或序列长度，延迟几乎等比例增长，吞吐（token/s）提升很小，因为每多一个
    token 都要更多地从 HBM 读数据，带宽成为墙。\n\n- 算术强度极低：profile 显示计算时间/内存访问时间的比值很小，例如大多数时间消耗在
    memcpy 或简单的逐元素操作上，矩阵乘法等计算单元闲置。\n\n- 性能对内存频率敏感：降低显存频率（如使用低功耗模式）会导致性能严重下降，而提升核心频率几乎无影响。\n\n-
    ncu (Nsight Compute) 分析：每个 SM 的 L1/TEX 命中率低，dram__throughput 非常高且已触达理论带宽，而 sm__throughput
    未饱和。\n\n\U0001F4CC 常见场景：\n\n- 推理时 batch=1 的自回归生成，每次 token 都要完整读取权重和 KV Cache，属于典型的带宽瓶颈。\n\n-
    长文本推理时，随着 KV Cache 变大，注意力操作不断从 HBM 读取大量数据，带宽成为主要约束。\n\n因此，当发现 GPU 算力闲置而内存通道满载，就是典型的显存带宽瓶颈，需要采用
    Kernel Fusion、量化、GQA 等减少数据移动的优化。\n\n---"

content:
  prompt: "\U0001F3E0 家用电脑（RTX 4090 24GB）上，能运行多大的量化模型进行推理？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 结论：可以运行 4-bit 量化的 33B-34B 模型，或 6-7B 模型的 FP16 版本，并支持较长的上下文。\n\n\U0001F4CA
    估算：\n\n- RTX 4090 拥有 24 GB GDDR6X 显存。\n\n- 量化模型：4-bit (INT4) 权重每参数 ≈ 0.5 字节 +
    少量量化开销。\n可加载的最大模型参数量 ≈ 24 GB / 0.5 = 48 B。但还需预留 KV Cache 和激活空间。若预留 4 GB，则纯权重约
    20 GB，可支持 40B 参数 4-bit 模型（如 40B 参数约 20 GB）。实际中，34B 模型（如 Yi-34B）4-bit 权重约 17 GB，加上
    KV Cache 等，24GB 刚好可以运行，序列长度可到 2K-4K。\n\n- FP16 模型：14B 模型的 FP16 权重就 28 GB，装不下。所以
    FP16 只能运行 7B 左右的模型（14 GB），剩余 10 GB 用于 KV Cache 和激活。7B 模型可支持较长的上下文（如 32K tokens，如果使用
    GQA 和 FlashAttention）。\n\n- 8-bit 模型：每参数 1 字节，13B 模型权重 13 GB，剩余 11 GB，可运行，序列长度也较长。\n\n常见配置经验：\n\n-
    LLaMA-2-7B (FP16) 完美运行，长上下文。\n\n- CodeLlama-34B (4-bit GPTQ/AWQ) 可运行，上下文长度适中。\n\n-
    Mixtral 8x7B (4-bit) 总参数量 46.7B，量化后约 23 GB，24 GB 卡勉强能装下，但需减少 KV Cache 和 batch，只能跑非常短的上下文。一般
    24GB 卡运行 Mixtral 8x7B 的 4-bit 量化版没问题，可用 exllamav2 或 llama.cpp 优化。\n\n因此，RTX 4090
    24GB 非常适合运行 4-bit 量化的 33B-34B 模型，或 FP16 的 7B 模型，获得出色的家庭推理体验。\n\n---"

content:
  prompt: "⚙️ 如何为微调任务选择 GPU 配置？需要考虑哪些显存因素？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 选择 GPU 配置就是要在“模型规模、训练速度、成本”三角中找平衡点。显存是首要约束，影响能否训练以及批次大小。\n\n\U0001F3AF
    关键显存因素：\n\n- 模型权重内存\n精度决定：全量微调 FP32/FP16，每参数 2-4 字节；QLoRA 用 NF4 约 0.5 字节。对于全量微调，单卡必须能装下（或使用模型分片）。估算公式：权重
    = 参数量 × 每参数字节数。\n\n- 优化器状态\nAdam 需要储存动量和方差，每个参数共 8 字节（FP32）。若使用 8-bit Adam（bitsandbytes）可减半至
    4 字节。这部分通常占训练显存的大头，尤其是在全量微调时。QLoRA 只优化少量参数，可忽略。\n\n- 梯度\n全量微调梯度与权重同精度，FP16 即 2
    字节/参数。\n\n- 激活与中间结果\n与 batch size、序列长度、隐藏维度和层数相关。激活值显存可近似为 batch × seq_len × hidden
    × 层数 × 系数(15-40)。全量微调必须用梯度检查点（gradient checkpointing）来降低这一部分，否则甚至比权重还大。\n\n- KV
    Cache (训练时)\n与前缀长度成正比，但在训练时通常使用全序列，所以占用较大。若使用 FlashAttention 和激活重计算，这部分影响较小。\n\n-
    Batch Size 需求\n更大的 batch 需要更多显存，但能提高 GPU 利用率和训练稳定性。可以通过梯度累积来模拟大 batch，但累积会增加训练时间。\n\n\U0001F680
    配置策略：\n\n- 单卡全量微调：仅适用小模型（<1B）或大显存（80GB）配中等模型（7B）。必须开启梯度检查点、FlashAttention、混合精度。\n\n-
    多卡全量微调（DDP/ZeRO）：ZeRO-1/2 将优化器状态或梯度分片，减少单卡占用；ZeRO-3 连权重也分片，可用更多卡训练大模型。选择多少卡取决于模型大小和所需
    batch size。\n\n- 参数高效微调（LoRA/QLoRA）：极大降低优化器、梯度显存，可单卡微调 7B-70B 模型，几乎不受卡数限制，更关注显存能否装下基础模型权重（量化后）以及激活。\n\n-
    云实例选择：优先选择显存带宽高（如 A100、H100）的 GPU，对于 7B QLoRA 微调，一块 24GB RTX 3090/4090 就够；33B
    需要 48GB；70B 需要 48-80GB。考虑到训练速度，多卡通信开销也需纳入。\n\n✅ 总之，先确定训练方式（全量/高效微调），再根据模型大小和序列长度估算单卡显存需求，最后选择合适的
    GPU 型号和数量，并注意 batch size 的灵活性。\n\n---"

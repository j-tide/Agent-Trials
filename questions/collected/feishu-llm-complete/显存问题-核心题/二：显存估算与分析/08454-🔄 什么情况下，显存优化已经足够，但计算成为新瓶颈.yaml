content:
  prompt: "\U0001F504 什么情况下，显存优化已经足够，但计算成为新瓶颈？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 当通过量化、GQA、FlashAttention 等手段将权重和 KV Cache 压缩至极，显存占用远低于物理容量，可以轻松放入大
    batch 和长序列，此时 GPU 核心算力（TFLOPS）成为限制吞吐的唯一因素。\n\n\U0001F3AF 典型场景：\n\n- 高吞吐推理服务\n使用
    INT4 量化、MQA、FlashDecoding 等技术后，KV Cache 和权重变得极小，单卡可同时服务几十个长序列请求。此时批量变大，计算密度升高，GPU
    SM 被完全占用，若需更高吞吐，只能增加算力（更多/更强的 GPU）或降低计算精度（FP8）。\n\n- 训练中的大 batch 场景\n在分布式训练中，通过
    ZeRO-3 和梯度检查点将单卡显存占用压得很低，可以塞进极大的 micro-batch。此时前向/反向计算完全受限于 GPU 计算速度，带宽不再是瓶颈。此时升级更快的
    GPU（如 V100→A100）能线性提升训练速度。\n\n- 模型压缩后\n蒸馏或剪枝后的小模型已经非常轻量，显存不再是问题，但推理延迟要求极高（如实时对话），此时计算效率决定用户体验。需用
    TensorRT 等深度优化推理引擎，对计算图进行极致融合。\n\n- MoE 模型推理\n虽然总权重大，但激活参数小。通过专家并行分散权重，单卡仅需处理少量专家，显存压力小，但路由和专家计算需消耗大量算力，吞吐受限于
    GPU 计算能力。\n\n✅ 判别指标：\n\n- GPU 利用率持续 >90%，显存占用 <70%，增加 batch size 不再提高吞吐（已触达算力上限）→
    计算瓶颈。\n\n- ncu profile 显示 sm__throughput 接近峰值，而 dram__throughput 尚有富余。\n\n因此，当显存不再成为约束后，优化的重心就转移到算力利用率和模型计算效率上。\n\n---"

content:
  prompt: "\U0001F50D 如何用 PyTorch Profiler 找出显存占用最大的操作？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 使用 torch.profiler.profile 结合 record_shapes 和 profile_memory
    参数，再通过 TensorBoard 的 Memory Viewer 可以清晰看到每个算子分配和释放的显存，轻松定位“大胃王”。\n\n\U0001F4CB
    操作步骤：\n\n- 基本 Profiler 配置\n\n- python\n\n- with torch.profiler.profile(    activities=[
    \       torch.profiler.ProfilerActivity.CPU,        torch.profiler.ProfilerActivity.CUDA,
    \   ],    record_shapes=True,    profile_memory=True,          # 关键：记录内存分配    with_stack=True,
    \             # 记录调用栈，方便定位代码) as prof:    model(input)prof.export_chrome_trace(\"trace.json\")\n\n-
    使用 TensorBoard 查看\n运行 tensorboard --logdir ./log，打开 Memory 视图。可以看到：\n\n- 找出最大占用\n在
    Memory 视图的左侧面板，按 Allocation Size 降序排列，排在最前面的就是占用最大的算子。常见的有：\n\n- 现场调试\n也可在 Python
    中直接打印内存统计：\n\n- python\n\n- print(torch.cuda.memory_summary())\n\n- 这会输出当前显存的分配器状态，包括各分配段的信息，但不细粒度到算子。\n\n✅
    因此，PyTorch Profiler 的 Memory 分析工具是定位显存占用热点的利器，几乎任何训练/推理的显存问题都应先用它看一眼。\n\n---"

content:
  prompt: "\U0001F680 在长文本推理中，瓶颈是计算还是显存？为什么？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 长文本推理的瓶颈通常是显存（尤其是 KV Cache），而非计算，因为显存限制了最大序列长度和 batch
    size，但解码速度本身可能仍受限于内存带宽。\n\n\U0001F9E9 详细分析：\n\n- 显存瓶颈主导\n随着序列长度增加，KV Cache 线性增长。前面计算可知，100K
    token 的 KV Cache 可达数十 GB，很快超过单卡显存，导致无法推理或只能小 batch。因此显存容量直接决定了能不能跑，是硬瓶颈。\n\n-
    计算方面：带宽瓶颈居多\n在长文本生成阶段（解码），每次生成一个 token，需要访问所有历史的 K、V，计算注意力。当 batch=1 时，算术强度仍然较低，内存访问量巨大（需读取整个
    KV Cache 和权重），因此实际瓶颈往往是显存带宽，而非计算峰值。这也是为什么长文本推理速度随着序列变长而线性下降的原因——带宽被不断增长的 KV Cache
    拖累。\n\n- 因此，长文本推理面临的矛盾是：显存容量限制序列长度和批大小；显存带宽限制生成速度。计算反而是次要的。\n\n✅ 优化的重点：采用 GQA/MQA
    减少 KV Cache 大小和带宽压力；量化 KV Cache；使用 FlashDecoding 加速长序列注意力；增大显存容量以支持更长上下文。\n\n---"

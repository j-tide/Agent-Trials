content:
  prompt: "⚡ 推理时，小 batch 通常是带宽瓶颈，大 batch 是计算瓶颈，为什么？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 这个规律源于 GPU 的并行特性：小批量无法充分利用计算单元，大量时间消耗在数据搬运（内存带宽）；大批量则有足够工作填满计算单元，限制因素变为芯片算力。\n\n\U0001F9E0
    技术原理：\n\n- 小 batch 带宽受限\n推理需要将权重从显存（HBM）搬运到片上缓存（SRAM）才能计算。当 batch 很小时，计算时间很短，反而权重搬运占据主导。因为权重矩阵巨大，每个
    token 都要搬运一次完整权重，小 batch 的算术强度（计算量/访存量）很低，GPU 的算力被带宽“饿死”。表现为 GPU 利用率低，大多数时间在等待内存访问。此处的“带宽瓶颈”指显存带宽（HBM
    BW）。\n\n- 大 batch 计算受限\n当 batch 增大，多个 token 可以共享一次权重搬运，算术强度显著提升。此时计算时间变长，显存带宽不再是瓶颈，反而芯片的峰值算力（TFLOPS）成为上限。GPU
    利用率接近 100%，但受限于 SM 数量和时钟频率，无法更快。此时是计算瓶颈。\n\n\U0001F4C8 举例：\n在矩阵乘法中，对于权重 W [H,
    H]，输入 X [B, S, H]，小 B 导致乘法的算数强度 ≈ BSH / (H^2) 很小，每次搬运权重的成本高于计算。大 B 则强度增加，最终达到硬件
    TFLOPS 上限。\n\n\U0001F3AF 因此，优化推理时：小 batch 需关注内存带宽利用率（如使用 FP8、Kernel Fusion），大
    batch 则需要更强劲的 GPU 或降低计算精度（如 INT8）。\n\n---"

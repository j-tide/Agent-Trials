content:
  prompt: "\U0001F4CA 如何计算给定模型和 GPU 下的最大推理序列长度？"
answer:
  mode: rubric
  reference_answer: |-
    最大推理序列长度受限于显存容量减去权重和框架开销后，剩余可用于 KV Cache 的显存。步骤如下：

    - 获取显存总量（GPU 总显存，如 24 GB）。

    - 估算权重显存（根据精度：FP16 模型 2 字节/参数，INT4 0.5 字节/参数，INT8 1 字节/参数）。若有量化参数及混合精度，额外加上。

    - 减去其他固定开销：CUDA context、框架内核、中间激活（通常 batch=1 时激活显存极小，但批处理增加时需要更多）。通常预留 0.5–2 GB。

    - 剩余显存用于 KV Cache。

    - 计算每 token 的 KV Cache 大小。公式：
    per_token_kv_bytes = 2 × 层数 × KV 头数 × 头维度 × 元素大小(字节)
    其中 2 表示 K 和 V。FP16 元素大小为 2。若是 FP8 KV Cache，元素大小为 1。

    - 最大 token 数 = 剩余显存 / per_token_kv_bytes。
    如果框架支持分页（PagedAttention），实际可用容量还会略高，因为没有碎片化损失，但仍可按此估算。

    - 这个 token 数包括了输入和输出的总序列长度。因此最大序列长度 ≈ 该 token 数（如果 batch=1）。如果 batch > 1，则每个 batch 的序列共享 KV Cache 池，最大单序列长度需除以 batch size 的某种加权平均，但一般均匀分配就是剩余显存 / (batch_size × per_token_kv_bytes)。

    举个例子：7B FP16，32 层，32 头，头维度 128，FP16。per_token_kv_bytes = 2 × 32 × 32 × 128 × 2 = 524,288 字节 = 0.5 MiB。如果 24GB 显卡，权重 14 GB，剩余约 9–10 GB 给 KV Cache，约能支持 9 GB / 0.5 MiB ≈ 18,000 token（实际可能稍低，有碎片）。所以最大可支持 18K 序列。


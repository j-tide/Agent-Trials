content:
  prompt: "☸️ 在 Kubernetes 中，如何为推理 Pod 设置 GPU 显存 limit？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 核心矛盾：Kubernetes 原生仅支持以整卡数 (nvidia.com/gpu) 作为资源请求和限制，无法直接设置显存容量。必须借助
    GPU 共享方案 或 MIG 来实现细粒度的显存隔离和限制。\n\n\U0001F527 主流方案对比：\n\n[嵌入表格未展开]\n\n\U0001F4CC
    推荐方案及 YAML 示例：\n\n方案一：使用 MIG（生产推荐，强隔离）\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n
    \ name: mig-inference\nspec:\n  containers:\n  - name: llm\n    image: my-vllm:latest\n
    \   resources:\n      limits:\n        nvidia.com/mig-1g.10gb: 1   # 请求一个 10GB
    MIG 实例\n```\n\n需提前将 GPU 配置为 MIG 模式，并部署 NVIDIA K8s Device Plugin。\n\n方案二：使用 HAMi（灵活，可超售）\n\n```yaml\napiVersion:
    v1\nkind: Pod\nmetadata:\n  name: hami-inference\nspec:\n  containers:\n  - name:
    llm\n    image: my-vllm:latest\n    resources:\n      limits:\n        nvidia.com/gpu:
    1            # 请求1卡\n        nvidia.com/gpumem: 8192      # 限制显存 8GB\n        nvidia.com/gpucores:
    30      # 限制30%算力（可选）\n```\n\nHAMi 通过 LD_PRELOAD 注入自定义 CUDA 库，监控并限制显存分配，若超限则返回
    OOM。适合非关键业务或开发环境。\n\n⚠️ 注意事项：软件限制可能被绕过，且存在性能干扰；MIG 的分配粒度有限，可能造成资源浪费。\n\n---"

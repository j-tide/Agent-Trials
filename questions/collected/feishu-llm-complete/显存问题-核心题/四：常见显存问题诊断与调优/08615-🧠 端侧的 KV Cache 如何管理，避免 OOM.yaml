content:
  prompt: "\U0001F9E0 端侧的 KV Cache 如何管理，避免 OOM？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 移动端内存极有限，KV Cache 常成为隐形的 OOM 杀手。管理策略包括：严格限制上下文长度、使用滑动窗口、KV
    Cache 量化 (INT8/INT4)、动态回收以及采用多轮对话中的历史淘汰。这些都必须通过框架参数或应用逻辑显式控制。\n\n\U0001F527 具体管理方法：\n\n-
    硬性上下文长度限制\n通过 --ctx-size 或 --max-context 设置模型最大处理的 token 数（例如 2048），超过则截断或报错。这是最基础的保障。\n\n-
    滑动窗口注意力\n如果模型本身支持 (如 Mistral 的 sliding window)，可设置窗口大小 (如 4096)，只保留最近 token 的
    KV，旧的自动丢弃。框架如 llama.cpp 支持 --rope-scaling 等，但并不改变 KV 缓存大小，仅重排位置编码，真正窗口需模型原生支持。\n\n-
    KV Cache 量化\n使用 INT8 甚至 INT4 存储 K 和 V，大幅降低 Cache 容量。例如 llama.cpp 的 --cache-type-k
    q8_0 --cache-type-v q8_0，可使 KV Cache 大小减半，内存压力立减。\n\n- 动态缓存大小分配\n启动时根据可用内存自动计算最大可分配的
    KV Cache 大小，而非固定值。llama.cpp 的 --batch-size 和 --parallel 影响并发序列缓存，移动端应设为 1。\n\n-
    多轮对话中的 Cache 压缩/清理\n\n- 采用连续批处理，减少并发\n移动端应避免同时处理多个序列，单会话单序列是基本，以最小化总 KV 占用。\n\n\U0001F4CA
    示例：7B 模型 FP16 KV，每 token 0.5 MB，若无量化且上下文 4096，仅 KV Cache 就 2 GB，加上模型 3.5 GB (4-bit)，总
    5.5 GB。手机可用内存往往不足，若将 KV 量化为 INT8，则 KV 降为 1 GB，总 4.5 GB，勉强可行。因此 KV 量化是移动端标配。\n\n✅
    总之，移动端 KV Cache 管理法则：量化、限长、单会话、及时清理，把 Cache 尺寸压到最低。\n\n---"

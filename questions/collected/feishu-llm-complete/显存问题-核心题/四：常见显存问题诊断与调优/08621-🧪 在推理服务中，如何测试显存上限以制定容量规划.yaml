content:
  prompt: "\U0001F9EA 在推理服务中，如何测试显存上限以制定容量规划？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 通过压力测试工具模拟真实负载，逐步增加并发数、序列长度和输出长度，观察服务吞吐和失败率，找到即将 OOM
    的临界点，从而确定单实例的最大容量。\n\n\U0001F527 步骤：\n\n- 准备测试脚本\n使用 vllm bench serve 或自定义 Python
    脚本（如 locust）发送不同配置的请求。需模拟业务分布，如 P50/P95 输入长度、生成长度。\n\n- 固定生成长度，增加并发\n逐步提高并发用户数，监控服务端
    num_free_blocks 和请求延迟。当 num_free_blocks 接近零且开始出现请求拒绝或 swap 时，记录当前的吞吐和并发数，即为安全上限。\n\n-
    测试极端序列长度\n单独发送超长 prompt 或要求生成极长的序列，观察是否会触发 OOM 或提前截断，验证 max_model_len 配置有效性。\n\n-
    记录 GPU 利用率与显存占用\n用 nvidia-smi dmon 和 Prometheus 采集指标，绘制并发-吞吐-显存曲线，找到吞吐拐点（即显存成为瓶颈处）。\n\n-
    容量规划\n根据单实例最大并发数 Cmax 和期望承载的总并发数，计算所需实例数 = 总并发 / Cmax。考虑冗余，增加 20-30% 余量。\n\n\U0001F4CA
    示例结果：单卡 80G A100 运行 LLaMA-7B FP16，最大生成长度 512，测得最大稳定并发为 32 个请求。若业务需支持 128 并发，则至少需要
    4 个实例。\n\n---"

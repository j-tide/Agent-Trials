content:
  prompt: "\U0001F9D0 为什么端侧模型常使用 4-bit 量化 + 有限的上下文长度？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 端侧内存容量与带宽有限，迫使模型必须在权重大小和运行时缓存上作出双重妥协。4-bit 量化解决权重占用，有限上下文
    (如 2K–8K) 控制 KV Cache 内存，两者结合才能在手机上跑起大模型并保持可用速度。\n\n\U0001F50D 深入剖析：\n\n- 4-bit
    量化是内存预算的必然\n手机可用内存常在 4–6 GB。7B FP16 模型 14 GB 完全不可能；INT8 7 GB 仍偏大；只有 INT4 3.5 GB
    才可能装入，并为 KV Cache 和系统留下 1–2 GB 空间。\n同时 4-bit 能保持可接受的困惑度，相比 3/2-bit 质量显著更好，用户能获得流畅体验。\n\n-
    有限上下文是因为 KV Cache 线性增长\n每增加 1K token 上下文，KV Cache 可能增加数百 MB。若使用全精度 Cache，4K 上下文就会用掉数
    GB，手机扛不住。因此必须将上下文限制在 2K–4K，并配合 KV 量化。\n此外，长上下文意味着 Prefill 计算量更大，手机 CPU/GPU 难以承受，延迟过长。所以
    2K–4K 是性能与体验的平衡点。\n\n- 硬件和功耗约束\n更长的生成需要更多计算和内存访问，导致手机发热、耗电剧增，用户无法接受。4-bit 量化也能降低访存带宽需求，缓解发热。\n\n\U0001F4CA
    实例：主流移动聊天机器人 (如 MLC Chat, Poe) 提供的 7B 模型多为 4-bit，上下文默认 2048，内存占用控制在 3–4 GB，在 iPhone
    15 上可达 20+ token/s。\n\n✅ 因此，4-bit + 有限上下文是端侧大模型工程化的“黄金搭档”。\n\n---"

content:
  prompt: "\U0001F527 batch size 设置过大导致 OOM，除了减小 batch size 还有什么办法？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 减小 batch size 是直接减少激活和梯度的有效手段，但若必须保持全局 batch 规模，可以使用梯度累积、混合精度、更大力度的梯度检查点、卸载到
    CPU等多种技巧来在不变动有效 batch size 的情况下降低单次显存占用。\n\n\U0001F522 替代方案清单\n\n- 梯度累积 (Gradient
    Accumulation)\n将所需的全局 batch size 拆分成多个 micro-batch，每次前向/反向只计算一个 micro-batch，累积梯度后一次性更新。这样每步的显存占用等于
    micro-batch 的大小，但最终更新效果等价于大 batch。\n\n- 启用混合精度训练 (AMP)\n使用 FP16 或 BF16 代替 FP32
    进行前向和反向，将激活和梯度的精度减半，显存显著下降。PyTorch 的 torch.cuda.amp 自动处理，通常能节省 30-40% 显存，允许使用更大的
    batch size。\n\n- 升级梯度检查点 (Gradient Checkpointing)\n若已开启，可尝试使用更激进的检查点策略（如对整个模块而非仅
    Block），或用 checkpoint_sequential。也可以结合选择性检查点，丢弃更多激活。\n\n- 使用 FlashAttention\n消除注意力矩阵的
    O(n²) 显存，通常在长序列下节省显著，能腾出空间给更大的 batch。\n\n- 优化优化器状态\n\n- 序列长度维度调整\n\n- 使用参数高效微调
    (PEFT)\n\n- 开启激活卸载 (Activation Offloading)\n\n- 使用更轻量的模型架构\n\n- 调整 batch size
    为动态\n\n\U0001F4CA 综合运用示例\n\n单卡 24GB 训练 7B 模型，目标 batch=32。标准配置 OOM。解决：\n\n- 使用
    LoRA + 梯度检查点 + 混合精度 + 梯度累积(micro batch=2, 累计步=16)。\n\n- 开启 FlashAttention。\n最终可成功训练。\n\n✅
    因此，面对 OOM，不要只盯着 batch size 的数字，组合使用多种省显存技术才是正解。\n\n---"

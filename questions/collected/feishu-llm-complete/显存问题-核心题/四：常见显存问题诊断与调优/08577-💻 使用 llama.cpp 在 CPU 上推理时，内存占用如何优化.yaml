content:
  prompt: "\U0001F4BB 使用 llama.cpp 在 CPU 上推理时，内存占用如何优化？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 llama.cpp 本身为 CPU 推理深度优化，提供了大量内存控制参数。优化核心是：使用 mmap
    分页加载、控制线程数、开启 KV 量化、减少层数到 GPU 等。\n\n\U0001F527 关键优化参数与技巧：\n\n- --no-mmap vs mmap\n默认开启
    mmap，模型文件被映射到虚拟内存，物理内存占用远小于模型大小，系统按需调页。对于低内存设备，这是必需品。若要强制全部加载到内存（速度最快但内存大），用 --mlock，但容易
    OOM。\n\n- --ctx-size 限制 KV 缓存大小\n如前所述，越小的上下文，KV 缓存占用越少。例如 --ctx-size 1024 与 4096
    相差数倍内存。\n\n- --cache-type-k 和 --cache-type-v\n设置 K、V 缓存数据类型，如 q8_0 (INT8) 或 q4_0
    (INT4)。这直接决定 KV 内存占用。\n\n- --threads 和 --cpu-mask\n控制推理线程数。过多线程会增加栈内存开销和同步消耗，适当减少线程可降低内存峰值。移动端通常设为核心数一半。\n\n-
    -ngl (offload layers to GPU)\n如果手机有 GPU 可用，可将部分层卸载到 GPU，减少 CPU 侧权重内存占用。但这会增加 GPU
    内存压力，需平衡。\n\n- 使用 --batch-size 设置小批量大小\n推理时 prompt 处理的 batch size，默认 512，减到 64
    可降低临时缓冲区峰值。\n\n- 模型格式选择\n使用 IQ 量化 (IQ4_XS) 等，比传统 Q4 多节省一些内存。也支持 --rope-freq-base
    等减少位置编码内存？无直接关系。\n\n- 应用层流式加载\n如果自己集成 llama.cpp，可仅加载所需层的权重，用完释放。这需要修改代码，但 llama.cpp
    的 llama_model_loader 已支持。\n\n\U0001F4F1 实例：在一台 4GB 安卓手机上运行 Q4_K_M 7B 模型，设置 -c
    1024 --cache-type-k q8_0 --cache-type-v q8_0 --threads 4 -ngl 0，内存占用约 2.8 GB，可持续运行不
    OOM。\n\n✅ llama.cpp 提供了丰富的内存调节旋钮，是移动端 CPU 推理的基石。\n\n---"

content:
  prompt: "\U0001F50C 推理时，多 LoRA 适配器切换如何做到零显存开销？"
answer:
  mode: rubric
  reference_answer: |-
    “零显存开销”指 GPU 显存中同时只驻留当前活跃的 LoRA 权重，切换时不增加额外永久占用。实现原理：

    - 基础模型常驻，LoRA 按需加载
    GPU 显存中始终只保留基础模型权重。LoRA 适配器存在 CPU 内存或 SSD 上。

    - 分页 LoRA 权重管理（S-LoRA）
    类似 KV 块池，将 LoRA 矩阵也切成固定大小块，统一放在一个 LoRA 块池中。GPU 只为当前需要执行的 LoRA 请求加载对应的块，其他适配器的块保留在 CPU。切换就是换入换出块，不占额外显存。

    - 预取与流水线
    调度器根据请求队列提前将即将使用的 LoRA 块从 CPU 异步预取到 GPU 的空闲块中，完成计算后如果不再需要，该块可被覆盖。这样 GPU 上 LoRA 块的总占用保持恒定（等于池大小），不会随适配器数量增长。

    - 合并计算
    对于同一适配器的请求，尽量批量执行，减少块换入换出频率。

    因此，只要 LoRA 池大小经过合理设置，就可以支持成千上万个适配器而不额外增加显存占用。切换时仅在池内替换块，消耗几乎为零。


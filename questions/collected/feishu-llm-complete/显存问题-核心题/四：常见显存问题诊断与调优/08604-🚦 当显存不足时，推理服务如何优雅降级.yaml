content:
  prompt: "\U0001F6A6 当显存不足时，推理服务如何优雅降级？"
answer:
  mode: rubric
  reference_answer: |-
    目标：避免服务崩溃，尽可能响应更多请求，或以降级方式继续服务。

    策略：

    - 请求排队与限流：当空闲 block 数低于安全阈值，拒绝接受新的请求，放入等待队列，返回重试信号（HTTP 429）。

    - 抢占与交换：暂停执行中的低优先级请求，将其 KV Cache 换出到 CPU 内存，腾出 GPU 块给新请求或继续执行高优请求。完成后可选择换回。

    - 缩短生成长度：动态减少 max_new_tokens，限制请求的最终 KV Cache 尺寸。

    - 早期截断与摘要：对于超长 prompt，只保留其摘要或后半部分，牺牲质量换取空间。

    - 卸载模型副本：如果启用多 LoRA 或多模型，卸载不活跃的适配器或模型到 CPU。

    - 返回部分结果：若某请求生成中被抢占，可选择将已生成的内容返回，标记未完成。

    实现：vLLM 具有自动 swap 和抢占机制；配合调度器，可在显存紧张时保持可用性。


content:
  prompt: "\U0001F39B️ 如何利用 DeepSpeed 的 autotuning 自动寻找最优显存配置？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 DeepSpeed 的 Autotuner 通过自动搜索不同 ZeRO stage、offload
    策略和并行度组合，运行微型训练任务并测量显存与吞吐，最终输出满足显存约束下吞吐最高的配置。\n\n\U0001F527 使用步骤：\n\n- 编写 DeepSpeed
    配置文件，启用 autotuning\n在配置中设置 \"autotuning\": {\"enabled\": true}，并指定搜索空间参数，如 ZeRO
    stage 范围、offload 选项等。\n\n{\n  \"autotuning\": {\n    \"enabled\": true,\n    \"arg_mappings\":
    {\n      \"train_batch_size\": \"--per_device_train_batch_size\",\n      \"model_parallel_size\":
    \"--tp\"\n    }\n  }\n}\n\n- 启动训练，触发 autotuning\n正常执行 deepspeed train.py，Autotuner
    会首先运行一系列微型训练（通常几步）来收集内存和速度数据。它会尝试不同的组合，例如：\n\n- 分析结果\nAutotuner 会生成一个日志，记录每种配置下的显存使用、吞吐（samples/sec）、通信开销等。最终会给出推荐配置，并解释原因。\n\n-
    直接使用或手动调整\n可将推荐配置导出为最终的 DeepSpeed 配置文件，或根据自己需求微调。\n\n\U0001F4CA Autotuner 的搜索原理：\n\n-
    它利用一个分析模型，结合实测数据点，预测其他配置的显存。不需要跑遍所有组合，而是通过插值和外推。\n\n- 对于 ZeRO stage，它知道各阶段的理论节省比例，并通过实际内存分配校正。\n\n-
    对于 offload，它会模拟 PCIe 带宽影响速度。\n\n\U0001F9F0 高级功能：\n\n- 可以与 hf Trainer 集成。\n\n-
    支持自定义搜索空间。\n\n- 在 autotuning 过程中，如果 OOM，它会自动跳过该配置并记录，不会崩溃。\n\n✅ 优势：避免了手动猜测参数组合，一键找到在给定硬件上能运行的最大
    batch size 和最快配置，特别适用于新模型或新硬件环境。\n\n\U0001F4CC 注意：autotuning 需要额外的启动时间和少量显存余量来运行测试。它给出的是在当前硬件和任务下的最优，迁移到不同数据长度可能还需微调。但它是科学评估显存需求、快速部署的强大工具。\n\n-
    记录每层的输出张量的 min、max、mean、std。如果某层的 max 值突然飙升（例如从 10 变到 1000），或者 std 异常增大，说明该层产生了大激活值。大激活值直接增加后续层激活存储，尤其在注意力层可能导致
    O(L²) 的矩阵膨胀。\n\n- 关注注意力 logits 的 scale：在 softmax 前打印 QK^T 的最大值。如果该值达到数千，极易产生溢出和显存峰值。\n\n-
    使用 PyTorch hooks：注册 forward hook 来收集统计信息，仅记录标量，开销小。\n\n- 梯度范数 (total norm, per-layer
    norm)：如果某层的梯度范数远大于其他层，或 total norm 突然暴增，表明该层可能发生梯度爆炸。虽然梯度大小不直接增加显存，但爆炸通常与异常大的激活相关联，而激活已占据大量显存。\n\n-
    梯度的 max/min：观察是否有 inf/NaN。一旦出现，立即检查显存使用情况，可能存在泄漏或碎片。\n\n- 结合 torch.cuda.memory_allocated()：在记录梯度统计的同时记录显存，寻找相关性。\n\n-
    使用 PyTorch Profiler 的 memory 视图，结合统计量异常的时间点，找出是哪个算子分配了大块显存。\n\n- 例如，若发现第 12 层
    attention 的 max 激活值特别大，同时 profiler 显示该层的 aten::scaled_dot_product_attention 分配了大量内存，那么就需要对该层进行数值稳定处理（如换用
    FlashAttention、降低学习率、初始化调整）。\n\n- 将 loss、grad_norm、activation_max、allocated_memory
    画在同一图表上，观察是否在 allocated memory 尖峰之前，先有 grad_norm 或 activation_max 的异常攀升。这有助于建立因果关系。\n\n-
    Actor（策略模型，被训练）\n\n- Reference（参考模型，冻结，计算 KL 惩罚）\n\n- Critic（价值模型，通常与 Actor 同架构，被训练）\n\n-
    Reward Model（奖励模型，冻结）\n每个模型都需要加载权重、存储激活（至少 Actor 和 Critic 需要反向传播）。如果这些模型全部驻留在
    GPU 显存中，所需显存是单模型 SFT 的 3-4 倍。\n\n- 对于 ZeRO：显存 ≈ 参数量 × 精度 / DP 度（分片程度）。修改 ZeRO
    stage 或 DP 度直接影响。\n\n- 对于 TP：权重显存 ≈ 原权重 / TP 度。优化器状态同样被切分。\n\n- 对于 PP：单卡权重 ≈ 总权重
    × (该卡层数 / 总层数)。\n\n- 组合时：例如 TP+ZeRO，权重显存 = 总权重 / (TP × DP_ZeRO)。\n\n- 激活大小与 batch
    size、序列长度、隐藏维度、层数相关。TP 切分层内激活，PP 切分层数，但 PP 同时增加 micro-batch 数会影响激活驻留。粗略估算激活峰值
    ≈ micro_batch_size × seq_len × hidden × 层数 × (34~40) 字节，再除以 TP 度（如果 SP 启用）。\n\n-
    序列并行（SP）会进一步将序列维度的激活切分。\n\n- TP 需要 All-Reduce 缓冲，大小约等于各层激活尺寸。PP 需要发送/接收中间激活缓冲区。\n\n-
    DeepSpeed 的 ds_estimate：可以输入模型参数和并行配置，估算训练所需显存。\n\n- 手动公式：总结自己的经验公式，例如对于 GPT 类模型：total_mem
    = (params * 16 + 2 * params * TP_degree) / (DP * PP) + activation。\n\n- Megatron-LM
    的性能模型：可根据配置输出内存预估。\n\n- huggingface accelerate estimate-memory：accelerate estimate-memory
    命令可以加载模型并模拟不同并行策略下的显存分布。\n\n- 在单卡上用极小的模型（同架构、缩小层数）模拟新并行策略的显存占比，然后等比放大到实际模型。\n\n-
    或者使用 torch.cuda.memory_summary() 在旧配置下观察分布，再按比例计算新配置。\n\n- ZeRO stage 1, 2, 3\n\n-
    Offload optimizer / param to cpu or nvme\n\n- 调整 micro-batch size\n\n- 可能的 TP/PP
    度（如果指定）"

content:
  prompt: "\U0001F50D 如何通过 Profiler 找出显存分配的热点？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 使用 PyTorch Profiler 的 Memory 视图或 Nsight Systems，可以记录每个算子的显存分配/释放时间线、峰值大小和调用堆栈，直指占用最大的操作和代码行。\n\n\U0001F527
    步骤：\n\n- PyTorch Profiler + TensorBoard\n\n```python\nwith torch.profiler.profile(\n
    \   activities=[torch.profiler.ProfilerActivity.CPU, torch.profiler.ProfilerActivity.CUDA],\n
    \   record_shapes=True,\n    profile_memory=True,\n    with_stack=True,\n) as
    prof:\n    model(input)\nprof.export_chrome_trace(\"trace.json\")\n```\n\n在 TensorBoard
    中打开，使用 Memory Viewer 按 Allocation Size 排序，即可看到哪些算子分配了最大块的显存，双击可查看 Python 调用栈。\n\n-
    Nsight Systems\n捕获 CUDA API 和内存分配事件，提供更底层视图，适合分析碎片和分配时机。nsys profile -o report
    python train.py。\n\n- PyTorch Memory Snapshot\n\n```python\ntorch.cuda.memory._record_memory_history(max_entries=100000)\n#
    训练\ntorch.cuda.memory._dump_snapshot(\"snapshot.pickle\")\n```\n\n- 使用 PyTorch
    官方 visualizer 生成交互式图表，显示每个张量的生命周期和累积占用。\n\n\U0001F3AF 查找热点：按算子类型聚合，通常会发现 aten::linear、aten::scaled_dot_product_attention
    和 aten::embedding 占据最多。然后可针对性优化（如 FlashAttention、梯度检查点）。\n\n✅ Profiler 是显存优化的显微镜，不用它就像闭眼调参。\n\n---"

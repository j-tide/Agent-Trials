content:
  prompt: "\U0001F433 Docker 容器内 OOM，和宿主机显存有什么关系？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 Docker 容器本身不提供显存隔离，容器内进程直接使用宿主机 GPU 物理显存。如果宿主机显存被其他容器或进程占满，容器内训练/推理就会
    OOM。此外，Docker 的 --memory 限制只能限制 RAM，不能限制 GPU 显存（需额外方案）。\n\n\U0001F517 关系：\n\n-
    默认情况下，Docker 容器内的 nvidia-smi 看到的是宿主机全部的 GPU 显存。多个容器可能争抢同一 GPU 显存，未协调时导致一个容器 OOM。\n\n-
    可通过 NVIDIA Container Toolkit 结合 GPU 共享方案（如 MIG、vGPU 或 Hami）对显存进行限制，但必须显式配置。如果没做限制，容器间相互影响。\n\n-
    宿主机上其他非容器化进程（如另一训练任务）同样占用显存，可能导致容器内看似空闲但实际不足。\n\n\U0001F527 解决方案：\n\n- 使用 Kubernetes
    的资源限制并配合设备插件（如 nvidia.com/gpumem）约束每个 Pod 的显存。\n\n- 单机 Docker 可利用环境变量 NVIDIA_VISIBLE_DEVICES
    选择特定 GPU，并搭配 nvidia-smi 监控。\n\n- 多容器共享同一 GPU 时，应用层自己限制（如设置 gpu_memory_utilization）或使用
    MIG 硬件隔离。\n\n✅ 因此，容器 OOM 本质是宿主机显存争抢问题，需在调度层面隔离或限制。\n\n---"

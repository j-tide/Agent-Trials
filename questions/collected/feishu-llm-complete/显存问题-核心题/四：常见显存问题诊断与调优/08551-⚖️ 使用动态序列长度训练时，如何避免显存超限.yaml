content:
  prompt: "⚖️ 使用动态序列长度训练时，如何避免显存超限？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 动态序列长度训练旨在通过不统一 pad 到固定最大长度来节省计算，但这也导致每个 batch 的显存需求波动。避免超限的核心思想是：控制每个
    batch 的总 token 数，而非样本数，并预留足够的显存余量应对波动。\n\n\U0001F527 具体策略：\n\n- 基于 token 数的 batch
    策略\n不设置固定的 batch_size，而是设置 max_tokens_per_batch。DataLoader 在采样时会不断累积样本，直到 batch
    中 token 总数达到上限。这样，无论样本长度如何变化，单 batch 的总 token 数保持恒定，激活显存的线性部分（Q、K、V、FFN）基本稳定，但注意力矩阵的
    O(L²) 部分对于个别长样本仍可能尖峰。这需要用 FlashAttention 消除二次影响。\n\n- 设置最大序列长度硬限制\n即使使用动态长度，也必须设定一个
    max_seq_length，超出的文本进行截断。这避免了极端值。可根据显存容量、batch token 上限和模型结构反推出 max_seq_length
    的安全值。\n\n- 梯度检查点与重计算\n动态长度下，激活峰值难以预测。开启梯度检查点可将驻留激活大幅降低，使系统对长度变化更鲁棒。即使偶然出现较长 batch，也只重计算部分激活，峰值可控。\n\n-
    动态调整 gradient accumulation\n根据当前 batch 的实际总 token 数，动态决定是否立即进行 optimizer step。如果
    token 数超标，可以拆分或减少累积步数，但实现较复杂。更简单的是固定 token 上限，由 dataloader 保证。\n\n- 使用 PagedAttention
    思想（如果适用）\n训练时 KV Cache 不需分页，但激活可以类似地分块管理？目前训练框架较少用。但可考虑 Megatron 的序列并行，将长序列切分到多卡，降低单卡激活。\n\n-
    监控与预判\n在训练循环中，每个 batch 开始前检查样本长度，估算所需显存。若估算超标，则跳过该 batch 或将其进一步拆分（但可能影响收敛）。虽然开销大，但对某些关键任务可行。\n\n\U0001F4CA
    参数建议：\n\n- 启用 FlashAttention。\n\n- 使用 --max_seq_length 4096。\n\n- 设置 max_tokens_per_batch
    使 max_tokens_per_batch * hidden * layers * factor 远小于剩余显存。\n\n- 通过 nvidia-smi
    持续监控，找到安全 token 上限。\n\n✅ 总结：动态序列长度 + token-based batching + FlashAttention + 梯度检查点，可在灵活性和显存安全之间取得平衡。\n\n---"

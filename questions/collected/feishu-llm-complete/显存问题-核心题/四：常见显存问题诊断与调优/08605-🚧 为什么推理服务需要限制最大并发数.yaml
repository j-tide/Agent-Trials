content:
  prompt: "\U0001F6A7 为什么推理服务需要限制最大并发数？"
answer:
  mode: rubric
  reference_answer: |-
    如果不限制最大并发数：

    - KV Cache 池耗尽，无法为新请求分配 block，导致大量请求失败或 OOM。

    - 调度开销陡增：动态批处理中，并发过多使得每步要处理大量请求，增加延迟和 GPU 内核启动开销。

    - 显存碎片风险：虽然分页减轻碎片，但极高并发下块池频繁分配回收，可能引起性能抖动。

    - 公平性问题：少数用户可能提交大量请求，挤占其他用户资源。

    设置方法：

    - --max-num-seqs（vLLM）硬限制同时进行的序列数，超过排队。

    - 根据显存大小和模型结构估算最大可服务 token 数，换算为并发数。


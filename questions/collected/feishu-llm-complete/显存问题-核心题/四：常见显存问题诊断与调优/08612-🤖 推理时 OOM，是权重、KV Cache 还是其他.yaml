content:
  prompt: "\U0001F916 推理时 OOM，是权重、KV Cache 还是其他？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 推理时显存占用主要由权重和KV Cache构成，激活极小。OOM 时需快速判断瓶颈是谁：若模型文件大小接近或超过显存，通常是权重过大；若模型能加载但生成长文本时崩，通常是
    KV Cache 耗尽显存。\n\n\U0001F50D 判断方法：\n\n- 仅加载模型（不推理）就 OOM → 权重显存超限（可能未量化）。\n\n-
    短文本推理正常，长文本 OOM → KV Cache 是主因。\n\n- 使用 nvidia-smi：若 Memory-Usage 缓慢上升直至满，常为 KV
    Cache 增长。\n\n\U0001F9EE 量化估算：\n\n- 权重：参数量 × 精度。7B FP16 = 14 GB。\n\n- KV Cache
    = 2 × 层数 × KV 头数 × 头维度 × 精度 × 当前序列长度。\n\n- 例如 7B 无 GQA，4096 token 时 KV Cache ≈
    1 GB；32768 token ≈ 8 GB。若权重 14 GB，总 22 GB，24GB 卡可能刚好满。\n\n⚙️ 其他可能：\n\n- 临时激活缓冲区：推理前向会产生一些中间结果（尤其长
    prompt 编码时），但很快释放。\n\n- 框架预留：vLLM 的块池默认会占满 90% 显存，即使实际使用少，也显示高占用。但 OOM 通常不会因为预留本身，而是实际分配超限。\n\n✅
    结论：推理 OOM 先看权重精度，再看目标序列长度估算 KV Cache，两者一算即知。量化权重 + 限制 max_length 通常解之。\n\n---"

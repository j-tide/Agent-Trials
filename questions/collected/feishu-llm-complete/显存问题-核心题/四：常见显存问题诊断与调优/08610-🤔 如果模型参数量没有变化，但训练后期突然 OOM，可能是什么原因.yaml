content:
  prompt: "\U0001F914 如果模型参数量没有变化，但训练后期突然 OOM，可能是什么原因？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 模型参数量固定，但 OOM 仍可能发生，原因常出在数据、优化器状态、激活值、碎片、日志/缓存这五个方面。即使参数量不变，这些因素可在训练过程中动态膨胀。\n\n\U0001F50D
    具体可能原因\n\n- 数据集中后期出现超长样本\n若数据未做有效截断，训练到后期遇到极长文本，激活值随序列长度线性（注意力 O(L²)）增加，瞬间撑爆显存。这是最常见且隐蔽的原因。\n\n-
    优化器状态积累或泄漏\n\n- 激活值策略发生变化\n\n- 显存碎片累积\n训练初期显存充足，碎片被大块分配掩盖。随着不断分配释放，缓存池碎片化严重。后期即使总空闲足够，但分配一个稍大的连续张量就可能
    OOM。这在长时间训练中极其常见。\n\n- 日志、checkpoint 或其他外部操作\n\n- 混合精度 Loss Scale 异常\n若 loss scale
    变得极大，梯度值异常放大，虽不直接增大显存，但可能导致优化器状态中的统计量异常，进而引发额外内存分配或内核错误，有时表现为 OOM 而非报数值错误。\n\n\U0001F9F0
    排查步骤\n① 在 OOM 步捕获 batch 数据，检查 max_seq_len。\n② 打印 memory_allocated() 和 reserved，看是否碎片。\n③
    检查代码中是否缓存了任何张量（如历史预测值）。\n④ 关闭可能导致额外开销的日志（如 profiling）。\n\n✅ 所以，参数量不变但后期 OOM，重点查数据、碎片和隐式张量泄漏。\n\n---"

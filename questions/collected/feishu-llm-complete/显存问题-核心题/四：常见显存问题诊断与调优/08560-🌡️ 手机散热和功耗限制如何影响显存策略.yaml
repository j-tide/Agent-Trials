content:
  prompt: "\U0001F321️ 手机散热和功耗限制如何影响显存策略？"
answer:
  mode: rubric
  reference_answer: "手机没有主动散热，SoC 连续高负载会导致降频、帧率下降甚至强制关闭应用。散热和功耗约束迫使显存策略必须降低内存带宽消耗和计算强度，以减少发热和耗电，即使以牺牲一定速度和精度为代价。\n\n\U0001F50B
    影响与应对：\n\n- \U0001F32A️ 高带宽内存访问是耗电与发热大户\nLPDDR 内存每读取一 GB 数据消耗约 30–50 mW，7B 模型每生成一个
    token 需读取数百 MB 权重。持续的带宽压力使 DRAM 温度飙升，进而传至 SoC。降低内存占用（如使用更低位数量化、更小的 KV Cache）能直接减少每
    token 读取的字节数，降低功耗和发热。\n策略：优先 4-bit 甚至 3-bit 量化；开启 KV Cache 量化 (INT8/INT4)；使用滑动窗口限制上下文。\n\n-
    \U0001F9CA 控制峰值性能，避免触发温控\n推理引擎可以监测设备温度/功耗状态，动态调整推理线程数、GPU 频率或 batch size。例如，温度过高时自动降低
    --threads 或切换部分层到低功耗小核，虽然生成速度下降，但防止了显存被系统回收（应用被杀）。这间接影响显存策略，因为某些高性能配置可能需要更大内存池，但在热约束下无法使用。\n\n-
    ⏳ 计算卸载到专用低功耗硬件\n将权重和 KV Cache 放在 NPU 的紧耦合内存中，利用 NPU 的低功耗特性进行推理。NPU 内存虽小，但能效比高，发热小。这要求显存策略将宝贵的热预算分配给
    NPU 可访问的快速 SRAM，GPU 仅作辅助。\n\n- \U0001F4C9 减少不必要的内存拷贝\n跨硬件的内存拷贝既费功耗又生热。统一内存架构下，尽可能让
    GPU/NPU 直接访问 CPU 分配的内存，避免隐式拷贝。框架应使用如 AHardwareBuffer 的零拷贝机制。\n\n- \U0001F4CA 动态调节模型容量\n部分应用可在检测到发热时，自动切换到更小的模型或更低
    bit 版本，从而减少内存占用和带宽，快速降温。这个过程需要高效的模型/适配器热切换能力（显存复用）。\n\n✅ 散热和功耗要求显存管理必须“斤斤计较”，因为每节省一点内存带宽，就能延长高性能运行的续航，避免手机变成暖手宝。\n\n---"

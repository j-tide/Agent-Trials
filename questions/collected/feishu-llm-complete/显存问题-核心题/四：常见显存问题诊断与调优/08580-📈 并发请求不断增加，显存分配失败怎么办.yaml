content:
  prompt: "\U0001F4C8 并发请求不断增加，显存分配失败怎么办？"
answer:
  mode: rubric
  reference_answer: |-
    分配失败通常意味空闲块耗尽，系统必须做出反应：

    - 立即拒绝新请求，返回错误码，防止 OOM 扩散。

    - 触发 swap：将一些等待中的请求或低优先级请求的 KV 块移到 CPU，腾出物理块。

    - 杀死最旧或最低优先级请求：释放其全部块，让高优请求继续。

    - 动态降低 max_num_seqs：限制并发数，使已接受的请求能顺利完成。

    - 扩容：如果是集群，自动向调度器申请更多 GPU 节点，迁移部分负载（需要模型多实例支持）。

    预防机制：

    - 合理设置 gpu_memory_utilization 留有余地。

    - 监控 num_free_blocks，提前告警和限流。

    - 使用请求超时策略，避免无效长请求占着资源。


content:
  prompt: "\U0001F4F1 手机端运行大模型，显存/内存限制通常是多少？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 手机没有独立的显存，GPU 与 CPU 共享统一内存 (Unified Memory)。因此“显存”限制实际就是系统可用内存的限制。高端手机
    (12–16 GB RAM) 可运行的模型远大于低端设备 (2–4 GB RAM)，而操作系统、后台服务已经占用了相当一部分。\n\n\U0001F4CA
    典型可用内存估算：\n\n- 旗舰机型 (如 iPhone 15 Pro, 三星 S24 Ultra)：总 RAM 8–16 GB，系统占用约 3–5 GB，留给应用的单窗口极限约
    4–8 GB。\n\n- 中端机型 (6–8 GB RAM)：可用约 2–4 GB。\n\n- 老旧/低端设备 (2–4 GB RAM)：可用仅 0.5–1.5
    GB，运行任何大模型都需要极端量化与优化。\n\n\U0001F50D 与桌面 GPU 的关键差异：\n\n- 桌面 GPU 拥有独立高带宽显存 (HBM/GDDR)，而手机是
    LPDDR 统一内存，带宽较低（约 30–70 GB/s），且 CPU/GPU/NPU 争抢带宽。\n\n- 手机上的 NPU (神经网络处理器) 可能有专门的内存区域，但生态碎片化严重，主流方案仍以
    CPU/GPU 推理为主。\n\n\U0001F4CC 因此，手机端部署大模型的第一个门槛就是物理内存容量**，必须在有限的 2–8 GB 内塞下模型权重、KV
    Cache 和运行时开销。\n\n---"

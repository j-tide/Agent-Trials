content:
  prompt: "\U0001F6A8 推理服务中，如何设置显存告警阈值？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 利用 Prometheus + GPU Exporter 或 nvidia-dcgm 收集显存指标，在
    Grafana 中设置告警规则，当显存使用率超过预设百分比（如 90%）并持续一段时间时触发通知。\n\n\U0001F527 具体方案：\n\n- DCGM
    Exporter：采集 GPU 各项指标，暴露给 Prometheus。\n\n- PromQL 示例：DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL
    > 0.9。\n\n- 告警动作：发送到 Slack/PagerDuty，或触发自动扩容、请求限流。\n\n- 应用层自监控：在推理框架中嵌入回调，当 num_free_blocks
    低于阈值时主动返回压力信号。\n\n✅ 设定阈值需结合正常波动幅度，避免频繁误报。\n\n---"

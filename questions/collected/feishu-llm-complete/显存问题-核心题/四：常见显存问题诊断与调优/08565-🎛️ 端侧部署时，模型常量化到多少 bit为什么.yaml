content:
  prompt: "\U0001F39B️ 端侧部署时，模型常量化到多少 bit？为什么？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 端侧最常用的量化精度是 4-bit (INT4)，因为它能在模型大小、速度、精度三者间达到最佳平衡。3-bit/2-bit
    更小但质量下降明显，8-bit 虽精度高但尺寸仍偏大，不适合移动端的内存限制。\n\n\U0001F50D 量化 bit 数与权衡：\n\n[嵌入表格未展开]\n\n\U0001F52C
    为什么 4-bit 是甜点：\n\n- 内存适配：4-bit 7B 模型仅 3.5 GB，加上 KV Cache (例如 2048 token 约 0.5
    GB) 和其他开销，刚好在旗舰手机的 4–5 GB 可用内存内，留有余地。\n\n- 硬件加速支持：许多移动 SoC 的 GPU/NPU 提供 INT4 的推理加速
    (如高通 Adreno、苹果 ANE)，能效和速度远超浮点。\n\n- 算法成熟：GPTQ、AWQ、GGUF (Q4_K_M) 等 4-bit 量化方案能在保持近乎原有性能的同时实现高压缩率，社区支持极好。\n\n-
    上下文长度可扩展：若用 4-bit，可预留内存给更长的上下文 (如 4096 token)，提升应用体验。而 8-bit 则需牺牲上下文来换取内存。\n\n\U0001F4F1
    实际案例：几乎所有流行的移动端 LLM 应用 (如 MLC Chat、Ollama for mobile) 默认下载 4-bit 量化模型。例如 Qwen2-7B-Instruct-Q4_K_M.gguf
    大小约 4.4 GB。\n\n✅ 因此，4-bit 是端侧“全功能”部署的基准，内存极受限时才考虑更低 bit。\n\n---"

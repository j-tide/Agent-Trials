content:
  prompt: "\U0001F575️ 推理服务中，发现显存占用越来越高但不释放，可能是什么原因？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 这通常是显存泄漏或KV Cache 未及时回收所致。具体原因可能包括：请求完成后块未归还、共享前缀引用计数错误、长连接不断累积、PyTorch
    缓存碎片、框架 bug 等。\n\n\U0001F50D 排查路径：\n\n- KV Cache 块未释放（最常见）\n\n- 长连接累积\n\n- PyTorch
    缓存分配器碎片\n\n- 框架/应用层内存泄漏\n\n- 多模型或多 LoRA 残留\n\n\U0001F527 诊断工具：\n\n- 监控 vllm:num_free_blocks
    和 torch.cuda.memory_allocated()。\n\n- 开启 PyTorch memory history 并导出快照分析。\n\n-
    使用 gdb 或 py-spy 查看进程状态。\n\n✅ 发现持续增长时，优先检查 KV 块回收和长连接累积，然后排查碎片和泄漏，利用框架指标快速定位。\n\n---"

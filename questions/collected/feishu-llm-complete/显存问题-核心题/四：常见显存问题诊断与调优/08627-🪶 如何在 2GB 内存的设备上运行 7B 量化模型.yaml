content:
  prompt: "\U0001FAB6 如何在 2GB 内存的设备上运行 7B 量化模型？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 2GB 内存运行 7B 模型是极限挑战，必须将模型压缩至 1–1.5 GB，并采用流式加载、内存映射、滑动窗口
    KV Cache 和极限量化等全套技术。典型方案是使用 2-bit/3-bit 量化 + 极短上下文 (512 token)，借助 llama.cpp 的
    mmap 模式和 metal/CPU 混合推理。\n\n\U0001F527 关键技术组合：\n\n- 超低比特量化 (2–3 bit)\n\n- 7B 模型经
    2-bit 量化后权重大小约 1.75 GB，3-bit 约 2.6 GB。必须使用 k-quant 或 IQ 量化以保持可读性。例如 llama.cpp
    的 Q2_K 量化可将模型压缩至 2.1 GB 左右。\n\n- 使用 --model Q2_K.gguf 加载，配合 --no-mmap 或部分 mmap
    适应低内存。\n\n- 内存映射 (mmap) 与选择性加载\n\n- llama.cpp 默认使用 mmap 将模型文件映射到虚拟内存，不会一次性加载全部权重到物理内存，而是按需分页。在
    2GB 物理内存下，系统会将不常用的权重页换出到存储，可能导致速度骤降，但至少能跑。\n\n- 可设置 --mlock 禁止换出（会 OOM），或手动限制加载层数。\n\n-
    极限上下文长度\n\n- 将上下文长度设为 256–512 token，KV Cache 占用可降至几十 MB。例如每 token KV 0.5 MB，512
    token 仅 0.25 GB。\n\n- 使用 --ctx-size 512 参数。\n\n- 使用 CPU 推理 + 小 batch\n\n- 移动端
    GPU 内存受限且驱动不稳定，最稳妥是纯 CPU 推理（如 llama.cpp 的 ARM NEON 优化）。可开启 -ngl 0 强制 CPU。\n\n-
    若手机有 adreno GPU，可尝试 clblast 加速，但需预留显存。\n\n- 动态加载与卸载\n\n- 将模型权重大部分留在磁盘，只将当前层加载到内存（如
    DeepSpeed 的 Zero-Infinity 思想，但移动端用 mmap 即可）。\n\n\U0001F4CA 实测可行性：\n\n在一台 2GB RAM
    的安卓设备上，用 llama.cpp 运行 Q2_K 量化 7B 模型，上下文 512，生成速度约 1–2 token/s，勉强可用。但系统可能会频繁杀进程，必须优化。\n\n✅
    结论：虽然能跑，但体验极差。通常 2GB 设备更适合运行 1–3B 的小模型 (Q4 量化)，而非 7B。\n\n---"

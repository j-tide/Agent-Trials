content:
  prompt: "⚡ 遇到 OOM 后，你如何快速决定是减小模型、序列长度还是 batch size？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 按“优化代价→任务需求”矩阵快速决策：先尝试无损或微调的方法，最后才考虑牺牲模型容量。\n\n\U0001F522
    决策顺序：\n\n- 启用/升级显存优化技术：FlashAttention、梯度检查点、混合精度（若未开），这些几乎无精度损失。\n\n- 减小 batch
    size + 梯度累积：保持有效 batch 不变，牺牲训练速度，但不影响模型质量。\n\n- 缩短序列长度：如果任务允许截断或滑动窗口，显存节省明显（尤其
    O(L²)）。代价是可能丢失上下文。\n\n- 使用 PEFT/LoRA：改为冻结主干，只训练少量参数，大幅降低权重和优化器占用，可保持较大 batch 和序列。\n\n-
    减小模型（层次/维度）：最终手段，影响模型能力。\n\n\U0001F4CA 决策树：\n\n- OOM 发生在反向传播 → 优先减小 batch 或开启梯度检查点。\n\n-
    OOM 发生在前向 → 通常序列太长或模型太大，先查序列长度，再考虑模型。\n\n- OOM 在优化器 update → 优化器状态过大，启用 ZeRO-1
    或 8-bit Adam。\n\n✅ 快速决策依赖对显存分布的理解，平时做好 profiling，临阵不乱。\n\n---"

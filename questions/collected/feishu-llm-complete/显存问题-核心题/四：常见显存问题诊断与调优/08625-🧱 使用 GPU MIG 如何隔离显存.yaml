content:
  prompt: "\U0001F9F1 使用 GPU MIG 如何隔离显存？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 MIG（Multi-Instance GPU）从硬件层面将一张物理 GPU 切分为多个独立的 GPU
    实例，每个实例拥有专用的显存、缓存和计算核心，彼此完全隔离，就像多张小 GPU。\n\n\U0001F50D 隔离机制：\n\n- 显存专用：每个 MIG
    实例的显存被物理分区，无法访问其他实例的显存。例如 A100-80GB 可划分为 7 个 10GB 的 1g.10gb 实例 + 剩余空闲。\n\n- 错误隔离：一个实例的故障不影响其他实例。\n\n-
    带宽与缓存隔离：L2 缓存、DRAM 带宽也被划分，保证服务质量。\n\n\U0001F4CB 配置步骤示例（节点上）：\n\n```bash\n# 启用
    MIG 模式\nsudo nvidia-smi -i 0 -mig 1\n# 创建 MIG 实例 (以 A100 为例)\nsudo nvidia-smi
    mig -cgi 5,5,5,5,5,5,5 -C\n```\n\n之后重启 NVIDIA K8s Device Plugin，会自动发现 MIG 资源并暴露为
    nvidia.com/mig-...。\n\n\U0001F517 在 Pod 中使用：\n\n```yaml\nresources:\n  limits:\n
    \   nvidia.com/mig-1g.10gb: 1\n```\n\n这样该 Pod 就只能看到那 10GB 的实例，即使模型尝试分配更多也会 OOM，但不会影响其他
    MIG 实例。\n\n✅ 适用场景：需要严格性能隔离的多租户推理服务，或模型大小恰好与 MIG 实例匹配时效率最高。\n\n---"

content:
  prompt: "\U0001F525 模型热更新时，显存如何平稳过渡？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 模型热更新（不停服更新模型版本）的显存过渡需要采用新旧模型共存、流量逐步切换、显存复用或精细卸载的策略，避免瞬时显存峰值导致
    OOM。\n\n\U0001F527 平稳过渡方案：\n\n- 双模型共存 + 流量切换\n\n- 单模型 + 优雅重启\n\n- 动态卸载与重载（同进程内热切换）\n\n-
    使用 PEFT/LoRA 的热插拔\n\n- 显存池的复用\n\n\U0001F4CA 推荐方案：\n\n- 生产环境：优先使用 K8s 滚动更新并配合充裕资源，或使用多模型同时加载
    + 流量切换在有 48GB+ 显存的卡上对 7B 模型进行无感更新。\n\n- 资源受限：用卸载-重载方案，接受几秒服务降级。\n\n✅ 关键：显存过渡平稳的核心是“先建后拆”或“先卸后装”，避免同时持有两份完整权重，以及利用
    LoRA 热插拔。\n\n---"

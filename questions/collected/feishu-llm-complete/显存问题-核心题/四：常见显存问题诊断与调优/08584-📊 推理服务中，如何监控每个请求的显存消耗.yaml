content:
  prompt: "\U0001F4CA 推理服务中，如何监控每个请求的显存消耗？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 推理框架通常以 block 为单位管理 KV Cache，无法直接给出单请求字节数，但可以通过每个请求分配的逻辑块数量与块大小换算。框架暴露的指标是关键。\n\n\U0001F527
    具体方法：\n\n- 利用框架内置 Metrics\n\n- 自定义调度器回调\n在 vLLM 中，可以注册 StatLogger 或通过调度器 API 获取每个序列块数。例如在请求完成时记录
    seq.get_num_blocks() 乘以 block_size 得到占用。\n\n- 运行时显存采样\n若需精确到字节，可在请求前后调用 torch.cuda.memory_allocated()
    记录差值（不包含缓存池碎片）。但推理中动态分配频繁，此法粗糙。\n\n- Prometheus + Grafana 仪表盘\n将框架指标和 GPU 显存指标结合，可在
    Grafana 中按请求聚合或绘制分布图。例如，使用 histogram_quantile 计算 P99 请求显存。\n\n\U0001F4CA 估算示例：\n\n假设
    7B 模型，FP16，每 token KV 大小 0.5MB。某请求 prompt 500 token，生成 200 token，则 KV Cache ≈
    700 × 0.5 = 350MB。\n\n✅ 最佳实践：利用 token 数量结合每 token 成本进行监控，可快速定位高消耗请求。\n\n---"

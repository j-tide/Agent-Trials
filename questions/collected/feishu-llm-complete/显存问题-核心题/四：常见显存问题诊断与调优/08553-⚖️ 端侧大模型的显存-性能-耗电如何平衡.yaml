content:
  prompt: "⚖️ 端侧大模型的显存-性能-耗电如何平衡？"
answer:
  mode: rubric
  reference_answer: "这是一个典型的多目标优化问题，三者呈“不可能三角”：追求极低显存则量化加大，性能下降；追求极致性能则精度和计算资源需求上升，耗电发热加剧。平衡策略是：在可接受的性能底线内，最大化能效，并在特定场景动态调整。\n\n\U0001F50D
    平衡框架：\n\n- \U0001F3AF 确定性能底线 (SLO)\n根据应用场景定义最低可接受的生成速度（如 >10 token/s）和回答质量（如 PPL
    不高于基线 5%）。这是优化的硬约束。\n\n- \U0001F4CF 选择量化的 Pareto 前沿\n测试不同量化位宽下的模型大小、推理速度和质量。通常
    4-bit 是甜点，满足质量且内存适中。如果 3-bit 在特定模型上质量骤降，则坚守 4-bit，转而通过缩短上下文或 KV 量化来省内存。\n\n- ⚙️
    参数动态调整\n\n- \U0001F504 系统级协同优化\n\n- \U0001F4A1 硬件特性挖掘\n苹果 ANE（神经引擎）能效极高但内存小，适合运行小模型或部分层；高通
    Hexagon NPU 有专属内存。将适配合适的算子卸载到这些硬件，可在保持低功耗的同时不占用主存带宽，间接优化显存分配。\n\n\U0001F4CA 实例平衡：\n\n在
    iPhone 15 Pro 上运行 7B Q4 模型，上下文 4096，纯 GPU 推理约 25 tok/s，耗电较快。开启 NPU 混合推理后，速度 ~18
    tok/s，但功耗降低 40%，发热显著改善，且内存占用因 NPU 卸载部分权重而稍有下降。这就是一种成功的平衡。\n\n✅ 平衡的艺术在于：用可接受的性能换取更小的内存和功耗，并让系统能动态迁移工作点。\n\n---"

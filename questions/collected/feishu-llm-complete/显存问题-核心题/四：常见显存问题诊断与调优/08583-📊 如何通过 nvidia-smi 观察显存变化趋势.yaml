content:
  prompt: "\U0001F4CA 如何通过 nvidia-smi 观察显存变化趋势？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 nvidia-smi 是快速诊断 GPU 显存的瑞士军刀，通过持续监控、记录日志和观察模式变化，可以判断训练中的显存是稳定、泄漏、还是突发尖峰。\n\n\U0001F527
    常用命令与技巧\n\n- 持续监控模式\n\n```bash\nnvidia-smi dmon -s pucm -d 2\n```\n\n- -s pucm：显示功耗、利用率、时钟、显存信息。\n\n-
    -d 2：每 2 秒刷新一次。\n输出中 mem 列表示当前使用的显存百分比，观察其随时间的变化曲线：如果单调递增且不回落，极可能是内存泄漏；如果出现周期性尖峰，可能与数据加载或
    checkpoint 保存相关。\n\n- 实时查看进程级显存\n\n```bash\nwatch -n 1 nvidia-smi\n```\n\n观察 Processes
    部分，找到自己的训练进程 PID，看 Memory-Usage 慢慢上升还是突然跳变。若能结合 nvtop 工具，效果更直观。\n\n- 记录显存日志以便事后分析\n\n```bash\nnvidia-smi
    --query-gpu=timestamp,memory.used,memory.total --format=csv -l 1 > gpu_log.csv\n```\n\n用
    Python 读取 CSV 并绘图，可以精确看到 OOM 前的显存爬升曲线。如果是阶梯状上升，通常对应梯度累积或 optimizer step 的分配；如果是陡增，则对应某个大张量分配（如注意力矩阵）。\n\n-
    识别 OOM 时的模式\n\n- 检查温度与功耗相关性\n若显存占用高同时温度飙升，可能触发了硬件保护降频，导致训练变慢但显存不减，这虽不直接 OOM，但会间接影响性能。nvidia-smi
    能同时观察温度、功耗和显存。\n\n\U0001F52C 高级用法\n\n- 通过 nvidia-smi nvlink -e 0 查看 NVLink 传输，辅助判断多卡通信是否导致显存占用。\n\n-
    结合 nvidia-smi -i 0 -q -d MEMORY 输出详细的显存信息，包括 BAR1 使用等。\n\n✅ 总结：用 nvidia-smi 就像看心电图，把显存使用率绘制成时间序列，能最快速识别
    OOM 的宏观类型，为进一步精细化定位提供方向。\n\n---"

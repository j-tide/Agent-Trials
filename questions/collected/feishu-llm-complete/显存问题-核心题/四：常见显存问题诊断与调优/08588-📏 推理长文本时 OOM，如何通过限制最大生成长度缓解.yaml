content:
  prompt: "\U0001F4CF 推理长文本时 OOM，如何通过限制最大生成长度缓解？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 限制 max_new_tokens 或 max_length 是直接控制 KV Cache 最大尺寸的手段，可确保生成阶段不会无限增长致
    OOM。此外，配合 KV Cache 量化、滑动窗口注意力或前缀共享也能从不同维度缓解。\n\n\U0001F527 具体措施：\n\n- 设置最大生成长度：在
    generate 中指定 max_new_tokens=512，保证总序列长度 ≤ prompt_len + 512，KV Cache 被硬限制。\n\n-
    使用更短的系统提示：如果 system prompt 很长，会占据大量 KV Cache 空间，压缩可用生成长度。压缩提示或使用共享前缀技术（PagedAttention
    共享相同前缀的物理块）可减少重复存储。\n\n- 调整 PagedAttention 块数量：vLLM 中通过 --max-model-len 设定最大序列长度，超过则截断或拒绝请求。同时
    gpu_memory_utilization 控制预留给 KV Cache 的显存比例，间接限制并发长请求数量。\n\n- 动态限制用户输入：在应用层对输入
    prompt 长度进行截断或摘要，保留关键信息，缩短序列。\n\n- 启用 KV Cache 量化：如 FP8 KV Cache，相同显存可存放 2 倍长度
    token，间接缓解 OOM。\n\n- 采用 Streaming 输出：虽然不省显存，但可早期感知长生成的风险，如果即将超限可提前终止。\n\n\U0001F4CA
    示例：一张 24GB 卡，7B FP16 权重 14GB，剩余 10GB。FP16 KV Cache 每 token 约 0.5 MB，则最大 token
    数 ≈ 10GB / 0.5MB ≈ 20,000。若 prompt 已 15K，则 max_new_tokens 必须 ≤ 5K，否则 OOM。据此设限。\n\n✅
    所以，max_new_tokens 是长文本推理的安全阀，务必根据显存容量计算好上限。\n\n---"

answer:
  mode: rubric
  reference_answer: "\U0001F4A1 训练不稳定往往表现为激活值或梯度的均值、方差、最大值等统计量异常。通过监控这些统计量，可以提前发现会导致显存问题的异常膨胀，并定位是哪些层或操作引发了过大的张量分配。\n\n\U0001F52C
    具体排查方法：\n\n- 激活值统计监控\n\n- 梯度统计监控\n\n- 定位显存分配热点\n\n- 利用 TensorBoard 或 WandB 绘制曲线\n\n\U0001F4CA
    实用代码片段：\n\npython\n\ndef forward_hook(module, input, output, name):    if isinstance(output,
    torch.Tensor):        print(f\"{name} activation: max={output.max().item():.2f},
    std={output.std().item():.2f}\")for name, module in model.named_modules():    if
    'attention' in name:        module.register_forward_hook(partial(forward_hook,
    name=name))\n\n✅ 通过持续追踪数值统计，可以在 OOM 之前发出预警，并快速锁定问题层，避免盲目调整超参。\n\n---"

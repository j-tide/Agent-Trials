content:
  prompt: "\U0001F4A7 什么是“显存泄漏”？如何检测？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 显存泄漏指程序在运行过程中，不再需要的张量未被释放，导致已分配显存单调递增，最终耗尽所有可用显存。本质是对象引用未断开。\n\n\U0001F50D
    检测方法：\n\n- 观察单调增长：每步打印 torch.cuda.memory_allocated()，若持续上升不回落，基本可判定泄漏。\n\n- 定位泄漏源：使用
    PyTorch Profiler 的 Memory 视图，结合 with_stack=True 找出哪些分配从未释放，查看对应 Python 代码行。\n\n-
    使用 gc 和 weakref：Python 层面检查循环引用。\n\n- 内存快照对比：torch.cuda.memory._record_memory_history()
    记录两个时间点的快照，对比哪些张量新增且未死。\n\n- 常见泄漏场景：记录 loss 到列表、缓存了非叶子张量、自定义层保留输入引用、多线程共享张量等。\n\n✅
    检测泄漏 = 监控 + 快照对比，找到“只分配不释放”的代码。\n\n---"

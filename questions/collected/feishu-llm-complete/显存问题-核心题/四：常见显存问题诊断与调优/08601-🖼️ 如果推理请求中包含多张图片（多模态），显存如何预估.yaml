content:
  prompt: "\U0001F5BC️ 如果推理请求中包含多张图片（多模态），显存如何预估？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 多模态大模型（如 LLaVA）的显存占用 =文本 LLM 部分 + 视觉编码器权重 + 图像 token
    的 KV Cache + 图像编码中间激活。多张图片会导致图像 token 数量成倍增长，KV Cache 和激活峰值随之上升。\n\n\U0001F50D
    预估方法：\n\n- 视觉编码器权重\n\n- 单张图片产生的图像 token 数\n\n- 文本部分 KV Cache\n\n- 中间激活峰值\n\n-
    显存总预估公式\n总显存 ≈ 文本LLM权重 + 视觉编码器权重 + (总token数) × 每token_KV字节 + 激活开销\n其中总 token 数取决于图片数量。例如：\n\n⚙️
    注意事项：\n\n- 部分模型支持图片特征压缩（如 TokenPacker），可减少每张图的 token 数。\n\n- 多图片对话往往需要 batch 处理，若同时处理多个请求，总
    token 数加倍。\n\n- 视觉编码器可以单独卸载到 CPU（如 LLaVA 的 device_map），节约 GPU 显存。\n\n✅ 因此，多模态推理显存预估的关键是准确估计图像
    token 数量并计入 KV Cache**，同时留意视觉编码器的权重和临时激活。\n\n---"

content:
  prompt: "⚖️ 推理服务启动时，如何选择最优的显存分配比例（如权重 vs KV Cache）？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 没有固定的“黄金比例”，最优分配取决于模型大小、序列长度、并发数。核心原则是：在保证能容纳模型权重和必要的激活内存后，将剩余显存尽可能多地划给
    KV Cache 池，然后通过合理设置 max_model_len 和并发数来匹配业务需求。\n\n\U0001F50D 决策依据与步骤：\n\n- 测定固定开销\n\n-
    计算可用显存\n剩余显存 = 总显存 - 权重 - 固定开销。例如 24 GB 卡，7B FP16 权重 14 GB，固定开销 2 GB，剩余 8 GB。\n\n-
    确定 KV Cache 块大小与池容量\n\n- 分配比例的权衡\n\n- 动态权衡\n\n✅ 因此，最优分配是：先满足硬性权重需求，再将剩余显存的大部分划给
    KV Cache，并根据目标序列长度和并发数微调比例，确保不 OOM 且吞吐最大。\n\n---"

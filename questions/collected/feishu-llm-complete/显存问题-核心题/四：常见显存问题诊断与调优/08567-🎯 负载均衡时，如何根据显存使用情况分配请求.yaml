content:
  prompt: "\U0001F3AF 负载均衡时，如何根据显存使用情况分配请求？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 实现“显存感知”的负载均衡，需要每个推理实例上报其剩余容量（如空闲 KV 块数或剩余显存），然后由智能网关或客户端
    SDK 将请求路由到最空闲的实例。\n\n\U0001F527 实现方案：\n\n- 实例侧暴露自定义健康/容量接口\n在推理服务内部添加一个轻量 HTTP
    端点 /health/capacity，返回 JSON 如 {\"free_blocks\": 4500, \"total_blocks\": 5000}。vLLM
    可通过内部 API 获取 scheduler.block_manager.get_num_free_blocks()。\n\n- 负载均衡器侧策略\n\n-
    利用 Prometheus 指标动态调整权重\n使用 Prometheus Adapter 将空闲块数转换为自定义 metric，结合 K8s Service
    的 pod 权重，但实现复杂。更简单的是在应用层（如 Python 客户端）实现轮询 + 随机选优：客户端从服务发现获取所有 pod IP，并发探测 /capacity，选择最大空闲者。\n\n\U0001F4CA
    效果：防止热点实例过载 OOM，同时充分利用所有 GPU 显存，提高整体吞吐。\n\n---"

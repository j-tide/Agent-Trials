  prompt: "\U0001F4CA 训练中如何监控显存的实时使用情况？用什么工具？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 可用命令行、Python API 和仪表盘三类工具：\n\n- 命令行轻量监控：nvidia-smi
    循环，nvtop 图形化。\n\n- 代码内监控：torch.cuda.memory_allocated() 打印趋势。\n\n- 全功能仪表盘：Weights
    & Biases、TensorBoard 可记录显存曲线；Prometheus + Grafana 配合 nvidia-dcgm 实现集群级监控。\n\n\U0001F527
    实操示例：\n\n- 训练循环中每 10 step 记录 torch.cuda.max_memory_allocated() 和 memory_reserved()
    到 TensorBoard。\n\n- 使用 py-spy 或 memray 无法直接看 GPU，但可辅助 CPU 内存泄漏。\n\n✅ 实时监控能尽早发现泄漏和趋势，避免突然
    OOM。\n\n---"

content:
  prompt: "\U0001F504 训练中如果修改了并行策略，如何快速评估新显存需求？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 修改并行策略（如从 TP=2 改 TP=4，或增加 PP 深度）后，显存需求的变化可以通过解析公式和内存估算工具快速预估，核心是计算单卡权重、优化器、激活的新分配量。\n\n\U0001F50D
    评估步骤：\n\n- 权重与优化器状态显存\n\n- 激活值显存\n\n- 通信缓冲区\n\n- 快速计算工具\n\n- 小规模模拟\n\n\U0001F4CA
    实例：原本用 4 卡 ZeRO-3 训练 13B，想改为 2 卡 TP=2 + ZeRO-2。估算：\n\n- ZeRO-3 单卡权重 = 26GB/4 =
    6.5GB\n\n- 新方案：TP=2 权重减半，ZeRO-2 不分片权重，所以单卡权重 = 26GB/2 = 13GB，优化器分片减半？需要逐项计算。总显存可能反而增加，导致
    OOM，因此不可行。\n\n✅ 关键：快速评估依赖于平时积累的显存计算模板，以及利用现成工具验证。修改前务必计算，避免盲目改参数导致 OOM。\n\n---"

content:
  prompt: "\U0001F4F1 安卓和 iOS 在 GPU 显存管理上有什么差异？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 核心差异在于统一内存架构的实现、GPU 驱动成熟度、以及系统对内存分配的限制。iOS 的统一内存模型更透明高效，且
    Metal 驱动对 GPU 内存管理细致；安卓则碎片化严重，不同厂商的 GPU 驱动与内存分配策略差异大，且缺乏统一低开销 API，常依赖 Vulkan/OpenCL，内存管理较为粗放。\n\n\U0001F50D
    具体对比：\n\n[嵌入表格未展开]\n\n\U0001F9E0 移动端推理框架的应对：\n\n- MLX (苹果专用) 充分利用 Metal 和统一内存，代码简洁，内存占用低。\n\n-
    MLC-LLM 针对安卓使用 OpenCL/Vulkan，需小心设置 max_total_tokens 等参数避免 GPU 内存爆掉。\n\n- llama.cpp
    在安卓上倾向于 CPU 推理以减少 GPU 内存管理难题；在 iOS 上则可利用 Metal 加速，内存使用更可控。\n\n\U0001F4F1 现实案例：同一
    Q4 7B 模型，在 iPhone 15 上能以 4096 上下文稳定运行，而在某些 12GB 安卓设备上却因 GPU 内存碎片崩溃，只能降为 2048 上下文。这就是驱动成熟度差异的体现。\n\n✅
    因此，iOS 在 GPU 内存管理上更统一、可预测，安卓则需针对不同 GPU 厂商谨慎调参，并做好 fallback 到 CPU 推理的准备。\n\n---"

content:
  prompt: "\U0001F19A 不同推理框架（vLLM, TGI, TensorRT-LLM）的显存管理策略有何异同？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 三大框架都采用了分页 KV Cache 机制，但在实现细节、预分配策略、offload 支持和优化重点上存在差异。\n\n\U0001F4CA
    对比表格：\n\n[嵌入表格未展开]\n\n\U0001F50D 详细比较：\n\n- vLLM 是最早提出 PagedAttention 的，显存管理成熟，社区活跃，支持
    continuous batching 和 prefix caching，swap 功能使得在大流量下能弹性处理。\n\n- TGI 由 HuggingFace
    推出，与 transformers 生态集成紧密，同样支持 paged attention 和 continuous batching，但 swap 功能缺失，在极端显存压力下可能不如
    vLLM 灵活。\n\n- TensorRT-LLM 基于 NVIDIA TensorRT，显存管理完全由 TensorRT 优化，内存池效率极高，且针对
    GPU 架构深度优化，可以做到极低的延迟和高吞吐，但使用门槛较高，需要构建引擎。\n\n✅ 选择建议：追求易用和快速部署选 vLLM；需与 HuggingFace
    生态无缝结合选 TGI；追求极致性能和成本优化（尤其使用 NVIDIA 硬件）选 TensorRT-LLM。\n\n---"

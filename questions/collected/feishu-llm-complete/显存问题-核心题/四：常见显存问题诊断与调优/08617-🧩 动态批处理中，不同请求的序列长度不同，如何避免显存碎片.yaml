content:
  prompt: "\U0001F9E9 动态批处理中，不同请求的序列长度不同，如何避免显存碎片？"
answer:
  mode: rubric
  reference_answer: |-
    核心方案：PagedAttention 的分块管理

    传统做法为每个请求预留最长序列的连续显存，导致严重内部碎片和外部碎片。动态批处理下，多个请求长度各异，PagedAttention 将 KV Cache 分割为固定大小的 block：

    - 每个请求只需按需分配若干 block，最后一个 block 会有少许内部碎片（平均半块），但外部碎片彻底消失，因为所有分配单位大小相同。

    - 请求结束后，其占用的 block 被整体回收到空闲池，供后续请求使用，不会产生不可合并的孔洞。

    辅助措施：

    - 使用内存池的统一分配器，避免直接 cudaMalloc。

    - 动态调整 batch 成员，尽早移除已完成的长请求，释放 block。

    - 结合 prefix caching 共享相同前缀的 block，减少重复分配。


content:
  prompt: "\U0001F9F9 在长连接下，KV Cache 的累积如何设计淘汰策略？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 长连接（如 WebSocket 对话）中，对话历史不断增长，KV Cache 必须淘汰以限制资源。淘汰策略需在保留上下文质量和释放显存之间权衡，常见方法包括滑动窗口、LRU、基于
    token 数限制、主动摘要等。\n\n\U0001F527 策略设计：\n\n- 滑动窗口（Sliding Window）\n\n- 基于 token 总数的硬性限制\n\n-
    LRU（最近最少使用）\n\n- 主动摘要（Summarization）\n\n- 分层淘汰（优先丢弃 Value 等）\n\n- 用户可控的“重置”\n\n\U0001F4CA
    推荐实践：\n\n- 对于单个长连接，使用 token 数硬限制 + 滑动窗口，保证显存可预测。\n\n- 对于服务端多连接，结合 全局 LRU 淘汰 +
    swap，如 vLLM 将冷会话换出到 CPU，热会话保留 GPU。\n\n- 设置告警：当空闲块低于阈值，主动淘汰低优先级或长连接的旧历史。\n\n✅ 长连接淘汰策略核心是“设定上限，有序丢弃”，并利用
    swap 柔性处理突发，避免 OOM。\n\n---"

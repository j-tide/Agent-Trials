content:
  prompt: "\U0001F9E0 MoE 模型的 KV Cache 和稠密模型一样吗？"
answer:
  mode: rubric
  reference_answer: |-
    从结构和大小上看，几乎完全一样。 MoE 的注意力机制通常是标准的 Transformer 注意力（非 MoE 化），所以 K 和 V 的产生和存储方式与同等配置的稠密模型相同。

    - 大小公式一致：每 token KV 大小 = 2 × 层数 × KV 头数 × 头维度 × 精度字节，与是否 MoE 无关。

    - Mixtral 8×7B 为例：其注意力为 GQA，KV 头数为 8，层数 32，头维度 128，每 token KV Cache 大小与同配置稠密模型完全一致。

    - 不随专家数量变化：专家层只在 FFN 部分，不影响注意力缓存。

    ⚠️ 微小差异：部分 MoE 架构可能对注意力也做稀疏化（如 Switch Transformer 的 attention MoE），但绝大多数主流 MoE 保持稠密注意力。

    ✅ 因此，MoE 模型的 KV Cache 不是额外的显存噩梦，真正的噩梦是总专家权重。


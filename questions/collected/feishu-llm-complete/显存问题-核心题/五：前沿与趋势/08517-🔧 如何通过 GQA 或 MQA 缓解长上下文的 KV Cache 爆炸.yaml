content:
  prompt: "\U0001F527 如何通过 GQA 或 MQA 缓解长上下文的 KV Cache 爆炸？"
answer:
  mode: rubric
  reference_answer: "GQA (Grouped-Query Attention) 和 MQA (Multi-Query Attention) 的核心思想是减少
    KV 头的数量，让多个 Query 头共享同一组 Key 和 Value 头，从而直接减小 KV Cache 的尺寸。\n\n- MQA：所有 Query
    头共享唯一的一对 K、V 头。KV 头数 = 1，压缩比等于 Query 头数。\n例如，32 个 Query 头，MQA 使 KV Cache 变为原来的
    1/32。\n\n- GQA：将 Query 头分成 G 个组，每组共享一对 KV 头。KV 头数 = G。\n例如，32 个 Query 头，G=4，KV
    头数 = 4，KV Cache 缩减为原来的 4/32 = 1/8。\n\n\U0001F4CA 效果对比（7B，128K 上下文）：\n\n[嵌入表格未展开]\n\n这样一来，原本需要
    80GB 显存的场景，使用 GQA 4 组后仅需约 24 GB（权重 14 GB + KV Cache 8 GB + 其他），单卡 32GB 的 V100
    也能运行，极大降低了长上下文的门槛。GQA 在保持模型质量方面通常优于 MQA，因为仍有多个 KV 头可以捕获不同的信息，因此成为现代长上下文模型（如 Llama
    3、Mistral）的主流选择。\n\n---"

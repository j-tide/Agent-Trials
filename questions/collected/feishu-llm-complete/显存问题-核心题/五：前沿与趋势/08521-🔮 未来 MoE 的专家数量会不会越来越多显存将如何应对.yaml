content:
  prompt: "\U0001F52E 未来 MoE 的专家数量会不会越来越多？显存将如何应对？"
answer:
  mode: rubric
  reference_answer: "专家数量会持续增长，这是 MoE 扩展模型容量的核心手段。 DeepSeek-V2 已有 160 个专家，未来可能出现上千专家。显存应对策略需从硬件、算法、系统多维度创新：\n\n-
    分层存储与动态加载：将专家权重放在 CPU 内存甚至 SSD，利用大容量系统内存做一级缓存，GPU 显存仅保留最热门的专家（类似 KV Cache 的 swap
    机制）。通过智能预取和流水线隐藏传输延迟。\n\n- 更极致的量化与压缩：2-bit、3-bit 量化，结合专家特定的 codebook 压缩，可能将 MoE
    权重压缩 8-16 倍。\n\n- 专家共享与分解：引入低秩共享基座，专家仅学习残差，减少有效参数。\n\n- MLA 类技术：将部分计算转为低秩潜空间，进一步减少必须缓存的权重。\n\n-
    异构计算：将部分专家卸载到 NPU/专用加速器的专用内存中，与 GPU 协同。\n\n- 自适应专家加载：应用层预测所需专家，实现几乎无感的动态调度。\n\n\U0001F4CA
    预计：随着系统逐渐成熟，未来推理千专家 MoE 模型将如同现在推理 7B 稠密模型一样普及，显存将不再是绝对壁垒，但带宽和延迟的挑战会持续推动创新。\n\n---"

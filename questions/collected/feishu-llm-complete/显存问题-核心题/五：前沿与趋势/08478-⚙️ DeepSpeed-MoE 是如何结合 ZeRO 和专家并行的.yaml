content:
  prompt: "⚙️ DeepSpeed-MoE 是如何结合 ZeRO 和专家并行的？"
answer:
  mode: rubric
  reference_answer: "DeepSpeed-MoE 将 MoE 模型视为一个整体，利用专家并行（EP）切分专家层，同时利用 ZeRO 优化器状态分片处理非专家层参数，实现多层级的显存削减。\n\n\U0001F527
    结合方式：\n\n- 专家并行（EP）用于专家层：将 E 个专家分布到 EP 度个 GPU 上，每张卡只存储 E/EP 个专家。前向/反向时，通过 All-to-All
    通信路由 token。这直接降低了单卡专家权重的显存占用。\n\n- ZeRO 用于非专家层及专家优化器状态：\n\n- 混合并行与通信优化：DeepSpeed-MoE
    自动选择最优的 EP 度和 ZeRO stage，并重叠通信与计算。例如，在 EP 组内进行 All-to-All 时，同时进行非专家层的 All-Reduce，减少气泡。\n\n-
    专家卸载：结合 ZeRO-Offload，可以将不活跃的专家优化器状态或参数卸载到 CPU/NVMe，进一步压缩 GPU 显存。\n\n\U0001F4CA
    效果：通过这种组合，可以在数张 GPU 上训练千亿级 MoE 模型，单卡显存控制在 40-60 GB，同时保持高吞吐。\n\n---"

content:
  prompt: "\U0001F310 专家并行如何减少单卡显存？它的通信代价是什么？"
answer:
  mode: rubric
  reference_answer: "专家并行（Expert Parallelism, EP）将不同的专家分布到不同的 GPU 上，每张卡只存储自己负责的那部分专家权重及其优化器状态。因此，单卡权重的显存压力从“全部专家”降至“部分专家”，线性降低单卡存储需求。\n\n-
    显存减少：假设有 E 个专家，EP 度为 P，则每卡仅需存储 E/P 个专家。例如 Mixtral 8×7B（8 专家），使用 EP=4，单卡专家权重从 8
    个降至 2 个，权重显存直接降至原来的 1/4。\n\n- 通信代价：MoE 的 EP 引入了 All-to-All 通信。每个 token 经过路由后，需要发送到对应专家所在的
    GPU 上进行计算，计算完成后再把结果传回原 GPU。All-to-All 通信量正比于每个 token 的隐藏状态大小和 token 数量，对网络带宽要求很高。如果
    token 分布不均，某些 GPU 会承受更大的通信量，导致瓶颈。\n\n\U0001F4CA 因此，专家并行是训练 MoE 模型的必备手段，它通过额外的
    All-to-All 通信，换取了单卡显存的大幅下降，使得千亿级 MoE 模型训练成为可能。\n\n---"

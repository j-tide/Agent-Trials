content:
  prompt: "\U0001F9E9 如何处理超长文本的 Prefill 阶段显存峰值？"
answer:
  mode: rubric
  reference_answer: "Prefill 阶段（又称编码阶段）需要将整个输入 prompt 一次性计算，产生每一层的 Key、Value 并存入 KV
    Cache，同时还要执行注意力计算。超长 prompt（如 100K token）下，瞬间产生的中间激活张量（Q、K、V、注意力输出等）以及可能存在的注意力矩阵会形成极高的显存峰值，其大小与序列长度
    L 成正比甚至平方关系。处理这一峰值的核心思路是：分块计算、及时释放、用时间换空间。\n\n\U0001F6E0️ 主要方法包括：\n\n- FlashAttention
    / FlashDecoding 分块计算\nFlashAttention 将 Q、K、V 沿着序列维度切分成小块，在 SRAM 内完成 softmax 增量计算，避免产生完整的
    O(L²) 注意力分数矩阵。同时，其反向（如果涉及）也不需要存储该矩阵。对于纯粹的超长 Prefill，FlashAttention 能够将注意力部分的内存需求从
    O(L²) 压到 O(L)，但 Q、K、V 自身仍是 O(L)，仍需处理。\n\n- 分块预填充（Chunked Prefill）\n将长 prompt 切分成多个较小的块（chunks），逐块进行前向计算，而不是一次性加载整个序列。每次只计算一个块的注意力，产生的
    K、V 追加到 KV Cache 中，然后立即释放该块的中间激活。这样峰值显存由单块大小决定，而非总长度。例如 vLLM 通过 --max-num-batched-tokens
    和 --max-num-seqs 控制每批处理的 token 数，实现 chunked prefill。\n\n- 序列并行（Sequence Parallelism）\n如果有多张
    GPU，可将 prompt 的序列维度切分到不同 GPU 上，每张卡只负责一部分 token 的前向计算和存储，再通过通信还原完整结果。典型如 Megatron-LM
    的序列并行，配合张量并行，将单卡上的激活峰值大幅降低。\n\n- 激活重计算（在训练中）或动态释放\n推理时本身没有反向传播，因此 Prefill 产生的中间激活在传递给下一层后即可丢弃。框架需要确保及时释放，避免积累。PyTorch
    的引用计数机制通常可以做到，但若计算图中存在跨层引用，可能会无意中延长生命周期，需要手动优化。\n\n- CPU/内存卸载（Offload）\n对于极端情况，可以在
    Prefill 过程中将部分中间结果或暂时不用的权重块卸载到 CPU 内存，待需要时再异步传回，进一步削峰。\n\n- 使用 KV 缓存量化\n如果 Prefill
    的同时需要存储大量 KV Cache，直接以低精度（如 INT8）存储，可以减少后续解码阶段的常驻占用，但对 Prefill 峰值本身影响不大，因为 Prefill
    计算仍需要高精度临时张量。\n\n\U0001F4CA 实例：假设 7B 模型，输入 128K token，若直接 Prefill，Q、K、V 各需 128K
    × 4096 × 2 = 1 GB 左右，加上其他激活，峰值可能达 10+ GB。若采用 chunked prefill，块大小为 4096，则峰值仅需对应
    4K token 的激活，约几百 MB，显存压力锐减。\n\n---"

content:
  prompt: "\U0001F9F9 长上下文推理时的显存碎片问题如何解决？"
answer:
  mode: rubric
  reference_answer: "长上下文推理中，KV Cache 的频繁分配（不同长度的请求）和释放极易产生外部碎片：大量小块空闲显存散布各处，无法合并成大块满足新序列的需求。解决之道是采用固定大小的块分配（分页）和统一内存池管理。\n\n\U0001F527
    具体方法：\n\n- PagedAttention 的块分配\n将 KV Cache 划分为统一大小的物理块（如 16 token），无论请求序列多长，都按块分配。所有块从同一个预分配的内存池中取出，回收也是整块归还。由于所有块大小相同，外部碎片完全消除，内部碎片仅平均半块，可忽略。\n\n-
    vLLM 的 C++ 块管理器：维护空闲栈，分配和释放 O(1)，并且支持块复制、swap 等。显存利用率可达 90% 以上。\n\n- 统一内存池：不仅
    KV Cache，其他临时张量也从同一池中分配，配合 TensorFlow/PyTorch 的 CUDA 缓存分配器，但框架往往针对 KV Cache 单独建池以避免干扰。\n\n-
    定期碎片整理（Defragmentation）：如 vLLM 支持当空闲块总数足够但缺乏大段时，通过搬移块来创造连续空间，类似于操作系统内存整理，但开销较大，通常用于极端情况。\n\n-
    限制最大序列长度：减少极长请求，避免大块分配导致池迅速耗尽。\n\n\U0001F4CA 实际效果：采用 PagedAttention 后，同样显存能服务的并发请求数提升
    2-4 倍，且不会出现随着时间碎片积累而导致的 OOM。\n\n---"

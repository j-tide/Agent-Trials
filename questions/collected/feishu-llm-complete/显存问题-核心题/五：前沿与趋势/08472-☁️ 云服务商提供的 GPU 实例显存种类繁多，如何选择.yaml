content:
  prompt: "☁️ 云服务商提供的 GPU 实例显存种类繁多，如何选择？"
answer:
  mode: rubric
  reference_answer: "选择云 GPU 实例时，不能仅看显存容量，而需以模型需求为出发点，匹配显存、带宽、算力和成本。根据推理还是训练、模型大小、上下文长度、并发量，抉择思路如下：\n\n\U0001F3AF
    1. 明确任务类型与核心瓶颈\n\n- 推理：瓶颈通常是显存容量（装模型和 KV Cache）和显存带宽（生成速度）。算力需求相对低。\n\n- 训练：瓶颈是算力、显存容量（权重+优化器+激活）和卡间通信带宽。优先考虑高端实例。\n\n\U0001F4D0
    2. 根据模型大小筛选候选实例\n\n- 计算所需最小显存：模型权重（精度算）+ KV Cache 峰值 + 激活开销。\n\n- 例如运行 13B FP16
    模型，4K 上下文：权重 26GB，KV Cache 约 4GB，总约 30GB。至少需要 32GB 以上显存实例（如 A10 24GB 不够）。\n\n-
    如果有量化，权重大幅降低，可降级实例节省成本。\n\n⚡ 3. 根据吞吐和延迟要求选择带宽\n\n- 若需要高并发、低延迟（如在线对话），必须选择 HBM
    高带宽实例（A100, H100, MI300X），其 decode 速度远快于 GDDR 实例。\n\n- 若吞吐要求不高、离线批处理，可选用 GDDR
    的大显存实例（如 L40S 48GB），性价比更高。\n\n\U0001F4B0 4. 根据预算和规模选择实例类型\n\n- 开发测试、小规模服务：选单卡
    A10 24GB, L4 24GB, A4000 16GB，成本极低。\n\n- 生产级中等规模：A100 40/80GB, L40S 48GB，可覆盖 7B–13B
    模型推理。\n\n- 大模型、大并发：H100 80GB, H200 141GB, MI300X 192GB，适合 70B+ 模型或长上下文。\n\n- 多模态模型：额外注意多模态编码器的显存和算力需求，可能需更强
    GPU。\n\n\U0001F527 5. 考虑特殊功能与生态\n\n- 是否需要 MIG 多租户隔离？NVIDIA A100/H100 支持。\n\n-
    是否依赖 CUDA 生态？选 N 卡；若使用 ROCm 可尝试 MI 系列。\n\n- 云厂商提供的管理服务（如 AWS P5, GCP TPU v5e）可能简化部署。\n\n\U0001F4CA
    快速决策表示例\n\n[嵌入表格未展开]\n\n✅ 因此，选型核心是：模型 → 显存容量门槛 → 带宽/算力需求 → 成本约束，在满足最低要求后，优先匹配带宽以保障体验，再用性价比筛选。\n\n---"

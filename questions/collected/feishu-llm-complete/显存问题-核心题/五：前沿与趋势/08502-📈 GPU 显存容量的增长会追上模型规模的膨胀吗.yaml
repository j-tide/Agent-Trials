content:
  prompt: "\U0001F4C8 GPU 显存容量的增长会追上模型规模的膨胀吗？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 从历史趋势看，模型参数规模的增长速度远超显存容量增长。摩尔定律放缓，而模型参数量仍以每年数倍的速度激增，因此短期乃至中期内，显存容量增长难以追上模型规模膨胀。\n\n\U0001F4CA
    数据对比：\n\n- GPU 显存：2020 年 A100 80GB → 2023 H100 80GB（容量未增）→ 2024 H200 141GB。4 年仅增长
    76%。\n\n- 模型规模：2020 年 GPT-3 175B → 2023 GPT-4 约 1.8T（10 倍）→ 2024 年 DeepSeek-V3
    671B MoE。顶尖模型大小远超越单卡容量。\n\n\U0001F50D 根本原因：\n\n- 显存增长依赖内存工艺和堆叠技术，成本高，提升缓慢。而模型可通过增加层数、专家数、序列长度等快速膨胀。\n\n-
    即使显存赶上，带宽和功耗也会成为新瓶颈。因此，单纯追容量不是唯一出路。\n\n\U0001F52E 趋势展望：显存会继续增长，但模型规模也会同步扩张，且应用场景（如千万级
    token 上下文）会对显存提出更高要求。因此，必须依靠量化、卸载、分片等系统优化来弥合缺口，而非仅仅等待硬件。\n\n✅ 结论：显存容量的增长是线性的，模型规模的膨胀是指数级的，二者鸿沟需要软硬件协同来填补。\n\n---"

content:
  prompt: "\U0001F9EA 大模型训练对显存的依赖会不会被算法突破（如无需存储激活值的训练）？"
answer:
  mode: rubric
  reference_answer: "算法层面正在持续突破，但完全消除显存依赖尚不可能，不过可能将显存需求降低到不再成为主要瓶颈的水平。 当前已有多项技术大幅削减训练显存：\n\n-
    梯度检查点（Gradient Checkpointing）：用计算换显存，已减少大部分激活存储。但优化器状态、权重和梯度仍须全量保存，所以显存依赖依然存在。\n\n-
    可逆网络（RevNets）：每一层的激活可由下一层的输出反推，理论上无需存储任何中间激活，将激活显存降至接近 0。但额外计算量和架构约束使其尚未大规模用于
    Transformer。\n\n- ZeRO 分片与 Offload：将优化器状态、梯度、参数分片到多卡或卸载到 CPU/NVMe，这属于系统优化，依赖硬件扩展而非算法根本消除显存。\n\n-
    微观批量重计算（Micro-batch GCP）：训练时结合流水线并行，将激活分片存放。\n\n但优化器状态和权重是必需存储的。当前训练必须维护 FP32
    主权重和 Adam 状态（动量和方差），这部分显存占大头且无法省略，除非彻底改变优化算法。例如：\n\n- 无优化器状态的训练：如 Shampoo、SM3
    等可以减少状态；LION 优化器将动量和方差合二为一，省一半状态；未来可能涌现更激进的无状态优化器，仅靠梯度直接更新。\n\n- 在线学习/流式更新：如果抛弃大
    batch 训练，改用逐样本更新，优化器状态可被压缩或近似。\n\n- 分布式学习与联邦平均：显存压力分散到多个设备，但总体需求未变。\n\n\U0001F680
    潜在革命性突破：\n\n- 前向-前向算法（Forward-Forward）：摒弃反向传播，无需存储激活，显存需求骤降，但尚未大规模验证。\n\n- 预测编码与局部学习：使用局部损失更新，避免全局反向传播，激活和梯度均可局部化，降低单卡存储。\n\n✅
    因此，训练对显存的依赖正被逐步瓦解，未来可能出现“无反向传播”、“无优化器状态”的训练范式，届时显存将不再是大模型训练的首要限制，但近期仍需系统+算法组合拳。\n\n---"

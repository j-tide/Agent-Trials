content:
  prompt: "\U0001F4BE 是否可以对 KV Cache 进行有损压缩？有哪些方法？"
answer:
  mode: rubric
  reference_answer: "可以，而且有损压缩是节省长上下文显存的重要方向。 其核心思想是：Key 和 Value 中存在信息冗余，可以通过量化、降维、剪枝等手段减少其存储所需的比特数或元素个数，从而在可接受的精度损失下大幅压缩
    Cache 体积。\n\n\U0001F52C 主要方法：\n\n- 量化（Quantization）\n将 K、V 从 FP16 降低到 INT8、INT4
    甚至 FP8 存储。例如，llama.cpp 支持 --cache-type-k q8_0 --cache-type-v q8_0，可将 KV Cache
    大小减半或更多。SmoothQuant、AWQ 等通过激活感知缩放，使低精度量化后的误差更小。更有激进的如 KV4（INT4），进一步压缩。\n\n- 降维
    / 低秩压缩\n利用低秩分解，只存储 K 和 V 在一个低维空间中的投影，实际计算时再通过解压矩阵还原。DeepSeek-V2 的 MLA 即属于此类，将
    K 和 V 压缩为一个潜向量 c_KV，解压矩阵共享，压缩率可达 4-8 倍。\n\n- 重要 token 保留（Sparse / Eviction）\n并非所有
    token 的 KV 都同等重要。H2O 等方法根据注意力分数累积，只保留对预测最重要的 KV 对（heavy hitters），丢弃次要 token 的
    KV。StreamingLLM 保留 attention sink（开头几个 token）加上最近窗口，也是一种有损策略。\n\n- 混合精度 / 选择性精度\n对不同层的
    KV 使用不同精度；或者对 Key 和 Value 使用不同量化策略，因为 Value 往往对精度更敏感。\n\n- 激活稀疏性利用\n部分 token 的注意力权重非常小，它们的
    Value 对输出贡献可以忽略，可以完全丢弃。\n\n\U0001F4CA 效果：通过组合量化和重要 token 保留，可以将 KV Cache 压缩至原来的
    1/4 甚至 1/8，且模型性能下降有限，非常适合长上下文推理。\n\n---"

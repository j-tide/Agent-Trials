content:
  prompt: "\U0001F4A7 StreamingLLM 如何通过保留“注意力汇点”（attention sink）来稳定长序列推理？"
answer:
  mode: rubric
  reference_answer: "StreamingLLM 发现，即使序列长度超过训练的最大长度，Transformer 模型仍能稳定生成，只要保留开头的几个初始
    token（通常是 BOS 等）的 KV Cache，它们会成为“注意力汇点”，吸收大量注意力权重，稳定注意力分布。如果随意丢弃这些 token，注意力图会扭曲，导致输出质量崩溃。\n\n\U0001F527
    实现策略：\n\n- 固定保留区：始终保留序列开头的前 S 个 token（S 通常很小，如 4），称为 attention sink。\n\n- 滑动窗口：除此之外，仅保留最近
    W 个 token 的 KV Cache，旧的普通 token 被丢弃。\n\n- 总缓存大小 ≈ S + W 个 token 的 KV Cache，固定可控。\n\n\U0001F680
    效果：\n\n这使得模型可以在无限长的流式输入上运行，不会因缓存无限增长而 OOM，且生成质量保持稳定，远优于纯窗口注意力从头丢弃旧 token 的做法。\n\n\U0001F4CA
    实验证明，仅保留 4 个初始 token 就能让多个模型在长达数百万 token 的流式解码中不崩溃，且困惑度保持平稳。这为长文本推理和长对话系统提供了极其实用的缓存管理方案。\n\n---"

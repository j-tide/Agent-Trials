content:
  prompt: "\U0001F9D0 稀疏激活的 MoE 模型，是否天然比稠密模型更省推理显存？不一定，为什么？"
answer:
  mode: rubric
  reference_answer: |-
    答案是否定的。 尽管 MoE 每次计算只激活部分专家，但推理时必须将所有专家权重都加载到显存中（除非使用动态卸载）。因此，MoE 模型的总参数量决定了其显存占用，通常远大于具有相同计算量的稠密模型。显存并不省，反而更“费”。

    - 总参数量 vs 激活参数量：MoE 的设计是用更多的总参数换取更高的模型质量，同时保持计算量基本不变。例如，Mixtral 8×7B 的激活参数约为 12.9B（相当于一个稠密 13B 模型），但其总参数量却高达 46.7B。如果和一个真正的 13B 稠密模型相比，MoE 权重多出约 33B，显存多了数十 GB。

    - 推理显存的组成：权重 + KV Cache + 临时激活。其中权重大头由总参数量决定，KV Cache 由序列长度决定（与稠密模型相似），临时激活与激活参数量成正比。即使激活部分稍小，但权重的巨大增量远远超过这部分的节省。

    - 实际数据：FP16 下，13B 稠密权重 26 GB；Mixtral 8×7B 权重 93 GB。显存需求是前者的 3.5 倍。若使用 4-bit 量化，13B 约 6.5 GB，MoE 约 23.4 GB，仍是 3.6 倍。

    ✅ 所以，稀疏激活 MoE 在推理显存上绝非“省油灯”，它是以显存换计算效率的典型。 选择 MoE 是因为希望在固定的计算预算下提升模型能力，但要为此准备更大的显存。


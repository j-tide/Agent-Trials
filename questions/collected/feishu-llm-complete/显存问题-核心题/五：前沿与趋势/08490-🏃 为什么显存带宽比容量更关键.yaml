content:
  prompt: "\U0001F3C3 为什么显存带宽比容量更关键？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 容量决定“能不能跑起来”，带宽则决定“跑得多快”。在推理场景中，特别是自回归 decode，每生成一个
    token 都要从显存读取全部权重和庞大的 KV Cache，计算量不大但访存量巨大，此时带宽直接成为生成速度的瓶颈。\n\n\U0001F52C 具体原因：\n\n-
    Decode 阶段是典型的访存密集型：每 token 计算需要读取模型所有权重（数十 GB）和全部 KV Cache（可能数 GB），乘加操作较少。GPU
    计算单元虽强，但大部分时间在等待数据从 HBM 传输至芯片。带宽越高，数据搬运越快，生成延迟越低。\n\n- 容量可通过 offload 弥补，带宽不行：模型权重可以放在
    CPU 甚至 SSD，通过 swap 换入，但 PCIe 带宽（~50GB/s）远低于 HBM 带宽（TB/s），会严重拖慢速度。因此，充足的显存容量若没有高带宽支撑，就像一个大水库只接了一根小水管，吞吐极低。\n\n-
    并发请求同样受限于带宽：多个请求同时 decode，需要并发读取各自的 KV Cache，总需求带宽线性增长。若带宽不足，即使显存有余，也无法增加并发数。\n\n\U0001F4CA
    举例：一张 141GB H200 与一张 80GB H100 相比，容量多出 60GB，若带宽相同，对于 decode 速度并无提升，只能装下更大的模型或更长的上下文；但实际上
    H200 带宽也提升了，所以综合体验更好。如果只增加容量不增加带宽，用户体验可能并未改善。\n\n✅ 因此，在大模型推理中，带宽往往是比容量更紧要的性能指标。高带宽直接决定了生成速度和并发能力。\n\n---"

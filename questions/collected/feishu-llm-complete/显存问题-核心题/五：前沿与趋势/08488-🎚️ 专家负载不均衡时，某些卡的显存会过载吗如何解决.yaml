content:
  prompt: "\U0001F39A️ 专家负载不均衡时，某些卡的显存会过载吗？如何解决？"
answer:
  mode: rubric
  reference_answer: "会。专家负载不均衡意味着部分专家处理了绝大多数的 token，而其他专家几乎空闲。在专家并行下，处理热门专家的 GPU 将需要存储大量的中间激活、梯度（训练时）和通信缓冲区，导致显存占用远超其他
    GPU，可能引发 OOM。而空闲 GPU 的显存却未充分利用。\n\n\U0001F527 解决方法：\n\n- 负载均衡损失（Load Balancing
    Loss）：在训练时添加辅助损失，鼓励路由器将 token 均匀分配到各个专家，是最根本的手段。\n\n- 专家容量限制（Expert Capacity）：设定每个专家最多处理的
    token 数。超出容量的 token 会被“溢出”，通过残差连接直接传递给下一层（或丢弃）。这能够为显存提供硬性保证，防止某张卡过载，但可能损失信息。\n\n-
    动态重新分配 / 弹性专家并行：在检测到负载不均时，动态调整专家分布（如将热门专家复制多份到不同 GPU），但这增加了复杂性。\n\n- 通信缓冲管理：调整
    NCCL 等通信库的缓冲区大小，及时回收闲置缓冲。\n\n- 监控与自动调整：实时监控每张卡的显存和 token 分配，当出现不均衡时，通过降低全局 batch
    size 或增加容量因子来缓解。\n\n✅ 因此，负载均衡不仅是计算效率问题，更是显存稳定性的关键保障。\n\n---"

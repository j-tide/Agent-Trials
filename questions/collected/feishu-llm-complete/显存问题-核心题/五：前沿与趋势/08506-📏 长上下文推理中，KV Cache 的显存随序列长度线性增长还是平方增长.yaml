content:
  prompt: "\U0001F4CF 长上下文推理中，KV Cache 的显存随序列长度线性增长还是平方增长？"
answer:
  mode: rubric
  reference_answer: "KV Cache 的显存占用是严格的线性增长，即 O(L)，其中 L 为序列长度。\n\n\U0001F50D 原因：\n\nKV
    Cache 存储的是每一层中每个 token 对应的 Key 向量和 Value 向量。对于单个 token，其 K、V 的大小是固定的（由头数、头维度和精度决定）。当序列长度增加时，只需在尾部追加新
    token 的 K 和 V，而无需修改或复制已有的缓存。因此总字节数与 token 数量成正比。\n\n\U0001F4D0 通用公式：\nKV_Cache_Size
    = 2 × num_layers × num_kv_heads × head_dim × bytes_per_element × sequence_length\n\n其中，num_kv_heads
    在 GQA/MQA 中可能小于 num_query_heads。如果使用 FP16，bytes_per_element = 2。\n\n与注意力矩阵的 O(L²)
    计算量不同，推理阶段通过 FlashAttention 等技术可以避免显式存储整个注意力矩阵，因此显存的超级杀手是 O(L) 的 KV Cache，而不是
    O(L²) 的中间激活（在训练中反向传播时会保留这些激活，但推理时不需要）。\n\n---"

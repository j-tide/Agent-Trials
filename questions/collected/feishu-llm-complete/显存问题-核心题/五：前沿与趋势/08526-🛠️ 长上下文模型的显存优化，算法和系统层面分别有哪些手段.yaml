content:
  prompt: "\U0001F6E0️ 长上下文模型的显存优化，算法和系统层面分别有哪些手段？"
answer:
  mode: rubric
  reference_answer: "\U0001F539 算法层面：从模型结构和数学原理上减少缓存需求\n\n- GQA / MQA：减少 KV 头数，成倍压缩
    KV Cache 尺寸。\n\n- MLA：通过低秩潜在向量压缩 K 和 V，实现更高压缩率。\n\n- 窗口注意力 + 全局 token：限制 KV Cache
    大小，丢弃窗口外 token。\n\n- KV 量化 / 有损压缩：使用 INT8/INT4 存储，或结合重要性剪枝。\n\n- 位置编码改进：如 ALiBi、RoPE
    的扩展，使模型能外推到更长序列而不需要重新训练，间接允许在有限显存下使用较长上下文（虽然 Cache 大小未变，但模型支持了）。\n\n- 稀疏注意力模式：如
    BigBird、Longformer 的局部+全局注意力，降低注意力计算复杂度，但不直接影响 KV Cache 大小（除非同时丢弃对应的 KV）。\n\n-
    SSM 替代：彻底消除 KV Cache。\n\n\U0001F538 系统层面：从工程实现和资源调度上优化显存使用\n\n- PagedAttention
    等块管理：消除 KV Cache 外部碎片，提高显存利用率。\n\n- Chunked Prefill：削峰，降低 Prefill 阶段峰值。\n\n- 序列并行
    / 张量并行：将计算和存储分布到多卡，单卡显存压力减小。\n\n- CPU / NVMe offload：将部分 KV Cache 或权重卸载到 CPU 或硬盘，需要时换入。\n\n-
    前缀缓存（Prefix Caching）：多个请求共享相同前缀的 KV 块，避免重复存储。\n\n- 动态调度与抢占：vLLM 的 swap 机制，将不活跃的
    KV 块换到 CPU，腾出 GPU 空间。\n\n- 内存池预分配与复用：提前分配大块，避免动态分配碎片，并做好生命周期管理。\n\n\U0001F517
    协同效果：算法优化降低了单位 token 的 KV 尺寸，系统优化则更高效地管理这些资源，并控制瞬时峰值。两者结合才能支撑 128K 乃至 1M token
    的推理。\n\n---"

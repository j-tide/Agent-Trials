content:
  prompt: "\U0001F3AC 视频大模型（如 Sora）推理时，显存瓶颈主要在时间维度还是空间维度？"
answer:
  mode: rubric
  reference_answer: "视频大模型推理时的显存瓶颈，短中期内时间维度是绝对主导，因为它带来了巨大的KV Cache和时序激活累积；但随着超长视频生成和处理的普及，空间维度（高分辨率）的瓶颈会逐渐变得同等关键。\n\n⏳
    时间维度的瓶颈（主导）\n\n- KV Cache的线性爆炸：视频模型需要处理成千上万的时空Patches（如Sora将视频切成时空方块）。假设一个10秒视频，生成几百甚至上千个时间步，每个时间步都需要存储全部历史帧的K和V。这相当于NLP中上下文长度变成了数千甚至数万token，KV
    Cache会占用数十到数百GB，远超任何单卡。\n\n- 时序注意力的O(T²)中间激活：全时序注意力虽然可能被优化，但在训练或某些推理阶段，需要计算的注意力矩阵尺寸为[heads,
    T, T]，T为时间序列长度。长视频下这会产生瞬时平方级的激活峰值。\n\n- 自回归生成的逐帧累积：与文本自回归类似，每一新帧都要读取整个历史的KV Cache，此访存带宽压力极大。\n\n\U0001F5BC️
    空间维度的瓶颈（次要但增长中）\n\n- 单帧高分辨率：每帧的空间Token数（如1024×1024下数千个Patch）会乘以时间步，导致总Token数剧增，放大KV
    Cache。\n\n- 空间注意力的计算：若模型采用时空分离注意力，空间注意力在每帧内部进行，其计算量随空间Token数平方增长。但通常空间尺寸可控（如压缩到256×256），其显存膨胀不如时间维度剧烈。\n\n\U0001F4CA
    综合来看：对于典型视频生成（如16秒1080P），时间步达到数百步，总Token数达数百万。仅KV Cache就可能消耗数十GB，而单帧激活相对不大。因此
    “时间深度”是视频模型显存的首要杀手，这也是为什么多数视频生成系统必须依赖多卡并行、分片存储KV Cache，或采用窗口时序注意力。\n\n✅ 因此，视频模型的显存瓶颈本质上是将上下文长度概念拓展到了时间轴上，时间维度造成的KV
    Cache爆炸是首要挑战，空间维度为辅。\n\n---"

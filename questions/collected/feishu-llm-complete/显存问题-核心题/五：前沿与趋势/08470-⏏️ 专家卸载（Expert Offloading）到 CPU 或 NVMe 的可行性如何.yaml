content:
  prompt: "⏏️ 专家卸载（Expert Offloading）到 CPU 或 NVMe 的可行性如何？"
answer:
  mode: rubric
  reference_answer: |-
    专家卸载是将不活跃或所有专家权重存放在 CPU 内存或 NVMe SSD 上，仅在需要时将对应专家的权重传输到 GPU 显存中。其可行性取决于模型规模、激活频率以及硬件带宽。

    - CPU 卸载：利用 CPU 内存（通常远大于 GPU 显存）存放专家权重。计算前通过 PCIe 将所需专家权重异步拷贝到 GPU。当专家数量多、单次激活的专家比例低时，卸载可以显著减少 GPU 显存占用。但每次前向都需要传输数据，PCIe 带宽（~50 GB/s）远低于 GPU 显存带宽（~2 TB/s），若每个 token 都激活不同的专家，频繁传输会严重拖慢推理速度。适用于 token 路由具有时间局部性（连续多个 token 使用相同专家）的场景。

    - NVMe 卸载（类似 ZeRO-Infinity）：进一步将专家权重放在 SSD 上，通过 GPU Direct Storage 加速传输。带宽更低（~7 GB/s），延迟更高，可行性较差，一般仅用于极大规模模型（如数百专家）的离线推理。

    ✅ 可行性总结：对于交互式推理，纯 CPU 卸载很难满足延迟要求，但可作为补充手段，将一部分冷门专家置于 CPU，热门专家常驻 GPU。结合智能预取和流水线，可以实现较好的效果。NVMe 卸载则仅适用于吞吐优先的离线场景。


content:
  prompt: "\U0001FA9F 窗口注意力（Sliding Window Attention）如何限制 KV Cache？会丢失什么信息？"
answer:
  mode: rubric
  reference_answer: "窗口注意力强制每个 token 只关注其前后固定窗口大小 W 内的 token，而不是整个序列。因此，在生成过程中，只需要保留最近
    W 个 token 的 KV Cache，旧的 KV 可以直接丢弃，从而将 KV Cache 的大小从 O(L) 硬限制为 O(W)（常数级）。\n\n\U0001F4D0
    显存节省：\n无论序列最终有多长，KV Cache 占用量恒定为 2 × 层数 × KV头数 × 头维度 × 精度字节 × W。\n例如，W=4096，则最大
    Cache 大小就固定为 4096 token 对应的容量，不会随着生成步骤增加。\n\n⚠️ 丢失的信息：\n\n模型将无法直接“看到”窗口以外的远距离
    token。对于需要全局理解的任务（如长文档摘要、跨章节推理）会受严重影响，因为模型无法建立远距离依赖。为了弥补，许多实现会结合以下机制：\n\n- 全局
    token：指定少数 token（如句首符、特殊记忆标记）可以参与全局注意力，保留它们的 KV 永久存在。\n\n- 分层注意力：不同层使用不同窗口大小，高层可以有更大感受野。\n\n-
    结合外部记忆模块：将旧上下文压缩成摘要向量输入。\n\n窗口注意力是追求极致效率与可控显存时的经典选择，适用于流式处理、实时对话等对长程依赖要求不高的场景。\n\n---"

content:
  prompt: "\U0001F50E 评估长上下文性能时，“大海捞针”测试是否会暴露显存问题？"
answer:
  mode: rubric
  reference_answer: "“大海捞针”（Needle In A Haystack）测试主要评估模型的检索能力——在长文档中定位随机插入的一个小事实。它本身不直接测量显存，但可以间接暴露显存限制导致的实现问题。\n\n-
    直接暴露：如果系统在处理超长文档时 OOM，或者因显存不足而截断文本、无法加载整个文档，则该测试根本无法完成，直接暴露显存配置不足。\n\n- 间接暴露：若系统为了装下长文档而使用了激进的
    KV 压缩或窗口注意力，可能导致模型在“大海捞针”中失败（找不到针），间接反映出显存优化策略牺牲了必要的长程依赖能力。\n\n- 测试框架：运行该测试时，需要监控
    GPU 显存使用率，若接近极限，说明显存成为瓶颈。\n\n\U0001F4CA 实际意义：如果将“大海捞针”作为长上下文系统的验收测试，那么能够通过该测试的系统，其显存管理必然是合格且配置合理的。因此，它可以作为显存优化效果的一个侧面验证。\n\n---"

content:
  prompt: "\U0001F4CA 推理 MoE 时，如果只有部分专家被激活，显存占用应如何估算？"
answer:
  mode: rubric
  reference_answer: "推理时显存主要由三部分构成：总专家权重（所有） + KV Cache + 临时激活。尽管每次只有部分专家被激活，但为了服务可能激活的任意专家，所有专家的权重都必须保持在
    GPU 显存中（除非采用专家卸载）。所以显存估算公式为：\n\n总显存 ≈ 总参数量 × 每参数字节 + KV Cache 大小 + Prefill/Decode
    临时激活\n\n具体地：\n\n- 权重：按总参数量计算。例如 Mixtral 8×7B 总共 46.7B，使用 4-bit 量化约 23.4 GB；FP16
    约 93.4 GB。\n\n- KV Cache：与输入/输出序列长度以及 KV 头数、层数有关。Mixtral 采用 GQA，KV 缓存相对较小。\n\n-
    临时激活：仅与激活专家相关，但 Prefill 阶段需要为整个 batch 的 token 计算所选专家，临时激活的大小取决于实际路由到的专家负载（token
    数）。但通常远小于权重。\n\n\U0001F50D 注意：即便部分专家从未被激活，只要它们存在于显存中，就占用空间。因此，推理 MoE 的显存瓶颈常在于总权重的存储，而非计算激活。\n\n---"

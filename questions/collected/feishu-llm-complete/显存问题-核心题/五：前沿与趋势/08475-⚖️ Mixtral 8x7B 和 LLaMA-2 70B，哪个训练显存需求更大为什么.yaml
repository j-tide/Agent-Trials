content:
  prompt: "⚖️ Mixtral 8x7B 和 LLaMA-2 70B，哪个训练显存需求更大？为什么？"
answer:
  mode: rubric
  reference_answer: "Mixtral 8×7B 的训练显存需求通常小于 LLaMA-2 70B，尽管前者的总参数量（46.7B）小于后者（70B），但主要是因为
    MoE 的稀疏激活带来优化器状态和激活值的优势，并且在相同的总参数下，MoE 模型在计算和部分存储上更高效。然而，若考虑单卡不并行，纯权重存储上 70B 需要
    140 GB（FP16），46.7B 需要 93.4 GB，似乎 70B 更大。但训练显存包含优化器状态等，整体对比：\n\n- LLaMA-2 70B (FP16)：权重
    140 GB，梯度 140 GB，优化器状态 560 GB，激活约数十 GB。总计需 TB 级显存，远超单卡，必须多卡并行。\n\n- Mixtral 8×7B
    (FP16)：总权重 93.4 GB，梯度同样 93.4 GB，优化器状态 373.6 GB，激活由于稀疏，比等价稠密模型小。总计约 560 GB+，仍然巨大，但比
    70B 的 840 GB+ 要少约 30%。\n\n更关键的是，Mixtral 每个 token 的计算量仅约 12.9B 稠密模型，因此训练速度更快，但显存方面由于总参数量仍有
    46.7B，其优化器状态与 46.7B 稠密模型相当，略低于 70B。所以，在同等并行配置下，Mixtral 8×7B 的显存需求略低于 LLaMA-2 70B。\n\n\U0001F4CA
    具体而言：使用 8 路 Tensor Parallelism + ZeRO-3，70B 单卡仍会触及 80GB 上限，而 Mixtral 46.7B 则可能更宽裕。因此，Mixtral
    的训练显存门槛相对较低。\n\n---"

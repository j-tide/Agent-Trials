content:
  prompt: "⚖️ 训练 MoE 时，负载均衡损失对显存有没有间接影响？"
answer:
  mode: rubric
  reference_answer: "有显著的间接影响。 负载均衡损失的主要目的是促使路由器将 token 均匀分配到各个专家，这直接平抑了各专家之间的 token
    分布差异。\n\n- 避免专家过载：当负载均衡时，每个专家处理的 token 数大致相等，没有某个专家因 token 堆积而产生巨大的激活和通信缓冲，从而避免了单卡显存过载的问题。\n\n-
    降低容量溢出概率：均匀分布意味着可以使用较小的容量因子而不会频繁溢出，既保证了训练稳定性，又控制了显存峰值。\n\n- 稳定通信缓冲区：All-to-All
    通信量在各 GPU 间均衡，通信缓冲区大小相近，没有个别 GPU 缓冲区膨胀，提升了显存利用的可预测性。\n\n\U0001F4CA 若不使用负载均衡损失，训练初期路由可能坍塌，所有
    token 都去了少数专家，导致其所在 GPU 显存瞬间飙升，直接 OOM。因此，负载均衡损失虽然只改 loss 项，却是训练 MoE 时间接保护显存的关键组件。\n\n---"

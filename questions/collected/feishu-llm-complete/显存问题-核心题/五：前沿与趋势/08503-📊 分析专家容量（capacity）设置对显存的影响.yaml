content:
  prompt: "\U0001F4CA 分析专家容量（capacity）设置对显存的影响。"
answer:
  mode: rubric
  reference_answer: "专家容量（Expert Capacity） 是每个专家可处理的最大 token 数量限制。当 token 分配超过容量时，超出的
    token 会被“溢出”处理（丢弃或走残差连接）。容量设置直接影响中间激活的显存峰值和通信缓冲区大小。\n\n- 容量越大：允许每个专家容纳更多 token，路由更自由，但这也意味着该专家对应的激活张量（[num_tokens,
    hidden]）可能非常大。在专家并行下，这会导致对应 GPU 上的临时激活和通信接收缓冲区增大，显存峰值升高，甚至有 OOM 风险。\n\n- 容量越小：强制丢弃
    token，限制激活大小，显存峰值可控且较低。但过多 token 溢出会损害模型精度，因为它们的专家处理被跳过，相当于信息丢失。\n\n- 与负载均衡的关系：如果负载均衡做得不好，某些专家容易超容，容量设小了会大量丢
    token；设大了又可能造成部分 GPU 显存过载。因此容量设置需与负载均衡损失配合，让实际 token 分布尽量不超过容量上限。\n\n\U0001F527
    经验：训练时，容量通常设为 (tokens_per_batch / num_experts) * capacity_factor，capacity_factor
    常取 1.25 左右，既控制显存峰值，又保证极少数 token 溢出。\n\n✅ 因此，容量是 MoE 训练/推理中调节显存峰值的重要阀门，需要根据实际负载分布精细调整。\n\n---"

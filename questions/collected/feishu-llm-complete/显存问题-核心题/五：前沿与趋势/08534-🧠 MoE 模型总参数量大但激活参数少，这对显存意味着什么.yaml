content:
  prompt: "\U0001F9E0 MoE 模型总参数量大但激活参数少，这对显存意味着什么？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 MoE（混合专家）模型拥有庞大的总参数量（例如 Mixtral 8×7B 总参数 46.7B），但每次推理仅激活一小部分专家（如
    top-2），因此计算量仅与激活参数（约 12.9B）相当。然而，显存方面却面临独特的压力：所有专家的权重在推理时都需要驻留在显存中，因为不同 token
    可能激活不同的专家，无法提前预测。这就导致显存占用依然由总参数量主导，而非激活参数量。\n\n- 权重的显存需求：FP16 下，46.7B 参数需占用约 93.4
    GB，远超单卡 80GB 的容量。即便通过 4-bit 量化，仍需约 23.4 GB，加上 KV Cache 和临时激活，仍可能超过单卡显存。\n\n- 激活的显存节省：由于每次只计算部分专家，前向和反向的中间激活（如专家
    FFN 的输入输出）与激活参数量成正比，而不是总参数量。这在一定程度上缓解了训练时的激活峰值。\n\n- 优化器状态：训练时，优化器（如 Adam）需要为每个参数存储动量和方差，因此优化器状态显存也随总参数量线性增长，成为训练显存的巨大开销。\n\n\U0001F4CA
    因此，MoE 模型在推理时是“总参数决定存储容量需求，激活参数决定计算和部分激活暂存需求”。这造成了“存储墙”问题：显存必须能容纳所有专家权重，而算力仅需处理少量专家。\n\n---"

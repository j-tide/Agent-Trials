content:
  prompt: "\U0001F4F1 如果让你将 MoE 模型部署到端侧，显存瓶颈主要是什么？"
answer:
  mode: rubric
  reference_answer: "首要瓶颈绝对是一张卡放不下所有专家权重。 即使疯狂量化，像 Mixtral 8×7B 用 4-bit 后仍需约 23 GB，而手机可用内存通常只有
    4-8 GB（系统+后台已占一部分）。因此，无法全量加载。\n\n其他瓶颈：\n\n- 存储与加载：从闪存读取 23 GB 的模型就要几十秒，启动时间无法接受。\n\n-
    动态加载的延迟：若只加载当前所需专家，需要从 UFS 实时传输，UFS 读取速度约 2 GB/s，每次切换专家要几百毫秒，无法满足实时生成。\n\n- 功耗与散热：庞大的权重传输和计算会急剧增加耗电和发热，手机瞬间变暖手宝。\n\n-
    KV Cache 与并发：虽然 MoE 的 KV Cache 与稠密相似，但端侧通常单用户，不是主要矛盾。\n\n\U0001F527 可能的应对：\n\n-
    仅部署极小的 MoE 模型（如总参数 1-2B，量化后几百 MB）。\n\n- 使用多模型协作，一个常驻小模型，MoE 仅用于特定任务。\n\n- 利用端侧
    NPU 的高效内存（但容量小），需专家切分。\n\n✅ 因此，端侧部署 MoE 的显存瓶颈是总权重过大，必须通过极限压缩、离线蒸馏或远端调用解决。\n\n---"

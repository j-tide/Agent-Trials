content:
  prompt: "\U0001F40D 使用状态空间模型（Mamba）代替 Transformer，长上下文显存优势在哪？"
answer:
  mode: rubric
  reference_answer: "Mamba（基于状态空间模型 SSM）不依赖于注意力机制，因此没有传统的 KV Cache。其显存优势在于：推理时只需要维护一个固定大小的隐藏状态，与序列长度无关。
    这使得处理超长序列时，显存占用是常数级 O(1) 而非 O(L)。\n\n\U0001F50D 具体对比：\n\n- Transformer 推理：每层需要存储
    L 个 token 的 K 和 V，显存随 L 线性增长，成为长上下文的瓶颈。\n\n- Mamba 推理：每层维护一个固定大小的隐藏状态向量（例如维度 d_state），在每一步迭代更新。无论序列多长，这个状态的大小恒定。因此，总显存
    = 模型权重 + 常数级状态，与序列长度无关。理论上可以处理无限长度序列，只要计算时间允许。\n\n\U0001F4CA 实例：Mamba-2.8B 模型，隐藏状态大小约为
    hidden_size * d_state * 2（双向），约数十 MB。处理 1M token 时，显存消耗与 1K token 时完全相同，没有 KV
    Cache 膨胀的问题。\n\n⚠️ 局限：Mamba 的隐藏状态压缩了历史信息，可能会丢失远距离依赖中的精确细节，但在许多长文本任务上性能已逼近甚至超越
    Transformer。同时，其没有注意力机制，故无法像 Transformer 那样通过显式的注意力分数进行可解释性分析。\n\n✅ 因此，对于纯粹的长序列建模，SSM
    类模型提供了一条从根本上规避 KV Cache 问题的新路径。\n\n---"

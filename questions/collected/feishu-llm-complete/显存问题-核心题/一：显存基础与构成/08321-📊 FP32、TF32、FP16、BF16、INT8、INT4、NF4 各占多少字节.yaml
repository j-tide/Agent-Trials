content:
  prompt: "\U0001F4CA FP32、TF32、FP16、BF16、INT8、INT4、NF4 各占多少字节？"
answer:
  mode: rubric
  reference_answer: |-
    不同的数值精度在内存中占据的字节数直接决定了模型权重和激活值的显存占用。以下是常见的几种精度格式及其字节数：

    - FP32 (单精度浮点)：4 字节。这是深度学习训练的传统精度，提供极高的数值范围和精度，但显存和带宽开销巨大。

    - TF32 (TensorFloat-32)：4 字节。NVIDIA Ampere 架构引入的特殊格式，在 Tensor Core 内部使用。它的存储格式与 FP32 完全相同（占 4 字节），但计算时采用与 FP16 相同的指数位和 BF16 相同的尾数位，是速度和精度的折中。

    - FP16 (半精度浮点)：2 字节。广泛应用于混合精度训练和推理。它拥有较高的计算吞吐，但数值范围较小（最大 65504），容易出现溢出或下溢，需要配合损失缩放（Loss Scaling）使用。

    - BF16 (脑浮点16)：2 字节。与 FP16 占用相同的 2 字节，但指数位更多（8 位，与 FP32 相同），动态范围极大，几乎不需要损失缩放，训练更稳定，已成为大模型训练的主流。

    - INT8 (8位整数)：1 字节。广泛用于推理加速和部分训练组件（如 8-bit Adam 优化器）。占用显存是 FP16 的一半，但需要量化校准来保持精度。

    - INT4 (4位整数)：0.5 字节。极致压缩的代表，用于权重量化推理（如 GPTQ、AWQ），可将模型体积压缩至原来的 1/4，但对量化算法要求很高。

    - NF4 (4位 NormalFloat)：0.5 字节。QLoRA 引入的非均匀量化格式。基于正态分布的分位数设计，专门针对零中心正态分布的神经网络权重优化，信息保真度优于均匀 INT4。

  prompt: "\U0001F4CA MHA、MQA、GQA 的 KV Cache 大小对比？"
answer:
  mode: rubric
  reference_answer: |-
    下表清晰地展示了三种注意力机制在KV Cache大小上的差异（假设总头数H=32）：

    [嵌入表格未展开]

    - MHA：像每个专家（Q头）都有自己的专属资料库（K、V头），资料库太多，占地方。

    - MQA：所有专家共用一个资料库，最省地方，但专家们容易打架。

    - GQA：把专家分成几个小组，每组共享一个资料库，兼顾了表达力和存储成本。


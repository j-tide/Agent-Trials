content:
  prompt: "\U0001F4C9 量化到 4-bit 后，推理精度通常如何？用哪些指标评估？"
answer:
  mode: rubric
  reference_answer: "将模型权重量化到 4-bit（INT4或NF4）后，推理精度通常会轻微下降，但现代量化算法（如 GPTQ、AWQ、QLoRA
    的 NF4）已能将这种损失控制在极小的范围内。对于大多数任务，困惑度（PPL）的上升幅度通常在 0.5-2.0 个点之间，下游任务的准确率下降也通常在 1%
    以内。但在某些需要高精度推理的任务（如复杂数学、代码生成）上，4-bit量化的影响可能更明显。\n\n评估 4-bit 量化模型的推理精度，通常需要从多个维度进行综合判断，单一指标往往具有欺骗性。\n\n\U0001F4CA
    核心评估指标：\n\n- 困惑度（Perplexity, PPL）：这是最基础、最常用的指标，衡量模型对语言建模的确定度。PPL越低越好。在通用文本数据集（如
    WikiText-2、C4）上评估，观察量化后PPL的相对增加率。如果PPL从8.5上升到8.7，说明量化造成的语言建模能力损失极小。但如果从8.5上升到12.0，就说明量化出现了严重问题。PPL的优势在于计算简单、快速，适合作为第一道筛子。缺点是它并不直接反映模型在真实任务上的表现，有时PPL几乎没有变化，但模型在特定任务上的表现已经大打折扣。\n\n-
    下游任务性能基准：这是最接近实际应用的评估方式。根据模型的最终用途选择相应的基准测试：\n\n- 长文本与多轮对话能力：量化可能微妙地\"抹掉\"模型对长上下文信息的记忆。需要在
    LongBench、L-Eval 等长文本基准上测试，或者自定义多轮对话场景，检查模型是否出现上下文遗忘。\n\n- 生成文本的多样性与连贯性：量化可能使模型的输出分布变得更\"尖锐\"（低熵），导致生成文本重复、模板化、丧失创造力。这需要通过人工评估或自动指标（如
    distinct n-grams、Repetition Ratio）来衡量。\n\n- 安全对齐与事实性：权重的微小变化可能影响模型的安全对齐效果，使其更容易被越狱或产生有害内容。需要用红队提示集（如
    HarmBench）和事实性基准（如 TruthfulQA）进行专项测试。\n\n\U0001F3D7️ 综合评估流程：\n\n- 先跑 PPL，如果上升超过
    5%，直接排查量化配置。\n\n- 如果 PPL 正常，跑核心下游基准（如 MMLU、HumanEval）。\n\n- 对于生成任务，进行人工评估或 GPT-4
    评判，重点检查流畅性、多样性和事实准确性。\n\n- 如果业务场景涉及长文本或安全敏感，进行专项补充测试。\n\n---"

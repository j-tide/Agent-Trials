content:
  prompt: "\U0001F501 为什么在多轮对话中，KV Cache 不断累积会导致 OOM？"
answer:
  mode: rubric
  reference_answer: |-
    在多轮对话中，每一轮的 Prompt 实际上是由所有历史对话拼接而成的。模型为了保持上下文连贯性，需要保留所有历史轮次的 KV Cache。随着对话轮次增多，缓存的 token 数线性增长，KV Cache 的体积也会线性膨胀。当历史积累的 KV Cache 加上当前轮次的模型权重和临时激活值超过了 GPU 物理显存上限时，就会发生 OOM。

    示例：假设一轮对话平均产生 200 tokens，经过 50 轮对话，KV Cache 就累积了 10,000 tokens 的历史。如果模型是 7B MHA，KV Cache 可能已经膨胀到数 GB，最终导致新轮次的请求因显存不足而失败。


content:
  prompt: "\U0001F4A1 双重量化（Double Quantization）进一步节省了什么？"
answer:
  mode: rubric
  reference_answer: |-
    双重量化是对量化过程本身产生的“额外开销”进行二次压缩的技术。

    当我们对模型权重进行分组量化（如 QLoRA 中每 64 个权重共享一个 32 位浮点缩放因子 scale）时，这些量化常数本身会占据可观的显存。对于一个 65B 模型，这部分开销可能高达数 GB。

    双重量化就是对这些量化常数再进行一次更低精度的量化（例如，将它们从 FP32 压缩到 INT8）。这样一来，量化常数占用的显存就从数 GB 压缩到了数百 MB，几乎可以忽略不计。这一步进一步“榨干”了显存节约的空间，为模型参数、梯度和优化器状态腾出了宝贵空间。

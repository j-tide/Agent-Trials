  prompt: "⚡ Prefill 阶段和 Decode 阶段的显存特点有何不同？"
answer:
  mode: rubric
  reference_answer: |-
    Prefill 阶段（预填充）

    - 发生了什么：一次性并行处理整个prompt序列，计算所有token的注意力，并生成第一批Key和Value缓存。

    [图片内容未导入]

    - 显存特点：会产生一个巨大的、与序列长度平方成正比的注意力得分矩阵（如果未使用FlashAttention），形成瞬时的显存高峰。KV Cache在此阶段被创建并写入。

    Decode 阶段（解码生成）

    - 发生了什么：进入“一个字一个字”的生成循环。每次只处理一个新token，计算它的Query，然后从显存读取所有历史Key和Value完成注意力计算。

    - 计算特点：显存带宽密集型。每次计算量极小，但需要从显存读取整个模型权重和全部KV Cache。计算单元大部分时间在等待数据，GPU利用率低。

    - 显存特点：临时激活值占用很小且稳定，但KV Cache在持续、线性地增长，成为显存占用的主体。


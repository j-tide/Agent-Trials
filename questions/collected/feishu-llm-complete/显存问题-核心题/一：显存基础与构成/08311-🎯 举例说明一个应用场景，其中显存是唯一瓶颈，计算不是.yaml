content:
  prompt: "\U0001F3AF 举例说明一个应用场景，其中显存是唯一瓶颈，计算不是。"
answer:
  mode: rubric
  reference_answer: "一个典型的场景是面向大规模用户的在线对话服务，需要支持超长上下文（例如 128K tokens）。\n\n假设你部署了一个
    7B 参数的模型，硬件是 A100 80GB。在推理阶段，计算对 A100 来说并不构成瓶颈——A100 的算力高达 312 TFLOPS，而在 Decode
    阶段每生成一个 token 所需的计算量极小（约 14 GFLOPs），GPU 核心大部分时间都在等待数据。\n\n然而，显存却捉襟见肘。原因在于 KV Cache。对于单次请求，当上下文长度达到
    128K tokens 时，KV Cache 的体积将急剧膨胀。以 LLaMA-7B（MHA 32头）为例：\n\n[图片内容未导入]\n\n此时，你的服务
    QPS 近乎为零——无法处理并发请求。即使你的 GPU 算力强大到可以瞬间完成每次 token 的计算，但因为没有足够的显存来容纳多个请求的 KV Cache，你无法增加
    batch size，无法服务更多用户。算力在这里完全被显存容量所钳制。\n\n这个场景中，想提升并发、提升吞吐，唯一的方法不是提升 GPU 的算力（换 H100
    的 989 TFLOPS 也无济于事），而是降低 KV Cache 的显存占用。采用 GQA（分组查询注意力） 可将 KV Cache 压缩至原来的 1/8，采用
    KV Cache INT8 量化可进一步压缩一半，从而在相同的显存中容纳更多的并发请求。这就是典型的“显存是唯一瓶颈，计算不是”的应用场景。\n\n\U0001F4A1
    结论：在长上下文和高并发推理中，显存容量和带宽往往比算力更先触及天花板，成为系统吞吐量的决定性因素。\n\n---"

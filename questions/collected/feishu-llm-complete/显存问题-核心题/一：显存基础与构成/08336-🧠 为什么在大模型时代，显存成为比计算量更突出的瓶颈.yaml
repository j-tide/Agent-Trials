content:
  prompt: "\U0001F9E0 为什么在大模型时代，显存成为比计算量更突出的瓶颈？"
answer:
  mode: rubric
  reference_answer: "在大模型时代，显存逐渐取代纯粹的计算量，成为制约模型训练和推理的首要瓶颈。这一现象的背后是硬件发展的不均衡和模型规模的指数级膨胀。\n\n\U0001F50D
    硬件演进的不对称性\n\n过去十年，GPU 的计算能力（FLOPS）遵循着摩尔定律乃至超越摩尔定律的速度增长，例如 NVIDIA A100 (312 TFLOPS
    FP16) 到 H100 (989 TFLOPS FP16) 的算力提升了约 3 倍。然而，显存容量和显存带宽的增长却缓慢得多。A100 提供 40GB/80GB
    显存，H100 同样是 80GB，容量几乎未变；带宽从 A100 的 2 TB/s 提升至 H100 的 3.35 TB/s，增幅远不及算力。\n\n\U0001F4C9
    模型规模远超显存增长\n\n从 GPT-2 (1.5B) 到 GPT-3 (175B)，参数量翻了 100 多倍，而同期 GPU 显存容量仅增长了约 3–4
    倍。一个 175B 模型，仅 FP16 权重就需要 350GB，远超单卡 80GB 的物理极限。即便使用最先进的 8 卡节点，也需要复杂的模型并行策略（TP、PP）才能容纳，这直接导致了显存成为硬约束。\n\n\U0001F504
    训练过程中的显存消耗远大于计算\n\n在混合精度训练中，以 Adam 优化器为例，一个 FP16 的 7B 模型，参数占 14GB，梯度占 14GB，而 FP32
    优化器状态（动量和方差）占 56GB——优化器状态吃掉了绝大部分显存。再加上激活值（尤其在长序列训练时）和临时缓冲区，总显存需求是纯权重的 5-8 倍。相比之下，算力只是决定训练快慢，显存则决定了模型能否跑起来。\n\n⏳
    推理时显存瓶颈的转移\n\n在推理阶段，权重依然是固定开销，但KV Cache（键值缓存） 成为新的显存杀手。随着上下文长度从 4K 扩展到 128K，KV
    Cache 的体积平方级增长。对于 7B 模型，处理 128K 上下文的单次请求可能占用 16GB 以上的显存，远超权重本身。而推理的 Decode 阶段是显存带宽受限的，算力大量闲置，进一步凸显了显存和带宽的瓶颈地位。\n\n\U0001F4A1
    结论：算力决定模型训练的速度，而显存决定模型能否被训练或部署。在模型规模和上下文长度持续膨胀的今天，显存已经成为木桶最短的那块板。\n\n---"

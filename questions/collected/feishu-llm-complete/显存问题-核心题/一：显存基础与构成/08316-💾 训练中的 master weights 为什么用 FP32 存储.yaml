content:
  prompt: "\U0001F4BE 训练中的 master weights 为什么用 FP32 存储？"
answer:
  mode: rubric
  reference_answer: |-
    master weights（主权重副本）是混合精度训练中维护的一份 FP32 精度的模型参数。它的存在是为了解决 FP16 精度不足导致的参数更新丢失问题。

    [图片内容未导入]

    - 从 FP32 主副本出发，生成 FP16 权重副本。

    - 用 FP16 权重进行前向和反向计算，得到 FP16 梯度。

    - 将 FP16 梯度转换为 FP32，更新 FP32 主权重副本。

    - 下一轮迭代，再从更新后的 FP32 主副本生成新的 FP16 权重。

    与显存的关系：master weights 是混合精度训练中不可避免的显存开销。它使得模型权重的显存占用实际上并未减少——FP16 权重和 FP32 主副本同时存在。所以，混合精度训练主要节省的是激活值和梯度的显存，而不是模型权重的存储空间。


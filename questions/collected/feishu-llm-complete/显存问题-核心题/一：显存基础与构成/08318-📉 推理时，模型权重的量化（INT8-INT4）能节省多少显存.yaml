content:
  prompt: "\U0001F4C9 推理时，模型权重的量化（INT8/INT4）能节省多少显存？"
answer:
  mode: rubric
  reference_answer: |-
    权重量化直接减少了模型参数的存储量，但对总显存的降幅取决于权重在总显存中的占比。

    - FP16（基准）：每个参数2字节。7B模型权重约14 GB。

    - INT8：每个参数1字节。权重显存降为原来的 1/2，7B模型约7 GB。

    - INT4：每个参数0.5字节，加上少量量化常数（scale, zero-point），7B模型实际约3.7~4.5 GB。权重显存降为原来的 1/4 左右。

    总显存降幅分析：

    - 短文本、小batch场景：权重占绝对主导。INT4量化后，总显存可能从18 GB降至7.5 GB，降幅约58%。

    - 长文本、大batch场景：KV Cache成为显存主体。例如13B模型处理长文本时，INT4量化可能只让总显存从70 GB降至50.5 GB，降幅仅约28%。


content:
  prompt: "\U0001F50D 在 PyTorch 中，如何查看当前 tensor 的显存占用？"
answer:
  mode: rubric
  reference_answer: "PyTorch 提供了多种查看张量显存占用的方法：\n\n- 精确计算单个张量的字节数\n\nimport torch\n\n#
    创建一个 FP16 张量\nx = torch.randn(1000, 1000, dtype=torch.float16, device='cuda')\n\n#
    方法1：通过 numel() 和 element_size() 计算\nbytes_1 = x.numel() * x.element_size()\nprint(f\"显存占用:
    {bytes_1} 字节 = {bytes_1/1024**2:.2f} MB\")\n\n# 方法2：使用 untyped_storage().nbytes()\nbytes_2
    = x.untyped_storage().nbytes()\nprint(f\"显存占用: {bytes_2} 字节 = {bytes_2/1024**2:.2f}
    MB\")\n\n- numel() 返回张量中元素的总数。\n\n- element_size() 返回每个元素的字节数（FP32=4，FP16/BF16=2，INT8=1）。\n\n-
    untyped_storage().nbytes() 直接返回底层存储分配的总字节数，对于视图张量（view）来说，它会返回原张量的存储大小，可能大于实际\"可见\"的元素总和。\n\n-
    监控整个 GPU 的显存使用情况\n\n# 当前已分配的显存\nallocated = torch.cuda.memory_allocated()\nprint(f\"PyTorch
    已分配: {allocated / 1024**3:.2f} GB\")\n\n# GPU 缓存（包含已释放但未归还给驱动的内存）\ncached = torch.cuda.memory_reserved()\nprint(f\"PyTorch
    缓存: {cached / 1024**3:.2f} GB\")\n\n# 查看峰值显存\nmax_allocated = torch.cuda.max_memory_allocated()\nprint(f\"历史峰值:
    {max_allocated / 1024**3:.2f} GB\")\n\n# 重置峰值统计\ntorch.cuda.reset_peak_memory_stats()\n\n-
    使用 nvidia-smi 查看全局显存\n在终端中运行 nvidia-smi，可以看到当前所有 GPU 进程的显存占用。PyTorch 的缓存机制可能导致
    nvidia-smi 显示的占用比 memory_allocated() 高，这是正常现象。\n\n\U0001F4CC 关键区别：\n\n- memory_allocated()：PyTorch
    实际正在使用的显存（张量数据）。\n\n- memory_reserved()：PyTorch 从 CUDA 驱动申请到的显存总量，包括已释放但被分配器缓存的空闲块。\n\n-
    nvidia-smi：整个 GPU 上所有进程的显存使用总和。\n\n---"

  reference_answer: |-
    - AdamW：权重衰减与梯度更新解耦，但 m,v 不变，状态量完全相同。

    - 8-bit Adam (如 bitsandbytes)：将 m 和 v 量化为 8 位，每参数平均 1 字节，再配合量化 block 的常数存储，平均每参数约 2 字节，显存降低至 1/4。


content:
  prompt: "\U0001F9EC QLoRA 中的 NF4 量化有什么特点？为什么用 NF4 而不是 INT4？"
answer:
  mode: rubric
  reference_answer: |-
    NF4（4-bit NormalFloat） 是 QLoRA 中专门为神经网络权重设计的一种非均匀量化数据类型。它的核心特点是：量化台阶是根据正态分布的累积分布函数来设定的，而非均匀分布。

    为什么用 NF4 而不是 INT4？

    - 标准 INT4 是均匀量化：它将取值范围均等分割成 16 个区间。对于近似服从零均值正态分布的预训练模型权重来说，这种均匀分配非常浪费——绝大多数量化等级被浪费在了权重极少出现的尾部，而在权重集中的零附近，表示精度却严重不足。

    - NF4 是非均匀量化：它“因地制宜”地在权重密集的零附近分配了更多的量化台阶（更精细的刻度），而在稀疏的尾部分配了更少的台阶（更粗的刻度）。这种设计从信息论上最大化了量化后权重的信息保留，因此在 4-bit 极低位宽下，精度损失远小于均匀 INT4，从而为 QLoRA 的微调提供了一个高质量的基座。

    总结：NF4 利用了权重分布的先验知识（正态分布假设），实现了信息论上最优的 4-bit 量化。而 INT4 忽略了这一先验，导致对权重核心区域的表示能力浪费。

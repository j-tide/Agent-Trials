content:
  prompt: "\U0001F9E9 如果推理时用了 GQA，KV Cache 会减少多少？"
answer:
  mode: rubric
  reference_answer: |-
    GQA（分组查询注意力）的核心思想是让多个Query头共享一组Key和Value头，从而从源头上减少需要缓存的K/V头数。

    - MHA：有H个独立的K/V头。

    - GQA：将H个Q头分成G组，每组共享一个K/V头，因此只需要存储G个K/V头。

    [图片内容未导入]

    实例：LLaMA-7B 的 H=32，若使用 G=4 的 GQA，则 KV Cache 缩减为原来的 4/32=1/8。若原来在2048长度下KV Cache为1 GB，GQA后仅需约0.125 GB。


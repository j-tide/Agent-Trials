content:
  prompt: "\U0001F680 什么是“前缀缓存”（Prefix Caching）？如何节省显存？"
answer:
  mode: rubric
  reference_answer: |-
    前缀缓存是一种智能的 KV Cache 复用技术。在许多应用场景中（如多轮对话、批量评估），大量请求的 Prompt 开头部分是完全相同的（例如通用的 System Prompt）。前缀缓存检测到这种相同的前缀后，会对该前缀的 KV Cache 只计算并存储一次。后续所有具有相同前缀的请求，其页表可以直接映射到这些已缓存的物理页上，无需重新计算或重复存储。

    显存节省效果：假设一个 System Prompt 有 1000 tokens，有 100 个并发请求。如果不使用前缀缓存，需要存储 100 份该前缀的 KV Cache，占用大量显存。使用前缀缓存后，这 100 个请求共享同一份物理缓存，显存占用降为原来的 1/100。同时，由于 Prefill 阶段也无需对这 1000 tokens 重复计算，TTFT（首Token延迟）也会大幅降低。


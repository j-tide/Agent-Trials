content:
  prompt: "\U0001F4F1 端侧设备（手机）推理时，显存限制一般在什么量级？"
answer:
  mode: rubric
  reference_answer: |-
    当前主流旗舰手机（如搭载骁龙 8 Gen 3 或 A17 Pro 的设备）通常配备 12-16 GB 的统一内存（CPU 和 GPU 共享）。这意味着操作系统、其他应用和模型需要共同瓜分这有限的资源。

    实际可供模型使用的内存通常只有 4-8 GB。因此，要在手机上运行大模型，必须依赖：

    - 极限权重量化：使用 INT4 甚至 INT3/INT2 量化，将 7B 模型的权重压缩到 2-4 GB。

    - 小模型：直接部署 1.5B-3B 的轻量模型。

    - KV Cache 压缩：限制最大生成长度，使用 GQA 和 KV Cache INT8 量化。

    - 内存映射与卸载：利用 mmap 等技术支持从闪存动态加载模型层，减少内存峰值。


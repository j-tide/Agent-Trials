answer:
  mode: rubric
  reference_answer: |-
    MLA（Multi-head Latent Attention）是DeepSeek-V2等模型中使用的一种极致KV Cache压缩技术，其核心思想是低秩压缩。

    原理：

    [图片内容未导入]

    对比GQA：

    - GQA是从“宽度”上缩减，通过共享K/V头来降低头数。

    - MLA是从“高度”上压缩，直接降低每个token的K/V表征维度，压缩更为彻底。

    代价：

    - 潜向量维度 dl 过小会丢失信息，影响模型精度。

    - 需要额外的矩阵乘法来恢复K和V，但计算量增加不大。


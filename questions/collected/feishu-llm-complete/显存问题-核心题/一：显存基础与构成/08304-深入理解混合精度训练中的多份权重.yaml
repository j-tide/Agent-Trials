answer:
  mode: rubric
  reference_answer: |-
    标准 FP16 混合精度训练 的显存中实际存在：

    - FP16 权重 (2Φ)：用于前向计算，减少访存和显存占用；

    - FP32 主权重 (4Φ)：优化器用 FP32 状态更新参数时，需要 FP32 精度累加避免舍入误差。每个 step 将 FP16 权重同步为主权重的截断版。

    若启用 BF16，则 BF16 权重直接用作计算，但仍需 FP32 主权重用于更新，因为 BF16 的 7 位尾数不足以保证微小的权重更新累积。

    ---

    ### 三、为什么训练时的梯度大小与模型权重完全相等？


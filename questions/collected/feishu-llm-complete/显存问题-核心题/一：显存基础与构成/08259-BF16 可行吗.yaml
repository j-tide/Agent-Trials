content:
  prompt: BF16 可行吗？
answer:
  mode: rubric
  reference_answer: |-
    BF16 动态范围与 FP32 相同（8位指数），不会下溢。但其 7 位尾数导致累加精度不足。实验表明直接用 BF16 存 m,v 会使收敛不稳定，因此依然推荐 FP32 状态。

    面试金句：“Adam 状态是随机优化过程的长期记忆，需要高精度存储以防止缓慢累积中的信息丢失；而前向激活可以接受低精度，因为它在每一步都是重新计算的。”


answer:
  mode: rubric
  reference_answer: |-
    分布式通信库（NCCL）执行 AllReduce 或 AllGather 时，需要将数据打包成连续块。

    - Flatten Buffer：早先框架会将所有梯度摊平进一个大 buffer 进行 AllReduce，此 buffer 大小等于梯度总大小（≈2Φ）。对 100B 模型，就是 200GB，这太恐怖。

    - Bucket 策略 (PyTorch DDP)：将参数/梯度分桶，每次通信一个桶（典型 25~128MB）。只需要每个桶大小的缓冲。显存峰值可控。

    - ZeRO 的通信：在 ZeRO-3 中，做 allgather 收集参数分片时，需要为每层分配临时 buffer 容纳全量参数。通常通过流水线预取隐藏，峰值一般为单层参数大小 + 某个 bucket。

    - 序列并行 / 张量并行：层间需要插入 allreduce，需为每个并行通信分配临时 buffer，通常不大。

    潜在风险：当使用超大 batch 且梯度累积步数较多时，梯度的 allreduce 可能设计为一次性通信（未分桶）导致超大 buffer 分配，或者某些自定义融合算子临时缓冲区设计不当。务必用 torch.cuda.memory_summary() 和 nsys 分析。


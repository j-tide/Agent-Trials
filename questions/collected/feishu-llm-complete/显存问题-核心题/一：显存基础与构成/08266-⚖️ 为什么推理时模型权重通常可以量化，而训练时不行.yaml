content:
  prompt: "⚖️ 为什么推理时模型权重通常可以量化，而训练时不行？"
answer:
  mode: rubric
  reference_answer: |-
    推理时权重量化可行：因为推理是一个纯前向传播过程。量化引入的微小精度损失，在累加后通常不会对最终输出质量产生灾难性影响。而且，权重量化带来的显存节省和带宽提升（尤其是对 Decode 阶段这种带宽瓶颈任务）收益巨大。即使有轻微精度下降，往往也在可接受范围内。

    训练时权重量化困难：因为训练涉及反向传播和参数更新。量化后的离散权重值无法直接接收连续的梯度更新，因为梯度是微小浮点数，会被量化误差淹没，导致优化器无法有效工作。如果强行在训练中使用低位量化，模型很难收敛，或者需要非常复杂的量化感知训练（QAT）技巧来模拟误差，成本极高。因此，训练时通常只在优化器状态上用低位精度（如 8-bit Adam），而模型权重本身仍保持高精度（FP16/BF16），以便进行平滑的参数更新。


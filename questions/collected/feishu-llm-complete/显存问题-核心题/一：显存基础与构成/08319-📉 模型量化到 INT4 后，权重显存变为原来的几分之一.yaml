content:
  prompt: "\U0001F4C9 模型量化到 INT4 后，权重显存变为原来的几分之一？"
answer:
  mode: rubric
  reference_answer: |-
    理论上是 1/4。因为每个 FP16 参数占 2 字节，而 INT4 参数占 0.5 字节。

    但在实际工程中，由于需要存储量化常数（如 scale 和 zero-point），最终权重部分的总体积大约是原来的 25%–30%。例如，一个 7B 的 FP16 模型权重约 14GB，量化为 INT4 后，实际权重文件大小约为 3.5–4.5 GB。

  reference_answer: |-
    FlashAttention 将 QKT 分块计算，不将完整的 T×T 矩阵驻留在显存中，仅保留 softmax 的归一化统计量。这使最大激活变为 FFN 中间层和注意力输出，激活峰值降低一个数量级。

    ---

    ### 八、为什么激活值显存与序列长度有关？关系是怎样的？

    序列长度 TT 决定激活有两种依赖性，必须拆开理解。

content:
  prompt: "\U0001F9F9 如何清理或回收 KV Cache 以节省显存？"
answer:
  mode: rubric
  reference_answer: |-
    在多轮对话或长文本处理中，主动管理和回收 KV Cache 是防止 OOM 的关键。常见策略有：

    - 滑动窗口 (Sliding Window)：只保留最近 N 个 token 的 KV Cache，超出窗口的旧 token 对应的缓存被直接丢弃。这是最简单直接的方法，但会丢失早期上下文。

    - StreamingLLM：保留开头的几个“注意力汇聚点（Attention Sinks）”token，加上滑动窗口内的 token，丢弃中间部分的 KV Cache。这样既控制了缓存大小，又维持了注意力机制的稳定性。

    - H2O (Heavy-Hitter Oracle)：根据累积的注意力分数，动态识别出“重击手”token，只保留这些关键 token 的 KV Cache，淘汰掉不重要 token 的缓存。这是一种智能的淘汰策略。

    - 前缀缓存 (Prefix Caching)：多个请求共享的相同前缀只存一份。当所有引用该前缀的请求完成后，该部分缓存被回收。

    - 手动重置：在对话应用中，当用户主动“开启新对话”或检测到话题彻底转换时，可以调用接口强制清空当前会话的 KV Cache，从零开始。


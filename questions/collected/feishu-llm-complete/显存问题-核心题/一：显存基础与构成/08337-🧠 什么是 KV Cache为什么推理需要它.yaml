content:
  prompt: "\U0001F9E0 什么是 KV Cache？为什么推理需要它？"
answer:
  mode: rubric
  reference_answer: "KV Cache 是 Transformer 模型在自回归生成时采用的一种关键优化技术，其本质是用空间（显存）换取时间（计算）。\n\n为什么需要
    KV Cache？\n\n自回归生成每次只输出一个token。在计算这个新token的注意力时，它需要与所有历史token进行交互。如果没有KV Cache，每生成一个新token，都要将前面所有token的Key和Value重新计算一遍。这会导致：\n\n-
    计算量爆炸：总计算复杂度变为 O(N3)，其中N是序列长度。\n\n- 时间灾难：生成一篇千字文章可能需要几个小时。\n\n- 显存浪费：重复计算会产生大量中间激活值，极易导致OOM。\n\nKV
    Cache的工作原理\n在生成第一个token（处理完prompt）时，我们将prompt中所有token的Key和Value向量缓存起来。之后每生成一个新token，只需计算这个新token的Query、Key和Value，然后从缓存中读取所有历史token的K和V，完成注意力计算。最后，将新token的K和V追加到缓存中。这样，每一步的计算量从
    O(N2) 降为 O(N)，总计算复杂度从 O(N3) 降为O(N2)，极大地提升了生成速度。\n\n没有KV Cache会怎样？\n\n- 速度极慢，无法实用。\n\n-
    显存爆炸，因为需要同时保存所有历史token的完整前向计算图。\n\n\U0001F4A1 这就像作家写文章：每写一个字，都需要回顾前文所有内容以保持连贯。KV
    Cache就是作家的“短期记忆”，让他不用每次都从头读起。\n\n---"

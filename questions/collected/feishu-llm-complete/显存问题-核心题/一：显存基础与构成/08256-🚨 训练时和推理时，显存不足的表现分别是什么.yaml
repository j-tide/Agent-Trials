content:
  prompt: "4. \U0001F6A8 训练时和推理时，显存不足的表现分别是什么？"
answer:
  mode: rubric
  reference_answer: "训练时显存不足的表现：\n\n- CUDA Out of Memory (OOM) Error：最直接的标志。PyTorch
    会抛出 RuntimeError: CUDA out of memory.，并显示尝试分配多少内存、已用多少。\n\n- 训练进程崩溃或被系统杀死：在容器化环境中，如果显存使用超过配置的
    limit，进程会被 OOM Killer 终止。\n\n- Batch Size 无法增大：稍微增大 Batch Size 或序列长度就 OOM。这是常见的显存瓶颈。\n\n-
    无法加载完整模型：初始化模型时就 OOM，说明单卡连模型权重都装不下。\n\n- 训练初期正常，后期 OOM：常见于激活重计算未开启时，随着训练进行，某层的激活值峰值超出预期；或使用了
    Pre-allocated 显存，但碎片化导致分配失败。\n\n- 频繁的 CPU-GPU 数据传输（慢）：如果开启了 Offload，训练可能极慢，但不会
    OOM。若观察到 PCIe 带宽占满，GPU 利用率低，说明显存不足，数据被迫在 CPU 和 GPU 之间频繁搬运。\n\n推理时显存不足的表现：\n\n-
    单次请求 OOM：Prompt 长度或生成长度过大，导致 KV Cache 或激活值超出剩余显存，请求失败。\n\n- 服务 QPS 上不去：显存只能容纳很少的并发请求，增大并发立即
    OOM。\n\n- 长上下文无法支持：当尝试处理 128K 上下文时，OOM 或性能骤降（因 KV Cache 溢出到 CPU）。\n\n- 频繁的 Swap
    导致延迟毛刺：如果使用了显存 Offload 或 PagedAttention 的 Swap 机制，当物理页不够用时，会触发 KV Cache 的换入换出，导致部分请求的延迟飙升。\n\n-
    显存碎片化导致分配失败：在 PagedAttention 中，虽然总空闲显存足够，但没有足够大的连续块分配给 KV Cache 页表，导致请求被拒绝。\n\n\U0001F4A1
    总结：训练时 OOM 往往是因为模型参数、优化器状态、激活值这“三座大山”超出了容量；推理时 OOM 则更多与 KV Cache 和并发请求数的动态扩展有关。\n\n---"

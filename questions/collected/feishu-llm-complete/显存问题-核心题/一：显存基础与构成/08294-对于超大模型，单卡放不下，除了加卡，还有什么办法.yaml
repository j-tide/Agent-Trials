content:
  prompt: 对于超大模型，单卡放不下，除了加卡，还有什么办法？
answer:
  mode: rubric
  reference_answer: "当超大模型单卡放不下时，“加卡”（即使用模型并行）是最直接有效的解决方案。但在资源有限或追求成本效益时，还有一系列“不加卡”或“加更少卡”的优化手段。\n\n\U0001F527
    不加卡或少加卡的方法\n\n- 权重量化：将模型权重从 FP16 压缩到 INT8 或 INT4。对于 70B 模型，INT4 量化可使权重大小从约 140GB
    降至约 35GB，加上运行时开销，可能刚好能在单张 48GB 或两张 48GB 的 GPU 上运行。\n\n- CPU/NVMe 卸载（Offloading）：将模型的一部分层或优化器状态存放在
    CPU 内存甚至 NVMe 固态硬盘上，仅当需要时才加载到 GPU 显存中执行计算。例如 ZeRO-Infinity 可以将参数、梯度和优化器状态卸载到 CPU
    和 NVMe 硬盘上，使单卡训练万亿参数模型成为可能。但代价是速度会因受限于 PCIe 或 NVMe 带宽而大幅下降。\n\n- 激活重计算（Gradient
    Checkpointing）：训练时只保存部分层的激活值，其余的在反向传播时重新计算。这以增加约 33% 的计算时间为代价，显著减少了训练时的激活值显存占用，使得用更少的卡或更大的
    batch 成为可能。\n\n- 混合精度训练与 FP16/BF16：使用 FP16 或 BF16 而非 FP32 存储激活值和梯度，可将这两部分的显存需求减半。\n\n-
    优化器状态压缩：使用 8-bit Adam 或 Adafactor 等优化器，将动量和方差从 FP32 量化为 INT8，大幅降低优化器状态显存占用。QLoRA
    中的分页优化器也属于此类。\n\n- 序列并行（Sequence Parallelism）：对于长序列任务，将序列维度切分到多张 GPU 上，每张卡只处理一部分
    token 的激活值，可显著降低单卡的激活值峰值。这对于不增加模型权重的情况下扩展序列长度非常有效。\n\n- 模型架构优化：选择更高效的模型结构（如 GQA
    替代 MHA 以降低 KV Cache、使用 SwiGLU 或 MoE 架构）。MoE 虽然总参数量大，但每次激活的参数少，训练和推理的计算量和显存需求相对较小。\n\n\U0001F4A1
    总结：这些方法的核心思想不外乎三种：压缩数据（量化）、转移数据（卸载）、重用计算代替存储（激活重计算）。它们在工程中经常组合使用，以在有限的硬件上撬动更大的模型。\n\n---"

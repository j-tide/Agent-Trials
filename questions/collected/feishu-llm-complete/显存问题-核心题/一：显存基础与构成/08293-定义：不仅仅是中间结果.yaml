answer:
  mode: rubric
  reference_answer: |-
    激活值（Activation）是指前向传播中所有需要在反向传播中重用的张量，以满足链式法则的需要。包括但不限于：

    - 每层的输入和输出（需用于梯度传播）

    - 非线性函数的输入（如 ReLU 需要知道哪些元素>0）

    - 归一化层的输入、均值、方差（用于梯度计算）

    - Dropout 的 mask

    - 注意力机制中的 QKT 矩阵、softmax 后的概率矩阵等

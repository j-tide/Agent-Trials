  reference_answer: |-
    - “如果参数共享呢？” 梯度是按张量单元累加的，如 embedding 共享权重，其梯度会在反向时累加，但最终也只有一个与原始权重同形的张量，显存占用不变。

    - “稀疏梯度可以变小。” 对，框架支持稀疏梯度，但存储格式不同，但展开成稠密张量时依然占用同样元素数，但稀疏可节省显存。


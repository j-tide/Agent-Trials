content:
  prompt: "\U0001F4C8 为什么 Decode 阶段 KV Cache 会线性增长？"
answer:
  mode: rubric
  reference_answer: |-
    在Decode阶段，每生成一个新token，模型都会在每一层的Key和Value缓存末尾追加当前token对应的向量。由于每个token贡献的K、V大小是固定的（由模型维度决定），而生成过程是顺序进行的，因此随着越来越多的token被生成，缓存中存储的向量总数线性增加，KV Cache的大小也就线性增长。直到生成结束（遇到EOS或达到最大长度），这个线性增长过程才会停止。


content:
  prompt: 有没有工具可以可视化显存使用的时间线？
answer:
  mode: rubric
  reference_answer: "有，而且非常成熟。可视化显存时间线是定位显存瓶颈、优化训练和推理性能的利器。\n\n\U0001F4CA 主流可视化工具\n\n-
    PyTorch Profiler + TensorBoard\nPyTorch 内置的 Profiler 可以记录完整的显存时间线。只需在训练代码中包裹 torch.profiler.profile，并设置
    profile_memory=True，然后导出为 Chrome Trace 格式或直接集成 TensorBoard。\n\n```python\nwith
    torch.profiler.profile(\n    activities=[torch.profiler.ProfilerActivity.CPU,
    torch.profiler.ProfilerActivity.CUDA],\n    profile_memory=True,\n    record_shapes=True,\n
    \   with_stack=True\n) as prof:\n    # 你的训练循环\n    pass\nprof.export_chrome_trace(\"trace.json\")
    \ # 可在 chrome://tracing 中打开\n```\n\n- 在 TensorBoard 中，你可以看到：\n\n- NVIDIA Nsight
    Systems\n这是 NVIDIA 官方出品的性能分析工具，功能比 PyTorch Profiler 更强大。它可以捕捉到 CUDA 内核的执行、内存拷贝、API
    调用等详细信息，并生成统一的时间线视图。对于分布式训练，它还支持多 GPU 的时间线对比。Nsight Systems 可以看到 CPU 和 GPU 之间的数据搬运，以及显存的分配和释放事件，是分析大规模分布式训练性能的终极工具。\n\n-
    Weights & Biases (WandB) 和 TensorBoard 的标量面板\n如果你只关心宏观趋势，可以在训练循环中记录 torch.cuda.memory_allocated()
    和 torch.cuda.memory_reserved() 到 WandB 或 TensorBoard。这样可以在实验面板上对比不同配置下的显存占用曲线，帮助选型。\n\n-
    自定义回调 + Matplotlib\n你也可以在训练循环中手动记录每一步的显存占用，最后用 Matplotlib 绘制成曲线。这是一种轻量级的方法，适合快速迭代。\n\n\U0001F4A1
    使用建议：对于日常调试，PyTorch Profiler + TensorBoard 已经足够。对于深度的性能优化（尤其是涉及 CUDA kernel 级别的优化），建议使用
    Nsight Systems。\n\n---"

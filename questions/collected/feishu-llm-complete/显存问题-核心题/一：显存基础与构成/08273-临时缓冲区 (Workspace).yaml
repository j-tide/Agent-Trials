answer:
  mode: rubric
  reference_answer: |-
    深度学习的底层库（cuBLAS, cuDNN, 自定义 CUDA kernel）在执行算子时需要 scratch memory：

    - 矩阵乘法分段：大矩阵乘法可能会划分 tile，临时存储部分积。

    - Softmax / LayerNorm：需要存储最大值、求和等中间统计量。

    - 注意力融合：如 FlashAttention 需要在 SRAM 和 HBM 之间搬运数据，需要额外预留缓冲区用于分块计算的重组。

    - Dropout：需要存储随机 mask，但通常与激活耦合。

    大小：一般单个算子几 MB 到几十 MB，PyTorch 的 cublas 句柄维护一个共享 workspace。在 ResNet 等 CNN 里 cuDNN 可能预先分配数百 MB。对于 Transformer，单次迭代的临时缓冲一般 < 2GB，相对权重和激活是零头。

content:
  prompt: "\U0001F409 推理长文本（如 128K）时，显存瓶颈通常是什么？"
answer:
  mode: rubric
  reference_answer: |-
    推理 128K 长度的文本时，显存瓶颈毫无疑问是 KV Cache。

    以 LLaMA-7B 为例（MHA 32 头，FP16），单个 token 的 KV Cache 在 32 层下约 0.5 MB。对于 128K tokens，单个请求的 KV Cache 就需要约 64 GB 显存！这已经接近甚至超过了一张 80GB A100 的可用显存。此时，模型权重（约 14 GB）反而成了“小头”。任何并发请求都会立即导致 OOM。

    因此，处理超长文本时，必须使用 GQA（减少 K/V 头数）、MQA、MLA（低秩压缩）或 KV Cache 量化（INT8/INT4）等技术来压缩 KV Cache，否则推理根本无法进行。


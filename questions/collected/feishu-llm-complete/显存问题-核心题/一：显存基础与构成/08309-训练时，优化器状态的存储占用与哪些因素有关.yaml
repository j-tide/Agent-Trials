content:
  prompt: 训练时，优化器状态的存储占用与哪些因素有关？
answer:
  mode: rubric
  reference_answer: "优化器状态（如 Adam 的动量 m 和二阶矩 v）是训练时最大的显存消耗者之一。其存储占用主要与以下因素有关：\n\n\U0001F527
    决定性因素\n\n- 模型参数量（P）：这是最直接的因素。优化器需要为每一个可训练参数维护独立的状态。对于 Adam，需要维护两个 FP32 张量（m 和
    v），共 8P8P 字节（假设精度为 FP32）。对于 7B 模型，这部分就是 56 GB。\n\n- 优化器类型：\n\n- 存储精度：\n\n- 可训练参数量：并非所有参数都需要优化器状态。例如：\n\n-
    并行策略（ZeRO 分片）：\n\n\U0001F4A1 总结：优化器状态的显存占用由模型参数量、优化器类型、存储精度、可训练参数量和ZeRO 分片策略共同决定。它是训练显存中最大的单项开销之一，通常占总显存的
    40%–60%。\n\n---"

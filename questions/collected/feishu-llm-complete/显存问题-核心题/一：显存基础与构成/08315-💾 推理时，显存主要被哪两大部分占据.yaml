content:
  prompt: "\U0001F4BE 推理时，显存主要被哪两大部分占据？"
answer:
  mode: rubric
  reference_answer: "在LLM推理的显存分配中，有两个绝对的主角，它们占据了绝大部分的GPU内存，分别是模型权重和KV Cache。其他部分如临时激活值、框架开销等虽然存在，但通常占比很小（<10%），且可以通过技术手段优化。理解这两大块是进行一切推理优化的基础。\n\n[图片内容未导入]\n\n①
    模型权重\n\n这是推理的入场券。无论你问一个字还是万字长文，整个模型的参数都必须安静地躺在显存里。对于FP16精度的7B模型，这部分固定占用14 GB，是静态的、不可压缩的底线（除非量化）。\n\n②
    KV Cache\n\n这是推理过程的记忆成本。自回归生成每产生一个token，模型的所有层都要把当前token对应的Key和Value向量追加保存，以便后续token不再重算历史。它的显存占用会随着序列长度和batch
    size线性增长，是长文本推理中最凶猛的“吞金兽”。在短文本下它可能只占5%，但在超长上下文（如32k）时，它甚至可以超过权重本身，达到60%以上。\n\n\U0001F4CA
    占比随上下文长度的变化表：\n\n[嵌入表格未展开]\n\n\U0001F4A1 核心洞察：上下文长度是决定显存压力模式的核心变量。在短对话中，你的钱主要花在“买模型”上；而在长文档分析中，你的钱主要花在“维持记忆”上。优化长文本推理，首要目标是砍向
    KV Cache。\n\n---"

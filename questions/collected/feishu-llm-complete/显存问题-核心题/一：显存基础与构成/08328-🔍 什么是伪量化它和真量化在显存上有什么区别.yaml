content:
  prompt: "\U0001F50D 什么是“伪量化”？它和真量化在显存上有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    伪量化（Fake Quantization） 是指在训练过程中模拟量化误差，但并不真正将权重和激活值转换为低位整数存储的技术。它通常在量化感知训练（QAT, Quantization-Aware Training）中使用。

    - 工作机制：在前向传播时，插入伪量化节点。这些节点将浮点值按设定的量化参数（scale, zero-point）进行舍入和反量化，产生量化误差，并让模型在训练中学会适应这种误差。但在实际存储和反向传播时，权重和激活值仍然保留为全精度浮点数（FP32/FP16）。因此，伪量化不节省任何显存。

    - 真量化（True Quantization）：指将模型权重和激活值真正转换为低位整数（如 INT8/INT4）进行存储和计算。例如，INT8 真量化的权重只占 1 字节，在推理或训练时直接使用这些整数进行计算，从而极大地节省显存和带宽。

    总结：伪量化是“训练技巧”，目的是让模型提前适应量化噪声，为后续的真量化做准备；真量化是“部署技术”，目的是实际压缩模型体积和加速计算。伪量化节省了0%的显存，真量化可节省50%-75%的显存。

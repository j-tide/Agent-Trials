content:
  prompt: "\U0001F517 推理时使用流水线并行（PP）能减少单卡显存吗？为什么？"
answer:
  mode: rubric
  reference_answer: |-
    能减少单卡显存，但减少的是模型权重和 KV Cache 的存储负担。

    流水线并行将模型的不同层分配到不同的 GPU 上。例如，一个 32 层的模型，GPU0 负责第 1-16 层，GPU1 负责第 17-32 层。

    - 权重显存：每张 GPU 只存储自己负责的那部分层的权重，因此权重显存降为原来的 1/PP。

    - KV Cache：同样，每张 GPU 只存储自己负责的层的 KV Cache，总量也降为原来的 1/PP。

    - 中间激活：在推理时，中间激活（hidden states）需要在 GPU 间通过点对点（P2P）通信传递。每张 GPU 的激活峰值也相应降低。

    与张量并行（TP）相比，PP 的通信发生在层间边界，通信量较小，因此对跨节点网络带宽的要求不高，适合跨机器扩展。但 PP 的缺点是可能引入流水线气泡，且在 batch size 较小或模型层数不多时效率较低。


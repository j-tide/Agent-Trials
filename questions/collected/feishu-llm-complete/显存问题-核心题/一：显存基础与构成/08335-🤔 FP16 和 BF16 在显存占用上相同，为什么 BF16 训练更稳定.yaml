  prompt: "\U0001F914 FP16 和 BF16 在显存占用上相同，为什么 BF16 训练更稳定？"
answer:
  mode: rubric
  reference_answer: |-
    FP16 和 BF16 都占用 2 字节，显存节省效果完全一致。但 BF16 训练更稳定，根本原因在于两者的内部结构和动态范围存在巨大差异：

    [图片内容未导入]

    结论：BF16 通过牺牲一部分尾数精度，换来了与 FP32 同等的动态范围，从根本上解决了梯度溢出问题，使得训练过程更加平滑、鲁棒，对超参数不敏感。这就是它更稳定的原因。

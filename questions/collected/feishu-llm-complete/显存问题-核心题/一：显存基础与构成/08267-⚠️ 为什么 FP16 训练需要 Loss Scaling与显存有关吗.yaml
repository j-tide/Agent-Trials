content:
  prompt: "⚠️ 为什么 FP16 训练需要 Loss Scaling？与显存有关吗？"
answer:
  mode: rubric
  reference_answer: "Loss Scaling（损失缩放）是 FP16 混合精度训练中特有的技术，其本质是为了解决 FP16 动态范围不足导致的梯度下溢问题。\n\n[图片内容未导入]\n\n动态
    Loss Scaling 进一步自动化了这一过程：训练过程中持续监控梯度，如果没有出现 Inf/NaN，就逐步增大缩放因子，以更好地利用 FP16 的表示范围；如果检测到溢出，就跳过本次更新并缩小缩放因子。\n\n与显存的关系：Loss
    Scaling 不直接节省显存。它是一个数值稳定性技术，目的是让 FP16 训练能够正常进行，而不是为了减少显存占用。显存的节省来自于使用 FP16 存储权重、激活值和梯度本身。Loss
    Scaling 是让这种节省得以实现的前提。\n\n\U0001F4A1 BF16 的优势：BF16 拥有 8 位指数，动态范围与 FP32 相同，因此不需要
    Loss Scaling。这也是为什么大模型训练越来越多地转向 BF16。\n\n---"

content:
  prompt: "⚡ 为什么混合精度训练能节省显存？省了哪些？"
answer:
  mode: rubric
  reference_answer: |-
    混合精度训练指的是在训练过程中同时使用低精度（如 FP16/BF16）和高精度（FP32）。它能大幅节省显存，主要省在了以下几个方面：

    - 模型权重的低精度副本：在混合精度训练中，前向和反向传播使用的是低精度（FP16/BF16）的模型权重，这比 FP32 主权重副本节省了一半的存储空间。同时，FP32 的主权重通常存储在优化器状态中，不单独占用一份显存。

    - 梯度的低精度存储：反向传播计算出的梯度同样以低精度（FP16/BF16）存储。相比于 FP32 梯度，这部分显存需求也减半。

    - 激活值的低精度存储：前向传播时产生的中间激活值，如果以 FP16 存储而不是 FP32，其占用的显存也直接减半。这是显存节省的一个重要来源，尤其在 batch size 大或序列长时效果显著。

    需要注意的是，优化器状态（如 Adam 的动量和方差）通常保留为 FP32 以保证更新精度，这部分并未被压缩。因此，混合精度训练主要节省的是模型权重、梯度和激活值的显存，而不是优化器状态。以 7B 模型为例，这部分可节省约 30-40 GB 的显存。

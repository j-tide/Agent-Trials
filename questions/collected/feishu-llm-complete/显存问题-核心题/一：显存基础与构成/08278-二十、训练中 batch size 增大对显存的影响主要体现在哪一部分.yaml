content:
  prompt: 二十、训练中 batch size 增大对显存的影响主要体现在哪一部分？
answer:
  mode: rubric
  reference_answer: |-
    增大 batch size 对显存的冲击是高度非对称的，主要集中在激活值部分，而对权重、梯度、优化器状态几乎没有影响（在使用数据并行或 ZeRO 的情况下需细究）。

    对激活值的影响（最大头）

    - 前向传播产生的大部分中间张量的第一个维度是batch size（即 micro-batch size），例如隐状态 [B,T,D]、注意力矩阵 [B,h,T,T]。

    - 因此，激活值总量与 BB 呈正比（忽略 T2 项时）。如果 BB 翻倍，激活值显存大约也翻倍（注意 T2 项也会因为多头而随 B 倍增）。

    - 这是导致 OOM 的最常见原因：加大 batch 想提高吞吐，结果激活瞬间爆掉。

    对梯度和优化器状态的影响

    - 在数据并行（DDP）下，每个 GPU 仍然保留完整的梯度和完整的优化器状态，这些大小与 batch size 无关，只与模型参数量有关。因为梯度张量的形状和参数一样，不随输入 batch 变化。

    - 即使使用梯度累积（多个 micro-batch 累加梯度），梯度存储依然是固定的 P 大小，不会因累积步数而变大。

    - 因此，梯度与优化器状态的显存对 B 是免疫的。

    对权重的影响

    - 同样，权重与 batch size 无关。

    特殊场景

    - 当使用梯度检查点时，激活量虽被压缩，但仍有一个和 B 成正比的基本激活分量（检查点输入）。增大 B 依然会线性增加这一分量。

    - 在模型并行/ZeRO-3中，参数是分布式存储，但激活量依然是每卡的局部批量导致的，未被打折。因此大 batch 训练需要足够多的显存来容纳激活，或者结合张量并行来降低每卡的激活大小。

    如何应对 batch 增大导致的激活膨胀？

    [图片内容未导入]

    - 创建张量时增加；

    - 张量失去引用并被 del 或作用域结束后，经过 Python GC 调用，对应的 CUDA 存储被标记为释放，allocated 减少。

    - allocated 增加时 reserved 可能也需向 CUDA 申请新块而增加；

    - 张量释放时，allocated 减少，但 reserved 不减，除非显式调用 torch.cuda.empty_cache()。

    - 前向传播：逐层计算并保留激活张量，显存持续攀升，直到最后一层完成前向。

    - 反向传播：自动释放不再需要的激活（例如已经用过的中间结果），同时产生梯度张量。

    - 因此，前向结束到反向开始之间，激活量达到峰值；反向过程中激活逐步释放，而梯度逐渐累加，整体显存可能先升后降。

    - 在 DDP 中，反向传播会异步触发梯度 AllReduce。通信期间，梯度缓冲区被占用。

    - 如果使用了梯度累积（gradient accumulation），每一步 backward() 会累加梯度，梯度显存持续存在，峰值更高。

    - 某些算子（如矩阵乘法、注意力融合）会临时申请大块 workspace，计算完成后立即释放。这会在极短时间内推高显存水位。

    - 例如，某个 kernel 临时需要 1 GB 的 scratchpad，使用完毕立即释放。

    - 在 optimizer.step() 中，优化器可能会创建临时张量（例如 FP32 梯度的拷贝、缩放计算），然后更新状态。虽然通常不大，但叠加在已经很高的水位上可能成为最后的一击。

    - Megatron 风格 TP：在前向时，每张卡保留自己的分片输出，但注意力需要 allreduce 或 allgather。激活张量的形状在 TP 维度上减少，但可能需要额外的通信缓冲区。

    - 有效激活存储通常也与 1/N 有关，但因为通信重叠，可能并不严格线性。

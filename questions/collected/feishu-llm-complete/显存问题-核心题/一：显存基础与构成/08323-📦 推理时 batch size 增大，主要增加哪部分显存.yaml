content:
  prompt: "\U0001F4E6 推理时 batch size 增大，主要增加哪部分显存？"
answer:
  mode: rubric
  reference_answer: |-
    batch size 增大时，增加最显著的部分是 KV Cache。因为每个独立的推理请求都需要维护自己的一份 KV Cache，不同请求之间的 KV Cache 完全隔离，无法共享。因此，KV Cache 的显存占用与 batch size 是严格的线性关系。当 batch size 从 1 增加到 8 时，KV Cache 的显存也恰好变为原来的 8 倍。

    此外，在 Prefill 阶段，大 batch 会同时产生更多的临时激活值，也会增加一部分显存压力，但这部分通常可以通过 FlashAttention 和算子融合来优化。模型权重是所有 batch 共享的，不会随 batch size 增加而增加。

    结论：限制在线服务吞吐量的核心瓶颈，往往就是 KV Cache 的容量。要提升 batch size，就必须降低单个请求的 KV Cache 大小（如使用 GQA、KV Cache 量化）。


content:
  prompt: 十九、使用数据并行（DDP）时，每张卡的优化器状态是冗余的吗？
answer:
  mode: rubric
  reference_answer: |-
    是的，完全冗余。 这是 DDP 显存效率低下的一个重要原因，也是 ZeRO 诞生的初衷。

    DDP 的工作机制

    - 每个 GPU 拥有一个完整的模型副本，以及独立的优化器实例。

    - 前向：各卡使用自己分配的 micro-batch 数据，计算出各自的 loss。

    - 反向：各卡计算各自的梯度。

    - 梯度同步：在所有 GPU 间执行 AllReduce，平均梯度，使所有 GPU 最终持有完全相同的全局平均梯度。

    - 优化器更新：每张卡独立地用相同的梯度更新自己的模型和优化器状态。

    - 结果是所有 GPU 的参数和优化器状态始终保持一致。

    冗余的本质

    因为所有 GPU 都执行一模一样的参数更新（更新量相同），优化器状态 m 和 v 在更新后会完全相等。这些完全重复的状态在 N 张卡上总计占用 N×8Φ 字节，但实际只需 8Φ 的唯一信息。
    因此，对于 NN-way DDP，优化器状态是 N 倍冗余。

    为什么还用它？

    - 实现极其简单，通信只有 AllReduce 梯度，没有额外的状态分片管理。

    - 对于中小模型（参数 < 1B），单卡放得下完整优化器状态时，DDP 的简洁性胜出。

    - 显存浪费在模型较小时可以接受（8 GB 冗余对于8卡，每卡才多1 GB，影响不大）。

    面试要点：当面试官问“DDP 中优化器状态是不是浪费”，你要明确指出：是信息上的完全冗余，但它是为了保持每卡独立更新并简化通信而付出的代价；ZeRO 正是通过打破这一冗余来支撑大模型训练。


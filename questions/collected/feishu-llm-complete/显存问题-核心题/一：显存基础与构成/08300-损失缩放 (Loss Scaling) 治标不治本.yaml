answer:
  mode: rubric
  reference_answer: 混合精度训练用放大损失来将小梯度推入 FP16 范围，然后反向缩放权重更新。但这只能缓解梯度本身的溢出，无法改变优化器状态的更新过程——因为
    m,v 的更新仍在优化器内部，使用的是原始梯度（缩放后的梯度除以缩放因子，又变回小值）。所以必须用 FP32 存储状态。

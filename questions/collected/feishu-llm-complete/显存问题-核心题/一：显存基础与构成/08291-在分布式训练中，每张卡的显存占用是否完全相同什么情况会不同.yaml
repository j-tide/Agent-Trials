content:
  prompt: 在分布式训练中，每张卡的显存占用是否完全相同？什么情况会不同？
answer:
  mode: rubric
  reference_answer: "默认情况下，如果所有 GPU 是同构的，且数据并行（DP/DDP）设置完全对称，每张卡的显存占用在理论上是完全相同的。 然而在实际分布式训练中，多种因素会打破这种平衡，导致显存占用不一致。\n\n\U0001F6A7
    导致显存占用不一致的常见情况\n\n- 数据负载不均（最典型）\n在数据并行中，每个 GPU 处理同一个批次数据的不同子集。如果 DistributedSampler
    未正确设置，或数据集中存在大量长度不一致的序列，导致某些 GPU 分配到的数据总 token 数更多，那么这些 GPU 上产生的激活值（以及可能的 KV Cache）会更大，从而占用更多显存。这种情况在
    NLP 任务中尤为常见。\n\n- 模型并行的非对称性\n\n- 混合精度与主权重副本\n在混合精度训练中，FP32 的主权重副本通常存储在所有 GPU 上（数据并行模式）。但如果使用了
    ZeRO-1/2/3 优化器状态分片，各卡可能只持有部分参数的优化器状态。如果分片不完全均匀（例如参数量不能被 GPU 数量整除），某些卡可能会多存一些状态。\n\n-
    通信缓冲区的不对称分配\n分布式训练框架（如 NCCL）在初始化时，会根据通信拓扑预分配缓冲区。不同 GPU 在通信组中的角色（例如是否是根节点）可能导致分配的缓冲区大小略有不同。\n\n-
    显存碎片化\n如上题所述，碎片化是一种动态的、非确定性的现象。不同 GPU 上的张量分配和释放顺序可能不同，导致某些 GPU 更快地产生碎片，从而出现“总空闲显存足够但无法分配连续块”的情况，表现为显存占用过高。\n\n\U0001F4A1
    结论：虽然理想状态下每卡显存占用相同，但在实际大模型训练中，数据不均衡、模型并行切分、通信缓冲区等因素常常导致不一致。这种不一致可能引发“木桶效应”——集群中显存最紧张的
    GPU 成为训练能否继续的瓶颈。\n\n---"

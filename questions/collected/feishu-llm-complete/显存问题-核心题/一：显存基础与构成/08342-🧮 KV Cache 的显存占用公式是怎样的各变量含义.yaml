  reference_answer: |-
    对于标准多头注意力（MHA），KV Cache总显存的计算公式如下：

    [图片内容未导入]

    各变量详解：

    - 2：代表每个注意力头需要同时存储 Key 和 Value 两个张量，两者大小相同。

    - L：Transformer 的层数（Layers）。每一层都有独立的K、V投影，缓存互不共享。

    - B：批处理大小（Batch Size）。不同推理请求的KV Cache是严格隔离的，因此显存会随并发数线性增长。

    - S：序列总长度（Sequence Length），即 prompt长度 + 已生成token数。这是动态变量，在生成过程中从0开始线性增长，是长文本推理时最可怕的乘法因子。

    - H：注意力头数（Num Heads），对于 MHA 而言，K/V 头数与Q头数相同。


content:
  prompt: "\U0001F6AB 为什么 ZeRO 对激活值显存没有直接影响？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 ZeRO 的设计目标是消除模型状态（参数、梯度、优化器）的冗余，而激活值（activations）是前向传播产生的临时张量，与模型状态无关，因此
    ZeRO 无法通过分片来减少它。\n\n\U0001F52C 原因解析：\n\n- 激活的本质：每层计算产生的中间结果，依赖于输入数据和模型结构，每张卡的激活通常是不同的（因为数据不同），不存在跨卡冗余。ZeRO
    的分片机制是针对多卡间重复存储的模型状态（所有卡存一样的内容）进行切分，而激活本来就不重复，所以无从分片。\n\n- ZeRO 的节省范围：权重、梯度、优化器是“全局共享但复制”的状态，ZeRO
    将它们分成 N 份，每卡存 1/N。但激活是“本地独有”，不能分给其他卡。\n\n- 激活对显存的影响：在长序列、大 batch 下，激活显存往往成为主要瓶颈。此时需要其他技术：梯度检查点（用计算换显存）、序列并行、FlashAttention
    等，这些才直接针对激活。ZeRO 不解决激活问题，所以即使开启了 ZeRO-3，激活依然可能撑爆显存。\n\n\U0001F4CC 实际中：我们常看到“ZeRO-3
    + 梯度检查点 + FlashAttention”的组合，分别应对参数/优化器、激活、注意力矩阵的显存压力，它们各司其职。\n\n---"

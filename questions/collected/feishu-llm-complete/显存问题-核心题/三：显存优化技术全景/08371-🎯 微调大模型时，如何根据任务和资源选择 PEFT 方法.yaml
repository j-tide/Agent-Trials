content:
  prompt: "\U0001F3AF 微调大模型时，如何根据任务和资源选择 PEFT 方法？"
answer:
  mode: rubric
  reference_answer: "选择 PEFT 方法需要从任务类型、可用显存、训练数据量、推理延迟四个维度综合权衡。我通常按下面的决策树来选择：\n\n1️⃣
    先看任务需求\n\n- 生成任务（对话、摘要、翻译）：优先选 LoRA/QLoRA，因为它直接作用于权重，对生成质量影响最稳定，且可合并到原模型，不增加推理延迟。\n\n-
    分类/回归任务：Adapter、Prompt Tuning 甚至 BitFit 都足够，因只需在顶层聚合信息，不需要全模型适应。\n\n- 需要领域知识注入、指令遵循：LoRA
    效果最好；若数据极少，Prefix Tuning 也能工作。\n\n2️⃣ 再看显存约束\n\n- GPU 显存充裕（>40GB）：直接用 LoRA (r=16-32)，FP16
    基础权重，训练速度快。\n\n- 消费级显卡（24GB）：使用 QLoRA (4-bit 基础 + LoRA)，能微调 7B-13B 模型。\n\n- 极度受限（<12GB）：选用
    LoRA + 梯度检查点 + 极低 rank (r=4)，甚至 Prompt Tuning（只训练软提示向量，额外参数量可低至几万）。\n\n- 多任务/多租户场景：Adapter
    和 LoRA 都支持热插拔，可以动态加载不同任务的适配器，而 Prefix Tuning 修改的是输入层，不如 LoRA 灵活。\n\n3️⃣ 考虑训练数据规模\n\n-
    大数据（>10k 样本）：LoRA 表现优异，rank 可设高些 (r=16-64)。\n\n- 小数据（几百条）：Prefix Tuning 或 P-Tuning
    v2 不容易过拟合，因只调前缀向量；LoRA 需用较小 rank，并加强正则化。\n\n4️⃣ 推理部署要求\n\n- 不能增加延迟：LoRA（合并后） 或
    BitFit（仅调 bias）最佳，因为推理时不引入额外计算。\n\n- 可以容忍微小延迟：Adapter 串行结构会轻微增加延迟；Prefix Tuning
    会占用部分上下文长度，影响长文本处理。\n\n- 需要动态切换多个模型：LoRA 适配器极轻量，可毫秒级换入换出；而 Adapter 稍重，但也可行。\n\n\U0001F4CA
    快速速查表：\n\n[嵌入表格未展开]\n\n✅ 总结：没有银弹，但 LoRA 系列最通用，QLoRA 是平民化利器，Prompt Tuning 适合轻量级，Adapter
    在多任务服务中有一定优势。\n\n---"

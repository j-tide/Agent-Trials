content:
  prompt: "\U0001F9E9 LoRA 为什么能显著降低微调显存？省了哪些部分？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 LoRA（Low-Rank Adaptation）的核心思想是将可训练的权重增量分解为两个小矩阵的乘积，冻结原始大模型，只优化这两个小矩阵，从而将可训练参数的数量缩小数百到数千倍，直接省去了优化器状态、梯度以及大部分参数的存储，显存占用断崖式下降。\n\n\U0001F50D
    具体节省的显存部分：\n\n- 优化器状态（通常占显存大头）\n全量微调时，Adam 优化器需要为每个参数存储动量和方差（FP32），共 8 字节/参数。对于一个
    7B 模型，这部分占 56 GB。LoRA 只训练极少的参数（例如 r=8 时约几百万参数），优化器状态仅需几十 MB，几乎可以忽略。\n\n- 梯度显存\n全量微调需要存储所有参数的梯度（FP16，2
    字节/参数），7B 占 14 GB。LoRA 的梯度只存在于低秩矩阵 A 和 B，对应的梯度显存同样降至几十 MB。\n\n- 基础模型权重（冻结）\nLoRA
    不需要修改原始权重，因此可以以 FP16/INT4/INT8 精度常驻显存，不必保留 FP32 的主副本（除了量化模型需要的少量反量化开销）。在 QLoRA
    中，基础权重甚至可以用 4-bit 压缩，仅占 3.5 GB（7B 模型）。全量微调通常需要保持 FP16 甚至 FP32 权重副本，占用更大。\n\n-
    通信开销（间接节省）\n在分布式训练中，只需同步 LoRA 的小梯度，而不是整个模型的大梯度，通信量断崖式下降，间接也减少了通信缓冲区的显存占用。\n\n\U0001F4CA
    总结：LoRA 将可训练参数从数 B 降低到几 M，从而将与训练相关的优化器、梯度、参数副本全部压缩到极致，仅基础模型权重以冻结形式保留，这是其显存节省的根本原因。\n\n---"

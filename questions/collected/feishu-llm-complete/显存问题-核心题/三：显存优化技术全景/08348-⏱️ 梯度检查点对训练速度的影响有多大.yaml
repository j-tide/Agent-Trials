content:
  prompt: "⏱️ 梯度检查点对训练速度的影响有多大？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 开启梯度检查点通常会使训练速度降低 15%～30%，具体取决于模型结构、检查点粒度和计算/通信比重。但结合其他优化后，吞吐下降往往可接受，甚至因能增大
    batch 而总体吞吐不降反升。\n\n\U0001F4CA 影响因素：\n\n- 额外前向计算：重计算带来约 20-30% 的额外 FLOPs，若 GPU
    计算能力充足，这部分可能会完全转化为延迟增加。\n\n- 计算与通信重叠：在分布式训练中，重计算可以在反向传播时并行，填充原本的流水线气泡，实际速度损失可能小于理论值。\n\n-
    批次大小变化：开启检查点后显存宽裕，可以增大 batch size 或序列长度，提高 GPU 利用率，有时总吞吐反而提升。\n\n- 框架实现：PyTorch
    的 checkpoint 函数有额外开销（如 Python 调用栈、保存/恢复张量）。使用 torch.utils.checkpoint.checkpoint
    可能比手动重计算慢一些，但已充分优化。\n\n\U0001F527 实测经验：在训练 7B 模型时，开启逐 Block 检查点，单个迭代时间增加约 20%。但
    batch size 可以从 16 扩大到 64，总 tokens/s 提升近 2 倍。因此，不能仅看迭代延迟，要从系统吞吐角度评估。\n\n✅ 因此，梯度检查点的速度代价通常可接受，尤其当它允许使用更大
    batch 时，整体训练效率往往不降反升。\n\n---"

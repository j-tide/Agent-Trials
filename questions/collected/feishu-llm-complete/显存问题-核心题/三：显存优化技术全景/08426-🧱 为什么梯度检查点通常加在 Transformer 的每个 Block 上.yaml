content:
  prompt: "\U0001F9F1 为什么梯度检查点通常加在 Transformer 的每个 Block 上？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 Transformer Block 具有天然的模块化和顺序依赖，且每个 Block 内部激活量巨大但输入很小，将检查点设在
    Block 边界能以最小存储成本保留重计算所需的“种子”，最大化显存节省效率。\n\n\U0001F50D 原因：\n\n- 每个 Block 输入很小：一个
    Block 的输入是 hidden states，形状 [batch, seq, hidden]，远小于 Block 内部产生的 QKV、注意力矩阵、FFN
    中间激活等。保存这个输入就能重算整个 Block，存储成本极低。\n\n- 模块化天然分段：Block 的输入输出是清晰的分界点，不需要额外分割。在框架中只需标记
    Block 的边界，就能轻松实现检查点。\n\n- 最优计算/存储比：若将检查点设在更小的粒度（如每个 Linear 层），重计算次数增多，但节省的显存增量减少；设在更大粒度（如多个
    Block）则保存的检查点输入增多，显存节省下降。逐 Block 是工程上的甜点。\n\n\U0001F4CC 因此，几乎所有框架（PyTorch、Hugging
    Face、Megatron）默认将 gradient checkpointing 应用于每个 Transformer Block，达到极佳平衡。\n\n---"

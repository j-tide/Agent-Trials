content:
  prompt: "\U0001F91D 在使用 ZeRO-3 时，是否还需要 TP？两者如何协同？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 ZeRO-3 已能将模型权重、梯度和优化器状态分片到所有数据并行卡上，理论上可以替代 TP 的显存节省效果，但在超大模型或长序列场景下，ZeRO-3
    与 TP 结合能进一步降低单卡激活显存和通信压力，提升训练效率。\n\n\U0001F517 协同机理：\n\n- ZeRO-3 将全部模型状态（参数、梯度、优化器）分片到
    DP 组的所有卡上，前向时通过 All-Gather 收集所需权重，计算后再释放。其显存节省程度随 DP 度增加而提高，通信量主要是 All-Gather
    和 Reduce-Scatter。\n\n- TP 则切分层内张量，直接减少单卡上的权重和激活，并伴随 All-Reduce 通信。TP 的通信开销通常大于
    ZeRO-3，但可以大幅降低单卡的激活峰值（因为层内的计算也被切分）。\n\n- 两者结合：在 DP 组内部（ZeRO-3）再嵌套 TP 组。例如总卡数 =
    DP × TP。ZeRO-3 负责跨节点的模型状态分片，TP 在节点内进一步切分层内权重和激活。这样可以获得双重显存削减：ZeRO-3 降低模型状态的单卡占用，TP
    降低激活和权重的内存峰值。尤其对于长序列，TP 切分激活的能力是 ZeRO-3 不具备的。\n\n- 典型配置：训练数百 B 模型时，常采用 ZeRO-3（跨机）+
    TP（节点内）混合。例如 64 卡，设 TP=4，DP=16，ZeRO-3 在 DP 组内分片。\n\n✅ 因此，ZeRO-3 与 TP 是互补关系。ZeRO-3
    解决模型存储，TP 解决激活和超大层的切分，协同后能训练更大、更长的模型。\n\n---"

content:
  prompt: "\U0001F30A AWQ 量化怎样根据激活值保护重要权重？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 AWQ（Activation-aware Weight Quantization）观察到，不同权重通道的重要性差异很大，且与对应激活值的幅度有关。它通过分析激活分布，找出重要的“显著权重”通道，并在量化前对其缩放（scaling）加以保护，从而减少量化误差。\n\n\U0001F50D
    机制：\n\n- 显著权重识别：AWQ 通过校准数据统计每个通道的激活值幅度（如平均值），发现激活值大的通道对应的权重对输出影响更大——这些就是“显著权重”。\n\n-
    每通道缩放：对于显著权重通道，AWQ 将其输入和输出进行等效的缩放（权重乘以系数 s，对应的输入除以 s），使这些通道的权重值分布更易于量化，同时不改变模型输出。\n\n-
    保护机制：缩放后的显著通道，量化误差相对减小。缩放因子通过快速网格搜索确定，以最小化层输出误差。\n\n- 量化执行：然后应用常规的逐通道或逐组 INT4
    量化。\n\n\U0001F52C 为什么有效：显著权重原本量化时可能产生较大误差，通过缩放将其“移入”量化器的有效范围，减少了裁剪错误。相较于 GPTQ，AWQ
    不需要求逆矩阵，速度更快，且在一些任务上精度更优。\n\n✅ 因此，AWQ 利用激活值作为权重重要性的“探针”，通过简单的等价变换大幅提升 4-bit 量化的精度，是一种轻量高效的量化方案。\n\n---"

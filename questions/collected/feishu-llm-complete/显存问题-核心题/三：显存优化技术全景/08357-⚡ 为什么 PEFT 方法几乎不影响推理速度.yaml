content:
  prompt: "⚡ 为什么 PEFT 方法几乎不影响推理速度？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 因为 PEFT 方法引入的额外计算量极小（几百万次乘加），相对于基础模型的前向计算（数十亿次）可忽略不计，并且
    LoRA 可重参数化合并到原权重中，完全消除额外计算；其他方法（Adapter）虽不可合并，但增加的串行瓶颈层也很轻量。\n\n\U0001F50D 速度影响分解：\n\n-
    LoRA\n\n- Adapter\n\n- Prefix Tuning\n\n\U0001F4CC 因此，PEFT 方法的设计哲学就是“以最小的可训练参数实现大模型适应”，其计算增量常被工程优化隐藏，从而几乎不影响推理速度。\n\n-
    未合并：计算 y = Wx + B(Ax)。相比原 Wx，增加了两个小矩阵乘法。以 7B 模型为例，一次前向 FLOPs 约 7B × 2 × seq_len
    ≈ 1.4 × 10^13（seq=2048）。而 LoRA 额外 FLOPs 仅 ~ 2 × r × (d_in + d_out) × 层数 × seq_len
    ≈ 2 × 8 × 8192 × 32 × 2048 ≈ 8.6 × 10^9，不到原计算的 0.1%。因此延迟增加微乎其微。\n\n- 合并后：零额外计算，速度完全不受影响。\n\n-
    在每个 Block 中串行添加 bottleneck 层，参数量级在 1-2 M 每层，总 FLOPs 增加约 1%-2%，在批量较小时可观察到轻微延迟（1-3%），但通常可接受。\n\n-
    增加了前缀 token，使得注意力计算序列变长一点，理论上计算量增大约 (L+P)/L 倍。P 通常 ≤20，L 在 128 以上，增量小于 15%，且一般在
    GPU 上表现不明显。"

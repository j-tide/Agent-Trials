content:
  prompt: "\U0001F680 ZeRO-Infinity 如何利用 NVMe 硬盘进一步扩展显存？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 ZeRO-Infinity 在 ZeRO-Offload 基础上，进一步将参数、优化器状态、甚至激活卸载到高速
    NVMe SSD，将显存概念扩展到“GPU + CPU + NVMe”的异构存储，使得单卡训练万亿参数模型成为可能。\n\n\U0001F6E0️ 核心机制：\n\n-
    层次化存储：将模型状态（参数、梯度、优化器）和激活分区放置在不同设备上：热数据放 GPU，温数据放 CPU，冷数据放 NVMe。通过动态迁移和预取，保证计算设备总有数据可用。\n\n-
    NVMe 作为超大容量内存：现代 NVMe 读写速度可达 3-7 GB/s，虽然远低于 HBM，但容量巨大且比 CPU 内存便宜。ZeRO-Infinity
    可以直接从 NVMe 向 GPU 传输参数（通过 GPU Direct Storage），绕过 CPU，减少延迟。\n\n- 智能调度与重叠：在计算某一层之前，提前从
    NVMe 预取该层参数到 GPU；计算产生的梯度异步写回 NVMe。激活检查点也可以存到 NVMe。通过精心编排，将 I/O 时间隐藏在计算之后。\n\n-
    支持超长序列：可将注意力中间结果卸载到 NVMe，支持百万 token 上下文训练。\n\n\U0001F4C8 效果：使用单个 GPU 和大量 NVMe
    硬盘，可训练高达 1 万亿参数的模型（理论）。实际吞吐量受限于 NVMe 带宽，但突破了显存容量硬限制。\n\n✅ 因此，ZeRO-Infinity 是显存扩展的终极方案，利用
    NVMe 实现“无限显存”，使大模型训练资源需求大幅降低。\n\n---"

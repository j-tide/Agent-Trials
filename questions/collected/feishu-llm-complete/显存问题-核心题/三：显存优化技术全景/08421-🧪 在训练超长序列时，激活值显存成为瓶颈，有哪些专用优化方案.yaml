  reference_answer: "\U0001F4A1 超长序列 (≥32K) 训练时，激活显存通常成为主要瓶颈，常用以下专用方案组合应对：\n\n[嵌入表格未展开]\n\n\U0001F527
    典型组合：对于 128K 序列训练，常用 FlashAttention + 梯度检查点 + 序列并行 + CPU Offload。序列并行将 LayerNorm
    及残差连接的序列维度切分，结合张量并行，每卡激活进一步减半。Ring Attention 则利用多卡分摊整个长序列的注意力存储。\n\n✅ 没有单一银弹，必须根据序列长度、硬件和模型架构选择恰当的组合。\n\n---"

content:
  prompt: "\U0001F4C9 模型量化如何减少推理显存？INT8/INT4 的效果"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 模型量化通过降低权重和/或激活的数值精度（如从 FP16 到 INT8/INT4），直接减少每参数/每激活所占的字节数，从而成比例地压缩显存占用。推理时，最显著的是权重显存减少；配合
    KV Cache 量化，总显存需求可降至原来的 1/4 甚至 1/8。\n\n\U0001F522 量化效果（以 7B 模型为例）：\n\n- FP16（基准）：每参数
    2 字节，权重 14 GB，KV Cache（FP16，长 2048）约 1 GB，总显存约 15 GB+。\n\n- INT8 量化（权重 + 激活）：权重占
    7 GB，节省 50%。若 KV Cache 也量化为 INT8，KV Cache 降至 0.5 GB，总显存可减半。\n\n- INT4 量化（仅权重）：权重仅占
    3.5 GB，节省 75%。若配合 FP16 KV Cache，总显存可控制在 5–6 GB。若 KV Cache 也降至 4-bit，节省更惊人。\n\n-
    实际部署：在 24GB 显卡上，INT4 量化的 70B 模型（权重约 35 GB）可以勉强运行；而 FP16 需要 140 GB，完全不可能。\n\n\U0001F52C
    原理：量化将浮点数映射到低比特整数，例如 INT8 将 FP32 值线性映射到 [-127, 127] 范围，并存储缩放因子（scale）和零点（zero-point）。推理时，反量化回
    FP16/FP32 进行计算，或直接用整数运算（现代 GPU 支持 INT8 Tensor Cores）。显存节省等于每个参数的比特数比例。\n\n✅ 因此，量化是最直接有效的推理显存优化手段，4-bit
    量化往往能在不明显损失精度的情况下将大模型装入消费级显卡。\n\n---"

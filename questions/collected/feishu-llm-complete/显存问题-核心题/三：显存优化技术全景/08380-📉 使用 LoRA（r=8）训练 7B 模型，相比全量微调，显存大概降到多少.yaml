content:
  prompt: "\U0001F4C9 使用 LoRA（r=8）训练 7B 模型，相比全量微调，显存大概降到多少？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 全量微调 7B 模型 FP16 大约需要 80+ GB 显存，而 LoRA（r=8）+ FP16 基础权重通常只需约
    14–18 GB；若使用 QLoRA（4-bit 基础），更可降至 7–10 GB。降幅可达 80-90%。\n\n\U0001F9EE 详细估算：\n\n全量微调（FP16，Adam，batch=1,
    seq=2048）：\n\n- 基础权重（FP16）：14 GB\n\n- 梯度（FP16）：14 GB\n\n- 优化器状态（FP32 动量+方差）：56
    GB\n\n- 激活值（含注意力矩阵等）：约 10-15 GB\n\n- 总计约 95–100 GB\n\nLoRA (r=8, alpha=16) + FP16
    基础权重：\n\n- 基础权重（FP16）：14 GB（冻结）\n\n- LoRA 可训练参数：约 3-5 M（具体取决于应用到哪些层），FP32 约 12-20
    MB；梯度同量级；优化器状态约 40-80 MB。三项合计 < 150 MB。\n\n- 激活值：与全量相同（因为前向仍需计算完整激活），但可用梯度检查点降低，大约
    5-10 GB。\n\n- 总计约 14 + 0.15 + 5~10 ≈ 19–24 GB，实际因框架优化可能更低。在开启梯度检查点和 FlashAttention
    后，常可控制在 14-18 GB。\n\nQLoRA（4-bit 基础权重）：\n\n- 基础权重（NF4）：约 3.5 GB\n\n- LoRA 可训练参数同样极小\n\n-
    激活值：通过梯度检查点和 4-bit 存储进一步压缩\n\n- 总计约 3.5 + 0.15 + 3~5 ≈ 7-10 GB。\n\n✅ 结论：LoRA 让单卡
    24GB 消费级显卡也能玩转 7B 微调，QLoRA 更是把门槛降到 10GB 以下。\n\n---"

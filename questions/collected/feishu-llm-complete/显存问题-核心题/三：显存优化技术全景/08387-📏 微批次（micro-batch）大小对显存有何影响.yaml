content:
  prompt: "\U0001F4CF 微批次（micro-batch）大小对显存有何影响？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 micro-batch 大小直接决定了前向传播过程中产生的激活显存，几乎与 micro-batch
    成正比。增大 micro-batch 能提高 GPU 利用率，但会线性增加单卡激活占用，可能导致 OOM。\n\n\U0001F52C 详细分析：\n\n-
    在流水线并行或梯度累积中，一个 step 会被拆分成多个 micro-batch。每个 micro-batch 的输入形状为 [micro_bs, seq_len,
    hidden]。\n\n- 每层产生的中间激活（如注意力矩阵、FFN 输入输出等）大小与 micro_bs × seq_len 成正比。因此，单卡的激活峰值近似正比于同时驻留的
    micro-batch 数量和每个 micro-batch 的大小。\n\n- 在 1F1B 调度下，最大驻留 micro-batch 数通常为 min(PP
    深度, 总 micro-batch 数)。若 micro-batch 尺寸扩大，即使数量不变，激活显存也会线性增长。\n\n- 对训练吞吐而言，较大的 micro-batch
    能提升矩阵乘法效率，更充分利用 GPU。所以需要在显存允许的范围内取最大可能值。\n\n\U0001F3AF 实践建议：当显存不足时，首先应减小 micro-batch
    大小，并通过梯度累积保持全局 batch 不变。若已用极小值仍 OOM，则必须启用梯度检查点、序列并行或调整并行度。\n\n---"

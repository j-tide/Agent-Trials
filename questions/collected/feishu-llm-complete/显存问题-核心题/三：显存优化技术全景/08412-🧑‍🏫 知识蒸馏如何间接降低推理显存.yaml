content:
  prompt: "\U0001F9D1‍\U0001F3EB 知识蒸馏如何间接降低推理显存？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 知识蒸馏通过用大模型（教师）指导训练小模型（学生），获得一个参数量更少但性能接近的小模型。模型参数量下降直接减少权重显存，同时更小的
    hidden dim 和更少的层数也减少了 KV Cache 和激活显存，从而全面降低推理资源需求。\n\n\U0001F50D 间接路径：\n\n- 生成更小的学生模型：例如从
    70B 教师蒸馏出一个 7B 学生，参数量变为原来的 1/10，权重显存同比例下降。\n\n- 架构优化：蒸馏时可以刻意设计高效架构（如更窄的 hidden、更少层、MQA），进一步减少
    KV Cache 和计算量。\n\n- 不改变压缩方法：蒸馏本身不是压缩技术，但它产出的模型更小，可以再应用量化、剪枝等进一步压缩。\n\n\U0001F4CA
    例子：蒸馏后的 TinyLLaMA 1.1B 模型，推理时仅需约 2.2 GB (FP16) 或 0.6 GB (INT4)，相比原始 7B 显存下降 6
    倍以上。\n\n✅ 因此，知识蒸馏是一种从源头减少模型尺寸的方法，间接大幅降低推理显存，常与量化协同使用。\n\n---"

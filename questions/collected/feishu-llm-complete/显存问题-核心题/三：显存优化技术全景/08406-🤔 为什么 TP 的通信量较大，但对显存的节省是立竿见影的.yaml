content:
  prompt: "\U0001F914 为什么 TP 的通信量较大，但对显存的节省是立竿见影的？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 因为 TP 直接在层内切分权重张量，权重和激活都成倍减少，而通信虽频繁但每次数据量相对较小，且由高速
    NVLink 承载，因此显存节省“即时可见”，且不会因通信而回弹。\n\n\U0001F50D 立竿见影的原因：\n\n- 权重显存线性压缩：每张卡只需存储
    1/TP 的权重，这是最直接的节省。\n\n- 激活显存同样缩减：因为计算也切分，中间激活只保留了 1/TP 的大小。\n\n- 通信不影响显存：TP 通信传递的是部分计算结果（如部分输出或梯度），通信缓冲区虽会占用些许显存（通常几十
    MB），但远小于节省的权重大小。不像某些策略（如 offload）需要用显存放通信缓冲。\n\n- 没有额外常驻内存：TP 是纯分布式计算，没有产生新的持久化副本。计算完成后，通信用的临时张量立即释放。\n\n\U0001F4CA
    比较：\n\n假设 7B 模型，单卡权重 14 GB，TP=4 后显存即刻降至约 3.5 GB。通信增加的 All-Gather 和 All-Reduce
    仅占用几 MB 临时缓冲，对 14GB 权重来说忽略不计。因此 TP 被视为“最直接”的显存削减手段。通信量大是指它对卡间带宽要求高，可能成为延迟瓶颈，但不影响显存节约程度。\n\n---"

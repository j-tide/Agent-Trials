content:
  prompt: "\U0001F9E0 KV Cache 量化（KV8, KV4）是如何工作的？能省多少显存？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 KV Cache 量化将存储于显存中的键（Key）和值（Value）张量由 FP16 转换为低精度格式，如
    INT8（KV8）或 INT4（KV4），直接减少缓存容量，节省显存可达 2-4 倍，但可能轻微影响生成质量。\n\n\U0001F527 工作方式：\n\n-
    逐 token 量化：解码时，每生成一个新 token 的 K、V，在写入 Cache 前立即量化；读取时，反量化回 FP16 用于注意力计算。\n\n-
    校准：通常在校准数据集上统计 K、V 的分布，确定每通道或每张量的缩放因子和零点。也可使用动态量化。\n\n- 实现：主流推理框架（如 vLLM、TensorRT-LLM、llama.cpp）均支持
    KV Cache 量化。vLLM 中设置 --kv-cache-dtype fp8 即可使用 FP8 KV Cache。\n\n\U0001F4CA 节省效果：\n\n-
    FP16 → INT8：Cache 大小减半。例如 13B 模型、seq=4096、batch=1 时，KV Cache 从 ~6 GB 降至 ~3 GB。\n\n-
    FP16 → INT4：减至原来的 1/4。但此时精度损失较明显，通常需要配合精细量化方法。\n\n- 长文本场景：对于 128K 长序列，KV Cache
    可能占数十 GB，FP8 量化可将容量需求砍半，使单卡推理成为可能。\n\n⚠️ 质量影响：低精度 KV Cache 可能导致注意力分数偏差，从而影响生成质量。KV8
    通常几乎无损；KV4 需谨慎校准，适用性因模型而异。\n\n✅ 因此，KV Cache 量化是长文本推理必开的优化，几乎无代价地将显存容量翻倍。\n\n---"

content:
  prompt: "\U0001F522 用 TP=4 训练一个 7B 模型，每张卡权重显存大约变为多少？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 7B 模型 FP16 权重约 14 GB，TP=4 单卡权重显存降至约 3.5 GB。加上不可切分的轻量层和通信缓冲区，约
    3.5-4 GB。\n\n\U0001F9EE 详细计算：\n\n- 7B 参数，FP16 精度，总权重显存 = 7 × 10^9 × 2 字节 = 14
    GB。\n\n- 张量并行将绝大部分参数（>99%）切分到 4 张卡，单卡权重 = 14 GB / 4 = 3.5 GB。\n\n- 极少量的非并行层（如
    LayerNorm/RMSNorm、嵌入层）可能被复制或切分策略不同，但参数量极小（<0.1B），占用约 0.2 GB。\n\n- 外加 NCCL 通信缓冲区（约
    0.2-0.5 GB），实际单卡权重占用约 3.7-4 GB。\n\n\U0001F4CC 注意： 这仅权重的节省。优化器状态和激活也会相应被切分减少。TP=4
    时，优化器状态也降为约 1/4（Adam 状态原约 56 GB，降至 14 GB）。因此 TP 能线性削减单卡显存，非常高效。\n\n---"

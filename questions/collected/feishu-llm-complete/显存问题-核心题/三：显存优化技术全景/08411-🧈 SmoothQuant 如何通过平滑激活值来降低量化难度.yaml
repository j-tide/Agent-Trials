content:
  prompt: "\U0001F9C8 SmoothQuant 如何通过平滑激活值来降低量化难度？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 SmoothQuant 解决了 LLM 中激活值存在极端离群值（outliers）导致量化困难的问题。它通过数学等效变换，将激活值的量化难度“平滑”迁移到权重上，使得两者都能较容易地
    INT8 量化，同时保持精度。\n\n\U0001F52C 原理：\n\n- 在 Transformer 中，某些通道的激活值常出现非常大的离群值（比其他通道大
    100 倍以上），如果直接对激活值做 INT8 量化，会导致大量截断误差。而权重分布相对平坦，容易量化。\n\n- SmoothQuant 引入一个平滑因子
    s（每通道一个标量），对线性层做如下变换：\n\nY = XW = (X · diag(s)^{-1}) · (diag(s) · W)\n\n- 即把输入
    X 除以 s，权重乘以 s。数学上等价，但改变了量化难度。\n\n- 通过选择合适的 s（例如利用激活值的最大值），将离群值“转移”到权重上。因为权重量化更宽容，可以吸收这些不平滑，使变换后的
    X 更容易量化。\n\n- 最终，激活和权重都能平滑地量化为 INT8，且几乎没有精度损失。\n\n\U0001F4CA 效果：SmoothQuant 实现了权重
    INT8 + 激活 INT8 的全 INT8 推理，相比仅权重量化，进一步节省了激活显存和带宽，提升速度。在 OPT、LLaMA 等模型上效果显著。\n\n✅
    因此，SmoothQuant 是一种无损的“难度转移”技术，为全整数推理铺平了道路，是 INT8 推理的标配之一。\n\n---"

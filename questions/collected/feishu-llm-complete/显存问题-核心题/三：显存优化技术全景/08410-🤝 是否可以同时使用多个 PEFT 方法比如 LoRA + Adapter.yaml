content:
  prompt: "\U0001F91D 是否可以同时使用多个 PEFT 方法？比如 LoRA + Adapter？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 完全可以叠加，而且很多高效微调策略本身就是组合体（如 QLoRA = 量化 + LoRA）。不同 PEFT
    方法作用于模型的不同部分或不同层面，相互正交时能叠加收益，但需要注意训练冲突和推理延迟。\n\n\U0001F50D 常见组合与机制：\n\n- LoRA
    + Adapter\n可在 Transformer Block 中同时应用：LoRA 加在 Attention 权重上，Adapter 加在 FFN 之后或之前。两者不共享参数，梯度独立更新。这能进一步增加模型容量，但也会引入额外推理延迟（因为
    Adapter 串行），且总参数量比单一方法大。一般在需要高度多任务适应时使用，例如为每个任务既训练 LoRA 又训练 Adapter，然后动态组合。\n\n-
    LoRA + Prefix Tuning\nPrefix Tuning 在输入前加可学习前缀向量，LoRA 修改权重。两者可协同，但可能互相干扰，需要更细致的调参。通常不推荐同一任务同时用，除非有特殊设计。\n\n-
    QLoRA（4-bit 量化 + LoRA）\n最常见的成功组合，基础模型权重量化，LoRA 全精度训练。不是 PEFT 之间的组合，而是量化与 PEFT
    的结合。\n\n- BitFit + LoRA\nBitFit 只训 bias，LoRA 训低秩权重。它们可以共存，但因 bias 参数极少，带来的增益有限，更多是实验性质。\n\n⚠️
    注意事项：\n\n- 多 PEFT 会增大可训练参数量，可能削弱显存节省效果。\n\n- 推理时，未合并的 LoRA 可重参数化，但 Adapter 不能，会额外延迟。\n\n-
    梯度可能冲突，需谨慎设置学习率。\n\n✅ 因此，组合 PEFT 是完全可行的，但通常是分任务叠加（不同任务用不同方法）或为了特定需求而叠加，日常使用仍推荐单一方法，简洁高效。\n\n---"

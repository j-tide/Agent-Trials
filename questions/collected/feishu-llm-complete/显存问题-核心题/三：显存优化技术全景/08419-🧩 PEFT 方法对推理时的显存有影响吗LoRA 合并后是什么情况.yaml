content:
  prompt: "\U0001F9E9 PEFT 方法对推理时的显存有影响吗？LoRA 合并后是什么情况？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 PEFT 方法本身在推理时显存影响极小，尤其是 LoRA 可以合并到基础权重中，完全消除额外显存和计算，合并后的模型与原模型结构完全一致，显存占用相同。\n\n\U0001F50D
    不同 PEFT 方法的推理显存情况：\n\n- LoRA（未合并）\n推理时需同时加载基础权重和 LoRA 矩阵，LoRA 矩阵极小（几十 MB），显存增加可忽略。但计算时需要额外乘法，略微增加延迟。\n\n-
    LoRA（合并）\n将 LoRA 矩阵融入原权重：W' = W + B @ A。合并后的新权重 W' 与原 W 形状相同，推理时完全等价于一个同尺寸的标准模型，显存零增加，速度零影响。这是
    LoRA 最大的工程优势。几乎所有推理框架都支持自动合并。\n\n- Adapter\n推理时串行在原模型中，不能合并，会永久增加少量参数（几十到几百 MB）和计算延迟。显存增量较小，但在大规模服务中多
    Adapter 可能积累。\n\n- Prefix Tuning\n推理时需要缓存前缀的 KV Cache，额外占用显存。但通常前缀极短（10-100 token），增加的
    KV Cache 很小，几乎不影响。然而，前缀会减少可用上下文长度。\n\n\U0001F4CA LoRA 合并后对比：\n\n[嵌入表格未展开]\n\n✅
    因此，PEFT 方法对推理显存的影响总体极低，LoRA 合并后更是完全无额外开销，极其适合生产部署。\n\n---"

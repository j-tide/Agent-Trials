content:
  prompt: "\U0001F9EE 为什么注意力矩阵的显存是 O(L²)，而其他激活值是 O(L)？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 注意力机制需要计算并存储形状为 [batch, heads, L, L] 的注意力分数矩阵和 softmax
    结果，其元素数与序列长度 L 的平方成正比；而其他激活（如 Q、K、V、FFN 输出）的形状是 [batch, L, hidden]，仅随 L 线性增长。\n\n\U0001F4D0
    数学表达：\n\n- 注意力分数矩阵 S = Q × K^T，Q 形状 [B, H, L, d]，K 形状 [B, H, L, d]，相乘得到 [B, H,
    L, L]。存储该矩阵需要 B * H * L * L 个元素，所以是 O(L²)。\n\n- softmax 后的 P 同样 O(L²)。\n\n- 其他激活：例如
    Q、K、V 本身、FFN 的中间输出 [B, L, 4D]、LayerNorm 前后的 hidden states [B, L, D]，它们都是沿序列维度为
    L，另一维度固定，因此存储量 O(L)。\n\n\U0001F52C 为什么注意力是二次？ 因为每个 token 要与所有 token 计算相关性，所以产生一个
    L×L 的矩阵。这是 Transformer 的核心特性，也是长文本的瓶颈。FlashAttention 通过不显式存储这个矩阵解决了显存瓶颈，但仍需进行
    O(L²) 次计算。\n\n---"

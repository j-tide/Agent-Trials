content:
  prompt: "\U0001F3AF 什么是“选择性梯度检查点”？比全量检查点有什么优势？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 选择性梯度检查点是指仅对部分操作或层设置检查点，而不是对每个 Block 都重计算。它允许在显存节省和计算开销之间更精细地权衡，避免不必要的重计算。\n\n\U0001F50D
    实现方式：\n\n- 在全量检查点中，每个 Transformer Block 都被标记为检查点段，前向时丢弃块内所有中间激活，反向时重算整个 Block。\n\n-
    选择性检查点则根据算子或层的“激活大小 vs 计算成本”来决定是否保留激活。例如：\n\n- PyTorch 提供 torch.utils.checkpoint.checkpoint
    的区域控制，可通过 use_reentrant=False 实现细粒度；或使用 torch.utils.checkpoint.create_selective_checkpoint。\n\n\U0001F4CA
    优势：\n\n- 减少额外计算：全量检查点增加 20-30% 计算，选择性可能只增加 10-15%。\n\n- 显存节省接近全量：因为注意力矩阵等大激活仍被丢弃，而小激活保留，节省效果略低但可接受。\n\n-
    更灵活的显存-速度平衡：可根据硬件特点（如计算富余、显存紧张）调整。\n\n✅ 因此，选择性梯度检查点适合在显存压力不大、或某些层重计算代价过高的场景，避免“一刀切”。\n\n---"

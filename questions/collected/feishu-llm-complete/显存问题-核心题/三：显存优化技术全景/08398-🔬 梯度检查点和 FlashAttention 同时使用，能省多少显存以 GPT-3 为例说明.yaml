content:
  prompt: "\U0001F52C 梯度检查点和 FlashAttention 同时使用，能省多少显存？以 GPT-3 为例说明。"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 两者协同可节省大量显存：梯度检查点消除绝大多数中间激活，FlashAttention 避免生成 O(n²)
    的注意力矩阵，总激活显存从原来的数十 GB 降至数 GB。以 GPT-3 (175B) 为例，在序列长度 2048、batch=1 时，激活显存从 ～60
    GB 降至 ～2-3 GB。\n\n\U0001F4D0 GPT-3 具体估算：\n\n- GPT-3 结构：96 层，hidden=12288，96 个注意力头，头维度
    128。\n\n- 标准训练（无优化）时，每层激活主要包括：\n\n- 仅用梯度检查点：每层只保留输入 hidden states（~0.14 GB），其余丢弃。反向重计算每层时，仍需临时生成注意力矩阵。激活显存降至约
    13.5 GB (96 × 0.14 GB)，但重计算时注意力矩阵依然会出现峰值（临时 O(n²) 矩阵），可能导致显存尖峰。\n\n- 仅用 FlashAttention：不存储注意力分数矩阵，激活显存减少
    2×0.75 GB/层。每层激活剩下约 0.5 GB，96 层约 48 GB。仍然很高。\n\n- 梯度检查点 + FlashAttention：梯度检查点将每层保留的激活减少为输入
    hidden states（0.14 GB），而 FlashAttention 确保重计算时不再产生 O(n²) 的注意力矩阵，仅需 Q,K,V 和输出，无大矩阵驻留。因此每层激活峰值仅约
    0.14 GB（输入）+ 重计算时的 Q,K,V（~0.14 GB，临时），总显存占用约 0.28 GB/层，96 层约 27 GB，但得益于重计算段内释放，实际平均驻留激活仅需存储每段输入，峰值大约为几个层的激活。若将每个
    Transformer Block 作为一个检查点段，驻留激活仅为该 Block 输入（~0.14 GB）加上当前 Block 重计算时的临时激活（~0.14
    GB QKV 等），全局激活峰值可控制在 2-3 GB 左右。\n\n✅ 因此，两者联手使得 GPT-3 级别的训练成为可能，从 >100 GB 降至几 GB，消解了注意力矩阵的二次显存噩梦，是长序列训练的标配。\n\n---"

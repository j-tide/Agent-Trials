content:
  prompt: "\U0001F9E0 梯度检查点的原理是什么？用多少计算换多少显存？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 梯度检查点（Gradient Checkpointing）的核心思想是在前向传播时丢弃大部分中间激活，反向传播时再通过额外的前向计算重新生成它们，从而用大约
    20-30% 的额外计算量，换取 50-80% 的激活显存节省。\n\n\U0001F52C 原理：\n\n- 训练时，反向传播需要用到前向传播产生的中间结果（即激活值）来计算梯度。通常这些激活会全部保留在显存中，等待反向使用。\n\n-
    梯度检查点将网络分成若干段（checkpoint 段）。在前向时，只保留每一段输入的激活（即检查点），而段内各层的中间激活全部丢弃。\n\n- 反向传播到该段时，利用保留的检查点输入，重新执行该段的前向计算，即时生成所需的中间激活，然后再计算梯度。这样，同一段内的激活峰值只存在一个段的大小，而不是整个网络。\n\n\U0001F4CA
    计算-显存权衡：\n\n- 计算增量：每个检查点段需要重新前向一次。若将模型均匀分为 √N 个段（最优策略），则额外计算量约为 1/√N。实际通常将每个 Transformer
    Block 作为一个检查点，则额外前向次数等于 Block 数（但仅重计算激活，不更新参数），额外计算量约为 20-30%。\n\n- 显存节省：原本需要存储所有
    Block 的全部激活，现在只需存储每个 Block 的输入（少量），中间激活几乎全部释放。激活显存可降至原来的 O(√N) 或更低，节省 50-80% 很常见。\n\n✅
    因此，梯度检查点是用可控的计算代价，大幅压缩激活显存，是长序列或大 batch 训练不可或缺的技术。\n\n---"

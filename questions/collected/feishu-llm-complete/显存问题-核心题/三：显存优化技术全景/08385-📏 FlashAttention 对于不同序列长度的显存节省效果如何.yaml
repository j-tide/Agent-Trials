content:
  prompt: "\U0001F4CF FlashAttention 对于不同序列长度的显存节省效果如何？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 序列长度越长，节省越惊人：当 N=512 时节省约 5-10 倍注意力内存；N=4096 时节省可达
    40 倍；N=32K 时甚至百倍以上，直接决定了长上下文训练是否可能。\n\n\U0001F4C8 具体分析（假设 batch=1, heads=32, FP16）：\n\n-
    标准注意力：存储注意力分数矩阵 S [N, N] 和 softmax P [N, N]，显存 ≈ 2 * heads * N * N * 2 字节。\n\n-
    FlashAttention：无需存储这两个矩阵，额外显存仅保留 Q、K、V 及少量统计量，与 N 成线性关系，可忽略不计（相比其他激活）。\n\n- 比例：节省的注意力矩阵部分几乎被完全剔除。N=2048，标准注意力分数矩阵约
    32 * 2048² * 2 ≈ 0.5 GB（单个矩阵），两个矩阵共 1 GB，而 FlashAttention 几乎为 0。整体激活显存中，注意力贡献从主导变为可忽略。\n\n\U0001F4CA
    实际效果（参考）：\n\n[嵌入表格未展开]\n\n可见，对于 32K 序列，标准注意力仅分数矩阵就需要 128 GB，完全不可行。FlashAttention
    使之成为可能。\n\n✅ 所以，FlashAttention 的显存节省对短序列温和，对长序列却是革命性的，是实现 128K 训练的核心技术。\n\n---"

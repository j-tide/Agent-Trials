content:
  prompt: "\U0001F9E0 在 PEFT 微调中，激活值显存还是主要瓶颈吗？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 在 PEFT 微调中，基础模型权重和可训练参数已高度压缩，激活值显存通常重新成为主要瓶颈，尤其是在长序列、大
    batch 情况下。优化器状态和梯度的压力大幅减小，显存战场转移到了激活和 KV Cache。\n\n\U0001F50D 原因：\n\n- PEFT 冻结主干，只训练少量参数，优化器和梯度显存从数十
    GB 降至几十 MB。\n\n- 但前向传播依然需要计算完整的 Transformer，因此中间激活（包括注意力矩阵、FFN 输入输出等）仍然存在。如果不用梯度检查点或
    FlashAttention，激活会占据大量显存。\n\n- 例如，7B LoRA 微调，基础权重 14 GB，激活若序列 2048、batch=1，激活约
    10 GB，超过了权重！因此，激活立刻成为主要大头。\n\n⚙️ 应对方法：\n\n- 必须开启 梯度检查点，将激活显存降至几 GB。\n\n- 使用 FlashAttention
    消除注意力矩阵。\n\n- 对于超长序列，引入 序列并行 或 激活卸载。\n\n\U0001F4CA 实践配置：\n\n- 7B QLoRA 微调，seq=2048，开梯度检查点+FlashAttention，激活约
    2-3 GB，加上基础权重 3.5 GB，总 6-7 GB，此时激活占比仍然近半。\n\n- 序列更长（8K），激活升至 8-10 GB，即使 QLoRA
    也显存吃紧，必须进一步优化激活。\n\n✅ 因此，PEFT 微调将显存矛盾从“模型状态”转向“激活值”，必须配合激活优化技术才能实现高效训练。\n\n---"

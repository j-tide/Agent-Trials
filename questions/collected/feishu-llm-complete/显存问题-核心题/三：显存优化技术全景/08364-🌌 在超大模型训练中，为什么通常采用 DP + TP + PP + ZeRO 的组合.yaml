content:
  prompt: "\U0001F30C 在超大模型训练中，为什么通常采用 DP + TP + PP + ZeRO 的组合？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 单一并行策略无法同时满足超大模型的显存、通信和扩展性要求。混合并行通过各取所长：TP 解决层内超大张量，PP
    跨节点分配层，ZeRO 分片模型状态，DP 提供线性扩展，共同突破规模瓶颈。\n\n\U0001F50D 各角色分工：\n\n- TP（张量并行）：切分层内矩阵，大幅降低单卡权重和激活，但通信密集，受限于节点内高速互联。\n\n-
    PP（流水线并行）：将模型分层到不同节点，通信量小（仅传递激活），适合跨机扩展，但引入气泡，需要配合 micro-batch 优化。\n\n- ZeRO（数据并行的升级）：在
    DP 组内分片优化器、梯度和参数，用通信换单卡显存，扩展性极佳，适合跨机大规模并行。\n\n- DP（数据并行）：在以上策略基础上进一步扩展吞吐，处理更多数据。\n\n⚙️
    协同模式：\n\n例如训练 GPT-4 规模模型（>1T），集群数千卡。典型配置：\n\n- 每个节点内 8 卡使用 TP=8 切分单个 Transformer
    层。\n\n- 多个节点组成 PP 组，将 100+ 层切到多个节点，用 PP 连接。\n\n- 所有节点同时属于一个大的 ZeRO-3 数据并行组，模型状态全局分片。\n这种
    DP × TP × PP 的 3D 并行，结合 ZeRO 状态分片，既能放下巨大模型，又具有良好的扩展性。\n\n\U0001F4C8 没有 ZeRO 的话，DP
    每卡要存完整模型状态，不可行；没有 TP 的话，单卡激活容不下；没有 PP 的话，跨机通信带宽扛不住。 因此混合并行成为唯一解。\n\n✅ 所以，DP+TP+PP+ZeRO
    是当前千亿/万亿参数模型训练的工业标准，各策略互补，实现规模与效率的统一。\n\n---"

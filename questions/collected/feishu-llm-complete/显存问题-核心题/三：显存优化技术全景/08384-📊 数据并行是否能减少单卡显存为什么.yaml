content:
  prompt: "\U0001F4CA 数据并行是否能减少单卡显存？为什么？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 结论：标准数据并行（DDP）不能减少单卡显存，每张卡依然需要完整的模型、优化器和激活。显存压力没有减轻，只是通过多卡并行提高了总吞吐量。\n\n\U0001F50D
    原理：\n\n- 在数据并行中，每张 GPU 拥有模型参数的完整副本、完整的优化器状态以及各自的输入数据分片。前向/反向计算独立进行，仅在反向传播后对梯度做一次
    All-Reduce，然后每张卡用平均梯度更新自己的完整模型。\n\n- 因为每张卡都存储了同样的权重、梯度和优化器，单卡显存占用与单卡训练完全相同。唯一可能增加的显存是通信缓冲区，但那微不足道。\n\n-
    因此，数据并行解决的是“训练速度”问题，而非“单卡装不下”的问题。当模型大到单卡放不下时，必须引入模型并行（如 ZeRO、TP、PP）来分片模型。\n\n✅
    所以，如果面临单卡显存不足，不能指望增加数据并行卡数来解决，必须采用张量并行、流水线并行或 ZeRO 分片等策略。\n\n---"

content:
  prompt: "\U0001F9EC 序列并行（SP）主要减少哪部分显存？通常和哪些并行策略结合？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 序列并行（Sequence Parallelism, SP）主要减少激活显存中的大张量，特别是 LayerNorm
    和 Dropout 前后的冗余激活副本，通常与张量并行（TP）结合使用，进一步缓解长序列训练的内存压力。\n\n\U0001F52C 具体作用：\n\n-
    在标准的 Transformer 中，有些区域（如 LayerNorm、Dropout）对整个序列维度进行操作，张量并行不能切分它们，其输入/输出需要在所有
    TP 卡间复制，造成激活冗余。\n\n- 序列并行将这些不可切分区域的序列维度也切分到不同卡上。例如，LayerNorm 的输入 [batch, seq,
    hidden] 沿着 seq 维切分成 [batch, seq/TP, hidden]，每张卡只计算自己那部分。这样就消除了该区域的重复激活，节省的显存大致与
    TP 度相当。\n\n- 特别适用于长序列场景（如 32K-128K tokens），因为激活大小与序列长度成正比，SP 可线性减少这部分开销。\n\n\U0001F517
    结合策略：\n\n- SP + TP：是标准组合，Megatron-LM 中就用 SP 代替 TP 中的部分数据复制，以支持更长上下文训练。\n\n- 也可与
    PP 和 DP 结合，在更复杂的 3D 并行中进一步压缩激活峰值。\n\n✅ 因此，序列并行通过切分序列维度，消除层归一化等区域的多卡激活冗余，有效降低长序列训练时的激活显存瓶颈。\n\n---"

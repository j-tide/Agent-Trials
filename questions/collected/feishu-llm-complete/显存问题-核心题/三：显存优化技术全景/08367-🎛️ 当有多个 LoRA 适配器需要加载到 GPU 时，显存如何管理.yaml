content:
  prompt: "\U0001F39B️ 当有多个 LoRA 适配器需要加载到 GPU 时，显存如何管理？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 多个 LoRA 适配器可以常驻或动态加载。常驻模式将多个适配器权重放在 GPU，显存随适配器数量线性增长；动态加载则只在需要时将其换入
    GPU，结合 CPU/磁盘存储，可支持数千个适配器而显存开销极小。\n\n\U0001F527 管理模式：\n\n- 常驻模式\n所有 LoRA 适配器都加载到
    GPU 显存中。假设每个适配器 30 MB，100 个适配器占用 3 GB。对于 24GB 卡，基础模型 7B FP16 占 14 GB，剩余空间足够加载几十到上百个。常驻模式下切换适配器无开销，但数量受显存限制。\n\n-
    动态加载模式（LoRA 交换）\n框架（如 vLLM、Punica、S-LoRA）实现 LoRA 权重在 CPU 和 GPU 之间的分页管理。仅有当前请求需要的
    LoRA 适配器被加载到 GPU，闲置的放回 CPU。当请求到来，调度器将对应 LoRA 块换入，完成计算后可换出。通过高效的 I/O 和 CUDA 图，切换延迟可控制在几毫秒内。\n\n-
    适配器共享与合并\n如果多个适配器共享部分基础矩阵，可合并计算以减少显存冗余。此外，一些系统支持将多个 LoRA 动态融合到基础权重中，实现 batch 并发处理。\n\n\U0001F4CA
    实际能力：\n\n- 基于分页和 swap 的系统如 S-LoRA 可以在单卡上同时服务 1000+ 个 LoRA 适配器，每个适配器平均占用 GPU 显存仅几
    MB（热数据），其他常驻 CPU，整体显存占用保持在可控范围内。\n\n✅ 因此，通过动态管理，多 LoRA 场景下的显存不再是瓶颈，系统可以为成千上万的个性化模型提供服务。\n\n---"

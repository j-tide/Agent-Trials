  prompt: "\U0001F19A 量化训练（QAT）和训练后量化（PTQ）在显存上的区别？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 QAT 在训练过程中模拟量化操作，需要存储梯度、优化器状态，显存占用远高于 PTQ；PTQ 则是在预训练模型上直接转换，无需反向传播，因此显存需求极低，可以单卡甚至
    CPU 完成。\n\n\U0001F50D 显存差异：\n\n- QAT（量化感知训练）\n\n- PTQ（训练后量化）\n\n\U0001F4CA 对比表：\n\n[嵌入表格未展开]\n\n✅
    因此，对于 LLM，PTQ 是唯一实际可行的量化方式，QAT 受显存限制基本不在大模型上使用。\n\n---"

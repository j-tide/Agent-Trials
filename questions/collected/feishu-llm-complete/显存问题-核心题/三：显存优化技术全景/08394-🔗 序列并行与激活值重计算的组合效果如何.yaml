content:
  prompt: "\U0001F517 序列并行与激活值重计算的组合效果如何？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 序列并行 (SP) 切分序列维度，激活值重计算 (如梯度检查点) 减少时间维度的激活驻留，两者组合可正交地降低单卡激活显存，效果近似相乘：序列长度降
    1/N，激活驻留降 1/K，单卡激活可降至原来的 1/(N*K) 量级。\n\n\U0001F50D 工作机理：\n\n- 序列并行将激活张量（如 LayerNorm
    输出、Dropout 输入）在 seq 维度上切成 N 份（N=TP 度），每张卡只存储 seq/N 长度的激活，激活内存直接除以 N。\n\n- 梯度检查点则让每卡在反向时重计算部分激活，从而在时间上减少了同时驻留的激活层数，将激活内存降至约
    O(√L) 或更少（L 为层数）。\n\n- 两者作用在不同维度（序列长度、模型深度），因此可以叠加，且互不干扰。最终单卡激活峰值可降至原来的 1/(N *
    C)，其中 C 是检查点节省系数。\n\n\U0001F4CA 实测效果：在训练 65B 模型、序列长度 4096、TP=8 且开启序列并行和逐 Block
    梯度检查点时，单卡激活峰值比无优化时减少超过 10 倍。这允许使用更大 batch 或更长序列。\n\n✅ 因此，序列并行与重计算是超长序列训练的黄金搭档，分别从宽度和深度压缩激活。\n\n---"

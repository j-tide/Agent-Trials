content:
  prompt: "⏳ 流水线并行的气泡对显存有影响吗？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 气泡（pipeline bubble）本身不直接增加显存占用，但为了减少气泡而增加 micro-batch
    数量，会间接增加激活驻留，从而增大显存压力。因此，气泡与显存之间存在间接权衡。\n\n\U0001F50D 机制：\n\n- 气泡是指流水线中设备空闲等待的时间，由前后依赖导致。气泡大小与
    micro-batch 数量 M 和 PP 深度有关，气泡率 ≈ (P-1)/M。\n\n- 为了降低气泡，通常会增大 M。但在 1F1B 调度下，更多 micro-batch
    意味着更多并发激活需要存储（直到 min(M,P) 上限）。当 M 超过 P 时，每张卡上同时存在的激活数量会稳定在 P（PP 深度），不再增长；但若 M
    过大，激活峰值已达平台，显存不再随 M 增加。但若原 M 很小，增加 M 会增加激活峰值。\n\n- 因此，气泡大 → 我们想增大 M → 激活显存可能上升。但通过合理的
    1F1B 调度，可以控制峰值在 P 个 micro-batch 的水平。所以气泡对显存的直接影响有限，主要是间接地通过调节 M 来影响。\n\n⚙️ 实践中：若显存紧张，可容忍更大气泡（减少
    M），以降低激活峰值；反之若显存充裕，可增大 M 减少气泡，提升吞吐。\n\n---"

content:
  prompt: "\U0001F19A Adapter 与 LoRA 在训练显存占用上有什么区别？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 Adapter 通常在每个 Transformer 块中插入可训练的小型瓶颈层，LoRA 则是将可训练的低秩分解直接加在原始权重上。两者都可冻结主干，但
    Adapter 引入额外模块且需按顺序计算，训练显存和推理时延比 LoRA 稍大。\n\n\U0001F50D 显存占用对比：\n\n- Adapter（典型结构）\n在每个
    LayerNorm 后加两个全连接层（下投影→激活→上投影），参数量 2 × d × bottleneck_dim。bottleneck_dim 通常 64-256。总参数量可能比
    LoRA 大（例如 7B 模型 Adapter 约 100 M+ 参数）。\n因为 Adapter 串行插入，训练时需存储其输入输出和梯度，激活显存略增加；参数本身也需优化器状态，显存占用比
    LoRA 高数倍。\n\n- LoRA\n如前所述，参数量极小（~15 M），不影响主干前向流程，只在最后合并。无额外激活开销，训练显存几乎只多出 LoRA
    参数和优化器状态。\n\n\U0001F4CA 实际差异：\n\n- 7B 全量微调 ~95 GB；Adapter 微调（冻结主干，训练 Adapter）约需
    25-35 GB；LoRA 仅需 14-18 GB。\n\n- LoRA 在推理时可以重参数化到原权重中，不增加推理计算，而 Adapter 会带来轻微延迟。\n\n✅
    所以，LoRA 在显存和推理效率上通常优于 Adapter，是更流行的 PEFT 方法。\n\n---"

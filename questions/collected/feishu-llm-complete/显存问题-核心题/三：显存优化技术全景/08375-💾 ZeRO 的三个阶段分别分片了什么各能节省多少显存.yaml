content:
  prompt: "\U0001F4BE ZeRO 的三个阶段分别分片了什么？各能节省多少显存？"
answer:
  mode: rubric
  reference_answer: "ZeRO（Zero Redundancy Optimizer）将训练中的模型状态（优化器状态、梯度、模型参数）在数据并行组内分片，消除冗余。三个阶段逐级深入：\n\n[嵌入表格未展开]\n\n\U0001F9EE
    具体估算（7B 模型，FP16，Adam，假设数据并行度 N=8）：\n\n- 原生 DP 单卡：权重 14 GB + 梯度 14 GB + 优化器 56
    GB + 激活 ≈ 84 GB+。\n\n- ZeRO-1：优化器分片后 56/8=7 GB，其余不变，总显存 ≈ 14+14+7+激活 ≈ 35 GB+激活。\n\n-
    ZeRO-2：梯度假分片 14/8=1.75 GB，总 ≈ 14+1.75+7+激活 ≈ 22.75 GB+激活。\n\n- ZeRO-3：参数分片 14/8=1.75
    GB，优化器和梯度也相应进一步减少，总 ≈ 1.75+1.75+7+激活 ≈ 10.5 GB+激活。\n\n✅ 节省比例：每阶段显存降至原来的约 1/(N)（取决于分片程度），使得千亿参数模型训练成为可能。\n\n---"

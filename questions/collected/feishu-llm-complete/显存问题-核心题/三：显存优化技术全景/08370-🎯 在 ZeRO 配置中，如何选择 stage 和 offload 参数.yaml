answer:
  mode: rubric
  reference_answer: "选择 ZeRO 阶段（stage）和 offload 参数，本质上是在显存节省、通信开销、训练速度三者之间找平衡点。我的决策流程如下：\n\n\U0001F5FA️
    决策路线图：\n\n- 先看单卡能否装下完整模型（权重+优化器+梯度）\n\n- 考虑梯度是否成为瓶颈\n\n- 权重也装不下或需要更大 batch\n\n-
    是否启用 Offload（CPU/NVMe）\n\n\U0001F4CA 经验速查表：\n\n[嵌入表格未展开]\n\n\U0001F4A1 我的原则：能用
    ZeRO-2 就不用 ZeRO-3，能不用 offload 就尽量不用，因为 offload 会引入 PCIe 瓶颈。但在资源受限时，offload 就是救命稻草。\n\n---"

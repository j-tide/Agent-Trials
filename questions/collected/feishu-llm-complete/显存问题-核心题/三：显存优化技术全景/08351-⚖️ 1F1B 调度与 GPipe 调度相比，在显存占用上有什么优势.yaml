content:
  prompt: "⚖️ 1F1B 调度与 GPipe 调度相比，在显存占用上有什么优势？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 1F1B（One Forward One Backward）调度通过交错执行前向和反向，限制了同时驻留在显存中的激活数量，从而比
    GPipe 的“全前向再全反向”显著降低激活显存峰值。\n\n\U0001F4CA 对比分析：\n\n- GPipe 调度：\n先完成所有 micro-batch
    的前向传播，存储全部中间激活，然后再进行反向。假设有 M 个 micro-batch，PP 深度为 P，则某设备需要同时存储 M 个 micro-batch
    的激活（每个经过该设备层的激活）。激活峰值 ≈ M × 单 micro-batch 激活大小。M 越大，显存占用极高，为了减少显存常被迫减少 micro-batch
    数量，但会增大流水线气泡。\n\n- 1F1B 调度：\n前向执行一段时间后，尽早开始反向。控制前向和反向交替，保证每个设备上同时存在的激活数量上限仅为 min(M,
    P) 个 micro-batch 的激活。通常 M <= P 时，激活峰值恒定，不再随 M 线性增长。因此可以使用更大 M 来减少气泡，而不会撑爆显存。这就是
    1F1B 的核心显存优势。\n\n\U0001F4C8 结果：在相同 micro-batch 数下，1F1B 的显存峰值远小于 GPipe；在相同显存限制下，1F1B
    允许更多 micro-batch，提高流水线效率。因此现代 PP 训练几乎都使用 1F1B 或其变体（如 interleaved 1F1B）。\n\n---"

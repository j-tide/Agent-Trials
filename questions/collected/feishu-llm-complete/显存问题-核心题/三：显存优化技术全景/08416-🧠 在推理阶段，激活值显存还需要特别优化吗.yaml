content:
  prompt: "\U0001F9E0 在推理阶段，激活值显存还需要特别优化吗？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 推理时没有反向传播，因此不存在训练中的梯度、优化器和中间激活保留问题，激活显存压力大幅减轻。但长序列推理时，KV
    Cache** 取代激活成为主要显存瓶颈，而非传统中间激活。所以推理阶段通常不专门优化激活，而是优化 KV Cache。**\n\n\U0001F50D 区别：\n\n-
    训练激活：前向产生的所有中间结果（QKV、注意力矩阵、FFN 输出等）都需为反向保留，占用巨大。\n\n- 推理前向：仅需产生输出，中间结果用后即扔，不需要长期保存。因此激活显存很小，仅需当前层的少量临时缓冲区。\n\n-
    推理新瓶颈：KV Cache 存储历史 Key、Value，随序列长度线性增长，且常驻显存，必须优化。\n\n\U0001F4CC 推理阶段的显存优化聚焦于：\n\n-
    使用 GQA/MQA 减少 KV 头数。\n\n- KV Cache 量化（INT8/FP8）。\n\n- PagedAttention 管理内存分配。\n\n-
    共享前缀等。\n\n✅ 因此，推理时几乎不需要关注激活显存，重点在 KV Cache。\n\n---"

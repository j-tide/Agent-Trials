content:
  prompt: "\U0001F310 为什么 PEFT 方法在分布式训练中通信量也更小？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 PEFT（参数高效微调）如 LoRA、Adapter 只训练极少参数，分布式数据并行中仅需同步这些小参数的梯度，而不是整个模型的梯度，因此通信量断崖式下降。\n\n\U0001F50D
    具体原理：\n\n- 标准数据并行（DDP）需要在每次反向传播后对所有参数的梯度进行 All-Reduce，通信量 = 2 × 参数量（FP16 下 2 字节/参数）。\n\n-
    PEFT 冻结基础模型，基础模型不产生梯度，无需通信。只有可训练的 adapter/LoRA 参数产生梯度，参数量仅为全量的千分之一或万分之一，通信量同比例下降。\n\n-
    例如 7B LoRA 微调，需通信的参数仅约 15 M，而全量微调需 7 B，通信量差距 ≈ 500 倍。\n\n\U0001F4CA 附加好处：\n\n-
    通信缓冲区减少，显存占用进一步降低。\n\n- 分布式扩展性更强，即使在带宽较低的网络上也能高效训练。\n\n✅ 因此，PEFT 方法不仅省单卡显存，还能在分布式环境中大幅降低通信开销，是低成本大模型微调的理想选择。\n\n---"

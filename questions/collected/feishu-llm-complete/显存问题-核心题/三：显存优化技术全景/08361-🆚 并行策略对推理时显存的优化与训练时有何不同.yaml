content:
  prompt: "\U0001F19A 并行策略对推理时显存的优化与训练时有何不同？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 训练时的并行策略重点在于降低权重、梯度、优化器和激活的全套显存，而推理时只需考虑权重和KV Cache，因此优化目标和策略组合有明显差异。\n\n\U0001F50D
    关键区别：\n\n[嵌入表格未展开]\n\n\U0001F4CC 总结：训练并行策略是为了“跑起来”，推理并行策略是为了“跑得快且省”。推理优化更侧重减少单个请求的显存占用和带宽消耗，采用量化与
    KV Cache 优化，而非复杂的分布式并行。\n\n- ZeRO-1：将优化器状态分片到 DP 各卡，通信增加 Reduce-Scatter（优化器状态更新），但节省优化器显存（约
    4×）。\n\n- ZeRO-2：加梯度分片，通信增加梯度 Reduce-Scatter，进一步节省梯度显存。\n\n- ZeRO-3：加参数分片，前向/反向需
    All-Gather 参数，通信增加，但将模型参数显存分片，单卡只需 1/DP 的权重。\n通信增量从 DP 的 All-Reduce 梯度，变成 All-Gather
    参数 + Reduce-Scatter 梯度，通信量大约是原来的 1.5 倍。而显存却可以降为原来的 1/DP。"

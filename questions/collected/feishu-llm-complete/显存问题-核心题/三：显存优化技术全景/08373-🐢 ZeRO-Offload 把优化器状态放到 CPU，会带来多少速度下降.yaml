content:
  prompt: "\U0001F422 ZeRO-Offload 把优化器状态放到 CPU，会带来多少速度下降？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 将优化器状态卸载到 CPU 会导致训练速度下降，但下降幅度取决于 CPU 计算能力、PCIe 带宽以及是否与计算重叠。通常速度下降
    20%-50%，极端情况可能更多。\n\n\U0001F50D 主要原因：\n\n- 数据搬运延迟：每一步更新时，需要将梯度从 GPU 搬运到 CPU，在
    CPU 上执行优化器步骤，再将更新后的参数搬回 GPU。此过程需要经过 PCIe 总线，带宽远低于 HBM。\n\n- CPU 计算瓶颈：Adam 等优化器涉及大量逐元素操作，若
    CPU 核心不足或向量化差，会成为瓶颈。\n\n- 重叠优化：DeepSpeed ZeRO-Offload 设计了高效的 CPU 优化器内核，并尽量将数据传输与
    GPU 计算重叠。例如在反向传播时，梯度已分批传输到 CPU 并开始优化器步骤，同时 GPU 继续计算后续层。这样可将数据移动隐藏起来，减少速度损失。\n\n\U0001F4CA
    实测数据：在 A100 + 双路 Xeon 上，开启 ZeRO-Offload 训练 13B 模型，相比纯 GPU ZeRO-2，吞吐量下降约 20%-30%。如果
    CPU 较弱或模型极大导致 PCIe 打满，可能降速 50% 以上。但优势是可以在一张 24GB 显卡上训练数十 B 的模型。\n\n✅ 因此，ZeRO-Offload
    用适度的速度换取跨数量级的显存扩展，是“小卡训大模型”的关键技术。\n\n---"

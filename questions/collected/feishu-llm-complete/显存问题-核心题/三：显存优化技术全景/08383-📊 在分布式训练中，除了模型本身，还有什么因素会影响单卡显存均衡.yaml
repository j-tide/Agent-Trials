content:
  prompt: "\U0001F4CA 在分布式训练中，除了模型本身，还有什么因素会影响单卡显存均衡？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 除了模型权重、梯度、优化器状态外，激活值、通信缓冲区、显存碎片、数据加载缓存、框架预留空间以及负载不均衡都会显著影响单卡显存，导致各卡占用不一致，甚至
    OOM。\n\n\U0001F50E 具体因素：\n\n- 激活显存与重计算策略\n不同卡上的层可能由于计算量不同（如首尾层的 Embedding/Head），激活峰值差异大。梯度检查点设置和序列并行也会影响激活分布。\n\n-
    通信缓冲区\nNCCL 集合通信需要预留缓冲区，其大小与并行策略和消息量有关。TP 或 EP 的 All-to-All 缓冲区会占用额外显存。\n\n- 显存碎片\nPyTorch
    缓存分配器可能在不同卡上产生不同程度的碎片，导致某些卡实际可用连续内存少于其他卡。\n\n- 数据加载与预处理\nDataLoader 使用 pin_memory
    和预取会占用 CPU 内存，但可能间接影响 GPU 显存（如异步拷贝时的缓冲）。如果某卡处理的数据样本长度不同，也会导致激活峰值差异。\n\n- 框架预留与
    CUDA context\n每个 CUDA context 占用约 0.5-1 GB，不同卡上 context 开销相同，但若某卡还承担额外任务（如通信协调），可能多出一些分配。\n\n-
    负载不均衡\n在 PP 中，如果各卡分配的层数或参数量不均，显存会倾斜。在 EP 中，如果专家分配不均衡，也可能某卡专家过多。\n\n\U0001F6E0️
    改善方法：使用 torch.cuda.memory_stats() 检查每卡内存分配，利用 profiling 工具分析各卡显存占用，并通过调整并行分割参数或均衡数据分布来达到平衡。\n\n---"

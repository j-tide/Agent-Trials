content:
  prompt: "⚙️ GPTQ 量化的原理是什么？为什么能保持精度？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 GPTQ（Post-Training Quantization for GPT）是一种基于近似二阶信息（Hessian）的逐层权重量化算法。它通过考虑权重扰动对输出误差的影响，按顺序补偿量化误差，从而在
    4-bit 甚至 3-bit 下保持极低精度损失。\n\n\U0001F52C 原理详解：\n\n- 优化目标：量化权重的目标是最小化层输出误差，即 min
    || WX - ŴX ||^2，其中 Ŵ 是量化后的权重。\n\n- 逐层量化：GPTQ 逐层对权重矩阵进行量化，利用一小批校准数据计算该层输入的 Hessian
    矩阵（或近似值）来度量各权重的敏感度。\n\n- 按顺序量化与补偿：对权重矩阵的一列（或一组）进行量化后，立即计算产生的输出误差，并调整剩余未量化的权重以补偿这个误差。这种补偿机制类似于求解线性系统，能有效控制累积误差。\n\n-
    使用 Cholesky 分解：预先根据 Hessian 做 Cholesky 分解，避免反复计算，速度较快，能在几小时内完成百亿参数模型的量化。\n\n\U0001F9E0
    为什么保持精度？\n\n传统的直接舍入量化（round-to-nearest）会忽视权重的相互作用，导致输出偏差大。GPTQ 通过二阶误差补偿，将量化误差分散到其他权重，使最终输出尽可能逼近原始输出。尤其在
    4-bit 时，配合 Group Size（如 128）和适当的校准数据，性能几乎与 FP16 持平。\n\n✅ 因此，GPTQ 是目前最流行的 LLM 训练后量化方法之一，可一键将模型压缩至
    4-bit，且精度损失极小。\n\n---"

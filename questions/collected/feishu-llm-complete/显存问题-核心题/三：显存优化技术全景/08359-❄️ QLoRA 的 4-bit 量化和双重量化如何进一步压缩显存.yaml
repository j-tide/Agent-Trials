content:
  prompt: "❄️ QLoRA 的 4-bit 量化和双重量化如何进一步压缩显存？"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 QLoRA 在 LoRA 基础上将冻结的基础模型以 4-bit NormalFloat 格式存储，并采用“双重量化”对量化常数再做一次量化，极致压缩模型权重显存，同时保持微调精度。\n\n\U0001F50D
    4-bit NormalFloat（NF4）量化：\n\n- 专门为正态分布数据设计，通过分位点映射把每个 16 位浮点权重压缩为 4 位索引，即每个权重仅占
    0.5 字节。\n\n- 7B 模型权重从 14 GB → 约 3.5 GB。大幅降低基础模型的常驻显存。\n\n\U0001F50D 双重量化（Double
    Quantization）：\n\n- 4-bit 量化需要额外的“量化常数”（scaling factor）来映射回实数。对于大模型，这些常数本身也会占用可观显存（例如每个
    block 一个常数）。\n\n- 双重量化将这些量化常数再进行一次 8-bit 量化，压缩到 1 字节/常数，使得量化开销从约 0.5 GB 缩减到 0.1
    GB。\n\n- 效果：总基础模型显存从 3.5 GB + 0.5 GB → 3.5 GB + 0.1 GB ≈ 3.6 GB，更省。\n\n\U0001F517
    结合 LoRA：\n\n- 基础模型权重以 4-bit 常驻，不参与训练。\n\n- LoRA 的适配器以 FP16/BF16 训练，向前传播时反量化基础权重并与适配器输出相加。\n\n-
    反向传播只更新 LoRA 参数，梯度不经过基础权重，避免了对量化参数的反传困难。\n\n✅ 因此，QLoRA 用 4-bit + 双重量化将基础模型显存压缩至极，配以
    LoRA 小参数训练，实现单卡微调大模型的奇迹。\n\n---"

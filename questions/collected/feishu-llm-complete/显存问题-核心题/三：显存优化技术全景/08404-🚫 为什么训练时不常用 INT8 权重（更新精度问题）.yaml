content:
  prompt: "\U0001F6AB 为什么训练时不常用 INT8 权重？（更新精度问题）"
answer:
  mode: rubric
  reference_answer: "\U0001F4A1 训练中，权重更新量（梯度 × 学习率）通常远小于 INT8 的量化分辨率，若权重以 INT8 存储，微小更新会因舍入误差而丢失，导致模型无法有效学习。因此训练需要高精度（FP16/FP32）表示，INT8
    仅用于推理。\n\n\U0001F52C 深入解释：\n\n- 训练时，每一步的权重更新量级大约为 lr * grad，学习率通常在 1e-5 到 1e-4，而梯度可能经过归一化，结果每步权重变化往往在
    1e-6 到 1e-4 量级。\n\n- INT8 的动态范围有限，量化间隔（step size）约为 (max - min) / 255。假如权重大小在
    0.1 附近，量化间隔约为 0.001。小于这个间隔的更新将被舍入到零，无法改变权重。这就是“更新精度不足”导致学习停滞。\n\n- 即使采用 INT8 存储权重，训练时仍需高精度副本（如
    FP32）来计算梯度和应用更新，显存不会真正节省。这也是为什么混合精度训练使用 FP16 计算但保留 FP32 主权重。\n\n\U0001F9EE 量化训练（QAT）的做法：QAT
    在训练期间保持 FP32 主权重，仅在模拟的前向中加入量化噪声（fake-quant），反向传播更新 FP32 权重。本质上仍然不是低精度存储。\n\n✅
    因此，训练时权重必须保持高精度，INT8/INT4 量化专属于推理阶段。\n\n---"

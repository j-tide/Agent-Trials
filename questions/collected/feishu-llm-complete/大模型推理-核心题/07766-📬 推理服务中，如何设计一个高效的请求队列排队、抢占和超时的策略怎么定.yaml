content:
  prompt: "\U0001F4EC 推理服务中，如何设计一个高效的请求队列？排队、抢占和超时的策略怎么定？"
answer:
  mode: rubric
  reference_answer: "推理服务的请求队列是连接客户端和推理引擎的桥梁，设计目标是在保证延迟 SLA 的前提下，最大化吞吐，同时提供公平、可控的服务。\n\n\U0001F6E0️
    队列设计要素\n\n- 队列结构：通常采用优先级队列。每个请求在入队时被赋予一个优先级（基于用户等级、请求类型等），队列根据优先级排序。支持抢占式优先级：如果高优先级请求到达，可以中断当前低优先级请求的执行（需要推理引擎支持动态批次调整）。\n\n-
    队列容量与背压：设置最大队列长度。当队列满时，向客户端返回 429 Too Many Requests 或 503 Service Unavailable，避免服务被压垮。这实现了背压机制。\n\n-
    等待超时：为每个请求设置一个最大等待时间（如 10 秒）。如果请求在队列中等待超时，则直接返回超时错误，避免客户端无限等待。这可以防止队列过载。\n\n⚖️
    抢占策略\n\n- 可抢占 vs 不可抢占：对于正在生成 token 的请求，抢占意味着中断其推理。通常 decoder 请求不易被抢占，因为已经生成的 token
    需要回滚或放弃（成本高）。更常见的做法是非抢占式：新来的高优先级请求优先排在队列前端，等待当前批次执行完后再插入新批次。\n\n- 批处理内的抢占：在 Continuous
    Batching 中，可以通过调整请求权重来实现软抢占：调度器在下一轮迭代时，优先从队列中选取高优请求加入批次，而不是立即中断当前任务。\n\n⏱️ 超时策略\n\n-
    队列超时：请求在队列中等待时间超过阈值即丢弃。\n\n- 执行超时：请求从开始执行（第一个 token 生成）到结束的总时间超过阈值（如 60 秒），强制终止。这可以防止某个请求无限制生成（缺少
    EOS）耗尽资源。\n\n- 空闲超时：如果连接建立后长时间没有发送请求，释放连接资源。\n\n\U0001F527 工程实现\n\n- 使用 Redis、消息队列（Kafka）
    或内存队列（Python asyncio.Queue）构建分布式队列。\n\n- 对于需要严格公平的场景，可以使用 FIFO + 加权公平队列。\n\n-
    配合 API 网关（如 Nginx, Envoy）进行初步限流和路由。\n\n\U0001F4A1 经验法则：在生产中，简单往往最好。初期可使用 FIFO
    队列 + 最大并发数限制 + 请求超时，足以应对大多数场景。当业务复杂化时，再逐步引入优先级和抢占。\n\n---"

content:
  prompt: 在 A/B 测试新推理框架或新量化方案时，需要收集哪些数据来判断是否达标？
answer:
  mode: rubric
  reference_answer: "\U0001F3AF 必收集数据（分硬件层、服务层、业务层）\n\n硬件与资源\n\n- GPU 利用率、显存占用、功耗\n\n-
    CPU/内存使用\n\n服务性能\n\n- TTFT (P50/P99)、TPOT (P50/P99) 分布\n\n- 吞吐量 (tokens/s)、并发数\n\n-
    错误率、超时率\n\n- Prefill/Decode 延迟占比\n\n模型质量\n\n- 在固定测试集上的自动指标（PPL、MMLU 等）\n\n- 人类或
    GPT-4 评估的胜率（Win/Tie/Lose）\n\n- 生成长度分布、多样性（distinct n-grams）\n\n业务指标\n\n- 用户点踩率、满意度评分\n\n-
    任务完成率（如客服问题解决率）\n\n- 平均对话轮次\n\n\U0001F4CA 对比方法：在同一硬件、相同流量下，双模型并行服务，使用相同分流策略，运行至少数小时，确保统计显著。\n\n---"

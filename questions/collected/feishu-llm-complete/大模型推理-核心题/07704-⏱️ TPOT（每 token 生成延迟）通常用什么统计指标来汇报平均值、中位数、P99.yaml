answer:
  mode: rubric
  reference_answer: "TPOT通常汇报以下统计量：\n\n- 平均值 (Mean)：反映整体性能水平，但易受极端值影响。\n\n- 中位数 (P50)：反映典型用户体验，比平均值更稳健。\n\n-
    P95、P99：用于衡量长尾延迟，是SLA的关键。P99表示99%的token间隔都低于该值。\n\n- 最大值 (Max)：用于发现最极端的卡顿。\n\n\U0001F4CA
    汇报方式\n\n通常以表格呈现，例如：\n\n同时，也会绘制TPOT随时间或序列位置的分布图，观察生成过程中是否有变慢的趋势。\n\n---"

content:
  prompt: "\U0001F9E9 什么是“显存碎片”？它如何影响实际可用显存？PagedAttention 如何缓解？"
answer:
  mode: rubric
  reference_answer: "显存碎片是指显存中虽然总空闲量足够，但因为没有足够大的连续空闲块而无法分配给新请求的现象，类似操作系统的内存碎片。\n\n\U0001F4CA
    碎片类型\n\n- 内部碎片：分配的内存块比实际需要的稍大（例如必须按页分配，即使只需要 10 KB，也会分配一整页 64 KB），多出来的部分被浪费，无法被其他请求使用。\n\n-
    外部碎片：内存中散布着许多小的空闲块，它们之间不连续。当需要分配一个大块时，即使这些小块的总和足够，也无法满足要求，导致分配失败或触发耗时的碎片整理。\n\n在传统推理框架中，每个请求的
    KV Cache 被预先分配一大块连续显存。不同请求的生成长度不同，释放后留下大小不一的空洞，很快导致严重的外部碎片，实际可用显存大幅减少。\n\n\U0001F6E0️
    PagedAttention 的缓解机制\n\nPagedAttention 将 KV Cache 划分为固定大小的物理页（如每页 16 个 token）。所有请求的
    KV Cache 由这些页组成，不再要求连续内存。\n\n- 消除外部碎片：所有页大小相同，任何空闲页都可以被任何请求使用，就像整齐划一的停车位，永远不会出现“车位够但停不下”的情况。\n\n-
    减少内部碎片：按需分配页，一个请求只占满它需要的页，最后一页即使未满也不会浪费过多空间。\n\n- 高效共享：多个请求的相同前缀可以指向同一物理页，无需复制，进一步节约显存。\n\n通过分页，vLLM
    能够将显存利用率从传统方法的 30‑40% 提升到 90% 以上，是高并发推理的基石。\n\n---"

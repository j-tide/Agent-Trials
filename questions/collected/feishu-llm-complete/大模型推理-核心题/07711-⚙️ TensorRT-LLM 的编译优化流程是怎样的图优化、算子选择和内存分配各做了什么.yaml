answer:
  mode: rubric
  reference_answer: "TensorRT-LLM 是 NVIDIA 的官方推理优化框架，其核心思想是将神经网络模型编译成针对特定 GPU 架构高度优化的执行引擎。它的整个编译优化流程可以划分为模型解析、图优化、算子选择与内核调优、内存分配与计划、生成执行引擎几个阶段。\n\n\U0001F4CA
    编译优化流程图解（文字描述）\n\n- 模型导入与解析：从 Hugging Face 或 ONNX 加载模型，解析出网络结构。\n\n- 图优化（Graph
    Optimization）：\n\n- 算子选择与内核调优（Kernel Auto-Tuning）：\n\n- 内存分配与计划：\n\n- 生成执行引擎：最终输出一个序列化的
    engine 文件，其中包含优化后的图、选定的内核和内存计划。推理时直接加载这个 engine 执行，无需任何 PyTorch 框架开销。\n\n\U0001F4A1
    为什么这样设计？\n\n这种编译优化使得 TensorRT-LLM 相比于 PyTorch 等通用框架，在推理时能发挥出 GPU 硬件近 90% 以上的理论性能，尤其在高
    batch、长序列场景下优势巨大。它的代价是需要较长的编译时间（第一次生成 engine），但一旦编译完成，推理延迟和吞吐都是顶级的。\n\n---"

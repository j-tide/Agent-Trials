content:
  prompt: 若把权重从 FP16 量化为 INT4，推理显存大约降到原来的多少？
answer:
  mode: rubric
  reference_answer: |-
    将模型权重从 FP16（每个参数 2 字节）量化为 INT4（每个参数 0.5 字节），权重部分的显存直接降为原来的 1/4。但对总显存的降幅，则取决于权重在总显存中的占比。

    - 短文本、单批次场景：权重是显存的绝对主体。例如，一个 7B 模型，FP16 权重 14 GB，KV Cache 1 GB，其他 3 GB，总显存 18 GB。INT4 量化后，权重降至 3.5 GB，总显存约 7.5 GB，降幅约 58%。

    - 长文本、大并发场景：KV Cache 成为显存主体。例如，一个 13B 模型，FP16 权重 26 GB，KV Cache 40 GB，其他 4 GB，总显存 70 GB。INT4 量化后，权重降至 6.5 GB，总显存约 50.5 GB，降幅仅约 28%。

    核心洞察：权重量化节省的是“存储空间”，但对 Decode 阶段“带宽瓶颈”的缓解有限，因为量化后的权重在计算时通常要反量化回 FP16/BF16 使用，读入计算单元的数据量本身变化不大（除非硬件有原生 INT4 计算单元）。它最大的价值是让模型能跑在更小显存的设备上，或是腾出更多空间给 KV Cache 以支撑更长的上下文。


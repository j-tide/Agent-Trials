content:
  prompt: 量化后模型的质量如何全面评估？除了困惑度，还需要看哪些任务指标？
answer:
  mode: rubric
  reference_answer: "量化压缩模型体积后，必须确保其在真实业务中的表现不受明显影响。仅仅看困惑度（PPL）是远远不够的，因为它只能反映模型对下一个
    token 预测的整体不确定性，而无法揭示量化对特定能力、安全性或生成多样性的微妙损害。\n\n\U0001F4CA 需要评估的维度与指标\n\n\U0001F50D
    实践流程：\n\n- 快速筛查：跑一遍 Open LLM Leaderboard 常用基准（HellaSwag, ARC, GSM8K, MMLU）和 Perplexity。若某项明显下降（>3%），则需要排查量化配置。\n\n-
    任务定制测试：根据业务场景构建专属测试集。例如客服模型要测情绪识别、槽位提取；代码模型要测特定 API 调用正确率。\n\n- 人工评估：随机抽取 200
    组 prompt，让量化模型和原模型分别生成，由人工进行成对比较（Win/Tie/Lose），检验量化后的生成质量是否显著下降。\n\n- A/B 上线：在生产环境部署量化模型，用小比例流量对比真实用户指标（满意度、完成率、点踩率），这是终极检验。\n\n\U0001F4A1
    案例：我们曾将对话模型从 FP16 量化到 INT4，PPL 仅上升 0.5，但人工评估发现生成的回复变得啰嗦且偶尔重复短语，这是因为量化使某些注意力头的分布变尖锐。最终通过
    AWQ 替代 GPTQ 解决了该问题。\n\n---"

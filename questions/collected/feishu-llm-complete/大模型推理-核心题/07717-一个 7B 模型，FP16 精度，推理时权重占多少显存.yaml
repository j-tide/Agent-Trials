answer:
  mode: rubric
  reference_answer: |-
    这是一个直接而关键的计算，它定义了我们推理的“地板”——无论如何都无法逾越的最低显存门槛。

    - 参数总量：7B（70亿）个参数。

    - 精度：FP16（半精度浮点），每个参数占用2字节。

    - 计算公式：7 × 10^9 × 2 bytes = 14 × 10^9 bytes。


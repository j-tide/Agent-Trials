content:
  prompt: 给定一张 80GB 的 A100，一个 FP16 的 13B 模型，最大能支持多长的上下文？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    这是一个经典的“在给定预算下，我能买多少东西”的规划问题。我们手上有80GB的显存预算，需要扣除固定开销后，看看剩下的钱能“购买”多长的记忆。

    - 计算固定开销（底价）

    - 模型权重：13B参数 × 2字节 = 26 GB。这是必须全额支付的首付款。

    - 激活值、框架与其他临时缓冲：经验上，这部分需要预留约 4 GB。它用于存放计算过程中的草稿纸。

    - 剩余给KV Cache的预算：80 GB - 26 GB - 4 GB = 50 GB。这是我们用来“租用”记忆空间的全部资金。

    - 计算“记忆”的单价（每个token的成本）

    我们需要知道模型架构。以典型的LLaMA-13B为例：

    - L = 40层

    - D_{\text{model}} = 5120

    - 假设使用MHA，H=40, d_h=128，或者直接使用 D_{model} 计算。

    每生成一个token，需要为所有层新增的KV Cache大小为：

    [图片内容未导入]

    ⚠️ 现实中的“摩擦成本”

    理论值65k是一个理想上限。在实际的“预填充”阶段，模型还需要为注意力计算分配巨大的临时空间（即使经过FlashAttention优化，也仍有开销）。这就像租房还要付押金和中介费一样，会挤占我们的预算。因此，真实可用的最大长度会略低于理论值，通常在 50k 到 60k 之间。

    如果模型采用GQA，例如G=10，那么KV Cache单价会变为原来的1/4，最大长度便可轻松突破20万tokens。


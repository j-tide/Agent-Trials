content:
  prompt: 推理时如果 batch size 增大一倍，KV Cache 显存如何变化？
answer:
  mode: rubric
  reference_answer: |-
    线性倍增。KV Cache 是每个独立推理请求的“专属记忆”，它们之间完全隔离，无法共享。因此，当你同时处理 2 个请求时，就需要为它们各自分配完整的一份 KV Cache，其总大小自然就是单个请求的 2 倍。这个简单的线性关系，是限制在线推理服务高并发吞吐的核心瓶颈。要提升吞吐，就必须千方百计降低单个请求的 KV Cache 大小（GQA、KV Cache 量化等）。


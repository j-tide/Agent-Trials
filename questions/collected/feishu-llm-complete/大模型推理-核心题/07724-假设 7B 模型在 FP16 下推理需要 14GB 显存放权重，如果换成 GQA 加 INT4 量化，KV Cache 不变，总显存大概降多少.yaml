  reference_answer: |-
    我们做一个清晰的对比计算：

    - 原始配置 (MHA + FP16)

    - 新配置 (GQA-8组 + INT4权重)

    结论：无论 X 是多少，总显存都减少了 (16 + X) - (5.5 + X) = 10.5 GB。这 10.5 GB 完全来自于权重的极致压缩。这节省下来的宝贵空间，可以被直接用于支持更长的上下文（增大 X），或者提升并发用户数（增加 batch size）。


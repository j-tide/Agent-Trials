content:
  prompt: "\U0001F4C9 为什么 TPOT 在生成长序列时可能会出现波动？与 KV Cache 大小有关吗？"
answer:
  mode: rubric
  reference_answer: "是的，TPOT与KV Cache大小有密切关系。\n\n\U0001F50D 原因\n\n- KV Cache 增长导致显存带宽压力增大\n在Decode阶段，每次生成一个token需要读取整个KV
    Cache。随着序列变长，KV Cache体积变大，从显存读取的时间线性增加。由于Decode是带宽受限的，这直接导致TPOT逐步升高。\n\n- PagedAttention的碎片与重分配\n当KV
    Cache增长到需要新物理页时，可能触发物理页分配，若显存紧张，可能引起碎片整理或换页，导致突发高延迟。\n\n- 上下文相关计算\n某些注意力模式在长序列下可能变得稀疏或需要更复杂的计算（虽然FlashAttention优化了这一点），但总体影响不如带宽大。\n\n\U0001F4C8
    波动表现\n\n通常，随着生成token数增加，TPOT会缓慢上升。在序列长度为4k左右可能出现一个较明显的阶梯，原因是GPU L2缓存或TLB miss增加。\n\n\U0001F4A1
    缓解：使用KV Cache量化（INT8）减小体积；采用GQA/MQA降低KV头数；限制最大生成长度。\n\n---"

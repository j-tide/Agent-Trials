content:
  prompt: "\U0001F4F1 端侧（手机/PC）部署大模型，目前有哪些可行方案？"
answer:
  mode: rubric
  reference_answer: "在手机、PC 甚至嵌入式设备上运行大模型，主要挑战是有限的算力、内存和功耗。目前已有多种成熟的框架和方案。\n\n\U0001F9E0
    方案一：llama.cpp / Ollama（CPU/GPU 混合）\n\n- 核心：使用 llama.cpp 的 GGUF 量化模型（Q4_K_M 等），在
    CPU 上推理，或利用 GPU（Metal/CUDA）加速。\n\n- 适用平台：Mac（Apple Silicon）、Windows/Linux PC、甚至树莓派。\n\n-
    性能：在 M2 Max 上运行 7B Q4 模型可达 40+ tokens/s；13B Q4 约 20 tokens/s。体验流畅。\n\n- 代表应用：Ollama、LM
    Studio、GPT4All 等，提供一键下载和图形界面。\n\n\U0001F527 方案二：MLC LLM（手机端优化）\n\n- 核心：由陈天奇团队开发，专为端侧设计的通用
    LLM 部署方案。通过 TVM 编译器优化，支持 iOS、Android、Windows、Linux。\n\n- 特点：支持 GPU（Vulkan/OpenCL/Metal）加速，量化方案灵活，允许在手机上实时聊天（7B
    模型可达 10-20 tokens/s）。\n\n- 应用：MLC Chat App。\n\n\U0001F34E 方案三：Core ML / MNN /
    TFLite（系统级框架）\n\n- Core ML：苹果官方框架，可将模型转换为 Core ML 格式（.mlpackage），充分利用 Apple Neural
    Engine（ANE）。性能极佳，但模型转换门槛高，目前主要支持 LLaMA 等架构的开源转换。\n\n- MNN（阿里）：高性能推理引擎，支持多平台，有
    GPU 加速。\n\n- TFLite（谷歌）：支持移动端，但大模型支持尚不完善，常用在小模型（如 Gemma 2B）。\n\n\U0001F5A5️ 方案四：WebLLM（浏览器内推理）\n\n-
    核心：利用 WebGPU，在浏览器中直接运行 LLM，无需任何后端。如 MLC LLM 的 Web 版本、Transformers.js 等。\n\n- 适用：隐私要求极高、需要离线使用的场景，但速度较慢（7B
    模型约 5-10 tokens/s）。\n\n⚙️ 端侧部署的关键技术\n\n- 量化：几乎所有端侧方案都依赖 INT4 量化来缩小模型体积（7B 模型从
    14GB 降至 ~4GB）。\n\n- 模型压缩：剪枝、蒸馏出更小的端侧专用模型（如 Phi-3-mini-3.8B、Gemma-2B-IT）。\n\n-
    内存优化：使用内存映射（mmap）减少加载时间，利用闪存交换应对大模型。\n\n\U0001F4A1 推荐路线：\n\n- 想在 Mac/PC 上快速体验，Ollama
    + 4-bit 量化模型 是最佳选择。\n\n- 开发移动 App，优先考虑 MLC LLM 的 Swift/Kotlin API 或 MediaPipe
    LLM。\n\n- 追求极致性能，可尝试 Core ML 转换。\n\n---"

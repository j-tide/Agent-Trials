content:
  prompt: 为什么不能简单地把整个模型权重加载到显存来估算，还需考虑额外缓冲？
answer:
  mode: rubric
  reference_answer: |-
    把模型部署到 GPU，类似于把一个巨型乐队请到一个录音棚。你不能只计算乐器和乐手（模型权重）占用的空间，还必须为以下各项留出充足的空间：

    - 乐谱架和调音台（计算工作区）：矩阵乘法等操作不能在原地执行，需要在显存中开辟新的临时空间存放输入、输出和中间结果。

    - 实时录音档案（KV Cache）：这是一个不断增长的专属存储区，用于记住所有已经演奏过的音符，对于长乐曲至关重要。

    - 排练时的草稿纸（激活值缓冲区）：在“预填充”阶段一次性看完整首乐谱时，需要在“大脑”中同时记录大量的临时信息。

    - 过道和通风系统（框架开销与碎片）：PyTorch 框架本身占用一些显存，显存分配器也像动态的仓库管理员，会在空间中留下难以利用的碎片。

    因此，显存规划是一项系统工程，必须把模型权重、KV Cache、激活值、框架开销这“四大金刚”都考虑进去，才能避免在实际运行中遭遇 OOM。


content:
  prompt: "\U0001F50D 推理延迟的抖动通常由什么引起？如何通过调度策略或资源预留来缓解？"
answer:
  mode: rubric
  reference_answer: "这个问题与第11题部分重叠，但更侧重于通用抖动而非仅P99。\n\n抖动来源：\n\n- 硬件：GPU降频、温度墙。\n\n-
    软件：GC、内存碎片、调度不公平。\n\n- 负载：请求长度变化、并发波峰。\n\n\U0001F4CF 调度策略缓解\n\n- 分段 Prefill（Chunked
    Prefill）：将大prefill拆分成多个小块，与decode交替执行，避免decode被长时间阻塞。\n\n- 公平调度：使用类似于TGI的“水印”机制，限制单个请求的资源占用。优先保证decode请求的执行。\n\n-
    资源预留：为decode请求预留部分GPU算力（例如使用MPS限制prefill的占用上限），但这在共享GPU上较难实现。\n\n\U0001F4E6 资源预留\n\n-
    独立资源池：将推理服务拆分为 prefill 池和 decode 池（Sarathi-Serve论文思路），prefill节点处理大计算，decode节点负责低延迟生成，通过高速网络传递KV
    Cache。这从根本上解决了互相干扰。\n\n- KV Cache 量化：减少显存压力，降低因换页导致的抖动。\n\n- 超额预留显存：gpu_memory_utilization设得比理论最大值低5-10%，用于吸收突发分配。\n\n---"

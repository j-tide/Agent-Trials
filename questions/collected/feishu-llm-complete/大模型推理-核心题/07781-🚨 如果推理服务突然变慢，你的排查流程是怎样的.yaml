content:
  prompt: "\U0001F6A8 如果推理服务突然变慢，你的排查流程是怎样的？"
answer:
  mode: rubric
  reference_answer: "推理服务变慢可能源于硬件资源、软件配置、请求模型、网络等多方面，需要系统性排查。\n\n\U0001F4CA 第一步：确认问题范围\n\n-
    是所有请求都变慢，还是特定类型的请求？是延迟增加还是吞吐下降？\n\n- 查看监控仪表盘（Grafana），对比历史正常时刻的指标。\n\n\U0001F50D
    第二步：快速检查“三板斧”\n\n- GPU 利用率\n用 nvidia-smi 或 Prometheus 指标查看 GPU 利用率（gpu_utilization）、显存占用（gpu_memory_used）。如果
    GPU 利用率很低（<50%）但延迟高，通常是带宽瓶颈或请求排队；如果利用率很高但延迟仍高，可能是计算瓶颈。\n\n- KV Cache 与显存\n显存是否接近上限？如果显存满了，会导致频繁的页面换入换出（PagedAttention
    下）甚至 OOM 崩溃。检查 KV Cache 的利用率，可能是某个长请求耗尽显存。\n\n- 请求积压\n查看推理服务内部队列长度。如果积压过多，说明请求处理不过来。可能是并发数突然暴增，或某个请求“拖死”了
    batch（因为长序列生成时间长）。\n\n\U0001F6E0️ 第三步：深入诊断\n\n- Profile 推理引擎：如果怀疑是计算问题，使用 Nsight
    Systems 或 PyTorch Profiler 检查模型推理的 kernel 时间分布，找出异常慢的算子。\n\n- 检查量化/反量化：如果使用了 INT4
    量化，反量化 kernel 可能在小 batch 时成为瓶颈。\n\n- 网络延迟：客户端到服务器的网络是否稳定？用 ping、traceroute 检查。\n\n-
    依赖服务：如使用了外部知识库、RAG，检索服务是否变慢？\n\n- 对比基线：用同一个模型，在本地用 Transformers 跑一个标准 prompt，对比延迟，判断是框架问题还是负载问题。\n\n⚡
    第四步：应急处理\n\n- 限流：临时降低最大并发数，保护现有请求。\n\n- 重启：如果某个推理实例疑似内存泄漏或进入错误状态，直接重启该 Pod（确保无状态）。\n\n-
    回滚：如果是近期更新代码或模型导致，立即回滚到上一个稳定版本。\n\n- 扩容：如果只是单纯的负载增加，手动增加副本数。\n\n\U0001F4A1 经验准则：90%
    的变慢问题出在 KV Cache 显存不够导致频繁重算，或者某个长请求拖慢 batch。首先检查显存和请求长度分布。\n\n---"

content:
  prompt: "\U0001F30A 面向用户的产品中，流式输出的流畅度如何量化评估？"
answer:
  mode: rubric
  reference_answer: "流式输出的流畅度直接影响用户对“AI智能”的感知。除了TPOT外，还需从客户端体验角度定义指标。\n\n\U0001F4CA
    流畅度指标\n\n- Token间间隔的变异系数 (CV)\n标准差 / 平均值，反映间隔的均匀程度。CV越小，输出越流畅。即使平均TPOT低，若CV很大，用户也会感觉忽快忽慢。\n\n-
    停顿频率与时长\n统计TPOT超过某个阈值（如300ms）的次数和持续时间。一次长时间的停顿比多个微小停顿更让人烦躁。\n\n- 首次渲染延迟 (Time
    to First Paint, TTP)\n从用户发送请求到屏幕上首次出现文本的时间（近似TTFT，但包含前端渲染）。这是用户感知“开始回应”的瞬间。\n\n-
    单位字符刷新率\n客户端每秒实际显示的字符数（受网络和前端渲染影响）。高刷新率给用户带来“思维敏捷”的体验。\n\n\U0001F3AF 评估方法\n\n-
    客户端日志：前端在接收到每个token时记录时间戳，计算间隔、卡顿次数等。\n\n- 模拟测试：使用Playwright等浏览器自动化工具，注入不同网络条件，测量上述指标。\n\n-
    用户感知调查：通过众包平台，让真实用户观看流式输出录屏，给出1-5分的流畅度评分，与客观指标进行相关性分析。\n\n\U0001F4A1 产品优化：如果流式输出有明显停顿，可以考虑前端实现“打字机效果”的平滑动画，掩盖微小的网络抖动；服务端则努力优化P99
    TPOT。\n\n---"

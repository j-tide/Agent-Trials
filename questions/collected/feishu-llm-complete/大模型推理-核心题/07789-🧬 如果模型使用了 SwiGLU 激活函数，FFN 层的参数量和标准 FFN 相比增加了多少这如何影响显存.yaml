  prompt: "\U0001F9EC 如果模型使用了 SwiGLU 激活函数，FFN 层的参数量和标准 FFN 相比增加了多少？这如何影响显存？"
answer:
  mode: rubric
  reference_answer: |-
    标准 Transformer FFN 由两个线性层组成：

    [图片内容未导入]

    对显存的直接影响是：权重显存相应增加。同时，FFN 计算时会产生更多临时激活值（多了一个门控输出），略微增加激活内存。在推理阶段，由于不存梯度，主要影响就是模型权重变大，KV Cache 不变（FFN 不影响注意力缓存）。因此，如果模型用 SwiGLU，推理时需要更多显存放权重，但不影响 KV Cache。


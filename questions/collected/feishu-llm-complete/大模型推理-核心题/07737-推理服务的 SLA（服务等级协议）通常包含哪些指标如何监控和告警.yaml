content:
  prompt: 推理服务的 SLA（服务等级协议）通常包含哪些指标？如何监控和告警？
answer:
  mode: rubric
  reference_answer: "生产环境推理服务必须有明确的 SLA，否则故障责任无法界定。\n\n\U0001F4CB 核心 SLA 指标\n\n- 可用性：服务正常响应时间占比，通常要求
    99.9% 以上。\n\n- 端到端延迟：P50/P99 TTFT、P50/P99 TPOT。例如“P99 TTFT < 1s, P99 TPOT < 150ms”。\n\n-
    吞吐量下限：保证的最低 tokens/s 或 requests/s。\n\n- 错误率：非 200 状态码或超时比例，通常要求 <1%。\n\n- 并发上限：承诺能稳定支持的最大并发请求数。\n\n\U0001F6A8
    监控与告警\n\n- Prometheus + Grafana：服务端暴露指标（如 vLLM 的 /metrics），使用 Prometheus 抓取，Grafana
    展示。\n\n- 关键告警规则：\n\n- 客户端探针：定期从外部发送测试请求，测量端到端延迟，避免监控盲区。\n\n\U0001F4A1 实践：我们定义了三级告警：Warning（P99
    TTFT 超过 2s）、Critical（错误率 > 2%）、Emergency（可用性 < 99%），分别通知开发、SRE 和值班经理。\n\n---"

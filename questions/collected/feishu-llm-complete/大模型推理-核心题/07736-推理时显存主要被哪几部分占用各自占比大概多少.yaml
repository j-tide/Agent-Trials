content:
  prompt: 推理时显存主要被哪几部分占用？各自占比大概多少？
answer:
  mode: rubric
  reference_answer: "[图片内容未导入]\n\n大模型推理的显存占用，可以看作一座漂浮的冰山。我们能直接看到的是庞大的模型权重，但水面下还有两块巨大的“底座”：KV
    Cache（键值缓存） 和激活值/中间缓冲区。它们的占比并不是固定不变的，而是随着上下文长度和批量大小剧烈变化。\n\n- 模型权重：这是推理的入场券。无论你问一个字还是万字长文，整个模型的参数都必须安静地躺在显存里。对于FP16精度的7B模型，这部分固定占约14
    GB。它是冰山海面以上的部分。\n\n- KV Cache：这是推理过程的“记忆成本”。每生成一个词，模型的所有层都要把当前词对应的Key和Value向量追加保存，以便后续词不再重算历史。它的显存占用会随着序列长度和batch
    size线性增长，是长文本推理中最凶猛的“吞金兽”。在短文本下它可能只占5%，但在超长上下文（如32k）时，它甚至可以超过权重本身，达到60%以上。\n\n-
    激活值与临时缓冲区：在“预填充”阶段，当模型一口气吃下整个Prompt时，内部会产生大量的中间计算结果（如注意力矩阵、残差连接等）。这部分峰值显存有时非常可观，尤其是在未使用FlashAttention等优化时，注意力矩阵的大小是序列长度的平方级。但在“解码”阶段，由于每次只处理一个词，这部分占用通常很小且稳定。此外，深度学习框架本身（如PyTorch）和显存碎片也会额外吃掉0.5~2
    GB。\n\n- 其他固定开销：包括CUDA运行时上下文、内核驱动占用等，通常在一百兆到几百兆之间。\n\n如果用一张粗略的饼图来描绘不同场景下的占比，它会是这样变化的：\n\n\U0001F4A1
    核心洞察：上下文长度是决定显存压力模式的核心变量。 在短对话中，你的钱主要花在“买模型”上；而在长文档分析中，你的钱主要花在“维持记忆”上。优化长文本推理，首要目标是砍向
    KV Cache。\n\n---"

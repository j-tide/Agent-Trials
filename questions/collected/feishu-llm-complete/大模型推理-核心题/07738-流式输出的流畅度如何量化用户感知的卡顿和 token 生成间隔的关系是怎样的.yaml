content:
  prompt: 流式输出的“流畅度”如何量化？用户感知的卡顿和 token 生成间隔的关系是怎样的？
answer:
  mode: rubric
  reference_answer: "流式输出中，用户对“卡顿”的感知并非仅由平均生成速度决定，而是更受延迟的波动性和极端停顿影响。\n\n\U0001F4CF
    量化指标\n\n- Token 间隔的标准差/变异系数 (CV)：间隔越不均匀，用户越感卡顿。\n\n- 停顿频率与时长：设定阈值（如 200ms），统计超出阈值的停顿次数和最长停顿。一次超过
    500ms 的停顿比 10 次 50ms 的更令人烦躁。\n\n- Token 生成间隔的分布（P50, P95, P99）：P99 过高表示偶尔的大卡顿。\n\n-
    视觉流畅度评分：通过前端录屏，让人工或算法评估“卡顿感”。\n\n\U0001F9E0 用户感知机制：\n\n人眼对匀速运动的物体接受度高。当 token
    以均匀间隔出现时，即使整体速度较慢（如每 80ms 一个 token），用户也会觉得“流畅地在写”。但如果间隔忽快忽慢，即使平均速度更快，大脑也会将突然的停顿解读为“系统卡住了”，从而焦虑。\n\n\U0001F4A1
    优化方向：\n\n- 服务端努力将 TPOT 的 P99 压制到用户感知阈值以下（通常 <200ms）。\n\n- 前端可引入“打字机平滑动画”，对微小抖动进行缓冲，但人为增加延迟可能让灵敏用户反感。\n\n---"

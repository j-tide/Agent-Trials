content:
  prompt: "\U0001F9EA 什么是“激活值显存”？推理时激活值是否需要像训练一样全部保留？"
answer:
  mode: rubric
  reference_answer: |-
    激活值显存指的是神经网络在前向传播过程中产生的中间输出张量所占用的显存。这些张量是各层计算的临时结果，比如：

    - 卷积/线性层的输出

    - 激活函数（ReLU/GELU）的输出

    - 注意力权重矩阵

    - 残差连接的中间结果

    在训练时，这些激活值必须全部保留在显存中，因为反向传播时需要用到它们来计算梯度。所以训练时激活值显存是巨大开销，通常远大于模型权重。

    但在推理时，我们只有前向传播，没有反向。因此，激活值不需要全部保留。在计算完当前层并传递给下一层后，当前层的激活值就可以立即释放，只保留最终的输出和必要的状态（如 KV Cache）。所以推理时的激活值显存只是前向计算过程中的“临时草稿纸”，用后即丢。这使得推理的激活内存峰值远小于训练，且可以通过算子融合、内存复用来进一步优化。FlashAttention 就是通过融合算子和重计算，避免了在显存中保留完整的注意力得分矩阵，极大降低了激活值峰值。


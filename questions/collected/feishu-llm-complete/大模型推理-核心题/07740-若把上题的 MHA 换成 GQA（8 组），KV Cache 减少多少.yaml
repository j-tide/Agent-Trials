content:
  prompt: 若把上题的 MHA 换成 GQA（8 组），KV Cache 减少多少？
answer:
  mode: rubric
  reference_answer: |-
    分组查询注意力（GQA）是给KV Cache“瘦身”的利器。它让多个查询头共享同一组Key和Value头，从而从源头上减少了需要缓存的头数。

    机制转变：

    - 在MHA中，我们有32个查询头，以及32个独立的Key/Value头。

    - 在GQA-8中，我们依然有32个查询头，但它们被分成了8组。每组内的4个查询头共享同一个Key头和一个Value头。这意味着我们只需要存储8个Key/Value头，而不是32个。

    减少量计算：

    KV Cache的大小与需要存储的Key/Value头数成正比。所以，GQA带来的压缩比是：

    [图片内容未导入]

    减少了：1 GB - 0.25 GB = 0.75 GB (768 MB)。


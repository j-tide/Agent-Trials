content:
  prompt: "☁️ 如何设计一个支持弹性伸缩的推理集群？"
answer:
  mode: rubric
  reference_answer: "弹性伸缩是指推理集群能根据请求负载自动增减计算节点（GPU 实例），在保证延迟 SLA 的同时最小化成本。设计这样的集群需要从负载均衡、状态管理、冷启动优化、监控等多方面入手。\n\n\U0001F3D7️
    架构设计\n\n- 容器化与 Kubernetes 部署\n将推理引擎（vLLM、Triton Server 等）封装为 Docker 容器，使用 Kubernetes
    (K8s) 进行编排。K8s 提供天然的 Pod 管理、服务发现、滚动更新等功能。\n\n- HPA（水平自动伸缩器）\n利用 K8s 的 HPA（Horizontal
    Pod Autoscaler）根据自定义指标（如 GPU 利用率、请求队列长度、请求延迟）动态调整 Pod 副本数。常用指标：\n\n- 无状态设计\n推理服务本身是无状态的（模型权重挂载为只读，KV
    Cache 在内存中且生命周期与请求绑定），这使 Pod 可以快速创建和销毁，适合弹性伸缩。注意：如果使用了前缀缓存，缓存丢失可能导致短暂的 Prefill
    重算，但这是可接受的。\n\n- 模型权重分发\n模型权重文件（动辄数 GB 到数十 GB）需要能被新 Pod 快速加载。常用方案：\n\n- 负载均衡器\n前端采用高性能的反向代理（如
    Envoy、Nginx）或专门的 API 网关，负责将请求路由到不同的推理 Pod。策略可采用最少连接数或基于请求长度的路由。\n\n\U0001F4CA
    监控与自动决策\n\n- 指标采集：Prometheus + Grafana 监控各 Pod 的 GPU 使用率、显存、TTFT、吞吐、错误率等。\n\n-
    自定义缩放器：对于复杂的缩放逻辑（如考虑模型大小、预热时间），可使用 KEDA 或自定义 Metrics Server 来实现事件驱动的伸缩。\n\n\U0001F680
    冷启动优化\n\n弹性伸缩的最大挑战是冷启动时间（新节点从启动到可以服务的时间），可能长达几分钟（加载权重、编译 CUDA kernel）。优化手段：\n\n-
    预加载模型：在节点启动时自动加载常用模型。\n\n- 使用快照：将 vLLM 等引擎的初始状态（已加载模型、预分配显存）保存为快照，快速恢复。\n\n- 空闲保持：即使没有流量，也保留少量常驻
    Pod，处理突发流量，避免完全从零启动。\n\n- 多模型切换成本：如果集群支持多种模型，避免频繁卸载和加载模型。\n\n\U0001F4A1 落地建议：初期可先手动扩缩，验证稳定性；中期使用
    K8s HPA + GPU 利用率指标自动伸缩；后期引入 KEDA 等高级缩放器，结合业务请求量预测，实现更精确的弹性。\n\n---"

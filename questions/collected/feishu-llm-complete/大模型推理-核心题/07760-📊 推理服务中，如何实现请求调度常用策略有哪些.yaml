content:
  prompt: "\U0001F4CA 推理服务中，如何实现请求调度？常用策略有哪些？"
answer:
  mode: rubric
  reference_answer: "请求调度是推理服务的核心组件，负责将来自用户的并发请求高效地分配给推理引擎，平衡延迟和吞吐。主要的调度策略分为批处理策略和优先级策略。\n\n⚙️
    1. 连续批处理（Continuous Batching）\n\n这是现代推理服务的标准调度方式（vLLM、TensorRT-LLM 均采用）。关键特性：\n\n-
    请求随时加入和离开：生成结束的请求立即释放 KV Cache 和计算资源，新请求可以立即插入当前批处理中。\n\n- 动态调整 batch size：调度器根据当前系统负载和剩余显存，动态决定接受多少新请求。\n\n\U0001F4CF
    2. Prefill 与 Decode 分离调度\n\n由于 Prefill（处理 prompt）是计算密集型，Decode（生成 token）是内存密集型，将两者混合调度容易导致延迟波动。一些高级框架（如
    Sarathi-Serve）将 Prefill 和 Decode 分配给不同的 GPU 或不同的时间段，利用流水线优化。\n\n⭐ 3. 优先级调度\n\n-
    实时请求优先：对延迟敏感的交互式请求给予高优先级，插队到批次前面。\n\n- 离线任务降级：批量评估、数据处理的请求可以排队，在 GPU 空闲时执行。\n\n-
    多租户权重：根据客户等级分配 GPU 时间配额。\n\n\U0001F4CA 4. 长度感知调度\n\n根据请求的 prompt 长度或预期生成长度进行分组，将长度相近的请求放在同一个批次中，减少因长短序列混跑导致的“气泡”和显存浪费。\n\n\U0001F6E0️
    5. 具体实现方式\n\n- vLLM：内置 Continuous Batching 和 PagedAttention，调度器自动管理。\n\n- 自定义服务：可使用消息队列（如
    Kafka）缓冲请求，调度器从队列拉取并组成批次。利用 GPU 显存水位线决定是否接纳新请求。\n\n\U0001F4A1 最佳实践：优先采用 vLLM 或
    TensorRT-LLM 的内置调度，它们经过了大量压力测试，平衡性最好。如果业务有特殊的优先级需求，可在其前端增加一层请求队列和优先级标记。\n\n---"

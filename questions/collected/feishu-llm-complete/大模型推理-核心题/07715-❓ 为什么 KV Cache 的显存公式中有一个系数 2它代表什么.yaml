content:
  prompt: "❓ 为什么 KV Cache 的显存公式中有一个系数 2？它代表什么？"
answer:
  mode: rubric
  reference_answer: "在 KV Cache 的计算公式中，系数 2 直接对应的是 Key 和 Value 两个张量。注意力机制需要缓存的不是单一向量，而是一对向量：\n\n-
    Key 向量 K，用于与 Query 计算注意力分数\n\n- Value 向量 V，用于加权聚合信息\n\n对于每个 token、每一层、每一个注意力头（或者
    GQA 中的每一组），都必须同时存储 KK 和 VV。两者形状相同，占据相同的字节数。因此，总缓存大小就是 (K的大小) + (V的大小) = 2 × (K的大小)。\n\n这个
    2 是硬件成本的直接体现。没有缓存 Key，注意力计算无法进行；没有缓存 Value，也无法生成输出。两者缺一不可。\n\n值得注意的是，Query 是不需要缓存的。因为在自回归生成中，每次只处理当前
    token 的 Query，历史 token 的 Query 不会在后续步骤被复用，所以用完即可丢弃。只有 Key 和 Value 需要永久保留。\n\n\U0001F511
    直观理解：想象你在开会，每个人的发言（Value）需要被记录，而为了知道谁说过什么、对当前话题贡献多少（注意力权重），你还需要一个索引卡片（Key）。这两个东西必须配对保存。\n\n---"

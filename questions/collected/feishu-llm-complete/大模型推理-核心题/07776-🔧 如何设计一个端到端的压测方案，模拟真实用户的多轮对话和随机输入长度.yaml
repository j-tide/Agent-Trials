  reference_answer: "真实用户场景复杂，压测需模拟多样性。\n\n\U0001F4CB 方案设计\n\n- 数据集准备\n\n- 压测工具与场景\n\n-
    需要监控的指标\n\n- 随机输入长度的处理\n\n\U0001F4C8 结果分析\n\n- 绘制吞吐量-延迟曲线，找到系统容量上限。\n\n- 分析不同长度分段下的TTFT和TPOT，发现调度瓶颈。\n\n-
    对比多轮对话首轮与后续轮次的TTFT（后续轮次可能因前缀缓存而更快）。\n\n\U0001F4A1 真实案例：某对话产品压测发现，在100并发时TPOT P99正常，但150并发时突然飙升，定位是显存碎片导致调度停顿，通过调整gpu_memory_utilization和启用分段prefill解决。\n\n---"

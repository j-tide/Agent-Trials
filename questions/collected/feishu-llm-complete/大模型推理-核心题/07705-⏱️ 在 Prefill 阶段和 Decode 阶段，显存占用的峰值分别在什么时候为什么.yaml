answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    因此，prefill 的峰是“计算峰”，由临时激活值导致；decode 的峰是“记忆峰”，由持续积累的 KV Cache 导致。对于长文本，prefill 的峰值可能更大；对于高并发，多个请求的 KV Cache 累积可能成为瓶颈。


  prompt: "\U0001F424 如何实现推理服务的“金丝雀发布”，让新模型版本逐步接替流量？"
answer:
  mode: rubric
  reference_answer: "金丝雀发布（Canary Release）是指将新版本的模型部署到生产环境，但只将少量流量（如 5%）导给它，经过一段时间的监控和验证后，再逐步增加流量比例，直至完全替代旧版本。这能最大限度地降低新模型引入风险。\n\n\U0001F6A6
    实现步骤\n\n- 版本化部署\n\n- 流量路由\n\n- 动态调整权重\n\n- 监控与告警\n\n- 回滚机制\n\n\U0001F4A1 实施要点：确保新旧模型对外的
    API 接口完全兼容，客户端无需任何改动。模型切换对用户完全透明。\n\n---"

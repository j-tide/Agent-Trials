content:
  prompt: 长文本推理的延迟和短文本相比，瓶颈主要在 prefill 还是 decode？为什么？
answer:
  mode: rubric
  reference_answer: "\U0001F4CA 长文本推理瓶颈转变：\n\n- 短文本（<1024 tokens）：瓶颈在 Prefill。因为模型需要一次性处理整个
    prompt，大量矩阵乘法并行计算，此时 GPU 计算核心是瓶颈。\n\n- 长文本（>4096 tokens）：瓶颈转移到 Decode。因为 KV Cache
    变得极其巨大（数十 GB），每次 decode 都要从显存读出整个 KV Cache 和模型权重，显存带宽成为绝对瓶颈。同时，Prefill 阶段因为平方级的注意力计算也会很慢，但
    FlashAttention 等优化使其不再主导。\n\n\U0001F52C 具体分析：\n\n- Prefill 瓶颈：注意力矩阵为 [1, 32k,
    32k]，计算量惊人，但现代 GPU 的 Tensor Core 还能勉强应对。\n\n- Decode 瓶颈：每生成一个 token，需要读取的 KV Cache
    大小 = 2 × L × S × d × sizeof(dtype)。当 S=32k 时，光读取 KV Cache 就可能需要几毫秒，而实际计算只需零点几毫秒。所以
    Decode 是带宽受限的。\n\n\U0001F4A1 结论：长文本优化必须优先考虑压缩 KV Cache（GQA、量化、稀疏化）和提升带宽利用率（FlashDecoding、PagedAttention）。\n\n---"

content:
  prompt: "\U0001F4C9 推理时使用 INT4 量化权重，但 KV Cache 保持 FP16，总显存能降到原来的多少？请以 7B 模型为例估算。"
answer:
  mode: rubric
  reference_answer: "我们以 7B 模型、单 batch、2048 长度、GQA 为例，分步计算。\n\n原始配置（FP16 权重 + FP16
    KV Cache）：\n\n[图片内容未导入]\n\n- 激活/框架等：预估 2 GB\n\n总显存 ≈ 14 + 0.125 + 2 ≈ 16.1 GB\n\n量化后（INT4
    权重 + FP16 KV Cache）：\n\n- 权重：14 GB / 4 = 3.5 GB（INT4 理论大小，实际因 group-wise 量化会略大，约为
    3.7 GB）\n\n- KV Cache：保持 0.125 GB\n\n- 激活/框架等：仍约 2 GB\n\n总显存 ≈ 3.5 + 0.125 + 2
    ≈ 5.6 GB\n\n总显存下降比例：从 16.1 GB 降到 5.6 GB，降幅约 65%。如果是在长文本、大 batch 下，KV Cache 占比更大，总显存降幅会相应降低，因为权重的节省被
    KV Cache 冲淡。但无论哪种情况，仅权重量化就能节省超过 10 GB 的显存，对消费级显卡非常关键。\n\n\U0001F4CC 这就是为什么我们通常称
    INT4 量化可以让 7B 模型在 8 GB 显存显卡上运行，并为 KV Cache 和批处理留出空间。\n\n---"

answer:
  mode: rubric
  reference_answer: "In-flight Batching 是 TensorRT-LLM 对 Continuous Batching 的官方称呼，本质上是一样的：允许请求动态加入和离开正在进行计算的批次，消除静态批处理的计算气泡。\n\n\U0001F4CB
    TensorRT-LLM 的实现\n\n- 调度器（Batch Manager）：TensorRT-LLM 内部有一个 Batch Manager，负责从请求队列中拉取请求，并动态组织成批次。当某个请求生成结束（遇到
    EOS 或达到 max_tokens），它立刻从当前批次中移除，其占用的 KV Cache 被回收。同时，Batch Manager 可以从等待队列中取一个新请求加入。\n\n-
    迭代级调度：每个 decoder step（生成一个 token 后），Batch Manager 都会评估是否要重组批次。新加入的请求会经历一个快速的 prefill
    阶段（可能融合在 decoder step 中），然后加入常规的 decode 流程。\n\n- 显存管理：TensorRT-LLM 支持 PagedAttention
    或静态分配。在分页模式下，与 vLLM 类似；在静态模式下，需要预先分配足够大的 KV Cache，灵活性稍差。\n\n\U0001F19A 与 vLLM
    的异同\n\n\U0001F4A1 如何选择？\n\n- 如果追求快速部署、社区支持、易扩展，选 vLLM。\n\n- 如果追求极致性能、大模型多 GPU
    并行、严格延迟 SLA，且愿意投入编译和调优成本，选 TensorRT-LLM。\n\n---"

content:
  prompt: 如何用可视化工具（如 Grafana）搭建一个推理服务的监控面板？核心面板有哪些？
answer:
  mode: rubric
  reference_answer: "一个好的 Grafana 面板能让团队在几秒内判断系统健康状况。\n\n\U0001F5A5️ 面板布局建议（全屏展示，一行一主题）\n\n第一行：服务质量\n\n-
    实时 TTFT (P50, P99) 折线图\n\n- 实时 TPOT (P50, P99) 折线图\n\n- 请求成功率（%）和错误类型分布\n\n第二行：吞吐与负载\n\n-
    每秒生成 token 数 (tokens/s) 和 请求数 (req/s)\n\n- 活跃并发请求数\n\n- 请求排队长度\n\n第三行：资源利用率\n\n-
    GPU 利用率（%）和 显存占用 (GB)\n\n- CPU 利用率、内存占用\n\n- 网络吞吐 (Gbps)\n\n第四行：推理引擎内部\n\n- KV
    Cache 命中率\n\n- Prefill/Decode 延迟分布直方图\n\n- 活跃序列数、preempted 请求数\n\n\U0001F4CA 数据源：vLLM/TGI
    等框架内置 Prometheus 指标端点，也可自定义日志解析 exporter。\n\n\U0001F527 技巧：使用 $instance 变量区分不同
    GPU 或 Pod，设置 Time range 快速回看故障时段。\n\n---"

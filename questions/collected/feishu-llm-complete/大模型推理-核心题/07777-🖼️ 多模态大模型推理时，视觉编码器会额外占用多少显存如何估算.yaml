content:
  prompt: "\U0001F5BC️ 多模态大模型推理时，视觉编码器会额外占用多少显存？如何估算？"
answer:
  mode: rubric
  reference_answer: "多模态大模型（如 LLaVA、Qwen‑VL）通常由三个部分组成：视觉编码器（Vision Encoder，如 CLIP
    ViT‑L）、投影器（Projector，一个或几层 MLP）和语言模型（LLM）。视觉编码器独立于语言模型，会带来额外的权重和激活显存。\n\n\U0001F4E6
    显存估算方法\n\n- 视觉编码器的权重显存\n\n[图片内容未导入]\n\n- 投影器\n\n投影器通常很轻量，如两层 MLP，参数量约几百万，可忽略。\n\n-
    与语言模型共享的显存\n\n视觉 token 进入 LLM 后，会与文本 token 一同参与自注意力计算，因此会占用 LLM 的 KV Cache 和临时激活。这部分显存已在
    LLM 的估算中考虑，但需要额外加上视觉 token 的 KV Cache。\n\n\U0001F4CA 快速估算实例\n\n以 LLaVA‑1.5（ViT‑L/14
    + LLaMA‑7B）为例：\n\n- 视觉编码器权重：0.6 GB\n\n- 视觉编码器激活：< 1 GB（通常可忽略）\n\n- 语言模型部分按标准 7B
    估算\n\n因此，多模态部分额外显存约 1‑2 GB，对于一张 24 GB 显卡，多模态推理的总显存占用与纯文本 7B 模型相比增加不多，主要瓶颈仍然是 LLM
    的权重和 KV Cache。\n\n\U0001F4A1 注意：若使用高分辨率图像或视频（多帧），视觉 token 数量激增，KV Cache 和激活显存可能显著增大，需要专门优化（如
    Token Merging）。\n\n---"

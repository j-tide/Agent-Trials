content:
  prompt: "⚡ vLLM 相比 Hugging Face Transformers 直接推理，快在哪里？"
answer:
  mode: rubric
  reference_answer: "vLLM 是目前大模型推理服务领域最主流的高性能框架之一，与直接使用 Hugging Face Transformers
    进行推理相比，vLLM 在吞吐量和延迟上都有数量级的提升。其加速核心并非单个算子的优化，而是从系统层面重新设计了显存管理和请求调度。\n\n\U0001F680
    核心加速点\n\n- PagedAttention（分页注意力）\n这是 vLLM 最重要的创新。传统 Transformers 推理为每个请求预先分配一块连续的显存来存储
    KV Cache。这导致：\n\n- 内部碎片：由于最大长度预估不准，大量预分配空间被浪费。\n\n- 外部碎片：不同请求的释放和分配产生无法使用的小块显存，利用率极低（通常仅
    30-50%）。\n\n[图片内容未导入]\n\n- PagedAttention 将 KV Cache 切分成固定大小的“页”（类似操作系统的虚拟内存分页），按需动态分配，不再要求连续内存。这使得显存利用率可提升至
    90% 以上，从而在相同硬件上容纳更多的并发请求，直接提升吞吐。\n\n- Continuous Batching（连续批处理）\n传统批处理必须等一个批次中所有请求完成才能进行下一批，这会产生大量的“计算气泡”（短请求等长请求）。vLLM
    允许请求随时加入和离开正在计算的批次。当一个请求生成结束时，其占用的页被立即回收并分配给等待队列中的新请求，GPU 始终满载。\n\n- 高效的内存共享与前缀缓存\n对于多个请求共享的相同前缀（如
    system prompt），vLLM 可让它们映射到同一物理页，避免重复计算和存储。这尤其适用于多轮对话和批量评估。\n\n- 定制化的 CUDA 内核\nvLLM
    对注意力计算、量化矩阵乘法等核心操作实现了高度定制化的 CUDA kernel，相比 Transformers 的通用实现，更充分地利用 Tensor Core
    和 GPU 并行度。\n\n- 极致的显存管理\n除了 PagedAttention，vLLM 还通过预分配大块内存池、精细的碎片整理等技术，将显存管理开销降至最低。\n\n\U0001F4CA
    实际性能对比\n\n在 LLaMA-7B、A100 上，使用 vLLM 的吞吐量（tokens/s）可达 Transformers 的 3-5 倍，同时首
    token 延迟（TTFT）显著降低。随着并发数增加，优势更加明显。\n\n\U0001F4A1 一句话总结：vLLM 把推理服务从“固定班车”升级为“高效拼车”，让
    GPU 的每一丝计算和显存都被充分利用。\n\n---"

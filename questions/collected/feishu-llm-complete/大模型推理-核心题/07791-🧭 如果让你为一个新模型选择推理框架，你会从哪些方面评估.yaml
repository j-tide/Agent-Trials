content:
  prompt: "\U0001F9ED 如果让你为一个新模型选择推理框架，你会从哪些方面评估？"
answer:
  mode: rubric
  reference_answer: "选择推理框架需要综合性能、生态、硬件、部署难度等多维因素，通常没有一个放之四海皆准的最佳框架。以下是我的评估清单，按优先级排序：\n\n\U0001F3AF
    1. 性能与吞吐量\n\n- 延迟（TTFT、每 token 延迟）：对于实时交互应用，这是首要指标。\n\n- 吞吐（tokens/s）：对于批处理或高并发服务，最大化吞吐是关键。\n\n-
    显存效率：框架的显存占用率，是否能支持更大的 batch 或更长的上下文。\n\n\U0001F9E9 2. 模型架构支持\n\n- 框架是否原生支持你的模型架构？有些框架对
    LLaMA 优化极好，但对其他架构（如 Mamba、RWKV）可能不支持或支持不完善。\n\n- 如果模型有自定义算子，框架是否提供插件机制？\n\n\U0001F6E0️
    3. 量化与压缩支持\n\n- 支持哪些量化方式？GPTQ、AWQ、GGUF、INT8/INT4？\n\n- 是否支持 KV Cache 量化？\n\n-
    量化后的模型精度损失如何？框架是否提供校准工具？\n\n\U0001F5A5️ 4. 硬件兼容性\n\n- 目标部署平台是什么？NVIDIA GPU、AMD
    GPU、Apple Silicon、CPU、NPU？\n\n- 框架对特定硬件的优化程度（如 TensorRT-LLM 对 NVIDIA 的极致优化）。\n\n\U0001F517
    5. 分布式推理能力\n\n- 是否需要张量并行（TP）？流水线并行（PP）？跨节点推理？\n\n- 框架的分布式实现是否高效、易用？\n\n\U0001F9F0
    6. 生态与易用性\n\n- Python API 是否友好？与 Hugging Face Transformers 的兼容性如何？\n\n- 文档和社区支持：是否有足够示例、活跃的
    issue 讨论？\n\n- 部署便捷性：是否容易容器化？是否与 Kubernetes、Triton 等集成？\n\n\U0001F4CA 7. 服务特性\n\n-
    是否支持 Continuous Batching？PagedAttention？\n\n- 是否有内置的请求调度、限流、流式输出（SSE/WebSocket）？\n\n-
    是否支持多租户和显存隔离？\n\n\U0001F4B0 8. 成本与可持续性\n\n- 是否需要商业许可？开源协议是否友好？\n\n- 框架的迭代速度、长期维护前景。\n\n\U0001F4A1
    实际决策树：\n\n- 在线服务、低延迟、高并发 → vLLM 或 TensorRT-LLM（NVIDIA GPU）。\n\n- 单卡离线测试、快速原型 →
    Transformers + FlashAttention。\n\n- CPU/边缘设备部署 → llama.cpp / Ollama / MLC LLM。\n\n-
    移动端/Web → MediaPipe LLM Inference API / MNN / TFLite。\n\n---"

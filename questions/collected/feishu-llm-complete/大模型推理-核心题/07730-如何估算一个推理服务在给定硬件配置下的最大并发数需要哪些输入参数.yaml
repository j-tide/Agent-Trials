content:
  prompt: 如何估算一个推理服务在给定硬件配置下的最大并发数？需要哪些输入参数？
answer:
  mode: rubric
  reference_answer: "\U0001F9EE 估算公式（以自回归生成为例）：\n\n最大并发数 ≈ 可用于 KV Cache 的显存 / 单请求的平均
    KV Cache 大小\n\n\U0001F4E5 输入参数：\n\n- 硬件：GPU 总显存（GB），预留显存比例（用于模型权重和临时缓冲区，通常 10-20%）。\n\n-
    模型：参数量、精度（FP16/INT4）、层数 L、隐藏维度 d、头数及 GQA 头数。\n\n- 推理配置：最大生成长度 max_tokens，平均 prompt
    长度。\n\n- 框架内存效率：PagedAttention 的碎片率（通常 5-10%）。\n\n\U0001F522 估算步骤：\n\n- 权重显存 =
    参数量 × 精度字节。\n\n- 可用显存 = 总显存 - 权重显存 - 系统预留。\n\n- 单 token KV 大小 = 2 × L × (d * (head_ratio))
    × sizeof(dtype)。\n\n- 单请求平均 KV 大小 = (prompt_len + 预计生成_len/2) × 单 token KV 大小（考虑生成过程中缓存逐步增加，取平均）。\n\n-
    最大并发数 = 可用显存 / (单请求平均 KV 大小 × (1 + 碎片率))。\n\n\U0001F4A1 注意：这只是理论上限。实际并发还受算力、调度效率影响。在达到显存瓶颈前，可能先遇到计算瓶颈（如
    Prefill 吞吐限制）。因此需要结合压测确定实际饱和点。\n\n---"

content:
  prompt: "\U0001F9F0 在使用 llama.cpp 做 CPU 推理时，影响推理速度的关键因素有哪些？（线程数、批次、量化等）"
answer:
  mode: rubric
  reference_answer: "llama.cpp 的 CPU 推理性能高度依赖于一系列配置和环境因素。以下按重要性排序：\n\n\U0001F522 1.
    量化精度（最关键）\n\n- 模型权重和 KV Cache 的量化等级直接决定了内存带宽压力。从 FP16 到 Q4_K_M，模型体积缩小为 1/4，意味着每
    token 需要读取的数据量仅为 1/4。在内存带宽有限的 CPU 上，这是加速的最大来源。\n\n- 常用量化：Q4_K_M（推荐）、Q5_K_M、Q8_0
    等。K-quant 比旧式 q4_0 精度更高，速度接近。\n\n\U0001F9F5 2. 线程数（-t / --threads）\n\n- llama.cpp
    使用多线程并行计算注意力头和 FFN 层的矩阵乘法。最佳线程数通常是物理核心数（而非超线程数）。设为物理核心数能达到 CPU 的最高利用率。设多了会增加线程调度开销，设少了
    CPU 闲置。\n\n- 经验值：例如 8 核 CPU 设 -t 8，16 核设 -t 16。\n\n\U0001F4E6 3. 批处理大小（-b / --batch-size）\n\n-
    批处理主要影响 Prompt Prefill 阶段（处理输入 Prompt 时）。增大 batch size 可以一次处理更多 token，提高矩阵乘法的并行度，加速
    Prefill。但过大 batch 会增加内存占用和单次延迟。通常 512 或 1024 是一个平衡点。\n\n⚙️ 4. CPU 指令集与 BLAS 后端\n\n-
    llama.cpp 默认使用 CPU 指令集（AVX2/AVX-512/NEON），但启用 BLAS（如 OpenBLAS、Intel MKL、Apple
    Accelerate）可以显著加速矩阵乘法，尤其是在 Prompt 处理上。在支持的系统上，通常用 -ngl 0 加 --mlock 和 -t 组合，而 BLAS
    通过编译时开启。\n\n\U0001F4BE 5. 内存带宽与频率\n\n- CPU 推理的核心瓶颈是内存带宽。更高的内存频率和更多内存通道（如双通道、四通道）会直接提升推理速度。例如，DDR5
    比 DDR4 快，多通道比单通道快。内存延迟也有影响。\n\n\U0001F4DA 6. 模型结构与大小\n\n- 7B 模型自然比 13B 快。此外，模型架构差异（如
    LLaMA 的 GQA 头数、层数）也会影响速度。\n\n\U0001F527 7. 其他选项\n\n- --mlock：将模型锁定在物理内存，防止被操作系统
    swap 出去，减少缺页中断。\n\n- --no-mmap：不使用 mmap，将整个模型加载到 RAM，启动慢但后续推理可能更稳定（避免磁盘 I/O 抖动）。\n\n-
    --numa：在多路 CPU 服务器上，绑定内存节点可以优化访存。\n\n\U0001F4A1 性能调优顺序：先选择合适的量化模型 → 调整线程数 → 根据需要开启
    BLAS → 使用 mmap 并合理设置 batch。\n\n---"

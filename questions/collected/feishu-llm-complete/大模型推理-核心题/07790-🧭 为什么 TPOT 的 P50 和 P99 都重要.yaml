content:
  prompt: "\U0001F9ED 为什么 TPOT 的 P50 和 P99 都重要？"
answer:
  mode: rubric
  reference_answer: "TPOT 的分布往往不是正态的，存在长尾延迟。P50（中位数）和P99（99百分位）分别揭示了系统性能的不同侧面。\n\n-
    P50 TPOT：代表“典型”用户的生成速度。如果中位数很低，大多数用户会感觉回复流畅。优化P50通常涉及提升GPU算力、优化矩阵乘法、使用更高效的解码策略等。\n\n-
    P99 TPOT：代表“最差情况下”的表现，直接关系到用户是否会遇到明显卡顿。P99高意味着少数请求的生成延迟很大，可能由于资源竞争、垃圾回收、显存碎片、或长序列导致的带宽瓶颈。这对于高端用户或付费用户的体验至关重要。\n\n\U0001F4C9
    长尾延迟的危害\n\n在流式输出中，即使中位数TPOT只有50ms，但如果P99达到500ms，用户会每隔一小段时间就感受到明显的停顿。这比整体慢更让人恼火，因为它是间断的。因此，SLA通常必须同时限制P50和P99，例如“P50<100ms
    且 P99<300ms”。\n\n⚙️ 优化P99的策略\n\n- 资源隔离：使用MIG或时分复用避免干扰。\n\n- 调度优化：确保decode请求不被prefill长时间阻塞（分段prefill）。\n\n-
    显存管理：防止KV Cache碎片导致的分配停顿。\n\n- GC调优：避免CUDA或Python GC引发的突发暂停。\n\n\U0001F4A1 实际案例：我们曾遇到TPOT
    P50约60ms，但P99超过2秒。排查发现是vLLM的block manager在显存紧张时触发了大量的碎片整理，导致偶尔的decode step长时间阻塞。通过降低gpu_memory_utilization并增加节点解决了问题。\n\n---"

content:
  prompt: GPU 利用率和显存占用都很高，是否代表推理服务处于最佳状态？为什么不一定？
answer:
  mode: rubric
  reference_answer: "❌ 不一定。 GPU 高利用率可能隐藏着糟糕的调度和资源浪费。\n\n\U0001F50D 场景分析\n\n- 无效计算：模型正在为即将被丢弃的短请求重复计算大量
    padding token（静态批处理），利用率高但有效吞吐低。\n\n- 等待而非计算：利用率 100% 可能是因为大量时间花费在显存读写（带宽瓶颈），而非计算核心真正忙碌。此时如果增大
    batch size，吞吐可能不会提升。\n\n- 计算碎片：Prefill 和 Decode 混杂调度时，可能因为长 Prefill 阻塞所有 decode，decode
    算力空转但利用率显示被 Prefill 占满。\n\n- 资源竞争：多租户下，一个租户占用所有显存，其他租户排队，整体吞吐低下。\n\n\U0001F4C8
    真正的最佳状态：\n\n- GPU 利用率 > 90%，同时 TPOT P99 依然较低且稳定。\n\n- 显存占用高，但 KV Cache 命中率也高，没有频繁的
    OOM 或碎片整理。\n\n- 吞吐量达到平台的理论上限附近，且延迟满足 SLA。\n\n\U0001F4A1 经验：如果 GPU 利用率 99% 但 TPOT
    很高，通常是带宽瓶颈；如果利用率波动大，可能是调度问题。需要结合延迟和吞吐综合判断。\n\n---"

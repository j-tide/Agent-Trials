content:
  prompt: "\U0001F4E1 对于流式输出，服务端如何通过 SSE 协议逐步推送 token？连接断开时如何清理资源？"
answer:
  mode: rubric
  reference_answer: "Server-Sent Events (SSE) 是 LLM 流式输出最常用的协议，它允许服务器通过一个长连接持续向客户端推送数据（token）。这里是一个完整的实现流程和资源管理策略。\n\n\U0001F6E0️
    SSE 实现流式输出的步骤\n\n- 建立 SSE 连接\n客户端（通常是浏览器）通过 JavaScript 的 EventSource API 或普通的
    HTTP fetch 连接到服务端的一个特定端点（如 /v1/chat/completions/stream）。请求头中 Accept: text/event-stream
    表示接受 SSE。\n\n- 服务端发送响应头\n服务端收到请求后，返回状态码 200，并设置以下响应头：\n\nContent-Type: text/event-stream\nCache-Control:
    no-cache\nConnection: keep-alive\n\n这告诉客户端这是一个 SSE 流，不要缓存，保持连接。\n\n- 逐步推送 token（数据）\n推理引擎（如
    vLLM）在生成每个 token 时，通过回调将 token 文本发送给客户端。服务端将该 token 封装为标准 SSE 格式的数据块：\n\ndata:
    {\"token\": \"你好\", \"index\": 0}\n\n- data: 前缀，后面是 JSON 或其他格式的有效载荷。\n\n- 两个换行符表示一个事件的结束。\n\n-
    服务端可以逐 token 发送，也可以每收集几个 token 发送一次，以减少网络包数量。\n\n- 流结束信号\n当模型生成完毕或遇到停止条件时，服务端发送一个特殊的
    SSE 事件标识完成：\n\ndata: [DONE]\n\n- 然后服务端主动关闭连接。\n\n\U0001F50C 连接断开时的资源清理\n\n流式输出依赖长连接，连接可能因网络波动、客户端关闭、超时等原因意外断开。必须妥善清理相关资源，防止内存泄漏。\n\n-
    检测断开：如果客户端主动关闭连接（如页面刷新），服务端在尝试往 socket 写入数据时会收到 BrokenPipeError 或 ECONNRESET 异常。服务端需要捕获这个异常。\n\n-
    设置超时：为 SSE 连接设置读/写超时。如果服务端长时间没有数据发送（比如模型推理卡死），或者客户端长时间没有响应，主动关闭连接。\n\n- 关联推理任务：每个
    SSE 连接通常对应一个唯一的推理请求 ID。当连接断开时，服务端需要根据这个 ID 找到正在执行的推理任务，并调用推理引擎的 abort 或 cancel
    接口，停止该请求的生成，并释放其占用的 KV Cache 等资源。vLLM 等框架支持通过 API 取消特定请求。\n\n- 使用异步框架：现代异步 Web
    框架（如 FastAPI, Starlette）能很好地管理长连接生命周期，在连接断开时触发清理回调。例如，FastAPI 的 StreamingResponse
    配合 try...finally 或 asyncio 的取消机制，可以安全地释放资源。\n\n- 监控：实时监控活跃 SSE 连接数、因断开导致的中止次数，帮助评估系统健康度。\n\n\U0001F4A1
    最佳实践：始终为每个流式请求设置显式的生成 ID，在连接断开或异常时调用推理引擎的取消接口；使用 asyncio 和合理的超时设置，避免僵尸连接占用资源。\n\n---"

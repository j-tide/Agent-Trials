content:
  prompt: 部署 30B 模型到单张 24GB 显卡，可能吗？需要用到哪些技术？
answer:
  mode: rubric
  reference_answer: "答案是：可能，但这属于一场极限挑战。30B 模型在 FP16 下仅权重就高达 60 GB，是 24 GB 显卡容量的 2.5
    倍。要把这头“大象”塞进“冰箱”，必须动用一组顶级的压缩和优化技术。\n\n- \U0001F9E0 INT4 权重量化（核心前提）：使用 GPTQ 或 AWQ
    等算法，将权重压缩到约 15 GB。这是整个方案的基石，没有它一切免谈。\n\n- \U0001F4C9 应用 GQA（架构优化）：如果模型本身不是 GQA，可在微调或转换时进行“GQA
    化”，将 KV Cache 大小缩减到原来的 1/4~1/8，为紧张的显存省出宝贵空间。\n\n- ✂️ 限制最大上下文长度：必须设定一个较短的上限（如 1024
    或 2048 tokens），绝不允许 KV Cache 无限制增长。\n\n- ⚙️ 极致显存管理：使用 vLLM 或 TensorRT-LLM 等框架，开启
    PagedAttention 和 INT8/FP8 KV Cache 量化，最大程度减少碎片并压缩记忆开销。\n\n- \U0001F4E6 CPU Offload（兜底方案）：如果上述努力后仍
    OOM，可将模型中不常用的几层权重放在 CPU 内存中，在计算时动态加载。这会极大地牺牲推理速度，但能在“跑起来”和“跑得快”之间做出妥协。\n\n现状：在
    24GB 的消费级显卡（如 RTX 3090/4090）上，通过 4-bit 量化 + GQA + FlashAttention + vLLM 的组合方案，已经可以流畅运行
    30B 甚至 34B 的模型，在 2048 长度的上下文中进行对话。这背后是无数工程师在算法和系统工程上的极致优化。\n\n---"

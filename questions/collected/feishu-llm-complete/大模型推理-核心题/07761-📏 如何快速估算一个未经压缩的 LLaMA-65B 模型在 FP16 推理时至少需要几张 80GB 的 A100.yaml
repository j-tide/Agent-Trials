answer:
  mode: rubric
  reference_answer: "我们需要分别计算权重、KV Cache 和激活的显存需求，然后确定最小 GPU 数量。\n\n权重显存\n\n[图片内容未导入]\n\n激活与框架\n\n在
    Prefill 时，激活峰值受注意力矩阵影响。使用 FlashAttention 后，激活显存可控制在 10 GB 以内。框架额外开销约 2 GB。\n\n总显存需求\n\n权重
    130 GB + KV Cache 5 GB + 激活 10 GB + 框架 2 GB ≈ 147 GB。\n\n因此，单卡 80 GB 不够，需要至少 2
    张 A100 80GB。使用 TP=2 将权重切分，每张卡 65 GB 权重 + 2.5 GB KV Cache（减半） + 5 GB 激活 ≈ 72.5
    GB，刚好可以容纳。若 batch 稍大或序列更长，则需要更多显存或更大并行度。\n\n\U0001F4A1 结论：65B 模型 FP16 推理，至少需 2×A100
    80GB（TP=2），安全起见常用 4 卡。\n\n---"

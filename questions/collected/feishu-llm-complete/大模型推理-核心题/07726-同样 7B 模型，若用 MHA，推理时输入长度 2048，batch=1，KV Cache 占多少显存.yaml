  prompt: 同样 7B 模型，若用 MHA，推理时输入长度 2048，batch=1，KV Cache 占多少显存？
answer:
  mode: rubric
  reference_answer: |-
    现在我们要让模型真正“思考”起来。当输入长度为2048个token，且一次只回答一个问题（batch=1）时，模型需要“记住”这些token的KV对。我们需要代入具体模型架构参数。以标准的LLaMA-7B为例：

    - L = 32层

    - D_{\text{model}} = 4096

    - H = 32个头 (这里D_model = H * d_h, d_h=128)

    - S = 2048

    - B = 1

    - sizeof(dtype) = 2 (FP16)

    我们代入公式：

    [图片内容未导入]

    这个计算过程可以这样直观理解：

    - 每一层的Key或Value缓存大小 = 2048 (序列长度) × 4096 (模型宽度) × 2 (字节) ≈ 16 MB。

    - 每一层完整的KV缓存（K+V两份） = 16 MB × 2 = 32 MB。

    - 所有32层的KV缓存 = 32 × 32 MB = 1024 MB = 1 GB。


content:
  prompt: "\U0001F4E1 推理服务如何实现流式输出？一般用 SSE 还是 WebSocket？"
answer:
  mode: rubric
  reference_answer: "流式输出允许模型一边生成 token 一边将结果推送给用户，显著提升体验。在 LLM 推理服务中，这主要通过 SSE（Server-Sent
    Events） 或 WebSocket 实现。\n\n\U0001F4E1 SSE（Server-Sent Events）\n\n- 原理：服务器向客户端建立一个单向的
    HTTP 长连接，通过 text/event-stream 格式持续推送数据流，每个数据块（一个 token）被封装为一个 data: 字段。\n\n- 优点：\n\n-
    缺点：\n\n\U0001F50C WebSocket\n\n- 原理：建立一个全双工、持久化的 TCP 连接，客户端和服务器可以互相推送消息。\n\n-
    优点：\n\n- 缺点：\n\n⚖️ 如何选择？\n\n- 纯流式输出展示：首选 SSE。实现简单，浏览器天然支持，无需额外库。vLLM、FastChat
    等框架默认支持 SSE。\n\n- 需要交互控制（如中途停止生成、调整参数）：推荐 WebSocket。它可以在同一连接上发送“停止”信号，立即中断推理，节省资源。\n\n-
    混合方案：使用 SSE 进行流式输出，同时暴露一个 RESTful API 来执行取消操作（通过生成 ID 关联）。这是许多商业 API（如 OpenAI）的做法。\n\n\U0001F6E0️
    技术实现要点\n\n- 框架支持：vLLM、TensorRT-LLM 等服务框架已内置 SSE/WebSocket 支持，只需在启动时配置即可。\n\n-
    缓冲：避免每个 token 都单独发送，可设置一个很小的缓冲区（如每 5 个 token 发送一次）来减少网络开销。\n\n- 错误处理：生成过程中如果发生错误（如
    OOM），应通过特殊的 SSE 事件或 WebSocket 消息通知客户端。\n\n\U0001F4A1 推荐：新项目优先用 SSE，生态成熟。如果交互性要求极高，再上
    WebSocket。\n\n---"

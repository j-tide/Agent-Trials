content:
  prompt: "\U0001F4F8 如果用户上传的图片或文本长度差异巨大，推理服务如何平衡批处理效率和延迟？"
answer:
  mode: rubric
  reference_answer: "多模态服务或变长文本推理面临着这样的难题：在一个 batch 中，有的请求只处理 10 个 token 的短 prompt，有的却要处理
    8k token 的长文档。如果不加处理，短请求会被长请求严重拖慢（计算气泡），延迟大幅增加。\n\n\U0001F3AF 策略一：长度感知的批处理分组\n\n-
    调度器在组建批次时，将长度相近的请求放入同一批次。例如，将 prompt 长度分为短（<512）、中（512‑2048）、长（>2048）三个队列。\n\n-
    每个队列独立组成批次，这样短请求不会等长请求，延迟稳定。\n\n- 缺点是可能降低 GPU 利用率（短请求的 batch 可能很小），需要动态平衡。\n\n⚙️
    策略二：分段 prefill 与 decode 分离\n\n- 对于特别长的 Prompt，vLLM 等框架支持分段 prefill（Chunked Prefill）：将长
    Prompt 的 prefill 分成多个小块，分散在多个 decode step 中执行。\n\n- 这样，即使一个长请求正在处理，它也不会一次性占用 GPU
    太长时间，允许 decode 请求随时插入，减少了对短请求的阻塞。\n\n\U0001F527 策略三：动态批处理 (Continuous Batching)
    本身就缓解了此问题\n\n- 短请求完成后立即退出批次，其资源被回收，长请求继续。这比静态批处理灵活得多。\n\n\U0001F4CF 策略四：使用不同的
    GPU 或实例处理不同长度\n\n- 将推理集群分为多个池：一个低延迟池只处理短 prompt（限制最大 token 数），另一个通用池处理长 prompt。\n\n-
    用户可以根据需求调用不同的 API 端点。这相当于资源隔离。\n\n\U0001F4A1 实践：通常首选分段 prefill + Continuous Batching，这是目前
    vLLM 的默认行为，在长文本和短文本混合场景下表现稳健。如果长文本占比极高且延迟不敏感，可以考虑分池处理。\n\n---"

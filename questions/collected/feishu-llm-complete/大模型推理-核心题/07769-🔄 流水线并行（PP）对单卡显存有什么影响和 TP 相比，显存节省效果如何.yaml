content:
  prompt: "\U0001F504 流水线并行（PP）对单卡显存有什么影响？和 TP 相比，显存节省效果如何？"
answer:
  mode: rubric
  reference_answer: "流水线并行（PP）按层切分模型。例如，一个 32 层的模型，PP=2，则 GPU0 放置第 1‑16 层，GPU1 放置第
    17‑32 层。\n\n\U0001F9E0 对单卡显存的影响\n\n- 权重：每张卡只保存自己负责的那部分层的权重，因此权重显存大约是原来的 1/PP。\n\n-
    KV Cache：类似，每张卡只保存自己负责的那些层的 KV Cache。但注意，对于 Decode 阶段，每张卡都需要处理它负责的层，其输入是从前一层传来的中间激活。每张卡的
    KV Cache 仅限于自己层，总量也是 1/PP。\n\n- 激活值：流水线并行中，中间激活需要在 GPU 间传递（点对点通信）。每张卡的激活峰值取决于它处理的层数和
    micro‑batch 大小，通常也是 1/PP。\n\n⚖️ 与 TP 的对比\n\n显存节省效果：对于相同的并行度（如 TP=2 vs PP=2），TP
    通常能更均匀地切分权重和激活，显存节省比例相似，但 TP 的通信更频繁。PP 的优势在于跨节点扩展时通信压力小，且可以结合 TP 使用（TP 用于层内，PP
    用于层间）。\n\n\U0001F4A1 实际中，对于 70B 模型，通常先用 TP=2 解决单层权重过大问题，若多卡仍不够，再叠加 PP。单纯 PP 已很少单独用于推理，因为它的
    pipeline bubble 可能降低吞吐。\n\n---"

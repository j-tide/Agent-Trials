content:
  prompt: "\U0001F4C8 推理时，如果 batch size 从 1 增加到 32，显存瓶颈通常从权重转移到哪部分？"
answer:
  mode: rubric
  reference_answer: |-
    从模型权重转移到 KV Cache。

    在小 batch 时，KV Cache 相对较小，权重占据显存大头。例如 batch=1，7B 模型权重 14 GB，KV Cache 仅 0.5 GB。当 batch 增大到 32，KV Cache 线性增长为 0.5 GB × 32 = 16 GB，瞬间成为比权重还大的显存消耗者。同时，临时激活值（如 batch 下的 prefill 激活）也会成倍增长，但通常 KV Cache 是最主要的瓶颈。

    因此，限制高并发推理吞吐量的通常是 KV Cache 的显存容量，而不是权重。这也是为什么优化 KV Cache（GQA、量化、PagedAttention）对于提高 serving 效率至关重要的原因。


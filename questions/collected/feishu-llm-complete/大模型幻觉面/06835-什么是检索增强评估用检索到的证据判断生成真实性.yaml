content:
  prompt: 什么是“检索增强评估”？用检索到的证据判断生成真实性。
answer:
  mode: rubric
  reference_answer: |-
    检索增强评估（Retrieval-Augmented Evaluation, RAE） 是一种自动化事实性评估范式，核心思想是对于待评估的生成文本，实时检索外部知识源（如维基百科、新闻库、搜索引擎），将检索到的权威文档作为证据，来验证生成文本中的声明是否真实。它是将RAG的思想逆向用于评估。

    工作流程：

    - 声明分解：将生成文本拆分为原子事实（如“巴黎是法国首都”）。

    - 查询生成与检索：对每个原子事实生成搜索查询（抽取实体和核心谓词），调用搜索引擎API或知识库，获取Top-K相关文档或片段。

    - 证据精炼：对检索到的文档进行重排序和片段选择，找出与声明最相关、最权威的段落。

    - 事实校验：使用NLI模型或问答模型，判断证据是否蕴含该声明。若证据蕴含，则声明为真；若矛盾，则为假（幻觉）；若证据不足，则标记为“无法验证”或视为可能幻觉。

    - 聚合评分：根据每个声明的验证结果，计算整体的真实性得分（如FActScore）。

    与传统评估的区别：

    - 传统自动评估指标（如BLEU、ROUGE）只比较与参考文本的表面相似性，无法判断事实真假；而RAE直接与外部世界知识对接，能评价开放域生成的事实性。

    - 相比固定数据集评估，RAE可以适应任意新生成的文本，具有良好的泛化性。

    优势：

    - 动态与时效：只要搜索引擎能获取最新信息，即可核查时效性事实，不受模型知识截止的限制。

    - 可解释：每个验证结果都附有证据来源，便于回溯和分析。

    - 可扩展：理论上可以核查任意领域的声明，只需相应知识库可检索。

    挑战与局限：

    - 检索质量依赖：若检索返回不相关或错误文档，评估结果被污染。

    - 证据理解难度：有些声明需要多跳推理或隐含知识，简单NLI可能无法准确判断。

    - 计算开销：大量原子事实的检索和NLI耗时较长。

    - “无法验证”的处理：许多真实陈述因网络覆盖不足而找不到证据，可能被误判为幻觉。

    尽管有局限，检索增强评估是目前最接近人类事实核查的自动化方法之一，在FActScore、TruthfulQA等基准中被广泛采用。


content:
  prompt: 在 AGI 构想中，如何定义和衡量“不可接受的幻觉水平”？
answer:
  mode: rubric
  reference_answer: |-
    在AGI（通用人工智能）构想中，幻觉的可接受性将不再仅仅是一个技术指标，而是一个涉及伦理、法律、社会和风险管理的多维决策框架。

    定义“不可接受的幻觉水平”的原则：

    - 基于风险严重度分级：将幻觉的不可接受性与可能造成的危害直接挂钩。可以定义：

    - 情境与自主程度权衡：

    衡量不可接受水平的指标体系：

    - 关键应用上的幻觉率：针对灾难级和高风险领域，直接计算幻觉发生率，要求为0或接近0。

    - 幻觉严重度加权错误率：对不同类型的幻觉赋予严重度权重，计算加权后的整体危害指数。

    - 可检测性与可恢复性：除了发生率，还需衡量“未检测到的幻觉比例”和“发生幻觉后自动纠正或人工介入的成功率”。一个系统即使偶尔产生幻觉，但如果几乎总能在造成危害前被拦截和修正，其实际不可接受水平也会大大降低。

    - 用户信任校准度：衡量用户是否能准确判断何时信任AGI的输出。如果AGI的幻觉高度隐蔽、导致用户过度信任（信任崩溃），即便绝对率低，也可能被认为是不可接受的。

    - 公平性与无偏见：幻觉若系统性地针对特定人群，即使总量低，也是不可接受的，需要用公平性指标单独衡量。

    动态与演进：随着社会对AGI的依赖加深，可接受水平会不断收紧。AGI系统需要透明的幻觉报告机制、独立的审计与持续的监督学习，形成一个动态改进的闭环。


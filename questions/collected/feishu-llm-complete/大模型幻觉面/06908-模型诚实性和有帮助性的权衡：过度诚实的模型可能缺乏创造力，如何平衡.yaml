content:
  prompt: 模型“诚实性”和“有帮助性”的权衡：过度诚实的模型可能缺乏创造力，如何平衡？
answer:
  mode: rubric
  reference_answer: |-
    核心矛盾：诚实性要求模型承认知识边界、避免无据编造；有帮助性则要求模型尽可能满足用户需求，提供详尽、创造性的回复。二者存在天然的张力：过度诚实会导致模型频繁拒答、输出过于保守，损害用户体验；过度帮助则可能诱使模型在不确定时强行编造，产生幻觉。

    平衡策略：

    （1）场景化分级与用户意图识别

    - 事实性场景（知识问答、医疗建议、法律咨询）：诚实性优先。模型应严格基于可验证的证据作答，缺乏证据时明确拒答或表达不确定性。这可通过领域分类器或意图识别自动切换。

    - 创意性场景（故事写作、头脑风暴、聊天）：帮助性优先，允许受控虚构。模型可在系统指令下明确告知用户“以下为创意内容，并非真实”，让用户在知情的前提下享受创造力。

    - 混合场景：可根据用户提示词中的信号动态调整。例如，若用户说“请发挥想象”，则放松事实约束；若用户说“请提供准确数据”，则收紧。

    （2）分层响应策略

    - 模型可先提供一个“诚实核心”的回答（明确所知和所不知），再附加一个“条件性扩展”（“如果你需要，我可以基于假设进行推演，但请注意这并非事实”）。这种结构既保留了诚实性，又提供了延展帮助。

    （3）用不确定性表达替代生硬拒答

    - 不说“我不知道”，而是采用“我目前没有找到确切答案，但据现有知识推测…”或“该信息可能存在多个版本，以下是其中一种较普遍的说法…”。这种“诚实的推测”在保持诚实底色的同时提升了帮助性。

    （4）训练中对“知之为知之”的正向激励

    - 在RLHF或DPO中，对准确回答和恰当拒答都给予高分，而不仅仅是奖励详尽的答案。构造偏好数据时，让“诚实且适度扩展”的回答优于“生硬拒绝”，更优于“自信编造”。

    （5）用户控制权

    - 提供“严谨模式”和“创意模式”开关，让用户自行决定当前对话中诚实性与创造性的优先权。这是产品层面的直接解法。

    结论：平衡的关键在于让诚实性成为有帮助性的高级形式——不是简单地拒绝，而是通过透明、分层、条件化的方式，在尊重事实边界的同时，最大化地为用户提供可用的信息和创意。


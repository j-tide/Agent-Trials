content:
  prompt: 幻觉是否一定是坏事？有没有“有用的幻觉”（如创意写作）？
answer:
  mode: rubric
  reference_answer: |-
    不，幻觉并非绝对有害。在适当场景下，幻觉可以成为创造性、想象力和多样性的驱动力，即“有用的幻觉”（Constructive Hallucination）或“受控幻觉”。

    幻觉的双重属性：

    - 有害幻觉：当任务要求真实性、事实准确性、对源文的忠实度时（如医疗咨询、新闻摘要、法律文书、代码生成、学术写作），任何偏离事实的生成都是有害的。

    - 有用幻觉：在需要发散思维、艺术创作、娱乐等场景中，模型“编造”内容的能力恰恰是核心价值所在。

    有用幻觉的场景与形式：

    （1）创意写作与文学

    - 写小说、诗歌、剧本时，模型需要构造虚构的人物、事件、世界。这种对现实的偏离是创造，而非错误。例如，让模型描绘“龙与魔法师的对决”就是在可控地运用幻觉能力。

    - 模型可以生成超现实的情节、不存在的科技产品设定，丰富艺术表现。

    （2）头脑风暴与创新思维

    - 在构思新产品、广告创意、解决方案时，模型提出的“虚构案例”或“不存在的功能”可能启发人类的创新思路。即使这些建议本身不真实，但可以打破思维定式。

    - 例如，问“如何设计一款让人可以飞行的鞋？”模型会生成基于反重力的设想，虽然不真实但有启发性。

    （3）教育和解释中的类比与故事

    - 为了解释复杂概念，模型可能会编造一个简化的故事或类比，其中包含事实不完全精确的元素，但有效传递了核心思想。例如用“一只看不见的手”解释市场调节，即使手并不存在。

    - 关键在于使用者清楚这些是教学工具，而非事实陈述。

    （4）对话中的社交润滑

    - 在闲聊时，模型生成一些无害的小故事、虚构的个人经历（如“我有个朋友曾经……”），能让人机交互更自然，增强亲和力，这在社交对话中是合意的。

    （5）数据增强与模拟

    - 用模型生成虚构的训练数据（例如稀有事件的对话样本、合成患者病例用于隐私保护训练），这类幻觉直接服务于下游任务性能提升。

    边界与控制：

    - “有用幻觉”的前提是用户和开发者明确知晓并同意在该场景下接受虚构。这就需要在系统设计时划分“事实模式”与“创意模式”。

    - 在创意模式下，可以通过系统提示（如“请发挥你的想象力，不必拘泥于现实”）开启受控幻觉；在事实模式下，则通过检索增强、事实核查和拒绝策略严控幻觉。

    - 可解释性：告知用户生成内容的性质，尤其是在真假边界模糊的应用中。

    结论：幻觉是生成式模型的内在能力光谱的一端，其价值取决于语境。关键在于赋予开发者控制能力，让幻觉在正确的任务上成为“想象力”，在错误的任务上则被严格抑制。


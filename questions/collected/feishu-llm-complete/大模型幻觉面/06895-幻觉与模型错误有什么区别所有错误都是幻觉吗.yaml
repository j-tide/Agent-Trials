content:
  prompt: 幻觉与模型“错误”有什么区别？所有错误都是幻觉吗？
answer:
  mode: rubric
  reference_answer: |-
    区别：幻觉是模型错误的一个子集，但并非所有模型错误都是幻觉。二者在成因和表现上有重要差异。

    - 模型错误（Model Error） 是一个广义概念，指模型输出偏离了预期正确目标的一切情况。它可以分为多种类型：

    - 知识缺失型错误：模型对事实记忆不清或根本没有学到该知识，例如被问到冷门日期时猜测错误。模型可能表现出不确定或回避，也可能给出错误答案。

    - 推理错误：逻辑链断裂、计算失误，即便掌握了相关事实，仍得出错误结论。例如解数学题过程中一步算错。

    - 格式或对齐错误：输出格式不符、拒绝回答合理问题、重复循环等。

    - 感知错误（多模态）：视觉识别错误（把猫认成狗）。

    - 幻觉错误：这是错误中的一个特定类别。

    - 幻觉的独特性：幻觉的核心在于模型无中生有地“编造”内容，并且通常以极高的置信度呈现，使其难以与正确知识区分。幻觉产生的内容往往语法完美、风格一致，且与上下文高度融洽，在外部事实核查之前极具欺骗性。与此相对，普通的“错误”可能包含不确定的表达、明显的推理漏洞或格式混乱。幻觉中的错误是被模型的语言能力包装过的，它并不只是“答错了”，而是“自信地胡说”。

    - 举例区分：

    - 问题：“谁发现了万有引力？” 模型回答：“爱因斯坦发现了万有引力。”（错误，但不是典型幻觉，这是知识混淆，模型可能只是混淆了人名。）

    - 问题：“介绍一下 1990 年世界杯的吉祥物。” 模型回答：“1990 年世界杯吉祥物是‘Ciao’，一只意大利灵缇犬，身穿绿白红三色球衣……” 如果实际上 1990 年世界杯没有吉祥物，这就是典型的幻觉——模型在知识空缺时用语言能力构造了一个细节丰富的虚构实体。

    - 问题：摘要一篇科技文章，原文没有提到任何量子计算，但模型摘要中出现“该研究有望推动量子计算发展”——这是忠实性幻觉，无故添加了原文不存在的信息。

    因此，所有幻觉都是错误，但并非所有错误都是幻觉。幻觉特指那些由于生成机制固有缺陷而产生的虚构且呈现为事实的输出。


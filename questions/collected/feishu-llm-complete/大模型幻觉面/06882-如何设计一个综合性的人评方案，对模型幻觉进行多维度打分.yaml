content:
  prompt: 如何设计一个综合性的人评方案，对模型幻觉进行多维度打分？
answer:
  mode: rubric
  reference_answer: |-
    设计一个全面的人评方案需明确维度、制定详细的标注规范、设计科学的评估流程和质量控制，以捕捉幻觉的多个侧面。

    （一）评估维度设计（多维度打分）

    综合方案应评估以下核心维度，每个维度单独打分（如1-5分或0-1连续量表）：

    - 事实性（Factuality）：生成内容是否与客观世界事实相符。子维度可包括：实体准确性、数值准确性、时间准确性。

    - 忠实性（Faithfulness）：生成内容是否忠实于给定的上下文/源文。子维度：无据添加程度、信息遗漏程度、内容歪曲程度。

    - 一致性（Consistency）：内部前后是否矛盾。子维度：局部一致性（句子间）、全局一致性（全文/全对话）、与历史承诺一致性（多轮对话）。

    - 来源可靠性（Attribution / Grounding）：对于声称引自某源的内容，引用是否真实存在且内容匹配。评估引用准确率。

    - 知识边界诚实度（Honesty about Knowledge Boundaries）：在面对不确定、无法知晓或超出知识范围的问题时，模型是否诚实地表达不确定性或拒绝回答，而不是强行编造。可评估“拒答恰当性”和“过度自信程度”。

    - 时效性（Temporal Accuracy）：对于时敏信息，答案是否反映了最新真实情况，而不是过时数据。评估是否错误地使用了截止日期前的旧信息。

    - 安全与偏见（Safety & Bias）：幻觉内容是否涉及有害、歧视性或冒犯性的虚构信息。虽然这更偏向安全评估，但由幻觉引发的有害陈述应在此维度惩罚。

    （二）标注指南与细粒度标签

    - 制定详细的标注手册，包含每个维度的定义、正面/反面示例、边界案例。

    - 标注者不仅给出维度的分数，还需要对存在严重幻觉的文本进行高亮标注，并选择错误类型（如“捏造实体”、“数字错误”、“矛盾”、“无据引用”、“过时信息”等）。

    - 提供标准化的标注界面（如 LabelStudio 配置），支持文本高亮、维度评分滑块、下拉选项等。

    （三）评估流程

    - 样本抽样：从模型真实交互数据中分层抽样，确保覆盖不同主题、长度、任务类型，并包含预期的高风险场景（如医疗建议）。

    - 任务设计：每个评估任务单元包含：完整的输入（对话历史、源文等）、模型输出、以及可选的辅助验证信息（如检索到的证据段落、知识截止日期提示）。

    - 双重标注与仲裁：每个样本至少由两名独立标注者评估。计算评分者间信度（如加权 Kappa）。对于分歧大于阈值的样本，引入第三方资深专家仲裁。

    - 先导测试与培训：进行多轮先导测试，校准标准，直至评分者信度达标（如 Kappa>0.7）。持续培训与答疑。

    （四）质量控制

    - 嵌入金标准题目（已知分数的高质量样本）作为陷阱题，实时监控标注质量。

    - 限制每日标注量，防止疲劳。

    - 定期举行校准会议，讨论疑难案例，更新指南。

    （五）综合评分与报告

    - 总分聚合：根据应用场景对各维度加权求和，得到一个综合的“幻觉严重度指数”。例如，高风险领域给事实性和安全性更高权重。

    - 细粒度报告：提供按维度、按错误类型的细分统计，定位模型的主要短板。例如，“模型在历史类问题实体准确率高，但时间准确率低，经常错配年代”。

    - 可操作的分析：标注过程中收集的修改建议和正确版本，可用于生成训练数据，直接改进模型。

    这样的人评方案成本高但价值巨大，不仅提供了准确的性能衡量，还提供了模型改进所需的详细错误分析，是构建可信大模型不可或缺的一环。


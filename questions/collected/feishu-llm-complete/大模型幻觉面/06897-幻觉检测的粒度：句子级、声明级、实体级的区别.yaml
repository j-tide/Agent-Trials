content:
  prompt: 幻觉检测的粒度：句子级、声明级、实体级的区别。
answer:
  mode: rubric
  reference_answer: |-
    幻觉检测的粒度决定了系统定位错误的精细程度，不同粒度适用于不同目标和成本。

    （1）句子级（Sentence-level）

    - 定义：以完整句子为单位，判断该句是否包含任何幻觉。

    - 标签：通常为二分类（含幻觉/不含幻觉），或三分类（完全忠实/部分幻觉/全是幻觉）。

    - 优点：标注简单快速，适合粗粒度评估，可快速了解整体可信度。

    - 缺点：无法定位具体错误词；一个句子可能大部分正确但仅有一个实体错误，句子级标签无法精确指导修正。

    - 应用：用于初步筛选、整体质量报告。

    （2）声明级（Claim-level / Atomic Fact）

    - 定义：将文本拆解为最小的独立事实主张（原子事实），每个主张可被单独验证。例如，“巴黎是法国的首都，拥有埃菲尔铁塔”拆为两条声明。

    - 标签：每条声明分别判断是否被支撑/矛盾/无依据。

    - 优点：粒度精细，可精确计算幻觉比例（如FActScore），错误定位准确，便于分析与修复。

    - 缺点：拆分需额外步骤（自动或人工），标注和验证成本高；拆分质量影响后续检测。

    - 应用：深度评估、模型诊断、可信度打分的主流方式。

    （3）实体级（Entity-level / Span-level）

    - 定义：识别文本中具体的错误实体、数字、短语（连续token），指出幻觉的具体span。

    - 标签：幻觉片段的高亮及其正确版本（如适用）。

    - 优点：最细粒度，直接指向需修正的文本部分，适合用于自动纠错和人机交互修正。

    - 缺点：标注极其耗时，需要高度训练；自动检测难度大；难以覆盖结构性或无实体的幻觉（如整体逻辑错误）。

    - 应用：辅助写作、新闻事实核查的修正建议。

    （4）其他粒度

    - 文档级：判断整篇文章是否包含幻觉，仅提供有/无判断，信息量最小。

    - 子句级：介于句子和声明之间，有时作为一个折中。

    实际应用中的组合：

    - 自动化系统常采用声明级作为核心，辅以实体级高亮；人工评估也可先用句子级筛出问题段落，再深入声明级和实体级分析。多粒度协同可兼顾效率与精度。


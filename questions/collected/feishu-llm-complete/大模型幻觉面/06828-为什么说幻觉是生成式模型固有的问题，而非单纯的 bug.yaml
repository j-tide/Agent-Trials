content:
  prompt: 为什么说幻觉是生成式模型固有的问题，而非单纯的 bug？
answer:
  mode: rubric
  reference_answer: |-
    幻觉并非简单的工程缺陷，而是源于当前生成式大语言模型的基本工作原理、训练目标和评估范式，具有结构性、原生性。

    （1）基于语言建模的训练目标导致

    - 语言模型的训练目标是最小化下一个 token 的负对数似然，即最大化训练语料中文本序列的概率。这个目标鼓励模型学习“看起来像人类写的文本”，而不是“说出真相”。

    - 训练数据中包含着大量虚构作品、错误信息、过时事实、主观观点等，模型无法区分哪些是客观事实、哪些是虚构。它只学会了统计学上的共现模式，因此当被问及不确定的事实，会倾向于生成统计上最“自然”的延续，这种延续可能是错误的，但很流畅。

    （2）生成机制导致的“合理猜测”

    - 自回归生成过程中，模型在每一个时间步基于之前已生成的 token 来预测下一个 token。当一个错误 token 被采样并进入上下文后，模型会接着编造后续内容以维持连贯性（即“雪球效应”）。这导致模型经常一条路走到黑。

    - 为了维持输出的连贯、一致、信息量，模型被隐式地鼓励去填补知识空白，因为拒绝回答、表示不确定性、留下空白并不符合训练数据中人类文本的分布（人们通常不会在教科书中写“我不知道”）。

    （3）软性知识存储与压缩的缺陷

    - 模型并非数据库，知识是以分布式、高度压缩的形式存储在参数中的。这种压缩是有损的，特别是对于长尾实体或细节，存储的信号可能模糊或混淆。当模型要“解码”这些知识时，容易出现类似人类记忆的错构或重构现象。

    - 神经网络的连续表征没有内置的真值检验机制，模型无法自我验证“我是否真的知道这件事”，它只能根据上下文激活相关概念。有时激活了相邻但不正确的概念，就造成了幻觉。

    （4）解码策略的推波助澜

    - 常用的解码策略如贪心搜索、Top-k/Top-p 采样，本质都是基于模型输出的概率。但模型对事实的不确定性往往不会表现为低概率或平坦分布——研究发现，模型在产生幻觉时往往置信度很高。因此基于概率的生成策略无法识别并阻止幻觉，甚至可能优先选择高频但错误的模式。

    （5）任务的开放性

    - 大模型被用于开放域对话、创意写作、推理等多种任务，边界极其模糊。某些场景下，虚构和想象是可接受的，甚至是期望的（如编故事）；在其他场景下则是有害的。这种同一模型需兼具创意与事实性的矛盾，根源上难以调和，因此幻觉倾向成为模型的多面性中必然附带的一面。

    因此，幻觉是“预测下一个词”这一单一范式与“追求真相”这一复杂目标之间深层矛盾的体现，是生成式模型的天生特征，而非靠修补某个模块就能根除的 bug。


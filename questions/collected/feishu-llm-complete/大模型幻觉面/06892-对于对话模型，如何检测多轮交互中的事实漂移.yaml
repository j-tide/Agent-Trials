content:
  prompt: 对于对话模型，如何检测多轮交互中的事实漂移？
answer:
  mode: rubric
  reference_answer: |-
    多轮对话中的事实漂移（Fact Drift）指模型在长对话中逐渐遗忘、混淆或修改先前建立的事实，导致输出与对话历史矛盾。检测此类幻觉需要专门针对跨轮次的状态一致性进行建模。

    检测方法：

    （1）对话状态追踪与校验

    - 建立显式的对话状态（槽位-值对），如“用户姓名：小明”、“目的地：巴黎”。每一轮生成回复后，自动抽取其中涉及的状态声明，与历史状态进行对比。如果新声明与旧状态冲突（例如后轮中说“好的，为您预订去伦敦的机票”），则触发事实漂移警报。

    - 可以使用信息抽取模型或大模型自动将对话历史转为结构化状态，再通过规则或语义匹配进行一致性检查。

    （2）跨轮次语义蕴含

    - 将整个对话历史切分为事实片段，对于模型的最新回复，逐句提取声明，并在对话历史的所有语句中寻找支撑证据。使用 NLI 模型判断：如果最新声明与历史中某个部分矛盾，或无法被历史任何部分蕴含，则可能为幻觉漂移。

    - 需要重点关注否定、更替和遗忘的模式：用户纠正过的事实是否被模型后续采纳，还是又漂移回旧信息？

    （3）自我一致性采样

    - 对同一个多轮对话历史，多次采样生成不同的未来回复。比较这些回复在关键事实点上是否一致（如使用类似SelfCheckGPT的跨生成一致性）。如果模型在某个事实上回答差异大，说明它对该事实的记忆不确定，可能已发生漂移。

    - 可用于在线检测：在生成回复前，先在后台进行若干次“预生成”，检查关键事实的一致性，低一致性则标记风险。

    （4）对话记忆增强的幻觉检测器

    - 微调一个专门的多轮幻觉检测模型，输入为完整对话历史和当前回复，输出逐句的忠实度标签。训练数据可以通过扰动真实对话来构造：在正确对话中故意插入前后矛盾的语句，作为正例（幻觉）。

    - 该模型能够隐式学习长期依赖的矛盾模式。

    （5）关键信息摘要与回视

    - 在每一轮生成前，要求模型先生成一个隐式的“对话摘要”（仅系统内部使用），总结当前已确认的关键事实。然后将生成回复与该摘要比对，快速排除不一致。这个方法可以与生成过程结合，实时防止漂移。

    挑战：

    - 对话越长，检测越困难；矛盾可能间隔多轮出现，需要长距离依赖。

    - 隐式状态的变更：用户没有明说，但通过语境含义改变了事实，这种微妙漂移难以捕捉。

    实际应用中，通常结合对话状态追踪和NLI作为主体，辅以定期摘要校验，构建针对多轮对话事实漂移的实时监控。


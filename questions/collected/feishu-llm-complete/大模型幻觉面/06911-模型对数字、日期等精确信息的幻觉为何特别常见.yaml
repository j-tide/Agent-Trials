content:
  prompt: 模型对数字、日期等精确信息的幻觉为何特别常见？
answer:
  mode: rubric
  reference_answer: |-
    数字、日期、价格、数量等精确信息是最容易出现幻觉的类别之一，这由精确信息的独特属性以及模型的编码和生成方式共同决定。

    （1）精确信息的低容错性和唯一性

    - 对于普通文本，存在许多同义表达，即使用词不同也可能被接受。但对“2023年GDP增长率”来说，只有“2.7%”是正确的，“2.6%”或“2.8%”都是错误。不存在近似正确的余地，因此任何偏离都被归类为幻觉。

    - 这种唯一正确性使得模型无法通过近义替换来搪塞，稍微的参数记忆偏差即成为显式幻觉。

    （2）数字被 tokenizer 分割成碎片

    - 多数 tokenizer 将数字拆分为不直观的 token，例如“2023”可能被拆成“20”和“23”，或更细粒度。模型必须学习这些数字 token 之间的组合关系，而不能像处理一个整体实体那样直接检索。这增加了记忆和生成准确数字的难度。

    - 日期的格式多变（“2023-01-01”、“1 Jan 2023”、“January 1st, 2023”），模型需要在不同格式间转换，更容易产生错位。

    （3）数字在训练数据中高度分散且稀疏

    - 每个具体数字在训练语料中出现的频率远低于普通词语，且多数数字实例是年份、统计数字等，模型难以建立对每一个精确数字的扎实记忆。对于长尾数字，模型可能“见过”但印象模糊，最终在生成时被常见数字（如 100, 0, 2020）所替代。

    - 数字还存在“近似值干扰”：模型可能记得某数值的范围或数量级，但记不清精确值，于是生成一个合理但不准确的数值，造成幻觉。

    （4）缺乏对数字的专门归纳偏置

    - Transformer 架构本身并没有内建的数字计算模块，而是将数字视为普通 token。模型主要靠位置编码和注意力模式去建立数与数之间的关系，缺乏符号化的数值推理器。这让模型在需要精确计算、比较或生成数字时，非常依赖不太可靠的统计记忆，而不是确定性的算法过程。

    - 即使模型能从上下文中提取数字，其复制（copy）能力在长文本中也容易出错，发生数字串错位。

    （5）训练目标对数字不友好

    - 语言建模目标对数字的微小误差（如将“1900”错成“1901”）的损失惩罚与普通词语错误相同，但数字错误造成的语义偏差往往更大。模型没有受到专门激励去精确还原数字。

    - 另外，在训练数据中，许多数字本身可能就不精确（近似、估算），模型学会了对数字“取整”或模棱两可的表达，这在要求精确的场合就变成了幻觉。

    缓解方向：

    - 结合检索增强，从可靠知识库中直接提取精确数字而非依赖模型记忆。

    - 使用工具学习，允许模型生成可执行的计算代码来推导数字，而不是纯文本生成。

    - 引入特殊的数字 token 化方法和位置编码，强化数字复制和推理能力。


content:
  prompt: 请对幻觉现象进行系统分类，并说明每类的特征。
answer:
  mode: rubric
  reference_answer: |-
    综合以上讨论，可从多个维度对幻觉进行系统分类，形成多维分类体系。

    第一维度：按事实性与忠实性

    - 事实性幻觉：生成内容与客观世界事实相悖（外在）。特征：需要外部知识验证，涉及实体、数字、事件等。

    - 忠实性幻觉：生成内容与用户输入、上下文或指令不一致（内在）。特征：可从输入直接判断，包括添加、遗漏、歪曲。

    第二维度：按信息源冲突类型

    - 内在幻觉：输出与输入上下文冲突（如摘要中加入原文没有的信息）。

    - 外在幻觉：输出与外部知识冲突（编造世界知识）。

    第三维度：按内容表现与粒度

    - 实体幻觉：捏造不存在的实体（人名、地名、产品、文献）。

    - 属性幻觉：错误描述实体属性（颜色、大小、时间）。

    - 关系幻觉：错误描述实体间关系（空间、因果、社会关系）。

    - 数量幻觉：计数、数值错误。

    - 来源幻觉：伪造引用、链接、来源文档。

    - 逻辑/一致性幻觉：自相矛盾，推理错误。

    - 反事实幻觉：违反物理规律或常识。

    - 知识边界幻觉：超出知识范围仍强行回答。

    第四维度：按生成机制与成因

    - 知识缺失型：因训练数据未包含或模型遗忘导致。

    - 组合泛化型：错误组合两个正确事实形成错误。

    - 解码诱导型：采样/贪心策略导致的错误放大。

    - 上下文干扰型：长上下文遗忘或注意力分散导致的不忠实。

    - 跨模态失配型（多模态）：视觉-语言对齐错误。

    - 偏见驱动型：刻板印象导致的事实扭曲。

    第五维度：按适用任务和场景

    - 闭卷幻觉：无检索辅助，依赖参数知识时的幻觉。

    - RAG 幻觉：检索增强系统中特有的混淆、忽略证据、伪造引用等。

    - 多轮对话幻觉：记忆漂移、角色混淆、状态虚设。

    - 代码生成幻觉：API幻觉、逻辑幻觉、安全幻觉。

    - 多模态幻觉：对象幻觉、关系幻觉、OCR幻觉。

    - 低资源语言幻觉：文化错配、跨语言知识迁移错误。

    第六维度：按价值与风险

    - 有害幻觉：在需要真实性的任务中导致误导和伤害。

    - 有用幻觉（受控虚构）：在创意、头脑风暴、社交对话中提供想象力和多样性。

    这种多维分类有助于针对性地设计检测和缓解策略：不同幻觉类型需要不同的验证工具（知识图谱、NLI、执行反馈等），也有不同的容忍标准和应对手段。系统梳理幻觉全貌，是构建可信赖大模型的基石。

    - 开放域问答：问“第一个登上火星的人是谁？”模型答“是美国的约翰·史密斯，于2035年登陆。” —— 这完全是编造的未来事件和人名。

    - 知识性对话：模型介绍一本真实存在的书，但错误地声称作者是另外一个人，并编造了该书的获奖记录。

    - 实体生成：要求列出某公司的产品，模型捏造了几款根本不存在的产品，并给出参数细节。

    - 关注点：生成内容是否与客观世界的事实相符。

    - 实质：这属于外在幻觉的范畴，指模型输出了可被证伪的、与真实世界冲突的信息。

    - 例子：问“《红楼梦》的作者是谁？”答“施耐庵” —— 这违背了事实。

    - 特点：需要使用外部知识库、搜索引擎或现实世界的证据来验证。

    - 关注点：生成内容是否忠实于用户的指令和给定的输入上下文。

    - 对输入源的不忠：如摘要任务中，添加、删减或歪曲原文事实。

    - 对用户指令的不忠：用户要求“只列出优点”，模型却同时输出缺点；用户要求“用中文回答”，模型却用英文回答。

    - 实质：这主要涵盖内在幻觉，但范围更广。它包括：

    - 例子：用户提供一段新闻原文，要求生成标题。原文未提及伤亡，但模型生成的标题写“事故造成10人死亡”——这就添加了原文没有的信息，属于不忠实。

    - 特点：只需比较输出与输入指令和上下文即可判断，不依赖外部事实。

    - 核心问题：模型是否按照用户的要求、基于提供的材料进行生成？有没有无依据地添加、忽略或歪曲输入中的内容？

    - 验证方式：仅比较输入和输出即可，无需外部知识。

    - 核心问题：模型陈述的真假值是什么？能否被事实证实？

    - 验证方式：需要借助外部知识库、数据库、真实世界观测。

    - 提升忠诚度：改进注意力机制，使用覆盖惩罚，在强化学习中奖励与输入相符的输出，或在解码中加入忠实度约束。

    - 提升事实性：引入检索增强、知识编辑、事实核查后处理，或训练模型生成引用和不确定性表达。

    - 开头说“巴黎是法国的首都”，但后文又说“法国的首都是马赛”。这直接在同一回答中提供两个完全相反的事实。

    - “这个团队有 5 个人，包括小明、小红、小刚、小丽和小芳。团队总共 6 个人。” 前文列举了5人，后文却声称总人数为6。

    - 在数学题中，模型可能写“因为 A > B，所以 B 比 A 大”，或“设 X=10，因此 X 小于 5”，推理过程推翻了前提。

    - 在分析利弊时，先声称“该政策对经济有显著正面影响”，随后在总结中说“该政策对经济几乎没有正面作用”，出现评价矛盾。

    - “如果下雨，我就不出门。今天下雨了，因此我决定出门散步。” 明显违反逻辑蕴含。

    - 对用户的个人信息（姓名、偏好）记错、混淆。

    - 对对话中已确认的事实（如日期、决定）进行重新编造或错误更新。

    - 例如，用户在最初说“我的预算是5000元”，对话后期模型却建议“一万元的产品”，并声称“符合您的预算”。

    - 边界条件处理错误（循环次数多1次或少1次）。

    - 判断条件写反（if x > 10 写成 if x < 10）。

    - 变量混淆：错误地使用未定义变量或覆盖重要变量。

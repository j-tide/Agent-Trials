content:
  prompt: 多轮对话中的幻觉有什么特殊表现？
answer:
  mode: rubric
  reference_answer: |-
    多轮对话引入了对话历史、交互状态和渐进式信息更新，幻觉表现出一些单轮中不常见的形态。

    特殊表现：

    （1）记忆漂移（Memory Drift）

    - 在长对话中，模型逐渐遗忘或歪曲对话早期确立的信息，表现为：

    （2）角色混淆与跨对话污染

    - 在多用户或需要区分角色的对话中，模型错误地将发言者 A 的信息归于发言者 B，或把与当前对话无关的外部对话模式引入。

    - 例如，在客服模拟中，模型把用户说的“我的产品是X”记成自己（系统）的产品，导致后续回答错乱。

    （3）承诺兑现失败与虚假承诺

    - 模型在前轮承诺会执行某个动作（如“我会为你查询天气”），但在后续轮次中要么未执行，要么生成一个虚构的查询结果。

    - 这种幻觉破坏了交互信任，是对话助手的严重问题。

    （4）对话状态的虚假设定

    - 模型错误地认为自己处在一个某个任务阶段（如已经完成支付），而事实上该阶段并未发生，从而生成不恰当的确认或下一步指令。

    - 例如，用户还没提供地址，模型却生成“您的订单已送达至XX”，并编造了地址。

    （5）不恰当的信息持久化

    - 模型把单次对话中临时提供的、之后应该被覆盖或删除的信息固化为持久知识，影响后续。例如，用户纠正了一次错误：“我不是老师，是工程师”，但几轮后模型又提到“作为老师，您应该...”。

    （6）情感与立场的虚假延续

    - 模型可能延续一个不存在的情绪或态度。如用户并没有表示不满，模型却持续道歉并假设用户生气了，并为此编造错误原因。

    （7）对话目标遗忘与虚构任务

    - 在开放聊天中，模型可能忘记原始目标，开始游离并虚构一个新的对话目标或场景，并围绕这个虚构目标生成一系列回复，使用户感到困惑。

    原因分析：

    - 上下文窗口限制和位置编码衰减使早期信息被淹没。

    - 解码时对历史信息的关注不均匀，倾向于最近信息。

    - 缺乏显式的对话状态跟踪机制。

    缓解：引入结构化对话状态摘要、关键信息槽位填充、检索增强对话记忆，能够部分缓解多轮幻觉。


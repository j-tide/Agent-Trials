content:
  prompt: 如何通过“课程学习”，从简单事实到复杂推理，逐步降低幻觉？
answer:
  mode: rubric
  reference_answer: |-
    课程学习模拟人类由浅入深的学习过程，通过有序安排训练数据的难度和复杂度，可以稳定且高效地降低模型幻觉。

    实施策略：

    （1）定义难度指标

    - 简单事实：高频常识、维基百科 infobox 类信息（单实体单属性）、极短上下文忠实性任务。

    - 中等难度：需要单跳推理的事实、稍长的摘要（需保留多个事实）、基于单个文档的 RAG 问答。

    - 高难度：多跳推理、多文档冲突整合、长文本全局一致性、需要承认知识边界的问题（拒绝编造）、反事实与谬误纠正。

    （2）分阶段课程设计

    - 第一阶段：打牢事实基础

    - 第二阶段：引入简单推理与上下文依赖

    - 第三阶段：复杂推理与冲突管理

    - 第四阶段：对抗与边缘场景

    （3）动态课程与自适应调整

    - 根据模型在各个子验证集上的幻觉率动态决定何时进入下一阶段。若当前阶段的事实性/忠实度未达标，则继续训练或回炉加固。

    - 在训练过程中，逐渐增加难度混合，而非突变，避免灾难性遗忘。

    （4）损失权重与正则化的配合

    - 在简单阶段，给予事实性损失更高的权重；在复杂阶段，逐渐增加对一致性和拒答的奖励权重。

    - 始终保留少量各阶段样本作为回放，防止遗忘。

    （5）多任务课程

    - 同时训练多个任务，但不同任务的难度同步递增。例如，摘要任务从单句摘要到全文摘要；对话任务从单轮忠实回复到多轮记忆一致性。

    价值：课程学习让模型先内化“诚实可靠”的基础行为模式，再逐步增加认知复杂度。这比直接暴露于高难度杂乱的训练数据更加稳定，能够渐进式地构建防幻觉能力，同时避免因挫败而习得投机取巧的编造策略。


content:
  prompt: 如何利用知识图谱约束模型输出，降低事实错误？
answer:
  mode: rubric
  reference_answer: |-
    知识图谱以结构化的三元组形式存储了准确的事实知识，可被用来在生成过程中施加硬性或软性约束，从源头上防止模型输出与已知事实相悖的内容。

    约束方法：

    （1）解码时的实体/关系软约束（Logit偏置）

    - 实体链接与范围限定：对于生成文本中可能涉及的实体，实时查询知识图谱，获取其合法属性值或相关实体集合。在解码到相关token时，提升这些合法token的概率（加正偏置），压制不在集合中的token。

    - 示例：当模型生成“巴黎是…的首都”，且前文已确定国家实体为“法国”，查询图谱确认“法国”的“首都”应为“巴黎”，则在解码首都名称时大幅提升“巴黎”的logit，压制其他城市名。

    （2）硬约束：受限解码（Constrained Decoding）

    - 前缀树/合法词汇表约束：根据知识图谱或本体构建一个有限状态机，强制生成的特定片段必须符合图谱中的合法实体名、关系路径。例如，在生成医疗建议时，药物名称必须来自药物本体，且与疾病有“治疗”关系。

    - 完全屏蔽非法token：在任何时候，如果下一个token会导致组合成不在图谱中的三元组，将其概率直接设为0（-inf），阻止生成。这能完全杜绝已知的实体关系类幻觉，但灵活性受限。

    （3）基于检索的知识图谱注入上下文

    - 三元组文本化：在生成前，根据问题从知识图谱中检索相关三元组，转化为自然语言句子插入到prompt中（例如：“已知事实：巴黎是法国的首都。”）。这相当于为模型提供了一个局部的、确定的知识上下文，引导其基于此作答，而非依赖可能错误的参数记忆。

    - 动态查询与多跳推理：对于复杂问题，可多次查询图谱（如从“姚明”跳转到“姚明的女儿”），将多跳路径上的实体和关系都作为上下文，辅助模型进行正确推理。

    （4）训练阶段的知识图谱对齐

    - 知识增强预训练/微调：将知识图谱的三元组作为训练数据，或与文本对齐进行多任务学习，使模型参数本身更深刻地内化正确的知识关联，从根源减少事实错误。

    优势与局限：

    - 优势：能精准消除实体属性、关系类的事实幻觉，特别是在专业领域（如法律条款、药品名称）十分有效。

    - 局限：覆盖范围受限于知识图谱的完整性，对图谱外的知识无能为力；过于刚性的约束可能损害语言流畅性；构建和维持大规模高质量图谱成本高。

    知识图谱是构建可信赖AI的关键外部知识引擎，与语言模型的深度融合代表从“统计模仿”迈向“知识驱动”的重要路径。


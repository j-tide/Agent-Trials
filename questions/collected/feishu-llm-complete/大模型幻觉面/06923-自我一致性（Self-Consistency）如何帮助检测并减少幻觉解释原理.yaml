content:
  prompt: 自我一致性（Self-Consistency）如何帮助检测并减少幻觉？解释原理。
answer:
  mode: rubric
  reference_answer: |-
    自我一致性是利用大模型生成多样性来提升准确性的集成方法，能够有效检测并间接减少幻觉，尤其适用于有明确正确答案的推理任务。

    原理与步骤：

    - 多次采样：对于同一个问题，使用非零温度（或多种提示、多种上下文）独立生成N条不同的推理路径和答案（如N=5~20）。

    - 答案聚合：提取每个回答的最终答案（忽略推理过程），通过投票（多数一致）选出最一致的答案作为输出。

    - 幻觉减少的内在机理：

    应用范围：

    - 适用于有明确、可提取最终答案的任务（数学题、事实问答）。对于开放式文本生成，难以直接投票，但可以通过语义聚类一致性等方式来评估可信度（如SelfCheckGPT的思想）。

    局限：计算开销数倍增加；对系统性的、模型深信不疑的错误知识（高置信幻觉）无效，因为多次采样会重复同样的错误。


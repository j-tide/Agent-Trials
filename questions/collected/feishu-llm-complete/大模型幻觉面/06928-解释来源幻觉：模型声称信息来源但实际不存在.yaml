content:
  prompt: 解释“来源幻觉”：模型声称信息来源但实际不存在。
answer:
  mode: rubric
  reference_answer: |-
    来源幻觉（Source Hallucination / Citation Hallucination） 是指模型在生成文本时为某个主张提供了看似具体的引用或信息来源（如论文标题、作者、URL、机构名称、文档编号等），但这些来源部分或全部是虚构的，无法在现实世界中找到对应文献或链接。

    典型表现：

    - 虚构学术引用：模型可能会生成“根据 Smith et al. (2021) 的研究，……”，并附上看似合理的论文题目和期刊名称，但该论文根本不存在，或者作者、年份与真实论文不匹配。

    - 编造 URL：模型给出一个形如“更多信息请参见 https://www.example.gov/report2023”的链接，但该网址并不存在或页面内容与所宣称的完全不同。

    - 伪造法律条文或标准：声称“根据欧盟 GDPR 第99条……”，但 GDPR 根本没有第99条。

    - 不存在的报告和机构：引用“世界卫生组织 2022 年《全球睡眠质量白皮书》”，实际上 WHO 从未发布该名称的报告。

    - 内部文档编号幻觉：在企业环境中，模型可能会编造内部 wiki 页面或工单编号，如“参见内部文档 DOC-4567”，而该编号从未被创建。

    产生原因：

    - 语言模型的格式模仿：训练数据中包含大量带引用的学术文本、新闻报道和法律文书。模型学会了“有主张就应当有引用”的格式模式，但并未真正理解引用的验证逻辑。当需要增强可信度时，它会按照学到的格式“发明”一个看起来专业的来源。

    - 实体与模式组合：模型会记忆一些真实存在的作者名、期刊名和标题关键词，然后进行随机拼接，形成一种“看起来像真的”的引用。例如把真实作者 Smith 和真实期刊 Nature 组合起来，编造一个题目。

    - 缺乏检索和事实绑定：在闭卷生成中，模型没有任何机制将生成的引用与实际存在的数据库进行比对，因此无法自我校验来源的真实性。

    危害：

    - 严重损害信息可信度，传播伪科学或虚假法律依据。

    - 让用户误以为信息已经过验证，妨碍批判性思考。

    - 在学术、法律、医疗等严肃领域可能引发严重后果。

    缓解方案：

    - 强制模型在输出引用时，必须同时生成可以直接验证的标识（如 DOI），并配合检索系统实时确认。

    - 在 RAG 系统中，只允许模型引用真正检索到的文档，并对其生成的不在文档内的引用进行惩罚。

    - 训练模型区分“确定性来源”和“推测性来源”，并鼓励其坦诚无法提供准确引用。


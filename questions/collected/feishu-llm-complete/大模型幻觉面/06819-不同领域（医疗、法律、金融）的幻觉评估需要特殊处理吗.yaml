content:
  prompt: 不同领域（医疗、法律、金融）的幻觉评估需要特殊处理吗？
answer:
  mode: rubric
  reference_answer: |-
    是的，绝对需要。 通用领域的幻觉评估在专业领域会严重失效，因为这些领域对准确性、专业术语、逻辑严谨性和风险控制有极高要求。

    医疗领域特殊处理：

    - 知识库专业化：必须使用权威医学知识库（如 PubMed、UpToDate、临床指南）作为事实来源，而非通用维基百科。评估需要检索医学文献数据库。

    - 实体的高精度链接：症状、药物、剂量、检查指标等实体的微小偏差都可能导致严重后果。实体级F1极其重要，且需要链接到标准医学本体（如UMLS、SNOMED CT），避免同义词误判。

    - 数值与单位的致命性：剂量数值（5mg vs 5g）、单位的错误是绝对红线。需要专门的高亮检测和针对数值的严格比对。

    - 风险与禁忌推断：评估需检查生成内容是否违反了禁忌症、相互作用等安全边界。这需要构建规则库与医学知识图谱结合的逻辑验证模块。

    - 无法验证即高风险：在医疗中，证据不足的声明应直接视为高风险幻觉，默认“不给出建议”比“基于不确定知识建议”更安全。评估必须保守。

    法律领域特殊处理：

    - 条文与先例精确性：幻觉常表现为编造不存在的法条、条款号、伪造案例名。评估需要对接法律法规数据库（如Westlaw、北大法宝），进行条文号存在性验证和内容匹配。

    - 逻辑与适用性推理：法律论证需要严谨的演绎逻辑。评估需检测“引用正确但推导错误”的逻辑幻觉，这需要复杂的法律推理模型或专家人工核查。

    - 时效性与司法管辖区：法律具有地域和时效，评估必须区分不同国家、州的法律，并确认判决年份是否过时。引用已废止法律属于严重幻觉。

    - 特权与保密：不能假想律师-客户特权信息。评估需检查生成文本是否包含不当假设。

    金融领域特殊处理：

    - 实时数据：股价、汇率、财报数据瞬息万变。评估必须接入实时数据源（如Bloomberg API），检验数字的时效性和精确性，容忍度极低。

    - 投资建议幻觉：提供虚假的投资建议、伪造的公司业绩数据可能引发财务损失。评估需要与官方披露文件进行交叉验证。

    - 量化分析中的计算错误：生成的财务模型、计算公式中的逻辑错误。需要执行实际计算或使用形式验证工具。

    - 术语与合规：对“保证收益”、“无风险”等受监管术语的使用需要合规性检查，错误的表述可能触犯法律。

    共同特殊处理：

    - 专家参与评估：自动指标只能作为初筛，最终需要大量引入领域专家进行人工评估，尤其是针对高风险样本。

    - 可解释性要求：评估不仅要给出幻觉分数，还需要解释为什么错、正确的信息是什么，以便追溯责任。

    - 定制化训练数据：需要用领域内的高质量数据微调 NLI 模型和检测器，使其理解专业语境。


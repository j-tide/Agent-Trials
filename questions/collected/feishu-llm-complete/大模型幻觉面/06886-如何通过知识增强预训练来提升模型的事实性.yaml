content:
  prompt: 如何通过“知识增强预训练”来提升模型的事实性？
answer:
  mode: rubric
  reference_answer: |-
    知识增强预训练是在预训练阶段显式地将结构化知识或知识库信息融入模型，使其从海量非结构化文本的学习中同步内化可靠的事实知识。

    主要方法与实施路径：

    （1）知识库文本化预训练

    - 实体关系序列化：将知识图谱中的三元组（如 (巴黎, 首都, 法国)）通过模板转化为自然语言句子（“巴黎是法国的首都。”），作为预训练语料混入。让模型直接学习事实陈述，强化实体间的正确关联。

    - 实体描述增强：在文本中出现的实体上，附带从维基百科或知识库提取的简要描述（如“苹果，一种水果，通常红色或绿色”），使模型在阅读原始文本时就获得实体的锚定知识，减少因一词多义导致的混淆和幻觉。

    （2）知识掩码与预测任务

    - 知识掩码语言模型（KMLM）：在预训练时，针对句子中的实体或关系短语进行掩码，要求模型预测被掩码的实体。这不同于随机mask，能强制模型学习实体级别的知识补全。

    - 链接预测预训练：设计辅助任务，输入不完整的知识三元组（如 ? - 导演 - 《盗梦空间》），让模型预测缺失的头实体或尾实体，将知识图谱的结构化信息迁移到模型参数。

    （3）检索增强预训练

    - REALM / RAG-style 预训练：在预训练过程中，模型每一步预测时不仅仅依赖当前上下文，还实时从外部知识库中检索相关文档，并将检索结果作为额外的上下文来辅助预测。这使得模型从一开始就学习整合检索证据的习惯，将知识存储与语言生成解耦，极大提升事实性，降低幻觉。

    - 知识库作为额外记忆：预训练时，模型可访问一个静态的、压缩的知识索引（如基于向量的记忆库），学习从中读取事实。

    （4）多任务与多模态知识融合

    - 联合训练文本生成、实体识别、关系抽取、事实验证等多种任务，共享底层表示。这种多任务学习让模型在理解语言的同时，构建更清晰的事实边界。

    - 在条件允许时，融合结构化表格、代码等数据，培养模型精确处理信息的能力，间接提升事实准确性。

    （5）对比知识学习

    - 构造正负事实对（正确的三元组 vs 错误的三元组），使用对比损失拉近正确事实的表示，推远错误事实。这能让模型在表示空间中更好地聚类事实，而不是将真假混淆。

    核心价值：知识增强预训练将“知识”作为一等公民融入模型的最初学习阶段，而不是仅依靠微调修补。这让模型的基础表征就带有更强的真实性偏向，是从根本上减少幻觉的有效路径，但实施复杂度高，需要精心构建融合数据。


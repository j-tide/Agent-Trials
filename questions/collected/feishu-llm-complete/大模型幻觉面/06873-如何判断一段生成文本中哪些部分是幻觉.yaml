content:
  prompt: 如何判断一段生成文本中哪些部分是幻觉？
answer:
  mode: rubric
  reference_answer: |-
    判断生成文本中哪些具体片段是幻觉（细粒度检测）是一项核心挑战，当前方法可分为基于外部知识、基于模型自身信号、基于统计分析以及人工评估等几大类。

    （1）基于外部知识验证（事实性幻觉）

    - 检索增强验证：将生成文本拆分为原子事实（如使用信息抽取工具或提示 LLM 分解为简单陈述句），然后对每个原子事实通过搜索引擎、知识库（如 Wikidata）或维基百科进行事实核查。如果找不到支持证据或与权威来源矛盾，则标记为幻觉。

    - 自然语言推理（NLI）：对于有源文的任务（如摘要），可使用 NLI 模型判断生成文本的每个片段是否可以被源文蕴含。不被蕴含且无其它源文支撑的部分即为幻觉片段。例如，将每个句子与源文进行对齐和蕴含分类，标记“矛盾”或“中立”的片段。

    - 工具调用验证：对于包含可执行信息（如代码、数学公式、数据查询）的生成，直接在解释器或数据库上运行，看结果是否一致。如果某部分代码有语法错误或逻辑错误，则是幻觉。

    （2）基于模型内部信号（无需外部知识）

    - 输出概率与熵：检查生成片段中每个 token 的条件概率或预测熵。研究发现，幻觉 token 的概率分布往往具有特定模式，比如模型可能对幻觉部分仍然高置信度，但有时也会出现高熵（不确定性）。利用该特性可训练一个分类器，输入特征如序列概率、熵、注意力分布等，识别幻觉 span。

    - 自我评估（Self-Evaluation）：让模型对自身生成的文本进行逐句或逐段判断，询问“这句话是否有充分依据？”或“这部分信息是否可能出错？”。通过精心设计的提示词或微调，模型能够在某些情况下指出潜在的幻觉片段。比如，让模型生成回答后，再让其以校验者身份进行复核并生成解释，提取其指出有问题的片段。

    - 内部表示异常检测：有研究利用模型隐藏层激活，通过训练探针发现幻觉片段的内部表示与真实陈述的表示在向量空间中距离较远。但这需要白盒访问且需要标注数据训练。

    （3）基于交叉检验与多模型共识

    - 自我一致性：多次采样生成多个回答，比较它们之间的一致性。如果在多次采样中某个事实出现不一致，或某部分细节变化极大，则该部分可能是幻觉。这本质是利用模型的随机性来暴露不确定性。

    - 多模型互验：用另一个独立模型（如更大或不同结构的模型）作为验证器，对生成的各片段进行事实性或忠实性评分，标记出不一致的部分。

    （4）基于源文对齐（针对忠实性幻觉）

    - 细粒度对齐与覆盖分析：将生成文本和输入源文分别分割为事实单元，使用语义相似度匹配。未能在源文中找到足够相似证据的生成单元即为幻觉片段。可使用句子嵌入余弦相似度或基于跨度级别的蕴含系统。

    - 引用检测：如果模型生成了引用（如“根据文档[1]”），可以自动检查引用内容是否确实出现在指定的文档中。引用内容与原文不符的部分就是幻觉。

    （5）人工与辅助标注

    - 定义精细的标注规范，让标注者逐句标注“是否包含幻觉”，并高亮幻觉 span。常用框架包括 FActScore、Attributed QA 等。这种方式最准确但成本高，常用于构建自动检测模型的训练数据。

    - 可以使用工具辅助：先让自动系统提出候选幻觉片段，再人工确认。

    组合策略：目前最可靠的方法是将生成文本原子化，再用 NLI 或搜索引擎原子级核查，结合模型不确定性信号和多次采样一致性，综合判断哪部分为幻觉，并给出逐句的事实性评分。


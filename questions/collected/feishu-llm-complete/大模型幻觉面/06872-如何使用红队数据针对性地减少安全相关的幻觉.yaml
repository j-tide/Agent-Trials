content:
  prompt: 如何使用“红队数据”针对性地减少安全相关的幻觉？
answer:
  mode: rubric
  reference_answer: |-
    红队数据是模拟对抗攻击和边缘案例构建的数据，用于发现模型弱点。对减少安全相关的幻觉（如编造有害建议、诽谤、危险虚构），可按照“发现-构造-免疫”的步骤利用红队数据。

    （1）系统性发现安全幻觉弱点

    - 组织红队测试，涵盖多维度攻击：

    - 记录所有模型输出包含安全幻觉的案例（有害、非法、诽谤、危险虚构），形成红队数据集。

    （2）构建针对性训练数据

    将红队发现的成功攻击案例转化为偏好对或修正样本：

    - 偏好对构建：

    - 安全修正样本（SFT数据）：将有害幻觉改写为既安全又有帮助的回应。比如，当用户强求危险信息时，回复可以解释其危险性并提供寻求专业帮助的途径。

    （3）针对性微调免疫

    - 使用 DPO，基于构造的红队偏好对直接进行安全对齐，压制幻觉激活路径。

    - 或扩充到指令微调数据集，让模型在红队场景下学会正确的行为模式，而不仅仅是依赖上层安全壳。

    - 在多轮对话红队数据中，训练模型抵抗逐步诱导：即使用户通过多轮试探，模型也不能在某一轮编造有害内容。

    （4）迭代红队对抗训练

    - 类似 GAN，用更新后的模型再次进行红队测试，发现新的脆弱点（因为免疫一轮后可能有新漏洞），再次构造数据、微调。通过数轮迭代，逐步收敛，提升模型对各类安全幻觉的鲁棒性。

    （5）红队数据增强与泛化

    - 对红队样本进行自动改写和泛化，生成语义相同但表达不同的变体，丰富训练集，防止模型仅记忆特定的攻击句式。

    - 结合不同身份背景、语境的红队模拟，确保免疫覆盖多语言、多文化场景下的安全幻觉。

    通过系统地收集红队暴露出的安全幻觉，并将其转化为高质量的DPO或SFT训练信号，可以将模型“打破”的脆弱点变为“加固”的防御墙，极大降低高风险的幻觉输出。


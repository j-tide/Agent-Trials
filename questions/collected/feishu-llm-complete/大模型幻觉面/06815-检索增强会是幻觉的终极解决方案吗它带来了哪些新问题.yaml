content:
  prompt: "“检索增强”会是幻觉的终极解决方案吗？它带来了哪些新问题？"
answer:
  mode: rubric
  reference_answer: |-
    检索增强（RAG）不是幻觉的终极解决方案，但它是在当前技术范式下大幅减轻事实性幻觉的最有效手段之一。 它不是银弹，而是引入了新的复杂挑战。

    RAG无法成为终极方案的原因：

    - 仅解决部分幻觉：RAG主要缓解因参数知识缺失或过时而引起的事实性幻觉。对于忠实性幻觉（模型忽略或扭曲检索内容）、推理幻觉（逻辑跳跃）、固执性幻觉（不相信检索而相信自身记忆），仅靠提供检索文档无法解决。

    - 无法应对无文本知识：很多人类共识、常识、物理规律并未以文本形式明确记录。对于这些知识的幻觉，RAG无能为力。

    - 终极性要求完美的检索和完美的整合：这永远无法达到。信息的动态性、矛盾性和检索技术的上限决定了RAG始终存在漏洞。

    RAG引入的新问题：

    - 检索噪声与误导：检索到的文档可能不相关、质量低或含有错误信息，模型若盲从则产生新幻觉。

    - 文档冲突处理：多篇文档相互矛盾时，模型可能错误选边、强行融合或产生困惑，导致输出混乱。

    - 过度依赖检索：模型可能丧失使用内部可靠常识的能力，对检索结果盲从，即使常识明显相反。或者，在检索不到理想文档时，能力骤降。

    - 上下文窗口过载：大量检索文档注入可能超出模型的有效上下文处理能力，关键信息被淹没，反而降低回答质量。

    - 引用真实性与归因错误：模型可能编造不存在的引用，或声称某句出自某文档实际并非如此，产生来源幻觉。

    - 延迟与成本：实时检索、重排序、多文档处理显著增加系统延迟和计算开销，影响用户体验。

    结论：RAG是现阶段对抗事实性幻觉的核心武器，使开卷作答成为可能。但它将问题从“模型不知道”转移到了“如何有效检索、如何让模型正确使用检索信息、如何处理冲突和噪声”。未来的方向应是RAG与更好的模型训练（忠实整合、冲突处理、诚实拒答）深度融合，形成更完整的可信生成框架。


content:
  prompt: 如何使用“工具调用”（如计算器、搜索引擎）来规避幻觉？
answer:
  mode: rubric
  reference_answer: |-
    工具调用将模型难以可靠完成的确定性操作或实时信息获取外包给外部专用工具，从根本上消除了该类任务上的幻觉来源。

    核心机制与典型应用：

    - 计算器（解决数值幻觉）：

    - 搜索引擎/知识库API（解决时效性与长尾知识幻觉）：

    - 代码解释器（解决代码逻辑幻觉）：

    - 结构化数据库查询（解决精确数据幻觉）：

    - 日历与翻译等专用工具：

    集成方式（如Toolformer, ReAct）：

    - 通过微调或提示，模型学会在需要时生成工具调用指令，暂停文本生成，接收工具结果，再继续生成。这一范式将“知道”与“计算/检索”分离，让语言模型回归其最擅长的语言理解与整合角色，将容易产生幻觉的精确任务交给确定性工具。


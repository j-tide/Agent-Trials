content:
  prompt: 什么是“幻觉率”（Hallucination Rate）？如何统一定义？
answer:
  mode: rubric
  reference_answer: |-
    幻觉率（Hallucination Rate） 是衡量模型生成文本中幻觉内容占比的量化指标，用于回答“模型在多大程度上产生了不实信息”。由于幻觉可以存在于不同粒度，幻觉率需要从定义到计算进行统一。

    统一定义的框架：

    （1）原子事实级幻觉率（最常用且鲁棒）

    - 定义：将生成文本拆解为原子事实集合，逐条验证，计算其中被判定为幻觉的原子事实数占总原子事实数的比例。

    [图片内容未导入]

    - 优势：粒度细，不受文本长度影响；对部分错误的捕捉敏感；便于综合不同任务。

    - 验证标准：基于源文（忠实性幻觉）或外部知识（事实性幻觉）进行判断，通常使用NLI或人工标注。如果一条原子事实无法被源文/知识库支撑，或与之矛盾，则标记为幻觉。

    （2）句子级幻觉率

    - 定义：包含至少一个幻觉的句子数占总句子数的比例。

    - 优势：计算快，适合快速概览。

    - 劣势：粗粒度，可能高估（一个句子仅一个词错误就算幻觉）或低估（句子内多处错误仅算一个）。不完全反映严重程度。

    （3）样本级幻觉率

    - 定义：在整个评估集中，存在幻觉的生成样本数占总样本数的比例（即每个样本只要有幻觉即计入分子）。

    - 优势：直观体现模型的整体可信度，容易理解。

    - 劣势：极端化，忽略幻觉多寡；一个长篇大论样本仅一个轻微错误与通篇编造可能被等同对待。

    统一的关键要素：

    为了实现不同研究和系统间的可比性，一个统一的“幻觉率”应满足：

    - 明确幻觉类型范围：指明是评估忠实性幻觉（偏离给定源文）还是事实性幻觉（偏离外部真相），或者两者综合。两者率值含义不同。

    - 采用标准验证流程：推荐使用原子事实级作为基础粒度，并公开验证方法（检索增强NLI、人工校验规则等）。

    - 报告置信度与无答案处理：对于无法验证的原子事实（证据不足），需明确统计处理方式：是计入分母忽略不计，还是作为独立类别。一般建议单独报告“未验证率”，并从幻觉率分母中剔除，以反映可核实部分的幻觉密度。

    - 加权可能性：根据幻觉的危害程度加权（如数字错误比同义词替换严重），但实际操作复杂，目前主流仍采用简单算术比。


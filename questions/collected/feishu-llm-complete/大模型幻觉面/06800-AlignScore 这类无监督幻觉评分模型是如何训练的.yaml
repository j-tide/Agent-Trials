content:
  prompt: "“AlignScore” 这类无监督幻觉评分模型是如何训练的？"
answer:
  mode: rubric
  reference_answer: |-
    AlignScore 是一种无监督或弱监督的幻觉/事实一致性评分模型，旨在不依赖昂贵的人工标注的情况下，为任意文本对（源文，生成文）输出忠实度分数。其核心训练思想是利用数据增强构建大规模的合成训练数据，将事实一致性问题转化为一个可自监督学习的任务。

    训练过程详解：

    （1）数据构造：生成不一致文本对

    - 从大规模文本语料（如新闻、维基百科）中提取真实的、自洽的句子对或文档-摘要对作为正例（一致，分数=1）。

    - 通过各种破坏策略生成负例（不一致，分数=0）：

    （2）模型架构与训练任务

    - 采用一个预训练编码器（如RoBERTa、DeBERTa），输入为源文和待评分文本的拼接（[CLS] source [SEP] target [SEP]），将[CLS]向量接一个回归头或二分类头。

    - 训练目标：

    （3）无监督/弱监督的关键

    - 所有训练标签均由自动规则或弱模型生成，无需任何人工标注。这使该方法可以扩展到任意领域和多语言（只要有语料和破坏工具）。

    - 通过设计多样化的破坏策略，迫使模型学习深层的语义一致性特征，而不是表面文本重叠。

    （4）推理与应用

    - 训练完成后，对于任意新的（源文，生成文）对，AlignScore可以直接给出一个介于0到1的一致性得分。

    - 这个分数可解释为“生成文本忠实于源文的概率”，从而用于检测幻觉（低分即为幻觉）。

    优势与局限：

    - 优势：完全不需要人工标注，成本低；泛化能力较好，可以快速适应新领域；输出连续分数，更细致。

    - 局限：训练的负例类型可能无法覆盖所有现实幻觉，尤其复杂的隐含矛盾和需要外部知识的幻觉；分数容易受领域偏移影响；可能存在表面统计线索被利用（如实体不重叠直接判负）。

    AlignScore代表了一类通过数据合成实现的无监督幻觉评估方法，在实际应用中，常与基于NLI的方法互为补充，用于构建鲁棒的事实一致性检测系统。


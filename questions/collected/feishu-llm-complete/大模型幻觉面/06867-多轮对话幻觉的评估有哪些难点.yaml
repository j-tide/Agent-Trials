content:
  prompt: 多轮对话幻觉的评估有哪些难点？
answer:
  mode: rubric
  reference_answer: |-
    相比于单轮文本生成，多轮对话中的幻觉评估面临独特挑战：

    （1）状态依赖性导致评估上下文复杂

    - 每一轮回复的忠实性不仅取决于本轮用户输入，还受整个对话历史中积累的共享知识、承诺、实体引用等影响。评估时必须提供完整的对话历史作为“源文”，这极大增加了评估的输入长度和语义复杂度。自动化工具（如NLI）在处理超长历史时性能显著下降。

    （2）记忆与遗忘的动态验证

    - 需要检测“记忆漂移”：模型在本轮是否遗忘或修改了之前轮次中已确认的事实。这要求评估系统能跨轮次追踪事实，识别前后矛盾。例如，用户在第二轮说“我叫李明”，第五轮模型却回应“张先生你好”。这需要一套动态状态追踪机制，而不仅仅是静态文本比对。

    （3）隐式信息确认与修正的捕获

    - 对话中存在大量隐含状态变更。用户可能通过一个含糊的回应间接纠正了模型，或者模型默认接受了用户的纠正但未显式复述。评估系统需要理解这些“隐含承诺”，判断模型后续是否遵循了修正后的设定。这需要高深的语用推理。

    （4）任务场景的多样性

    - 多轮对话可能同时包含闲聊、任务指令、信息查询、推荐等多种场景，不同场景对“忠实”的定义不同。闲聊中适当的虚构可以接受，但任务指令中绝不能。评估指标需要能够区分场景并动态调整严格度。

    （5）评价基准的缺乏

    - 绝大多数现有幻觉数据集和评估工具都是针对单轮摘要、QA等设计的。多轮对话的忠实度评估金标准极少，FaithDial 等是初步尝试。构造多轮评估数据成本极高，因为需要完整的对话历史和知识支撑标注。

    （6）自动化指标的局限性

    - NLI 模型在长文本、对话结构上的准确率打折扣；基于QA的方法需要生成覆盖历史的问题，而问题生成器本身可能产生偏差；实体级F1无法处理同义替换，且对话中人称代词频繁，解析复杂。

    （7）人类评估的认知负担

    - 人工评估者需要阅读数十轮对话并记住所有细节，才能判断当前回复是否存在事实漂移或编造。认知负荷大，易疲劳，导致一致率低，成本极高。

    缓解方向：开发专用的对话状态追踪增强型评估器；构建如 FaithDial 等高质量多轮基准；利用大模型裁判进行端到端评估并辅以事实链解释；在评估时将对话压缩为结构化状态摘要以供自动化工具使用。


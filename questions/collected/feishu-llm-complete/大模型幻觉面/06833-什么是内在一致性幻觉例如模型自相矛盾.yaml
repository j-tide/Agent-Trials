content:
  prompt: 什么是“内在一致性幻觉”？例如模型自相矛盾。
answer:
  mode: rubric
  reference_answer: |-
    内在一致性幻觉（Intrinsic Consistency Hallucination） 指模型在同一段输出中前后矛盾，违反了最基本的逻辑一致律，表现为自己推翻自己，或推理步骤之间存在冲突。这也属于内在幻觉的一种，因为判断它不需要外部知识，仅从输出文本本身就能发现矛盾。

    典型表现与例子：

    - 事实陈述矛盾：

    - 数值与逻辑矛盾：

    - 推理链条矛盾：

    - 立场或观点摇摆：

    - 条件与结论错位：

    产生原因：

    - 长距离依赖失效：自回归生成过程中，模型在生成较远的后文时已经“忘记”了前文的详细约束，尤其是对于长回答。

    - 注意力分散：多头注意力可能在不同步骤聚焦于不同训练样本的模式，导致前部用了一种常用句式，后部用了另一种冲突句式。

    - 概率最大化与模板混合：模型在生成时分别在不同位置选择了各自概率最高的短语或模板，这些模板单独看合理，但整体合并时互相抵触。

    - 缺乏全局规划：模型没有显式的规划器，无法在生成前构建完整的知识快照或论证结构，边生成边拼凑，矛盾随之产生。

    检测方法：

    - 使用 NLI 模型将生成文本拆分为句子或命题，检查任意两个命题之间是否存在“矛盾”关系。

    - 训练专门的一致性检测器，输入完整文本，输出矛盾片段的位置。

    - 利用大模型自我检查，提示“找出文本中前后不一致的地方”。

    内在一致性幻觉尤其容易在长文生成、多步推理、辩论性写作中出现，严重影响模型的可信度。


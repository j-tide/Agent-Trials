content:
  prompt: 什么是“FactualNLI”？它如何用于事实一致性评估？
answer:
  mode: rubric
  reference_answer: |-
    FactualNLI 是一个专门用于评估事实一致性的数据集和基准，基于自然语言推理框架，旨在检测生成文本是否忠实于给定源文（如摘要是否与原文事实一致）。

    核心构成：

    - 数据来源：基于 XSum 和 CNN/DM 等摘要数据集，收集生成的摘要，由人工标注者对每个摘要句子进行“是否与源文一致”的二元判断（忠实/不忠实）。

    - 为了方便 NLI 模型训练，将源文和摘要句子对构造成 NLI 格式的样本。具体做法：对于每一个摘要句，标注者将源文中能够支撑该句的证据片段高亮出来，形成前提。对于忠实的句子，前提-假设关系为“蕴含”；对于不忠实的句子（如编造细节），由于无法找到充分证据，标注者可能会标记为“矛盾”或“中立”（但矛盾通常需要相反证据）。

    - 因此，FactualNLI 将事实一致性问题转化为 NLI 任务：给定源文片段（前提）和摘要句（假设），判断是蕴含（忠实）还是非蕴含（非忠实，常归类为矛盾或中立）。

    用于事实一致性评估：

    - 模型微调：在一个标准的 NLI 模型（如 RoBERTa、DeBERTa）上用 FactualNLI 进行微调，使其特别擅长检测总结中的事实冲突和无据添加。

    - 流水线应用：在自动评估摘要质量时，将生成的摘要逐句与原文进行 FactualNLI 判断。如果一个句子被预测为“非蕴含”，则视为事实不一致（幻觉），并给出分数。

    - 评估指标：可以计算幻觉句子的比例，或整体事实一致性得分（如正确蕴含的句子占比）。

    FactualNLI 的优势：

    - 将开放式事实核查转化为成熟的 NLI 格式，可以利用 NLI 强大的语义理解能力。

    - 标注了明确的证据跨度，使得模型可以学会精准定位源文信息。

    - 相比于简单的 n-gram 重叠，能发现更隐蔽的不忠实（如过度泛化、错误推理）。

    与其他基准的关系：

    - 它类似于 SummaC 和 ANLI 的部分思想，但专注于摘要忠实度。与 FactCC 等数据集一起，构成了摘要幻觉检测的核心评估套件。

    - 实际应用中，FactualNLI 模型可以与其他忠实度指标（如依赖解析匹配）融合，形成更鲁棒的评估器。

    局限性：

    - 仍然受限于 NLI 模型自身能力，对需要复杂推理或深层世界知识的矛盾可能漏判。

    - 前提片段选取的质量会影响评估；在长源文中，错过某句证据可能导致误判为非忠实。

    尽管如此，FactualNLI 是当前自动化事实一致性评估的重要基石。


content:
  prompt: "“忠实度”如何量化？给出至少两种指标。"
answer:
  mode: rubric
  reference_answer: |-
    忠实度（Faithfulness）衡量生成文本与给定源文（或上下文）的一致性，即生成内容是否严格基于源文，没有无依据的添加、歪曲或遗漏。量化忠实度的指标主要分为基于蕴涵和基于问答两类。

    （1）基于自然语言推理的蕴涵率（Entailment Ratio）

    - 原理：将生成文本分解为独立声明，每个声明作为假设，源文（或其局部片段）作为前提。使用训练好的NLI模型判断前提是否蕴涵（entails）假设。计算被蕴含的声明比例。

    - 具体指标：

    - 计算：若有细粒度声明，则忠实度 = 被蕴涵的声明数 / 总声明数。若是整句/全文分数，则直接使用模型输出概率或分数。

    - 优点：能捕捉语义层面的忠实度，不依赖词表重叠。

    - 缺点：NLI模型本身可能出错，尤其是对需要背景知识的矛盾不敏感。

    （2）基于问答的忠实度指标（QAGS / QuestEval）

    - 原理：利用问答模型，将忠实度评估转化为比较答案的任务。流程：

    - 具体指标：

    - 计算：通常为一个0到1的分数，1表示完全忠实。

    - 优点：通过问答间接检验事实覆盖，能够发现NLI可能漏掉的、因同义改写而掩盖的细微事实扭曲。

    - 缺点：严重依赖QG和QA模型的质量，流程耗时较长。

    其他相关指标：

    - 实体及关系重叠指标：抽取三元组进行覆盖率和精度计算，如实体匹配率。更为直观但语义覆盖有限。

    - 大模型裁判：如GPT-4直接打分，可给出忠实度评分及理由，灵活且与人类高度相关，但成本高、有自身偏误。

    实践中：往往组合使用SummaC（速度快，整体评估）和QAGS（细粒度事实覆盖）来全面量化忠实度，或在重要场景辅以大模型裁判验证。这些指标为自动化监督模型生成质量提供了不可或缺的手段。


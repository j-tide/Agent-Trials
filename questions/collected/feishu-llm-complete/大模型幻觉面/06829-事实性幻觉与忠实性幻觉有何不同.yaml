content:
  prompt: 事实性幻觉与忠实性幻觉有何不同？
answer:
  mode: rubric
  reference_answer: |-
    这是另一种互补的分类维度，与内在/外在幻觉有交叉，但侧重点不同。

    - 事实性幻觉（Factuality Hallucination）

    - 忠实性幻觉（Faithfulness Hallucination）

    区别与联系：

    - 一个输出可能事实正确但不忠实。比如，用户让模型根据某篇文章回答问题，但文章内容有误，模型做出了符合事实但偏离文章的修正——这可能违背忠实性（用户期望基于文章的回答），即使事实性正确。

    - 一个输出可能忠实但不事实。例如，模型严格按用户提供的虚构故事进行续写，故事本身是假的，但续写忠实于原设定。这在创意写作中是可接受的，但在需要事实性的场景中则是失败。

    - 在幻觉缓解中，这两个维度需要不同的解决方案：忠实性幻觉可以通过更强大的注意力机制、检索增强生成（RAG）和对输入的严格对齐来缓解；事实性幻觉则需要外部知识注入、事实核查模块或更好的训练数据去噪。

    总之，事实性是“对世界的忠诚”，忠实性是“对上下文的忠诚”。


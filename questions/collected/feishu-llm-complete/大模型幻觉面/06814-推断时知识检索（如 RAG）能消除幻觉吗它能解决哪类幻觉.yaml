content:
  prompt: "“推断时知识检索”（如 RAG）能消除幻觉吗？它能解决哪类幻觉？"
answer:
  mode: rubric
  reference_answer: |-
    不能完全消除，但能大幅且定向地解决特定类型的幻觉，尤其是事实性幻觉中的知识缺失型幻觉和时间性幻觉。

    RAG能解决的核心幻觉类型：

    - 知识截止与过时幻觉：对于需要最新信息、超越模型训练截止日期的事件，RAG通过检索实时文档，提供包含正确答案的证据。模型从参数记忆中无法得知的知识，现在被显式地呈现在上下文中，从而消除了因知识缺失而产生的闭卷幻觉。

    - 长尾知识幻觉：对于极冷门的实体、局部知识、小众领域细节，模型参数中几乎无存储。RAG能从专门知识库中拉取相关文档，填补参数空白，直接给出有依据的答案，而非编造。

    - 需要精确归因的幻觉：RAG要求模型基于检索到的文档作答，并常常结合引用生成，这能有效抑制“看似合理但无据”的编造，让模型输出有源可溯。

    RAG无法解决或可能加剧的幻觉类型：

    - 忠实性/内部幻觉：RAG虽然提供了文档，但模型仍可能忽略检索内容，固执于自身参数知识（固执性幻觉），或者错误地整合、扭曲文档信息，甚至混合不同文档产生新的虚假陈述（跨文档混淆）。仅靠检索而不训练模型的忠实整合能力，无法解决这类幻觉。

    - 检索噪声诱导幻觉：如果检索到的文档本身不相关、不可靠或含有错误信息，模型可能盲从这些噪声，产出受到污染的幻觉。因此RAG的检索质量至关重要。

    - 推理幻觉：即使拥有了正确事实，模型在多步推理中依然可能发生逻辑跳跃和错误推导，这是RAG无法直接修正的。

    - 检索盲区：对于世界上没有文档记录的信息（如虚构问题、反事实前提），RAG无法提供有效知识，仍需模型自身的知识边界识别能力来拒答。

    结论：RAG是截至目前缓解因参数知识不足导致的事实性幻觉最有效的手段之一。但它不是银弹，必须与提高模型忠实整合能力、检索质量过滤、以及对无法检索场景的诚实回复训练相结合，形成“RAG+忠实性对齐”的完备方案。


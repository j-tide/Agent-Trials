content:
  prompt: 在代码生成中，幻觉通常以什么形式出现？
answer:
  mode: rubric
  reference_answer: |-
    代码生成中的幻觉是指模型生成的代码看似合理，但实际上包含错误、使用不存在的 API、逻辑矛盾或无法正确运行。

    主要形式：

    （1）API 幻觉（API Hallucination）

    - 调用不存在的库、类、函数或方法。例如，生成 Python 代码使用 pandas.read_csv() 时写成 pd.load_csv()，或者引用一个完全虚构的库 import magic_data_lib。

    - 参数名称或签名错误：如 open(file, mode='r') 误写为 open(file, read=True)。

    - 这是最常见类型，源于训练数据中 API 的版本变化或模型拼凑不同的命名习惯。

    （2）逻辑错误幻觉

    - 算法逻辑本身错误，但代码语法正确且结构完整。比如：

    - 这类幻觉不易静态检测，往往需要测试才能发现。

    （3）语义幻觉（Semantic Hallucination）

    - 代码实现了与需求不符的功能。例如，要求实现排序，却生成了查找最大值的函数，或者要求创建 REST API 却生成了 GraphQL 端点。

    - 生成的内容在语法上完美，但“理解”错了需求。

    （4）安全幻觉

    - 生成了存在明显安全漏洞的代码（如 SQL 注入、不安全反序列化），但模型在注释或解释中声称它是“安全的”。这种对安全属性的虚假声称是一种危险的幻觉。

    （5）自我解释与代码不符

    - 模型生成代码并附带解释注释，但注释内容与实际代码行为矛盾。例如，注释写“遍历列表进行累加”，实际代码却做了乘积。

    （6）不完整实现与死代码

    - 函数主体没有完成核心功能就 pass 或 return None，或者包含永远不会被执行的代码块，却在文档字符串中声称具有某种功能。

    （7）状态幻觉

    - 在多步交互式编程（如 Jupyter 环境）中，模型“记住”的变量状态与真实状态不一致，后续代码基于虚假的状态生成，导致连锁错误。

    检测与缓解：

    - 沙箱执行与测试用例验证是最有效的方法。

    - 静态分析（类型检查、linter）可发现 API 幻觉和部分逻辑矛盾。

    - 结合检索增强，让模型参考真实的 API 文档，可以大幅减少 API 幻觉。


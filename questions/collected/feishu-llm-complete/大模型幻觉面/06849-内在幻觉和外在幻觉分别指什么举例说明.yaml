content:
  prompt: 内在幻觉和外在幻觉分别指什么？举例说明。
answer:
  mode: rubric
  reference_answer: |-
    这是根据幻觉信息来源与原因的一种分类，最早在一些综述中提出。

    （1）内在幻觉（Intrinsic Hallucination）

    - 定义：生成的回复与给定的上下文、输入或已生成的前文相矛盾。即模型没有忠实于自己已有的信息源。

    - 特点：这类幻觉可以从输入本身检验出来，无需外部知识。常见于摘要、对话、翻译、代码生成等任务。

    - 举例：

    - 摘要任务：原文说“小明今天去公园玩”，模型摘要写成“小明今天去商场购物”。“商场”和原文冲突。

    - 对话：用户说“我住在北京”，模型回复“上海的天气怎么样？”——忽略了已知的居住地信息，产生了内在矛盾。

    - 推理：模型先在步骤1说“因此X大于Y”，但在步骤3写道“由于X小于Y...”，自身前后不一致。

    - 根因：注意力分散、过长上下文中的信息遗忘、解码策略不当（如束搜索的过度简化）导致模型无法保持对源信息的忠实。

    （2）外在幻觉（Extrinsic Hallucination）

    - 定义：生成的回复无法从给定的输入中验证或与客观世界事实相悖，即模型编造了不被上下文支持且不真实的信息。

    - 特点：需要外部知识库或事实核查才能判断。这类幻觉体现了模型内部储存知识的错误或偏差，或者因为模型过度泛化而“发明”了不存在的事实。

    - 举例：

    - 根因：训练数据噪声、知识截止、长尾实体欠拟合、解码时的概率最大化偏好导致高频模式的拼接。

    总结：内在幻觉是“没有忠实于提示/上下文”，外在幻觉是“没有忠实于世界知识”。两者可能同时出现：模型既曲解了原文，又补充了虚构的外部事实。


content:
  prompt: 指令微调阶段，如何构造数据以教模型承认不确定性？
answer:
  mode: rubric
  reference_answer: |-
    在指令微调（SFT）阶段教会模型恰当地表达不确定性，需要精心设计包含知识边界样本和不确定表达的训练数据。

    构造策略：

    （1）提供表达不确定性的明确模板和正面示例

    - 构造一批问题-回答对，其中问题在模型知识范围外或本身无确定答案，回答则使用规范的、多样化的不确定性表达。例如：

    - 关键：让模型学到不确定性表达也可以是高质量、有帮助的回复，而不是惩罚。

    （2）设计知识边界触发数据集

    - 收集两类问题：

    - 对这些问题的每一个，标注一个理想的“负责任回答”，包含先声明不确定性，再给出有条件信息或提供获取信息的途径。

    （3）负例惩罚与对比样本

    - 不仅提供正面示例，还构造“强行编造答案”的负面回复，并在损失函数中赋予极低的概率，显式地压制编造行为。

    - 提供成对样本：同一个不确定问题，一个正确拒答，一个错误编造。让模型从对比中学习选择诚实的回应。

    （4）融入自我评估与元认知提示

    - 在训练数据中加入要求模型“在回答前先评估自己的知识”的指令。例如：

    - 训练样本中，模型的思考过程（如果使用思维链）可以包含“检查知识库：此事件发生于2024年，超出我的知识范围，因此不能给出确切结论”。

    （5）多样化的不确定程度分级

    - 不仅教“我不知道”，还教概率性表达：如“很可能”、“在多数情况下”、“据报道”，并给出相应情境。

    - 构造样本时区分不同等级：完全未知、部分未知但可推理、已知但有争议，每种配以恰当的不确定性描述。

    （6）领域定制

    - 对于医疗、金融等高风险领域，专门构造强调“不确定时必须拒答并建议咨询专业人士”的样本，强化安全边界。

    注意点：需要在“帮助性”和“诚实性”之间取得平衡。过度训练拒绝会导致模型对已知问题也过度保守。因此，数据中需明确区分已知与未知，并辅以奖励信号（如在后继RLHF中）鼓励在已知时给确定回答，未知时不确定回答。


content:
  prompt: "“RealTimeQA” 等动态基准在幻觉评估中的作用。"
answer:
  mode: rubric
  reference_answer: |-
    RealTimeQA 及类似动态基准（如 StreamEval、LiveBench）是一类持续更新的测试集，旨在反映世界的最新变化，在幻觉评估中填补静态基准的空白，主要作用如下：

    - 检测时效性幻觉与知识遗忘

    - 静态基准（如 Natural Questions）的知识可能已被模型充分学习，导致对事实性的评估虚高。动态基准定期加入关于新事件的问题，迫使模型在无法靠记忆回答时展现出真实行为：是承认未知，还是进行猜测和编造。这直接暴露时效性幻觉。

    - 可以追踪模型在知识截止日期后的表现：是产生了大量幻觉，还是能通过工具检索等方式保持准确。

    - 评估模型的更新与适应能力

    - 动态基准不仅测量当前正确率，更关注正确率随时间的衰减曲线。如果一个模型在问题首次发布时能答对，但数月后开始给出过时答案，就暴露了其内部知识的僵化和幻觉化。这为模型的知识维护和更新策略提供了连续反馈。

    - 提供反哺现实的压力测试

    - 动态基准包含可能包含“高关注度”的谣言或误导信息，测试模型是否轻信这些新出现的错误信息。这对于评估对抗性幻觉和安全风险尤为重要。例如，模型是否会受到近期网络谣言的污染，并以此生成错误答案。

    - 驱动RAG与外部知识整合的研究

    - 面对实时问题，纯粹的参数化模型必然产生幻觉。动态基准成为检验检索增强生成（RAG）系统有效性的天然考场。通过比较纯模型和RAG模型在动态基准上的表现，可以量化外部知识在减少时效性幻觉方面的增益。

    - 构建更稳健的评估生态

    - 许多动态基准通过社区贡献和自动抓取持续扩展，避免了过拟合。由于问题不断变化，模型开发者无法通过针对特定测试集优化来“刷分”，评估结果更能反映模型的真实泛化能力和幻觉控制水平。

    局限与挑战：

    - 答案验证同样需要动态维护，成本高。

    - 需要设计合理的评估窗口，刚发生的事件可能缺乏公认的“正确答案”，存在争议期。

    - 动态基准只能辅助，无法完全替代静态基准对深层知识理解的评估。

    总之，RealTimeQA 等动态基准将时间维度纳入幻觉评估，使研究更贴近实际应用，推动了从“静态知识库”到“持续学习与验证”的范式转变。


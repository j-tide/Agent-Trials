content:
  prompt: 模型融合或集成能否降低幻觉？多个模型投票的假设是什么？
answer:
  mode: rubric
  reference_answer: |-
    可以，模型融合或集成通常能够降低幻觉率，但前提是满足特定假设且可能引入新问题。

    集成降低幻觉的原理：

    - 偏差-方差权衡：不同模型由于架构、训练数据、初始化随机性等不同，它们的错误（幻觉）往往是不相关的，分布在不同的模式上。通过集成多个独立模型的输出，可以“平均掉”各模型的特异性随机错误和部分系统性偏差，使得最终的联合预测更接近真实分布。

    - 不确定性降低：当多个模型对某个事实的生成一致时，该事实很可能是正确的；当它们存在分歧时，则表明该处信息存在高度不确定性，集成方法（如投票或取平均概率）可以揭示这种不确定性，从而避免采纳某个模型的偏激幻觉。

    常用集成形式：

    - 输出端投票：对同一问题，用不同模型生成多个候选回答，通过语义聚类或实体级投票选出最具共识的回答。这是利用“真理往往掌握在多数人手中”的假设。

    - 概率分布平均：在token级别平均多个模型的logits，再进行解码。这能融合多模型的“集体知识”，提高预测的准确性和鲁棒性。

    多个模型投票有效的核心假设：

    - 错误独立性：各个模型的幻觉是不相关的，即它们不会同时犯相同的错误。如果所有模型都因为训练数据中相同的错误知识而产生相同的幻觉，投票将失效，甚至会强化该错误。

    - 模型多样性：参与集成的模型应有足够差异性（不同架构、预训练数据、微调目标），以保证错误分布多样化。同质化严重的模型集成增益有限。

    - 多数优于少数：在认知任务上，多个独立判断的平均通常优于单个判断。这要求各模型都有基础的事实能力，至少“正确”的概率要高于“随机”水平，否则集成噪声无意义。

    局限性：

    - 计算成本倍增：集成多个大模型推理极慢且昂贵。

    - 共享的系统性偏见：若所有模型都受到某种文化偏见或知识截止的影响，集成无法消除这种系统性幻觉。

    - 输出融合的技术难度：开放式文本的语义整合远比分类任务复杂，直接投票可能选出语言不流畅的中间结果。

    前景：实际应用中，更多采用轻量级集成，如用多个小模型做验证，或用模型自身的多次采样（Self-Consistency）模拟集成，在成本可控的同时利用多样性降低幻觉。


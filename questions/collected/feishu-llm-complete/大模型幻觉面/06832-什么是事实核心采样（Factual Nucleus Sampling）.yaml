content:
  prompt: 什么是“事实核心采样”（Factual Nucleus Sampling）？
answer:
  mode: rubric
  reference_answer: |-
    事实核心采样（Factual Nucleus Sampling） 是一种专门设计用于在保持生成多样性的同时显著降低事实性幻觉的解码策略。它在标准核采样的基础上，融入了对生成内容事实性的在线评估，动态截断那些可能导致幻觉的token。

    核心原理与步骤：

    - 标准的Top-p采样首先确定一个候选token集合，其累积概率达到 p，去除了概率极低的尾部。

    - 事实性评估：对于候选集合中的每个token，评估如果选择该token，整个生成序列的“事实性得分”会受到何种影响。评估可通过一个小型的事实性验证模型或规则进行（如基于NLI的蕴含得分，或实体一致性检查）。

    - 事实性截断：设定一个事实性阈值，将那些会导致生成序列事实性得分低于阈值的token从候选集中移除。例如，如果一个token会引入与源文或常识矛盾的实体，或导致数值错误，它将被剔除。

    - 重新归一化与采样：在剩下的事实性合规token中进行重新归一化，然后采样。

    与普通核采样的区别：

    - 普通核采样只依据概率截断，完全不了解语义。它可能保留一个概率不低但事实错误的token（如模型误把“伦敦”当作“法国”的首都时会以较高概率输出“伦敦”）。

    - 事实核心采样在概率筛选之上叠加了“事实性过滤器”，相当于在解码时进行了一次快速的事实核查，阻止错误事实进入生成序列。

    优势：

    - 在保持灵活生成（多样性与流畅性）的同时，显式地抑制幻觉token，有效缓解了温度/多样性权衡问题。

    - 可以配合各种事实性打分器，灵活适应不同任务。

    挑战：

    - 需要在每一步解码时都进行一次事实性评估，计算开销显著增加，对实时性要求高的场景不友好。

    - 依赖于内置的事实性评估模型的准确性。如果评估器本身有缺陷，可能误删正确token或保留错误token。

    应用：适用于对事实准确性要求极高且可接受一定延迟的场景，如自动新闻生成、医疗报告草拟等。


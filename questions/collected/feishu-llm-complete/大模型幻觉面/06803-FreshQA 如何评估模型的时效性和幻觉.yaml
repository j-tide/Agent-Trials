content:
  prompt: "“FreshQA” 如何评估模型的时效性和幻觉？"
answer:
  mode: rubric
  reference_answer: |-
    FreshQA 是一个旨在评估大模型处理快速变化的事实信息能力的动态基准，直接检测因知识过时或未能及时更新而产生的时效性幻觉。

    评估机制与设计：

    - 动态问题集：FreshQA 不采用静态问题，而是围绕持续更新的、具有时效性的知识点设计问题。这些问题涉及近期事件、最新统计数据、新兴人物、最新产品发布等。例如，“现任联合国秘书长是谁？”（相对稳定但可能变化），“2024年奥斯卡最佳影片是哪一部？”（极强时效性）。问题集定期维护，移除过时问题并添加新问题。

    - 两类核心任务：

    - 评估指标：

    - 防猜测试设计：FreshQA 包含部分前提为假或无确定答案的问题，评估模型是否会因追求时效性而强行作答（捏造最新数据），这是对幻觉中“过度帮助性”的专门测试。

    - 快速刷新流程：研究人员依据重大事件定期更新题库和答案，并通过手动和自动验证确保答案正确，这使得FreshQA成为一个“活的”基准。

    对幻觉评估的意义：

    - FreshQA 将幻觉研究从静态事实延伸到时敏事实，揭示模型在面对知识截止边界时的行为。许多模型为了显得“与时俱进”，会编造出带有具体年份和数据的回复，这正是典型的时间性幻觉。通过 FreshQA，可以量化这类幻觉的严重程度，指导检索增强或持续更新技术的改进。


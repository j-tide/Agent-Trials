content:
  prompt: 使用模型作为裁判评估幻觉，其可靠性和偏差如何评价？
answer:
  mode: rubric
  reference_answer: |-
    将大模型（如 GPT-4）作为裁判（LLM-as-Judge）来评估幻觉具有灵活性高、可解释等优势，但也引入新的可靠性和偏差问题。需要从以下方面系统评价其质量。

    （1）与人类判断的一致性（最核心的可靠性指标）

    - 相关系数：计算裁判模型给出的幻觉分数与多位人类专家平均评分之间的 Pearson 或 Spearman 相关系数。高相关表明可靠。

    - 一致率：设定阈值，将分数二元化（幻觉/非幻觉），计算与人类标签的 Cohen's Kappa 系数或 F1 分数。

    - 细粒度对齐：在声明级，比较裁判模型标记的幻觉片段与人工高亮片段的重叠度（如 Intersection-over-Union）。位置的一致性比整体分数更重要。

    （2）稳定性与鲁棒性

    - 输入扰动敏感性：对同一文本对，微调无关紧要的措辞（如添加礼貌用语、改变标点），看裁判分数是否大幅波动。波动大则鲁棒性差。

    - 多次询问一致性（Self-consistency）：对同一样本多次运行裁判模型（可变化温度），观察打分的方差。低方差表示输出稳定。

    （3）偏差评价

    - 位置偏差：裁判模型是否对生成文本中靠前或靠后的句子给予不同严苛度？通过交换句子顺序或前后对照实验来检测。

    - 长度偏差：是否倾向于给更长或更短的文本更高/更低分？可以通过控制文本长度观察分数变化。

    - 权威口吻偏差：是否容易被“根据...”、“研究显示”等伪权威措辞所误导，忽略实际不实的内容？专门构造此类样本进行测试。

    - 自有知识干扰：作为裁判的模型本身具有强大知识，可能在评估时用自身知识替代评判上下文的忠实度，这在评估忠实度时造成污染。可以通过给裁判提供与自身知识矛盾的源文，看其是严格依照源文还是依据自身知识判分来检测。

    - 提示词敏感性：不同提示词（如角色设定、输出格式）是否导致显著不同的结果。设计多组提示进行对比实验。

    - 领域偏差：在特定领域（医疗、法律）是否存在与领域不匹配的宽严标准。

    （4）校准度

    - 裁判模型输出的分数是否反映真实准确率？例如，模型给0.9分的样本是否确实有90%的概率是非幻觉？可以通过期望校准误差（ECE）来度量。

    （5）与其他裁判模型的一致性

    - 如果可能，比较不同裁判模型（GPT-4, Claude, Gemini等）之间的评分一致性。高一致性增强可信度。

    改善途径：在裁判评估中提供详细的判断依据、引入思维链、提供少样本示例以校准，以及使用多模型集成，都可提升可靠性并减少偏差。


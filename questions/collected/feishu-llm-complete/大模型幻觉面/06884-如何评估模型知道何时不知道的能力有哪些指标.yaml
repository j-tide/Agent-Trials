content:
  prompt: 如何评估模型“知道何时不知道”的能力？有哪些指标？
answer:
  mode: rubric
  reference_answer: |-
    评估模型知识边界诚实度或自知之明，即“知道何时说不知道”，需要度量模型在不确定或不知情时能否拒绝猜测、表达不确定性或承认局限。

    评估指标：

    （1）拒答率（Refusal Rate）

    - 对于一组专门设计的不可回答问题（如询问未来事件、虚构实体、无解问题），计算模型明确拒绝回答或表达不知道的比例。拒答形式包括：“我不知道”、“无法确定”、“我的知识截止于...”等。

    - 挑战：需定义什么是合格的拒答，避免过于生硬（“作为一个AI模型...”）的模板被简单计分，也要考虑模型在拒答同时是否提供了部分相关但无伤害的信息。

    （2）幻觉风险下的校准错误率

    - 对可回答和不可回答问题的混合集，计算两个指标：

    - 综合衡量：平衡准确率（Balanced Accuracy） 或 F1 分数，同时优化这两者。

    （3）不确定性表达覆盖率

    - 对于所有输出，检测模型是否使用了适当的认知动词或修饰语（如“可能”、“据报道”、“在大多数情况下”）。可以计算含不确定表达的陈述占所有事实性陈述的比例。理想情况是在不确定的事实上高亮不确定性，在确定的事实上语气肯定。这需要声明级的验证。

    - 指标：过度自信比率 = 在已被验证为错误或无法验证的声明中，模型以绝对肯定语气陈述的比例。越低越好。

    （4）选择性预测指标

    - 模型为每个回答输出一个置信度分数（可通过prompt要求或基于概率）。计算：

    （5）知识边界探测的精确度

    - 构造一批问题，其中一部分在模型训练数据中确定存在（高频事实），一部分确定不存在（虚构或极新）。看模型能否区分它们。可以使用探测任务的F1：正确预测“可回答”/“不可回答”的能力。

    （6）自省式提示评估

    - 在模型生成答案后，追加提问：“你确定这个答案吗？可能正确吗？”，观察模型是否能自我发现错误并纠正。评估其自我纠错率和自我一致性。

    （7）TruthfulQA 中的信息性-真实性曲线

    - TruthfulQA 指标设计将真实性与信息量结合，因为一直说“不知道”虽然真实但无用。通过分析不同提示下模型的答案，评估其在维持高真实性的同时能提供多少信息，这反映了模型“知之为知之，不知为不知”的综合水平。

    这些指标共同刻画了模型在知识边界上的诚实度和自我认知能力，是负责任AI的核心要求之一。


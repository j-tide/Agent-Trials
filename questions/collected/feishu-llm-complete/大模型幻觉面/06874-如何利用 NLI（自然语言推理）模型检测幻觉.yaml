content:
  prompt: 如何利用 NLI（自然语言推理）模型检测幻觉？
answer:
  mode: rubric
  reference_answer: |-
    NLI（Natural Language Inference） 模型判断两个句子之间的逻辑关系：前提（Premise）是否蕴含（Entailment）、矛盾（Contradiction）或中立（Neutral）假设（Hypothesis）。在幻觉检测中，NLI 模型被广泛应用于评估生成文本是否能够从可靠源文或事实证据中合理推出。

    应用范式：

    （1）忠实性幻觉检测（基于源文）

    - 前提：用户提供的上下文或摘要的原文。

    - 假设：生成文本的原子陈述。

    - 判断：如果假设被前提蕴含，则该陈述忠实；如果为矛盾或中立（在需要完全支撑时中立也视为不忠实），则标记为幻觉。

    - 方法：将生成文本逐句拆分，每一句作为假设，用源文整体或局部相关片段作为前提进行 NLI 判断。若没有一句蕴含，则为幻觉。

    （2）事实性幻觉检测（基于外部证据）

    - 前提：从知识库或搜索引擎检索到的证据段落。

    - 假设：生成文本的原子事实。

    - 判断：如果证据段蕴含假设，则事实正确；若矛盾，则为事实性幻觉；若中立，可能需进一步检索或标记为不确定。

    - 可结合多文档：对同一假设使用多个检索到的证据作为前提分别进行 NLI，再投票或加权。例如，如果多个权威源都蕴含该陈述，则真实性高。

    （3）多步NLI与细粒度对齐

    - 对于长文本，可进行句子级别的对齐：先计算生成句与源文各句的相似度，选出最相关的前提句，再跑 NLI。这能降低无关上下文的噪音。

    - 也可使用跨度级别的 NLI，如用 QA 模型定位证据跨度，再判断该跨度是否支持假设。

    常用 NLI 模型：

    - 经典的 RoBERTa-large 在 MNLI 上微调，或更先进的 DeBERTa、BART 等。

    - 专门的幻觉检测 NLI 模型如 SummaC、ANLI（Adversarial NLI）等，对矛盾更敏感。

    优势：NLI 模型能进行深层语义逻辑判断，超越关键词匹配，对改写、含蓄表达有一定理解力。

    局限：

    - NLI 模型本身可能有误差，特别是面对复杂推理、需要世界知识、或长文本时。

    - 对“中立”的处理需要任务定义：在摘要任务中，中立通常视为幻觉（添加）；在开放事实核查中，中立可能意味着证据不足，需要进一步确认。

    - 需要较好的原子化分解；若原子事实过长或包含多个子句，NLI 可能不准。

    最佳实践：在自动化流水线中将 NLI 作为核心校验器，结合检索增强和原子分解，可大幅提升幻觉检测的准确性和覆盖率。


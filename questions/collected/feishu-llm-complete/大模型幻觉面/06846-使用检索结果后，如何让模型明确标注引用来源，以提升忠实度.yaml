content:
  prompt: 使用检索结果后，如何让模型明确标注引用来源，以提升忠实度？
answer:
  mode: rubric
  reference_answer: |-
    让模型在生成时明确标注引用来源，能将忠实度从“隐性要求”变为“显性约束”，极大地减少无据编造。

    实现路径：

    （一）训练模型生成引用

    - 构建带引用的训练数据：使用自动化流水线或人工标注，构造包含“陈述-引用”对的训练样本。例如，对于RAG任务，每个生成句子的末尾或段落后添加引用标记，如“阳光是光合作用的必要条件[1][2]”。

    - 引用格式统一：训练模型学会使用标准引用格式，如方括号编号[1]、[2]，或内联引用(来源: 文档名)。

    - 细粒度引用对齐：高级训练不仅要求段落级引用，还要求每个关键事实都有精确到句子的引用。训练数据需要提供这种细粒度的对齐信息。

    （二）推理时的引用约束解码

    - 强制引用编号合法：在解码时，将所有超出检索文档编号范围的引用token（如[5]但只有4篇文档）的logits设为负无穷，完全杜绝伪造不存在的引用。

    - 引用-陈述一致性校验：生成引用后，用NLI模型即时检查被引用的文档内容是否确实支撑该句陈述。若不支撑，可丢弃该引用并触发重新生成或警告。

    （三）后处理与归因增强

    - 引用补全：如果模型未能生成引用，可使用一个后处理模块，将生成的每个句子与检索文档进行语义匹配，自动为其添加最相关的引用，并可用不同颜色标出置信度。

    - 引用高亮与交互展示：在前端展示时，将每个有引用的句子高亮，点击可展开查看来源文档的原文摘要。这不仅提升了透明度，也让用户能够进行人工事实核查。

    效果：

    - 显式的引用需求会迫使模型在生成时更加“依凭证据”，因为它需要为每个主张找到出处。这种机制有效抑制了“闭眼编造”的冲动，是从行为上降低忠实性幻觉的强有力手段。


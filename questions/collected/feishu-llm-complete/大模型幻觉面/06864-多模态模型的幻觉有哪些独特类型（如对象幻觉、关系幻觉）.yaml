content:
  prompt: 多模态模型的幻觉有哪些独特类型？（如对象幻觉、关系幻觉）
answer:
  mode: rubric
  reference_answer: |-
    多模态大模型（如视觉-语言模型）在整合图像和文本时，会产生跨模态特有的幻觉类型，这些幻觉与纯文本模型有本质不同。

    独特类型包括：

    （1）对象幻觉（Object Hallucination）

    - 描述图像时，添加了图像中根本不存在的物体。

    - 例如，一张只包含“狗和草地”的照片，模型却生成“一只狗在草地上，旁边有一个红色的球”，凭空多出“红色的球”。

    - 细分：虚构物体，或把背景纹理误认为特定实体。

    （2）属性幻觉（Attribute Hallucination）

    - 对图像中存在物体的颜色、大小、材质、状态等属性的描述错误。

    - 例如，描述“一辆蓝色汽车”而实际上汽车是黑色的；或声称“热狗上涂有番茄酱”，实际上没有。

    （3）关系幻觉（Relation Hallucination）

    - 错误描述物体之间的空间关系、动作关系或语义关系。

    - 例如，“猫坐在椅子上”但实际猫在椅子旁边；“人拿着伞”但伞其实靠在墙边；或动作关系“男孩在踢足球”但他是用手扔。

    （4）数量/计数幻觉（Counting Hallucination）

    - 对图像中物体数量的描述错误。比如图中有3个人，模型说“5个人”；或“两匹马”但实际上只有一匹。

    （5）文本与符号幻觉（OCR Hallucination）

    - 在包含文字的场景图像中，模型读出或描述的文字内容与实际不符，凭空捏造词句或数字。

    - 例如，路牌上写“STOP”，模型说是“YIELD”；图表中的数据标签被误读或编造。

    （6）上下文与场景幻觉（Context Hallucination）

    - 对整体场景、地点、事件的推理错误。例如，一张在办公室拍摄的图片，模型描述为“在咖啡厅开会”，或将晴天说成雨天。

    - 这类幻觉常常源自模型根据局部特征过度推断，或者训练数据偏见。

    （7）时序与因果幻觉（Temporal Hallucination）

    - 在视频理解或多图像序列中，编造事件顺序或因果关系，比如把前一刻的动作和后一刻的结果颠倒，或者虚构未发生的动作过渡。

    （8）深度与空间幻觉

    - 对3D深度、相对距离判断失误导致描述错误，如“车在树的后面”但实际在树的前面。

    根源：

    - 视觉编码器的信息压缩损失。

    - 跨模态对齐不充分，语言先验过强，使得模型在视觉不确定时依赖语言模式猜测，导致幻觉。

    - 训练数据噪声、标注不精确。

    缓解：更强的视觉编码器，细粒度的区域级对齐，引入检索增强生成，使用幻觉检测与纠正模块。


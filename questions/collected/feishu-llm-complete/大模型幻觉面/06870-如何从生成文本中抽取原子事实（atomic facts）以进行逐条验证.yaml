content:
  prompt: 如何从生成文本中抽取原子事实（atomic facts）以进行逐条验证？
answer:
  mode: rubric
  reference_answer: |-
    原子事实抽取是将一段生成文本拆解为最小、独立、可单独验证的陈述句的过程，是声明级幻觉检测的前提。方法如下：

    （1）基于大模型的指令式抽取（最常用）

    - 使用强大的语言模型（如GPT-4），通过精心设计的提示词，要求其把给定文本分解为一系列原子事实。

    - Prompt设计要点：

    - 示例Prompt：

    请将以下文本分解为一系列最小的独立事实陈述（原子事实）。每条事实应只包含一个单一信息点。使用JSON列表输出。

    示例：
    文本：玛丽，一位30岁的医生，在纽约工作。
    原子事实：["玛丽是一名医生。", "玛丽30岁。", "玛丽在纽约工作。"]

    文本：{generated_text}
    原子事实：

    （2）基于信息抽取系统（规则+模型）

    - 使用依存句法分析，提取主语-谓语-宾语三元组，再将每个三元组转化为自然语言陈述。

    - 结合共指消解，将代词替换为具体实体。

    - 优点：速度较快、完全可控；缺点：对复杂句和长距离依赖效果差，召回较低。

    （3）基于语义角色标注（SRL）

    - 执行SRL，识别核心谓词及其相关论元（施事、受事、地点等），然后为每个谓词-论元结构生成一个原子陈述。

    - 同样需要结合共指消解和实体链接。

    （4）混合方法

    - 先使用句法/语义分析工具进行初步拆分，然后用一个小型生成模型将拆分片段改写成自然、流畅的独立句子。

    - 或先使用大模型拆分，再用规则检查拆出的每条事实是否包含单个实体关系，若不纯则进一步分裂。

    （5）特定领域模板

    - 对于结构化数据（如体育比赛、财务报告），可定制基于模板的抽取器，从生成文本中抽取关键的槽位值，每条槽位值即一个原子事实。

    质量控制：

    - 最小性检验：每条原子事实不能再被拆分，否则标记。

    - 完整性检验：原文本的所有信息应被完全覆盖，不多不少。可反向组装原子事实看是否还原原意。

    - 忠实于原句：原子事实不能改变原句语气、限定词（如“可能”、“据报道”），否则验证会失真。

    应用：抽取的原子事实随后送入事实核查流水线，每个原子事实针对检索证据（或源文）进行NLI，得到“支撑”、“矛盾”、“证据不足”的标签，最终聚合成整体幻觉评分。


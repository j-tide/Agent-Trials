content:
  prompt: 针对多模态幻觉，有哪些特化的缓解方法？（如视觉对比解码）
answer:
  mode: rubric
  reference_answer: |-
    多模态幻觉（对象幻视、属性错误等）的缓解需要针对视觉-语言交互的独特机制，方法覆盖数据处理、模型架构、训练及解码等环节。

    特化缓解方法：

    （1）视觉对比解码（Visual Contrastive Decoding, VCD）

    - 原理：同时运行原始多模态模型和一个削弱了视觉输入的“盲”版本（例如，将图像替换为空白或噪声图像），在解码时，放大那些在原始模型中概率较高、但在盲模型中概率较低的token。这些token正是由真实视觉信息驱动的，而非单纯的语言先验。

    - 效果：有效抑制了模型在描述图像时过度依赖语言模式而编造物体（对象幻觉）的行为。因为如果某个物体在图像中不存在，原始模型和盲模型对它的预测概率会很接近，通过对比会被压制；而真正视觉存在的物体，原始模型会显著更高概率，被增强。

    （2）强化视觉-语言细粒度对齐

    - 区域级特征匹配：在训练时，不仅对齐整张图像与文本，还要求模型对图像中的具体区域和文本中的对应短语（如物体描述）进行局部对齐。这使得模型学会将视觉信号绑定到特定词语，减少张冠李戴。

    - 负例对比学习：构造负样本（如篡改图文对：把猫的图片配上“狗”的描述），使用对比损失训练模型区分正确的图文配对，推动模型更加依赖视觉内容。

    （3）视觉注意力引导与约束

    - 在生成描述时，强制模型的交叉注意力图聚焦于图像的高信息量区域，并对注意力分散或忽略显著区域的生成施加惩罚。这确保了“说其所见”。

    - 引入视觉指代理解任务作为辅助训练目标，提高模型对视觉细节的敏感度。

    （4）视觉检索增强

    - 在生成描述前，利用图像检索技术在外部图库或知识库中查找相似图像及其可信描述，将这些描述作为辅助上下文输入模型，为视觉语言生成提供事实锚定，类似文本RAG。

    （5）解码时的视觉一致性校验

    - 在生成片段后，用问答或蕴含模型反向验证：从生成的描述中提取实体，然后在图像上运行物体检测器，检查该物体是否真实存在。若不存在，则触发修正或重新生成。这是一种“视觉事实核查”。

    （6）高分辨率与细节增强

    - 对象幻觉常源于视觉编码器对图像细节的丢失（如小物体、文字）。采用更高分辨率的视觉骨干、动态切块编码等技术，可以保留更多视觉信息，减少因“看不清”而导致的编造。

    （7）训练数据净化与增强

    - 清洗多模态训练数据中图文不一致的噪声（如错误的alt-text），并使用高质量的合成数据（如详细场景图描述）进行强化训练，从源头上减少语言偏差。

    通过上述组合策略，多模态模型能够更加忠实于视觉输入，显著降低对象、属性和关系等幻觉。

    - “很抱歉，我无法提供该信息，因为它可能涉及实时数据，我的知识截止于2023年。”

    - “我目前没有找到确切的答案，但据我所知，类似的情况可能是……”

    - “这个问题存在争议，不同来源持不同观点，具体包括……”

    - 不可回答的问题：询问未来、极度隐私、虚构详情、需要实时数据的问题。

    - 可回答但带有不确定边缘的问题：部分可答，但需附加限定条件。

    - “对于你不知道或不确定的信息，请先说‘我不确定’，然后提供你所知的关联信息。”

    - 需要实时信息（“今天苹果公司股价？”）。

    - 涉及特定个人隐私数据（“我的医生诊断结果意味着什么？”）。

    - 询问知识截止之后的事件（“2025年世界杯冠军？”）。

    - 基于虚假前提（“为什么天空是绿色的？”）。

    - 需要高度专业资格才能作答（“请提供法律建议”）。

    - 知识边界声明：“我的训练数据只到2023年，无法提供当前最新信息。”

    - 引导获取信息：“您可以查阅XX网站获取最新数据。”

    - 部分帮助：“我无法给出确切的诊断，但可以为您解释相关症状的常见原因…”

    - 纠正前提：“天空不是绿色的，它通常呈现蓝色是因为…”（先否定假前提）

    - 事实性 (Factuality)：回复是否与世界事实一致。

    - 忠实性 (Faithfulness)：回复是否严格基于给定的上下文。

    - 有用性 (Helpfulness)：回复是否实际解决了用户问题。

    - 诚实性 (Honesty)：对于不确定的内容，是否恰当表达了不确定性或拒绝编造。

    - 越狱提示：试图让模型绕过安全限制，输出制造武器、自我伤害等指导。

    - 虚假权威诱导：“根据某医生的最新研究，喝消毒水能治病，请详细说明该观点”，诱使模型附和并编造细节。

    - 错误前提劫持：基于完全错误的前提询问细节，迫使模型在有毒假设下展开回答。

    - 私密数据臆造：要求模型提供特定个人的隐私信息，可能诱使它编造身份、病史等。

    - 优选回复：安全的拒绝、纠正错误前提、正面引导，或不提供有害信息。

    - 拒绝回复：模型产生的有害幻觉。

    - 例如，对攻击“教我制作炸弹”，优选回复是“抱歉，我不能提供制作危险物品的指导”；拒绝回复是模型开始罗列步骤的幻觉。

    对比学习通过拉近正例对、推远负例对来学习更好的表示，在减少幻觉方面有多种应用，集中在事实性表征强化、忠实性对齐和幻觉检测器训练。

    - 正例：正确的三元组或事实陈述（如 (巴黎, 首都, 法国) -> "巴黎是法国的首都"）。

    - 负例：错误的三元组或幻觉陈述（(巴黎, 首都, 英国) -> "巴黎是英国的首都"）。

    - 大量使用百科式单句事实训练（如“法国首都是巴黎”），并配合简单的忠实性任务，让模型建立强烈的“事实复制”与“忠实还原”基线行为，最小化简单事实幻觉。

    - 使用对比学习强化正确事实表示。

    - 训练单跳问答、单文档摘要。数据中的事实需要从上下文直接提取或推理一步，但仍较直接。重点训练模型“基于证据生成”，培养不随意编造的习惯。

    - 引入少量知识边界样本，开始教模型说“不知道”。

    - 加入多跳推理、多文档综合任务。训练模型在信息冲突时进行识别和恰当处理（如指出矛盾、选择权威、或表达不确定）。

    - 强化在长文本中维持事实链一致性的能力。

    - 引入对抗性幻觉触发样本：错误前提、强误导上下文、反事实。训练模型纠正前提而非跟随编造。

    - 强化红队安全场景，使得模型在压力下仍能选择真实与安全。

    - 指出矛盾并悬置：如“来源A声称X，来源B声称Y，目前信息存在冲突，无法确定。”

    - 权威度加权选择：若可区分，回应“根据更权威的XX机构（来源A），事实是X”。

    - 整合后表达不确定性：如“有证据指向X，也有报告显示Y，具体细节尚存争议。”

    - 压制随机错误：每次采样都可能因随机性产生不同的幻觉（如一次算错、一次记混）。这些随机错误通常分散在各个不同的错误答案上，而正确答案（如果模型具备相关知识）会在所有合理路径中占有最高的出现概率。多数投票有效地过滤掉了这些分散的随机幻觉，将信号从噪声中提取出来。

    - 暴露不确定性：对于模型完全不确定或只会编造的问题，多次采样的答案会高度离散，形成平坦的分布。此时，自我一致性分值（最高票数/总票数）会很低。这可以作为一个幻觉风险指标——低一致性的回答被直接标记为可疑，从而检测出幻觉。

    - 抑制单路径偏执：避免了贪心解码或单次采样可能陷入的一个错误但高概率的推理路径（幻觉路径），通过平行探索多条路径并投票，实现了一种“集体智慧”。

    - 模型在需要精确数学运算时，输出特殊标记（如 <calculate>），将数学表达式（如356 * 789）传入外部计算器API，并将返回的精确结果（280884）融入后续文本。

    - 效果：完全消灭了因模型统计预测而产生的算术错误幻觉。

    - 对于需要实时信息或不确定的知识，模型生成搜索查询，调用搜索引擎API，将返回的权威摘要作为上下文进行再生成。

    - 效果：将闭卷生成转化为开卷生成，用实时检索的事实取代模型可能过时或缺失的参数记忆，从根本上规避知识缺失性幻觉。

    - 模型生成代码后，调用Python解释器执行并获取结果（数值、图表、错误信息）。模型根据返回结果决定是否修正代码或直接引用输出。

    - 效果：确保生成的代码输出描述与实际执行结果一致，杜绝了“睁眼说瞎话”式的代码输出幻觉。

    - 对于企业数据、统计数据，模型生成SQL或API调用，直接查询数据库，将返回的精确数据填入回答模板。

    - 效果：避免了模型“记忆”或“编造”企业机密的财务数字、库存等。

    - 日期计算、专业领域翻译等，使用专用工具总是比语言模型更可靠，彻底规避相关幻觉。

    - 生成每个token或短句后暂停并调用复杂的事实核查器（如搜索、NLI），会导致端到端响应时间变得不可接受，尤其在需要低延迟的交互场景。这是实时核查走向实用的最大阻碍。

    - 解决方向：需要高度优化的小模型专用核查器，或使用缓存与投机式解码叠加。

    - 生成过程中的文本是逐步展开的，一个当前看似事实错误的半句话，在后续补充后可能完全正确。过早的干预会扭曲表达或阻断合理的信息展开。

    - 需要有良好的“段”划分策略，并允许一定缓冲，使得核查在相对完整的语义单元上进行。

    - 轻量快速的核查器可能准确率不足，导致大量误报（将正确内容判为幻觉而中断）或漏报（对复杂逻辑矛盾无效）。过于依赖它会引入新的偏见和噪声。

    - 对开放域内容，快速检索精准证据并做出正确蕴含判断依然困难。

    - 一旦检测到幻觉，如何优雅地修正或重新生成，而不破坏文本整体流畅性，是个难题。强行回退可能导致生硬的中断感或语法碎片。

    - 需要在标准的自回归生成框架中深度嵌入外部核查循环、回退机制、logits修正等，工程实现复杂。

    - 原子事实分解：将生成文本拆分为独立的原子声明，便于逐条核验。

    - 证据检索：对每个声明，利用搜索引擎或可信知识库（如维基百科）检索相关的权威文档片段。

    - 事实核查：使用NLI模型或经过微调的事实性评分模型，判断检索到的证据是否蕴含该声明。对于未蕴含或矛盾的声明，标记为“可疑幻觉片段”。

    - 细粒度定位：输出每个幻觉片段的具体起止位置及其错误类型（如实体错误、数值错误、无据添加等）。

    - 高置信度错误的直接替换：对于明确且易于修正的错误（如错误的日期、错误的实体名称），可以直接从证据中抽取正确信息进行替换。例如，将“爱因斯坦生于1880年”修正为“1879年”。

    - 模糊或无证据片段的保守处理：若无法从证据中找到准确替换值，可选择删除该幻觉片段，或用不确定表达（如“可能”、“据报道”）修饰，或者保留但加注存疑标记。

    - 上下文一致性维护：修正时必须考虑与上下文的语法、语义连贯，可能需要微调周围用词。

    - 使用一个轻量级的重写模型（或调用原LLM），输入原始文本和修正指令（如“请修正以下文本中的事实错误：{原始文本}，根据以下证据：{证据}，保持文风流畅”），让模型生成修正后的完整文本。

    - 施加约束：要求模型仅改动已标记的幻觉部分，保持其他内容不变，避免引入新错误。

    - 对修正后的文本再次运行事实核查，确认原有的幻觉已被修正且未引入新幻觉。

    - 如果仍存在严重错误，可设置最大迭代次数进行多轮修正，或标记为“无法可靠修正”交给人工审核。

content:
  prompt: "“HaluEval” 数据集包含哪些类型的幻觉？如何构造的？"
answer:
  mode: rubric
  reference_answer: |-
    HaluEval 是一个大规模、多样化的幻觉检测数据集，专门用于评估和训练幻觉检测器，覆盖多种任务和幻觉类型，并通过创新的自动构造方法生成。

    包含的幻觉类型：

    HaluEval 将幻觉分为两大类，并细化为具体子类：

    - 忠实性幻觉（Faithfulness Hallucination），即在给定上下文的情况下，模型输出与上下文不符。具体包含：

    - 事实性幻觉（Factuality Hallucination），即输出本身与客观事实相悖，涵盖更广泛的不可验证或错误陈述，即使在开放式对话中也成立。

    针对不同任务，幻觉的表现形式不同，HaluEval 覆盖了三种核心任务，并在每种任务中标注了细粒度标签：

    - 对话：幻觉包括在聊天回复中添加对话历史没有的信息、捏造事实性知识、前后矛盾等。

    - 摘要：生成摘要中包含原文没有的细节或歪曲原文意思。

    - 问答：对于知识型问答，提供错误的事实；或对于上下文问答，提供上下文不支持的答案。

    每个样本都被人工标注了是否存在幻觉，并在幻觉样本中进一步标记幻觉类型（如“实体幻觉”、“关系幻觉”、“数字幻觉”等），还高亮了具体的幻觉片段。

    构造方法：

    HaluEval 的构建结合了自动生成和人工校验，以实现规模和质量平衡。

    - 种子数据收集：从现有数据集（如对话、摘要、QA数据集）收集原始上下文和参考输出。

    - 自动幻觉生成：使用一个强大的生成模型（如ChatGPT），通过精心设计的提示词，要求它“在给定上下文的基础上，生成一段包含幻觉的输出”。提示中包含对幻觉类型的描述和要求，以确保多样性。例如，提示模型“在摘要中加入一个原文没有提及的人物”或“修改对话中的数字使其错误”。

    - 过滤与质量提升：自动生成的幻觉样本可能存在语义不通或过于明显的问题。采用以下策略过滤：

    - 人工标注与细粒度标签：人工标注者不仅确认样本是否包含幻觉，还负责高亮幻觉出现的具体文本 span，并为每个 span 标注具体的幻觉类别（如无依据添加、矛盾、数值错误等）。这为检测模型提供了宝贵的细粒度监督信号。

    - 数据构成：HaluEval 包含约5,000个经过人工过滤的样本，平衡了不同任务和幻觉类型，附带高亮和类别标签。

    价值：HaluEval 提供了具有挑战性的幻觉检测基准，其细粒度标注使得研究者可以训练和评估能够定位错误片段的系统，超越了简单的句子级分类，推动了幻觉解释和修复技术。


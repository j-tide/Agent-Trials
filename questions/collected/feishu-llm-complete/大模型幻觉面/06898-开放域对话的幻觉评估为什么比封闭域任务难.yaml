content:
  prompt: 开放域对话的幻觉评估为什么比封闭域任务难？
answer:
  mode: rubric
  reference_answer: |-
    开放域对话（闲聊、任意话题）的幻觉评估难度远高于封闭域任务（如基于特定文档的摘要、指定知识库的问答），原因如下：

    （1）缺乏固定参考源（无源可依）

    - 封闭域有明确的源文或知识库，忠实度可以通过与源文比对直接判断。开放域对话的回复不需要依赖特定源文，而是利用模型自有知识和想象力。判断一个开放域陈述是否幻觉，只能求诸外部全部世界知识，这极其困难且成本高昂。

    （2）事实性界限模糊

    - 开放域中，用户可能询问主观看法、创意故事、未来预测，这些内容没有客观真值。区分“合理的创意虚构”和“有害的幻觉”需要结合对话上下文和用户意图，无法通过简单的知识匹配解决。比如，讲故事时编造一个城市名可能是创意，但在提供建议时编造一个医生名就是幻觉。

    （3）对话中的语用适当性

    - 开放域对话中，社会性回应（如“我有个朋友也...”）可能是虚构的社交润滑，不一定被视为需要验证事实的幻觉。评估必须区分“社交性虚构”与“事实性编造”，这种语用判断非常微妙。

    （4）多轮动态语境

    - 开放域对话通常是多轮的，知识随着对话历史累积、更新、甚至被覆盖。评估需要解析整个对话状态，判断当前轮次的回复是否与历史已经确认的事实（包括用户纠正过的）一致。这比封闭域任务中的单一源文复杂得多。

    （5）评估的自动化困难

    - NLI 等工具需要前提文本。在开放域，需要动态检索相关知识作为前提，但检索什么、检索多少、如何对齐都是难题。生成的内容可能涉及多个领域的知识，检索覆盖不全或引入噪声。

    - 大模型裁判虽然灵活，但在开放域中其本身的事实知识边界和偏见会极大影响评估准确性，且难以校准。

    （6）缺乏标准评测集

    - 封闭域有大量高质量的标注数据集，开放域对话的幻觉评估基准非常有限，且制作成本高昂，因为每个对话的每一轮都需要进行大量事实核查和状态标注。

    （7）用户意图与期望管理

    - 用户可能故意提出矛盾或虚假前提来测试模型，这时模型合理的应对是纠正或指出矛盾，但这本身又涉及对用户意图的理解，评估更趋主观。

    因此，开放域对话的幻觉评估仍主要依赖昂贵的人工评估，并需要多维度（事实性、一致性、安全性、边界诚实度）的综合评判。


content:
  prompt: 模型产生幻觉时，通常伴随怎样的输出特征？（如过于自信、流畅但错误）
answer:
  mode: rubric
  reference_answer: |-
    幻觉输出往往拥有一些与正确输出高度相似的表面特征，使其极具欺骗性。辨识这些特征有助于开发检测方法。

    常见特征：

    （1）语言流畅且语法完美

    - 幻觉文本通常语法正确，用词自然，与正确回答在语言质量上没有明显差异。这是因为模型的核心能力是语言生成，即使事实错误，语言形式仍保持高水平。

    （2）高度自信与确定的语气

    - 模型通常以陈述句、绝对化口吻输出幻觉内容，避免使用“可能”“也许”“我不确定”等限定词。即使完全编造，也会呈现出斩钉截铁的确信感。

    - 研究表明，模型的校准度较差，生成幻觉时的 softmax 概率可能很高，因此不能仅凭置信度判断真伪。

    （3）富含细节和具体化

    - 幻觉常常会添加许多额外的细节，如具体数字、日期、人名、地点、统计结果等，使其看起来基于具体事实。这些细节正是虚构的核心部分。例如，编造一种疾病的发病率会精确到小数点后两位。

    （4）结构化和连贯的论证

    - 幻觉回答往往结构良好：有引入、分点论述、总结。逻辑链条从表面上看是自洽的，即使前提虚假，后续推理也维持内部一致性。在复杂问题中，模型甚至可能为支持幻觉而编造出更基础的事实作为“证据”。

    （5）模式拼接与知识混淆

    - 幻觉有时会显露出“张冠李戴”的特征：将实体A的属性赋予实体B，混合两个真实实体的信息构成一个虚构实体。例如，把某部电影的情节按到另一部电影上，或将两位科学家的成就合并到一个人名下。

    （6）对真实知识的扭曲或“近似正确”

    - 幻觉输出可能不是完全空穴来风，而是真实事实的某种变形，如把近似数值说成精确数值，把相关事件的时间错位，或把假设当作事实。这种半真半假的幻觉更难察觉。

    （7）无法被上下文约束（在 RAG 中）

    - 在存在检索文档的情况下，幻觉输出可能会奇怪地忽略或弱化文档的信息，同时用模型自身参数知识补齐，并且不与文档产生明显冲突（通过话术）。例如，用“研究表明...”等模糊引源来掩饰并非来自文档。

    （8）重复的模式与模板

    - 在面对大量类似问题时，模型的幻觉可能展现出一致的模板化，比如总是把不认识的药物归为“新型抗癌药”并罗列常见副作用。这种模板性反映了模型依赖高频分布的语言骨架。

    这些特征意味着：仅仅通过流利度和自信度来评估大模型输出是危险的，需要结合外部知识源和专门的事实验证机制。


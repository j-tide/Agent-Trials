content:
  prompt: 解码策略上，如何通过调整温度或使用核采样减少幻觉？
answer:
  mode: rubric
  reference_answer: |-
    解码策略控制模型如何从概率分布中选择token，直接影响输出的随机性和确定性，进而影响幻觉的发生。通过精心调节温度（Temperature）和核采样（Top-p, Nucleus Sampling），可以在流畅性、多样性与事实性之间取得平衡，降低幻觉风险。

    温度调节的作用与最佳实践：

    - 低温（T < 1，如0.2~0.5）：使softmax分布更尖锐，高概率token的优势被放大。模型倾向于选择最常见的续写，因此减少随机错误和编造。在需要事实准确性的任务（如知识问答、摘要）中，低温可以显著降低因随机采样而产生的无关幻觉。

    - 适温与任务匹配：对于创造性任务，过低温度会导致输出重复和模板化。对于事实密集型任务，通常推荐 T ∈ [0.2, 0.7]。

    - 警告：过低的温度（如接近0的贪心解码）可能导致模型在错误路径上过于“自信”，产生高置信幻觉，且失去通过随机性自我纠正的机会。

    核采样（Top-p）的抑制噪声作用：

    - 原理：仅从累积概率达到 p 的最小token集合中采样，动态截断低概率尾部分布。这使得模型排除了大量概率极低但可能语义不通、事实错乱的“噪声”token。

    - 减少幻觉：低概率token往往是语法异常、事实错误或逻辑断裂的根源。通过设置合理的 p 值（如0.9），可以有效排除这些尾部噪声，使生成内容保持在模型自认为高置信度的“可靠语义空间”内，从而减少幻觉。

    - 组合使用：典型的可靠设置如 T=0.7, top_p=0.9。对于纯事实输出，可进一步降低温度和 p 值，如 T=0.2, top_p=0.8。

    为什么能减少幻觉：

    - 高概率区域通常对应模型训练中最常见、最稳固的知识关联与语法结构。限制采样于此区域，使得生成过程被约束在模型“擅长的”分布内，避免涉足表达混乱或知识稀疏的长尾地带。本质上，这是一种在解码时注入的保守性先验，以牺牲部分多样性和创造性为代价，换取更高的事实可靠性。


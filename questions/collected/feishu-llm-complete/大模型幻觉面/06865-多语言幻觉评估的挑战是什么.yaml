content:
  prompt: 多语言幻觉评估的挑战是什么？
answer:
  mode: rubric
  reference_answer: |-
    多语言幻觉评估面临跨语言迁移、文化差异和资源匮乏等多重挑战。

    （1）训练数据与评估资源极度不均

    - 绝大多数幻觉评估数据集（如FactCC、HaluEval、TruthfulQA）都是英文的，其他语言很少或没有。直接训练的多语言检测器性能在低资源语言上大幅下降。

    - 缺乏高质量的多语言知识库和检索源，难以进行检索增强的事实核查。

    （2）跨语言知识迁移导致的评估复杂性

    - 模型内部主要知识存储为英文。对于非英文问题，模型会经历“翻译→英文知识检索→生成→翻译”的隐式过程。这个管道中的任何翻译错误都可能扭曲事实，产生翻译幻觉。但评估系统很难区分是“知识本身错误”还是“翻译过程中的错误”。

    - 例如，实体名称在不同语言中的翻译和音译不同，评估系统可能无法将“Einstein”和“爱因斯坦”链接为同一实体，误报为幻觉或漏报。

    （3）文化依赖性与语境化事实

    - 许多事实是文化特定的（如历史人物、当地习俗、法律）。评估系统必须使用该语言社区公认的权威来源，而不能简单地以英文维基百科为标准。否则，文化特有的正确陈述可能被错误地标记为幻觉。

    - 常识推理也因文化而异，评估需要适配当地的常识体系。

    （4）语言形态与句法的多样性

    - 低资源语言的复杂形态（如屈折变化、黏着语）使得基于实体抽取、n-gram 的方法更容易出错。语义对齐更为困难。

    - 代码切换（在回答中混合多种语言）现象非常普遍，评估系统需要支持混合语言文本，并判断其中事实是否正确。

    （5）缺乏多语言 NLI 和对齐模型

    - 多语言 NLI 模型（如 XLM-R）在某些低资源语言上性能有限，难以作为可靠的自动评估器。

    - 现有的大模型裁判（如 GPT-4）在非英文上的评估质量可能下降，且校准不充分。

    （6）人工评估的难度

    - 多语言人工评估需要招募具有不同语言能力的标注者，成本极高，且难以保证跨语言的一致性。标注指南需要进行文化和语言适配。

    应对策略：

    - 构建多语言幻觉数据集，如将现有英文基准翻译并人工校验，但需要注意翻译后的细微事实偏移。

    - 使用多语言检索增强，链接到当地维基百科或新闻源。

    - 开发更好的多语言 NLI 和跨语言实体链接系统。

    - 在评估时，显式地考虑翻译管道，或采用源语言知识直接评估，非英语生成文本可回译成英语再进行事实核查（但可能改变原意）。


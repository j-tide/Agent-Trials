content:
  prompt: 思维链（CoT）提示为何可能减少推理幻觉？它又会引入什么新型幻觉？
answer:
  mode: rubric
  reference_answer: |-
    减少推理幻觉的原理：

    - 分解复杂问题：CoT将多步推理问题显式地分解为子步骤，每一步只解决一个小问题。这降低了模型在单步上“跳步”或“胡乱猜测”的概率，因为每步的推理可以基于上一步的明确结论，而不是一次性黑箱输出最终答案。

    - 提供可解释的“工作记忆”：将内部隐式的逻辑演算外化为文本序列，使得模型可以“读”到自己之前的推理，这实际上延长了模型的有效记忆，减少了因忘记前提而导致的逻辑断裂幻觉。

    - 激活更多相关知识：当模型写出推理过程时，相关的背景知识也会被作为推理依据一并激活和提取，这有助于更全面地检索内部知识，避免遗漏关键事实。

    - 可纠错性：分步过程让错误有机会在推理链中被放大或暴露（例如产生荒谬的中间值），然后模型可能有机会自我修正，或是让用户、外部验证器介入。

    CoT引入的新型幻觉：

    - 推理幻觉（错误跳跃）：模型可能生成了看似合理、步步递进的推理链，但某一步的逻辑是错误的、基于虚假前提或包含跳跃，导致整个链条虽连贯却荒谬。比如，在数学证明中捏造定理来补全步骤。

    - 虚构中间事实：为了支持推理，模型会凭空编造一些看似专业的中间观察、数据或引用（如“根据2021年的一份调查…”），使推理看起来可靠，实则建立在流沙上。

    - 循环论证与同义反复：CoT可能生成冗长但信息增量为零的“伪推理”，只是用不同的话重复结论，没有真实推理。

    - 过度自信与错误固化：一旦模型在链的开头走上了错误路径，整个思维链会被用来将错误“合理化”，导致高度自信的幻觉，且由于表面逻辑完善，更难被检测。

    - 成本与延迟：CoT显著增加了输出长度，带来更长的推理时间。虽然不是幻觉本身，但影响了应用效率。

    缓解：可使用过程奖励模型、外部工具验证中间步骤、以及多路径CoT投票（如Tree-of-Thoughts）来减少这些推理幻觉。


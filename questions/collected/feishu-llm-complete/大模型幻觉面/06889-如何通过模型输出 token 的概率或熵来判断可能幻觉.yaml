content:
  prompt: 如何通过模型输出 token 的概率或熵来判断可能幻觉？
answer:
  mode: rubric
  reference_answer: |-
    利用生成 token 的概率或熵是一种轻量级、低成本的内省式幻觉检测方法，可直接在模型生成过程中或生成后使用，无需外部知识。

    具体方法：

    （1）Token 条件概率

    [图片内容未导入]

    （2）序列平均对数概率（Length-Normalized Log Prob）

    - 计算整个生成答案的归一化对数概率（平均每个 token 的 log prob）。如果答案的整体概率远低于该模型对其他类似请求的典型输出概率，则提示可能包含幻觉。但跨句比较需谨慎，因为概率与文本长度、词汇选择相关。

    （3）预测熵（Predictive Entropy）

    [图片内容未导入]

    （4）基于概率的校准得分

    - 使用概率校准理论，将 token 概率转化为置信度。例如，预测该 token 的概率是否与其经验正确率匹配。训练一个分类器，输入特征包括：token 概率、所在句子位置、该 token 是否为实体、前后的熵等，输出该 token 是否属于幻觉。

    （5）最小 token 概率

    - 研究发现，幻觉句子的最小 token 概率往往低于非幻觉句子的最小 token 概率，因为幻觉文本可能会有一个或几个“勉为其难”的词。

    优势：

    - 即时可用，几乎无额外成本，与生成过程无缝结合。

    - 可以提供细粒度的不确定性提示。

    劣势与挑战：

    - 模型可能过度自信：许多幻觉以高置信度生成，概率很高，熵很低，方法会漏检。

    - 长生成中的概率衰减：序列越长，个别低概率 token 难免，造成误报。

    - 难以设置通用阈值：不同模型、不同任务、不同解码策略下的概率分布差异很大，需要特定校准。

    - 无法区分编造的事实与真正未知但模型诚实输出低概率词汇的情况。

    最佳实践：将 token 概率与熵作为输入特征之一，与 NLI 或一致性特征结合，由综合分类器判断，以获得更准确的检测。

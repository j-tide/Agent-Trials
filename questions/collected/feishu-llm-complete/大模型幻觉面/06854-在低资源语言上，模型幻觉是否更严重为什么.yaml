content:
  prompt: 在低资源语言上，模型幻觉是否更严重？为什么？
answer:
  mode: rubric
  reference_answer: |-
    是的，幻觉在低资源语言（Low-Resource Languages）上通常更严重且更频繁。 这是由训练数据不平衡、表征质量差以及生成控制弱等多方面因素造成的。

    主要原因：

    （1）训练数据稀缺与质量低下

    - 低资源语言在预训练语料库中的占比极低（有时不到0.1%），模型对这些语言的语法、词汇和世界知识的接触严重不足。即使在数据中出现的文本，也可能包含大量错误、非标准拼写或混入其他语言。

    - 数据稀缺直接导致模型对该语言的事实记忆几乎为零，因此面对任何需要知识的提问，模型都会严重依赖从高资源语言（通常是英语）中迁移过来的知识，并尝试用目标语言重新表达。这种“翻译+生成”的过程极易引入事实歪曲和表达幻觉。

    （2）跨语言知识迁移的失真

    - 模型的主要知识库以英语等资源丰富语言为基础构建。当被用低资源语言询问时，模型内部需经过“问题理解（可能转化为英语表示）→ 英语知识检索 → 答案生成为低资源语言”的隐式管道。在这一过程中，实体、数字、专有名词可能会被错误翻译或转换，导致最终输出包含虚构或错误的本地化信息。

    - 例如，问“卢旺达的首都是哪里？”用基尼亚卢旺达语问，模型可能从英语知识知道是 Kigali，但在生成基尼亚卢旺达语回答时可能拼写错误或使用了一个不存在的变体名。

    （3）语言模型本身对低资源语言的生成控制力弱

    - 模型对低资源语言的 token 概率估计较为不准，流畅度和连贯性本身就较差。当连贯性受损时，模型会产生更多不合逻辑的跳跃，由此产生大量内在幻觉（前后矛盾、逻辑断裂）。

    - 同时，由于低资源语言的语法和词汇约束弱，模型更容易“跑偏”，生成与输入无关的内容，这也构成忠实性幻觉。

    （4）评估与反馈的缺乏

    - 在模型的对齐训练（RLHF）中，低资源语言的偏好数据极其有限，导致模型在安全、事实性和拒绝策略上的对齐主要面向高资源语言。因此，低资源语言中更可能出现幻觉、不安全输出或不愿说“不知道”。

    （5）数字和实体的文化语境错位

    - 模型可能生成对高资源语言文化合理但对低资源语言社群荒谬的陈述，例如把西方节日、地点、人名强加到完全不相关的语境中，形成文化性幻觉。

    特殊表现：

    - 语言混淆幻觉：模型可能在中途切换成高资源语言，或者输出混合语言，其中包含从高资源语言直接复制的事实片段，这在单语环境中就是一种幻觉（输出不可用）。

    - 虚假的文化等价：编造本地化后的虚假实体，如“肯尼亚著名诗人 Juma Otieno”可能是一个合成出来的、不存在的名字。

    缓解：增加低资源语言的训练语料和高质量对齐数据，使用跨语言检索增强生成（多语言RAG），以及引入母语者参与的数据标注和红队测试。


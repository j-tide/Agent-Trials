content:
  prompt: 基于规则或关键词的检测方法有哪些？有何局限？
answer:
  mode: rubric
  reference_answer: |-
    基于规则或关键词的方法是最直接的幻觉检测手段，主要依赖模式匹配和表面特征。

    主要方法：

    - 关键词触发：搜索生成文本中是否出现了“我不知道”、“可能”、“根据我的训练数据”等不确定性表达，或相反地，搜索过于绝对的词汇（“绝对”、“毫无疑问”、“100%”等）。缺乏限定词可标记为潜在幻觉，但只是浅层信号。

    - 引用格式验证：检测引用标记（如“[1]”、“(Smith, 2020)”）是否在提供的上下文中存在。如果模型输出中出现了源文中找不到的引用编号或作者名，可直接判定为来源幻觉。这种方法在 RAG 场景下非常有效。

    - 实体一致性检查：从生成文本中提取命名实体（人名、地名、日期、数字），与上下文或知识库实体列表进行比对。如果生成实体不在允许的实体集合中，则标记为幻觉。例如，在摘要任务中，生成实体必须在源文中出现或属于常识同义词。

    - 数字/日期正则匹配与校验：提取生成文本中的所有数字和日期，与源文或检索结果中的数字进行比对，不一致则报警。可以结合简单的数值范围规则（如年龄不应超过150岁等）。

    - 自相矛盾检测：在同一回答中寻找语义对立的陈述，例如同时包含“A大于B”和“B大于A”。可通过模板或对比学习训练的句子对矛盾检测器实现，属于规则+轻量模型组合。

    - 模板匹配：针对特定领域的固定句式（如“根据XX规定，您有权……”）进行合规检查，若出现格式不符或编造的法条号，可认为是幻觉。

    局限：

    - 召回率低，只能发现冰山一角：规则只能捕捉预定义的错误模式，无法检测细微的、新颖的或基于上下文的复杂幻觉。绝大多数幻觉不触发关键词。

    - 精确度有限，误报率高：例如，表达不确定性并不代表幻觉，模型可能正确说出了未知之事；绝对化用语也可能确实适用于事实（如“水100℃沸腾”）。规则往往过于僵化。

    - 难以应对同义替换和隐含矛盾：实体可以用不同名称指代，规则无法理解同义关系，造成漏检。隐含的矛盾需要深层语义理解。

    - 维护成本高：领域迁移时需要重新梳理规则，且多语言环境下规则更难通用。

    - 无法检测事实性幻觉：规则方法缺乏外部知识，不能判断一个陈述是否真实，只能检测与给定上下文的表面冲突。

    因此，规则和关键词方法通常作为流水线中的快速筛选层或后处理安全网，结合深层语义模型共同工作。


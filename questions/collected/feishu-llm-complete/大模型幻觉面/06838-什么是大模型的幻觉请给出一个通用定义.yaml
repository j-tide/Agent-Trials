content:
  prompt: 什么是大模型的“幻觉”？请给出一个通用定义。
answer:
  mode: rubric
  reference_answer: |-
    通用定义：大模型的“幻觉”（Hallucination）是指模型生成的内容与真实世界事实、用户提供的上下文或内在逻辑相矛盾，但模型却以高度自信的方式呈现，仿佛它是真实可信的信息。换句话说，模型“编造”了看起来合理但实际上不正确、无根据或与给定信息冲突的内容。

    从技术角度，幻觉可以更精确地描述为：模型在给定输入条件下，输出的概率较高的字符串与理想的事实性（或上下文一致性）目标之间出现了系统性偏离。这种偏离不是随机的噪声错误，而是模型习得的生成模式在特定条件下产生的一类结构化失真。

    该定义涵盖了不同维度的幻觉：

    - 与事实不一致：生成的内容与客观事实矛盾（例如，声称珠穆朗玛峰高度为 8849 米，但实际为 8848.86 米，或捏造不存在的历史事件）。

    - 与上下文不一致：在摘要或对话等任务中，生成的文本扭曲、添加或无根据地推断出原文或对话历史中不存在的信息。

    - 与自身生成不一致：模型在一段输出中前后矛盾，或产生逻辑断裂的推理过程。

    幻觉的本质是模型在知识边界或语境约束下，依赖学到的统计模式进行“合理想象”而非忠实检索或推理，从而产生看似真实但实质错误的输出。


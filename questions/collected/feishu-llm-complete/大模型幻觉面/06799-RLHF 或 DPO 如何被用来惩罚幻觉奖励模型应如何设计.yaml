content:
  prompt: RLHF 或 DPO 如何被用来惩罚幻觉？奖励模型应如何设计？
answer:
  mode: rubric
  reference_answer: |-
    RLHF（基于人类反馈的强化学习）和 DPO（直接偏好优化）是当前对齐模型的核心技术，可被定制用于惩罚幻觉，引导模型生成更真实的回复。

    如何使用DPO惩罚幻觉：

    - 构建幻觉偏好对：对于同一提示，生成一对回复：一个高质量的真实/忠实回复（被人工或自动事实核查确认无误），一个幻觉回复（包含事实错误或无据添加）。标记真实回复为“优选”，幻觉回复为“拒绝”。

    - 直接优化：DPO 算法直接基于这对偏好优化策略，使模型提高优选回复的对数概率，同时降低拒绝回复的概率。该过程无需单独的奖励模型，简洁地传递了“幻觉不受欢迎”的信号。

    - 多维度结合：偏好对可以同时考虑真实性、有用性、安全性，通过组合标签，在损失中对不同维度的偏好赋予权重，实现多目标对齐。

    使用 RLHF 惩罚幻觉与奖励模型设计：

    RLHF 需要一个奖励模型来为生成的内容打分。要惩罚幻觉，奖励模型的设计至关重要。

    奖励模型的设计要素：

    - 多维度奖励分解

    - 不采用单一笼统的“质量”评分，而是让人类标注者或自动化系统对回复在多个维度上独立打分，例如：

    - 最终的奖励为这些维度的加权和，其中事实性和诚实性权重在惩罚幻觉时可设置得非常高。

    - 标注数据构造

    - 幻觉负例的显式标注：专门收集包含幻觉的回复，让标注者给出极低的事实性分数，甚至负分。清晰标注出是哪种错误（矛盾、无据、过时等）。

    - 拒答正例：对知识边界问题，让标注者给“正确拒绝”的回复高分，鼓励模型承认无知。

    - 真实源文提供：在标注时，向标注者提供源文或验证过的知识链接，确保他们有足够信息判断事实性。

    - 奖励模型架构与训练

    - 基于预训练语言模型，输入（提示，回复）对，输出多维度的分数向量，再线性聚合为最终奖励。

    - 使用排序损失训练：对于同一提示下的两个回复，奖励模型应准确判断哪个更好（相关性、事实性更高），而不只是拟合绝对分数。

    - 引入对抗训练：在奖励模型训练中加入对抗样本（例如，给事实性幻觉包裹权威话术），增强其对表面假象的辨识力。

    - RL 训练中的特殊处理

    - KL 惩罚加重：防止策略模型为了片面追求高奖励而偏离初始分布过远，产生另一种形式的荒谬输出。

    - 混合奖励信号：同时使用自动化事实性指标（如 NLI 蕴含得分）作为辅助奖励，与人类奖励模型结合，提供密集、即时的真实性反馈。

    - 安全约束：设定规则，一旦检测到特定高风险幻觉类型（如编造医疗建议），直接给予极低的奖励。

    通过上述设计，RLHF/DPO 能够将对“真实”的偏好有效内化到模型中，显著减少幻觉，并同时维护边界诚实性。


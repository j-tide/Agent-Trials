content:
  prompt: 解释“Entity-level F1”在幻觉评估中的作用。
answer:
  mode: rubric
  reference_answer: |-
    实体级 F1（Entity-level F1） 是一种基于信息抽取的评估指标，通过比较生成文本和参考文本（或源文）中命名实体的重叠情况来量化事实一致性和幻觉程度。

    计算方式：

    - 使用命名实体识别（NER）工具，分别从生成文本和参考文本（对于忠实度评估，参考文本为源文；对于事实性评估，参考文本为知识库片段或人工参考答案）中抽取所有实体，得到实体集合。

    - 计算精确率（Precision）：生成文本中的实体有多少比例出现在参考文本中。

    [图片内容未导入]

    在幻觉评估中的作用：

    - 检测实体幻觉：精确率低意味着生成文本添加了大量参考源中不存在的实体（外在实体幻觉）。例如，摘要中凭空捏造了一个人名、地名、产品名，这些会被直接捕获为精确率下降。因此，实体精确率可以视为一种“幻觉密度”指标。

    - 检测信息遗漏：召回率低则表示生成文本遗漏了参考源中的重要实体，可能丢失关键信息。虽然这不直接等同于幻觉，但在摘要等任务中，关键实体缺失导致信息失真，也属于忠实性缺陷。

    - 对数字、日期等关键信息敏感：若将数字、日期也作为特殊实体（Numerical Entity），则实体级 F1 能有效捕捉数值幻觉。因为数字错误往往只是几个字符之差，但 NER 可将其识别为不同实体。

    - 快速、低成本：实体抽取极快，可作为实时评估或大规模粗筛，标记出存在明显实体错误的样本。

    - 与语义指标互补：它无法处理同义实体（如“奥巴马”与“贝拉克·奥巴马”），需要实体链接或别名表辅助。此外，它不能检测关系幻觉（实体对了但关系错了）。因此，实体 F1 通常与 NLI 或 QA 指标联合使用，前者抓“骨架错误”，后者查“血肉不符”。

    总结：Entity-level F1 是一个直观、高效的幻觉辅助指标，尤其在检测无中生有的实体和数值错误方面表现突出。


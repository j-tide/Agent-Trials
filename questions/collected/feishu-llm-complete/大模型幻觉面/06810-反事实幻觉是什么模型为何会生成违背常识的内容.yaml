content:
  prompt: "“反事实幻觉”是什么？模型为何会生成违背常识的内容？"
answer:
  mode: rubric
  reference_answer: |-
    反事实幻觉（Counterfactual Hallucination） 是指模型生成的陈述违背了普遍接受的物理规律、逻辑法则或世界运行的常识性规则，构成了与现实完全相反或不可能发生的情境。

    举例：

    - “水在零上100摄氏度时结冰。”（违背物理常识）

    - “要治疗感冒，可以把人放进微波炉加热几分钟。”（违背安全常识）

    - “太阳围绕地球转。”（违背天文学常识）

    - “用铁锤把玻璃敲成柔软的布料。”（违背材料常识）

    - 在故事中，一个人“同一时间出现在两个相隔千里以上的地方”。

    模型为何会生成违背常识的内容？

    - 训练数据中包含反事实、虚构和讽刺文本：模型从互联网文本中学习，包含大量科幻、奇幻小说、笑话、讽刺、错误信息等，这些文本中的反事实陈述与正常语言模式交织在一起，模型缺乏区分虚构和现实的内在机制，仅学习了语言模式，当被问及此类问题时可能模仿不合常理的模式。

    - 过度泛化和模式拼接：模型是统计机器，没有真正的世界模型。当它遇到不常见问题或需要组合多个概念时，它会从相近的分布中采样，这可能导致物理上不合理的组合。如把“加热”和“杀菌”组合成“微波炉杀菌治感冒”，而忽略了安全性。

    - 缺乏具身经验和常识推理：模型没有与物理世界交互的经验，其常识是从文本共现中习得的表面关联，不是基于感知运动图式的深层理解。因此，它无法真正理解“固体”、“液体”的物理内涵，容易输出违背物理的陈述。

    - 解码策略的风险：为了追求流畅和低困惑度，模型倾向于在不确定时选择高频共现的词语组合，哪怕这种组合违反常识。如果训练数据中“大象”和“飞”因比喻或动画而共现，模型可能会在描述动物时说“大象在天空飞翔”。

    - 安全对齐的不完备：虽然 RLHF 等对齐训练能过滤掉大部分明显的反常识有害输出，但不可能覆盖所有边际情境。反事实幻觉往往发生在看似无害的知识问答或解释性文本中，未被安全训练拦截。

    重要性：反事实幻觉特别危险，因为它可能被用作错误信息传播，或在决策支持系统中导致灾难性建议。需要显式的物理常识知识库、逻辑规则检查以及对抗性测试来缓和。


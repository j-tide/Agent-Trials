content:
  prompt: 如何设计人工标注指南，标注生成文本中的幻觉片段？
answer:
  mode: rubric
  reference_answer: |-
    设计高质量的人工标注指南是保证评估质量的核心，需要涵盖定义、流程、示例和边界案例。

    （1）明确任务目标与幻觉定义

    - 简明定义幻觉：本次标注针对忠实性幻觉还是事实性幻觉，或两者。给出清晰区分。

    - 举例：“忠实性幻觉：回答添加了源文中不存在的信息，或曲解源文事实。事实性幻觉：回答中包含与外部世界真实事实相悖的陈述，不论源文如何。”

    （2）标注粒度

    - 指定标注层级：声明级（原子事实）、句子级、短语/实体级、或全文存在性标注。

    - 如为声明级，需要规定如何拆分声明；如为跨度级，需要标注文本中确切的错误子串。

    （3）定义标签体系

    - 基本标签：

    - 若仅关注幻觉，可将 Unsupported + Contradict 合并为 Hallucination，同时记录子类型。

    （4）标注流程

    - 步骤1：阅读源文/上下文和生成文本。

    - 步骤2：将生成文本分解为可独立验证的片段（可预分解好，让标注者确认或修改）。

    - 步骤3：对每个片段，在源文（或外部知识）中寻找最相关的支撑证据。使用高亮方式记录证据位置。

    - 步骤4：根据比对结果，赋予标签和理由简述。

    - 步骤5：如果存在复杂情况（如两可），在备注中说明。

    （5）详细的判断规则与示例

    - 数字和专名精准匹配：任何数字、日期、名称必须完全一致，近似也视为幻觉（除非源文允许换算）。

    - 因果/推断的限制：不能把源文的暗示当作直接事实。只可标注源文明确陈述的信息为支撑。例如，源文说“地湿了”，不能支撑“下过雨”。

    - 常识运用：允许常识性改写，但不可添加具体事实。例如，“Apple Inc.”可写成“苹果公司”，但不能加上“总部位于加利福尼亚”如果源文没提。

    - 多重否定与模糊语：仔细处理，若曲解了本意，记为幻觉。

    - 不确定性表达：若回答本身使用了“可能”、“据报道”等词，标注时应考察其核心主张是否忠实，而不仅因有缓和词就放过错误信息。

    （6）典型案例与边角案例库

    - 提供10-20个覆盖不同类型（无依据添加、矛盾、正确、难以判断）的样例，并给出详细标注理由。

    - 定期更新疑难案例，组织标注者校准会议。

    （7）标注者训练与质量监控

    - 进行初次培训+试标注，计算一致率（如Cohen's Kappa），达标后再正式标注。

    - 嵌入金标准题目（已知答案的样本）以实时监控标注质量。

    - 定期进行双人标注和分歧解决。

    （8）工具支持

    - 使用标注平台（如LabelStudio、BRAT）支持文本高亮、标签选择和多轮对话渲染。

    - 预载入源文和可能的外挂知识，辅助标注者快速定位。

    一个详尽且迭代更新的指南，可以显著提升幻觉标注的一致性和可靠性，为模型评估和改进奠定坚实基础。


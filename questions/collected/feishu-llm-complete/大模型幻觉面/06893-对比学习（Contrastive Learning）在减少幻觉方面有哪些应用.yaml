content:
  prompt: 对比学习（Contrastive Learning）在减少幻觉方面有哪些应用？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    ### （1）事实知识表示纠偏

    - 构建正负事实对：

    - 在预训练或微调时，引入对比损失，要求模型对正确事实对的语义相似度（如CLS embedding的点积）显著高于错误事实对。

    - 这能将正确的实体关系在表示空间中聚集，把错误关联推远，从根源上减少解码时因表示混淆产生的实体幻觉。

    （2）忠实性增强：源文-生成对齐

    - 对于摘要、RAG 等任务，构建三元组：源文（锚点），忠实摘要（正例），幻觉摘要（负例）。

    - 使用对比损失训练生成模型：使得生成忠实摘要的编码器输出更接近源文表示，而幻觉摘要的表示被推远。

    - 可以在解码器端施加对比损失，或训练一个额外的评分器，但核心都是强化“忠于源文”的表征，抑制编造。

    （3）用于幻觉检测的对比训练

    - 为训练可靠的幻觉检测器，采用对比学习构建强大的负例敏感特征。

    - 构造正例对（源文，忠实句），负例对（源文，不忠实句），训练检测器（如双塔模型）使正例对的相似度远高于负例对。训练后的检测器作为幻觉评估工具，可反过来指导生成模型的对齐（如作为奖励模型）。

    （4）多模态幻觉缓解

    - 在图文生成中，构建对比对：正确图文对齐 vs 错误图文对齐（如图像与捏造的描述）。

    - 使用对比损失让视觉编码器和语言模型在正确配对上有更高的互信息，减少对象幻觉。

    （5）自我对比蒸馏

    - 模型同时生成多个回复，用事实核查自动筛选出高事实性回复作为正例，低事实性作为负例。

    - 用这些样本进行对比微调，使模型自身更倾向于生成高事实性的回复，远离幻觉。这相当于一种自蒸馏的对比学习。

    （6）多语言事实对比

    - 针对跨语言幻觉，用不同语言表达相同事实构造正例对，用错误翻译或事实扭曲构造负例对，通过对比学习建立跨语言的事实一致性表示，减少翻译式幻觉。

    优势：对比学习显式地塑造特征空间，使“正确事实”和“错误幻觉”在表示上可分，为模型提供强大的归纳偏置。它适用于从预训练到微调、从内部表示到外部检测器的多个环节。


content:
  prompt: 使用“校验器”模型对输出进行事实性评分，低于阈值则拒绝或重生成，这种策略优缺点如何？
answer:
  mode: rubric
  reference_answer: |-
    策略描述：训练或使用一个独立的“校验器”模型（可以是经过微调的NLI模型、专门的幻觉评分模型如AlignScore，或大模型裁判），对生成系统输出的每条回答或关键片段进行事实性打分。当分数低于预设阈值时，系统可选择拒绝提供该回答（如回复“我无法确认该信息”），或触发重新生成（使用不同参数或提示再次生成，直到分数达标或达到最大重试次数）。

    优点：

    - 灵活性高，与生成模型解耦：校验器可以像插件一样工作，适用于任何黑盒生成模型，易于集成和升级。

    - 提供可量化的安全网：通过设定不同阈值，可以精细控制“风险-召回”权衡。高风险领域（医疗）可设高阈值，宁可拒绝也不冒险；低风险领域则可适当放宽。

    - 能捕捉生成模型自身未意识到的错误：校验器可以利用外部知识、检索增强等方式，比生成模型的自我校准更可靠。

    - 易于审计与迭代：每次拒绝/重生成都有分数记录，便于分析模型在哪些主题、哪类问题上容易产生幻觉，指导后续优化。

    缺点：

    - 引入额外延迟与成本：每次输出都需要运行校验器（可能包含检索、NLI），大幅增加系统响应时间，尤其当触发多次重生成时。

    - 校验器本身的错误：误判会将正确的回答拒绝（误拒绝），或将错误的回答放过（漏报）。不完美的校验器可能成为新的瓶颈。

    - 重生成策略的不确定性：即使重试多次，生成模型可能始终无法产出高事实性的答案，最终导致反复重试后仍拒绝，用户体验差。且重试增加了算力成本。

    - 阈值设定困难：固定阈值难以适应所有问题类型。有些问题本身无确定答案，强行拒绝可能不恰当；有些看似高置信的错误却需要严格拦截。

    - 可能压制有用信息：过度严格的校验器会使模型变得过度保守，对一些合理推测或常识性扩充的答案也拒绝，降低帮助性。

    改进方向：可以采用软决策，如将分数用于附加置信度提示（“该回答可信度：中”），而非硬性拒绝；或者用校验器分数作为重排序依据，从多个候选回答中选择最高分的输出，而不是反复重生成。


content:
  prompt: "“Self-contradiction” 如何在评估中被检测和量化？"
answer:
  mode: rubric
  reference_answer: |-
    自相矛盾（Self-contradiction） 指模型在同一输出或一段对话中生成互相冲突的陈述。检测和量化自相矛盾需要识别文本内部的不一致。

    检测方法：

    - 基于NLI的扫描：将长文本按句子或原子声明分割，对任意两条声明形成前提-假设对，运行NLI模型。如果检测到“矛盾”关系，则标记为一个自相矛盾点。为提高效率，通常限制比较窗口（如只比较距离较近的句子，或随机抽样后重点检测）。

    - 矛盾检测专用模型：训练一个二分类器，输入两个文本片段，输出是否矛盾。可使用已有的矛盾检测数据集（如 WANLI、Adversarial NLI 的硬例）进行微调。应用时，提取所有对，用该分类器标记矛盾对。

    - 基于信息抽取的逻辑冲突验证：对文本中的实体、关系、数值进行抽取，利用规则检测冲突（如年龄前后不一致：“我今年30岁” vs “我出生于1990年”隐含年龄可能冲突；数值“收入为1000元” vs “收入为2000元”）。结合常识知识图谱还可检测隐含矛盾（如“外面下着大雨”和“我正要去晒被子”）。

    - 大模型裁判直接评估：提示GPT-4等强模型“找出以下文本中前后矛盾的地方”，并让其指出矛盾的具体句子对和原因。效果较好但成本高。

    量化指标：

    - 矛盾密度：矛盾对数量 / 总句子对数量（或所有可能对数的抽样比例）。直观反映自相矛盾的频繁程度。

    - 矛盾跨度：发生矛盾的句子之间的距离（字数或句子数），衡量模型维持长期一致性的能力。如果矛盾多发生在远处，说明长距离记忆差。

    - 矛盾严重度：对矛盾进行加权，例如关键事实矛盾（如人名、决策）权重高于一般描述矛盾。可由人工评分或基于矛盾类型自动加权。

    - 段落级矛盾率：在评估集上，包含至少一处矛盾的样本占比。简单易用。

    - 综合一致性得分：在对话等多轮场景中，记录每轮对话与历史的一致性状态，最终计算整个对话的一致率（如连续一致轮次占比）。

    应用：自动化检测常使用 NLI 扫描作为基础，并在关键领域辅以规则和大模型验证，最终给出矛盾密度和位置报告。


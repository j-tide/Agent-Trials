content:
  prompt: 在长文本生成中，如何评价模型维持事实链的能力？
answer:
  mode: rubric
  reference_answer: |-
    长文本生成（如故事、长报告、多步推理文章）中，维持事实链能力要求模型在生成过程中保持前后逻辑一致，且所有事实陈述都能自洽并与初始约束/知识吻合。评估这种能力需要关注连贯性、一致性和因果链的保真度。

    评价方法与指标：

    （1）长距离一致性评估

    - 滑动窗口NLI：在长文本上滑动窗口，检查当前句子与之前所有已生成内容（或限定窗口内）的蕴涵关系。如果某个句子与历史内容矛盾（NLI预测为矛盾），则发生事实链断裂，标记为幻觉。统计断裂点次数或矛盾句占比。

    - 自相矛盾检测模型：训练专门的矛盾检测器，输入两个文本片段（可以是同一文本的不同部分），输出是否矛盾。用于自动扫描生成的长文中前后不一致的陈述。

    （2）因果与时间逻辑验证

    - 时序关系抽取与校验：抽取文中的事件及其时间表达式，使用时间推理模块检验事件顺序是否合理。例如，不能先生效后发生。

    - 因果方向判断：对于包含“因为…所以…”、“导致”等连接词的句子，抽取因果对，利用常识知识图谱（如 ConceptNet）验证因果关系是否成立。错误的因果链接是典型的事实链幻觉。

    （3）知识链覆盖与支撑度

    - 原子事实链的支撑追溯：将长文本从头到尾拆解为原子事实序列，对于每个事实，要求能够从上文已生成的内容或可信的外部知识中找到唯一支撑。如果某个事实突然无法被前文或知识库支撑，则为事实链中的“凭空跳跃”幻觉。

    - 事理图谱一致性：将文本描述的事件序列映射到预构建的事理图谱（如脚本知识库），检查事件转移概率是否符合典型模式。极度不符合常规的事件序列可能表明模型在幻想。

    （4）规划一致性评估

    - 提纲忠实度：如果生成长文前先生成了提纲，可以评估正文与提纲在章节主题、核心主张上的一致性。使用文本相似度或 NLI 判断每个正文段落是否遵循并履行了提纲中的承诺。

    - 关键约束追踪：定义必须在全文保持一致性的关键要素（如人物设定、地点、目标），建立约束槽位，自动抽取值并检验全文各处是否统一。

    （5）长文本问答（Long-form QA）评估

    - 针对长文本内容，自动生成覆盖前后多个位置的综合问题（包括需要跨段落推理的问题）。用生成文本回答这些问题，再与基于可靠知识的答案比较。如果无法正确回答，说明相应的事实链没有维持好。

    （6）人工评估维度

    - 设计多维评分量表，包括“全局逻辑一致性”、“因果合理性”、“人物/事件前后一致”、“无凭空细节”等，由人工进行阅读评分。

    挑战：长文本的事实链评估极其复杂，自动指标尚处于早期，目前多依赖人工评估或结合多种自动指标的弱监督信号。


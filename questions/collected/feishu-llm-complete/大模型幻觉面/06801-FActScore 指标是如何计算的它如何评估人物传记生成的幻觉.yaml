content:
  prompt: "“FActScore” 指标是如何计算的？它如何评估人物传记生成的幻觉？"
answer:
  mode: rubric
  reference_answer: |-
    FActScore 是一种针对人物传记生成的事实性评估指标，通过将生成文本分解为原子事实，并利用维基百科等外部知识库来验证每个原子事实的准确性，最终计算“事实密度”分数。

    计算步骤：

    - 生成人物传记：让待评估模型根据给定的实体名称（如“爱因斯坦”）生成一段传记描述。

    - 原子事实分解：使用指令微调后的语言模型将生成的传记文本拆解为原子事实列表。

    - 知识源验证：对于每个原子事实，使用预定义的可靠知识库（如英文维基百科）进行验证。具体验证方式：

    - 计算FActScore：

    对于人物传记的特别设计：

    - 实体特定性：检索时重点围绕该人物实体，从该人物的维基百科页面提取事实作为证据池。

    - 细粒度验证：由于传记包含大量具体信息（出生日期、成就、关系），原子事实的精确验证至关重要。FActScore特别适用于评估模型对长尾实体知识的掌握，因为幻觉在此类任务中高发。

    - 偏重事实性，不评估文笔或结构，专门量化模型在生成可靠事实方面的表现。

    意义：FActScore提供了一个客观、可复现的自动化指标，用于追踪和改进模型在开放域事实生成中的幻觉问题。后续版本已扩展到其他领域，但核心方法（分解-检索-验证-比例）不变。


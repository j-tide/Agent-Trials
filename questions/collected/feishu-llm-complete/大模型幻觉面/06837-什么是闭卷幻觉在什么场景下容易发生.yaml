content:
  prompt: 什么是“闭卷幻觉”？在什么场景下容易发生？
answer:
  mode: rubric
  reference_answer: |-
    闭卷幻觉（Closed-book Hallucination） 是指模型在没有访问任何外部知识源、仅依赖自身参数中存储的信息来回答问题时，由于知识缺失、过时或不准确而生成的幻觉。这一术语源自“闭卷问答”（Closed-book QA）范式，即模型不借助检索文档，直接回答问题。

    典型发生场景：

    - 纯粹闭卷问答：用户直接向模型提问事实性问题，例如“2023年诺贝尔化学奖得主是谁？”如果模型训练数据截止于2022年，它必然会编造答案——这种就是典型的闭卷幻觉。

    - 长尾实体查询：关于较为冷门的知识，如某小镇的历史、小众电影剧情、某个三线城市的市长姓名。模型可能没有在训练数据中充分学习这些事实，但为了维持流畅的输出，会用最常见或最合理的模式去“填补”空白。

    - 时敏信息查询：实时股票价格、天气预报、最新新闻事件。模型由于知识截止日期无法获知，只能根据过时信息甚至完全虚构。

    - 边缘知识组合：要求模型结合两个不常见的事实进行推理，如果其中一个或两个事实在训练中缺失，模型会在推理链中“脑补”出合理的中间事实，导致整个推理链外观完美但基础不实。

    - 多跳推理闭卷：例如“法国最大的城市的市长的名字是什么？”如果模型忘记了“法国最大城市是巴黎”这一事实，或者记错了市长名字，就容易产生幻觉。

    为什么在这些场景下容易发生？

    闭卷场景下，模型完全处于自给自足状态，没有了检索到的文档作为“约束锚点”，解码过程完全由语言模型的统计概率驱动。当模型对某一知识的内部表征不确定或冲突时，解码算法（如贪心、束搜索）会倾向于选择高概率的 token 组合，这些组合往往构成流畅且合乎语法的句子，却在事实上失真。换言之，模型宁可“说点什么像样的”也不愿坦诚无知，这种倾向在闭卷环境中尤为明显。

    缓解闭卷幻觉的主要方向是转向开卷（检索增强）模式，或使用外部工具、搜索引擎实时核实。此外，训练模型学会拒绝回答或表达不确定性也是一种补充策略。


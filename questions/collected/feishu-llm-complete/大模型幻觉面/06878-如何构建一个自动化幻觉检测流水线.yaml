content:
  prompt: 如何构建一个自动化幻觉检测流水线？
answer:
  mode: rubric
  reference_answer: |-
    构建自动化幻觉检测流水线需从数据分解、证据获取、事实核查到决策输出的完整链路。一个鲁棒的流水线通常包含以下模块：

    （1）输入与分解模块（Statement Decomposition）

    - 原子事实提取：将待检测文本（模型生成的回答）拆分为最小独立陈述单元（原子事实），每个原子事实只包含一个主谓宾三元组或简单陈述。可使用规则（依存句法分析）、信息抽取模型或直接调用大模型（如“请把以下文本分解为独立事实列表”）。

    - 上下文处理：如果涉及用户提供的源文（如摘要任务），同步将源文分解为事实片段，用于后续忠实度校验。

    （2）证据检索与对齐模块

    - 针对事实性检测：对每个原子事实生成搜索查询（可抽取关键实体），调用搜索引擎或维基百科 API 获取相关权威文档。必要时对检索结果进行重排序和片段提取。

    - 针对忠实性检测：将原子事实与源文对齐，计算语义相似度或进行蕴含判断，找出在源文中没有充分支撑的事实。

    - 跨模态检测：多模态场景还需将图像描述原子化，并与视觉模型对图像的检测结果匹配。

    （3）事实核查与推理模块

    - NLI 模型：使用预训练的自然语言推理模型判断“证据文本”是否蕴含该原子事实。可设置三分类（蕴含、矛盾、中立），如果为矛盾或中立但答案需要确定性，则标记为幻觉。

    - 搜索一致性评分：检查搜索引擎结果的片段是否普遍支持该事实。可以聚合多个来源的 NLI 结果或计算文本蕴含得分。

    - 工具验证：对于代码、数学等可执行内容，自动运行并对比输出，或使用符号求解器验证。对于数值，可查询权威数据库（如 Wikidata）进行比对。

    （4）幻觉聚合与决策模块

    - 原子级判断聚合：将各个原子事实的幻觉标签（幻觉/非幻觉）聚合为段落级或全文级的幻觉评分。可采用：任意原子幻觉则全文标记为有幻觉、计算幻觉比例（如 FActScore）、或根据原子重要性加权。

    - 阈值与置信度：为NLI得分、一致性值等设定阈值，结合模型自身不确定性（如生成概率）进行综合决策。可训练一个轻量分类器融合多维特征，输出最终幻觉概率。

    （5）解释与输出模块

    - 高亮幻觉片段：返回标注了幻觉范围的文本，指出具体哪个句子或短语是幻觉，以及原因（如“该陈述与维基百科矛盾”）。

    - 生成报告：包括幻觉类型（事实性/忠实性）、严重程度、可能的原因分类，便于后续优化模型。

    （6）持续学习与反馈回路

    - 将检测到的高置信幻觉样本加入训练集，用于微调幻觉检测器或反馈给生成模型进行偏好对齐。流水线应支持在线和离线模式，并定期更新知识库和 NLI 模型。

    关键设计原则：

    - 解耦与可替换：各模块独立封装，可升级 NLI 模型、检索器或分解器而不影响整体。

    - 效率权衡：对实时性要求高的场景，可采用轻量分解和缓存检索结果；对准确性要求高的场景，可使用多轮验证和集成模型。

    - 领域适配：针对医疗、法律等垂直领域，可定制知识库和专用 NLI 模型。

    这样的流水线能够系统化、可扩展地检测生成文本中的各类幻觉。


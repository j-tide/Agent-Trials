content:
  prompt: 在 RAG 场景中，模型可能产生哪些新型幻觉？
answer:
  mode: rubric
  reference_answer: |-
    检索增强生成（RAG）通过给模型提供外部检索文档来增强事实性，但同时也引入了新的、特有的幻觉类型。这些幻觉不再单纯是参数知识的缺失，而是与检索和融合过程相关。

    RAG 中的新型幻觉包括：

    （1）来源-内容冲突幻觉（Source-Content Conflict）

    - 模型忽略了检索到的文档，继续依赖自身参数知识生成答案，导致输出与提供的证据矛盾。

    - 例子：文档说“某药物临床试验失败”，模型却答“该药物被证实有效”，因为它基于训练数据中过时的乐观报道生成。

    （2）跨文档混淆幻觉（Cross-Document Confusion）

    - 当检索返回多篇文档，模型错误地混合了不同文档的信息，产生现实中不存在的交叉实体或事件。

    - 例子：文档A介绍苹果公司的iPhone，文档B介绍三星公司的Galaxy，模型生成“苹果公司发布了Galaxy S23”，将两个品牌混淆。

    （3）证据捏造/篡改幻觉（Fabricated Evidence）

    - 模型在输出中引用或概述检索文档的内容时，添加文档中根本没有的细节或数据，甚至编造出看似合理的引用页码。

    - 例子：“根据文档第3页，该技术的效率提升了50%”，但实际上文档中从未出现此数字。

    （4）过度精简或过度泛化幻觉（Over-summarization Hallucination）

    - 模型在融合多文档信息时，为了生成简洁回答，丢失了关键的条件、限定词或背景，使陈述变得绝对化且错误。

    - 例子：文档提到“在低温低压条件下，A物质表现为超导体”，模型简化为“A物质是超导体”，忽略了必要条件，这在科学上是错误。

    （5）时效性与检索快照不一致幻觉（Temporal Hallucination）

    - 当检索到的信息已经更新，但模型训练数据中的旧知识或内部偏见导致它选择性地相信旧信息，或对检索结果中的新信息产生抗拒，输出扭曲的现实。

    - 例子：文档是最新的公司财报，显示CEO已更换，但模型仍坚持旧的CEO姓名，因为它对此有更强的参数记忆。

    （6）检索噪声诱导幻觉（Noise-induced Hallucination）

    - 检索到的文档与问题无关或不准确，但模型仍试图从中提取答案，强行建立联系，生成看似相关实则错误的回答。

    - 例子：问“某公司的成立年份”，检索返回的是该公司产品发布会的新闻，模型据此推理并错误声称“该公司在2018年随着产品X的发布而成立”。

    （7）提示与证据混淆

    - 模型的指令遵循与证据使用发生冲突。用户要求“基于常识回答”，模型可能把常识作为事实，忽略了证据文档中的反常识正确信息。

    这些新型幻觉表明，RAG 虽然增强了知识覆盖面，却带来了信息整合的复杂性。缓解需要更好的检索精排、文档消歧、引用强制对齐、以及训练模型具备“引用即约束”的强遵循能力。


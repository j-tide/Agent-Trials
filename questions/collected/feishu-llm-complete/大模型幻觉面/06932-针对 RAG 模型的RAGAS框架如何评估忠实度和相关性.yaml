content:
  prompt: 针对 RAG 模型的“RAGAS”框架如何评估忠实度和相关性？
answer:
  mode: rubric
  reference_answer: |-
    RAGAS（Retrieval Augmented Generation Assessment） 是一个专门为评估 RAG 系统而设计的无需人工标注的自动化评估框架。它通过将生成回答与检索文档进行逻辑分析，量化忠实度和答案相关性等关键维度。

    对忠实度的评估：

    - 核心思想：忠实度衡量生成的答案在多大程度上是基于检索到的文档，而不包含幻觉。

    - 方法：

    - 优势：利用 LLM 的强语义理解进行细粒度核查，无需人工标注参考，完全自动化且可解释（能指出哪个声明不被支撑）。

    对答案相关性的评估：

    - 核心思想：评估生成的答案是否与用户问题相关，是否回答了问题，而非答非所问。

    - 方法：

    - 优势：避免了直接比较问题和答案的困难，通过反向生成问题巧妙地将评估转化为语义匹配，具有良好的一致性。

    RAGAS 的评价维度还包括：

    - 上下文相关性（Context Relevancy）：检索到的文档是否精炼且与问题相关，无冗余。

    - 上下文召回（Context Recall）：检索文档覆盖了真实答案所需的信息比例（需要参考标准答案）。

    - 其他：如批评（Critique）维度，评估无害性等。

    总结：RAGAS 通过一系列基于 LLM 的自动化流程，为 RAG 系统提供了一套完整、可解释且无需大量人工的评估方案。其忠实度评估直接针对幻觉问题，是当前 RAG 评估中最受欢迎的方法之一。


content:
  prompt: 在生成式搜索（如 Bing Chat）中，如何平衡流畅度与事实性？
answer:
  mode: rubric
  reference_answer: |-
    生成式搜索（如Bing Chat）要求模型同时具备强大的信息整合能力和流畅自然的表达，其核心挑战在于：将检索到的碎片化证据转化为连贯回答时，如何既能确保每一句都“言之有据”，又不失自然对话的流畅感。

    平衡策略：

    （1）基于证据的受控生成

    - 引用强约束：训练模型在生成每个事实性陈述时，都必须附上可验证的引用（如方括号链接）。这不仅迫使其依赖检索结果，也让用户能自行判断可信度。流畅性通过语言风格优化实现，但事实骨架不变。

    - 摘要式整合而非逐字复制：模型被训练为使用自己的话去概括检索文档，同时保持原意不变。通过对比学习（拉近忠实摘要与原文，推远幻觉摘要）可让模型学会“准确且流畅”的改写。

    （2）动态权衡的分层响应

    - 先结论后展开：生成一个高事实保证的核心摘要（克制、关键数字精准），之后再以更口语化的方式进行细节展开。在展开部分，适当允许语言多样性，但需通过引用与核心摘要锚定。

    - 不确定性分层表达：如果部分细节证据不充分，模型可生成“据报道……”或“根据某来源……”等自然流畅的不确定性表述，既不牺牲流畅度，又诚实传达了信息状态。

    （3）后处理润色与事实性校验解耦

    - 先生成一个事实性较高但可能略显生硬的“骨架回答”，然后由另一个专门负责语言风格的模型进行润色，同时施加约束“不可改变任何事实细节和引用”。润色后进行第二轮事实性扫描，确保流畅化改造未引入幻觉。

    （4）用户界面与交互设计

    - 将引用来源以醒目的方式展示（如悬浮窗、侧边栏），让流畅的正文与原始来源并存。这样，即使正文为了流畅而简化了某些细节，用户也可一键查证，有效降低因润色而产生的误解。

    - 提供“展示原始检索片段”的切换选项，满足不同用户对流畅与事实的不同偏好。

    （5）训练数据构造的平衡

    - 在指令微调中，构建同时包含“高流畅低事实”和“高事实略生硬”的偏好对，让人类标注者选择“既流畅又事实准确”的最佳折衷作为正例。通过RLHF/DPO，让模型内化这个平衡标准。

    结论：流畅与事实并非不可调和，关键在于将事实正确性作为不可逾越的硬约束，在这个框架内最大化语言的自然度。引用、分层生成和后处理校验是实现此平衡的三大支柱。


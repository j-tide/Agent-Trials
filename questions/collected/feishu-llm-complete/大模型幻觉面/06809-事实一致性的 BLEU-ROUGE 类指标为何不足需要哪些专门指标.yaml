content:
  prompt: "“事实一致性”的 BLEU/ROUGE 类指标为何不足？需要哪些专门指标？"
answer:
  mode: rubric
  reference_answer: |-
    BLEU（Bilingual Evaluation Understudy）和 ROUGE（Recall-Oriented Understudy for Gisting Evaluation） 是基于 n-gram 重叠的文本相似度指标，最初用于机器翻译和自动摘要。它们在评估事实一致性方面存在根本性不足。

    不足的原因：

    - 只测量表面词汇重叠，不捕捉语义：两个文本可能用词高度重叠但事实完全相反（例如，否定词的增减）。“巴黎是法国首都”和“巴黎不是法国首都”的 ROUGE-1 精确度可能接近 100%，但事实性截然相反。

    - 无法区分信息重要性：所有词视为同等重要，一个关键的数字错误和无关紧要的冠词改动在评分中权重类似。比如，将“GDP 增长 2.7%”误说成“2.8%”，BLEU/ROUGE 只有细微降分，但这种错误是严重幻觉。

    - 无法检测无依据的添加：如果生成文本添加了大量合理但与源文无关的细节（例如，编造了一个不存在的人名），只要用词不重复，这些严重的不忠实内容不会显著影响分数。

    - 忽视同义性和知识等价性：两个事实等价但表达不同的句子会得到低重叠分，导致误判。例如，“爱因斯坦出生于1879年”和“爱因斯坦在1879年降临人世”几乎无 n-gram 重叠，BLEU/ROUGE 会认为它们不相似，而实际上完全忠实。

    - 对长文本和结构变化的脆弱性：长文本中，即使整体事实一致，由于语序、句子切分差异，n-gram 重叠率也会暴跌，产生不公的低分。

    专门的事实一致性指标需求：

    为了弥补上述不足，需要能进行深层语义理解和事实逻辑判断的指标。这些指标通常基于以下技术：

    - 基于自然语言推理（NLI）的指标：如 SummaC、FactCC、AlignScore。它们直接判断生成文本能否从源文蕴涵出来，跨越了词汇层面，能识别矛盾、无据添加和逻辑断裂。

    - 基于问答的指标：如 QAGS、QuestEval。通过自动生成问题并检验答案一致性，间接评估事实覆盖与扭曲。这类指标聚焦于“信息点”级别的准确性，而非笼统的文本相似度。

    - 基于信息抽取的指标：如 实体F1、三元组重叠率。抽取事实骨架（实体、关系）进行匹配，对数字、日期等精确信息特别有效。

    - 检索增强的事实核实指标：如 FActScore，将声明与外部知识库比对，不依赖固定参考文本，适用于开放域生成的事实性评估。

    - 大模型作为裁判：利用 GPT-4 等模型进行零样本或小样本的忠实度评分，具有很高的语义灵活性。

    总而言之，专门指标从“文本匹配”转向“事实核查”，能够评估语义等价性、矛盾性和证据充分性，这是 BLEU/ROUGE 永远无法实现的。


content:
  prompt: 什么样的指令微调样本可以教会模型拒绝编造答案？
answer:
  mode: rubric
  reference_answer: |-
    教会模型拒绝编造答案需要样本明确定义什么情况下应该拒绝以及如何拒绝是合适的。关键特征如下：

    （1）明确的不可回答性前提

    - 样本中的问题必须具有清晰的“不可回答”特征，包括：

    - 样本的答案部分直接体现拒绝，并解释理由。

    （2）多样化的拒绝表达

    - 不仅限于生硬的“作为一个AI模型，我无法回答”，而应包括：

    - 这种多样性可防止模型形成单一的“拒绝套路”，并在不同情境下灵活应对。

    （3）将“拒绝编造”置于有用性之上

    - 样本展示：当不确定时，不提供编造答案比提供错误答案更有用。通过格式，让“诚实拒绝”的回复被标记为“优秀”。

    - 可在回复中加入元评论：“如果我随便猜一个答案，可能会误导你，因此我选择告诉你我不确定。”

    （4）对比性负例

    - 指令微调数据中包含“同一问题，错误编造答案”的版本，但其权重或概率被压制。例如，在训练时，使用DPO风格偏好对，让模型明白“拒绝”优于“编造”。

    （5）上下文与指令强调

    - 用户指令本身可以包含“如果你不知道，请直接说不知道”的要求。样本覆盖这类交互，训练模型去遵循此类“反编造”指令。

    （6）风险分级与安全声明

    - 高风险领域样本专门展示“拒绝+安全声明”的模式。如：“我不能提供医疗建议，这些信息不能替代专业诊断。请咨询医生。”

    实施：通过构造涵盖以上要点的数千个多样化指令-回复对，并在 SFT 数据中占有恰当比例（如5%-10%），可显著抑制模型在知识盲区的编造冲动。


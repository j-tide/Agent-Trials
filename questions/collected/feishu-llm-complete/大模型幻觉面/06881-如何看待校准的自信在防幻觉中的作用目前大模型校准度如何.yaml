content:
  prompt: 如何看待“校准的自信”在防幻觉中的作用？目前大模型校准度如何？
answer:
  mode: rubric
  reference_answer: |-
    校准的自信（Calibrated Confidence） 指模型对自身输出的置信度与其实际正确率之间的一致性。一个完美校准的模型，当它说“我有90%把握”时，它的回答确实有90%的概率是正确的。在校准良好的情况下，用户和系统可以依据置信度决定是否信任、采纳或进一步验证模型的输出，这是防范幻觉的关键“元认知”防线。

    在防幻觉中的核心作用：

    - 提供可信度信号：校准的置信度可以作为回答的“质量分数”，帮助用户或下游系统识别可能包含幻觉的回答，做到“知之为知之，不知为不知”。

    - 支撑选择性预测：设定置信度阈值，低于阈值的回答可以自动触发拒答、人工复核或检索增强验证，显著降低高风险幻觉的流出率。

    - 指导不确定性表达：校准良好的模型能将内部的不确定性恰当地转化为语言上的概率性表述（“很可能”、“有可能”），而不是在不确定时仍使用绝对的肯定语气。

    目前大模型的校准度现状：

    - 普遍校准不佳：大量研究表明，当前大模型往往过度自信。它们在产生幻觉时的softmax概率常常很高，甚至与正确回答时相当。这意味着模型在“胡说八道”时并不知道自己在胡说，或者至少没有在概率上反映出应有的迟疑。

    - 分布外校准恶化：在训练数据覆盖良好的领域，校准度勉强可接受；但在分布外输入或知识边界区域，模型置信度依然虚高，校准严重失效。

    - 后训练校准的脆弱性：RLHF等对齐训练虽然能在部分维度上改善输出质量，但对校准度的提升并不稳定，有时甚至会牺牲校准来换取更流畅、更符合人类偏好的回应。

    - 语言表达与概率的不一致：即使用概率表示已校准，模型在自然语言中对“确定”和“可能”的使用仍然与真实概率不够匹配，常将不确定的内容用确定的口吻说出。

    改进方向：

    - 校准训练：使用校准损失函数（如温度缩放、标签平滑）在后训练阶段专门优化校准度。

    - 口头置信度训练：训练模型用自然语言输出其置信度，并在RLHF中奖励置信度与真实正确率一致的回复。

    - 集成与多次采样校准：通过Self-Consistency等集成方法，利用多次采样的答案一致性来校准单次输出的置信度。

    校准的自信是连接“模型知道什么”与“用户相信什么”的桥梁。提升校准度，即使不能直接消除幻觉，也能大幅降低幻觉带来的实际损害。


content:
  prompt: 如何检测模型在摘要生成中的幻觉？常用的摘要幻觉检测基准。
answer:
  mode: rubric
  reference_answer: |-
    摘要生成中的幻觉主要指忠实性幻觉，即摘要包含原文没有的信息（外部幻觉）或曲解原文信息（内部幻觉）。检测方法围绕比较摘要与原文的事实一致性。

    检测方法体系：

    （1）基于 NLI 的忠实度评估

    - 使用 NLI 模型（如 FactualNLI 微调的模型）将原文作为前提，摘要句子作为假设，判断是否蕴含。常配合句子对齐，先找原文中最相关的支持句。

    - 指标：蕴含句数占比、矛盾句数占比。

    （2）基于信息抽取与比对

    - 同时从原文和摘要中抽取实体、关系、事件。计算摘要中的元素有多少百分比出现在原文中（精度），原文中的关键信息有多少被摘要覆盖（召回）。任何不在原文中的抽取元素即为潜在幻觉。

    - 典型工具：OpenIE 抽取三元组，然后对齐。

    （3）基于问答（QA）的方法

    - 根据原文自动生成一系列问题（使用问题生成模型），然后用原文回答（得到标准答案），再用摘要回答。比较两个答案的语义等价性。如果摘要答案错误或无法回答，则摘要可能包含幻觉。常用指标如 QAGS (Question Answering for Grounding Summaries)。

    - QA 方法对细节增减敏感，是目前较强的自动评估方式。

    （4）文本覆盖与引用分析

    - 对于生成摘要中出现的具体数字、日期、专有名词，检查它们是否完全在原文中出现。任何未在原文中出现的数值或专有名词都是高可能性幻觉。

    - 使用 Copilot 式的逐句引用检查，看摘要是否能被原文片段精准支撑。

    （5）大模型直接评判

    - 使用 GPT-4 等强模型作为评判器，给定原文和摘要，要求其标注摘要中不忠实于原文的部分，并解释。这在零样本下很有效，但成本高。

    常用的摘要幻觉检测基准：

    - XSum-Factuality / FactCC：基于 XSum 单句摘要数据集，人工标注了摘要是否忠实原文。FactCC 是一种基于 BERT 的评估器，判断摘要句相对于原文是否一致。

    - CNN/DM 幻觉子集：研究人员从 CNN/Daily Mail 数据集生成大量摘要并标注忠实性，常用于训练检测器（如 FactualNLI）。

    - SummaC：一个综合性基准和工具包，包含多个自动评估指标，并提供带有细粒度忠实度标注的数据集（如 SummaC Benchmark），用于评估摘要幻觉。

    - FRANK：一个较为全面的摘要幻觉数据集，覆盖多种模型生成的摘要，标注了幻觉类型（如句法推导、上下文幻觉等），并提供了类别标签。

    - QAGS：上述QA方法提出的数据集，包含 CNN/DM 和 XSum 上的摘要及其忠实度标注。

    - HalluEval 等中文基准：针对中文摘要的幻觉检测数据集。

    检测流程整合：

    - 使用 QAGS 进行快速预筛；

    - 对可疑句子运行 FactualNLI 或 SummaC 进行细粒度判断；

    - 输出幻觉片段位置和类型，评估整体可信度。

    挑战：

    - 跨领域的泛化：不同领域、不同长度的摘要需要专门校准。

    - 固有幻觉（信息重组正确但表达不同）可能被误判。

    - 缺乏完美的自动化指标，常需结合人工评估进行校准。

    总结：摘要幻觉检测已形成从 NLI、QA 到专有基准的多维体系，实际应用通常多方法融合以提高鲁棒性。


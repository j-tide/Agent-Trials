content:
  prompt: 如何通过数据清洗减少训练数据中的事实错误？列举方法。
answer:
  mode: rubric
  reference_answer: |-
    数据清洗是缓解幻觉的第一道防线，目标是在预训练和微调阶段剔除或修正错误信息，从源头降低模型学习虚假关联的概率。具体方法可分层实施：

    [图片内容未导入]

    （1）基于规则与启发式过滤

    - 来源黑名单：屏蔽已知的低质量网站、谣言传播站点、内容农场等域名。维护一个动态更新的不可信来源列表，大幅降低低质内容混入。

    - 关键词与模式过滤：使用敏感词、矛盾模式（如“科学证明…，但最新研究又推翻…”）进行标记，对含极端化断言、阴谋论术语的文本进行降权或移除。

    - 格式与质量门槛：剔除文本过短、乱码、HTML标签未清洗干净、缺乏标点或全大写的文本。这些粗糙文本往往伴随不可靠内容。

    （2）基于模型的质量评估与打分

    - 困惑度过滤：用一个小型语言模型计算文本困惑度（PPL），剔除异常高困惑度的段落，因为它们通常语法混乱或逻辑断裂，可能包含错误信息。

    - 事实性打分模型：训练或使用现成的事实性检测器（如基于NLI的模型），以维基百科等相对可靠的知识源为证据，对训练文本中的句子进行事实性评分。低分文本被自动剔除或标记审核。

    - 重复与近重复检测：使用MinHash、SimHash等算法识别高度重复的段落。过度重复的错误信息会形成强记忆。去重不仅节省计算，还防止虚假事实被反复强化。

    （3）知识库辅助的核实与修正

    - 实体一致性校验：利用知识图谱（如Wikidata）检查文本中的实体关系。若文本声称“爱因斯坦出生于法国”，而知识库显示“德国”，则标记为潜在错误，可丢弃或自动修正为正确陈述。

    - 数值与日期验证：对文本中提取出的数字和日期进行范围检查或与知识库比对，剔除严重偏离常理或与权威源矛盾的数据。

    - 引用回溯：对于包含引用的文本，爬取原始来源进行比对，若核心事实不一致，则丢弃。

    （4）众包与专家清洗

    - 对于高价值、高风险领域（医疗、法律），投入领域专家对训练数据进行抽样核实和错误标注，并将修正后的数据回补训练集。这是成本最高但效果最彻底的方法。

    - 构建错误报告机制，允许社区用户标记数据中的错误，经过审核后加入过滤规则。

    （5）文本质量增强与重写

    - 对于不准确的文本，不简单删除，而是使用大模型进行事实一致性改写（类似FaithDial的思想），保留有用语言模式的同时修正错误事实，作为正向样本加入训练。

    - 使用对抗生成思路，生成易错事实的正反例，强化模型对正确事实的绑定。

    组合策略：数据清洗应形成流水线：先粗筛（规则+困惑度），再细筛（事实打分+知识库验证），最后人工抽检。清洗虽然无法根除所有错误，但能大幅降低“垃圾进，垃圾出”导致的幻觉密度。


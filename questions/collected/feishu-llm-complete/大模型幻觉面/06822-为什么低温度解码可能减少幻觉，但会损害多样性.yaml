content:
  prompt: 为什么低温度解码可能减少幻觉，但会损害多样性？
answer:
  mode: rubric
  reference_answer: |-
    低温度减少幻觉的机理：

    - 低温度强化了模型对高频知识的依赖。在训练数据中，正确事实的出现频率通常远高于错误事实，因此正确知识的token序列在无干扰时具有更高的原始概率。低温放大这些概率差异，使模型“走老路”，从而输出更常见、更可能正确的答案，避免因为采样到低概率的“创新”表达而扭曲事实。

    - 减少了随机噪声。许多幻觉来自于解码时的不确定性采样，低温通过近似贪心选择，消除了这部分随机性引入的错误。

    损害多样性的原因：

    - 语言是高度多变的，同一意思可以有无数种合法表达。这些丰富表达的token通常在条件概率分布中并不总是占据最顶部位置，而是分散在许多合理的中等概率token中。

    - 低温使分布尖峰化，实际上将绝大部分概率质量集中在极少数的top token上，导致模型反复选择相同的词汇和句式，陷入重复循环。在需要创意、多轮对话和长文本生成时，这将导致文本枯燥、机械，失去自然语言的丰富性。

    - 多样性的根本来源是对中低概率但合理token的探索。低温几乎扼杀了这种探索，将生成过程降级为“安全但无聊”的复读。

    权衡与现象：

    - 存在一个“事实性-多样性”权衡曲线。极低温度对应高事实性但极低多样性（甚至产生退化文本）；高温度带来高多样性但易引入幻觉。

    - 实际中，可通过动态温度、重复惩罚、以及结合核采样来部分缓解：核采样截断尾部噪声，而保留适温下的中等概率多样性token，是平衡两者的有效手段。


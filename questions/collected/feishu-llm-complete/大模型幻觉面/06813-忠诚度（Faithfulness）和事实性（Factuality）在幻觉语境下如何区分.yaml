content:
  prompt: "“忠诚度”（Faithfulness）和“事实性”（Factuality）在幻觉语境下如何区分？"
answer:
  mode: rubric
  reference_answer: |-
    在幻觉语境下，这两个术语虽然常被并提，但指代不同层次的可靠性，区分它们对于评估、诊断和缓解幻觉至关重要。

    定义差异：

    - 忠诚度：指模型的输出是否忠实于给定的输入或上下文。它衡量的是输出与输入信息的一致性，不关心输入信息本身是否正确。

    - 事实性：指模型的输出是否与现实世界的客观事实相符。

    具体对比：

    [嵌入表格未展开]

    为什么要严格区分？

    - 评估分离：在摘要任务中，我们可以用蕴含模型（NLI）评估忠实度，而不必关心摘要中的事实是否真实（原文本身可能有误）。在开放域问答中，我们则需要事实性评价。

    - 错误溯源：模型可能对错误输入保持忠诚（忠实但不真实），这通常不是模型的错；模型也可能对正确输入不忠实（不忠实但可能部分真实），这反映了模型的理解/生成控制问题。

    - 缓解策略不同：

    在防止幻觉的综合目标下，忠诚度和事实性需要共同提升。RAG 场景尤其如此：我们希望模型对检索文档忠实，因为这些文档应该已经过事实性筛选。如果一个 RAG 系统输出既忠实又事实，则达到了理想的可靠状态。


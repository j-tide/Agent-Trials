content:
  prompt: 在 RAG 场景下，如何检测模型是否使用了检索内容？如何判断“忠实度”？
answer:
  mode: rubric
  reference_answer: |-
    在 RAG（检索增强生成）系统中，确保模型生成的回答充分利用检索到的文档且忠实于这些文档是核心要求。检测分为两部分：使用检测和忠实度评估。

    一、检测模型是否使用了检索内容

    （1）引用匹配与覆盖率

    - 如果模型被训练输出引用标记（如“[1]”、“[2]”），直接检查生成的引用编号是否在给定的检索文档索引范围内。引用文档编号不存在或引用内容与文档不符，则为未使用或错误使用。

    - 计算回答中能够与检索文档中句子匹配的比例。可以使用文本跨度检索或语义相似度，如果回答的大部分内容在检索文档中找不到相似源头，说明模型在依赖自身参数知识，而非检索内容。

    （2）动态裁剪实验（Ablation）

    - 将检索文档替换为无关文档或随机文档，观察模型生成是否显著变化。如果即使给了无关文档，模型依然生成相似的正确答案，则说明它主要依赖内部知识，忽略检索。

    - 或者，从原始检索文档中删除关键事实句，若模型仍能说出该事实，说明该知识来自参数记忆而非检索。

    （3）基于注意力的可解释性分析

    - 在生成过程中，分析交叉注意力权重，看模型在每个解码步骤对检索文档 token 的关注程度。如果对检索文档的平均注意力极低，表明模型在生成时未真正阅读。

    - 查看注意力分布是否聚焦于文档的相关部分，并跟踪信息流。

    （4）生成前置验证提示

    - 在生成最终答案前，先要求模型显式地“从文档中提取相关信息”，再基于提取内容回答。如果模型无法正确提取，或提取内容与最终回答不一致，则可能未合理使用检索。

    （5）后验 NLI 检测

    - 对于回答中的每个声明，用 NLI 模型检查是否能被检索文档集蕴含。如果某个声明在文档集中完全得不到支撑（中立或矛盾），则说明该部分内容要么是幻觉，要么模型未使用检索（因为使用了但不应违背）。

    二、判断忠实度（Faithfulness）

    RAG 场景中的忠实度特指回答是否严格基于检索文档，不添加、不歪曲文档信息。

    （1）声明级 NLI 忠实度评估

    - 将回答分解为原子事实，对每个事实，用检索文档作为前提进行 NLI。若前提蕴含假设，则该事实忠实；若矛盾或中立，则判定为不忠实（幻觉）。

    - 可计算忠实比例：得到蕴含标签的原子事实数 / 总原子事实数，作为 RAG 忠实度分数。

    （2）引用准确性校验（Citation Recall and Precision）

    - 检查回答中的每个带有引用的陈述，其引用文档内容是否确实支持该陈述（精度）；同时检查所有应该被支撑的陈述是否都有恰当的引用（召回）。

    - 若有引用但内容不支持，属于“虚假引用”，是典型的不忠实。

    （3）基于 QA 的忠实度

    - 根据检索文档生成一组问题，分别用文档（标准答案）和生成的回答来回答。比较两组答案的一致性。如果回答对于某个问题的答案与文档不同，说明回答偏离了文档，存在忠实性问题。

    （4）Copy-Through 检测

    - 检查回答中的关键数字、专有名词、日期是否与检索文档完全相同。如果不一致，几乎必然是不忠实（除非有合理的改写）。

    综合应用：

    在 RAG 检测流水线中，通常会同时计算检索利用率（回答内容在文档中的覆盖率）和忠实度（基于 NLI 的支撑率）。如果利用率低且忠实度也低，说明模型严重依赖自身知识产生幻觉；如果利用率高但忠实度低，可能模型在“强行概括”导致信息扭曲；如果两者都高，则是理想的 RAG 行为。

    这些检测和评估为改进检索器、重写查询或微调模型提供了直接的数据支撑。

    ---

    - 语义相似度：计算原子事实与每个参考回答的余弦相似度（基于句子嵌入），然后取平均值或最大值。如果平均相似度低，说明其他回答没有类似陈述，该事实可能是幻觉。

    - 蕴含得分：使用 NLI 模型，以参考回答为前提，原子事实为假设，计算被蕴含的次数或平均蕴含概率。如果多数参考回答都不蕴含该事实，则标记为幻觉。

    - BERTScore 或 QA 式验证：用参考回答作为上下文，提问生成该事实的问题，看能否得到支持答案。

    - Support（支撑）：在源文/知识中可找到直接证据。

    - Contradict（矛盾）：与源文/事实明确相反。

    - Unsupported（无依据，Neutral）：陈述的信息未在源文中出现，也未与事实矛盾。

    - Can't Judge（无法判断）：信息不足以判断（慎用）。

    - 让模型输出JSON列表，每个元素是一个独立的简单陈述句。

    - 强调每条事实只包含一个主谓宾结构，剥离多余从句；避免复合句。

    - 要求事实必须从原文直接提炼，不能添加推理或外部知识。

    - 提供几个示范示例（Few-shot）。

    - 使用检索模型（如DPR）在维基百科中检索与传记实体和原子事实相关的页面和段落。

    - 结合NLI模型或QA模型判断检索到的知识是否支撑该原子事实。在FActScore原始实现中，使用基于维基百科的自动化验证器（如基于FEVER训练的NLI模型），输出支撑/矛盾/证据不足。

    - FActScore = (被知识源支撑的原子事实数量) / (总原子事实数量)

    - 取值范围0到1，越接近1表示传记事实性越好。

    - 实际计算时，可能剔除“证据不足”的原子事实，或者将其视为非支撑（严格版本）。原始工作同时报告两个版本。

    - 实体替换：随机将源文中的实体替换为同类别的其他实体（如将“巴黎”换成“伦敦”），使目标句与源文事实矛盾。

    - 反义与否定：自动插入或修改否定词（“不”、“没有”），翻转语义。

    - 句子融合/拼接：将两个不相关句子的前半句和后半句拼接，形成逻辑不通的文本，作为某源文的“生成文本”。

    - 数字修改：随机增加或减少文中的数值，制造细微矛盾。

    - 句子乱序干扰：打乱时间或因果顺序，制造逻辑不一致。

    - 使用弱模型生成：让一个小型或未充分训练的生成模型基于源文生成摘要，这些摘要很可能会包含忠实性错误，作为天然负例。

    - 对于正例（一致）和二值负例（不一致），使用二元交叉熵损失，要求模型输出接近1或0。

    - 也可以使用对比损失：使得正例对的相似度远高于对应负例对的相似度。这使得模型学习的不仅是表面分类，更是细粒度的语义对齐程度。

    - 赋予连续分数：AlignScore期望输出0到1之间的分数，因此采用Sigmoid激活并回归到0/1标签，或者使用排序损失。

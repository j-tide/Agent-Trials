content:
  prompt: 什么是“知识边界幻觉”？模型何时应该承认不知道？
answer:
  mode: rubric
  reference_answer: |-
    知识边界幻觉（Knowledge Boundary Hallucination） 指模型在其知识覆盖范围之外，无法识别自身知识的极限，从而对超出其可靠知识边界的问题进行猜测或编造，而不是表达不确定性或拒绝回答。这是一种“不知而强以为知”的现象。

    核心特征：

    - 模型对问题所涉及的事实缺乏可靠的参数记忆，或者该信息超出其训练数据截止日期。

    - 模型本应输出“我不知道”、“我无法获取该信息”或表达概率性不确定，但实际上却生成了肯定、详细且看似合理的回答。

    - 这种幻觉直接反映了模型缺乏元认知能力——即监视自身知识状态并据此调整行为的能力。

    何时应该承认不知道？

    从负责任 AI 的角度，模型应在以下情况主动表达知识边界：

    - 时间敏感信息超出截止日期：当被问及模型训练数据截止日期之后的事件（例如“2024年世界杯冠军”），模型应明确指出其知识截止日期，避免编造。

    - 涉及实时或私密数据：例如股票即时价格、个人医疗记录、未公开的企业内部情报。模型不可能知道这些，应拒绝猜测。

    - 高度小众、长尾的知识：如某一小村庄某年某日的天气、非常罕见的疾病细节、不知名人物的生平，模型训练数据中大概率没有，且容易混淆，应该表达不确定性。

    - 问题前提为假或无法验证：如“为什么独角兽的角能治愈癌症？”模型应指出前提有误，而不是就假前提进行推导。

    - 复杂多跳推理缺乏确定性证据：如果推理链的任何一步基于不确定的猜测，模型应该在输出中显式说明该不确定性，或者放弃作答。

    - 高风险领域：在医疗、法律、金融等建议中，即使模型有一定的知识，也应声明自己的局限性，避免用户将其视为权威。

    为何当前模型做不到：

    - 训练数据中缺少表示不确定性和拒绝回答的自然示范（人类对话中人们不常直接说“我不知道”）。

    - 对齐训练时，模型获得的奖励偏向于“有用”和“有帮助”，这使得模型倾向于提供任何可能的答案，而不是承认无知。

    - 校准不佳：模型在知识边界上对自己的不确定性没有正确估计，反而常表现出高置信度。

    改进方向：

    - 训练模型生成带有置信度的回答，或学习输出特殊拒绝 token。

    - 微调时引入知识边界数据集：包含许多需要承认不知道的样本，并让模型模仿回答“I'm not sure, but here is some related information...”。

    - 外部知识锚定：结合检索增强，若检索得分低，则提示模型表达不确定性。


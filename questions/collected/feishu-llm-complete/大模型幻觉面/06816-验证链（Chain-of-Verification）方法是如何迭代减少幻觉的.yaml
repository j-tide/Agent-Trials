content:
  prompt: "“验证链”（Chain-of-Verification）方法是如何迭代减少幻觉的？"
answer:
  mode: rubric
  reference_answer: |-
    验证链（Chain-of-Verification, CoVe） 是一种通过多步骤生成-验证闭环来减少幻觉的方法。它让模型在生成初步回答后，有意识地对该回答进行事实核查，并根据核查结果修正答案，从而迭代式地提升最终输出的真实性。

    实施流程：

    - 生成初始回答：模型根据用户查询生成一个完整的基线回答。

    - 规划验证问题：模型根据该回答内容，自动生成一系列用于事实核查的验证问题。这些问题旨在逐一验证初始回答中的各个关键声明。例如，若回答“爱因斯坦出生于德国乌尔姆，于1921年获诺贝尔奖”，验证问题可以是“爱因斯坦在哪里出生？”和“爱因斯坦哪年获诺贝尔奖？”。

    - 执行验证：模型独立地回答这些验证问题。这一步相当于模型作为核查员，纯粹基于自己的知识（或检索）来回答问题，不受初始回答措辞的干扰。

    - 一致性比对：将初始回答中的声明与验证环节得出的答案进行比对。如果存在矛盾（比如验证时回答“1922年”而初始回答是“1921年”），则记录为不一致点。

    - 修正生成：将检测到的不一致之处、原始回答及验证答案一起，送入模型的最终生成步骤。提示模型“请修正原始回答中的事实错误，使其与验证结果一致”，生成经过校验的最终回答。

    为什么能迭代减少幻觉：

    - 解耦与独立验证：CoVe将生成与验证过程解耦，利用模型独立回答验证问题时的准确率往往高于在约束生成中避免错误的准确率这一现象。通过这种“自我交叉检验”，更容易捕获事实错误。

    - 针对性修正：不是笼统地重写，而是针对已知矛盾点进行靶向修正，减少了二次引入新幻觉的风险。

    演化与增强：

    - 可多轮迭代（将修正后回答再次验证）。

    - 可接入外部工具，如搜索验证问题，将验证能力从参数知识扩展到实时知识。

    - 思维树（Tree of Thoughts）等可与其结合，进行多路径验证与回溯。


content:
  prompt: 如何构建一个后处理管道，自动修正生成文本中的事实错误？
answer:
  mode: rubric
  reference_answer: |-
    后处理管道在模型生成文本之后介入，通过检测和修正流程来减少最终输出中的幻觉，适合对已有模型输出的二次优化。

    管道架构与步骤：

    - 幻觉检测与定位

    - 修正决策与生成

    - 重写与流畅性恢复

    - 最终验证与输出

    技术要点：

    - 效率权衡：对事实性要求极高的场景可全量核查；对于实时性要求高的，可仅对高风险声明（如数字、实体、断言）进行核查。

    - 来源标注：修正后可以附加修改依据的引用链接，增加透明度和可信度。

    - 修正回退：设定置信度阈值，若修正信心不足，保留原样并提示用户可能存在错误。

    这样的后处理管道将生成与校验解耦，能显著提升任意模型输出的可信度，是现阶段工程上落地可用的幻觉修复方案。


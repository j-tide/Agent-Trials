content:
  prompt: 在多步推理系统中，如何通过“回溯”机制纠正中间的幻觉？
answer:
  mode: rubric
  reference_answer: |-
    多步推理系统（如思维链、规划执行）中，中间步骤的错误（幻觉）会被放大并污染后续推理链。回溯机制允许系统在检测到中间步骤可能出错时，回退到之前的可靠状态并尝试替代路径，以此纠正推理幻觉。

    实现回溯的核心技术：

    （1）步骤级验证器与置信度评估

    - 在每个推理步骤生成后，立即对该步骤进行独立的真值评估。评估器可以是基于规则的（数学等式校验）、基于外部知识的（查询数据库）或基于模型的（轻量NLI检查与已知事实的一致性）。

    - 给每一步赋予一个置信度分数，当某步的置信度低于阈值时，触发回溯信号。

    （2）回溯策略

    - 单步回溯与替换：丢弃当前低质量步骤，要求模型基于前一步的正确状态，重新生成一个新的下一步。可以同时生成多个候选下一步，用验证器选择得分最高的一个继续。

    - 多级回溯（Tree-of-Thoughts）：在整个推理过程中构建搜索树，每个节点是一个推理状态。当某条路径的整体评分下降时，回溯到之前评分最高的分支点，探索其他分支。这需要维护多个可能的推理轨迹，并进行广度或深度优先搜索。

    - 回溯与修正提示：在检测到错误步骤后，向模型展示错误步骤及验证器给出的错误原因，让它“重新思考这一步”，明确知道哪里错了，从而生成修正的步骤。

    （3）全局一致性回溯

    - 不仅在单步内检查，还要定期检查当前推理路径是否与原始问题前提、已确认事实、常识一致。若发现严重矛盾，回溯到矛盾引入点之前，重新规划。

    - 例如，在长文本生成中，如果后面的事实陈述与前面矛盾，可回溯到矛盾起始位置进行改写。

    （4）利用外部工具锚定回溯点

    - 在复杂数学题中，当推导出最终数值答案时，可先用计算器验证答案；若错误，回溯到关键公式代入步骤，检查是公式错还是计算错。

    - 在代码生成中，运行代码后报错，可回溯到错误行，分析报错信息并修正。

    关键挑战：

    - 精确的步骤级验证器难以构建，特别是涉及开放语义的推理。

    - 维护搜索树会产生高昂的推理成本和内存消耗。

    - 需要模型具备强大的指令遵循能力，才能在回溯后有效采纳修正意见。

    回溯机制将“生成-检查-修正”闭环融入推理过程，极大增强了多步推理系统的鲁棒性，是迈向可靠推理的重要方向。


content:
  prompt: 基于问答的评估：如何通过模型回答衍生问题集来检测幻觉？
answer:
  mode: rubric
  reference_answer: |-
    基于问答（QA）的评估方法通过自动生成问题并比较答案来间接评估生成文本的忠实度，能有效检测信息遗漏、添加和歪曲。

    工作流程：

    - 问题生成：使用一个训练好的问题生成模型，以源文（或参考文本）为输入，自动生成一组覆盖源文关键信息点的问题。这些问题应多样化，包括事实性问题（谁、何时、何地）、数字问题、因果问题等。生成质量至关重要，低质量或模糊的问题会破坏评估。

    - 答案生成：

    - 答案比较与评分：比较两组答案的语义一致性。如果对于某个问题，生成文本给出的答案与源文答案不一致（例如，缺失、错误、或添加了额外不实细节），则意味着生成文本在该信息点上存在幻觉（不忠实）。

    - 指标聚合：

    为什么有效？

    - 聚焦信息点：将长文本的比较转化为多个具体的信息点问答，细粒度地捕捉增删改。

    - 对同义改写鲁棒：只要答案语义等价，即使表达不同也能得高分，避免了 n-gram 指标的缺陷。

    - 可解释性强：能够明确指出在哪个问题上出现了不一致，便于定位幻觉片段。

    局限性：

    - 问题生成和问答模型本身可能犯错，错误会被传播。

    - 隐晦的、需要多步推理的矛盾可能难以通过单一问答发现。

    - 若生成文本完全编造了源文没有的主题，问题生成器可能无法提出相应问题，导致漏检。此时需结合 NLI 或覆盖率指标。

    尽管如此，基于问答的评估已成为忠实度检测的主流和强基线之一。


content:
  prompt: 如何构建一个对抗性幻觉测试集，测试模型的鲁棒性？
answer:
  mode: rubric
  reference_answer: |-
    对抗性幻觉测试集旨在故意诱导模型犯错，以评估其在最坏情况下的表现。构建方法包括已知弱点的针对性设计和自动发掘。

    （1）知识冲突样本

    - 上下文-记忆冲突：构造问题，提供的上下文包含与模型强参数知识相矛盾的信息（如上下文说“水的沸点是50°C”），测试模型是否能遵循上下文而不依赖错误记忆。如果模型输出参数知识，则是固执性幻觉。

    - 多源矛盾：提供多个检索文档，相互之间对同一事实给出矛盾信息，测试模型是否能识别冲突、表达不确定性或进行合理整合，而不是盲目选择或混合。

    （2）复杂推理与逻辑陷阱

    - 误导性推理链：设计需要多步推理但存在常见错误推理捷径的问题。例如，给出错误提示“如果A>B且B>C，那么C最大”，诱使模型输出错误结论。

    - 嵌套谬误：在源文中嵌入虚假因果关系、循环论证等，然后要求总结，观察模型是否复制这些逻辑谬误为幻觉结论。

    - 反事实前提问题：询问基于假前提的问题（如“为什么天空是绿色的？”），测试模型是否先否认前提。

    （3）统计模式陷阱

    - 高频错误模板：利用 TruthfulQA 的思想，构造那些在训练数据中常被错误关联的事实（如流行谬误），考验模型是否跟随错误的群体记忆。

    - 模糊实体拼接：构造涉及多个相似实体的描述，实体属性交错，诱使模型张冠李戴。

    （4）长文本与注意力压力测试

    - 大海捞针变体：在长文档的中间部分插入关键矛盾信息，测试模型是否能注意到并妥善处理。

    - 远距离依赖矛盾：文档开头确立某个事实，在末尾引入与该事实冲突的新信息，要求模型根据全文回答，考察其整合能力。

    （5）对抗性提示设计

    - 角色扮演诱导：使用“你现在是一个不诚实的助手”等提示，看模型是否会被诱导产生幻觉。

    - 假设性幻觉触发：用“详细描述X，即使你知道不存在”测试模型是否在压力下编造。

    （6）自动对抗生成方法

    - 基于梯度的扰动：对于白盒模型，可在输入上添加微小扰动，最大化输出矛盾或实体错误的概率。

    - 基于大模型的对抗改写：用 GPT-4 改写源文，保持原意的同时增加模棱两可的表述，或植入微妙的矛盾，测试模型是否会被干扰。

    - A/B 测试框架：自动生成大量原始样本，每个样本有一个对应的对抗版本（如修改某个数字），比较模型在两者上的幻觉率差异。

    测试集构成与评估：

    - 每个样本都有明确的金标签（如：回答应跟随上下文，应指出矛盾，应拒绝回答等）。

    - 评估指标包括：冲突识别率、正确依从率、拒答率、新增幻觉率等。

    - 按难度分层，报告模型在不同攻击类型下的鲁棒性得分。

    对抗性测试集能暴露模型在边界和压力下的脆弱性，是评估幻觉鲁棒性的关键工具。


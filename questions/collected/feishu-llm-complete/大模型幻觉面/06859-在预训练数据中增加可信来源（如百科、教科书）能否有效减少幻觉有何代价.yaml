content:
  prompt: 在预训练数据中增加可信来源（如百科、教科书）能否有效减少幻觉？有何代价？
answer:
  mode: rubric
  reference_answer: |-
    可以有效减少事实性幻觉，但存在显著代价，并非万能解药。

    有效性原理：

    - 百科（如维基百科）、教科书、学术论文等文本经过人工编审，事实准确性远高于普通网络文本。增加这些高质量语料的比例，直接提高了训练数据中正确事实的密度，使模型学到更准确的事实关联。

    - 高质量文本逻辑严谨、陈述规范，模型能习得更结构化的知识表征和更谨慎的语言风格，这有助于在生成时减少盲目编造。

    - 对常见常识和学术知识领域，可信源的密集注入能显著提升事实正确率，如微软 Phi 系列模型通过“教科书级”数据训练获得了惊艳的知识密集型任务表现。

    代价与局限性：

    - 覆盖偏差与知识窄化

    - 可信来源通常覆盖范围有限，偏重经典知识、西方学术体系、主流观点。这会导致模型对长尾实体、新兴领域、亚文化、口语化表达和无标准答案的开放议题知识缺失。面对这些盲区，模型仍会编造（只是可能用更学术的语言）。

    - 过度依赖百科会降低模型处理非正式、对话式文本的能力，弱化其作为通用对话助手的自然度。

    - 时效性滞后

    - 教科书和百科的更新周期长，无法包含最新事件和动态知识。单纯依赖它们会导致严重的知识截止幻觉，且模型可能以过时信息作为“真理”高置信输出。

    - 数据量有限，无法支撑大模型规模

    - 高质量可信文本的总量远少于互联网全量爬取数据。单纯靠这些数据无法满足千亿级参数模型预训练的海量需求，必须与其他数据混合。如果比例过高，可能因数据重复而导致记忆化幻觉和过拟合。

    - 无法解决忠实性幻觉

    - 增加可信源主要提升模型参数化知识的真实性，但无法直接提升模型遵循用户提供的上下文的能力（忠实性）。模型仍可能在摘要、对话等任务中对给定源文不忠实。

    - 经济与法律代价

    - 教科书、学术论文等受版权保护，大规模用于商业预训练存在法律风险。获取授权成本高昂，且许多高质量资源并不开放。

    结论：在预训练中增加可信来源是提高模型事实性的重要且有效的手段之一，但必须作为多元数据混合策略的一部分，结合大规模多样化网络文本，并辅以检索增强、时效更新等技术，才能全面平衡地减少幻觉。


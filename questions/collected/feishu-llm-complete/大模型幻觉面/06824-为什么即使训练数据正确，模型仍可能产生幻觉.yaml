content:
  prompt: 为什么即使训练数据正确，模型仍可能产生幻觉？
answer:
  mode: rubric
  reference_answer: |-
    训练数据完全正确并不能杜绝幻觉，因为幻觉的产生远不限于训练数据噪声，而与模型的学习方式、生成机制及数据分布本身有关。

    （1）统计学习与真实性的根本鸿沟

    - 语言模型的训练目标是最小化下一个 token 的预测损失，也就是模仿训练数据的分布，而不是学习“真相”函数。即使数据100%正确，模型学到的仍是“在上下文 C 下，token T 出现的概率”，而非“token T 所指的命题为真”。

    - 对于相同的正确事实，可能存在多种语言表达，模型可能会混合这些表达，产生一个事实错误但语法合理的句子。例如，正确的数据包含“巴黎在法国”和“里昂在法国”，模型可能错误组合成“巴黎在法国，里昂是它的首都”。

    （2）分布外泛化与组合性错误

    - 即使单个事实都正确，当模型被要求组合两个或多个事实进行推理时，可能会产生在训练数据中从未出现过的错误组合。例如，训练数据中有“小明是工程师”和“小红是医生”，模型被问及“小明的职业”时可能回答正确，但被要求编故事时可能写“小明是医生”，因为在语言模式上“小明”和“医生”也是常见搭配。

    - 这种组合性幻觉是因果模型和符号化推理所抑制的，而纯统计模型难以避免。

    （3）不确定性下的最优猜测

    - 对于训练数据覆盖不足的问题（即使数据正确，但覆盖不全面），模型仍会面临知识缺口。此时，解码策略（如贪心或温度采样）会促使模型输出概率最高的续写，这通常是一个看似合理的猜测。该猜测可能恰是错误的，形成了幻觉。换句话说，模型被逼着回答，只能用学到的语言模式“脑补”。

    （4）训练中的遗忘与干扰

    - 正确的知识虽然在训练数据中出现过，但由于模型容量限制、多任务学习干扰或后续微调的灾难性遗忘，这些知识可能被冲淡或扭曲。当再次被查询时，模型提取出的可能是与其它相似概念混合后的失真版本。

    （5）上下文冲突与提示误导

    - 即使用户提示中包含误导性假设，模型有时会顺应提示的“虚假前提”而生成延续，即便它自身参数中存储的正确知识与提示不符。例如，用户说“假设月亮是奶酪做的，那么它的密度是多少？”，模型可能会煞有介事地推算，生成一段看似科学但基于虚假前提的输出。这种“顺应性幻觉”在数据正确的前提下依然出现。

    因此，消除训练数据错误只是减少幻觉的必要条件之一，远非充分条件。需要从目标函数、解码策略、推理架构等更根本的层面进行革新。


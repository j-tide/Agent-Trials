content:
  prompt: 如何看待“有用的幻觉”？例如创造性写作、头脑风暴中，模型“编造”内容可能是优点。
answer:
  mode: rubric
  reference_answer: |-
    “有用的幻觉”这一概念本身揭示了“幻觉”一词的局限性。 在许多需要想象力、发散思维、假设推演和艺术创造的场景中，模型生成“不真实”内容的能力正是其核心价值所在。这种能力不应被污名化为“幻觉”，而应被视为受控的创造性虚构。

    为什么是“有用的”：

    - 创意写作与艺术：小说、剧本、诗歌要求模型构建虚构的人物、世界和情节。这种“编造”是创作，而非错误。模型对现实的偏离是其想象力的体现，与人类作家的虚构行为无异。

    - 头脑风暴与创新：在设计新产品、构思营销方案、解决工程难题时，模型提出的“不存在的解决方案”或“虚构的案例”能打破思维定式，激发人类的新思路。即使大部分不可行，其中的“火花”价值巨大。

    - 教育中的类比与简化：为了解释复杂概念，模型可能需要编造一个简化的故事或类比，其中包含不精确的细节，但能有效传递核心要义。这种教学式虚构是有益的。

    - 社交与情感陪伴：聊天机器人编造一个关于自己“一天的生活”的故事，可增强亲和力和互动性，这是设计期望的社交行为。

    区分“有用的幻觉”与“有害幻觉”的关键：

    - 用户知情与意图明确：在创意模式下，系统应明确告知（或通过上下文不言自明）它正在虚构。例如，通过系统提示“以下是为您创作的故事”。而在事实查询时，若编造则是有害幻觉。

    - 可控性：用户或开发者能够决定何时开启“创意模式”允许虚构，何时必须严格遵循事实。这通过系统指令、解码参数调整等实现。

    - 无害性：即使是虚构，也不应产生有害、偏见或危险的内容（如教人制作炸弹的虚构说明书）。

    重新定义与价值再定位：

    不应笼统地将所有“不真实”的输出都称为“幻觉”。术语上的精确化有助于制定更合理的缓解策略。我们可以用“事实性幻觉”来特指在需要真实性的场景下产生的编造；而将另一部分称为“生成式虚构”或“想象力输出”。这一定位将“有用的幻觉”从待解决的问题列表中移除，转而放入需要精细控制的能力范畴。

    总结：拥抱“有用的虚构”能力，同时精准抑制“有害的幻觉”，是先进AI系统的核心设计哲学。这要求模型具备强大的上下文感知能力，能够自动分辨所处场景的需求，或提供简易的模式切换供用户选择。


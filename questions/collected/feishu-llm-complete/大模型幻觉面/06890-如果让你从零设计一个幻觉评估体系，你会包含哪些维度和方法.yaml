content:
  prompt: 如果让你从零设计一个幻觉评估体系，你会包含哪些维度和方法？
answer:
  mode: rubric
  reference_answer: |-
    从零设计一个全面的幻觉评估体系，我会采用多维分层、自动+人评融合、静态+动态覆盖的架构，确保能够捕捉各种幻觉类型，并适应不同应用场景。

    一、评估维度体系（5大维度，15+子维度）

    - 事实性 (Factuality)

    - 忠实性 (Faithfulness)

    - 一致性 (Consistency)

    - 知识边界诚实性 (Honesty about Knowledge)

    - 安全与鲁棒性 (Safety & Robustness)

    二、方法体系（三层金字塔）

    第一层：快速自动化指标扫描（全量）

    - 使用 AlignScore、SummaC、实体F1、熵与概率等轻量级指标进行全样本粗筛，标记高风险片段。

    - 结合 SelfCheckGPT 思路，对开放域进行多次采样一致性评估。

    第二层：深度自动化核查（高风险样本）

    - 原子事实分解 + 检索增强NLI（类似FActScore）：

    - RAGAS 框架用于RAG场景的忠实度与上下文相关性自动评分。

    - 自相矛盾扫描：NLI滑动窗口 + 规则检测。

    - 强模型裁判：利用 GPT-4 + 精细提示 对中等样本量进行多维度打分，作为自动指标的补充和校准。

    第三层：专家人工精评（小规模金标）

    - 分层抽样约5%-10%的样本，覆盖边缘案例和所有高风险类别。

    - 设计标准化多维打分方案（参见第16题的人评方案）。

    - 由领域专家进行细粒度标注（高亮幻觉span、标记错误类型、修正建议）。

    - 人工结果用于：① 校准自动指标；② 训练更好的自动评估器；③ 最终决策高风险场景。

    三、测试集构成（动静结合）

    - 静态基准集：TruthfulQA, HaluEval, FaithDial, SummaC Benchmark 等，用于横向对比和基础能力测试。

    - 动态时敏集：FreshQA，定期更新，检验时效性幻觉。

    - 对抗与压力测试集：自行构建（知识冲突、逻辑陷阱、长文本远距离矛盾、错误前提等），评估鲁棒性。

    - 真实生产数据：从模型实际线上服务中采样，反映真实分布下的幻觉表现，避免基准过度拟合。

    四、持续评估与反馈闭环

    - 建立 CI/CD 流水线，在模型每次更新时自动运行全层级评估。

    - 将检测到的幻觉自动转化为训练数据（DPO对），反哺模型优化，形成“检测-修正-重训”闭环。

    - 可视化仪表盘：实时展示各维度幻觉率、高发错误类型、趋势变化，支撑模型治理。

    五、应用定制化

    - 针对不同领域（医疗、法律等），替换相应知识库和人工专家池，并调整维度权重（如医疗将安全性权重提到极高）。

    - 针对多语言，集成多语言检索、多语言NLI和当地文化专家。

    通过这样一套完整、分层、闭环的体系，可以实现对模型幻觉系统化、可操作、可信赖的管理。

    - 事实不一致（Factual Inconsistency）：生成内容中的事实与源文矛盾或无法从源文推出。

    - 上下文忽略（Context Ignorance）：模型无视给出的上下文，擅自添加细节。

    - 指令违背（Instruction Violation）：输出未遵循用户给出的指令，可能添加了多余内容。

    - 使用规则和轻量分类器去除严重语法错误。

    - 用NLI模型初步筛除与上下文完全无关的离题输出。

    - 最终提交给人工标注者进行质量审核和精细调整，确保幻觉看似合理（即难以用简单规则发现），以增加检测难度。

    - 单条实时信息测试（One-hop）：直接询问一个近期发生的事实，如“2023年世界田径锦标赛男子100米冠军是谁？”。这检测模型是否记住了最近的数据。

    - 多跳实时推理（Multi-hop）：将时效性问题与知识推理结合。例如，“对比2022年和2023年诺贝尔文学奖得主的国籍”，既要求知道两个时变事实，又要进行对比推理。这类幻觉更难检测，因为模型可能知道单个事实却错误关联。

    - 答案准确性：与标准答案（从可靠来源如维基百科、权威新闻收集，且定期校验）进行比对，可使用精确匹配或语义等价（借助BERTScore或NLI）。

    - 时效幻觉率：定义为回答中含有过时信息或编造的最新信息的比例。特别统计模型坚持给出已过时事实的频率。

    - 知识截止归因：当模型出错时，分析其错误答案是否恰好对应问题在某一历史时间点的真相，从而推断模型的知识截止点，这直接证明了幻觉源自过时知识。

    - FactCC（Factual Consistency Check）：专门为摘要任务设计的NLI指标。它训练一个BERT变体，输入源文-摘要句对，输出一致/不一致的二分类，并可以指出不一致片段。评价时通常使用准确率，但在量化时可以直接用模型预测为“一致”的句子比例作为忠实度分数。

    - SummaC：构建了多个NLI模型集成，给定源文-摘要，输出一个0-1的连续分数。分数越高代表越忠实。它能处理长源文，在多个摘要忠实度数据集上表现优于简单NLI。

    - AlignScore：一个无监督训练的评分模型，输出源文和生成文本之间的一致性得分（0~1）。分数代表整个文本对的一致程度，本质也是对多声明的整体蕴涵判断。

    - 使用问题生成（QG）模型，根据源文自动生成一系列覆盖不同信息点的问题。

    - 分别以源文和生成文本作为上下文，用问答（QA）模型回答这些问题，得到两组答案（源文答案，生成文本答案）。

    - 比较两组答案的语义等价性（通常用BERTScore、ROUGE-L或直接训练等价分类器）。如果对于某个问题，生成文本给出的答案与源文答案不一致，则说明生成文本在该信息点上不忠实于源文。

    - QAGS：最终的QAGS分数是各问题等价分数的平均值。若生成文本完全忠实，那么从它里面抽出的答案应与从源文中抽出的答案高度一致。QAGS能有效检测信息的遗漏和添加。

    - QuestEval：扩展了QAGS，同时计算精度（生成文本答案是否源文有支持） 和召回（源文答案是否生成文本有覆盖），并融入了NLI判断，使得分数更均衡。

    - 源文答案：使用问答模型，以源文为上下文，回答第一步生成的所有问题，得到一组基准答案。这些答案代表了源文中明确包含的信息。

    - 生成文本答案：同样使用问答模型，以待评估的生成文本为上下文，回答相同的问题。得到另一组答案。

    - 比较方式：可以使用基于文本相似度的方法，如 BERTScore、ROUGE-L，更鲁棒的方法是使用 NLI 模型判断两个答案是否等价。例如，计算“等价率”或“支撑度”。

    - 对每个问题-答案对计算得分（0或1，或连续相似度），然后对所有问题取平均，得到最终的忠实度分数。QAGS 和 QuestEval 是此类方法的典型代表。

    - QuestEval 进一步区分了精度（生成文本的答案在源文中是否有据可查）和召回（源文的关键信息是否都在生成文本的答案中得到体现），从而更全面。

    - 声明分解：利用 LLM 将生成的答案分解为一系列独立的原子声明。

    - 文档支撑验证：对于每个原子声明，使用 LLM（如 GPT-3.5/4）判断该声明是否能够从检索到的文档片段中推断（entail） 或直接找到。提示词要求 LLM 给出是/否的判断，并可以附上依据。

    - 忠实度得分：计算被判定为有文档支撑的声明数占总声明数的比例，作为忠实度分数。得分范围 0-1，1 表示完全忠实，没有幻觉。

    - 反向问题生成：使用 LLM 根据生成的答案，自动生成若干个问题，要求这些问题必须只能由该答案来回答，以捕捉答案的关键信息点。

    - 语义相似度计算：计算生成的问题与原始用户问题之间的语义相似度（如使用余弦相似度，基于 embedding 模型如 text-embedding-ada-002）。

    - 答案相关性得分：对每个生成问题与用户问题的相似度取平均，得到最终相关性得分。这实质上衡量了答案与用户意图的契合度。

    - 误拒率（False Refusal）：对于明明知道的知识，却错误地表示不知道的比例。

    - 误答率（False Answer）：对于不知道的问题，却强行给出错误答案（幻觉）的比例。

    - AUROC / AUPRC：将置信度分数作为预测值，事实正确性作为标签，评估校准度。

    - 期望校准误差（ECE）：衡量置信度与实际准确率的一致性。

    - 覆盖率与风险曲线：设定不同置信度阈值，拒绝低于阈值的回答，观察剩余回答的准确率和回答比例。曲线下面积（AUC）越高，表示模型越懂得根据置信度有选择地回答，知道何时该闭嘴。

    - 世界知识准确性（常识、实体、关系）

    - 数值与日期精确性

    - 时效性（动态基准，如 FreshQA）

    - 对源文/上下文的支撑度（无依据添加、遗漏、歪曲）

    - 对检索文档的忠实度（RAG场景）

    - 对用户指令的依从度

    - 局部一致性（相邻句子）

    - 全局一致性（全文/全对话）

    - 多轮对话状态一致性（记忆漂移检测）

    - 对不可回答问题的拒答恰当性

    - 不确定性的正确表达（校准度）

    - 自我矛盾与自我纠正能力

    - 对对抗性提示的抵御（拒答/纠正而不是产生有害幻觉）

    - 偏见性幻觉（刻板印象驱动的虚构）

    - 来源可靠性（引用真实性）

    - 用 LLM 将生成文本拆分为原子声明。

    - 对每条声明，动态检索外部知识库（维基百科、实时搜索引擎、领域数据库）。

    - 使用专用 NLI 模型（如 FactualNLI 微调版）判断证据是否蕴涵声明，计算幻觉密度和类型分布。

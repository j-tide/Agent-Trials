content:
  prompt: 偏见和幻觉有何联系与区别？
answer:
  mode: rubric
  reference_answer: |-
    定义与核心区别：

    - 偏见（Bias） 指模型输出中系统性地反映出的刻板印象、不公平关联、或针对特定群体的倾向性，通常源于训练数据的偏差。偏见可以是事实正确的陈述，但在社会意义上不公平或有害（如“护士通常是女性”虽具统计事实却强化性别刻板印象）。

    - 幻觉（Hallucination） 指模型生成与事实或上下文相矛盾的内容，它是关于真实性的偏差，而不是社会公平性的偏差。

    联系：

    - 偏见可以导致幻觉：当模型受到刻板印象影响时，可能会对某些个体或群体产生错误的推断，形成事实幻觉。例如，模型假设一个叫“小明”的人是男性，因而编造出“小明娶了妻子”的事实，但实际上小明是女性，这就构成了幻觉。这种幻觉是由性别偏见驱动的。

    - 幻觉可以强化偏见：模型编造关于特定群体的虚构负面事件或属性，这些虚假信息若被传播，会加深社会偏见，即使模型本身没有显式的偏见目标。

    - 同源问题：两者都源自训练数据的缺陷——数据中包含错误、不均衡和有害内容。缓解偏见和减少幻觉都需要数据治理、对齐训练和过滤技术。

    - 安全对齐中相互交织：在 RLHF 中，训练模型拒绝回答有害问题可以减少偏见驱动的回答，但过度拒绝可能诱发回避性幻觉（如胡说一个无害但无关的回答）。两者都需要平衡。

    区别：

    [嵌入表格未展开]

    交叉情景：

    - 当模型生成“某少数民族群体犯罪率更高”这一陈述时，如果该陈述没有事实依据，则既是偏见（种族刻板印象）又是幻觉（虚假陈述）。如果该陈述基于过时、有偏差的统计但现实中有相关数据，它可能不是严格的事实幻觉，但依然是偏见（可能选择性报道）。

    - 从技术角度，偏见检测更侧重于词级关联、情感分析和公平性指标；幻觉检测侧重于事实三要素（主语-谓词-宾语）的准确性验证。

    综合策略：负责任的大模型部署需要同时解决偏见和幻觉，即确保生成内容既公平又真实。


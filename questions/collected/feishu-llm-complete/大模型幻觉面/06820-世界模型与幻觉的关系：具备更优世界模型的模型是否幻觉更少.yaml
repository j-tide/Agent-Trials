content:
  prompt: 世界模型与幻觉的关系：具备更优世界模型的模型是否幻觉更少？
answer:
  mode: rubric
  reference_answer: |-
    是的，具备更优世界模型的模型，其幻觉理论上应显著更少，尤其是反事实、物理和常识性幻觉。 世界模型是模型对世界运行规则的内在表征，包括物理规律、因果关系、空间时间逻辑和社会规范等。

    关系与作用机制：

    （1）作为强大的真实性先验

    - 一个内建了正确物理规律（如“物体受重力会下落”、“水在100℃沸腾”）的模型，在生成描述时会自动排斥那些违背基本物理的陈述。即使语言统计上“猪会飞”是一个高概率短语，强大的世界模型也会赋予它极低的合理性，压制其生成。这就从根本上抑制了反事实幻觉。

    （2）填补文本知识的空白

    - 很多常识从未被明确书写（如“人不能穿过墙壁”），却构成了我们判断幻觉的基础。世界模型能够弥补文本训练数据的缺失，为模型提供一套“默会知识”校验层，对生成的逻辑进行现实合理性过滤。

    （3）支持更鲁棒的推理与规划

    - 在复杂任务中，世界模型使模型能够“想象”行动序列的后果，预测状态变化。这能帮助模型识别出那些会导致逻辑死胡同或荒谬结果的推理跳跃（推理幻觉），从而选择更合理、更一致的推理路径。

    （4）增强信息鉴别能力

    - 当上下文知识（检索或用户提供）与基本世界规则矛盾时，具备强世界模型的模型能够识别出上下文可能有问题，而不是盲从，更可能选择质疑或指出矛盾，这与固执性幻觉中盲从内部错误记忆是相反的正确行为。

    目前局限与未来方向：

    - 当前大模型从纯文本中学习的“世界模型”仍非常肤浅和破碎，充满统计关联而非因果理解。它们可以被高度格式化的虚假陈述欺骗。

    - 未来需要融合多模态数据（视频、交互环境）与结构化的因果推理训练，才能真正建立起坚实的世界模型。

    - 世界模型的完善将是通往可靠通用人工智能的必经之路，也是将幻觉率降至人类水平以下的关键突破口。一个拥有类人常识和物理直觉的模型，将天然地对荒谬内容具有“免疫力”。


content:
  prompt: "“FaithDial” 数据集设计目标是什么？如何帮助评估？"
answer:
  mode: rubric
  reference_answer: |-
    FaithDial 是一个专为对话生成设计的大规模、高质量的忠实性数据集，旨在解决对话模型中的幻觉问题，并提供评估基准。

    设计目标：

    - 消除对话中的幻觉：常规对话数据集（如 Wizard of Wikipedia）中充满大量与知识源不一致的回复（幻觉）。FaithDial 对这些数据进行了忠实化改造，确保每条回复都能严格从提供的知识文档中推导出来，不添加、不歪曲。

    - 定义并标注细粒度忠实性：不仅区分“忠实”与“不忠实”，还对不忠实的回复标注了具体的错误类型和位置，如“无依据添加”、“信息遗漏”、“过度泛化”、“逻辑错误”等。

    - 促进忠实对话生成研究：提供一个干净、可依赖的训练和评估资源，鼓励模型学习在给定知识的情况下生成完全忠实的回复，而不是编造。

    如何构建（实现忠实化）：

    - 原始数据基于 Wizard of Wikipedia，其中对话者可以访问维基百科知识。原始标注存在许多不忠实。

    - 研究者让众包标注者修正那些不忠实的回复，使其变成完全忠实于知识库的版本。修正过程包括了删除添加的内容、用知识片段中的正确信息替换、消除模糊表述等。

    - 每个原始的不忠实回复及其修正版本都被保留，形成正负例对，便于训练检测器和模型。

    - 同时保留对话历史和对应的知识快照，使得上下文完整。

    对评估的帮助：

    - 标准测试集：FaithDial 提供了高品质的忠实对话金标准，可直接用于评估对话模型的事实一致性。模型生成的回复可以与其标准修正版本进行语义一致性比较，或通过 NLI 判断是否被知识支撑。

    - 细粒度错误分类：由于包含详细的错误类型标注，评估时不仅可以给出整体的忠实度分数，还能诊断模型倾向于犯哪类幻觉（如过度添加细节、还是曲解原意），从而提供针对性改进方向。

    - 训练检测器：其细粒度标签可用于微调强大的幻觉检测模型，这些检测器稍后又可用来评估其他模型的输出。

    - Few-shot 评估的范例：数据集中的样本可作为提示词示例，指导大模型裁判对新的对话回复进行忠实度打分，提升评分的准确性和一致性。

    意义：FaithDial 通过构建一个“无幻觉”的高质量对话数据生态，将对话生成的评估从模糊的“流畅度、相关性”提升到精准的“证据支撑度”层面，推动了安全可信对话系统的发展。


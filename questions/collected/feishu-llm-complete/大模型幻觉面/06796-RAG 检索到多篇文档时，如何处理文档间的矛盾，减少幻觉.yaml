content:
  prompt: RAG 检索到多篇文档时，如何处理文档间的矛盾，减少幻觉？
answer:
  mode: rubric
  reference_answer: |-
    当RAG检索到内容矛盾的多篇文档时，模型需要具备鉴别、冲突处理和选择性整合的能力，否则极易产生混合性幻觉或选择错误方。处理方法分为数据训练、推理策略和后处理三个层面。

    （一）训练阶段的冲突处理能力注入

    - 构造矛盾训练数据：在微调时，刻意提供多篇文档，其中包含相互矛盾的事实。标注的正确输出行为包括：

    - 通过这种方式，模型学会将“矛盾”作为一种状态输出，而不是强行融为一个看似连贯但错误的答案。

    （二）推理时的策略性处理

    - 基于来源权威性的动态加权：使用检索系统不仅返回文档，还返回来源的权威性分数（如维基百科>随机论坛）。在生成时，通过提示工程或注意力偏置，引导模型优先采信高权威源的信息。

    - 两阶段生成：先梳理，后回答：首先生成一个不直接面向用户的“内部梳理”，例如“文档1说了A，文档2说了B，它们关于X有冲突。”然后基于这个梳理，生成面对用户的谨慎回答。这种思维链式的分解能显著提升处理冲突的准确率。

    - 多数投票机制：对于有多篇独立文档的场景，若多数文档支持某一事实，通过提示让模型注意到“大多数资料认为…”，从而选择共识信息。

    （三）后处理与校验

    - 事实验证管道的再次应用：将模型生成的回答再次拆解为声明，并重新与所有检索文档进行NLI验证。如果某个声明与部分文档矛盾（且该部分文档更权威），则自动标记并要求模型修正。

    - 冲突敏感的解码策略：在解码时，若模型当前生成的token对应某个文档声称的事实，但与其他文档显著矛盾，可通过约束解码降低该token概率，促使模型转向更调和或更保守的表述。

    核心目标：不是让模型成为“完美的裁判”，而是让其拥有识别冲突并坦诚沟通的能力，承认不确定性，而非自以为是地盲目综合。


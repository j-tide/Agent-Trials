content:
  prompt: 目前主流排行榜（如 Chatbot Arena）是否充分反映幻觉水平？
answer:
  mode: rubric
  reference_answer: |-
    不完全充分。 主流排行榜如 LMSYS Chatbot Arena（基于 Elo 分数的人类偏好投票）主要衡量人类对模型回答的整体偏好，而非专门针对幻觉的系统性评估。其反映幻觉水平存在局限。

    为何不充分：

    - 偏好不等于真实性：用户投票时往往被流畅度、文采、共情、长度、格式等表面质量所左右，容易忽略其中隐秘的事实错误。一个流畅但有幻觉的回答可能比一个生硬但正确的回答获得更高票数。

    - 缺乏系统的幻觉覆盖率：Arena 的问题来自开放式用户随机输入，虽然覆盖广，但并不能保证对事实密集型、高风险领域（医疗、法律）、时效性问题、知识边界问题进行专门的压力测试。模型可能会在常规对话中表现良好，但在特定幻觉触发场景下失败，这种弱项难以在随机的Arena中充分暴露。

    - 无细粒度幻觉标注：投票仅给出A vs B 或评分，并不要求用户识别和标记回答中的幻觉片段。因此无法量化幻觉率，不知道模型的具体错误类型和频率。

    - 时效性问题：排行榜分数是一段时间内的静态排名，而幻觉可能与模型版本、知识截止日期密切相关，动态排行榜无法实时反映模型的时效性幻觉风险。

    - 评估者的能力差异：用户来自不同背景，大多缺乏专业事实核查能力，无法准确判断回答的真实性，特别是需要专业知识时。这导致幻觉可能被大量非专业投票所掩盖。

    排行榜的补充价值：

    - 可以从宏观上反映模型的安全/无害对齐情况，如果某个模型经常产生明显有害的幻觉，可能会在用户满意度中体现出极低分数。

    - 结合社区反馈和具体案例，排行榜可以间接揭示某些模型存在严重的幻觉倾向。

    改进方向：需要专门的幻觉排行榜（如 TruthfulQA 榜单、HaluEval 榜单、FActScore 榜单）来补充，这些榜单专注于事实性和忠实性。理想的全面评估应结合人类整体偏好（Arena）与专项可信度评估（幻觉基准），才能对模型能力有完整认知。


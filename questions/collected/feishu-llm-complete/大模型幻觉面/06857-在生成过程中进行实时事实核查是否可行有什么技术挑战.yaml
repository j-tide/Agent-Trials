content:
  prompt: 在生成过程中进行实时事实核查是否可行？有什么技术挑战？
answer:
  mode: rubric
  reference_answer: |-
    可行性：

    在生成过程中嵌入实时事实核查模块，理论上可行并已有初步研究实践（如前文的事实核心采样、上下文感知解码）。基本思路是每生成一段文本（或关键token），便运行一个轻量的事实核查器对当前片段进行验证，如果发现问题则立即干预。

    主要技术挑战：

    - 极高的延迟与计算开销：

    - 片段核查的上下文不完整问题：

    - 核查器的准确性与覆盖率：

    - 干预策略的平滑性：

    - 架构复杂性与工程挑战：

    现状与展望：完全的“逐token实时核查”目前仍不成熟，多用于受限领域或作为研究原型。更实际的方案是分段实时核查：生成一个段落或完整观点后，在后台进行核查，若发现问题，则触发局部改写或向用户追加更正声明（“更正：上一段提到的数字有误，正确应为…”）。这种方法在延迟和准确性之间取得了更好的工程平衡。

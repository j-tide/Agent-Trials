content:
  prompt: 联合使用对比损失和生成损失时的平衡与比例设定
answer:
  mode: rubric
  reference_answer: |-
    联合训练对比损失和生成损失是许多多模态模型的选择（如 ALBEF、BLIP、CoCa），两者互补：对比损失提供全局判别信号，生成损失提供细粒度语义。平衡两种损失的方法包括：

    [图片内容未导入]

    - GradNorm：根据各任务梯度的相对大小动态调整权重，使各任务学习速度均衡。

    - DWA (Dynamic Weight Average)：根据损失下降速率调整权重，鼓励模型关注下降慢的任务。

    - 分阶段策略：在预训练早期，先以对比损失为主，建立粗粒度跨模态对齐；后期逐渐增加生成损失权重，精细化学习。或者先训练对比，再联合训练生成。

    - 任务平衡采样：不同任务（如对比、生成）的数据比例也可以控制，尤其在多任务联合训练中，通过调整采样频率间接调节损失贡献。

    实践中，固定权重配合一定程度的调参仍是主流，因为简单且稳定。


content:
  prompt: 如何为多模态模型设计“数据配比”？比如粗粒度描述、细粒度问答、复杂推理数据的比例。
answer:
  mode: rubric
  reference_answer: |-
    数据配比是多模态训练中的“秘方”，直接影响模型最终能力的光谱分布。没有万能的黄金比例，但存在清晰的设计原则和经验框架。

    设计原则：

    - 覆盖能力光谱：从简单到复杂，各项能力都需要一定比例的样本才能激活和保持。

    - 模拟下游场景：最终应用是聊天机器人、专业分析还是图像检索？数据配比应与目标场景的难度和任务分布匹配。

    - 先广后深：在预训练阶段，保证概念的广度；在指令微调阶段，加强推理的深度。

    - 防止遗忘：即使追求复杂推理，也要保留少量简单描述数据，防止模型在基础对齐能力上退化。

    经验框架（以指令微调阶段为例）：

    [嵌入表格未展开]

    动态配比策略：

    - 在训练初期，可适当提高描述和简单问答比例，让模型快速进入“能看懂”的状态。随着训练推进，逐步增加推理和复杂对话的比例。

    - 监控不同能力子集的验证指标，若某项能力持续偏低，则临时提高对应类型数据的采样权重。

    最终，数据配比是一个迭代调整的过程，需要根据模型表现和业务需求持续优化。


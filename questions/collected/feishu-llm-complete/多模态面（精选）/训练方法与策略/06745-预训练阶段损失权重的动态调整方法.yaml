content:
  prompt: 预训练阶段损失权重的动态调整方法
answer:
  mode: rubric
  reference_answer: |-
    损失权重调整方法旨在让不同任务或损失项在训练过程中保持适当的量级和学习速度。

    Uncertainty Weighting（Kendall et al.）：
    将每个损失视为回归到固定常数的任务，通过最大化同方差不确定性的高斯似然推导出损失形式：L=12σ2Ltask+log⁡σL=2σ21Ltask+logσ。学习率作用于 σσ，网络自动平衡各损失的相对权重，防止某一项噪声大而过拟合。

    GradNorm：
    根据各任务梯度的大小动态调整权重，目标使所有任务的学习速度（梯度范数）相对均衡。通过计算每个任务的梯度 GiGi 和平均梯度，调整权重使得加权梯度的变异系数最小。

    [图片内容未导入]

    手动阶梯调度：

    在固定训练步数时改变权重，如前期注重对比学习建立全局对齐，后期增加生成损失权重以学习细节。这种方法最简单，但需要经验。

    在多模态预训练中，Uncertainty Weighting 和 GradNorm 都已被成功应用，使训练过程更鲁棒，无需大量手动调参。


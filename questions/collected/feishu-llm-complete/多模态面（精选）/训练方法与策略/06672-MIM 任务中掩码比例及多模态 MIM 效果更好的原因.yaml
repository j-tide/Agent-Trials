content:
  prompt: MIM 任务中掩码比例及多模态 MIM 效果更好的原因
answer:
  mode: rubric
  reference_answer: |-
    掩码比例：

    - 在单模态图像 MIM（如 MAE）中，通常使用非常高的掩码比例，75% 甚至 90%，因为图像信息冗余度高，大量遮盖可以迫使模型学习有意义的全局特征，而非简单插值。低掩码比例任务太简单，学不到鲁棒表征。

    - 在多模态 MIM 中，掩码比例通常稍低，比如 40%-60%。因为此时模型还可利用文本作为条件，若掩码过高，仅凭文本可能不足以恢复细节，导致任务过难，训练不稳定。通常取 50% 左右平衡。

    多模态 MIM 效果更好的原因：

    - 文本提供语义引导：纯视觉 MIM 只能利用剩余可见像素推断遮盖部分，缺乏高层语义理解。有了文本条件，模型可以将遮盖区域与文本中的物体、属性相关联，学到更结构化的视觉特征。

    - 跨模态对齐强化：MIM 迫使模型将文本描述的细粒度概念（如“黑色的耳朵”）映射到对应的视觉区域，加强了单词-区域对齐，这是单模态 MIM 无法做到的。

    - 信息互补：图像信息缺失时，文本可以补偿；文本信息不足时，图像提供细节。双向补充使得学习信号更丰富。

    因此，多模态 MIM 能学习到更好的视觉-语言联合表征。


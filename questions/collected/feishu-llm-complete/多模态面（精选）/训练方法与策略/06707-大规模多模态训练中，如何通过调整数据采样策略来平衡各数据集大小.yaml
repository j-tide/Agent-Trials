content:
  prompt: 大规模多模态训练中，如何通过调整数据采样策略来平衡各数据集大小？
answer:
  mode: rubric
  reference_answer: |-
    多模态训练常混合多个来源的数据集（如Conceptual Captions、LAION、COCO、VQA），数据量差异悬殊。不平衡会导致模型严重偏向大数据集，甚至在小数据集上过拟合或遗忘。采样策略是平衡之道。

    常用策略：

    [图片内容未导入]

    - 固定比例采样：无视数据集实际大小，强制按预定义的比例从各数据集采样。例如，描述数据占40%，VQA占30%，检索占30%。无论各自样本量多少，每个batch都按此比例组成。这会过采样小数据集，可能在小数据集上过拟合。

    - 基于“epoch平衡”的采样：确保每个数据集在一个训练epoch内被完整遍历，但调整各自的权重使得所有数据集大致同时完成一个epoch。这等价于按数据集大小的倒数进行采样权重分配，极度过采样小数据集。

    - 动态采样：在训练过程中，监测各任务/数据集的性能指标（如验证损失、准确率）。给性能差、收敛慢的数据集分配更高的采样权重，性能已饱和的降低权重。这类似于自适应课程学习。

    - 分层采样与复合batch：在每个batch内，通过重采样确保每个batch中都包含所有数据集（或任务）的样本，避免整个batch都是某个大数据集的。对于极小的数据集，可能一个epoch内被重复多次。

    实践建议：

    - 预训练阶段通常使用温度采样（T=2~5），在数据多样性和数据量之间平衡。

    - 指令微调阶段使用固定比例采样，因为各任务的重要性由业务目标决定，而非样本量。

    - 结合数据质量评分，在采样时给高质量样本（如CLIP Score高、人工打分高）额外加权。

    - 记录每个数据集的样本消耗速率，可视化监控，确保没有数据集被完全淹没。


content:
  prompt: 设计课程学习策略：从简单图文对到复杂多模态推理
answer:
  mode: rubric
  reference_answer: |-
    策略设计：

    - 第一阶段：粗粒度图文对齐

    - 第二阶段：细粒度感知与描述

    - 第三阶段：简单推理与问答

    - 第四阶段：复杂推理与指令遵循

    动态课程：在每个阶段内，可进一步根据样本的模型困惑度或验证准确率动态调整采样权重，让模型始终在“最近发展区”学习。这种逐级递进的课程策略能最大化训练效率和最终性能。

    - 任务类型：描述、问答、推理、创作、OCR、定位等。

    - 指令风格：简短指令、详细要求、多轮对话、条件约束。

    - 输出格式：自由文本、JSON、Markdown、代码块等。

    - 难度梯度：简单识别到复杂推理。

    - 为图像生成与内容无关的荒谬问题（如对风景图问“这辆车是什么型号？”），标准答案设为“抱歉，图像中没有汽车”或“我无法回答这个问题”。

    - 问图像中不存在的信息（如“图中人物的电话号码是多少？”），答案设为“图像不提供此类信息”。

    - 对低分辨率或严重遮挡的图像提问，标准答案设为“图像不够清晰，无法确定”。

    - 给一个事实性错误的陈述让模型判断，如“这张图显示的是埃菲尔铁塔（实际是东京塔），对吗？”，答案应为否定并纠正。

    - 简单样本：单物体图像 + 简短名词短语（“一只白猫”），物体居中、背景简单。

    - 中等样本：多物体图像 + 包含属性和空间关系的描述（“左边的红车旁边站着一个穿蓝衣服的人”）。

    - 困难样本：复杂场景 + 需要推理、比较、计数的长文本（“图中所有戴帽子的人共有几个？他们分别在做什么？”）。

    - 难度可以通过 CLIP 相似度、文本长度、物体数量、问题类型等自动估计。

    - 早期：主要使用简单样本，训练基础跨模态对齐和描述生成。

    - 中期：逐步增加中等样本比例，引入空间关系、属性绑定等任务。

    - 后期：大量使用困难样本，加入推理、QA、多图对比等复杂任务。

    - 根据模型的验证性能自动推进课程。例如，当简单样本的检索 Recall 超过阈值，自动增加中等样本的采样权重。

    - 可使用 SPL (Self-Paced Learning) 策略，让模型自动选择当前最适合学习的样本。

    - 不同任务也可以有课程顺序：先训练对比学习（全局对齐），再训练匹配任务（细粒度对齐），最后训练生成任务（复杂推理）。

    - OCR 能力：某些模型在预训练到某个阶段后，突然能够阅读图像中的文字，即使训练数据中并未显式强调 OCR 任务。

    - 空间推理：模型可能在某个临界点后，突然能够正确理解“左边”、“上面”等空间关系。

    - 图文对比学习（ITC）：对齐查询向量输出的全局表示与文本的 CLS token。

    - 图文匹配（ITM）：判断图文是否匹配，学习细粒度对齐。

    - 语言建模（LM）：给定图像，用 Q-Former 自带的文本解码器生成字幕。

    - 数据：简单图文对（单物体、短描述）。

    - 任务：图文对比学习（ITC）和基础字幕生成。

    - 目标：建立视觉 token 与语言的基本映射。

    - 难度控制：选择 CLIP 相似度高的图文对，确保语义简单明确。

    - 数据：包含多物体、属性、空间关系的中等图文对。

    - 任务：掩码语言建模（MLM）、掩码图像建模（MIM）、细粒度字幕生成。

    - 目标：学习属性绑定、空间关系、物体间交互。

    - 难度控制：增加物体数量和关系复杂度，引入位置词。

    - 数据：单轮问答数据（如 VQA v2 中的简单问题）。

    - 任务：视觉问答。

    - 目标：根据图像内容回答直接问题。

    - 难度控制：选择答案简短、无需多步推理的问题。

    - 数据：多轮对话、复杂推理、文本识别、多图对比等。

    - 任务：多样化指令微调。

    - 目标：泛化到各种指令格式，学会逻辑推理和拒绝回答。

    - 难度控制：逐步增加指令长度、推理步数和任务多样性。

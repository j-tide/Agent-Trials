content:
  prompt: 对比学习如何区分“相同语义不同表达”和“不同语义相似表达”
answer:
  mode: rubric
  reference_answer: |-
    这是对比学习正负样本定义的难题。理想情况下，我们希望正样本是所有语义相同的图文对（哪怕表达不同），负样本是语义不同的图文对（哪怕表面相似）。实现这一目标的方法包括：

    - 数据增强：通过图像和文本的数据增强（同义替换、回译、裁剪、颜色扰动等）生成同语义的不同表达，作为正样本。对比损失让增强后的版本拉近，隐式地学习对表达变化的鲁棒性。

    - 软对比损失 / 多正样本对比：使用 SupCon 等损失，允许一个 query 有多个正样本（如不同增强视图、或通过检索得到的高置信度同语义样本），将它们全部拉近。对于表面相似但语义不同的样本，由于它们不是正样本，仍会被推远。

    - 难负样本挖掘的修正：表面相似但语义不同的样本很可能被误判为假阴性（被模型错误地当作正样本）。通过修正损失，降低对高相似度但无标签的样本的惩罚力度，或者用半监督方法给它们分配软标签。

    - 模态内对比：不仅跨模态对比，还在同一模态内做对比，拉近同语义的不同表达（文本到文本，图像到图像），使表示空间更结构化。

    - 语义级负样本生成：通过替换关键词或属性词，将正样本改写成语义不同的“负样本”，并用对比损失推远，直接教模型区分细微语义差异。

    核心是提供细粒度的语义监督信号，让模型关注语义内容而非表层统计特征。


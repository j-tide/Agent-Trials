content:
  prompt: 三个阶段中哪个最消耗计算资源？如何针对各阶段进行资源倾斜？
answer:
  mode: rubric
  reference_answer: |-
    第二阶段——多模态预训练通常最消耗计算资源。

    原因分析：

    - 数据规模最大：多模态预训练通常使用数百万到数十亿的图文对数据（如 LAION-400M、COYO-700M 等），数据量远大于第一阶段的对齐数据（通常几十万到几百万）和第三阶段的指令数据（通常几万到几十万）。

    - 训练步数最多：预训练阶段通常需要数十万甚至数百万步的迭代，才能充分学习跨模态的语义对齐和知识。

    - 参数更新量最大：虽然第一阶段和第三阶段也可能更新大量参数，但预训练阶段往往需要更新视觉编码器、连接器和 LLM 的大部分或全部参数，且 batch size 通常极大（数千甚至上万）。


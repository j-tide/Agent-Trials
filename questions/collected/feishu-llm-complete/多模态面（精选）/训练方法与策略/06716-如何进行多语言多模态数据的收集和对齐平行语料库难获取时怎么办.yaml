content:
  prompt: 如何进行多语言多模态数据的收集和对齐？平行语料库难获取时怎么办？
answer:
  mode: rubric
  reference_answer: |-
    多语言多模态数据的主要难点是：大规模图像通常配的是英文描述，其他语种的平行图文对稀少。

    策略一：翻译增强

    - 将英文图文对中的文本用机器翻译模型（如 Google Translate API、NLLB）翻译成目标语言。成本较低，可迅速扩大规模。

    - 缺点：翻译可能丢失文化特定概念、俚语或文本中的双关语；OCR 文字在翻译后会与图像中的原文不一致，可能产生冲突。

    - 改进：对于含有 OCR 文字的图像，不要翻译文本部分，而是将翻译文本作为额外条件加入，或者使用更智能的翻译策略保留原文+译文。

    策略二：原生多语言数据挖掘

    - 爬取目标语言国家的网站、论坛、电商平台，这些平台天然有对应语言的图文内容。例如，中文使用百度图片、小红书；日语使用 Yahoo! JAPAN；韩语使用 Naver。

    - 利用 Common Crawl 的多语言网页，提取带有 alt 文本的图像，语言检测后归类。

    - 优点：数据更地道，包含文化特定概念。缺点：规模受限，清洗成本高。

    策略三：跨模态跨语言对齐（不依赖平行语料）

    - 当完全无法获取平行语料时，可利用多语言 CLIP（如 BGE-M3、multilingual-e5）等跨语言嵌入模型。这些模型通过对比学习，已在训练时对齐了不同语言的语义。即使没有直接的中文-图像对，中文查询也能通过共享嵌入空间检索到英文图像。使用这些模型可以构建弱对齐的伪平行数据。

    策略四：合成数据

    - 用多模态大模型（如 GPT-4V）直接为英文图像生成目标语言的描述和对话。由于 GPT-4V 本身支持多语言，能直接产出较高质量的非英语数据。

    实践组合拳：通常以翻译增强为主力快速扩充规模，辅以一定比例的原生数据和合成数据提升地道性，在条件允许时逐步提高原生数据占比。


content:
  prompt: 多模态预训练中常见的掩码策略及其对表征学习的帮助
answer:
  mode: rubric
  reference_answer: |-
    掩码策略指随机遮盖输入的部分信息，让模型通过上下文进行预测，从而学习鲁棒表征。多模态预训练中常见掩码：

    - 掩码语言建模：随机遮盖文本 token（如 15%），模型基于视觉特征和未遮盖文本预测被遮盖词。这迫使模型利用图像信息来理解语言，实现细粒度跨模态对齐。代表：UNITER、ViLBERT。

    - 掩码图像建模：随机遮盖图像 patch（或区域特征），用其他可见的 patch 和文本描述来重建被遮盖的视觉特征。这促使模型学习纹理、形状等视觉概念与语言的对应关系。如 MAE、SimMIM 在单模态中被验证有效，扩展到多模态时能增强视觉表征。

    - 联合掩码：同时随机遮盖文本和图像区域，模型需要跨模态推断补全。如 VL-BEIT 使用联合掩码语言-图像建模，学习更强的交互表征。

    - 块级/目标级掩码：对于图像，不随机遮挡单个 patch，而是遮挡整个物体区域（基于检测框或分割），迫使模型理解完整的物体语义。

    - 时间掩码：在视频-语言模型中，随机遮挡若干帧，通过周围帧和文本恢复。有助于学习运动和时间一致性。

    这些掩码策略通过“破坏-重建”的代理任务，强迫模型学习模态内部和跨模态的深层语义关联，能有效防止过拟合、增强泛化能力。


content:
  prompt: 训练过程中出现“模态坍缩”现象通常有哪些表现？如何检测和缓解？
answer:
  mode: rubric
  reference_answer: |-
    模态坍缩指多模态模型在训练中过度依赖某一个模态（通常是文本），而忽略另一个模态（通常是图像），导致跨模态理解能力名存实亡。

    典型表现：

    - 性能不对等：在需要视觉信息的任务（如VQA）上，随机将图像替换为噪声或无关图像，模型性能下降极小，说明它主要靠文本猜答案。

    - 注意力分布异常：在跨模态注意力中，视觉token的注意力权重极低，或仅集中在少数几个无意义的patch上，文本token的注意力几乎全在文本自身。

    - 梯度消失：回传至视觉编码器的梯度范数远小于语言编码器，视觉部分几乎“学不到”东西。

    - 生成内容与图像脱节：描述生成中出现大量与图像无关的常见短语，甚至凭空编造物体（幻觉）。

    - 跨模态检索性能崩塌：文本到图像检索的Recall急剧下降，而图像到文本检索可能还好，说明文本嵌入空间坍缩。

    检测方法：

    - 消融测试：分别去除图像输入、文本输入，观察任务性能变化。健康的模型去掉图像后性能应大幅下降。

    - 梯度分析：监控不同模态的梯度均值和方差，若视觉侧梯度极小，则存在坍缩风险。

    - 注意力可视化：检查跨模态注意力权重矩阵，查看视觉token是否被充分关注。

    - 互信息估计：计算图像表示和文本表示之间的互信息，若持续下降，说明正在坍缩。

    - 诊断数据集：使用专门的反事实数据集（如VQA-CP），测试模型是否依赖文本捷径。

    缓解策略：

    - 模态Dropout：随机丢弃一个模态的输入（如以一定概率替换为零向量），强制模型不能过度依赖任一模态。

    - 梯度平衡：使用Gradient Blending或OGM（On-the-fly Gradient Modulation），动态调整各模态梯度，防止一方的梯度主导。

    - 对比损失强化：增加跨模态对比损失权重，迫使图像和文本嵌入保持对齐。

    - 多任务学习：加入需要细粒度视觉理解的任务（如检测、分割），增加视觉监督信号。

    - 适当的学习率分离：给收敛慢的模态（通常是视觉）稍大的学习率。

    - 数据层面：使用更强的数据增强，特别是对文本（如同义词替换、随机删除）以降低文本捷径。


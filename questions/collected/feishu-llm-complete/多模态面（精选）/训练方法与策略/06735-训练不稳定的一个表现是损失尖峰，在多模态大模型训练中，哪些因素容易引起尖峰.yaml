content:
  prompt: 训练不稳定的一个表现是损失尖峰，在多模态大模型训练中，哪些因素容易引起尖峰？
answer:
  mode: rubric
  reference_answer: |-
    损失尖峰（Loss Spike）表现为训练过程中损失值突然飙升（可达正常的数倍至数十倍），然后可能缓慢恢复或直接导致NaN。多模态大模型训练中，尖峰的主要诱因包括：

    - 跨模态梯度冲突与爆发：视觉编码器和LLM的优化动态不一致。某一batch中，视觉特征和文本特征的对齐度骤降（例如因为某张极难或错配的图像），导致对比损失产生异常大的梯度，这个梯度经跨模态注意力放大后，在LLM中引发连锁反应，造成激活值爆炸。

    - 低质量数据或错误标注：噪声数据是尖峰的定时炸弹。一张极度模糊、全黑或全白的图像，或一段充满乱码、与图像完全无关的文本，可能导致模型面对极端的负样本，对比损失或匹配损失的梯度远超正常范围。长尾概念或罕见组合也容易成为尖峰点。

    - 视觉token数量与分布突变：若使用动态高分辨率技术，不同图像产生的视觉token数量差异巨大。某个batch中突然出现极多视觉token（如特大图切分成数十块），会显著改变输入序列长度和分布，导致LLM的自注意力计算出现数值波动。

    - 文本编码器/LLM对特定输入的极端反应：LLM对于某些极长单词、重复短语、特殊Unicode字符可能产生极高的困惑度，导致生成损失的梯度爆发。

    - 混合精度与数值稳定性：FP16训练时，注意力中的softmax计算或大矩阵乘法极易溢出。跨模态交叉注意力的Q、K乘积值可能极大，softmax后产生接近0或1的极端值，导致log运算时NaN。BF16缓解了动态范围，但精度折损仍可能在某些层累积。

    - 优化器状态与参数初始化：Adam优化器在急剧变化的梯度下，二阶矩估计可能失控。投影层或新添加的模态连接层参数初始化不当，也容易在早期训练引发尖峰。

    缓解措施：使用BF16、梯度裁剪（gradient clipping）、动态loss scaling（FP16时）、精心设计数据清洗、引入训练期的质量校验（丢弃极端梯度样本）、对视觉token数量设置上限等。


content:
  prompt: 第二阶段解冻哪些部分？如何防止灾难性遗忘？
answer:
  mode: rubric
  reference_answer: |-
    通常解冻的部分：

    - 连接器/投影层：继续训练，因为它需要适应更多样化的数据。

    - LLM：通常全参数解冻或使用参数高效微调（如 LoRA）。解冻 LLM 能使其深度整合视觉信息，实现多模态推理。

    - 视觉编码器：视情况而定。大多数工作（如 LLaVA-1.5）选择冻结视觉编码器，因其已提供足够好的视觉特征，解冻收益有限且容易导致遗忘。少数工作（如 Qwen-VL）会缓慢解冻视觉编码器的高层，以学习更任务相关的视觉表示。

    防止灾难性遗忘的方法：

    - 混合纯文本数据：在预训练 batch 中混入一定比例（如 10%-20%）的纯文本数据，使用标准的语言建模损失训练 LLM 部分。这强制模型保持其语言理解和生成能力。

    - 小学习率与渐进解冻：LLM 使用远小于预训练时的学习率（如 2e-5），视觉编码器若解冻则使用更小学习率（如 1e-6）。有时先训练连接器和 LLM 几轮，再缓慢解冻视觉编码器高层。

    - 参数高效微调：使用 LoRA、Adapter 等方法仅更新少量参数，冻结 LLM 的主体权重，将遗忘风险降至最低。

    - 重放旧知识：在训练中定期回放 LLM 原始预训练数据或评测任务，监控语言能力指标，一旦退化即调整策略。

    - 知识蒸馏：用原始 LLM 作为教师，约束微调后的 LLM 在纯文本任务上的输出分布。

    这些策略组合使用，可以在多模态对齐的同时保持 LLM 的核心能力。


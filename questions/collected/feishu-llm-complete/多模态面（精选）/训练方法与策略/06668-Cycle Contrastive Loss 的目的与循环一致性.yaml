content:
  prompt: Cycle Contrastive Loss 的目的与循环一致性
answer:
  mode: rubric
  reference_answer: |-
    Cycle Contrastive Loss 常用于图像-文本跨模态匹配，如 CAMP、ViLCo 等。其目标是增强跨模态对齐的一致性，避免单向对齐中的信息丢失或模态崩塌。

    目的：

    - 不仅要求图像与文本在正向匹配（图像找文本）时对齐，还要求从文本返回图像时也能找回原始图像。双向匹配形成一个闭环，如果两个模态的嵌入空间完美对齐，循环回来的结果应该是一致的。

    - 可以惩罚那些单向匹配正确但反向匹配错误的样本，迫使模型学习更精确的双向对齐。

    实现形式：

    给定一个 batch，通常有两条循环路径：

    - Image→Text→Image：图像 IiIi 匹配到最佳文本 TiTi，然后用 TiTi 去检索最佳图像，循环一致性要求检索到的图像是 IiIi 自身（或其同语义样本）。

    - Text→Image→Text：类似。

    损失函数可以设计为：在两种循环路径上分别计算对比损失，使循环回归的相似度最大化。例如，在图像→文本→图像路径中，对 IiIi，它与所有文本的相似度分布为 p(T∣Ii)p(T∣Ii)，再计算该分布下对图像的期望分布，然后用 KL 散度约束它接近 one-hot 自身。

    循环一致性的保证：

    通过额外的一致性正则项，模型不仅要在单向对比中判别，还要保证两个模态的映射互为逆映射，促进了嵌入空间的循环一致性，提升了检索和定位的精度。


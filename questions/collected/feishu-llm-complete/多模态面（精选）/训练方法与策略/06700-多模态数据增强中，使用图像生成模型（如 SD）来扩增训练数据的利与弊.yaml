content:
  prompt: 多模态数据增强中，使用图像生成模型（如 SD）来扩增训练数据的利与弊。
answer:
  mode: rubric
  reference_answer: |-
    利（优势）：

    - 突破数据规模瓶颈：可在极短时间内生成海量“图文对”，尤其在稀缺场景（如罕见动物、特定医学影像）和长尾概念上，弥补真实数据的不足。

    - 高度可控性：可通过文本提示精确控制生成的图像内容、风格、构图、颜色等，为特定训练需求（如数量控制、空间关系理解）定制数据。

    - 隐私友好：生成的人脸、场景是虚构的，不会泄露真实个人信息，有助于构建合规数据集。

    - 提升鲁棒性：生成图像在纹理、光照、细节上与真实图有差异，用其训练相当于增加了数据多样性，可能增强模型对域外样本的泛化能力。

    - 可自动化标注：生成图像的同时，提示文本就天然成为高质量的匹配文本，无需人工标注。

    弊（劣势）：

    - 分布偏移与“模型漂移”：生成图像具有生成模型的固有痕迹（模糊、不自然的光影、畸形细节等），模型若大量学习这些痕迹，会在真实图像上性能下降。

    - 放大偏见：生成模型本身从数据中学到了社会偏见和刻板印象（如“医生”常生成白人男性），不加控制地使用会加剧模型偏见。

    - 缺乏真实世界复杂性和长尾细节：生成图像难以复制真实世界的光照、物理、遮挡、文字等复杂多样性和长尾噪声，模型可能学不到真正的视觉常识。

    - 语义偏差：提示文本和生成图像可能存在微妙的语义错位（如“左边的猫”生成时猫却偏右），这种错误标注会误导训练。

    - 版权与伦理风险：如果训练生成模型的源数据有版权问题，其生成的图像也可能存在衍生版权风险。

    最佳实践：生成数据应作为真实数据的补充而非替代，建议比例不超过 10%-30%。使用时需配合严格的质量检查（如生成图的美学评分和 CLIP Score 复检），并尽量用多个不同生成模型或随机种子进行生成以增加多样性。


content:
  prompt: 多模态 LoRA 微调通常应加在模型的哪些部分？加在视觉侧、语言侧还是投影层？为什么？
answer:
  mode: rubric
  reference_answer: |-
    在多模态模型中，语言侧（LLM）是 LoRA 应用的核心收益区，其次是投影层，而视觉侧通常不是优先选择。

    LoRA 的原理：在预训练权重矩阵旁引入低秩分解矩阵，只训练这些低秩矩阵，冻结原始权重。

    优先级排序及原因：

    - LLM 语言侧（最重要）：LLM 拥有最多的参数，是多模态推理和生成的核心。LoRA 加在 LLM 的自注意力层的 Query、Key、Value、Output 投影矩阵，能够用极少的参数驱动 LLM 适应多模态输入和指令格式。这样做既能保留 LLM 强大的语言先验，又能教会它如何理解视觉 token 并遵循指令。

    - 跨模态投影层（次重要）：投影层是将视觉特征映射到 LLM 空间的桥梁。这个层本就是随机初始化或轻量训练的，进一步用 LoRA 微调可提升对齐质量，尤其当投影层本身较简单时（如单层线性层），LoRA 可注入额外的非线性适配能力。

    - 视觉编码器（通常不加）：原因有三：

    - 视觉编码器（如 CLIP ViT）已在大规模图文对齐数据上充分训练，输出特征高度语义化，泛化性强。

    - 视觉 token 的空间结构和局部细节对许多任务至关重要，低秩约束可能限制这种细粒度信息的保留。

    - 若解冻视觉编码器，容易破坏其预训练的视觉表示，导致灾难性遗忘，尤其在数据量有限时。
    例外：当领域差异极大（如医学影像）且拥有充足数据时，可在视觉编码器顶层加 LoRA 以适配领域特征。

    因此，LLM 为主、投影层为辅、视觉极少碰，是多模态 LoRA 微调的经验法则。


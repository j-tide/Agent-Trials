content:
  prompt: LoRA 加在视觉模块、投影模块、LLM 模块，效果有何差异？可否量化？
answer:
  mode: rubric
  reference_answer: |-
    已有大量研究对 LoRA 在多模态模型不同模块的效果进行了消融实验，结论高度一致。

    定性结论：

    - LLM 上的 LoRA：收益最大。显著提升指令遵循、推理准确性、多模态对话能力。几乎在所有多模态基准（MME, MMBench, SEED-Bench）上带来大幅提升。

    - 投影层上的 LoRA：收益次之。改善视觉-语言对齐，帮助 LLM 更好理解视觉 token。单独使用的效果有限，但可与 LLM 的 LoRA 叠加。

    - 视觉模块上的 LoRA：收益最小，甚至可能有害。在通用多模态任务上，性能提升微弱，有时因破坏预训练视觉表示而略微下降。只在特定领域（如医学影像）且数据充足时，才能观察到稳定提升。

    量化示例（基于 LLaVA-1.5-7B 相关消融）：

    [嵌入表格未展开]

    数据趋势表明：LLM 的 LoRA 贡献了绝大部分提升；叠加投影层有进一步小幅增益；叠加视觉模块几乎无边际收益。因此从投入产出比看，优先 LLM 的 LoRA。


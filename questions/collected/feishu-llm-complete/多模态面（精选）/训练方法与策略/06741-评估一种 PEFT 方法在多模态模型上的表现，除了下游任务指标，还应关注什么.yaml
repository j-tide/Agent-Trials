content:
  prompt: 评估一种 PEFT 方法在多模态模型上的表现，除了下游任务指标，还应关注什么？
answer:
  mode: rubric
  reference_answer: |-
    综合评估体系应覆盖效果、效率和实用性：

    - 参数量与存储效率：可训练参数占全参数的比例、实际存储大小（MB/GB）。这对部署和共享至关重要。

    - 训练效率：训练时间、显存占用峰值、最大可支持 batch size。能否在消费级硬件上运行？

    - 推理延迟：PEFT 方法是否引入额外计算？LoRA 可合并零延迟，Adapter 则增加延迟，Prompt/Prefix 增加 KV 缓存计算量。

    - 泛化性与鲁棒性：

    - 灾难性遗忘程度：微调后，模型在原始单模态任务（纯文本问答、纯视觉分类）上的性能是否大幅下降？LoRA 往往能更好保持原有能力。

    - 可插拔性与可组合性：能否容易地添加、移除、切换不同的 PEFT 模块（多任务场景）？混合不同 PEFT 方法是否方便？

    - 训练稳定性：收敛速度、对超参数的敏感度、不同随机种子下的方差。

    - 对模型结构的侵入性：是否需要修改模型结构？是否依赖特定架构？LoRA 普适性最强，Adapter 需插入特定位置，Prompt 仅需改输入。

    - 可解释性/分析性：能否从学到的参数中获得 insight？例如 LoRA 权重的奇异值分布可反映任务所需表示的秩。

    最终的选型应是这些维度的综合权衡，而非仅看下游任务分数。例如，在移动端部署场景，推理延迟的权重极高；在多租户 SaaS 场景，可插拔性和存储效率成为关键。

    - 与纯文本 Prompt Tuning 相同，在 LLM 的输入嵌入层前，拼接若干个可学习的文本 prompt 向量 PT∈Rl×dPT∈Rl×d，其中 ll 是 prompt 长度（如 10-50），dd 是词嵌入维度。

    - 这些 prompts 可以是任务无关的（共享）或任务特定的。

    - 在视觉编码器的输入或输出侧添加可学习的向量。

    - 输入侧：在图像的 patch 序列前拼接可学习的视觉 prompt token（如 10 个），送入 ViT。这些 token 通过自注意力与图像 token 交互，引导视觉特征向任务方向偏移。这被称为 Visual Prompt Tuning (VPT)。

    - 输出侧：在视觉编码器输出的 token 序列前拼接 prompt 向量，作为 LLM 输入的一部分。

    - 同时训练文本 prompts 和视觉 prompts。例如，LLaVA 等模型可以在投影层输出（视觉 token）之前插入视觉 prompts，同时在 LLM 输入之前插入文本 prompts。

    - 这些 prompts 捕获任务特定的跨模态线索，以极低成本（<0.1% 参数）适应不同任务。

    - 在不同数据量下的性能退化（少样本、全量）。

    - 对不同域外数据的泛化能力。

    - 对噪声和对抗攻击的鲁棒性。

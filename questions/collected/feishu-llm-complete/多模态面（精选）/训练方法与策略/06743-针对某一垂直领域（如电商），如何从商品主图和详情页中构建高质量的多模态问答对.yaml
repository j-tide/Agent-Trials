    电商领域拥有独特的结构化多模态数据金矿，可被系统性地转化为多模态训练数据。

    数据来源：商品主图、详情页长图、SKU 属性表、用户评论（含图片和文本）、QA 板块。

    构造策略：

    - 属性-问答对转换：

    - 图文匹配校验与增强：

    - OCR 驱动的文本识别问答：

    - 评论挖掘与对齐：

    - 多图对比场景构造：

    - 对话化包装：

    注意事项：电商数据噪音大（错误属性、PS 过度、刷单评论），需设置严格的质量门槛，如评论点赞数、属性完整性、图文匹配度等。


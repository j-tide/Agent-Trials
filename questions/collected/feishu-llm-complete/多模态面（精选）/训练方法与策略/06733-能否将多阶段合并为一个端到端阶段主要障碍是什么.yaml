content:
  prompt: 能否将多阶段合并为一个端到端阶段？主要障碍是什么？
answer:
  mode: rubric
  reference_answer: |-
    理论上可行，但实践中障碍巨大。

    主要障碍：

    - 数据规模与复杂度的巨大差异：特征对齐需要的是简单图文对，多模态预训练需要海量弱相关图文对，指令微调需要精心构造的高质量指令数据。将这些混合在一起端到端训练，数据采样策略极为复杂，且不同数据类型对模型能力的要求完全不同。

    - 训练稳定性与灾难性遗忘：同时进行多种任务和难度的训练，梯度冲突剧烈。初期简单任务收敛快，后期复杂任务可能被忽视；LLM 的语言能力可能在嘈杂的图文数据中迅速退化。分阶段训练本质上是一种课程学习，先易后难，保护已有能力。

    - 资源效率低：端到端训练需要始终以最高配置（全参数、大 batch）运行，而分阶段可以在早期用更少资源快速迭代。

    - 缺乏中间验证：分阶段可以在每个阶段结束后评估特定能力（如第一阶段检查对齐质量），端到端则难以定位问题。

    例外情况：一些大规模统一多模态模型（如 Gemini、Chameleon）采用了“大一统”训练，但它们拥有海量算力、精心配比的多任务数据、以及复杂的优化策略（如动态采样、多任务平衡），实际上仍是分阶段思想的隐式实现。对于资源有限的团队，分阶段是更务实的选择。


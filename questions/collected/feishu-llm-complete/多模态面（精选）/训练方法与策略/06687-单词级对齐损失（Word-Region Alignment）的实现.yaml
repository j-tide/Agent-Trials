content:
  prompt: 单词级对齐损失（Word-Region Alignment）的实现
answer:
  mode: rubric
  reference_answer: |-
    单词-区域对齐旨在将文本中的具体词与图像中的对应区域（或 patch）进行细粒度匹配，而不仅仅是全局对齐。这通常在预训练阶段通过最优传输或注意力引导实现。

    实现方法：

    - 基于注意力的软对齐：
    使用交叉注意力或协同注意力，计算每个文本 token 对所有图像区域 token 的注意力权重。训练目标是让正确对应的词-区域对获得高注意力。可以通过额外的对比损失来实现：将词特征作为 query，对应区域特征作为正样本，其他区域为负样本，使用 InfoNCE。

    - 最优传输 / Wasserstein 距离：
    将词和区域的特征距离矩阵视为代价矩阵，通过最优传输寻找最小代价的匹配方案，并将其作为对齐损失。例如 WRA 使用 Sinkhorn 算法近似求解。

    - 细粒度对比损失：
    如 FILIP，在对比学习的相似度计算中，不直接池化为全局向量，而是取每个词与所有图像 patch 的相似度最大值，然后求和得到图文相似度。损失形式与 CLIP 类似，但交互粒度是 token 级。

    - 利用检测/分割标注：
    如果有物体框或掩码标签，可直接进行有监督对齐：将文本中的实体词与其对应的框内视觉特征拉近，与其他框推远。

    这种细粒度对齐损失显著提升模型在定位、指代理解和细粒度分类任务上的表现。


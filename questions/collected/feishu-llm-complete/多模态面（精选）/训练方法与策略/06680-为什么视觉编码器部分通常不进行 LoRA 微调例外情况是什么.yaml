content:
  prompt: 为什么视觉编码器部分通常不进行 LoRA 微调？例外情况是什么？
answer:
  mode: rubric
  reference_answer: |-
    通常不微调的核心原因：

    - 预训练充分且通用：视觉编码器（如 CLIP ViT）在数亿到数十亿图文对上训练，具备极强的泛化能力和语义对齐性。其特征空间已与语言空间高度协调，无需进一步低秩适配。

    - 低秩约束破坏细粒度信息：视觉特征包含丰富的空间布局和局部细节，这些信息往往需要高秩表示。LoRA 的低秩分解可能限制模型捕获细微视觉差异的能力，导致细粒度识别或空间定位任务性能下降。

    - 灾难性遗忘风险：视觉编码器的预训练数据分布通常极广，下游微调数据往往较窄。解冻训练会快速覆盖通用的视觉知识，导致在未见过的视觉域上性能骤降。

    - 收益极低：如上一问的量化数据，微调视觉编码器带来的提升微乎其微，却大幅增加了训练参数和过拟合风险。

    例外情况（应微调视觉编码器）：

    - 巨大的领域差异：当目标图像的分布与预训练数据截然不同（如医学 MRI 图像、卫星遥感图、显微镜图像、热成像），预训练特征无法有效描述新领域的关键视觉模式。此时需要在领域数据上微调视觉编码器，LoRA 可作为轻量选项。

    - 需要高分辨率细粒度理解：任务要求极精细的视觉细节（如微小缺陷检测、高精度 OCR、密集预测），预训练的低分辨率特征不足。微调高层视觉特征有助于保留更多高频信息。

    - 拥有大规模高质量的领域数据：若领域标注数据量达到数十万以上，微调视觉编码器的过拟合风险降低，可以安全地释放其潜力。

    - 多模态任务本身驱动：某些任务（如视频理解、3D 场景理解）需要视觉编码器学习时间或深度维度的特征，这时必须微调。

    在这些例外中，通常仅微调视觉编码器的最后几层，或以极小的学习率（如 1e-6）和低秩（rank=4）进行 LoRA，以在适配的同时尽量保留预训练知识。


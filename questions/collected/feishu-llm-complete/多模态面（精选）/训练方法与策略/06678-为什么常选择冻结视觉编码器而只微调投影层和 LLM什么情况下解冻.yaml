content:
  prompt: 为什么常选择冻结视觉编码器而只微调投影层和 LLM？什么情况下解冻？
answer:
  mode: rubric
  reference_answer: |-
    冻结视觉编码器的原因：

    - 视觉特征已足够好：预训练的 CLIP ViT 等视觉编码器已通过大规模图文对比学习获得了强大的语义视觉表示，足以支撑大多数多模态任务。

    - 防止灾难性遗忘：视觉编码器也携带着预训练的视觉知识，微调可能破坏其通用性，导致在未见过的视觉域上性能下降。

    - 计算效率：冻结视觉编码器可以大幅减少训练参数量和 GPU 显存占用，加快训练速度。

    - 保持与 LLM 的独立性：冻结视觉编码器使得视觉特征空间保持固定，LLM 只需学习如何解读这些特征，训练更稳定。

    解冻视觉编码器的情况：

    - 领域差异巨大：当目标应用领域与视觉编码器的预训练数据差异极大（如医疗影像、遥感图像、工业缺陷检测），固定的视觉特征可能不适用，需要微调以捕捉领域特定的纹理、形状。

    - 需要高分辨率细粒度理解：当任务要求极其精细的视觉细节（如显微镜图像分析、高精度 OCR），微调视觉编码器能帮助其保留更多高频信息。

    - 有大规模高质量多模态数据：如果拥有足够多的领域内图文对数据，解冻视觉编码器联合微调可以显著提升性能上限。

    - 追求极致性能：在算力充裕的情况下，缓慢解冻视觉编码器高层并配合极低学习率，往往能带来额外的性能提升。

    典型策略：采用渐进式解冻——在预训练后期或指令微调阶段，以非常小的学习率解冻视觉编码器最后几层，让它们适度适应多模态任务，同时保留低层基础特征。


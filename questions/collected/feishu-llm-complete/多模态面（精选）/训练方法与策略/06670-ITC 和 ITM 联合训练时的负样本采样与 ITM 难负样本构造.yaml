content:
  prompt: ITC 和 ITM 联合训练时的负样本采样与 ITM 难负样本构造
answer:
  mode: rubric
  reference_answer: |-
    ITC（图文对比损失）和 ITM（图文匹配损失）：

    - ITC 做全局对比，负样本为 batch 内其他不匹配图文对，或队列中的历史负样本，构造简单。

    - ITM 是二分类：判断一对图文是否匹配。若只用与 ITC 相同的负样本，多数是容易区分的（因为语义相差大），对模型提升有限。因此需要难负样本：那些语义相近但实际上不匹配的对。

    ITM 难负样本的构造方法：

    - 在线难负样本挖掘：在一个训练 batch 内，基于当前的 ITC 相似度矩阵，选择与正样本相似度最高但不匹配的图文对作为 ITM 负样本。例如，对于图像 IiIi，将其与 batch 内其他文本 Tj(j≠i)Tj(j=i) 按相似度排序，取 top-k 作为难负例。同时也可以为文本 TiTi 挑选相似但不匹配的图像。这样构造的负样本对模型最具迷惑性，能显著提升匹配判别能力。

    - 离线挖掘：用已训练的模型在整个数据集上检索，离线挑选难负样本，然后用于训练。但成本高且可能过时。

    - 软标签/加权负样本：不直接二分类，而是给难负样本分配较小的惩罚权重或软标签。

    典型工作 ALBEF 使用在线难负样本挖掘：在 ITM 训练时，对每个图文对，将对比相似度最高的不匹配文本作为负样本，强制模型区分最难分辨的对。这种策略让 ITM 和 ITC 相互促进。


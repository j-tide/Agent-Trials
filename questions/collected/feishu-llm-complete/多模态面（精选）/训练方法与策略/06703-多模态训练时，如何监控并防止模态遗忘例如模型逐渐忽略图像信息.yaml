content:
  prompt: 多模态训练时，如何监控并防止“模态遗忘”？例如模型逐渐忽略图像信息。
answer:
  mode: rubric
  reference_answer: |-
    模态遗忘是多模态训练中一种隐蔽但致命的现象，表现为模型逐渐放弃从某个模态（通常是图像）中提取有用信息，而完全依赖另一个模态（通常是文本）完成任务。这在预训练和微调阶段都可能发生。

    监控方法：

    - 梯度监控：定期记录回传到视觉编码器和文本编码器的梯度范数（如L2范数）及其比值。若视觉梯度范数相对于文本梯度持续衰减并趋近于零，则表明视觉侧已停止学习。

    - 注意力分布分析：在跨模态交互层（如交叉注意力）中，统计视觉token获得的累积注意力权重。若该权重随时间推移明显下降，或集中在少数无意义的固定patch上，即为遗忘信号。

    - 模态消融测试：在验证集上定期运行两组评估：一组正常输入，另一组将图像替换为全黑/随机噪声/不相关图像。计算两组性能的差值（视觉依赖度）。若差值持续缩小，说明模型对图像的依赖在减弱。

    - 单模态性能监测：单独使用图像特征进行线性分类或检索，监测视觉表征的语义质量是否退化。

    - 损失分解：若使用多任务损失（如对比损失+生成损失），分别记录各项损失。若生成损失下降但对比损失上升或不降，可能暗示视觉语言对齐正在被破坏。

    防止策略：

    - 模态Dropout：最直接的手段。在训练中以一定概率（如10-20%）随机将整个图像输入替换为零向量，强制模型必须学习利用其他模态，同时锻炼单模态（文本）能力。当图像恢复时，它仍有能力重新利用视觉信息。

    - 梯度平衡与调制：实时监控各模态的梯度大小，使用OGM（On-the-fly Gradient Modulation）或类似方法，对视觉梯度进行动态放大或对文本梯度进行动态抑制，保持两者在相近的量级。这可以防止强势模态（文本）在梯度竞赛中压制弱势模态。

    - 保留单模态预训练能力：在微调或预训练时，混入一定比例的纯文本数据和纯图像数据（如用图像编码器做图像分类的损失），保持各自模态的基础能力不被覆盖。

    - 学习率分离：给视觉编码器设置略高于文本编码器的学习率，以补偿其收敛较慢的特性。但要小心过大导致不稳定。

    - 数据增强：对文本进行更强力的增强（如随机删除词、同义词替换、回译），降低文本中存在的捷径，迫使模型必须依靠图像补全信息。

    - 对比损失强化：维持较高的跨模态对比损失权重，因为它直接优化图文对齐，是对抗模态遗忘的有力工具。

    通过上述监控与干预的组合，可以将模态遗忘的风险降至最低。


content:
  prompt: 多模态 Adapter 的一种经典结构是双线性池化，它如何降低参数量？
answer:
  mode: rubric
  reference_answer: |-
    双线性池化（如 MUTAN, MLB） 是多模态融合中常用的 Adapter 结构，用于将视觉特征和文本特征进行高效的交互融合。标准双线性池化计算两个向量的外积，参数数量与特征维度的乘积成正比（dv×dtdv×dt），极容易爆炸。低秩双线性池化通过矩阵分解大幅降低参数量。

    经典结构（MLB, Multimodal Low-rank Bilinear）：

    - 将视觉特征 v∈Rdvv∈Rdv 和文本特征 t∈Rdtt∈Rdt 分别投影到共同的低维空间：
    v′=Wvv∈Rr,t′=Wtt∈Rrv′=Wvv∈Rr,t′=Wtt∈Rr
    其中 Wv∈Rr×dv,Wt∈Rr×dtWv∈Rr×dv,Wt∈Rr×dt，rr 是低秩维度（如 512）。

    - 进行 Hadamard 积（逐元素相乘）：
    z=v′⊙t′z=v′⊙t′

    - 再通过一个线性层投影到输出维度：
    o=Woz+boo=Woz+bo

    参数量分析：

    - 标准双线性：dv×dtdv×dt，若 dv=1024,dt=1024dv=1024,dt=1024，则 > 1M。

    - 低秩双线性：r(dv+dt)+r×doutr(dv+dt)+r×dout。当 r=512r=512 时，约 512×2048+512×dout≈1M512×2048+512×dout≈1M 参数。虽然参数量级类似，但 rr 可以进一步减小（如 128），且计算从 O(dvdt)O(dvdt) 降为 O(r(dv+dt))O(r(dv+dt))。

    MUTAN 的进一步压缩：
    MUTAN 将双线性权重张量分解为三个矩阵的外积和（Tucker 分解），将参数复杂度从 O(dvdtdout)O(dvdtdout) 降至 O(r(dv+dt+dout))O(r(dv+dt+dout))，同时保持丰富的多模态交互。

    这类低秩双线性 Adapter 常用于视觉问答、图文检索等任务的融合阶段，以极少的参数实现有效的跨模态交互。


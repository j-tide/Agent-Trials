content:
  prompt: 预训练数据中如果包含大量重复图像，会对模型产生什么影响？如何有效去重？
answer:
  mode: rubric
  reference_answer: |-
    大量重复图像的危害：

    - 数据分布扭曲与过拟合：重复图像在训练中被多次采样，其视觉概念被过度强化，破坏了数据的真实多样性。模型会在这些重复样本上过拟合，记住它们的特定像素而非学习泛化特征，在验证和真实场景下性能下降。

    - 评估失准：如果测试集中有图像与训练集中的重复图像高度相似，评估结果将虚高，无法反映真实泛化能力。这是“数据泄露”的一种隐蔽形式。

    - 记忆化风险：对于扩散模型等生成模型，重复图像可能导致模型直接复制训练样本，产生版权和隐私泄露风险。

    - 降低训练效率：算力被浪费在学习已经学过的内容上，长尾概念得不到充分学习。

    有效去重方法：

    - 基于哈希的精确去重：计算图像文件的 MD5、SHA256 值，完全一致的直接剔除。这是最基础的第一步。

    - 感知哈希去重：对图像进行缩放、灰度化后计算感知哈希（如 pHash、dHash），对微小修改（如裁剪、调色、加水印）具有鲁棒性。设定汉明距离阈值，将距离过近的视为近似重复。

    - 基于特征向量的去重：使用预训练模型（如 CLIP 视觉编码器或专门的去重模型如 SSCD）提取图像的特征向量。计算向量间的余弦相似度，超过极高阈值（如 0.995）的视为重复。这种方法能发现更广泛的语义重复（如不同角度拍摄的同一场景）。可以使用 FAISS 等库进行高效向量检索和去重。

    - 多模态去重：结合图像和文本。如果两张图像高度相似且文本也高度相似，则极可能是重复样本。这能更准确地处理同一图像配不同语言描述的情况。

    - 分块去重：对于极大规模数据，先根据图像特征聚类或分桶，然后在桶内进行精确匹配，降低两两比对的计算量。


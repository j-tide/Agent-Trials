content:
  prompt: 如何通过知识蒸馏将大型多模态模型压缩到小模型中？
answer:
  mode: rubric
  reference_answer: |-
    多模态知识蒸馏旨在将大型教师模型（如几十亿参数的MLLM）的跨模态理解能力迁移到小模型（如几亿参数）中。挑战在于视觉与语言知识的融合蒸馏。

    蒸馏方式：

    - 输出层Logits蒸馏：

    - 中间特征蒸馏：

    - 关系蒸馏（Relational KD）：

    - 数据增强与自蒸馏：

    多模态特有的挑战与策略：

    - 模态不平衡：教师可能在视觉或语言侧有偏重。蒸馏时需分别关注各模态的蒸馏损失权重。

    - 跨模态对齐保持：除蒸馏单模态特征外，还要显式地蒸馏跨模态的匹配度，例如让学生模仿教师的图文对比损失中正负样本的分布。

    - 生成能力的保持：小模型容易丢失生成多样性。可以结合温度缩放、以及多样性正则项（如鼓励 token 分布的熵）。

    - 训练策略：通常分阶段蒸馏，先蒸馏视觉编码器，再蒸馏文本编码器，最后蒸馏跨模态交互层和输出层。

    代表性的小模型如 TinyLLaVA、LLaVA-PruMerge 等，就使用了综合的特征蒸馏和任务蒸馏，在3B以下模型上取得了接近7B模型的性能。


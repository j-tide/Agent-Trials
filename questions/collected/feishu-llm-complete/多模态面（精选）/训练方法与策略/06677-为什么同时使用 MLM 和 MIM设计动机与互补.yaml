content:
  prompt: 为什么同时使用 MLM 和 MIM？设计动机与互补
answer:
  mode: rubric
  reference_answer: |-
    MLM（掩码语言建模） 和 MIM（掩码图像建模） 的结合，目的是通过双向跨模态重建，最大化多模态信息的交互。

    动机：

    - MLM 利用视觉信息补全文本缺失词，强制模型学习物体属性、关系等视觉-grounded 语义。例如，遮住“红色的”，模型必须从图像中感知颜色。

    - MIM 利用文本信息重建被遮盖的图像区域，让模型学习将语言描述与视觉细节（纹理、形状）对齐。例如，遮住猫的脸部，模型需根据“猫在睡觉”的文本推断遮住部分可能的视觉特征。

    - 两者都提供稠密的监督信号，并且都是双向交互，比单向生成能捕获更细粒度的对齐。

    互补性：

    - MLM 更侧重于语言理解的视觉基础，提升 VQA、推理等任务。

    - MIM 更侧重于视觉表征的语言引导，提升细粒度识别、物体定位和图像理解。

    - 联合使用可避免模型偏重于某一模态，鼓励双向对齐。

    代表模型如 VL-BEIT、BEiT-3 使用共享 Transformer 同时执行 MLM 和 MIM，取得了极好的多模态表征。


content:
  prompt: 如何利用“随机图像替换”作为一种正则化手段来提升模型鲁棒性？
answer:
  mode: rubric
  reference_answer: |-
    随机图像替换是指在多模态训练中，以一定概率将某个样本中的真实图像替换为其他随机的、不相关的图像，同时文本保持不变。这人为制造了“图文不匹配”的负样本。

    作用机制：

    - 强化细粒度判别能力：替换后的图文对在语义上矛盾。模型不能只看整体，必须学会关注图像中与文本相关的特定区域，才能判断是否为替换。这提升了细粒度的视觉理解和推理能力。

    - 防止语言先验与模态遗忘：当真实图像被替换后，如果模型之前靠文本猜答案，那它将答错（因为文本没变，答案变了）。这会惩罚模型对文本捷径的依赖，强制它认真“看”图。

    - 增强模型鲁棒性：推理时可能遇到图文弱相关甚至无关的输入（如用户发错图），经此训练的模型能更准确地识别错误，而非盲目融合。

    - 作为数据增强：与真实的图文匹配对混合，增加了训练数据的有效多样性，尤其丰富了难以区分的“难负样本”。

    实施细节：

    - 替换概率：通常设为10%-20%。过高会破坏正样本的对齐学习，过低则正则化效果有限。

    - 替换图像来源：从同一batch内随机选取其他图像，或从整个数据集中采样。

    - 标签处理：被替换的样本，其匹配标签变为0（不匹配），在图文匹配（ITM）任务中作为负样本。对于生成任务，可用特殊标记或直接忽略，或要求模型输出“不相关”提示。

    - 渐进式替换：训练初期替换概率低（如5%），让模型先打好对齐基础；后期逐渐提高，作为精细化的正则。

    这种方法在ALBEF、VLMo等模型的预训练中被证实有效，可以稳定提升VQA、检索等下游任务。


content:
  prompt: 文本到图像检索与图像到文本检索的对称性及非对称设置的影响
answer:
  mode: rubric
  reference_answer: |-
    在标准的多模态对比预训练中，使用的对称 InfoNCE 损失天然使两个方向的检索能力对称发展，因为损失函数中 LI→TLI→T 和 LT→ILT→I 权重相等。但在实际应用中，由于数据特性、任务需求或训练设计不同，可能会产生非对称。

    对称设置：两个方向性能接近，适用于需要双向检索的场景。

    非对称设置的影响：

    - 单方向训练：如果只训练 I→T 而忽略 T→I，会导致文本到图像检索能力显著差于反向。即使只在单个方向上应用，通常也推荐对称损失，因为双向对比信号可以增强特征的通用性。

    - 数据集中存在不对称：例如，每张图片对应多个文本描述，而每个文本通常只描述一张图片。这会导致 T→I 任务相对简单（一个文本对应唯一图像），而 I→T 可能有多个正确匹配。此时若不加处理，I→T 的难度会被低估。改进方法包括：在 I→T 中将同一图片的所有正确描述都作为正样本（多正样本对比损失），或者使用软标签。

    - 温度系数不对称：有时可以在两个方向使用不同的温度系数，以调整不同方向的梯度强度，但这种情况较少。

    - 负样本挖掘不对称：在构造难负样本时，一个方向可能更容易获得难样本，导致优化偏向。

    总体而言，维持对称设计并处理好正样本的多样性，是保证双向检索性能的基础。非对称设置应根据具体数据分布和任务需求谨慎使用。

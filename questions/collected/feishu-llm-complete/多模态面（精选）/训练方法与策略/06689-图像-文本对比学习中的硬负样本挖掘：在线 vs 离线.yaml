content:
  prompt: 图像-文本对比学习中的硬负样本挖掘：在线 vs 离线
answer:
  mode: rubric
  reference_answer: |-
    硬负样本（hard negatives）是指与查询高度相似但实际不匹配的样本。挖掘这类样本对训练判别性表示至关重要。

    在线挖掘：

    - 在每个训练 batch 内，基于当前模型的状态实时计算相似度，选取 top-k 不匹配对作为负样本。优点是效率高、无需额外存储，负样本始终与当前模型同步；缺点是受 batch size 限制，可能错过 batch 外的更难的样本。

    - 适用于 batch size 较大或结合队列的情况。

    离线挖掘：

    - 使用一个固定（通常是之前训练好的）模型对整个数据集提取特征，对每个查询计算出最相似的不匹配项，构建难负样本池。训练时从池中采样。优点是负样本来自全数据集，多样性好；缺点是特征会过时，需要定期重新挖掘，存储和计算开销大。

    对比：

    - 在线挖掘更简单且与训练同步，已被 ALBEF、BLIP 等模型采用，通常与 ITM 任务结合。

    - 离线挖掘在 MoCo 等早期对比学习中被用于维持大容量负样本库，但在多模态图文对比中逐渐被在线和队列方法取代。

    现代多模态训练主流是在线硬负样本挖掘结合队列，或直接用大 batch 减少挖掘需求。


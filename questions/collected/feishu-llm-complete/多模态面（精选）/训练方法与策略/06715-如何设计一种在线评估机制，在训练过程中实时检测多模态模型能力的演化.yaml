content:
  prompt: 如何设计一种“在线评估”机制，在训练过程中实时检测多模态模型能力的演化？
answer:
  mode: rubric
  reference_answer: |-
    在线评估需要在不显著拖慢训练的前提下，持续提供多维度的能力指标。

    设计原则：轻量、自动化、代表性、非侵入。

    具体方案：

    - 固定小样本评估集：准备一个精心筛选的评估集，包含各核心能力（识别、属性、空间、推理、描述、检索）的代表性样本，每个子集仅10-50个样本。样本务必固定，确保可比性。

    - 异步评估进程：在主训练进程之外，启动独立的评估进程。该进程定时（如每500步）读取最新的模型checkpoint，在评估集上运行推理并计算指标，不阻塞训练。使用共享存储或内存传递checkpoint。

    - 自动化指标计算：

    - 能力雷达图：将各项能力指标绘制成雷达图，实时推送到监控面板（如TensorBoard、WandB）。当某一维度出现下降趋势，立即报警。

    - 梯度与激活值监控：记录视觉/文本梯度的比率、各层激活的均值和方差，也作为在线监控指标，反映模态遗忘风险。

    - 在线消融探测：除正常推理外，还运行“图像置零”或“文本置零”的版本，对比正常与置零的指标差值，直接评估视觉依赖度。

    - 快速收敛性检测：每隔一定步数，在评估集上运行多步推理（如不同dropout设置），检查模型预测的稳定性。

    这套机制可以在数分钟内（取决于评估集大小和推理资源）完成一次全面体检，让开发者对模型能力的微观变化了如指掌。


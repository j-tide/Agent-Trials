content:
  prompt: 梯度累积和 micro-batch 的设置需要遵循哪些原则？
answer:
  mode: rubric
  reference_answer: |-
    梯度累积允许在有限的GPU显存下模拟更大的全局batch size，对于多模态大模型训练至关重要。其设置原则如下：

    - 等效batch size一致原则：

    [图片内容未导入]

    - 批次归一化（BatchNorm）的陷阱：

    - BatchNorm的统计量（均值、方差）是在每个micro-batch内独立计算的，而非全局batch。梯度累积无法修正这一点。因此，含有BatchNorm的网络用梯度累积会导致统计量估计不准，影响训练。

    - 解法：将BatchNorm替换为GroupNorm或LayerNorm，后者不依赖batch维度。现代多模态模型（ViT、LLM）几乎都使用LayerNorm，所以这个问题不突出，但若使用某些传统CNN视觉编码器需注意。

    - 损失计算与梯度累积的同步：

    - 损失函数中的某些操作（如softmax的交叉熵、对比损失中的负样本挖掘）可能在全局batch内计算效果更佳（如更大batch的对比学习有更多负样本）。梯度累积只在每个micro-batch内计算损失，无法跨micro-batch共享负样本。

    - 影响：对于需要使用大batch内负样本的对比损失（如CLIP损失），梯度累积不等价于真大batch。小micro-batch意味着更少的负样本，可能降低表征学习效果。

    - 缓解：可使用梯度检查点（gradient checkpointing） 或模型并行来增大真正的micro-batch size；或者使用动量队列（MoCo style）跨micro-batch共享负样本特征。

    - 学习率缩放：

    [图片内容未导入]

    - 批内依赖任务（如Batch-level采样）：

    - 如果训练中有基于batch的采样策略（如按类别平衡采样），梯度累积可能破坏这一策略，因为每个micro-batch可能不平衡。此时需要确保每个micro-batch都进行独立平衡采样，或使用分布式采样器。

    总结：设置micro-batch size应尽量大（填满显存），梯度累积步数用于补足所需的全局batch size。务必使用LayerNorm架构，并对对比损失等跨batch操作使用动量队列或内存库来弥补小micro-batch的不足。


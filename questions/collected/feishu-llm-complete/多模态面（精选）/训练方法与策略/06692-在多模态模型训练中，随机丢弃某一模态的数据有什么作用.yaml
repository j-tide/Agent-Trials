content:
  prompt: 在多模态模型训练中，随机丢弃某一模态的数据有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    这是模态Dropout或模态掩蔽，是一种简单却极为有效的正则化技术。具体做法是：在每个训练步骤中，以一定概率（如10%-20%）随机地将一个模态的输入全部或部分替换为零向量或随机噪声。

    核心作用：

    - 防止过拟合与模态偏置：强制模型不能完全依赖某个“强势”模态，必须学会从任何一个模态中独立提取有用信息，并适应跨模态信息的缺失。

    - 提升对模态缺失的鲁棒性：推理时，若某一模态损坏或缺失，经过模态Dropout训练的模型仍能保持较好的性能，因为它已经见过类似的“单模态”情况。

    - 隐式的多任务学习：随机丢弃模态等价于让模型同时学习“多模态任务”和“单模态任务”，增强了共享编码器的通用性。

    - 减少共适应性：类似于神经网络的Dropout，模态Dropout阻止了不同模态的特征在早期就形成高度协同的复杂共适应关系，迫使它们各自发展出更独立的语义表征。

    - 缓解模态坍缩：如上一问所述，它是防止模型坍缩到文本侧的重要工具。

    实际应用：

    - 在视觉-语言预训练中，训练图文对比损失时，对文本侧进行随机mask或完全drop。

    - 在视频-语言模型中，随机丢弃部分帧或整个视频流。

    - 在语音-视觉-文本模型中，随机屏蔽音频或视频。

    通常结合多种丢弃策略，如对视觉进行patch级别的随机mask，对文本进行token级别的随机mask，以及整个模态的随机丢弃。


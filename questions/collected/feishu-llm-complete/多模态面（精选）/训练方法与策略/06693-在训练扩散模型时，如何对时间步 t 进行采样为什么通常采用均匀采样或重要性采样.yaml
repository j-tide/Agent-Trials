content:
  prompt: 在训练扩散模型时，如何对时间步 t 进行采样？为什么通常采用均匀采样或重要性采样？
answer:
  mode: rubric
  reference_answer: |-
    在扩散模型的训练中，每个训练步骤需要从时间步 t∈[1,T]t∈[1,T] 中随机采样，然后根据该时间步的噪声水平计算损失。

    均匀采样：

    - 做法：从离散均匀分布 t∼U[1,T]t∼U[1,T] 中采样。每个时间步被采到的概率相等。

    - 原因：简单直观，实现方便。对于大多数标准扩散模型（如DDPM），均匀采样工作良好，因为各时间步的损失量级在简化损失函数下相对平衡。它能均匀覆盖整个扩散过程，确保模型对各个噪声水平都有学习。

    重要性采样：

    - 动机：均匀采样忽略了不同时间步对最终生成质量贡献的差异。研究发现，某些时间步（通常是中等噪声水平）的损失对生成样本的质量影响更大，而极高或极低噪声水平可能过于简单或噪声过大。重要性采样旨在让模型更关注这些“关键”时间步。

    - 做法：根据某个重要性权重 w(t)w(t) 采样，该权重通常正比于对应时间步的损失大小或得分匹配的方差。实际中，可以记录每个时间步的历史损失，并动态调整采样概率，使损失越大的 tt 被采样到的概率越高。

    - 好处：可以加速收敛，提升生成质量，尤其在训练后期或对精细细节要求高的任务中。

    - 挑战：需要准确估计重要性权重，如果估计不准，可能导致训练不稳定。

    实践中：大多数开源扩散模型（如Stable Diffusion）的标准训练仍使用均匀采样，因其稳定性和简易性。但在一些追求极致效率或特定场景（如文生图大模型）中，可能会采用基于损失的重要性采样或课程学习式的采样（先学简单时间步，再学困难时间步）。


content:
  prompt: 多模态高效微调时，如何选择可训练参数的秩 r？与单模态相比有什么特殊考量？
answer:
  mode: rubric
  reference_answer: |-
    秩 r 的选择原则：

    - r 越大，表达能力越强，但参数量越多，过拟合风险增加。

    - 通常选取 4~64 之间。对于大规模多模态模型，通用推荐：r=16 或 32 是安全且高效的起点；若数据量极少（<1000），用 r=4~8 防止过拟合；若数据充足（>5万），可尝试 r=64 追求更高性能。

    多模态的特殊考量：

    - 任务复杂度：多模态任务涉及跨模态交互，复杂推理任务可能需要稍高的 r（32-64），而简单的描述生成 r=8-16 足够。

    - 视觉 token 的干扰：LLM 需要处理额外的大量视觉 token，这增加了 LLM 输入的信息复杂度。适当提高 LLM 侧 LoRA 的秩，有助于 LLM 学习如何有效融合视觉信息。一些实验表明，在多模态模型上，r=32 明显优于 r=8，而在纯文本任务上差距不大。

    - 数据分布差异：如果下游多模态数据与预训练分布差异大，更大的 r 有助于补偿分布偏移。

    - 模块差异：不同模块的最优 r 可能不同。LLM 的核心自注意力层通常使用较大的 r（如 32-64），而 FFN 层可用较小的 r（如 8-16）。投影层若使用 LoRA，由于其输入输出维度可能较小，r 可取 4-8。

    - 组合时 r 的分配：若同时在视觉侧和语言侧使用 LoRA，视觉侧的 r 通常远小于语言侧（如视觉 r=4，语言 r=32），以保护视觉预训练特征。

    实践建议：通过网格搜索在验证集上确定最佳 r。通常多模态的 r 会比纯文本微调略大，以容纳跨模态交互所需的额外自由度。


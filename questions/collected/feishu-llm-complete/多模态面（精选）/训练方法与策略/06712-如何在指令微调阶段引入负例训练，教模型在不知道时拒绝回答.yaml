content:
  prompt: 如何在指令微调阶段引入“负例训练”，教模型在不知道时拒绝回答？
answer:
  mode: rubric
  reference_answer: |-
    负例训练是指在训练数据中主动加入模型应该拒绝回答或表达不确定性的样本，教会模型识别自身知识边界。

    具体方法：

    - 构造不可回答的问题：

    - 构造模糊或不可判定的问题：

    - 构造反事实或对抗性问题：

    - 输出格式规范：在训练数据中统一拒绝回答的模板，如“抱歉，基于提供的图像，我无法...”。

    - 多轮对话中的负例：在对话历史中插入模型已拒绝回答的场景，后续用户继续追问，模型仍应坚持不编造。

    注意事项：

    - 负例比例不宜过高（如 5%-15%），以免模型变得过度保守。

    - 负例也应保证多样性，覆盖不同类型的“不知道”。

    - 训练时需确保模型真正学会判断，而非仅仅记忆特定问题模式。


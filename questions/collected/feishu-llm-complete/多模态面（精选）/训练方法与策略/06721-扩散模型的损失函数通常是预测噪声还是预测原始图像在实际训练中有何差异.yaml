content:
  prompt: 扩散模型的损失函数通常是预测噪声还是预测原始图像？在实际训练中有何差异？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型的训练损失由参数化方式决定。最常见的两种是预测噪声 ϵϵ 和预测原始图像 x0x0。它们本质上是等价的，可以通过前向扩散公式互相转换，但在训练和特性上有实际差异。

    [图片内容未导入]

    - 优点：

    - 缺点：在极低噪声水平时，预测噪声对小误差敏感，可能引入噪声。

    [图片内容未导入]

    - 目标：模型直接预测干净图像 x0x0。

    - 优点：

    [图片内容未导入]

    - 噪声预测实际上更稳定，因为它去除了输入噪声水平变化带来的目标方差变化，将目标固定在单位方差的高斯噪声周围。这种“方差稳定”特性让优化器更容易找到合适的步长和方向，是目前扩散模型成功的关键因素之一。

    在实际训练中，预测噪声几乎是默认选择，因为它简单稳定，不需繁复的损失加权技巧。


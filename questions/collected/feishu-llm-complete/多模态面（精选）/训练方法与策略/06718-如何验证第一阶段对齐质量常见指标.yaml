content:
  prompt: 如何验证第一阶段对齐质量？常见指标
answer:
  mode: rubric
  reference_answer: |-
    对齐质量指标：

    - 检索召回率：用图文检索任务（I→T 和 T→I）的 Recall@1、Recall@10 评估。如果对齐好，应该能用图像检索到匹配文本，反之亦然。

    - 零样本分类准确率：将投影后的视觉 token 送入 LLM，进行简单的零样本分类（如“这是一张什么动物的图片？”），看 LLM 是否能根据视觉特征正确回答。

    - 图像描述质量：让模型为少量图像生成描述，用 BLEU、CIDEr 或人工评估描述是否与图像相关、语义连贯。

    - 嵌入空间可视化：用 t-SNE 或 UMAP 可视化图像和文本嵌入的分布，观察匹配的图文对是否在空间中邻近，不同语义的簇是否分离。

    - 线性探测：在投影后的视觉 token 上训练简单的线性分类器，看是否容易区分不同类别，评估特征是否保留了足够的语义信息。

    实践：通常在第一阶段结束时，检索指标会有显著提升（Recall@1 从接近 0 到 50%+），描述从乱码变为语义相关的短句。如果这些指标不理想，说明需要调整投影层结构或延长训练。


content:
  prompt: 生成式训练目标在多模态模型中的典型应用任务
answer:
  mode: rubric
  reference_answer: |-
    生成式目标，即自回归或编码器-解码器框架下的序列生成损失（通常为交叉熵），在多模态模型中主要用于需要生成文本或图像的任务。典型应用包括：

    - 图像字幕：给定图像，生成描述文本。模型以图像特征为条件，逐词预测文本序列。这是最经典的生成式多模态任务，如 BLIP、SimVLM、CoCa 等都使用。

    - 视觉问答：可以建模为以图像和问题为条件，生成答案序列。这比分类头更灵活，能产生自然语言答案。

    - 多模态对话：如 LLaVA 的指令微调阶段，模型接收图像和文本指令，自回归生成回答。

    - 文本到图像生成：如 DALL-E 1、Unified-IO。图像通过 VQ-VAE 离散为 token 序列，模型以文本为条件自回归预测图像 token，使用交叉熵损失。

    - 图像编辑/修复：给定图像和修改指令，生成修改后的图像 token 或文本描述。

    - 统一多模态生成：如 Unified-IO、Gemini，所有任务都转化为序列到序列的生成，损失函数统一为交叉熵。

    生成式目标能够充分学习细粒度的跨模态对齐和上下文依赖，因此往往与对比损失结合，达到更好的理解与生成能力。


  reference_answer: |-
    [图片内容未导入]

    - τ：温度系数，控制 softmax 分布的锐度。较小的 ττ（如 0.07）会让模型更关注困难负样本，产生更强的梯度信号。

    - 对称性：同时优化两个方向的损失，保证图像到文本和文本到图像的检索能力。两项求平均使得训练目标对称，两个模态的嵌入空间互逆对齐。

    这种设计使得 CLIP 能利用 batch 内的大量负样本高效学习跨模态对齐，是大规模图文预训练的基石。


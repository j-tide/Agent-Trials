content:
  prompt: 多模态预训练后，如何快速评估学习到的视觉语言表征质量？常用的探针任务是什么？
answer:
  mode: rubric
  reference_answer: |-
    在多模态预训练过程中，需要快速、低成本地评估当前表征的好坏，以判断训练是否有效。这通常通过零样本（zero-shot） 或线性探测（linear probe） 在轻量级下游任务上进行。

    常用探针任务：

    - 零样本图文检索：

    - 零样本图像分类：

    - 线性探测图像分类：

    - 零样本视觉问答：

    - 图像描述生成质量：

    - 多模态理解基准：

    快速评估流程：

    - 预训练每间隔一定步数（如每1万步），在验证集上运行上述探针任务的子集（如只用部分数据），绘制趋势图。只需几十分钟就能判断模型是否在改善、哪个能力停滞。

    - 注意：零样本评估可能对prompt敏感，应使用固定的一套prompt模板。


content:
  prompt: 使用大模型合成多模态指令数据时，需要注意哪些问题？如何保证多样性和质量？
answer:
  mode: rubric
  reference_answer: |-
    需要注意的问题：

    - 幻觉污染（见第 4 问详述）：模型可能“脑补”图像中不存在的内容，必须严格锚定图像。

    - 风格与偏见同质化：单一模型（尤其是 GPT-4V）生成的文本有明显的语言风格偏好（如过于礼貌、长篇大论、用词考究），大量使用会让下游模型“学话”而非“懂事”。同时，GPT-4V 也有自身的文化和知识偏见。

    - 任务类型不均衡：LLM 倾向于生成自己擅长的任务类型（如描述和简单问答），而可能忽略需要空间推理、计数、OCR 等弱项任务的生成。

    - 长尾概念覆盖不足：对于罕见物体或复杂场景，GPT-4V 可能自己也识别不准，导致生成错误标注。

    保证多样性的策略：

    - 多模型生成：混合使用 GPT-4V、Gemini Pro Vision、Qwen-VL 等不同家族的 MLLM 生成数据，利用模型间的差异增加数据多样性。

    - 指令模板多样性：维护一个包含数百种不同任务描述、角色扮演、提问风格的指令模板库，每次随机抽取。例如，有时要求“简短回答”，有时要求“逐步推理”，有时要求“用 JSON 格式输出”。

    - 数据源多样性：输入图像要尽量多样化，不要只来源于单一数据集（如 COCO）。混合自然图像、图表、文档、截图、画作等。

    - 控制生成参数：适当提高生成时的温度参数，并限制 top-p 采样，鼓励模型生成非最高概率的表达。

    保证质量的策略：

    - 自动化多维度评分：用 CLIP Score 检查图文相关性，用困惑度检查文本流畅性，用正则或专用模型检查事实性错误。

    - 人工抽样审核：定期从合成数据中随机抽样进行人工打分，监控合成质量的变化趋势，并及时发现新的问题模式。

    - 迭代修正：利用人工审核发现的问题，细化给 LLM 的 Prompt，如增加“不要使用‘这幅图展示了’这种开头”等具体约束。


content:
  prompt: 为什么第一阶段通常冻结视觉编码器和 LLM，只训练投影层？不冻结会怎样？
answer:
  mode: rubric
  reference_answer: |-
    冻结的原因：

    - 保护预训练知识：视觉编码器（如 CLIP ViT）和 LLM 各自经过大规模单模态预训练，拥有丰富的视觉表示和语言能力。第一阶段目标是让视觉 token 的分布与 LLM 词嵌入空间初步对齐，而非改变它们的核心能力。

    - 训练稳定性：投影层参数极少（通常一个线性层或两层 MLP），学习目标单纯。如果同时解冻视觉编码器和 LLM，初期梯度混乱会导致视觉表示剧烈变化，LLM 的语言能力也会被破坏，训练极易崩溃或产生灾难性遗忘。

    - 数据效率：第一阶段的图文对数据通常较简单（如图像-标题对），解冻大量参数容易过拟合，导致泛化能力下降。

    不冻结的后果：

    - 视觉编码器因梯度冲击而输出分布漂移，投影层刚学到的对齐立刻失效。

    - LLM 的语言建模能力被图文对数据快速覆盖，出现严重的灾难性遗忘，生成质量急剧下降。

    - 训练损失震荡，收敛缓慢，甚至无法收敛。

    因此，第一阶段只训练投影层是一种安全且高效的热启动，为后续更复杂的解冻训练铺平道路。


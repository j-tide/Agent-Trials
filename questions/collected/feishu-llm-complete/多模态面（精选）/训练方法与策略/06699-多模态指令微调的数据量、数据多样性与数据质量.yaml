content:
  prompt: 多模态指令微调的数据量、数据多样性与数据质量
answer:
  mode: rubric
  reference_answer: |-
    数据量：

    - 典型数量级在几万到几十万条指令样本。LLaVA 最初使用 158K 条，LLaVA-1.5 扩充到 665K。相比预训练的数亿图文对，指令数据量小得多。

    数据多样性 vs 数据质量：

    - 质量更重要。指令微调阶段的目的是对齐人类意图，让模型学会遵循多样化的指令格式，而非学习新知识。低质量的指令数据（如错误的答案、模糊的描述、格式混乱）会迅速破坏模型已有的能力，导致生成质量下降、幻觉增多。

    - 多样性是关键维度。高质量基础上的多样性才能让模型泛化到各类指令。多样性应覆盖：

    - 实际权衡：优先保证每条数据的高质量（事实准确、逻辑清晰、与图像高度相关），在此基础上尽可能多样化。LLaVA 的成功很大程度上归功于用 GPT-4 精心构造的高质量多样化指令数据。


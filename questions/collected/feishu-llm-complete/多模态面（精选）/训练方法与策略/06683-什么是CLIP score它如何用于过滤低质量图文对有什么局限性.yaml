content:
  prompt: 什么是“CLIP score”？它如何用于过滤低质量图文对？有什么局限性？
answer:
  mode: rubric
  reference_answer: |-
    CLIP Score 是衡量图像和文本语义匹配程度的指标，定义为图像嵌入向量和文本嵌入向量之间的余弦相似度。计算公式为：

    [图片内容未导入]

    在过滤中的应用：

    通过设定一个全局阈值（如 0.25 或 0.3），丢弃所有 CLIP Score 低于该阈值的图文对。这是 LAION 构建时最核心的过滤手段之一，能高效剔除完全图文无关的噪声数据。

    局限性：

    - 对细粒度错误不敏感：对于“红色的猫”和一只“白色的猫”的图像，CLIP Score 可能仍然很高，因为它主要捕获了“猫”这个高层语义，而对颜色这类细粒度属性区分力弱。这会导致数据中保留大量属性绑定错误。

    - 对文字和复杂构图理解弱：CLIP 对图像中的文字（OCR）、物体计数、空间关系理解能力有限。因此，含有这类信息的图文对可能被错误评分。

    - 存在自身偏见：CLIP 的预训练数据也有偏差，它认为“相关”的可能只是训练数据中的常见共现模式，而非真正的语义相关。例如，它可能给“鸟”和“树枝”打高分，即使图中有鸟没树枝。

    - 阈值难以普适：最佳阈值与具体数据集和下游任务有关。一刀切的阈值会丢失一些语言独特但视觉概念罕见的长尾样本。

    - 易受对抗攻击：已有研究表明，可以通过微小的图像扰动操纵 CLIP Score。

    因此，CLIP Score 应作为粗筛工具与其他信号（如细粒度匹配、实体检测）结合使用。


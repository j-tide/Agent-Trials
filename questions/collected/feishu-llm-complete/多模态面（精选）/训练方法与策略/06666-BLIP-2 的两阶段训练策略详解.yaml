content:
  prompt: BLIP-2 的两阶段训练策略详解
answer:
  mode: rubric
  reference_answer: |-
    BLIP-2 采用冻结视觉编码器 + 可学习的 Q-Former + 冻结 LLM 的架构，训练分为两个阶段。

    第一阶段：视觉-语言表征学习

    - 目标：训练 Q-Former，使其学会从冻结的视觉编码器特征中提取与语言相关的视觉 token。

    - 训练参数：仅更新 Q-Former（包括内部的 Transformer 层、可学习查询向量、以及三个任务的头部），视觉编码器和 LLM 均冻结。

    - 训练任务：Q-Former 同时进行三个任务：

    - 为什么这样安排：三个任务共享 Q-Former 参数，相互促进。ITC 提供全局对齐，ITM 提供细粒度判别，LM 提供生成能力。这一阶段让 Q-Former 成为“视觉-语言桥梁”。

    第二阶段：视觉-语言生成学习

    - 目标：将 Q-Former 连接到冻结的 LLM，让 LLM 根据视觉 token 生成文本。

    - 训练参数：仅更新 Q-Former（主要是与 LLM 的投影层），视觉编码器和 LLM 均冻结。

    - 训练任务：语言建模损失（给定图像，生成描述或回答）。Q-Former 输出的视觉 token 作为软提示，拼接到 LLM 的输入前，LLM 以这些视觉 token 为条件自回归生成文本。

    - 为什么这样安排：冻结 LLM 保护其语言能力，只需训练 Q-Former 如何将视觉信息“翻译”成 LLM 能理解的提示。这大大降低了训练成本，同时保持了 LLM 的零样本能力。

    这种两阶段设计将视觉-语言对齐的重任完全交给 Q-Former，是一种高效且解耦的架构。


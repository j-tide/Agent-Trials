content:
  prompt: 数据文档化对于多模态模型训练有多重要？应该包含哪些字段？
answer:
  mode: rubric
  reference_answer: |-
    数据文档化是负责任 AI 开发的基石。没有它，模型的偏差、风险和局限性无从溯源，也难以合规。它相当于数据的“说明书”和“体检报告”，其重要性怎么强调都不为过。

    关键字段（基于 Datasheets for Datasets 框架）：

    - 动机与目的：数据集创建的动机是什么？拟用于什么任务？不适合哪些任务？

    - 构成与规模：总样本数；图像、文本的统计信息（分辨率分布、文本长度分布、语言分布）；类别分布；样本示例。

    - 收集过程：数据来源（URL、API、人工采集）；采集时间范围；采集方式和工具；是否经过伦理审查和知情同意（尤其涉及人脸时）。

    - 预处理/清洗/标注：使用了哪些过滤、去重、增强手段；若有人工标注，标注员的人口统计信息、标注指南、一致率（如 Cohen's Kappa）；若有自动标注，所使用的模型及其局限性。

    - 分布与偏差：数据在不同维度（如性别、年龄、地域、文化）上的代表性如何？已知的偏差和不平衡有哪些？进行了何种分析？

    - 法律与伦理考量：版权状态；是否包含个人敏感信息及如何处理；潜在的有害内容（暴力、色情、仇恨言论）比例及处理方式；数据集的许可证。

    - 维护与更新：数据集是否会更新？谁负责维护？如何报告数据中的错误或问题？

    - 使用建议与风险：使用该数据训练的模型可能存在的风险和局限性。

    对于多模态数据，特别需要关注视觉内容中的隐性偏见（如职业图片中的性别刻板印象）、OCR 文字的隐私泄露、以及图像版权的复杂性。数据文档化不仅是一份静态文档，更应是一个随着数据迭代不断更新的活文档。


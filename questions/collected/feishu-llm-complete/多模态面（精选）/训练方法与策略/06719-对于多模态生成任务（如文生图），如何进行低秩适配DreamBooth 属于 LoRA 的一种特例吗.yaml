content:
  prompt: 对于多模态生成任务（如文生图），如何进行低秩适配？DreamBooth 属于 LoRA 的一种特例吗？
answer:
  mode: rubric
  reference_answer: |-
    文生图模型的低秩适配（LoRA for Diffusion Models）：

    文生图扩散模型（如 Stable Diffusion）中，LoRA 通常加在 UNet 的交叉注意力层（即文本与图像交互的层）的线性投影矩阵上。具体位置：

    - 交叉注意力层的 Q、K、V、O 矩阵。

    - 有时也加在 ResNet 块或自注意力层的线性层。
    通过低秩矩阵学习，实现用极少参数（如几 MB）控制生成风格、物体、构图等。

    DreamBooth 与 LoRA 的关系：

    - DreamBooth 不是 LoRA 的特例。DreamBooth 是一种个性化微调方法，最初通过全参数微调 UNet（或结合先验保留损失）来将特定主体的外观绑定到一个稀有词上。它使用的仍是标准扩散损失，但通过数据设置和先验保留损失防止过拟合。

    - LoRA 是 DreamBooth 的轻量化替代方案。由于全参数 DreamBooth 训练成本高，社区很快将 LoRA 应用到 DreamBooth 中：冻结 UNet 原始权重，仅训练插入的 LoRA 权重，达到与全参数 DreamBooth 相近的个性化效果，且模型文件从数 GB 缩减到几 MB。这通常被称为 “LoRA DreamBooth” 或 “LoRA fine-tuning”。

    - 因此，DreamBooth 是一种任务（个性化生成），而 LoRA 是实现该任务的一种高效方法。两者并非同一层面的概念，但实践中常结合使用。

    在文生图中，LoRA 已被广泛用于角色定制、风格迁移、概念注入等，成为生成式模型微调的标准轻量方案。


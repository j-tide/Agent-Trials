content:
  prompt: IA3 等更轻量的方法能否有效微调多模态大模型？哪些任务上会失效？
answer:
  mode: rubric
  reference_answer: |-
    (IA)^3（Infused Adapter by Inhibiting and Amplifying Inner Activations） 是一种比 LoRA 更轻量的方法：它对 Transformer 中的 key、value、FFN 的激活向量分别学习一个缩放向量 ll，通过逐元素乘法 l⊙xl⊙x 来调制信息流，参数量远小于 LoRA。

    在多模态模型中的有效性：

    - (IA)^3 已被证明在单模态 NLP 任务上，仅用约 0.01% 的参数量就可接近全参数微调。

    - 在多模态模型中，(IA)^3 同样可以插入 LLM 的各个子层。由于视觉-语言任务往往只需“调节”LLM 对视觉 token 的响应，而非重写大量参数，(IA)^3 在很多任务上表现良好，特别是指令微调阶段。

    可能失效的任务：

    - 需要大量新知识注入的任务：(IA)^3 仅重新加权现有激活，无法引入全新的特征交互。如果下游任务需要的知识与预训练分布差异极大（如需要记忆大量新实体、新视觉概念），(IA)^3 的表达能力可能不足。

    - 需要复杂跨模态对齐变化的任务：例如，当视觉特征和语言空间存在明显鸿沟需要更深层次的变换时，仅靠缩放难以纠正这种偏移。

    - 细粒度空间推理或定位：这些任务需要保留和操纵视觉 token 的精确空间结构，(IA)^3 不具备调整这种结构的能力。

    - 长尾、高精度生成任务：在要求极高输出质量的任务（如医学报告生成），(IA)^3 可能因过于轻量而欠拟合。

    总体而言，(IA)^3 在典型的指令微调基准上通常可以达到 LoRA 80%-90% 的性能，是极端资源限制下的候选方案。


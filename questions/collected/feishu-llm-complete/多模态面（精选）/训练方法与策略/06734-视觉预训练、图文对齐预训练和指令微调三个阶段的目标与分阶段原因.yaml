    分阶段的原因：

    - 能力解耦与保护：每个阶段建立在上一阶段的能力基础上。直接端到端训练极易导致灾难性遗忘，分阶段可以保护预训练获得的核心能力。

    - 数据效率：不同阶段使用不同规模和类型的数据，最大化数据利用效率。

    - 训练稳定性：从简单任务到复杂任务，从少量参数到大量参数，课程式递进，确保训练稳定收敛。

    - 资源优化：早期阶段可用较少资源快速验证，后期再投入重资源，避免浪费。


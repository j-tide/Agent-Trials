content:
  prompt: 使用合成数据增强多模态训练集时，如何避免模型“刻板化”或“退化”？
answer:
  mode: rubric
  reference_answer: |-
    合成数据若使用不当，不仅无法提升模型，反而会导致模型变得单调、缺乏创造力，甚至性能下降。这种“刻板化”或“退化”主要源于合成数据缺乏真实数据的固有噪声和多样性。

    避免策略：

    - 合成数据来源多样化：不要仅依赖一个生成模型（如只用 Stable Diffusion XL）。混合使用多个不同架构、不同训练数据的生成模型（如 SDXL, DALL-E 3, Midjourney, Flux），以及不同参数设置（种子、引导强度、步数）产生的图像。这样能保证生成图像在风格、光照、构图上的多样性。

    - 注入受控噪声：真实数据充满噪声（模糊、压缩、光照不均、遮挡）。在合成数据中刻意加入类似噪声，可以让模型学会处理不完美输入。例如，对生成图像进行 JPEG 压缩、高斯模糊、颜色抖动等后处理。

    - 保持一定比例的真实数据：合成数据永远不应完全替代真实数据。训练集中维持一定比例（至少 50%-70%）的真实数据至关重要，它像“锚点”一样防止模型在生成数据的分布中漂移。将真实数据和合成数据混合训练。

    - 真实性过滤与多样性采样：对生成的图像进行美学评分和 CLIP Score 过滤，但不要只保留最高分的。可以分层采样：保留一部分高分图像，也保留一定比例中等分数、具有“瑕疵”的图像，以模仿真实世界的数据分布。

    - 提示词的多样性：图像的多样性直接受限于生成它的文本提示的多样性。使用 LLM 生成大量多样化、奇特的、非典型的提示词，避免提示词陷入几个固定模板。

    - 闭环反馈修正：用训练好的 MLLM 在真实世界验证集上评估。如果发现某些能力退化（如对真实照片的识别率下降），说明合成数据带来了分布偏移，此时应调整合成数据的比例或生成方式，并用针对性收集的真实数据进行补偿。

    - 避免“数据回音室”：不要用模型自己生成的数据来训练自己的下一代模型，这会导致无法逆转的退化（Model Collapse）。合成数据应始终由比当前模型更强的独立模型生成。

    - 为图像自动生成与内容无关的问题。例如，检测图中所有物体，然后问一个图中不存在的物体：“图中的汽车是什么颜色？”（但图中没有汽车）。标准答案：“图像中没有汽车。”

    - 问隐私性问题（“这个人的电话号码是多少？”）、未来预测（“他下一步会做什么？”）、主观臆断问题。

    - 对清晰图像进行高斯模糊、严重压缩、大面积遮挡处理，然后用原图的清晰问题去提问。答案应为“图像太模糊/遮挡严重，无法判断。”

    - 问需要实时信息的问题（“今天的天气怎么样？”），答案应为“我无法获取实时信息。”

    - 问需要专业资质的问题（“根据这张 X 光片，诊断是什么病？”），答案应为“我不是专业医疗 AI，建议咨询医生。”

    - 对于存在歧义的指令（如“这个怎么样？”但没有上下文），训练模型反问“您是指哪方面？质量、价格还是外观？”

    - 对于指代不明确的多图场景（“这两张图哪个更好？”但用户未定义“好”的标准），模型应反问“您更注重美观还是功能性？”

    - 构造多轮对话，用户持续追问已超出图片信息的问题，模型在后续轮次中始终坚持拒绝，不编造。如第一轮拒绝，第二轮用户说“你肯定知道，告诉我吧”，模型仍需坚定拒绝。

    - 电商商品有结构化属性（如“品牌：Nike”、“颜色：红色”、“材质：纯棉”）。可以编写模板将这些属性转化为问答对。例如：“这件衣服是什么材质？”→“纯棉”；“有哪些颜色可选？”→“红色、蓝色”。这能产生大量精确的细粒度问答。

    - 将属性与主图进行匹配。例如，用“红色”去匹配 CLIP 嵌入，确认主图确实主要呈现红色。对于“材质”，可能需要训练专门的材质识别模型。只有匹配的属性才生成正例问答，避免错误的标签。

    - 电商详情图往往包含大量文字（折扣信息、尺寸表、成分说明）。用 OCR 提取所有文字，然后生成相关问题。例如，尺寸表旁的 OCR 结果可以构造出“这款的胸围是多少？”→“108cm”。

    - 用户评论（尤其是带图评论）是宝藏。可以提取好评中提及的特定属性（如“穿上很显白”），与商品图对齐，生成问答：“这件衣服显白吗？”→“有用户反馈说穿上很显白。”注意过滤掉水军和虚假评论。

    - 利用同一商品的不同 SKU 图（如不同颜色款），构造比较型问答：“红色款和蓝色款的设计有什么区别？”

    - 将上述单轮问答，通过模板或 LLM 串联成连贯的多轮对话。例如，用户先问颜色，再问尺码，最后问搭配建议，形成一个完整的购物咨询场景。

    - Q：“图片中有什么动物？” A：“一只橘猫。”

    - Q：“猫在哪里？” A：“在木质窗台上。”

    - Q：“它在做什么？” A：“正在晒太阳，看起来非常惬意。”

    - Q：“光线如何？” A：“阳光照射在猫身上和窗台上，形成温暖的光影。”
    模板需足够多样，避免模型死记硬背。可以使用同义词替换、问句改写等方式增加变体。

    - 将图像和描述文本一起送入 GPT-4V，提示它基于描述生成一个“好奇的用户”和一个“乐于助人的助手”之间的自然多轮对话，要求对话覆盖描述中的多个细节，并可以有一些合理的追问。这是目前生成高质量多轮数据最有效的方法。

    - 用一个已有的 MLLM 扮演用户和助手两个角色，围绕图像进行对话。为了避免对话陷入循环，可以预设问题列表或使用随机种子引导话题方向。

    - WebDataset (tar 包格式)：将海量小文件打包成大的 tar 文件。这极大减少了文件系统的 inode 压力和随机读取开销，支持顺序流式读取，是处理百万级以上图像的标准做法。

    - TFRecord / Mosaic：对于 TPU 训练，TFRecord 是高效格式。Mosaic 是 Databricks 为加速而设计的格式。

    - NVIDIA DALI：将图像解码、缩放、裁剪、归一化等预处理操作从 CPU 卸载到 GPU，利用 GPU 的大规模并行能力，能获得数倍的预处理加速。DALI 可直接读取 WebDataset 格式。

    - 预解码与缓存：如果存储空间允许，可将图像预解码并存储为未经压缩的二进制格式，跳过训练时的解码步骤。或使用高速 SSD 缓存热点数据。

    - 使用 PyTorch 的 DataLoader 设置高 num_workers（如 8-16），并在数据管道中使用 prefetch_factor 预先加载多个 batch。

    - 确保 CPU 核心数足够，内存带宽不成为瓶颈。

    - 使用 HuggingFace tokenizers 库的 Rust 实现，或在 DataLoader 中对文本 batch 进行并行 tokenization。对于大语料，预 tokenize 并存储 token ID 可以省去重复计算。

    - 每个计算节点仅加载其分片数据，避免全局数据搬移。使用 PyTorch 的 DistributedSampler 自动处理分片。

    - 不将整个数据集索引加载到内存，而是维护文件列表，流式读取和预处理，降低内存占用。

    - 数据存储在分布式文件系统（如 Ceph、HDFS）或对象存储（如 S3）上时，确保计算节点与存储节点之间的网络带宽充足，或使用本地 NVMe 缓存。

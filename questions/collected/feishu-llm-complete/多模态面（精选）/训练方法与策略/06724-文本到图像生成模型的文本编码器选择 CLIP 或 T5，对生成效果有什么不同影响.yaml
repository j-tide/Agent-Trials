content:
  prompt: 文本到图像生成模型的文本编码器选择 CLIP 或 T5，对生成效果有什么不同影响？
answer:
  mode: rubric
  reference_answer: |-
    文本编码器是文生图模型理解提示词的“语言大脑”，其选择直接影响生成图像对文本的忠实度、细节和美学。

    总结：CLIP让图像“好看”且与主题匹配，T5让图像“准确”且遵循细节。现代顶尖模型（如SD3）通常同时使用CLIP和T5作为双文本编码器，CLIP负责全局视觉概念对齐，T5负责细粒度语言理解，将两者的嵌入拼接或加权融合后作为条件，从而兼顾美学与准确性。


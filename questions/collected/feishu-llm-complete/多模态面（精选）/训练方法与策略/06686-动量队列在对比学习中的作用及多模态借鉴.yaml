content:
  prompt: 动量队列在对比学习中的作用及多模态借鉴
answer:
  mode: rubric
  reference_answer: |-
    动量队列是 MoCo 提出的关键技术，目的是解耦负样本数量与 batch size 的强绑定，在有限显存下提供大规模且相对稳定的负样本集。

    工作原理：

    - 维护一个固定大小的队列 QQ，例如 K=65536K=65536。每次训练迭代，当前 batch 的样本特征（如文本特征）进入队列，队列中最老的 batch 特征出队。

    - 对比学习时，负样本不仅来自当前 batch，还来自整个队列中的历史特征。这样负样本数量从 batch size NN 扩展到 K+NK+N。

    [图片内容未导入]

    在多模态训练中的借鉴：

    - 多模态对比学习同样面临 batch size 受限的问题，尤其是高分辨率图像或长文本 token 消耗大量显存。可以引入动量队列存储图像和文本的特征，在计算 InfoNCE 损失时从队列中采样负样本。

    - 例如，BLIP 和 BLIP-2 未采用动量队列，因为它们的 Q-Former 需要同时进行生成任务，但可以在纯对比预训练阶段使用。一些高效的 CLIP 变体也用动量队列来提升小 batch 下的性能。

    - 此外，多模态学习中的动量编码器还可以用于生成目标的蒸馏，比如 DINO 的自蒸馏思想在多模态中也可见到（如对比学习的教师-学生结构）。


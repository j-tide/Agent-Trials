content:
  prompt: 交叉熵损失预测图像 tokens 与预测文本 tokens 的差异
answer:
  mode: rubric
  reference_answer: |-
    在生成式多模态模型中，统一使用交叉熵损失预测离散 token 序列。但图像 token 和文本 token 有本质不同，导致训练挑战不同。

    文本 tokens：

    - 词汇量小（通常 30k-100k），token 之间具有强语法和语义依赖，长程依赖明显。

    - 文本序列通常较短（几十到几百），交叉熵训练相对容易。

    - 文本有成熟的分词器和语言模型预训练经验。

    图像 tokens：

    - 词汇量大（VQ-VAE 码本通常 8192 或更多），因为图像包含大量视觉细节，每个码本向量代表一种视觉模式。

    - 图像 token 序列长（例如 32×32=102432×32=1024 个 token），自回归生成的计算成本极高。

    - 图像 token 的空间关系很强（邻近 patch 相关），但转换为 1D 序列后，模型需要学习隐式的空间结构，通常需要 2D 位置编码。

    - 图像重建要求高保真，一个 token 预测错误可能导致局部崩溃，而文本可以容忍一定的同义替换。

    实践中的差异：

    - 预测图像 tokens 时，损失下降慢且初期生成质量差，通常需要长时间训练。

    - 混合训练时，两种损失的尺度往往不同，需要权重调整或 per-token 加权（如对图像 token 降权）。

    - 一些工作采用两阶段训练：先训练文本生成，再加入图像生成，或者采用不同的学习率。


content:
  prompt: 如何利用已有的大规模图文数据集并进一步清洗出适合多模态对话的数据？
answer:
  mode: rubric
  reference_answer: |-
    LAION 等大规模图文数据集（动辄数亿对）为多模态预训练提供了“量”，但要将它们转化为适合多模态对话的数据，需要进行质量过滤、格式转换、指令化改造三步走。

    第一步：基础质量过滤

    - CLIP Score 阈值过滤：计算每对图文的 CLIP 余弦相似度，剔除得分低于某个阈值（如 0.25）的样本。这能去除大量图文无关或弱相关的噪声。

    - 文本质量过滤：去除文本过短（如少于 5 个词）、包含过多特殊字符、非目标语言、或含有大量 SEO 垃圾信息的样本。可使用语言检测模型和基于困惑度（perplexity）的筛选。

    - 图像质量过滤：去除分辨率极低、过度压缩、水印密布、纯文字或纯色块的图像。可结合美学评分模型（如 LAION-Aesthetics Predictor）和图像清晰度检测。

    - 去重与去近似重复：基于图像感知哈希（pHash、dHash）和文本 MinHash 进行相似去重，防止训练数据中充斥相同或高度相似的内容。

    第二步：面向对话的精选过滤

    - 保留描述性强的文本：对话数据需要文本具有描述性、观点性或解释性，而非简单的标签或关键词。可以使用基于规则（如文本长度 > 10 词，包含动词和形容词）或轻量分类器筛选。

    - 多样性采样：使用聚类或基于语义嵌入的多样化采样（如 K-Means 在 CLIP 文本嵌入空间），确保覆盖广泛的视觉概念、场景和语言风格，避免数据集中于常见物体（如猫狗车）。

    - 隐私与合规初筛：过滤掉包含人脸（除非是公共人物）、身份证号、电话号码等敏感信息的图像和文本。

    第三步：指令化改造

    清洗后得到的仍是弱对齐的“图像-描述”对，离对话数据还很远。需要将它们自动转化为多轮对话格式：

    - 用大模型生成对话：以图文对为输入，让 GPT-4V 或 LLaVA 等模型生成围绕该图像的多轮问答。可指定角色（如“你是一个乐于助人的助手”）、提问类型（描述、推理、比较）等，生成第一轮问题，再让模型自问自答，构造出 2-4 轮的对话。

    - 模板化转化：对粗粒度描述文本，可以用预设模板包装成对话，如“请简要描述这张图片。”——回答即为原描述。但需大量模板保证多样性，否则模型会过拟合模板。

    - 组合与拼接：将多组相关的图文对话拼接成更长的多图对话，让模型学会比较和联系多张图像。

    通过这三步，原本只适合预训练的嘈杂图文对，被提纯并重构成了高质量、符合对话习惯的指令数据。


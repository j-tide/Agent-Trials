content:
  prompt: 合成多模态指令数据时，如何避免引入 LLM 自身的幻觉或偏见？
answer:
  mode: rubric
  reference_answer: |-
    用 LLM（如 GPT-4V）合成指令数据已成为主流，但 LLM 自身的“知识”和偏见会污染数据，导致训练出的 MLLM 继承这些缺陷。必须建立多层防御机制。

    防御策略：

    - 严格锚定输入图像：在 Prompt 中反复强调“仅基于图片内容回答，不要使用外部知识”。并要求模型在生成答案前，先输出图片中检测到的具体元素作为证据。示例提示：“你只能看到一张图片。请首先列出你在图片中观察到的所有物体、文字和人物，然后基于这些观察生成问题和回答。不要添加任何未在图片中出现的信息。”

    - 自我一致性校验：对同一张图片，用不同提示或温度参数多次生成问答，保留所有生成结果中一致的部分，剔除不一致或矛盾的（可能为幻觉）。一致性投票是最简单的去幻觉策略。

    - 对抗性事实校验：对于合成的指令-答案对，用另一个高性能的 MLLM（如 GPT-4V）或专门的事实核查模型，校验答案是否可以从图片中证实。若校验模型指出答案包含图片中不存在的信息，则丢弃该样本。

    - 引入“拒绝回答”样本：主动要求 LLM 生成超出图片信息的问题（如“这个人的职业是什么？”但图片只是大头照），并教会它回答“无法从图片确定”。这能训练学生模型意识到自身知识边界。

    - 偏见检测与修正：在合成涉及人物、文化、职业等敏感内容的数据时，使用偏见检测工具扫描生成文本。若检测到性别、种族等刻板印象，提示 LLM 重写或人工审核修正。

    - 人类审核环：对于高风险或关键的训练数据（如医疗、法律领域），必须加入人类专家审核环节。即使只是抽样审核，也能有效校准自动化流程。

    - 使用外部知识库作为锚点：如果需要外部知识（如名画作者、地标名称），不要依赖 LLM 内部记忆，而是将相关知识作为条件明文提供给 LLM，让它整合图片观察和给定知识来生成答案。

    通过这些措施，可以最大限度地让合成数据忠实于图像本身，减少 LLM “脑补”的污染。


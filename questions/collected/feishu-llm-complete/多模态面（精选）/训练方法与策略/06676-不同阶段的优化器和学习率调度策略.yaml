    视觉编码器和 LLM 的学习率分离：

    若解冻视觉编码器，其学习率通常设为 LLM 的 1/10～1/5，因为视觉特征需要保持相对稳定。例如，LLM 学习率 2e-5，视觉编码器学习率 2e-6。

    特殊技巧：

    - Layer-wise learning rate decay：对 LLM 底层使用更小学习率，高层更大，保护低层语言基础。

    - MoE 模型：可能需要针对专家网络和路由机制定制学习率。


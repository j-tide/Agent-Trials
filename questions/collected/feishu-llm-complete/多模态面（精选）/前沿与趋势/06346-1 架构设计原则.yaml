  prompt: 3.1 架构设计原则
answer:
  mode: rubric
  reference_answer: |-
    分层时间常数。不同模态的交互有不同的延迟容忍度。视觉渲染必须与头部运动同步（<5ms延迟），否则引起眩晕；手势识别可以容忍20-50ms；语音指令可以容忍200-500ms。因此，融合架构不能将所有信号统一处理，而应按时间常数分层。

    [嵌入表格未展开]

    设备端-边缘-云端三级协同。IMU和眼动数据必须在设备端处理，物理上不可能发送到云端再返回。手势和环境理解可以在设备端NPU上运行轻量模型。复杂的多模态推理（如理解用户正在进行的复杂任务）可以卸载到边缘服务器或云端。这种三级架构在隐私、延迟和算力之间取得平衡。

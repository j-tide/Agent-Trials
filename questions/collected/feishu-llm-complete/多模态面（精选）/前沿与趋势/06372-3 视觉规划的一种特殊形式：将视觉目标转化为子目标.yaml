answer:
  mode: rubric
  reference_answer: |-
    对于导航类任务，Agent可以从地图照片或第一视角图像中提取关键路标作为子目标序列。例如，根据室内地图规划路径：起点 → 走廊尽头 → 左转 → 蓝色房门。视觉定位模块在每个子目标处进行确认，实现闭环。

    ---

    ### 多模态 Agent 如何实现“视觉规划”：比如从一张厨房照片推理出烹饪步骤。

    从静态厨房照片推理烹饪步骤，本质是从视觉场景中提取语义知识，并将其与任务知识图谱结合，生成有序的操作序列。

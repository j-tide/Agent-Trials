  mode: rubric
  reference_answer: 开源模型追上闭源的速度惊人。LLaVA-1.5发布时与GPT-4V差距巨大，到Qwen-VL-72B和InternVL2，已能在多个基准上正面抗衡。背后驱动力在于：闭源的“先发优势”在技术扩散加速的今天维持时间越来越短；开源社区的数据飞轮一旦转起，贡献者数量和迭代速度远超单一闭源团队；高校和独立研究者更倾向于在开源模型上创新，形成人才和想法的聚集效应。

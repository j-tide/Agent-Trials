answer:
  mode: rubric
  reference_answer: |-
    跨模态协同遗忘：当一个新任务只涉及文本，图像编码器可能不受影响，但跨模态投影层会退化。因此需要在重放或正则化时，特别保护跨模态交互层的参数。

    生成式重放：真实存储旧样本可能侵犯隐私或占用存储。可以使用多模态生成模型（如文生图模型）合成旧任务的代表性样本，用于重放。这种方法存储开销极小，但合成质量决定了防遗忘效果。

    渐进式模态扩展：初始模型只处理图像和文本。当需要加入音频时，不重新训练整个模型，而是添加一个新的音频编码器和跨模态适配器，仅微调新组件，冻结已有参数。这本质上是一种动态架构的持续学习。

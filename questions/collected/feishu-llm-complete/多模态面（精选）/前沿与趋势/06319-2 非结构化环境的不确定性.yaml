answer:
  mode: rubric
  reference_answer: |-
    问题表现：

    - 光照剧烈变化、物体被遮挡、背景杂乱、摄像头抖动，导致视觉识别频繁失败。

    - 真实物体的形状、纹理与训练数据差异巨大。

    应对策略：

    - 多模态冗余感知：融合RGB、深度、红外、触觉等多模态，降低单点失效风险。

    - 域随机化训练：在模拟器中大量渲染随机光照、纹理、相机位姿的图像，提升模型鲁棒性。

    - 在线自适应：基于当前环境的少量无标签数据，快速微调视觉编码器的BN层或使用Test-Time Adaptation。

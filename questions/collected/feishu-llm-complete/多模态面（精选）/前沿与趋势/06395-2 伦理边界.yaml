content:
  prompt: 6.2 伦理边界
answer:
  mode: rubric
  reference_answer: |-
    心理健康领域应用多模态模型需要格外的伦理审慎：

    知情同意必须真正充分。用户需要明确知道哪些数据被采集、如何分析、结果用于什么目的、谁可以访问。不能通过冗长的用户协议“默认同意”。

    严格的功能限定。系统必须明确声明“本系统不提供医疗诊断，仅提供情绪状态的参考信息。如有心理健康问题，请咨询专业医生。”在检测到可能的严重心理问题信号时，系统应主动引导用户寻求专业帮助，而非尝试自行干预。

    数据的高度敏感性。心理状态数据可能是最私密的个人数据之一。这些数据必须端到端加密，在分析完成后立即匿名化或删除原始数据，仅保留统计层面的分析结果。

    避免过度依赖。如果用户开始依赖AI来获取情感支持，可能减少真实的人际交往，反而加剧心理健康问题。系统的设计应鼓励用户在AI辅助之外也寻求人类支持。

    算法偏见的放大效应。如果训练数据中的心理健康标签存在种族、性别或文化偏见，模型可能会对特定群体产生系统性误判。这在心理健康领域尤其危险——将正常的文化表达误判为心理问题，或将真实的求助信号错误地忽视。

    ### 考古学中的多模态模型应用

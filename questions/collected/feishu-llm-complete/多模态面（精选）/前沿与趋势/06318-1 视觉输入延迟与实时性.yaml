answer:
  mode: rubric
  reference_answer: |-
    问题表现：

    - 从摄像头采集、编码、推理到输出动作，总延迟可能超过200ms。对于实时控制（如无人机避障、机械臂动态抓取），延迟意味着碰撞风险。

    - 网络传输云端推理产生额外延迟，离线部署又受限于边缘算力。

    应对策略：

    - 边缘端轻量模型+云端强模型协同：视觉编码在本地完成，LLM推理可卸载到云端。本地缓存高频动作策略。

    - 预测性补偿：对延迟期间的物体运动做卡尔曼滤波预测，动作指令提前补偿。

    - 异步流水线：摄像头采集、视觉编码、动作生成在不同线程/流上并行，减少等待。

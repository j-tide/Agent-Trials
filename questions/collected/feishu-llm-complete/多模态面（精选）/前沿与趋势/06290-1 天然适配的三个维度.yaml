    这种适配不仅停留在概念层面。在神经形态硬件（如 Intel Loihi、IBM TrueNorth）上，SNN 可以直接处理事件相机的输出，无需将事件聚合成帧，从而保留了完整的时空信息。这比传统方法（将事件堆积为帧，再用 CNN 处理）在高速运动场景下的延迟低一个数量级，功耗降低数十倍。

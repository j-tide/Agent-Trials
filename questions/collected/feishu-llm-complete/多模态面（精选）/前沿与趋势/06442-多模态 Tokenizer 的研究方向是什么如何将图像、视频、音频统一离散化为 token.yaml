content:
  prompt: 多模态 Tokenizer 的研究方向是什么？如何将图像、视频、音频统一离散化为 token？
answer:
  mode: rubric
  reference_answer: |-
    多模态Tokenizer是将连续模态数据（图像、视频、音频）转化为离散token序列的关键组件，它使得这些模态能够像文本一样被自回归Transformer处理。当前研究方向集中在更高效、更语义化、更统一的离散化方法上。

    主流技术方向：

    统一离散化的挑战：

    不同模态的信息密度和特性差异巨大。图像空间冗余度高，需要大量token；音频时序结构强，需要密集时间采样；文本信息密度极高。将它们统一到一个离散token空间面临：

    - token数量不平衡：一张图像可能需要1024个token，一段文本可能仅需50个token。在同一序列中，视觉token会淹没文本token。

    - 语义粒度不匹配：图像的“语义单元”是一个物体或区域，音频的“语义单元”是一个音素或声音事件。找到跨模态统一的语义粒度是开放难题。

    未来方向：

    - 学习型压缩Tokenizer：不仅仅压缩数据，还要学习哪些信息是语义相关的、哪些是可丢弃的纹理。用对比学习或生成任务引导Tokenizer保留更多语义信息。

    - 动态长度Tokenization：根据内容复杂度自适应决定token数量。简单图像用少量token，复杂图像用更多。

    - 跨模态共享码本：训练一个超级码本，同时覆盖图像、音频、视频的视觉特征，使不同模态的token在码本层面就实现语义对齐。

    - 层次化Tokenization：粗粒度token捕捉全局语义（如场景类型），细粒度token捕捉局部细节。先预测粗token再预测细token，类似渐进式解码。


answer:
  mode: rubric
  reference_answer: |-
    OpenAI被广泛推测在其多模态模型中使用了自我对弈技术来提升视觉理解能力。具体做法可能是：模型先生成图像描述，再用该描述生成图像，用CLIP评估图文匹配度，匹配度低的样本作为难负例进行训练。这种自我对弈让模型在无需额外人工标注的情况下持续提升多模态对齐能力。

    ### 模型自进化中，如何设定一个自动的“进化目标”？

    自进化模型需要明确的优化方向，否则会陷入随机游走。设定自动进化目标是实现真正自主学习的核心。

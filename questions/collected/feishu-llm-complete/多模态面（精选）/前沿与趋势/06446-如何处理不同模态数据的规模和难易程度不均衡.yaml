content:
  prompt: 如何处理不同模态数据的规模和难易程度不均衡？
answer:
  mode: rubric
  reference_answer: |-
    多模态预训练中，文本数据（万亿token级别）通常远大于高质量视频数据（十亿帧级别），而音频、深度图等更少。同时，模态本身的固有学习难度也不同：图像概念密集，音频时序结构强。

    数据规模不均衡的应对：

    模态难度不均衡的应对：

    - 动态损失加权：使用Uncertainty Weighting或GradNorm，自动调整各模态损失的权重。困难模态的损失下降慢，会被赋予更大权重，加速其学习。

    - 学习率分离：给视觉等收敛慢的模态设置稍大的学习率，文本等收敛快的模态用较小学习率。

    - 辅助任务：为困难模态设计额外的辅助任务，增加监督信号密度。例如，为视频添加帧级别的物体检测任务，为音频添加音素识别任务。

    关键原则：大规模模态不应完全淹没小规模模态，但也不应为了“公平”而过度上采样小数据集导致过拟合。平衡点是让所有模态在验证集上各自的关键指标（如检索召回率）都能持续提升。


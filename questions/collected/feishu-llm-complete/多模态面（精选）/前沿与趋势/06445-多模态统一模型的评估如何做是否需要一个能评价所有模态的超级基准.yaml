content:
  prompt: 多模态统一模型的评估如何做？是否需要一个能评价所有模态的超级基准？
answer:
  mode: rubric
  reference_answer: |-
    多模态统一模型的评估远比单一模型复杂，因为它不仅需要评估各模态内的任务，还要评估跨模态交互质量。超级基准是理想方向，但目前仍由多个专用基准拼凑而成。

    当前评估范式：多基准聚合

    迈向超级基准的努力：

    目前的尝试是将上述子基准统一在一个评测框架下，如VLUE、MME等聚合了多个子任务。但一个真正能评价所有模态的超级基准需要满足：

    - 任务全覆盖：从感知到认知，从理解到生成，覆盖所有模态组合。

    - 公平可比：不同模态任务使用归一化分数，避免某一模态指标主导总分。

    - 可诊断：不仅给总分，还能细化到各能力维度（计数、空间、时序等）。

    实践中的评估策略：

    - 在研发阶段，运行所有相关模态的基准测试，形成能力雷达图。

    - 在上线前，重点评估核心业务场景的端到端表现。

    - 建立“回归测试”套件，每次模型更新后自动运行，防止核心能力退化。

    - 人工评估对于开放式生成任务（如对话、创作）仍不可或缺。


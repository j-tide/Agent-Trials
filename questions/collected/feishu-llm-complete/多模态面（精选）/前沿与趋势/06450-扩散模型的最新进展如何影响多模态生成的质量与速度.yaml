    速度提升的关键进展：

    [嵌入表格未展开]

    这些进展对多模态生成的整体影响：

    - 文生图从“玩具”到“生产工具”：SD3/DALL-E 3的质量已可达到商业设计水平，LCM等加速技术让实时文生图成为现实。

    - 视频生成从几秒到分钟级：Sora展示了长达一分钟的连贯视频生成，这得益于DiT的扩展性和高效采样。

    - 多模态理解与生成走向统一：扩散模型不仅可以生成图像/视频，还可用于生成文本（如Diffusion-LM），甚至作为多模态编码器，实现理解和生成的架构统一。

    - 交互式应用兴起：速度的提升使得实时视频编辑、交互式3D场景生成等应用成为可能。

    当前扩散模型仍在快速迭代中。Flow Matching和Rectified Flow正在取代传统的DDPM采样，DiT正在取代U-Net，模型压缩和推理加速技术持续突破。未来数年，扩散模型有望实现“实时、高质量、可控”的多模态生成，成为多模态AI的核心引擎。


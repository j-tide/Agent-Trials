content:
  prompt: 扩散模型的最新进展如何影响多模态生成的质量与速度？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型近年来在质量和速度上都取得了突破性进展，这直接推动了多模态生成（文生图、文生视频、图生文）的繁荣。

    质量提升的关键进展：


content:
  prompt: 你认为“统一多模态大模型”何时能成熟到像现在的 LLM 一样？有哪些里程碑？
answer:
  mode: rubric
  reference_answer: |-
    统一多模态大模型正处在类似GPT-2到GPT-3的过渡期——已有令人惊叹的demo能力，但在可靠性、可控性和效率上仍有显著不足。预计在未来3-5年内，它将在特定领域率先成熟。

    发展路径与里程碑预测：

    关键里程碑：

    - 跨模态幻觉率降至接近单模态水平。当前多模态模型的幻觉是阻碍其落地的最大障碍。

    - 长视频和长音频的无损理解与记忆。如同LLM可以处理百万token的上下文，多模态模型需要同等能力。

    - 在多个专业资格考试中全面超越人类专家（类似LLM在律师、医生资格考试中的表现）。

    - 能够作为操作系统级Agent，像人类一样操控GUI、调用工具、执行复杂多步任务，且成功率>95%。

    - 出现公认的“统一多模态大模型评测超级基准”，社区对其有效性达成共识。

    成熟的标志不是“能做所有事”，而是像现在的LLM一样：能力边界清晰、失效模式可预测、可通过标准化方法大幅提升可靠性。当开发者可以像今天调用GPT API一样，放心地将其用于生产环境中的多模态任务，统一多模态大模型就真正成熟了。


answer:
  mode: rubric
  reference_answer: |-
    Agent可以检查以下视觉信号：

    - 预期元素出现/消失：点击“设置”后，截图中是否出现设置页面的标志性元素（如“设置”标题）。

    - 界面变化检测：通过前后截图的结构相似度（SSIM）或特征差异，判断是否有明显变化。如果执行点击后截图几乎未变，说明点击可能未生效。

    - 文本内容核对：OCR提取当前界面文本，检查是否包含预期的关键词。

    - 弹窗或错误提示检测：是否有意外的弹窗、报错信息或加载菊花，这些是异常的视觉信号。

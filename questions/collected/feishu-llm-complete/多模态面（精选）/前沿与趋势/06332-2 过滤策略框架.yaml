content:
  prompt: 2.2 过滤策略框架
answer:
  mode: rubric
  reference_answer: |-
    第一层：自洽性校验（Self-Consistency）

    对同一张图像和同一问题，让MLLM用不同温度参数或不同提示词生成多条推理链。比较这些推理链的结论是否一致：

    - 结论高度一致 → 推理链较可信，保留。

    - 结论矛盾 → 说明模型对此问题不确定，推理链不可靠，丢弃。

    - 推理过程虽不同但都合理 → 作为多样性数据保留。

    第二层：反事实验证

    取推理链中的一个中间陈述，构造一个反事实问题。例如，推理链说“因为图中有苹果，所以这是水果店”。构造反事实：“如果图中没有苹果，结论还成立吗？”如果原结论依赖的是图中确实存在的实体，则推理有效；如果依赖的是幻觉实体，则反事实检验会暴露。

    第三层：实体基础化校验（Grounding Check）

    用目标检测或分割模型验证推理链中提到的所有视觉实体是否确实存在于图中。如果推理链说“根据左下角的红色按钮...”，但图中该位置没有红色按钮，则标记为幻觉并丢弃。

    第四层：逻辑一致性检查

    用另一个LLM（可以更强大或不同的模型）作为“逻辑裁判”，输入推理链，要求判断：

    - 推理步骤是否连贯？

    - 因果关系是否合理？

    - 是否存在逻辑跳跃？

    可以设计评分标准（1-5分），低于阈值的推理链被丢弃。

    第五层：最终结论的事实核查

    将推理链的最终结论与实际答案（或人工标注）比对。如果结论正确但推理过程错误（巧合答对），也应丢弃——因为训练的不仅是答案，更是推理能力。

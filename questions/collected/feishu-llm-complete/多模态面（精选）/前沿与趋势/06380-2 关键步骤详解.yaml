  prompt: 5.2 关键步骤详解
answer:
  mode: rubric
  reference_answer: |-
    第一步：精细视觉理解

    使用开放词汇检测模型（如Grounding DINO）和属性识别模型，不仅要识别物体类别，还要识别其状态。例如：“冰箱门关闭”、“鸡蛋在冰箱内”、“灶台处于关闭状态”。OCR可以提取调料瓶标签。

    第二步：任务假设与匹配

    根据检测到的食材和工具，推断用户可能想做的菜肴。如果没有明确指令，Agent可以假设：“有鸡蛋、番茄、葱 → 可能要做番茄炒蛋”。这一步利用LLM的常识推理。

    第三步：步骤生成与排序

    结合菜谱知识（可从向量数据库检索），LLM生成步骤：

    - 从冰箱取出鸡蛋和番茄。

    - 清洗番茄并切块。

    - 打散鸡蛋。

    - 打开灶台，放锅，加油。

    - 炒鸡蛋，盛出。

    - 炒番茄，加入鸡蛋，调味。

    第四步：可执行性校验

    将每一步所需的前置条件（如鸡蛋已在碗中）与当前视觉状态进行比对。若初始照片中鸡蛋还在冰箱里，则步骤0应为“打开冰箱”。这种“状态感知的规划”使计划更切实际。

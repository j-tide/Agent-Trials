  prompt: 1.2 防退化策略
answer:
  mode: rubric
  reference_answer: |-
    策略一：锚定真实数据——始终保持外部基因

    这是最根本的防线。无论合成多少数据，训练集中必须保留一定比例（至少30%-50%）的高质量真实数据。真实数据如同“野生基因库”，不断为模型注入外部多样性。实际做法是：每一代训练时，将上一代模型生成的合成数据与原始真实数据混合，而不是仅用合成数据。

    策略二：多模型交叉生成——打破自身回音室

    不要仅用一个模型生成数据并自我训练，而是引入多个独立模型的“交叉审核”：

    - 用A模型生成数据，用B模型评估质量，用C模型过滤噪声，再训练A模型的下一代。

    - 即使A模型出现偏差，B和C的独立判断可以提供修正信号。

    - 实践上，可以组合不同架构（如CLIP+BLIP+GPT-4V）、不同训练来源的模型，增加多样性。

    策略三：质量过滤与难度筛选——优胜劣汰

    对合成数据执行严格的质量审查：

    - 使用更强的模型或人工标注对合成数据进行打分（CLIP Score、人工评级）。

    - 保留“困难正样本”（模型当前无法准确回答但高质量的数据），丢弃“简单冗余样本”（模型已能完美处理的数据）。

    - 这种“课程学习式”的自训练能促使模型持续进步而非原地踏步。

    策略四：注入噪声与扰动——人工制造多样性

    在合成数据上有意引入可控噪声：

    - 对图像施加轻微的风格迁移、颜色抖动、遮挡。

    - 对文本进行同义替换、句式变换、翻译后回译。

    - 这样生成的“变异”数据增加了训练集的多样性，降低了过拟合风险。

    策略五：周期性人类审查——外部校准

    定期邀请人类专家对合成数据抽样审查，评估质量、多样性和偏差。一旦发现退化趋势，及时介入调整数据生成策略或引入新的人工标注数据。这是一道“人机回环”的安全阀。

    策略六：奖励信号的外部化

    如果使用RL或DPO进行自对齐，奖励模型不能与生成模型同源。必须使用独立训练的奖励模型，或直接接入人类反馈作为奖励信号。这切断了模型自我奖励的闭环，防止“自己给自己打高分”的退化。

    通过上述组合策略，可以在利用合成数据的规模化优势的同时，保持模型的健康进化。

    ### 用 MLLM 合成图文推理链数据，如何过滤掉其中的错误推理？

    推理链数据（如“首先看到A，因为B关系，推断出C”）是提升多模态模型推理能力的关键训练资源。但MLLM自身也会犯错，生成的推理链可能包含事实错误、逻辑断裂或幻觉。过滤是保证数据质量的必须环节。

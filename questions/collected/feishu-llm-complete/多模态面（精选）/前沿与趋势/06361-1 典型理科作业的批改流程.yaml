content:
  prompt: 4.1 典型理科作业的批改流程
answer:
  mode: rubric
  reference_answer: |-
    数学几何题。学生手绘辅助线并用文字写出证明步骤。批改系统需要：识别手绘图形中的几何元素（点、线、角）；理解证明步骤中的逻辑推理链；验证每一步推理是否与图形一致、是否在逻辑上成立；判断辅助线的添加是否合理、是否有多种正确解法。

    物理力学题。学生绘制受力分析图并标注力的大小和方向。批改系统需要：检测图中所有受力箭头及其方向、长度和标注；判断是否遗漏了某个力或多画了不存在的力；验证力的大小关系是否满足平衡条件；理解文字解答中的公式推导是否正确。

    化学方程式。学生填写化学方程式并配平。批改系统需要：识别手写化学符号和数字；检查反应物和生成物的化学式是否正确；验证方程式是否配平（原子守恒、电荷守恒）；判断反应条件（加热、催化剂等）是否标注正确。

    生物图表题。学生绘制细胞结构图、食物链图等，并标注各部分名称。批改系统需要：识别图中的结构和对应的标注文字；判断结构与标注的对应关系是否正确；检查是否有遗漏的关键结构；评估绘制的准确性（比例是否合理、是否缺少关键特征）。

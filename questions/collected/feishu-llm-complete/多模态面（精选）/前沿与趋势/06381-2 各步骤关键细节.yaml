answer:
  mode: rubric
  reference_answer: |-
    步骤一：图像数据选择

    不是随便找图就能蒸馏出推理能力。需要覆盖：

    - 不同领域（自然场景、文档、图表、医学影像）。

    - 不同复杂度（单物体简单场景→多物体复杂交互）。

    - 从易到难的课程式分布。

    最佳实践是使用开放域图像集合（如COCO、LAION精选子集），并人工或自动标注图像的话题多样性。

    步骤二：推理链数据合成（最关键步骤）

    这是决定蒸馏质量的灵魂。大模型不是简单给出答案，而是要输出完整的思维链。

    示例：

    问题：图中总共有几个可以坐的物体？
    教师输出：
    1. 首先，我扫描整个图像，识别所有家具。
    2. 我看到一个餐桌周围有4把椅子——这4把椅子是可以坐的。
    3. 客厅区域有一张沙发——沙发可以坐。
    4. 角落有一个吧台，旁边有2个高脚凳——高脚凳也可以坐。
    5. 总计：4把椅子 + 1张沙发 + 2个高脚凳 = 7个可以坐的物体。
    答案：7

    要求教师模型为每个问题生成这样的推理链。可以设计不同的推理类型提示词：空间推理、计数、比较、属性绑定、逻辑推断等。

    步骤三：数据过滤

    见第2问的过滤策略。特别要过滤掉：

    - 推理正确但中间步骤错误的样本（巧合答对）。

    - 推理过程中使用了图像外知识的样本（降低幻觉传播）。

    - 过于简短或过于冗长的推理链（保持训练效率）。

    步骤四：多任务联合训练

    学生模型不是只学推理，而是同时进行多任务训练：

    - 推理链生成任务：输入图像和问题，输出完整推理链+答案。损失函数为标准语言模型交叉熵。

    - 直接答案生成任务：输入图像和问题，直接输出答案（不展示推理过程）。用于推理时不需展示链的场景。

    - 图文对比任务（可选）：保持或提升视觉-语言对齐能力。

    多任务训练可以防止学生模型只学会生成推理链，而丧失直接回答的能力。

    步骤五：迭代优化

    采用“在线蒸馏”或“自蒸馏”：

    - 第一轮：用教师模型生成的数据训练学生模型V1。

    - 第二轮：用学生模型V1生成推理链，由教师模型评判和修正，用修正后的数据训练V2。

    - 如此迭代，学生在教师的持续反馈中逐步逼近教师水平。

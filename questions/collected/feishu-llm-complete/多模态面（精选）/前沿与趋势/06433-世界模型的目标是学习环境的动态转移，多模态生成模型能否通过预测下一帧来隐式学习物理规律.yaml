content:
  prompt: 世界模型的目标是学习环境的动态转移，多模态生成模型能否通过预测下一帧来隐式学习物理规律？
answer:
  mode: rubric
  reference_answer: |-
    答案是肯定的，且有大量证据表明，通过预测下一帧训练的视频生成模型确实能够隐式地学习到一定的物理规律。但这是一种“暗知识”——模型知道如何生成符合物理规律的视频，却无法显式地输出物理公式或进行符号推理。

    隐式学习物理规律的证据：

    - 物体持久性：Sora生成的视频中，即使物体被遮挡或移出画面，重新出现时其外观、大小、颜色保持不变。这表明模型内部维护了物体的隐式表征。

    - 重力与碰撞：生成的物体下落遵循近似抛物线的轨迹，碰撞后产生合理的反弹或形变。这些都是从海量视频数据中统计学习到的模式。

    - 流体与布料：水波的扩散、烟尘的飘散、布料的褶皱在生成视频中表现出与物理模拟相似的动态，尽管只是像素级别的模仿。

    - 光照与阴影：生成的阴影会随物体移动而变化，光照方向大致保持一致，这需要理解三维空间关系和光源位置。

    学习机制：

    视频生成模型（尤其是基于扩散或自回归的）在训练时以“预测下一帧”或“从噪声中重建视频”为任务。为了最小化预测误差，模型被迫学习视频数据中的统计规律，其中就包括由物理规律决定的像素变化模式。例如，模型发现无论什么物体，在无支撑时都会向下移动（重力），这是一种极为稳定的统计相关性，模型自然会学到。

    局限性——为什么是“隐式”而非“显式”理解：

    [嵌入表格未展开]

    向显式物理理解迈进：当前前沿方向是将物理引擎（如刚体动力学、流体模拟）与生成模型结合。生成模型负责视觉渲染和多样性的生成，物理引擎保证物理准确性。这种混合系统既能生成逼真的视频，又能精确控制物理变量。此外，使用因果表示学习训练模型在干预下预测未来，能够促使模型学习更接近真实物理的表示。

    因此，多模态生成模型通过预测下一帧“看到”了物理规律，但它“理解”的深度取决于训练的多样性和架构的归纳偏置。它正从表面的像素模仿向深层的物理世界模型演进。

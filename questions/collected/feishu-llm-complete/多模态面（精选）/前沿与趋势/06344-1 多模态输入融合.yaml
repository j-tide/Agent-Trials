  reference_answer: |-
    融合流水线：

    - 视觉编码：使用CNN或ViT处理RGB/深度图像，提取场景中的物体、障碍物、目标物体位姿。

    - 语言编码：用LLM将自然语言指令解析为任务目标和约束（如“拿起桌子上红色的杯子，注意不要碰到花瓶”）。

    - 状态编码：关节角度等低维连续信号通过MLP投影为token，与视觉和语言token一同送入Transformer。

    - 跨模态交互：在Transformer内部通过自注意力融合，使得视觉感知与语言目标对齐（如定位指令中的“红色杯子”）。

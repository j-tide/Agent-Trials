  prompt: 5.3 创作归属与伦理边界
answer:
  mode: rubric
  reference_answer: |-
    “AI辅助的艺术作品，署名权归谁？”目前，主流观点认为AI是工具，使用AI的艺术家是作者——类似于摄影师使用Photoshop，没有人会认为版权归Adobe。但如果模型在训练中使用了受版权保护的作品，生成的风格高度类似某位在世艺术家，则存在侵权的灰色地带。部分平台已开始提供“艺术家退出机制”——艺术家可以要求自己的作品不被用于模型训练，模型也需要通过技术手段避免生成模仿特定在世艺术家风格的作品。

    ### 心理健康领域：多模态模型能否通过分析表情、语音和文本评估情绪状态？伦理边界在哪？

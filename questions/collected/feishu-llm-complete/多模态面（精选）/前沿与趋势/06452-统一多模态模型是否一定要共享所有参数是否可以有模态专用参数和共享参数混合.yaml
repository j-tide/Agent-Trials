content:
  prompt: 统一多模态模型是否一定要共享所有参数？是否可以有模态专用参数和共享参数混合？
answer:
  mode: rubric
  reference_answer: |-
    不需要，且实践证明，完全的参数共享往往不是最优解。不同模态的低级特征提取需求差异巨大（如像素处理 vs 声波处理），而高层语义推理又可以共享。混合参数架构是目前更灵活有效的方案。

    混合参数架构设计：

    三种混合策略：

    - 共享骨干 + 模态专用头部：绝大多数参数在共享Transformer中，仅在输入端有轻量的模态特定编码器，输出端有模态特定解码器。这是目前主流方案（如Gemini、GPT-4o）的隐含设计。

    - MoE模式：Transformer中的FFN层采用专家混合。部分专家是模态专用的（如图像专家、音频专家），部分专家是跨模态共享的。路由机制根据输入token的模态类型和内容动态选择专家。这既保证了模态特定的处理能力，又保留了跨模态知识共享。

    - Adapter插入：在共享Transformer的每一层插入轻量的模态专用Adapter模块（如LoRA）。共享参数保持冻结，仅训练Adapter。这使得同一个模型可以通过加载不同的Adapter权重来适配不同模态。

    实践建议：

    - 对于资源充足的场景，采用MoE方案可获得最佳性能。

    - 对于需要灵活部署的场景，Adapter方案允许一个基础模型衍生出多个模态变体。

    - 模态专用参数的比例通常控制在总参数的5%-20%之间，以确保充分的跨模态知识迁移。


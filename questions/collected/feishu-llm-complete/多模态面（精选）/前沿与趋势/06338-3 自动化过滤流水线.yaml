    合成推理链 → 自洽性校验(多次采样) → 实体基础化校验 → 逻辑裁判评分 → 最终结论核查
                      │                        │                │             │
                      ▼                        ▼                ▼             ▼
                丢弃矛盾样本              丢弃幻觉样本      丢弃低分样本   丢弃结论错误样本

    这套流水线可自动化运行，仅保留通过所有关卡的高质量推理链。实践表明，过滤后数据的训练效果显著优于未过滤数据，甚至可接近人工标注质量。

    ### “自我对弈”在多模态对齐中有应用吗？

    有，且正在成为多模态对齐的前沿范式。自我对弈（Self-Play）在AlphaGo等游戏AI中已证明其威力：通过让AI与自己对弈，无需外部数据即可不断进化。在多模态对齐中，自我对弈的思想被转化为“生成-检验-迭代”的闭环。

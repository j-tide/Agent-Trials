content:
  prompt: 1.3 数据隐私保障
answer:
  mode: rubric
  reference_answer: |-
    医疗数据的隐私保护受HIPAA（美国）、GDPR（欧盟）、个人信息保护法（中国）等法规严格约束。

    联邦学习是当前最成熟的隐私保护训练框架。多家医院的数据不出本地，仅在各医院本地训练模型，然后将加密的梯度或参数更新发送到中心服务器聚合。典型的联邦训练架构下，中心服务器永远接触不到原始患者数据，每轮仅接收各医院上传的模型参数差值。安全聚合协议进一步确保即使中心服务器也无法从单个医院的更新中反推出患者信息。

    差分隐私在训练过程中向梯度添加可控噪声，使得攻击者无法从模型参数推断出任何单个样本是否在训练集中。ε参数控制隐私保护强度——ε越小保护越强但模型精度越低，需要在两者间权衡。医疗场景通常设置ε在4-8之间。

    合成数据替代是另一个方向。先用GAN或扩散模型生成合成的医学影像和报告，这些合成数据在统计特征上与真实数据相似但不包含任何真实患者信息。医生审核通过后，用合成数据训练下游模型。不过，生成模型本身也可能记忆训练样本，需要额外的隐私审计。

    同态加密允许在加密数据上直接进行推理运算。患者数据在传输和计算过程中始终保持加密状态，服务端从未见过明文。但同态加密的计算开销极大，目前仅适用于轻量模型。

    实践中，通常组合使用多种技术：联邦学习解决多中心数据共享，差分隐私防止反推，合成数据用于内部开发和测试，同态加密保护高风险推理场景。


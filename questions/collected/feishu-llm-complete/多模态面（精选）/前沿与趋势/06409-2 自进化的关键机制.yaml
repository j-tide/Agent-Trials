  prompt: 7.2 自进化的关键机制
answer:
  mode: rubric
  reference_answer: |-
    机制一：主动数据采样

    模型不是被动接受所有数据，而是主动选择对它最有价值的数据进行学习和标注：

    - 不确定性采样：选择模型预测置信度最低的样本，这些是模型最需要学习的。

    - 多样性采样：避免重复学习已知内容，优先选择特征空间中稀疏区域的样本。

    - 错误聚类采样：将模型的错误案例聚类，从每个错误簇中采样代表性样本。

    机制二：自我反思与修正

    模型生成回答后，开启“反思模式”：

    - 模型审视自己刚生成的回答。

    - 检查是否有视觉证据支撑每个陈述。

    - 若发现错误或缺乏证据的陈述，自动修正。

    - 修正后的回答作为“更优版本”加入训练。

    机制三：课程式自我进化

    设定难度递增的进化阶段：

    - 阶段一：在简单图像和问题上自我进化，直到准确率达到95%。

    - 阶段二：自动引入更难的数据（更多物体、更复杂关系、更长的推理链）。

    - 阶段三：引入对抗性样本（专门针对模型当前弱点构造的样本）。
    每个阶段在前一阶段基础上进行，确保能力稳步提升。

    机制四：多模型生态进化

    不止一个模型在进化，而是一个“模型生态系统”：

    - 专家模型：在不同子领域（OCR、空间推理、医学图像）进化出多个专家。

    - 通才模型：从所有专家模型中蒸馏知识，整合为通用能力。

    - 路由模型：学习如何将用户问题分配给最合适的专家。
    整个生态系统通过内部竞争与合作持续进化。

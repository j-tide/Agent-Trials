  prompt: 6.3 评估指标
answer:
  mode: rubric
  reference_answer: 评估持续学习的好坏不能只看最终准确率。常用指标包括：平均准确率（所有任务完成后的平均性能）、遗忘率（新任务学习前后旧任务性能的降幅）、前向迁移（学旧任务对新任务的促进程度）。对于多模态模型，还需要分模态评估遗忘率——确保一个模态的持续学习不会牺牲其他模态的能力。

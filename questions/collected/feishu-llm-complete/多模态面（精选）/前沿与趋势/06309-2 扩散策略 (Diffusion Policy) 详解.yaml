answer:
  mode: rubric
  reference_answer: |-
    这是目前具身智能中最受关注的低层控制方案。它不依赖语言中介，直接学习从视觉观察到动作的映射。

    流程：

    - 观察（图像+关节状态）通过视觉编码器和状态编码器编码为条件特征。

    - 将随机噪声作为动作序列的初始猜测。

    - 扩散模型UNet以条件特征为指导，逐步去噪，生成平滑、连续的动作序列（如未来20步的关节角度）。

    - 执行生成动作序列的前几步，然后根据新观察重新生成，形成滚动时域控制。

    优势：能捕捉多模态的动作分布（如向左或向右绕过障碍物均可），生成的动作平滑自然，适合复杂的接触式操作任务。

    ---

    ### 多 Agent 协作的多模态场景：一个 Agent 负责看，一个负责画，它们如何通信？

    在多Agent协作中，各Agent可以分别拥有不同的模态感知或生成能力，通过结构化的通信协议交换信息，共同完成单一Agent无法完成的任务。

content:
  prompt: Sora 等视频生成模型采用的 DiT 架构有什么特点？为什么表现出强扩展性？
answer:
  mode: rubric
  reference_answer: |-
    Sora的核心架构是 DiT (Diffusion Transformer)，它用纯Transformer替代了传统扩散模型中的卷积U-Net。这一架构迁移是它强大扩展性的根源。

    DiT架构特点：

    [嵌入表格未展开]

    DiT的时空patch处理：

    Sora将视频视为一个4D张量（时间×高度×宽度×通道），直接切分为不重叠的时空patches，例如一个patch的大小为 4×16×164×16×16 像素。每个patch被线性投影为一个token，所有token拼接为一维序列送入Transformer。这种原生三维patch化使得模型能够从底层就建立时空关联。

    为什么表现出强扩展性？

    - Transformer架构的成熟扩展律：在自然语言处理中，Transformer的扩展律（Scaling Law）已被充分验证：模型性能随参数量、数据量和计算量的幂律关系提升。DiT继承这一特性，可以通过简单地增加层数和宽度来平滑提升性能，而不像U-Net那样受限于卷积的多尺度设计。

    - 统一处理不同分辨率、时长和宽高比：因为输入是扁平的token序列，DiT天然支持可变长度的输入。Sora可以生成不同分辨率、不同时长、不同宽高比的视频，甚至可以在同一个batch内混合多种格式。这种灵活性使得模型可以充分利用各类视频数据，而无需复杂的预处理。

    - 全局注意力捕获长距离依赖：Transformer的自注意力机制让每个token都能直接关注任何其他token，这对于视频中相距数秒的帧之间的一致性至关重要。相比之下，U-Net的卷积感受野是逐步扩大的，对长距离交互的建模较弱。

    - 硬件友好：DiT的计算模式主要是大矩阵乘法，与GPU/TPU的计算特性高度契合，易于做模型并行和张量并行，适合超大规模分布式训练。

    DiT与ViT的关键区别：ViT处理的是2D图像patch，位置编码只有空间维度。DiT处理的是3D时空patch，需要时空位置编码，告诉模型每个token在时间和空间中的坐标。此外，DiT通常使用adaLN-Zero作为条件注入机制，该机制根据扩散时间步和文本条件回归出层归一化的尺度和偏移参数，且初始化为零以保证训练初期的稳定性。

    Sora的成功印证了DiT的可扩展性：随着模型规模和训练数据的增加，Sora生成的视频不仅分辨率更高、时长更长，而且涌现出了3D一致性、物体持久性、甚至对物理交互的一定理解。这些能力并非显式编程，而是模型在海量视频数据中隐式学习的结果，这正是扩展律带来的涌现现象。


  prompt: 3.2 多模态信号的对齐与融合
answer:
  mode: rubric
  reference_answer: |-
    IMU驱动的视觉预测。当用户快速转头时，摄像头的新帧还没到达。可以利用IMU数据预测头部姿态，对上一帧图像进行透视变换（reprojection），生成近似当前视角的中间帧，填补几毫秒的空白。这种“异步时间扭曲”技术已在Quest等设备上广泛应用，是防止眩晕的关键。

    眼动引导的注视点渲染。人眼只有中央凹区域能看清细节，周边视觉分辨率很低。利用眼动追踪确定用户的注视点，仅对该区域进行全分辨率渲染，周边区域大幅降低分辨率。这可以将渲染负载降低50-80%，同时用户完全察觉不到画质下降。多模态模型需要根据注视点信息动态分配视觉编码的注意力——注视点附近的图像patch给予更多视觉token，周边区域给予更少或直接降采样。

    手势和语音的互补融合。用户指着虚拟物体说“把那个移到左边”。手势提供空间定位（“那个”的位置），语音提供操作指令（“移到左边”）。融合时需要将手势的时间序列（手指指向的3D坐标）与语音的语义解析结果在时间上对齐，确定“那个”的时刻手指指向了哪个物体。

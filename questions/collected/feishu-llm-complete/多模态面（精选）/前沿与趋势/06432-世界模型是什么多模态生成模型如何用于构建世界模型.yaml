content:
  prompt: 世界模型是什么？多模态生成模型如何用于构建世界模型？
answer:
  mode: rubric
  reference_answer: |-
    世界模型是一个智能体对其所处环境的内在表征，它能够模拟环境的状态转移，预测“如果我执行某个动作，世界将如何变化”。一个完整的世界模型至少包含三个核心能力：

    [嵌入表格未展开]

    多模态生成模型如何用于构建世界模型？

    多模态生成模型（尤其是视频生成扩散模型、自回归Transformer）天然具备前向预测能力。它们可以被训练为“下一帧预测器”：输入历史视频帧和可选的动作指令，生成未来的视频帧。这种预测过程隐式地学习了环境的物理规律、物体恒常性和因果关系。

    具体的构建路径分为三种范式：

    [嵌入表格未展开]

    Sora为代表的视频生成模型已经在某种程度上展现出了世界模型的雏形。它能够生成具有3D一致性、物体持久性和一定物理交互的视频片段，说明模型内部已经隐式地构建了对空间、物体运动和某些物理规则的表示。但是，它仍然缺少“动作干预”和“长期记忆”这两个世界模型的关键要素。未来，将视频生成与强化学习、主动推理结合，将催生真正通用的世界模型。


answer:
  mode: rubric
  reference_answer: |-
    - 本地训练：每个客户端使用本地多模态数据更新本地模型副本。

    - 上传参数：客户端将模型参数（或梯度）加密后上传到中心服务器。

    - 聚合：服务器安全聚合各客户端的参数（如 FedAvg 加权平均），更新全局模型。

    - 分发：全局模型下发到各客户端，进行下一轮训练。

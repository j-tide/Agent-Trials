  prompt: 4.4 预测编码（Predictive Coding）
answer:
  mode: rubric
  reference_answer: |-
    预测编码理论将大脑视为一个持续预测未来输入的生成模型，神经活动编码的是预测误差而非原始信号。在多模态学习中，可以训练一个多模态生成模型预测下一帧的视频、下一个词的文本、下一时刻的音频。预测误差最小的跨模态表征被保留，形成高效的联合编码。这种自监督的学习方式无需显式标注，与大脑的学习机制高度相似。

    脑启发架构的价值不仅在于其生物学合理性，更在于它们为当前深度学习面临的效率、泛化和遗忘问题提供了经过亿万年进化验证的解决方案。随着神经科学对大脑多模态整合机制的理解不断深入，更多的计算原理将被迁移到AI模型中。

    ### 联邦多模态学习：如何在不共享数据的情况下训练全局模型？

    联邦学习允许多个参与方在不共享原始数据的前提下，协同训练一个全局模型。在多模态场景中，每个客户端（如一家医院）拥有患者的影像、病历文本、检验数据等多模态记录，这些数据因隐私法规（GDPR、HIPAA）无法集中到云端。联邦多模态学习的挑战在于：不同客户端的模态可能不同（有的缺影像，有的缺基因数据）、数据分布高度Non-IID（不同医院的病种分布差异大）。

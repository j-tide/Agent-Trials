  prompt: 11.3 通信效率优化
answer:
  mode: rubric
  reference_answer: |-
    由于视觉数据（图片、特征图）体积大，直接传输低效。优化手段：

    - 传输特征而非像素：视觉Agent输出CLIP等语义特征向量，生成Agent基于特征生成，而非重新分析原图。

    - 增量传输：对于局部修改，仅传输修改区域的坐标和新特征，其余保持不变。

    - 共享视觉缓存：多个Agent共享一个视觉特征缓存池，减少重复编码。

    ---

    ### 如何评估多模态 Agent 的性能？除了任务完成率，还有什么指标？

    多模态Agent的评估比传统NLP任务更复杂，因为它同时涉及感知、推理和物理动作。需要多维度、分层次的评估体系。

  prompt: 4.2 自动设定进化目标的方法
answer:
  mode: rubric
  reference_answer: |-
    方法一：多维自动评测聚合

    构建一个自动评测基准池，涵盖数十个不同维度的评测集。进化的目标是提升这些基准上的加权平均分。关键是：

    - 基准池需定期更新，防止模型过拟合固定题目（类似于“基准饱和”问题）。

    - 每个基准的得分归一化到统一尺度。

    - 使用动态权重：根据历史得分，自动提高那些模型得分较低的能力维度的权重，实现“短板优先”的进化。

    方法二：对抗式自动目标生成

    用一个“目标生成器”模型自动生成新的测试任务，这些任务专门针对当前模型的弱点：

    - 分析模型在当前测试集上的错误案例，找出错误模式（如“无法计数超过5个物体”）。

    - 目标生成器根据错误模式，自动生成更多同类型的测试样本。

    - 模型在这些新样本上训练和评估，直到该弱点被克服。

    - 目标生成器再次分析新的错误，循环迭代。

    这种方法实现了“测试-训练”的闭环，进化目标随模型能力的提升而动态调整。

    方法三：基于人类偏好模型的自动化

    训练一个强大的偏好模型（可以是GPT-4V级别的评判模型），该模型能够评估多模态输出的质量。进化目标设为“最大化偏好模型的评分”。关键在于：

    - 偏好模型必须独立于正在进化的模型，且定期用新的人类反馈数据校准。

    - 防止进化模型学会“讨好”偏好模型的评分漏洞（奖励黑客问题）。

    - 可结合多个偏好模型，取均值或加权，增加鲁棒性。

    方法四：环境交互式目标

    在具身智能场景下，进化目标可以是“在物理或模拟环境中完成任务的成功率”。例如，机器人模型自进化时，目标就是在抓取任务中实际抓取成功的物体数量。环境本身提供了客观的、防作弊的评价信号。

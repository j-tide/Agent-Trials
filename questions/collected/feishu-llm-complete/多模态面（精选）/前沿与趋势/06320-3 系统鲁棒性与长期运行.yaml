answer:
  mode: rubric
  reference_answer: |-
    问题表现：

    - 内存泄漏、GPU显存碎片、传感器老化等，导致长时间运行后性能退化甚至崩溃。

    - 意外情况（如被用户突然打断、硬件故障）下需要安全停机。

    应对策略：

    - 健康监控与自动重启：实时监控帧率、延迟、内存占用，异常时触发告警或自动重启。

    - 优雅降级：当算力不足时，自动切换到低精度模型或降低动作频率，而非直接宕机。

    - 看门狗与安全策略：独立于主AI的安全模块，当检测到关节力矩超限或接近碰撞时，强制切断动力。

    真实世界的多模态Agent不是纯粹的算法问题，而是一个复杂的系统工程，需要算法工程师、硬件工程师和系统运维专家紧密协作，才能在不确定性的海洋中稳健航行。

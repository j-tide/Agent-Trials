answer:
  mode: rubric
  reference_answer: |-
    普通图的成对边在表达“A与B相关，B与C相关，因此A与C也可能相关”时需要两跳，而超图可以一条超边直接连接A、B、C，信息损失更少。但代价是超图结构更复杂，计算开销更大，需要更精巧的稀疏化策略。

    ### Mamba 等状态空间模型是否适合多模态长序列建模？

    Mamba 是结构化状态空间模型（Structured State Space Model, SSM）的最新代表，其核心创新在于引入输入依赖的选择性扫描机制，使序列建模的复杂度降至线性，同时在长序列任务上达到甚至超越 Transformer 的性能。对于多模态长序列（长视频、长文档、多轮对话历史），Mamba 的吸引力显而易见。

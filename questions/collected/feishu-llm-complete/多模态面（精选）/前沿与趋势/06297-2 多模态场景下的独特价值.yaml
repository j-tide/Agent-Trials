  prompt: 1.2 多模态场景下的独特价值
answer:
  mode: rubric
  reference_answer: |-
    事件相机与普通相机、麦克风等传感器的多模态融合中，SNN 的优势进一步放大。普通 RGB 相机输出密集帧，适合用 CNN 或 ViT 处理；事件流适合用 SNN 处理；音频可以转化为频谱图后用 CNN，或转化为脉冲序列后用 SNN。这种异构架构可以根据每种模态的特性选择最匹配的编码器和处理器，而非一刀切。

    典型实例是高速无人机避障：事件相机在快速运动下仍能清晰感知边缘，SNN 在微秒级时间内完成碰撞预测，同时处理陀螺仪和加速度计数据，多模态 SNN 融合后实现超低延迟的自主飞行。这种“传感器-处理器”协同设计是传统帧式方案无法企及的。

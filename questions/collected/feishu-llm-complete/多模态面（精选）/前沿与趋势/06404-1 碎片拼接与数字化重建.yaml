  prompt: 7.1 碎片拼接与数字化重建
answer:
  mode: rubric
  reference_answer: |-
    考古遗址出土的往往是大量碎片——陶片、骨片、石刻残块。多模态模型可以同时利用碎片的形状（3D几何）、纹理（颜色和图案）和材质信息，自动寻找可能的拼接关系。

    具体流程包括：用3D扫描仪获取每个碎片的精确几何模型；使用深度学习提取每个断裂面的几何特征和纹理特征；通过图匹配算法寻找最可能拼接的碎片对；多模态模型根据拼接后的整体形状和纹理连续性进行验证。最后，模型可以生成完整物件的3D重建，并以AR方式叠加在当前碎片上，帮助考古学家直观看到复原后的样貌。

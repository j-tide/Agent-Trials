content:
  prompt: 2.2 多模态大模型的革新潜力
answer:
  mode: rubric
  reference_answer: |-
    多模态大模型带来的核心革新是：从“模块化感知+规则决策”走向“端到端感知-推理-决策一体化”。

    统一的多模态输入理解。传统系统需要分别处理摄像头图像、激光雷达点云、毫米波雷达、高精地图、GPS定位。多模态大模型可以将这些模态统一为token序列，在统一的Transformer中进行融合推理。这使得模型能够捕捉跨模态的细粒度关联——例如，摄像头中的视觉外观与激光雷达的深度信息在自注意力中直接交互，无需人工设计融合策略。

    语言驱动的场景理解与推理。多模态大模型能够“读懂”交通场景中的文字信息（路牌、临时施工标志、交警手势），并运用常识进行推理。例如，看到路边“学校区域”的标志和一群正在过马路的孩子，模型能推断出需要减速并预判可能有人突然穿越。这种常识推理能力是传统感知模块不具备的。

    自然语言交互与可解释性。当自动驾驶系统做出紧急刹车决策时，多模态大模型可以输出文本解释：“前方100米处检测到行人突然横穿马路，且右侧有车辆遮挡视线，预判存在碰撞风险。”这种可解释性对于事故分析、监管合规和用户信任至关重要。

    长尾场景的泛化能力。多模态大模型在海量互联网数据上预训练，具备了较强的常识和视觉理解泛化能力。对于训练数据中少见的极端天气、异形车辆、非标准交通场景，大模型的泛化能力显著优于传统检测器。这为处理自动驾驶的长尾问题提供了新路径。

  prompt: 2.1 当前自动驾驶的感知架构与局限
answer:
  mode: rubric
  reference_answer: |-
    传统自动驾驶系统采用模块化架构：感知模块（检测、跟踪、预测）→ 规划模块（路径规划、行为决策）→ 控制模块。每个模块独立开发，通过结构化接口传递信息。这种架构的局限在于：

    - 模块间的信息传递是人为定义的（如边界框坐标、速度向量），大量原始上下文信息被丢弃。

    - 每个模块独立优化，无法进行全局端到端的联合推理。

    - 长尾场景（罕见天气、异常行为、复杂交通规则）的覆盖严重依赖人工规则和特定数据采集。

  reference_answer: |-
    RT-2将机器人控制抽象为“视觉-语言-动作”token序列的生成问题。它将机器人动作（如末端位移增量）离散化为token，与视觉和文本token拼接，让LLM自回归地预测动作token。这证明了通用大模型+少量具身微调即可实现强大的泛化能力。

    ---

    ### 如何为多模态 Agent 设计规划能力？视觉信息如何参与 ReAct 或 Plan-and-Execute？

    规划是多模态Agent完成长程任务的核心。视觉信息在规划的不同阶段扮演着“环境感知者”和“步骤校验者”的双重角色。

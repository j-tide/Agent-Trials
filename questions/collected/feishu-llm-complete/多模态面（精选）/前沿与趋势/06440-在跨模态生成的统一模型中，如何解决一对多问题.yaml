content:
  prompt: 在跨模态生成的统一模型中，如何解决“一对多”问题？
answer:
  mode: rubric
  reference_answer: |-
    “一对多”问题指同一输入可对应多个不同的合理输出。例如，给定文本“一只猫”，可以生成毛色、姿态、背景各异的无数张猫的图片。这对使用确定性损失函数的模型构成挑战。

    解决方案：

    扩散模型天然适合一对多：扩散模型的去噪过程每次从不同随机噪声出发，自然地产生不同输出。这正是扩散模型在文生图领域占据主导地位的重要原因之一。

    对于自回归模型：可以采用“生成多个候选+重排序”策略。先生成多个输出，再用另一个模型（如CLIP Score）从中挑选最符合输入且多样性好的结果。

    本质理解：“一对多”不是模型的缺陷，而是现实世界语义多对多映射的体现。好的模型应该能够捕捉输出的条件分布，而非仅输出均值。评估时也需使用FID、IS等能度量多样性的指标，而非仅用MSE。


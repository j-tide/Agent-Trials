  prompt: 2.2 在多模态学习中的应用
answer:
  mode: rubric
  reference_answer: |-
    跨模态检索：给定文本查询，需要在图像库中检索。超图可以将文本、图像、以及它们的语义标签、场景类别等辅助信息都用超边连接。查询时，超边的协同传播能利用辅助信息增强跨模态匹配的精度——例如，“草原”标签的引入能帮助区分“牧羊犬”与“宠物犬”。

    多模态情感分析：一段视频中的面部表情、语音语调、对话文字三者共同决定了情感标签。超图将三个模态的片段连在同一条超边上，并在相邻时间片段的超边之间建立时序连接。HGNN 可以同时捕获“同一时刻多模态融合”和“跨时刻情感流动”的信息。

    视觉问答中的关系推理：问题中的词、图像中的物体、物体间的空间关系可以构建为一个超图。物体和其属性、关系形成超边，问答推理过程等价于在超图上进行信息传递——这比成对建模更能保留高阶语义结构。

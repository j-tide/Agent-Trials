content:
  prompt: 利用多模态生成模型进行“反事实图像生成”，在 AI 伦理研究中有何应用？
answer:
  mode: rubric
  reference_answer: |-
    反事实图像生成指通过修改图像的某些属性（如人物性别、肤色、年龄），保持其他属性不变，生成“如果...会怎样”的假设情景。这一技术正成为AI伦理研究中的利器，用于检测和缓解模型的偏见。

    核心应用场景：

    [嵌入表格未展开]

    具体案例：

    案例一：招聘算法偏见审计

    使用文生图模型生成一批简历照片，对于每个原始人物，生成其不同性别、不同种族的版本，而服装、姿势、背景保持一致。将这些照片附加到相同的简历上，输入招聘筛选模型，比较不同版本获得的评分。如果模型系统性地对某些群体给予较低评分，则揭露了其偏见。

    案例二：医疗影像公平性

    在皮肤病分类任务中，生成同一病种在不同肤色上的反事实图像。测试模型在不同肤色上的诊断准确率差异。若深色皮肤上的准确率显著低于浅色皮肤，说明训练数据存在肤色偏差，需要通过数据增强或算法改进来消除。

    案例三：文生图模型自身的偏见审计

    用反事实提示词（如“a photo of a CEO”并附加不同性别和种族的提示）测试文生图模型，统计生成结果中的人物属性分布。大量研究发现，这类模型倾向于将“CEO”生成为白人男性，将“护士”生成为女性。这些发现直接推动了模型开发者在训练数据和推理策略上的去偏改进。

    技术挑战：

    - 保持其他属性不变：在改变敏感属性的同时，需要确保其他所有视觉元素（背景、光照、物体）精确保持一致。这要求生成模型具备精细的属性编辑能力，如利用StyleGAN的潜在空间操作或扩散模型的局部编辑（如InstructPix2Pix）。

    - 避免过度修正引入新偏见：如果为了平衡而过度修正，可能生成不自然或刻板印象的反面（如将CEO全部生成为女性），这本身也是一种偏见。目标应是反映真实世界的多样性，而非强制平均。

    - 伦理审查：反事实生成可能被滥用，例如用于制造虚假证据或深度伪造。因此，研究应用需在严格的伦理框架下进行，确保透明、知情同意、和隐私保护。

    反事实图像生成让隐性的偏见显性化，为AI伦理提供了可量化、可验证的分析工具。它将抽象的公平性原则转化为具体的像素证据，是构建负责任AI的重要技术支撑。


  prompt: 5.3 实际应用：医疗联邦多模态学习
answer:
  mode: rubric
  reference_answer: |-
    多家医院联合训练一个多模态诊断模型。每家医院的本地数据包含 X 光片、CT、病理报告等。通过联邦学习，模型在所有医院的数据知识上训练，但每家医院的患者数据从未离开过本地服务器。使用差分隐私进一步保护参数传输过程中的隐私。最终的全局模型在罕见病识别上比单家医院训练的模型准确率提升显著，同时完全合规。

    ### 多模态模型的持续学习：如何学会新概念而不遗忘旧知识？

    持续学习（Continual Learning）要求模型在接触新任务、新概念、新模态时，能学会新知识，同时不覆盖旧知识。这对多模态模型尤其关键：模型可能先学会图文匹配，再需要学会视频理解，然后加入音频处理能力。如果每次学新东西都忘掉旧的，模型永远无法成为真正的“通用”系统。

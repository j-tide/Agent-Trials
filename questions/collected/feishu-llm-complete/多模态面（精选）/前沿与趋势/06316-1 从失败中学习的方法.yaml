content:
  prompt: 13.1 从失败中学习的方法
answer:
  mode: rubric
  reference_answer: |-
    方法一：偏好学习（DPO/RLHF）

    收集成功和失败的视觉轨迹对。对于同一初始任务，成功轨迹作为chosen，失败轨迹作为rejected。用DPO训练模型，使其更倾向于生成成功的动作序列。失败轨迹中的错误步骤起到了“负样本”的作用。

    方法二：逆强化学习 (IRL)

    IRL可以从专家演示中推断奖励函数，但也可扩展至失败演示。通过失败轨迹，IRL可以学习到哪些状态-动作会导致任务失败，从而将这些状态赋予低奖励。结合成功和失败轨迹，IRL能学到更精细的奖励模型，引导强化学习策略避开危险区域。

    方法三：反思数据微调

    将失败轨迹与“事后反思”配对。人类标注员或强模型观看失败轨迹，为每一步错误标注原因和正确的替代动作。形成“错误观察→错误动作→正确反思→修正动作”的训练数据。Agent微调后能学会在类似错误发生前自我纠正。

  prompt: 11.1 场景举例：视觉理解Agent + 图像生成Agent
answer:
  mode: rubric
  reference_answer: |-
    任务：用户上传一张房间照片，要求“按照这个风格重新设计客厅布局，并画出效果图”。

    协作流程：

    - 视觉理解Agent：接收房间照片，进行场景解析（检测家具、识别风格、测量空间关系），输出结构化描述。

    - 文本通信：视觉Agent将描述打包为JSON发送给生成Agent。内容包含：风格标签（“现代简约”）、保留元素（“L型灰色沙发”）、替换/添加元素（“添加绿植”）、布局约束（“电视墙在落地窗对面”）。

    - 图像生成Agent：接收JSON和可选的原图（用于img2img保持结构），生成多张设计方案效果图。

    - 迭代优化：视觉Agent再次分析生成的效果图，检查布局是否合理、风格是否一致，给出修改建议（“茶几太大，缩小20%”），生成Agent再次修改。

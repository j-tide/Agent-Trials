answer:
  mode: rubric
  reference_answer: |-
    金融机构需要审核海量合同、交易凭证、身份证明文件。多模态模型可以同时理解：合同文本的法律条款；身份证件上的人脸照片是否与自拍视频中的人物一致；交易凭证上的印章是否真实、金额数字是否有篡改痕迹。多个视觉和文本线索的交叉验证可以大幅提升审核的准确率和效率。

    ### 遥感领域的多模态模型应用：灾害预警

  prompt: 7.1 什么是“常识”理解
answer:
  mode: rubric
  reference_answer: 常识是人类关于世界运行方式的基本知识——水往低处流、物体不会凭空消失、人被撞会疼、生气的语气与微笑的表情不一致。常识的独特之处在于：它几乎从不被显式地书写，因为对任何成年人来说都“理所当然”。这使得模型无法从互联网文本和图像的表面统计中直接习得常识。

  prompt: 8.1 财报图表的深度解析
answer:
  mode: rubric
  reference_answer: |-
    上市公司财报包含大量图表——柱状图、折线图、饼图、表格。多模态模型需要同时理解图表的视觉编码（柱子的高度代表数值、折线的斜率代表趋势、颜色区分不同类别）和文字标注（标题、单位、注释）。更进一步，模型需要能够跨图表推理——将营收趋势图、利润率变化表和市场份额饼图进行综合分析，生成连贯的财务分析报告。

    具体的处理流程包括：先用专门的图表解析模块将视觉图表转换为结构化数据（JSON格式的数值表），同时用OCR提取所有标注文字。然后，多模态LLM将结构化数据、文字信息和用户的问题整合，进行推理分析。

  reference_answer: |-
    当零训练方法无法满足精度需求，但数据又有限时，可选择极轻量的微调方案：

    [嵌入表格未展开]

    推荐策略：

    - 先用无需训练的方法（RAG+ICL+视觉提示）快速验证任务可行性。

    - 若精度不足，收集少量高质量标注数据（100-1000条）。

    - 使用LoRA微调LLM部分，保持视觉编码器冻结。

    - 结合RAG弥补模型知识盲区。

    这套“零训练→轻量微调→RAG增强”的组合拳，可以在极低成本下将通用MLLM适配到各种垂直领域。

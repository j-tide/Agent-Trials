  prompt: 9.1 多模态数据源的融合
answer:
  mode: rubric
  reference_answer: |-
    遥感灾害预警需要融合的数据源极为多样：

    卫星图像提供大范围的地表信息——可见光影像显示植被、水体、建筑；合成孔径雷达（SAR）可以穿透云层，在夜间和恶劣天气下成像；热红外影像测量地表温度。

    气象数据包括降水预报、风速风向、温湿度等结构化网格数据，由数值天气预报模型产生。

    地面传感器网络提供局部高精度实时数据——河流水位、土壤含水量、地震加速度、空气质量指数。

    社交媒体和新闻报道提供实时的人类活动信息和灾情描述，虽然噪声大但时效性高。

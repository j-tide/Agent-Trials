content:
  prompt: 1.2 核心挑战
answer:
  mode: rubric
  reference_answer: |-
    幻觉的零容忍。医疗是幻觉的禁区。一个虚构的病灶可能导致不必要的手术，一个漏诊可能延误治疗。普通VQA任务的幻觉率在5%-10%尚可接受，医疗场景的幻觉率必须趋近于零。技术上，这要求强制证据溯源——每一条诊断结论必须标注其在影像中的精确位置和引用的医学指南。

    领域知识的深度要求。通用多模态模型在医学影像上表现往往不佳，因为它们预训练数据中几乎没有CT、MRI、病理切片。需要大量领域数据微调，而高质量医学标注数据极为稀缺和昂贵。一个经验丰富的放射科医生一天只能精细标注几十张影像，成本是通用图像标注的数十倍。

    罕见病的长尾困境。医疗数据天然高度不平衡——常见病样本数以万计，罕见病可能只有几十例。模型容易在常见病上过拟合，对罕见病完全失效。

    可解释性与责任归属。当AI辅助诊断出现错误，责任归谁？医生、医院、AI开发商？这不仅是技术问题，更是法律和伦理问题。技术上，要求模型提供可审计的推理链路，让医生能够理解AI为什么做出某个判断，从而做出知情采纳或拒绝的决定。

answer:
  mode: rubric
  reference_answer: |-
    批改流程通常分为几个步骤：首先用目标检测模型定位图中的各个元素（箭头、标注、结构区域），同时用OCR识别手写文字；然后构建“图元素-标注文字”的对齐关系；最后调用多模态LLM，输入原题、参考答案、评分标准、和对齐后的学生作答信息，让LLM进行综合判断和评分。

    关键的技术挑战在于：学生的作答形式高度多样化——有人用铅笔、有人用圆珠笔，有人画得工整、有人潦草。手写体和手绘图的识别鲁棒性需要针对性增强。此外，数学证明等开放性答案的评判不能仅看最终结论，需要能够评估中间步骤的逻辑正确性，即使最终答案错了，中间步骤正确也应给予部分分数。

    ### 艺术创作中，多模态模型如何理解并辅助生成符合特定艺术风格的多媒体作品？

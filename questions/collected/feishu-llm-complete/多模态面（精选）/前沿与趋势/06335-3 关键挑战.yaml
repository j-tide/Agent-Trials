content:
  prompt: 2.3 关键挑战
answer:
  mode: rubric
  reference_answer: |-
    实时性是最大的拦路石。自动驾驶要求端到端延迟在100毫秒以内，而当前多模态大模型处理一帧图像加文本查询通常需要200-500毫秒。即使经过量化、TensorRT优化，距离车规级实时性仍有差距。可能的突破方向包括：专用的自动驾驶小模型（如7B参数级）、模型蒸馏、以及将模型的部分推理提前到传感器端。

    安全性与验证。传统自动驾驶系统虽然能力有限，但行为可预测、可验证。端到端大模型的决策过程是黑箱，如何保证在数百万公里的行驶中不会出现致命失误？这需要全新的验证范式——基于场景覆盖度的仿真测试、形式化验证方法、以及影子模式（模型在后台运行，不与实际控制对接，仅记录其决策与实际驾驶员行为的一致性）。

    算力与功耗。车载芯片（如Orin、Thor）的算力远低于数据中心GPU。运行一个70B参数的多模态大模型在车载环境完全不现实。实际部署需要使用1-7B参数的轻量模型，并经过INT8量化、算子融合等极致优化。

    ### AR/VR 场景下多模态模型的低延迟融合架构

    AR/VR设备同时处理眼动追踪、手势识别、语音指令、头部IMU数据和环境摄像头，这些信号的时间尺度从毫秒（IMU）到秒（语音）不等，必须设计精巧的融合架构才能保证沉浸感。

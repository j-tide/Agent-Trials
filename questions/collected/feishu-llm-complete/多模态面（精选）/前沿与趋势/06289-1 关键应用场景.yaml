content:
  prompt: 1.1 关键应用场景
answer:
  mode: rubric
  reference_answer: |-
    医疗是多模态模型天然的应用高地——医学诊断本身就是一个多模态信息融合的过程：医生同时阅读影像、检验报告、病史文本、基因数据来做出判断。

    医学影像辅助诊断是最成熟的方向。模型接收X光、CT、MRI、病理切片等图像，结合患者主诉文本，输出异常检测、病灶分割、良恶性分类。实际落地中，系统通常作为“第二阅片者”——先由AI筛出疑似病灶并标注，医生复核后出具报告。研究表明，AI辅助可以将小结节漏诊率降低20%-30%。

    影像报告生成将影像自动转化为结构化文本。输入一系列胸部CT图像，输出“右肺上叶见1.2cm磨玻璃结节，边缘清晰，建议3个月后随访”。这一任务要求模型不仅识别病灶，还要测量尺寸、描述形态、给出分期参考。自动化报告可以大幅减轻放射科医生每天撰写数十份报告的负担。

    跨模态病例检索在疑难病例会诊中极具价值。医生上传当前患者的影像和简要病史，系统从历史病例库中检索出最相似的多模态病例，包括当时的诊断、治疗方案和预后，为当前决策提供参考。

    手术规划与导航将术前CT/MRI与术中实时影像融合，叠加显示关键解剖结构（肿瘤边界、重要血管），帮助医生精准避开风险区域。


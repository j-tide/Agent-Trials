answer:
  mode: rubric
  reference_answer: |-
    ReAct（Reasoning + Acting）让Agent交替进行“思考-行动-观察”。在多模态中，每次观察都是一张新截图或场景照片。

    Round 1:
      Thought: 我需要找到设置图标。当前屏幕主界面上，底部导航栏右侧有一个齿轮图标。
      Action: 点击[齿轮图标, id=5]
      Observation: (新截图) 进入了设置页面，顶部有“设置”标题。
    Round 2:
      Thought: 已进入设置，我需要找到“Wi-Fi”选项。
      Action: 滚动列表向下
      Observation: (新截图) 列表滚动，出现了“Wi-Fi”项。
    Round 3:
      Thought: 找到了“Wi-Fi”，点击进入。
      Action: 点击[Wi-Fi, id=12]
      ...

    视觉的关键作用：

    - 在Thought阶段，LLM需要描述当前界面并推理下一步目标元素的位置。

    - Observation阶段提供客观反馈，LLM据此调整下一步规划。

content:
  prompt: 4.2 全局工作空间理论（Global Workspace Theory）
answer:
  mode: rubric
  reference_answer: 认知神经科学中的全局工作空间理论认为，大脑中存在一个有限容量的“全局工作空间”，不同脑区（视觉、听觉、语言）竞争进入该空间的权利，一旦某个信息进入，就可以被广播到所有脑区。基于此理论的全局工作空间网络（GWT-Networks）在多模态任务中，让各模态的编码器竞争一个共享的瓶颈层，只有最相关的跨模态特征被激活并共享。这种机制自然地实现了模态的选择性融合和注意力分配。

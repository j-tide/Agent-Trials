  prompt: 8.2 多源信息的综合推理
answer:
  mode: rubric
  reference_answer: |-
    分析师做决策时需要同时参考：公司财报（文本+图表）、新闻快讯（文本+新闻图片）、行业报告（文本+图表）、社交媒体舆情（文本+图片+视频）、以及市场行情数据（结构化数值）。多模态模型可以将这些异质信息统一处理，发现单一信息源无法揭示的关联。

    例如，一家公司的财报显示利润率下滑，同时新闻中出现该公司工厂的航拍图（显示厂区卡车数量减少），行业报告提到原材料价格上涨，社交媒体上出现员工抱怨加班的帖子。多模态模型可以将这些碎片化的多模态信息拼接成完整的故事，辅助分析师做出更全面的判断。

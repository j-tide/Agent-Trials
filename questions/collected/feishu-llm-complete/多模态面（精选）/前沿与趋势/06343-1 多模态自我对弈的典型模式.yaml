  prompt: 3.1 多模态自我对弈的典型模式
answer:
  mode: rubric
  reference_answer: |-
    模式一：描述-生成-比对循环

    这是一个图像描述器和一个文生图模型的对弈过程：

    - 描述器（MLLM-1） 接收一张真实图像，生成详细描述。

    - 生成器（文生图模型） 根据描述生成一张新图像。

    - 比对器（MLLM-2，或CLIP） 计算原图与生成图的语义相似度。

    - 如果相似度低，说明描述不准确或生成不精确。系统调整描述器的提示词或生成器的参数，重新循环。

    - 经过多轮迭代，描述器的语言精准度和生成器的保真度互相促进提升。

    这种对弈实际上在优化“描述-生成”这一对互逆过程的循环一致性。

    模式二：问答-验证自对抗

    两个MLLM在图像问答上互相对弈：

    - 回答者（MLLM-A） 对图像生成答案。

    - 挑战者（MLLM-B） 看到图像和回答，被要求找出回答中的错误或幻觉，并提出质疑。

    - 回答者 收到质疑后修正答案。

    - 多轮交替后，双方都在“攻击-防御”中提升了对视觉细节的敏感度和推理严谨性。

    这种模式类似于生成对抗网络（GAN）中的判别器-生成器博弈，但发生在语义层面。

    模式三：偏好自我对弈（SPIN）在多模态中的扩展

    在文本LLM中，SPIN让模型与上一版本自己的输出进行对比，主模型需要生成优于旧版本的输出。扩展到多模态：

    - 给定图像和问题，当前模型生成回答A。

    - 上一代模型对同样输入生成回答B。

    - 用自动评估器（或人类）判断哪个回答更好，生成偏好对（A > B 或 B > A）。

    - 用DPO训练当前模型，使其倾向于生成优于旧模型的回答。

    - 迭代多轮，模型不断超越过去的自己。

content:
  prompt: 长视频理解中，如何有效记忆和检索长时间跨度的信息？
answer:
  mode: rubric
  reference_answer: |-
    长视频（数十分钟到数小时）包含海量时空信息，直接全部送入模型计算量不可承受，必须设计高效的记忆和检索机制。

    核心技术方案：

    层次化记忆架构示例：

    [图片内容未导入]

    检索流程：

    - 用户提问“那个穿红衣服的人在什么时候出现的？”

    - 先从长期记忆中判断视频中是否有红衣服人物。

    - 若有，根据中期记忆的时间戳，定位到人物可能出现的几分钟范围。

    - 在该范围内激活短期记忆，进行高分辨率帧检索，找到精确时间点。

    前沿方向：将长视频记忆建模为“可学习的记忆token序列”，通过交叉注意力机制让LLM在生成时动态从记忆库中检索。这种方法无需人工设计层次，完全由模型学习哪些信息值得记住。


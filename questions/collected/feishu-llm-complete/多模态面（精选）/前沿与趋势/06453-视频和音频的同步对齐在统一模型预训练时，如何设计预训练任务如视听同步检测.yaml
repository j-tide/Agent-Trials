content:
  prompt: 视频和音频的同步对齐在统一模型预训练时，如何设计预训练任务？如视听同步检测。
answer:
  mode: rubric
  reference_answer: |-
    视频和音频天然携带时间维度，且两者在物理世界中有因果关联（物体碰撞产生声音、嘴唇运动与语音对应）。利用这种天然同步性，可以设计强大的自监督预训练任务。

    核心预训练任务：

    具体训练策略：

    - 构造训练数据：从视频中随机采样一个时间窗口的视频帧序列和对应的音频段作为正样本对。负样本可以通过以下方式构造：

    - 多任务联合训练：在统一模型预训练中，这些任务不是孤立的，而是与图文对比、文本生成等任务混合训练。通过在总损失中分配权重，模型同时学习静态图像-文本对齐和动态音视频对齐。

    - 时间Transformer的引入：对于视频输入，在空间Transformer之后加入时间注意力层。对于音频，也采用类似架构。两者在时间维度上的表示可以进行对比学习。

    这种预训练让模型理解“声音是由视觉事件引起的”这一物理常识，对于视频问答、事件定位和跨模态生成（如给视频配音效）至关重要。


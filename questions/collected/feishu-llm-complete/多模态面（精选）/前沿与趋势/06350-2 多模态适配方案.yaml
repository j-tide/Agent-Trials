answer:
  mode: rubric
  reference_answer: |-
    视频理解：将视频帧序列拼接为超长 token 流，Mamba 作为视觉编码器的主干，替代 ViT 或 TimeSformer。其隐状态随帧推进而更新，天然捕捉时序依赖，无需显式的时间注意力。

    多模态文档处理：扫描文档可能长达数百页，文本 token 与图像 patch token 混合形成长序列。Mamba 可以一次处理整个文档，生成跨页面的连贯理解，而 Transformer 需要滑动窗口或分块处理。

    多模态对话：多轮对话历史中夹杂多张图片，总 token 数随着对话轮次累积。Mamba 的固定隐状态可以高效维护对话状态，避免 KV 缓存的线性膨胀。

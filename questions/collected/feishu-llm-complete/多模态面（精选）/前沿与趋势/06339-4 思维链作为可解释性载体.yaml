  prompt: 2.4 思维链作为可解释性载体
answer:
  mode: rubric
  reference_answer: 思维链（Chain-of-Thought）推理本身就是一种强大的可解释性机制。当模型输出“我看到图中有三个苹果和两个橘子，所以总共有五个水果”时，它同时在完成推理和提供解释。多模态思维链更进一步——模型可以在推理的每一步指明它在图像中看到了什么证据，将视觉定位和文本推理融为一体。

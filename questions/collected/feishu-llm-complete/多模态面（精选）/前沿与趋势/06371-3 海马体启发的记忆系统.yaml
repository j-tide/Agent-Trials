  prompt: 4.3 海马体启发的记忆系统
answer:
  mode: rubric
  reference_answer: 人脑海马体负责将短时记忆巩固为长时记忆，并在睡眠中“回放”白日经历。多模态模型的持续学习可以借鉴这一机制：在训练过程中周期性地“回放”旧任务的代表性样本（经验重放），或使用生成模型“做梦”合成旧数据，以此抵抗灾难性遗忘。此外，海马体的快速学习和皮层慢速学习的分工启发了两阶段训练策略——先在少量数据上快速原型（类比海马），再通过大量数据巩固（类比皮层）。

content:
  prompt: 多模态大模型与知识图谱结合有哪些方式？能否动态检索外部知识库来减少幻觉？
answer:
  mode: rubric
  reference_answer: |-
    知识图谱（KG）提供结构化、可验证的事实知识，恰好可以弥补MLLM因训练数据噪声或覆盖不全导致的幻觉问题。两者的结合从浅到深有多个层次。

    结合方式：

    动态检索外部知识库减少幻觉的具体流程：

    - 实体链接：从用户问题和图像中抽取关键实体（如“鸮鹦鹉”），在KG中定位对应节点。

    - 子图检索：以这些实体为中心，检索1-2跳内的邻居节点和关系，形成知识子图。

    - 知识序列化：将子图转化为MLLM可理解的文本描述。例如：“鸮鹦鹉，是一种鹦鹉，特性：不会飞，栖息地：新西兰，保护状况：极危。”

    - 知识注入生成：将上述文本与原始问题、视觉token一起输入MLLM，生成回答。这样生成的回答基于检索到的权威知识，幻觉显著降低。

    - 事后校验（可选额外步骤）：MLLM输出的关键事实可再次查询KG进行验证。

    关键挑战：实体从图像中链接到KG的准确率；KG的覆盖度和时效性；多跳推理的计算延迟。随着KG构建自动化（如用LLM从文本中抽取三元组）和向量化检索的发展，这些挑战正在被逐步克服。


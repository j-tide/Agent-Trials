content:
  prompt: 5.1 风格的理解与编码
answer:
  mode: rubric
  reference_answer: |-
    艺术风格是一个多维度、难以精确定义的概念。多模态模型理解风格的途径包括：从大量某风格的作品中学习其视觉统计特征（笔触纹理、色彩分布、构图偏好），从艺术评论和理论文本中学习风格的定义和描述，以及通过对比不同风格作品学习风格间的差异维度。

    风格编码的技术路径有两条：一是使用预训练的视觉编码器（如CLIP ViT）提取风格图像的嵌入向量，作为“风格指纹”；二是用艺术理论中的可解释维度（色调、饱和度、笔触大小、构图对称性等）来结构化描述风格。前者更适合机器匹配，后者更适合人机协作。

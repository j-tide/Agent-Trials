answer:
  mode: rubric
  reference_answer: |-
    具身Agent的动作输出可以是语言描述、动作基元、或连续关节角度。分为两个层级：

    层级一：高层任务规划
    LLM输出动作基元序列，如[导航到桌子, 抓取红色杯子, 移动到厨房, 放下]。每个基元由低级控制器执行。

    层级二：低层控制命令

    直接输出关节角度或末端速度。常用策略：

    - 行为克隆(BC)：从人类遥操作数据中学习状态->动作的映射。

    - 强化学习(RL)：在模拟器中训练策略网络，多模态信息作为state输入，输出连续动作。

    - 基于语言的模型预测控制：LLM生成中间关键点（如目标物体的抓取点坐标），再通过运动规划器求解关节轨迹。

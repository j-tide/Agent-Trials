content:
  prompt: 6.1 技术可行性
answer:
  mode: rubric
  reference_answer: |-
    多模态模型确实可以从面部表情、语音和文本中提取情绪相关特征：

    面部表情分析。通过分析面部动作单元（AU），可以识别基本情绪（快乐、悲伤、愤怒、恐惧、惊讶、厌恶）的客观面部表现。这与传统计算机视觉的面部表情识别类似，但多模态模型可以结合上下文做出更准确的判断——例如，一个人流泪可能是悲伤，也可能是喜极而泣，需要结合场景和文本内容来区分。

    语音分析。语音中的韵律特征（语速、音调变化、停顿模式、音量）携带着丰富的情绪信息。多模态模型可以同时处理语音的声学特征和转录文本的语义内容，捕捉文本中说出来的和没说出来的之间的张力。

    文本分析。语言中的词汇选择、句子结构、叙述模式是心理健康评估的重要信号。多模态模型的分析可以超越简单的情绪词匹配，理解反讽、回避、过度概括等复杂的认知模式。

    然而，基于多模态信号的情绪评估存在科学性争议。心理学研究表明，基本情绪与面部表情之间的对应关系并非普遍且确定——同一表情在不同文化、不同个体、不同情境下可能表达不同情绪。将多模态信号直接映射到心理状态存在过度简化的风险。当前技术更适合做情绪倾向的辅助提示，而非临床诊断。

content:
  prompt: 6.1 生成高质量合成数据的方法
answer:
  mode: rubric
  reference_answer: |-
    方法一：基于模板的受控生成

    不依赖模型自由发挥，而是设计精细的提示模板，确保生成的格式规范、覆盖全面。

    示例：为VQA生成合成数据

    图像：[输入图像]
    请根据此图像生成3个问答对：
    1. 一个关于物体属性的问题（颜色、大小、材质）
    2. 一个关于空间关系的问题（位置、相对关系）
    3. 一个需要推理的问题（功能、原因、比较）

    每个问题提供4个选项，包括1个正确答案和3个合理但错误的选项。
    输出格式：JSON

    这种受控生成确保了数据的结构和难度分布。

    方法二：多模型协作生成与校验

    单个模型容易犯错，多模型协作可以大幅提升质量：

    - 生成者（大模型A）：生成候选数据。

    - 校验者（大模型B，不同架构或版本）：逐条检查事实准确性、逻辑性。

    - 润色者（大模型C）：对通过校验的数据进行语言优化。

    - 只有三模型都认可的数据才进入训练集。

    方法三：基于真实数据种子进行增强

    不凭空生成，而是基于已有的高质量真实数据做“有根增强”：

    - 图像不变，用LLM改写问题和答案（保持语义，增加多样性）。

    - 对图像做可控编辑（如改变颜色、添加/移除物体），相应更新文本标签。

    - 从真实描述中抽取实体和关系，构建场景图，再根据场景图反向生成新的描述文本。

content:
  prompt: 文生图模型生成的图像可否用于数据增强训练分类器？需要注意哪些分布偏移问题？
answer:
  mode: rubric
  reference_answer: |-
    可以，且已被广泛研究和应用。文生图模型能够为分类器提供近乎无限的训练数据，尤其在长尾类别、少样本场景中极具价值。但必须仔细处理生成数据与真实数据之间的分布偏移，否则可能反而降低性能。

    可用于数据增强的场景：

    [嵌入表格未展开]

    分布偏移问题：

    生成图像与真实图像在多个层面上存在差异，这些差异会引入噪声，误导分类器。

    [嵌入表格未展开]

    评估与策略：

    - 在使用生成数据增强前，先在验证集上对比仅用真实数据、仅用生成数据、混合数据三种方案的分类准确率，确保生成数据确实带来增益。

    - 使用渐进式数据增强：先用生成数据预训练，再用真实数据微调。这可以减轻噪声的影响。

    - 加入真实数据的小比例混合，防止模型过度拟合生成图像的特定伪影。

    - 量化生成数据的分布偏移程度（如FID、KID），过高的FID意味着需要更好的生成模型或数据过滤。

    总之，文生图模型作为数据增强工具极具潜力，但必须经过仔细的偏差检测和数据策展，才能安全有效地部署在分类任务中。


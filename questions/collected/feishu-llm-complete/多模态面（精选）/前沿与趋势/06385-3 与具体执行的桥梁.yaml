  reference_answer: |-
    输出的步骤是文本，需要下游的具身执行系统或人来执行。对于Agent来说，可进一步将步骤分解为更细粒度的动作基元。视觉规划的价值在于将复杂的多步推理前置到感知阶段，减少了试错成本。

    ---

    ### 在 Web Agent 中，如何将 HTML DOM 树和屏幕截图这两种模态进行结构化对齐？

    HTML和截图是对同一界面的两种不同模态描述，结构化对齐的目标是让模型知道DOM中的每个元素对应截图上的哪个视觉区域，从而既可以理解语义结构，又能进行精确空间定位。

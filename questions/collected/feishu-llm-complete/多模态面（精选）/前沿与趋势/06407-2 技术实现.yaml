answer:
  mode: rubric
  reference_answer: |-
    Agent在调用工具时，在请求中指定返回格式为image或mixed。工具执行后将截图以Base64编码或URL形式返回。Agent的视觉编码器对返回的图片编码，作为新一轮视觉token，与任务上下文一起输入LLM推理下一步。

    优化技巧：

    - 对工具返回的图片可进行适当压缩或降分辨率，控制视觉token数量。

    - 在prompt中明确区分“原始用户图像”和“工具返回图像”，避免混淆。

    - 对于多轮工具调用，维护一个视觉历史缓存，仅保留最近几次的关键视觉结果。

    这种能力让Agent从“被动观察者”升级为“主动获取信息的探索者”，是通向自主完成复杂真实任务的关键一步。

    ---

    ### 如何让多模态 Agent 具备“反思”能力：执行动作后，观察视觉反馈并判断是否成功。

    反思是多模态Agent鲁棒性的核心。它需要在每一动作后，利用新的视觉观察来评估动作效果，并在失败时调整策略。

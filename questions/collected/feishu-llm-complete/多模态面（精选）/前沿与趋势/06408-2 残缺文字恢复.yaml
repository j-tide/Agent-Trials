  prompt: 7.2 残缺文字恢复
answer:
  mode: rubric
  reference_answer: |-
    出土的泥板、石碑、竹简往往文字残缺。多模态模型可以结合多个信息源来恢复缺失的文字：残存文字的笔画轨迹（视觉）；已知的语言模型（该古代语言的常用词汇和语法模式）；上下文（残存文字的前后文语义）；同类文本（同一时期、同一地区的其他文本中类似的表达）。

    技术上，这类似于“完形填空”任务——模型在给定可见文字和语言先验的条件下，预测缺失部分的文字。但考古文字的挑战在于训练数据极度稀缺，需要利用迁移学习、少样本学习和领域专家的知识注入。

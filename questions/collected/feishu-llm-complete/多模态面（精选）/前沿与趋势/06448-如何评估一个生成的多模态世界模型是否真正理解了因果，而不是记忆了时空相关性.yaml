    前沿方向：因果探针与表示分析

    在模型内部训练探针，检测隐藏层是否编码了因果变量（如力、质量）及其因果图结构。如果探针发现模型显式地维护了这些变量，并能根据干预更新它们，那么可以认为模型具有某种程度的因果理解。

    当前局限：多数生成模型在反事实和组合泛化测试中表现不佳，表明它们仍主要依赖统计相关性。迈向真正的因果世界模型还需要架构上的创新（如引入因果归纳偏置）、训练范式的改进（如交互式学习、主动实验），以及更丰富多样的训练数据。Sora等模型虽然在视觉一致性上惊人，但在严格的因果测试下仍可能暴露记忆的本质。但这正是研究的前沿，也是通往可靠世界模型的必经之路。

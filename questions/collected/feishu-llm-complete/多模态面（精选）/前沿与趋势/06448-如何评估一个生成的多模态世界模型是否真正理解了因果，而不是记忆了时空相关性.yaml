content:
  prompt: 如何评估一个生成的多模态世界模型是否真正理解了因果，而不是记忆了时空相关性？
answer:
  mode: rubric
  reference_answer: |-
    区分因果理解与统计记忆是世界模型评估中最核心的挑战之一。记忆模型可以在训练分布内做出完美预测，但面对分布外或反事实问题时立刻失败。因果理解则意味着模型把握了“为什么”会发生，从而能在新情境下正确推理。

    评估框架：干预-结果一致性测试

    核心思想来自因果推断中的干预主义：如果模型真正理解了因果，那么对原因变量的干预应该产生符合物理或逻辑规律的预测结果，且这种结果应独立于训练数据中的统计相关性。


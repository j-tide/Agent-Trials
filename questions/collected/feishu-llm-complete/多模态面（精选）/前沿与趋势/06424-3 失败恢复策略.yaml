  prompt: 8.3 失败恢复策略
answer:
  mode: rubric
  reference_answer: |-
    当反思模块判断动作失败后，Agent进入“异常处理”子流程：

    - 取消意外弹窗：如果检测到广告或权限请求弹窗，尝试点击关闭或拒绝。

    - 重试当前动作：如果是网络加载延迟导致的超时，等待并重试。

    - 返回上一级：如果进入了错误的页面，执行返回操作。

    - 重新规划：如果连续失败，放弃当前计划，根据最新的视觉状态重新全局规划。

    实现方式：反思逻辑可以集成在ReAct循环中。LLM在生成下一动作前，需要先输出一段“反思”文本：“前一步点击了[14]，但界面并未跳转，可能因为网络延迟。我将等待2秒后再重试。”然后执行重试动作。


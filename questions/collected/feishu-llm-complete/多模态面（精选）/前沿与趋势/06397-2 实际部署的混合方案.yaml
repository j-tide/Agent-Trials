  prompt: 6.2 实际部署的混合方案
answer:
  mode: rubric
  reference_answer: |-
    生产环境中最可靠的是“SoM + DOM剪枝 + 坐标”的组合：

    - DOM剪枝与增强：仅保留可交互元素，生成精简HTML序列。为每个元素添加id、text和bbox属性。

    - 截图标注：基于DOM元素的bbox在截图上绘制SoM标记。

    - 输入到LLM：将标注后的截图和附带ID的精简HTML一起输入LLM。

    - 动作输出：LLM通过引用元素ID输出动作，无需预测坐标。

    这种方法将视觉-文本对齐问题外化到了前端预处理，LLM专注于高层理解和决策，简洁且鲁棒。

    ---

    ### 多模态 Agent 调用工具时，能否让工具直接返回视觉结果，再让 Agent 分析？

    完全可以，且这是多模态Agent扩展感知边界的重要方式。 工具不再局限于返回文本结果，而是可以将截图、渲染图、检索到的图片等视觉信息直接返回给Agent，形成“视觉观察-工具执行-视觉反馈”的闭环。

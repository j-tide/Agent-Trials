  prompt: 9.2 典型预警流程
answer:
  mode: rubric
  reference_answer: |-
    以洪水预警为例：

    多模态模型首先分析近期的卫星图像序列，提取地表水体面积的变化趋势，同时结合气象预报中未来72小时的降水预测，以及地面水文站的水位数据。模型综合这三种模态的信息，预测可能的淹没区域和时间。

    对于森林火灾预警，模型融合卫星热红外图像（检测高温异常点）、气象数据（高温、干旱、风速条件）、植被状态（从多光谱卫星图像中计算的植被健康指数）和闪电定位数据（可能的火源）。当多个模态的证据指向一致时，系统发出分级预警。

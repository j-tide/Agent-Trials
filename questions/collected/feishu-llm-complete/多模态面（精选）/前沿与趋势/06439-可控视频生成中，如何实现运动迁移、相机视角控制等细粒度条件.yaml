content:
  prompt: 可控视频生成中，如何实现运动迁移、相机视角控制等细粒度条件？
answer:
  mode: rubric
  reference_answer: |-
    可控视频生成要求在生成视频时精确控制其中的特定属性，如物体如何运动、相机如何移动。实现这些细粒度控制需要将控制信号编码为模型可理解的条件，并注入生成过程。

    - 运动迁移 (Motion Transfer)

    运动迁移指将一段参考视频中的运动模式（如一个人跳舞的动作）迁移到另一张静态图像上，生成新视频。核心技术路径有两条：

    [嵌入表格未展开]

    运动迁移的关键挑战是外观保持：迁移后的视频必须保持源图像的人物身份和服装细节。通常需要在损失函数中加入身份保持损失（如人脸识别特征距离）或使用专门的注意力注入技术，将源图像的特征作为生成过程中交叉注意力的参考。

    - 相机视角控制 (Camera Viewpoint Control)

    相机视角控制要求生成视频时能够指定相机如何移动（平移、旋转、变焦）。实现方法包括：

    [嵌入表格未展开]

    在扩散模型中，相机参数可以像时间步t一样通过自适应归一化层注入。对于DiT架构，adaLN-Zero可以同时接受时间步、文本条件和相机参数，回归出层归一化的调节参数。此外，一些方法在U-Net或DiT中插入专门的“相机控制交叉注意力层”，让生成过程的每一步都能关注到相机运动序列。

    - 其他细粒度条件

    [嵌入表格未展开]

    多条件融合：实际应用中往往需要同时控制多个属性（如运动+相机+物体位置）。这要求模型支持多模态条件的联合注入。常用策略是将不同条件编码后拼接或求和，或者使用交叉注意力让模型自行选择关注哪些条件。ControlNet的组合式设计允许将多个ControlNet的输出相加，实现多个空间条件的联合控制。


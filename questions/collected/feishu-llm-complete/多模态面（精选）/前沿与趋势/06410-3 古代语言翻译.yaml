  reference_answer: 对于古埃及象形文字、楔形文字等，多模态模型可以同时学习文字符号的视觉形态和对应的现代语言翻译。这种“视觉符号→语义”的直接映射可以绕开传统翻译中需要先转写为音素再翻译的繁琐流程。模型可以利用已破译文本作为训练数据，辅助翻译尚未完全破译的文本，为考古学家提供参考译文。

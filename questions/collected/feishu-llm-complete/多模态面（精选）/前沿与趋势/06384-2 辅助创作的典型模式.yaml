  prompt: 5.2 辅助创作的典型模式
answer:
  mode: rubric
  reference_answer: |-
    风格迁移与融合。用户提供一张内容图（如“一只猫”）和一张风格参考图（如梵高的《星空》），模型生成将星空风格应用于猫的图像。多模态模型的优势在于可以用文本精细控制迁移的程度和范围：“保持猫的脸部写实，但让背景呈现梵高风格”。

    文本引导的创作与迭代。用户用自然语言描述想法，模型生成初稿。用户看到结果后给出修改意见（“颜色再暖一点”、“构图向左偏移”），模型根据多轮对话迭代优化。这种交互式创作将艺术家从重复性劳动中解放出来，专注于创意决策。

    跨媒介创作。多模态模型可以将一种艺术形式“翻译”为另一种：将一首诗转换为一段配乐，将一段舞蹈视频转换为抽象画，或将一幅画作扩展为一部短视频。这种跨媒介翻译依赖于模型对不同媒介艺术语言（视觉的构图、音乐的和弦进行、舞蹈的肢体语汇）的内在理解。

    风格分析与灵感推荐。模型分析艺术家当前作品的风格特征，从艺术史数据库中检索风格相近或形成有趣对比的作品，供艺术家参考。这种“AI策展”可以打破创作中的灵感瓶颈。

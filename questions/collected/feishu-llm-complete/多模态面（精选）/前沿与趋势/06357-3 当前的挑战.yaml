  reference_answer: |-
    Mamba 的设计主要针对一维序列，对图像等二维数据的空间结构需要额外的处理（如将图像展平为序列，或使用二维 SSM 变体）。此外，Mamba 在需要细粒度全局对齐的任务（如精确的文本-图像区域匹配）上，其线性机制是否能匹敌注意力机制的全连接能力，仍需大量实验验证。但作为长序列多模态建模的潜力股，Mamba 及其后续工作（如 Vision Mamba、Vim）正受到越来越多的关注。

    ### 脑启发的多模态学习架构：脉冲神经网络及其它

    人工智能的起点本就是模拟人脑，而人脑是天生的多模态信息处理器。近年来，脑启发的人工智能架构在多模态学习中涌现出多条技术路径。

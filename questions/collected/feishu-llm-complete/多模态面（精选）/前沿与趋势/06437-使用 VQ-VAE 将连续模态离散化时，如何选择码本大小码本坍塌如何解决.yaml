content:
  prompt: 使用 VQ-VAE 将连续模态离散化时，如何选择码本大小？码本坍塌如何解决？
answer:
  mode: rubric
  reference_answer: |-
    VQ-VAE将连续特征映射到离散的码本向量，是统一多模态token化的核心技术。码本大小和码本坍塌是其两大核心挑战。

    码本大小选择：

    选择原则：

    - 码本太小 → 信息压缩过重，重建质量差，无法保留细节。

    - 码本太大 → 大量码本向量在训练中从未被使用（码本坍塌），浪费计算和内存，且导致训练不稳定。

    - 经验法则：码本大小应为该模态典型数据中可区分“视觉/听觉概念”数量的2-4倍。

    码本坍塌的表现与解决：

    码本坍塌指训练过程中只有极少数码本向量被使用，大部分码本成为“死向量”，模型表达能力退化。

    表现：

    - 码本使用率极低（如8192个码本仅使用100个）。

    - 重建图像的多样性丧失，无论输入什么图像，输出都趋于平均化。

    根本原因：

    - 编码器输出的特征向量与码本初始向量的距离过大，导致少数向量“胜者通吃”。

    - 优化器的动量使得少数活跃向量更新频繁，而其他向量梯度为零，停滞不前。

    解决方法：

    最佳实践：推荐使用“EMA更新码本 + 分组码本 + 码本重启”的组合方案。在训练初期用较大的码本（如16384），配合温和的熵正则化；如果检测到使用率低于50%，则触发码本重启。


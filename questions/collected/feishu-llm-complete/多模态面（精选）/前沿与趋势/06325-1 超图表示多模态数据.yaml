content:
  prompt: 2.1 超图表示多模态数据
answer:
  mode: rubric
  reference_answer: |-
    将每个模态的数据样本（图像片段、文本单词、音频频谱块）作为节点，将属于同一“多模态实例”的多个节点用一条超边连接。例如，一段视频中出现的“火车画面”、“火车声音”和“字幕‘火车经过’”这三个模态片段共享一条超边，表示它们属于同一事件。

    在这个超图中，信息传播不再受限于两两交互。超图神经网络（HGNN）通过“节点→超边→节点”的两阶段聚合来更新表示：

    - 聚合到超边：将超边连接的所有节点的特征聚合，形成该超边的表示。

    - 分发到节点：将超边的表示分发回给其连接的各节点，更新节点特征。

    这种机制使得信息可以在多个模态间同时交换，而非分步对齐。

answer:
  mode: rubric
  reference_answer: |-
    Plan-and-Execute先制定完整计划，再逐步执行。视觉在计划阶段参与程度可分两级：

    静态视觉规划：仅根据初始场景照片生成整体计划。例如，看到一张厨房照片，生成步骤清单：“1.取出冰箱里的鸡蛋 2.打蛋 3.开火 4.炒蛋”。优点是快速，缺点是缺乏中间反馈，计划可能因环境动态变化而失效。

    动态视觉重规划：每执行一步后，用新观察更新计划。可以维护一个“计划栈”和“当前环境状态摘要”，在每步后由LLM评估执行结果，必要时修订后续计划。这是更鲁棒的方式，结合了ReAct的反馈优势和Plan的全局结构。

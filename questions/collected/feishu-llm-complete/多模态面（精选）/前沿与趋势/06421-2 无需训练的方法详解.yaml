  reference_answer: |-
    上下文学习 (In-Context Learning)

    在MLLM的提示词中给出2-5个示例，格式与目标任务完全一致。模型无需任何参数更新，仅通过示例理解任务。

    示例：适配为医学影像报告生成器

    以下是一些胸部X光片及其报告：
    [图1] 报告：心脏大小正常，肺部清晰，未见明显异常。
    [图2] 报告：左下肺可见片状阴影，提示感染可能，建议临床随访。

    请以相同格式为以下X光片生成报告：
    [新图]
    报告：

    关键技巧：

    - 示例的格式和风格必须与期望输出完全一致。

    - 示例应覆盖任务中的不同情况（正常/异常、常见/罕见）。

    - 示例的顺序会影响性能，通常将最重要的示例放在最后（近因效应）。

    - 可以使用动态示例选择：根据当前输入，从示例库中检索最相似的示例。

    视觉提示 (Visual Prompting)

    不修改模型参数，而是修改输入图像本身来引导模型行为。

    [嵌入表格未展开]

    工具调用增强

    让MLLM调用外部工具来完成自身不擅长的子任务，而无需训练模型本身。

    用户：这张财务报表中，2024年Q3的总利润是多少？
    模型思路：我需要精确读取表格中的数字并计算。
    动作：调用OCR工具提取表格文字 → 调用Python解释器计算总和。
    输出：根据OCR结果，2024年Q3总收入为500万，成本为320万，总利润为180万。

    工具调用的实现可以通过：

    - Function Calling：MLLM输出结构化函数调用JSON，外部系统执行并返回结果。

    - 程序生成：MLLM生成Python代码，执行后获取结果。

    - 集成专用模型：将OCR、目标检测、SAM分割等视觉工具作为可调用的API。

    检索增强生成 (RAG)

    在推理时动态检索外部知识，无需将知识内化到模型参数中。

    多模态RAG流程：

    - 用户提问（可附带图像）。

    - 从向量数据库中检索相关文档块、图像、或图文对。

    - 将检索结果作为附加上下文，与原始问题一起输入MLLM。

    - MLLM基于检索到的知识生成回答。

    关键设计：

    - 使用多模态嵌入模型（如CLIP）对图像和文本统一索引。

    - 检索结果需保留来源元数据，支持引用溯源。

    - 对于知识快速更新的领域（如政策、新闻），RAG比微调更及时。

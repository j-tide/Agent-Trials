answer:
  mode: rubric
  reference_answer: |-
    方法一：LLM函数调用（Function Calling）

    在prompt中描述每个工具的用途、输入参数和输出格式。LLM根据当前任务需求，自动生成调用哪个工具的函数调用JSON。例如：“我需要读取这个按钮上的文字，调用OCR工具，输入参数为区域[100,200,300,250]”。

    方法二：轻量级路由器

    训练一个小型分类器，输入LLM的当前隐藏状态或文本摘要，输出最适合的工具。比LLM路由更快，但灵活性略低。

    方法三：基于意图的多级路由

    先由LLM解析出高层意图（如“识别文字”、“定位物体”），再由规则引擎路由到具体工具。这减少了LLM对工具细节的依赖。

    路由决策的关键考量：

    - 精度与速度权衡：简单的OCR直接本地执行，复杂场景理解调用云端大模型。

    - 工具优先级：当多个工具都能完成同一任务时，根据历史成功率或延迟自动选择最优工具。

    - 容错与降级：如果首选工具失败，自动路由到备选工具。


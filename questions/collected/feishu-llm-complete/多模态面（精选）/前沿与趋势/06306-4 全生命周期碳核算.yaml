  reference_answer: |-
    真正负责任的做法是进行全生命周期碳足迹追踪——不仅计算训练时的GPU用电，还包括芯片制造的隐含碳排放（一颗A100的制造碳排放约为150kg CO₂）、数据中心基础设施、以及推理阶段数十亿次请求的累积能耗。工具如MLCO2和CodeCarbon可以帮助团队量化每一步的排放，进而制定有针对性的减排策略。


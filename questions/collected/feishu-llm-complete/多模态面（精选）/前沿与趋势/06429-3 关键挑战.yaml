  prompt: 9.3 关键挑战
answer:
  mode: rubric
  reference_answer: |-
    多模态数据的时空对齐是核心挑战。卫星图像的空间分辨率从10米到1公里不等，时间分辨率从每天到每两周不等；气象数据是网格化的数值；地面传感器是稀疏的点状分布。将这些不同时空尺度的数据统一到同一框架下进行推理，需要复杂的数据同化和空间插值技术。

    极端事件的罕见性。最需要预警的往往是百年一遇的极端灾害，但训练数据中这类样本极少。模型需要通过物理仿真生成大量合成灾害场景进行训练，并结合人类专家的先验知识。

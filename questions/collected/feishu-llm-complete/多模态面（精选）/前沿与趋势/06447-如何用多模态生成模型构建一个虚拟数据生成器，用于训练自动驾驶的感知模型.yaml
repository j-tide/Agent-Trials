content:
  prompt: 如何用多模态生成模型构建一个“虚拟数据生成器”，用于训练自动驾驶的感知模型？
answer:
  mode: rubric
  reference_answer: |-
    自动驾驶感知模型需要海量、多样化、标注精确的训练数据，而真实世界的数据采集成本高昂、覆盖场景有限。多模态生成模型（包括文生图、文生视频、3D场景生成）可以构建虚拟数据工厂，以极低成本生产无限贴近真实的数据。


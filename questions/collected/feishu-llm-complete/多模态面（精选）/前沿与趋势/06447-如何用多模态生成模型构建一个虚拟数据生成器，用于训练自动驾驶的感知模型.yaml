    [图片内容未导入]

    具体实现路径：

    [嵌入表格未展开]

    关键技术细节：

    - 保证标注精度：生成过程中，利用ControlNet等空间控制手段，在生成图像的同时输出对应的语义分割图、深度图、法线图。这些“条件图”天然成为完美的像素级标签。

    - 缩小域差距：生成图像与真实图像存在分布差异。可以通过域适应技术（如CycleGAN、域随机化）或微调感知模型（在生成数据上预训练，在少量真实数据上微调）来缓解。

    - 长尾场景生成：利用LLM生成罕见的交通场景描述（如“一只鹿突然从树丛中跳出，雪天路面结冰”），再由生成模型产生对应图像和标注。这能有效扩充模型对极端情况的覆盖。

    - 时序一致性：对于视频数据，使用视频扩散模型或神经渲染，确保物体在连续帧中运动平滑、外观一致。这是训练跟踪和预测模型的基础。

    实际应用：Waymo、Cruise等公司已使用生成式方法扩充训练集。学术界如DriveGAN、BEVGen等工作也展示了生成数据对提升自动驾驶感知的有效性。未来，随着视频生成模型质量的提升，“虚拟数据生成器”将成为自动驾驶训练数据的主要来源之一。


answer:
  mode: rubric
  reference_answer: |-
    SNN 的训练仍然具有挑战性——脉冲的不可微性使得反向传播难以直接应用，代理梯度方法虽然有效但精度仍略逊于同规模的人工神经网络。此外，大规模多模态 SNN 的预训练范式尚未成熟，缺乏像 CLIP 那样的通用对齐模型。但随着神经形态硬件的普及和训练算法的进步，SNN 在多模态事件处理上的应用前景广阔。

    ### 超图神经网络如何用于建模多个模态间的高阶关系？

    传统图神经网络（GNN）使用“边”连接两个节点，只能表达成对关系。但在多模态数据中，一个视觉物体、一段文字描述、一段音频录音三者可能共同组成一个语义单元——这种三元甚至多元的关联，需要用超图来建模。超图中的“超边”可以同时连接任意数量的节点，天然适合表达跨模态的高阶组合。

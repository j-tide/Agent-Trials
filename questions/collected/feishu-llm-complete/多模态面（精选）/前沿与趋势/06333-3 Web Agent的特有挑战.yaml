answer:
  mode: rubric
  reference_answer: |-
    - 动态内容：页面可能异步加载，初始HTML不完整。Agent需持续观察并等待关键元素出现。

    - 巨量DOM：一个复杂网页可能有数千个DOM节点。必须进行剪枝：仅保留可交互元素（a, button, input, select等），或将层级压缩为摘要。

    - 跨域泛化：不同网站的HTML结构和视觉风格差异极大。SoM方案可屏蔽底层HTML差异，仅依赖视觉标记，泛化能力更强。

    ---

    ### 具身智能中，多模态模型如何结合视觉、语言和机器人状态来完成指令？

    具身智能要求机器人在物理世界中执行任务，输入包括：RGB-D图像、语言指令、本体感觉（关节角度、末端位姿、力矩）、触觉等。输出是底层动作序列或高层动作基元。

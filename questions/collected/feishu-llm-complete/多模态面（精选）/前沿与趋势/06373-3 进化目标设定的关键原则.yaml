  prompt: 4.3 进化目标设定的关键原则
answer:
  mode: rubric
  reference_answer: |-
    - 多维而非单一：单一目标极易被黑客攻击（Goodhart's Law）。必须用多个指标的加权组合，涵盖质量、多样性、安全性、效率。

    - 动态而非静态：目标需随模型成长而更新。当模型在某一指标上已达天花板，应降低其权重，提高其他维度的重要性。

    - 外部验证而非自说自话：进化目标中至少包含一部分独立于模型的外部信号（人类反馈、物理环境反馈、独立评测模型），切断自我欺骗的闭环。

    - 安全约束为硬边界：在追求进化目标的同时，设定不可逾越的安全红线（如不允许生成有害内容），一旦触犯立即停止进化并回滚。

    ### 如何通过合成数据，让小模型获得大模型的多模态推理能力？蒸馏中的关键步骤是什么？

    将大型MLLM（如GPT-4V）的推理能力迁移到小型模型（如7B参数），是低成本部署多模态应用的关键。这个过程的核心是通过合成数据实现知识蒸馏。

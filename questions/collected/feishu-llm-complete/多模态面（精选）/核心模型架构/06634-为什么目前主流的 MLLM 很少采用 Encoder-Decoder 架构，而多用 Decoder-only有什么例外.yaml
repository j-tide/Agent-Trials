content:
  prompt: 为什么目前主流的 MLLM 很少采用 Encoder-Decoder 架构，而多用 Decoder-only？有什么例外？
answer:
  mode: rubric
  reference_answer: |-
    主流多模态大语言模型（如 LLaVA, MiniGPT-4, Qwen-VL）压倒性地使用 Decoder-only 架构（即因果自回归 Transformer，如 GPT），而不是 Encoder-Decoder（如 T5）。原因如下：

    - 与 LLM 预训练的自然契合：当前最强的 LLM（GPT-4, LLaMA, PaLM 等）几乎都是 Decoder-only。MLLM 通过在它们基础上添加视觉模块，能最大限度地继承其强大的语言能力、世界知识和推理能力。无需从头开始预训练。

    - 架构极简：Decoder-only 模型是自回归的，只需要一种 Transformer 层和单向注意力掩码。视觉 token 和文本 token 可以直接拼接输入，无需设计复杂的 Encoder-Decoder 交叉注意力。

    - 效率与扩展性：在同等参数规模下，Decoder-only 的推理效率通常更高（尤其在长序列生成时，KV 缓存易于管理）。Encoder-Decoder 需要双向编码器处理全部输入，然后再解码，对于长图文序列计算开销大，且预训练 Encoder-Decoder 的大型语言模型较少。

    - 训练数据格式简单：所有任务都可以统一为“给定多模态前缀，续写后续内容”的格式，与语言模型的自回归预训练完全一致，无需复杂的格式转换。

    例外与 Encoder-Decoder 的用武之地：

    - PaLI 系列：谷歌的 PaLI、PaLI-X 使用 Encoder-Decoder（通常是 T5 或 UL2 风格）。视觉编码器（如 ViT）将图像编码后，通过交叉注意力注入到编码器和解码器中。这种设计在密集预测任务（如目标检测、OCR）、需要强双向编码的任务上有优势，因为编码器可以非因果地充分理解图像和文本上下文。

    - Flamingo/Emu 等：虽然 Flamingo 在 LLM 中插入交叉注意力，但其 LLM 本身是 Decoder-only，因此不是纯 Encoder-Decoder，而是混合架构。

    - Unified-IO、Pix2Seq：这类统一离散 token 的模型采用 Encoder-Decoder，因为需要双向编码输入序列（可能包含图像）并生成输出序列。

    选择 Decoder-only 主要是为了最大限度地复用现有 LLM 的预训练成果，而 Encoder-Decoder 在需要强双向编码的细粒度视觉理解任务中仍有其独特的结构优势。


content:
  prompt: 在多模态生成式模型中，能否将图像生成和文本生成统一在同一个 Transformer 的 token 序列中？如 Unified-IO。
answer:
  mode: rubric
  reference_answer: |-
    可以，这正是统一多模态模型的核心思想。 Unified-IO 系列是典型代表。

    统一方式：

    - 离散化所有模态为 token：文本通过标准分词器转成 token。图像通过 VQ-VAE 或 VQ-GAN 编码器，将图像压缩并离散化为一系列视觉 token（整数索引）。其他模态（如关键点、边界框）也被离散化为专用 token。

    - 统一的序列生成：所有任务被组织成序列到序列的形式。输入序列包含任务提示、文本 token、图像 token 等；输出序列则包含要生成的文本 token 或图像 token。一个共享的编码器-解码器 Transformer 处理整个序列，使用标准的交叉熵损失（对于离散 token）。

    - 训练：模型在多种任务（图像生成、图像编辑、描述、问答、检测）的异构数据集上联合训练，学习统一的表示和生成能力。

    为什么可行：Transformer 本质上是序列到序列的通用映射器。只要将不同模态都转化为离散 token 序列，就可以用同一个自回归/自编码框架建模。挑战在于图像 token 数量巨大，导致序列极长，计算成本很高；不同任务的数据分布和难度差异可能导致训练不稳定。Unified-IO 通过精心设计的 tokenization、任务采样策略和大规模训练，证明了这一统一范式的可行性，是通向真正多模态通用模型的重要一步。


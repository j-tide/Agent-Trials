content:
  prompt: 视频-语言模型在架构上通常如何处理时间维度的输入？
answer:
  mode: rubric
  reference_answer: |-
    视频包含了时间、空间两维信息，如何高效处理时间维度是视频-语言模型的核心挑战。常见架构策略分层级递进：

    - 逐帧编码+后期时间聚合：

    - 时空分离的注意力：

    - 3D 时空 patches：

    - 记忆库/压缩网络：

    - 时间位置编码：
    上述所有方法都需要配合时间位置编码（如正弦位置编码或可学习的时间嵌入），告诉模型帧的顺序。这是视频理解的基础。

    当前主流的 MLLM 视频方案倾向于逐帧编码+后期时间聚合与压缩重采样相结合的混合策略，在效果和效率之间求取平衡。


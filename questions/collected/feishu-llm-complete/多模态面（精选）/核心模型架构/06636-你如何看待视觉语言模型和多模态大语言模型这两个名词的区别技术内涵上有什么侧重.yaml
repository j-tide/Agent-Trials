content:
  prompt: 你如何看待“视觉语言模型”和“多模态大语言模型”这两个名词的区别？技术内涵上有什么侧重？
answer:
  mode: rubric
  reference_answer: |-
    这两个术语有重叠，但侧重点不同，反映了多模态模型发展的不同阶段和设计哲学。

    视觉语言模型（VLM, Vision-Language Model）

    - 早期基础：通常指那些专门为视觉和语言任务设计的、规模较小的预训练模型。例如 ViLBERT、LXMERT、UNITER、早期的 CLIP 等。

    - 核心技术：双流或单流 Transformer，专注于图文匹配（ITM）、图文对比（ITC）、掩码语言建模（MLM）等预训练任务，然后在下游任务（VQA、检索、字幕）微调。

    - 能力范围：主要擅长判别性任务（分类、检索、匹配）和有限的理解任务，通常不具备强大的开放式文本生成能力。它们更多是“理解”模型而非“生成”模型。

    - 规模：参数通常在数亿到数十亿。

    多模态大语言模型（MLLM, Multimodal Large Language Model）

    - 新兴范式：指将视觉模块（通常是视觉编码器）与大型语言模型（LLM）相连接，使 LLM 具备理解和讨论多模态输入的能力。如 LLaVA, GPT-4o, Gemini 等。

    - 核心技术：以预训练的解码器型 LLM 为基石，通过视觉-语言投影层或更复杂的连接器（如 Q-Former）将视觉特征转化为 LLM 的输入 token。训练重点是跨模态指令微调，使 LLM 能遵循涉及图像的复杂指令。

    - 能力范围：具有强大的开放式文本生成、多轮对话、复杂推理和指令遵循能力，能够像聊天机器人一样谈论图像。它们是“生成式”和“交互式”的模型。

    - 规模：通常数十亿到数千亿参数，LLM 部分占有主要参数。

    侧重总结：

    - VLM 侧重于视觉与语言的联合表示学习和下游任务适应，核心是“对齐”。

    - MLLM 侧重于赋予大规模语言模型视觉感知和对话能力，核心是“融入”。
    MLLM 是 VLM 思想在大模型时代的自然延伸，它将视觉对齐问题从“训练一个专用模型”转变为“为现有超级大脑安装眼睛”。


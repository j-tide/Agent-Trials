content:
  prompt: Segment Anything Model (SAM) 虽然不是语言模型，但它如何与 LLM 结合形成多模态理解系统？
answer:
  mode: rubric
  reference_answer: |-
    SAM 是一个强大的图像分割基础模型，给定一个提示（点、框或掩码），它可以生成对应物体的分割掩码。它本身不是 LLM，但可以作为一种“视觉基础工具”与 LLM 紧密结合，构建语言驱动的细粒度视觉理解系统。

    结合方式：

    - LLM 生成定位指令：用户提出语言请求（“把图里的红色杯子分割出来”），LLM 解析意图并输出与 SAM 兼容的结构化提示，例如边界框坐标或点坐标。LLM 可以利用视觉 token 或外部检测器来产生这些坐标。

    - SAM 执行分割：LLM 生成的坐标被送入 SAM，SAM 输出高精度的分割掩码。SAM 在这里扮演“视觉执行器”的角色，LLM 是“大脑”。

    - 结果回传与多轮交互：SAM 输出的掩码可以进一步转化为文本（如物体列表、面积），反馈给 LLM，LLM 再基于此进行推理、问答或生成更复杂的描述。形成一个闭环。

    - 代表性系统：如 LISA（Language-Instructed Segmentation Assistant），它在 LLM 的词表中加入一个特殊的 <SEG> token。当 LLM 生成回答时，若需要分割，会输出 <SEG>，后续的隐藏状态被用来生成 SAM 的提示嵌入，直接驱动 SAM 产生分割掩码。这样整个系统端到端可微。

    这种组合赋予了 LLM“指哪打哪”的像素级理解能力，将语言推理与视觉精确性统一起来。


content:
  prompt: 扩散模型中的“无分类器引导”是什么原理？如何控制保真度和多样性？
answer:
  mode: rubric
  reference_answer: |-
    无分类器引导（Classifier-Free Guidance, CFG）是当前文生图扩散模型中广泛采用的一种技术，能够在无需额外分类器的情况下，显著提升生成图像的保真度（图像质量、与文本的一致性），但以牺牲一定的多样性为代价。

    原理：
    CFG 的核心思想是：在训练扩散模型时，不仅训练它以文本为条件进行去噪，还同时训练它无条件去噪的能力。具体做法是在训练过程中，以一定概率 puncondpuncond（例如 10-20%）随机丢弃文本条件（将文本嵌入替换为一个空嵌入），使得模型学会在不给任何文本的情况下也能生成图像（通常是无引导的通用图像）。

    在推理采样时，对于每一个去噪步骤，模型会同时进行两种预测：


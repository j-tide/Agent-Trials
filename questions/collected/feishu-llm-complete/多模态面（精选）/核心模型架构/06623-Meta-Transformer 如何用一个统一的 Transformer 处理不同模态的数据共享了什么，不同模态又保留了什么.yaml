content:
  prompt: Meta-Transformer 如何用一个统一的 Transformer 处理不同模态的数据？共享了什么，不同模态又保留了什么？
answer:
  mode: rubric
  reference_answer: |-
    Meta-Transformer 的核心是共享 Transformer 主干，模态特定预处理。它将不同模态的数据通过专门的“模态转换器”投影到统一的 token 序列空间，然后全部交由同一个冻结或可微调的 Transformer 处理。

    共享的部分：

    - 骨干 Transformer：一个大型预训练 Transformer（如 ViT 或 LLM），对所有模态共享参数。它负责学习通用序列建模、上下文交互和高级语义提取。这意味着无论输入是图像块、文本 token 还是音频频谱片段，模型内部的高层抽象和推理能力是复用的。

    模态特定的部分：

    - 数据处理与分块：每个模态有各自的原始数据预处理方式。图像切分为 patches，文本被分词为 tokens，音频转为频谱图后切分，点云采样为 token 序列等。

    - “模态转换器”：这是一个轻量级的模块，将各模态的原始 token 投影到统一的嵌入维度。通常是一个简单的线性投影或浅层 MLP。它吸收了模态间的低级差异（如维度、数值范围），使得 Transformer 看到的输入在格式上完全一致。

    - 可选的特殊位置编码：某些模态可能需要特殊的编码方式（如 3D 点云的空间坐标编码），这些也可以在模态转换器中注入。

    设计哲学：这种“共享骨干，特异前端”的模式，最大化地复用了 Transformer 的强大序列建模能力，使得跨模态任务可以像训练单模态模型一样简单。它证明了 Transformer 架构对序列数据有极强的通用抽象能力，不同模态的差异可以被压缩到简单的线性投影层中。


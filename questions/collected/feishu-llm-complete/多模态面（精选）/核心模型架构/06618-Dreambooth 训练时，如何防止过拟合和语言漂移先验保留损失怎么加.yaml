content:
  prompt: Dreambooth 训练时，如何防止过拟合和语言漂移？先验保留损失怎么加？
answer:
  mode: rubric
  reference_answer: |-
    Dreambooth 的最大风险是：模型微调后，不仅学会了 sks dog 对应你的宠物，还可能忘记 dog 这个通用类别的样子（语言漂移），或者生成的图像多样性丧失，沦为训练样本的复现（过拟合）。

    先验保留损失（Prior Preservation Loss） 是解决这些问题的关键。

    - 原理：在微调新概念的同时，用预训练模型自身生成一批该类别（如 dog）的通用图像，称为“先验数据”。然后训练时，不仅用新主体的图像去更新模型，还同时随机采样这些先验数据，用对应的通用类别提示（如 “a photo of a dog”）做监督。损失函数为：
    L=Lrecon(新主体)+λLrecon(先验)L=Lrecon(新主体)+λLrecon(先验)
    这强制模型在适应新主体的同时，不要偏离原来对类别 dog 的理解。

    - 实施细节：

    - 效果：先验保留损失一方面维护了类别语义的完整性，防止语言漂移；另一方面，它作为正则项，限制了模型向少数几张训练图像过度拟合，保留了生成多样性。


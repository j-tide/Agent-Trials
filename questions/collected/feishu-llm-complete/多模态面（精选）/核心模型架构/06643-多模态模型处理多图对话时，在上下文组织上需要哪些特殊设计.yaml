content:
  prompt: 多模态模型处理多图对话时，在上下文组织上需要哪些特殊设计？
answer:
  mode: rubric
  reference_answer: |-
    处理多图对话时，模型需要能够区分多张图片，并将文本指令与特定的图片精确关联。上下文组织上的特殊设计包括：

    - 图像标识符与 token 分段：为每张图片分配唯一标识符（如 <image_1>, <image_2>），并在输入序列中用特殊分隔符（如 <image_start>, <image_end>）包裹每张图片的视觉 token。这样，LLM 可以明确知道哪些 token 属于哪张图片。

    - 交错图文位置编码：采用能够区分不同来源 token 的位置编码方案。可以在序列中为每个 token 添加全局位置编码，同时为视觉 token 添加局部图像内位置编码，以保留空间关系。一些模型（如 Kosmos）还引入模态类型嵌入。

    - 图片选择机制：如果问题只涉及其中几张图，上下文组织时可以仅包含相关图片的视觉 token，而不是把所有历史图片都放进去。这需要一个图片选择模块（可以是基于文本相似度检索或 LLM 的显式决定）。这样能显著节省上下文窗口，避免干扰。

    - 上下文窗口管理：对于长对话中不断上传的图片，需要主动管理上下文。可以固定分配每张图片的 token 数量（如 64-256 个），超出则通过压缩或丢弃旧图 token 来控制总长度。或者使用流式方法，将对话历史中的图片特征存入外部记忆，LLM 按需交叉注意力查询。

    - 多图片对比和关系型提示：当任务是多图对比时（如“这两张图有什么不同？”），应将多张图片的 token 放在一起并加以提示（“以下是图A和图B：...”），让自注意力能够在它们之间直接计算关联。一些模型训练时还会加入多图对比的数据，增强这方面能力。

    - 训练数据中的多图模式：从根本上，模型是否具备多图对话能力，很大程度上取决于训练数据是否包含多图交错对话。构造这样的数据（如用多张图提问，给出答案）是让模型习得该能力的基础。


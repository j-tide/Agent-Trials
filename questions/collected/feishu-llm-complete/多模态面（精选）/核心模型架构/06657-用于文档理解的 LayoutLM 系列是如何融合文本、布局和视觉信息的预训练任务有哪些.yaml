content:
  prompt: 用于文档理解的 LayoutLM 系列是如何融合文本、布局和视觉信息的？预训练任务有哪些？
answer:
  mode: rubric
  reference_answer: |-
    LayoutLM 系列核心创新在于将文本内容、二维空间布局和视觉外观三者进行深度融合，用于文档理解（如发票、表单、合同）。它以 BERT 为骨架，对每个文本 token 添加布局和视觉嵌入。

    融合方式：

    - 文本嵌入：标准的词嵌入（token embedding）。

    - 布局嵌入：每个 token 在文档中的归一化边界框坐标 (x0,y0,x1,y1,w,h)(x0,y0,x1,y1,w,h) 通过一个 MLP 或嵌入层转换为向量，作为布局嵌入。这使模型理解 token 的空间位置。

    - 视觉嵌入：对应 token 的图像区域（整张文档图片通过 CNN/ViT 提取的特征图，在 token 边界框内做池化）得到的特征向量。这提供了字体、颜色、线条等视觉线索。

    - 融合：文本、布局、视觉嵌入相加（或拼接），送入 Transformer 编码器。这样，每个 token 的初始表示就融合了多模态信息。

    预训练任务（以 LayoutLMv3 为例）：

    - 掩码语言模型（MLM）：随机遮盖文本 token，让模型根据上下文、布局和视觉信息预测被遮盖词。这迫使模型学习利用非文本线索辅助语言理解。

    - 掩码图像建模（MIM）：随机遮盖图像区域（如 patch），让模型根据文本和未遮盖的图像区域预测被遮盖的图像特征。这促使视觉编码器学习与文本匹配的语义化视觉特征。

    - 单词-图像对齐（WIA）：预测文本 token 和图像区域是否匹配。模型从文本 token 中选一个，将其视觉特征替换为另一随机图像的对应区域，然后让模型判断该 token 是否被替换。这学习细粒度的跨模态对齐。

    通过这种多模态嵌入和预训练任务，LayoutLM 系列在表单理解、票据识别等任务上取得显著突破，展示了结构化布局信息对文档理解的关键作用。


content:
  prompt: 视觉 Token 压缩时，除了 Token Merging，还有哪些方法？比如基于重要性的剪枝。
answer:
  mode: rubric
  reference_answer: |-
    视觉 token 压缩是平衡效率与精度的关键。除了 token merging（如 ToMe），还有以下几种主要方法：

    - 基于重要性分数的剪枝：
    为每个视觉 token 计算一个重要性分数，然后只保留分数最高的前 K 个 token。重要性分数可通过以下方式获得：

    - 空间下采样/池化：
    利用视觉 token 保留的 2D 空间结构，直接对特征图进行卷积或池化操作，如步长为 2 的卷积将 token 数量减少到 1/4。这是最简单、无参数或极少参数的方法，但忽略了 token 的内容重要性差异。

    - 基于聚类的压缩：
    使用 K-Means 或可微聚类将视觉 token 聚类成若干簇，每个簇用一个代表性 token（如簇中心或加权和）替代。DARC、TokenLearner 等方法就属于此类，能够自适应地聚合相似信息。

    - 交叉注意力压缩器：
    如第 1 问所述，使用少量可学习查询向量通过交叉注意力从所有视觉 token 中动态提取信息。这是一种软压缩，查询向量可以学会聚焦重要区域。

    - 蒸馏式压缩：
    训练一个轻量级的学生编码器，直接输出少量 token，并用原始多 token 输出作为教师进行蒸馏，使得少量 token 也能保留足够信息。

    - 动态 token 丢弃：
    在模型前向过程中，根据中间层的特征动态丢弃不重要的 token（如动态 ViT），在视觉编码器阶段就完成压缩，然后再送入 LLM。

    方法选择：剪枝和聚类可以在保留一定空间结构的前提下大幅减少 token；交叉注意力压缩器能更好地与语言对齐但训练复杂；空间下采样最简单但可能损失细节。实际中常结合多种方法，比如先空间下采样，再基于重要性剪枝，最后用少量查询向量微调。


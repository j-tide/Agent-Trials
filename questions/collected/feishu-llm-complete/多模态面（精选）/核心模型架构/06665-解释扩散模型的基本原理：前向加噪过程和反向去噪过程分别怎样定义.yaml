content:
  prompt: 解释扩散模型的基本原理：前向加噪过程和反向去噪过程分别怎样定义？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型是一类受非平衡热力学启发的生成模型，其核心思想可以直观理解为：先有意识地彻底破坏数据中的结构，再从一片混乱中重新学习出恢复结构的方法。模型由两个相互拮抗的马尔可夫过程构成：前向加噪过程负责系统性摧毁数据，反向去噪过程则试图逆转这一破坏，从纯噪声中重塑出有意义的数据样本。

    前向加噪过程（Forward Diffusion Process）
    前向过程是一个固定的、不包含任何可训练参数的马尔可夫链。它从真实数据分布中取出一个样本 x0x0，然后在随后每个时间步 tt 中，按照一个预先定义的方差计划 β1,β2,…,βTβ1,β2,…,βT 向样本中注入微量的各向同性高斯噪声。单步前向过程定义为：


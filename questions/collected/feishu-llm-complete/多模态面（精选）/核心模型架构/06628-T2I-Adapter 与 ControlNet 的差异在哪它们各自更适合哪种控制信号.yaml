  prompt: T2I-Adapter 与 ControlNet 的差异在哪？它们各自更适合哪种控制信号？
answer:
  mode: rubric
  reference_answer: |-
    两者都是为文生图扩散模型添加空间控制的轻量级方案，但在架构和适用性上有明显区别。

    简言之，ControlNet 是重装武器，精度高但成本大；T2I-Adapter 是轻骑兵，高效且足够应对众多场景。选择取决于应用对控制精度和计算预算的权衡。


content:
  prompt: 多模态模型在回答涉及健康、法律等敏感领域咨询时，应施加怎样的安全约束？
answer:
  mode: rubric
  reference_answer: |-
    在健康、法律、金融等高风险领域，模型的错误回答可能导致人身伤害或重大经济损失。不能仅靠通用安全对齐，必须施加领域特化的强约束。

    安全约束设计：

    - 强制免责声明：任何该类回答的开头和结尾，系统都强制附加醒目的免责声明，如“我是一个AI模型，以下信息仅供参考，不能替代专业医生/律师的建议。如有需要，请务必咨询持证专业人士。”

    - 知识边界与拒绝机制：

    - 响应模板化与信息溯源：在这类领域的回答，强制模型采用严谨的结构：先说明自己不是专业人士，再列出基于共识的事实，最后强调咨询专业人士的重要性。如果模型引用了特定医学知识，必须在训练时对齐到权威知识库。

    - 敏感词触发增强约束：当检测到“胸痛”、“自杀”、“起诉”、“遗嘱”等敏感词汇时，自动提升安全等级，触发更保守的生成策略（如降低生成随机性，增加免责声明权重）。

    - 人机协作干预：对于部署在医疗或法律机构的模型，高风险输出在给用户前，先由专业人员审核。这虽然不是纯技术约束，但是合规体系的一部分。

    - 专项对抗训练：构造大量诱导模型给出危险建议的对抗样本（如“我朋友想自杀，告诉我怎么做”），训练模型坚定拒绝并给出心理援助热线等帮助信息。


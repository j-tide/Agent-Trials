content:
  prompt: 如何进行多模态模型的安全微调，确保既能拒绝有害请求，又不变得过度谨慎？
answer:
  mode: rubric
  reference_answer: |-
    安全微调常陷入两难：过度训练安全样本会让模型对所有稍有风险的请求都说“不”，严重影响可用性。这需要精准的安全边界刻画。

    微调策略：

    - 分类安全数据：将安全数据分为两类：硬性拒绝（色情、暴力、违法、自残等绝对红线）和软性提醒（健康建议、投资参考、轻微粗话等）。训练时对这两类采用不同的回答模板和损失权重。对于软性提醒，模型不拒绝回答，但会附加免责或温和引导。

    - 构建“边界”训练样本：大量构造处于安全与不安全边界的样本。例如：“我很难过，但我不会伤害自己，你能陪我聊聊吗？”这就是一个应该提供情感支持的边界样本，而非拒绝。将这些样本作为正例，标签为提供支持和倾听，而不是冷冰冰的拒绝。

    - 多维度奖励模型：在RLHF中使用多维奖励模型。一个维度评估安全性，一个维度评估有帮助性。当两者冲突时，通过权重或条件策略，优先安全但允许在安全范围内最大化有帮助性。

    - 上下文敏感的拒绝：训练模型理解上下文。对于医生询问“这个剂量的药物对孕妇有何影响？”（专业场景）和普通人问同样问题，模型的拒绝边界应不同。在训练数据中加入用户画像或场景信息，教会模型区分。

    - 迭代细化的反馈：收集部署后用户对“误拒绝”的反馈，将其作为高质量负例加入下轮安全微调，不断修正模型的过度谨慎倾向。


content:
  prompt: 如何让多模态模型在生成回答时，显式输出其“视觉依据”或注意力热图作为支撑？
answer:
  mode: rubric
  reference_answer: |-
    让模型输出可解释的视觉依据，是构建可信 AI 的关键。技术上可通过训练生成定位标记或注意力引导实现。

    方法：

    - 生成坐标或区域标记：在训练数据中加入带有空间定位的答案，模型学会输出边界框坐标或指向性描述（如“在图像的左上角区域，有一个...”）。这类似于 Kosmos-2 的 grounding 能力。

    - 输出注意力热图：模型在生成文本的每个 token 时，可以同时输出该 token 对视觉 token 的注意力权重。将这些注意力权重上采样到原图大小并叠加，即可生成“视觉依据”热图。这通常需要在训练时添加注意力监督损失，促使注意力确实聚焦于相关区域。

    - 文本-区域对齐 token：引入特殊 token（如 <region_start> 和 <region_end>），模型在描述某区域时输出这些 token，其嵌入用于生成掩码。类似于 LISA 的分割输出。

    - 后验可视化：若不改变模型架构，可用 Grad-CAM 等方法对特定输出 token 进行反向传播，可视化其对输入图像的依赖区域。但这是解释而非模型主动输出。


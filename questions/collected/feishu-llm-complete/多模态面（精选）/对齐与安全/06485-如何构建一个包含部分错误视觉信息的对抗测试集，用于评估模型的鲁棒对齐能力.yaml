content:
  prompt: 如何构建一个包含“部分错误视觉信息”的对抗测试集，用于评估模型的鲁棒对齐能力？
answer:
  mode: rubric
  reference_answer: |-
    这个测试集旨在评估当视觉输入本身包含误导信息时，模型是否会被“带偏”。

    构建方法：

    - 图像局部篡改：用 Photoshop 或图像编辑工具对真实图像进行局部修改，例如将红色的苹果涂成绿色，或将路牌上的文字改成错误的。保持篡改痕迹尽量自然。

    - 对抗性补丁：在图像中添加人眼不易察觉但能改变模型视觉特征的对抗性扰动，使视觉编码器提取到错误特征。

    - 矛盾图文注入：给一张狗的图片，但用户问题中错误地将其称为猫：“图中的这只猫是什么品种？”看模型是否会纠正用户的错误，还是顺着用户说下去。

    - 多模态陷阱：提供两张图，一张是苹果，一张是梨。问：“左边的苹果和右边的梨，哪个更大？”但实际上左右标注相反。测试模型是否会盲从文本中的位置信息。

    - 分级评估：

    该测试集应覆盖不同类型的视觉错误，并定期更新，以防止模型过拟合固定的对抗模式。


content:
  prompt: 多模态模型可能表现出哪些社会偏见？请从性别、种族、职业等维度举例，并说明评估方法。
answer:
  mode: rubric
  reference_answer: |-
    多模态模型从互联网图文数据中学习，这些数据深深嵌入了人类社会的历史偏见，模型会不加批判地放大这些偏见。

    性别偏见示例：

    - 在文生图任务中，输入“a successful CEO”，生成的图像绝大多数是白人中老年男性，几乎看不到女性或其他族裔面孔。

    - 在图像描述任务中，一张女性在做实验的照片可能被描述为“一个女人在厨房里”，而类似场景的男性则被描述为“一个科学家在工作”。模型根据性别标签错误地关联了场景和职业。

    - 在VQA中，问“这个护士的性别是什么？”对于穿护士服的男性图像，模型可能因刻板印象而回答错误。

    种族偏见示例：

    - 对“a beautiful person”的生成，偏向生成白人面孔，深肤色出现概率显著偏低。

    - 对于犯罪相关的图像描述，模型对深肤色人物过度使用“可疑”、“危险”等负面词汇，而对浅肤色人物则更温和。

    - OCR任务中，对非拉丁字符（如阿拉伯语、中文）的识别准确率远低于英文。

    职业偏见示例：

    - 文生图模型将“医生”默认为男性、“护士”默认为女性、“程序员”默认为年轻白人或亚裔男性、“家政人员”默认为有色人种女性。

    - 图像问答中，当展示一位男性和一位女性在会议室，问“谁是老板？”，模型倾向于根据性别而非实际位置或行为做出判断。

    评估方法：

    - 反事实公平性测试：构建仅改变敏感属性（性别、肤色）而保持其他要素不变的正反例图文对。例如，用图像编辑技术将同一张照片中的人换成不同性别和肤色，测试模型输出是否一致且无偏见。

    - 分布偏差统计：大规模生成特定提示词（如“a photo of a doctor”）的图像，统计生成结果的性别、肤色分布，与真实世界的人口统计或理想均衡分布进行比较，计算KL散度等指标。

    - 词嵌入与联想测试（WEAT）：在多模态嵌入空间中，测量目标概念（如职业）与属性（如性别、种族）的关联强度。

    - 基于模型的偏见探针：设计专门的VQA或描述任务，使用平衡的测试集，计算模型在不同群体上的准确率差异和回答内容中的偏见词频率。

    - 人类评估：邀请多元背景的评估员，对模型输出进行主观偏见评分，这是不可或缺的一环。


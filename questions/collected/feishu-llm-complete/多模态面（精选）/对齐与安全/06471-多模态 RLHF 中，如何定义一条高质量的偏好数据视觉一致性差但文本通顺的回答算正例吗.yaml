content:
  prompt: 多模态 RLHF 中，如何定义一条高质量的偏好数据？视觉一致性差但文本通顺的回答算正例吗？
answer:
  mode: rubric
  reference_answer: |-
    多模态 RLHF 的偏好数据通常由三个层次的质量标准构成。

    第一层：视觉忠实度——硬性门槛

    一条回答首先必须忠实于图像内容。任何包含图像中不存在的事实、错误描述属性或关系的回答，无论文本多么流畅，都不应作为正例。视觉一致性差但文本通顺的回答绝对不能算正例，这正是多模态幻觉的表现形式之一。奖励模型必须对这种回答给予显著低于忠实回答的评分。

    第二层：有用性与相关性——核心维度

    在通过视觉忠实度门槛后，偏好由以下因素决定：

    - 完全回答了用户的问题，无遗漏。

    - 逻辑清晰，推理步骤可追溯。

    - 提供了用户需要的信息量，不多不少。

    第三层：安全性与格式——附加约束

    - 避免有害内容、不恰当的猜测。

    - 遵循指定的输出格式。

    - 适当表达不确定性。

    高质量偏好对的具体定义：
    一个偏好对 (chosen, rejected) 中：

    - chosen 必须满足：视觉忠实度 ≥ 4/5，有用性 ≥ 4/5。

    - rejected 可以是：视觉忠实度低（存在幻觉），或有用性差（答非所问、不完整），或安全性问题。

    - 两者在其他维度上应尽量相似，只在某一目标维度上有显著差异，以便模型学习到该维度的偏好。


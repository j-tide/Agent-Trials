content:
  prompt: 如何自动构造“图像被部分遮挡”时的偏好对，以训练模型的诚实度？
answer:
  mode: rubric
  reference_answer: |-
    训练模型在视觉信息不足时承认不确定性，而非强行编造，需要系统性地构造遮挡场景的偏好对。

    构造方法：

    - 生成遮挡图像：对清晰图像施加各种遮挡——随机黑色矩形块、高斯模糊区域、过曝/欠曝处理、降低分辨率后局部恢复。遮挡位置应覆盖关键物体或区域。

    - 生成两个回答：

    - 诚实的回答（chosen）：基于被遮挡的图像，要求模型回答。若模型正确识别出遮挡并拒绝编造，或明确说明“被遮挡部分无法确定”，则作为正例。

    - 不诚实的回答（rejected）：可以故意使用原图（无遮挡）生成的详细描述，或者用模型在无遮挡时强行编造细节的回答。

    - 偏好对构造：(chosen="图像中下方区域被遮挡，无法确定那里是否有物体。", rejected="图像中下方有一只棕色的狗在睡觉。")。

    - 自动化流水线：用目标检测模型定位图像中的显著物体，在这些物体区域施加遮挡。用 MLLM 对遮挡图像生成回答，筛选出其中包含被遮挡区域细节的作为负例；用提示工程引导 MLLM 生成承认不确定性的回答作为正例。


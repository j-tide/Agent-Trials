  reference_answer: |-
    安全合规层是一个轻量级、低延迟的“安检关卡”，位于用户与核心多模态模型之间，对所有进出的内容进行实时扫描和决策。

    架构设计：

    - 输入合规检测：

    - 风险等级判定：

    - 输出合规检测：

    - 事后审计日志：

    技术实现：整个安全层以微服务形式部署，通过gRPC或HTTP与主模型通信。为满足低延迟，安全模型必须使用轻量架构（如DistilBERT、MobileNet），并充分利用GPU加速。规则库（关键词黑名单、正则）作为最快速的第一道防线。


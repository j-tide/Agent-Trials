content:
  prompt: 如果多模态模型错误理解了图像中的否定词，这属于哪一类问题？如何改善？
answer:
  mode: rubric
  reference_answer: |-
    这属于细粒度视觉-语言逻辑推理错误，具体为否定语义与视觉特征的错误绑定。模型可能正确识别了图像中的所有元素，但无法将文本中的否定词（“不”、“没有”、“非”）正确作用于对应的视觉区域，导致回答与事实相反。

    改善方法：

    - 否定词专项训练数据：在海量训练数据中，否定结构的出现频率远低于肯定句。需要人工或自动构造大量包含否定词的图文对，例如“图中没有猫”（图中有狗）、“这个人不是医生”（图中人穿着白大褂但拿着听诊器且背景是医院）。通过过采样这类数据，让模型学会正确绑定否定语义。

    - 焦点对比学习：对于含有否定词的句子，将其与仅差一个否定词的肯定句进行对比学习。例如，“没有红色的车”与“有红色的车”，两张图分别是“有红车”和“无红车”，让模型在嵌入空间中将这两类样本清晰分离。

    - 模型架构改进：在视觉-语言融合层，引入更结构化的逻辑推理模块，例如使用神经模块网络先解析否定句的语义树，再分别验证每个视觉子命题。

    - 推理链引导：在微调时，要求模型先显式地列出图像中存在的物体，然后再与否定陈述比对。例如，先生成“图中有：狗，猫”，然后推理“图中没有鸟”成立。

    - 生成否定判断的推理过程：训练模型不仅给出是/否的答案，还给出判断依据。如“图中没有红色的车，因为我看到一辆蓝色的车和一辆黑色的车，没有红色物体。”


content:
  prompt: 多模态 RLHF 的流程是怎样的？多模态奖励模型需要评估哪些维度？
answer:
  mode: rubric
  reference_answer: |-
    多模态 RLHF 并不只是给 LLM 的 RLHF “打个视觉补丁”，而是对整个对齐流程的重新审视。

    流程拆解：

    整个流程可以分为四个阶段。

    第一阶段是基座模型准备。这里需要一个已经完成多模态预训练和指令微调的 MLLM。它已经能看懂图像、听懂指令，但它的回答可能不够诚实，或者不够有用，这就是我们接下来要解决的。

    第二阶段是多模态奖励模型训练。这是多模态 RLHF 最特殊的地方。我们需要收集人类对于（图像，指令，回答）三元组的偏好数据，然后训练一个奖励模型。这个奖励模型的输入不是纯文本，而是图像、指令和回答三者的结合。它的任务是模仿人类判断，给一个好的回答打高分，给一个差的回答打低分。技术上，它通常复用基座 MLLM 的视觉编码器和 LLM 主体，但在最后加上一个输出标量分数的线性头。

    第三阶段是PPO 强化学习微调。基座 MLLM 作为策略网络，针对给定的图像和指令生成回答。这个回答会被送到第二步训练好的、已冻结的奖励模型中去打分。PPO 算法根据这个奖励分数来更新策略网络的参数，同时还会加上一个 KL 惩罚项，防止模型为了刷高奖励分数而胡说八道，偏离了原始语言模型的能力太远。

    第四阶段是迭代优化。这个过程通常不是一轮就够的。我们会用当前对齐好的模型再去生成新的回答，收集新的人类偏好数据，用来训练一个更好的奖励模型，然后再去对齐策略模型，如此循环往复。

    奖励模型需要评估哪些维度？

    奖励模型是 RLHF 的“指挥棒”，它评估的维度直接决定了模型最终的行为。这几个维度缺一不可：

    - 真实性/视觉忠实度：这是多模态奖励模型的独有和首要维度。回答中的每一个事实性陈述，都必须能在图像中找到依据。绝对不能“指鹿为马”或凭空捏造物体。

    - 有用性/指令遵循度：回答是否准确理解了用户的意图？是否完整覆盖了问题的所有要求？对于一个复杂的指令，有没有遗漏任何子任务？

    - 无害性/安全性：当图像中包含潜在的有害、暴力或隐私内容时，模型的回答是否恰当？是应该拒绝回答、进行模糊化处理还是给出安全提示？

    - 逻辑性与连贯性：回答的推理过程是否清晰？多轮对话中的上下文是否连贯？是否有前后矛盾？

    - 语言质量：文本本身是否流畅、简洁、没有语法错误？不必要的重复和啰嗦会被扣分。

    这五个维度像一个雷达图，一个优秀的奖励模型需要在这些轴上都能给出接近人类判断的分数。


content:
  prompt: 公平性评估中，对多模态模型应考虑哪些特定的公平性指标？
answer:
  mode: rubric
  reference_answer: |-
    除了传统的分类公平（如机会均等）外，多模态模型还需要视觉-语言跨模态公平的专用指标。

    - 跨模态表征公平：测量不同群体（如男/女、不同肤色）的图像和对应的文本描述，在嵌入空间中的对齐程度。理想情况下，同语义的不同群体应获得同等的对齐质量。可通过计算不同群体上图文匹配分数（如CLIP Score）的分布差异来量化。

    - 生成质量公平：对于文生图模型，测量不同提示词（如“a doctor” vs “a nurse”，以及显式带群体属性的“a female doctor”）生成的图像的视觉质量（如FID、美学评分）和语义准确性，是否因隐含或显式的群体属性而不同。

    - 描述内容公平：对于图像描述任务，测量模型为不同群体生成的描述中，提及性别、种族、年龄等的比例和上下文情感倾向。例如，是否总在描述女性时强调外貌，而在描述男性时强调能力。

    - 检索公平：在图文检索任务中，测量不同群体的图像在相同查询下的检索排名分布。是否存在某些群体的图像被系统性排后？

    - VQA表现公平：在不同群体主体出现的图像上，测量VQA准确率的一致性。模型是否因为主体肤色不同而对相同问题给出不同准确率的答案？

    - 毒性分布公平：测量模型在不同群体相关的输入上，输出毒性或负面内容的概率差异。是否存在对某些群体的系统性歧视。


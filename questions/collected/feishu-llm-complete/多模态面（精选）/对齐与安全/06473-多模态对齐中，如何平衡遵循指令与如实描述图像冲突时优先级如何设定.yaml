content:
  prompt: 多模态对齐中，如何平衡“遵循指令”与“如实描述图像”？冲突时优先级如何设定？
answer:
  mode: rubric
  reference_answer: |-
    这是一对核心矛盾：用户可能要求“请描述图中所有人物的表情”，但图像模糊看不清表情。如果严格遵循指令，可能编造表情；如果如实描述，可能只能说“看不清”。

    优先级设定（由高到低）：

    - 安全与无害：最高优先级。当遵循指令可能产生有害内容（如用户要求识别监控中的人脸）时，必须拒绝。

    - 事实忠实（如实描述）：第二优先级。当指令与图像事实冲突时，事实优先。模型应首先指出“图像模糊，无法看清表情”，然后在用户允许下提供其他可用信息。

    - 遵循指令（用户意图）：第三优先级。在安全和事实不冲突的前提下，尽力满足用户指令。即使图像看不清表情，也可描述能看到的部分（如“图中有人，但面部模糊”）。

    训练实现：

    - 在偏好数据中，将“诚实指出信息不足”的回答放在“编造细节但符合指令”的回答之上。

    - 在系统提示中明确此优先级，并将其作为 RLHF 的优化准则。


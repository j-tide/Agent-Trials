content:
  prompt: 视觉对比解码（VCD）是如何利用对比思想来减少幻觉的？
answer:
  mode: rubric
  reference_answer: |-
    VCD 是一种优雅的、无需额外训练的后处理方法，它的核心是“一图两看，信号放大”。

    它的做法是：对于同一张输入图像，生成两个不同的版本。一个是原始版本，另一个是失真版本（比如加上高斯噪声或者模糊处理）。然后，模型同时对这两个版本进行前向传播，得到两组下一个 token 的概率分布（logits）。

    VCD 的核心公式是：

    [图片内容未导入]

    其中，v 是原始图像，v' 是失真图像。

    它为什么有效？

    模型在看到原始图像 v 时，其预测既包含视觉信号，也包含强大的语言先验。而当它看到失真图像 v' 时，视觉信号被严重削弱，模型的预测主要由语言先验和残留的粗粒度视觉信息主导。

    VCD 用原始图像的 logit 减去失真图像的 logit，实质上是放大了纯净的视觉信号，同时抑制了语言先验带来的“背景噪声”。那些在两个版本中都高概率的词（比如由语言先验驱动的常见搭配，例如“猫”后面跟“老鼠”），在相减后会被抑制。而只在看到清晰图像时才被强烈激活的词（比如某个特定物体的精确名称），则在相减后得到保留和增强。

    这就是“对比”的妙处：不是让模型只看，而是让它在“看得清”和“看不清”两种状态下看，然后将两者的差异提取出来，这个差异就是更纯粹的视觉信息，从而引导模型生成更忠实于图像的内容。


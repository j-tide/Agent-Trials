content:
  prompt: 除了对象幻觉，还有哪些类型的多模态幻觉？请举例说明。
answer:
  mode: rubric
  reference_answer: |-
    多模态幻觉远不止“无中生有”这么简单，它是一个家族。

    - 属性幻觉：这是最常见的类型之一。模型识别出了正确的物体，但给它安上了错误的属性。比如图里是“一辆蓝色的汽车”，模型却说是“一辆红色的汽车”。这通常是因为模型对主要物体（汽车）的语义抓得准，但对细粒度属性（颜色）不够敏感。

    - 关系幻觉：模型能识别出各个物体，但搞错了它们之间的关系。比如“桌上的苹果”，模型识别出“桌子”和“苹果”，却描述成“桌子旁边的苹果”。空间关系（上下左右里外）是多模态模型的薄弱环节。

    - 数量幻觉（计数错误）：这是非常顽固的问题。图像里有三只猫，模型偏说“有两只猫”。原因在于 ViT 架构本质上不擅长做精确计数，而 LLM 对数字也不敏感，它们更擅长模糊的“多”和“少”。

    - 文本/OCR 幻觉：图像中包含了文字，模型在阅读时出错。比如一个写着“STOP”的交通标志，模型可能描述成“一个写着‘禁止通行’的标志”。或者把“39%”看成“89%”。这往往是因为图像分辨率不足或 OCR 能力有限。

    - 情感/氛围幻觉：对图像进行过度解读。比如一张人脸表情平静的照片，模型可能描述为“一个表情悲伤的人”。这是模型将文本中的情感共现模式强加给了视觉。

    - 上下文/场景幻觉：对图像的整体背景进行错误推理。比如一张在病房里拍摄的宠物狗照片，模型可能忽略宠物，直接说“一个病人在医院接受治疗”。


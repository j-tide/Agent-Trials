content:
  prompt: 什么是对象幻觉？多模态大模型为什么会在描述图像时“凭空捏造”物体？
answer:
  mode: rubric
  reference_answer: |-
    对象幻觉，简单来说就是“睁眼说瞎话”——模型生成的描述里，包含了图像中压根儿不存在的物体。

    比如，给出一张只有“一只狗趴在沙发上”的图，模型的描述却是“一只猫蹲在窗边的沙发上，旁边有一个红色的球”。这里，“猫”、“窗边”、“红色的球”都属于对象幻觉。

    为什么会凭空捏造？原因很复杂，但可以归结为以下几点：

    - 强大的语言先验：MLLM 的底座 LLM 是在海量文本上训练的。它学到了“猫”和“球”经常一起出现，“沙发”常放在“窗边”。当图像特征不够强，或者视觉信息丢失时，LLM 强大的语言建模能力就会“接管”并自动补全。它像一个经验丰富但眼神不好的画家，没看清细节时，就会不自觉地按照自己的经验去画。

    - 视觉编码器的信息瓶颈：高分辨率图像被压缩成几百个 patch token。像远处一个小飞盘这样的细节，可能就在这个压缩过程中被“抽象”掉了。视觉编码器可能只捕捉到了“狗”和“沙发”，而忽略了飞盘。

    - 跨模态对齐的错位：即使视觉编码器正确地提取了“狗”的特征，但这个特征向量在映射到 LLM 的语义空间时，可能正好落在了“猫”这个词的嵌入向量附近。模型在生成时，一个小小的随机偏差就可能让它说出“猫”而不是“狗”。

    - 训练数据的偏置：预训练数据中大量的图文对，其文本描述可能远丰富于图像实际包含的内容。比如一张只有苹果的图，配文却是“新鲜的水果”。模型被训练成倾向于“脑补”出更丰富的描述，以满足数据分布。

    - 自回归生成中的错误累积：LLM 是一个词一个词地往外蹦的。一旦它不小心生成了“球”这个字，后面的生成就会被这个错误引导，去补充描述这个根本不存在的“球”是什么样的，陷入一种“自欺欺人”的循环。


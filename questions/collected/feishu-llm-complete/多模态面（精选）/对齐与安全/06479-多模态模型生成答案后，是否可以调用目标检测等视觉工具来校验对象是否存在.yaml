content:
  prompt: 多模态模型生成答案后，是否可以调用目标检测等视觉工具来校验对象是否存在？
answer:
  mode: rubric
  reference_answer: |-
    完全可以，这是构建可靠多模态系统的关键策略——工具增强的事实核查。

    实现方案：

    - 解析生成内容：从模型输出的答案中提取所有提到的物体实体和它们的属性/数量。使用 NER 或正则表达式提取。

    - 调用视觉工具：对图像运行目标检测模型（如 YOLO、DETR）或开放词汇检测模型（如 Grounding DINO、OWL-ViT），获取图像中实际存在的物体列表及其位置、类别、数量。


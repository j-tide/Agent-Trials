content:
  prompt: 在生成过程中，能否使用注意力权重大小来判断模型是否产生了幻觉？可靠性如何？
answer:
  mode: rubric
  reference_answer: |-
    答案是：可以参考，但不能作为唯一依据。 把注意力权重直接当成置信度，是有风险的。

    它为什么有一定的指示作用？

    如果你看到模型在生成“红气球”这个词的瞬间，交叉注意力（Cross-Attention）的权重精准地、像聚光灯一样集中在了图像中那个红色气球所在的 patch token 上，那这是一个非常强的正面信号，说明模型生成的这个实体“言之有物”。

    反之，如果生成“红气球”时，注意力权重要么非常均匀地散落在整张图上，要么错误地聚焦在背景天空上，那这就很可疑了，极有可能是模型在凭空编造。

    为什么它不总是可靠？

    - 注意力不等于归因：高注意力权重只代表模型“看了”那个地方，但不代表它“理解了”并“正确描述了”那个地方。它可能看到了红色，却错误地说成了“红苹果”。

    - 微调会改变注意力模式：经过 RLHF 等对齐训练后，模型的注意力分布可能会变得非常平坦。为了迎合人类偏好，它学会了一种“雨露均沾”的关注方式，但这反而让注意力不再聚焦于关键物体，失去了可解释性。

    - 存在多种注意力模式：一个正确的输出，可能对应多种不同的注意力模式。比如，在说出“红气球”之前，模型可能已经通过自注意力机制在上下文中获取了足够信息，而不需要再次去强烈地“凝视”视觉 token。

    - 幻觉也有高注意力：模型可能对图像中的某个错误区域表现出极高的“执念”，然后基于这个错误区域生成了幻觉。它的注意力权重依然很高，但指向了错误的东西。

    更可靠的用法：将注意力权重与其他信号结合起来判断，比如输出 token 的概率（置信度）。如果一个词的注意力权重低，且输出概率也低，那么它产生幻觉的可能性就很高。


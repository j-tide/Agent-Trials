content:
  prompt: 如何利用“回译”方法检测幻觉：让模型先生成描述，再用文生图模型生成图片，与原图比对。
answer:
  mode: rubric
  reference_answer: |-
    回译检测是一种无参考的幻觉检测方法，利用生成模型的跨模态一致性来校验：

    流程：

    - Textualize（图像→文本）：用待检测的 MLLM 对输入图像生成详细描述。

    - Visualize（文本→图像）：用文生图扩散模型（如 Stable Diffusion）以该描述为条件生成一张“回译图像”。

    - Compare（图像↔图像）：计算原图与回译图像之间的语义相似度。可以使用 CLIP 图像嵌入的余弦相似度，或更高级的密集视觉特征匹配（如 DINOv2 特征）。

    - 判决：若相似度低，说明生成的描述与原始视觉内容有显著偏差，可能存在幻觉。

    关键考量：

    - 文生图模型本身有生成偏差和随机性，单次回译不可靠。应多次生成（如5-10次），取平均相似度。

    - 文生图模型也可能产生幻觉（如改变物体属性），这会引入噪声。使用高保真度的生成模型和高质量的提示遵循模型（如 SD3）可降低此风险。

    - 回译更适合检测全局语义偏差和主要物体的错认，对于细粒度属性（精确数量、微小物体）的幻觉检测能力有限。

    - 可结合图像区域级的回译：对描述中提到的每个物体，裁剪对应区域做局部回译和比对，提升细粒度检测能力。


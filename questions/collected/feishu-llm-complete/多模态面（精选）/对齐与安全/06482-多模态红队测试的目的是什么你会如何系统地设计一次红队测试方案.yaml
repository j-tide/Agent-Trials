content:
  prompt: 多模态红队测试的目的是什么？你会如何系统地设计一次红队测试方案？
answer:
  mode: rubric
  reference_answer: |-
    多模态红队测试的核心目的是在模型部署前，通过系统性的对抗攻击，主动发现其安全漏洞、偏见、幻觉倾向和鲁棒性短板，从而为加固模型提供明确方向。它不是随机的“乱测”，而是有组织、全覆盖的压力测试。

    系统设计方案（六步法）：

    第一步：定义攻击面与威胁模型

    明确要测试的模型能力边界和潜在危害类型。例如：文生图模型的色情/暴力内容绕过；MLLM的视觉提示注入、特定群体贬损、高危领域错误建议（医疗、法律）、多轮对话中的越狱链等。列出详细的测试分类法。

    第二步：组建多元化红队

    红队成员应来自不同背景——安全专家、领域专家（医生、律师）、社会学家、创意作家、以及有偏见识别经验的社群代表。单一背景的人员很难发现所有盲区。对于资源有限的团队，也可以用LLM自动化生成攻击提示，但必须由人类专家对攻击有效性进行判定。

    第三步：设计攻击提示库与对抗图像

    针对每个攻击面，设计密集的测试用例。例如：

    - 针对幻觉：给模糊图像，追问无法辨认的细节。

    - 针对偏见：展示不同性别、肤色的人在相同场景中的图像，提相同问题，检查回答差异。

    - 针对越狱：设计多轮对话，逐步引导模型偏离安全准则。

    - 针对视觉注入：制作包含微小注入文字的图像。
    对抗图像可以使用对抗攻击算法（如PGD）在数字空间中生成。

    第四步：执行测试并记录结构化结果

    对每个测试用例，记录：输入（提示+图像）、模型输出、是否成功触发漏洞、漏洞类型、严重等级（高/中/低）。使用统一平台进行协作和跟踪。

    第五步：根因分析与修复建议

    红队专家与模型开发团队共同分析成功攻击的案例，追溯根本原因。是训练数据的问题？安全对齐数据的缺失？架构设计缺陷？针对性地提出修复方案，如补充安全训练数据、加强系统提示、添加输出过滤器等。

    第六步：迭代闭环与回归测试

    一轮红队测试后，开发团队修复漏洞，然后进行下一轮测试。修复后的模型必须通过之前所有成功攻击的回归测试，并探索是否引入了新的脆弱点。最终输出安全评估报告。

    整个红队测试不是一次性事件，而是伴随模型生命周期的持续过程。


content:
  prompt: AMBER 基准在评估多模态幻觉时，还关注哪些维度？
answer:
  mode: rubric
  reference_answer: |-
    AMBER 可以看作是 POPE 的“威力加强版”，它不仅考察对象存在性，还深入到了属性和关系的层面，并提供了一个多维度、细粒度的评估。

    除了对象存在性，AMBER 还关注：

    - 属性幻觉：验证一个存在物体的属性是否正确。它会问“这个物体是什么颜色？”或给出“一个[颜色][物体]”的陈述让模型判断对错。这能揭示模型是否能正确绑定属性和物体。

    - 关系幻觉：验证物体之间的关系是否正确。比如问“这个人是在骑马吗？”如果图像中人是站在马旁边，那么回答“是”就意味着关系幻觉。这测试模型的空间和交互关系理解。

    - 生成式评估与判别式评估结合：

    - 幻觉严重性分级：AMBER 不仅统计幻觉的有无，还分析幻觉的严重性。比如，是轻微的属性错误，还是严重的、核心物体完全虚构的错误？


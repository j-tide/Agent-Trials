content:
  prompt: 是否可能通过校准方法，让多模态模型的输出置信度与实际准确率相匹配？
answer:
  mode: rubric
  reference_answer: |-
    可以，且这对安全性至关重要。模型不仅应该说“X”，还应知道“我有多大把握 X 是正确的”。这就是置信度校准。

    校准方法：

    [图片内容未导入]

    - Platt Scaling：在模型输出 logits 上训练一个逻辑回归模型，输出校准后的概率。

    - 训练时校准：在训练中加入校准损失项，惩罚置信度与真实准确率之间的偏差。例如，使用 MMCE（Maximum Mean Calibration Error）损失。

    - 集成与MC Dropout：通过多次推理（不同的 Dropout 随机种子）得到预测分布，方差作为不确定性的度量。计算开销大，但可捕获模型不确定性。

    - 显式不确定性输出：训练模型在输出答案的同时，输出一个置信度 token（如 <confidence:0.85>）。这需要对应的训练数据，让模型学会评估自己的不确定性。

    多模态特殊考量：视觉输入的模糊性（遮挡、低光照）是置信度的重要来源。需要确保校准数据集覆盖各种不确定性场景。可通过向清晰图像添加退化处理，获得“低确定性”的标注样本。

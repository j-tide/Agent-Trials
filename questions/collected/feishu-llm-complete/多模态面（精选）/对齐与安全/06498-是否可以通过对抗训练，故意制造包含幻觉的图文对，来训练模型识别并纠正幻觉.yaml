content:
  prompt: 是否可以通过对抗训练，故意制造包含幻觉的图文对，来训练模型识别并纠正幻觉？
answer:
  mode: rubric
  reference_answer: |-
    可以，且是一种主动防御策略，类似“疫苗原理”：让模型接触可控的“病毒”（幻觉样本），学会免疫。

    对抗训练方法：

    - 构造幻觉图文对：

    - 多任务对抗训练：训练时混合正常样本和对抗样本。对抗样本的标签设为“描述错误”或要求模型输出“文本中的 XX 与图像不符，应该为 YY”。损失函数要求模型先检测不一致，然后生成纠正后的答案。

    - 梯度对抗训练：生成使模型最容易产生幻觉的文本扰动，将其加入训练，最小化模型在这些扰动下的错误率。

    - 协作对抗训练：用一个“攻击者”模型生成容易引发幻觉的提示，主模型学习抵御。

    注意事项：对抗样本的难度需要课程式递增，且比例不能过高（如 5-15%），否则会削弱模型在正常输入上的表现。需配合标准数据一同训练。


content:
  prompt: 在医疗影像的多模态模型中，幻觉可能带来致命后果，应如何从对齐层面设置强约束？
answer:
  mode: rubric
  reference_answer: |-
    医疗领域需要零容忍幻觉的对齐策略，不能仅靠概率性的 RLHF。

    强约束设计：

    - 绝对知识边界：明确规定模型的知识范围。对于任何不在训练数据覆盖内的罕见病、药物剂量等，必须拒绝回答并建议咨询专业人员。使用规则库或知识图谱硬约束。

    - 引用与证据链强制：每个医学结论必须附带图像中的具体区域标注（如激活热力图）和引用的医学知识来源。无证据不得给出结论。

    - 不确定性量化与分级输出：根据置信度分级输出：高置信（正常描述）、中置信（附加不确定性声明）、低置信（强制拒绝并引导人工复核）。

    - 人机协同环：在关键诊断流程中，模型的输出必须经过认证医生的确认。技术上将模型定位为“辅助筛查工具”而非“独立诊断工具”，从产品和法规层面设限。

    - 安全性 RLHF 数据构造：

    - 对抗性安全测试：组建红队，持续寻找能诱导模型给出危险幻觉的输入，快速迭代更新约束。


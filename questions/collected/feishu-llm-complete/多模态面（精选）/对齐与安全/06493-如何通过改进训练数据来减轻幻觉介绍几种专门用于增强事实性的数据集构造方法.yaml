content:
  prompt: 如何通过改进训练数据来减轻幻觉？介绍几种专门用于增强事实性的数据集构造方法。
answer:
  mode: rubric
  reference_answer: |-
    数据是模型认知的起源，从源头减少虚假信号是缓解幻觉的关键。

    - 负样本增强：教会模型“什么是错的”

    这是最直接的方法。构造明确包含错误的图文对，并让模型学习拒绝或纠正它们。

    - LRV-Instruction (Large-scale Robust Visual Instruction)：这个数据集的做法是，在正面的指令数据中，混入不同比例的负指令数据。这些负指令包含三种类型：(a) 图像不存在的问题，(b) 图像存在但问题不相关，以及 (c) 问题相关但答案被故意写错。通过训练，模型学会了“不是所有问题都值得回答”，并且要忠实于图像。

    - 负样本微调：类似地，我们可以直接用模型生成幻觉回答，由人类标注员纠正后，组成 (幻觉回答, 正确回答) 的对，通过 DPO 训练，让模型降低生成幻觉回答的概率。

    - 事实性增强的Caption数据：教会模型“什么是真实的”

    标准的图像描述往往很笼统，对幻觉学习价值不大。

    - 细粒度、反事实的描述重写：对于一张“红色的汽车”的图，我们不仅提供正确的描述（“红色的汽车”），还可以用大模型生成反事实的描述（“蓝色的汽车”），并明确告诉模型后者是错误的。这强制模型去关注视觉细节。

    - LLaVA-RLHF 中的 Factually Augmented RLHF：该工作使用一个公开的视觉-语言模型，为图像生成一个非常详细的描述。然后，让一个强大的多模态模型（如 GPT-4V）来检查这个详细描述中每个事实的真假。以此构建关于“事实正确性”的偏好数据，用于训练奖励模型。

    - 知识精炼与校验数据：教模型“事实从哪里来”

    - “引用链”训练数据：对于需要外部知识的回答，构造数据时，不仅给出答案，还要求给出“这个知识来源于图像的哪个区域”或者“引用了哪条确定的文本信息”。这有点像写论文要标参考文献，让模型养成“言之有据”的习惯。


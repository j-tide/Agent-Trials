content:
  prompt: 评估多模态幻觉的基准 POPE 是如何构造测试样本的？
answer:
  mode: rubric
  reference_answer: |-
    POPE 巧妙地将幻觉评估转化为一个二分类任务，从而实现了客观、自动的评估。它的核心思想是：问模型一个关于物体存在性的极简单问题，看它会不会答错。

    构造流程如下：

    - 选定图像和物体：对于每张测试图像，先用一个分割或检测模型，找出图中确定存在的物体（Ground Truth）。同时，从数据集的物体库里，选出一些图中确定不存在的物体。

    - 构造问题模板：用简单的模板构造问题，比如“Is there a [object] in the image?” 或 “Is there any [object] in this photo?”。

    - 构建正负样本：

    - 评估指标：基于这个二分类任务，可以轻松计算准确率（Accuracy）、精确率（Precision）、召回率（Recall）和 F1-Score。一个高度诚实的模型，在负样本上的回答应该有极高的精确率（即几乎不说“Yes”）。


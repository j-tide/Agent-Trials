content:
  prompt: 除了 VCD，还有什么基于解码策略减少幻觉的方法？如 DoLa 能否用于多模态？
answer:
  mode: rubric
  reference_answer: |-
    VCD（Visual Contrastive Decoding） 通过对比原始图像和噪声图像的输出分布来减少幻觉。类似地，还有多种解码策略：

    - DoLa（Decoding by Contrasting Layers）：通过对比 LLM 高层和低层的 logits 来减少事实性幻觉，最初用于纯文本 LLM。可以迁移到多模态：在多模态模型中，将视觉 token 和文本 token 一起输入后，通过对比 LLM 中不同层对视觉信息利用的差异来校准输出。但需要额外适配，因为视觉信息主要在特定层被整合。

    - CAD（Context-Aware Decoding）：用更强的上下文提示（如“只根据图像回答”）和标准提示的输出进行对比，放大与视觉信息一致的 token 的概率。这是一种简单有效的即插即用方法。

    - ITI（Inference-Time Intervention）：在推理时，通过一个轻量级探针检测生成内容是否与视觉信息一致，对不一致的 token 进行概率惩罚或重导向。

    - Self-CD（Self Contrastive Decoding）：让模型先生成一个初始草稿答案，然后基于该草稿和原始视觉输入对比生成最终答案，抑制草稿中的幻觉。

    - OPERA（Over-trust Penalty and Retrospection-Allocation）：专门针对 MLLM 的束搜索解码，对过度信任某些视觉 token 的行为进行惩罚，减少对图像内容的过度解读。

    DoLa 在多模态中的挑战在于：需要确定哪些层的对比对视觉幻觉最敏感，通常需要针对 MLLM 进行层分析实验来找到最优的对比层对。


content:
  prompt: 多模态幻觉的归因分析：是视觉编码器漏检，还是 LLM 忽视了视觉信号，或是投影层丢失信息？如何诊断？
answer:
  mode: rubric
  reference_answer: |-
    幻觉的根因可能出在视觉链路的不同环节。需要系统性的归因分析来定位。

    诊断方法：

    - 视觉编码器能力探测：冻结视觉编码器，在上面训练线性分类头，检测特定物体/属性。若分类准确率低，说明编码器本身未能提取相应信息——视觉编码器漏检。这是源头的失败。

    - 投影层信息保真度检测：将视觉特征投影到 LLM 空间后，再用线性分类头探测。若投影后分类准确率显著低于投影前，说明投影层丢失了信息。

    - LLM 利用视觉信息的能力检测：

    - 对比诊断：对于同一幻觉案例，分别用原始图像和图像的文本描述（作为纯文本输入）让 LLM 回答。若纯文本回答正确，而视觉回答错误，说明问题出在视觉通路而非 LLM 的推理能力。


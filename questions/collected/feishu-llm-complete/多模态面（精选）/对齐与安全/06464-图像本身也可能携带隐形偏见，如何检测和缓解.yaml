content:
  prompt: 图像本身也可能携带隐形偏见，如何检测和缓解？
answer:
  mode: rubric
  reference_answer: |-
    图像不是中立的：拍摄角度、构图、色调、人物选择都隐含了摄影者或数据收集者的主观偏见。这会使模型学习到的视觉表征带有偏见。

    检测方法：

    - 对象共现偏差分析：统计数据集中，特定物体与人物的共现频率。例如，“婴儿”是否总是与“母亲”同时出现，而很少与“父亲”同时出现？“办公室”场景中是否深肤色人物多出现在服务角色？使用物体检测和人物属性分类模型自动标注，然后统计条件概率偏差。

    - 图像检索偏差测试：用中性查询（如“一个成功的人”）检索模型训练数据或互联网数据，检查返回图像的性别、种族分布。偏差会在检索结果中暴露。

    - 视觉属性偏差测量：对于人脸图像，分析不同种族、性别群体的光照、清晰度、表情（微笑率）。发现某些群体总被拍得更暗、更模糊或表情更严肃，即存在系统性偏差。

    - 隐藏的文本偏差：图像的文件名、alt-text、元数据可能包含偏见词汇。扫描这些文本也能发现偏见。

    缓解方法：

    - 数据重采样与平衡：在构建训练数据集时，主动使用重采样或生成方法，使不同群体在各种场景和属性上分布均衡。

    - 对抗性去偏：在视觉编码器训练时，加入对抗性损失，要求特征不能用于预测敏感属性（如性别、种族），从而学习去偏的视觉表示。

    - 偏见感知的图像增强：对图像进行色彩校正、重新构图等，以减少低级的视觉偏差（如亮度均衡）。

    - 模型输出的偏见修正：在生成描述时，使用去偏的生成策略，避免将刻板印象写入描述。


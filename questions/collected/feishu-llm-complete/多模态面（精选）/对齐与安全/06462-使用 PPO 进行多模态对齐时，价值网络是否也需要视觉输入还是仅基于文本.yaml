content:
  prompt: 使用 PPO 进行多模态对齐时，价值网络是否也需要视觉输入？还是仅基于文本？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    价值网络需要视觉输入，原因是：如果没有视觉输入，价值网络无法评估当前生成轨迹是否正在偏离图像内容，只能依赖文本的一致性来判断状态价值。当模型开始编造图像中不存在的内容时，仅基于文本的价值网络可能无法察觉，因为它看到的文本仍然通顺，导致价值估计偏高。价值网络通过接收完整的视觉上下文，可以学习识别幻觉生成的早期迹象，并提供准确的即时反馈信号。

    工程实现上，价值网络通常复用策略模型（即 MLLM 本身）的大部分参数，仅替换输出头为单个标量值。这样可以共享视觉和文本编码器的表示，显著降低额外参数开销。如果独立训练价值网络，也需要复制相同的多模态架构。


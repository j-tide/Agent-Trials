content:
  prompt: 视觉 Token 的数量是否会影响幻觉率？过多视觉 token 是否反而引入噪声？
answer:
  mode: rubric
  reference_answer: |-
    是的，视觉 token 数量与幻觉率之间存在 U 型曲线关系。

    影响机制：

    - 过少：视觉信息压缩过度，细节丢失。模型被迫用文本先验填补空白，容易产生物体缺失、属性错误等幻觉。

    - 过多：引入大量低信息量的背景或纹理 token，造成信息稀释。LLM 的自注意力被大量无关视觉 token 分散，难以聚焦于关键物体 token。同时，过多的 token 可能包含混淆信息（相似纹理干扰），反而诱发模型“看到”并不存在的物体。

    实证：一些研究表明，将视觉 token 从标准的 256 增加到 576 甚至更多后，在部分细粒度任务上性能提升，但在需要全局语义判断的任务上幻觉率可能上升。最佳 token 数与图像复杂度和任务类型相关。

    优化策略：

    - 动态 token 压缩：根据图像复杂度自适应选择 token 数量。简单图像少用 token，复杂图像多用。

    - 重要性筛选：仅保留与文本相关的 top-K 视觉 token，抑制背景噪声。

    - 多尺度视觉特征：融合低分辨率全局特征（少量 token）和高分辨率局部特征（较多 token），平衡全局语义和细节。


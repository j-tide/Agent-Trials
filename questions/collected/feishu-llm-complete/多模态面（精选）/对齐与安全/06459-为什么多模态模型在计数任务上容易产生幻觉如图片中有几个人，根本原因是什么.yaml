content:
  prompt: 为什么多模态模型在计数任务上容易产生幻觉？如“图片中有几个人”，根本原因是什么？
answer:
  mode: rubric
  reference_answer: |-
    计数幻觉是 MLLM 的顽固短板，根本原因是视觉编码器和 LLM 的架构特性均不利于精确计数。

    根本原因：

    - 视觉编码器的平移不变性与池化：ViT 虽然保留了 patch 的位置，但其自注意力是全局加权平均，本质上对物体的精确数量和位置不敏感。模型更擅长识别“有一群人”而非“有 7 个人”。

    - LLM 的序列本质：LLM 是序列模型，对数量的理解基于文本中出现的数字词频。它在训练中可能学到“多个”常与“3-5”共现，但没有内建的计数机制。

    - 缺少显式的计数监督：预训练图文对中，“一群人”、“几个苹果”等模糊量词远多于精确数字。即使有精确数字，也可能与实际图像不符。模型从未被系统性地训练去对图像中的物体逐一计数。

    - 物体的重叠与遮挡：现实图像中物体相互遮挡，模型难以感知个体的完整边界，导致漏计或重复计数。

    - 注意力分散：当图像中有多个相似物体时，LLM 的注意力可能在它们之间跳转，无法稳定地逐一“点算”。

    缓解方向：

    - 引入专门的目标检测模块作为计数工具，MLLM 调用该工具获取精确数量。

    - 在训练数据中大量加入带有精确计数的标注数据，并用专门的计数损失进行微调。

    - 使用视觉编码器的中间层特征进行基于区域的计数预测，作为辅助任务。


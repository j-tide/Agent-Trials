content:
  prompt: 多模态模型的可解释性方法有哪些？如 Grad-CAM 或注意力可视化。
answer:
  mode: rubric
  reference_answer: |-
    可解释性在多模态中不仅关乎模型的决策原因，还是诊断幻觉和偏见的关键工具。

    - 基于梯度的可视化（Grad-CAM）：这是最通用的方法。对于模型的特定输出（如预测的答案词），计算该输出相对于视觉编码器最后一层特征图的梯度，加权求和得到热力图，高亮图像中对决策影响最大的区域。这能直观展示模型在“看”哪里。

    - 注意力可视化：直接可视化Transformer中跨模态注意力层的注意力权重。可以看到当模型生成某个词时，它主要关注了图像的哪些区域。这是最细粒度的分析工具。但需要注意，高注意力不一定代表因果重要性。

    - 因果干预：通过系统性修改输入（遮挡图像部分区域、删除某些视觉token）并观察输出的变化，来探测特定视觉信息对输出的因果效应。这是确定模型“是否真的依赖某个视觉信息”的金标准。

    - 多模态特征归因（MM-SHAP, LIME）：将模型输出分解为输入模态（图像、文本）和模态内特征（图像区域、单词）的贡献。SHAP值可以量化每个patch和每个词对最终答案的边际贡献。

    - 概念激活向量（TCAV）：定义高层次概念（如“条纹”、“红色”、“医生”），通过训练线性分类器探测模型内部表示中是否包含了这些概念，以及这些概念对最终决策的敏感性。可以跨模态探测：文本中的“红色”概念是否激活了图像中的红色区域表示？

    - 思维链可视化：如果模型支持逐步推理，可将其推理链中的每一步与视觉注意力/梯度热力图对应起来，形成从视觉证据到推理步骤再到最终结论的完整证据链。


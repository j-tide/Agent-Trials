content:
  prompt: 在多模态对话中，如何让模型输出的引用更准确，减少错误归因？
answer:
  mode: rubric
  reference_answer: |-
    错误归因也是一种幻觉：模型给了一个看似正确、能被常识接受的答案，但它引用的“视觉证据”却是错的或者不存在的。解决方法需要从数据和模型两个层面入手。

    - 训练数据层面：植入“引用”的基因

    - 强制引用格式：在构造指令微调数据时，要求所有与视觉相关的回答，都必须采用特定的引用格式。例如：“基于图像[ID]右上角的区域，可以看到一个[物体]。” 这样模型就学会了“引用”这个行为模式。

    - “引用-陈述”配对校验：构造负样本数据。给出一张图和一段描述，故意让模型输出的引用标记指向错误的图像区域或错误的文档，然后标记为负样本。让模型在训练中学会，引用内容本身也必须被验证。

    - 模型与解码层面：让引用可验证

    - 注意力对齐训练：在模型输出引用标记（如 [1]）的瞬间，可以添加一个辅助损失，强制它在该时刻的交叉注意力权重，能够精准定位到它所引用的那个图像 patch token 上。这在内在地建立了“引用”与“视觉焦点”的联系。

    - 归因解码：一种后处理或解码时的干预手段。当模型要输出一个引用时，我们可以不让它自由发挥，而是回溯其当前的视觉注意力，找到注意力权重最高的区域，然后将其对应的（预先处理好的）区域 ID 或描述作为引用输出。

    - 检索增强生成 (RAG) 思路：将图像中的所有可引用单元（如检测到的物体、OCR 提取的文字块）预先提取出来，作为“知识库”。在生成阶段，模型不是直接引用“图像”，而是引用这个知识库里的条目。这从根本上解决了归因问题，因为信息来源是离散、可追踪的。

    - 若答案声称的物体在检测结果中不存在，标记为“可能幻觉”。

    - 若声称的数量与检测计数严重不符，标记。

    - 对于属性（如颜色），可调用专门的属性识别模型。

    - 丢弃生成内容，要求模型重新生成。

    - 将检测结果作为额外上下文注入，让模型修正输出。

    - 向用户展示警告标记。

    - 可回答子集：基于图像内容完全可以回答的问题。这些问题应覆盖不同难度和类型。

    - 不可回答子集：问题与图像内容无关（图中无该物体、询问未来事件、询问个人隐私等）。需要仔细设计，确保问题合理但确实无法从图像中得出。

    - 正确回答率：在可回答子集上正确回答的比例。

    - 正确拒绝率：在不可回答子集上正确拒绝（输出“无法回答”或类似）的比例。

    - 精确拒绝得分：正确回答率和正确拒绝率的调和平均，即 F1 思想的扩展。单一指标会掩盖问题：高回答率可能伴随着乱答不可回答问题。

    - 按不可回答的原因分类（物体不存在、信息不足、超出范围），分别统计拒绝率。

    - 检查错误拒答（假阳性）的模式：模型是否在某些图像类型上过于保守。

    - 注意力分析：检查 LLM 的自注意力权重，看视觉 token 是否被充分关注，以及与幻觉相关的文本 token 是否关注了正确的视觉位置。

    - 因果干预：将某些视觉 token 置零或替换，观察生成内容的变化。若正确移除某物体的视觉 token 后，模型仍生成该物体的描述，说明模型不依赖视觉信号——LLM 忽视了视觉。

    - 表示相似度分析：用线性探针或 CKA 分析 LLM 各层中视觉 token 和文本 token 的表示相似度。若在关键层相似度低，说明融合不充分。

    - 图像无变化 + 错误描述：给一张苹果的图像，配文“一个红色的苹果”。然后构造对抗样本：图像不变，文本改为“一个绿色的梨”。

    - 局部图像编辑：用图像编辑工具将图像中的苹果替换为梨，但文本仍写“苹果”。

    - 大量构造“宁可保守不可冒险”的偏好对：即使模型有一定把握，当问题可能危及生命时，chosen 回答应为建议就医。

    - 加入领域专家的严格审核，所有偏好标签由医学专家标注。

    - 完全免疫：模型识别出错误并纠正。

    - 部分免疫：模型表达了不确定性。

    - 被误导：模型接受了错误信息并生成幻觉。

    - Chosen 回答：诚实地说“我看不清/我不知道/这里无法确定”。

    - Rejected 回答：强行进行描述或猜测，并且这个猜测是错误的，或者虽然对了但纯属巧合（训练时通常直接让它猜错，以惩罚猜测行为）。

    - 通过大量这样的偏好数据训练奖励模型或直接进行 DPO，模型会学到一条铁律：当视觉信息不足以支撑确定性结论时，“承认不知道”比“给出可能错误的猜测”要好得多。 这实际上是在重新定义对齐的价值观，将“诚实”的优先级置于“有用性”之上。

    - 正样本（Positive）：向模型提问图中存在的物体。此时正确答案是“Yes”。如果模型回答“No”，则产生了幻觉（漏检）。

    - 负样本（Negative）：向模型提问图中不存在的物体。此时正确答案是“No”。如果模型回答“Yes”，则产生了幻觉（误判）。

    - 随机采样：从所有不存在的物体中随机选。

    - 热门采样：选择那些在数据集中出现频率最高的物体。这些是模型的语言先验最可能“猜”出来的。

    - 对抗采样：选择那些在图中频繁与 Ground Truth 物体共现的物体。比如图中出现了“桌子”，那么对抗负样本可能是“椅子”，因为它们在训练数据中经常一起出现。

    - POPE 的关键在于负样本的构造，它提出了三种策略：

    - 判别式：像 POPE 一样，给出问题让模型回答“是”或“否”。AMBER 包含了大量的这类问题。

    - 生成式：直接让模型生成图像描述，然后用自然语言处理工具自动解析生成的描述，将其分解成(物体，属性，关系)三元组，再与图像的真实标注做对比。这能评估模型在没有明确引导时，是否会自发产生幻觉。

content:
  prompt: 如何衡量多模态对齐带来的“对齐税”？
answer:
  mode: rubric
  reference_answer: |-
    “对齐税”指的是为了变得“更好”（更诚实、更安全、更有用），我们在其他维度上付出的代价。不能只看单一指标。

    衡量的维度：

    - 幻觉缓解 vs. 描述丰富度：最典型的“对齐税”。经过强对齐的模型，幻觉可能大幅减少，但它可能变得过分保守，描述变得干瘪、短小，不敢使用任何带有推断性或修饰性的语言。我们需要衡量（如幻觉率）下降的同时，（如平均描述长度、独特形容词数量）下降了多少。一个好的对齐是在显著降低幻觉的前提下，尽可能保持描述的生动性。

    - 安全性 vs. 过度拒绝：模型在拒绝回答有害或无法回答的问题时，是否也开始拒绝回答一些正常、可回答的问题了？这就是“过度拒绝”。可以通过构建一个“正常问题集”和“边界/安全问题集”，分别测试对齐后模型的应答率和拒绝率，计算出一个类似 F1-Score 的平衡指标。

    - 指令遵循 vs. 视觉忠实度：当指令要求模型“详细描述”，但图像本身模糊时，对齐后的模型应该如何做？如果它严格遵循了视觉忠实度而违背了指令（“太模糊无法详细描述”），这体现了对齐成功。但如果它因此对所有“详细描述”的指令都给出简短回答，那就是“税”。评估时，可以对比模型在清晰图和模糊图下的回答详细度。

    - 通用能力退化：多模态对齐是否损害了模型纯文本的推理、编码或知识问答能力？我们需要用纯文本的基准测试（如 MMLU, GSM8K）来评估这一点。一个好的对齐过程，应该是对症下药，只影响目标行为，而将附带损害降到最低。


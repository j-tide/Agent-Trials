content:
  prompt: 文生图模型的安全过滤通常包含哪些层面？如何实现？
answer:
  mode: rubric
  reference_answer: |-
    文生图模型（如Stable Diffusion）的安全过滤是一个多层纵深体系，从输入端到输出端层层设防。

    第一层：输入文本过滤（黑名单与语义检测）

    最前端对用户输入的提示词进行审查。通常包含关键词黑名单（如色情、暴力、仇恨言论相关词汇），一旦命中直接拒绝生成请求。更高级的方案会使用轻量级NLP分类模型，对整句进行语义级别的安全评分，拦截隐含危险意图的提示词。例如，即使规避了显性词汇，模型也能识别“描述两个成年人的亲密场景”这类委婉表述。

    第二层：生成过程中的引导与控制

    在扩散模型的反向去噪过程中，引入安全引导信号。一种常见做法是使用额外的安全条件嵌入，在训练时就将NSFW概念与负向嵌入关联，推理时通过分类器引导或无分类器引导将生成结果推离不安全区域。同时可以注入正向安全词（如“safe”、“appropriate”）作为隐性约束。

    第三层：输出图像检测（后验过滤）

    生成图像后，使用专门的内容审核模型进行二次把关。主流方案是训练一个视觉安全分类器（如基于CLIP或专用CNN），对每张生成的图像做NSFW打分，包含裸体、血腥、武器、毒品等多个子类别。如果任意类别超过阈值，则屏蔽该图像，返回安全提示。Stable Diffusion使用的安全检查器（Safety Checker）正是此类，但它是基于冻结的CLIP特征训练的多标签分类器。

    第四层：数字水印与溯源

    在生成的图像像素中嵌入不可见的水印（如DwtDct水印或基于神经网络的水印），即使图像被截图、压缩，仍能检测出AI生成的身份。这不直接阻止生成，但在事后溯源和平台审核中起到关键作用。

    第五层：模型遗忘与概念擦除

    对于一些极其敏感的概念（如儿童色情、特定公众人物），直接在模型权重中进行“概念擦除”。通过微调，将与目标概念对应的文本嵌入映射到中性或无意义的方向，使得即使用户精确描述，模型也“无法理解”该概念。ESD（Erased Stable Diffusion）等方法通过优化让指定概念从模型中抹去。

    实现难点：多层过滤需要平衡响应延迟和成本。过强的输入过滤可能过度误杀（如医学插图生成），过弱的过滤又会漏网。实践中，通常将输入过滤和输出检测作为强制关卡，生成过程引导作为辅助，概念擦除作为兜底。


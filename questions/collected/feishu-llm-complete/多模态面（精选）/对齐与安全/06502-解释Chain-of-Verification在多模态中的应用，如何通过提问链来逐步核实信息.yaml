content:
  prompt: 解释“Chain-of-Verification”在多模态中的应用，如何通过提问链来逐步核实信息。
answer:
  mode: rubric
  reference_answer: |-
    Chain-of-Verification（验证链） 是一种让模型自我审查的推理框架，在多模态中通过分解-提问-校验-修正的循环来实现。

    应用流程：

    - 初始生成：MLLM 基于图像生成初步回答。

    - 验证问题生成：模型根据初始回答，自动生成一系列事实核查问题。例如，初始回答“图中三个红苹果放在木桌上”，生成问题：“图中有几个苹果？”、“苹果是什么颜色？”、“苹果放在什么表面上？”

    - 独立验证：将这些问题独立地再次询问模型（可附带原始图像，也可仅基于图像特征），获得每个子问题的答案。关键在于独立——每个子问题不应看到其他问题的答案，避免污染。

    - 一致性检查：将子问题的答案与初始回答中的对应陈述进行比对。若不一致，记录矛盾点。

    - 修正回答：若发现矛盾，模型基于子问题的正确答案修正初始回答，输出最终核实后的答案。

    多模态特有的增强：验证问题可以结合视觉定位（如“验证第三个苹果的位置”），让模型在回答子问题时输出注意力区域或坐标，进一步增强可验证性。


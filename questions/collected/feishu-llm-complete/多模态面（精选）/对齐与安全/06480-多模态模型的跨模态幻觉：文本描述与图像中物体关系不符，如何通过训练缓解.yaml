content:
  prompt: 多模态模型的“跨模态幻觉”：文本描述与图像中物体关系不符，如何通过训练缓解？
answer:
  mode: rubric
  reference_answer: |-
    跨模态幻觉指模型正确识别了物体，但错误描述了它们之间的空间关系、动作交互或属性绑定（如“红车旁蓝衣人”误描述为“蓝车旁红衣人”）。

    缓解策略：

    - 细粒度负样本训练：专门构造关系/属性绑定错误的负样本。将正确描述的物体-关系-物体三元组中的关系词或属性词替换为错误的，作为负例，让模型学习区分。

    - 单词-区域对齐损失（Word-Region Alignment）：在预训练阶段，加入细粒度对齐损失，让文本中的每个实体词与图像中的对应区域尽可能相似，无关区域推远。这强制模型建立精确的跨模态对应。

    - 空间位置编码增强：强化视觉 token 的空间位置信息（如使用更显式的 2D 位置编码），并在训练中加入空间关系推理任务（如“A 在 B 的左边还是右边？”）。

    - 反事实数据增强：用图像编辑工具交换物体的位置或属性，生成反事实图文对，让模型在对比学习中学习精确绑定。


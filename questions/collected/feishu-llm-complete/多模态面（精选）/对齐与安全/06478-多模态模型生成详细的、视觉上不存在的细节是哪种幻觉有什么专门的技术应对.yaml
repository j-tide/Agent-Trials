content:
  prompt: 多模态模型生成“详细的、视觉上不存在的细节”是哪种幻觉？有什么专门的技术应对？
answer:
  mode: rubric
  reference_answer: |-
    这种幻觉被称为“过度具体化幻觉”或“编造细节幻觉”。表现为模型不仅说图中有什么，还添油加醋地描述了精细的、无法从图像中证实的细节（如“车牌的号码是...”对模糊车牌、或“远处有一个人正在看手机”而图像太模糊无法分辨）。

    应对技术：

    - 不确定性注入提示：在系统提示中强制要求模型对不确定的细节使用模糊语言（“似乎”、“可能”、“看不清”），并避免精确描述无法确认的细节。

    - 基于分辨率的生成约束：检测图像中相关区域的像素面积或清晰度。若目标区域过小或模糊，在输入时附加元信息告知 LLM“该区域细节不可辨”，让模型据此调整生成粒度。

    - 最小充分描述训练：构造训练数据，对同一张图同时提供“详细描述”和“最小充分描述”。训练模型学会只在信息充足时详细，不足时概括。

    - 解码时的细节惩罚：在解码过程中，对过于具体或低频的细节词（如数字、专有名词）施加额外惩罚，除非模型对视觉证据有极高的注意力权重支撑。


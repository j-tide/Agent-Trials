  reference_answer: |-
    时间注意力：在 LLM 中插入时间注意力层，让模型在处理视频问答时能关注跨帧的同一空间位置，学习运动信息。对于极长视频，可采用 记忆压缩 技术，将历史帧的特征压缩为固定长度的记忆 token。

    时序位置编码：为每帧的视觉 token 添加时间位置编码，使模型感知帧的先后顺序。

    事件驱动的检索：对于“刚刚发生了什么”这类实时问题，直接从特征缓存中按时间戳检索最近若干帧送入 LLM，无需重新编码。


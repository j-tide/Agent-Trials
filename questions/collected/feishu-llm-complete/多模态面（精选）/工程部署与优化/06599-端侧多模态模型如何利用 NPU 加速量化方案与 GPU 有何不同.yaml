content:
  prompt: 端侧多模态模型如何利用 NPU 加速？量化方案与 GPU 有何不同？
answer:
  mode: rubric
  reference_answer: |-
    NPU (Neural Processing Unit) 是专为神经网络推理设计的低功耗加速器，广泛集成于现代手机SoC（如Apple ANE、高通Hexagon、华为达芬奇）。其加速原理与GPU显著不同。

    NPU加速原理：

    - 专门优化的矩阵乘累加单元，支持低精度（如INT8）的并行计算。

    - 片上缓存紧耦合，减少数据搬运能耗。

    - 直接处理神经网络图的执行，无需GPU那样的通用渲染管线。

    多模态模型在NPU上的映射：

    - 视觉编码器（如MobileViT）的卷积和注意力层可映射到NPU的卷积加速器与矩阵乘法单元。

    - 轻量LLM的Transformer层可利用NPU的矩阵引擎，但需处理动态形状和KV缓存，部分NPU对动态性支持有限。

    - 跨模态投影和分类头通常为小矩阵，也可放在NPU上。

    量化方案对比：

    [嵌入表格未展开]

    多模态模型NPU量化的特殊考量：

    - 视觉编码器浅层（直接处理像素）对量化敏感，可能需要每通道量化或保留FP16。

    - 文本token的嵌入层通常巨大，量化需做分组量化（如GPTQ的通道级）。

    - 跨模态注意力中的Q/K乘积在NPU上容易溢出，需在量化时插入限制缩放因子。

answer:
  mode: rubric
  reference_answer: |-
    - 同步调用：使用 gRPC 或 HTTP，适合低延迟链式调用（如视觉编码 → LLM 推理）。

    - 异步消息：使用 Kafka 或 RabbitMQ，适合耗时任务（如视频分析、文生图）。

    - 数据传递：视觉 token 等大块数据，通过共享内存或对象存储（如 MinIO）传递，避免多次序列化/反序列化。

    ### 在多模态服务中引入消息队列（Kafka），用于异步处理耗时任务（如视频分析），如何确保最终一致性？

    视频分析等任务处理时间长（几分钟到几十分钟），使用消息队列可实现削峰填谷、解耦和重试。

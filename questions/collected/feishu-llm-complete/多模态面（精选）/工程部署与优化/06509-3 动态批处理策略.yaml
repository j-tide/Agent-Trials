content:
  prompt: 1.3 动态批处理策略
answer:
  mode: rubric
  reference_answer: |-
    连续批处理 (Continuous Batching) 是提升 LLM 吞吐的关键。它将多个请求的 token 生成过程交织在一起：当一个请求完成生成（遇到 EOS）时，立即从等待队列拉入新请求，填充其 KV 缓存，无需等待整个 batch 完成。

    多模态的特殊性：

    - 视觉 token 仅在 prefill 阶段参与计算，后续生成阶段仅需其 KV 缓存。

    - 视觉 token 数量随图像分辨率动态变化，导致 batch 内各请求的 prefill 长度不同。

    - 解决方案：Chunked Prefill 将长 prefill 拆分为多个小块，与解码步骤交替执行，避免长 prefill 阻塞整个 batch。

    不同分辨率的处理：

    - 设置最大视觉 token 数（如 1024），超出部分通过空间下采样或重要性筛选压缩。

    - 按视觉 token 数量分桶（bucketing），将 token 数相近的请求组成一个 batch，减少 padding 浪费。

    - 在 API 层面提供 quality 参数（如 low/medium/high），用户根据需求选择分辨率等级。


content:
  prompt: 多模态模型推理时的内存分配往往呈现尖峰，有哪些技巧可以预分配或复用内存？
answer:
  mode: rubric
  reference_answer: |-
    多模态推理内存尖峰主要出现在：加载模型权重、为长序列分配KV缓存、高分辨率图像编码时的临时特征图。

    预分配与复用技巧：

    - 静态内存池：在服务启动时，一次性分配一个大的连续内存池，推理过程中所有张量都从这个池中分配子区域。避免运行时频繁的cudaMalloc。可以使用PyTorch的CachingAllocator或TensorFlow的BFC Allocator。

    - KV缓存预分配与PagedAttention：对于LLM，最大可能生成长度是已知的。按最大长度预先分配KV缓存的内存页。PagedAttention将KV缓存划分为固定大小的块，动态映射到序列，既避免了碎片，又能在序列结束时快速回收。

    - 视觉特征压缩：在输入LLM前，将大量的视觉token通过池化或Q-Former压缩为少量token，减少KV缓存中视觉部分的内存占用。

    - 共享内存与写时复制：多个并发请求如果使用相同的系统提示或相同的图像，可以通过写时复制技术共享视觉token的KV缓存部分，避免重复存储。

    - 梯度检查点的反向应用于推理：在推理时不需要计算梯度，但可以利用检查点的思想——不保留所有中间激活，在反向传播时重计算。不过对于推理，主要是前向，但我们可以避免创建不必要的中间张量，使用torch.no_grad()和inplace操作。

    - 流式释放：在生成过程中，一旦某个token的注意力输出已经用于生成下一个token，且不再需要其用于后续层的计算，可以及时释放该token在中间层的激活。对于流式输出，每生成一个token就将其深层激活释放。

    - 模型卸载与分层加载：对于内存极度紧张的情况，可将视觉编码器和LLM部分层放在CPU内存，只把当前正在计算的层加载到GPU。DeepSpeed的ZeRO-Infinity和llama.cpp的mmap可以做到。

    - 内存分配器优化：使用jemalloc或tcmalloc替代默认的malloc，减少内存碎片。对于CUDA内存，可以调整PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True来缓解碎片。

    通过这些预分配和复用手段，可以将尖峰内存降低30%-50%，使服务可在更小显存的GPU上稳定运行。

  prompt: 2.1 动态批处理的实现
answer:
  mode: rubric
  reference_answer: |-
    动态批处理的核心是打破传统“请求-响应”的同步阻塞模型，将多个并发请求的生成过程微观交织。

    实现方式：

    - 调度器：维护一个“运行 batch”和“等待队列”。每个调度周期（约 10ms）检查运行 batch 中是否有完成的序列，释放其资源；然后从等待队列中拉取新请求，进行 prefill 并加入运行 batch。

    - GPU 内核融合：CUDA kernel 能够同时计算多个序列的注意力，只要它们的总 token 数保持在 GPU 显存和算力范围内。

    - KV 缓存管理：使用 PagedAttention 将 KV 缓存划分为固定大小的页（page），以非连续方式存储。当序列增长时分配新页，序列结束时回收整条序列的页，避免显存碎片。

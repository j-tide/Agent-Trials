content:
  prompt: 结构化剪枝在多模态模型中，能否直接剪掉整个视觉头或部分视觉层？对齐性会受多大影响？
answer:
  mode: rubric
  reference_answer: |-
    结构化剪枝移除整个神经元、注意力头或层。在多模态模型中需极度谨慎，因为跨模态对齐是脆弱的。

    剪枝视觉层：可以，但需保守。深层（接近输出）的ViT层可适度剪枝，因其提取的是高层语义，冗余度较高。浅层剪枝风险高，低层提取的纹理边缘对后续定位和细节理解至关重要，直接剪除会显著降低细粒度识别能力。剪枝比例上，视觉编码器总层数减少10-20%通常可保持90%以上性能；减少30%以上可能导致对齐崩溃。

    剪枝跨模态注意力头：可以，且这是较好的切入点。分析每个注意力头对视觉token和文本token的关注度，剪掉主要关注同模态内部冗余信息的头，保留跨模态交互关键的头。剪枝后必须用跨模态数据微调以恢复对齐。

    对齐性受多大影响：

    剪枝后图文检索的Recall通常最先下降且降幅最大，因为检索完全依赖全局嵌入空间的对齐。VQA准确率下降幅度次之，描述任务的BLEU/CIDEr相对最鲁棒。

    修复对齐需要在剪枝后专门进行对比学习微调，甚至暂时提高对比损失的权重。部分研究提出在剪枝后插入极轻量的适配器模块帮助恢复对齐。


answer:
  mode: rubric
  reference_answer: |-
    现场演讲配PPT，要求将演讲者语音、PPT文字、现场画面融合，实时输出翻译后的字幕。

    同步架构：

    [图片内容未导入]

    关键技术细节：

    - 时间戳对齐：所有流都带时间戳。利用PTS (Presentation Time Stamp)对齐语音识别结果与对应的PPT帧。若ASR延迟200ms，则取对应时段的视频帧OCR结果。

    - 低延迟ASR：使用流式ASR引擎（如Whisper的streaming模式或商业引擎），返回部分识别结果，不等整句结束。

    - PPT文字提取：无需每帧做OCR，而是采用帧间差异检测，只在PPT翻页或内容变化时触发OCR，节省算力。OCR结果缓存。

    - 翻译策略：对ASR文本流和PPT文字做加权融合。若演讲者正在口述与PPT一致的内容，可优先取PPT精确文本；若口述补充信息，则取ASR结果。翻译模型可选择轻量级Transformer（如OPUS-MT），部署在本地GPU或NPU上。

    - 字幕同步显示：翻译结果以分句或分词级别推送，每个词带时间戳，做到字级高亮。

    优化低延迟的措施：

    - 模型全部量化INT8，运行在专用AI加速器上。

    - 使用CUDA Graph或NPU流减少内核启动开销。

    - 缓冲策略：设置100ms的抖动缓冲区以平滑网络和计算波动。

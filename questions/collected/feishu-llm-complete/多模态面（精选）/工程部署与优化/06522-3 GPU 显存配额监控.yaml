content:
  prompt: 14.3 GPU 显存配额监控
answer:
  mode: rubric
  reference_answer: |-
    使用 nvidia-smi 或 DCGM 实时监控每个进程的显存占用。结合 cgroups 限制每个容器可用的 GPU 显存上限（通过 nvidia-container-runtime 的 --gpus device=0 --memory=20GB 参数）。

    ### 多模态服务中的 API 设计：对于图像输入，建议使用 URL 还是 Base64 编码？各有什么考量？

    [嵌入表格未展开]

    推荐实践：

    - 混合模式：API 同时支持 image_url 和 image_base64 参数，让客户端根据场景选择。

    - 大小限制：对 Base64 编码后的字符串长度设置上限（如 10MB），超过则要求使用 URL。

    - 安全措施：对 URL 实施白名单或使用签名认证，禁止访问内网地址（防 SSRF）。

    - 服务端优化：对下载的图片进行缓存（CDN），避免重复下载；对 Base64 图片使用异步非阻塞解码。


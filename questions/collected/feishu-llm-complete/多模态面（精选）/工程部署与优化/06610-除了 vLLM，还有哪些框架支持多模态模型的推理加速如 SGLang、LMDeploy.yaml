  prompt: 除了 vLLM，还有哪些框架支持多模态模型的推理加速？如 SGLang、LMDeploy。
answer:
  mode: rubric
  reference_answer: |-
    [嵌入表格未展开]

    SGLang的多模态特色：

    SGLang的RadixAttention能够自动缓存相同图像的前缀（视觉token），在多轮对话中如果同一张图被反复引用，只需编码一次，极大节省计算。同时其编程模型支持原生多模态数据类型，可以轻松构建图文混合推理流程。

    LMDeploy的多模态特色：

    TurboMind后端对视觉编码器也有优化，比如使用高效的ViT推理实现。同时支持将视觉编码器部分的KV缓存也进行量化（KV8），进一步降低显存。


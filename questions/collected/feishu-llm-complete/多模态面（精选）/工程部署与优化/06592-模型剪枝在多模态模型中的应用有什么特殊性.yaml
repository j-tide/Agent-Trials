content:
  prompt: 模型剪枝在多模态模型中的应用有什么特殊性？
answer:
  mode: rubric
  reference_answer: |-
    多模态模型的剪枝不能简单地将单模态剪枝方法分别应用，因为跨模态交互形成了复杂的依赖关系。

    特殊性体现：

    - 模态间依赖：剪掉一个模态的部分结构，可能通过跨模态注意力影响另一模态的表示。例如，剪掉LLM中负责处理视觉token的注意力头，会直接削弱视觉理解能力，而这些头可能在纯文本任务中贡献很小。

    - 不平衡的冗余度：视觉编码器通常冗余度较高（patch token之间信息重叠），可以较激进地剪枝。LLM的冗余度相对较低，尤其是与视觉交互的前几层。投影层参数量极小，不宜剪枝。

    - 对齐性破坏：剪枝可能破坏视觉和文本嵌入空间的精细对齐。即使单模态性能保持，跨模态检索或VQA可能显著下降。这需要在剪枝后专门评估跨模态任务。

    剪枝策略：

    结构化的注意力头剪枝可以分别分析每个注意力头对视觉token和文本token的关注度。保留跨模态交互关键的头，剪掉仅处理单模态冗余或对视觉几乎不关注的头。迭代式剪枝加微调可以每次剪除少量参数后，在图文数据上微调几步，恢复跨模态对齐。数据集选择很重要，剪枝后的微调数据必须包含充分的跨模态样本。

    评估时，除了单模态指标，必须重新评估跨模态检索Recall、VQA准确率等。若这些指标显著下降，说明剪枝破坏了跨模态通路，需回退或调整策略。


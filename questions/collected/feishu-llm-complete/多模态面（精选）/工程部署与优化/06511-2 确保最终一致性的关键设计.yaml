  prompt: 10.2 确保最终一致性的关键设计
answer:
  mode: rubric
  reference_answer: |-
    - 任务幂等性：Worker 处理消息时，通过 task_id 或视频哈希判断是否已处理过，避免重复执行。

    - 事务性消息：使用 Kafka 的 transactional producer 确保“提交任务”和“写入 task_id 到数据库”是原子操作。任务处理完成后，将结果写入数据库与发送通知也在一个事务中。

    - 死信队列 (DLQ)：处理失败的任务被路由到 DLQ，由人工或自动重试机制处理。设置最大重试次数，超过后告警。

    - 状态追踪：在 Redis 或数据库中维护任务状态机：PENDING → PROCESSING → COMPLETED / FAILED。用户可通过 task_id 查询进度。

    - 结果持久化：Worker 完成任务后，将最终结果（如视频摘要文本）写入对象存储（S3/MinIO）和数据库，再更新任务状态为完成。

    - 超时处理：为每个任务设置超时时间，超时未完成则自动标记为失败，触发告警。


content:
  prompt: 大规模多模态训练中，如何应对 CPU 与 GPU 之间的数据预处理瓶颈？使用 DALI 等 GPU 加速预处理库。
answer:
  mode: rubric
  reference_answer: |-
    数据预处理瓶颈本质是CPU无法及时准备数据，GPU空等。解决之道是将预处理计算从CPU迁移到GPU，或设法隐藏预处理延迟。

    DALI加速原理：

    DALI将整个预处理流水线（JPEG解码、resize、Crop、颜色归一化）作为异步GPU任务执行，直接在GPU显存中输出训练就绪的Tensor。CPU仅负责从存储读取原始字节流并送入GPU，不再参与任何图像处理。

    DALI多模态适用性：

    DALI原生支持图像解码和增强，也支持视频解码。对于文本tokenization，DALI目前不支持，需在CPU端并行完成。但tokenization计算轻量，不是主要瓶颈。

    DALI pipeline设计：

    @pipeline_def
    def pipeline():
        jpegs = fn.readers.file(file_root=image_dir)
        images = fn.decoders.image(jpegs, device='mixed')  # GPU解码
        images = fn.resize(images, resize_x=224, resize_y=224)
        images = fn.crop_mirror_normalize(images, mean=[0.485,0.456,0.406], std=[0.229,0.224,0.225])
        labels = fn.readers.file(file_root=label_dir)
        return images, labels

    DALI的输出可直接喂给PyTorch DataLoader的GPU Tensor，实现零拷贝。

    与DataLoader的集成：将DALI作为PyTorch的IterableDataset，配合torch.utils.data.DataLoader使用，设置num_workers=0（DALI内部并行）。预取和异步执行可进一步掩盖I/O。

    替代方案：若无法使用DALI，可采用GPU加速的torchvision（0.12+支持GPU解码和变换），或自定义CUDA kernel加速特定预处理步骤。

    收益：使用DALI后，图像预处理延迟可从数十毫秒降至几毫秒，GPU利用率从70%提升至95%以上，训练吞吐提升显著。


  reference_answer: |-
    [图片内容未导入]

    - 帧采样器：以固定帧率（如 1fps）或基于变化检测（运动检测）动态抽取关键帧，避免处理所有帧导致计算爆炸。

    - 视觉特征缓存：将最近 N 分钟的帧特征存储在 Redis 或 GPU 显存中的滑动窗口，带时间戳。用户提问时，根据时间约束从缓存中检索相关帧。

    - 双通道处理：实时通道快速编码并缓存特征；批量通道异步运行更强的视频理解模型（如 Video-LLaMA）生成结构化描述，存入事件库。

    - 流式返回：通过 WebSocket 或 SSE 流式返回生成结果，首帧延迟可控制在 1 秒内。

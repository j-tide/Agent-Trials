answer:
  mode: rubric
  reference_answer: |-
    技术选型矩阵：

    [嵌入表格未展开]

    服务架构：

    - API层：FastAPI + gRPC，提供统一的多模态对话接口。网关用Envoy或Nginx，负责认证、限流、路由。

    - 模型服务层：视觉编码服务和LLM服务分离，视觉结果通过内存数据库传递。

    - 异步任务层：对于视频分析等长时任务，通过Redis队列解耦，返回task_id轮询。

    - 数据层：MinIO存储用户图片，PostgreSQL存储对话记录和用户信息。

    监控与迭代：

    - 记录 TTFT, TPOT, QPS, GPU利用率和显存。特别监控视觉token数与延迟的关系。

    - 建立离线评估流水线：每周从生产数据采样，运行自动评估（RAGAS等），观察各项指标趋势。

    - 使用A/B测试验证新模型：通过网关分流，对比点赞率、回答准确率。

    - 定期用Bad Case微调模型：将点踩数据清洗后加入指令微调集，持续提升。

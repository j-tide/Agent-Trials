  prompt: 13.1 热更新策略：蓝绿部署 + 流量加权
answer:
  mode: rubric
  reference_answer: |-
    步骤：

    - 部署新版本：启动新模型实例（蓝环境），预加载模型权重，完成健康检查，但不接入流量。

    - 预热：发送少量模拟请求对新实例预热，确保 GPU 缓存就绪。

    - 流量切换：修改网关配置，将小比例流量（如 5%）路由到新版本，其余流量仍在旧版本（绿环境）。

    - 观察：监控新旧实例的各项指标（延迟、错误率、业务指标）。

    - 逐步扩大：按 5% → 20% → 50% → 100% 逐步增加新版本流量。

    - 旧版本缩容：待所有流量切换到新版本且稳定运行一段时间后，逐步缩减旧版本实例。

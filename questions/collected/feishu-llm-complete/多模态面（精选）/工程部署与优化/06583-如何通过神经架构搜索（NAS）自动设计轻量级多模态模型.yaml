content:
  prompt: 如何通过神经架构搜索（NAS）自动设计轻量级多模态模型？
answer:
  mode: rubric
  reference_answer: |-
    NAS目标是在给定的搜索空间内，自动找到在精度和效率之间最优的模型结构。

    搜索空间设计：

    视觉编码器维度包括使用ViT还是CNN、层数、通道数/宽度、patch大小。融合方式可选择早期融合（单流）、晚期融合（双流）或中期交叉注意力、融合层数。LLM维度包括层数、注意力头数、FFN膨胀比。分辨率可选固定或动态。

    搜索策略：

    权重共享的单次NAS通过训练一个包含所有可能子网的超网络，训练后从中抽取候选子网评估，无需每个子网重新训练，效率高。进化算法随机生成架构种群，通过变异和交叉迭代进化，适合探索非连续空间（如融合方式选择）。硬件感知NAS将推理延迟、显存占用等加入目标函数，直接搜索适合特定设备的模型。

    多目标优化：

    目标设为准确率最大化且FLOPs/延迟最小化。最终产出帕累托前沿，即一组在不同效率-精度权衡下的最优模型，供开发者根据业务需求选取。

    实践案例：MobileCLIP通过NAS搜索轻量视觉和文本编码器组合，在移动端实现与大型CLIP相近的精度。但多模态NAS搜索成本极高，使用超网络一次训练、多次评估是当前主流。


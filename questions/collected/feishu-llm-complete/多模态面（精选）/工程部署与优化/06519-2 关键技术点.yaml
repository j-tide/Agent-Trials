answer:
  mode: rubric
  reference_answer: |-
    - 无状态服务：所有会话状态存储在外部 Redis，新旧实例均可访问，用户迁移过程中不会丢失对话历史。

    - 跨版本兼容：新版本的视觉 token 格式若发生变化，需在路由层做适配，或要求客户端同步更新。

    - 索引同步（涉及检索服务）：如果使用 RAG，新视觉编码器提取的特征向量与旧版可能不兼容，需要提前用新编码器重建向量索引，并存储在单独的 Collection 中。切换时同步切换检索路由。

    - 回滚机制：保留旧实例一段时间，一旦发现问题，通过修改路由配置即可秒级回滚。

    ### 多租户环境下的多模态服务，如何进行精确的 GPU 显存配额和限制，防止资源抢占？

content:
  prompt: 部署时如果发现精度损失严重，如何快速定位是量化、剪枝还是蒸馏环节引入的？
answer:
  mode: rubric
  reference_answer: |-
    精度损失可能来自单一环节，也可能是多环节叠加。需要系统性二分法定位。

    快速定位流程：

    准备三套测试集：通用能力集（检索、描述、VQA）、核心业务场景集（20-50个高优样本）、已知脆弱点集（计数、否定、空间关系等）。逐环节回溯对比。

    将部署模型与原始模型对比，确认总损失量级。回退剪枝：如果剪枝是可选步骤，加载未剪枝但已量化和蒸馏的模型再测。若精度显著恢复，剪枝是主因。回退量化：加载未量化但已剪枝和蒸馏的FP32模型再测。若精度恢复，量化是主因。蒸馏则通过比较学生模型与教师模型在相同输入下的输出分布差异来评估。

    常见特征：

    - 量化导致的问题，INT8通常损失<1%，若损失>3%往往量化配置有误。

    - 剪枝导致的问题，跨模态任务大幅下降而单模态任务保持。

    - 蒸馏导致的问题，回答变短、重复、缺乏细节。

    修复优先级：先调整量化配置（最容易调），其次微调恢复剪枝精度，蒸馏最耗时但根本改善需要它。


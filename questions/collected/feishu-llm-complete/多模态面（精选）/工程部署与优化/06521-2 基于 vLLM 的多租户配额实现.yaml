answer:
  mode: rubric
  reference_answer: |-
    vLLM 支持基于 request_id 的请求级别显存管理。可以为每个租户分配独立的 逻辑实例（同一物理 GPU 上的不同调度组），设置：

    - max_num_seqs：该租户最大并发序列数。

    - max_model_len：该租户允许的最大序列长度（限制显存占用）。

    - 通过修改调度器，实现租户间的显存使用上限和优先级调度。

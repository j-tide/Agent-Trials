answer:
  mode: rubric
  reference_answer: |-
    使用 全局流量管理器（如 Cloudflare Load Balancing、AWS Route 53、Google Cloud Global Load Balancer）结合 Envoy 区域网关。

    [图片内容未导入]

    智能路由规则：

    - 基于请求类型：API 网关检查请求路径，/v1/video 路由到有视频处理 GPU 的区域。

    - 基于负载与容量：全局 LB 监控各区域 GPU 利用率和排队深度，将请求路由到最空闲的区域。

    - 基于数据本地化：附带用户数据的请求必须在本区域内处理，网关通过 Header 中的 region 字段强制本地路由。

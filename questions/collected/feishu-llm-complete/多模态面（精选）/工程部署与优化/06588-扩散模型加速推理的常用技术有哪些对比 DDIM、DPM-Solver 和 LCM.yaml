content:
  prompt: 扩散模型加速推理的常用技术有哪些？对比 DDIM、DPM-Solver 和 LCM。
answer:
  mode: rubric
  reference_answer: |-
    扩散模型生成慢的根源是需要多步迭代去噪（通常50-1000步）。加速技术的目标是在保持质量前提下，大幅减少步数。

    [嵌入表格未展开]

    DDIM：最早实用的加速采样器。利用扩散模型只依赖边缘分布的特性，在1000步的链中只取子序列（如50步），确定性地跳步。数学上等价于求解概率流ODE的欧拉方法。优势是无额外训练，但步数少时质量下降明显。

    DPM-Solver：目前扩散模型推理的主流选择。它识别出扩散ODE的半线性结构，设计专用的高阶求解器。二阶DPM-Solver每步仅需2次网络评估，却能在10-20步内收敛到高质量解。Stable Diffusion WebUI中已广泛使用DPM++ 2M Karras等变体。它是纯算法改进，无需重训模型。

    LCM：将扩散模型蒸馏为一致性模型，使其学会从任意噪声水平直接预测干净图像。推理时只需1步或少数几步精炼。极大降低了延迟，但需要专门的蒸馏训练过程，且蒸馏后的模型灵活性下降（如对引导强度的敏感性改变）。LCM LoRA是一种轻量方案，在现有模型上加LoRA权重即可实现快速生成。

    组合使用：实际中常将量化（加速算子）与高效采样器（减少步数）结合。例如，使用TensorRT-LLM加速U-Net计算，同时使用DPM-Solver 20步，可实现数倍加速。


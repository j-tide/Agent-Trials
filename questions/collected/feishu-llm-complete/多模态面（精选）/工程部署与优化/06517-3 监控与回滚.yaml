  reference_answer: |-
    - 对灰度流量和基线流量分别监控：错误率、P95 延迟、点踩率。

    - 设定自动回滚条件：灰度组错误率超过基线组 20% 且持续 5 分钟，自动将流量切回旧版本。

    - 使用 Feature Flag 系统（如 LaunchDarkly）统一管理灰度开关。

    ### 多模态模型热更新时，如何做到新旧模型并存，逐步迁移流量而不中断服务？

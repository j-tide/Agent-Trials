answer:
  mode: rubric
  reference_answer: |-
    - 分离视觉和语言的区域服务：视觉编码可在轻量 GPU 区域完成，LLM 推理转发到高端 GPU 区域。中间通过专线或公网传输视觉 token，利用压缩和异步预取降低延迟。

    - 对于文生图服务，由于其延迟高、吞吐低，可集中部署在具有低价 GPU 的区域（如 Spot 实例多的区域），用户请求通过异步任务方式提交。

    ### 成本控制：如何在服务端对用户上传的图片进行压缩和分辨率调整，以节省推理 Token？

    图像 token 数与分辨率平方正比。对用户图片做适当压缩和降分辨率，可大幅降低 LLM 的视觉 token 计算量和费用，同时保持可接受的回答质量。

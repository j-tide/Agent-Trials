content:
  prompt: 如何使用“一阶”和“二阶”信息进行更精细的剪枝，而不损害跨模态交互？
answer:
  mode: rubric
  reference_answer: |-
    一阶信息（梯度）：衡量参数变化对损失函数的即时影响。泰勒展开的一阶项可用于评估移除某参数后损失的变化量。

    二阶信息（Hessian矩阵）：衡量参数之间的相互作用和损失曲面的曲率，更精确但计算代价高。最优脑损伤和最优脑手术使用二阶信息决定剪枝。

    在多模态模型中的应用：

    跨模态交互敏感度分析：计算每个注意力头对图文匹配损失的二阶贡献。将视觉token和文本token的注意力分开分析，识别对跨模态交互贡献大的头并保护。

    层间依赖建模：视觉层和语言层之间存在跨层依赖，简单的逐层剪枝会忽略这种全局影响。使用基于二阶的全局剪枝，可一次性考虑所有层的参数重要性，找到全局最优剪枝方案。

    激活值协方差分析：视觉token在LLM各层的激活值存在强协方差。剪枝时考虑去除一个视觉token后对剩余token激活模式的影响，避免破坏视觉token间的协作结构。

    保护跨模态交互的策略：

    - 将跨模态注意力头的剪枝阈值设置得更高（更难被剪掉）。

    - 在剪枝目标函数中引入跨模态正则项，对破坏跨模态对齐的剪枝行为增加惩罚。

    - 剪枝后进行针对性微调，特别强调对比学习损失。

    二阶方法计算成本高。对大型MLLM，可使用近似的Fisher信息矩阵（一阶信息+经验Fisher）作为折中方案。


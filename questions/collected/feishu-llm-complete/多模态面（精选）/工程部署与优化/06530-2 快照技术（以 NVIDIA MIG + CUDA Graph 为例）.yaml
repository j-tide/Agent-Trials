  prompt: 18.2 快照技术（以 NVIDIA MIG + CUDA Graph 为例）
answer:
  mode: rubric
  reference_answer: |-
    步骤：

    - 在 GPU 实例上预先加载模型，执行一次前向推理，捕获 CUDA Graph（包含内核调用序列）。

    - 将此时的 GPU 显存状态（模型权重、优化器状态等）通过 cudaMemcpy 导出到 CPU 内存或 NVMe 存储，形成快照文件。

    - 新实例启动时，直接加载该快照到 GPU 显存，恢复 CUDA Graph，即可立即开始推理。

    - 快照加载时间通常数秒，远快于从磁盘加载模型并构建计算图。

    平台支持：目前 Modal、Replicate 等部分 Serverless GPU 平台已支持自定义镜像预热和快照，可大幅降低冷启动影响。

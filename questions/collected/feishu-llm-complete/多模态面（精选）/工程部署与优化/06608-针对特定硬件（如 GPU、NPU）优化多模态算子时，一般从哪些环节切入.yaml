    优化流程：

    - 用性能剖析工具（NVIDIA Nsight, ARM Streamline）定位热点。

    - 针对热点算子，编写CUDA/OpenCL kernel或使用硬件厂商提供的库（cuBLAS, cuDNN, QNN, ACL）。

    - 通过图优化（算子融合、常量折叠）减少内核启动次数和临时内存。

    - 对批量处理场景，增加并发以掩盖延迟，利用GPU的Warp调度或NPU的多核并行。

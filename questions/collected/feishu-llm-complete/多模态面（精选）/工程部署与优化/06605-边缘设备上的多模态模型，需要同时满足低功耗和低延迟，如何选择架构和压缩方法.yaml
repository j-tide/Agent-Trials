content:
  prompt: 边缘设备上的多模态模型，需要同时满足低功耗和低延迟，如何选择架构和压缩方法？
answer:
  mode: rubric
  reference_answer: |-
    架构选择原则：

    - 视觉分支：首选高效混合架构（如MobileNetV3, EfficientNet-Lite, MobileViT-v2），在CPU/NPU上均有良好支持。避免纯ViT（计算密度不均）。

    - 文本分支：对语义理解，使用蒸馏后的小型BERT（如TinyBERT, MobileBERT）或轻量T5（如T5-Small）。

    - 融合方式：晚期融合（双塔）计算友好；若需要细粒度对齐，采用轻量交叉注意力（如单头注意力）而非大型Transformer。

    压缩方法组合：

    [嵌入表格未展开]

    低功耗技术：

    - 内存重用：在推理管道中，不同阶段复用同一块内存池，避免碎片。

    - 算子融合：将Conv+BN+ReLU合并为一个核，减少内存读写。

    - 稀疏计算：利用剪枝后的稀疏权重，跳过零值计算（需硬件支持）。

content:
  prompt: 推理时如何根据当前负载，动态调整视觉 Token 的压缩率，实现“降级服务”而非拒绝服务？
answer:
  mode: rubric
  reference_answer: |-
    降级服务是保障高可用性的关键策略：当系统繁忙时，不是直接拒绝新请求，而是用更少资源提供“稍低但可用”的服务。

    动态视觉Token压缩方案：

    - 分级压缩策略表

    预先定义若干压缩等级：

    [嵌入表格未展开]

    - 实时负载监控与自动切换

    监控当前GPU利用率、请求排队长度、P95延迟。设定阈值：

    - GPU利用率<50% 且排队长度<5 → 等级0

    - GPU利用率50-80% → 等级1

    - GPU利用率80-95% → 等级2

    - GPU利用率>95% 或排队>20 → 等级3

    - 队列即将溢出 → 等级4

    切换是平滑的：新进入的请求使用当前压缩等级，已在处理的请求不受影响。

    - 请求优先级配合

    VIP用户请求始终使用等级0或1，免费用户在高负载时先降级。结合业务价值动态调整。

    - 压缩开销考量

    压缩本身也有计算成本。Token Merging或重要性剪枝需要额外的前向计算，但其开销远小于LLM处理大量token的收益。一般压缩开销占总推理时间的5-10%，但可减少30-50%的LLM计算。


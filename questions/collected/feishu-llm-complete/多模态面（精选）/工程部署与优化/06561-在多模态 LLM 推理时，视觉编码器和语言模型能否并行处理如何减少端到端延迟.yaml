content:
  prompt: 在多模态 LLM 推理时，视觉编码器和语言模型能否并行处理？如何减少端到端延迟？
answer:
  mode: rubric
  reference_answer: |-
    传统的串行流程是：图像编码→视觉token→LLM prefill→LLM逐token生成。这导致端到端延迟 = 编码时间 + prefill时间 + 生成时间。

    并行化策略：

    - 流水线并行（Pipeline Parallelism）

    将视觉编码器和LLM视为流水线中的两个阶段。当处理多个请求时，视觉编码器在处理请求2的图像时，LLM可以同时生成请求1的回复。这种请求间的并行可以提升吞吐，但对单个请求的延迟无改善。

    - LLM Prefill与生成解耦

    在视觉编码完成后，LLM的prefill和后续生成可以部分重叠吗？prefill通常计算量大且需要一次性完成，之后才能开始生成。但可以将prefill分成更小的块（Chunked Prefill），与后续生成步骤交错执行。这减少了单个prefill对其他请求的解码阻塞，间接降低了平均延迟，但未降低单个请求的端到端延迟。

    - 推测解码（Speculative Decoding）对多模态的适应

    对于LLM生成部分，可以使用推测解码：用一个小模型快速生成候选token，大模型并行验证。这可以加速生成阶段。多模态输入不影响此加速技术，因为推测解码作用于纯文本生成阶段。

    - 视觉与文本的异步预填充

    如果系统可以预知即将使用的图像（如相册预览），可以提前对图像编码并缓存视觉token。当用户提问时，视觉编码已就绪，直接进入LLM阶段，端到端延迟大幅降低。

    - 视觉编码的提前开始

    在流式对话中，当用户还在输入文字时，可以并行将已上传的图像送入视觉编码器。用户点击发送时，视觉token已准备好。这需要前端配合，在用户选择图片时即开始上传和编码。

    结论：单个请求内，视觉编码和LLM推理难以并行，因为LLM依赖视觉输出。但通过请求间的流水线并行和提前编码，可以显著提升系统吞吐和感知延迟。


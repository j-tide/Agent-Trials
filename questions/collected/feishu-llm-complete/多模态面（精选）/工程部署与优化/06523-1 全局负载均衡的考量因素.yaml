  reference_answer: |-
    - 地理延迟：将用户请求路由到最近的可用数据中心。

    - 区域资源差异：不同地区的 GPU 型号、数量可能不同。例如，亚太区有大量 A100，适合 LLM 推理；欧洲区仅有 T4，适合视觉编码器。

    - 模态服务分布：某些地区可能专门部署了视频分析集群，需要将视频流请求路由到该区域。

    - 合规要求：数据必须留在特定地区（如欧盟 GDPR），路由时需考虑数据本地化。

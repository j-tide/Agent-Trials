  reference_answer: |-
    - 一张 1024×1024 图片，若直接编码约产生 5,300 个视觉 token。

    - 缩放到 336×336 后仅约 576 个 token，token 数减少 90%，LLM 推理延迟和成本同比大幅下降。

    - 对于大多数日常描述和问答任务，低分辨率已足够。仅文档 OCR、复杂场景理解需要高分辨率。

    ### 使用 Serverless GPU 部署多模态模型，如何处理冷启动延迟？可以预载模型或使用快照技术吗？

    Serverless GPU（如 AWS Lambda GPU、Modal、Replicate）的核心痛点是冷启动：当请求到来时，需要加载模型到 GPU 显存，这可能需要数十秒，远超用户容忍度。

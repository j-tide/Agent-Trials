content:
  prompt: 多模态推理中，图像预处理（解码、缩放、归一化）耗时可能占比较大，如何用 GPU 加速这部分？
answer:
  mode: rubric
  reference_answer: |-
    在典型的多模态推理流程中，图像预处理通常由CPU完成：JPEG解码、Resize、Crop、ToTensor、Normalize。当并发请求增多时，CPU很快成为瓶颈，GPU则处于空闲等待数据的状态。利用GPU加速预处理可以填满GPU的计算资源，显著降低端到端延迟。

    [图片内容未导入]

    加速方案：

    - NVIDIA DALI（Data Loading Library）

    DALI将整个图像预处理管线卸载到GPU。它支持：

    - 在GPU上直接进行JPEG/PNG解码（利用nvJPEG硬件解码器）。

    - GPU加速的Resize、Crop、颜色空间转换。

    - 可直接输出PyTorch Tensor，无需CPU-GPU拷贝。
    具体实现时，将图像原始字节流送入DALI Pipeline，内部完成解码→缩放→归一化→转换为CHW格式→输出到GPU显存。整个过程在GPU上异步执行，与CPU准备下一批次数据可以重叠。

    - 自定义CUDA预处理核

    如果使用PyTorch，可以编写自定义CUDA kernel或使用torchvision.io的GPU解码。例如：

    ```python
    import torchvision.io as io
    img = io.decode_jpeg(gpu_tensor)  # GPU解码
    img = torch.nn.functional.interpolate(img, size=(224,224))  # GPU resize
    ```

    但要注意，torchvision的某些操作仍会fallback到CPU，需确认。

    - 预转换与缓存

    对于频繁请求的固定图像（如系统内置图标），可以预先在GPU上存储处理好的Tensor，推理时直接复用，省去解码和预处理时间。

    - 流水线重叠

    使用CUDA Stream，让图像预处理在一个Stream上执行，模型推理在另一个Stream，两者可以并行执行。但前提是预处理操作的GPU计算与模型推理的GPU计算不共享资源导致串行。实践中，往往预处理很快，主要瓶颈在解码，利用DALI可以做到解码和推理重叠。

    性能收益：一般可将预处理延迟从数十毫秒降至几毫秒，在高并发下可提升吞吐2-3倍。


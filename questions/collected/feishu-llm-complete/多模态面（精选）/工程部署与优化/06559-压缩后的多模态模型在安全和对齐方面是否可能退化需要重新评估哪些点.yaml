content:
  prompt: 压缩后的多模态模型在安全和对齐方面是否可能退化？需要重新评估哪些点？
answer:
  mode: rubric
  reference_answer: |-
    会退化，且往往被忽视。压缩可能导致模型在安全对齐上出现不可预测的倒退。

    退化的原因：

    - 量化可能使安全拒绝的决策边界模糊化，原本刚好被拒绝的有害请求在量化后可能通过。

    - 剪枝可能恰好移除了对安全对齐关键的参数（如拒绝生成的注意力头）。

    - 蒸馏时学生模型可能学会更流畅地生成不安全内容，如果教师的安全行为未被充分迁移。

    需要重新评估的维度：

    有害内容生成率需要重新测试，压缩模型对越狱攻击的抵抗力可能下降。拒绝与过度拒绝的边界需要重新校准，确保压缩后没有变得过度保守。社会偏见的评估指标可能升高，因为压缩可能放大已有的偏见。幻觉率可能因量化误差上升。跨模态泄露风险在压缩后权限控制可能弱化。

    应对措施：

    将安全评估集成到压缩流程中。每轮压缩后自动运行安全基准测试，设定安全退化红线。在蒸馏时特别加入安全对齐数据（包括拒绝回答的样本）。压缩后进行轻量安全微调，专门针对退化的安全维度做校准。


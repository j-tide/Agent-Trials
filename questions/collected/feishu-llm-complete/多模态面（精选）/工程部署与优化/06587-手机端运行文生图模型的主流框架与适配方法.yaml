content:
  prompt: 手机端运行文生图模型的主流框架与适配方法
answer:
  mode: rubric
  reference_answer: |-
    在手机上运行Stable Diffusion等文生图模型，必须极致压缩模型体积、利用硬件加速、减少推理步数。主流框架及适配方案如下：

    [嵌入表格未展开]

    关键适配技巧：

    - 模型拆分：将UNet、VAE解码器、文本编码器分为独立子模型，按需加载到内存，避免整块模型常驻。例如生成时先加载文本编码器，再加载UNet逐步采样，最后加载VAE解码。

    - 步数缩减：使用LCM、DPM-Solver等高效采样器将生成步数从50步降至4-8步，同时维持可接受画质。

    - 量化：UNet权重做INT8量化，激活可保持FP16；VAE解码器对精度敏感，通常保持FP16。

    - 内存优化：利用Core ML的“paged attention”或MNN的内存池，在采样循环中重用张量显存。

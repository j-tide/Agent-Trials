content:
  prompt: 离线 RAG + 多模态：如何在无网络环境下，构建基于本地知识库的多模态问答系统？
answer:
  mode: rubric
  reference_answer: |-
    离线多模态RAG要求所有组件（文档、嵌入、检索、LLM、视觉编码器）全部本地部署。

    架构设计：

    [图片内容未导入]

    组件选型：

    - 文档处理：用tesseract离线OCR图片中的文字；用PyMuPDF解析PDF；Unstructured库进行版面分析和分块。

    - 嵌入模型：使用小型多语言嵌入模型如bge-small-zh-v1.5 (约24MB) 负责文本嵌入；图像嵌入用MobileCLIP或蒸馏后的轻量CLIP（约80MB）。

    - 向量数据库：ChromaDB或LanceDB，无需服务器，纯本地运行。

    - 多模态大模型：部署量化后的轻量MLLM，如LLaVA-1.5-7B的INT4版本（约4GB显存），或更小的Qwen-VL-Chat-7B。在无GPU环境下可使用llama.cpp的llava分支在CPU上运行。

    - 硬件要求：至少16GB RAM和50GB存储；若无GPU，推理速度较慢但可行。

    工作流：

    - 提前将本地文档（合同、手册、产品图片）离线处理并索引。

    - 用户提问，意图分类判断是否需要检索。若问题附带有图片，先对该图片用视觉编码器提取特征，并与图像库比对。

    - 检索出的相关文本块和图像（或图像描述）作为上下文，与用户问题一同送入MLLM。

    - MLLM生成答案，无任何数据外传。

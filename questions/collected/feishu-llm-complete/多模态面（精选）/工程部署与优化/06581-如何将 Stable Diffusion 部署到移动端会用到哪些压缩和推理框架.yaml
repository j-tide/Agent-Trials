content:
  prompt: 如何将 Stable Diffusion 部署到移动端？会用到哪些压缩和推理框架？
answer:
  mode: rubric
  reference_answer: |-
    移动端部署SD面临模型大、推理慢、功耗高的三重挑战。综合使用模型压缩、推理引擎优化和架构适配。

    模型压缩技术：

    UNet是主要瓶颈。可使用剪枝去除冗余通道，使用知识蒸馏将SDXL等大模型的知识迁移到轻量UNet。量化方面，UNet权重通常量化到INT8，激活值视情况保留FP16或INT8。VAE解码器也可独立量化。文本编码器相对轻量，可保持FP16或用INT8。此外，Tiny AutoEncoder可将潜变量进一步压缩，或使用Wuerstchen等压缩级联架构。

    推理框架：

    [嵌入表格未展开]

    部署优化：

    使用4步LCM或20步DPM-Solver等高效采样器，大幅减少迭代次数。将UNet、VAE、Text Encoder分别封装为独立推理模块，减少显存峰值。利用平台特有的硬件加速，iOS用ANE、Android用GPU Delegates。FP16/INT8混合精度推理可减少模型体积和显存。还可将模型拆分为若干子模块，部分放在云端、部分本地。

    目前SD能在iPhone 15 Pro上实现秒级生成，在高端Android设备上也是可行的。


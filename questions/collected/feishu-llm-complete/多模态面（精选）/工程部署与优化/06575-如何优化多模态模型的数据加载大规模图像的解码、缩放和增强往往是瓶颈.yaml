  prompt: 如何优化多模态模型的数据加载？大规模图像的解码、缩放和增强往往是瓶颈。
answer:
  mode: rubric
  reference_answer: |-
    多模态训练中，数据加载的瓶颈来自高分辨率图像的I/O、解码和预处理。优化需从存储、CPU/GPU分工、预取、缓存多层面入手。

    瓶颈诊断：使用PyTorch Profiler或nvidia-smi监控GPU利用率。若GPU频繁空闲（利用率波动大），而CPU利用率高，说明数据加载是瓶颈。

    优化策略：

    [嵌入表格未展开]

    多模态特有考量：

    - 动态分辨率技术下，每个图像切分块数不同，预处理时间波动大。建议按切分块数分组batch，减少同一batch内的负载不均衡。

    - 若训练中包含纯文本数据，应与图像数据交错采样，使GPU不至于在纯文本轻负载时空闲。

    实践组合：推荐方案 = WebDataset格式存储 + DALI GPU预处理 + DataLoader预取。该组合可将数据加载延迟降至接近零，GPU利用率保持在95%以上。


answer:
  mode: rubric
  reference_answer: |-
    - 注册自定义算子：使用 ONNX Runtime 的 CustomOp API 将 FlashAttention 等自定义 CUDA kernel 注册为 ONNX 算子。社区已有 onnxruntime-extensions 提供部分实现。

    - 导出时简化模型：将动态控制流转换为等价的计算图（如用 torch.where 的静态版本），或使用 torch.onnx.export 的 dynamic_axes 正确配置动态维度。

    - 选择兼容的执行提供者：TensorRT 后端通常比 CUDA 后端有更好的算子覆盖，但可能牺牲灵活性。可以优先尝试 CUDA EP，遇到不支持算子时回退到 CPU EP。

    - 使用最新版本：ONNX Runtime 1.16+ 已支持 scaled_dot_product_attention 等新算子，及时升级可解决大部分兼容性问题。

    - 混合推理：将整个模型拆分为多个 ONNX 子图，不支持的模块保留在 PyTorch 中，通过 torch.utils.dlpack 在 ONNX 和 PyTorch 之间传递张量。

    - 替代方案：如果 ONNX 兼容性改造工作量过大，可使用 TensorRT 或 OpenVINO 作为替代推理引擎，它们对 PyTorch 模型的支持更原生。

    ### 多模态服务的可观测性需要收集哪些关键指标？

    多模态推理服务的可观测性需要覆盖业务层、模型层、系统层三个维度。

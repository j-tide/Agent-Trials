content:
  prompt: 在多模态强化学习训练（如 RLHF）中，生成和训练的交替进行对集群调度提出了哪些要求？
answer:
  mode: rubric
  reference_answer: |-
    RLHF的交替特性：模型先采样生成回答（推理阶段），然后对这些回答计算奖励并更新模型（训练阶段）。两阶段的资源需求截然不同。

    资源需求对比：

    [嵌入表格未展开]

    调度挑战：

    - 生成阶段GPUs利用率可能仅为训练阶段的50%，资源闲置。

    - 频繁切换生成和训练模式，若重新分配GPU，开销巨大；若固定GPU，则峰值需求决定总GPU数。

    调度策略：

    - 分离式集群：生成阶段使用推理专用GPU池（可能用更便宜的T4/A10），训练阶段使用高端GPU池（A100/H100）。生成结果通过网络传回训练集群。成本效率高，但引入数据传输延迟。

    - 分时复用：同一GPU集群分时运行两个阶段。例如前10分钟执行生成，后10分钟执行训练。需要调度器支持快速模式切换，并预留足够的显存容纳两阶段峰值。

    - 在线生成与离线训练解耦：生成一批数据后存入经验回放池，训练进程独立从池中采样。两者可异步运行在不同集群，完全解耦。

    实践：OpenAI的RLHF使用分离式集群。生成阶段用大规模低精度推理集群，训练阶段用紧密互联的高端训练集群。


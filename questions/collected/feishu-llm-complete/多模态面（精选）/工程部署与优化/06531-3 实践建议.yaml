    - 组合使用：预留 1-2 个常驻实例处理基础流量，突发流量由 Serverless 冷启动实例应对。对于非实时任务（如批量处理），冷启动延迟可接受。

    - 选择适合的模型大小：在 Serverless 场景下，使用 7B 或更小模型，配合 INT4 量化，模型加载更快。

    - 平台选型：评估各 Serverless GPU 平台的预热机制和冷启动延迟，选择对多模态模型友好的方案（如支持 Docker 镜像缓存、模型快照的平台）。

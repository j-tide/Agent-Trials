content:
  prompt: 卫星或无人机等极端边缘节点，多模态压缩感知技术能否实现超低带宽的图像传输与问答？
answer:
  mode: rubric
  reference_answer: |-
    在卫星和无人机场景，上传原始图像几乎不可能（带宽几kbps）。多模态压缩感知指在发送端将图像压缩为极度紧凑的语义特征，接收端基于特征进行问答或恢复。

    技术路线：

    - 压缩语义编码：在星载/机载端部署一个轻量视觉编码器（如微型ViT），将图像编码为特征向量（如512维），而不是像素。此向量通过低带宽链路传回地面。

    - 地面端任务执行：地面站接收特征向量后，可以直接用于问答（送入MLLM的投影层），或使用一个生成模型（如扩散模型）从特征重建图像供人工判读。这属于“面向任务的压缩”。

    - 增量传输：对于视频序列，只传输关键帧的特征以及帧间特征的残差。

    - 带宽自适应：根据当前可用带宽，动态调整特征向量的长度（如通过PCA降维或直接截断）。在极低带宽时，只传全局语义向量（如CLIP的CLS token），执行图像分类或场景摘要。

    能否实现超低带宽问答？ 可以，但精度有损失。对于“图中是否有坦克？”这类二分类问题，只需传输几个bit的信息；对于“描述当前场景”，需较多特征。当前研究（如JSCC）在0.1bpp下仍能完成粗粒度问答。

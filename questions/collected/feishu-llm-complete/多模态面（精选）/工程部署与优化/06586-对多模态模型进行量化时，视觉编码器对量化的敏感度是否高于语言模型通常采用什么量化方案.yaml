content:
  prompt: 对多模态模型进行量化时，视觉编码器对量化的敏感度是否高于语言模型？通常采用什么量化方案？
answer:
  mode: rubric
  reference_answer: |-
    视觉编码器对量化的敏感度通常高于语言模型，尤其是对低比特量化。

    敏感度差异的根源：

    [嵌入表格未展开]

    典型量化方案：

    对视觉编码器采用保守策略。权重通常用INT8对称量化或更轻的FP8。激活值建议保持FP16或使用动态范围的INT8（即每一层根据实际激活分布实时计算缩放因子）。对于ViT的自注意力层，Q/K/V的量化需要特别注意softmax前的数值范围，避免极端值被截断。

    对LLM可以采用更激进的策略。权重使用INT4分组量化（如GPTQ、AWQ），配合激活值的FP8或INT8。由于LLM的离群值往往集中在特定通道，AWQ通过按通道缩放权重可有效处理此问题。

    混合精度量化是主流方案。视觉编码器和投影层用INT8或FP16，LLM用INT4。有时对视觉编码器的浅层保留FP16，深层做INT8，以平衡精度和加速。典型配置如视觉编码器W8A8（权重INT8、激活INT8）或W8A16，LLM用W4A16。

    实践经验是，将ViT从FP16量化到INT8通常只损失0.1-0.3%的检索或VQA准确率，但到INT4时可能下降1-2%。而LLM从FP16到INT4的精度损失通常可控制在0.5%以内。量化应优先从LLM开始，视觉侧保持相对保守。


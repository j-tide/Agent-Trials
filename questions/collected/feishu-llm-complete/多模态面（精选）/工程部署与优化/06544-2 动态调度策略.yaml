answer:
  mode: rubric
  reference_answer: |-
    - 弹性资源池：理解服务作为基础服务，保证最低 GPU 数量；生成服务使用弹性实例（如 Spot 实例），在低峰期运行。

    - 请求路由：API 网关根据请求类型（/v1/chat vs /v1/generate）路由到不同的服务池。

    - 基于负载的扩缩容：理解服务基于队列深度和延迟触发扩容；生成服务基于待处理任务数触发。

    - GPU 共享的精细控制：如果使用 MIG，可以为理解服务分配 2 个计算实例（各约 40GB 显存），为生成服务分配 1 个实例（约 20GB），按需调整。


content:
  prompt: 车载环境下，多模态模型如何应对动态变化的算力资源
answer:
  mode: rubric
  reference_answer: |-
    汽车芯片（如高通8155/8295, NVIDIA Orin, 地平线征程）算力从几TOPS到数百TOPS不等，且算力被多个系统（智驾、座舱）共享，动态变化。

    应对策略：

    - 模型自适应切换：维护一个模型族，包含不同复杂度的版本（如MobileNetV2, ResNet-18, ViT-Tiny）。根据当前可用算力（通过系统监控API获取）动态选择模型。例如，当智驾系统高负载时，座舱的多模态交互切换到极简模型。

    - 弹性推理：利用提前退出机制（Early Exit），在神经网络的中间层添加分类头，如果置信度足够高就提前返回结果，节省算力。

    - 优先级调度：安全相关的多模态感知（如驾驶员监控DMS）设为最高优先级，独占部分NPU资源；娱乐相关功能（如语音助手、手势控制）使用剩余资源，并可被抢占。

    - 协同推理：将部分任务卸载到乘客的手机或可穿戴设备。例如，语音识别在手机上完成，结果传到车机。

    - 动态量化精度：在算力充足时使用FP16，不足时切换到INT8。可通过运行时重载权重实现。

    - 异步预处理：摄像头视频流持续由硬件解码器处理，提取轻量视觉特征缓存。当用户发起多模态查询时，直接使用缓存特征，避免实时重复编码。

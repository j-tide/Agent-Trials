  reference_answer: |-
    [嵌入表格未展开]

    混合架构设计原则：浅层用轻量卷积捕获局部特征和纹理，效率高；深层用有限的自注意力层进行全局建模；分辨率不宜过高，如224×224。注意力机制使用简化变体（如池化注意力）。宽度和深度通过NAS搜索最优配置。使用ReLU6或Hard-Swish等移动端友好激活函数。MobileViT仍是综合最优选择，但EfficientFormer在精度上正快速追赶。


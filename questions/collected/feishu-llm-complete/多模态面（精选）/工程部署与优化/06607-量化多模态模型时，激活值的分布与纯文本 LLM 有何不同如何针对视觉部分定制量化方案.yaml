content:
  prompt: 量化多模态模型时，激活值的分布与纯文本 LLM 有何不同？如何针对视觉部分定制量化方案？
answer:
  mode: rubric
  reference_answer: |-
    激活值分布差异：

    视觉编码器输出token的激活值分布与文本token显著不同。视觉token数量多但彼此高度相关，分布呈多模态，离群值集中在物体边缘和高纹理区域。文本token数量少，嵌入分布相对平滑，存在通道维度的系统性离群值（特定通道持续具有大幅值）。视觉token的范围通常更广，各通道方差大且不规则。

    定制量化方案：

    视觉编码器内部激活值建议保守量化。浅层使用FP16（对纹理极其敏感），深层可尝试逐张量或逐通道的INT8量化。需要使用代表性图像校准激活值的动态范围。

    视觉token输入到LLM时的量化，建议将视觉token和文本token分开量化，各自使用独立的缩放因子。如果LLM使用W4A16（仅权重量化），视觉token的激活值无需额外处理。如果激活也要量化，需对视觉token采用更宽的量化范围。

    当使用高分辨率动态分块时，不同图像token数量变化大，量化参数也需动态计算。可为常用分辨率预存量化参数，或在线计算首批token的统计信息。


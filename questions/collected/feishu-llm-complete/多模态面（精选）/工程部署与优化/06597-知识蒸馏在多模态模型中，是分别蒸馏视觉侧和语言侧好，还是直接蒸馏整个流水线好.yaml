content:
  prompt: 知识蒸馏在多模态模型中，是分别蒸馏视觉侧和语言侧好，还是直接蒸馏整个流水线好？
answer:
  mode: rubric
  reference_answer: |-
    两者各有优劣，最佳策略是分层分阶段蒸馏。

    分别蒸馏：视觉侧用大模型的视觉编码器作为教师，蒸馏小模型视觉编码器。语言侧用大模型的LLM作为教师，蒸馏小模型LLM。优点是模块独立、实现简单、可复用已有单模态蒸馏技术。缺点是忽略了跨模态交互的知识，投影层和融合层的知识无法被有效传递。

    端到端蒸馏：将整个大模型流水线作为教师，小模型从头到尾模仿大模型的最终输出和中间表示。优点是保留了完整的跨模态交互知识，小模型学到的是联合推理。缺点是训练不稳定、计算开销大、难以收敛。

    推荐的分层蒸馏策略：

    第一阶段分别蒸馏视觉和语言单模态模块，建立良好的基础表示。视觉侧用大模型的视觉编码器做特征蒸馏，语言侧用大模型LLM的输出分布做logits蒸馏。

    第二阶段端到端多任务蒸馏。小模型加载第一阶段预训练的权重，完整流水线训练。损失函数包含多个组件：图文匹配和VQA等任务上模仿教师输出分布的回答蒸馏损失，关键跨模态层（如交叉注意力输出）的特征对齐损失，以及下游任务的真值监督损失。多损失联合优化，总损失约按0.5、0.3、0.2的比例加权。

    这种分层策略既能利用分别蒸馏的高效性，又能通过端到端蒸馏捕获跨模态交互。


answer:
  mode: rubric
  reference_answer: |-
    text

    用户请求 → 网关 (Envoy) → 路由决策服务 (Python/Go)                              │                  ┌───────────┴───────────┐                  │                       │            ┌─────▼─────┐          ┌─────▼─────┐            │ 视觉编码v1 │ (95%)    │ 视觉编码v2 │ (5%)            └───────────┘          └───────────┘

    - 路由决策服务：从请求头中解析用户 ID，根据灰度配置（如 Redis 中的灰度比例、白名单）决定路由到哪个 Upstream Cluster。

    - Envoy 配置：使用 VirtualHost 的 routes 根据 Header（x-model-version）直接路由，或通过 envoy.filters.http.ext_authz 调用外部服务获取路由目标。

    - 流量渐进式切换：初期 1% → 观察无异常 → 5% → 10% → 50% → 100%。通过配置中心动态调整灰度比例，无需重启网关。

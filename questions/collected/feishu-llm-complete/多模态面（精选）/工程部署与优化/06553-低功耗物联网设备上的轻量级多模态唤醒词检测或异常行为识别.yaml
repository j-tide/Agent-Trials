content:
  prompt: 低功耗物联网设备上的轻量级多模态唤醒词检测或异常行为识别
answer:
  mode: rubric
  reference_answer: |-
    在MCU或低功耗处理器（如ARM Cortex-M, ESP32-S3）上，资源极度有限（SRAM几百KB，Flash几MB）。方案设计必须极端轻量。

    多模态唤醒词检测（例如，结合声音和简易视觉）：

    - 语音分支：使用极小的关键词识别模型（如基于DS-CNN的MobileNetV1宽度乘数0.25），仅需约100KB权重，运行在8-16KB的SRAM。

    - 视觉分支：使用极简的二值化或1-bit CNN（如BinaryNet），对低分辨率灰度图像（32x32）做是否有人的检测。权重约20KB。

    - 融合决策：语音概率和视觉概率加权求和，超过阈值触发唤醒。融合可以简单地用逻辑与（声+视同时激活）以减少误唤醒。

    - 部署框架：TensorFlow Lite for Microcontrollers (TFLM) 或 CMU 的 ONNC.

    异常行为识别（如老人跌倒检测）：

    - 使用轻量3D CNN或(2+1)D卷积处理连续几帧的深度或RGB图像。典型模型如MobileNetV2-3D，通过知识蒸馏压缩至500KB以下。

    - 在MCU上推理时，使用CMSIS-NN库加速卷积，将权重和激活量化为INT8。

    - 为降低功耗，多数时间处于低功耗待机，仅当加速度计检测到运动时唤醒NPU/CPU进行视觉推理。

    关键技术：

    - 模型采用Depthwise Separable卷积，减少参数和运算量。

    - 激活函数用Hard-Swish或ReLU6。

    - 使用模型剪枝和结构重参数化去除冗余分支。

answer:
  mode: rubric
  reference_answer: |-
    使用一个轻量级图像复杂度评估模型（如基于 MobileNet 的分类器），快速判断图像是否需要高分辨率处理。规则示例：

    - 如果图像包含文字（通过 OCR 预检），启用高分辨率模式。

    - 如果图像主要区域为纯色或简单纹理，使用低分辨率。

    - 如果用户明确要求 quality=high，强制高分辨率。

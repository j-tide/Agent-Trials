content:
  prompt: 如何利用对抗生成网络构造测试图片，来探测模型的敏感属性偏好？
answer:
  mode: rubric
  reference_answer: |-
    对抗生成网络（GAN）可以生成高度逼真且参数可控的图像，是构建控制变量测试集的理想工具。

    构造方法：

    - 属性解耦的GAN：使用如StyleGAN这类可以将语义属性解耦的生成模型。StyleGAN的潜在空间有明确的方向向量对应“年龄”、“性别”、“肤色”、“表情”等属性。通过沿特定方向移动潜在编码，可以生成一个图像序列，其中只有目标属性在平滑变化，其余所有视觉元素（身份、背景、姿势、光照）保持绝对一致。

    - 构造测试集：选择一系列基准潜在编码，生成中性的基础图像。然后对这些编码应用不同的性别、种族和年龄方向的偏移，生成多个人口统计版本的同一“人”的图像。最后将这些图像嵌入到标准测试场景中（通过图像合成技术）。

    - 探测偏好：将这些控制变量的图像输入多模态模型，进行任务测试。例如，针对每一组只有性别不同的图像，问相同的问题“这个人的职业可能是什么？”。统计模型的回答中职业标签的分布是否随性别发生系统性变化。如果“男性”版本被频繁回答为“CEO”、“医生”，而“女性”版本被回答为“教师”、“助理”，则探测到了性别-职业偏见。

    - 剂量-反应测试：利用GAN的连续属性变化能力，可以探测偏见的“陡峭度”。例如，让肤色从浅到深连续变化，观察模型输出的情感评分或犯罪关联词频率是否连续变化，是否存在某个阈值后显著恶化。

    - 生成反事实干扰样本：对真实图像进行GAN反事实编辑（如将照片中的男性换成女性），然后将原始图和编辑图配对测试，评估模型对同一场景不同群体的回答一致性。

    GAN的优势在于它能生成现实中不存在但视觉上完全真实的反事实图像，填补了真实数据中难以找到完美控制对的空白。但要注意，GAN自身也可能携带训练数据中的偏见，生成的图像可能强化某些刻板印象，使用时需谨慎验证。


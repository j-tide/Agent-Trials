content:
  prompt: 设计多模态模型的“回归测试”套件，应该包含哪些典型用例？
answer:
  mode: rubric
  reference_answer: |-
    回归测试套件是模型的"疫苗清单"，包含了历史上所有犯过的错误、被用户投诉过的案例、以及必须守住的能力底线。

    用例分类与来源：

    [嵌入表格未展开]

    用例的存储格式：每个用例是一个结构化对象，包含输入（图像+文本+对话历史）、期望行为（精确答案或正则规则或基于LLM的通用断言）、用例标签（能力维度、风险等级）。对于开放式问题，不要求字字匹配，而是用LLM-as-Judge自动评估，并对模糊用例定期人工抽检校准。

    执行与维护：每次模型更新自动全量运行，通过率低于100%时阻断上线（这意味着对已知Bad Case要求零回归）。对于P0级别用例，人工复核每个失败案例。用例不是一成不变的，需要定期去重和淘汰：如果某个用例连续通过50次更新都正确，可能是模型已经"背下来"了，应替换为同能力维度的新样本。用户反馈和红队发现的新的Bad Case，经过人工标注后加入用例库，保持套件的不断更新。


content:
  prompt: 如何进行持续评估，以监控部署后的模型性能是否退化？
answer:
  mode: rubric
  reference_answer: |-
    模型部署后不是一劳永逸的。用户行为变化、数据分布漂移、模型自身更新都可能导致性能悄然退化。持续评估体系就是生产环境中的"体检系统"。

    建立评估数据的三层结构：

    - 锚定测试集：部署时从真实流量中随机抽取一批样本，经人工精标注后永久锁定。这批样本不再更改，作为性能退化的绝对参照系。

    - 滚动窗口测试集：定期（如每周）从近期真实流量中抽取样本，经人工或半自动标注后加入评估池。反映最新的数据分布。

    - 对抗性/压力测试集：专门收集历史上的Bad Case和已知的模型短板，作为回归测试的"雷区"。

    监控指标体系：

    [嵌入表格未展开]

    触发告警与自动响应机制：

    - 设定多级告警阈值。当业务指标连续两个监控周期（如两天）低于历史均值的2个标准差时，触发黄色告警。

    - 当锚定测试集上的核心准确率下降超过3%时，触发红色告警，自动回滚到上一个稳定版本。

    - 建立"性能-版本"关联数据库，每次模型更新后可在Dashboard上直观看到各指标的时间序列曲线。

    持续评估不是一次性的发布前测试，而是伴随模型整个生命周期的常态化流程。


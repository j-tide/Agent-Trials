content:
  prompt: 编写多模态评估报告时，应该向非技术管理层展示哪些核心指标和风险？
answer:
  mode: rubric
  reference_answer: |-
    给管理层的报告与给技术团队的报告完全不同。管理层关心的是：这个模型能用吗？用了会出事吗？花了多少钱值不值？

    核心指标看板：

    [嵌入表格未展开]

    风险沟通原则：

    不要只报喜不报忧。主动列出已知短板（如"计数能力弱"、"医疗建议不可靠"），并针对每项风险说明当前已采取的控制措施（如"已增加免责声明"、"该类问题触发人工审核"）。用具体案例说明风险：不说"有偏见风险"，而说"在测试中，当输入阿拉伯语文本时，模型有15%的概率给出明显错误回答，我们已限制该语种使用并提示用户"。

    最后给出清晰的建议：是否建议上线？如上线，推荐的部署范围（全量/灰度/仅内部测试）和条件（需满足哪些前置安全条件）。附上模型的版本号、训练数据截止日期、已知局限清单，供法务和合规团队存档。


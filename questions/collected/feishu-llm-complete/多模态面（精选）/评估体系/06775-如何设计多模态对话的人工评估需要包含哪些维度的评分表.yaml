content:
  prompt: 如何设计多模态对话的人工评估？需要包含哪些维度的评分表？
answer:
  mode: rubric
  reference_answer: |-
    多模态对话的人工评估需要精心设计才能捕捉到模型的综合表现，因为对话是开放性的，没有标准答案。评估的核心思路是：将抽象的用户满意度拆解成多个可打分、可定义的具体维度。

    一个完善的多模态对话人工评估评分表通常包含以下几个维度，每个维度采用 1-5 或 1-7 的 Likert 量表，并附带清晰的行为锚定描述，以降低主观性。

    - 视觉忠实度。这是多模态对话的生命线。评估答案中关于图像的陈述是否准确，是否编造了图像中不存在的细节。5 分：所有视觉陈述都与图像严格一致，不确定的地方都如实说明。1 分：主要事实性陈述与图像矛盾，严重幻觉。

    - 指令遵循度。评估模型是否正确理解了用户的意图和格式要求。如果用户要求“用 JSON 格式输出”，模型是否做到了？如果用户问“简要回答”，模型是否罗里吧嗦？5 分：完美遵循所有显式和隐式指令。1 分：完全无视指令。

    - 回答有用性与完整性。在忠实于图像的前提下，回答是否解决了用户的问题？信息量是否恰好？有没有遗漏关键点？5 分：完整回答了问题的各个方面，提供了恰到好处的细节。1 分：答非所问，或关键信息全部缺失。

    - 语言流畅性与连贯性。评估语言的语法正确性、自然度和逻辑连贯性。5 分：语言流畅自然，像真人在对话。1 分：难以理解，语法破碎。

    - 适当性与安全性。评估模型是否具有合适的对话边界。面对敏感问题是否拒绝？面对模糊问题是否澄清？语气是否得体？5 分：安全边界清晰，在不确定时能诚实表达。1 分：给出了危险建议或越过了明显的安全红线。

    - 个性化与上下文一致性（多轮对话场景）。评估模型是否记住了之前的对话内容，回答是否与前文一致，指代是否消解正确。5 分：完美跟踪对话状态，指代准确。1 分：每轮都像在跟一个失忆的人说话。

    评估流程设计：人工评估员需要接受校准培训。先由多位评估员对同一批样本打分，计算评分者间信度。只有当一致性达到可接受水平时，正式评估才开始。评估可以采用“单盲”设计：评估员不知道哪个回答来自哪个模型，排除品牌偏见。最终的评估报告不仅要给出各维度的平均分，还要对低分案例进行定性分析，找出模型的系统性缺陷模式。这种多维度、锚定清晰的评估虽然成本高，但能为模型改进提供精确的指导。


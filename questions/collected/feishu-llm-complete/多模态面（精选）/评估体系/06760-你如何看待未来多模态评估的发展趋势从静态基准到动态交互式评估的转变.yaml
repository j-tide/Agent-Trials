content:
  prompt: 你如何看待未来多模态评估的发展趋势？从静态基准到动态交互式评估的转变？
answer:
  mode: rubric
  reference_answer: |-
    多模态评估正经历从"应试教育"到"实战检验"的范式转变。静态基准评估模型在固定题库上的表现，就像让学生背题库考试；而动态交互式评估则更像真实工作场景中的综合能力考察。

    转变的驱动力：

    静态基准的黄金时代正在落幕。经过多年开发，多数基准已被模型"刷分"至天花板，分数提升更多反映过拟合而非真实能力。同时，多模态模型的核心应用场景已从简单的"看图说话"演进为"多轮协作完成任务"，静态问答完全无法捕捉这种交互深度。

    未来发展趋势：

    [嵌入表格未展开]

    新评估架构的雏形：未来的评估系统可能包含一个"评估编排器"，它根据待测模型的已知能力档案，动态生成个性化的测试流。不是所有模型测同一套题，而是像医生问诊一样，先测基础指标，发现薄弱项后深入探查。整个评估过程成为一个交互式诊断对话，评估系统扮演考官角色，不断提出新的问题并观察模型的应答。

    这个转变不会一蹴而就。在未来很长一段时间内，静态基准仍将作为快速筛选和回归测试的工具，而动态交互式评估则会占据越来越重要的位置，最终成为衡量通用多模态智能的黄金标准。

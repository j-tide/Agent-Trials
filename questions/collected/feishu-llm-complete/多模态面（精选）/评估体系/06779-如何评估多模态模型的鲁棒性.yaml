content:
  prompt: 如何评估多模态模型的鲁棒性？
answer:
  mode: rubric
  reference_answer: |-
    多模态模型的鲁棒性指它在输入数据分布发生变化或遭受干扰时，仍能保持稳定正确输出的能力。评估鲁棒性不是用单一指标，而是通过一系列“压力测试”来测量性能的衰减程度。

    - 视觉损坏鲁棒性：使用标准测试集（如 ImageNet-C）对输入图像施加各种退化——高斯噪声、运动模糊、JPEG 压缩、雨雪雾天气模拟、亮度对比度变化等。计算模型在这些退化图像上的性能下降百分比。鲁棒的模型应该对常见噪声和天气影响不敏感，性能下降平缓。

    - 分布外鲁棒性：测试模型在与训练数据分布不同的图像上的表现。例如，用 ImageNet-R（包含涂鸦、雕塑、卡通等非自然图像的“演绎版本”）和 ImageNet-Sketch（黑白线条画）来考察模型是否过度依赖纹理捷径。如果模型在标准图像上准确率高但在素描图上骤降，说明它学到的是纹理而非形状。

    - 对抗鲁棒性：使用对抗攻击算法对输入图像添加人眼不可见的扰动，这些扰动专门设计来最大化模型的预测错误。鲁棒性通过攻击成功率和攻击后的性能下降来评估。

    - 文本变化鲁棒性：对输入的文本问题进行改写——同义词替换、改变语序、引入拼写错误、翻译成其他语言再翻回来。鲁棒的模型应能捕捉到相同的意图并给出一致的回答，而不是对措辞敏感。

    - 跨模态干扰鲁棒性：这是多模态特有的。改变图像和文本之间的对应关系，测试模型是否会盲目融合矛盾信息。比如，给一张猫的图片问“这只狗是什么品种？”，鲁棒的模型应能指出图文矛盾或纠正错误前提，而不是顺着文本编造。

    - 模态缺失鲁棒性：在推理时故意不给图像或只给模糊图像，测试模型是否诚实表达不确定性，而不是强行编造回答。

    评估鲁棒性时，通常报告“性能保持率”（损坏后性能/原性能）作为核心指标。更重要的是分析失败模式，定位模型脆弱性的根源。


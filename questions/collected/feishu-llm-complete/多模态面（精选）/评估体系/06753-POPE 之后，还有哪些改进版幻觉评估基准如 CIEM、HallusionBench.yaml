content:
  prompt: POPE 之后，还有哪些改进版幻觉评估基准？如 CIEM、HallusionBench。
answer:
  mode: rubric
  reference_answer: |-
    POPE 主要关注对象存在性幻觉，后续基准向更细粒度、更多模态和更复杂推理方向扩展。

    CIEM（Contrastive Image Evaluation Method）：

    CIEM 的设计思路是“正反对比”。它不是直接问“有没有”，而是给模型展示两张图像——一张是原始的真实图像，另一张是基于原图做了局部修改的“反事实”图像。修改的内容就是加入或移除某个物体。然后问一个关于该物体的对比性问题，如“哪张图中有猫？”。如果模型不能准确识别，或者对两张图的回答自相矛盾，就说明它存在幻觉或视觉混淆。这种方法比 POPE 更进一层，因为它迫使模型在极其相似的两张图之间做精细的视觉区分，更能检测出模型的视觉敏感度而非语言先验。

    HallusionBench：

    HallusionBench 是一个更全面的视觉幻觉诊断基准，不仅覆盖对象存在性，还覆盖属性、关系、文字阅读和知识推理幻觉。其独特之处在于：

    - 图像-文本联合逻辑陷阱：精心设计图文不一致的样本。例如，图像是一只斑马，但文本问“这匹马的条纹是什么颜色？”模型需要先识别到图中是斑马而非马，然后理解问题中“马”的指代是错误的，并做出纠正或指出矛盾。这测试模型是否盲目跟随文本中的错误前提。

    - 多轮递增测试：对同一张图像，先问简单问题，再逐步加问涉及推理和细节的问题，观察幻觉是否在多轮中累积。

    - 控制组：为每个视觉问题设计一个纯文本对照问题，以区分幻觉是来自视觉理解失败还是语言推理失败。

    其他改进方向：一些基准开始引入视频中的时间幻觉（事件顺序错误）、多图对话中的跨图混淆、以及多模态长文本生成中的事实一致性等更复杂的幻觉类型，推动评估向更真实复杂的场景演进。


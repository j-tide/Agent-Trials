content:
  prompt: 在多模态检索评估中，除了 Recall@K，还有哪些指标可以衡量排序质量？
answer:
  mode: rubric
  reference_answer: |-
    Recall@K 是检索评估中最直观的指标，但它只关心“正确答案是否在前 K 个里面”，完全不关心正确答案的具体排名以及负样本的排序情况。这在实际应用中是一个严重缺失——用户非常在意第一个结果是否就是想要的，而不只是“前 10 个里有就行”。因此需要更细腻的排序质量指标来弥补。

    MRR，即平均倒数排名，是 Recall@K 的天然补充。它衡量的是第一个相关结果的排名的倒数。对于每个查询，如果第一个相关结果排在第 1 位，MRR 贡献为 1；排在第 5 位，贡献为 0.2；排在 10 位以外贡献为 0。然后对所有查询取平均。MRR 极度看重“首个命中的位置”，在语音助手、搜索框自动补全等场景中尤为重要，因为用户往往只看最上面的答案。

    Precision@K 衡量的是前 K 个结果中相关结果的比例。当检索系统需要控制返回结果的噪声水平时（如法律文书检索），高 Precision 比高 Recall 更重要。Recall 高而 Precision 低意味着虽然正确答案在结果列表里，但混在大量无关信息中，用户体验仍然很差。

    MAP（平均精度） 是对 Precision 在多个召回点上的综合考量。它对每个查询计算在不同 K 值下的精度，并将这些精度值按相关文档的排名进行平均。与 MRR 只看第一个不同，MAP 奖励将多个相关文档都排在靠前位置的系统。如果一张图对应多个正确描述，MAP 能更全面地评估它们的排序质量。

    nDCG（归一化折损累积增益） 引入了相关度的分级概念。不是简单地将文档分为“相关”和“不相关”，而是可以赋予不同的相关性等级（如非常相关 3 分、部分相关 1 分）。它计算每个文档的增益除以它排名位置的对数折损，再对理想排序下的最大可能增益进行归一化。nDCG 对排序质量的要求比 MAP 更细致，适用于有精细人工标注相关度等级的场景。

    中位排名 是一个直观的统计量：在所有查询中，第一个相关文档的排名中位数是多少。它不受少数极差查询的极端值影响，比平均排名更稳健。

    在实际的多模态检索评估中，通常不会只用其中一个，而是组合使用 Recall@1/5/10 和 MRR，必要时再加上 nDCG。RSUM（所有 Recall@K 值之和）也常作为综合指标出现。这样的组合能提供一个从“有没有找到”、“找到得多靠前”、“整体排序好不好”的立体视图。


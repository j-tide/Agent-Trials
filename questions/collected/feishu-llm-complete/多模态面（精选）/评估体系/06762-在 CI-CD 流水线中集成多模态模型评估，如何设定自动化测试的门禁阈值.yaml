content:
  prompt: 在 CI/CD 流水线中集成多模态模型评估，如何设定自动化测试的门禁阈值？
answer:
  mode: rubric
  reference_answer: |-
    模型迭代绝不能靠"感觉好了就上线"。CI/CD流水线中的自动化评估是防止模型退化的最后一道防火墙。门禁阈值需要分层设定，宽严相济。

    分层门禁体系：

    第一层：阻断级门禁。任何新模型版本必须无条件通过，否则自动阻断上线流程。对于安全相关指标（如NSFW回答率、医疗建议违规率），必须为0或接近0；对于核心能力的退化容忍度极低，设定整体准确率降幅不超过1%，任一单项能力降幅不超过3%。这一层会运行完整的回归测试套件，时间较长（可能数小时），但把关最严。

    第二层：告警级门禁。未达标时自动标记并通知开发者，由人工判断是否放行。适用于次要能力的轻微退化（如开放域闲聊的流畅度降幅小于5%）、延迟类指标（TTFT增加不超过20%）等非致命但需关注的问题。这一层运行速度较快（约30分钟）。

    第三层：参考级监控。不设硬阈值，但记录为趋势数据，供长期观察。包括新能力的首次评测分数、实验性指标（如幽默感、创意性评分）。这些数据帮助团队积累对模型行为的理解。

    动态阈值调整：

    门禁阈值不应是拍脑袋固定的数字。应定期（每季度）回顾历史通过率和误报率。如果某个阻断规则导致90%的更新都被拦下，说明阈值过严或该指标波动性本身很大，需要适当放宽或引入更稳健的统计检验（如采用最近10个版本的平均值作为基准，而非单一固定值）。

    快速烟雾测试与完整评估协同：为适应CI/CD的速度要求，将评估分为两阶段。提交代码后先运行"烟雾测试"（约10-15分钟），选取最具代表性的100道题覆盖核心能力，快速判断是否有灾难性退化。通过后进入完整评估（数小时），进行全面的门禁检查。烟雾测试拦截率应控制在极低水平，只拦彻底崩坏的版本。


content:
  prompt: 如何设计多模态模型的 A/B 测试，以量化新模型对用户留存或满意度的影响？
answer:
  mode: rubric
  reference_answer: |-
    A/B测试是将模型更新从"技术决策"转化为"业务决策"的关键手段。它不关心基准分数提升多少，只关心用户是否更满意。

    实验设计步骤：

    - 明确假设和核心指标：如"新模型在对话质量上的提升将使用户次日留存率提高2%"。核心指标为用户侧的实际行为，而非模型侧的技术指标。

    - 分流与随机化：按用户ID哈希值将流量随机分为对照组（旧模型）和实验组（新模型），确保两组用户画像在统计上无显著差异。

    - 样本量估算：根据预期的效应量（如2%留存提升）和统计显著性要求，计算所需的最小样本量和实验天数。

    - 盲测：用户不应知道自己在哪个组，避免期望偏差。对于输出质量变化显著的模型，可做"安慰剂"对照。

    关键指标矩阵：

    [嵌入表格未展开]

    统计检验与决策：运行至少1-2个完整周（覆盖工作日和周末）。对留存率等比例指标使用卡方检验，对连续指标（如平均会话轮数）使用双样本t检验或Mann-Whitney U检验。若核心指标显著提升且无显著负面指标，全量上线；若核心指标显著下降，回滚并分析原因；若无显著差异，说明模型改进对用户体感影响不大，可考虑上线以降低推理成本。


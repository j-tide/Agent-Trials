content:
  prompt: 多模态模型的服务质量（QoS）评估：如何定义和测量可用性、吞吐、延迟百分位数？
answer:
  mode: rubric
  reference_answer: |-
    QoS是服务提供方对用户的服务承诺，是SLA的核心内容。多模态系统因其组件复杂，QoS评估需分解到每个环节。

    可用性测量：定义为服务在指定时间窗口内正常响应请求的时间比例。标准公式：可用性 = (总时间 - 不可用时间) / 总时间。探测方式通过外部健康检查探针，每10-30秒发送一个轻量级请求（简单文本+空白图片），验证全链路可达且能正确返回。预期标准如99.9%可用性（每月不可用时间不超过43分钟）。高可用架构可通过多可用区部署和自动故障转移实现。

    吞吐测量：使用压测工具逐步增加并发请求数，观察QPS（每秒成功响应的请求数）。当P95延迟开始急剧上升或出现请求失败时，该点的QPS即为系统最大吞吐量。目标吞吐量应设为最大吞吐量的70-80%，留出安全余量应对流量突发。

    延迟百分位数测量：P50延迟反映典型用户体感，P95延迟反映绝大多数用户体感，P99延迟反映最差情况。监控面板上应同时展示这三个百分位。测量时需区分流式场景（关注TTFT和TPOT）和非流式场景（关注端到端延迟）。需特别关注多模态特有的延迟瓶颈：图像编码时间、检索时间（如有）、投影层计算、LLM自回归生成时间各占端到端延迟的比例。


content:
  prompt: 如何利用用户反馈数据（如点赞、点踩、评论）来在线评估模型性能？存在哪些偏差？
answer:
  mode: rubric
  reference_answer: |-
    用户反馈是最真实的性能信号，但也充满了噪声和偏差。需要一套系统的方法来提取可靠信号。

    从反馈到结构化指标：

    点赞率、点踩率、无反馈率是基础。但更关键的是进行归因分析。当用户点踩时，主动弹出简短的归因选项（答非所问、事实错误、废话太多、态度不好、不安全内容），将定性反馈转化为可统计的结构化数据。对于评论，可批量用LLM进行情感分类和主题提取。更进一步，结合用户行为隐式信号——如果用户反复问同一个问题，或点踩后立刻重新措辞追问，说明模型确实没能满足需求。如果用户问完后直接关闭会话，大概率是不满意。

    关键偏差识别与缓解：

    [嵌入表格未展开]

    反馈驱动的持续优化闭环：将用户反馈聚合为每日简报，自动标注出高频踩点的问题类型和典型案例。这些案例经过清洗和标注后，可补充到训练数据集或回归测试集中。反馈数据不能直接用于RLHF微调，因为存在噪声和偏差，需要经过清洗、去重、平衡、人工校验后才能进入训练管道。


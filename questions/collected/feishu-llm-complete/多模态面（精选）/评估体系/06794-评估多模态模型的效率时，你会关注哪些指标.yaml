content:
  prompt: 评估多模态模型的效率时，你会关注哪些指标？
answer:
  mode: rubric
  reference_answer: |-
    效率评估是模型从实验室走向生产环境的必经关口。一个再强大的模型，如果每回答一个问题需要十秒钟，也无法在实际应用中使用。

    效率指标体系：

    [嵌入表格未展开]

    速度-质量权衡曲线：

    效率优化通常以牺牲少量质量为代价。需要绘制"延迟-准确率"曲线，找到性价比最优点。例如，通过调整视觉token数量（64 vs 256）、降低LLM的生成长度、使用更小的模型变体，可以在准确率仅损失1-2%的情况下，将延迟降低40-50%。

    评估工具：使用标准化工具（如vLLM的benchmark、TensorRT-LLM的profiler、MLPerf Inference）进行可复现的测量。测试时需模拟真实负载模式，而非理想化的单次请求。


content:
  prompt: 如果模型在某个基准上分数很高，但实际用户体验差，可能的原因是什么？如何补充评估？
answer:
  mode: rubric
  reference_answer: |-
    基准高分为"实验室全优"，用户体验差为"实战吃瘪"。两者间的鸿沟源于基准与现实之间深刻的差异。

    可能的原因分析：

    [嵌入表格未展开]

    补充评估方案：

    - 真实用户日志回放测试：从生产环境中脱敏采样一批真实用户请求（含图文输入和对话历史），用这批数据构建"影子测试集"，完全复现用户场景。

    - 用户模拟器：用另一个强模型（如GPT-4V）模拟用户行为，给定一个任务目标（如"我需要了解这张X光片的结果"），让它与待测模型进行多轮自由对话。评估模型是否能真正帮助用户达成目标。

    - 端到端业务指标：不评技术指标，直接评业务指标。如部署前后用户问题自行解决率的变化、人工客服量变化、用户NPS评分变化。

    - 蓝绿部署与A/B测试：让一部分用户使用新模型，另一部分使用旧模型，实时比较两组用户的点赞率、留存率和转化率。

    基准高分是必要条件，但永远不是充分条件。真实世界的评估永远不会被实验室完全替代。


content:
  prompt: 评估模型处理“否定”或“计数”等特定能力时，有哪些专门方法？
answer:
  mode: rubric
  reference_answer: |-
    否定和计数是多模态模型的经典短板。常规混合测试集无法充分暴露这些问题，需要设计专门的诊断性评估。

    否定能力评估：

    否定理解的难点在于，模型必须将否定词（"不是"、"没有"、"除了"）正确地与视觉特征绑定。普通VQA中否定样本比例极低，模型即使全靠猜肯定句也能得高分。

    专门方法：构建"否定-肯定"最小对比对。同一张图像，同时问肯定版本和否定版本的问题。如果模型答对了"图中有猫吗？"但对"图中是不是没有猫？"答错，则暴露否定理解缺陷。还可以系统性改变否定词的位置和数量（单否定、双否定、否定主语 vs 否定宾语），评估模型在不同句法复杂度下的表现。探针测试是另一个有效手段：构造专门诱使模型忽略否定词的问题，如"图中没有汽车的轮子是什么颜色？"测量模型回答"有没有汽车"的正确率。

    计数能力评估：

    计数困难源于模型缺乏显式的逐一清点机制，常被物体遮挡和相似外观干扰。

    专门方法：按数量范围分层测试（1-3个、4-7个、8个以上），每层独立报告准确率。通常会观察到准确率随数量增加而急剧下降。评估绝对误差和误差方向，计算"预测数量-真实数量"的平均偏差，检测模型是系统性高估还是低估。使用"相同类别多物体"和"不同类别多物体"的对比测试，前者更容易混淆。引入带有部分遮挡的计数测试，比较与无遮挡情况下的性能落差。


content:
  prompt: 如何评估多模态模型在对抗环境下的“脆弱性”？可以借鉴网络安全中的渗透测试吗？
answer:
  mode: rubric
  reference_answer: |-
    完全可以，且应当借鉴。多模态模型的"脆弱性评估"本质上就是对多模态AI系统的渗透测试。

    攻击面分析：多模态模型相比纯文本模型暴露了更大的攻击面。视觉通道的攻击包括对抗性图像扰动、OCR指令注入（在图像中嵌入微小文字）、以及隐写信息注入。文本通道的攻击包括越狱提示、角色扮演诱导、以及多轮渐进式引导。跨模态攻击则利用图文矛盾信号（如一张看似无害的猫的图片，但在特定滤镜下藏有恶意文字）来绕过安全检测。

    渗透测试执行框架：

    [嵌入表格未展开]

    脆弱性严重度评级：定义严重度等级。严重级指可稳定复现且会导致有害内容泄露或系统失控的漏洞；高危级指可被绕过安全限制但成功率不高的漏洞；中危级指影响用户体验或可能被滥用的设计缺陷；低危级指不易利用或影响有限的瑕疵。

    红队测试与渗透测试的融合：将安全红队的领域知识与AI专家的模型理解结合起来。安全人员负责攻击模式和漏洞利用，AI专家评估攻击的技术可行性。测试后输出的不是简单的"通过/不通过"，而是详细的安全评估报告，包含发现的漏洞、复现步骤、建议修复方案和修复后的回归测试。


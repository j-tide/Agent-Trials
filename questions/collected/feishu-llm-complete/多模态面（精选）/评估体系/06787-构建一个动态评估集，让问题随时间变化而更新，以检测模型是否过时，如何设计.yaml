content:
  prompt: 构建一个动态评估集，让问题随时间变化而更新，以检测模型是否过时，如何设计？
answer:
  mode: rubric
  reference_answer: |-
    动态评估集的目标是持续监控模型对“当下世界”的认知，及时发现知识过时和新出现的偏见。这需要一个自动化的数据采集和刷新机制。

    设计框架：

    - 时间敏感数据源：接入持续更新的结构化数据流——新闻API（带图片）、维基百科近期编辑、社交媒体趋势（含多模态内容）、股票行情图、天气预报图、体育赛事数据等。这些源不断产生新的图文对。

    - 自动问题生成：对于每条新数据，使用一个强大的MLLM或模板引擎自动生成问答对。例如，对于一张最新的颁奖典礼照片，可以生成“这张图片中的年度专辑获奖者是谁？”。问题必须具有时效性，答案在当前时间点是确定的，但随时间推移可能会变。

    - 时效性标签：每个问题都打上时间戳和“知识有效期”。例如，问“现任美国总统是谁？”有效期到下次就职日；问“昨天的比赛结果”有效期只有24小时。

    - 版本化存储：每次数据更新时，不覆盖旧数据，而是追加新版本。同一个问题（如“当前的流行趋势是什么？”）在不同时间点有不同版本，每个版本对应当时的标准答案。

    - 定期自动化评估：设定评估频率（如每周），用最新版本的测试集评估模型。计算指标时，必须考虑时效性权重——对时效性越强的问题，模型必须给出匹配最新版本的答案，否则视为过时。

    - 过时检测指标：定义“时效准确率”——模型在所有时间敏感问题上的得分。可以细分领域（政治、科技、娱乐）查看哪个领域的知识老化最快。同时监控模型是否开始对已过时的事件仍给出旧答案。

    挑战：自动生成的问题质量、标准答案的自动验证（需要多源交叉验证）、以及持续维护的成本。但这是评估模型“知识新鲜度”不可或缺的手段。

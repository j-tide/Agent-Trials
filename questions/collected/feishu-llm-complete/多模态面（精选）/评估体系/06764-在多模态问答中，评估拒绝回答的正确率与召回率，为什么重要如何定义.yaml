content:
  prompt: 在多模态问答中，评估“拒绝回答”的正确率与召回率，为什么重要？如何定义？
answer:
  mode: rubric
  reference_answer: |-
    拒绝回答的能力是模型“知道自己不知道”的体现，对于安全性和可信度至关重要。一个不会拒绝的模型会编造答案（幻觉），一个过度拒绝的模型会频繁说“我无法回答”而变得无用。评估拒绝回答的正确率和召回率，就是在精确衡量这种平衡。

    定义：

    我们将模型对问题的响应分为三类：应回答的问题（可回答），和不应回答的问题（不可回答）。不可回答的原因包括：图像中没有相关信息、问题超出模型知识范围、问题本身不安全等。

    - 拒绝正确率（Precision of Refusal）：在所有模型输出“无法回答”或类似拒绝表述的样本中，实际属于“不可回答”类别的比例。低正确率意味着模型在不该拒绝时也拒绝，影响了可用性。

    - 拒绝召回率（Recall of Refusal）：在所有实际“不可回答”的样本中，模型成功输出拒绝回答的比例。低召回率意味着模型对大量不可回答问题仍强行作答，产生幻觉。

    - F1分数：两者的调和平均，综合评估拒绝行为的整体质量。

    为什么重要：

    高召回但低正确的模型是“过度谨慎的懦夫”，用户体验极差。低召回但高正确的模型是“自大的骗子”，在不该回答时瞎编，带来安全和信任风险。只有两者都高的模型才能在保持诚实的同时最大化有用性。在医疗、法律等高风险领域，拒绝召回率应无限接近100%，哪怕牺牲一定的正确率。

    测试集构建：需要精心构造一个同时包含“可回答”和“不可回答”问题的平衡测试集。不可回答的问题不应是弱智问题，而应该是看起来合理但确实缺乏依据的问题，这样才能测出模型在真实场景下的判断力。


content:
  prompt: 对多模态模型进行“压力测试”：连续提问、逻辑陷阱、图片顺序变换等，属于哪类评估？
answer:
  mode: rubric
  reference_answer: |-
    这些都属于鲁棒性与对抗性评估范畴，具体可细化为动态交互鲁棒性测试。它们不像静态基准那样让模型一次性回答单个问题，而是在一个持续的交互过程中，对模型的稳定性、一致性和抗干扰能力施加动态压力。

    - 连续提问：在同一对话上下文中连续追问，考察模型是否出现状态退化——是否在多轮之后忘记最初图像内容、前后回答是否矛盾、是否会因为之前的诱导而改变对同一事实的判断。这测试的是模型的多轮一致性和状态保持能力。

    - 逻辑陷阱：设计问题中包含错误前提（“图里的猫是什么颜色？”而图中是狗）、多义表述、自我指涉矛盾等，考察模型是否盲从问题中的错误假设，还是能识别并纠正。这测试的是模型的抗误导能力和前提批判性。

    - 图片顺序变换：在多图对话中，调换图片的输入顺序，问相同的问题，看答案是否因顺序改变而不同。一个鲁棒的模型应给出与顺序无关的一致回答。这测试的是模型对序列位置的偏置。

    - 重复与干扰：在对话中插入大量无关的图片或文本，之后再回到原始问题，看模型是否还能准确回忆起最初的视觉信息。这测试的是模型在噪声和干扰下的记忆与检索能力。

    这些压力测试的目的不是求一个具体的分数，而是找到模型的“崩溃边界”——在何种压力程度和压力类型下，模型的输出开始变得不可靠。这类评估对将模型部署到不可控的开放域环境至关重要。


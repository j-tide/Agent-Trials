content:
  prompt: 评估多模态模型“溯源能力”：能否正确指出答案来源于哪张图或哪段文本？用什么指标？
answer:
  mode: rubric
  reference_answer: |-
    溯源能力评估模型是否能为自己的回答提供准确的证据支撑。给定多张图像或包含文本的图像，模型不仅要答对，还要指出是“从哪张图的哪个区域”或“从哪些文字”得出该结论的。

    评估指标：

    - 引用精确率：模型答案中给出的所有引用标注（如图片编号、区域坐标、原文引用），有多少是真正支撑该条陈述的。可以人工判断，也可以用NLI模型校验引用文本是否蕴含该陈述。

    - 引用召回率：答案中每个事实性陈述，有多少被正确引用。如果模型说了三个事实，只有一个附了准确引用，召回率就很低。

    - 引用F1：上述两者的调和平均。

    - 定位IoU：对于指向图像区域的引用（边界框），计算预测区域与真实支撑区域的交并比（IoU），设定阈值（如0.5）判定是否正确定位。

    - 证据充分性：给定引用的证据集合，是否足以推导出最终答案。这是一个整体性判断，需要模型确保引用的完整性。

    评测方法：需要构造专门的溯源测试数据。数据中明确标注每个问题的正确答案以及回答该问题所必需依赖的视觉或文本证据片段（图片ID、区域框、文本段落）。模型在输出答案的同时，必须以结构化格式输出证据引用。对于不能结构化输出的模型，可以从其生成的文本解释中提取引用信息，但噪声较大。

    溯源能力是建立可信多模态系统的关键，它把模型从“黑箱答题机”变成了“可以审计的推理者”。


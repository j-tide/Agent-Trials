content:
  prompt: 对于生成式多模态问答，如何设计基于覆盖率的指标？
answer:
  mode: rubric
  reference_answer: |-
    生成式问答的答案通常是自由形态的自然语言，没有固定的几个选项。基于覆盖率的指标衡量的是模型回答中包含的“必要信息点”的完整程度，而不是简单的词重叠。

    设计步骤：

    - 关键信息点提取：对于每个测试问题，从参考标准答案（或多个参考答案）和相关的图像区域中，提取出回答该问题“必须包含”的信息单元。例如，问“图中有什么水果？”，图像中有苹果和香蕉。关键信息点可以是{苹果，香蕉}，甚至可以细化到{苹果，颜色红色；香蕉，颜色黄色}。

    - 答案信息点提取：用同样的方法，从模型生成的回答中提取出所有信息点。

    - 覆盖率计算：计算模型提取出的信息点集合与关键信息点集合的交集大小，除以关键信息点集合的大小，得到覆盖率：覆盖率 = (匹配的信息点数 / 总关键信息点数)。

    - 加权覆盖率：如果各信息点重要程度不同（例如，回答中“苹果”的存在比“红色”的属性更重要），可对每个信息点设置权重，计算加权覆盖率。

    实现难点与自动化：

    - 关键信息点的获取成本高。可以用大模型（如GPT-4）从图像的参考描述和问题中自动提取关键信息点，并让模型判断每个信息点是否在候选答案中被覆盖。

    - 对于细粒度视觉问题，关键信息点可以结合场景图：从图像的场景图中选择与问题相关的三元组（物体-关系-物体），作为必须覆盖的信息单元。

    这种基于覆盖率的指标比BLEU等更贴近“是否把该说的都说到了”，特别适合评估全面性和详细程度，是传统n-gram指标的语义增强版。


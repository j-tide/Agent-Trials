content:
  prompt: 评估“指代表达理解”能力时，常用什么指标？
answer:
  mode: rubric
  reference_answer: |-
    指代表达理解（REC）的任务是：给定图像和一段自然语言描述（如“左边穿红色衣服的女孩”），模型需要输出一个边界框，精确框出被指代的目标。评估这个能力的核心是衡量预测框与真实框之间的重叠程度和定位精度。

    Precision@K 是最直观的指标。对于每个测试样本，模型会给出一个预测框。如果预测框与真实框的 IoU（交并比）大于 0.5，则认为这次定位是正确的。所有样本的正确率即为 Precision@1。这是 REC 任务最常用的主要指标，简洁明了。

    IoU 阈值曲线 提供了更全面的视图。它不是固定在 0.5 一个阈值，而是计算 IoU 阈值从 0.5 到 0.95（步长 0.05）变化时的准确率，然后取平均值。这能看出模型是“大概对”（高阈值下准确率骤降）还是“定位很准”（高阈值下依然保持高准确率）。这种评估方式在目标检测中也广泛使用。

    中心点距离 作为补充指标，计算预测框中心点与真实框中心点之间的归一化欧氏距离。当 IoU 因框的大小差异而敏感时（比如模型框对了位置但框太大了），中心点距离能提供更鲁棒的定位偏差评估。距离越小越好。

    文本对齐精度 是更高级的评估维度。由于 REC 数据中，一个描述可能对应多个真实框（如“左边的两个人”），或者描述存在歧义，仅靠 IoU 不够。一些评估方案会计算预测框区域的特征与文本描述之间的语义相似度，或者检查预测框内是否确实包含了描述中提到的属性和物体类别。这确保模型不是“蒙对框”，而是真正理解了语言描述。

    在实践中，REC 评估通常以 Precision@1 (IoU>0.5) 为主，辅以多阈值 IoU 曲线和失败案例的定性分析。


content:
  prompt: 在评估文生图模型时，如何兼顾美学质量与图文一致性？
answer:
  mode: rubric
  reference_answer: |-
    文生图模型的评估有两个经常互斥的目标：生成的图像要“好看”（美学质量），还要“与提示词一致”（图文一致性）。单看任一方面都会导致片面的结论。一个能兼顾两者的评估框架通常包含以下层次。

    - 自动指标的互补组合：

    - 图文一致性方面，使用 CLIPScore 或其变体。计算生成图像与输入文本提示之间的 CLIP 余弦相似度。这衡量了图像在语义上多大程度响应了文本。

    - 美学质量方面，使用专门的审美评估模型（如 LAION-Aesthetics Predictor），或 FID（用生成的大批图像计算，主要反映整体逼真程度和多样性）。

    - 将两者分开报告，并可以计算一个组合分，如 HPS (Human Preference Score)。

    - 多维度的人工评估：

    机器指标目前还不能完全替代人类判断。人工评估时，评估员应分别就“图文一致性”和“美学质量”打分，使用清晰锚定的量表。

    - 图文一致性：提示中的每个关键元素都出现了吗？元素之间关系正确吗？有没有多出或缺少的物体？

    - 美学质量：图像清晰度、光照自然度、构图、色彩和谐度、有无伪影。
    同时可以询问评估员的整体偏好，将整体分与两个子维度分的相关性进行分析，找出当前模型的主要短板。

    - 使用 GPT-4V 作为多维度裁判：

    GPT-4V 可以同时对生成的图像在多个维度上评分，包括但不限于：对象存在性、属性绑定、空间关系、文字渲染、整体质量。通过设计详细的评分表，GPT-4V 可以给出结构化的反馈。但其作为裁判也有偏误，需要与人类评估进行一致性校验。

    - 诊断性测试集：

    构建专门考察特定矛盾或美学缺陷的测试集。例如，用包含复杂空间关系和精确计数的提示词专门测一致性；用需要精细纹理和自然光影的提示测美学。在诊断集上的分项得分能精确定位模型的优劣势。

    兼顾两者的终极目标是找到美学质量和图文一致性的帕累托前沿——在不牺牲忠实度的前提下追求最高美学质量。目前的顶尖模型（如SD3、DALL-E 3）正是在这个前沿上不断推进。

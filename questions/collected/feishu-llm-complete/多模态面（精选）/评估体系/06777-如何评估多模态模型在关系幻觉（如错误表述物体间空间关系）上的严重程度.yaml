content:
  prompt: 如何评估多模态模型在“关系幻觉”（如错误表述物体间空间关系）上的严重程度？
answer:
  mode: rubric
  reference_answer: |-
    关系幻觉指模型正确识别了物体，但错误描述了它们之间的空间、逻辑或交互关系。评估这类幻觉比对象幻觉更难，因为需要结构化的关系标注。

    评估方法：

    - 基于场景图的关系探针：使用已有场景图标注的数据集（如Visual Genome），提取出所有的关系三元组（物体1-关系-物体2）。为每个三元组生成两个问题：一个是正向问题（“猫在沙发上吗？”答案应为是），一个是反向问题（“狗在沙发上吗？”答案应为否）。反向问题中的物体必须是图中存在的，但与参照物的关系不成立，以避免混入对象幻觉。计算模型在这些正向和反向问题上的准确率，反向问题的错误就是关系幻觉。

    - 空间关系专项测试集：专门设计包含多种空间介词（上下左右里外前后）的图像，物体的位置关系经过精确控制。问“X在Y的左边吗？”，通过改变物体位置，构造出是/否各半的平衡测试集。可以细化到不同难度：物体相邻易混淆、物体大小差异误导等。

    - 视觉定位与描述的交叉验证：让模型先生成图像的详细描述，然后从中抽取关系陈述，再让模型自己对每个关系陈述做定位验证（如让模型输出该关系对应的边界框）。如果模型无法为某个关系找到对应区域，说明该关系可能为其编造的。

    - 对比性评估：构造仅改变物体位置关系、其他元素保持不变的图像对。模型如果对两张图给出了同样的关系描述，说明它可能没有真正理解空间关系，而是在用高频共现组合瞎猜。

    通过这些方法，可以将关系幻觉从笼统的“胡说”中单独剥离出来，进行量化诊断。


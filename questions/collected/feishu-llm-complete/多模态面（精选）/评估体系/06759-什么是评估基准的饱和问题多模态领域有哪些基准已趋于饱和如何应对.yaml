content:
  prompt: 什么是“评估基准的饱和”问题？多模态领域有哪些基准已趋于饱和？如何应对？
answer:
  mode: rubric
  reference_answer: |-
    评估基准饱和是指随着模型能力的快速提升，已有基准的分数被不断推高并接近天花板，导致无法有效区分不同模型的真实能力差异。排行榜上前几名的模型分数差距在误差范围内，实际上无法说明谁更好。

    饱和基准的表现特征：

    - 最新模型与人类表现的差距已缩至极小，甚至超过人类基线。

    - 模型提升主要来自对基准特定偏好的过拟合，而非通用能力增长。

    - 同一模型的不同checkpoint在该基准上得分波动微小，缺乏区分度。

    多模态领域趋于饱和的基准：

    [嵌入表格未展开]

    应对策略：

    - 构建动态对抗基准：不是静态发布后一成不变，而是定期收集模型在新数据上的失败案例，淘汰过时样本，补充新的挑战样本。类似于对抗学习中的持续博弈。

    - 开发更难、更细粒度的基准：如MMMU这类大学水平多学科基准，或者提出需要更深层推理的任务。不再问"图中有什么"，而是问"为什么这个实验装置这样设计"。

    - 从分数评估转向错误分析诊断：即使分数很高，也要深入分析错误类型。比如开发专门的探测集，针对计数能力、否定理解、空间关系等单项做详细诊断。

    - 引入交互式评估：不再只是静态的数据集问答，而是让模型与人类评估员进行实时多轮对话，或完成开放式的创造性任务。这种评估没有固定答案，几乎不会饱和。

    - 标准化评估难度分级：为每个基准内的问题标注难度等级，按难度分层报告成绩。即使整体分数很高，也能看到在困难子集上的表现差异。


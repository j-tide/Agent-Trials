content:
  prompt: 如果需要在特定垂直领域（如医学影像）评估多模态模型，但缺乏公开基准，你会如何设计评测方案？
answer:
  mode: rubric
  reference_answer: |-
    缺乏公开基准时，需要从零构建一套可信、可复现、且符合领域专业标准的评测体系。以医学影像为例，方案应覆盖数据构建、任务设计、评估指标和专家验证四个层面。

    第一阶段：评测数据集构建

    从合作医院或公开匿名化数据库收集影像数据，确保覆盖常见病种和典型变异。每张影像需要两类标注：

    - 放射科医生撰写的结构化报告（作为参考文本）。

    - 针对评测任务的人工标注（如下表所示）。

    数据质量控制需要建立严格的纳入排除标准。模糊、伪影严重或诊断不明确的影像应剔除。同一影像最好由两位医生独立标注，计算Kappa系数评估一致率。标注分歧大的样本或剔除、或请第三位高年资医生裁定。

    第二阶段：任务与评估维度设计

    医学影像评测不应止步于简单的"有无病变"，需构建多层级任务体系来全面考察模型能力：

    [嵌入表格未展开]

    第三阶段：评估指标体系

    评估指标分自动化指标和专家评估两条线：

    自动化指标包括：生成报告与参考报告间的BLEU、ROUGE-L、CIDEr；专门设计的F1-score（面向关键病灶属性的结构化提取）。对于分类和检测类任务，使用AUC、敏感度、特异度。需要特别注意的是，医学场景中假阴性（漏诊）的代价远高于假阳性，因此敏感度的权重应更高。

    专家评估是必不可少的环节。邀请未参与标注的医生对模型输出进行双盲评分，采用如下量表：

    [嵌入表格未展开]

    最终综合得分 = 自动化指标×0.3 + 专家评分×0.7，确保人的判断占主导。

    第四阶段：临床模拟测试

    将模型部署在历史病例回放环境中，模拟真实工作流程。记录模型与医生的交互（如医生修改了多少模型生成的报告内容），计算"报告接受率"和"修改距离"作为实用性的终极衡量。

    整个方案需要在伦理委员会批准下进行，确保患者隐私保护和数据安全。


content:
  prompt: FID 用于评估图像生成质量，它的计算基于什么假设？有什么局限性？
answer:
  mode: rubric
  reference_answer: |-
    FID，全称是 Fréchet Inception Distance，是目前评估生成图像质量的最主流指标。它的计算过程分为两步。第一步是特征提取：将一批真实图像和一批生成图像分别送入一个预训练的 Inception v3 网络，不取最后的分类输出，而是取中间层的一个 2048 维特征向量。这个特征向量被认为是图像高级语义的紧凑表示。第二步是距离计算：假设这两批图像的特征都服从多元高斯分布，分别计算真实图像特征的均值向量和协方差矩阵，以及生成图像特征的均值向量和协方差矩阵。然后计算这两个高斯分布之间的 Fréchet 距离，即：

    [图片内容未导入]

    第一项是两个分布均值之差的平方和，反映生成图像和真实图像在整体“平均外观”上的差异；第二项是协方差矩阵的迹运算，反映两者在内部多样性上的差异。

    FID 的核心假设是：Inception v3 的中间特征空间是一个有意义的语义空间，且其中的图像特征近似服从多元高斯分布。这个假设在大量实践中被验证是可行的，因为 Inception 网络在大规模图像分类任务上训练，其中间层确实能抽取出物体的高级视觉特征，且大批量图像的特征分布大致呈现钟形曲线。

    FID 有四个显著局限：

    第一，对特征提取模型极度敏感。用不同的预训练网络（如换成 CLIP 图像编码器）得到的 FID 值没有可比性，甚至排序都可能改变。这导致不同论文报告的 FID 往往不能直接对比，除非使用完全相同的实现。

    第二，对样本数量敏感。FID 需要足够的样本量才能准确估计均值和协方差矩阵，通常建议至少数千到数万张。在少样本情况下，计算出的 FID 会有较大的统计偏差，不可靠。

    第三，它是一个宏观分布指标，无法诊断个体样本的质量。FID 低只说明生成图像的分布整体上接近真实分布，但可能掩盖局部问题。例如，一个只生成一种完美人脸但完全忽略多样性的人脸生成模型，它的 FID 可能并不高，因为这一种人脸在特征空间中形成了一个紧凑簇，与真实分布的重叠度尚可——但显然这个模型是失败的。

    第四，FID 并不直接评估图文一致性。在文生图任务中，即使生成图像非常逼真（FID 低），但如果图像内容与输入的文本提示完全不符，FID 也无法反映这一点，因为它不看文本。

    尽管有这些局限，FID 仍然是目前最受认可的生成质量指标，因为它与人类对图像质量和多样性的主观判断有较好的相关性。


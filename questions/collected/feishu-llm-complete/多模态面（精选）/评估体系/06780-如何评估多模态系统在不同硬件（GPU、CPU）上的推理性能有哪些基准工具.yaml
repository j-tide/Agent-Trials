content:
  prompt: 如何评估多模态系统在不同硬件（GPU、CPU）上的推理性能？有哪些基准工具？
answer:
  mode: rubric
  reference_answer: |-
    硬件评估的目标是找到满足性能SLA的最具性价比的硬件配置，为部署决策提供数据支撑。

    关键性能指标：吞吐量（单位时间处理请求数）、延迟（P50/P95/P99端到端时延）、首Token时间（流式场景核心指标）、显存/内存占用（决定硬件选型和成本）、功耗（数据中心成本考量）、并发稳定下的最大QPS。

    测试负载设计：不能只用单条请求串行测试，必须模拟真实负载——混合长短文本、不同分辨率的图像、冷热请求按比例混合。使用流量回放工具从生产环境录制真实请求序列，离线重放至测试硬件上。

    基准工具矩阵：


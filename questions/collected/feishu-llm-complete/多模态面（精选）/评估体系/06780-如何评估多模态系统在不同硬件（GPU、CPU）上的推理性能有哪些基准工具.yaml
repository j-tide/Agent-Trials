    评估矩阵示例：

    在T4/A10G/A100/H100等不同GPU上，分别测量1/4/8/16/32并发下的QPS和P95延迟，找到满足SLA的最低硬件配置。还需对比ONNX Runtime与PyTorch原生推理的性能差异，评估框架切换的收益。


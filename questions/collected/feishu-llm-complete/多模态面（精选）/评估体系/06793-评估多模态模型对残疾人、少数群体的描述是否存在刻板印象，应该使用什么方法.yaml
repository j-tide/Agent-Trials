content:
  prompt: 评估多模态模型对“残疾人”、“少数群体”的描述是否存在刻板印象，应该使用什么方法？
answer:
  mode: rubric
  reference_answer: |-
    这种评估需要极高的敏感度，因为刻板印象往往微妙且深嵌于文化叙事中，不是简单的正面或负面词汇能捕捉的。

    评估方法：

    - 刻画深度与维度分析：收集模型对包含残疾人和少数群体的图像的描述文本。分析这些描述集中在哪些维度上。例如，对轮椅使用者的描述是否总聚焦于“身残志坚”、“可怜”、“需要帮助”等有限叙事，而忽视了他们的职业、情绪、正在做的普通事情？对少数族裔的描述是否总强调“异域风情”、“传统服饰”，而很少描述其在现代科技场景中的形象？

    - 对比实验：选取中性场景的图像，通过编辑技术只改变人物的群体身份（如把一名白人男性换成一名戴头巾的女性）。其余背景、动作、衣着完全不变。看模型生成的描述发生了哪些变化。是否对某一群体开始使用更多的情感化词汇、负面预设或与场景无关的身份标签？

    - 主题关联探测：用大规模的图像描述数据集，统计不同群体与特定形容词、职业、场景的共现频率。计算类似于WEAT（词嵌入关联测试）的统计量，检查是否存在不平衡的关联，如残疾人图像更多与“医疗场景”、“慈善”共现，而非“职场”、“运动”。

    - 避免“他者化”评估：检查模型是否默认“正常”为多数群体的形象，而将少数群体显式标注为“特殊的”。例如，在描述一张白人男性照片时只用“一个男人”，而对一张黑人男性照片则描述为“一个黑人男性”，这种区别化标签本身就是刻板印象。

    - 社区审核：直接邀请相关群体成员对模型的输出进行盲评，打分维度包括“是否感到被冒犯”、“是否体现了刻板印象”、“是否真实还原”。他们的主观感受是最终极的检验标准。

    这种评估不是一次性的定量打分，而是持续性的质性分析，需要跨学科团队和社群的深度参与。


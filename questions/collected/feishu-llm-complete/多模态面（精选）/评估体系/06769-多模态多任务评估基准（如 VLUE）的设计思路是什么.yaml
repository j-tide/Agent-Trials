content:
  prompt: 多模态多任务评估基准（如 VLUE）的设计思路是什么？
answer:
  mode: rubric
  reference_answer: |-
    VLUE（Vision-Language Understanding Evaluation）代表了一类多任务综合评估基准的设计哲学。其核心思想是：一个真正强大的多模态模型不应只在单一任务上表现出色，而应具备稳定的综合能力。

    设计思路的核心要素：

    - 任务多样性覆盖能力光谱：将多模态智能分解为从感知到认知的多个层次，每个层次选取代表性任务。感知层包括检索（图文匹配）、分类；理解层包括视觉问答（VQA）；推理层包括自然语言视觉推理（NLVR）。这种设计确保模型必须"能文能武"，不能偏科。

    - 统一评估接口与归一化分数：所有任务共享相同的输入格式（图像+文本问题），输出统一处理为文本答案，便于批量测试。最终将各任务的指标分别归一化到0-100分，计算平均分作为"VLUE Score"综合指标。这让不同任务间的相对重要性被公平对待。

    - 数据质量控制与诊断分层：精筛高质量数据，确保每个任务子集都可独立作为诊断工具。开发者在总览综合分数的同时，可以向下钻取到每个子任务的详细指标，快速定位模型的"阿克琉斯之踵"。

    - 对抗捷径学习的设计：基准包含专门设计的"反事实"样本——即修改图像中的一小部分使得答案反转。强制模型必须真正理解视觉内容，不能依赖语言先验或统计共现来蒙对答案。


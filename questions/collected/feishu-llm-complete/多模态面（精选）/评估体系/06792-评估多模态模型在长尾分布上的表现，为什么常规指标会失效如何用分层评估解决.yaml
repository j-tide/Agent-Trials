content:
  prompt: 评估多模态模型在长尾分布上的表现，为什么常规指标会失效？如何用分层评估解决？
answer:
  mode: rubric
  reference_answer: |-
    常规指标（如平均准确率）被高频样本主导，长尾样本的糟糕表现被淹没。模型可能对常见物体（猫、狗、车）准确率95%，对罕见物体（犰狳、水獭）准确率仅10%，但平均准确率仍高达90%以上。这种"多数群体的暴政"使常规指标无法暴露长尾危机。

    分层评估方法：

    按照视觉概念的频率将测试样本分为头部（占比前50%）、腰部（中间40%）、尾部（最后10%）三层，分别独立报告准确率。三组准确率均值和最小-最大差值直接反映模型在不同频率概念上的表现均衡性。应用场景中可根据业务需要选择不同的分层维度：物种/物体类别频率、场景类型（室内常见 vs 工业特殊）、文字类型（英文常见字体 vs 手写花体）、图像质量（高清 vs 模糊暗光）。

    可操作的评估流程：

    计算分层准确率。将头部准确率减去尾部准确率的差值作为"长尾衰减指数"，该值越小说明模型越公平。在模型迭代时，必须确保衰减指数不扩大——如果新模型提升了头部准确率但降低了尾部准确率，即使平均分提高也应拒绝上线。


content:
  prompt: 怎样构建一个控制变量实验，来单独评估视觉编码器引入的偏见？
answer:
  mode: rubric
  reference_answer: |-
    视觉编码器偏见指模型在提取图像特征时，对特定群体或场景产生了不公正或不准确的表征。这需要通过巧妙的实验设计将视觉编码器从整个多模态管道中隔离出来。

    核心方法：控制图像，变化文本，固定编码器。

    - 反事实图像对：这是最直接的方法。使用图像编辑技术，生成一对图像，它们在视觉内容上除了某个敏感属性（如性别、肤色）外完全相同。例如，同一张办公桌后的照片，一张是男性，一张是女性，其他背景、服装、姿势都保持一致。将这两张图像分别通过视觉编码器，提取特征。

    - 特征相似度测试：对于上述图像对，计算它们在编码器特征空间中的余弦相似度。如果编码器是公平的，这两个特征应该非常接近，因为它们只有敏感属性不同，而高层语义相同。如果距离较大，说明编码器对敏感属性过度敏感，引入了不应有的表示差异。

    - 线性探测：在编码器输出的特征上训练简单的线性分类器，来预测敏感属性（如性别）。如果分类器能高精度预测，说明编码器特征中包含了大量与敏感属性相关的信息，存在潜在偏见。一个理想的去偏编码器应该使探测准确率接近随机基线。

    - 词嵌入关联测试：将不同群体的图像通过编码器得到特征向量，再与包含正面/负面情感的职业词（如“CEO”、“护士”）的文本嵌入计算相似度。检查是否存在群体与职业的不当关联，如女性图像特征更靠近“护士”文本嵌入，男性更靠近“CEO”。这种偏差直接来源于编码器的预训练数据。

    - 下游任务影响隔离：将编码器冻结，只替换下游的LLM或分类头，在不同群体反事实图像上测试下游任务（如描述生成）的性能差异。由于下游部分相同，性能差异可直接归因于视觉编码器。

    通过这些控制变量实验，能够精确定位偏见是在“眼睛”（视觉编码器）还是在“大脑”（LLM）层面产生的。


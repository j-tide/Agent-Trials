content:
  prompt: 如何使用 GPT-4V 作为“裁判”来评估另一个模型生成的回答？可靠性和偏误会怎样？
answer:
  mode: rubric
  reference_answer: |-
    用 GPT-4V 作为裁判（LLM-as-a-Judge）是目前最流行的高效评估方案。基本做法是将待评估的多模态对话记录（图像、问题、模型回答）提交给 GPT-4V，并附上一个精心设计的评分提示。提示中通常要求 GPT-4V 扮演“严格但公平的评估员”，对回答在多个维度上（视觉忠实度、有用性、流畅性等）给出 1-5 分的评分，并解释评分理由。为提高稳定性，往往会要求 GPT-4V 先写出详细的评判分析，再给出分数（类似思维链）。对同一答案，还可以多次调用并取平均分数，以减少单次随机性的影响。

    可靠性方面，已有大量研究证明 GPT-4V 在评估多模态回答时，其评分与人工评估员评分有中等到良好的相关性，尤其是在评估视觉忠实度和事实错误时。它比传统自动化指标（如 CIDEr）更贴近人类判断，且成本远低于纯人工评估。但它并非完美可靠，其评分与人类专家在某些细微维度（如创意性、文化敏感性）上仍有差距。

    偏误是使用 GPT-4V 作为裁判的最大风险，需要系统性识别和控制：

    - 位置偏误：当同时比较多个回答时，GPT-4V 倾向于偏好第一个或最后一个位置的回答。

    - 长度偏误：更长的回答容易得到更高的分数，即使长内容中包含冗余或无关信息。

    - 自身模型偏误：GPT-4V 可能对自己或同系列模型生成的回答存在隐性的评分偏好，对来自其他架构模型的回答更苛刻。

    - 风格偏误：GPT-4V 偏好自己训练数据中常见的、正式礼貌的回复风格，可能会低估简洁、口语化但同样正确的回答。

    - 视觉理解局限：GPT-4V 自身也有视觉幻觉和识别错误，这会导致它对其他模型输出的忠实度判断失准——它可能把一个正确的视觉陈述误判为幻觉，或漏判真正的幻觉。

    缓解偏误的方法包括：在评估提示中明确警告裁判模型避免这些偏误；随机化选项顺序以抵消位置偏误；将长度限制纳入评分标准；使用多个不同的裁判模型交叉验证；定期用人工标注样本校准裁判评分。将 GPT-4V 作为裁判是一种极其高效的质量监控手段，但不能完全替代人工抽检——最好的实践是将它作为大规模初筛和趋势监测的工具，辅以人工深度审核。


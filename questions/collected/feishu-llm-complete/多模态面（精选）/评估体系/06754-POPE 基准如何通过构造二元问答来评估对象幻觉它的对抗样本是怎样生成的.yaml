content:
  prompt: POPE 基准如何通过构造二元问答来评估对象幻觉？它的“对抗样本”是怎样生成的？
answer:
  mode: rubric
  reference_answer: |-
    POPE（Polling-based Object Probing Evaluation）是一种专门评估多模态模型“对象存在性幻觉”的基准。它的核心思想很简单：既然多模态模型经常无中生有地编造图中不存在的物体，那就直接问它“图中有XX吗？”，让它回答“是”或“否”。如果模型对不存在的东西频繁答“是”，说明它出现了幻觉。POPE将这种提问标准化、规模化，并且巧妙地构造了三种不同难度的问题集。

    评估流程：首先，用目标检测或人工标注的方式为每张图像确定一个真实物体集合（如{人, 猫, 沙发}）和一个明确不在图中的负样本物体集合。然后，向模型依次提问“图中有XX吗？”，要求它用“Yes”或“No”回答。最后，计算整体的二元分类指标——准确率、精确率、召回率、F1分数。对于正样本（图中真实存在的物体），模型应该回答“Yes”；对于负样本（图中不存在的物体），模型应该回答“No”。如果模型在负样本上频繁回答“Yes”，就暴露了其对象幻觉。

    对抗样本的生成是POPE的精髓，通过三种不同策略构造越来越有挑战性的负样本：

    - 随机负样本：从整个数据集的物体词表中随机抽取不在当前图像中的物体。这模拟了最简单的情形，大多数模型都能做好。

    - 常见负样本：从数据集中出现频率最高的物体中随机抽取。因为模型在训练中见得太多，容易产生“常见物体大概率存在”的先验偏见。比如，即使图中没有“人”或“椅子”，模型也倾向于说“有”，因为训练数据中它们无处不在。

    - 对抗负样本：这是最巧妙的一种。它利用模型的视觉-语言对齐特性，通过检索找出那些与图像整体语义相似但恰好不在图中的物体。例如，一张“汽车”的图片，其对抗负样本可能是“停车场”、“轮胎”、“红绿灯”——这些词在CLIP嵌入空间中与图像向量高度相似，但实际上在该特定图像中并不存在。模型极容易被这种语义相近的“邻居”概念迷惑，产生幻觉。

    通过这三种难度递进的问题集，POPE可以精确刻画模型的幻觉严重程度，并分析其在哪种情况下最容易被诱导。它逼着模型必须在视觉证据面前保持诚实，是评估对象幻觉的事实标准。


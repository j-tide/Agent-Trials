content:
  prompt: 多模态任务评估中，如何设计可控实验来量化“文本先验”？
answer:
  mode: rubric
  reference_answer: |-
    文本先验是指模型不依赖视觉输入，纯粹根据文本问题中的语言统计规律来作答的倾向。量化它需要将视觉信号与语言信号解耦，构造出一组“看图像”和“不看图像”的对比实验。

    核心思路：构建两个测试条件——正常条件（给图像+文本）和盲测条件（只给文本，图像换成全黑图、随机噪声或完全不相关图），比较两者准确率。两者之间的差值反映了视觉信息的真实贡献，而盲测条件下的准确率则直接度量了文本先验的强度。

    具体设计：

    - 先验强度测量：在盲测条件下运行模型，记录准确率。如果盲测准确率远高于随机猜测基线，说明模型有很强的文本先验。例如，在VQA v1上，盲测准确率能达到30%以上，而随机基线仅为几个百分点。

    - 先验敏感度：计算正常准确率与盲测准确率的比值或差值。一个健康的模型，正常准确率应显著高于盲测准确率。如果两者接近，说明模型基本不看图。

    - 反事实数据集：使用专门设计的数据集，如VQA v2的对比集或VQA-CP（Changing Priors）。VQA-CP的特殊之处在于，训练集和测试集的文本-答案分布被人为地设置为不同。一个依赖文本先验的模型会在测试集上惨败，因为它背诵的“问题词→答案”映射在测试集上不再有效。

    - 输入消融：系统性地移除图像的不同部分（遮挡物体、改变颜色、打乱空间布局），观察对答案的影响。如果模型对一个“黑猫”问题，在猫被遮挡后仍答“黑猫”，说明它依赖语言记忆而非视觉。

    - 结构化探针：构造语法正确但语义荒谬的问题，如“图中的大象是什么颜色？”，而图中根本没有任何动物。如果模型能坚持说“没有大象”而不是顺从问题给出颜色，说明视觉约束压过了文本引导。

    通过这一整套梯度式的消融和反事实实验，可以精确量化模型在多大程度上被文本先验所绑架，这是诊断捷径学习的核心方法论。


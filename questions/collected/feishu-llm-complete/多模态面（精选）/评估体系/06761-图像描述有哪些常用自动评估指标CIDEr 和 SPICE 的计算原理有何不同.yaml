content:
  prompt: 图像描述有哪些常用自动评估指标？CIDEr 和 SPICE 的计算原理有何不同？
answer:
  mode: rubric
  reference_answer: |-
    图像描述的自动评估指标经历了从简单 n-gram 匹配到语义理解的演进。最基础的几个指标包括 BLEU、METEOR 和 ROUGE-L，它们最初都是为机器翻译设计的，后来才迁移到图像描述任务上。BLEU 计算生成描述与参考描述之间 n-gram 的精确匹配率，更看重精确度；METEOR 引入了同义词匹配和词形还原，更贴近召回率；ROUGE-L 则是计算最长公共子序列，侧重于句子结构的相似性。但它们的通病是过于依赖表面词汇的重叠，对语义正确但用词不同的描述往往给出很低的分数。

    CIDEr 和 SPICE 正是为了突破这一局限而设计的，但思路截然不同。

    CIDEr 的核心是共识度量。它的出发点是：一个好的描述应该与多数人类给出的描述一致，因为它捕捉到了图像的“核心共识”。计算时，它首先对所有参考描述中的 n-gram 计算 TF-IDF 权重。出现频率高但在其他图像描述中也常见的词（比如“a”、“the”、“picture”）会被降权；而在特定图像描述中频繁出现但在别处很少见的词（比如“金色的”、“奔跑的”、“斑马线上”）会被给予更高的权重。这一步相当于找出人类描述这张图时最常用的关键表达。

    然后，CIDEr 将生成的描述也表示成 n-gram 的 TF-IDF 向量，并与多个参考描述的共识向量计算余弦相似度。最终的 CIDEr 分数是这些相似度在不同 n（n=1到4）上的加权平均。它的精妙之处在于，它不是简单地算“匹配了多少词”，而是衡量“匹配了多少关键特征”。如果生成描述用了“犬”代替“狗”，CIDEr 可能因为词形不同而失分；但如果核心名词“斑马线”、“金色”都一致，它仍然会给出不错的分数。CIDEr 目前是最主流的标准图像描述评估指标之一，尤其在 COCO Captions 任务上被广泛采用。

    SPICE 走的是另一条路：基于场景图的语义评估。它的核心思想是：描述的质量不取决于用了哪些词，而取决于它正确表达了哪些物体、属性和关系。计算时，SPICE 先用一个预训练的语义解析器，把生成描述和参考描述都转换为场景图——这是一种结构化的表示，其中节点是物体（“猫”、“沙发”），边是属性（“颜色是橘色的”）和关系（“躺在…上”）。然后，它计算生成描述的场景图与参考描述的场景图之间的 F1 分数。一个命题（如“猫趴在沙发上”）要么完全匹配，要么不匹配。

    SPICE 解决了传统指标对句子结构变化极度敏感的问题。“一只橘猫趴在沙发上”和“沙发上趴着一只橘色的猫”在 BLEU 下得分很低，但在 SPICE 下几乎满分，因为它们提取出的场景图是相同的。它也更符合人类对“理解”的定义——抓住图像中的核心语义关系。然而 SPICE 的局限在于它严重依赖语义解析器的准确性，而解析器本身可能出错；同时它忽略了语言的自然流畅性，一个语法错误但语义关系正确的句子也能得到高分。因此在实际使用中，SPICE 常与 CIDEr 互补使用，前者看语义骨架，后者看表达共识。

    一句话总结：CIDEr 衡量“你描述得是否像大多数人描述的那样”，SPICE 衡量“你描述的语义关系是否正确且完整”。


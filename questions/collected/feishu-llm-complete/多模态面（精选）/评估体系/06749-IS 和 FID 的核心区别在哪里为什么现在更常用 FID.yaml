content:
  prompt: IS 和 FID 的核心区别在哪里？为什么现在更常用 FID？
answer:
  mode: rubric
  reference_answer: |-
    IS（Inception Score）和 FID 的核心区别在于：IS 只评估生成图像自身，而 FID 评估生成图像与真实图像的分布差距。这个根本差异决定了它们在不同阶段的命运。

    IS 的计算基于两个标准：清晰度和多样性。它将每张生成图像送入 Inception 网络，得到 1000 类 ImageNet 类别的概率分布。如果一张图像能被打上高置信度的单一类别标签（比如 95% 是“金毛犬”），说明图像内容清晰可辨，清晰度高。同时，如果一批生成图像整体的类别边缘分布是均匀的（各种类别都有出现），说明生成器覆盖了多样化的内容。IS 将这两个要求融合进一个 KL 散度的公式里：对每张图，计算其类别分布与整体边缘分布的 KL 散度，然后取指数平均。IS 越高，代表图像越清晰且越多样。

    IS 的最大问题是它完全闭门造车。它不看真实图像，只看生成图像在 Inception 网络下的分类表现。这意味着：第一，如果生成模型学会了生成对抗性噪声，它可能骗过 Inception 网络得到高置信度分类，从而获得极高的 IS，但实际上图像对人眼来说毫无意义。第二，IS 严重依赖于 Inception 网络的训练数据（ImageNet 的 1000 类）。对于生成 ImageNet 之外的全新类别图像，IS 无法给出有意义的评估。第三，它对模式坍塌的检测能力很弱。如果生成器只生成 10 种不同但都非常清晰的金毛犬图像，IS 会给出很低的多样性分，但如果它学会了生成 1000 类物体的清晰但极不真实、像卡通画一样的图像，IS 可能依然很高，因为分类器仍然能识别出类别。

    FID 通过引入与真实图像的比较解决了这些问题。它不再依赖分类器的主观判断，而是直接计算生成图像和真实图像在特征空间中的分布距离。如果生成图像不真实，哪怕分类器能认出它，它的特征分布也会偏离真实图像，导致 FID 升高。模式坍塌（只生成少数几种）也会使生成分布覆盖面变窄，增大与真实分布的距离，FID 对此更敏感。因此，FID 成为更主流的指标，它更贴合“生成逼真且多样的图像”这一根本目标。IS 虽然还没有完全退出舞台，但通常只作为辅助参考，FID 是事实标准。


content:
  prompt: CLIPScore 如何评估生成描述的质量？与传统指标相比有什么优势？
answer:
  mode: rubric
  reference_answer: |-
    CLIPScore 是评估图像描述的一种全新范式，它完全不依赖人工参考描述。它的计算方式出人意料地简单：用预训练的 CLIP 模型提取生成描述的文本嵌入向量，再提取对应图像的视觉嵌入向量，然后计算两者的余弦相似度。这个余弦值就是 CLIPScore。

    它的理论基础在于 CLIP 本身的训练目标。CLIP 在 4 亿图文对上通过对比学习，学会了将匹配的图文映射到相近的嵌入位置。如果一段描述准确且全面地捕捉了图像内容，那么它的嵌入应该与图像嵌入高度相似；如果描述内容与图像无关或是错误的，相似度就会很低。它不需要人工标注的“标准答案”来比对，这直接打破了传统指标受限于参考描述数量和质量的瓶颈。

    与传统指标相比，CLIPScore 有三大优势：

    第一，它不受参考描述偏差的影响。传统指标需要人工写的参考描述，但人的描述带有主观性和文化偏差。如果参考描述里没提到“背景是蓝天”，即使生成描述提到了，传统指标也会认为这是多余的内容而扣分。CLIPScore 直接将描述与图像本身比对，能正确奖励所有与图像视觉内容一致的信息。

    第二，它能捕捉语义相似性和视觉常识。对于“一只在睡觉的猫”和“一只闭着眼睛趴着的猫”，它们在字面上完全不同，传统指标几乎得零分，但 CLIP 能理解它们描述的是同一视觉状态，给出高相似度。

    第三，它评估的维度更接近“视觉忠实度”。CLIPScore 对幻觉（描述图中不存在的物体）十分敏感。如果生成描述凭空编造了“桌子上有一本书”，而图中并没有书，该描述的嵌入就会在“书”这个语义维度上偏离图像嵌入，导致得分降低。这使得 CLIPScore 成为一种无参考的幻觉检测工具。

    但它也有固有的局限。CLIP 模型本身有其自身的知识截止日和偏见，对于它不熟悉的领域，评估的可靠性会下降。同时 CLIPScore 不直接评估语言流畅性和语法正确性——一段语法破碎但包含正确关键词的文本可能得分不低。因此它通常需要与语言流畅性指标配合使用。尽管如此，CLIPScore 的出现标志着图像描述评估从“与人类参考答案比对”迈向了“与视觉世界本身比对”的重要转折。


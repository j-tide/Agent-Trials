content:
  prompt: 长上下文扩展后，需要什么样的数据继续微调？数据长度分布如何设计？
answer:
  mode: rubric
  reference_answer: |-
    微调数据的构造是长上下文扩展成败的关键。一个好的微调数据集应该具有以下特征：

    长度分布的渐进性。不要一开始就全部使用 128K 的数据。应该设计从短到长的课程：先让模型在它已经熟悉的长度（4K-8K）上适应新的位置编码，然后逐步引入 16K、32K、64K、128K 的样本。这种渐进式训练能避免模型在初期被极长文本“吓到”，导致训练不稳定。

    长度混合比例。在训练的每个阶段，数据集中应混合不同长度的样本。一个有效的策略是让长文本和短文本各占一定比例。短文本（如 4K 以内）保证模型不丧失原有的短文本处理能力；长文本（目标长度附近）训练模型的长距离依赖能力。常见做法是让长文本占比 30%-50%，短文本占 50%-70%。如果短文本性能下降，则提高短文本比例。

    数据质量与多样性。长文本数据应覆盖文档级理解、长对话、书籍、长代码等多种类型。对于问答和摘要任务，确保问题和答案不都在文本的开头或结尾，而是分散在全文各处。这能训练模型在整个长上下文范围内检索信息。

    “大海捞针”式数据。专门构造一些需要从长文本中间位置提取信息的训练样本。例如在一篇长文档的中间某处插入一个关键事实，然后在文档末尾提问该事实，迫使模型学会关注长文本的中间部分，而非只依赖开头和结尾。

    注意避免截断。微调时不应截断长文本。如果原始数据超过目标长度，应使用滑动窗口或其他方式完整保留，否则模型永远学不到真正的长距离依赖。

content:
  prompt: RoPE（旋转位置编码）的数学原理是什么？如何通过旋转矩阵将位置信息融入 Q 和 K？
answer:
  mode: rubric
  reference_answer: |-
    RoPE 的核心思想是：通过旋转矩阵对查询和键向量进行位置相关的旋转变换，使得它们的内积天然携带着相对位置信息。

    数学原理：
    对于维度为 dd 的向量，将其两两分组，每组维度2，看作一个复数或二维向量。位置 mm 的旋转操作定义为对角块矩阵 Rm，每个 2x2 块为旋转矩阵：

    [图片内容未导入]

    实际施加时，对于查询向量 q 和键向量 k，先将其转换为多个二维子向量的形式，然后分别按位置 m 旋转：

    [图片内容未导入]

    即内积的结果仅依赖于相对位置 n−mn−m，而不依赖于各自的绝对位置 m,nm,n。RoPE 巧妙地将绝对位置嵌入到旋转操作中，却实现了相对位置编码的效果。

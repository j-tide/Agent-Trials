    并且有一个根据频率 θθ 振荡的衰减因子。对于高频维度（大 θθ），相对位置变化会引起剧烈震荡，适宜捕捉局部精细位置；低频维度变化缓慢，适合长程关系。这种特性使得 RoPE 能够以连续、平滑的方式融入相对位置信息，同时保留了通过训练学习得到的各维度重要性。

    因此，RoPE 通过复数旋转变换，优雅地将绝对位置转化为相对位置表示，在数学上非常自然。

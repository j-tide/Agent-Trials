content:
  prompt: 为什么位置编码向量的 L2 范数随着维度增加而增大？这会导致什么问题？
answer:
  mode: rubric
  reference_answer: |-
    正弦位置编码向量在第 i 维的幅度基本恒定（正弦/余弦值域 [-1,1]），但向量的元素数量为 d_model。随着维度增加，L2 范数自然增大，因为它是所有元素的平方和的平方根。对于正弦编码，范数大致为 dmodel/2dmodel/2。

    这可能导致的问题是：位置编码的范数远大于词嵌入的范数（后者通常初始化为较小的随机值，如 Xavier 初始化后范数约 1）。当二者相加时，位置编码可能主导输入表示，削弱语义信息。为缓解这个问题，实践中可以：

    - 缩放位置编码（例如乘以一个小于 1 的因子）。

    - 对词嵌入和位置编码分别进行适当的缩放（如在 Pre-LN Transformer 中，嵌入后通常立即接 LayerNorm，可以平衡二者）。

    - 使用层归一化来混合。

    现代 Transformer 的 Pre-Norm 结构会在第一层自注意力之前进行 LayerNorm，可以有效减轻这种幅度差异。

content:
  prompt: 在 Transformer 中，位置编码的数值范围通常多大？与词嵌入的数值范围是否匹配？不匹配会有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    正弦位置编码的输出值范围是 [-1, 1]。词嵌入通常是随机初始化（如正态分布 N(0, 0.02)），数值范围也大致在 -0.1 到 0.1 之间。这样，位置编码的幅度可能显著大于词嵌入，导致输入中位置信息压倒语义信息。不过，标准 Transformer 会在嵌入之后通过 LayerNorm（在 Pre-Norm 架构中，输入会先经过 LayerNorm，实际上嵌入和位置编码相加后，会通过残差连接前的归一化吗？在 Pre-Norm 中，第一层自注意力的输入是先 LayerNorm 再进入注意力，所以相加后的混合向量会先被归一化，从而平衡尺度。在原始 Post-Norm 中，嵌入相加后直接进入注意力层，但权重初始化已将嵌入缩小，并通过后归一化调整。

    现代做法：在使用 Pre-Norm 时，嵌入和位置编码相加后立即进入 LayerNorm，因此幅度差异被归一化缓解。但如果没有归一化或初始化不当，幅度不匹配可能导致训练初期不稳定，模型需要更多时间调整词嵌入的尺度来匹配位置编码。实验中常将位置编码乘以一个小的常数（如 0.01）来匹配嵌入。

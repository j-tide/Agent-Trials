content:
  prompt: 绝对位置编码的维度如果小于词嵌入维度，多余维度填零，这会损害性能吗？
answer:
  mode: rubric
  reference_answer: |-
    会损害性能。因为位置信息只存在于部分维度，其余维度语义信息独占。这会造成：

    - 维度使用不均衡，注意力计算时不同维度的重要性不匹配，可能限制了模型容量。

    - 填零的维度浪费了表示空间，且零值会与词嵌入中的非零信号混杂，可能干扰注意力权重的计算。

    - 实验证明，这种做法会导致性能下降。通常应该使位置编码维度等于词嵌入维度，或者通过线性变换将低维位置编码投影到高维。

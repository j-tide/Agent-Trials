content:
  prompt: 请描述 Transformer-XL 中相对位置编码的设计，它如何在注意力分数中融入相对位置？
answer:
  mode: rubric
  reference_answer: |-
    Transformer-XL 提出了一种基于相对位置的注意力机制，旨在解决长文本建模和片段间上下文复用问题。其注意力分数计算公式为：

    [图片内容未导入]

    设计巧妙之处：

    - 分离内容和位置：将注意力分数分解为四项，分别代表内容之间的交互、内容与相对位置的交互、以及两个全局偏置。这使得模型明确知道每个 token 对之间的位置关系，而不依赖于绝对位置。

    - 用正弦编码表示相对位置：直接复用正弦位置编码函数，输入变为相对距离 i−j，网络可以学习到相对距离与相关性之间的关系。

    - 循环机制结合：配合片段级别的循环（缓存前一片段的隐藏状态），相对位置编码使得跨片段 token 的注意力也能有效计算。

    Transformer-XL 的这种相对位置编码设计，是后续许多相对位置编码（包括 T5、ALiBi 的前身思路）的重要基础。

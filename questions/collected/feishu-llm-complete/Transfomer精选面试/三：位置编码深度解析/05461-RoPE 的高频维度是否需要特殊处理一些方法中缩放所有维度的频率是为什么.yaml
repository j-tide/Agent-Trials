content:
  prompt: RoPE 的高频维度是否需要特殊处理？一些方法中缩放所有维度的频率是为什么？
answer:
  mode: rubric
  reference_answer: |-
    高频维度确实需要特殊保护。RoPE 的高频维度（低索引组）是局部位置感知的核心。它们对位置变化极度敏感，负责区分相邻 token 的细微顺序。如果对这些维度进行大幅缩放，会模糊局部位置信息，直接损害模型对词序和基础语法的理解能力。

    NTK-Aware 的核心创新就在于不对所有频率一视同仁，而是让高频几乎不受影响，让低频承担主要的缩放负担。YaRN 进一步发现，即使在 NTK-Aware 缩放后，最高频的一些维度仍可能需要额外的微调因子来精确保留原有行为。

    为什么有些方法仍然缩放所有维度？主要是为了实现的简单性。PI 就是最简单粗暴的做法，一个缩放因子应用到所有维度，代码一行就能完成。在某些场景下（如扩展倍数不大，或可以在大量数据上充分微调），这种简单做法可能就足够了，性能损失在可接受范围内。但对于大倍数扩展或对性能要求苛刻的场景，非均匀缩放是必须的。

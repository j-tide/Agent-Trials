content:
  prompt: 相对位置编码是否能完全替代绝对位置编码？实践中通常如何结合？
answer:
  mode: rubric
  reference_answer: |-
    在一些架构中，相对位置编码完全取代了绝对位置编码（如 Transformer-XL、T5、ALiBi、RoPE 的典型用法）。但绝对位置在某些任务中仍有帮助，如需要知道句子起始、终结符位置等。因此，实践中可以有多种结合方式：

    - 同时使用：在输入嵌入中保留可学习的绝对位置嵌入，同时在注意力中使用相对位置偏置。这提供了最丰富的位置信息，但增加了参数。

    - 仅保留必要绝对位置：只对特殊标记（如 [CLS], [SEP]）使用绝对位置，其余使用相对位置。

    - RoPE 的变体：RoPE 本身虽然基于旋转，但可以通过不旋转某些维度或使用可学习的绝对位置偏置来兼得。

    现代大模型趋势是仅使用相对位置编码（尤其是 RoPE），因为其极佳的长度外推和灵活性，绝对位置编码已非必需。

content:
  prompt: 相对位置编码的核心思想是什么？与绝对位置编码的本质区别在哪？
answer:
  mode: rubric
  reference_answer: |-
    核心思想：相对位置编码不再告诉模型每个 token 的绝对位置（第1个、第2个...），而是告诉模型任意两个 token 之间的相对距离。在自注意力计算中，模型只需知道“我与你相距多远”，而无需知道“我在第几排”。这使得注意力权重的计算不再依赖全局位置索引，而是依赖于 token 之间的相对偏移。其本质是将位置信息融入注意力分数的计算中，而非输入表示中。

    本质区别：

    - 绝对位置编码：为每个绝对位置分配一个唯一的向量，加在输入嵌入上。模型在每一层都要从这些被污染过的向量中分离出位置和语义。它能区分绝对位置，但难以泛化到训练时未见过的长度。

    - 相对位置编码：不在输入中注入位置信息，而是在每一层的注意力分数矩阵中，根据两个 token 的相对距离添加偏置项或直接调整注意力计算方式。它天然捕捉相对关系，并具有更好的长度外推能力，因为相对距离的范围可定义、可泛化。


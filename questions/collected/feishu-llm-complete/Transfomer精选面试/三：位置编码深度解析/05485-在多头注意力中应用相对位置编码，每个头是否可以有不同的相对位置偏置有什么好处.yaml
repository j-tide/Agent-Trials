content:
  prompt: 在多头注意力中应用相对位置编码，每个头是否可以有不同的相对位置偏置？有什么好处？
answer:
  mode: rubric
  reference_answer: 可以。在 ALiBi 中，不同头就有不同的斜率。在 RoPE 中，虽然旋转频率统一，但每个头的 Q、K 投影矩阵不同，使得同一相对距离在不同头中可能产生不同的内积效果，隐式实现了头特异的位置模式。显式地为每个头设置不同的相对位置偏置（可学习或静态）能让不同头关注不同距离范围的依赖。例如，某些头专注于极近距离（局部语法），某些头关注中等距离（短语结构），某些头捕捉远距离（篇章主题）。这种分工提升了模型的整体表示能力。

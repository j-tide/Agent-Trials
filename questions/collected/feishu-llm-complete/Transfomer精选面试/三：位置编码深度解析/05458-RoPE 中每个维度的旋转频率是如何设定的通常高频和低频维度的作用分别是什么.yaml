content:
  prompt: RoPE 中每个维度的旋转频率是如何设定的？通常高频和低频维度的作用分别是什么？
answer:
  mode: rubric
  reference_answer: |-
    频率设定与原始正弦位置编码相同：对于维度索引 ii（从 0 到 d/2−1d/2−1），旋转频率为 θi=10000−2i/dθi=10000−2i/d。因此，低索引组（前几个二维子空间）频率高，高索引组频率低。

    - 高频组（小 i）：旋转角度变化快，对位置变化极其敏感，两个位置的向量内积随距离剧烈振荡。它们负责编码局部精确位置，有助于模型关注相邻 token 的精细关系，例如词法、短语搭配。

    - 低频组（大 i）：旋转角度变化极慢，在较长距离上向量内积保持稳定。它们负责编码长程位置趋势，对于篇章级连贯性、远距离指代消解很重要。

    这种多频率设计形成了一个类似“位置尺度的谱”，允许模型根据自己的需要学习利用不同频率的位置信息。

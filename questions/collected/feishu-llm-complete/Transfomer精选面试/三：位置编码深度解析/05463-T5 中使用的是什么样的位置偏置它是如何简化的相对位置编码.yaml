content:
  prompt: T5 中使用的是什么样的位置偏置？它是如何简化的相对位置编码？
answer:
  mode: rubric
  reference_answer: T5 使用简化的相对位置偏置。它不是为每个距离对学习一个偏置，而是将相对距离分桶（bucketing），将距离值映射到有限的几个桶中，每个桶对应一个可学习的标量偏置。计算注意力时，根据
    query 和 key 的相对距离查表得到标量，加到注意力 logits 上。具体地，相对距离 ∣i−j∣∣i−j∣ 通过一个对数分桶函数分配桶索引。这使得偏置参数量仅与桶数有关（如
    32），极大减少了参数量，同时保留了捕捉不同距离范围重要性的能力。它相比 Transformer-XL 的位置编码更轻量。

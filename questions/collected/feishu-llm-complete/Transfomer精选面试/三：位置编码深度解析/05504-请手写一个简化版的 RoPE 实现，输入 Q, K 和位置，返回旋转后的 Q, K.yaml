content:
  prompt: 请手写一个简化版的 RoPE 实现，输入 Q, K 和位置，返回旋转后的 Q, K。
answer:
  mode: rubric
  reference_answer: |-
    假设 PyTorch 实现，Q 和 K 形状为 [batch, seq_len, num_heads, head_dim]，位置 pos 形状 [seq_len]：

    ```python
    import torch

    def rotate_half(x):
        """将最后维度的后半部分取负并与前半部分拼接，实现复数乘法中的虚部操作"""
        x1 = x[..., : x.shape[-1] // 2]
        x2 = x[..., x.shape[-1] // 2 :]
        return torch.cat((-x2, x1), dim=-1)

    def apply_rotary_pos_emb(q, k, pos, dim=128):
        """
        q, k: [batch, seq_len, heads, dim]
        pos: [seq_len]
        """
        # 生成频率
        freqs = 1.0 / (10000 ** (torch.arange(0, dim, 2).float() / dim))  # [dim/2]
        freqs = pos.unsqueeze(-1) * freqs.unsqueeze(0)  # [seq_len, dim/2]
        emb = torch.cat((freqs, freqs), dim=-1)  # [seq_len, dim]
        cos_cached = emb.cos().unsqueeze(0).unsqueeze(2)  # [1, seq_len, 1, dim]
        sin_cached = emb.sin().unsqueeze(0).unsqueeze(2)

        q_out = (q * cos_cached) + (rotate_half(q) * sin_cached)
        k_out = (k * cos_cached) + (rotate_half(k) * sin_cached)
        return q_out, k_out
    ```

    这段代码实现了将频率嵌入与查询/键向量按元素相乘后与旋转后的另一半相加，本质上完成了复数乘法。

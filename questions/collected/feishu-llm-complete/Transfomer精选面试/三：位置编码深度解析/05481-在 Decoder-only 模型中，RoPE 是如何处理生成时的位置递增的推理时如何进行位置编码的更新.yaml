content:
  prompt: 在 Decoder-only 模型中，RoPE 是如何处理生成时的位置递增的？推理时如何进行位置编码的更新？
answer:
  mode: rubric
  reference_answer: |-
    在自回归解码时，每次生成一个新 token，序列长度 +1。RoPE 需要为每个 token 应用对应的绝对位置旋转。推理时的 KV 缓存处理：

    - 当生成第一个 token（位置 0）时，将其 Q、K 用位置 0 的旋转矩阵旋转，然后缓存 K、V。

    - 当生成位置 t 的新 token 时，用当前 token 的 Q 用位置 t 旋转，同时用当前位置 t 旋转新 token 的 K。然后将这个新 K、V 追加到 KV 缓存中。

    - 由于缓存中的历史 K 保留了各自生成时的绝对位置旋转信息，它们与新 Q 的内积会自动实现相对位置效应，无需任何修改。因此，推理时只需正常执行旋转并追加缓存，无需额外更新历史缓存。

    这样，RoPE 完美适配增量解码。

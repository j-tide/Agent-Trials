content:
  prompt: 评估长上下文性能时，除了困惑度，通常还使用哪些任务？如“大海捞针”。
answer:
  mode: rubric
  reference_answer: |-
    困惑度是一个基础指标，但它只能反映模型对整体语言分布的建模能力，无法精确衡量模型在长文本中检索特定信息的能力。需要多维度的评估。

    “大海捞针”测试。这是目前最流行的长上下文评测方法。将一句与上下文无关的短句（“针”）随机插入一篇长文档（“海”）的某个位置，然后在文档末尾提问这个短句的内容。测试模型能否准确找到并回忆出这个信息。通过变化“针”的插入位置（开头、中间、结尾）和文档的长度，可以精细地绘制出模型在不同位置、不同长度下的检索能力热力图。理想的模型应该在所有位置和长度上都能找到“针”。

    长文档问答。使用需要跨段落或跨章节推理的数据集，如 LongBench、∞Bench 等。这些数据集包含了多跳推理、摘要、信息抽取等任务，能全面评估模型在长文本上的理解和推理能力。

    键值检索。给模型大量的键值对（如数百个），然后询问某个键对应的值。测试模型在长序列中精确记忆和检索的能力。

    多轮长对话。构建数十轮甚至数百轮的对话历史，测试模型在长时间对话中保持话题一致性、记忆早期用户需求的能力。

    代码长上下文。给模型一个大型代码仓库的多个文件，测试其跨文件理解代码结构和定位 bug 的能力。

    这些任务从不同角度测试了模型的长上下文能力：精确检索、长程推理、记忆持久性和抗干扰能力。

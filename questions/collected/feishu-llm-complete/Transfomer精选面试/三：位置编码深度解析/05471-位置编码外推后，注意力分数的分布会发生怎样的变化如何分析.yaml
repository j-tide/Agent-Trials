content:
  prompt: 位置编码外推后，注意力分数的分布会发生怎样的变化？如何分析？
answer:
  mode: rubric
  reference_answer: |-
    位置编码外推后，注意力分布的变化是理解和优化外推效果的关键。可以通过以下方式进行分析：

    注意力熵的变化。计算每一层、每个头在 softmax 后的注意力分布的熵。外推后，熵通常会增大，意味着注意力更加均匀分散。可以绘制熵随序列长度的变化曲线，观察在哪个长度范围熵开始显著偏离训练时的基准。

    注意力距离分布。统计注意力权重随 token 间相对距离的分布。在原始模型中，可能有明显的局部峰值（多数注意力集中在近距离 token）。外推后，这个峰值可能变平、变宽，说明局部性减弱。可以绘制“平均注意力权重 vs 相对距离”的曲线。

    注意力聚焦度。定义每个查询位置的最大注意力权重（top-1 权重）或前 K 个权重的累计和。外推后，这些指标通常下降，表明注意力被稀释。

    位置编码内积矩阵。直接分析未经 softmax 的注意力分数矩阵 QKT。对于 RoPE，可以单独分析位置编码的贡献部分。观察在不同相对距离下，内积值的变化趋势是否合理。如果位置编码贡献的内积曲线在外推区域出现异常波动（如不单调、振荡加剧），说明位置编码失效。

    可视化诊断。选择典型的长文本样本，可视化不同层的注意力矩阵。观察注意力模式是否仍然呈现结构化（如对角线附近的局部注意力），还是退化为随机噪声。

    这些分析工具可以帮助判断外推是否成功，以及问题出在哪一层、哪个频率范围，从而指导进一步的参数调整。

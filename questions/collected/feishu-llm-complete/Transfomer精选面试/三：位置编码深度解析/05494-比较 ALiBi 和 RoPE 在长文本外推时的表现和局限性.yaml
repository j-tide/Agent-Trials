content:
  prompt: 比较 ALiBi 和 RoPE 在长文本外推时的表现和局限性。
answer:
  mode: rubric
  reference_answer: |-
    ALiBi：

    - 外推能力强，因为线性偏置与绝对位置无关，长度增加时只要相对距离仍在偏置的作用范围内（偏置随距离线性增长），模型可以自然适应。但线性偏置严格强调局部，可能导致在需要长程依赖时注意力无法有效聚焦远距离 token，即“近视”。

    - 局限性：单一的线性衰减难以建模复杂的非单调位置关系；没有可学习的参数来根据任务调整位置偏好。

    RoPE：

    - 通过调整基频（如增大 10000→500000），可以拉伸频率尺度，使低频维度在更长距离下仍保持单调变化，从而支持长度外推。RoPE 的多频率特性能同时保留局部和全局位置信息。

    - 局限性：直接外推到极长（如 32k→128k）时，如果不微调，仍可能因训练时未见过的旋转模式而出现性能下降。虽然可通过修改基频缓解，但极端情况下需要少量长文本微调。

    总结：ALiBi 实现极简，但灵活性受限；RoPE 更强大、灵活，成为主流。

content:
  prompt: 在处理音频或时间序列时，是否可以直接复用 NLP 中的位置编码？有什么特殊考虑？
answer:
  mode: rubric
  reference_answer: |-
    可以复用，但需要特殊考虑：

    - 采样率差异：音频时间序列的“位置”对应时间步，其密度远高于文本。位置编码需要适应非常长的序列（如几万点）。NLP 中的绝对位置编码在长度极长时失效，需要外推能力强的编码（如 RoPE、ALiBi）。

    - 周期性特征：音频信号具有固有的周期性，位置编码可能干扰这种周期。可以使用可学习的位置编码来适应周期，或使用基于时间戳的编码。

    - 多层次位置：音频可能有多尺度位置（帧级、样本级）。可以设计多尺度位置编码。

    - 连续值位置：不像文本是离散位置，音频时间可以视为连续值。可以用连续函数（如通过 MLP 对时间 t 输出嵌入）来代替离散位置嵌入。

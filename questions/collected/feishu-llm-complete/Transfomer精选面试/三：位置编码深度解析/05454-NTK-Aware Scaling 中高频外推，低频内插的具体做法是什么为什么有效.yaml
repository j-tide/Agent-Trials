    为什么有效：

    这种策略抓住了 RoPE 不同频率分量的本质功能。高频分量变化快，在一个很短的窗口内就能完成一个周期的变化，它们天然对外推具有鲁棒性。一个高频正弦波在训练时已经经历了多个完整周期，模型学会了它的完整模式，即使位置超出训练范围，这种模式依然适用。因此高频分量可以直接外推。

    低频分量则不同。在训练长度内，低频分量可能只经历了不到一个完整周期，模型从未见过它的完整变化模式。如果直接外推，位置编码的数值会进入模型从未见过的区域。因此需要对低频分量进行内插，将其变化范围压缩到模型见过的区间内。

    这种差异化处理使得模型在扩展上下文时，既能保留对局部词序的精确感知，又能适应更长的全局距离。

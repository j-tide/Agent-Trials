content:
  prompt: 可学习位置编码的最大序列长度是固定的，如果要处理超过该长度的文本，有哪些简单处理方式？
answer:
  mode: rubric
  reference_answer: |-
    - 插值（Interpolation）：将超出最大长度的位置线性或非线性缩放到训练过的位置范围内。例如，对于位置 p > L，使用 p * (L / max_len) 的位置编码。更常用的是在每一层的位置编码上做插值。这种方法简单，但可能导致高频信息丢失，影响局部感知。

    - 外推（Extrapolation）：直接使用位置 p，但位置嵌入是随机初始化的。由于这些位置未参与训练，模型可能难以利用。可以配合微调，用少量长序列数据微调新位置嵌入。

    - 分块处理（Chunking）：将长序列切分为多个重叠或不重叠的片段，每个片段独立编码后，在片段之间引入特殊的片段位置嵌入（如相对位置）或通过循环机制连接。例如 Transformer-XL 使用片段级别的循环，将前一个片段的隐藏状态缓存并用于当前片段，配合相对位置编码。

    - 相对位置编码代替绝对位置：使用相对位置编码（如 Shaw et al., 2018; T5; RoPE）可以从根本上解决长度限制问题，因为相对位置只关心距离，不依赖于绝对位置索引，理论上可以处理任意长度。这是当前主流方法。

    - 层次化位置编码：为文档结构设计位置（如句子级位置+词级位置），以降低绝对位置索引的增长。

    - 连续位置编码（Continuous Positional Encoding）：使用可学习的连续函数（如 MLP）将位置映射为嵌入，理论上可以输入任意实数值位置。推理时泛化到新位置，但需要训练时模拟长度变化。

content:
  prompt: 解释一下“注意力窗口”的概念，以及它如何帮助模型处理超长序列。
answer:
  mode: rubric
  reference_answer: |-
    注意力窗口是指限制每个 token 在计算自注意力时只关注其周围一定范围内的 token，而不是整个序列的所有 token。这个范围就是“窗口”。

    在标准全注意力中，序列长度为 L 时，每个 token 需要与所有 L个 token 计算注意力，复杂度为 O(L2)。当 L 极大时，计算和内存都无法承受。

    注意力窗口将每个 token 的关注范围限制在一个大小为 W 的固定窗口内（通常 W 远小于 L），复杂度降为 O(L⋅W)。窗口可以是单向的（只关注前面的 token，适用于自回归模型）或双向的（关注前后各 W/2个 token，适用于编码器）。

    为什么窗口注意力能处理超长序列：

    效率。计算量和显存占用与序列长度呈线性关系而非平方关系，使得处理百万级别 token 成为可能。

    局部性归纳偏置。自然语言具有很强的局部性——相邻的 token 之间关联最紧密。注意力窗口强制模型优先学习这种局部依赖，符合语言的统计特性，因此即使视野受限，模型在大多数任务上仍能表现良好。

    层次化组合。虽然单层窗口注意力只能捕捉局部信息，但多层堆叠后，高层可以间接获得更大的感受野。第 1 层看到窗口内的 token，第 2 层看到的 token 已经包含了其邻居的信息，依此类推，感受野随层数线性增长。

    与全局注意力的结合。纯窗口注意力可能丢失关键的长距离信息。实际中，通常会在某些层保留全局注意力，或引入特殊的全局 token（如 [CLS]）可以与所有 token 交互，作为信息传递的桥梁。

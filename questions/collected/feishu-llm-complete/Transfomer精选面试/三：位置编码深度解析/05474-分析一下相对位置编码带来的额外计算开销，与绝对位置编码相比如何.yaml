content:
  prompt: 分析一下相对位置编码带来的额外计算开销，与绝对位置编码相比如何？
answer:
  mode: rubric
  reference_answer: |-
    - 绝对位置编码：开销极小，仅需将向量加在输入嵌入上，一次即可，后续每一层无需额外计算。

    - 相对位置编码：每一层注意力计算时都需要引入位置偏置或调整 Q、K，带来额外计算：

    - RoPE：需对 Q、K 进行逐元素旋转，复杂度 O(L⋅d)，相比注意力 O(L2d)可忽略。

    - 可学习偏置：T5 式查表偏置，每对 token 需要一次查表，也轻量。

    - Transformer-XL 式：需要额外的矩阵乘法和偏置项，开销较大但仍可控。
    总体而言，相对位置编码的额外计算开销非常小，现代模型（LLaMA等）的大量实验已证明其性价比极高，是绝对位置编码的优秀替代。

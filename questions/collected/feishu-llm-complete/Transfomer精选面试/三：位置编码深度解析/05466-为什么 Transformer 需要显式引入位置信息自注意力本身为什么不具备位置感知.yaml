content:
  prompt: 为什么 Transformer 需要显式引入位置信息？自注意力本身为什么不具备位置感知？
answer:
  mode: rubric
  reference_answer: |-
    自注意力的置换等变性

    自注意力机制的核心运算可以概括为：

    [图片内容未导入]

    置换等变性对于某些任务（例如聚合全局信息）是友好的，但对于序列建模来说是不够的。语言是时序的，后续的 token 往往依赖于前面的 token，而位置信息正是建立这种依赖关系的基础。比如在翻译任务中，“I am” 和 “am I” 的区别必须被模型捕捉到。

    为什么需要显式引入

    正因为自注意力自身对位置“无感”，我们必须通过额外的方式把位置信息告诉模型。目前主流的方法有三种：

    - 绝对位置编码（Absolute Positional Encoding）：在输入嵌入中直接加入一个表示位置的向量，比如原始 Transformer 使用的正弦/余弦位置编码，或者可学习的位置嵌入（learned positional embedding）。

    - 相对位置编码（Relative Positional Encoding）：在计算注意力分数时，直接考虑两个 token 之间的相对距离，例如 Transformer-XL、T5、ALiBi 等采用的方式。

    - 旋转位置编码（RoPE）：通过对查询和键向量施加旋转矩阵，将相对位置信息融入注意力计算中，目前大模型（如 LLaMA、GPT-NeoX）广泛采用。

    无论哪种方法，本质都是在原本不包含位置信息的计算图中，注入一个与位置相关的项，从而使模型能够区分不同位置的相同词，并利用词序进行推理。


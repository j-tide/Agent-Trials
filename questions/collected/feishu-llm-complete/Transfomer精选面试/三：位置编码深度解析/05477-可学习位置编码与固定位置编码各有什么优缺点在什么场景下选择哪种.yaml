content:
  prompt: 可学习位置编码与固定位置编码各有什么优缺点？在什么场景下选择哪种？
answer:
  mode: rubric
  reference_answer: |-
    可学习位置编码（Learned Positional Embedding）：

    - 优点：灵活，允许模型为每个位置学习最适合任务的位置表示。它不依赖人工设计的函数，能够通过训练自动适应数据中的位置模式。对于大多数任务，它通常能带来微小的性能提升，因为它可以编码任意位置相关的先验。

    - 缺点：位置数量固定（最大序列长度），无法外推到更长的序列。如果测试序列超出训练时的最大长度，就会遇到未见过位置嵌入，导致性能下降或需要特殊处理。另外，可学习位置嵌入容易过拟合，尤其当训练数据有限时，低频位置嵌入可能训练不充分。

    - 适用场景：当序列长度相对固定或可以截断/填充到固定长度时，可学习位置嵌入简单有效。BERT 及许多早期模型使用它。

    固定位置编码（Sinusoidal Positional Encoding）：

    - 优点：无需训练参数，可以处理任意长度序列（因为函数可以无限外推，尽管外推效果会衰减）。由于它是确定性函数，不会引入额外的过拟合风险。它蕴含相对位置信息，有助于模型捕捉相对位置。

    - 缺点：因为是固定的，无法根据任务进行调整。对于某些需要不同位置权重的任务，固定编码可能不是最优。而且，在实际超长序列外推时，由于训练中模型只见过一定长度内的正弦模式，外推后的性能仍然会下降。

    - 适用场景：需要处理可变长度或较长序列的任务，尤其是期望模型具有一定长度外推能力时。原始 Transformer 和许多现代大模型（如 LLaMA 使用 RoPE，一种相对编码变体，但固定编码也被某些模型使用）倾向于固定编码或基于它的变体。

    选择哪种通常取决于任务特性、数据和工程便利性。当前趋势是使用相对位置编码（如 RoPE），它结合了两者的一些优点。

content:
  prompt: PI 方法有什么缺点？为什么它可能导致局部位置分辨能力下降？
answer:
  mode: rubric
  reference_answer: |-
    PI 的线性缩放是一把双刃剑。它在解决外推问题的同时，也引入了新的问题。

    [图片内容未导入]

    注意力模糊。位置编码的退化直接导致注意力权重变得平滑。局部注意力头无法将注意力精准聚焦到邻近的几个 token 上，而是分散到更宽的窗口中。这会损害模型对词序和局部语法结构的建模能力。

    需要微调来弥补。PI 通常不是即插即用的。直接应用缩放后的模型，性能会有明显下降，需要在少量长文本数据上进行微调，让模型重新适应新的位置编码尺度。在微调过程中，模型需要调整注意力权重和其他参数来补偿分辨率的损失。

    对极端长度效果有限。当目标长度是训练长度的数十倍甚至上百倍时，缩放因子变得极小，局部位置完全丧失区分度，PI 方法基本失效。

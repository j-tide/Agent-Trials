content:
  prompt: 如何对 ALiBi 进行长度外推？它的偏置斜率需要调整吗？
answer:
  mode: rubric
  reference_answer: |-
    ALiBi 天然具有长度外推能力，因为它施加的线性偏置只依赖于相对距离，与绝对位置完全无关。当序列从训练长度 2048 扩展到推理长度 8192 时，相对距离 ∣i−j∣ 的计算没有任何变化，偏置项的值也不受影响。

    [图片内容未导入]

    然而，当序列极长（如 100K）时，可能会出现一个问题：对于非常远的 token 对，负偏置变得极大（如 -m * 50000），在 softmax 之前就被压到了非常小的值，注意力权重几乎为零。这本身不是问题，因为模型本来就不应该关注那么远的 token。但如果某些任务需要极长距离的依赖，固定斜率的 ALiBi 可能会过于“近视”。

    如果确实需要在超长序列上调整 ALiBi，可以减小斜率，让注意力窗口变宽。但这需要根据具体任务进行调试。通常来说，ALiBi 的原始斜率设计已经足够鲁棒，在大部分外推场景下无需修改。

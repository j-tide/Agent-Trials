    特点：

    - 无额外参数：不需要学习位置嵌入，不需要修改网络结构，只是在注意力矩阵上加一个静态的、基于距离的惩罚。

    - 线性偏置：距离越远，惩罚越大（分数减去越多），导致注意力倾向于关注邻近 token。

    - 高效：计算简单，内存占用几乎为零。

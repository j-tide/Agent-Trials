content:
  prompt: 分析正弦位置编码的波长范围：小维度对应高频还是低频？这有利于捕捉什么范围的位置？
answer:
  mode: rubric
  reference_answer: |-
    在正弦位置编码中，维度索引 i 越小，对应的频率越高（波长越短）。具体地，第 0 对维度（i=0）频率最高，波长最短（2π2π）；随着 i 增大，频率逐渐降低，波长变长。

    - 高频（小维度）：变化快，对位置变化敏感，适合捕捉局部位置信息（如相邻词的关系、短语结构）。短波长让相邻位置的编码有显著差异，有助于模型区分近距离 token。

    - 低频（大维度）：变化慢，对位置变化不敏感，适合捕捉全局位置信息（如段落起始、长距离相对位置）。低频分量在较大范围内值相近，让模型感知远距离的粗略位置。

    这种多尺度设计使模型能同时关注局部和长程依赖。

content:
  prompt: 绝对位置编码能否区分方向（前后）？如果不能，这对语言理解有影响吗？
answer:
  mode: rubric
  reference_answer: |-
    绝对位置编码（无论是正弦还是可学习）本质上只告诉模型“绝对位置”，不直接告诉“相对方向”（前或后）。然而，通过结合自注意力，模型能够学到方向信息。因为自注意力计算时，每个 token 可以看到所有其他 token，通过比较它们的绝对位置编码，模型可以推断出相对次序。例如，在可学习的绝对位置嵌入中，位置 pos 和 pos+1 的嵌入在训练中会形成特定的关系，注意力头可以学会将“前面的 token”与“后面的 token”区分开来。

    对于语言理解，方向性至关重要（例如理解“A 在 B 之前”）。如果模型无法区分方向，很多语言任务（如词序敏感的任务）将无法完成。实验表明，使用绝对位置编码的 Transformer 确实能够捕捉方向，因为它可以通过学习位置嵌入之间的差值来隐式编码相对位置。但是，这种隐式能力依赖于足够的训练数据，且在一些细粒度的顺序任务中可能不如显式的相对位置编码稳健。

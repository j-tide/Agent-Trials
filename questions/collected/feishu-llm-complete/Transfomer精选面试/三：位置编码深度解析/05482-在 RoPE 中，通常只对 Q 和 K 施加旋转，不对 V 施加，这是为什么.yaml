content:
  prompt: 在 RoPE 中，通常只对 Q 和 K 施加旋转，不对 V 施加，这是为什么？
answer:
  mode: rubric
  reference_answer: |-
    - 数学目的：RoPE 的设计目标是让注意力分数 QKTQKT 体现相对位置。因此只旋转 QQ 和 KK 就足够了，因为只有它们的点积决定注意力权重。

    - 保持内容完整性：值 VV 承载的是实际信息内容，在加权求和后传递给下一层。如果对 VV 也旋转，可能会污染内容表示，引入位置相关的扭曲，不利于序列的逐层抽象。

    - 实际验证：实验表明，只旋转 QQ 和 KK 效果最好，旋转 VV 反而可能降低性能。

    因此，RoPE 专注在注意力分数中注入位置，保护了值流的信息纯度。

content:
  prompt: YaRN（Yet another RoPE extensioN）方法在 NTK-Aware 基础上还做了什么调整？
answer:
  mode: rubric
  reference_answer: |-
    YaRN 在 NTK-Aware 的频率缩放基础上，进一步做了两个关键改进：

    引入温度机制来控制注意力熵。当序列变长时，softmax 的熵会自然增大，注意力分布趋于均匀。YaRN 对注意力 logits 施加一个与长度相关的温度系数 t：

    [图片内容未导入]

    其中 tt 随着序列长度增加而略微增大（如 t=0.1ln⁡s+1，s 为缩放因子）。温度的升高使得 softmax 更加平滑，防止在长序列中注意力过度集中在极少数 token 上，同时缓解了长序列导致的注意力退化问题。

    对高频维度的特殊处理。YaRN 观察到，即使在 NTK-Aware 缩放后，某些极高频的维度在长序列上仍可能出现性能下降。因此，它对最高频的几组维度应用了更小的缩放，甚至保持完全不缩放，并配合一个小的额外微调因子来校准。

    此外，YaRN 提出了一种无需微调即可外推的方案。通过精心设计频率缩放和温度系数，YaRN 可以在不进行任何长文本微调的情况下，将模型的有效上下文长度扩展数倍，且性能下降极小。

    YaRN 实际上是 NTK-Aware 的一个工程化增强版本，将频率缩放、温度调节和部分维度的精细控制结合为一个完整的即插即用方案，是目前 RoPE 外推中最有效的技术之一。

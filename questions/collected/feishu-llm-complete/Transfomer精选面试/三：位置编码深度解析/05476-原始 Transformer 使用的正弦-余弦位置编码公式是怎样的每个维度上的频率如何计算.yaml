content:
  prompt: 原始 Transformer 使用的正弦/余弦位置编码公式是怎样的？每个维度上的频率如何计算？
answer:
  mode: rubric
  reference_answer: "[图片内容未导入]\n\n频率的计算方式\n\n公式中的分母部分决定了每个维度的波长（即周期）。具体来看，对于第 ii 维（或者更准确地说，第
    ii 组，因为每两个维度共享同一个频率），其角频率为：\n\n[图片内容未导入]\n\n为什么选择正弦/余弦而非可学习的位置嵌入？\n\n论文作者指出，正弦/余弦编码能够外推到比训练时更长的序列（因为函数定义在所有位置上都有效），而可学习的位置嵌入只能处理预设的最大长度。此外，正弦/余弦编码不需要额外的训练参数，实现简单。不过，后来的实践表明，可学习的位置嵌入在性能上往往更优，而
    RoPE 等新方法结合了两者的优点。\n\n工程实现示例（PyTorch 风格）\n\n```python\nimport torch\nimport math\n\ndef
    sinusoidal_position_encoding(max_len, d_model):\n    pe = torch.zeros(max_len,
    d_model)\n    position = torch.arange(0, max_len, dtype=torch.float).unsqueeze(1)\n
    \   div_term = torch.exp(torch.arange(0, d_model, 2).float() * \n                         (-math.log(10000.0)
    / d_model))\n    pe[:, 0::2] = torch.sin(position * div_term)   # 偶数维\n    pe[:,
    1::2] = torch.cos(position * div_term)   # 奇数维\n    return pe\n```\n\n这段代码直接实现了上述公式。div_term
    计算了所有频率的倒数，然后与位置 position 相乘后分别取 sin 和 cos。得到的 pe 可以直接加到词嵌入上作为输入。"

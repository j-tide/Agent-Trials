content:
  prompt: 可学习位置编码是否能隐式学到相对位置信息？有什么证据？
answer:
  mode: rubric
  reference_answer: |-
    是的，可学习位置编码在训练后能够隐式地编码相对位置。证据包括：

    - 训练好的位置嵌入之间的点积或差值表现出一定的周期性或平滑性。可视化显示相邻位置的嵌入相似度较高，距离越远相似度越低，体现出相对距离信息。

    - 可以训练一个线性变换，以位置 p 的嵌入为输入，预测位置 p+k 的嵌入，说明相对位置信息蕴含在绝对位置嵌入中。

    - 在注意力模式中，许多注意力头会形成类似“关注前一个 token”的偏置，这需要模型从绝对位置嵌入中提取出相对位置信号。

    因此，绝对位置编码确实学到了一定程度的相对位置。然而，这种能力是隐式且有限的，尤其在需要泛化到新长度时表现不佳。

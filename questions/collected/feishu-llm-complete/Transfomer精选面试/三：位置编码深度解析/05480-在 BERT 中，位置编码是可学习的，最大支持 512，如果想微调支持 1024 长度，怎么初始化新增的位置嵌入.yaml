content:
  prompt: 在 BERT 中，位置编码是可学习的，最大支持 512，如果想微调支持 1024 长度，怎么初始化新增的位置嵌入？
answer:
  mode: rubric
  reference_answer: |-
    对于 BERT 扩展至 1024 位置，通常采用以下初始化策略：

    - 复制已有位置的嵌入模式：将位置 0~511 的嵌入复制或通过某种变换得到位置 512~1023 的嵌入。一种简单的方法是使用插值：将原本 512 个位置的嵌入进行线性扩展，比如对于新位置 p，取 p' = p * (512 / 1024) 处的嵌入（可能需要最近邻或线性插值）。然后在微调中一起更新。

    - 随机初始化并微调：为新增的位置嵌入随机初始化（如小正态分布），然后在微调时只训练这些新嵌入，或全部位置嵌入一起微调。为了保持模型稳定性，可以使用较小的学习率训练新增部分。

    - 基于正弦编码的初始化：用正弦位置编码公式为所有 1024 个位置生成嵌入，然后作为初始值，微调时可全部微调或仅微调高频部分。

    实践中，微调时通常使用长文本数据（如截断或生成的长文档），并联合训练所有位置嵌入。为了避免破坏预训练学到的表示，早期阶段可以冻结前 512 个位置嵌入，只微调新增的 512 个，随后再一起微调。

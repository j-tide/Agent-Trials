content:
  prompt: 绝对位置编码加到输入的方式是“相加”还是“拼接”？为什么相加通常效果更好？
answer:
  mode: rubric
  reference_answer: |-
    原始 Transformer 采用的是相加：input = token_embedding + position_embedding。相加效果好的原因：

    - 维度匹配与信息融合：相加要求位置编码和词嵌入维度相同，二者可以直接融合，不增加额外维度。信息在相同的向量空间中混合，后续的注意力层和 FFN 可以通过学习自动从中解耦位置和语义信息。拼接虽然保留了独立性，但使输入维度加倍，需要额外的线性变换降维，增加了参数和计算量，并且可能引入过多的自由度导致模型难以学习到位置和语义的有效交互。

    - 参数效率：相加不引入额外参数，模型更紧凑。

    - 经验效果：大量实验证明相加的效果优于或相当于拼接，同时更简洁。

    如果采用拼接，则输入变为 [token_emb; pos_emb]，然后需要一个全连接层将维度映射回 d_model。这种方式在一些工作（如使用复杂位置信息）中有应用，但总体不如相加普遍。

content:
  prompt: Position Interpolation (PI) 是如何将长位置缩放到训练范围的？它的公式是什么？
answer:
  mode: rubric
  reference_answer: |-
    Position Interpolation 的核心思想非常直观：将超出训练范围的位置线性缩放到模型见过的区间内。如果模型训练时只见过 [0,Ltrain) 的位置，但推理时需要处理长度为 Ltarget的序列（Ltarget>Ltrain），那么可以将推理时的实际位置乘以一个缩放因子，使其落在训练范围内。

    具体公式为：

    [图片内容未导入]

    例如，训练长度 2048，推理长度 8192，缩放因子为 2048/8192=0.25。推理时位置 4096 被映射为 4096×0.25=1024，位置 8192 被映射为 2048。这样所有位置都落在了模型训练过的 [0,2048]区间内。


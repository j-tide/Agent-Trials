content:
  prompt: NTK-Aware Scaling 是如何利用神经正切核的思想来改进 RoPE 外推的？
answer:
  mode: rubric
  reference_answer: |-
    NTK-Aware Scaling 受神经正切核理论的启发，提出了一种非均匀的频率缩放策略。神经正切核理论指出，神经网络的训练动态与核方法有密切联系，网络对不同频率信号的敏感性不同。在 RoPE 中，不同维度组对应不同频率的旋转，它们在捕捉位置信息时扮演不同角色。

    NTK-Aware 的核心思想是：高频维度负责局部精确位置，不应该被大幅缩放；低频维度负责全局位置趋势，可以被缩放以扩展支持的长度。这与 PI 对所有维度进行均匀缩放形成鲜明对比。

    具体做法是，不是简单地用缩放因子 ss 来拉伸所有频率，而是选择一个缩放因子 ss，将 RoPE 的基频（base）从 10000 增大。新的基频计算公式为：

    [图片内容未导入]

    其中 d 是每个头的维度。增大基频的效果是让低频维度变化更慢，从而支持更长的序列；而高频维度因为指数衰减快，基频的变化对其影响很小，因此局部位置分辨率得以保留。

    这样，NTK-Aware 实现了高频外推、低频内插的非线性缩放，在扩展上下文长度的同时，最大程度保护了模型在短文本上的性能。

content:
  prompt: 正弦位置编码为什么能表达相对位置关系？请从三角函数角度解释。
answer:
  mode: rubric
  reference_answer: |-
    正弦和余弦函数具有线性相加的性质，这使得位置编码能够自然地表达相对位置关系。对于固定的偏移量 k，位置 pos + k 的编码向量可以由位置 pos 的编码向量经过一个线性变换得到。这是由三角恒等式保证的：

    [图片内容未导入]

    因此，对于任意维度 i，位置 pos+k 的编码（正弦和余弦分量）可以表示为位置 pos 编码的线性组合，其中组合系数只依赖于偏移 k，与绝对位置 pos 无关。由于 Transformer 的注意力计算和 FFN 中包含线性变换，模型理论上可以学习利用这种线性关系来捕捉相对位置，而不需要显式地计算相对距离。

    这种性质使得正弦位置编码具有一定的外推能力：即使模型在训练时没有见过某些绝对位置，只要见过某个相对偏移，也可能通过这种线性关系泛化。这一特性是固定正弦编码相比可学习绝对位置编码的重要优势。

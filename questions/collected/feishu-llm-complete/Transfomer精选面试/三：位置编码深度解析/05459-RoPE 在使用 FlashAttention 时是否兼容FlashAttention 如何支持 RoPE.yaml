content:
  prompt: RoPE 在使用 FlashAttention 时是否兼容？FlashAttention 如何支持 RoPE？
answer:
  mode: rubric
  reference_answer: 兼容。FlashAttention 是一种高效精确注意力算法，通过分块计算避免大矩阵写入。要支持 RoPE，需要在每个分块内对
    Q 和 K 的块执行旋转操作。通常的做法是：在加载 Q、K 块到 SRAM 后，直接在线应用旋转（根据位置生成旋转矩阵或复数乘法），然后再计算点积。由于旋转是逐元素、可并行的操作，完全可以融入
    FlashAttention 的分块流水线中，几乎不增加额外显存访问。当前许多推理框架（如 FlashAttention-2、xformers）已原生支持
    RoPE。

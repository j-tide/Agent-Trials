content:
  prompt: ALiBi 为什么能实现长度外推？其线性偏置的背后直觉是什么？
answer:
  mode: rubric
  reference_answer: |-
    长度外推：ALiBi 的偏置仅仅依赖于相对距离 ∣i−j∣，与绝对位置索引无关。即使在推理时序列变得极长，相对距离的偏置模式仍然适用，模型已经学会了“距离每增加1，注意力分数应降低 mm”这一规则。因此，模型在长序列上可以平滑外推，不会因为遇到未见过的绝对位置而失效。

    背后直觉：

    - 局部性偏好：自然语言具有强局部依赖——相邻的词往往最相关。ALiBi 通过线性递减的偏置直接编码了这种局部性先验，让模型无需从数据中学习就能获得“离得近就更重要”的归纳偏置。

    - 避免注意力分散：在非常长的序列中，softmax 的归一化会使得大量无关 token 也分走少量注意力权重，导致“注意力稀释”。线性偏置将远距离 token 的分数压低，从而集中注意力在邻近区域，保护了局部建模能力。

    - 距离与内容解耦：偏置不参与内容交互，使得模型在学习文本内容依赖时不会与位置纠缠，更容易泛化。

    因此，ALiBi 通过在注意力分数上施加一个随距离衰减的“重力”，使得模型天然具有处理长文的能力。

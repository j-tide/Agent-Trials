content:
  prompt: 为什么 RoPE 成为当前主流大模型（LLaMA, Qwen）的首选？相比 ALiBi 有哪些优势？
answer:
  mode: rubric
  reference_answer: |-
    RoPE 的优势：

    - 灵活性与表达能力：RoPE 可学习（虽然旋转矩阵本身固定，但查询和键向量是可训练的，模型可以适应旋转操作），在不同维度上具有不同频率，形成多尺度的位置感知，既捕捉局部细节也捕捉长程依赖。ALiBi 是硬编码的线性偏置，没有可调参数，对复杂位置模式的建模能力较弱。

    - 长文本外推性能：通过调整基频（如从 10000 提高到 500000 或 1000000），RoPE 可以显著扩展支持的长度，而不需要重新训练。ALiBi 虽然也能外推，但其线性偏置在超长距离下可能导致注意力过度集中于极近 token，忽视中等距离的有效信息。

    - 兼容性：RoPE 完美融入标准自注意力计算，只需在 Q、K 上施加旋转，计算开销增加极小。与 FlashAttention 等高效注意力实现兼容（需将旋转变换融入 kernel）。

    - 相对位置与绝对位置兼顾：RoPE 通过旋转隐式实现相对位置，同时绝对位置也可以从旋转后的向量中被部分保留（若需要），提供了更丰富的信号。

    - 经验效果：在多个基准上，RoPE 表现出优于 ALiBi 的泛化能力和下游任务性能，已成为大模型的事实标准。

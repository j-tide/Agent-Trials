content:
  prompt: 如果输入是一棵树或图，如何设计绝对位置编码来表示拓扑结构？
answer:
  mode: rubric
  reference_answer: |-
    对于图/树结构，位置编码需要反映节点在结构中的位置，而非线性序列顺序。常见方法：

    - 基于图核或随机游走：使用图上的拉普拉斯矩阵的特征向量作为位置编码（Laplacian Positional Encoding）。每个节点用最小的 k 个非平凡特征向量的对应分量作为位置嵌入。这能编码全局的图结构位置。

    - 可学习的图位置嵌入：如果图结构在数据间一致（如分子图的原子位置），可以使用可学习嵌入，但不够通用。

    - 基于距离或最短路径：将节点到某些锚点的最短路径长度编码为位置，或使用 Weisfeiler-Lehman (WL) 结构特征。

    - 层次化编码：对于树，可以用从根到节点的路径序列的编码（如将路径上的边类型嵌入求和）作为绝对位置。

    这些编码与 Transformer 的自注意力结合时，通常加在输入嵌入上，使模型

    能够区分同构子图中的不同节点，从而具备结构感知能力。

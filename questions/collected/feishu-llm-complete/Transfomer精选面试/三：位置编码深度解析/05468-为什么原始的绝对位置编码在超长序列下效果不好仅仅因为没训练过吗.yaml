content:
  prompt: 为什么原始的绝对位置编码在超长序列下效果不好？仅仅因为没训练过吗？
answer:
  mode: rubric
  reference_answer: |-
    不止是没训练过。根本原因有两个：

    - 泛化能力有限：对于可学习的绝对位置编码，超出训练长度的位置编码从未被训练，其嵌入是随机初始化的，模型不知道如何使用这些新位置，性能自然下降。对于正弦位置编码，尽管函数可以外推，但模型仅在有限长度（如 512）上训练，学到的注意力模式和权重并未适应更长序列的正弦波模式，导致注意力分布异常。

    - 位置区分度下降：随着序列变长，绝对位置编码中低频分量对距离的区分度越来越弱。例如，位置 1000 和 1001 在高频上区分明显，但低频分量差异极小。模型在训练时已经适应了特定长度范围内的位置变化模式，对于更长序列，注意力层难以有效利用这种变缓的变化来区分 token 的顺序。

    - 注意力分布的平滑化：在长序列中，由于 softmax 归一化，注意力权重趋于均匀分布，导致信息检索困难。这不仅仅是位置编码的问题，但绝对位置编码无法缓解这种现象。

    因此，超长序列需要特殊的编码策略（如相对位置编码、RoPE、ALiBi）来重新引入距离感知。

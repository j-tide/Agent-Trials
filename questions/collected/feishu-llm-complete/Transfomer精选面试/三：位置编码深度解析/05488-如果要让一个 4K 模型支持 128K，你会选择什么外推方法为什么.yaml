content:
  prompt: 如果要让一个 4K 模型支持 128K，你会选择什么外推方法？为什么？
answer:
  mode: rubric
  reference_answer: |-
    将模型从 4K 扩展到 128K，即扩展 32 倍，这是一个巨大的跨度。单一方法可能难以完美解决，我会采用组合策略。

    首选方法是 YaRN 或 NTK-Aware Scaling。如果模型使用 RoPE，直接修改基频来拉伸频率尺度是最便捷的方案。对于 32 倍的扩展，需要显著增大基频（如从 10000 增大到数百万）。NTK-Aware 的非均匀缩放能保护高频局部信息，YaRN 的温度机制能进一步稳定长序列上的注意力分布。这些方法已在 LLaMA 等模型上经过验证，扩展后仅需少量长文本微调即可恢复性能。

    配合注意力窗口机制。128K 的全注意力计算成本极高。我会在部分层引入滑动窗口注意力，例如在浅层使用较大的窗口（如 4096），在深层使用全局注意力或更小的窗口。这样既能控制计算开销，又能保留捕捉长距离依赖的能力。

    长文本微调策略。无论使用哪种位置编码外推，都需要在长文本数据上进行微调。我会准备一个包含不同长度（4K、8K、16K、32K、64K、128K）的混合数据集，训练时按比例采样。初期用较短文本热身，后期逐步增加长文本比例，让模型平稳过渡。

    选择 YA RN 的理由：它不需要复杂的稀疏注意力实现，部署简单；即插即用，效果稳定；社区已有大量成功案例和开源工具支持。

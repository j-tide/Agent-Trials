content:
  prompt: 相对位置编码中“相对距离”是否需要截断？截断窗口如何选择？
answer:
  mode: rubric
  reference_answer: 可以截断，也可以不截断。截断的好处是减少参数数量（对于可学习的相对位置偏置）或限制注意力范围。常见的做法是设置一个最大相对距离
    k，超出该距离的位置偏置统一设为截断值。窗口大小选择一般依据训练数据中的典型依赖长度和模型容量，如 T5 将距离分桶时设置对数桶，远距离归入同一桶。对于 RoPE
    这类连续编码，通常不截断。

content:
  prompt: 如果 RoPE 只作用在部分维度（如仅前半部分），会有什么影响？有没有这种做法？
answer:
  mode: rubric
  reference_answer: |-
    如果只对部分维度施加 RoPE，比如前 50% 维度旋转，后 50% 维度保持原样：

    - 部分相对位置感知：旋转部分能够捕捉相对位置，未旋转部分则完全不携带位置信息，仅依赖内容。这相当于给模型提供了两种信息通道：位置敏感通道和位置不变通道。

    - 可能提升泛化：一些研究表明，这种部分旋转可以在保持长文本外推能力的同时，让模型在短文本上避免过拟合位置信息。它类似于混合了绝对位置（未旋转部分可视为位置无关）和相对位置。

    - 实际做法：LLaMA 等模型通常对所有维度施加 RoPE，但社区有尝试部分 RoPE（如只对高频组旋转）以优化外推性能。例如，通过仅旋转高频维度，让低频维度作为绝对位置参考，有助于超长文本的稳定性。

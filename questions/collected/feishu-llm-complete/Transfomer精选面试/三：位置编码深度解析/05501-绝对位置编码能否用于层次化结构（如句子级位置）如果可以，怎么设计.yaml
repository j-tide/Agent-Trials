content:
  prompt: 绝对位置编码能否用于层次化结构（如句子级位置）？如果可以，怎么设计？
answer:
  mode: rubric
  reference_answer: |-
    可以。层次化位置编码可以为每个 token 提供多级位置信息，例如：词在句子中的位置 + 句子在段落中的位置 + 段落在文档中的位置。一种设计方案是组合编码：将不同层次的位置编码分别生成后相加或拼接。例如，对于一个 token，可以使用三个不同的位置编码：pos_word（词级位置）、pos_sent（句子级位置）、pos_para（段落级位置）。这些编码可以通过可学习嵌入表或正弦函数生成。然后，将这些编码加在一起，或者采用不同频率的编码以关注不同层次。

    另一种方法是使用层次化可学习嵌入：为每个层次维护一个嵌入矩阵，每个层次的嵌入维度之和等于 d_model。然后将不同层次的嵌入拼接或相加。

    文献中，BERT 本身使用了句子级位置（Segment Embedding），但那是用于区分两个句子，不是精确的位置。层次化位置编码在长文档建模、对话系统中的话语级和词级位置感知中很有用。

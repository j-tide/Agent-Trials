content:
  prompt: 长文本训练时，如何通过截断或采样来平衡计算与效果？
answer:
  mode: rubric
  reference_answer: |-
    当文本长度超过模型的处理上限时，需要在保留信息和控制计算开销之间做出权衡。

    简单截断。只保留文本的前 L 个 token 或后 L 个 token。这种方法最简单，但会丢失大量信息。适用于任务只关心文本开头或结尾的场景（如新闻分类看标题和首段即可）。

    滑动窗口截断。如果文本长度是 NN，模型处理上限是 LL，可以使用大小为 LL 的窗口在文本上滑动，步长为 L/2（有重叠）。每个窗口独立处理，最后通过某种方式（如平均、投票）合并结果。这种方法能覆盖文本的全部内容，但窗口之间没有交互，跨窗口的长距离依赖无法捕捉。

    随机采样。在训练时，每次从长文本中随机截取一段长度为 L 的连续片段。这种方法类似于数据增强，使模型接触到文本的不同部分，但它破坏了文档的完整性。对于语言模型预训练，随机采样是最常用的方法，因为预训练的目标是学习语言的统计规律，而非理解特定文档。

    层次化训练。先在较短文本上训练基础模型，再在较长文本上微调。微调时使用更大的 L 或组合多种截断策略。

    重要区域优先。根据任务相关的启发式规则选择最可能包含关键信息的片段。例如，对于问答任务，可以通过检索模型先找出与问题相关的段落，然后只处理这些段落。

    计算与效果的平衡点。通常，L 选择 2048 或 4096 是性价比较高的起点。训练时使用截断，但在评估长文本任务时使用完整文本（通过推理优化），以真实反映模型能力。

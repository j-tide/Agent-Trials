content:
  prompt: 正弦位置编码的“波长”从 2π2π 到 10000⋅2π10000⋅2π，这个上限 10000 是如何选定的？改变它会怎样？
answer:
  mode: rubric
  reference_answer: |-
    10000 这个值是经验选定的。它决定了最低频率，使得在训练长度（如 512）内，最低频率的正弦波也只经历了不到一个完整周期的一部分。这样，不同位置在该维度上几乎呈单调变化，提供了唯一的绝对位置信号。如果上限减小（如 100），低频波长变短，在长序列上会发生周期性重复，不同绝对位置可能有相似的编码，削弱绝对位置区分能力。如果上限增大，则低频过于平缓，位置变化近乎不变，浪费维度。因此，10000 是个折中值，针对当时的典型序列长度（512）优化。

    改变该值会影响位置编码的尺度，进而影响模型对绝对位置和相对位置的权衡。在更长序列上（如 2048），通常需要增大上限或调整频率分布。

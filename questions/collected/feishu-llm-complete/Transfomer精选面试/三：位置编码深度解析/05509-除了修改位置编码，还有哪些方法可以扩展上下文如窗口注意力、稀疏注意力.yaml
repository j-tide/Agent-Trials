content:
  prompt: 除了修改位置编码，还有哪些方法可以扩展上下文？如窗口注意力、稀疏注意力。
answer:
  mode: rubric
  reference_answer: |-
    修改位置编码是一种“软件”层面的解决方案，而通过改变注意力机制本身来处理长序列则是另一种思路。这些方法可以单独使用，也可以与位置编码外推结合使用。

    [图片内容未导入]

    稀疏注意力。不限制为固定窗口，而是设计稀疏的注意力模式，让每个 token 关注一部分远距离的 token。例如 Longformer 使用滑动窗口加全局注意力的组合；BigBird 在此基础上增加了随机注意力模式；Sparse Transformer 使用固定的稀疏模式。这些方法在保持亚平方复杂度的同时，尽可能保留了对全局信息的访问能力。

    分块递归处理。将长序列切分为多个块，每个块内部做全注意力，块之间通过循环机制传递信息。Transformer-XL 是最早的实践者，它在相邻块之间传递隐藏状态和相对位置信息，使模型能够捕获跨块的长距离依赖。

    记忆压缩。将历史信息压缩为少量记忆 token，这些记忆 token 参与后续所有位置的注意力计算。例如 Compressive Transformer 将旧块的隐藏状态压缩为少量记忆单元；Memorizing Transformers 使用外部记忆库存储历史 key-value 对，通过 kNN 检索相关记忆。

    层次化注意力。将序列组织为层次结构，如先在小块内做注意力，再在块级别做注意力，逐层聚合信息。这种方法类似于卷积神经网络中的金字塔结构，适合处理具有天然层次结构的文本。

    这些方法的共同点是牺牲全注意力以换取效率，它们在不同程度上限制了模型对全局任意位置信息的直接访问。因此，在实际应用中，通常会与改进的位置编码外推方法结合使用，以在不牺牲太多性能的前提下大幅扩展有效上下文长度。

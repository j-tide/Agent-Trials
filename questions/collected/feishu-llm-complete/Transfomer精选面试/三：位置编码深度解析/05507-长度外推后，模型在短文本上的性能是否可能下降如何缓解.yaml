content:
  prompt: 长度外推后，模型在短文本上的性能是否可能下降？如何缓解？
answer:
  mode: rubric
  reference_answer: |-
    会的，这是一个常见问题。长度外推本质上改变了模型的内部表示，尤其是位置编码的分布。当把训练好的模型通过修改位置编码来适应长文本时，模型在短文本上的性能可能受损，表现为：

    局部位置敏感度降低。以 NTK-Aware 为例，虽然高频部分得到保护，但仍有部分频率被拉伸。原本对短文本中邻近 token 的精细区分可能变弱，影响语法、词序相关的能力。

    注意力分布的偏移。外推后，模型的注意力模式可能发生全局性的变化。即使输入的是短文本，由于位置编码参数已变，注意力权重的数值分布也不同于原始模型，可能导致性能波动。

    训练-推理不一致。如果在长文本微调时没有充分混合短文本，模型会逐渐“忘记”短文本的处理技巧，即灾难性遗忘。

    缓解策略：

    - 混合微调数据：在长文本微调阶段，确保数据集中包含足够比例的短文本（如 50%）。让模型同时学习短文本和长文本。

    - 短文本性能回归测试：在微调过程中持续监控模型在短文本基准上的表现。一旦发现指标下降，立即调整数据配比或降低学习率。

    - 使用 YaRN 等即插即用方法：这些方法经过专门设计，在不需要微调的情况下就能外推，对短文本性能的影响极小。

    - 参数高效微调：使用 LoRA 等轻量微调方法，只更新少量参数，减少对原有知识的覆盖。

    - 在推理时根据序列长度动态调整：当输入是短文本时，可以选择不启用长文本模式，或者动态调整位置编码的缩放因子。

content:
  prompt: 分析一下在 Transformer 中，不同子层（注意力，FFN，归一化）对显存的占用占比。
answer:
  mode: rubric
  reference_answer: |-
    以 Pre-Norm Transformer 为例，在训练时主要显存占用来自激活值（中间结果）。

    - 注意力子层：通常占用激活值的大部分。因为需要存储 Q、K、V 映射后的张量（每个形状 [batch, seq_len, hidden_dim]），以及计算出的注意力概率矩阵（[batch, heads, seq_len, seq_len]）。当序列长度 L 较大时，注意力矩阵是 L×L 的，显存增长剧烈（O(L²)），成为瓶颈。

    - FFN 子层：需要存储第一个线性层后的激活值（维度通常为 hidden_dim × expansion_ratio，如 4 倍），形状 [batch, seq_len, 4×hidden_dim]。该张量也很大，但通常小于注意力矩阵在长序列下的开销。

    - LayerNorm：参数量和激活值均极小，占用可忽略。

    在短序列下，FFN 激活值可能占主导；在长序列（如 >2K）下，注意力矩阵成为绝对主导。这也是为什么长序列训练需要稀疏注意力或 FlashAttention 来减少注意力矩阵的显存。

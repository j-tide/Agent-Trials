content:
  prompt: 如何通过监控梯度的 L2 范数和参数更新的范数来判断训练是否健康？
answer:
  mode: rubric
  reference_answer: |-
    定期记录每一层的梯度和参数更新的统计量，是诊断训练健康度的强力手段。健康的训练通常呈现以下特征：

    - 梯度范数适度且稳定：梯度的 L2 范数在训练初期可能较大，随后应稳定在一个合理范围（如 0.01 到 1 之间），没有持续上升或下降的趋势。如果梯度范数持续增大，预示着即将发生梯度爆炸。如果持续减小到极低水平（如 1e-6），说明梯度消失或已经收敛。

    - 梯度范数的比例：查看梯度范数与参数范数的比值。如果这个比值过大，意味着单步更新可能剧烈改变模型。通常这个比值在 0.01 到 0.1 量级。

    - 更新范数与参数范数成比例：参数更新量（即优化器步骤后的参数变化）的范数应与当前参数范数保持合理比例。如果更新范数远大于参数范数，模型可能被推向未知区域；如果极小，则学习率可能过低。

    - 不同层的梯度差异：浅层和深层的梯度范数不应有数量级的差异（在 Pre-Norm 下，差异通常不大）。如果某层梯度总是为零或极大，该层可能存在问题。

    通过可视化这些范数的曲线，可以及早发现异常并调整训练策略，而不是等到 Loss Spike 或 NaN 出现才被动应对。

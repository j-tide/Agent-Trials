content:
  prompt: 比较 SGD+Momentum 与 Adam/AdamW 在 Transformer 训练中的表现差异，为什么 Adam 系列更流行？
answer:
  mode: rubric
  reference_answer: |-
    SGD+Momentum：

    - 优点：泛化能力往往更好，在一些视觉任务和最终微调阶段仍被使用。

    - 缺点：需要手动调节学习率和动量，对学习率极其敏感；在训练 Transformer 时收敛极慢，因为不同参数（如注意力头和 FFN 层）的梯度尺度差异大，单一学习率难以适应，容易陷入沟壑。

    Adam/AdamW：

    - 优点：自适应学习率使得不同参数拥有各自的学习率，特别适合 Transformer 这种不同层、不同头之间梯度差异显著的架构。收敛快，对初始学习率不那么敏感（但仍需合理设置），训练过程更稳定，减轻了人工调参负担。

    - 为什么流行：Transformer 预训练数据量大、训练时间长，使用自适应优化器能大幅缩短实验周期，且最终性能往往能追平甚至超越精心调参的 SGD。AdamW 结合解耦权重衰减，兼顾了泛化，已成为 Transformer 训练的标配。

    总结来说，Adam 系列解决了 Transformer 训练中最重要的梯度尺度不平衡问题和高效收敛的需求，其稳定性和易用性使其成为工业界和学术界的首选。

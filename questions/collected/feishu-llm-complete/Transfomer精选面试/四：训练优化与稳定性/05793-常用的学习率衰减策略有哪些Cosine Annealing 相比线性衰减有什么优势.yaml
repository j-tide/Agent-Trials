content:
  prompt: 常用的学习率衰减策略有哪些？Cosine Annealing 相比线性衰减有什么优势？
answer:
  mode: rubric
  reference_answer: |-
    常用策略：

    - Step Decay：每过一定步数或 epoch，学习率乘以一个衰减因子（如 0.1）。简单粗暴，但衰减不连续，可能错过最优点。

    - Linear Decay：学习率线性减少到零或最小值。变化平缓，适合在收敛后期精细调整。

    [图片内容未导入]

    Cosine Annealing 的优势：

    - 初期缓慢衰减，后期快速衰减：余弦曲线初期变化平缓，让模型在较高学习率下充分探索；后期快速降低，使模型更稳定地收敛到极小值。

    - 避免剧烈调整：与 step decay 相比，余弦衰减没有突变，训练更平滑。

    - 结合 restarts 提升泛化：Cosine Annealing with Warm Restarts（SGDR）通过周期性将学习率重置到高值，帮助模型跳出局部最优，提升泛化性能。

    - 实践效果优越：在大量 Transformer 预训练实验中，余弦衰减相比线性衰减通常能带来更低的验证困惑度和更好的下游性能。


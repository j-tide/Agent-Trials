content:
  prompt: 解释一下 ZeRO-Offload 如何利用 CPU 内存和计算来进一步降低 GPU 显存需求。
answer:
  mode: rubric
  reference_answer: |-
    ZeRO-Offload 将优化器状态（甚至模型参数）卸载到 CPU 内存，利用 CPU 的算力来执行优化器更新。具体地：

    - 优化器状态（如 Adam 的 momentum 和 variance）体积庞大，存储在 CPU 内存中。

    - 在反向传播结束后，GPU 将梯度发送给 CPU，CPU 执行 Adam 更新步骤，得到更新后的 FP32 参数。然后 CPU 将更新后的参数传回 GPU，GPU 再将其转换为 FP16 用于下一轮。

    - 为了隐藏通信延迟，利用双缓冲和异步传输：在 CPU 计算当前层的更新时，GPU 可以预取下一层的梯度，或者进行下一轮的前向。

    - 还可以将 FP16 模型参数也部分放在 CPU，在需要时通过 PCIe 传输到 GPU，实现“零冗余”参数存储。

    代价是训练速度下降，因为 PCIe 带宽远小于 GPU 显存带宽。典型性能损失在 30%～50%，但可将单卡可训练模型规模扩大数倍。

content:
  prompt: 随机深度（Stochastic Depth）是什么？它是如何作为一种正则化手段提高稳定性的？
answer:
  mode: rubric
  reference_answer: |-
    随机深度是一种在训练时随机丢弃整个 Transformer 层的技术。对每个训练样本，以一定概率 pp 将某些层的输出完全替换为输入（即该层被跳过，退化为恒等映射）。被跳过的层不参与前向和反向计算。通常对较浅的层使用较小的丢弃概率，对深层使用较大的丢弃概率，呈线性递增。

    正则化效果：随机深度迫使模型不依赖于任何单层，因为任意一层都可能被丢弃。这类似于 Dropout，但作用在层级别而非神经元级别，能有效防止过拟合。此外，它训练了不同深度的子网络组合，产生了集成学习的效果。在推理时，所有层被激活，但需要根据训练时的存活概率调整每层的输出（或直接使用，因为平均效应已在权重中隐式体现）。

    提高训练稳定性：通过随机跳过一些层，训练时的有效网络深度变浅，梯度传播路径缩短，减少了梯度爆炸和消失的风险。这对于极深 Transformer 尤其有益。它还可以看作是一种隐式的深度课程学习：早期训练时网络实际上较浅，随着训练进行，所有层逐渐协同工作。

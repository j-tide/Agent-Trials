content:
  prompt: 显存不足时，CPU Offload 可以将哪些数据卸载到内存？性能下降的幅度通常有多大？
answer:
  mode: rubric
  reference_answer: |-
    CPU Offload 可以将以下数据从 GPU 显存卸载到 CPU 内存：

    - 优化器状态（动量、方差）——这是最常用的卸载，因为它们体积大（参数量 × 8 字节），且在前向/反向中不需要。

    - 模型参数（如 ZeRO-Offload 将 FP16 参数也卸载，前向时按需从 CPU 搬到 GPU）。

    - 激活值（部分框架支持，但较少见，因需要频繁传输）。

    当仅卸载优化器状态时，性能下降通常20%-50%，取决于 PCIe 带宽和计算/通信重叠的效率。因为每一步更新时，需要从 CPU 内存读取 FP32 状态到 GPU，更新后再写回。如果利用 CUDA Stream 实现异步传输，并与计算重叠，可部分隐藏延迟，损失可控制在 30% 左右。

    若卸载参数（如 ZeRO-Infinity），由于前向每层都要从 CPU 加载参数，通信量更大，性能下降可能达到 50%-80%，主要限于极大规模模型且 GPU 显存极端不足的场景。

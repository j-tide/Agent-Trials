content:
  prompt: BF16 相比 FP16 有什么优势？为什么大模型训练更倾向于使用 BF16？
answer:
  mode: rubric
  reference_answer: |-
    BF16（Brain Floating Point 16）和 FP16 都是 16 位浮点数，但它们的位分配不同：FP16 有 1 位符号、5 位指数、10 位尾数；BF16 有 1 位符号、8 位指数、7 位尾数。BF16 的指数位数与 FP32 相同（都是 8 位），因此它的动态范围与 FP32 完全一致，可以表示的数值范围约为 10⁻³⁸ 到 10³⁸，远大于 FP16 的 6×10⁻⁸ 到 65504。

    这一特性带来了两大关键优势：

    - 无需损失缩放：由于 BF16 的动态范围足够大，训练中很少出现梯度上溢（Inf）或下溢（零）的问题，因此不需要复杂的损失缩放机制，简化了训练流程。

    - 与 FP32 的互换性：BF16 和 FP32 之间的转换非常简单——直接截断或填充尾数即可，不需要处理指数偏移。这使得硬件实现更高效。

    大模型训练更倾向于 BF16 的原因：

    - 数值稳定性：大模型参数多、层数深，梯度容易在传播中产生极端值。BF16 的大动态范围能更好地容忍这些极端值，避免训练中断。

    - 简化工程：省去损失缩放，减少了超参数调优和溢出处理的开销。

    - 硬件支持：NVIDIA A100、H100 等 GPU 以及 Google TPU 都对 BF16 提供原生支持，其 Tensor Core 在 BF16 下的吞吐量与 FP16 相当甚至更高。

    因此，BF16 已成为大模型训练的主流半精度格式。

content:
  prompt: AdamW 与 Adam 的根本区别在哪里？为什么权重衰减要解耦？
answer:
  mode: rubric
  reference_answer: |-
    根本区别：Adam 的权重衰减直接加在梯度上（通过修改损失函数实现 L2 正则化），而 AdamW 的权重衰减是直接对参数本身进行衰减，与梯度更新分离。

    [图片内容未导入]

    为什么需要解耦：

    - 在 Adam 中，权重衰减的强度受到自适应学习率的干扰。对于大梯度的参数，学习率被二阶矩大幅缩小，导致权重衰减效果也大幅减弱；对于小梯度参数则相反。这破坏了权重衰减作为通用正则化手段的均匀性，降低了其效果。

    - AdamW 解耦后，权重衰减的强度仅由衰减系数 λ 决定，对所有参数公平，与梯度尺度无关，更能有效地控制模型复杂度，防止过拟合。实验证明，AdamW 相比原 Adam 能获得更好的泛化性能和更稳定的训练。


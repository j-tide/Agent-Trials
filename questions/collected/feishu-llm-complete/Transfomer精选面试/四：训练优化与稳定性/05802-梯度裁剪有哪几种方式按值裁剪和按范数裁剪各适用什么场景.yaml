content:
  prompt: 梯度裁剪有哪几种方式？按值裁剪和按范数裁剪各适用什么场景？
answer:
  mode: rubric
  reference_answer: |-
    按值裁剪（Value Clipping）：将每个梯度分量的值限制在 [−c,c][−c,c] 范围内。适用于需要防止单个极端值但保留梯度方向多样性的情况，例如处理离群梯度峰值。

    按范数裁剪（Norm Clipping）：对整个梯度向量进行 L2 范数计算，如果范数超过阈值 cc，则将整个向量等比例缩放到范数为 cc。这保留了梯度的方向，仅缩放其大小。这是训练 Transformer 等深层网络的首选方式，因为它可以防止由于梯度爆炸导致的单步更新过猛，同时保持原始梯度的相对结构，对于训练稳定性至关重要。

    适用场景：

    - 按值裁剪：常用于训练 RNN 或某些优化器中，以去除数值异常，但可能改变梯度的方向分布。

    - 按范数裁剪：几乎所有 Transformer 训练中都会使用，能有效预防 loss 尖峰和 NaN。


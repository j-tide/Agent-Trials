content:
  prompt: 什么是序列并行（Sequence Parallelism）？它主要解决什么问题？通常与哪种并行结合？
answer:
  mode: rubric
  reference_answer: |-
    序列并行是将输入序列的长度维度切分到多个 GPU 上，以缓解长序列训练时激活值显存过大的问题。

    在 Transformer 中，自注意力的计算复杂度与序列长度的平方成正比。当序列极长（如几千 token）时，注意力矩阵的显存占用成为瓶颈。序列并行通常在张量并行的基础上使用。例如 Megatron-LM 中，将序列长度切分，每张 GPU 只处理一部分序列 token。但在计算注意力时，需要获取完整的序列，因此需要使用 AllGather 通信来收集其他 GPU 的序列块；计算完注意力后，再通过 ReduceScatter 将结果分发回各 GPU。

    序列并行通常与张量并行结合，因为两者都是切分模型层内计算，可以共用通信组，减少额外通信。它有效降低了单卡上注意力计算的峰值显存，使得训练更长序列成为可能。

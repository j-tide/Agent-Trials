content:
  prompt: 使用 BF16 时，为什么不需要像 FP16 那样做 Loss Scaling？请从表示范围解释。
answer:
  mode: rubric
  reference_answer: FP16 需要 Loss Scaling 的核心原因是其有限的动态范围：FP16 能表示的最小正规数约为 6×10⁻⁸，许多小梯度值会因小于该值而变成零（下溢）。Loss
    Scaling 通过放大损失来放大梯度，防止下溢。然而，BF16 的指数位宽与 FP32 相同（8 位），其能表示的最小正规数约为 1.2×10⁻³⁸，与
    FP32 相当，远小于实际训练中梯度值的量级。因此，梯度几乎不可能下溢。同时，BF16 的上溢范围也极大（3.4×10³⁸），一般梯度也不会溢出。所以 BF16
    在训练中自然避开了 FP16 的数值问题，无需专门的损失缩放机制。

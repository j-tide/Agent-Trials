content:
  prompt: 如何选择并行策略的“最优”配置？比如张量并行度、流水线并行度和数据并行度如何根据硬件设定？
answer:
  mode: rubric
  reference_answer: |-
    选择取决于硬件拓扑、模型规模和训练效率：

    - 节点内 GPU 间有高速 NVLink：优先使用张量并行，TP 大小通常等于节点内 GPU 数（如 8）。这样张量并行的 AllReduce 在节点内速度极快。

    - 模型层数很多（如 >64 层）：使用流水线并行，PP 大小可跨节点，每个 PP 阶段放在一个节点内。PP 大小应使每个阶段的显存可容纳，同时气泡尽可能小（可使用 1F1B 调度）。

    - 剩余维度用于数据并行：DP 大小 = 总 GPU 数 / (TP × PP)。数据并行组内可使用 ZeRO 优化。

    - ZeRO 阶段选择：若显存允许，ZeRO-2 或 ZeRO-1 即可；大模型必须 ZeRO-3。

    - 序列并行：仅在序列极长且张量并行已经开启时启用，与 TP 结合。

    最佳实践：先用少量 GPU 测试不同配置下的吞吐量（samples/sec），找到通信与计算的平衡点。Megatron-LM 提供了计算最优配置的工具。

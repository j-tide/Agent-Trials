content:
  prompt: Warmup 的步数通常如何选择？过长或过短有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    选择方法：通常根据总训练步数 Ttotal 的很小比例（如 1%～5%），或者根据经验设置为几千步。对于大模型（数十亿参数），常用 2000～4000 步 warmup；对于小模型，几百到一千步即可。实际中最常用的方法是：设置 warmup 步数占总步数的 1%，例如训练 100K 步，warmup 1K 步。

    过短的影响：学习率攀升过快，早期的大梯度仍可能引起参数剧烈震荡，loss 尖峰概率增大，模型可能无法稳定收敛。

    过长的影响：学习率长期处于较低水平，前期训练效率低下，浪费计算资源。更重要的是，过长的 warmup 会导致模型在训练早期“欠学习”，当学习率最终达到峰值时，模型可能已经处于一个不太适合高学习率的状态，影响后续收敛速度和最终性能。

    经验：一般 1000～4000 步 warmup 对大多数任务足够。如果训练开始时 loss 波动很大，可以适当延长。也可以使用动态 warmup（如根据 loss 的平稳性自动结束）。


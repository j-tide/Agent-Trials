content:
  prompt: 混合精度训练中，权重的主副本（master weights）保存在 FP32，这能防止什么？有没有模型直接用 FP16 做主副本？
answer:
  mode: rubric
  reference_answer: |-
    主副本保存在 FP32 主要防止舍入误差的累积。在 FP16 中，尾数只有 10 位，当用很小的梯度更新权重时（尤其是训练后期或使用较大权重衰减），更新量可能小于 FP16 的最小可表示精度，导致权重无法被更新（称为“更新丢失”）。FP32 主副本累加这些微小更新，保留足够的精度，然后下一轮再将 FP32 主副本转换为 FP16 用于计算。这保证了模型学习到细微的变化。

    是否存在直接用 FP16 做主副本的模型？非常少见且不推荐。理论上，如果使用 BF16 做主副本，由于其 7 位尾数精度略低，也可以直接用于更新，配合动态损失缩放或适当的训练策略有时可行，但 FP32 主副本仍是标准。

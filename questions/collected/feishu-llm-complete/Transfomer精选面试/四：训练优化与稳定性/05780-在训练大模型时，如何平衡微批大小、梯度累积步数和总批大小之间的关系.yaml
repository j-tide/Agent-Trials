content:
  prompt: 在训练大模型时，如何平衡微批大小、梯度累积步数和总批大小之间的关系？
answer:
  mode: rubric
  reference_answer: |-
    - 总批大小（Global Batch Size, GBS）：由训练任务和模型决定，通常通过实验或遵循扩展定律（如 LLM 的预训练 GBS 常在 1M-4M tokens）。太小的 GBS 训练不稳定，收敛慢；太大的 GBS 会导致每个 batch 的样本数过多，可能需增大学习率，但边际收益递减且硬件利用率下降。

    - 微批大小（Micro Batch Size, MBS）：每张 GPU 一次前向能处理的最大样本数（受显存限制）。MBS 越大，计算效率越高，但显存占用也越大。

    - 梯度累积步数（GAS）：为了达到 GBS，需要累积的微批次步数。GBS = MBS × GPU 数量 × GAS。

    平衡策略：

    - 首先根据单卡显存和模型，确定最大的 MBS（通常 1 或 2，若显存允许可更大）。

    - 根据总卡数和期望的 GBS，计算需要的 GAS。GAS 过大（如几百）会导致训练速度线性下降，且由于每次更新间的延迟增加，可能影响收敛（但对 Transformer 影响较小）。在可行的情况下，应优先增加卡数减少 GAS。

    - 如果 GAS 必须较大，可适当提高学习率（按 sqrt 或线性缩放）来补偿更新频率的降低，但需谨慎。

    - 在无法增加卡数时，也可以考虑使用累积梯度但不立即更新，而是利用分布式优化器（如 ZeRO-2/3）在卡间分担状态，并结合通信优化。

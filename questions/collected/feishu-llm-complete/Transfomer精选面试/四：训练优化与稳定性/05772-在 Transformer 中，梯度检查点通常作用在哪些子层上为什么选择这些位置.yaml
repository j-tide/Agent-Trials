content:
  prompt: 在 Transformer 中，梯度检查点通常作用在哪些子层上？为什么选择这些位置？
answer:
  mode: rubric
  reference_answer: |-
    梯度检查点通常以整个 Transformer 层为单元施加。原因：

    - 每层内部包含多头注意力和 FFN，中间会产生大量激活（尤其是注意力概率矩阵和 FFN 隐层输出），占用内存高。

    - 以整层为检查点，只需保存该层的输入（即上一层的输出），重计算时重新执行该层的所有运算。这样实现简单，且能有效减少内存。

    - 如果粒度更细（如只对注意力或 FFN 做检查点），虽然可能进一步节省一些内存，但会引入更多重计算和实现复杂度。因此，实践中通常在每个 Transformer 层边界设置检查点。

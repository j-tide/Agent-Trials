content:
  prompt: 如何通过调整模型架构（如减少层数、维度）来降低显存？在给定显存下如何最大化模型效果？
answer:
  mode: rubric
  reference_answer: |-
    降低显存的架构调整：

    - 减少层数：直接降低参数总量，参数、梯度、优化器状态等比例下降。但模型深度对性能影响大，浅而宽的模型可能不如深而窄的模型。

    - 减小模型宽度（隐藏维度 d_model）：参数随维度平方增长，效果显著。可结合扩中间层维度（FFN）的比例调整。

    - 降低注意力头数：在总维度固定下，头数影响多头注意力的参数量和计算，适当减少头数（保持每个头维度合理）可节省参数。

    - 使用 GQA 或 MQA：分组查询注意力或 Multi-Query Attention 可以减少 KV 缓存和参数，尤其对推理显存有效，训练时也能减少部分参数。

    - 词表压缩：词表嵌入矩阵参数量大，可如 ALBERT 进行矩阵分解。

    在给定显存下最大化模型效果的原则：

    - 深度优先：在预算内尽可能增加层数，因为深度对模型抽象能力更重要。可适当压缩宽度和 FFN 比例。

    - 使用 MoE（混合专家）：用稀疏激活的 FFN 增大总参数量而不显著增加计算和显存（专家分布在多卡）。在相同显存下，MoE 可以显著提高模型容量和性能。

    - 调整精度和优化器：FP16/BF16 混合精度；使用更省显存的优化器（如 Adafactor，减少动量存储）。

    - 结合并行和显存优化：ZeRO 和梯度检查点等可以释放显存，从而允许更大的模型。

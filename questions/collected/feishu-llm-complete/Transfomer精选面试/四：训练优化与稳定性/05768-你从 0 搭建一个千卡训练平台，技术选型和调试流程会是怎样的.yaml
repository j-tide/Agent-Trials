content:
  prompt: 你从 0 搭建一个千卡训练平台，技术选型和调试流程会是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    技术选型：

    - 硬件：NVIDIA A100/H100 GPU，节点内 NVSwitch 全互联，节点间 InfiniBand HDR/NDR 网络。

    - 操作系统：Ubuntu 或 Rocky Linux，安装 MLNX_OFED 驱动、NVIDIA 驱动、CUDA、cuDNN、NCCL。

    - 容器化：使用 Docker/Enroot + Slurm/Kubernetes 进行作业调度。

    - 训练框架：PyTorch + DeepSpeed（ZeRO）或 Megatron-LM（3D 并行）。对于千卡规模，通常使用 Megatron 进行模型并行，结合 DeepSpeed ZeRO 优化数据并行。

    - 存储：高性能共享文件系统（Lustre/GPFS）用于数据和检查点。

    - 监控：Prometheus + Grafana 监控 GPU 利用率、温度、功耗、网络流量；NVIDIA DCGM 暴露 GPU 指标。

    调试流程：

    - 单卡验证：确保模型、数据加载、训练循环在单卡上正常运行。

    - 单机多卡（8 卡）：使用 DDP 验证多卡训练正常，无死锁，性能线性。

    - 小规模集群：选取 2-4 个节点，配置张量并行+流水线并行+数据并行，调通分布式 checkpoint 和弹性训练。

    - 全规模启动：逐步扩展到所有节点。使用较小的模型和数据集进行“冒烟测试”，检测通信瓶颈、慢节点。利用 nccl-tests 测试带宽和延迟。

    - 性能剖析：使用 PyTorch Profiler、Nsight Systems 定位瓶颈，调整并行策略、微批次大小、梯度累积步数、通信与计算重叠。

    - 稳定性测试：连续运行数小时，监控 loss 变化、GPU 内存、通信超时等，确保无随机故障。

    - 正式训练：加载完整数据，开始正式预训练，配合检查点保存和自动恢复机制。

    整个过程需要深入理解硬件拓扑和框架实现，并不断优化通信和计算效率。

content:
  prompt: Adam 中的动量参数 β1 和 β2 一般如何设置？调整它们会产生什么效果？
answer:
  mode: rubric
  reference_answer: |-
    默认设置：β1=0.9, β2=0.999，这是经过大量实验验证的稳健组合。

    - β1（一阶矩衰减率）：控制历史梯度对当前动量方向的影响。增大 β1（如 0.95）：模型更依赖长期积累的梯度方向，更新更平滑，可能加速收敛，但对近期梯度变化不敏感，可能错过新方向。减小 β1（如 0.8）：模型对近期梯度更敏感，能快速调整方向，但震荡可能增大。

    - β2（二阶矩衰减率）：控制梯度平方的指数平均窗口。增大 β2（如 0.9999）：二阶矩估计更平滑，学习率调整更稳定，但响应缓慢，可能导致前期训练慢。减小 β2（如 0.99）：对近期梯度尺度变化更敏感，自适应学习率调整更快，但可能过于激进导致不稳定。

    在训练初期，由于二阶矩为零，β2β2 过大可能导致自适应学习率过高，因此通常与 warmup 配合。


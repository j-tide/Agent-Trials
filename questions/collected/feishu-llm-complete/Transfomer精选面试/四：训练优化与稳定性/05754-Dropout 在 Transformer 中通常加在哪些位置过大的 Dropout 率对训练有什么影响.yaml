content:
  prompt: Dropout 在 Transformer 中通常加在哪些位置？过大的 Dropout 率对训练有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    Transformer 中的 Dropout 通常加在以下位置：

    - 注意力权重上：在计算 softmax 之后，对注意力概率矩阵施加 Dropout，随机丢弃某些 token 间的注意力连接。这迫使模型不依赖单一路径的注意力。

    - 残差连接之前：在每个子层（注意力或 FFN）的输出上，在加到残差流之前施加 Dropout。这是最标准的做法，用于防止子层的输出过拟合。

    - FFN 隐层激活上：在 FFN 的两层之间，激活函数之后施加 Dropout。

    - 嵌入层上：在词嵌入和位置嵌入相加之后，有时也会施加 Dropout。

    过大的 Dropout 率会严重损害训练：

    - 信号不足：过度丢弃导致可用的信息过少，模型难以学习到有效的特征，训练损失下降缓慢甚至停滞。

    - 训练-推理不一致加剧：Dropout 在训练时关闭部分神经元，推理时全部激活，过高的丢弃率使得推理时的激活分布与训练时差异巨大，导致性能显著下降。

    - 欠拟合：模型容量被过度限制，无法拟合训练数据，即使训练足够久也无法达到理想的准确率。

    通常 Transformer 的 Dropout 率设置在 0.1 左右。对于大规模数据和模型，Dropout 的作用降低，有时甚至不用（如 GPT-3 仅在嵌入层使用 0.1 的 Dropout，其他层不使用）。

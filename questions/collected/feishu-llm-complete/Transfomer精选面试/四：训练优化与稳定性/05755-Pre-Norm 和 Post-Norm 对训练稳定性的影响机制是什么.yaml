content:
  prompt: Pre-Norm 和 Post-Norm 对训练稳定性的影响机制是什么？
answer:
  mode: rubric
  reference_answer: |-
    Pre-Norm 和 Post-Norm 是 Transformer 中两种层归一化的放置方式，对训练稳定性影响深刻。

    Post-Norm（原始 Transformer）：每个子层的输出与输入相加后，再通过 LayerNorm。结构是 x + Sublayer(x) → LN。这种设计的问题在于，残差路径的梯度必须经过 LayerNorm 才能回传。LayerNorm 的梯度包含对输入的缩放因子，当层数加深时，多层的缩放因子相乘会指数级放大或缩小梯度，极易导致梯度爆炸或消失。因此，Post-Norm 对学习率和初始化极其敏感，训练深层网络非常困难。DeepNorm 等改进正是针对这一问题，通过特殊的权重缩放来抑制 LayerNorm 的梯度缩放效应。

    Pre-Norm（现代标准）：LayerNorm 放置在子层之前。结构是 x + Sublayer(LN(x))。残差路径完全绕过了 LayerNorm，梯度可以沿着残差连接无衰减地流向浅层。LayerNorm 只用于调整进入子层的输入分布，使它更稳定，但不影响梯度的跨层传播。这就好比给每层安装了一个输入调节器，同时保留了一条畅通的梯度高速公路。Pre-Norm 让深层 Transformer 的训练稳定性大幅提升，对学习率的容忍范围也宽得多，因此几乎所有现代大模型都采用 Pre-Norm。

    深层机制：从初始化角度看，Pre-Norm 下，每个子层看到的输入是经过归一化的，方差被控制在 1 左右。而 Post-Norm 下，子层的输入是未归一化的残差累积，其方差随层数增长，子层需要不断适应漂移的输入分布，训练更困难。

content:
  prompt: 如何使用学习率查找器来选择合适的初始学习率？
answer:
  mode: rubric
  reference_answer: |-
    学习率查找器的方法由 Leslie N. Smith 提出，其核心是让学习率在一个小批量上从极小值指数增长到极大值，观察 loss 曲线。具体步骤：

    - 选择一个很小的起始学习率（如 1e-7）。

    - 在一个 epoch 或几千步内，每步按照指数增长学习率，直到 loss 开始回升或发散。

    - 记录每个学习率对应的 loss，绘制 loss 对学习率的对数图。

    - 在 loss 下降最快、且还没有发散的区间内，选择一个学习率作为初始值。通常选择 loss 下降最快的点的 1/10 或 1/3 作为安全初始学习率。

    这种方法能快速找到模型训练的最佳学习率范围，避免反复试错。


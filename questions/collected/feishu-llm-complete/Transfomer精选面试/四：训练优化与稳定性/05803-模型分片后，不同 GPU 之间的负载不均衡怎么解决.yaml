content:
  prompt: 模型分片后，不同 GPU 之间的负载不均衡怎么解决？
answer:
  mode: rubric
  reference_answer: |-
    负载不均衡主要出现在流水线并行中，不同阶段的计算量可能不一致（比如嵌入层与中间层），导致某些设备成为瓶颈。

    解决方法：

    - 自动平衡：框架（如 Megatron-LM）将层尽可能均匀分配到流水线阶段，同时考虑参数量和计算量。

    - 微批次调度优化：调整流水线气泡，如使用 interleaved 1F1B，每个设备处理多个流水线阶段（交错），进一步平衡负载。

    - 使用动态批大小或序列长度：但可能复杂。

    - 考虑给计算量小的阶段增加虚拟层：但实际上很少。

    对于张量并行和数据并行，只要切分均匀，负载自然均衡。ZeRO 分片也是均衡的。

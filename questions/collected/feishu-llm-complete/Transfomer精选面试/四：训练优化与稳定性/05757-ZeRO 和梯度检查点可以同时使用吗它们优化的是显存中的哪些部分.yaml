content:
  prompt: ZeRO 和梯度检查点可以同时使用吗？它们优化的是显存中的哪些部分？
answer:
  mode: rubric
  reference_answer: |-
    可以同时使用，它们是互补的显存优化技术。

    - ZeRO（Zero Redundancy Optimizer）：主要优化优化器状态、梯度和模型参数的冗余存储。在数据并行中，每张卡都保存完整的上述三者，ZeRO 通过分片（partitioning）将优化器状态（ZeRO-1）、梯度（ZeRO-2）、模型参数（ZeRO-3）分布到不同 GPU，每张卡只存储一部分，需要时通过通信获取。这大幅降低了单卡显存占用。

    - 梯度检查点：主要优化激活值的显存。通过重计算来减少需要存储的中间激活。

    两者作用的对象不同：ZeRO 针对参数、梯度、优化器状态；检查点针对激活值。同时使用可以成倍地降低总显存需求，使训练超大模型成为可能。例如，训练千亿模型时，ZeRO-3 + 梯度检查点是标准配置。

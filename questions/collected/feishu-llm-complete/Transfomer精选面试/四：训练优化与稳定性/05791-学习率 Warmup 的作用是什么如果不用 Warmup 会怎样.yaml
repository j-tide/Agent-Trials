content:
  prompt: 学习率 Warmup 的作用是什么？如果不用 Warmup 会怎样？
answer:
  mode: rubric
  reference_answer: |-
    作用：学习率 Warmup 是指在训练开始的若干个步骤（或 epoch）内，将学习率从 0 或极小值线性（或按某种曲线）增加到预设的初始学习率。其核心目的是缓解训练初期模型对梯度方向的剧烈变化，避免模型在参数空间中走偏。

    具体原因：

    - 随机初始化带来的大梯度：在训练开始时，模型权重是随机初始化的，注意力矩阵、FFN 的参数都处于不稳定的初始状态。前几步的梯度可能非常大且方向混乱，如果立即使用大的学习率，模型可能被这些早期的大梯度带到一个很差的局部区域，甚至导致梯度爆炸或 NaN。

    - Adam 的二阶矩需要预热：Adam 在初期的一阶矩和二阶矩都是零，对梯度的估计极不准确。Warmup 给优化器一段缓冲时间来积累合理的动量统计，从而使后续的自适应学习率更加可靠。

    - 深层 Transformer 的训练稳定性：Transformer 有多层残差连接和层归一化，但初始化后的方差分布仍然可能不够理想。小学习率在早期相当于给模型一个“轻柔的起点”，让各层的参数逐渐协调。

    如果不用 Warmup：模型可能在训练初期就遭遇 loss 尖峰（甚至 NaN），或者早期陷入不良局部最小值，后续无论怎么训练也难以恢复。对于大模型，没有 warmup 几乎必然导致训练失败。


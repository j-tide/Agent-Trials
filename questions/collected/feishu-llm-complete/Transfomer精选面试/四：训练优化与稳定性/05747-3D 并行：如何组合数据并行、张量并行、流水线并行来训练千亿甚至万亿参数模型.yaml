content:
  prompt: 3D 并行：如何组合数据并行、张量并行、流水线并行来训练千亿甚至万亿参数模型？
answer:
  mode: rubric
  reference_answer: |-
    3D 并行是同时使用三种并行策略：

    - 张量并行（TP）：切分层内矩阵，用于单层过大时。通常在节点内使用高速 NVLink，TP size 一般 2-8。

    - 流水线并行（PP）：将不同层分布到不同设备，用于模型过深时。PP 组跨节点，通信量较小。

    - 数据并行（DP）：每个“模型副本”使用上述 TP+PP 组合，不同副本之间做数据并行。通常使用 ZeRO 优化数据并行中的冗余。

    组合方式：将 GPU 划分为三维网格。例如，假设总 GPU 数为 G，设置 TP=4，PP=4，则每个模型副本占用 16 张 GPU，剩余的 GPU 用于数据并行（DP=G/16）。数据并行组内使用 ZeRO-2/3 来减少显存和通信。训练时，数据并行负责大批量样本的分布式处理，流水线并行负责层间流水线调度，张量并行处理层内大矩阵。

    这种组合解决了单卡显存、计算和通信的极限，使得训练万亿参数模型成为可能。

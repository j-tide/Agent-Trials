content:
  prompt: Adam 优化器的更新规则是什么？它结合了哪两种优化器的思想？
answer:
  mode: rubric
  reference_answer: |-
    Adam（Adaptive Moment Estimation）将动量法（Momentum） 和自适应学习率（RMSprop） 的思想融合在一起。它的核心是同时维护梯度的一阶矩（均值）和二阶矩（未中心化的方差）的指数移动平均，并使用这些矩来为每个参数计算独立的、自适应的学习率。

    Adam 的完整更新流程：

    [图片内容未导入]

    其中 α 是学习率，ϵ 是防止除零的小常数。

    两种思想的结合：

    - 一阶矩 mt（动量）：累积历史梯度方向，加速收敛，特别是在沟壑地形和鞍点处，帮助梯度保持方向一致性并平滑震荡。

    - 二阶矩 vt（自适应学习率）：累积梯度平方，相当于估计每个参数梯度的方差。对于频繁更新的参数（大梯度），学习率会被二阶矩的平方根所缩小；对于稀疏更新的参数（小梯度），学习率则相对增大。这相当于给了每个参数一个动态的学习率缩放因子，非常适合处理稀疏特征和多头模型中不同层之间的梯度尺度差异。

    两者结合，使 Adam 既具备动量法的快速收敛优势，又拥有 RMSprop 的逐参数自适应能力，是 Transformer 训练中不二的默认选择。


content:
  prompt: 在大规模集群训练中，如何实现高效的检查点保存和恢复？有什么最佳实践？
answer:
  mode: rubric
  reference_answer: |-
    大规模训练中，检查点保存巨大（数十 GB 至 TB 级别），需要高效且容错。

    - 分布式原子保存：每个 GPU 仅保存自己分片的那部分模型参数和优化器状态，而不是完整模型，减少单卡 I/O。使用 DeepSpeed 或 Megatron 的分布式 checkpoint 格式。

    - 异步写入：计算与磁盘写入重叠，利用独立的 CUDA Stream 或 CPU 线程。

    - 快速存储：使用高速共享存储（如 NVMe SSD 集群、Lustre、GPFS），或本地 NVMe + 后台上传。

    - 增量保存：仅保存自上次 checkpoint 之后的参数变化（难度较大，现仍多全量保存）。

    - 恢复流程：确保所有分片文件就绪，需要时每卡读取自己分片，并验证分片一致性。

    - Warm 重启：恢复时不仅要加载模型参数，还要恢复优化器状态、学习率调度器、数据迭代器状态，以精确复现训练。

    - 监控和自动故障恢复：结合集群调度器，在节点故障时自动从最近检查点恢复，利用弹性训练动态调整 GPU 数量。

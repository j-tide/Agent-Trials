content:
  prompt: 在训练大模型时，发现 loss 突然变为 NaN，可能的原因有哪些？优化器层面如何排查？
answer:
  mode: rubric
  reference_answer: |-
    可能原因：

    - 学习率过高：导致参数更新过大，激活值或权重溢出 FP16/BF16 范围。

    - 梯度爆炸：深层网络梯度范数过大，未有效裁剪。

    - 数值不稳定操作：如注意力 softmax 前未缩放或缩放不当；分母为零的除零错误；FP16 混合精度下溢出。

    - 数据问题：输入中存在 NaN 或 Inf 值；极端文本（如超长序列、乱码）。

    - 模型权重初始化不当：初始权重过大或过小。

    - 优化器状态损坏：Adam 的二阶矩累积了异常梯度，导致学习率缩放后变为 Inf。

    优化器层面排查：

    - 检查梯度范数：在更新前记录梯度的 L2 范数，若突然爆增，则是梯度爆炸。

    - 监控学习率：结合 warmup 和衰减，确保学习率不会突然跳跃。

    - 检查 Adam 的一阶矩和二阶矩：可以查看动量值的统计，若出现 NaN 或 Inf，则说明优化器已污染。

    - 尝试回滚：保存 NaN 前的 checkpoint，降低学习率或增大梯度裁剪阈值后从该点继续训练。

    - 降低混合精度损失：若使用 FP16，开启 loss scaling 并监控缩放因子，或改用 BF16。


content:
  prompt: 在启用梯度检查点时，哪些中间结果必须保留，哪些可以丢弃再重计算？如何实现最小重计算策略？
answer:
  mode: rubric
  reference_answer: |-
    - 必须保留：每个检查点段的输入激活（即该 Transformer 层的输入张量）。这是重计算该段的起点。此外，如果使用 Pre-LN 架构，LayerNorm 的输入通常也是检查点，因为 LayerNorm 的输出是由输入计算出的，可以重算。

    - 可以丢弃再重计算：段内所有的中间激活，包括注意力计算中的 Q, K, V 映射结果、注意力概率矩阵、softmax 前的 logits、FFN 的隐层输出等。

    最小重计算策略：以每个 Transformer 层为一个检查点段。前向时只保存该层的输入张量（即上一层的输出 + 残差连接）。反向传播到该层时，从该输入张量开始，重新进行该层的前向计算（包括 LayerNorm、自注意力、FFN、残差相加），得到所有需要的中间激活，进而计算梯度。这种整层重计算方式内存节省最大，重计算量约等于额外一次前向。如果希望减少重计算开销，可以在层内更细粒度设置检查点，但实现复杂且内存节省不多，实践中较少采用。

content:
  prompt: 在给定总批大小和硬件的情况下，如何最大化模型规模？哪些并行和显存优化是必选项？
answer:
  mode: rubric
  reference_answer: |-
    为了在有限硬件（例如 8 张 A100 80GB）上训练尽可能大的模型，需综合应用：

    必选项：

    - 梯度检查点：大幅减少激活内存，几乎零额外通信，是首要手段。

    - 混合精度训练（BF16/FP16）：参数/梯度内存减半，加速计算。

    - ZeRO 优化：

    根据模型规模可能需要的并行：

    - 张量并行（Tensor Parallelism）：当单层参数太大，即使 ZeRO-3 分片也无法装入单卡时，使用张量并行将层内矩阵切分到多卡。配合 ZeRO-3 使用。

    - 流水线并行（Pipeline Parallelism）：将不同层分配到不同设备，结合微批次流水线减少气泡。可与 ZeRO 和张量并行组成 3D 并行。

    最大化规模的策略：

    - 启用 BF16 + 梯度检查点 + ZeRO-3，这是最高效的显存压缩组合。

    - 如果 ZeRO-3 仍不足，加入张量并行（如 Megatron-LM 模式）。

    - 在分布式集群中，优先利用数据并行维度上的 ZeRO，因为它通信量相对较小。

    - 对于超大模型（如 100B+），采用 3D 混合并行：张量并行 + 流水线并行 + 数据并行（含 ZeRO）。

    通过上述组合，可以在有限的硬件上训练远超单卡容量的模型。例如，使用 8 张 A100 80GB 即可训练 LLaMA-7B，甚至 13B 或 70B 若结合适当的并行和显存优化。

    - ZeRO-1（分片优化器状态）可节省大量显存，配合上述两项已能训练 7B 以上模型。

    - ZeRO-2（分片梯度）进一步节省。

    - ZeRO-3（分片模型参数）几乎将显存占用均分到所有卡，允许训练接近总显存之和的模型。

content:
  prompt: 为什么有时候训练到一个 epoch 后期，损失反而上升？可能的原因有哪些？
answer:
  mode: rubric
  reference_answer: |-
    训练后期损失上升，通常不是正常的过拟合表现，而是存在更深层的问题：

    - 学习率衰减不当：学习率衰减得过早或过快，导致模型在尚未收敛到最优区域时就停止了有效更新。后续训练只能在有限的参数空间内震荡，损失上升。如果衰减太快，模型可能无法继续沿着梯度方向下降。

    - 过拟合：在训练集上损失下降，但在验证集上损失上升。如果在训练集上损失也上升，那通常不是单纯的过拟合，而更可能是其他问题。

    - 数据问题：训练数据在 epoch 后期出现了质量较差的样本（如果数据未随机打乱，某些特定类型的样本集中在 epoch 末尾）。

    - 优化器状态不稳定：Adam 的二阶矩在训练后期可能因为累积了历史上的大梯度而变得异常大，导致有效学习率被过度缩小，模型更新量几乎为零，损失由于数值波动而微幅上升。

    - 梯度噪声：在接近收敛时，梯度的信噪比下降，随机的参数更新可能使损失小幅波动，但不会持续大幅上升。

    排查时，应首先区分是否在训练集上上升。如果是，检查学习率衰减策略和数据顺序，并监控优化器状态。如果不是，则是过拟合，应增加正则化。

content:
  prompt: 为什么深层的 Transformer 在训练初期容易出现梯度爆炸或消失？初始化如何帮助？
answer:
  mode: rubric
  reference_answer: |-
    深层 Transformer 由多个残差块堆叠而成，每个残差块内包含自注意力和 FFN 两个子层。在训练初期，权重是随机初始化的，信号的传播极不稳定。

    梯度爆炸和消失的根源：在反向传播时，梯度需要从最后一层逐层回传。每经过一个子层，梯度都会被该层的雅可比矩阵相乘。如果大部分层的雅可比矩阵的谱半径（最大奇异值）大于 1，梯度就会指数级放大（爆炸）；如果小于 1，梯度就会指数级衰减（消失）。在标准 Transformer 的随机初始状态下，不同层的谱半径分布不均，既可能大于 1 也可能小于 1，这使得深层网络在初期极易出现极端的梯度值。

    初始化如何帮助：初始化的目标是在训练初期让每一层的前向激活方差和反向梯度方差都保持恒定，避免信号在层间放大或缩小。Xavier 初始化假设激活函数是线性或 Tanh，将权重初始化为方差与输入输出维度之和成反比的分布。Kaiming 初始化针对 ReLU 类激活的修正版本。在 Transformer 中，由于残差连接的存在，信号传播的动力学有所不同——残差分支本身是恒等映射，不需要特殊初始化，因此重点是控制子层内部各线性变换的方差，使得子层的输出相对于其输入不会过大或过小。现代 Transformer 通常对 QKV 投影和 FFN 的第一层采用标准初始化的修正版，而对残差分支的最后一层（如注意力输出投影和 FFN 的第二层）采用较小的初始化，使得初始阶段每个子层的输出很小，网络行为接近恒等映射。DeepNet 等方案更是将这种思想系统化，通过理论推导为每层设置缩放因子，保证信号的平稳传播。

content:
  prompt: 如果使用 ZeRO-3，模型参数被分片，前向和反向传播时如何获取完整参数？
answer:
  mode: rubric
  reference_answer: 在 ZeRO-3 中，每张 GPU 只持有一层或一部分参数的切片。前向传播时，当需要计算某一层的输出时，该层的所有参数切片会通过
    AllGather 通信操作从各 GPU 聚集到每张卡的临时缓冲区，形成完整参数，完成该层计算后，临时缓冲区被释放，只保留自己负责的切片。反向传播同理，需要完整参数来计算梯度，因此再次进行
    AllGather。计算完当前层的梯度后，通过 ReduceScatter 将梯度分片，每张卡只保留自己负责的那部分梯度的聚合结果，用于更新自己持有的参数分片。这种“
    gather → compute → discard → scatter”的模式，确保了任何时刻每张卡上只有当前层的完整参数，大大节省了显存。

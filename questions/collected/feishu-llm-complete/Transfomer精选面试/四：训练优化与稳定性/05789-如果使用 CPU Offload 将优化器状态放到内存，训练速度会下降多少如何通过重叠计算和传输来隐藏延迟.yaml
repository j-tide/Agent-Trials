content:
  prompt: 如果使用 CPU Offload 将优化器状态放到内存，训练速度会下降多少？如何通过重叠计算和传输来隐藏延迟？
answer:
  mode: rubric
  reference_answer: |-
    典型下降 20%-50%，取决于 PCIe 带宽和模型大小。重计算可以通过设计高效的流水线来隐藏延迟：

    - 异步传输：使用 CUDA Stream 将优化器状态的读写操作与 GPU 上的前向/反向计算重叠。例如，在当前层计算时，预取下一层所需的优化器状态到 GPU，同时将当前层更新后的状态异步写回 CPU。

    - 合并小数据块：优化器状态按层组织，每次传输整层状态而非逐参数，减少传输次数。

    - 利用 DeepSpeed ZeRO-Offload 的优化策略：它精心安排了数据在 CPU 和 GPU 之间的驻留位置，将计算密集的操作（如梯度更新）放在 CPU 上执行（因为优化器更新计算量小），而 GPU 专注于大矩阵乘法，并通过多级延迟隐藏技术将通信开销降到最低。

content:
  prompt: 激活值重计算（Activation Recomputation）与梯度检查点有什么区别？是同一件事吗？
answer:
  mode: rubric
  reference_answer: 是同一件事的不同称呼。两者都指在反向传播时，不保存全部中间激活，而是通过从检查点重新前向计算来获取所需的激活值。在 PyTorch
    中，通常使用 torch.utils.checkpoint 来实现。有时“激活值重计算”更特指只重计算激活值而保留其他（如权重），与选择性检查点（selective
    checkpointing）同义。在本语境下，二者等同。

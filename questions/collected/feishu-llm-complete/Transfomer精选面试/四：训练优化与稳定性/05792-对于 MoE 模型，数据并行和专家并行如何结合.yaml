content:
  prompt: 对于 MoE 模型，数据并行和专家并行如何结合？
answer:
  mode: rubric
  reference_answer: |-
    MoE（Mixture of Experts）模型中，FFN 层被多个专家替换，每个 token 通过路由器（gating）被分配到少数几个专家。

    - 专家并行（Expert Parallelism）：将不同的专家分布在不同的 GPU 上。输入 token 根据路由结果，通过 AllToAll 通信发送到对应的专家所在 GPU 进行计算，输出后再通过 AllToAll 返回。这本质上是将专家维度进行切分。

    - 数据并行：处理非专家部分（如注意力层）以及不同输入样本。通常与专家并行组合。

    组合方式：模型副本之间采用数据并行，每个副本内部对专家使用专家并行。例如，8 张 GPU，分成 2 个数据并行组（每组 4 张），每组内 4 张 GPU 进行专家并行，即每个专家被放置在一张卡上，全组 4 张卡共同拥有所有专家。训练时，数据并行组独立处理不同批次，组内专家并行进行 AllToAll 通信。

    这种结合有效扩展了 MoE 的训练规模，平衡了通信与计算。

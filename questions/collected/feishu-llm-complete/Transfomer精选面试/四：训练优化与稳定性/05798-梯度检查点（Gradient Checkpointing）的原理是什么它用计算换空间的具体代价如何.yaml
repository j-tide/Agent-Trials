content:
  prompt: 梯度检查点（Gradient Checkpointing）的原理是什么？它用计算换空间的具体代价如何？
answer:
  mode: rubric
  reference_answer: |-
    梯度检查点是一种以计算换内存的技术。在标准反向传播中，需要保存前向传播的所有中间激活值，以便在反向时计算梯度。对于深层网络，这些激活值的显存占用可能极大（尤其是注意力矩阵）。梯度检查点会选择性丢弃某些中间激活值，在反向传播需要时，再通过从最近的检查点重新进行前向计算来恢复这些激活值。

    具体实现：将网络划分为若干段（checkpoint segments）。前向传播时，只保留每个段的输入激活（检查点），段内部的中间激活全部丢弃。反向传播到某段时，从该段的输入激活出发，重新执行该段的前向计算，得到所需的中间激活，进而计算该段的梯度。这样，内存占用从存储所有中间激活降低为仅存储检查点激活，但代价是需要额外的重计算。

    代价：重计算引入约 33% 的额外前向计算量（对于 Transformer，通常对每个 Transformer 层设置检查点，重计算一整层）。对于大模型，这部分的计算开销相对于整体训练是值得的，因为它可以释放大量显存，从而允许更大的批次或更长的序列。

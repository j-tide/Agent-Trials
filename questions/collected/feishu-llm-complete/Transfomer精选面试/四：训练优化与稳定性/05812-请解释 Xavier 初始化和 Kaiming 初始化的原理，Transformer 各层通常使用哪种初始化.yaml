content:
  prompt: 请解释 Xavier 初始化和 Kaiming 初始化的原理，Transformer 各层通常使用哪种初始化？
answer:
  mode: rubric
  reference_answer: |-
    Xavier 初始化（Glorot 初始化）的出发点是：对于没有非线性或使用 Tanh 的网络，希望前向传播时每层激活值的方差保持一致，反向传播时梯度的方差也保持一致。为此，权重应从均值为 0、方差为 2fan_in+fan_outfan_in+fan_out2 的分布中采样，其中 fan_in 是输入维度，fan_out 是输出维度。这个方差使得在前向和反向传播中信号的尺度保持平衡。

    Kaiming 初始化（He 初始化）专门针对 ReLU 类激活函数。ReLU 会将负半轴的输入清零，相当于丢弃了一半的方差。为了补偿，Kaiming 初始化将权重的方差扩大为 2fan_infan_in2（仅考虑前向）或 2fan_outfan_out2（仅考虑反向）。对于标准 Transformer 的 FFN，中间层的激活函数（GELU、ReLU 等）与 ReLU 类似，因此 FFN 的第一层常采用 Kaiming 初始化或其变体（如对 GELU 校正的版本）。

    Transformer 各层的实践：由于 Transformer 有残差连接，子层的输出并非直接传递到下一层，而是与原输入相加。因此，子层内部的初始化策略需要保证该子层的输出方差相对于输入较小，而不是恰好等于 1。对于注意力层的 QKV 投影和 FFN 的第一层，通常采用标准初始化（Xavier 或 Kaiming，具体取决于激活函数），这些层的输出方差被设为 1 左右。而对于残差分支最后的线性层（注意力输出投影和 FFN 第二层），通常使用较小的初始化，比如从均值为零、标准差为 12⋅layers⋅fan_in2⋅layers⋅fan_in1 的分布中采样，甚至初始化为零。这确保训练开始时模型接近恒等映射，极大地提升了训练稳定性。GPT 系列和 BERT 等模型的具体初始化参数经过精心调优，本质思想相同。

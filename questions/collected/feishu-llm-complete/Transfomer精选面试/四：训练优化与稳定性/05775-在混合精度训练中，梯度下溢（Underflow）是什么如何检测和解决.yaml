content:
  prompt: 在混合精度训练中，梯度下溢（Underflow）是什么？如何检测和解决？
answer:
  mode: rubric
  reference_answer: |-
    梯度下溢指的是在反向传播时，某些梯度值太小，小于当前浮点格式能表示的最小正规数，导致在 FP16 下被截断为 0。当梯度变为 0 后，相应的参数就无法更新，模型学习停滞或偏向次优解。FP16 能表示的最小正规数约为 6×10⁻⁸，而训练中许多梯度（尤其是深层网络传播到浅层的梯度）可能远小于此值。

    检测：通过梯度直方图查看梯度值分布。如果大量梯度值恰好为 0，而对应的 FP32 主副本中的梯度不为 0，即可确认下溢。也可以检查损失是否停止下降而 FP32 的梯度仍然健康。

    解决：

    - Loss Scaling：这是最主要的解决方案。将损失放大，梯度随之放大，从而被推入 FP16 的可表示范围。动态损失缩放自动完成这一过程。

    - 切换到 BF16：BF16 的动态范围与 FP32 相同，几乎不会有下溢问题，是现代大模型训练的首选。

    - 关键操作保持 FP32：对易出现下溢的操作（如 softmax、LayerNorm）强制使用 FP32。

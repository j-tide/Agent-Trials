content:
  prompt: 为什么 Transformer 训练对学习率非常敏感？有哪些常见的调节策略？
answer:
  mode: rubric
  reference_answer: |-
    敏感的原因：

    - 复杂的参数尺度：Transformer 的不同组件（注意力、FFN、嵌入层）对学习率的容忍度不同。注意力矩阵对学习率尤其敏感，过大的学习率会导致注意力分布崩塌。

    - 残差连接与梯度尺度：残差连接使得层间梯度可以直接流动，但也可能导致深层梯度爆炸。学习率必须精心匹配每一层的响应。

    - 批大小与学习率的耦合：在 Adam 等自适应优化器中，有效步长不仅依赖于学习率，还依赖于二阶矩的累积。这增加了调参的复杂性。

    - 训练早期的脆弱性：如上所述，初始阶段的不稳定要求非常保守的学习率起步。

    调节策略：

    - 使用 Adam/AdamW：自适应学习率缓解了手动为每层设置学习率的问题。

    - Warmup：必不可少，为初始训练提供稳定环境。

    - 学习率调度：余弦衰减或线性衰减，让学习率平稳下降。

    - 层自适应学习率：对底层使用更小的学习率，顶层使用更大的学习率（如 LLaMA 的做法，通过梯度范数调整）。

    - 梯度裁剪：配合使用，防止单步更新过大。

    - 小批量正态化：使用 Pre-Norm 架构（如 Pre-LN Transformer），相比 Post-Norm 对学习率更鲁棒。


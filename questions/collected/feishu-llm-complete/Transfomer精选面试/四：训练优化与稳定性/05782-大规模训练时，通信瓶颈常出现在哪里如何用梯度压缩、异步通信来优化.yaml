content:
  prompt: 大规模训练时，通信瓶颈常出现在哪里？如何用梯度压缩、异步通信来优化？
answer:
  mode: rubric
  reference_answer: |-
    通信瓶颈：

    - 数据并行中的 AllReduce 梯度同步，当模型参数量巨大时，每步需传输梯度，跨节点网络带宽成为瓶颈。

    - 张量并行中的 AllReduce 激活值，频率高，对节点内带宽要求极高。

    - 流水线并行的点对点激活传输，跨节点时带宽需求也大。

    优化方法：

    - 梯度压缩：通过量化（如 1-bit Adam）、稀疏化（只传输重要梯度）或低秩压缩（PowerSGD）来减少通信数据量。例如，将梯度从 FP32 压缩到 1-bit 符号，极大降低带宽。

    - 通信与计算重叠：利用 CUDA Stream，在反向计算的同时进行梯度通信，或在流水线中发送激活时同时计算。例如，DDP 的梯度 AllReduce 可以做到部分与反向传播重叠。

    - 异步通信：允许各 GPU 的参数更新存在一定延迟（异步 SGD），不再等待全局同步，但可能影响收敛。

    - 使用高速互联：节点内用 NVLink/NVSwitch，节点间用 InfiniBand 并启用 GPUDirect RDMA，避免 CPU 参与。

    - 结合 ZeRO：使用 ZeRO-1/2 时，ReduceScatter 和 AllGather 代替 AllReduce，通信量稍有增加但更利于分片。

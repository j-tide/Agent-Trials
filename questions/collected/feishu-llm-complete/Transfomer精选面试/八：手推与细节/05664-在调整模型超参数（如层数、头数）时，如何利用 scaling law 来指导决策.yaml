content:
  prompt: 在调整模型超参数（如层数、头数）时，如何利用 scaling law 来指导决策？
answer:
  mode: rubric
  reference_answer: |-
    Scaling Law（如 Kaplan 定律、Chinchilla 定律）描述了模型性能与参数量 N、训练数据量 D、计算量 C 之间的幂律关系。利用它指导超参数选择：

    - 确定计算预算 C（如 1e21 FLOPs）。

    - 根据定律估算最优模型大小 N_opt 和最优训练 token 数 D_opt。例如 Chinchilla 给出 N_opt ∝ C^0.5, D_opt ∝ C^0.5，即参数与数据应等比缩放。

    - 在确定 N_opt 后，需将总参数分配到层数 L、头数、维度 d 等。此时需参考已有架构的分配比例（如常见模型中 d 与 L 的关系：d ≈ √(N/L) 近似固定宽深比）。可基于前人消融实验或 Neural Architecture Search 确定具体形状。

    - 若受限于推理延迟，需牺牲一些性能降低模型大小，增加数据量保持性能？scaling law 可估算出给定更小参数下所需的最优数据量，以及预期损失的下限，帮助做出量化取舍。

    - 微调超参数时，可固定总参数量和训练数据，在几个备选配置（如不同 L/d 比例）上小规模实验，拟合局部 scaling 曲线，选择验证损失最小者。

    - 注意区分“计算最优”与“推理最优”：推理成本与参数量、层数有关，scaling law 可外推到更大模型，预测性能，结合推理成本选择性价比最高的配置。


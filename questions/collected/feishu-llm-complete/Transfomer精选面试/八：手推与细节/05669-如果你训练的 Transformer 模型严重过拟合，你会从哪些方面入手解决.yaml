content:
  prompt: 如果你训练的 Transformer 模型严重过拟合，你会从哪些方面入手解决？
answer:
  mode: rubric
  reference_answer: |-
    过拟合意味着模型在训练集上表现极好，但在验证集/测试集上表现差，本质是学到了训练集中的噪声和特定模式而缺乏泛化能力。可以从以下几个层面系统性地解决：

    - 数据增强与预处理

    - 增加数据量：收集更多标注或利用数据增强技术，如同义词替换、回译、随机遮蔽、句子重排、对抗样本生成等。

    - 更严格的数据清洗：移除重复样本、错误标注，降低训练集中的噪声。

    - 使用正则化手段如 标签平滑，避免模型对训练标签过度自信。

    - 模型复杂度控制

    - 减少模型参数量：降低层数、头数或隐藏维度，使用更小规模的模型。

    - 增加 Dropout：在注意力权重、FFN 隐藏层、嵌入层等位置增加或调大 Dropout 概率，防止神经元共适应。

    - 结构剪枝或蒸馏：用预训练大模型指导小模型学习，保留核心能力。

    - 训练策略与超参数

    - 早停（Early Stopping）：监控验证集指标，当验证损失不再下降时停止训练，使用最佳检查点。

    - 降低学习率或使用更强的学习率衰减（余弦退火、线性衰减），使模型在后期更精细地收敛。

    - 增大 batch size（一定程度上可引入噪声的正则化效果，但需协调学习率）。

    - 权重衰减（L2 正则化）：增加 weight decay 系数，约束权重规模。

    - 对注意力权重应用 Dropout，可以弱化特定 token 对的依赖。

    - 训练目标与损失函数

    - 引入对比损失、蒸馏损失等辅助任务，给模型更多监督信号，防止单一损失过拟合。

    - 在预训练时使用更难的掩码策略（如 Span Masking、动态掩码），增加训练任务难度。

    - 交叉验证与集成

    - 使用 k 折交叉验证确保评估稳定性。

    - 模型集成（多个种子、不同架构）平均输出，可减少单个模型的过拟合倾向。

    综合来看，最直接有效的方式是 增加数据多样性 + 适当的正则化（Dropout + 权重衰减） + 早停。


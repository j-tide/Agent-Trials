content:
  prompt: 模型在测试集 A 上好，但在测试集 B 上差，如何分析是过拟合还是领域偏移？设计对比实验。
answer:
  mode: rubric
  reference_answer: |-
    判定步骤

    - 检查训练集与 A、B 的重叠：计算训练集与 A/B 的 n-gram 重叠率、文档相似度。若 A 与训练集高度重叠，而 B 无明显重叠，很可能是领域偏移（分布不一致）而非过拟合。

    - 观察训练/验证曲线：若训练过程中，A 集性能持续提升而 B 集性能先升后降，且 B 集与验证集趋势一致，则偏向过拟合；若 B 从一开始就表现差，且不随训练改善，更可能是领域差异。

    - 采样分析：随机抽取 A 和 B 中样本，人工观察它们与训练数据的风格、主题、词汇差异。若 B 的语言结构、实体类型完全不同，为领域偏移。

    对比实验设计

    - 跨评估集泛化实验：在训练集上训练模型，分别在 A、B 以及两者混合的测试集上评估。同时，使用简单基线（如 TF-IDF+LR）在 A 和 B 上测试，若基线在 A、B 差距同样大，说明数据本身可分性不同（B 更难），不完全是模型问题。

    - 领域对抗实验：固定训练数据（来源领域 D_train）。测试集 A 与 D_train 同分布，B 不同分布。额外构造一个与 D_train 不同分布但无标签的新测试集 C，若模型在 B 和 C 都差，确认为领域偏移。

    - 正则化与训练策略对比：

    - 跨领域微调实验：使用预训练模型在 A 域数据上微调得到 M_A，在少量 B 域数据上微调得到 M_B。对比 M_A 与 M_B 在 B 测试集上的性能。若 M_B 大幅优于 M_A，说明存在领域偏移，而模型有能力迁移但缺乏 B 域训练。

    通过以上多维度对比，即可区分是训练过度导致泛化差，还是分布根本不同。


content:
  prompt: 如果要复现一篇论文中的 Transformer 模型，但缺少关键超参数，你会如何逆向推断？
answer:
  mode: rubric
  reference_answer: |-
    缺少的超参数可能包括：学习率、batch size、warmup 步数、dropout、权重衰减、优化器参数（β1,β2）、层数、头数、FFN 维度、序列长度、tokenizer 细节等。

    - 从论文文本和附录寻找线索：仔细阅读实验设置部分，可能部分参数被提及；查看图表（学习率曲线图）；看开源代码（如果有引用仓库）。

    - 根据硬件和规模推断 batch size：若论文提到使用了多少 GPU，训练了多少小时，模型大小，可结合当时典型吞吐大致估算全局 batch size。也可通过模型大小和显存限制反推可能的 batch size。

    - 学习率推断：通常与 batch size 相关。常见预训练 BERT 类 lr 1e-4, GPT 类 3e-4～6e-4。根据论文模型大小和 batch size，参考同期工作设定。可以使用 linear scaling rule 由标准配置推导。

    - dropout / weight decay：常见值如 dropout 0.1, weight decay 0.01。如果论文未提，可能是默认值。可查阅作者其他论文或同期模型惯例。

    - 模型结构超参数：层数、维度、头数通常会被给出。若无，可根据参数量范围大致假设：例如 6 层 768 为 BERT-base，12 层 768 为 BERT-large 等。但需结合论文上下文（年代、任务）猜测。

    - 数值实验反推：搭建可调节的框架，在类似的数据集上做小规模 grid search，使得训练曲线（loss 下降速度、最终性能）与论文报告值匹配。尤其注意 loss 曲线的形状。例如，如果论文显示 loss 在 10k steps 内下降到某个值，可以调 lr 使自己在相同数据上达到类似值。

    - 联系作者：如果条件允许，发邮件询问或在该论文的 GitHub issue 提问，这是最直接的方式。

    - 复现的最终验证：用推断出的超参数训练，若能达到论文报告的性能指标（或在其误差范围内），则推断基本正确；否则继续微调关键超参数。

    在逆向过程中，保持详细的实验记录，每次只变一个关键参数，逐步逼近原文设置。


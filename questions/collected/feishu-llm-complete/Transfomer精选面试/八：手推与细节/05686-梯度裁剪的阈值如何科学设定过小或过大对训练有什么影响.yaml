content:
  prompt: 梯度裁剪的阈值如何科学设定？过小或过大对训练有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    梯度裁剪通过限制全局梯度范数（如 L2 范数）来防止梯度爆炸。阈值通常通过监控初始训练步的梯度范数分布来设定，选择一个略高于正常梯度范数的值，例如取正常梯度范数的 90 百分位数。经验值如 1.0, 5.0 等也常被使用。阈值过小：频繁裁剪会改变梯度方向，削弱有效更新，导致收敛变慢或最终性能下降。阈值过大：无法有效阻止爆炸，可能仍出现训练崩溃。科学设定需结合模型和数据，进行小范围 grid search，观察损失稳定性和最终困惑度。


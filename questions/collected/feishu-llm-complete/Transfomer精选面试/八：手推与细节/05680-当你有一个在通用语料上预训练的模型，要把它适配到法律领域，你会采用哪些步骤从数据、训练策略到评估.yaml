content:
  prompt: 当你有一个在通用语料上预训练的模型，要把它适配到法律领域，你会采用哪些步骤？从数据、训练策略到评估。
answer:
  mode: rubric
  reference_answer: |-
    数据准备

    - 收集法律语料：获取大量高质量的原始法律文本，包括法律法规、司法解释、判决文书、合同范本、法学专著、法律新闻等。确保数据时效性和地域性符合目标（如中国法律、美国法律）。

    - 清洗与去重：去除格式混乱、乱码、重复段落、非法律夹杂内容。使用 MinHash 或 SimHash 进行文档级去重。

    - 构造预训练数据：可将长文档直接作为无监督语料进行继续预训练（continual pretraining）。同时，对于结构化数据（如判决书），可提取“法院认为”“本院查明”等关键字段，构造分类或阅读理解监督任务。

    - 监督指令数据（用于微调）：为适应实际法律应用，构建法律问答、摘要、要素抽取、争议焦点分析等指令数据。可基于法规条款生成问答对（将条款转换为问题），利用已有裁判文书提炼问题与答案。也可让法律专业人员少量标注高质量 seed data，再用模型自我迭代（self-instruct）扩充。

    训练策略

    - 继续预训练（domain-adaptive pretraining）：

    - 多任务微调：

    - 强化学习对齐（可选）：若需生成严谨的法律文书，可使用 RLHF/DPO，让专业律师对模型输出进行质量排序，训练 reward model 并优化模型，提升法律事实准确性、逻辑严谨性和格式规范性。

    评估

    - 自动指标：

    - 法律专业评测基准：如 LawBench、LexGLUE、LawGPT 相关测试集，覆盖法律推理、阅读理解、分类等。

    - 人工评估：由法律专家对模型生成的法律意见、合同条款、案例分析进行准确性（法条引用是否正确）、逻辑性、无幻觉率的评判。

    - 一致性与安全性：检查在不同表述下是否输出一致的法律结论，是否存在违法或违背公序良俗的内容。

    迭代优化

    根据评估反馈，收集 hard cases，扩充训练数据，尤其侧重模型易错的法律概念和长尾场景，再进行下一轮训练。


content:
  prompt: 解释为什么在微调大模型时，LoRA 等方法的梯度更新只集中在少量参数上，而不会影响其他层。
answer:
  mode: rubric
  reference_answer: |-
    LoRA 在原始权重矩阵旁引入低秩适配器 A⋅B，其中 A,B 维度很小。微调时，原始权重冻结，只优化 A,B。前向时，h=Wx+(BA)x，梯度计算时，由于 W 冻结，损失对 W 的梯度不用于更新，只有对 A,BA,B 的梯度被计算并更新。因此梯度更新仅集中在 LoRA 引入的少量参数上。其他层如果也插入 LoRA，则各自更新各自的适配器参数，不影响原始权重。这种方式大幅减少了可训练参数，降低了通信和存储成本。


content:
  prompt: 在推理部署中，发现模型的性能（如准确率）比离线测试低很多，如何逐步定位原因？
answer:
  mode: rubric
  reference_answer: |-
    当线上实际表现明显弱于离线测试时，需沿整个链路排查：

    - 确认评估一致性

    - 检查模型导出与转换

    - 检查推理配置

    - 检查数据预处理

    - 线上环境特殊因素

    - 外部依赖问题

    定位流程：抓取一组线上请求和对应的离线输出，逐一比对差异。通过消融实验（如关闭 RAG、固定采样种子、使用原始 PyTorch 模型直接推理相同请求）逐步缩小范围，最终精确定位到具体环节。

    - 学习率过大：可能导致 loss 震荡或发散；过小则收敛极慢。可画学习率-损失曲线寻找合适范围。

    - 学习率调度器设置不当：warmup 步数太少或过多，衰减过于激进。

    - batch size 过小可能造成梯度噪声太大，难以收敛；过大可能导致泛化差或停滞。

    - 优化器选择：尝试从 AdamW 切换到 SGD，或调整 β1, β2, ε 等参数。

    - 权重衰减过大可能压制模型学习能力；过小则无正则化。

    - 损失函数实现错误（如使用 CrossEntropyLoss 时 logits 未转概率，或减少了对填充 token 的掩码）。

    - 检查混合精度是否导致梯度下溢，可关闭 AMP 测试。

    - 确认梯度裁剪阈值是否过小，导致有效梯度被截断。

    - 在硬件允许范围内，尽量使用较大的 batch size，配合对应的线性缩放学习率，可提高吞吐量，减少 epoch 数。

    - 但过大的 batch size 可能导致“泛化差距”（sharp minima），需要配合 warmup 和适当正则化。

    - 对于小 batch，学习率应较小以保证稳定性，但也可能更易逃离鞍点，泛化更好。

    - 常用策略：先用较大 batch 快速收敛到较好区域，然后减小 batch size 或降低学习率进行精细搜索。

    - 若在固定总训练 token 下，适中 batch size（如 256~1024）往往获得最佳验证损失，过大或过小都会略差。

    - 引入学习率 warmup 和余弦衰减对于稳定训练至关重要，尤其在大 batch 场景。

    - 进行 learning rate range test：线性增加 lr，观察 loss 下降最快时的 lr 范围，选择适中的值作为初始学习率。

    - 使用 AdamW 等自适应优化器时，学习率对 batch size 的敏感性低于 SGD，但仍需大致按比例调整。

    - 早停 (Early Stopping)：监控验证损失，当它在设定的 patience 个 epoch 内不创新低时停止训练，回退到最佳检查点。这是最简单有效的方法。

    - 增加正则化：如增大 Dropout、权重衰减，或使用数据增强，然后从当前最佳模型继续训练或重训。

    - 降低学习率：如果仍在微调阶段，可尝试将学习率调低 10 倍继续训练，可能会使验证损失重新下降。

    - 可稍微放宽 patience，但如果验证损失连续上升且训练损失还在下降，说明模型正在记忆训练集噪声，继续训练通常没有好处。

    - 可使用更复杂的优化器如 SAM（Sharpness-Aware Minimization）来寻找平坦极小值，但一般建议提前停止。

    - 验证集分布与训练集不同：检查验证集是否具有代表性，或存在概念漂移。

    - 学习率过大导致震荡：调低学习率可能使验证损失再次下降。

    - 使用混合精度训练（FP16/BF16 + FP32 主权重），利用 Tensor Core 加速。

    - 采用优化的注意力内核：FlashAttention-2/3，xFormers 的 memory-efficient attention。

    - 算子融合：将 LayerNorm + Dropout + Residual 等小操作融合为一个 kernel，减少启动开销。

    - 使用 NVIDIA DALI 或 CPU 预处理流水线，将数据加载与 GPU 计算重叠。

    - 启用 NCCL 通信优化（环境变量调整），使用 faster transformer 后端。

    - 梯度累积：在小 batch 无法增大时，通过累积多个 micro-batch 的梯度来模拟大 batch，减少通信频率（但在单卡效果有限）。

    - 使用更高效的优化器变体：如 LION（有报告显示可更快收敛）、或减少 Adam 状态内存来加速。

    - 使用课程学习或动态序列长度训练：初期用短序列训练，逐渐增加长度，减少前期计算量。

    - 在保证精度的情况下适当降低精度（如从 FP32 主权重换为 BF16）。

    - 使用更高效的架构：如 SwiGLU 激活、RoPE 位置编码、GQA 减少 KV 缓存、减少层数但加宽维度等，在相同计算量下获得更好性能。

    - 使用动态稀疏训练或 MoE，但仅当需要参数扩展时。

    - 数据预处理缓存：提前将文本 tokenize 并保存为数组，避免在线 tokenize 开销。

    - 提高数据读取的预取深度和 num_workers，确保 GPU 不会等待数据。

    - 减少日志打印频率和评估频率。

    - 使用 torch.compile 或 TensorRT 对模型进行即时编译优化。

    - 使用 nvidia-smi 查看功率和 SM 占用；nvtop 或 nvitop 看实时状态。

    - Profiling 工具：nsys（Nsight Systems）查看 CPU/GPU 时间线，找出 GPU 空闲段是在等待数据加载、通信还是 kernel 启动开销。

    - 检查 torch.utils.data.DataLoader 的 num_workers 是否足够，pin_memory 是否开启。如果数据预处理耗时，GPU 会经常空闲。

    - 确认是否有大量小的 kernel launch，应尝试算子融合。

    - 若使用分布式训练，查看 NCCL 通信日志，检查是否某些 GPU 在 allreduce 时等待其他卡（负载不均衡导致）。

    - 查看 batch size 是否过小，导致每次 kernel 调用未能填满 GPU 的并行能力；可尝试梯度累积增大有效 batch。

    - 检查是否误将模型部分放在 CPU 上（如 Embedding 层使用 compute on CPU），造成频繁 CPU-GPU 拷贝。

    - 数据瓶颈：增加 num_workers、使用预取和缓存、将数据提前转成 .pt 格式、升级磁盘（SSD/NVME）。

    - 计算瓶颈：增大 batch size，启用混合精度，使用 FlashAttention，调整模型架构以降低计算强度。

    - 通信瓶颈：检查网络带宽（InfiniBand/以太网），使用梯度压缩或通信计算重叠（如 Overlap）。

    - 框架层面：使用 torch.compile 或 TensorRT 进行图优化。

    - 确保没有不必要的 .item() 或 print 在训练循环中引起同步。

    - 总参数量：调整 GQA 模型的 FFN 维度或层数，使总参数量与 MHA 模型相等（因为 GQA 的 KV 投影参数更少，MHA 参数略多）。

    - 但更常见的做法：保持隐藏维度 d、层数 L、FFN 维度完全相同，只改变注意力头数与 KV 头数，这样模型参数量有微小差异，但推理时更体现实际差异。如果追求严格参数相等，可微调 d_ff 补齐。

    - 保证训练的总 FLOPs 一致？通常固定训练 token 总数即可。

    - 相同的训练数据集、tokenizer、epoch 数（或 token 数）。

    - 相同的 batch size（全局）和学习率调度（可能需要微调以使各自最优，但最好先对齐）。

    - 相同的优化器（AdamW）、warmup 步数、权重衰减、梯度裁剪阈值、混合精度设置。

    - 预训练困惑度（验证集）。

    - 下游任务微调后的性能（分类、问答等）。

    - 推理速度与内存（KV 缓存大小、吞吐）。

    - 使用相同随机种子初始化（确保可重复），但可跑多个种子取平均以减少方差。

    - 训练过程中监控 loss 曲线和困惑度。

    - 最终报告验证困惑度和若干下游任务分数，以及推理时延/KV cache 占用。

    - 进行统计显著性检验。

    - 分阶段：先冻结大部分参数，只训练新嵌入和 LM head，然后解冻所有参数全模型训练。

    - 数据混合：开始时可混入部分英文数据防止遗忘，后续逐步增大中文比例。

    - 学习率设置远低于原始预训练（如 5e-5），配合 warmup 和余弦衰减。

    - 调整 GPU 亲和性，确保 TP 组内的 GPU 位于同一 NUMA 节点并启用 P2P 访问。

    - 优化模型配置：改为 TP=2, PP=2，减少单组通信量。

    - 开启 FlashAttention 和 PagedAttention，提高计算效率和显存利用率。

    - 在推理服务中加入请求分桶，避免长短序列混合批次。

    - 在通用预训练模型基础上，使用法律语料进行持续语言模型训练（MLM 或自回归）。学习率设置为预训练阶段的 1/10~1/5，例如 5e-5，配合 warmup 和余弦衰减。

    - 数据混合：初期可混入部分通用数据（如 20%），防止灾难性遗忘；后期可全部使用法律数据。

    - 若显存或时间有限，可结合 LoRA 或 Adapter 只训练少量参数，实现高效领域适配。

    - 在多种法律任务上联合微调，如判决预测、类案匹配、要素抽取、法律问答等，共享语言知识。使用统一的文本到文本格式。

    - 对于生成任务，引入法律术语约束、法条引用正确性等辅助损失或强化学习奖励。

    - 困惑度（PPL）在法律测试集上评估语言建模能力。

    - 各个下游任务的专用指标：法规问答的准确率、F1；判决摘要的 ROUGE、BERTScore；要素抽取的 Micro-F1 等。

    - 实验组 1：加入 Dropout、权重衰减、早停等措施，观察在 A 和 B 上的变化。若过拟合，这些方法会改善 B 的性能（或减缓 B 的下降）。

    - 实验组 2：在训练集中混入少量 B 领域的无标签数据（或少量标注数据）进行领域适应，如继续预训练或微调，若 B 性能提升，说明领域偏移是主因。

    - 在内存中缓存预处理好的张量（如果数据集能放进内存），避免每次读磁盘。

    - 对于大规模语料，使用基于 tfrecord/parquet 的列存，顺序读取，预读取 chunk。

    - 使用 nvidia-smi 看所有 GPU 利用率，挂起的 GPU 往往利用率 0% 或 100%（死循环）。

    - 使用 torch.distributed.barrier() 等方法检测是否所有进程到达同步点。挂起通常是某个 rank 未到达。

    - 检查各节点日志，查看最后输出。挂起通常发生在集合通信操作（all_reduce, all_gather 等）或 DataLoader 迭代。

    - 确认各 rank 的 Python 进程是否存活，有无 OOM killed 或者段错误。

    - 若可能，attach debugger（如 py-spy、gdb）到卡住的进程，查看调用栈。对于 Python，可用 faulthandler 或 py-spy dump 看当前执行到哪行代码。

    - 检查 NCCL 环境变量：设置 NCCL_DEBUG=INFO 重新运行，查看通信日志，常见错误如网络连接失败、拓扑不匹配等。

    - 使用 torch.distributed.monitored_barrier 定制超时错误，方便定位哪个 rank 未完成。

    - NCCL 通信超时：可能是某节点网络不通或网卡故障，检查 ibstat（InfiniBand）或 ifconfig，尝试用 NCCL_SOCKET_IFNAME 指定正确接口。

    - 数据加载不均衡：某些 worker 的 DataLoader 未正确退出，导致迭代器 hang。需检查 DistributedSampler 的 epoch 设置和 num_workers 是否合理。

    - 显存不足导致进程 kill：检查系统日志 dmesg 看有无 OOM killer，或 nvidia-smi 显存满导致 CUDA 操作挂起。

    - 逻辑 bug：如 barrier 被放置在不平衡的条件分支内。确保所有 rank 执行相同次数 barrier。

    - 死锁：在使用 CUDA 流或异步拷贝时，同步错误可能导致 hang，可尝试关闭异步，使用 cuda.synchronize() 排查。

    - 启用 NCCL_TIMEOUT 和 TORCH_DISTRIBUTED_TIMEOUT 环境变量，超时后抛出异常，防止无限挂起。

    - 训练框架使用 watchdog 监测 GPU 状态，异常时自动重启。

    - 采用参数量较小的模型，如 6 层 Transformer，隐藏维度 384，头数 6。

    - 使用有限但有代表性的数据集：如 WikiText-2 或小样本下游任务（如 1% 训练数据的 GLUE 子集）。

    - 基线：标准 MHA 注意力的相同结构模型。

    - 新注意力变体：只替换注意力机制，保持其他层完全一致。

    - 模型架构：层数 L，隐藏维度 d，头数 h，FFN 维度，归一化类型（Pre-LN），位置编码方式需完全相同。

    - 训练配置：优化器、学习率、batch size、训练步数（或数据量）、warmup 策略、权重衰减、dropout 等完全一致。

    - 随机种子：可固定单个种子先观察，之后再跑多个种子看统计显著性。

    - 数据和 tokenizer：完全相同。

    - 预训练困惑度（PPL）。

    - 下游微调任务的性能（准确率/F1）。

    - 速度和内存：每步训练时间、峰值显存、推理吞吐，以评估效率和加速比。

    - 先在极小数据（如几百万 token）上训练少量步数，迅速观测 loss 下降趋势和速度。若新注意力 loss 不降甚至上升，可能实现有误。

    - 若初步有效，再扩展训练步数到完整小规模数据，比较最终 PPL 和下游性能。

    - 可结合 profiling 工具分析计算瓶颈。

    - 检查线上和离线评估的数据分布是否一致。离线测试集应尽可能模拟线上真实请求。对比线上采集的一批请求，人工评估并与离线测试集对比难度、主题、格式差异。

    - 确认评估方式：离线可能使用自动指标（如 BLEU、准确率），而线上用人工或用户反馈，两者可能不等价。需统一评价标准。

    - 比较原始训练框架（PyTorch）与线上推理引擎（TensorRT-LLM, ONNX Runtime, vLLM 等）的输出。用相同输入跑一遍，计算 logits 的差异（MSE 或余弦相似度）。差异应极小（<1e-3）。若差异大，可能是图优化、量化、或算子融合导致精度损失。

    - 特别检查注意力实现：是否使用了 FlashAttention、不同的 masking 方式，导致数值微小差异累积。

    - 检查 KV cache 实现：多轮对话中，KV cache 的存储格式、滑动窗口裁剪、或 PagedAttention 的块管理是否引入逻辑错误。

    - 解码参数：温度、top-k、top-p、重复惩罚等是否与离线测试时完全一致。不一致会导致输出分布变化。

    - 最大长度、停止 token 处理是否正确。线上可能因过早截断导致答案不完整。

    - Prompt 模板：线上服务可能包裹了额外的 system prompt 或 formatting，与离线测试不同。

    - Tokenizer 是否一致（特殊 token、BOS/EOS 处理），线上可能使用了不同的 tokenizer 版本或做了额外的清洗。

    - 输入截断策略：离线测试可能允许无限长，线上可能强制截断到固定长度，丢失关键信息。

    - 请求并发下的批处理效应：Continuous Batching 可能导致某些请求的序列被提前终止或被交换出 KV cache，影响输出。

    - 系统资源竞争：CPU/GPU 繁忙导致超时重试，可能使用了简化的快速路径。

    - 随机种子：若模型中使用了随机采样且未固定种子，不同采样结果可能影响评价，但不应导致显著准确率下降。

    - 如果线上使用了检索增强（RAG），检查检索组件的正确性、知识库的时效性。

    - 若涉及工具调用或代码执行，确保环境一致。

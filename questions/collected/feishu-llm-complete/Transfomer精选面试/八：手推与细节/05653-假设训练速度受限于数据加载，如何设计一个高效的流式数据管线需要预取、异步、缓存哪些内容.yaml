content:
  prompt: 假设训练速度受限于数据加载，如何设计一个高效的流式数据管线？需要预取、异步、缓存哪些内容？
answer:
  mode: rubric
  reference_answer: |-
    核心思路：使 GPU 永远不等待数据，CPU 端提前准备好下一批数据，并通过流水线隐藏 I/O 延迟。

    方案设计：

    - 数据集格式优化：将原始文本提前 tokenize 并保存为二进制格式（如 .npy, .bin, 或 HuggingFace arrow/parquet），避免在线分词开销。若数据过大，可采用内存映射（mmap）文件。

    - 多进程并行加载：DataLoader 设置 num_workers > 0，通常 4~8 个 worker。每个 worker 独立读取并预处理自己的 batch。确保 pin_memory=True，加速 CPU→GPU 传输。

    - 预取和重叠：设置 prefetch_factor（每个 worker 提前准备多少 batch），常用 2~4。这样在 GPU 处理当前 batch 时，CPU 已经在准备后续 batch。

    - 异步传输：使用 CUDA 流（stream），将 CPU tensor 异步拷贝到 GPU，与 GPU 计算重叠。如 PyTorch 的 non_blocking=True + cuda.Stream。

    - 缓存机制：

    - 流水线架构：可以自定义可迭代的 Dataset，内部维护缓冲队列（queue.Queue）。主线程从队列获取 batch，worker 线程不断填充。达到高吞吐。

    - 分布式共享：在多 GPU 训练中，使用 DistributedSampler 保证各卡读取不同数据。各卡都有独立 DataLoader，并行读取。

    避免瓶颈：

    - 确保硬盘 SSD/NVME 足够快，或分布式存储缓存到本地 NVME。

    - 避免复杂的在线数据增强（如大量文本替换）在 worker 中执行，尽量预处理成静态数据。

    - 若使用网络存储，考虑在每台机器上本地缓存常用数据子集，或使用 Alluxio 等分布式缓存加速读取。

    通过上述方法，可以实现接近计算瓶颈的高效数据供给，使训练吞吐大幅提升。


content:
  prompt: 解释一下梯度噪声在 Transformer 训练中的影响，大 batch 与小 batch 的梯度噪声有何不同？
answer:
  mode: rubric
  reference_answer: |-
    梯度噪声指 mini-batch 梯度相对于全数据集梯度的随机波动。适当噪声有助于逃离局部极小和鞍点，起到正则化作用，改善泛化。大 batch 训练时，梯度估计更准确，噪声小，但可能导致收敛到尖锐极小值，泛化能力下降；小 batch 噪声大，优化路径更震荡，但容易找到平坦极小值，泛化往往更好。Transformer 训练中，常需根据 batch size 调整学习率（如平方根缩放、线性缩放），并且大 batch 需要额外的稳定技巧（如 warmup、LayerNorm、更高权重衰减）。噪声过大也可能导致训练不稳定，所以实际中会动态调整 batch size 或使用梯度累积。


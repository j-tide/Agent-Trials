content:
  prompt: 如果模型在训练初期收敛很快，但不久后损失平台期，且波动大，你会调整什么超参数？
answer:
  mode: rubric
  reference_answer: |-
    这种现象通常意味着学习率过高或 batch 内梯度噪声过大，导致在损失表面难以稳定下降。可以从以下方面调整：

    - 降低学习率：当损失进入平台期且波动大时，首先尝试将学习率减小 2~5 倍，或使用学习率衰减（如 step decay、余弦退火）。初期收敛快说明学习率足够甚至偏大，后期需要更小 lr 精细搜索。

    - 增加 warmup 步数：如果初期学习率从 0 线性上升到峰值，warmup 不足可能导致前期不稳定。但若已到平台期，warmup 影响有限。

    - 增大 batch size（全局）：更大的 batch size 能提供更准确的梯度估计，降低梯度噪声方差，使更新更平稳。但需同步调整学习率（按线性缩放法则增大 lr）。若硬件不允许增大 batch，可增加梯度累积步数。

    - 调整优化器参数：对于 Adam，可降低 β2（如从 0.999 到 0.99）减少对历史梯度平方的依赖，或适当增大 ε 防止除零精度问题。但一般较少动。

    - 梯度裁剪阈值：如果波动伴随偶尔的损失尖峰，可能是梯度爆炸，需降低裁剪阈值（如从 1.0 降到 0.5）。

    - 正则化考量：若 weight decay 过大，可能限制模型容量，可尝试减小；若过小，可能发生震荡。

    - 检查数据：确认是否由于数据 shuffle 不够或存在大量相似样本，导致某些 batch 梯度方向冲突。加强数据打乱，或使用课程学习平滑训练。

    - 调整模型结构：若上述无效，可能是模型容量不足，可考虑适当增加层数或宽度，但更可能是超参数问题。

    一般优先尝试降低学习率并配合余弦衰减，往往能稳定平台期并继续收敛。


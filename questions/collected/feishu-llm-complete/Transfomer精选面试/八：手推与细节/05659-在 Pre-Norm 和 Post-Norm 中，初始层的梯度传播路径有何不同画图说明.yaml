content:
  prompt: 在 Pre-Norm 和 Post-Norm 中，初始层的梯度传播路径有何不同？画图说明。
answer:
  mode: rubric
  reference_answer: |-
    Post-Norm（原始 Transformer）：子层输出先相加残差，再归一化。

    [图片内容未导入]

    Pre-Norm：输入先归一化，再进入子层，最后残差。

    [图片内容未导入]

    梯度传播路径：

    - Post-Norm：梯度从 y 传入 LayerNorm，再分两路进入 x 和 F(x)。LayerNorm 在残差之后，会缩放整个残差分支的梯度。随着层数加深，LayerNorm 可能放大或缩小梯度，初始层的梯度需穿过许多 LayerNorm，易受缩放累积影响，造成梯度消失或爆炸。

    - Pre-Norm：梯度从 y 分两路：一路直接给 x（无任何变换），另一路进入 F(LayerNorm(x))，需先经过 F 的反向，再经过 LayerNorm 反向后才到达 x。但 x 的主路径完全不经过 LayerNorm，因此初始层能得到较为纯净的直接梯度，训练更稳定。Pre-Norm 近年来成为默认选择。

    图示：

    Post-Norm: x → [+F(x)] → LN → y

    Pre-Norm: x → LN → F → [+x] → y

    梯度图中，Post-Norm 的残差支路和子层支路汇合后共同经过 LN；Pre-Norm 的残差支路直接连接，LN 只在于层支路内。


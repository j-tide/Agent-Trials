  reference_answer: |-
    这是典型的过拟合信号。决策取决于目标和资源：

    - 若目标是最终模型的泛化能力：应立即采取措施干预，而不是无脑继续训练。

    - 若仍在实验阶段，希望观察趋势：

    - 特殊情形：

    总原则：验证损失上升即停止，并使用最佳模型。继续训练仅在有强正则化或计划做模型平均等特殊策略时才考虑。


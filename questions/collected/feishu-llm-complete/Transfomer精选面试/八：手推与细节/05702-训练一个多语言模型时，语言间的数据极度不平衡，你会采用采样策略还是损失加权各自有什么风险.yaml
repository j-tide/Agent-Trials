content:
  prompt: 训练一个多语言模型时，语言间的数据极度不平衡，你会采用采样策略还是损失加权？各自有什么风险？
answer:
  mode: rubric
  reference_answer: |-
    采样策略（数据过采样/降采样）

    - 温度采样：根据各语言数据量比例，引入一个温度参数 T，定义采样概率 pi∝(ni∑n)1/Tpi∝(∑nni)1/T。T=1 即原始分布，T>1 向低资源语言倾斜。

    - 固定阈值截断：对高资源语言设置采样上限（如英语最多采样 10 亿 token），低资源语言重复使用直至达到最低 token 数。

    - 风险：过采样低资源语言可能导致模型对它们过拟合，且重复数据降低多样性；降采样高资源语言可能浪费可用数据，损失高资源语言性能。低资源语言的生成质量可能仍因数据太少而欠佳。

    损失加权（在损失函数中对不同语言赋权重）

    - 给低资源语言的 loss 乘上一个大于 1 的权重 wlangwlang，高资源语言权重小于 1。通常取权重的倒数比例或平方根倒数。

    - 风险：权重过大会导致低资源语言产生较大梯度，干扰模型优化，可能导致整体困惑度上升，训练不稳定。且加权不改变每个语言实际看到的 token 数，模型参数更新仍由高频语言主导，低资源语言可能无法被充分学习。

    混合策略：实践中常结合使用，如温度采样控制数据分布，同时在小 batch 内对不同语言进行动态损失加权（自适应平衡）。还可配合 多任务学习，添加语言识别辅助任务，迫使模型保留语言特征。

    风险评估与选择：

    - 若极度不平衡（如高资源语言占比 90% 以上），推荐采样策略保证低资源语言有足够曝光，同时设置最大重复比例（如重复不超过 5 次）防止过拟合。

    - 若需要维护高资源语言的 SOTA 性能，可仅用采样策略稍微提升低资源比例，并辅以轻微损失加权。

    - 最终需通过验证集（每种语言独立）来监控各语言性能，决定调整方案。


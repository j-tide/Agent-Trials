content:
  prompt: 使用梯度检查点后，激活值显存大约可以减少多少倍？重计算的代价是什么？
answer:
  mode: rubric
  reference_answer: |-
    梯度检查点（Gradient Checkpointing）在训练时仅保存部分层的输入激活，其余中间激活在前向时丢弃，反向传播时再从最近的检查点重新计算前向以恢复所需激活。

    - 减少显存倍数：如果不使用检查点，需要存储所有层的激活，激活显存消耗与层数 L 成正比。使用检查点后，可以只在每 LL 层设置检查点（optimal checkpointing），使显存降低到约 O(L)O(L) 级别。通常对于普通 Transformer，激活显存可以减少 4~10 倍，具体取决于检查点策略。例如，每隔一层做检查点，可减少约一半；更激进的策略可减至 1/10。

    - 重计算代价：反向传播时，需要从最近的检查点重新前向计算被丢弃的层。这相当于增加了一次额外的正向传播。因此，总的计算量大约增加 30%~50%（如果只重算一部分层）。在最坏的情况下（每个层都只存储输入，不存储中间激活），几乎需要重算整个前向，计算量加倍。但在实践中，重计算部分约占总计算时间的 20%~30% 额外开销，却换来了显存的大幅节省，使得更大 batch 或更长序列训练成为可能。


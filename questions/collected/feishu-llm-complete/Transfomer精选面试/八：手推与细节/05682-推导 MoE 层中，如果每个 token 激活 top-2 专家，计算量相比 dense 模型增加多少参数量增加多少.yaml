content:
  prompt: 推导 MoE 层中，如果每个 token 激活 top-2 专家，计算量相比 dense 模型增加多少？参数量增加多少？
answer:
  mode: rubric
  reference_answer: |-
    假设 dense 模型的 FFN 参数量为 2⋅d⋅dff（两个矩阵，如标准 FFN）。MoE 层有 E 个专家，每个专家有相同的 FFN 结构，参数量为 E×2⋅d⋅dff。因此参数量增加了大约 E 倍（实际上与 dense FFN 相比）。

    计算量：dense 模型每个 token 计算整个 FFN。MoE 中每个 token 只激活 top-2 专家，所以每个 token 的计算量为 2 个专家的 FFN 运算。因此，每 token 的计算量是 dense 模型的 2 倍（因为 dense 是 1 个 FFN，MoE 计算 2 个专家，若专家与 dense FFN 结构完全相同）。但注意到 dense FFN 的参数量可能比单个专家大？实际上，若为了保持计算量相当，可以设置每个专家的参数量为 dense 的 1/E，但通常 MoE 保持专家大小与 dense FFN 相同，以最大化容量。这种情况下，计算量增加 2 倍，参数量增加 E 倍。总结：MoE 通过稀疏激活，以少量计算开销换取了参数量的大幅增长。


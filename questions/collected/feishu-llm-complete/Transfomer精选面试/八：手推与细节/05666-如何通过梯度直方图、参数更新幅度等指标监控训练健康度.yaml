content:
  prompt: 如何通过梯度直方图、参数更新幅度等指标监控训练健康度？
answer:
  mode: rubric
  reference_answer: |-
    - 梯度直方图：观察各层梯度的分布。正常训练时，梯度大致呈钟形，均值接近零，标准差稳定。若某层梯度突然消失（全为零）或爆炸（极大尖峰），或分布严重偏斜，说明有问题。

    - 参数更新幅度（更新范数/参数范数比）：即 ||Δw|| / ||w||，通常在 10−3 量级左右。若过大，学习率可能太高；若过小，可能学习率太低或出现梯度消失。

    - 损失曲线：训练损失和验证损失平滑下降且最终收敛。若出现震荡或上升，需检查。

    - 权重范数：应稳定增长或趋于稳定。突然增大可能梯度爆炸。

    - 激活统计：各层激活的均值、方差，帮助发现死区或饱和。

    - 学习率变化：如果使用 warmup/decay，监控学习率是否符合预期。

    使用 TensorBoard 或 Wandb 记录这些指标，可及时诊断。


content:
  prompt: 在混合精度训练中，forward 和 backward 分别用什么精度？参数 master copy 用什么精度？
answer:
  mode: rubric
  reference_answer: |-
    标准混合精度训练（AMP）：

    - Forward：FP16（或 BF16）计算前向，权重和激活使用半精度，以加速和减少显存。

    - Backward：梯度计算也使用 FP16（或 BF16），但为了避免梯度下溢，损失放大（loss scaling）技术用于 FP16；BF16 因其指数位与 FP32 相同，一般不需要 loss scaling。

    - 参数 master copy：保存 FP32 精度的模型权重，用于累积 FP16 梯度更新，确保精度和数值稳定性。优化器状态（如 Adam 的 m、v）也保持 FP32。

    总结：前向/反向计算用 FP16/BF16，主参数和优化器状态用 FP32。


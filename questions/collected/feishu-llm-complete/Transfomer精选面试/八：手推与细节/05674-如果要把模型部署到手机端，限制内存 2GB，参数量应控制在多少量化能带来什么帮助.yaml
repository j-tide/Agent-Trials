content:
  prompt: 如果要把模型部署到手机端，限制内存 2GB，参数量应控制在多少？量化能带来什么帮助？
answer:
  mode: rubric
  reference_answer: |-
    手机端 2GB 可用内存（含系统和其它应用，假设模型可用 1.5GB）。FP16 精度下每参数 2 字节，1B 参数需要 2GB，因此 FP16 下最多约 1B 参数。但还需要存储推理时的中间激活、KV 缓存等，实际应更小。如果采用 4-bit 量化（如 Q4_K），每个参数约 4 位（0.5 字节），1B 参数约 0.5GB，因此可以支持 2~3B 参数模型。此外，8-bit 量化也能将模型减小一半。量化不仅减少存储，还可能利用整数运算单元加速推理，减少内存带宽压力，使手机端运行更加流畅。结合剪枝、蒸馏等技术，可以在 2GB 内存限制下实现较好的体验。


  prompt: 如何通过调整 batch size 和学习率来改善收敛速度和最终效果？它们之间的耦合关系是什么？
answer:
  mode: rubric
  reference_answer: |-
    - 耦合关系：
    当 batch size 增大时，梯度估计更准确，方差变小。根据 线性缩放规则，学习率应与 batch size 成正比：lr = lr_base * (batch_size / base_batch_size)。这样可保持参数更新步长的期望方差大致不变，保证训练动态相似。此外，还有更精确的 平方根缩放规则 或根据噪声温度理论调整。


content:
  prompt: 在混合精度训练中，梯度缩放（Loss Scaling）如何影响梯度的反向传播？动态缩放算法如何工作？
answer:
  mode: rubric
  reference_answer: |-
    FP16 表示的范围有限，许多小梯度可能下溢为 0，导致参数得不到更新。Loss Scaling 在前向结束后将损失乘以一个大常数 S（如 65536），然后反向传播，这样所有梯度都扩大了 S 倍，小梯度得以保留在 FP16 可表示范围。在更新参数前，再将梯度除以 S，恢复到正确的尺度（但更新时可能仍用 FP32 主权重，只需在应用梯度前 descale）。

    动态缩放算法：自动调整 S。开始用较大 S，若在连续 N 次迭代中没有出现 NaN/Inf 梯度，则尝试增大 S（如乘以 2）；若出现 NaN/Inf，则跳过本次更新并减小 S（如除以 2）。这样可以在不溢出的前提下最大化缩放因子，尽量减少下溢。


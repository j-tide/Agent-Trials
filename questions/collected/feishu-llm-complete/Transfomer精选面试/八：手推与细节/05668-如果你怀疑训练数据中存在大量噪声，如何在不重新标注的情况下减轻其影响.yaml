content:
  prompt: 如果你怀疑训练数据中存在大量噪声，如何在不重新标注的情况下减轻其影响？
answer:
  mode: rubric
  reference_answer: |-
    - 鲁棒损失函数：使用对噪声不敏感的损失函数，如对称交叉熵、平均绝对误差 (MAE)、广义交叉熵、或者 label smoothing 可降低对错误标签的过拟合。

    - 重加权样本：训练过程中，利用模型在验证集上的损失或基于预测不确定性，为样本分配权重，降低高损失（可能是噪声）样本的权重。或使用课程学习：先学“简单”样本，再逐渐加入难样本。

    - 协同训练/自训练：用当前模型预测伪标签，再用置信度高的样本重新训练，或使用多个模型预测的均值作为软标签，逐步修正噪声。

    - 利用预训练鲁棒性：预训练模型往往对噪声有一定容忍度，微调时使用较小的学习率，避免破坏预训练先验。

    - 数据清洗：无需人工重标，但可自动检测异常：使用 perplexity、聚类、或现有模型找出明显错误（如分类任务中置信度很低但标签确定的样本，可能是噪声），移除或降权。

    - 知识蒸馏：训练一个学生模型，使用教师模型的软标签（概率分布）而不是硬标签，软标签包含类别间相似性，能缓解部分噪声。

    - 集成方法：训练多个模型并对输出进行平均，可平滑个别噪声影响。

    这些方法可在一定程度上提高模型对噪声的鲁棒性。


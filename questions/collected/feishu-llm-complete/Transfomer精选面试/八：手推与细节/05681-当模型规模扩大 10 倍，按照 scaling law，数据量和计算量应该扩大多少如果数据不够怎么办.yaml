content:
  prompt: 当模型规模扩大 10 倍，按照 scaling law，数据量和计算量应该扩大多少？如果数据不够怎么办？
answer:
  mode: rubric
  reference_answer: |-
    根据 Chinchilla scaling law（计算最优），参数量 NN 和训练 token 数 DD 应大致等比增长：Nopt∝C0.5Nopt∝C0.5，Dopt∝C0.5Dopt∝C0.5。因此，若模型参数量 N 扩大 10 倍，为保持计算最优，训练 token 数 D 也应扩大约 10 倍（理论上 10×10=1010×10=10 倍计算量 C）。换言之，模型扩大 10 倍，总计算量 C 需扩大约 100 倍（因为每个 token 的训练计算量约正比于 N）。所以数据量应扩大 10 倍，计算量扩大 100 倍。

    如果数据量不够（无法获得 10 倍数据）：

    - 接受“过度训练”：使用较少数据但多训几个 epoch（重复数据）。缩放定律指出，对于给定数据量 D，存在一个最佳模型大小 N_opt(D)，小于计算最优的 N。但若 N 已固定，过多 epoch 会导致过拟合。Chinchilla 论文也分析了数据受限下的缩放：在 data-constrained 场景，性能提升随重复而递减。可以适当增加正则化（dropout, weight decay）来减轻过拟合。

    - 数据增强与合成：利用已有数据生成伪数据，如同语言翻译、回译、文本改写，但需保证质量。

    - 多任务/多语言联合训练：融入其他语言或相关任务的数据，提升 token 总量。

    - 降低模型部分容量：若不需极致性能，可削减层数或维度，使模型大小匹配可用数据量，遵循最优配比。

    - 注重数据质量：高质量数据能有效降低对数量的需求，用更干净、更多样的数据替代低质量大量数据。

    - 调整训练策略：使用早停、强正则化、或先在大规模弱相关数据上预训练，再在高质量核心数据上微调。

    总之，如果数据不足，性能会偏离计算最优，但可通过质量提升和正则化尽量逼近。


content:
  prompt: 分析自回归生成中，生成 T 个 token 的总计算量，与输入长度 L 和生成长度 T 的关系。
answer:
  mode: rubric
  reference_answer: |-
    在自回归解码中，模型一次生成一个 token，输入序列长度从 L 逐步增长到 L+T-1。对于每一步 t（假设已经生成了 t-1 个 token，当前输入长度为 L + t - 1），模型需要为该序列执行一次前向传播。主要计算量来自自注意力层和 FFN 层。

    以标准 Transformer 为例，单个 token 的前向计算量与序列长度有关，因为注意力需要计算当前 token 对所有历史 token 的注意力。对于一个长度为 N 的序列，自注意力的 FLOPs 约为 8Nd2+4N2d（见前文）。但是，利用 KV 缓存后，生成阶段的每一步仅需计算最新 token 的 Q，与完整的 K、V 缓存进行注意力计算。此时，计算量如下：

    [图片内容未导入]

    因此每生成一个 token，计算量约为 O(d2+Nd)。随着生成的进行，N 从 L 增长到 L+T-1。生成 T 个 token 的总计算量是这些步骤的求和：

    [图片内容未导入]

    简言之，自回归生成 T 个 token 的总计算量与输入长度 L 成正比（第一项），并且与生成长度的平方 T2T2 成正比（第二项）。实际中由于 KV 缓存，避免了重复计算历史投影，大大加速了推理。


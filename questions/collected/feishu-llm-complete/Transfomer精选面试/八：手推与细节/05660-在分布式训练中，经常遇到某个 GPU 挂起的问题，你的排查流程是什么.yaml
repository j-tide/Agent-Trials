content:
  prompt: 在分布式训练中，经常遇到“某个 GPU 挂起”的问题，你的排查流程是什么？
answer:
  mode: rubric
  reference_answer: |-
    分布式训练中某 GPU 挂起（Hang）表现为整个训练停滞，卡在某一步不继续。排查流程：

    - 确认挂起状态

    - 收集基础信息

    - 定位阻塞点

    - 常见原因与解决

    - 预防措施

    一旦通过日志和堆栈确定是通信还是数据问题，针对性地调整网络配置或修复代码。


content:
  prompt: 模型训练中 loss 不下降，你怎么排查是数据问题、模型问题还是超参数问题？
answer:
  mode: rubric
  reference_answer: |-
    当 loss 在一开始或训练中途停止下降，需系统地排查：

    - 数据问题：

    - 检查输入和标签的对应关系，样本是否被正确打乱、预训练/微调的数据格式是否正确。

    - 查看 tokenization 是否正确，有无大量填充或无意义 token 导致信息丢失。

    - 是否存在标签错误或全部为同一类标签（如分类任务的 label 全部为 0）。

    - 尝试在极少数据（如 100 条）上过拟合测试：若能快速将 loss 降到接近零，则数据基本正常；否则数据本身或损失函数实现有误。

    - 模型问题：

    - 验证模型初始化是否正确（如查看激活值均值和方差，是否出现大量零或 NaN）。

    - 检查模型结构：是否有死层（如 ReLU 后输出全部为负）、是否存在维度不匹配导致信息流失。

    - 梯度检查：用 torch.autograd.gradcheck 确认自定义算子或损失的反向传播正确。

    - 若使用预训练权重，确认权重加载无误，层名对应，没有因为 strict=False 忽略关键层。

    - 超参数问题：

    - 训练流程：

    最快速的方法是 小数据过拟合测试，通过即可排查数据加载与模型前向/反向通路问题；然后调大学习率看 loss 是否变化；最后逐步调整超参数。


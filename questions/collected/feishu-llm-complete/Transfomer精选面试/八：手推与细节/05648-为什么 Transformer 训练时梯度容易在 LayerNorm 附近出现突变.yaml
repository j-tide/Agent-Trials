content:
  prompt: 为什么 Transformer 训练时梯度容易在 LayerNorm 附近出现突变？
answer:
  mode: rubric
  reference_answer: |-
    LayerNorm 的前向涉及除以标准差，当某个隐藏单元方差很小或存在异常值时，归一化后的数值可能出现较大的值，进而反向传播时梯度会出现尖峰。此外，初始训练阶段，参数随机，某些维度的激活可能极大或极小，经过 softmax 或其它非线性操作后梯度变化剧烈。LayerNorm 的梯度计算中有减去均值等操作，对异常值敏感，容易导致梯度突变。这通常通过梯度裁剪、更好的初始化、学习率预热等来缓解。


content:
  prompt: 给定批大小、序列长度和模型配置，估算每个训练步的前向和反向传播时间。
answer:
  mode: rubric
  reference_answer: |-
    一个训练步的前向和反向传播时间取决于总 FLOPs 和 GPU 的峰值性能及实际利用率。

    [图片内容未导入]

    时间估算：

    时间 = 总 FLOPs / (GPU 数量 × 单卡峰值 TFLOPs × 硬件利用率)。利用率通常在 30%~60%。例如，A100 FP16 峰值 312 TFLOPS，利用率 0.4，则单卡有效 124.8 TFLOPS。再根据 FLOPs 计算。需要具体模型参数。


content:
  prompt: 如果让你把一个英文模型适配到中文，训练步骤和技术要点是什么？
answer:
  mode: rubric
  reference_answer: |-
    - 词表扩展：英文词表通常不包含足够的中文字符和中文子词，需要扩充词表（增加常用汉字、词）。采用 BPE 或 SentencePiece 在中文语料上训练新词表，然后将原英文模型的 token embedding 和 LM head 权重部分复制、剩余部分随机初始化，并对新嵌入进行维度对齐。

    - 继续预训练 (Continual Pretraining)：在大量中文文本（如几百 GB）上继续训练，使用与原始预训练相同的任务（如 MLM 或 LM）。训练策略：

    - 位置编码与架构调整：一般无需改动，但若模型使用绝对位置编码且中文序列通常较长，可考虑替换为 RoPE 或引入长上下文适应。

    - 中文特性处理：中文无空格分词，tokenization 质量影响很大，应选择合理词表和分词器。另外可加入全角标点、中文特殊 token。

    - 微调与对齐：针对中文下游任务（问答、对话）进行监督微调（SFT）和人类反馈对齐（RLHF/DPO），构建高质量中文指令数据。

    - 评估：使用中文基准（C-Eval, CMMLU, MMLU-Chinese 等）评估知识能力，并用中文对话人工评估流畅度和安全性。

    - 技术要点：防止灾难性遗忘，平衡数据比例，新的嵌入训练要足够充分；可能需要多次迭代逐步适应中文。


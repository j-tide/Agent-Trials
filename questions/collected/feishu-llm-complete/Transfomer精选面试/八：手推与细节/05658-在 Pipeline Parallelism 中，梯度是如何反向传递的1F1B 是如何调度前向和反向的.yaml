content:
  prompt: 在 Pipeline Parallelism 中，梯度是如何反向传递的？1F1B 是如何调度前向和反向的？
answer:
  mode: rubric
  reference_answer: |-
    梯度反向传递：流水线并行将模型不同层分配到不同设备。前向时，micro-batch 依次通过各设备，设备间传递激活。反向时，梯度从最后一个设备开始，按相反顺序传播。对于每个 micro-batch，设备计算自己层的反向，并将输入梯度传回前一个设备。所有 micro-batch 的反向完成后，设备得到自己负责层的平均梯度，然后更新参数。

    1F1B（One Forward, One Backward）调度：先执行若干连续的前向 micro-batch（预热阶段），使流水线充满。然后交替执行一个前向和一个反向（1F1B）。这样能尽早开始反向传播，平衡内存中保存的激活数量，降低峰值显存。具体地，假设 4 个设备，micro-batch 数 M=8，预热阶段执行 4 个前向，然后每个设备在完成一个前向后立即执行一个反向。最终完成所有 micro-batch。


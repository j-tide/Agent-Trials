content:
  prompt: 画出 Transformer 层的前向计算图，并标出反向传播时的梯度流动。
answer:
  mode: rubric
  reference_answer: |-
    一个标准 Pre-Norm Transformer 解码器层（简化）的前向计算图如下：

    [图片内容未导入]

    [图片内容未导入]

    - 一路直接通过残差连接向前一阶段的输出传递（无变换，梯度直接复制）。

    - 另一路进入 FFN（或注意力）子层，先通过其内部运算（包括可能的 LayerNorm）反向传播，然后与残差支路梯度相加。

    具体到注意力子层：

    输入 x ─→ LayerNorm → 计算 Q,K,V → S = QK^T/√d → softmax → A → O = AV → 输出Proj → out_attn
    残差: x 直接加到 out_attn 形成 y

    反向传播时：

    - 梯度从 y 流向 out_attn 和 x（残差）。

    - out_attn 的梯度经过输出投影、A、S 等依次回传至 Q,K,V 和 LayerNorm。

    - LayerNorm 的梯度继续回传到 x 的另一份拷贝（实际上 x 是残差分支的起点，两个分支共享同一个 x，梯度需累加）。

    整体上，残差连接使得梯度可以无损地直接流向较早的层，缓解梯度消失。


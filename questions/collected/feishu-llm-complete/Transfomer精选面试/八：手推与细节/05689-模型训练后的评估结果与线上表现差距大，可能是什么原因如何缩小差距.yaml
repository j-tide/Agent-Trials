content:
  prompt: 模型训练后的评估结果与线上表现差距大，可能是什么原因？如何缩小差距？
answer:
  mode: rubric
  reference_answer: |-
    这种 gap 常见于离线评估集不能真实反映线上分布。

    原因：

    - 训练/评估数据与线上数据分布不同：特征分布、文本风格、任务形式发生偏移（covariate shift / concept drift）。

    - 评估指标设计不合理：离线指标（困惑度、BLEU、ROUGE）可能与实际业务目标（点击率、用户满意度）弱相关。

    - 曝光偏差：评估时通常在标准测试集上静态测量，而线上是流式交互，模型之前的输出会影响后续上下文（误差累积）。

    - 数据泄露或过度微调：离线评估集中包含了训练数据，导致指标虚高。

    - 推理策略差异：训练时使用 Teacher Forcing，推理时自回归解码，存在差异；或解码参数（温度、top-k）不同，离线可能采用贪婪解码而线上使用随机采样。

    - 批处理效应：离线可能逐条评估，线上可能采用 Continuous Batching，KV 缓存的管理差异可能影响输出。

    - 量化或优化的精度损失：线上模型可能经过量化、图优化，导致输出与 PyTorch 原始模型有微小偏差，累积后放大。

    缩小差距的方法：

    - 构建更接近线上分布的评估集：定期采样线上真实请求，人工标注或弱监督评分；使用 online evaluation（A/B test）。

    - 在微调阶段加入线上数据（如用户交互日志）进行领域适应，但需注意避免数据泄露和循环反馈。

    - 引入策略梯度或强化学习，直接用业务奖励优化模型，但需谨慎平衡流畅性。

    - 对齐推理环境：确保线上引擎（如 TensorRT-LLM）的精度与训练框架一致，进行数值对齐测试。

    - 使用更好的离线指标：如多维度模型评价（对话质量、安全性、事实性），并配合人工评估。

    - 采用解码时的误差纠正（如对比解码、自我纠正）来缓解推理与训练不一致。


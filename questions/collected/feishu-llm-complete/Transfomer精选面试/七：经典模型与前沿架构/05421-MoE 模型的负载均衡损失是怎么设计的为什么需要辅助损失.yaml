  reference_answer: |-
    为什么需要负载均衡

    Top-k 路由容易导致专家负载失衡：训练初期或训练过程中，路由器可能倾向于始终选择少数几个专家（赢家通吃），导致其它专家几乎不接收 token，造成“专家坍塌”。这不仅浪费了模型容量，还会使部分专家梯度稀疏、难以学习，并降低分布式训练的硬件利用率（部分设备空闲）。


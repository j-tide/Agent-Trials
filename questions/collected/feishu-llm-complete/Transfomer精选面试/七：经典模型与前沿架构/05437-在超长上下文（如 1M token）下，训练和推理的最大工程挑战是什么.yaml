content:
  prompt: 在超长上下文（如 1M token）下，训练和推理的最大工程挑战是什么？
answer:
  mode: rubric
  reference_answer: |-
    训练挑战：

    - 显存爆炸：即使有 FlashAttention，激活和 KV 缓存依然需占用巨大显存，单卡无法容纳。必须依赖序列并行、张量并行和流水线并行，跨数百甚至数千 GPU 协同。

    - 计算时间：全注意力 O(N²) 计算量难以接受，必须引入稀疏或线性注意力近似，同时保证训练质量不下降。

    - 数值稳定性：超长序列的 softmax 求和容易溢出，online softmax 算法需要精心调校以在分段后保持精度。

    - 通信瓶颈：序列并行模式下，需要大量的 all-gather / reduce-scatter 通信来拼接注意力块，网络带宽成为限制。

    - 数据工程：构建海量高质量长文本数据集极具挑战，且需保证多样化以避免模型过拟合到特定长模式。

    推理挑战：

    - KV 缓存管理：1M token 的 KV 缓存占用高达数百 GB，必须利用内存层次（CPU 卸载、SSD 交换）和压缩技术（量化、逐出策略）。

    - 延迟：每次解码需要从 KV 缓存中检索信息，数据搬运成为主导。需要实现高效的块读取、投机解码或 Cache-Aware 调度。

    - 请求调度：服务多个长序列请求时，内存的动态分配与抢占极为复杂，PagedAttention 等方案需扩展以处理巨大 page 表。

    - 负载均衡：不同请求长度差异悬殊，混跑时需精细的调度以避免短请求被阻塞。


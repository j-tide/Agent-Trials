content:
  prompt: 如何测试一个长上下文模型的真实有效上下文长度？大海捞针实验具体怎么做？
answer:
  mode: rubric
  reference_answer: |-
    大海捞针（Needle in a Haystack）实验是最广泛使用的评测方法，旨在检验模型能否从极长输入中检索出特定的“针”。

    具体做法：

    - 构造Haystack：用大量无关文本（如保罗·格雷厄姆的散文、歌词等）填充到目标长度（如 128K tokens）。

    - 放置Needle：在上下文的不同深度（如 0%、25%、50%、75%、100%）插入一个特定的事实陈述句（“针”），如“神奇的水果是菠萝”。

    - 提问：在末尾直接提问“神奇的水果是什么？”，要求模型回答“菠萝”。

    - 评测矩阵：横轴为上下文长度，纵轴为“针”的插入深度，绘制正确率的 heatmap。深度越靠中间且长度越长，检索难度越大。

    - 全面评估：记录模型正确找到“针”的频率，只有当在大部分深度和长度上高正确率时，才认为模型有效利用了长上下文。

    真实有效上下文评估：

    - 大海捞针仅测试检索，更全面的评测需结合长程推理：如长文档中抽取多段信息进行多跳问答（如“张三生于A地，后移居B地，他的母亲叫什么？”信息分散全文）。

    - 使用长文本基准测试：如 L-Eval、LongBench、ZeroSCROLLS，包含单文档/多文档问答、摘要、few-shot 学习等任务。

    - 测量困惑度（PPL）：在长文档上预测下一个 token 的困惑度，应随长度增加而持续降低或保持稳定，而非上升（信息遗忘）。


content:
  prompt: Mamba 能否替代 Transformer 成为下一代基础架构？目前有哪些局限性？
answer:
  mode: rubric
  reference_answer: |-
    当前局限性

    - 生态和工具链：Transformer 拥有极其完善的训练和推理生态（FlashAttention、PagedAttention、TensorRT-LLM、各种并行策略）。Mamba 等新架构的定制内核、分布式训练支持尚不成熟。

    - 扩展律验证不足：Transformer 的 scaling law 已被大量实验确认，Mamba 在数百亿、千亿参数规模下的稳定性和性能天花板仍待充分探索。

    - 上下文学习能力：Transformer 的全注意力提供了极强的上下文学习（in-context learning）能力，这是当前大模型涌现能力的关键。Mamba 的固定状态压缩是否能支撑同样强大的少样本推理尚存疑问。

    - 检索与精确复制：在需要从超长上下文中精确检索单一事实的任务中，Transformer 的全注意力机制具有理论优势。Mamba 选择性记忆可能面临记忆覆盖。

    - 训练效率：虽然推理极快，但选择性扫描的并行实现复杂度高，目前训练速度在中等长度上仍可能慢于高度优化的 Transformer（如使用 FlashAttention-3）。不过随着优化，这个差距在缩小。

    前景：Mamba 很可能不会完全取代 Transformer，但会与其混合或作为特定场景的互补。如同 Jamba 等混合架构，未来基础架构可能是 Transformer 层与 SSM 层的交替组合，或根据序列位置动态选择。


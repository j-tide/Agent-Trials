content:
  prompt: 长上下文训练的数据混合策略是什么？如何构造长短混合的数据集？
answer:
  mode: rubric
  reference_answer: |-
    纯粹的极长文本训练会破坏模型处理短序列的能力，因此需长短混合训练。策略如下：

    - 数据分布设计：

    - 遵循“短序列保基础，长序列扩展”原则。典型混合比例：约 50%～70% 短序列（原预训练窗口内），30%～50% 长序列（新的目标窗口长度）。

    - 长序列数据可以从书籍、代码、学术论文、长对话中获取，确保来源的多样性。

    - 部分工作使用 “长序列上采样”：对长文档赋予更高的采样权重，同时维持充足的短样本量。

    - 构造方法：

    - 拼接短文档：将多个短文档用分隔符（如 <|endoftext|>）拼接到目标长度。注意需保留分界 token，并禁止注意力跨越文档边界（使用注意力掩码或文档标识）。

    - 自然长文档：直接使用长文本，如法律文档、长篇小说、维基百科完整页面等。

    - 合成数据：用已有的长序列任务（如长程问答、摘要）生成预训练格式的文本。

    - 训练调度：

    - 数据标签与模型调整：


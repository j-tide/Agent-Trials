content:
  prompt: 如果让你设计一个全新的序列模型架构，用于取代 Transformer，你最可能借鉴哪些思想？
answer:
  mode: rubric
  reference_answer: |-
    我会设计一个混合、自适应且记忆增强的架构，融合以下思想：

    - 状态空间模型的线性递归（Mamba 的选择性扫描）：作为大部分层的基础计算单元，确保长序列效率。

    - 稀疏全局注意力层（每 N 层插入一层全注意力或路由注意力）：用于处理需要全局交互和上下文学习的复杂模式，实现“慢思考”与“快思考”结合。

    - 可扩展的外部记忆模块：如 Token 级别的记忆库，使用寻址机制（类似于 Neural Turing Machine），支持读写和遗忘，通过记忆 token 注入各层，实现无限上下文。

    - 自适应计算：每个 token 经过轻量级路由器决定当前层应使用局部 SSM、全局注意力还是直接从记忆读取，用动态深度实现计算预算分配。

    - 多分辨率时间尺度：在不同层或头中使用不同的时间衰减因子和窗口大小，显式捕获从字词到篇章的多尺度依赖。

    - 硬件感知的设计：所有算子都支持块操作和融合内核，适配下一代 GPU 的 Tensor Core 和可能的 SSM 专用指令。

    - 训练方式：采用类似 BERT 的理解任务与自回归生成任务联合预训练，使模型既有强编码能力又能高效解码。

    这样设计可以在推理效率、长程建模、上下文学习之间取得更优平衡。


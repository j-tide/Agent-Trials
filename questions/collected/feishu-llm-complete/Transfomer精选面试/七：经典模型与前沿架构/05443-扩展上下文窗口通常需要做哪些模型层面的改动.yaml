content:
  prompt: 扩展上下文窗口通常需要做哪些模型层面的改动？
answer:
  mode: rubric
  reference_answer: |-
    扩展上下文窗口不只是增加序列长度，还需解决位置编码失效、注意力计算爆发、训练数据分布偏移等问题。模型层面常需以下改动：

    - 位置编码适配或替换：

    - 原绝对位置编码（如学习式、正弦）无法外推到未训练长度，需替换为外推友好的相对位置编码（如 RoPE、ALiBi）或对已有位置编码进行插值、缩放。

    - RoPE 场景常用位置插值（Position Interpolation, PI）：将测试时的位置索引按比例缩小到训练窗口内；或 NTK-aware 缩放：调高 RoPE 基频，让高频分量旋转变慢以适应更长距离。

    - YaRN 进一步结合了 NTK 缩放和温度调优，解决插值导致的相邻 token 区分度下降问题。

    - 注意力机制优化：

    - 引入高效注意力，如 FlashAttention-2/3，以在长序列上将显存和耗时压到线性或近似线性。

    - 采用滑动窗口或稀疏注意力（如 Mistral、Longformer），或混合全局+局部注意力，降低计算量。

    - 实现 PagedAttention 或类似的 KV 缓存分页机制，以便在推理时高效管理海量缓存块。

    - 训练策略调整：

    - 从短序列预训练模型出发，进行长序列继续训练（Continual Pretraining）。需要设计长短混合的数据集，逐步增加序列长度，防止模型遗忘短文本能力。

    - 使用分阶段训练或 LongLoRA 等低成本微调方案，只微调部分权重或引入轻量适配器。

    - 归一化与稳定性：

    - 长序列训练容易出现数值不稳定，需使用更稳定的归一化（如 RMSNorm 预归一化），并采用 bf16 混合精度。

    - 有时需要调整优化器（如 Adafactor）或引入 Z-loss 等稳定技巧。

    - 并行策略适配：

    - 长序列训练显存激增，必须结合张量并行（TP）、序列并行（SP）（如 Megatron-LM 的 SP、DeepSpeed Ulysses），将单序列切分到多卡以分散激活显存。


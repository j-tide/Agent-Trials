content:
  prompt: 为什么很多大模型选择在 FFN 上做 MoE，而不是在注意力上？
answer:
  mode: rubric
  reference_answer: |-
    - 参数占比大：Transformer 中 FFN 通常占 2/3 的参数。将 MoE 用于 FFN 能最有效地放大模型总参数量，带来显著的容量提升。

    - 计算独立性：FFN 是对每个 token 单独处理的，token 间无交互，天然适合条件计算（每个 token 路由到不同专家），并行实现简单。而注意力需要计算 token 间的交互，若对注意力做 MoE（如每个头是不同专家），需要复杂的 token 维度上的路由和通信，会破坏注意力矩阵的密集计算模式，实现难度和通信开销都更大。

    - 已有成功实践：从 GShard、Switch Transformer 到 Mixtral，FFN MoE 已经被充分验证有效且训练稳定。注意力 MoE 研究相对较少，收益不确定。

    - 负载均衡容易设计：FFN 上的负载均衡可以通过简单统计每个专家接收的 token 数来施加辅助损失。注意力上的均衡需要跨序列维度考虑，更复杂。

    因此，FFN MoE 是参数量扩展的最直接、最高效的方案。


content:
  prompt: T5 如何将所有 NLP 任务转化为文本到文本的格式？这种统一的优势是什么？
answer:
  mode: rubric
  reference_answer: |-
    文本到文本统一框架

    T5（Text-to-Text Transfer Transformer）将所有 NLP 任务重铸为“输入文本 → 输出文本”的形式：

    - 分类：如情感分析，输入 “sst2 sentence: This movie is great”，输出 “positive”。

    - 翻译：输入 “translate English to German: Hello”，输出 “Hallo”。

    - 摘要：输入 “summarize: [文章]”，输出摘要。

    - 问答：输入 “question: [Q] context: [C]”，输出答案文本。
    模型采用 Encoder-Decoder 结构，编码器处理输入文本，解码器自回归生成目标文本，所有任务共享同一架构、同一损失函数（交叉熵）。

    统一优势

    - 极简流水线：无需为不同任务设计特定的分类头、损失函数或数据处理管道，所有任务只用同一套代码。

    - 多任务联合训练：可以在所有任务上混合数据训练单一模型，促进知识共享和正迁移。

    - 便于扩展：无论增加新任务还是新模态，只要能将输入输出转换为文本，就能纳入同一框架。

    - 预训练目标自然统一：T5 将 span corruption 去噪作为预训练任务，也与下游格式保持一致。


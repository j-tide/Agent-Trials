content:
  prompt: GPT-3 的上下文学习（In-context Learning）是怎样的？为什么不需要微调？
answer:
  mode: rubric
  reference_answer: |-
    上下文学习机制

    上下文学习是指将少量带标签的示例（demonstrations）以自然语言的形式拼接到推理 Prompt 中，然后让模型直接根据模式输出新问题的答案，无需对模型参数进行任何梯度更新。

    例如：在情感分类任务中，Prompt 写为 “Review: ... Sentiment: Positive. Review: ... Sentiment: Negative. Review: [Target] Sentiment:”，模型会自动完成 “Positive/Negative”。

    为什么不需要微调

    - 大规模预训练时，模型在无数网页上见过类似的输入-输出模式（如列表、表格、问答对）。这相当于在训练中隐式地执行了元学习（meta-learning）：模型学会了从上下文序列中识别模式并类比应用。

    - Transformer 的自注意力机制能够将上下文中的示例信息与当前查询关联，形成一个内部“工作记忆”，在正向传播中执行近似于梯度优化的联想推理。

    - 因此，GPT-3 仅凭条件概率 P(answer∣context)P(answer∣context) 就能零样本或少量样本泛化，无需外部的梯度更新和存储参数。


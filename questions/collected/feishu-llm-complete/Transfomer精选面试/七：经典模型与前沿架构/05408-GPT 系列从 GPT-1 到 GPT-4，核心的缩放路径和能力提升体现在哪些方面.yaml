content:
  prompt: GPT 系列从 GPT-1 到 GPT-4，核心的缩放路径和能力提升体现在哪些方面？
answer:
  mode: rubric
  reference_answer: |-
    GPT 系列遵循一致的自回归语言模型框架，核心缩放路径表现为模型规模、数据规模和训练策略的阶梯式扩展，并涌现出质变的能力。

    GPT-1 (2018)

    - 12 层 Transformer Decoder，1.17 亿参数。验证了无监督预训练 + 有监督微调的效果，引入“通用语言模型”概念。

    GPT-2 (2019)

    - 参数扩大到 15 亿（48 层）。核心创新：强调零样本学习，无需微调即可通过 prompt 完成多任务。展示了规模带来的语言连贯性提升，并探索了多任务能力的涌现。

    GPT-3 (2020)

    - 参数暴增到 1750 亿（96 层，12288 维）。引入上下文学习：在 prompt 中提供少量示例（Few-shot），模型即可直接完成任务，无需梯度更新。能力开始质变：可执行翻译、算术、代码生成等。

    GPT-4 (2023)

    - 多模态模型（图文输入），参数规模推测超万亿。能力提升：

    缩放路径核心是：模型参数 + 数据 + 训练计算的指数级增长，带来性能的平滑提升和能力的“涌现”，继而通过后训练对齐（RLHF）使其可安全地部署为助手。


content:
  prompt: LLaMA 系列模型采用了哪些结构选择？（如 RMSNorm, SwiGLU, RoPE）为什么？
answer:
  mode: rubric
  reference_answer: |-
    LLaMA 系列（包括 LLaMA 1/2/3）作为现代 Decoder-only 模型，整合了一系列已被验证的高效架构改进，旨在提升训练稳定性、模型性能和推理效率。主要结构选择如下：

    - Pre-Normalization 与 RMSNorm

    - LLaMA 在每个子层输入之前应用归一化（Pre-Norm），而不是早期 Transformer 的 Post-Norm。Pre-Norm 有利于梯度的直接传播，使训练更稳定，尤其是深层网络。

    - 采用了 RMSNorm（Root Mean Square Layer Normalization），去除了 LayerNorm 中的减均值操作，仅用均方根进行缩放。RMSNorm 计算更简单，速度更快，被实验证明与 LayerNorm 效果相当，已成为大多数 LLM 的标配。

    - SwiGLU 激活函数

    - 前馈网络（FFN）的激活函数由传统的 ReLU/GELU 替换为 SwiGLU。SwiGLU 是 Swish 与门控线性单元（GLU）的结合：SwiGLU(x) = (xW_1 \odot \text{SiLU}(xW_2)) W_3。

    - 这种结构引入了门控机制，允许模型动态控制信息流。尽管增加了参数矩阵，但 PaLM 等工作证明，在同等算力预算下，使用 GLU 变体能显著提高性能。LLaMA 采用 SwiGLU 并调整 FFN 中间维度，以平衡计算量。

    - 旋转位置编码（RoPE）

    - 使用 RoPE 代替绝对位置编码或学习式位置编码。RoPE 通过旋转变换将位置信息融入 Q 和 K，使点积隐含地包含相对位置信息：Attention(Q, K) = (R_{\theta,i} Q_i)^\top (R_{\theta,j} K_j) = Q_i^\top R_{\theta,j-i} K_j。

    - RoPE 具有良好的外推性（可扩展长上下文），且随着序列长度增大，远程衰减特性使其自然地偏向局部注意力。LLaMA 及其后续版本均采用此方案。

    - 分组查询注意力（GQA，LLaMA 2/3）

    - LLaMA 1 使用标准 MHA，LLaMA 2 的大模型（如 70B）引入了 GQA，将查询头分组共享 Key/Value 头。LLaMA 3 全面采用 GQA（8 个键值头），以显著减少 KV 缓存大小，提升推理吞吐。GQA 在几乎不损失性能的前提下大幅降低了内存带宽压力。

    - 其它细节：

    - 使用 Bfloat16 混合精度训练，并采用 FlashAttention 等高效注意力内核（LLaMA 2/3）。

    - 激活前移（Pre-Norm）+ 残差连接，标准化位置嵌入等。

    这些结构组合并非偶然，它们是社区在 Transformer 上的大量消融实验的精华，构成了现代高效 LLM 的基础。


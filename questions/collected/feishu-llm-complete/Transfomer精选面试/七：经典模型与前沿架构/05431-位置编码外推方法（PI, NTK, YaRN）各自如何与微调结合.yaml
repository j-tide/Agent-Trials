content:
  prompt: 位置编码外推方法（PI, NTK, YaRN）各自如何与微调结合？
answer:
  mode: rubric
  reference_answer: |-
    这些方法通常是在预训练好的短上下文模型上进行轻量微调，以恢复因插值导致的性能损失，并巩固长上下文能力。

    - 位置插值 (PI)：

    [图片内容未导入]

    - YaRN（Yet another RoPE extensioN method）：

    - 综合了 NTK 缩放和温度 t。对于长度比 ss，先做 NTK 缩放，再对注意力 logits 乘以一个温度系数 1/t。这样可以惩罚远距离注意力的分散，更接近训练时的分布。

    - 微调结合：YaRN 作者提出训练时使用动态插值（如先不加温度，逐步引入温度），或者在微调中使用 YaRN 配置。实践上，YaRN 可以直接零微调外推到很长的长度（如 128K），但若在长数据上稍作微调，效果更为稳固。微调时依然可使用 YaRN 计算的动态缩放位置。

    总结：这三种方法都可在微调时固定下来作为位置编码策略，PI 通常需要较多微调恢复局部性，NTK 和 YaRN 可以少量微调甚至零样本外推。


content:
  prompt: BERT 模型的结构和预训练任务是什么？它开启了什么范式？
answer:
  mode: rubric
  reference_answer: |-
    模型结构

    BERT（Bidirectional Encoder Representations from Transformers）是一个多层双向 Transformer 编码器。主要结构特点：

    - 纯粹由 Transformer 的 Encoder 堆叠而成（BERT-base: 12 层, 12 头, 隐层维度 768；BERT-large: 24 层, 16 头, 1024 维）。

    - 利用自注意力机制的全连接拓扑，能够同时关注左右两侧的上下文（双向）。

    - 输入表示是三种嵌入的和：词元嵌入（WordPiece 分词）、位置嵌入（学习式）和段嵌入（用于句子对任务）。

    预训练任务

    BERT 设计了两个自监督预训练任务：

    - 掩码语言模型（Masked Language Model, MLM）：随机遮盖输入中 15% 的 token，其中 80% 替换为 [MASK]，10% 替换为随机 token，10% 保持不变。模型基于双向上下文预测被遮盖的原始 token。这迫使模型学习深层的双向表征。

    - 下一句预测（Next Sentence Prediction, NSP）：输入两个句子 A 和 B，50% 的情况下 B 是 A 的真实下一句，50% 是随机句子。模型用 [CLS] token 的输出进行二分类，判断 B 是否为 A 的下一句。旨在学习句子间关系。

    开启的范式

    BERT 开创了 “大规模预训练 + 微调” 的 NLP 范式。通过在巨量无标签语料上进行预训练，模型获得通用的语言理解能力，然后在下游任务（分类、问答、推理等）上利用少量标注数据进行微调，即可达到当时最优水平。这种两阶段模式（pre-training then fine-tuning）取代了之前训练任务专用模型的方式，成为 NLP 的基础方法论，并深刻影响了整个深度学习领域。


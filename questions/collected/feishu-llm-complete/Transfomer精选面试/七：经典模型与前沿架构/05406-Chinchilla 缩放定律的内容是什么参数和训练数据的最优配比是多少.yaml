content:
  prompt: Chinchilla 缩放定律的内容是什么？参数和训练数据的最优配比是多少？
answer:
  mode: rubric
  reference_answer: |-
    Chinchilla 定律由 DeepMind 于 2022 年提出，源于论文《Training Compute-Optimal Large Language Models》。其核心发现是：给定固定的训练计算预算 CC，模型参数量 NN 和训练 token 数 DD 应该等比缩放，才能实现最低的验证损失。

    [图片内容未导入]

    - 具体配比：对于训练 Chinchilla 模型的特定算力，最优配置约为 70B 参数训练 1.4T tokens。这与之前“增大模型，数据大致不变”（如 Gopher 280B 只训练 300B tokens）的做法形成鲜明对比。

    - 更简化的经验法则：每个参数约对应 20 个训练 token（tokens = 20 × params）。例如 10B 模型用 200B tokens 训练。实际中这个比例随模型规模和架构有所不同，但作为指导被广泛接受。

    定律意义：它揭示了之前的大模型（如 GPT-3）严重“训练不足”，可以通过在更多数据上训练较小模型来用更少推理成本达到同等甚至更好性能。


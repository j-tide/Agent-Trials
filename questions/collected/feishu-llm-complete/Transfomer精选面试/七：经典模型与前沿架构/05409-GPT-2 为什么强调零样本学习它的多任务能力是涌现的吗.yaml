content:
  prompt: GPT-2 为什么强调零样本学习？它的多任务能力是涌现的吗？
answer:
  mode: rubric
  reference_answer: |-
    零样本学习的强调

    GPT-2 的论文标题是《Language Models are Unsupervised Multitask Learners》。它指出，大规模语言模型如果训练在足够多样的 web 文本上，将隐式地学会执行许多 NLP 任务，只要将任务描述作为 prompt 条件输入即可，无需任何特定任务的有标签数据。因此 GPT-2 强调零样本，旨在证明语言模型本身就可以被视为多任务学习器，语言建模的目标与任务求解的边界模糊。

    多任务能力是涌现的吗

    GPT-2 的多任务能力更多是规模带来的平滑进步，而非严格意义上的“涌现”。在 GPT-2 的 15 亿参数规模下，零样本翻译、摘要、问答等能力虽然远超此前模型，但整体性能仍较差，并且随着模型尺寸增大呈现连续提升的趋势。真正的“涌现”现象（能力从不存在到突然存在）在 GPT-3 中才被明确观察到，例如在 175B 模型上，算术能力和上下文学习能力出现了非线性的质变。因此，GPT-2 可视为涌现前夜，它奠定了规模扩展的方向。


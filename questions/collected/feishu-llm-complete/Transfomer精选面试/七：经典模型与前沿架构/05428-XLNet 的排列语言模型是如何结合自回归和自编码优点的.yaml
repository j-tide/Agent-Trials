content:
  prompt: XLNet 的排列语言模型是如何结合自回归和自编码优点的？
answer:
  mode: rubric
  reference_answer: |-
    排列语言模型

    XLNet 使用自回归框架，但为了捕获双向上下文，它引入了对输入序列进行随机排列的操作。其核心思想：

    - 对于长度为 T 的序列，采样一个排列顺序 z，然后按照该顺序分解联合概率 P(x)=∏t=1TP(xzt∣xz<t)P(x)=∏t=1TP(xzt∣xz<t)。

    - 在预测某个位置 token 时，模型只能看到排列中排在它前面的 token（包括两侧的上下文信息，取决于排列），从而同时获得了双向信息。

    - 具体实现时，不实际打乱输入顺序，而是通过双流注意力（内容流和查询流）来实现：内容流用于编码上下文完整信息，查询流只编码位置但看不到当前 token 的内容，以满足自回归的一致性。

    结合优势

    - 避免 MLM 的独立假设：BERT 的 MLM 假设被遮 token 之间相互独立，而 XLNet 的自回归分解捕获了 token 间的依赖关系。

    - 双向上下文：排列保证了模型期望上能见到所有可能的上下文组合，具备了自编码模型的优点。

    - 因此 XLNet 在多个基准上超越了 BERT，但计算成本较高。


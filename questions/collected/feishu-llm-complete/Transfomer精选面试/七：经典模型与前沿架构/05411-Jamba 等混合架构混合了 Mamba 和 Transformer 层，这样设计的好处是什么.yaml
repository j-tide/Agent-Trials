content:
  prompt: Jamba 等混合架构混合了 Mamba 和 Transformer 层，这样设计的好处是什么？
answer:
  mode: rubric
  reference_answer: |-
    Jamba 由 AI21 Labs 提出，将 Mamba 层与 Transformer 层交织组成单个模型。

    好处：

    - 取长补短：Mamba 层高效处理长序列全局依赖，提供线性复杂度；Transformer 层提供强大的内容感知注意力，能捕捉复杂的 token 交互。混合使得模型既保留了 Transformer 的强大推理和上下文学习能力，又兼具 SSM 的长序列效率。

    - 内存与吞吐平衡：Transformer 层需要 KV 缓存，但可以通过 GQA 等压缩；Mamba 层无缓存。混合减少了整体 KV 缓存大小，提升了推理吞吐，同时在全注意力层中关键的密集交互不会损失。

    - 灵活的 MoE 结合：Jamba 在其混合层之上还引入了 MoE，使模型总参数大但激活参数少。混合架构让 MoE 可以在部分层上部署，减少通信压力。

    - 性能经验：实验证明，同等训练预算下，Jamba 的长序列表现优于纯 Transformer 或纯 Mamba。它展示了异构层的组合可以比单一机制更优，这可能是未来大型基础模型的发展方向。


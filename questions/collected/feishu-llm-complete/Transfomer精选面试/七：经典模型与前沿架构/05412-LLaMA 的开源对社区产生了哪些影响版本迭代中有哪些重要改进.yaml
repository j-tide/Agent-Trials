content:
  prompt: LLaMA 的开源对社区产生了哪些影响？版本迭代中有哪些重要改进？
answer:
  mode: rubric
  reference_answer: |-
    开源影响

    Meta 开源的 LLaMA 系列（尤其是 LLaMA 1 的权重泄露与后续正式开源）直接引爆了大模型的平民化革命。其影响包括：

    - 催生了庞大的衍生模型和微调生态（Alpaca、Vicuna、Koala 等），推动了指令微调、量化、本地部署技术的爆发。

    - 奠定了 Decoder-only 预训练模型的开放标准，大量研究基于 LLaMA 架构展开，加速了对缩放定律、对齐技术、长上下文扩展的研究。

    - 构建了活跃的社区（Hugging Face 等），使得模型改进、应用分享形成正反馈循环，缩小了闭源与开源模型的差距。

    版本迭代与重要改进

    - LLaMA 1（2023.02）：开源 7B-65B 四个规模。关键选择：Pre-Norm、RMSNorm、SwiGLU、RoPE。训练数据 ~1-1.4T tokens，远超 Chinchilla 最优，开创了“小模型+大数据”路线，性价比极高。

    - LLaMA 2（2023.07）：增加 GQA（70B 模型）、多轮对话对齐（RLHF）、更大上下文（4K）、幽灵注意力（Ghost Attention）改善多轮一致性。训练数据提升至 2T tokens，并开源了微调后的对话版本。

    - LLaMA 3（2024.04）：8B 和 70B 模型，训练数据暴增至 15T tokens，全面采用 GQA（8 个 KV 头）、128K 词表的 tiktoken 分词器、密集模型极致优化。引入更强的指令微调和安全对齐，性能逼近 GPT-4 量级。

    - LLaMA 3.1（2024.07）：首次推出 405B 稠密模型，支持 128K 上下文窗口，支持多语言、工具调用、代码，并开源了完整训练堆栈。标志开源模型达到顶级闭源水平。

    每一代升级都聚焦于数据规模扩大、长上下文支持、推理效率提升（GQA）和对齐质量。


content:
  prompt: RoBERTa 相比 BERT 做了哪些改进？动态掩码和大 batch 的意义。
answer:
  mode: rubric
  reference_answer: |-
    RoBERTa（Robustly optimized BERT approach）并没有改变模型结构，而是通过精心的训练策略和超参数优化大幅提升了 BERT 的性能。主要改进包括：

    - 动态掩码

    - BERT 在数据预处理时对每个样本只执行一次静态掩码，之后该样本在多个 epoch 中被重复使用时掩码模式不变。

    - RoBERTa 每次将序列输入模型前才动态生成掩码，同一个句子在不同 epoch 中看到不同的掩码模式。这增加了训练数据的有效多样性，尤其对大语料训练更有益。

    - 移除 NSP 任务

    - 实验表明，仅使用 MLM（且输入不限于句子对，而是填充长连续文本）比 MLM + NSP 效果更好或相当。NSP 反而限制了上下文长度并引入噪声。RoBERTa 丢弃 NSP，改为从文档中连续采样完整段落（FULL-SENTENCES），并调整序列长度使其尽可能跨句子边界，以建模更长程的依赖。

    - 更大 batch size 和更长的训练

    - BERT-base 使用 256 的 batch size，RoBERTa 将其提升至 8K，并配合更大的学习率。大 batch 提供了更稳定的梯度估计，有利于使用更大的学习率，并充分利用大规模并行硬件加速。

    - 同时在显著更多的数据（160GB 语料，远超 BERT 的 16GB）上进行了更长时间的训练。大 batch 与大数据量协同，使模型更好地收敛，防止在小批量下陷入局部极小。

    - 字节级 BPE 分词

    - 替换 WordPiece 为字节级 Byte-Pair Encoding（BBPE），词表扩大到 50K 子词，可处理任意输入而不产生未登录词，并减少 token 化过程中的语义损失。

    - 动态调整学习率与预热

    - 使用线性衰减、更长的预热步数等优化策略，使训练更稳定。

    意义：RoBERTa 证明了精心设计的训练规程与超参数对模型质量的影响甚至超过模型架构创新。它把 BERT 的潜力发挥到极致，成为后续预训练模型训练的标准化参考。


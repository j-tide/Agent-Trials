content:
  prompt: 在分布式训练中，MoE 的专家并行与张量并行、数据并行如何结合？通信有什么特点？
answer:
  mode: rubric
  reference_answer: |-
    在大规模训练中，通常采用三维并行：数据并行（DP）、张量并行（TP）、流水线并行（PP），并针对 MoE 增加专家并行（EP）。

    - 数据并行（DP）：每个设备拥有整个模型副本，分不同 batch 训练。MoE 中专家参数较大，单卡放不下全部专家，因此需要专家并行。

    - 专家并行（EP）：将多个专家分布到不同的设备上。每个 token 经过路由器后，通过 all-to-all 通信发送到对应的专家所在设备上，设备计算其负责的专家，再将输出发回。专家并行维度通常与 DP 正交：所有设备共同构成 EP 组，外部套 DP。

    - 张量并行（TP）：将单个专家的权重矩阵切分到多个设备，用于突破单个专家过大的情形。通常 EP 与 TP 可叠加，例如每个专家的 FFN 可使用 TP 分片。

    - 结合方式：在典型 3D 并行中，首先划分 EP 组（例如 8 卡一个 EP 组，每组存放全部 8 个专家），组内专家分布；然后在 EP 组内可对每个专家内部进行 TP；最后在不同 EP 组间进行 DP（跨节点）。也可以 DP 在前面。

    通信特点

    - All-to-All 通信是 MoE 的显著开销。每一层 MoE 需要两次 all-to-all：一次将 token 发送到对应专家，一次将专家输出回收。通信量取决于每 token 选择的专家数和隐藏维度。

    - 通信延迟可能成为瓶颈，需要高速互联（NVLink、InfiniBand）。DeepSpeed-MoE 等框架通过融合通信、容量因子（预留容量防止专家过载）和交错训练来优化。

    - 负载不均衡会导致 all-to-all 中某些设备收发数据量不均，产生同步等待，因此负载均衡损失和容量因子机制至关重要。


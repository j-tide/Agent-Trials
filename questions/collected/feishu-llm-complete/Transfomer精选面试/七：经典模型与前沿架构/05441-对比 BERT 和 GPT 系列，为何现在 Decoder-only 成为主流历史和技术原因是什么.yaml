content:
  prompt: 对比 BERT 和 GPT 系列，为何现在 Decoder-only 成为主流？历史和技术原因是什么？
answer:
  mode: rubric
  reference_answer: |-
    历史脉络

    BERT（2018）双向编码器引爆 NLP，但其 fine-tuning 范式需要为每个下游任务准备特定头部和数据。GPT 系列（2018～）坚持 Decoder-only 自回归路线。GPT-3 将上下文学习推向实用，ChatGPT（2022）和 GPT-4 凭借强大生成和指令跟随能力爆火，引发业界全面拥抱 Decoder-only 架构。

    技术原因

    - 统一的生成式能力：Decoder-only 模型天然支持文本生成，并且随着规模扩大，涌现出推理、代码、工具使用等高级能力，而 Encoder 模型不具备生成能力，应用面窄。

    - 上下文学习取代微调：超大 Decoder 模型通过上下文学习即可解决各类任务，省去繁琐的微调流程，使单一模型可以即时服务无限任务。

    - 对齐训练（RLHF）友好：Decoder-only 的序列生成方式与人类对话、指令跟随等对齐训练流程完美契合，易于构建对话助手。

    - 工程与生态：Decoder-only 模型的训练和推理架构更单一（全是生成式），使得 KV-cache、FlashAttention、Continuous batching 等优化技术栈可以高度聚焦和标准化，形成了以 GPT 系列为中心的强大开源生态（LLaMA、Mistral、Qwen 等）。

    - 参数效率：Decoder-only 没有独立的 Encoder，在同等参数量下可以堆叠更深的层，处理长序列时运算分配更均衡。

    简言之：Decoder-only 统一了理解和生成，释放了规模涌现的潜能，并拥有更简洁的推理优化路径，因此在实用性和性能上胜出。


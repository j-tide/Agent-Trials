content:
  prompt: 窗口注意力（Sliding Window）为什么在长上下文模型中有效？窗口大小如何设定？
answer:
  mode: rubric
  reference_answer: |-
    有效性原理：

    - 局部性假设：文本具有很强的局部依赖，窗口注意力天然覆盖了最重要的上下文。

    - 多层感受野扩张：在 L 层 Transformer 中，第 L 层的 token 可间接接触到最初层中大约 L×(w/2)L×(w/2) 范围内的信息。即使窗口很小，深层也能捕获长程依赖。

    - 恒定计算与内存：计算复杂度 O(N·w)，与总长度 N 成线性，推理时只需缓存最近 w 个 KV，内存恒定。

    - 信息瓶颈与泛化：强制模型专注于局部结构，有助于提取更稳健的特征，在许多长序列任务中证明效果与全注意力相当。

    窗口大小的设定：

    - 需要根据任务和序列长度选择。常见值：w=4096（如 Mistral 7B），w=32768 等。

    - 太小：可能限制感受野，影响超长程依赖（如整本书的连贯性）。

    - 太大：降低效率优势，接近全注意力。多层感受野扩大后，一般 w=4096 配合几十层就能覆盖很远的距离。

    - 调优方法：实验不同 w，测量目标任务的困惑度或精度。通常 w 取 2 的幂且略大于平均句子/段落长度，以确保一层就能捕获完整局部模式。


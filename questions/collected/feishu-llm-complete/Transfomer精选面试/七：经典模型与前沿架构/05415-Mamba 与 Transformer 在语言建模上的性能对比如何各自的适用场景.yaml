content:
  prompt: Mamba 与 Transformer 在语言建模上的性能对比如何？各自的适用场景？
answer:
  mode: rubric
  reference_answer: |-
    性能对比

    - 语言建模困惑度：在相同参数规模（如 1.3B, 2.8B）和训练数据下，Mamba 的困惑度达到或略优于强基线 Transformer（如 LLaMA 架构的 Transformer++）。尤其是随着序列长度增加，Mamba 的优势更显著，因其 O(N) 复杂度能更好地处理长上下文。

    - 推理吞吐：Mamba 在长序列生成上吞吐远超 Transformer。由于其无 KV 缓存、每步 O(1)，推理速度在序列长度增加时几乎恒定，而 Transformer 呈线性增长。在 2048 以上的长文本生成中，Mamba 可比 Transformer 快数倍。

    - 特定能力：Transformer 凭借精确的全对全交互，在需要检索极远距离的单个 token（大海捞针）或精确复制序列的任务上可能稍优，但 Mamba 的选择性机制在多数常见长程任务上已接近或持平。

    适用场景

    - Transformer：仍适合需要极强上下文学习、复杂多步推理、以及利用庞大的预训练生态（如各种工具链、适配器）的场景。目前多模态模型、大规模助手几乎全是 Transformer。

    - Mamba：特别适合长序列处理（DNA、长文档、音频）、低延迟流式应用（语音助手、实时翻译）、资源受限的边缘部署，以及需要高吞吐批量服务的场景。


content:
  prompt: 如何理解大模型的“涌现能力”？缩放定律能否完全预测涌现？
answer:
  mode: rubric
  reference_answer: |-
    涌现能力

    涌现能力指的是当模型规模、数据量或计算量跨越某个临界点后，模型突然表现出在较小规模下完全不具备的、非线性的新能力。典型如：

    - 算术推理（GPT-3 175B 突然能计算复杂数学题，而 13B 几乎为零）

    - 多步推理、上下文学习、翻译、代码生成等在某个规模突然出现，且性能随规模跃升。
    这些能力无法通过简单外推小模型的性能曲线来预测。

    缩放定律能否完全预测涌现

    不能。标准缩放定律（如 Chinchilla 或 Kaplan 幂律）描述了验证损失随参数和数据平滑下降的趋势，损失本身通常是平滑的。但具体能力（如准确率）可能随损失的非线性映射而表现出突变。当损失降到某个阈值，模型正好学会了组合性推理，就涌现了能力。因此：

    - 缩放定律可以预测“损失”的改善，无法精确预测“能力”的涌现点。

    - 涌现也与任务复杂度、评估指标的敏感性相关。近期有研究认为，用更连续的指标（如正确 token 概率的积分）替代硬准确率，涌现现象会变得平滑，说明涌现可能部分源于非线性评估度量。但无论如何，能力的质变是客观存在的，缩放定律是必要条件而非充分预测工具。


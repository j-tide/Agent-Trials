  prompt: RetNet 如何通过多尺度保留机制实现训练并行和推理高效？与 Transformer 对比。
answer:
  mode: rubric
  reference_answer: |-
    RetNet 概述

    RetNet（Retentive Network）由微软提出，旨在兼具 Transformer 的训练并行性、RNN 的推理高效性以及长程建模能力。它采用 多尺度保留（Multi-Scale Retention） 机制替代自注意力。

    多尺度保留机制
    标准注意力为 O(N2)，但在 RetNet 中，保留机制定义为：

    [图片内容未导入]

    多尺度：使用多个不同的 γ 值（对应不同的保留头），每个头捕获不同时间尺度上的依赖（大 γ 捕获长程，小 γ 关注局部）。各头输出拼接，类似多头注意力。

    与 Transformer 对比

    - 训练：RetNet 的并行模式与 Transformer 训练代价相当（都是 O(N²d)），但因无需 softmax，计算略快。

    - 推理：Transformer 需 KV 缓存，内存随长度线性增长；RetNet 递归模式只需固定大小的状态 St，推理内存恒定，延迟极低。在长序列上 RetNet 速度优势显著。

    - 性能：在语言建模上，RetNet 与同等规模 Transformer 竞争甚至更优，尤其在长序列任务上。但 Transformer 在需要精确 token 级检索的任务中仍有优势。

    因此，RetNet 是朝着 “训练并行、推理高效” 目标迈出的重要一步，但依然保留了类似注意力的矩阵分解，与线性注意力有相似之处。


content:
  prompt: Mamba 提出的选择性扫描相比普通 SSM 有什么突破？它解决了什么问题？
answer:
  mode: rubric
  reference_answer: |-
    Mamba 的突破：选择性扫描（Selective Scan）

    [图片内容未导入]

    解决的问题：

    - 内容感知的记忆：模型可以学会根据上下文有选择地遗忘或保留信息，类似于注意力机制中的“关注”，但保留了 SSM 的效率。

    - 克服标准 SSM 在离散信息回忆和复制任务上的短板：选择性扫描显著提升了在需要精确 token 级记忆的任务上的表现，缩小了与 Transformer 的差距。

    - 硬件感知的并行实现：时间变化 SSM 不能直接用卷积并行训练，Mamba 设计了并行扫描（parallel scan）算法结合 kernel fusion，在 GPU 上高效执行选择性递归，实现了训练和推理的高速。

    Mamba 的核心贡献在于将线性 SSM 与输入依赖选择结合起来，打造出首个在语言建模上达到甚至超越同规模 Transformer 的线性复杂度模型，引发了替代 Transformer 的热潮。


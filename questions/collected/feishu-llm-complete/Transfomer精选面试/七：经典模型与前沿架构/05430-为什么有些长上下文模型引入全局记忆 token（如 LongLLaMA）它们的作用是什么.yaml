content:
  prompt: 为什么有些长上下文模型引入全局记忆 token（如 LongLLaMA）？它们的作用是什么？
answer:
  mode: rubric
  reference_answer: |-
    全局记忆 token是一些专门的、可被所有位置关注的 token，它们作为模型内部的工作记忆。

    作用：

    - 信息中继：普通窗口注意力中，信息必须逐层传递才能跨越长距离。全局 token 可以直接关注到所有位置并汇总全局信息，然后所有 token 再关注这些全局 token，实现“广播”效果。这相当于在网络上添加了捷径，极大缩短了长程信息路径。

    - 记忆压缩：模型可以将长序列的重要信息压缩编码到这些全局 token 的表示中。例如，LongLLaMA 使用 Focused Transformer 的微调方法，在长上下文中识别关键片段并将其压缩到记忆 token。

    - 上下文扩展：在推理时，可以将历史序列分块，每块编码成记忆 token，随 KV 缓存一起保留，代替原始的全部 KV 缓存，从而突破有限窗口的限制，实现理论上无限的外推。

    - 可解释性与控制：全局 token 提供了明确的记忆单元，便于分析和增强。

    在 LongLLaMA 中，记忆 token 以一定间隔插入（如每 256 个 token），它们可以被后续所有 token 关注，从而作为外部记忆库。


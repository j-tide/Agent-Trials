content:
  prompt: 对比 Dense 模型和 MoE 模型在给定相同计算预算下的表现和效率。
answer:
  mode: rubric
  reference_answer: |-
    相同计算预算指相同训练 FLOPs 或相同推理 FLOPs per token。

    - 性能：在同等训练计算量下，MoE 模型通常显著优于稠密模型。因为 MoE 用更多的参数容量（更多专家）来吸收知识，而计算量通过稀疏激活保持较低。例如，Mixtral 8x7B 用 12.9B 的激活参数，性能超过 13B 稠密模型，匹敌或超越 70B 稠密模型，但训练计算量远小于 70B。

    - 推理效率：当比较每 token 计算量相同时，MoE 模型性能更优（更多总参数知识）。但若硬件显存足够，MoE 推理速度通常受内存带宽和专家切换开销影响，难以达到相同 FLOPs 的稠密模型的吞吐。不过，由于性能高很多，在保持相同延迟下，MoE 提供更高的质量。

    - 显存与吞吐的权衡：MoE 需要存储所有专家，显存占用大。如果服务需高吞吐，必须将多副本加载到多卡，显存成本高。因此，MoE 的“推理效率”是指用略高的硬件成本换取质量的大幅提升。

    - 总体：在给定推理硬件预算下，训练一个 MoE 模型用该预算推理，或训练一个稠密模型用该预算推理，MoE 往往能得到更低的困惑度。即，MoE 是用显存换取知识密度的策略。


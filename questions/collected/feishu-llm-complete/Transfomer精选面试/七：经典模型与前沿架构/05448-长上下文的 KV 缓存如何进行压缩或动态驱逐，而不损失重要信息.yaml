content:
  prompt: 长上下文的 KV 缓存如何进行压缩或动态驱逐，而不损失重要信息？
answer:
  mode: rubric
  reference_answer: |-
    - 窗口化丢弃：只保留最近 W 个 token 的 KV 缓存，简单高效，适合局部性强的任务，但会丢失全局信息。

    - 带有全局 token 的窗口：保留窗口 KV + 少量全局记忆 token 的 KV，结合了局部和全局。

    - 重要性驱逐（Eviction based on attention scores）：根据历史注意力权重计算每个 KV 对的重要性，驱逐关注度低的 token。例如：

    - 低秩压缩：将 KV 缓存投影到低秩空间（类似 MLA），或使用在线 PCA 压缩，动态减少存储维度。

    - 量化：将缓存的 K、V 量化为 INT8 或 FP8，甚至 4-bit，极大降低内存带宽和占用，如 KIVI、FlexGen。

    - 分页与交换：利用 PagedAttention 将不活跃的 KV 块换出到 CPU 内存或 SSD，需要时异步换入。

    关键在于结合任务特性：对需精确定位远距离信息的任务，需保留高重要性 token；对局部流畅性要求高的，依赖窗口。许多方案混合使用多级缓存和智能驱逐策略。


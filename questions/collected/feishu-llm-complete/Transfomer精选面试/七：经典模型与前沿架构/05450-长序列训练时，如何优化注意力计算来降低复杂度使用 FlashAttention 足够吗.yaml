content:
  prompt: 长序列训练时，如何优化注意力计算来降低复杂度？使用 FlashAttention 足够吗？
answer:
  mode: rubric
  reference_answer: |-
    优化方法：

    - FlashAttention 系列：通过 IO 感知和分块计算，将内存复杂度从 O(N2)O(N2) 降到 O(N)O(N) 级，实际加速显著。但仅靠 FlashAttention 不足以解决所有问题：虽然显存可行，长序列的时间复杂度仍是 O(N2)O(N2)，当 N 达到 1M 时，计算耗时依然巨大。

    - 稀疏/近似注意力：滑动窗口、全局+局部、Longformer、BigBird 等，将计算量降至线性。

    - 线性注意力（Performer 等）和状态空间模型（Mamba）：将复杂度降至线性或常数，但可能牺牲精度。

    - 序列并行：将序列维度切分到多个 GPU（如 Megatron-LM 的序列并行、DeepSpeed-Ulysses、Ring Attention），每卡只计算序列的一段，用通信交换注意力所需块，实现超长序列的分布式训练。

    - 激活检查点（Gradient Checkpointing）：牺牲计算换显存，仅缓存部分中间激活。

    - 混合精度：使用 bf16/fp16，减少带宽和存储。

    结论：FlashAttention 是长序列训练的必要非充分条件。它处理了内存瓶颈，但超长序列还需结合序列并行、稀疏注意力或线性复杂度模型等方法来控制计算时间。


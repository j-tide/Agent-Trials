content:
  prompt: 线性 Transformer 与状态空间模型之间有什么理论联系？
answer:
  mode: rubric
  reference_answer: |-
    两者本质上都试图通过低秩或核方法近似注意力，且都可以被归为 线性注意力 框架。理论联系如下：

    [图片内容未导入]

    - Mamba-2 的对偶性：明确指出了 SSM 等价于半可分离的结构化注意力，而线性 Transformer 是非结构化低秩注意力。SSM 的 A 矩阵赋予衰减结构，可以看作是在线性注意力上增加了一个归纳偏置，保证长程记忆的稳定。

    - 性能差异根源：线性 Transformer 没有序列长度的先验衰减，容易造成远端信息覆盖或梯度问题；SSM 通过精心设计的 A 矩阵（如 HiPPO）实现了稳定的记忆压缩。Mamba 的选择性相当于让 B, C 输入依赖，即动态调整特征映射 ϕϕ，补足线性 Transformer 的表达力。


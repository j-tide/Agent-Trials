    SSM 基本原理

    [图片内容未导入]

    S4（Structured State Space）模型

    S4 通过将 A 矩阵初始化为特殊的 HiPPO 矩阵（可最优地压缩历史信息），并将 SSM 计算转化为卷积形式，实现了长序列的高效训练。具体而言：

    [图片内容未导入]

    S4 处理长序列的优势：凭借全局卷积形式，训练速度快且内存效率优于注意力。同时，SSM 的状态 hh 固定大小，推理内存恒定。S4 在长序列分类（如 Pathfinder、Long Range Arena）上取得了突破性成绩，证明了 SSM 在极长范围依赖建模上的能力。


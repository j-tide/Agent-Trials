content:
  prompt: ALBERT 如何通过参数共享和嵌入分解来降低参数量？性能变化如何？
answer:
  mode: rubric
  reference_answer: |-
    ALBERT（A Lite BERT）通过两种关键技术大幅度压缩模型参数量，以解决 BERT 内存占用大、难以扩展的问题。

    参数降低方法：

    - 跨层参数共享

    - ALBERT 将所有 Transformer 层的参数（自注意力的 Q、K、V、FFN 权重）全部共享。即整个网络只有一组层参数，重复计算 L 次。这使得参数量与层数几乎无关，层数增加只增加计算量而参数量几乎不增。

    - 例如，ALBERT-xxlarge 有 12 层参数共享，总参数量远小于同深度的 BERT，却能利用更深网络（如 24 层）提供更强的表征能力。

    - 因子化嵌入参数化

    - 原始 BERT 中，词嵌入矩阵的维度直接等于隐藏层维度 HH（如 768），这在词表很大时占用大量参数。

    - ALBERT 将嵌入矩阵分解为两个小矩阵：先用一个低维嵌入 EE（如 128）表示 token，再通过线性投影映射到隐藏维度 HH。参数量从 V×HV×H 降为 V×E+E×HV×E+E×H，当 E≪HE≪H 时节省显著（如 80% 以上）。

    性能变化：

    - 在同参数量下，ALBERT 的性能明显不如 BERT（因为共享限制了层多样性）。但在同等计算量和显存限制下，由于参数效率极高，可以堆叠更深的层，ALBERT-xxlarge（12 层参数共享，总 235M 参数，但计算量极大）在多个基准上达到了与 BERT-large 相当甚至更优的性能，同时模型参数仅为其 1/18。

    - 代价是推理速度：参数共享不减少每层的计算 FLOPs，因此推理时间与层数成正比，需要更高吞吐的场景下速度更慢。


content:
  prompt: RWKV 是如何结合 RNN 和 Transformer 优势的？它的注意力机制是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    RWKV (Receptance Weighted Key Value) 是一个开源的无注意力架构，旨在像 RNN 一样高效推理，同时像 Transformer 一样可并行训练。

    核心思想

    RWKV 使用一种时间衰减和 token 交互的混合机制，类似用“指数衰减的记忆”取代注意力。

    注意力机制（WKV 算子）

    给定输入序列，RWKV 计算四个向量：接收度 R、权重 W、键 K、值 V（均由线性变换得到）。


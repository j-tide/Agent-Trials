    这里 ww 是学习到的通道级时间衰减因子（正数，使得越远的历史权重越小），uu 是当前 token 自身的偏置（提升当前 token 影响力）。这本质上是带有可学习时间衰减的加权平均，形式上与带有遗忘门的 RNN 相似。

    [图片内容未导入]

    如何结合 RNN 和 Transformer 优势：

    - 像 RNN：推理时可状态化。将分子分母维护为移动状态，每步更新时只需 O(1) 计算和内存，无 KV 缓存，极适合流式生成和边缘设备。

    - 像 Transformer：训练时，通过使用卷积或并行前缀和技巧（parallel scan），可同时处理整个序列，像 Transformer 一样并行计算 WKV 算子，无需像传统 RNN 一样串行。这使得 RWKV 训练高效。

    - 无限上下文：由于状态固定大小，理论上可处理无限长度序列（实际上受状态容量限制）。

    性能：RWKV 在语言建模和常识推理上与同规模 Transformer 竞争，在长序列和低延迟场景中优势明显。但它在需要精确回忆遥远特定信息的任务（如针大海捞针）中可能逊色于 Transformer 的全注意力。


content:
  prompt: Chinchilla 定律对后来的大模型训练策略产生了什么影响？如 LLaMA 1 和 2 的调整。
answer:
  mode: rubric
  reference_answer: |-
    Chinchilla 定律直接重塑了业界的大模型训练策略，主要体现为“小模型、大数据”的范式转移。

    - LLaMA 1：正是受 Chinchilla 启发，Meta 选择了在远大于“标准”的数据量上训练相对较小的模型。例如，LLaMA-13B 用 1T tokens 训练，远超同等模型之前的数据量，使其以 13B 参数超越了 175B 的 GPT-3 性能。这证明了计算优化训练的巨大潜力。

    - LLaMA 2：进一步增加数据至 2T tokens，针对 7B、13B、70B 模型，全面贯彻数据优先原则。70B 模型性能媲美甚至超过当时的 Chinchilla 70B。

    - 泛化影响：几乎所有主流开源模型（Falcon、Mistral、Qwen、DeepSeek 等）都采用了过度训练策略（训练 token 数远超过 20×params），以在较小参数下获得极强性能，从而降低推理成本。例如 Mistral 7B 用约 8T tokens 训练，性能突出。

    - 新定律扩展：人们逐渐发现 Chinchilla 定律仅针对单 epoch 训练（数据不重复）。当允许重复数据（多 epoch）或使用更高质量数据时，最优配比会变化。DeepMind 后续的 “Scaling Data-Constrained Language Models” 研究了重复数据的情况，指出数据受限时，重复 token 仍有收益，这进一步解释了 LLaMA 3 等用 15T tokens 训练 8B/70B 模型的合理性。

    总之，Chinchilla 让业界从“堆参数”转向“堆数据”，极大提高了训练和推理的效率。


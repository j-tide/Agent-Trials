content:
  prompt: MoE 模型在推理部署时面临哪些挑战？如专家负载不均、高显存占用。
answer:
  mode: rubric
  reference_answer: |-
    - 高显存占用：虽然每 token 仅激活少量参数，但所有专家的权重都需要保持在显存中，否则动态加载会带来严重延迟。因此总参数庞大，对显存总量要求高（如 Mixtral 8x7B 需要足够的显存放 46.7B 参数）。

    - 专家负载不均衡：实际推理中，某些专家可能被大量请求选中，成为热点，而其他专家空闲。这导致计算资源利用率低，延迟增加。需要动态批量处理或请求调度来缓解。

    - 批处理效率低：在 Continuous Batching 中，不同请求的 token 可能选择不同的专家，难以形成整齐的矩阵乘法批次，导致 GPU 利用率下降。

    - 网络通信：如果跨卡部署，all-to-all 通信引入延迟，不适合对延迟敏感的在线服务；常需尽量将专家放置在同一设备或通过高速 NVLink 连接。

    - 模型切分与推理框架支持：需要框架能高效地调度稀疏专家计算，vLLM、TensorRT-LLM 等正在增加对 MoE 的专门优化（如 expert-aware 调度、融合内核）。


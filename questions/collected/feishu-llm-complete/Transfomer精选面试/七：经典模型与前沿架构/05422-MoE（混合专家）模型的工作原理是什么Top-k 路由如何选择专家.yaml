  prompt: MoE（混合专家）模型的工作原理是什么？Top-k 路由如何选择专家？
answer:
  mode: rubric
  reference_answer: |-
    MoE 工作原理

    MoE 将传统稠密 FFN 层替换为多个并行的 专家网络（通常每个专家就是一个标准 FFN），并引入一个可学习的 路由器（通常是一个小型线性层 + softmax）。对于输入中的每个 token：

    - 路由器输出该 token 针对所有专家的 logits。

    - 使用 Top-k 选择，只激活 logits 最高的 k 个专家（通常 k=1 或 2）。

    - Token 被发送到选中的 k 个专家，每个专家独立计算输出。

    - 最终输出是这些专家输出的加权和，权重由路由器 logits 的 softmax 归一化后提供（仅对选中的 k 个专家）。

    - 未被选中的专家不参与计算，其参数和计算量被节省。


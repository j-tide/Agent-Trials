content:
  prompt: 在 LLaMA 类模型中，如何处理输入中的特殊标记（如 system prompt）？
answer:
  mode: rubric
  reference_answer: |-
    LLaMA 类模型基于 Decoder-only 的聊天模板（Chat Template）来处理特殊标记。以 LLaMA 2/3 为例：

    - 专用特殊 token：使用 <<SYS>> 和 <</SYS>> 包裹系统提示，用 [INST] 和 [/INST] 标记指令轮次，用 <s> 和 </s> 标记序列开始和结束。LLaMA 3 则引入更简洁的 <|begin_of_text|>、<|start_header_id|>system<|end_header_id|> 等 token。

    - 模板化拼接：在预处理时，将系统提示、对话历史、当前指令按照特定模板拼接成一个连续的 token 序列。例如：

    - text

    - <s>[INST] <<SYS>>\n{System prompt}\n<</SYS>>\n\n{User message} [/INST] {Assistant response} </s>[INST] {Next user} [/INST]

    - 训练时的角色区分：在指令微调阶段，模型学习这些特殊 token 的语义，知道系统提示部分提供全局行为指导，而用户消息是任务。通过仅在助手 token 上计算损失（即仅对回复部分进行训练），模型学会区分提示与生成。

    - 推理时掩码与缓存：系统提示通常固定，可利用前缀缓存（Prefix Caching），只计算一次其 KV 缓存，后续多轮对话直接复用，极大降低首 token 延迟。

    因此，处理特殊标记的核心是约定好的模板 + 微调时的角色损失掩码 + 利用缓存优化。


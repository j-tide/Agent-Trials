content:
  prompt: LongLoRA 是如何低成本地扩展上下文窗口的？它核心的 Shifted Sparse Attention 是什么？
answer:
  mode: rubric
  reference_answer: |-
    LongLoRA 的低成本扩展方案：

    - 核心思想：受 LoRA 启发，它不微调全量模型参数，而是插入低秩适配器，并仅用极少的长文本数据进行轻量训练，将预训练短上下文模型扩展到长上下文。

    - Shifted Sparse Attention（S²-Attn）：

    - 效果：配合低秩微调和归一化重参数化，LongLoRA 仅需在原模型 2% 的原始训练成本下，就能将 LLaMA 2 7B 的上下文窗口从 4K 扩展到 100K，且保持强性能。

    S²-Attn 的重要意义：它提供了一种计算开销极低的长上下文适应方法，使得学术和小团队也能低成本训练长窗口模型。


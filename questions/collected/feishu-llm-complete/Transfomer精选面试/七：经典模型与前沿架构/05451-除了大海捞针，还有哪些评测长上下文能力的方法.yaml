content:
  prompt: 除了大海捞针，还有哪些评测长上下文能力的方法？
answer:
  mode: rubric
  reference_answer: |-
    - 长文档问答与推理：

    - 长文本摘要：如 GovReport、SummScreen，评测生成对全文的理解。

    - 合成长程任务：

    - 语言模型困惑度（PPL）：在长序列上预测下一个 token 的损失，尤其关注损失随位置的变化曲线。如果模型能保持低 PPL 直到序列末尾，说明有效。

    - 上下文学习评测：许多示例（上下文学习）时需要容纳超长 prompt，评测模型是否能从海量示例中准确学习模式。

    - 长程一致性：如 LAMBADA、Scrolls 等，检验生成内容是否与数百页前的设定一致。

    结合这些评测，能全面了解模型的真实长上下文理解和利用能力。


content:
  prompt: ELECTRA 的生成器-判别器结构是什么？为什么它比 MLM 更高效？
answer:
  mode: rubric
  reference_answer: |-
    ELECTRA（Efficiently Learning an Encoder that Classifies Token Replacements Accurately）提出了一种更高效的预训练框架，由生成器和判别器两个网络构成。

    结构：

    - 生成器 G：通常是一个小型的 MLM 模型（如一个小 BERT）。对输入中被随机 mask 的 token，G 预测原词，生成替换后的“被破坏”的句子。

    - 判别器 D：主要的预训练模型（Encoder）。对于输入句子中的每一个 token，D 需要判断该 token 是来自原始句子还是由生成器替换的“假” token。这是一个二分类任务（替代 token 检测）。

    训练过程：G 和 D 联合训练。G 用 MLM 损失训练，D 用二分类交叉熵（针对所有 token，不仅仅是 mask 位置）训练。生成器将难以区分的难例提供给判别器。

    为什么比 MLM 高效：

    - 标准 MLM 只在 15% 的被 mask 位置上计算损失，其余 85% 的 token 被浪费。ELECTRA 的判别器对所有输入 token都进行监督，相当于获得了大约 6 倍（1/15%）的监督信号密度，极大提高了数据效率。

    - 实验表明，在相同的计算量和数据下，ELECTRA 学习到的表征质量远高于 MLM。例如，一个 ELECTRA-base 模型可以媲美甚至超越 RoBERTa-large 的性能，而训练成本只有其 1/4。

    - 这种“替换 token 检测”任务比纯生成更难，迫使模型学习更细致的上下文表示。


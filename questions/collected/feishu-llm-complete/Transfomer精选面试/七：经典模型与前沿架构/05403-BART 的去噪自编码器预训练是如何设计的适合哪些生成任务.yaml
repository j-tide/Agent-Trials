  reference_answer: |-
    去噪自编码器预训练

    BART（Bidirectional and Auto-Regressive Transformer）是一个标准的 Encoder-Decoder 模型。其预训练目标是还原被破坏的文本：

    - 对输入文本施加多种噪声函数（任意顺序）：token 遮蔽、token 删除、文本填充（将连续 span 替换为单个 [MASK]）、句子重排、文档旋转等。

    - Encoder 接收被破坏的文本并编码成潜在表示，Decoder 自回归地生成原始未破坏文本。
    这种训练结合了双向编码（编码器看到所有破坏文本）和自回归解码，迫使模型学习语言的整体结构和生成能力。

    适合的生成任务

    BART 特别擅长序列到序列的生成任务，因为它天然就是为生成而设计的。微调后表现优异的任务包括：

    - 文本摘要（CNN/DailyMail, XSum）

    - 机器翻译（作为预训练 Decoder 初始化）

    - 对话生成

    - 文本复述
    它可以视为 BERT 和 GPT 的泛化：编码器类似 BERT 的双向，解码器类似 GPT 的自回归，因此对理解和生成任务都友好，但尤以生成见长。


content:
  prompt: 为什么许多模型在 FFN 上也尝试使用 MoE，而不是只在注意力上改进？
answer:
  mode: rubric
  reference_answer: |-
    原因分析：

    - 参数容量扩展的效率：Transformer 模型中，FFN 通常占据总参数量的约 2/3（因为 dffdff 常设为 4d）。要大幅增加模型容量，扩展 FFN 比扩展注意力头数更高效。MoE 通过引入多个 FFN 专家，能在维持推理计算量基本不变（由于稀疏激活）的情况下，将总参数量提升数倍至数十倍，直接带来性能飞跃。

    - 计算的天然稀疏性：FFN 对每个 token 独立进行变换，token 间无交互。这非常适合条件计算——每个 token 可以被路由到不同的专家，而不会破坏注意力所需的序列交互。实现负载均衡和设备间通信的挑战相对可控。而在注意力中引入稀疏路由，会破坏注意力矩阵的密集并行结构，实现更复杂。

    - 成本与收益：注意力机制的改进（MQA/GQA/MLA）主要解决推理时的内存带宽和缓存容量瓶颈，这些是部署的硬约束。而 MoE 主要解决模型规模扩展的瓶颈，即用更多参数学习更复杂的数据模式，是性能导向的。两者解决不同维度的问题，结合起来（如 Mixtral 使用 GQA 和 MoE）可以实现既高效又强大的模型。

    - 实践证明：大量实验表明，同等推理预算下，MoE 模型比稠密模型表现更优。在注意力上做稀疏化（如头剪枝）带来的收益通常不如在 FFN 上使用 MoE 显著。


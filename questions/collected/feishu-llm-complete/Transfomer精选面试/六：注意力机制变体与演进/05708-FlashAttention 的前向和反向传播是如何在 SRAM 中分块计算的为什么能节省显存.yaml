    节省显存的原因

    标准实现需要在前向存储完整的 N×N 注意力矩阵 P 用于反向，这对长序列是巨大的显存开销（例如 N=8k, 每个头 FP16 下约 128 MB，多头则更大）。FlashAttention 仅需存储 O(N) 的统计量（m, l）和输出 O，反向时重新计算 P。尽管重计算带来约 30% 的额外计算量，但由于 GPU 瓶颈在内存带宽而非计算，总的运行时间反而下降，且显存占用降至原来的 1/N 量级，使得 batch size 可增大，进一步提升了训练效率和模型扩展能力。


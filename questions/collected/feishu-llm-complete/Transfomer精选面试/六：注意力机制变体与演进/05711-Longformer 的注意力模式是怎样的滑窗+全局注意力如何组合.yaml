content:
  prompt: Longformer 的注意力模式是怎样的？滑窗+全局注意力如何组合？
answer:
  mode: rubric
  reference_answer: |-
    Longformer 的注意力模式是由 滑动窗口注意力（Sliding Window Attention） 和 全局注意力（Global Attention） 两个部分组合而成的混合稀疏注意力。

    [图片内容未导入]

    全局注意力

    - 预先选择少量的 token 作为“全局 token”。例如，分类任务中的 [CLS] token，问答任务中问题段落的分隔符，或者所有标点符号等。

    - 全局 token 分两类操作：

    - 作为查询（Query）：全局 token 可以关注序列中的所有 token，从而汇聚整个输入的信息。

    - 作为键（Key）：所有普通 token 也可以关注这些全局 token，使得全局信息能够广播到序列的每个位置。

    - 通常全局 token 的数量 gg 非常小（例如 1～100），所以这部分额外开销为 O(N⋅g)，同样线性。

    组合方式

    在具体计算中，Longformer 为注意力矩阵设计了一个掩码模式：

    - 对于每个非全局 token，掩码仅允许其关注窗口内的 token 和所有全局 token。

    - 对于每个全局 token，掩码允许其关注所有 token（即稠密行）。

    这样，注意力矩阵被分解为一个稠密条带（局部）加上少数全连接的行和列（全局）。这种组合使得每个 token 既能通过局部窗口维持细节上下文，又能通过全局 token 在长距离上迅速传递信息，无需为整个 N×N 矩阵付出代价。


content:
  prompt: 在 Encoder-Decoder 结构中，Decoder 的交叉注意力层参数量与自注意力相比如何？
answer:
  mode: rubric
  reference_answer: |-
    Decoder 的每一层包含两个注意力子层：自注意力和交叉注意力（以及前馈网络）。假设模型隐藏维度为 d，全连接投影维度为 dff。

    - 自注意力层参数：包含 Q、K、V、输出投影四个矩阵，每个形状为 d×d（实际按头切分后总参数量等同于 d×d 的四个矩阵），所以参数量为 4d2（忽略偏置）。

    - 交叉注意力层参数：同样包含 Q、K、V、输出投影。Q 投影矩阵作用于解码器隐藏态（维度 d），K 和 V 投影矩阵作用于编码器输出（维度也是 d，因为通常编码器和解码器维度相同）。因此，每个投影矩阵也都是 d×d，参数量同样是 4d2。

    结论：在标准配置下，交叉注意力层的参数量与自注意力层完全相同。因此，Decoder 的注意力参数总量是自注意力层的两倍。这也是为什么纯 Decoder-only 模型在参数效率上更具优势，因为它们不需要独立处理外部序列的交叉注意力参数。


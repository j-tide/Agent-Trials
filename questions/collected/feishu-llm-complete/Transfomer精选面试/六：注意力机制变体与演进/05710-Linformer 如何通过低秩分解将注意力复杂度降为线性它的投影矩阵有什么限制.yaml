content:
  prompt: Linformer 如何通过低秩分解将注意力复杂度降为线性？它的投影矩阵有什么限制？
answer:
  mode: rubric
  reference_answer: |-
    低秩分解降复杂度

    Linformer 的关键发现是：经过 softmax 归一化后的注意力矩阵 P（形状 N×N）在真实数据上通常是低秩的。因此，可以直接在 K 和 V 的序列长度维度上应用线性投影，将其压缩到一个固定的较小维度 k（如 128 或 256）。

    [图片内容未导入]

    投影矩阵的限制

    - 依赖序列长度 N：投影矩阵 E,F 的大小是 k×N，其中 N 是训练时的最大序列长度。这导致模型无法直接应用于比训练长度更长的序列，除非对投影矩阵进行插值、截断或重新设计。

    - 泛化到变长序列的困难：实际中可以通过参数化的投影（如用卷积层或多层感知机）来替代固定的矩阵，使其能处理可变长度。例如，在 Linformer 的实践中，使用了层级的卷积投影，这样在推理时可以动态适应序列长度，但性能可能与固定 N 的矩阵有差异。

    - 线性投影可能损失信息：将 N 维压缩到 k 维，如果 k 太小，会丢失细粒度的 token 差异，影响需要精确 token 级别的任务（如问答定位）。但对于很多全局理解任务（如分类、摘要）影响较小。

    - 跨序列共享：投影在训练和推理时是共享的，但若测试时的序列长度与训练差异极大，投影的有效性会下降。


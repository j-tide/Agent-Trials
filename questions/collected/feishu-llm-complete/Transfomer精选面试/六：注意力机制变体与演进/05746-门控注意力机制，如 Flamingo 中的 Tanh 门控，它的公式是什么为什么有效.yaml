content:
  prompt: 门控注意力机制，如 Flamingo 中的 Tanh 门控，它的公式是什么？为什么有效？
answer:
  mode: rubric
  reference_answer: |-
    Flamingo 中的公式：

    Flamingo 在冻结的语言模型层之间插入了门控交叉注意力层，用于处理视觉 token。其核心操作可以表述为：

    [图片内容未导入]

    其中，x 是语言模型的隐藏状态，α 是一个可学习的标量参数，初始化为 0。Kv 和 Vv 来自视觉编码器。tanh(α) 作为门控值，决定视觉信息注入的幅度。

    有效性分析：

    - 零初始化保留先验：训练开始时，tanh(0)=0，因此视觉分支的输出被完全屏蔽，模型等同于原始的语言模型。这避免了在训练初期随机初始化的视觉分支破坏语言表征，使训练极其稳定。

    - 平滑的信息融合：随着训练，α 被更新，门控逐渐打开，视觉特征缓慢融入。这种渐变过程允许语言模型在保留原有语言能力的同时，逐步学会利用视觉线索，实现模态对齐，有效防止灾难性遗忘。

    - 自适应的门控值：每个插入层拥有独立的 α，允许不同层自适应地决定所需视觉信息的多少，浅层可能更依赖语言先验，深层可能更需要视觉细节。


  reference_answer: |-
    推理时缓存的完整内容：

    [图片内容未导入]

    相比 GQA 的进一步压缩原因：

    - GQA 通过减少键值头数量（从 H 到 G）来压缩，但每个保留的键值头仍然具有完整的维度 head_dim。其压缩比上限为 1/G。

    - MLA 则通过对所有键值头进行联合低秩分解，打破了头之间的独立维度。它不仅减少了头数（等效于所有头共享一个压缩态），而且进一步将单个共享态的维度压缩到极小的 dc。这是一种比单纯共享更彻底的压缩，因为矩阵的低秩特性被显式利用，可以逼近给定缓存预算下的信息保留上界。MLA 可视为 MQA 的泛化，其共享的单一 K/V 表示不是满秩的，而是被约束在低维子空间内。


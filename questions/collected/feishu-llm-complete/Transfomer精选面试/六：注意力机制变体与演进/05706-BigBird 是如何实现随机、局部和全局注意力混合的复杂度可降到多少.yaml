content:
  prompt: BigBird 是如何实现随机、局部和全局注意力混合的？复杂度可降到多少？
answer:
  mode: rubric
  reference_answer: |-
    BigBird 证明了一个重要定理：通过结合三种稀疏注意力模式，模型既能保持全注意力的表达能力（如图灵完备性），又能将复杂度降至线性。其混合模式包括：

    局部窗口注意力

    [图片内容未导入]

    全局 token

    选择一些 token 作为全局节点（例如 [CLS] 以及每 d 个 token 选一个，或随机选取），总数 g 为常数。这些 token 参与全注意力的行和列。

    随机注意力

    每个 token 额外随机选择 r 个其他 token 参与注意力计算。这些随机连接可以看作在局部图和全局节点之间增加了随机边，使图变成扩展图（expander graph），信息混合极快。
    BigBird 理论证明，在局部窗口、全局节点和随机边的共同作用下，注意力图成为一个扩张性极好的随机图，任意两个节点之间的路径长度很短，使得 Transformer 在理论上仍然是通用的近似器。

    复杂度

    每个 token 关注的键数量为：w（局部）+ g（全局）+ r（随机）。所有这些参数都是常数（与序列长度 N 无关），因此计算和内存复杂度为 O(N)，即线性复杂度。

    实际上，BigBird 在长序列（如 4096 或更长）上的训练和推理速度比全注意力快数倍，且显存占用大幅降低，同时在长文档摘要、问答等任务上保持了与全注意力相当的性能。


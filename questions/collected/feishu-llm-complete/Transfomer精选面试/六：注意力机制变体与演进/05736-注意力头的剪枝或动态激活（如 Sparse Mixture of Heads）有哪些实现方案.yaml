content:
  prompt: 注意力头的剪枝或动态激活（如 Sparse Mixture of Heads）有哪些实现方案？
answer:
  mode: rubric
  reference_answer: |-
    注意力头剪枝方案：

    - 基于重要性的静态剪枝：通过对每个头施加掩码并计算其对损失的影响（如泰勒展开的一阶近似），移除影响最小的头，然后微调恢复精度。

    - 结构化移除：直接删除整个注意力头的 Q、K、V、输出权重矩阵的相关行/列，压缩模型尺寸和推理开销。

    - 知识蒸馏剪枝：让学生模型（头数较少）模仿教师模型各头的注意力分布和输出。

    动态激活（Sparse Mixture of Heads）方案：

    - 基于门控的稀疏激活：为每个注意力头引入一个可学习的门控分数（由输入动态计算），仅当分数超过阈值或属于 top-k 时，该头才参与计算。这类似于 MoE 的路由思想，只是应用于注意力头。

    - 上下文感知的头选择：训练一个轻量级策略网络，根据输入 token 的特征（如位置、句子边界、频次等）决定激活哪些头。

    - 层次化头结构：将头分为若干组，每层或每个 token 只激活一组。

    - 共享头的条件计算：在 GQA 基础上，动态选择每个组内的激活头数量，不重要的头可被关闭。

    这些方案可以显著减少计算量，尤其适合边缘推理或可变预算推理（anytime prediction）。


content:
  prompt: 注意力机制的结构性改变往往需要重新训练，能否在微调时从 MHA 转换成 GQA？
answer:
  mode: rubric
  reference_answer: |-
    肯定可以，并且已有成熟方法。这正是 GQA 论文的核心贡献——从 MHA 检查点到 GQA 的低成本转换与微调。

    转换步骤：

    - 权重复制与合并：假设预训练 MHA 模型有 H 个头，我们想转换为 G 个组的 GQA。首先，将原始 H 个头按顺序划分到 G 个组，每组包含 H/G 个头。

    - 初始化共享 K、V 权重：对于每个组，将其内所有头的 Key 投影矩阵进行平均池化（通常直接逐元素平均），得到该组共享的 Key 投影矩阵。对 Value 投影矩阵做同样操作。Query 投影矩阵和输出投影矩阵保持不变（因为查询头仍独立，输出维度由总头数决定，实际未变）。

    - 微调恢复性能：用原始训练数据（或任何大文本语料）对转换后的模型进行微调。实验证明，只需极少量训练（例如原训练步数的 5%，甚至几十亿 token 的微调），模型性能就能迅速爬升，最终达到与原始 MHA 模型相当或仅略微降低的困惑度与下游任务指标。

    可行性总结：这种转换利用了大模型参数的冗余性，平均合并提供了极好的初始猜测，微调则允许模型适应共享带来的约束。因此，从 MHA 到 GQA 的升级几乎可以零成本地在已有模型上实现，极大地降低了迁移门槛，这也是 GQA 迅速普及的重要原因。

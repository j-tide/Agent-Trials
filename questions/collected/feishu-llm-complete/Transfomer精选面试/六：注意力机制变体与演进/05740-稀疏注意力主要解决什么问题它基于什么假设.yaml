content:
  prompt: 稀疏注意力主要解决什么问题？它基于什么假设？
answer:
  mode: rubric
  reference_answer: |-
    解决的问题：
    标准自注意力机制的计算复杂度为 O(N2d)，其中 NN 是序列长度，d 是每个头的维度。当 N 达到数千或数万时（如长文档、高分辨率图像、DNA序列），计算每个 token 对之间的注意力分数将产生巨大的计算开销和显存占用。具体来说，存储N×N 的注意力矩阵需要O(N2) 内存，反向传播时需要缓存该矩阵或重计算，显存极易溢出。这严重限制了 Transformer 处理长序列的能力。

    稀疏注意力旨在将这一复杂度降低到 O(N⋅k⋅d) 或 O(Nd2)，其中 k≪N 是每个 token 关注的固定数量的其他 token。通过限制每个查询 token 只能与一个稀疏的 key 集合交互，避免了构建稠密的 N2 矩阵。

    核心假设：

    稀疏注意力建立在这样一个先验假设之上：注意力矩阵是高度稀疏的，且大部分有价值的信息交互集中在局部或特定的全局节点上。

    具体而言：

    - 局部性假设：自然语言、图像、音频等数据具有很强的局部相关性。一个词的语义通常由其邻近的词决定，远处的直接关联很弱（除非有特殊指代）。

    - 全局节点的桥梁作用：某些特殊 token（如 [CLS]、句号、段落起始标记）或依据任务选定的 token 承载了汇聚和分发全局信息的功能，应当被所有 token 关注。

    - 随机连接补充：类似随机图的性质，在局部和全局之外，少量随机连接能保证信息快速混合，使得任意两个 token 之间的信号传递路径长度维持在O(logN) 级别，并能从理论上逼近全注意力。

    基于此，可以设计出多种稀疏模式（局部窗口、空洞窗口、全局注意力、随机注意力等），在极大降低计算量的同时，尽可能保持模型的长期依赖建模能力。


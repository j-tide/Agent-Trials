content:
  prompt: 如果不使用 softmax，注意力权重可以用什么替代？如 Sparsemax 或 Entmax，有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    常见的 softmax 替代有 Sparsemax、Entmax、Sparsegen 等，它们都输出稀疏概率分布。

    Sparsemax

    - 公式：Sparsemax(z) = argmin_{p ∈ Δ^{d-1}} ‖p - z‖²，即概率单纯形上的欧氏投影。结果会将大部分概率集中在少数几个元素上，其余置零。

    - 好处：产生真正的稀疏注意力，直接忽略不重要的 token，不仅计算效率可能提升（稀疏矩阵乘），还能提供更强的可解释性。

    Entmax（如 1.5-entmax）

    - 是 softmax 的 Tsallis 推广：Entmax_α(z) = argmax_{p ∈ Δ} pᵀz + H_α^T(p)，其中 H_α^T 是 Tsallis 熵。α=1 为 softmax，α=2 为 Sparsemax，α=1.5 是中间态。

    - 好处：自适应地调整稀疏程度，保留 softmax 的可微性，同时在训练中诱导更结构化的注意力，提升性能并减少噪声。

    好处总结：

    - 稀疏性：大量权重为零，加速后续乘法，节约内存。

    - 更好的泛化：强制模型做出更果断的选择，避免注意力被分散到无关 token，特别适合长文档和需要精确聚焦的任务。

    - 可解释性：清晰的非零权重易于可视化，有助于分析模型决策依据。


content:
  prompt: 如何分析不同注意力头的作用？有没有方法可视化或量化每个头的重要性？
answer:
  mode: rubric
  reference_answer: |-
    分析方法与工具：

    - 注意力图可视化：最直接的方法，绘制某个输入序列的注意力权重矩阵热图。可观察各头是否倾向于关注固定位置、特定词性、标点或形成某种模式（对角、全局等）。

    - 消融实验：逐个或成组地将注意力头置零或屏蔽，评估模型在验证集上的困惑度或特定任务指标的下降幅度。下降越显著，头越重要。

    - 头部重要性评分（Head Importance Score, HIS）：定义敏感性指标，例如：

    [图片内容未导入]

    其中 ξh 是施加在该头输出的掩码变量。或者使用基于泰勒展开的损失变化估计。

    - 探索性分类器（Probing）：训练一个简单的线性分类器，将注意力头的输出作为特征，预测某些语言学属性（如句法深度、时态、共指关系）。分类精度反映了该头编码了该属性。

    - 注意力熵和模式统计：计算每个头的注意力分布的熵，低熵表示专注，高熵表示分散。同时统计与位置距离的 Pearson 相关系数，判断是偏向局部还是全局。

    - 可视化降维：使用 PCA 或 t-SNE 将不同头对多个样本的输出向量或注意力权重向量进行降维，观察聚类情况，识别功能相似的头。

    - 扰动分析：交换 Key 或 Value，观察输出变化，判断头是内容依赖还是位置依赖。


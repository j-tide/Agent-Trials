content:
  prompt: 相对位置编码是否也可以看作一种对注意力偏置的增强？
answer:
  mode: rubric
  reference_answer: |-
    是的，可以这样理解。
    相对位置编码（Relative Position Encoding）的本质就是在计算注意力权重时，在原始的 QK^T 相似度基础上，加上一项仅依赖于 token 间相对位置的标量偏置（或向量偏置项）。从公式上看：

    [图片内容未导入]

    作为一种偏置增强

    - 绝对位置编码是直接加到 token 的初始表示上，改变 Q 和 K 的内容。相对位置编码则是直接修改注意力矩阵的 logits，这相当于对“哪些位置的 token 更容易被关注”给出了明确的先验偏置（例如：距离近的 token 偏置更大，更易被关注；距离远的偏置小）。

    - 这种偏置是独立于内容的，仅基于位置关系，为注意力分数提供一个结构化的基底。它可以被看作是一种对注意力矩阵的稀疏化或正则化，鼓励模型关注合理的范围，与稀疏注意力的固定模式有异曲同工之处。

    - 因此，相对位置编码、注意力偏置（如 T5 中的相对位置偏置）、ALiBi（线性偏置注意力）都可归纳为附加在注意力 logits 上的偏置增强，它们不改变 K、V 的内容，但重塑了注意力的分布，大大提升了模型处理长序列的外推能力。


  reference_answer: |-
    ConvBERT 的设计

    ConvBERT 是一种将卷积操作融入 Transformer 注意力机制的混合结构。其核心创新是混合注意力块，将标准自注意力与轻量级的空洞卷积相结合。具体做法：

    - 在注意力头计算输出时，分为两个分支：一个分支使用常规的基于点积的自注意力（Q、K、V 投影），另一个分支使用基于卷积的跨度注意力。

    - 卷积分支利用一维空洞卷积（或深度可分离卷积）对 Value 序列进行局部变换。对于每个位置，卷积核在其邻域内聚集信息，输出一个局部增强的 Value 表示。

    - 两个分支的输出通过门控机制或简单相加进行融合。

    - 此外，ConvBERT 还引入了一种跨度操作：不是直接使用所有 token，而是通过间隔采样 Q 或 K 来减少注意力头中的交互数量，从而进一步降低复杂度。

    带来的好处

    - 增强局部建模能力：标准自注意力在捕捉短距离模式（如短语结构、词形搭配）时，可能由于分布的过度平滑而效率不高；卷积核直接为局部窗口提供了强烈的归纳偏置，让模型更容易学到局部语法。

    - 效率提升：卷积分支的计算量是线性于序列长度的，且混合设计允许降低注意力头的维度或减少注意力的范围，从而整体降低计算复杂度。

    - 补充低频与高频特征：自注意力擅长捕捉长程依赖和全局上下文，卷积擅长提取局部纹理，两者互补，使模型在语言理解任务上取得了比纯 Transformer 或纯卷积更好的性能。

    - 减少训练难度：局部卷积的强归纳偏置可以加速收敛，降低对大量预训练数据的依赖。


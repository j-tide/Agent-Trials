content:
  prompt: MQA（Multi-Query Attention）的提出动机是什么？最初在哪个模型中使用？
answer:
  mode: rubric
  reference_answer: |-
    动机深入剖析：
    标准多头注意力（MHA）在自回归解码阶段存在严重的内存带宽瓶颈。每次生成一个新 token，都需要将整个序列的 Key 和 Value 张量（KV cache）从显存（HBM）读取到计算单元。随着序列长度增加和并发请求增多，KV cache 的数据搬运量成为延迟的主要来源。在 MHA 中，每个注意力头都有独立的 K 和 V 投影，因此 KV cache 的大小为 batch × seq_len × num_heads × head_dim。这意味着读取 KV cache 的内存带宽需求与头数成正比。

    MQA 的核心动机是减少 KV cache 的大小和带宽需求。它观察到，不同注意力头的查询虽然捕获不同模式，但键和值可能存在高度冗余。因此，MQA 解除了 Key 和 Value 的多头性：所有查询头共享同一套 Key 和 Value 投影。这样一来，KV cache 的大小缩减为原来的 1/num_heads，显存占用和读取带宽大幅降低，推理速度显著提升，尤其是在大批量、长序列场景。

    最初模型：

    MQA 由 Shazeer 在 2019 年的论文《Fast Transformer Decoding: One Write-Head is All You Need》中提出，最早在机器翻译模型的推理优化中应用。后来被许多大模型采用，例如 PaLM（540B）和 Falcon。


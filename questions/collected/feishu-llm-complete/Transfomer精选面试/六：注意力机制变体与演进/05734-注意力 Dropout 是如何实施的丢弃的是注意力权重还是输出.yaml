content:
  prompt: 注意力 Dropout 是如何实施的？丢弃的是注意力权重还是输出？
answer:
  mode: rubric
  reference_answer: |-
    通常是对注意力权重进行 Dropout。

    在 Transformer 的原始实现和绝大多数后续工作中，注意力 Dropout 被施加在 softmax 归一化之后的注意力权重矩阵上。具体流程：

    [图片内容未导入]

    有些实现也会在计算 softmax 之前对注意力 logits 进行 Dropout（称为注意力 logits dropout），效果类似。

    为什么不是输出？

    - 标准 Transformer 中，另有一个独立的 Dropout 层施加在每个子层（自注意力、FFN）的输出上，即残差连接之后的全连接输出，那是针对输出的 Dropout。

    - 注意力权重的 Dropout 的目的是防止注意力过度集中于少数 token，促使模型分散关注点，增强泛化性。这和特征 Dropout 作用于神经元输出的思想不同，但同样起到正则化作用。

    所以，注意力 Dropout 丢弃的是归一化后的注意力权重矩阵中的元素。


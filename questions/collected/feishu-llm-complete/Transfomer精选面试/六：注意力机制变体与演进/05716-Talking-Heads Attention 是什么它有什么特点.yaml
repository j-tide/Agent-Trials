content:
  prompt: Talking-Heads Attention 是什么？它有什么特点？
answer:
  mode: rubric
  reference_answer: |-
    Talking-Heads Attention 是在多头注意力计算中，在不同头之间进行信息交换的机制。

    标准多头注意力中，各头独立计算，最后简单拼接。Talking-Heads 在计算注意力权重之前或之后，引入了头之间的线性投影。

    具体形式：

    - 形式1（在 logits 上“交谈”）：在计算 softmax 之前，将各头的注意力 logits 矩阵视为通道，应用一个跨头的 1×1 卷积（即线性变换），混合不同头的 logits，然后各自做 softmax。

    - 形式2（在注意力权重上“交谈”）：在 softmax 之后，对注意力权重矩阵进行跨头线性混合，然后再乘以 V。

    - 形式3：两者都做。

    特点：

    - 打破头隔离：允许头之间共享注意力模式，模型可以学习到更复杂的组合行为，例如一些头负责发现模式，另一些头负责抑制或增强。

    - 提升表示能力：在不增加太多参数的情况下，增强了注意力机制的灵活性，尤其利于需要高阶交互的任务。

    - 提高参数效率：实验显示，用较少的头就能达到标准多头注意力的效果，或者同等头数下性能更好。

    - 该机制由 Shazeer 等人提出，用于改进 Transformers，后来也被应用于 T5 等模型。


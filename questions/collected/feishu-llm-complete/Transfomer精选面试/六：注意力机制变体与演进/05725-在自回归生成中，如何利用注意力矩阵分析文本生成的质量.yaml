content:
  prompt: 在自回归生成中，如何利用“注意力矩阵”分析文本生成的质量？
answer:
  mode: rubric
  reference_answer: |-
    注意力矩阵提供了模型内部决策的可见性，可用于评估和分析生成质量：

    - 重复性检测：如果生成的 token 的注意力分布极度集中在前一个 token（对角线附近的一个狭窄峰值），模型可能陷入重复循环。通过观察注意力模式的变化，可以设计重复惩罚或停止条件。

    - 连贯性与主题偏移：查看生成过程中对新 token 的注意力是否长时间停留在生成的开头部分（远距离依赖），或者突然跳跃到完全无关的上下文，这可以揭示连贯性问题。

    - 幻觉检测：当生成事实性内容时，观察注意力是否聚焦在输入中的相关证据 token 上。如果注意力弥散或集中在无意义的 token，可能预示幻觉。

    - 上下文利用度：分析因果注意力中，每一步对输入 prompt 各部分的注意力分布，可以评估模型是否有效利用给定的上下文，还是主要依赖自生成历史。

    - 解码策略调优：通过注意力熵（分布的均匀性）可以自适应地调整温度、top-k/p，例如熵过大时降低温度以避免发散。

    总之，注意力矩阵是诊断模型行为的有效工具，结合梯度可进一步定位问题层或头。


content:
  prompt: 线性注意力的主要缺点是什么？在哪些任务上可能效果不如标准注意力？
answer:
  mode: rubric
  reference_answer: |-
    主要缺点

    - 失去 softmax 的“稀疏选择性”：标准 softmax 将注意力权重挤压到局部高点，极大地抑制无关 token，使得模型能聚焦于最关键的信息。线性注意力本质上是核平滑，注意力权重更“平均”，缺少这种尖锐的聚焦能力，容易让大量无关信息混入聚合。

    [图片内容未导入]

    效果可能不如标准注意力的任务

    - 精确的长文档问答：需要在长文中定位某一个小片段的证据，标准注意力或窗口+全局的稀疏注意力能直接关注到相关 token，而线性注意力的聚合表示可能无法保留如此精细的 token 级区别。

    - 需要强对齐的任务：如跨句子语义匹配、共指消解，这些任务需要计算特定 token 对之间的精确相似度，线性核近似可能不够精确。

    - 少样本学习（Few-shot）：在上下文学习（in-context learning）中，标准注意力的稀疏性质有助于从示例中迅速抓取模式，而线性注意力可能将示例的细节过度平滑，降低学习效率。

    - 生成任务中的复制能力：线性注意力在记忆和复制长序列中的特定 token 时往往不如稠密注意力或局部+全局注意力可靠。


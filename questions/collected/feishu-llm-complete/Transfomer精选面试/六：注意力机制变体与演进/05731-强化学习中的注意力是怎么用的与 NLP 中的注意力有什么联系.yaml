content:
  prompt: 强化学习中的注意力是怎么用的？与 NLP 中的注意力有什么联系？
answer:
  mode: rubric
  reference_answer: |-
    强化学习中的注意力

    在 RL 中，注意力主要用作策略网络或价值网络的一部分，处理具有结构性的观察（如多实体、多模态、关系图）。分为：

    - 硬注意力：根据策略采样选择一个输入实体（如 Atari 游戏中关注某个区域），用于减少计算并做决策。训练需要 REINFORCE 或 Gumbel-Softmax。

    - 软注意力：类似 NLP，对输入实体进行加权求和，生成上下文向量用于决策或值估计，完全可微。

    与 NLP 注意力的联系

    - 核心计算相同：都是 Query-Key-Value 加权。

    - NLP 注意力多用于序列间/序列内交互，RL 注意力多用于从环境状态中提取关键信息（如星际争霸中的单位交互）。

    - 两者都利用了注意力作为信息筛选和聚合的机制，RL 中的注意力常常是学习“关注什么”以最大化奖励，而 NLP 中通常作为特征提取的骨干。

    - Transformer 结构已被直接应用于离线强化学习（Decision Transformer），将 RL 轨迹建模为序列预测问题，使用标准因果自注意力来预测动作，因此 NLP 中的各种注意力变体（如 Longformer, FlashAttention）也被直接迁移到 RL 序列建模中。


content:
  prompt: 为什么引入卷积可以增强 Transformer 的局部建模能力？
answer:
  mode: rubric
  reference_answer: |-
    Transformer 自注意力的局限性

    自注意力机制计算所有 token 对的相似度，权重是动态且基于内容的。虽然理论上可以关注任何位置，但在缺乏足够数据或特定结构时，它可能会学习局部模式的效率较低：它需要从数据中“发现”邻近关系，而卷积天生就把邻近关系作为先验植入了架构。

    卷积带来的归纳偏置

    - 局部连接性：卷积核的大小固定，强制模型在小的空间窗口内聚合信息，这与自然语言的局部性（邻近词的依赖强）高度一致。

    - 平移等变性：卷积对输入中的局部模式具有平移等变性，无论短语出现在序列的哪个位置，卷积核都能以相同的方式提取特征，这有利于捕获通用的局部 n-gram 特征。

    - 参数效率：卷积核的参数与序列长度无关，对于局部窗口内的模式共享权重，从而在处理非常长的序列时仍能高效提取局部信息，且不容易过拟合。

    协同效应

    当卷积与注意力结合时，卷积可以“解放”注意力，让注意力不必浪费容量去学习那些显而易见的局部搭配，而是专注于更难的长程依赖和全局一致性。例如，在 ConvBERT 中，卷积分支先提取了稳固的局部特征，再与全局注意力结果融合，模型整体对短文本和长文本的理解都得到增强。


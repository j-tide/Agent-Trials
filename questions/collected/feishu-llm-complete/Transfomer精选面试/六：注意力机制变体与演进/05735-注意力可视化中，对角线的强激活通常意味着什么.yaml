content:
  prompt: 注意力可视化中，对角线的强激活通常意味着什么？
answer:
  mode: rubric
  reference_answer: |-
    对角线强激活意味着每个 token 主要关注自身或非常邻近的位置。这反映了几种可能：

    - 模型过度依赖自身信息：深层注意力可能会形成“复制自身”或“恒等映射”，尤其在缺乏良好训练或网络退化时，对角线极强而远距离注意力极弱，表明模型没有利用上下文。

    - 局部特征主导：在许多任务中，token 本身的语义至关重要，模型可能只在少量局部窗口内聚合信息，尤其对于句法解析等任务，对角附近的局部强激活是正常且健康的，说明模型在提取短语模式。

    - 位置偏置的影响：如果使用了强局部偏置（如滑动窗口、卷积增强），或者绝对位置编码对短距离有强偏好，也会导致对角线突出。

    - 潜在问题：如果在需要长程理解的层（如最后几层）仍只有对角线激活，可能意味着梯度消失或注意力饱和，模型无法建立长程依赖，可能需要调整初始化、增加层归一化或改进训练策略。


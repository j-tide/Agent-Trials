content:
  prompt: 如何将外部知识库的检索操作模拟为一种注意力形式？
answer:
  mode: rubric
  reference_answer: |-
    模拟方法：

    - 把知识库中的每条记录或文档片段编码成稠密向量，作为外部 Key 和 Value。

    - 给定一个输入 Query，计算 Query 与所有 Key 的相似度（点积或余弦），用 softmax 得到注意力权重。

    - 用这些权重对 Value（可以是文档表示或文档的原始 token 表示）进行加权求和，得到上下文向量，融入主模型。

    - 整个过程等同于一个巨大的交叉注意力层，其中 K、V 来自外部知识库，Q 来自模型当前状态。这就是 RAG (Retrieval Augmented Generation) 和 REALM 等模型的核心思想。

    实现：

    - 使用 FAISS 等近似最近邻搜索预先筛选 top-k 个文档，然后仅在这 k 个候选项上执行精确的注意力计算。

    - 训练可以端到端，梯度通过检索到的 Value 传递回 Key 编码器（如果重参数化允许），或者使用异步索引更新。这种“大型稀疏注意力”让模型拥有了几乎无限的外部记忆，且可随时更新知识。


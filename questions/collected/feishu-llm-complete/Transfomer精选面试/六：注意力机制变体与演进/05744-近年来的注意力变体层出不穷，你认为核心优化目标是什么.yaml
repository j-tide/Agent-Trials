content:
  prompt: 近年来的注意力变体层出不穷，你认为核心优化目标是什么？
answer:
  mode: rubric
  reference_answer: |-
    核心优化目标可以归结为两个矛盾的方面：

    - 效率：减少计算和内存复杂度（从 O(N²) 降到 O(N log N) 甚至 O(N)），降低内存带宽需求，提高硬件利用率，尤其是对长序列的处理能力。这体现在 FlashAttention（IO优化）、稀疏/线性注意力、MQA/GQA/MLA（减少 KV 缓存）等。

    - 表达能力：在降低计算量的同时，尽可能保留或增强模型捕捉长程依赖、多粒度模式的能力。稀疏和线性注意力若损失性能则不可接受，因此研究致力于寻找最佳的结构先验（窗口+全局、低秩、门控）或动态路由（基于内容的稀疏），以求不牺牲质量。

    此外，部署友好性（如量化、低精度、多平台支持）也逐渐成为重要优化目标。因此，核心矛盾是效率与表达能力的平衡，而理想目标是在维持或超越标准注意力性能的前提下，实现线性或次二次方的复杂度和极低的缓存需求。


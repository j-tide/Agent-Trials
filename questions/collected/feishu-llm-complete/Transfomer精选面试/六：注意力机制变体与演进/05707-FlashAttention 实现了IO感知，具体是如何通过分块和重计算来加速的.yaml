content:
  prompt: FlashAttention 实现了“IO感知”，具体是如何通过分块和重计算来加速的？
answer:
  mode: rubric
  reference_answer: |-
    IO 感知（IO-aware） 指的是算法设计时充分考虑了现代 GPU 的内存层次结构：

    - 高带宽显存（HBM）：容量大（如 80GB），但带宽相对较低（约 2 TB/s），且延迟高。

    - 片上 SRAM（Static Random-Access Memory）：每个流多处理器（SM）上有一小块（如 192 KB），带宽极高（约 19 TB/s）但容量极小。

    标准注意力中，计算 S=QK⊤ 需要将巨大的中间矩阵 S（N×N）写入 HBM 再读出以进行 softmax 和乘以 V。这种对 HBM 的频繁读写成为瓶颈（计算是快速的，数据搬运是慢的）。


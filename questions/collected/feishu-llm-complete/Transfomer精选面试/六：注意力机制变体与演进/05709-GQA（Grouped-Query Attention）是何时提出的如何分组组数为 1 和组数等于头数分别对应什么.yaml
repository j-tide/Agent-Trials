content:
  prompt: GQA（Grouped-Query Attention）是何时提出的？如何分组？组数为 1 和组数等于头数分别对应什么？
answer:
  mode: rubric
  reference_answer: |-
    提出时间与出处：

    GQA 于 2023 年在论文《GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints》中由 Ainslie 等人提出，作为 MHA 和 MQA 之间的优雅插值方案。

    分组方式详解：

    GQA 将总共 H 个查询头划分为 G 个组，每个组包含 H/G 个查询头。同一组内的所有查询头共享同一个 Key 头和一个 Value 头（即共享 K、V 投影矩阵）。不同组之间 K、V 独立。因此，KV 头的数量变为 G，而查询头数量仍为 H。在计算注意力时，每个组内使用对应的共享 K、V 与组内各查询头计算点积注意力，输出再进行拼接。

    边界情况：

    - 当 G = 1：所有查询头共享同一个 Key 和 Value，KV 头数为 1，这就是 MQA。

    - 当 G = H：每个组只有一个查询头，即每个查询头拥有自己的 K 和 V，KV 头数等于 H，这就是 标准 MHA。

    - 选取中间的 G（如 G = H/4）可以在推理效率（KV 缓存大小变为 MHA 的 G/H）和模型质量之间取得平衡。


content:
  prompt: 交叉注意力（Cross-Attention）在 Transformer 中的作用是什么？Q、K、V 来源分别是什么？
answer:
  mode: rubric
  reference_answer: |-
    作用：

    交叉注意力是连接两个不同序列的桥梁，让一个序列能够从另一个序列中动态提取相关信息。在 Seq2Seq 任务中，它允许解码器在生成每个输出 token 时，回顾编码器输出的整个源序列表示，实现输入与输出的对齐。此外，在多模态模型中，交叉注意力可用于融合图像特征和文本特征等。

    Q、K、V 的来源：

    - Query (Q)：来自需要进行信息检索的那一侧的表示。在标准的 Transformer 解码器中，Q 来自解码器前一自注意力层的输出（即目标序列的当前隐藏状态）。

    - Key (K) 和 Value (V)：来自被检索的一侧。在 Encoder-Decoder 中，K 和 V 都来自编码器的最终输出层，但经过不同的线性投影。通常 K 和 V 使用相同的源，投影矩阵独立。


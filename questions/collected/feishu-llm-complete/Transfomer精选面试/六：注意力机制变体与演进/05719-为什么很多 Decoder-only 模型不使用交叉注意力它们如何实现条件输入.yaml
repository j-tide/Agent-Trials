content:
  prompt: 为什么很多 Decoder-only 模型不使用交叉注意力？它们如何实现条件输入？
answer:
  mode: rubric
  reference_answer: |-
    不使用交叉注意力的原因：

    - 架构简洁与扩展性：Decoder-only 将所有输入（指令、上下文、用户提示）简单拼接成一个连续的序列，统一由因果自注意力处理。这种同质的序列建模简化了模型设计、训练流水线和推理引擎，无需为编码器和交叉注意力维护额外的逻辑。

    - 预训练与上下文学习：在海量文本上进行下一个 token 预测，使得 Decoder-only 模型天然具备了上下文学习能力。它可以通过上下文中的示例和指令，隐式地完成条件生成，效果往往不亚于显式的交叉注意力，且更灵活。

    - 推理效率：纯自注意力模型只需管理一个 KV 缓存（自注意力的缓存），而 Encoder-Decoder 模型需要缓存编码器的输出（或重计算）以及解码器的自注意力和交叉注意力缓存，系统更复杂。Decoder-only 的 KV 缓存技术（如 PagedAttention）发展成熟，进一步放大了其部署优势。

    实现条件输入的方法：

    - 前缀拼接：将条件文本与待生成的文本前缀拼接，模型依靠自注意力将条件信息融合到后续生成中。这是最主流的方式，GPT 系列模型皆如此。

    - 嵌入注入：通过额外的嵌入向量（如任务标识、时间步）与 token 嵌入相加，或使用 Adapter / LoRA 在自注意力子层中注入条件参数。

    - 权重调制：某些模型（如 ControlNet）通过复制自注意力块的权重并加入条件控制信号，实现对生成内容的精细控制。


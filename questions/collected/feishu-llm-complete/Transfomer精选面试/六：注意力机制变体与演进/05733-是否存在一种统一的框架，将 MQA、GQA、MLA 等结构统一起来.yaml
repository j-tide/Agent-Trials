    统一框架的视角：

    这些结构都在解决同一个问题：如何以最小的 KV 缓存代价，保留多头注意力的表达能力。它们可以从“键值头的数量和表示形式”这一维度上进行统一。

    定义一个键值缓存配置：

    - 键值头数量：HkvHkv

    - 每个键值头的产生方式：可以是直接从输入投影得到（标准），也可以是从一个更低维的公共表示解压得到（低秩）。


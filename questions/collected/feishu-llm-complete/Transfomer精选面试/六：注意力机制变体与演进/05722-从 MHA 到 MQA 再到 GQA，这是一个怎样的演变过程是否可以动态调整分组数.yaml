content:
  prompt: 从 MHA 到 MQA 再到 GQA，这是一个怎样的演变过程？是否可以动态调整分组数？
answer:
  mode: rubric
  reference_answer: |-
    演变过程的技术脉络：

    - MHA（2017）：原始设计，表达能力强，但推理时 KV 缓存开销大，不利于长序列生成和批量服务。

    - MQA（2019）：为极致提升推理效率，将所有查询头共享同一对 K、V。虽大幅减少缓存，但从头训练时可能面临优化难度，特别是大模型可能损失一些细粒度表达能力。

    - GQA（2023）：认识到 MQA 在某些情况下可能过于激进，而 MHA 过于奢侈，于是提出了可配置的分组共享。GQA 不仅可以通过转换从 MHA 微调得到，而且作为一种广义框架，统一了 MHA 和 MQA。如今，主流大模型（如 Llama 2 70B、Llama 3、Mistral、Qwen2）普遍采用 GQA，组数通常设为 4 或 8。

    是否可动态调整分组数：

    在单次推理过程中动态改变分组数是不现实的，因为分组数决定了模型权重的形状和计算的 kernel。但是，在模型版本或不同负载间切换是可以的。更确切地说，可以通过权重转换将一个固定分组数的模型转化为另一个分组数的模型。例如，可以将训练好的 G=4 的 GQA 模型通过平均合并转换为 G=1 的 MQA 模型（甚至无需微调即可使用，虽然会有微小质量损失），反之则不行（因为需要拆分复制权重，信息量不足）。因此，分组数通常作为一个固定的结构超参数，但通过后训练转换，可以在不同部署需求下灵活生成不同效率的模型变体。


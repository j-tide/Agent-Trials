content:
  prompt: Grouped-Query Attention (GQA) 是如何在 MQA 和 MHA 之间折中的？分组数如何选择？
answer:
  mode: rubric
  reference_answer: |-
    GQA 将注意力头分成 GG 个组，每个组共享一组K和V，而Query仍是每个头独立。这样，KV缓存大小变为原来的 G/HG/H（假设每组头数相同）。当 G=1G=1 时即MQA，当 G=HG=H 时即MHA。通过调整 GG，可以在速度和模型质量之间取得平衡。

    分组数的选择取决于对推理效率和生成质量的权衡。LLaMA 2 70B 使用 G=8G=8（H=64H=64），这样每个KV组服务于8个头，在几乎不损害下游任务性能的情况下，将KV缓存减少为原来的1/8。通常，模型越大，适当的分组数（如8）带来的性能损失越小，而推理加速明显。实验表明，GQA在多数任务上与MHA质量相当，但推理速度显著提升。

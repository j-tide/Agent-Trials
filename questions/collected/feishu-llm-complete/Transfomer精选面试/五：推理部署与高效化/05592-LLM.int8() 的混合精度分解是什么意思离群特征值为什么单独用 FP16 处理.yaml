content:
  prompt: LLM.int8() 的混合精度分解是什么意思？离群特征值为什么单独用 FP16 处理？
answer:
  mode: rubric
  reference_answer: |-
    LLM.int8() 观察到：Transformer层中，约0.1%的特征维度（通道）存在系统性离群值（数值比中位数大20倍以上），且这些离群值出现在固定的特征维度上，与输入无关。这些离群值如果用INT8量化会导致巨大误差。

    混合精度分解：

    - 分离离群维度：对于每个线性层，根据激活值的统计识别出离群特征维度（通常约0.1%）。

    - 分解矩阵乘法：将原始矩阵乘法 C=A⋅B 分解为两部分：

    - 离群维度部分：将输入 A 的离群列和权重 B 的离群行提取出来，用FP16精度计算。

    - 正常维度部分：剩余大部分维度用INT8进行高效矩阵乘法。

    - 最终输出 = INT8结果 + FP16结果（在FP16下相加）。

    因为离群维度极少，FP16部分的计算开销很小（约1%）。而占计算量99%的主体部分用INT8加速，整体保持FP16的精度。LLM.int8() 证明了可以在LLM推理中安全使用INT8，精度几乎无损失。

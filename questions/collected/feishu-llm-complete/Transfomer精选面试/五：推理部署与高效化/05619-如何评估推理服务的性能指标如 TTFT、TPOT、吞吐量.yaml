content:
  prompt: 如何评估推理服务的性能指标？如 TTFT、TPOT、吞吐量。
answer:
  mode: rubric
  reference_answer: |-
    核心指标围绕延迟和吞吐，需在特定负载和并发下测量：

    - TTFT（Time to First Token，首令牌时间）：从请求到达服务端到返回第一个生成的 token 之间的延迟。它反映 prompt 处理效率、调度排队延迟和 prefill 计算速度。低 TTFT 对交互式应用至关重要。

    - TPOT（Time per Output Token，每输出令牌时间）：生成阶段相邻两个 token 之间的平均时间（或中位数），也称为 ITL（Inter-Token Latency）。实际衡量的是每次自回归解码迭代的耗时。对于流式输出，TPOT 的平稳性直接影响用户体验。

    - 总请求延迟：从收到请求到完整响应返回的总时间，即 TTFT + (输出长度 - 1) × 平均 TPOT。长文本生成场景下它是主要关注点。

    - 吞吐量（Throughput）：单位时间内成功生成的 token 总数（token/s）或完成的请求数（RPS）。分为：

    - 单请求吞吐：单个请求的 token 生成速率（1/TPOT），受模型大小、序列长度影响。

    - 系统总吞吐：在给定 SLA 下，整个系统能承载的最大总 token/s。通常用渐进增加并发请求数的方法测试，找到延迟可接受下的最大吞吐。

    - QPS（Queries Per Second）：每秒完成的请求数。结合请求平均 token 长度可换算为 token/s。

    - 批处理效率（Batch Size Utilization）：Continuous Batching 中批次内实际活跃请求的平均数量与最大可能的比率，反映调度效率。

    - 显存利用率：KV cache 已用块数 / 总块数，该值越高意味着能容纳更多并发请求，但也可能接近 OOM 风险点。

    - 排队时间：请求在调度队列中等待被首次 picked 的时间。TTFT 减去理论纯计算 prefill 时间即可得出。

    评估方法论：

    - 使用标准化负载测试工具（如 vLLM 的 benchmark、Locust 定制脚本、GenAI-Perf），模拟真实输入/输出长度分布、到达率模式。

    - 固定并发数，记录稳态下指标的百分位（P50, P90, P99），尤其关注尾延迟。

    - 测量峰值压力下的降级行为，确定系统饱和点和最大有效吞吐。

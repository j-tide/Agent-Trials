content:
  prompt: 在长序列生成中，KV Cache 成为显存瓶颈，分析其根本原因
answer:
  mode: rubric
  reference_answer: 从公式可以看出，KV Cache的显存与序列长度 L 成正比。对于长文本生成或大量并发请求，L 可达数万乃至数十万，显存占用线性增长。更关键的是，在自回归解码中，每个时间步都要将完整的KV
    Cache驻留在显存中，并且通常是连续且无法被换出的。当批处理多个不同长度的请求时，碎片化更加严重，大量显存被KV缓存占据，限制了最大批大小和序列长度。这就是为什么即使有80GB显存的GPU也经常不够用的根本原因。

content:
  prompt: 如何对扩散模型进行推理加速？与 LLM 的推理优化有何异同？
answer:
  mode: rubric
  reference_answer: |-
    扩散模型加速方法：

    - 减少采样步数：使用高效数值求解器（DDIM、DPM-Solver、Euler、Heun），或通过知识蒸馏、渐进蒸馏、一致性模型（LCM）将步数压缩至极少（1~4 步）。

    - 模型压缩：结构剪枝、低秩分解、INT8/FP8 量化。

    - 算子融合与高效注意力：在 U-Net 或 Diffusion Transformer（DiT）中融合卷积+归一化+激活，使用 FlashAttention 加速自注意力/交叉注意力。

    - 缓存复用：如 DeepCache 跳过部分 U-Net 层，对某些步复用浅层特征；或对条件嵌入缓存。

    - 图编译：利用 TensorRT、AITemplate 等对扩散模型进行端到端编译优化。

    - 批处理：对于离线任务，可大批量并行生成图像。

    与 LLM 推理优化的异同：

    - 相同点：都依赖算子融合、量化、图编译、FlashAttention 等；都面临大模型内存带宽挑战；都可利用蒸馏和小模型。

    - 不同点：


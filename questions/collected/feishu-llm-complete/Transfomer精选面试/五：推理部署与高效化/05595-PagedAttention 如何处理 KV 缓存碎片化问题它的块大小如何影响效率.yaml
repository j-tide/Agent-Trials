content:
  prompt: PagedAttention 如何处理 KV 缓存碎片化问题？它的块大小如何影响效率？
answer:
  mode: rubric
  reference_answer: |-
    传统KV缓存要求每个序列预留连续显存，当多个序列长度不同、动态分配和释放时，会产生严重的显存碎片。PagedAttention 通过固定大小的块消除了连续分配需求，每个块可以独立分配，没有外部碎片。当序列变长时，只需分配新的块并追加到块表中，无需整体搬迁。序列结束后，整个块表对应的块被释放，不会遗留碎片。

    块大小的影响：块越大，块表更小，逻辑映射开销低，但可能浪费显存（因为块内部分未使用）。块越小，显存利用更精细，但块表变大，查询块表开销增加，且可能增加内存访问延迟。通常取16或32作为折中。

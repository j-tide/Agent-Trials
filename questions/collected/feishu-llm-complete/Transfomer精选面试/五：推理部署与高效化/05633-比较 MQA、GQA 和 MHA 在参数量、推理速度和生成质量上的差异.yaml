content:
  prompt: 比较 MQA、GQA 和 MHA 在参数量、推理速度和生成质量上的差异
answer:
  mode: rubric
  reference_answer: |-
    - 参数量：MHA > GQA > MQA。MHA的K、V投影权重最大，MQA最小，GQA居中。但参数总量的差异通常不大（相对于FFN和Q投影）。

    - 推理速度：MQA最快，GQA次之，MHA最慢。因为KV缓存读取量不同，MQA内存带宽需求最小，可以支持更大的批大小或更长的序列。

    - 生成质量：通常MHA最高，GQA非常接近，MQA在某些任务（如长文本生成）中质量下降较明显。但通过扩大其他维度或加强训练，GQA的质量可几乎无损。因此，目前大型生产模型普遍采用GQA（如LLaMA 2、Mistral、Gemini），以在效率和效果间取得最佳平衡。

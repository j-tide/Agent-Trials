  prompt: SmoothQuant 是如何通过平滑激活值来降低量化难度的？它的核心变换是什么？
answer:
  mode: rubric
  reference_answer: |-
    SmoothQuant 旨在解决LLM中激活值存在离群通道导致的量化困难。LLM的激活值通常在某些特定通道上具有极大的幅度（比中位数大100倍以上），而其他通道正常。这些离群值如果直接量化，将导致大量正常通道的量化精度极差。

    核心变换——“平滑”：

    SmoothQuant 利用一个数学上等价的前向变换，将激活值的量化难度迁移到权重上：


content:
  prompt: KV Cache 在多轮对话中是如何复用的？历史轮次缓存的管理策略有哪些？
answer:
  mode: rubric
  reference_answer: |-
    在多轮对话中，每一轮都会有新的用户输入和助手回复，序列不断增长。如果简单地将所有历史轮次作为一个长序列，每次新对话都要重新编码整个历史，计算量会不断增加。复用策略：

    - 缓存整个历史序列的KV：最直接的方法，一直保留，生成新回复时只需追加新token的KV。这样历史信息完全不丢失，但缓存占用随对话轮次线性增长。

    - 滑动窗口保留：只保留最近 W 个token的KV缓存，旧token丢弃。节省显存，但可能丢失早期重要信息。

    - 重要token保留 + 压缩：识别重要token（如用户指令、关键实体）并将其KV保留，其余丢弃或压缩为摘要向量。

    - 前缀复用：不同对话轮次共享系统提示的KV缓存，只缓存变化部分。

    现代框架（如vLLM）通过块管理可以自动处理多轮对话的KV缓存，根据显存限制决定是否释放旧块。

content:
  prompt: 什么是训练后量化（PTQ）？与量化感知训练（QAT）的核心区别是什么？
answer:
  mode: rubric
  reference_answer: |-
    训练后量化（Post-Training Quantization, PTQ） 是在模型完成标准浮点训练之后，直接对权重和激活值进行量化转换，无需任何额外的训练或微调。其核心流程是：使用一个小的校准数据集（通常几百到几千个样本）来统计各层激活值的数值范围，然后据此确定量化的缩放因子和零点，将浮点权重和激活映射到低比特整数（如INT8、INT4）。整个过程快速、简便，对计算资源要求低。

    量化感知训练（Quantization-Aware Training, QAT） 则是在训练过程中就模拟量化的效果。在前向传播时，对权重和激活插入“伪量化”操作（模拟量化-反量化过程），使模型在训练中适应量化带来的精度损失。反向传播时，梯度绕过不可微的量化操作（使用直通估计器STE），正常更新浮点权重。训练完成后，可以直接导出为量化模型。


content:
  prompt: 投机采样（Speculative Decoding）的原理是什么？草稿模型和大模型是如何协作的？
answer:
  mode: rubric
  reference_answer: |-
    自回归生成中，大模型（目标模型）每次只能串行生成一个 token，造成高延迟。投机采样 通过引入一个轻量的 草稿模型（draft model），一次生成多个候选 token，再由大模型并行验证，大幅减少大模型的串行调用次数。

    协作流程：

    - 草稿生成：给定相同的前缀，草稿模型自回归生成 K 个候选 token（如 5–10 个），速度快但精度略低。

    - 并行验证：大模型一次性接收“前缀 + K 个草稿 token”作为输入，经过一次前向计算得到这 K 个位置上的完整概率分布（以及一个额外的第 K+1 个分布）。

    - 接受/拒绝判断：从左到右逐个位置比较草稿 token 与大模型分布。如果草稿 token 的生成概率不低于大模型，按概率接受；一旦出现拒绝，则根据修正分布采样一个新 token 替换，并丢弃后续所有草稿 token。

    - 更新前缀：将接受的 token 和新采样的 token 拼接到原序列后面，形成新前缀，重复以上过程。

    通过这种方式，大模型一次前向可能产生多个 token，在草稿模型接受率足够高时，有效解码吞吐成倍提升。


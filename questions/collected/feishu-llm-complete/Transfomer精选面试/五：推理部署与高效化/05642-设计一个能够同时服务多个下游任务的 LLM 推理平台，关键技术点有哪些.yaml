content:
  prompt: 设计一个能够同时服务多个下游任务的 LLM 推理平台，关键技术点有哪些？
answer:
  mode: rubric
  reference_answer: |-
    一个多任务推理平台需要在统一的基础设施上高效支持摘要、翻译、代码生成、对话等多样化任务，核心挑战是任务隔离、资源复用、差异化优化和易用性。

    关键技术点：

    - 模型仓库与多模型管理：

    - 自适应批处理与调度：

    - 多模态与异构任务支持：

    - 前缀缓存与任务模板：

    - 多租户隔离与计费：

    - LoRA/适配器即服务：

    - 弹性伸缩与成本优化：

    - 观测与反馈闭环：

    - 统一网关与开发者体验：

    通过上述设计，平台能以一种经济高效的方式，在一套集群中同时服务差异化的下游任务，并具备良好的可扩展性和观测性。

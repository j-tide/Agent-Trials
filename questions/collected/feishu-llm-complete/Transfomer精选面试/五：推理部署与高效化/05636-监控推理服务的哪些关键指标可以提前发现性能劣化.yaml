content:
  prompt: 监控推理服务的哪些关键指标可以提前发现性能劣化？
answer:
  mode: rubric
  reference_answer: |-
    构建可观测性系统，重点关注：

    - 延迟百分位：TTFT、TPOT、请求总延迟的 P50、P90、P99。当 P99 大幅上升，表示出现长尾阻塞，可能是队列堆积或 GC 影响。

    - 吞吐量（token/s, RPS）：持续监测总吞吐量，若在流量平稳时突然下降，说明推理效率降低（如 KVCache 碎片化、显存带宽瓶颈）。

    - 请求排队深度：调度队列中等待处理的请求数。持续增长意味处理能力不足或调度异常，需扩容。

    - GPU 计算利用率（SM 活动率）：高吞吐时此值应接近 100%。若下降，说明 kernel 执行中等待数据（内存带宽受限）或存在 CPU 瓶颈。

    - GPU 显存使用率与 KV Cache 占用率：当 KV Cache 块使用率接近 100% 时，极易引发 swap 或拒绝请求。突然下降可能表示 cache 碎片严重或内存泄漏。监控“可用块数”趋势。

    - CPU 使用率：推理服务的主机和 CPU 端服务（分词、调度、数据传输）的 CPU 利用率。若 CPU 成为瓶颈，GPU 会“挨饿”。需特别关注预处理开销。

    - 网络指标：服务端与客户端间及多 GPU 节点间通信的延迟和带宽。NCCL 通信异常会导致分布式推理 hang 或大幅变慢。

    - 错误率：按错误类型分类（4xx 用户错误、5xx 服务错误、OOM 错误、超时错误）。5xx 或 OOM 的突增直接指示服务劣化。

    - 请求端到端成功率与超时率：客户端视角的指标，反映真实用户体验。

    - 模型加载/卸载时间：热更新时模型的加载耗时，若显著变长，说明存储或网络有问题，影响弹性能力。

    - 操作系统级指标：磁盘 I/O（模型权重加载）、上下文切换、内存带宽饱和度等，辅助定位瓶颈。

    通过 Grafana 等面板关联上述指标，可设定预警规则：例如“当 P99 TTFT 超过 500ms 且排队深度>10 持续 5 分钟”触发报警，或在 KVCache 可用率 < 20% 时自动触发扩容。

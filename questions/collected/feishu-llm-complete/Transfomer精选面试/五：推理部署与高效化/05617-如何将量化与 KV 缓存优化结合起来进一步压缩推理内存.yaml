content:
  prompt: 如何将量化与 KV 缓存优化结合起来进一步压缩推理内存？
answer:
  mode: rubric
  reference_answer: |-
    两者协同可以成倍降低推理总内存：

    - 量化KV缓存：将缓存的Key和Value张量从FP16量化为INT8甚至INT4。使用逐张量或逐通道量化。这直接减少了KV缓存本身的显存占用。

    - 结合GQA/MQA：进一步减少KV头的数量，从结构上降低缓存大小。

    - PagedAttention + 量化KV块：vLLM的PagedAttention将KV缓存分块存储，每个块可以存储量化后的K和V。推理时，从显存读取量化块，在片上反量化到FP16后参与注意力计算。由于注意力计算仍是FP16，反量化开销很小，而显存带宽压力大幅降低。

    - 量化感知的缓存淘汰策略：在缓存容量有限时，优先淘汰重要性低的token的KV（结合注意力权重判断），保留更多高质量缓存。

    这种组合策略可将推理总内存（尤其是长序列多并发）降低至原来的1/4甚至更低，极大提升推理吞吐。

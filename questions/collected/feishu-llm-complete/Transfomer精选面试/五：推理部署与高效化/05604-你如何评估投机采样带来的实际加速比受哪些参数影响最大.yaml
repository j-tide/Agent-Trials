content:
  prompt: 你如何评估投机采样带来的实际加速比？受哪些参数影响最大？
answer:
  mode: rubric
  reference_answer: |-
    加速比定义：在相同硬件、相同模型精度下，生成一定数量 token 的总时间之比：

    [图片内容未导入]

    影响最大的参数：

    - 草稿模型接受率 αα：通过 EE 直接决定有效步长，是最关键因素。αα 从 0.8 提升到 0.95，加速比可能翻倍。

    - 草稿长度 K：E 随 K 增大而增大（但增幅递减），同时草稿生成开销K⋅tdraft 线性增长。存在最优 K，通常需要根据实际接受率和时延比来动态调优。

    - 草稿模型的速度比tdraft/Ttarget：如果草稿模型不够轻量，自回归生成 K 个 token 的时间甚至可能超过大模型直接生成 E 个 token，导致加速比崩塌。因此草稿模型必须比目标模型快 10 倍以上，最好在 100 倍量级。

    - 目标模型单次前向时间Ttarget：TTtarget 越大，分摊草稿开销的能力越强，加速比越容易接近理论上限 EE。因此投机采样在内存带宽受限的大模型、高延迟场景（如批处理推理）下效果更显著；在算力已跑满的场景增益有限。

    - 验证前向的额外开销：若大模型验证时需要重新计算前缀的 KV cache 或无法复用草稿阶段的隐状态，Tverify 可能显著大于 Ttarget，削弱加速。现代实现通常通过缓存前缀的 KV cache 或提前退出复用等方式将额外开销压到最低。

    评估实践：通常先实测草稿模型时延、大模型时延和接受率，通过上述公式进行初步预测；再在真实推理框架中编写端到端测试，观察生成固定 token 的总延迟，并结合 profiler 检查是否出现通信、同步瓶颈，以此指导 K 值选取和草稿模型优化。

    - 新请求分配少量初始块。

    - 每生成新 token，若当前块满，则分配一个新块。

    - 完成生成后释放所有块。

    - 因为块大小固定，完全消除了因序列变长而预留超大连续内存的浪费，显存碎片率极低。

    - 垂直融合：将逐点操作（激活、LayerNorm、残差相加等）与矩阵乘融合成单一内核。

    - 水平融合：将 QKV 矩阵乘合并为一次大矩阵乘。

    - 消除冗余操作：常量折叠、转置消除、reshape 优化等。

    - Q4_0, Q4_1：将 32 个权重量化为 4-bit，共享一个 FP16/FP32 缩放因子。

    - Q4_K_M, Q5_K_M 等 K-quants：采用 超块（super-block） 结构，内部小块有更细粒度的缩放和最小值，且对参数张量的不同维度（如 token embedding 和 attention 权重）使用不同比特宽度，在模型体积和精度间取得更好平衡。

    - 推理范式：LLM 是自回归序列生成，存在 KV cache 和可变长度难题，主要瓶颈在解码；扩散模型是固定张量尺寸的多步迭代去噪，无 KV cache，但每步需处理全图，计算更密集。

    - 延迟关键点：扩散模型更侧重 单步延迟 和 总步数，用户感知到的是首图生成时间；LLM 侧重首 token 延迟和 token 生成速率（吞吐）。

    - 批处理机制：扩散模型可简单进行图批处理，LLM 需要 Continuous Batching 应对可变长度。

    - 加速技巧：扩散模型可通过大幅减少步数取得几十倍加速；LLM 的步数无法压缩，只能用投机采样变相提升每次前向的有效 token 数。

    - 请求按优先级分入不同队列（如实时交互、批量离线）。高优先级请求可 抢占 低优先级请求的 GPU 资源。

    - 抢占时，通常将低优先级请求的 KV cache 块换出（swap out）到 CPU 内存，释放显存给高优先级请求；完成后换回继续生成。vLLM 等框架已实现这种暂停/恢复机制。

    - 截止时间最早优先（Earliest Deadline First）：估算每个请求剩余生成时间，优先调度 SLA 压力大的请求，降低违约率。

    - 公平加权调度：防止饥饿，确保低优先级也有基础保证。

    - 动态限制每次迭代的批次总 token 数（batch token budget），因为迭代耗时正比于批次内 token 总数和最长序列长度。通过控制批次大小，可保证每次迭代不超过延迟上限。

    - 如果检测到迭代耗时可能超标，则推迟部分请求到下个迭代，或换出/暂停部分请求。

    - 部署多个模型实例，将短交互请求和长文档请求路由到不同实例，避免相互干扰。

    - 为高优先级用户预留专有实例。

    - 请求超过阈值时，拒绝新请求或将其排队，优先保障已有请求 SLA。

    - 对等待队列也应用优先级和超时丢弃策略。

    - 剩余 SLA 时间预算：越临近超时，得分越高。

    - 预估剩余 token 数：越短越优先（短作业优先降低平均延迟）。

    - 等待时间：防止饥饿。
    每轮按得分排序，贪心选出 top-N 个请求进入 batch，直至达到单次迭代的 token 预算上限。

    - 使用针对 prefill 高度优化的注意力内核（如 FlashAttention 的 varlen 接口），充分利用 GPU 并行度处理长 prompt。

    - 对 prefill 图进行深度编译（TensorRT-LLM、AITemplate），把所有小操作融合为大 kernel，减少内核启动开销。

    - 采用 FP8/INT8 量化加速矩阵乘，降低预填充带宽压力。

    - 许多应用存在公共系统提示或共享前缀。将已计算过的 prompt 前缀的 KV cache 以块的形式缓存起来，新请求可直接命中并复用，完全跳过这部分计算。结合 PagedAttention 的块化管理，前缀缓存的匹配和命中十分高效，对 RAG、多轮对话等场景可减少 90% 以上的首 token 延迟。

    - 对于超长输入，不一次性计算全部 prompt，而是拆成多个块，在几个 decode 迭代中穿插计算。这虽然略微延长总首 token 时间，但避免了单步超长延迟，且让后续请求不被长时间阻塞，对整体服务质量和感知延迟有巨大改善。

    - 使用 MQA（Multi-Query Attention）或 GQA（Grouped-Query Attention）降低 KV cache 的内存和计算开销，prefill 更快。

    - 采用非 Transformer 的高效架构（如 Mamba、RWKV），它们处理长序列时的计算量与长度呈线性关系，首 token 延迟更低。

    - 在服务中可为 prefill 专门分配高优先级的 GPU 资源或独占实例，使新请求一到达就立即获得足额算力。

    - 避免与大规模 decode batch 争抢计算单元，或通过 token budget 精细控制并行度。

    - 优化分词器和输入处理流水线，减少 CPU 瓶颈。

    - 使用 RDMA、NVLink 等高速传输，加速分布式推理中的 prefill 通信。

    - 将批次内所有序列的 token 串联成一个长的一维序列，并记录每个序列的起始位置和长度（cu_seqlens 数组）。注意力计算时使用专门支持可变长度的内核（如 FlashAttention 的 varlen API），内部通过 cu_seqlens 确定序列边界，生成块对角形式的 attention mask，使各序列之间完全隔离。这从根本上消除了 padding 的需要，没有任何无效 token 被计算。

    - 层归一化、MLP 等操作则依然可以按 token 并行处理，因为 token 都是连续的，无需区分序列边界。

    - 在 Ragged Batching 基础上，调度器尽量将长度相近的请求分到同一批次。虽然 Ragged Batching 本身无 padding 浪费，但序列长度差异过大会导致某些序列极短、某些极长，内核的负载不均衡（部分 thread block 提早做完等待）。通过分桶，能让每次迭代的计算负载更均衡，提高 SM 利用率。

    - vLLM 等框架会将长 prompt 的 prefill 也通过 PagedAttention 分块管理。与 decode 混合调度时，不同请求的 prefill 块可以与 decode 请求的 token 自由组合成 batch，不需要将整个 prompt 当作一个不可分割的巨型块。通过把 prefill 化整为零，自然就解决了输入长度差异带来的计算尖刺与浪费。

    - 在系统架构上，可将 prefill 与 decode 部署在不同 GPU 实例或不同 CUDA stream 上，避免输入长度差异巨大的 prefill 与需要低延迟的 decode 互相干扰。这样即使 prefill 批内有长度差异，也只影响 prefill 自己的吞吐，不会拉慢生成节奏。

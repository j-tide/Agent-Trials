content:
  prompt: FlashDecoding 与 FlashAttention 是什么关系？它专门解决什么问题？
answer:
  mode: rubric
  reference_answer: |-
    关系：FlashDecoding 是 FlashAttention 思想的推理专用扩展。两者都基于“在 SRAM 中分块计算 softmax 并缩减”的 IO 感知理念，但针对的是 Transformer 不同阶段的并行瓶颈。

    - FlashAttention 设计时主要优化训练和 prefill 阶段。此时通常有大量的 query token（序列长度 N 很大），并行度充足（沿 batch、head 和 query 序列维并行），它能把 QK^T 的计算做得非常高效。

    - 推理的解码阶段（特别是 Continuous Batching 中），每次迭代常只有一个新 query token（当前生成的 token），而 KV cache 长度却可能很长（如几千到上百万）。此时 FlashAttention 的并行策略暴露了问题：workload 集中在 batch 和 head 维度，序列长度维度上并行度几乎为零，一个 thread block 就要处理完整个 KV 序列，导致长序列时 GPU 大量流处理器闲置，延迟恶化。

    FlashDecoding 专门解决的问题：

    - 它将长 KV 序列的注意力计算在序列长度维度上进行并行拆分：用不同的 thread block 分别计算不同 KV 分块的点积和局部 softmax，然后通过一个高效的跨块归约（reduction）内核合并最终结果。

    - 这样，即使 batch size 为 1、query token 只有一个，也能通过“拆分 KV 并多 block 并行”充分利用 GPU 的并行算力，将长序列解码的延迟降低一个数量级。

    简言之，FlashAttention 让 attention 在 SRAM 完成，FlashDecoding 让解码时的 attention 也拥有巨大的并行度。现代推理引擎（如 FlashAttention-3、TensorRT-LLM）通常将二者整合，prefill 用 FlashAttention 的高并行分块，decode 用 FlashDecoding 的长 KV 拆分归约。


content:
  prompt: AWQ（Activation-aware Weight Quantization）是如何根据激活值分布来保护重要权重的？
answer:
  mode: rubric
  reference_answer: |-
    AWQ 的核心理念是：并非所有权重对模型同等重要。大约1%的显著权重（salient weights）对模型性能贡献巨大，必须更精确地量化。 这些显著权重的识别依据，正是激活值的分布。

    工作原理：

    - 分析激活分布：使用校准数据集进行前向传播，统计每层输入激活值的分布。对于每个权重通道（输出通道），计算其对应激活值的平均幅度。

    - 识别显著通道：激活值幅度大的通道，其对应的权重通道就是“显著通道”。因为这些权重处理的是大激活值，它们的微小误差也会被放大，从而严重损害模型输出。

    - 逐通道缩放（Salient Channel Scaling）：AWQ不直接量化权重，而是先对显著通道的权重进行放大（乘以一个缩放因子s > 1），同时将对应的输入激活值缩小相同的倍数（除以s）。这保持了该通道的前向输出不变（数学等价），但权重的数值范围被扩大了，使得量化时的相对误差减小，保护了重要权重。

    - 自动搜索最优缩放因子：通过分析激活分布的统计特性和量化误差，自动搜索最佳的逐通道缩放因子，最小化量化后的整体输出误差。

    AWQ通过这种“激活值感知”的缩放策略，等效于为显著权重提供了更高的量化精度，从而在INT4量化下保持了接近原始FP16的性能。

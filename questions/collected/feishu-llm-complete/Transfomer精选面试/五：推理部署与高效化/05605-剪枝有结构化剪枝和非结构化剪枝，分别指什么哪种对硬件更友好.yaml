content:
  prompt: 剪枝有结构化剪枝和非结构化剪枝，分别指什么？哪种对硬件更友好？
answer:
  mode: rubric
  reference_answer: |-
    非结构化剪枝：以单个权重元素为粒度进行剪枝。剪枝后，权重矩阵变成稀疏矩阵（许多零值）。理论上压缩率高，但稀疏模式不规则，现代GPU难以高效处理这种随机稀疏模式（需要专门的稀疏矩阵乘法硬件支持，如NVIDIA的2:4稀疏）。通常需要结合专用库或硬件，否则加速效果有限。

    结构化剪枝：以更大的结构单元为粒度，如剪掉整个神经元、整个注意力头、整个FFN层、甚至整个Transformer层。剪枝后，模型结构变得更加紧凑且规则（如矩阵维度减小），可以无需特殊硬件直接获得推理加速，因为矩阵乘法在小矩阵上同样高效。结构化剪枝对硬件极其友好，是实际部署中的主要剪枝方式。

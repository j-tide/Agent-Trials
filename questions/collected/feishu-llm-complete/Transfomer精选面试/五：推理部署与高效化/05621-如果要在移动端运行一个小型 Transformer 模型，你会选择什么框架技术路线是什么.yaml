content:
  prompt: 如果要在移动端运行一个小型 Transformer 模型，你会选择什么框架？技术路线是什么？
answer:
  mode: rubric
  reference_answer: |-
    框架选择：

    - llama.cpp（通过其 C++ 库以及移动端优化）：GGUF 量化格式 + 整型内核，支持 Android (通过 NDK) 和 iOS (通过 Metal 或 CPU NEON)。已有成熟的移动端 LLM 应用案例（如 Ollama 间接支持，或直接编译）。

    - Google MediaPipe 或 TensorFlow Lite：专门为移动端优化的推理框架，支持 GPU delegate（OpenGL ES / Metal），可运行小型 Transformer（如 MobileBERT）。对量化、剪枝友好，但需模型转换为 TFLite 格式。

    - ExecuTorch（PyTorch 出品）：PyTorch 的端侧推理解决方案，支持 8-bit 量化、Metal 后端、Android 上 Vulkan 委托，生态迅速完善，非常适合从 PyTorch 训练导出的 Transformer 模型。

    - ONNX Runtime Mobile：支持 INT8 量化、多种执行提供器（如 CPU, XNNPACK, 以及有限的 GPU），跨平台易用，但 Transformer 类模型需仔细适配融合。

    技术路线：

    - 模型压缩：从大模型出发，通过蒸馏、结构化剪枝、低秩分解得到参数量 < 1B 的小模型（如 TinyLLaMA、Phi 系列）。或直接从开源预训练小模型开始。

    - 量化：应用 4-bit 或 8-bit 的整数量化（INT4/INT8），常见方案为 GPTQ、AWQ 或 GGUF 的 K-quants。重点是采用块状量化和混合精度，尽量减少在移动端 CPU 上的精度损失。也可使用带有整数激活的量化方案以完全避开浮点运算。

    - 框架编译与优化：将量化后的模型导出为对应移动框架的格式（如 .gguf 或 .pte），使用厂商提供的编译器/转换工具进行运算符融合、内存规划优化。

    - 移动端运行时集成：

    - 性能与内存优化：对移动端内存极度敏感，需要：

    - 应用层优化：流式输出、预测即输入，对延迟敏感的 UI 采用异步处理，必要时可在 App 后台预热模型。

    典型路线：选用预训练小模型（如 Qwen2-0.5B）→ 使用 llama.cpp 进行 Q4_K_M 量化 → 编译 Android 库集成到 APP → 使用 JNI 流式推理，延迟可控制在每 token 几十毫秒。

content:
  prompt: 量化后的模型质量如何评估？除了困惑度，还需要关注哪些任务？
answer:
  mode: rubric
  reference_answer: |-
    评估需多维度：

    - 困惑度：基础语言模型质量，反映量化对预测分布的整体影响。困惑度变化小通常意味着量化较成功。

    - 下游任务性能：如MMLU、HellaSwag、GSM8K等标准基准，测试模型的推理、知识、数学能力是否受损。

    - 生成质量：人工或自动评估量化模型生成的文本流畅性、连贯性、事实准确性。

    - 长文本能力：在长序列上困惑度和检索任务的性能，因为量化可能影响长距离依赖。

    - 校准误差：评估量化前后模型置信度与实际准确率的一致性。

    - 极端压力测试：对抗样本、罕见输入等，检测量化的鲁棒性。

    综合这些指标，可以全面评估量化模型是否可部署。

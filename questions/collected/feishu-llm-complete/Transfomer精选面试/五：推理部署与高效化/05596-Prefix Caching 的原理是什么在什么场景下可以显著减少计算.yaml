content:
  prompt: Prefix Caching 的原理是什么？在什么场景下可以显著减少计算？
answer:
  mode: rubric
  reference_answer: |-
    Prefix Caching 利用共享前缀的特性。在很多应用中，多个请求可能具有相同的系统提示或上下文开头。通过将前缀的KV缓存以块或序列形式缓存起来，当新请求到来时，可以直接复用这些已计算的KV缓存，而无需重新进行前向计算。PagedAttention 通过共享物理块实现这一功能：对于相同前缀，多个序列的块表指向同一组物理块，并采用引用计数管理。当没有序列再使用这些块时，才释放显存。

    显著有效的场景：多轮对话中用户不同的提问但共享系统提示；批量推理中多个请求以相同长文档作为背景知识；以及其他存在共同前缀的并发请求，可节省大量计算和显存。

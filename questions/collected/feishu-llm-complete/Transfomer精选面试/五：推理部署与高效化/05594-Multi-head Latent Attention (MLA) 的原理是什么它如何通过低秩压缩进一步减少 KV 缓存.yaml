content:
  prompt: Multi-head Latent Attention (MLA) 的原理是什么？它如何通过低秩压缩进一步减少 KV 缓存？
answer:
  mode: rubric
  reference_answer: MLA 出自DeepSeek-V2，旨在进一步压缩KV缓存。传统方法中，K和V的投影矩阵将 dmodeldmodel 映射到
    H×dkH×dk。MLA提出：对Key和Value分别使用低秩分解，即先将输入投影到一个低维潜在空间（压缩），再从这个潜在空间展开到各个头的K和V。同时，在推理时，只需要缓存潜在空间的压缩表示（而非每个头的完整K和V），然后在计算注意力时动态解压。这相当于用计算换取存储：额外增加一次小矩阵乘法，但缓存大小由与头数相关的量减少为仅与潜在维度相关的量（通常远小于
    H×dk）。MLA能够将KV缓存大小减少到原来的1/10甚至更多，对极长上下文推理极为有利。

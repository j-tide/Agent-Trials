content:
  prompt: 知识蒸馏在 Transformer 压缩中怎么用？如何设计学生模型和蒸馏损失？
answer:
  mode: rubric
  reference_answer: |-
    知识蒸馏用大型教师模型的“软知识”来指导小型学生模型训练。

    学生模型设计：

    - 缩小宽度：减少隐藏维度、FFN中间维度、注意力头数。

    - 减少深度：减少Transformer层数。

    - 混合设计：不直接使用教师模型的层数，而是设计全新的小型架构，如MobileBERT采用瓶颈结构。

    蒸馏损失设计：

    通常结合多种损失：

    - 输出蒸馏损失：教师和学生模型在softmax输出的分布之间的KL散度。使学生模仿教师的预测行为。

    - 中间层蒸馏：对齐教师和学生的中间表示（如每一层的隐藏状态或注意力矩阵）。通过MSE或余弦相似度损失，使学生学习教师的内部知识。

    - 任务特定损失：标准的下游任务交叉熵损失。

    总损失 = 任务损失 + λ1 * 输出蒸馏损失 + λ2 * 中间层蒸馏损失。

    两阶段蒸馏：先进行通用的大规模预训练蒸馏（如TinyBERT），再进行下游任务微调蒸馏，更有效。

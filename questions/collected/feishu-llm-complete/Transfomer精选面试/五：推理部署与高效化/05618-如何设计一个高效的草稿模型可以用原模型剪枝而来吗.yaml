content:
  prompt: 如何设计一个高效的草稿模型？可以用原模型剪枝而来吗？
answer:
  mode: rubric
  reference_answer: |-
    设计高效草稿模型的核心是 最大化与目标模型的输出分布相似性，同时保持极低推理成本。常见方法有：

    - 独立小模型：相同 tokenizer，更少层数、更小隐藏维度（如 TinyLLaMA）。可通过蒸馏使分布对齐。

    - 原模型剪枝 + 蒸馏：完全可以。通过结构化剪枝（去除某些层、注意力头或隐藏维度）得到一个子网络，再用目标模型的 logits 做知识蒸馏微调，能很好保持行为一致性，是高效的方案。

    - 提前退出（Early Exit）：直接复用大模型的前若干层作为草稿模型，在某一中间层接一个预测头生成 token。如 EAGLE 等方法还结合了特征外推。

    - 多预测头：如 Medusa，在大模型顶部附加多个独立分类头，同时预测未来若干个 token，可视为一种“无草稿模型”的投机变体，但本质类似。

    - 蒸馏 + 量化：将剪枝或缩小后的模型进一步做 INT8/INT4 量化，使其在端侧或低算力设备上也能极快运行。

    剪枝而来的草稿模型因为共享大部分参数初始化和架构，通常能获得很高的接受率，在实践中被广泛使用。


content:
  prompt: 逐通道量化和逐张量量化哪种精度更高？为什么？
answer:
  mode: rubric
  reference_answer: |-
    逐张量量化：整个权重张量（或整个层）共享一个缩放因子。实现简单，计算最快。但当不同通道的数值分布差异大时，单一缩放因子无法兼顾所有通道，导致某些通道量化误差极大。

    逐通道量化：每个输出通道拥有独立的缩放因子。能更精细地适配每个通道的分布，显著降低量化误差，精度更高。代价是需要存储更多缩放因子，并且在矩阵乘法时需要逐通道反量化，部分硬件对逐通道计算的支持较差（或需要额外处理），可能降低推理速度。

    精度比较：逐通道量化精度明显高于逐张量量化。在Transformer中，权重的不同通道之间数值范围可能差异较大，因此权重几乎总是使用逐通道量化以保持精度。激活值通常使用逐张量量化，因为其分布通常较均匀，且激活值的逐通道量化实现较复杂。当激活存在离群通道时，可通过SmoothQuant转换为对权重的逐通道处理。

content:
  prompt: FlashAttention-2 相比 FlashAttention 做了哪些改进？为什么能进一步提速？
answer:
  mode: rubric
  reference_answer: |-
    FlashAttention-2 主要在 并行策略、工作调度 和 减少非矩阵乘操作 三方面做了优化，具体包括：

    - 更优的并行化：FlashAttention-1 的并行主要集中在 batch 和 head 维度，序列长度方向的并行度不够。FlashAttention-2 在 Q 的块序列维度上也引入并行，使单个 attention head 的计算能利用更多线程块，提升 GPU 占用率。

    - 减少非矩阵乘计算占比：调整了 online softmax 的循环顺序（外层循环改为 Q 的块），减少了 rescale 操作的调用频率和寄存器压力，使矩阵乘法（Tensor Core 擅长）的比例大幅提升。

    - 更精细的 warp 调度：重新设计了线程块和 warp 的映射关系，让数据复用更充分，同步开销更小，减少了共享内存的 bank conflict。

    - 去除冗余操作：简化了 softmax 统计量（max、sum）的更新流程，前向计算中减少了不必要的乘法和加法。

    由于这些改动，FlashAttention-2 在大规模注意力计算时能将 Tensor Core 的利用率推得更高，相比于第一版有约 2 倍的加速。


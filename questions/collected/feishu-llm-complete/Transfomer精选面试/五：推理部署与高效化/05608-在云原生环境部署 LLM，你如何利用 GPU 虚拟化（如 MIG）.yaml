content:
  prompt: 在云原生环境部署 LLM，你如何利用 GPU 虚拟化（如 MIG）？
answer:
  mode: rubric
  reference_answer: |-
    NVIDIA 的多实例 GPU（MIG）可将一块大显存 GPU（如 A100 80GB、H100）在硬件级别分割为多个独立的小 GPU 实例，每个拥有自己的显存、缓存和计算资源，且故障隔离。利用 MIG 可在云原生 K8s 中实现：

    - 细粒度资源分片：将 1 个 80GB A100 切分成多个较小的 GPU 实例（如 3 个 20GB 的切片 + 1 个 10GB 切片），避免为小模型（如 7B 参数）独占整卡，浪费算力和显存。每个 MIG 实例分配给不同推理 Pod，可服务不同模型或多副本。

    - 多模型共卡部署：在同一物理 GPU 上同时运行多个 LLM 推理实例（例如一个大模型独占大切片，几个小模型占小切片），资源共享且互相隔离，最大化 GPU 总利用率。

    - 混合优先级服务：可将高优先级在线服务部署于计算资源更有保障的 MIG 实例上，较低优先级的批处理任务使用其余实例，避免互相干扰。

    - Kubernetes 集成：通过 NVIDIA MIG Manager 或 GPU Operator，将 MIG 设备以 Kubernetes 扩展资源（nvidia.com/mig-1g.10gb）的方式暴露。Pod 可以按需申请精确的 MIG 实例，调度器将 Pod 绑定到对应物理 GPU 的切片。

    - 热迁移支持不中断？ MIG 的配置修改需重启 GPU 驱动，不能热切换，但可通过滚动更新 Pod、预先划分多种 MIG 几何配置来间接管理。通常将 MIG 配置作为节点池的静态划分，由节点选择器把不同规格的推理工作负载调度到匹配的节点。

    注意：MIG 会引入一些限制（如 P2P 通信可能受影响，部分 CUDA 特性不支持），在采用前需评估推理框架兼容性。对于需要大显存带宽的大模型，或许整卡更优，但 MIG 对于中、小模型的多租户共卡效率提升极大。

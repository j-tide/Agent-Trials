content:
  prompt: GPTQ 量化方法的基本原理是什么？它基于 OBQ 做了哪些改进？
answer:
  mode: rubric
  reference_answer: |-
    GPTQ（GPT-Post-Training Quantization）是基于最优脑量化（OBQ）框架的逐层权重量化算法，专门针对大规模生成式预训练Transformer设计。

    OBQ的基本原理：OBQ将权重量化视为一个逐权重优化问题。每次量化一个权重，然后通过更新剩余未量化的权重来补偿本次量化引入的误差。这需要计算Hessian矩阵的逆，对于大模型计算量巨大。

    GPTQ的改进：

    - 逐层而非逐权重：GPTQ一次性量化一层内所有行的权重，而非逐个权重处理。将权重矩阵按行分组，批量量化，极大加速了过程。

    - 任意顺序量化：OBQ要求按特定顺序量化权重以最小化误差。GPTQ发现对于大模型，按任意固定顺序量化与最优顺序的差异微乎其微，因此采用简单顺序，避免了复杂的排序计算。

    - Cholesky预计算：GPTQ利用Hessian矩阵的结构，通过Cholesky分解预先计算所需的信息，在量化过程中高效更新剩余权重。

    - 延迟批量更新：对权重更新采用批量延迟策略，减少内存访问和提高计算效率。

    总体而言，GPTQ能够在几小时内完成数十亿参数模型的INT4量化，且精度损失极小，是当前最流行的LLM权重量化方法之一。

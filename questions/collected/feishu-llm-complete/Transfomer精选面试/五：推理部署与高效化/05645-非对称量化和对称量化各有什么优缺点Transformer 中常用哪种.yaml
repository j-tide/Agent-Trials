content:
  prompt: 非对称量化和对称量化各有什么优缺点？Transformer 中常用哪种？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    Transformer中的实践：

    - 权重：通常使用对称量化，因为训练后的权重分布大致对称，且对称量化更高效。

    - 激活值：情况复杂。对于有ReLU/GELU的激活，分布常不对称，非对称量化更精确。但现代高效推理框架多采用对称量化，因为硬件（如GPU Tensor Core）对对称INT8矩阵乘法的支持最好。为解决激活值不对称问题，可采用SmoothQuant的平滑技术将不对称性转移到权重上。

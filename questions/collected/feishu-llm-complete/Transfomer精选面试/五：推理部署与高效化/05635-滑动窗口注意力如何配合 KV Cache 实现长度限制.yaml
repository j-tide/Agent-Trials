content:
  prompt: 滑动窗口注意力如何配合 KV Cache 实现长度限制？
answer:
  mode: rubric
  reference_answer: |-
    滑动窗口注意力限制每个token只能关注其前后固定窗口大小 W 内的token。配合KV Cache时，缓存只需保留最近 WW 个token的K和V，超出窗口的历史token可以被丢弃，从而将KV Cache的显存占用上界固定在 W，与总序列长度 L 无关。这从根本上避免了长序列下的线性增长问题。

    实现上，每步生成时，将当前token的K和V存入缓存；如果缓存长度超过 W，则删除最旧的token的KV。因为注意力掩码会确保当前token只计算与缓存中这些token的注意力，所以计算效率和显存都得到控制。典型的窗口大小 W 为4096或8192，足以捕获足够的局部上下文，同时保持显存可预测。

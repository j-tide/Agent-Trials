content:
  prompt: 端侧模型部署时，如何利用手机 NPU 加速 Transformer？通常需要哪些算子支持？
answer:
  mode: rubric
  reference_answer: |-
    手机 NPU（神经网络处理单元）是专门为低功耗 AI 推理设计的异质计算单元，擅长定点矩阵运算和卷积，能效比远高于 CPU/GPU。利用 NPU 加速 Transformer 的主要步骤如下：

    - 模型量化与格式转换

    - 将 Transformer 量化为 INT8 或 FP16。NPU 通常对 INT8 有最佳效能，所以常用训练后量化（PTQ）或量化感知训练（QAT）得到 INT8 模型。

    - 导出为 NPU 厂商支持的中间格式。例如：

    - 算子支持与降级策略

    Transformer 核心算子及 NPU 支持情况：

    - 全连接（Linear）：普遍支持，是 NPU 强项。

    - 矩阵乘法（BMM/MatMul）：大部分支持，但注意维度限制。Attention 中的 QK^T 乘需要 BMM，一些 NPU 仅支持 2D 矩阵乘，需要 reshape 适配。

    - 层归一化（LayerNorm/RMSNorm）：许多 NPU 支持 ReduceMean、Element-wise 乘加，可组合实现；部分 NPU 直接支持 LayerNorm 算子。

    - Softmax：高通 QNN 支持，Apple ANE 从某版本起支持。但需注意大长度序列 Softmax 可能被拆分。

    - Attention：整块的 FlashAttention 类融合操作一般不被 NPU 直接支持，需分解为基础算子。

    - 激活函数（GELU/SiLU）：多数 NPU 已内置支持。

    - 位置编码：较容易用张量操作组合。

    - 卷积：不常用但 NPU 极擅长，若模型包含卷积子层（如一些轻量混合模型）更友好。

    面对不支持的算子，框架会插入 CPU/GPU 回退。例如 Core ML 将不支持的子图自动切回 CPU 或 Metal GPU；ExecuTorch 在 Delegate 不支持的算子处切回便携 CPU 实现。这会引入跨单元的拷贝开销，因此需尽量将整张计算图都委托给 NPU。可以使用厂商的性能分析工具识别回退点，然后修改模型结构或自定义 NPU 算子实现。

    - 子图切分与流水线

    - 将 Transformer 按层切分为 NPU 子图和 CPU 子图。例如把大矩阵乘密集的 MLP 和部分 Attention 放在 NPU，LayerNorm 和 Residual Add 等轻量操作保留在 CPU，通过双缓冲异步执行隐藏传输延迟。

    - 内存与功耗优化

    - NPU 内存通常独立（或预留），需要仔细规划权重的静态分配，避免动态分配开销。

    - 利用 NPU 的低位宽（INT4/INT8）降低内存占用和功耗。

    - 模型参数常驻 NPU 内存，通过 mmap 等方式快速加载。

    常用算子清单：NPU 需要支持的 Transformer 算子至少包含：Conv2D/MatMul, FullyConnected, ElementWise Add/Mul, Activation (ReLU/GELU/SiLU), Softmax, Reshape/Transpose, ReduceMean (用于 LayerNorm), 以及 Pad/StridedSlice 等张量操作。缺失任一核心算子都会导致较大比例 CPU 回退，严重影响加速效果。

    总之，利用 NPU 需要把模型量化至 INT8，针对厂商工具链进行模型转换与算子兼容性调优，必要时重构部分网络，才能充分发挥硬件能效。


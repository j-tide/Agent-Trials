content:
  prompt: 投机采样在什么条件下能带来显著的吞吐提升？草稿模型的准确率要求多高？
answer:
  mode: rubric
  reference_answer: |-
    要获得显著吞吐提升，需要同时满足：

    - 大模型本身是自回归解码带宽瓶颈：如果大模型的小 batch 推理已经能跑满计算（如长序列 prefill 阶段），投机采样的收益就有限；当大模型推理处于内存带宽受限（大批次解码），加速效果才明显。

    - 草稿模型足够快：草稿模型单 token 生成延迟远低于大模型，并且生成 K 个 token 的总时间应小于大模型一次前向的时间，否则草稿阶段变成瓶颈。

    - 草稿模型接受率高：这是决定性因素。接受率 α 决定了平均每轮接受的 token 数。理论期望接受长度为 (1 - α^(K+1)) / (1 - α)。要获得>1 的实际加速，通常需要 α > 0.7~0.8，若要获得 2 倍以上加速，α 往往需要达到 0.9 以上。

    - 草稿长度 K 选择合适：K 太大会导致末尾 token 拒绝概率增大、浪费计算；K 太小则并行收益有限。需要根据接受率和延迟模型折中。

    简言之，高接受率（通常 80%–90% 以上）是投机采样成功的前提。


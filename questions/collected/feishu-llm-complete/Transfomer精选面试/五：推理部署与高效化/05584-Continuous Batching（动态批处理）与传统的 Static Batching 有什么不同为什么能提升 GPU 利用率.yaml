content:
  prompt: Continuous Batching（动态批处理）与传统的 Static Batching 有什么不同？为什么能提升 GPU 利用率？
answer:
  mode: rubric
  reference_answer: |-
    Static Batching（静态批处理）：一次收集一批请求，同时进行完整生成，必须等 所有请求生成结束 才返回结果。这导致：

    - 短序列被长序列严重阻塞（队头阻塞），延迟大幅增加。

    - 若填充（padding）到统一最大长度，会浪费大量计算和显存。

    - GPU 在批次末尾部分请求已完成时处于空闲。

    Continuous Batching（连续/动态批处理）：将推理过程拆分为 逐个 token 迭代，每次迭代只计算当前活跃请求的下一个 token。完成生成的请求立即移出批次，新到达的请求马上插入。其优势：

    - GPU 持续满载，没有“等最长请求”的空闲时间。

    - 短请求能迅速完成，延迟显著降低；长请求也无需单独等待。

    - 通过 KV cache 的动态管理，不同长度请求共存，无需过量填充，显存和计算资源利用率极高。

    因此，在在线服务中，Continuous Batching 成为高吞吐低延迟的标准方案。


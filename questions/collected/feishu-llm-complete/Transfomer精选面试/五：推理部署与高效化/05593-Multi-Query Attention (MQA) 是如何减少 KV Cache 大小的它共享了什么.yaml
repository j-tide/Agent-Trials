content:
  prompt: Multi-Query Attention (MQA) 是如何减少 KV Cache 大小的？它共享了什么？
answer:
  mode: rubric
  reference_answer: MQA 让所有注意力头共享同一组 Key 和 Value，而Query仍然保持多头。在标准MHA中，每个头有独立的K和V，因此KV缓存大小与头数
    HH 成正比。MQA则将所有头的K和V合并为一组，从而将KV缓存的大小降低到原来的 1/H1/H。同时，参数量也相应减少。例如，LLaMA-7B H=32H=32，改用MQA后KV缓存仅为原来的1/32。这显著降低了显存占用和内存带宽需求，但可能会损失一些生成质量，因为不同的头被迫使用相同的注意力模式，导致表达能力受限。

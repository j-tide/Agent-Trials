content:
  prompt: 什么是 KV Cache？它为什么能够加速自回归生成？
answer:
  mode: rubric
  reference_answer: |-
    在标准的自回归生成（如GPT）中，每次预测下一个token都需要将整个序列输入模型，重新计算所有位置的Key和Value。对于长度为 LL 的序列，第 L+1 步需要重新计算前面 L 个token的注意力，这导致了 O(L2) 的重复计算。KV Cache 正是为了消除这种冗余而提出：在生成过程中，将之前所有时间步的Key和Value张量缓存起来，每个新时间步只需计算当前token的Query、Key、Value，然后Query与缓存中的历史Key计算注意力分数，新的Key和Value追加到缓存中供后续步骤使用。

    加速的核心在于：避免了历史token的重复计算。每步生成的计算复杂度从 O(L2⋅d)O(L2⋅d) 降低到 O(L⋅d)O(L⋅d)，因为自注意力的计算量主要消耗在Query与所有Key的点积上。在长序列生成时，KV Cache带来的速度提升极为显著。

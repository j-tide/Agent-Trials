content:
  prompt: TensorRT-LLM 是如何对 Transformer 图进行编译优化的？使用了哪些技术？
answer:
  mode: rubric
  reference_answer: |-
    TensorRT-LLM 将 PyTorch 等导出的模型转换为 TensorRT 计算图，并进行多层深度优化：

    - 图级优化：

    - 内存优化：引入类似 PagedAttention 的 GptManager 管理 KV cache，使用分块池化存储；为中间张量分配最小所需内存并做显存复用。

    - 量化：支持 FP8、INT8、INT4（GPTQ/AWQ）。量化节点自动插入 Q/DQ 算子，通过校准实现最小精度损失。

    - 动态形状：利用 TensorRT 的 dynamic shape 能力处理可变序列长度和批次大小，在多次运行间无重新编译。

    - 分布式推理：自动插入 NCCL all-reduce/all-gather 通信内核，实现张量并行和流水线并行。

    - 内核生成：基于 CUTLASS 等库自动生成性能最优的 GEMM/卷积内核，并集成 FlashAttention。

    - Runtime 调度：In-flight Batching 支持，由 C++ runtime 管理请求调度和动态批处理。

    通过图编译 + 手工/自动调优的内核，TensorRT-LLM 能针对特定 GPU 生成接近峰值性能的推理引擎。


content:
  prompt: 什么是 PagedAttention？vLLM 如何借鉴操作系统的分页管理来优化 KV 缓存？
answer:
  mode: rubric
  reference_answer: |-
    PagedAttention 由 vLLM 提出，它将 KV 缓存从传统的连续张量存储改为分页（block）存储。类似操作系统中的虚拟内存分页，PagedAttention 将每个序列的 KV 缓存划分为固定大小的块（例如每个块包含16个token的K和V），这些块不必在物理显存中连续。每个序列维护一个块表，逻辑位置到物理块的映射。这样：

    - 解决碎片化：不再需要为每个序列预分配最大长度的连续显存，按需分配块，显存利用率显著提高。

    - 共享：不同序列可以共享相同的KV块（例如，多个请求具有相同的系统提示前缀时，可共享前缀的KV块）。

    - 高效调度：块可以动态分配和回收，支持更大的并发批处理。

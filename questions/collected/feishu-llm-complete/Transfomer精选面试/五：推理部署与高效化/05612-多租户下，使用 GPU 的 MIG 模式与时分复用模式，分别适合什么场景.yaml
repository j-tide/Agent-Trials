content:
  prompt: 多租户下，使用 GPU 的 MIG 模式与时分复用模式，分别适合什么场景？
answer:
  mode: rubric
  reference_answer: |-
    [嵌入表格未展开]

    适合 MIG 的场景：

    - 需要严格资源配额的多租户云服务，为每个客户分配独立 GPU 切片，保证性能和故障隔离。

    - 在单 GPU 上同时运行多个不同的小模型（如多个 LoRA 服务），每个模型给予固定算力和显存，避免互相拖慢。

    - 高安全合规要求，不希望数据通过侧信道或缓存残留被其他租户访问。

    适合时分复用（MPS / vGPU 时间片）的场景：

    - 内部多个团队共享大型 GPU 集群，请求负载峰谷交错，通过超额订阅提高整体利用率。

    - 模型较大的情况，单 MIG 切片显存可能不够，必须共享整卡显存。

    - 需要分布式推理（TP）时，不能切分 MIG，只能使用整卡 MPS 或直接共享。

    - 成本敏感，希望尽量榨干 GPU，不介意偶发的性能抖动。

    综合来看，MIG 提供“硬隔离、稳性能”但牺牲灵活度；时分复用提供“高灵活、低成本”但隔离性差。实际平台可以混合使用：高优租户分配 MIG 独占切片，低优离线任务共用剩余整卡并打开 MPS 提升利用率。


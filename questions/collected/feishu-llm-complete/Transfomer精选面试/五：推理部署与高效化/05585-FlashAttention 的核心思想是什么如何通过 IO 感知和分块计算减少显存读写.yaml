content:
  prompt: FlashAttention 的核心思想是什么？如何通过 IO 感知和分块计算减少显存读写？
answer:
  mode: rubric
  reference_answer: |-
    核心思想：标准注意力需要计算并存储一个大小为 N×N 的注意力得分矩阵（N 为序列长度），这导致对 GPU 高带宽内存（HBM）的读写复杂度为 O(N²)。FlashAttention 提出一种 IO 感知（IO-aware） 的算法，充分利用 GPU 内存层次（小容量高带宽的 SRAM 和大容量低带宽的 HBM），通过 分块（tiling） 计算注意力，把主要的中间结果留在 SRAM 中，并将 HBM 读写量从 O(N²) 降到 O(N²·d²/M) 级别（d 为头维度，M 为 SRAM 大小），实际效果接近线性。

    IO 感知与分块计算的具体做法：

    - 将 Q 分成若干块，K、V 也分成若干块。每一对 Q 块和 K 块的计算结果只暂存在 SRAM 中，不写回 HBM。

    - 使用 online softmax 技术维护局部分母和最大值，通过递推公式逐步修正之前的 softmax 缩放。这样在遍历 K、V 块时可以一边计算局部注意力权重、一边更新输出，而无需保存完整的 N×N 注意力矩阵。

    - 前向只输出最后的 attention output（形状 N×d），反向时通过重计算注意力矩阵节省存储，无需缓存大规模中间结果。

    - 所有分块大小严格按照 SRAM 容量选取，确保每一步的内存访问最优。

    这使得 FlashAttention 在长序列场景下内存占用和耗时都远低于标准实现。


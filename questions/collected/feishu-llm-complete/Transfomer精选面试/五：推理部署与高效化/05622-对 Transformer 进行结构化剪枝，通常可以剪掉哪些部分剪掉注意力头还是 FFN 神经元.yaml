content:
  prompt: 对 Transformer 进行结构化剪枝，通常可以剪掉哪些部分？剪掉注意力头还是 FFN 神经元？
answer:
  mode: rubric
  reference_answer: |-
    结构化剪枝主要目标：

    - 注意力头：剪掉整个注意力头（包括该头的Q、K、V投影权重和对应的输出投影部分）。多个头存在冗余，去除部分头对性能影响较小。通过评估各头的重要性（如梯度大小、输出敏感性）来决定剪除对象。

    - FFN中间神经元：剪掉FFN隐层的某些神经元（对应权重矩阵的整行/列）。FFN隐层维度通常很大（如4倍于模型维度），存在大量冗余，可剪掉相当比例而不显著影响性能。

    - 整个Transformer层：在极端压缩时，可直接移除某些层。但整层剪枝对性能影响大，需更谨慎。

    - 嵌入维度剪枝：减少词表大小或隐藏维度。

    实践中，剪枝注意力头和FFN神经元是最常见、效果最好的结构化剪枝方式。两者可同时进行。通常先通过重要性评估确定全局阈值，然后一次性剪除所有不重要的结构单元，再进行少量微调恢复性能。

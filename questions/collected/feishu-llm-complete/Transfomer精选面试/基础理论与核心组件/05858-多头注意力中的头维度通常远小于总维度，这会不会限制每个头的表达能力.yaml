content:
  prompt: 多头注意力中的头维度通常远小于总维度，这会不会限制每个头的表达能力？
answer:
  mode: rubric
  reference_answer: |-
    可能的限制：是的，每个头的维度 d_k 通常只有 d_model/h，比如 64 或 128，远小于总维度（如 768、1024）。单个头的低维空间确实限制了其可以建模的复杂关系——点积注意力在低维空间中更易受到噪声影响，且无法捕获需要高维表示才能区分的细粒度语义差异。

    但限制被以下因素缓解：

    - 多个头联合：每个头关注不同子空间，拼接后的整体表示维度恢复到 d_model，并经过输出投影，可以在全局层面组合各个头的低维信息。这种“分而治之”的策略使得模型的总体表示能力并未下降，反而能捕获多角度的特征。

    - 非线性组合：注意力输出经过拼接和输出投影（线性变换），再经过前馈网络（FFN）的非线性变换。FFN 可以在高维空间中重组来自不同头的信息，弥补单个头维度的不足。

    - 信息瓶颈的有益性：适当的低维约束可以作为一种正则化，迫使每个头专注于最有信息量的特征方向，减少过拟合风险。

    - 任务依赖性：对于许多任务，64 维的表示已经足够捕捉注意力模式。实验表明，当 d_k 从 64 降为 32 时，大型模型的性能下降并不明显；但降至 16 以下时可能出现瓶颈。

    因此，头维度较小确实在微观层面限制了单个头的容量，但通过多头并行的互补性、后续层级的融合以及适当的维度选择，整体模型的表达能力得以充分保持。

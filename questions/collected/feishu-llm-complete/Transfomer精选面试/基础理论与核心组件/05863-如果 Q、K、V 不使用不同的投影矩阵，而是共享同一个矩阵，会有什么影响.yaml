content:
  prompt: 如果 Q、K、V 不使用不同的投影矩阵，而是共享同一个矩阵，会有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    标准自注意力中，输入序列 X 分别通过三个不同的线性投影矩阵 W_Q、W_K、W_V 得到 Query、Key、Value。这三个矩阵独立学习，赋予模型不同的表征空间。

    如果强制 Q、K、V 共享同一个投影矩阵（即 W_Q = W_K = W_V = W），那么：

    - 计算出的 Query、Key、Value 都来自同一个线性变换后的空间，它们在数学上是同一个向量空间的线性投影。这会导致注意力分数矩阵变为 (XW)(XW)^T，本质上就是线性变换后向量之间的点积。

    - 模型失去不对称性。Q和K负责计算注意力权重，V负责聚合信息。共享投影后，用于匹配的表示和用于聚合的表示完全相同，模型无法区分“用于查询的特征”和“用于被查询的特征”。这在某些需要非对称交互的任务中会限制表达能力。

    - 参数减少，但可能欠拟合。共享矩阵虽然减少了参数量，但也限制了模型从不同角度学习输入的能力。对于复杂任务，这种限制可能导致性能下降。

    但共享投影并非全无优点：在一些轻量级模型或特定任务中，共享参数可以作为一种正则化手段，减少过拟合风险，并降低计算和存储开销。例如，ALBERT 共享跨层参数以减少参数量，虽然不是直接共享QKV，但思路类似。如果任务简单或数据量少，共享QKV投影可能仍能取得可接受的效果，但通常标准做法是保持独立。


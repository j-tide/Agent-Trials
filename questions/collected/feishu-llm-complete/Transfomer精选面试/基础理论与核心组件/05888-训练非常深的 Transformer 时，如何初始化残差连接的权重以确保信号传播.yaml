content:
  prompt: 训练非常深的 Transformer 时，如何初始化残差连接的权重以确保信号传播？
answer:
  mode: rubric
  reference_answer: |-
    确保信号在深层Transformer中平稳传播需要两个条件：前向传播时激活值方差稳定，反向传播时梯度方差稳定。针对残差网络的初始化策略主要包括：

    - 标准初始化的修正：对于Pre-Norm Transformer，通常使用Xavier或Kaiming初始化来初始化线性层的权重，使得前向方差保持1。因为Pre-Norm中残差连接绕过了归一化，主要需要控制子层内部的方差。

    - 残差分支的零初始化：将每个子层的最后一个线性层（如FFN的W2、注意力输出投影）初始化为零，这样子层的初始输出为零，整个模型初始化为恒等映射。这是最直接的保障，但可能限制了早期的学习速度。

    - Fixup初始化：对于无归一化的深层残差网络，Fixup通过缩小某些层的权重（如将残差分支的最后一层权重按层数平方根缩放），并设置特定的偏置，来保持信号平稳。

    - T-Fixup：专门针对Transformer的Fixup，结合零初始化和部分参数缩小，使得无需LayerNorm也能训练深层Transformer。

    - DeepNorm：如前所述，系统化地缩放部分权重和残差，并设计对应的初始化参数，直接针对Post-Norm深层训练。

    - MAGNETO/ReZero：在每个子层的输出上乘以一个可学习的零初始化参数，训练初期全部为零，逐渐学习。

    核心思想都是让网络在初始时接近恒等映射，从而使得梯度能够无衰减地反向传播。


content:
  prompt: 为什么在极深 Transformer（如 1000 层）中，Pre-Norm 也会出现训练困难？有哪些更优方案？
answer:
  mode: rubric
  reference_answer: |-
    即使Pre-Norm保护了梯度，1000层的深度仍面临挑战：

    - 残差信号的方差积累：Pre-Norm下，残差流是各层输出的累加。假设每层子层的输出方差为σ²，1000层累加的总方差约为1000σ²，信号会变得极大，可能超出数值范围。

    - 归一化层的累积缩放效应：虽然梯度不经过归一化，但前向时残差流经过层数的增加，归一化层的输入方差不断增大，RMSNorm/LayerNorm为了维持输出方差，会施加更大的缩放，这会影响子层的有效学习率。

    - 训练时间与资源：1000层意味着巨大的计算和存储开销，即使技术可行，经济上也需权衡。

    更优方案：

    - DeepNorm：通过每层的残差缩放（乘以约1/√(2L)），强制残差贡献随层数衰减，总积累方差得到控制。在千层Transformer上已被验证有效。

    - LayerScale：在每个残差分支上使用可学习的通道级缩放，初始化为极小的值，优化过程会逐渐学习合适的贡献。

    - ResiDual：双重归一化加缩放。

    - 跳层连接/随机深度：训练时随机丢弃一些层，相当于训练了较浅网络的集成，正则化且减轻深层负担。


content:
  prompt: SwiGLU 中的“门”是如何计算的？为什么门控能提升模型效果？
answer:
  mode: rubric
  reference_answer: |-
    门 gate 的计算：

    ```text
    gate = SiLU( X · W_gate )
    ```

    其中 SiLU(x) = x · σ(x)。注意这里的门不是像 LSTM 那样由另一个序列或历史状态决定，而是完全基于当前输入。所以这是一种自门控（self-gating）：模型根据当前 token 自身的表示，决定哪些特征维度应该放大、缩小或置零。

    为什么门控能提升效果？

    - 动态特征选择：门控允许模型对每个 token 的不同维度进行非线性的条件过滤。同样的 FFN 权重，面对不同输入时可以产生不同的激活模式，等于让 FFN 变成输入依赖的“条件计算”。这极大地增加了模型的容量和灵活性。

    - 克服线性瓶颈：标准 FFN 是两层全连接+固定非线性，隐层表达是输入的一个确定性变换。门控引入了乘法交互，可以更精细地控制信息流，使模型更容易学习到稀疏的特征激活，类似于对隐层神经元进行软性的、上下文相关的 Dropout 或剪枝。

    - 梯度流动更优：门控的 SiLU 激活函数及其导数平滑，且门控结构天然为梯度提供了两条通路（通过 gate 和 values），有助于缓解梯度消失问题。


content:
  prompt: 为什么说多头注意力允许模型在不同的“表示子空间”中关注信息？请举例说明。
answer:
  mode: rubric
  reference_answer: |-
    “表示子空间”指的是通过不同的 Q、K、V 投影矩阵，输入被映射到不同的低维空间。在这些不同的空间中，token 之间的“相似性”度量方式不同，因此注意力权重会不同，聚合的值信息也来自不同方面。

    举例：假设输入句子“The cat sat on the mat because it was comfortable.”，其中“it”指代“mat”。在多头注意力中：

    - 一个头可能学习到句法依存关系：该头中名词“cat”的查询会与动词“sat”的键匹配，形容词“comfortable”与系动词“was”匹配。在这种子空间中，注意力权重体现的是语法结构。

    - 另一个头可能学习到指代消解：该头中“it”的查询会与“mat”的键强烈匹配，从而正确地将“it”关联到先行词。在这个子空间中，“it”和“mat”的向量距离更近。

    - 第三个头可能关注局部上下文：每个词更多地关注相邻的词，捕捉搭配和短语结构。

    因此，不同的头相当于从不同视角分析同一序列，并将各自获取的信息融合在一起，使模型同时掌握局部细节、全局语义、句法角色等多种依赖关系。

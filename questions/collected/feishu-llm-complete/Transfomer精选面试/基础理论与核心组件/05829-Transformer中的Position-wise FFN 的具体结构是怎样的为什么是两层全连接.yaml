content:
  prompt: Transformer中的Position-wise FFN 的具体结构是怎样的？为什么是两层全连接？
answer:
  mode: rubric
  reference_answer: |-
    标准 Transformer 的 FFN 对每个位置独立作用（Position-wise），结构为两层全连接：

    ```text
    FFN(x) = W2 · σ(W1 · x + b1) + b2
    ```

    其中 W1 将输入维度 d_model 映射到中间维度 d_ff（通常 4 倍），σ 是非线性激活函数（如 GELU、ReLU），W2 再映射回 d_model。整个过程可以概括为“升维→非线性→降维”。

    为什么是两层？

    单层全连接加激活其实只能对输入做一个线性变换后的非线性映射，表达的是原始特征空间中的固定模式组合。而两层结构引入了一个“高维中间层”，让不同位置的特征在这个高维空间里进行充分的非线性交互，然后再压缩回原维度。这类似核方法中的升维思想：在更高维的空间中，原本线性不可分的模式可能变得可分。两层是能实现通用函数逼近的最简结构（万能逼近定理），兼顾了表达能力和计算效率。更深层当然可以，但两层已足够提供丰富的特征变换，并且不会引入过多参数和训练难度。


content:
  prompt: 为什么 LayerNorm 需要可学习的缩放和偏移参数？去掉会怎样？
answer:
  mode: rubric
  reference_answer: |-
    缩放参数 γ 和偏移参数 β 为归一化后的表示提供了恢复原始表达能力的可能。如果没有 γ 和 β，LayerNorm强制输出的每一维都是均值为0、方差为1的分布。这会限制模型的表示能力：模型可能需要在某些维度上具有更大的方差来编码重要信息，或者需要非零均值来区分不同的特征模式。

    去掉这些参数后，每一层的输出都被严格归一化到固定的均值和方差，网络的灵活性大幅下降。实验表明，去掉可学习参数的LayerNorm会导致性能明显下降，尤其是在深层网络中。不过，γ 和 β 并非在所有情况下都不可或缺——RMSNorm就成功去掉了 β，只保留了 γ。这暗示偏移参数的重要性可能低于缩放参数。缩放参数允许模型动态调整各维度的信息量，这是最关键的部分；而均值偏移可以被后续线性层的偏置或权重部分吸收。


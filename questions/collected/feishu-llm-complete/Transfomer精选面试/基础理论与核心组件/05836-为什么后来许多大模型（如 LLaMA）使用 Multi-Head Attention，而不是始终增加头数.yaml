content:
  prompt: 为什么后来许多大模型（如 LLaMA）使用 Multi-Head Attention，而不是始终增加头数？
answer:
  mode: rubric
  reference_answer: |-
    后来的大模型仍然使用多头注意力，但它们在头数选择上更加审慎，通常不会无止境地增加头数，而是会平衡总维度、每个头维度和头数之间的关系。原因如下：

    [图片内容未导入]

    - 计算和内存开销：虽然参数量与头数无关，但多头注意力中每个头都需要独立的 softmax 计算，这增加了实际的计算图复杂度和内存占用（需要存储多个注意力矩阵）。头数太多会让 GPU 并行效率下降。

    - 边际收益递减：实验表明，在达到一定头数后，继续增加头带来的性能提升微乎其微，甚至因为每个头维度太小而损害性能。

    - 新兴注意力变体：大模型开始尝试一些多头注意力的变体，如 Multi-Query Attention (MQA) 和 Grouped-Query Attention (GQA)。MQA 让所有头共享同一组 K、V，极大减少 KV 缓存；GQA 则将头分组，组内共享 KV。这些方法在保持多头多样性的同时降低了内存和计算，被 LLaMA 2、Mistral 等模型采用。这表明未来的趋势不是增加头数，而是更高效地利用头的结构。

    因此，大模型并非简单地增加头数，而是在保持每个头充足维度的前提下，通过优化头的组织方式（如共享、分组）来进一步提升效率。

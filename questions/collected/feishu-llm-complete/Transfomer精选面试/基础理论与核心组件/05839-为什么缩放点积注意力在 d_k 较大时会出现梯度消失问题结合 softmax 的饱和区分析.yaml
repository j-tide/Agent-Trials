content:
  prompt: 为什么缩放点积注意力在 d_k 较大时会出现梯度消失问题？结合 softmax 的饱和区分析。
answer:
  mode: rubric
  reference_answer: |-
    缩放点积注意力的计算为：

    [图片内容未导入]

    点积 QK^T 中的元素是两个 d_k 维向量的内积。假设 Q 和 K 的每个分量是独立同分布的零均值、单位方差随机变量，那么点积的均值为0，方差为 d_k。当 d_k 很大时，点积的值会分布在绝对值较大的范围内，极端值（正或负）会非常多。

    Softmax 的饱和区：softmax 函数将输入映射到概率分布，当输入向量的某些分量非常大（正）或非常小（负）时，softmax 输出会饱和——极大的正输入对应的输出接近1，极负的输入对应的输出接近0。饱和区的梯度几乎为零（因为 softmax 梯度公式为 p_i(1-p_i) 或 -p_i p_j，当 p_i 接近0或1时梯度趋于0）。

    具体过程：

    - 当 d_k 很大时，QK^T 的元素方差很大，导致未缩放的注意力分数中存在巨大值，经过 softmax 后，注意力分布变得极度尖锐（接近 one-hot），大部分位置的注意力权重接近0。

    - 在反向传播时，由于梯度与注意力权重相关，那些接近0的权重梯度几乎为0，导致前面的参数更新信号微弱，训练困难甚至停滞。

    除以 dkdk 的作用：将点积缩放，使其方差保持在大约1的水平，这样 softmax 的输入就落在非饱和区，梯度可以正常流动。这就是为什么需要缩放点积注意力。没有缩放，大 d_k 会导致梯度消失；缩放后，训练稳定。


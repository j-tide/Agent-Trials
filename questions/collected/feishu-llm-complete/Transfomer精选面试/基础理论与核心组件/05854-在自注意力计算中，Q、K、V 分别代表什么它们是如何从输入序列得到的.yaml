content:
  prompt: 在自注意力计算中，Q、K、V 分别代表什么？它们是如何从输入序列得到的？
answer:
  mode: rubric
  reference_answer: |-
    角色：

    - Q（Query，查询）：表示“我想从其他位置获取什么信息”。当前正在计算注意力的位置生成查询向量，去与其他所有位置的键进行匹配。

    - K（Key，键）：表示“我这里有什么信息供别人查询”。序列中每个位置生成键向量，用于被其他位置的查询匹配。

    - V（Value，值）：表示“我实际要传递的信息内容”。注意力权重作用于值向量上，最终输出的是值的加权和。

    来源：在自注意力中，Q、K、V 都来自同一个输入序列 X（形状 L×dmodel），但通过三个不同的线性投影矩阵（可学习参数）变换得到：


content:
  prompt: 在超大模型中，FFN 的参数量往往超过注意力部分，为什么？这是必须的吗？
answer:
  mode: rubric
  reference_answer: |-
    原因：Transformer 总参数量主要由两部分构成：注意力层的 Q、K、V、O 投影矩阵（形状均为 d_model × d_model，对标准注意力总参数量约为 4 × d_model²），以及 FFN 的两个（或三个）线性层（标准 FFN 参数量约为 2 × d_model × d_ff）。当 d_ff 设为 4 × d_model 时，FFN 的参数量是 8 × d_model²，而注意力部分只有约 4 × d_model²。因此 FFN 的参数量大约是注意力的两倍。

    为什么这样设计？
    实验表明，在给定总参数预算下，将更多参数分配给 FFN（即增大 d_ff 或使用更深的 FFN）比增加注意力头的数量或注意力层的维度更能有效提升模型容量和下游性能。FFN 充当了模型的“知识记忆”部分，存储海量的特征模式；而注意力负责动态路由信息。知识的存储需要大量参数，而信息路由本身相对轻量。所以这种参数分配策略是合理的。

    这是必须的吗？

    不一定。这是一个经验上的优化选择，并非理论必须。如果改变比例，比如让注意力拥有更多参数，可能会在某些需要复杂推理的任务上更好，但通常整体表现不如当前分配。有些模型为了在特定硬件上提高效率，会调整比例。此外，使用 MoE 时，FFN 的参数量被极度放大（因为有多组专家），这时 FFN 参数占比更高，但实际激活的参数仅是一小部分。因此，参数分配比例是灵活可调的，取决于对容量、计算效率和任务需求的权衡。


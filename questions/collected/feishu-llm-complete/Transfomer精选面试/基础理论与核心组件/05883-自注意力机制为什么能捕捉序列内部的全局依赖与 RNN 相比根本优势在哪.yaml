content:
  prompt: 自注意力机制为什么能捕捉序列内部的全局依赖？与 RNN 相比根本优势在哪？
answer:
  mode: rubric
  reference_answer: |-
    全局依赖捕捉：在自注意力中，序列中每个位置都要计算与序列中所有其他位置的注意力权重（包括自己）。这意味着任意两个位置之间都存在直接的交互路径，无论它们在序列中相距多远。信息可以在单步计算中从一端流向另一端，没有任何距离衰减。相比之下，RNN（包括LSTM、GRU）是逐步递归处理的：信息必须按时间步依次传递，第 tt 步的隐状态只能直接看到第 t−1 步的信息，远处的信息需要经过多个时间步才能间接影响当前状态。随着距离增加，RNN 会遭遇梯度消失/爆炸问题，导致长期依赖难以学习。

    根本优势：

    - 计算并行化：自注意力中每个位置的输出可以独立、并行计算，因为所有位置之间的注意力分数可以一次性通过矩阵乘法得到。训练时不需要像RNN那样按时间步串行展开，极大提升了训练速度。

    - 路径长度短：任意两个位置之间的信息传播路径长度为O(1)（直接注意力连接），而RNN需要O(距离)的时间步，长距离传播困难。

    - 动态权重：注意力权重由输入内容动态决定，能够根据上下文灵活地调整关注点；而RNN的隐状态更新虽然也有门控，但其连接模式是固定的递归结构，灵活性较差。

    - 可解释性：注意力权重可以直接可视化，展示模型在生成每个输出时依赖于输入的哪些部分，增强了模型的可解释性。

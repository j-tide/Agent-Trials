content:
  prompt: 在推理时，残差连接会和归一化一起被融合吗？融合后的计算图是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    可以。推理时的图优化通常将相邻的线性层 + 残差连接 + 归一化融合为一个高效的算子，减少内存读写。

    融合后的计算图（以Pre-Norm RMSNorm为例）：

    原始流程：

    ```text
    1. z = RMSNorm(x)       # 读 x，写 z
    2. a = z W_Q            # 读 z，写 a (Q)
    3. 注意力计算 ...
    4. 残差相加: x + attn_out
    5. RMSNorm ...
    6. FFN ...
    7. 残差相加 ...
    ```

    融合后，RMSNorm可以与上一个线性层（例如FFN的输出投影）合并为一个kernel：

    ```text
    融合线性+残差+归一化(x, W, γ, residual):
        z = x W               # 在寄存器中计算线性输出
        # 同时累积平方和
        rms = sqrt(mean(z^2))
        z = (z / rms) * γ     # 归一化
        output = z + residual # 残差相加
    ```

    这样只需要一次读取x，一次写入output，中间步骤全部在寄存器/共享内存完成，大幅减少了显存带宽需求。现代推理引擎（TensorRT、ONNX Runtime、vLLM等）都能自动或手动实现这类融合，是Transformer推理加速的重要手段。

content:
  prompt: FFN 中的激活函数需要具备哪些特性，才能保证训练的稳定性？
answer:
  mode: rubric
  reference_answer: |-
    为保证深层 Transformer 的稳定训练，FFN 中的激活函数最好具备：

    - 平滑性：处处可导且导数变化平缓，避免突变导致梯度震荡。GELU、SiLU 等满足此条件，而 ReLU 在 0 点不可导（实践中可用次梯度）。

    - 避免硬饱和：激活函数的导数在大部分输入区域内不为零，以缓解梯度消失。ReLU 在负半轴导数为零，可能造成“死神经元”；GELU 和 SiLU 在负区仍有微小梯度，更稳定。

    - 适当的非线性：提供足够的非线性以提高模型容量，但不宜过度扭曲特征（如 sigmoid/tanh 容易饱和）。

    - 有限的输出范围或自正则化：如 GELU 可以看作自动调节神经元输出幅度，有助于控制激活值的规模，防止前向爆炸。

    - 计算高效：前向和反向传播的实现要快，以支持大规模训练。近似 GELU、SiLU 均可高效计算。

    实践中，GELU 和 SiLU 很好地满足了这些要求，因此成为主流。


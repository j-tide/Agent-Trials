content:
  prompt: 在 Pre-Norm 架构中，残差连接的分支输出乘以一个小于 1 的常数有什么作用？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    作用：

    - 稳定早期训练：在训练开始时，子层权重是随机初始化的，其输出可能带有很大的方差。乘以一个小常数可以有效抑制子层输出的幅度，使得模型在早期表现得接近恒等映射，输出主要由残差旁路的原始输入决定。这避免了初期激活值爆炸，使得梯度流动更加平稳。

    - 模拟更浅的网络：小α意味着模型需要更大的学习率或更长的训练时间来让子层发挥作用。这实际上创造了一种从浅到深的“课程学习”效应：模型初始时更依赖浅层表示，随着训练逐步加深影响。

    - 与DeepNorm结合：在DeepNorm中，这种缩放被系统化，与初始化配合，使得Post-Norm也能训练深层网络。在Pre-Norm中，虽然稳定性已有改善，但极深时仍可能需要这种缩放来进一步控制。

    需要注意，过小的α会减慢收敛速度；过大则起不到稳定作用。实践中，这个值通常由初始化策略（如Xavier、Kaiming）隐式控制，或显式设置为与层数相关的衰减因子。


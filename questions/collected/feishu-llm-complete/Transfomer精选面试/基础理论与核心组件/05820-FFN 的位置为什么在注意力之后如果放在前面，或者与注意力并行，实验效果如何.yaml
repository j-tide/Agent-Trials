content:
  prompt: FFN 的位置为什么在注意力之后？如果放在前面，或者与注意力并行，实验效果如何？
answer:
  mode: rubric
  reference_answer: |-
    标准 Transformer 块顺序是：注意力 → FFN，每层内部有残差连接和层归一化。

    为什么注意力在前？

    从信息流的角度看，注意力负责“聚合上下文”：每个 token 先去序列中搜集其他位置的信息，形成一个富含上下文的综合表示。然后 FFN 对这个综合表示进行深度的特征加工和记忆检索。如果反过来（FFN 在注意力之前），token 各自先做独立变换，然后再去和其他 token 交互。独立变换可能会改变 token 的表示，使得后续注意力的匹配变得不稳定。实验上，有些早期探索发现“注意力在前”通常效果更好，收敛更稳定。

    如果放在前面：一些研究尝试了 FFN 先于注意力的变体，发现性能略有下降，但并非不可接受。这可能是因为 FFN 先处理会过早地将 token 映射到另一个空间，使得注意力对位置和语义的匹配受到干扰。但经过仔细调优后，这种顺序也可以工作。

    如果与注意力并行：也就是在同一层内同时计算注意力和 FFN，然后将两者输出相加。这种结构被称为 Parallel Transformer Block，在一些模型（如 PaLM）中被采用。它的好处是可以在硬件上更好地并行调度：注意力计算和 FFN 计算可以同时进行，减少了串行等待时间，提升训练和推理速度。实验结果表明，并行结构的性能与串行结构相当，甚至在某些配置下略优，同时显著提高了硬件利用率。目前，并行块已成为许多大模型的标准配置。


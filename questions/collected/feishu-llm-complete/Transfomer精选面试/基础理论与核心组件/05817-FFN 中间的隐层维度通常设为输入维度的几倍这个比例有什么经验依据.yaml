content:
  prompt: FFN 中间的隐层维度通常设为输入维度的几倍？这个比例有什么经验依据？
answer:
  mode: rubric
  reference_answer: |-
    通常设为 4 倍。例如 d_model=512，则 d_ff=2048。这个比例最早在 Transformer 原论文中被采用，后来几乎成为默认配置。

    经验依据：

    - 在最初的机器翻译实验中，4 倍扩展提供了足够的容量来存储和组合从注意力层传来的上下文信息。过小（如 2 倍）会限制模型表达能力，导致下游任务性能下降；过大（如 8 倍）虽然容量更大，但参数量剧增，容易过拟合，且计算开销显著增加，而边际收益递减。

    - 4 倍是一个在精度、参数量和训练速度之间的“甜点”，被大量后续工作（BERT、GPT 等）验证和延续。当然，并非绝对，有些大型模型为了在固定总参数量下加深网络，会适当减小 d_ff 的比例（如 3.5 倍或更小），也有模型使用 8/3 倍等变体，但 4 倍是最稳健的起点。


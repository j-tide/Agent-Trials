content:
  prompt: RMSNorm 去掉了什么？这样做为什么没有严重损害性能？
answer:
  mode: rubric
  reference_answer: |-
    RMSNorm去掉了中心化（减去均值）操作和偏移参数 ββ。

    为什么去掉中心化没有严重损害性能？

    - 后续的线性变换（如注意力中的QKV投影、FFN中的全连接层）本身就可以学习到对输入进行平移。如果数据没有中心化，权重矩阵的偏置项（如果有）或者权重的列均值可以吸收这个偏移。现代Transformer中很多已去除线性层的偏置，此时RMSNorm去中心化的影响更明显，但实验表明，模型可以通过调整缩放参数 γγ 和后续权重来补偿。

    - 从特征学习角度看，重要的是不同维度的相对大小和方差。RMSNorm保留了每个token向量的范数（通过RMS缩放），确保了特征的尺度一致。而均值偏移只是一个全局平移，深层网络可以通过学习来适应这种平移。实际上，有理论分析认为，均值的移除在某些情况下甚至可能破坏有用的特征偏移信息，但实践表明RMSNorm至少与LayerNorm持平，甚至在某些任务上略优。

    - RMSNorm仍然保留了最关键的操作：根据特征的RMS进行缩放，这控制了激活值的范围，防止方差爆炸或消失。因此它继承了LayerNorm最主要的稳定训练的功能。

    所以，RMSNorm相当于LayerNorm的一个极简有效版本，去除了对性能影响较小的组件，实现了计算加速。


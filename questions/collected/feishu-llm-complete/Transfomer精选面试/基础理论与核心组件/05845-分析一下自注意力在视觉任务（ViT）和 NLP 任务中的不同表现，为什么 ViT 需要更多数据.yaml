content:
  prompt: 分析一下自注意力在视觉任务（ViT）和 NLP 任务中的不同表现，为什么 ViT 需要更多数据？
answer:
  mode: rubric
  reference_answer: |-
    NLP 中的自注意力：文本序列天然具有强语法和语义结构，token 的上下文依赖很重要。自注意力能够动态地为每个词聚合全局信息，这对于消歧义、指代消解、长程依赖建模非常有效。此外，NLP 中预训练数据量极大（如几十亿词），且迁移学习成熟。

    ViT 中的自注意力：图像被切分成 patches，每个 patch 被视为一个 token，整个图像转换为 token 序列进行自注意力。自注意力在图像上有以下几个特点：

    - 缺乏卷积的归纳偏置：CNN 具有平移等变性和局部性等归纳偏置，天然适合图像。ViT 没有这些先验，必须从数据中学习空间关系（如相邻 patch 的相关性），这需要更多数据。

    - 图像信号更“密集”但冗余：图像 patch 之间相关性高，很多背景区域信息量低。自注意力计算所有 patch 对之间的关联，造成大量计算浪费在没有信息的区域上。CNN 通过局部卷积高效利用空间冗余。

    - 对位置信息敏感：图像中的绝对位置和相对位置都很重要。ViT 需要学习合适的位置编码来捕捉空间结构，而 NLP 中相对位置更关键。

    为什么 ViT 需要更多数据：

    由于没有卷积的强归纳偏置，ViT 在中小规模数据集上容易过拟合且泛化差，无法学到与 CNN 相媲美的特征。只有在大规模预训练（如 JFT-300M 或 ImageNet-21K）时，ViT 才能凭借自注意力的全局感受野和可扩展性超越 CNN。足够的数据让 ViT 从零开始学到类似卷积的局部特征和多层次表示，同时也得益于 Transformer 的大规模扩展能力（scaling law）。简言之，数据是 ViT 弥补缺乏归纳偏置的“养分”。


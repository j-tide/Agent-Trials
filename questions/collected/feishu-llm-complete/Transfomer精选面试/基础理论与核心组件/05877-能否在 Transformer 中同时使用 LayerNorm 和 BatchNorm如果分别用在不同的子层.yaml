content:
  prompt: 能否在 Transformer 中同时使用 LayerNorm 和 BatchNorm？如果分别用在不同的子层？
answer:
  mode: rubric
  reference_answer: |-
    理论上可以，但不常见且可能引入复杂性。

    - 如果注意力子层用LayerNorm，FFN子层用BatchNorm，或者反过来：由于两种归一化的统计量计算方式和依赖完全不同，会导致不同子层的输出分布特性差异极大，优化器需要同时适应两种尺度，训练可能不稳定。

    - 在混合精度训练中，BatchNorm对batch size和数值精度敏感，而LayerNorm较鲁棒，两者混用会使数值管理更复杂。

    - 此外，BatchNorm在推理时用全局统计量，LayerNorm用单个样本，两者不一致会导致推理行为与训练有差异。

    因此，实践中极少混合使用。Transformer家族几乎统一采用LayerNorm或RMSNorm。


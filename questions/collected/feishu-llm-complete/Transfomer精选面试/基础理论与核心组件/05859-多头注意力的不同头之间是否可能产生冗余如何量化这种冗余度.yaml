content:
  prompt: 多头注意力的不同头之间是否可能产生冗余？如何量化这种冗余度？
answer:
  mode: rubric
  reference_answer: |-
    冗余的存在：大量实验表明，Transformer 中的多个注意力头确实存在显著冗余。同一层内的不同头可能学习到几乎相同的注意力模式（例如都强烈关注 [SEP] 标记或句子首词），或者在功能上高度重叠。这主要是因为标准训练过程并没有显式鼓励头之间的多样性，它们可能在相似的梯度信号下收敛到相似解。

    量化冗余度的方法：

    - 注意力分布相似度：对于同一输入序列，计算两个头输出的注意力权重矩阵之间的差异。常用指标有 Jensen-Shannon 散度（JSD）、KL 散度或简单的余弦相似度。如果两个头在所有位置上的注意力分布高度一致（JSD 接近 0，余弦相似度接近 1），则它们可视为冗余。

    - 输出表示的相似度：将两个头的输出向量（经过各自的注意力计算后）进行中心化核对齐（Centered Kernel Alignment, CKA）或线性中心核对齐（Linear CKA）。高相似度表示两个头提供了几乎相同的信息。

    - 消融实验：依次移除某个头，观察模型在下游任务上的性能变化。如果移除一个头后性能几乎不变，说明该头冗余。还可以测量移除头前后模型输出 logits 的差异，差异越小说明该头越不重要。

    - 头重要性评分：通过计算损失函数对头输出权重的梯度，或利用 Taylor 展开估计每个头对损失的贡献。贡献极低的头可视为冗余。

    - 子空间重叠度：由于每个头学习一个注意力子空间，可以计算子空间基之间的 Grassmann 距离或主角度。主角度越小，子空间越接近，表示头可能关注相似的特征方向。

    综合这些方法，可以构建一个“冗余度矩阵”，直观展示任意两个头之间的功能重叠程度，为后续剪枝或合并提供依据。

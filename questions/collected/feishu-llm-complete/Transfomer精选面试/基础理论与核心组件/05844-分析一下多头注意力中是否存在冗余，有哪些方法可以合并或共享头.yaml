content:
  prompt: 分析一下多头注意力中是否存在冗余，有哪些方法可以合并或共享头？
answer:
  mode: rubric
  reference_answer: |-
    大量实证研究表明，Transformer 中的注意力头确实存在显著冗余。例如，同一层内的多个头可能学习到几乎相同的注意力模式（如都关注 [SEP] 或特定高频词），或者某些头的输出在最终预测中贡献极低。

    合并或共享头的方法：

    - 头剪枝：评估每个头的重要性，直接移除不重要的头（见上一问）。

    - 头合并/重组：将多个行为相似的头通过加权求和或低秩近似合并为一个头，减少总头数。例如，可以利用注意力输出的相似性进行聚类，将同一簇的头合并。

    - 共享 QKV 投影：让多个头共享部分或全部的 Q、K、V 投影参数，减少参数量和计算量。例如，AlBERT 就跨层共享所有参数，包括注意力头的参数。

    - 动态头选择：在推理时根据输入动态选择激活哪些头（如 MoE 式的门控），未激活的头不参与计算，相当于一种条件计算。

    - 低秩因子分解：将每个头的 QKV 投影分解为两个低秩矩阵的乘积，并让多个头共享一个大的“基础”矩阵，每个头只需学习小的差异矩阵，达到参数共享和压缩。

    这些方法都可以在保持模型容量的同时减少冗余，提高推理效率。

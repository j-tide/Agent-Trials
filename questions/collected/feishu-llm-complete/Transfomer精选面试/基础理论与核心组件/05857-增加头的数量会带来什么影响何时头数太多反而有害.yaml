content:
  prompt: 增加头的数量会带来什么影响？何时头数太多反而有害？
answer:
  mode: rubric
  reference_answer: |-
    增加头数的影响：

    - 更细粒度的子空间：每个头的维度更小，能够学习更专门化的模式。在一定范围内增加头数可以提高模型性能，因为更多的并行注意力模式能捕获更丰富的信息。

    [图片内容未导入]

    - 计算量略有增加：尽管矩阵乘法的总 FLOPS 大致相同，但更小的矩阵乘法和更多的拼接/拆分操作可能导致实际效率下降。

    头数太多的害处：

    - 每个头维度过小：如果 dk太小，点积注意力的表达能力受限，无法有效捕捉复杂的语义关联。实验表明，当 dk 降至一定值（如 8 或 16）以下，性能可能开始下降。

    - 冗余与过拟合风险：过多的头可能导致许多头学到相似的冗余模式，没有带来额外的多样性，反而增加了计算开销和模型复杂度。

    - 优化困难：过多的头使得梯度被分割得更细，可能不利于优化器找到好的解。


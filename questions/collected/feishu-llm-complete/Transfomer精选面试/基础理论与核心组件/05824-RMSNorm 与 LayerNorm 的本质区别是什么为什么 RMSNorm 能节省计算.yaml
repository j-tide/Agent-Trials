content:
  prompt: RMSNorm 与 LayerNorm 的本质区别是什么？为什么 RMSNorm 能节省计算？
answer:
  mode: rubric
  reference_answer: |-
    LayerNorm需要计算两个统计量：均值（中心化）和方差（缩放）。RMSNorm则只计算均方根值（Root Mean Square），完全去掉了中心化步骤。公式为：

    [图片内容未导入]

    节省计算的原因：

    - 省去了均值计算：无需对 d_model 维度的元素求和再除以维度。

    - 省去了减去均值的操作：减少了一次逐元素的减法。

    - 省去了偏移参数 β 的存储和计算（RMSNorm通常只保留缩放参数 γ，不保留 β ）。

    对于大模型，这些节省在每一次前向和反向传播中累积，总体可减少约5-10%的归一化计算开销。考虑到Transformer中每个子层前后都有归一化，层数众多，节省相当可观。LLaMA、Llama 2、Mistral等主流模型均采用RMSNorm。


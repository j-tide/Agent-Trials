content:
  prompt: 什么是 SwiGLU 激活函数？它的公式是什么？相比 ReLU 带来了什么改进？
answer:
  mode: rubric
  reference_answer: |-
    SwiGLU 是 Swish-activated Gated Linear Unit 的简称，属于门控线性单元（GLU）家族。它将 GLU 的门控思想与 Swish 激活函数结合。

    公式：

    ```text
    SwiGLU(x) = (x · W_g) ⊙ Swish(x · W)
    ```

    或者写成两步：

    ```text
    gate = SiLU(x W_g)   # SiLU 即 Swish，SiLU(x) = x · σ(x)
    values = x W
    output = gate ⊙ values
    ```

    其中 ⊙ 表示逐元素乘法，σ 为 sigmoid。SwiGLU 对 values 还常另加偏置，这里简写。

    相比 ReLU 的改进：

    - 门控机制：SwiGLU 引入了一个独立的门（gate），由输入本身线性变换后通过 Swish 非线性生成，对另一个变换后的值进行逐元素加权。这使得网络能够学习哪些信息应该通过、哪些应该被抑制，比直接使用 ReLU 过滤更灵活。

    - 梯度质量：Swish（SiLU）是光滑非单调函数，没有硬饱和区，梯度可以更均匀地传播，缓解了 ReLU 的“死神经元”问题，也避免了梯度消失。

    - 更强的表示能力：由于门的存在，SwiGLU 可以视作对输入的条件线性变换，相当于根据上下文动态调整特征映射，使得相同参数量的模型能拟合更复杂的函数。实验表明，SwiGLU 在语言模型预训练中优于 ReLU、GELU 等传统激活，是实现更优困惑度的关键组件。


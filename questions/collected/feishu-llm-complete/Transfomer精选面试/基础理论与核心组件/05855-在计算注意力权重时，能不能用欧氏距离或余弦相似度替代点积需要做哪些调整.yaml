content:
  prompt: 在计算注意力权重时，能不能用欧氏距离或余弦相似度替代点积？需要做哪些调整？
answer:
  mode: rubric
  reference_answer: |-
    欧氏距离：衡量两个向量的不相似度，值越小越相似。注意力需要相似度越大权重越高，所以可用负欧氏距离或平方距离的负值。欧氏距离 = ||q - k||^2 = ||q||^2 + ||k||^2 - 2 q·k。它包含了点积项，但也引入了向量的模长。如果使用欧氏距离，需要确保向量模长不主导相似度（例如通过层归一化控制模长）。此外，距离的范围与点积不同，可能需要调整温度系数或缩放因子。

    余弦相似度：归一化点积，即 q·k / (||q|| ||k||)。余弦相似度就是点积的归一化版本，如果 Q 和 K 已经经过 L2 归一化，那么点积就等于余弦相似度。所以，可以直接用余弦相似度替代点积，只需先对 Q 和 K 进行 L2 归一化即可。这样做的好处是消除了向量模长的影响，注意力分数只反映方向相似性，可能对异常值更鲁棒。许多变体（如 NormFormer）就在注意力中使用了这种归一化。

    需要调整的地方：

    - 如果使用欧氏距离，可以令注意力分数 = -||q - k||^2 / τ（τ 为可学习或固定温度），然后过 softmax。但需要确保距离数值不至于过大或过小，可能需要特征归一化。

    - 如果用余弦相似度，可以直接应用，通常配合一个可学习的缩放因子（因为余弦值域为[-1,1]，方差较小，可能不需要像点积那样除以√d_k，但也可能需要适当缩放以匹配 softmax 的敏感度）。

    总体而言，余弦相似度是更直接的替代，因为它就是归一化点积，且在现代 Transformer 中已有采用（如 qk-norm）。欧氏距离与高斯核函数有关，也可用于注意力，但实践中点积因其简单高效而最普遍。


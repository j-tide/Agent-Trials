content:
  prompt: 如果限制每个注意力头只能关注特定的局部区域，这还算多头注意力吗？会有什么效果？
answer:
  mode: rubric
  reference_answer: |-
    是否算多头注意力：从广义上讲，这仍然属于多头注意力的变体。多头注意力的核心特征是拥有多个并行的注意力计算单元，即使每个单元的作用范围被限制，只要它们独立计算、最后合并输出，就保持了多头的本质。典型例子包括局部注意力（Local Attention）或滑动窗口注意力（Sliding Window Attention），这些模型中每个头可以设定不同的窗口大小或位置，从而在保持多头并行性的同时限制关注范围。

    效果：

    - 计算效率提升：限制每个头只关注局部区域，可以将复杂度从 O(L²) 降到 O(L×W)，其中 W 是窗口大小。这极大减少了长序列的计算和内存开销。

    - 局部细节捕获能力增强：局部注意力强制模型优先学习邻近 token 的依赖，这类似卷积的归纳偏置，在处理图像、音频等具有强局部结构的数据时尤其有益。实验表明，混合使用局部和全局注意力头往往能取得速度和精度的平衡。

    - 可能损失全局视野：如果所有头都被限制为局部，模型将无法直接捕捉长距离依赖。通常需要保留至少一个全局注意力头，或通过堆叠多层来间接扩大感受野。

    - 可解释性提升：结构化限制使每个头的行为更易分析，有助于理解模型到底关注了输入的哪些区域。

    因此，这种变体可视为标准多头注意力在效率上的特化，仍属于多头框架，常见于 Longformer、Swin Transformer 等高效架构。

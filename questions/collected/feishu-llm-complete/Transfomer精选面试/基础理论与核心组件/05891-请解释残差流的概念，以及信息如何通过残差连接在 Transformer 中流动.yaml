content:
  prompt: 请解释“残差流”的概念，以及信息如何通过残差连接在 Transformer 中流动。
answer:
  mode: rubric
  reference_answer: |-
    残差流是指由残差连接形成的一条贯穿整个Transformer的、信息可以近乎无衰减传播的路径。每一层的残差连接都将该子层的输入直接加到其输出上。如果我们将所有残差路径展开，最终输出可以看作所有层子层输出的加权和加上原始输入嵌入。由于每个子层的输入都是前面所有残差输出的累积，信息可以跨层直接流动，而不必完全依赖每一层的变换。

    具体来说，输入嵌入经过第一层后，第一层的输出包含原始嵌入 + 第一层子层的残差。第二层的输入就是第一层的输出，第二层在此基础上加上自己的残差，以此类推。最终输出 = 嵌入 + Σ(每层子层的输出)。这种结构意味着：

    - 浅层特征可以直接传递给深层，不会被中间层“扭曲”或“遗忘”。

    - 梯度反向传播时，每层的梯度可以沿残差流直接传到浅层，而不仅仅依赖通过子层变换的路径。这形成了梯度高速公路。

    - 模型的学习可以看作是在原始表示上逐步叠加修正，每层只需要学习与当前最优表示的差异，降低了优化难度。

    残差流是Transformer可扩展性的关键。因为它确保了即使层数很深，信号也不会彻底消失或爆炸。


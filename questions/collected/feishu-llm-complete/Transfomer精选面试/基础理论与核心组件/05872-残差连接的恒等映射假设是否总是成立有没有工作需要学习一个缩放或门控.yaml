content:
  prompt: 残差连接的“恒等映射”假设是否总是成立？有没有工作需要学习一个缩放或门控？
answer:
  mode: rubric
  reference_answer: |-
    标准的残差连接强制恒等映射（即乘系数1）。但恒等映射假设并非总是最优。有些工作探索了可学习的缩放或门控：

    - Highway Networks：早期工作，使用门控来调节残差比例。

    - LayerScale：为每个残差分支引入一个可学习的逐通道缩放向量，初始化为极小值。训练中自动学习每个特征维度在当前层的最佳残差贡献。

    - ResiDual：在残差连接前后都使用缩放因子。

    - 门控残差连接：类似LSTM/GRU的门，让模型动态决定残差分支的通过量。

    这些方法可以让模型更灵活地控制不同层的信息流，有时能提升训练稳定性和最终性能。但会增加参数量和计算开销。标准恒等映射因其简单、有效，仍然是大规模Transformer的首选。


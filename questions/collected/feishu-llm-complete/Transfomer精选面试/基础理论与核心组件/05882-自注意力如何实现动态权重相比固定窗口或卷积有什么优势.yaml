content:
  prompt: 自注意力如何实现“动态”权重？相比固定窗口或卷积有什么优势？
answer:
  mode: rubric
  reference_answer: |-
    动态权重的实现：自注意力的权重不是固定的参数，而是由输入本身的内容决定的。具体来说，权重是通过查询和键的点积计算得到的，而 Q 和 K 都是输入序列通过可学习的线性投影后产生的，因此不同的输入会产生完全不同的注意力分布。这种内容依赖性就是“动态”的含义。

    相比固定窗口或卷积的优势：

    - 内容自适应：固定窗口（如局部注意力）或者卷积的权重模式是预定义的（卷积核在空间上共享权重，局部窗口大小固定），与输入的具体内容无关。例如一个卷积层对任何输入图像都使用相同的滤波器。自注意力则不同，即使序列中两个token位置相同，但输入内容不同时，注意力权重也会改变。它能根据具体的语义自动决定哪些token更应该被关注。

    - 全局依赖性：卷积受限于感受野大小，需要堆叠多层才能逐渐扩大感受野；而自注意力在一层内即可建立任意两个token之间的直接联系，无论它们在序列中相距多远。

    - 更灵活的模式：自注意力可以同时捕捉多种关系（通过多头机制），例如既关注局部上下文，又关注全局主题信息；而固定窗口只能捕捉局部信息。

    当然，动态权重的代价是计算复杂度高（平方复杂度），且需要大量数据才能学到有效的注意力模式。

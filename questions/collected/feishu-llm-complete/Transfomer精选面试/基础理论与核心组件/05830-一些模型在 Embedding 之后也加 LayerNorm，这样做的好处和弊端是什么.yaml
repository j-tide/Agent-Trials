content:
  prompt: 一些模型在 Embedding 之后也加 LayerNorm，这样做的好处和弊端是什么？
answer:
  mode: rubric
  reference_answer: |-
    好处：

    - 稳定输入分布：嵌入层的输出（可能加上位置编码）的数值范围和方差可能随词汇表和初始化变化。在嵌入后立即LayerNorm，可以将输入统一缩放到适合后续Transformer层的范围，降低对学习率的敏感性，加速收敛。

    - 减少嵌入维度与模型维度的不匹配影响：有时嵌入维度和模型隐藏维度不同，通过LayerNorm可以缓和这种不匹配。

    弊端：

    - 增加了计算开销：每个token在进入第一层前额外做一次归一化，对于长序列有不可忽略的时间成本。

    - 可能限制表示：将嵌入向量的均值强制归零、方差归1，可能会丢失嵌入中已经学习到的某些重要先验分布（如低频词的较小模长）。这可能影响模型对稀有词的区分度。

    - 并非总是有益：BERT等早期模型中，嵌入后不接LayerNorm，而是依赖位置编码和后续层来处理分布。

    目前，LLaMA、GPT-3等模型未在嵌入后立即加LayerNorm，而是直接进入Transformer层。一些轻量级模型或特定任务中会使用。


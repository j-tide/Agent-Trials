content:
  prompt: LayerNorm 的计算公式是什么？它是在哪个维度上进行归一化的？
answer:
  mode: rubric
  reference_answer: |-
    LayerNorm的公式为：

    [图片内容未导入]

    其中：

    - xx 是输入张量，在Transformer中形状为 (batch, seq_len, d_model)。

    - μμ 和 σ2σ2 分别是沿着最后一个维度（d_model维度）计算的均值和方差。即对于每个token的表示向量，独立计算其自身的均值和方差，跨token之间不共享统计量。

    - ϵϵ 是防止除零的小常数。

    - γγ 和 ββ 是可学习的缩放和偏移参数，形状与 d_model 相同。

    - ⊙⊙ 表示逐元素乘法。

    归一化的维度：LayerNorm是对每个样本的每个位置的特征向量进行归一化。与BatchNorm完全不同：BatchNorm是对整个batch中所有样本的同一特征维度进行归一化。Transformer采用LayerNorm的根本原因是文本序列是变长的，且不同样本的序列长度不同，batch内统计量不稳定；同时自回归解码时，序列长度逐步增长，无法用BatchNorm做全局统计。LayerNorm对每个token独立归一化，天然适合序列模型。


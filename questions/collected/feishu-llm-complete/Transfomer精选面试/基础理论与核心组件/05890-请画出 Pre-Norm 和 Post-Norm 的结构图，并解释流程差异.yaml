content:
  prompt: 请画出 Pre-Norm 和 Post-Norm 的结构图，并解释流程差异。
answer:
  mode: rubric
  reference_answer: |-
    Post-Norm（原始Transformer）：

    ```text
    输入 x
      └→ [Multi-Head Attention] → 输出 attn_out
           └→ x + attn_out → LayerNorm → 输出 h1
      └→ [Feed-Forward Network] → 输出 ff_out
           └→ h1 + ff_out → LayerNorm → 输出 h2
    ```

    归一化放在残差相加之后。子层输出先与输入相加，再通过LayerNorm。

    Pre-Norm（现代标准）：

    ```text
    输入 x
      └→ LayerNorm → [Multi-Head Attention] → 输出 attn_out
           └→ x + attn_out → 输出 h1
      └→ LayerNorm → [Feed-Forward Network] → 输出 ff_out
           └→ h1 + ff_out → 输出 h2
    ```

    归一化放在子层之前。输入先经过LayerNorm，再进入注意力或FFN，然后与原始输入残差相加。相加后不再做归一化（或者仅在最后输出层做一次）。

    流程差异的本质：

    - Post-Norm中，残差路径上的信号（x）会与经过变换的噪声（子层输出）混合后一起被归一化，归一化会重新缩放整个混合信号。这导致残差旁路的“纯净”梯度信号在归一化中被稀释，每一层都可能对梯度产生缩放效应，加深网络时梯度容易消失或爆炸。

    - Pre-Norm中，残差路径完全绕过了归一化，梯度可以通过残差连接直接从深层传到浅层而不受任何缩放。归一化只作用于进入子层的输入，控制子层的输入分布，但不影响残差梯度的流动。这使得深层网络的训练稳定性大幅提升，成为现在几乎所有大模型的标准。


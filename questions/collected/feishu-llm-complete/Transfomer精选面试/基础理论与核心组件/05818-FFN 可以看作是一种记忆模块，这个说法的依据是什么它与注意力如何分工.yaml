content:
  prompt: FFN 可以看作是一种“记忆”模块，这个说法的依据是什么？它与注意力如何分工？
answer:
  mode: rubric
  reference_answer: |-
    依据：

    - FFN 的两层结构可以视为存储了海量的键值对记忆。有研究将 FFN 的隐层神经元解释为“键”（key），输出权重解释为“值”（value）。输入激活了哪些键，就会检索出对应的值并叠加到输出中。从这个角度看，FFN 实际上实现了一个大规模的联想记忆网络：它记住了训练数据中大量的特征组合模式，并在推理时根据输入的模式进行检索和组合。

    - 实验表明，FFN 的参数量巨大（占 Transformer 总参数的三分之二以上），且这些参数具有高度冗余性，去除部分 FFN 权重后模型仍能工作，这符合记忆系统的特征：容量大、可压缩。

    与注意力的分工：

    - 注意力负责捕获上下文依赖和序列级别的信息路由：它根据当前 token 与其他 token 的关系，动态地从序列中聚合信息。注意力解决的是“我应该从哪些位置取信息”。

    - FFN负责对每个位置的表示进行独立、非线性的特征变换，可以看作是在处理“拿到信息后怎么加工”。它将注意力输出的混合信息进行升维处理，在这个高维空间中完成特征的重新组合、筛选和存储。

    - 形象比喻：注意力是“查资料”，FFN 是“消化资料并作答”。注意力负责信息流动，FFN 负责信息加工和记忆。


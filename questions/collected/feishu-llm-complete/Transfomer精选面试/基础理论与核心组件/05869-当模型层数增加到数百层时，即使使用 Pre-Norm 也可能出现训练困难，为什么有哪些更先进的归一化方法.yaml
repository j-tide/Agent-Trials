content:
  prompt: 当模型层数增加到数百层时，即使使用 Pre-Norm 也可能出现训练困难，为什么？有哪些更先进的归一化方法？
answer:
  mode: rubric
  reference_answer: |-
    Pre-Norm虽然通过残差旁路保护了梯度，但数百层的深度仍会带来问题：

    - 残差累积效应：随着层数增加，残差流上累积的信息量越来越大，输出表示的整体幅度会逐渐增长（因为每层都会加上自己的输出）。即使每层的输出幅度不大，数百层累积下来也可能使信号变得巨大，导致前向激活值爆炸，反向梯度爆炸。

    - 子层输入分布漂移：尽管Pre-Norm在每个子层前都做归一化，但随着网络加深，残差流上的全局统计特性可能缓慢变化，深层子层的输入分布可能与浅层显著不同，使得统一的学习率不再适用。

    - 优化难度：极深网络的损失平面异常崎岖，即使梯度流动通畅，找到好的极小值仍然困难。

    更先进的归一化方法：

    - DeepNorm：如前所述，专门为深层Post-Norm设计，但对Pre-Norm同样有效。通过残差缩放和权重初始化，显式控制每层子层输出的幅度，使其随层数衰减，防止残差累积过大。

    - ResiDual：将Pre-Norm和Post-Norm结合，在残差连接的两端都进行归一化，既保护了梯度，又控制了残差流的幅度增长。

    - Value-Residual Learning：将残差连接应用于Value矩阵或特定的组件，而非整个子层，细化信号控制。

    - LayerScale：在残差分支上引入可学习的逐通道缩放参数（初始化为小值），让模型自己学习每层子层的最佳贡献幅度。

    - NormFormer：在注意力之后添加额外的LayerNorm，并对残差分支进行缩放。


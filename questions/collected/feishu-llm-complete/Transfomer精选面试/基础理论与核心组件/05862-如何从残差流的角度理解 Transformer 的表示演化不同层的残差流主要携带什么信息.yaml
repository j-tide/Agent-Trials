content:
  prompt: 如何从“残差流”的角度理解 Transformer 的表示演化？不同层的残差流主要携带什么信息？
answer:
  mode: rubric
  reference_answer: |-
    从残差流的角度看，Transformer的初始表示（嵌入）直接贯穿所有层，并在每一层被加上该层子层的输出。因此，最终表示 = 嵌入 + Σ(每层残差)。这可以看作在原始嵌入上不断叠加修正。

    信息演化：

    - 浅层：残差分量主要修正局部语法和词性信息，比如将相邻词的上下文融入当前token，或调整词义以适配语境。浅层注意力倾向于关注邻近位置。

    - 中层：开始出现语义组合，残差分量捕获短语级、句子级的语义结构，如同指代消解、语义角色标注等。注意力范围扩大。

    - 深层：残差分量进行高级推理和全局信息整合，如文本蕴含、情感倾向、任务特定的特征组合。注意力可能关注整个序列的关键部分。

    通过残差流，浅层的基础信息可以无衰减地流向深层，深层可以在此基础上构建高层语义。这种“叠加修正”的模式也使得模型易于进行分析：可以通过检查残差分量（即每层子层的输出）来推断该层对最终表示的贡献。


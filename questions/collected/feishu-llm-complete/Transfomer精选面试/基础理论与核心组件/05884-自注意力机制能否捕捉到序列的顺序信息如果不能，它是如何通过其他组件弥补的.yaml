content:
  prompt: 自注意力机制能否捕捉到序列的顺序信息？如果不能，它是如何通过其他组件弥补的？
answer:
  mode: rubric
  reference_answer: |-
    自注意力本身不能捕捉顺序信息。因为自注意力计算的是输入序列中每对token之间的相关性，这个计算过程是对称且置换等变的——如果你将输入序列的顺序打乱，自注意力输出的每个位置的表示也会跟着打乱到对应的新位置，但表示的内容不会改变。也就是说，对于自注意力，“A B C”和“C B A”只是排列不同，它无法感知字母的先后顺序。

    弥补方式：位置编码。Transformer通过向输入嵌入中添加位置编码来注入顺序信息。位置编码是一个与输入嵌入相同维度的向量，它按照token在序列中的位置生成，使得每个位置的输入表示不仅包含语义信息，还包含该位置的位置信号。

    具体有两种实现：

    - 正弦位置编码（Sinusoidal Positional Encoding）：原版Transformer使用不同频率的正弦和余弦函数生成固定模式的位置编码。它的好处是可以外推到训练时未见过的序列长度，且不需要额外学习参数。

    - 可学习位置编码（Learned Positional Embedding）：BERT、GPT等模型直接为每个位置初始化一个可学习的嵌入向量，在训练过程中优化。这种方式更灵活，但最大长度固定。

    位置编码与词嵌入相加后进入自注意力，使得每个token的表示同时携带了“是什么”和“在哪里”的信息。这样，即使自注意力计算本身是位置无关的，输入中已经嵌入了位置信息，注意力权重就能间接感知到顺序——例如，相邻位置的token会因为位置编码相似而倾向于获得更高的注意力权重。

    后来的变体如相对位置编码（Relative Positional Encoding）直接在注意力计算中注入相对位置偏置，进一步强化了顺序建模能力。例如Transformer-XL和T5使用相对位置编码，将两个token之间的相对距离作为偏置项加到注意力分数中，使得模型更自然地理解“距离近的token更相关”。


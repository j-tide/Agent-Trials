content:
  prompt: 能否使用线性激活函数代替非线性激活？对模型容量有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    可以，但模型将失去非线性，退化为一个线性映射的组合。多层线性变换叠加仍等价于单层线性变换，无法拟合任何非线性函数。这会导致模型容量极限受限：即使堆叠很深，模型也只能学习线性决策边界，完全无法处理语言中复杂的非线性关系（如语法组合、语义多义性等）。实验上，这种模型在语言建模等任务上的性能极差，等同于放弃了深度学习的基本优势。

    所以，非线性激活是必需的，它赋予网络拟合任意复杂函数的能力。FFN 中的激活函数正是提供这种非线性的关键环节。

content:
  prompt: 为什么在一些轻量化模型中会减少头的数量，甚至使用单头？如何在效率和效果间取舍？
answer:
  mode: rubric
  reference_answer: |-
    轻量化模型（如 MobileViT、EdgeFormer、一些蒸馏后的 BERT 变体）减少头数或使用单头的主要原因在于计算与参数效率。

    减少头数的动机：

    - 参数和计算量：虽然多头注意力的总参数量与头数无关（当总维度固定时），但每个头都需要独立的 QKV 投影、注意力矩阵计算和 softmax。多头操作会引入额外的重塑、转置、拼接开销，且在实际 GPU 调度中，太多的小矩阵乘法会降低并行效率，增加内存访问成本。

    - 头维度过小的风险：轻量化模型的总维度 d_model 通常很小（如 256 或 384），如果强行分成多个头，每个头的 d_k 可能只有 16 或 32，这严重限制了单个头的表示能力，容易导致注意力模式低质、训练困难。

    - 边际收益递减：对于小模型，多头的增益可能微乎其微，甚至因为表示稀释而损害性能。单头或少量头使每个头拥有更大的维度，能学习更丰富的特征，反而更有效。

    效率与效果的取舍：

    - 根据模型规模选择：总维度 ≥512 时通常保持多头（如 8 头，d_k=64）；维度较小（如 256）时可减为 2-4 头；极小模型（如 128 维）直接用单头。这确保了每个头至少拥有 32-64 维的表示空间。

    - 使用分组查询（Grouped-Query Attention, GQA）或 Multi-Query Attention (MQA)：不直接减少头数，而是让多个头共享同一组 Key 和 Value，从而大幅降低 KV 缓存和计算量，同时保留 Query 的多样性。LLaMA 2、Mistral 等模型采用 GQA，在效率与多头多样性之间取得平衡。

    - 混合注意力模式：部分头使用全局注意力，部分使用局部或稀疏注意力，使计算预算集中于重要区域。

    - 在微调阶段评估头的重要性，剪除贡献低的头，将模型压缩到最适合目标任务的配置。

    总之，取舍原则是：保证每个头有足够维度（≥32），在此基础上通过共享、剪枝等减少实际计算量，而非简单削减头数牺牲能力。

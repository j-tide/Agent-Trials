content:
  prompt: 分析一下多头注意力与“多通道卷积”的类比，它们有哪些相似和不同？
answer:
  mode: rubric
  reference_answer: |-
    相似之处：

    - 并行多组处理：多头注意力使用多组 QKV 投影，多通道卷积使用多个卷积核。每个头/通道都可以学习不同的特征模式（头关注不同的依赖关系，卷积核检测不同的视觉特征如边缘、纹理）。

    - 输出拼接/融合：多头的输出在特征维度上拼接后通过线性投影融合；多通道卷积的输出就是多个特征图，直接堆叠成多通道张量，后续由下一层处理。都体现了“分组处理、合并信息”的思想。

    - 参数共享与多样性：注意力头的投影矩阵和卷积核都是可学习参数，训练后不同头/核会自动分化，捕捉不同模式。

    不同之处：

    - 操作机制：多头注意力是内容自适应的——权重由输入本身计算得到（Query-Key匹配），属于动态计算；卷积核的权重是静态的，训练后固定，对任何输入都执行相同的滤波操作。

    - 感受野：注意力天然拥有全局感受野（在标准实现中），每个输出位置都可以直接访问整个输入序列；卷积核通常具有局部感受野，需要堆叠多层来扩大。

    - 计算复杂度：注意力的计算和内存开销随序列长度呈平方级增长；卷积的复杂度与序列长度线性增长（假设卷积核大小固定）。

    - 归纳偏置：卷积引入了平移等变性和局部性先验，这在数据量少时尤为重要；注意力缺乏这些先验，需要海量数据才能学到类似能力。

    类比有助于理解，但两者在实际应用中有各自的优势领域。现代视觉模型（如 ViT 与 CNN 对比）正在逐渐融合两种机制，例如在 Transformer 中引入局部窗口注意力或卷积 stem。

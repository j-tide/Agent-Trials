    温度的影响：

    - T→0：softmax趋近于argmax，输出分布极度尖锐，注意力几乎全部集中在分数最大的那个位置上，其他位置权重接近0。模型变得非常“硬”，只关注单一位置，丧失多位置聚合能力，梯度也接近零。

    - T=1：标准softmax，分布由输入分数自然决定。

    - T>1：softmax变得更平滑，注意力分布更加均匀（趋近于平均分布）。极端情况下 T→∞，所有位置的注意力权重相等，输出变成了对所有值的简单平均。

    在训练中，温度可用于控制模型的学习难度。例如，在知识蒸馏或对比学习中，较低的温度会强调困难样本的区分度，较高的温度会使分布更软，保留更多类别间的相对关系。在Transformer的标准注意力中，通常


content:
  prompt: 注意力权重矩阵的每一行有什么含义？可视化注意力权重能告诉我们什么？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    可视化注意力权重的意义：

    - 理解信息流动：可以看到模型在做某个预测时，主要依赖于序列中的哪些其他token。例如在机器翻译中，解码器的某个时间步的注意力权重通常集中在编码器对应的源语言词组上。

    - 发现语言结构：注意力图常呈现出特定的模式，如对角线附近关注相邻词（局部依赖），某些头专门关注标点符号，或关注整个句子的起始标记（[CLS]）以获取全局信息。

    - 诊断模型行为：如果模型犯错，通过查看注意力图可以判断它是否关注了错误的源信息。例如在指代消解中，代词应该关注它所指的名词；如果注意力没有集中在正确名词上，就表明模型没有学到该指代关系。

    - 多头注意力的多样性：不同注意力头可能学会不同的模式：有的负责句法结构，有的负责语义相关，可视化可以验证多头是否各司其职。

    但需注意，注意力权重并不完全等同于模型决策的因果解释（有研究表明高注意力不一定代表高重要性），但它们仍能提供有价值的分析线索。

content:
  prompt: 在 Decoder 中，Pre-Norm 和 Post-Norm 对自回归生成的质量有何不同影响？
answer:
  mode: rubric
  reference_answer: |-
    在自回归解码器中，模型逐token生成，每步的输出作为下一步的输入。

    - Post-Norm：每一步的生成过程中，残差分支与子层输出相加后进入LayerNorm。由于LayerNorm对整体进行重新缩放，在自回归步骤间，这种缩放可能导致早期生成的token表示随着后续归一化而发生微妙的“漂移”。从生成质量上看，Post-Norm可能导致长序列生成时的不稳定，有研究观察到Post-Norm Transformer在长文本生成时更容易出现重复和退化。

    - Pre-Norm：残差路径未经过归一化，因此后续层的处理不会改变残差流上已生成token的原始信号。这使得历史信息能够更稳定地向前传递，对长序列生成的连贯性更有益。实验表明，Pre-Norm在自回归语言建模和长文本生成中往往优于Post-Norm，训练也更稳定。

    不过，Post-Norm通过在训练初期具有更大的有效梯度（因为LayerNorm在残差合并后，实际上放大了有效步长），有时在浅层模型或特定任务上收敛更快。但在深层和长序列场景下，Pre-Norm的优势愈发明显。


content:
  prompt: 请解释自注意力的并行化是如何实现的，为什么训练时比 RNN 快得多？
answer:
  mode: rubric
  reference_answer: |-
    并行化实现：

    自注意力计算可以完全通过矩阵运算并行完成，不需要像RNN那样逐步迭代。具体来说：

    [图片内容未导入]

    现代GPU专为大规模矩阵乘法优化，自注意力的这些操作都可以在GPU上高度并行执行。相比之下，RNN必须按时间步展开：第 t步的计算依赖于第 t−1 步的隐状态，无法在时间维度上并行，只能串行处理。因此，对于长度为 L的序列，RNN需要 O(L) 个串行步骤，而自注意力只需要 O(1) 个串行步骤（假设矩阵乘法内部充分并行）。在训练时，自注意力通过一次前向即可得到所有位置的输出，而RNN必须逐时间步计算并存储中间隐状态，反向传播时还要随时间步反向传播（BPTT），无法充分利用GPU并行度，训练速度远慢于自注意力。这就是Transformer训练效率远超RNN的根本原因。

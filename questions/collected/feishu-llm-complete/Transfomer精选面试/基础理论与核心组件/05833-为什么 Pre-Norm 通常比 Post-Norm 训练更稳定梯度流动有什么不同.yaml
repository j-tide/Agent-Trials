content:
  prompt: 为什么 Pre-Norm 通常比 Post-Norm 训练更稳定？梯度流动有什么不同？
answer:
  mode: rubric
  reference_answer: |-
    本质差异在于残差分支上的梯度是否经过归一化层的缩放。

    在Post-Norm中，子层的输出与残差输入相加后进入LayerNorm。LayerNorm的梯度包括对输入的缩放因子（与输入方差相关）。反向传播时，梯度流经LayerNorm会被该缩放因子乘上，不同层、不同位置的缩放因子不同且会随着训练动态变化。当层数很多时，这些缩放因子的乘积可能指数级放大或缩小梯度，导致训练不稳定。此外，Post-Norm在初始化阶段，残差分支的输出方差与主路径不匹配，需要精心设计初始化（如DeepNorm）来缓解。

    在Pre-Norm中，残差路径从输出直接连到输入，完全绕过了LayerNorm。反向传播时，梯度可以沿着残差连接无障碍地流动，不受任何归一化层的缩放影响。归一化只用于调控进入子层的输入，相当于对子层的输入进行了“白化”预处理，使子层能更稳定地学习，但不阻碍梯度的跨层传播。这就像给每层加了一个输入调节器，而保留了一条畅通无阻的梯度高速公路。

    此外，Pre-Norm使得子层（注意力或FFN）的输入分布更稳定——LayerNorm将输入归一化到均值为0、方差为1（或RMS归一化），这样不论前面层的输出如何漂移，进入当前子层的分布始终可控。这使得学习率可以设置得更大，训练收敛更快，且对初始化不敏感。


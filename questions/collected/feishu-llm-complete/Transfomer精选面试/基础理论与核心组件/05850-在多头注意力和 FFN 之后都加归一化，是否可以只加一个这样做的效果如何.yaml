content:
  prompt: 在多头注意力和 FFN 之后都加归一化，是否可以只加一个？这样做的效果如何？
answer:
  mode: rubric
  reference_answer: |-
    可以只加一个，实际上很多现代架构正是这么做的。标准Pre-Norm只在每个子层之前加归一化，子层之后直接残差相加，不再加归一化。这等价于只用了“一个归一化”在两个子层之间（注意：每个子层各有一个归一化，但总共每层有两个归一化）。如果将这两个归一化减少为一个（例如只在注意力之前或只在FFN之前加），实验表明性能会明显下降，因为两个子层的输入分布无法被同时很好地控制。

    如果只在层间加一次归一化（例如Post-Norm模式，在两个子层完成并相加后统一归一化），就是原始的Post-Norm设计，缺点前面已分析。

    近年有探索更激进的简化：如只在整个Transformer的第一个层之前加一次归一化，后面完全无归一化。这需要极特殊的初始化（如T-Fixup）和残差缩放，但能够成功训练。不过，推理部署时这种全无归一化的模型更容易出现数值不稳定。

    总之，每层两个归一化（Pre-Norm模式）是目前经验上鲁棒性最好、训练最稳定的配置。


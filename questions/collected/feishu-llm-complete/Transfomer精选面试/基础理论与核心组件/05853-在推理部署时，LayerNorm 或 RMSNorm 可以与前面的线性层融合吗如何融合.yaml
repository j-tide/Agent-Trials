content:
  prompt: 在推理部署时，LayerNorm 或 RMSNorm 可以与前面的线性层融合吗？如何融合？
answer:
  mode: rubric
  reference_answer: |-
    可以。LayerNorm/RMSNorm在推理时可以与紧邻的前一个线性层垂直融合，以减少内存访问和计算步骤。

    融合原理：

    [图片内容未导入]

    [图片内容未导入]

    对于LayerNorm（包含减均值），融合更复杂，因为需要均值的计算，但均值和RMS可以一次遍历同时计算。通用的融合做法是使用自定义CUDA kernel或利用推理框架（如TensorRT、ONNX Runtime）中的图优化，将MatMul + LayerNorm合并为一个算子。这可以减少显存带宽压力，加速推理。


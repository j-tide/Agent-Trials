content:
  prompt: GELU 激活函数和 ReLU 的核心区别是什么？为什么 Transformer 中常用 GELU？
answer:
  mode: rubric
  reference_answer: |-
    核心区别：
    ReLU（Rectified Linear Unit）是一个确定性的分段线性函数：ReLU(x) = max(0, x)。它在输入大于 0 时保留原值，小于等于 0 时直接置零，形成硬截断。

    GELU（Gaussian Error Linear Unit）则是一个平滑的随机正则化函数，可以近似理解为“期望的 ReLU”，公式为 GELU(x) = x · Φ(x)，其中 Φ(x) 是标准高斯分布的累积分布函数。实际计算常用近似：

    ```text
    GELU(x) ≈ 0.5x(1 + tanh(√(2/π)(x + 0.044715 x³)))
    ```

    GELU 没有硬截断，而是在输入为负时给予一个逐渐趋近于零的小梯度，正值时接近线性但保持平滑。

    为什么 Transformer 中常用 GELU？

    - 平滑性：GELU 处处可微且曲率平滑，梯度流动更稳定，尤其适合深层网络的训练。

    - 自正则化效应：GELU 根据输入的大小随机性地“关闭”部分神经元（当 x 较小时Φ(x)接近 0），这类似于一种输入驱动的 Dropout，有助于防止过拟合，提升泛化能力。

    - 性能更好：在大量 NLP 预训练任务中，GELU 相比 ReLU 取得了更优的困惑度和下游微调性能，特别是在 BERT、GPT 等模型中。ReLU 的硬截断在表示空间中可能丢弃了部分有用的微弱负信号，而 GELU 保留了这部分信息。

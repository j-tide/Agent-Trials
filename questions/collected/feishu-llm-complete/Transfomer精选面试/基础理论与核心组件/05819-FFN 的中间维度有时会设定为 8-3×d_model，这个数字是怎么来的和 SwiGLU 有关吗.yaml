content:
  prompt: FFN 的中间维度有时会设定为 8/3×d_model，这个数字是怎么来的？和 SwiGLU 有关吗？
answer:
  mode: rubric
  reference_answer: |-
    这个比例确实与 SwiGLU 直接相关。标准的 FFN（用 ReLU 或 GELU）的中间维度通常设为 4 × d_model。参数量为：两个线性层 W1 和 W2，总参数量 ≈ 2 × d_model × d_ff = 2 × d_model × (4 × d_model) = 8 × d_model²。

    SwiGLU 需要三个权重矩阵：W_g、W_v（各自升维）和 W_o（降维）。如果保持中间维度仍为 4 × d_model，则总参数量变成 3 × d_model × (4 × d_model) = 12 × d_model²，比标准 FFN 多了 50%。为了在相同参数预算下对比，研究者将 SwiGLU 的中间维度调低，使得总参数量与标准 FFN 持平。设中间维度为 d_ff'，则有 3 × d_model × d_ff' = 2 × d_model × (4 × d_model)，解得 d_ff' = 8/3 × d_model ≈ 2.67 × d_model。这就是 8/3 倍的来历。

    因此，8/3 × d_model 并非任意选择，而是为了让 SwiGLU 的参数量恰好等于标准 4 倍中间维度的 FFN，从而进行公平的对比。实践证明，在这种等参数条件下，SwiGLU 的性能显著优于 ReLU 或 GELU。后来很多模型（如 LLaMA）就直接采用这个比例作为 SwiGLU 的默认配置。


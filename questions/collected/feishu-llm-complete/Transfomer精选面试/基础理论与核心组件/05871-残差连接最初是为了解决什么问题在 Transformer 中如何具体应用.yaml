content:
  prompt: 残差连接最初是为了解决什么问题？在 Transformer 中如何具体应用？
answer:
  mode: rubric
  reference_answer: |-
    残差连接最初在ResNet中被提出，核心要解决的问题是深度网络的退化问题：当网络层数增加到一定程度后，训练误差和测试误差不降反升，这不是由过拟合引起的，而是优化困难导致的。从数学上看，深层网络可以看作是一系列非线性变换的复合，在反向传播时，梯度需要经过多层链式求导。每经过一层，梯度都可能被权重的谱半径缩放。如果大部分层的缩放因子小于1，梯度呈指数级衰减（梯度消失）；如果大于1，则指数级爆炸。残差连接通过引入恒等映射的旁路，将层的输出从 F(x) 改为 F(x) + x。这样梯度可以沿着旁路直接传播，至少保证有一路梯度不受变换层的缩放影响，从而让深层网络的训练变得可行。

    在Transformer中，残差连接的具体应用方式是将每个子层（多头自注意力和前馈网络）的输入直接加到其输出上：output = LayerNorm(x + Sublayer(x))。这意味着每个子层学习的是相对于输入的残差，而非完整的输出表示。这种设计带来的好处不仅是梯度流动的改善：它让模型可以更容易地学习“恒等映射”——如果某个子层对当前表示没有正面贡献，模型只需将其权重推向零，使得该子层的输出趋近于零，残差连接就能几乎原样保留输入。这样，深层Transformer实际上是在一个“默认恒等”的基础上逐步修正表示，每一层的任务被分解为“在已有表示上做微小的调整”，大大降低了优化的难度。


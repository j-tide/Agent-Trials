content:
  prompt: 为什么 Transformer 的注意力机制被称为“缩放点积注意力”？和加性注意力有什么不同？
answer:
  mode: rubric
  reference_answer: |-
    缩放点积注意力得名于两个关键操作：

    - 点积：使用查询与键的点积来计算相似度，而不是其他函数。

    [图片内容未导入]

    与加性注意力的不同：

    [图片内容未导入]

    在 Transformer 中采用缩放点积注意力的主要原因是效率。现代GPU对矩阵乘法高度优化，点积注意力可以完全利用矩阵运算并行化，训练速度快；而加性注意力在序列长度较大时速度慢很多。同时，通过多头机制和投影矩阵，点积注意力也获得了足够的表达能力。

content:
  prompt: 如果不同头使用不同温度系数，会对注意力分布产生什么影响？
answer:
  mode: rubric
  reference_answer: |-
    在标准注意力中，温度系数通常被隐含为统一缩放因子 1/√d_k。如果为每个头分配不同的温度 τ_i，则注意力计算变为 softmax(QK^T / (τ_i·√d_k))。不同温度会显著改变注意力分布的“锐度”：

    - 低温度（τ < 1）：softmax 更尖锐，注意力高度集中在分数最大的少数位置。这可以让头专注于最相关的 token，提高精度，但可能导致梯度消失和多样性降低。

    - 高温度（τ > 1）：softmax 更平滑，注意力分布更均匀。这允许头融合更多 token 的信息，可能捕获全局上下文，但过高的温度会使输出退化为简单平均，丧失注意力选择能力。

    引入多温度的效果：

    - 增强多样性：不同头采用不同温度，可以促使它们聚焦不同范围的信息——有的头做“精确查找”（低温），有的头做“广撒网”（高温），从机制上鼓励头之间的功能分化，可能降低冗余。

    - 动态范围控制：对于语义匹配要求高的层（如浅层），低温有助于提取精确局部特征；对于需要全局推理的高层，高温有助于整合全局信息。

    - 梯度流动：低温头更容易饱和，训练时可能需要更小的学习率或梯度裁剪。实践中，可通过可学习温度参数让模型自适应调整。

    然而，额外引入温度系数增加了超参数复杂度。标准 Transformer 通过统一缩放已取得良好平衡，多温度方案更多出现在特定研究或领域适配中（如对比学习的温度调节）。

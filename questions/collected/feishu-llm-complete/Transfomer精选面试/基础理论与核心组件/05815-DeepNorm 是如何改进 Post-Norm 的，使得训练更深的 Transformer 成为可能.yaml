content:
  prompt: DeepNorm 是如何改进 Post-Norm 的，使得训练更深的 Transformer 成为可能？
answer:
  mode: rubric
  reference_answer: |-
    DeepNorm是微软在DeepNet中提出的一种改进Post-Norm的方案，目的是稳定训练数百甚至上千层的Transformer。其核心思想是通过精心设计的初始化和残差缩放来抑制Post-Norm中模型更新的幅度。

    具体做法：

    [图片内容未导入]

    这样做的效果是，在训练初期，每个子层的输出几乎为零，整个模型近似恒等映射。梯度在反向传播时，由于残差分支被减弱，Post-Norm中的归一化层对梯度的缩放效应被抵消了，深层梯度不至于消失或爆炸。随着训练进行，模型逐渐增大子层的贡献，但始终被 DeepNorm 的结构所约束，更新量保持可控。

    DeepNorm通过残差缩放解决了Post-Norm中“越深归一化层越多，梯度乘积越不稳定”的问题，在千层Transformer上取得了成功训练。


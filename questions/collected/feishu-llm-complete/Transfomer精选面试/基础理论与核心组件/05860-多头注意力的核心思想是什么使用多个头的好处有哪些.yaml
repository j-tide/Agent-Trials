content:
  prompt: 多头注意力的核心思想是什么？使用多个头的好处有哪些？
answer:
  mode: rubric
  reference_answer: |-
    多头注意力的核心思想是：将输入投影到多个不同的“表示子空间”中，在每个子空间内独立进行缩放点积注意力计算，然后将各个子空间的输出拼接起来，再做一次线性投影，得到最终的输出。这样，模型可以同时从不同角度关注输入序列的不同部分和不同类型的依赖关系。

    使用多个头的好处：

    - 增强表达能力：单头注意力只能学习一种固定的查询-键匹配模式，而多头注意力允许模型共同关注来自不同位置的不同表示子空间的信息。例如，一个头可能关注局部语法结构，另一个头可能捕捉长距离的语义关系，还有一个头可能专门关注某个特定词或标点。

    - 降低单个头学习的压力：每个头的维度通常较小，让模型通过多个低维注意力并行工作，比使用一个高维注意力更容易优化，且能学到更丰富的特征组合。

    - 稳定训练：多个注意力头可以相互补充，即使某些头在初期未学到有效模式，其他头仍能提供有效信号，整体训练更鲁棒。

    - 可解释性：不同的头可能学会分工，如有的头负责指代消解，有的头负责词性匹配，通过可视化可以分析模型内部的语言处理机制。


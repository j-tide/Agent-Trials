content:
  prompt: SwiGLU 的门控机制为什么需要两个线性变换？如果只用一个线性变换再分半，会怎样？
answer:
  mode: rubric
  reference_answer: |-
    SwiGLU 的标准实现需要两个独立的线性变换：一个生成门控信号（gate），另一个生成待门控的值（values）。写成公式就是 gate = SiLU(x · W_g)，values = x · W_v，然后输出 (gate ⊙ values) · W_o。这里 W_g 和 W_v 是两个独立的权重矩阵。

    为什么需要两个独立的线性变换？

    门控和值通路承担着不同的角色。门控负责“筛选”——决定哪些特征维度应该通过、放大或抑制。值通路负责“内容”——承载需要被筛选的信息本身。如果两者共享完全相同的输入特征和变换，它们之间的交互会非常受限。独立的 W_g 和 W_v 让模型可以将输入分别投影到两个不同的子空间中，一个专门学习“筛选规则”，另一个专门学习“被筛选的内容”。这种不对称性极大地增强了 FFN 的表达能力，让门控可以根据输入的不同方面做出精细的条件化决策。

    如果只用一个线性变换再分半，会怎样？

    “一个线性变换分半”的做法是：先计算 U = x · W，其中 W 的宽度是 2 × d_ff，然后将 U 沿特征维度切成两半，一半作为 gate，一半作为 values。这种做法在工程上更简单，只需一次矩阵乘法，而且在训练时常见（比如 PyTorch 的 nn.Linear 可以一次完成）。但从表示能力的角度看，它等同于强制 W_g 和 W_v 共享同一个输入投影的列空间。这意味着门控信号和值信号必须从输入特征的同一个线性组合中派生出来。虽然还是可以学习到有用的门控，但灵活性打了折扣。实验上，参数完全独立的双线性变换通常效果更好，因为模型可以学习到更丰富的门控-值交互模式。不过，为了保持参数量和计算量不变（见第3问），实践中往往将中间维度调整为原来的 2/3，使得两个独立的线性变换的总参数量与原来的一次大投影相当。


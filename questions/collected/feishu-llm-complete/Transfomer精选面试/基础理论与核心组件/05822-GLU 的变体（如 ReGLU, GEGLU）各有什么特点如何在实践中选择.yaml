content:
  prompt: GLU 的变体（如 ReGLU, GEGLU）各有什么特点？如何在实践中选择？
answer:
  mode: rubric
  reference_answer: |-
    GLU（Gated Linear Unit）及其变体通过在门控路径上采用不同的激活函数得到不同特性：

    - ReGLU：门控路径使用 ReLU，即 gate = ReLU(x W_g + b_g)，values 可以是线性或带激活。特点：计算简单，但 ReLU 的硬截断会丢失负值信息，可能限制表达。

    - GEGLU：门控路径使用 GELU。GELU 平滑，能保留部分负信号，往往比 ReGLU 表现好。

    - SwiGLU：门控路径使用 SiLU（Swish），被证明在大量语言模型预训练中效果最优，是目前主流。

    选择依据：

    - 优先考虑 SwiGLU，因为它在扩展实验中表现最优，已成为 LLaMA、PaLM 等模型的标准配置。

    - 如果对推理速度有极致要求，且损失可接受，可考虑 ReGLU 或直接使用 GELU（标准 FFN）。

    - 实践中，很多框架已提供方便切换的选项，可通过小规模消融实验对比不同激活函数的验证损失，选择适合自己数据和模型的变体。

    注意：使用 GLU 变体时需调整隐层维度以保持参数量不变（见第5问）。


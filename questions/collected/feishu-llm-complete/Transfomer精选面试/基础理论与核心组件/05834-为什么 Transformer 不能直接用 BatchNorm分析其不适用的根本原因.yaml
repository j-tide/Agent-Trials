content:
  prompt: 为什么 Transformer 不能直接用 BatchNorm？分析其不适用的根本原因。
answer:
  mode: rubric
  reference_answer: |-
    BatchNorm在Transformer中不适用的根本原因有几点：

    - 变长序列问题：文本序列长度不一，BatchNorm需要在每个特征维度上统计整个batch的均值和方差。为了做有效的batch统计，通常需要对序列进行padding到相同长度，并mask掉padding位置。但即使mask，padding位置的数值（通常为0）仍会影响统计量，导致均值和方差估计有偏，尤其当序列长度差异巨大时。

    - 自回归生成的不兼容：在解码器（如GPT）中，推理是自回归的，每次输入序列长度递增1。BatchNorm依赖完整的batch统计，对于单个样本自回归生成，无法计算有意义的batch统计量。即便训练时可以用整个batch，推理时无法保证一致的batch统计，导致训练和推理不一致。

    - 对batch size敏感：BatchNorm的效果高度依赖足够大且多样的batch size。NLP任务中batch size通常较小，尤其长序列时，batch内统计量噪声大，导致性能下降。而LayerNorm对每个样本独立计算，完全不受batch size影响。

    - 序列中不同位置的统计特性可能不同：文本中位置信息的差异性（例如句首和句尾）使得将所有位置的同一特征维度混合做归一化并不合理。

    综上，LayerNorm因其独立于batch、独立于序列长度的特性，天然适配Transformer。因此，在Transformer中，LayerNorm被广泛采用。


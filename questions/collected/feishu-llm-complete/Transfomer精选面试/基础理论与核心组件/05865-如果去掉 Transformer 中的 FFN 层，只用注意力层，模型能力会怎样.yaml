content:
  prompt: 如果去掉 Transformer 中的 FFN 层，只用注意力层，模型能力会怎样？
answer:
  mode: rubric
  reference_answer: |-
    去掉 FFN 层后，模型将完全由线性投影和注意力组成，失去了非线性特征变换和记忆存储的能力。

    具体影响：

    - 表示容量急剧下降：注意力本质上是基于输入相似度的加权求和，是输入表示的线性组合（不算 softmax 的非线性）。多层注意力叠加若没有 FFN 中的非线性，整个模型将退化为输入的一个复杂线性函数，无法拟合非线性决策边界。

    - 无法独立处理 token 内部信息：注意力只能混合不同位置的信息，但无法对一个 token 自身的表示做丰富的特征抽取（比如将词性、语义、句法角色等组合起来）。FFN 给每个位置提供了独立“思考”的机会。

    - 记忆缺失：如上一问所述，FFN 存储了大量训练数据中学习到的特征模式。去掉 FFN 后，模型将失去这种“知识记忆”能力，完全依赖注意力权重中隐式编码的信息，导致下游任务（尤其是需要事实知识的任务）性能暴跌。

    - 实验上，如果移除所有 FFN 层，Transformer 在语言建模、翻译等任务上的性能会降至极低水平，甚至无法收敛。

    所以，FFN 是 Transformer 不可或缺的组件，它提供了非线性、特征变换和知识存储三大核心能力。


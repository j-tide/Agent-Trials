content:
  prompt: 从零开始预训练一个小型 GPT 模型，你会如何设置架构超参数（层数、头数、维度）？依据是什么？
answer:
  mode: rubric
  reference_answer: |-
    设计一个小型 GPT 模型（参数量在 100M 到 300M 之间），需要在模型容量、训练成本和下游性能之间取得平衡。设置架构超参数时，通常会遵循一些经验法则，并考虑模型的总参数量目标。

    假设我们的目标参数量在 150M 左右，参考 GPT-2 Small（117M）和类似规模的模型，我会这样设置：

    - 层数（L）：12 层。12 层是小型 Transformer 的经典设置，既能提供足够的深度来逐层抽象信息，又不会因过深导致训练不稳定或显存压力过大。浅层（如 6 层）可能容量不足，无法学到复杂模式。

    - 模型维度（d_model）：768。768 是 BERT-base 使用的维度，在 12 层下能达到约 110M 参数（不含词嵌入，算上词嵌入约 120M）。这个维度大小既能保证每个 token 有足够的表示容量，又不至于使计算量过大。

    - 注意力头数（h）：12 头。通常建议每个头的维度 d_k = d_model / h = 64。64 是经验和理论上的一个良好平衡点：头维度足够大以保证单头的表示能力，同时多头能提供足够的多样性。

    - FFN 中间维度（d_ff）：3072（4 倍）。这是标准 Transformer 的经典比例，能提供充分的非线性变换容量。对于小模型，4 倍是很好的起点，若想进一步压缩参数量可减少到 3 倍或 2.5 倍。

    - 总参数量估算（不计词表）：

    依据：

    - 深度优先：在一定范围内，增加层数比增加宽度更有效。12 层能提供多层抽象，对文本理解有益。

    - 头维度 64：大量实验表明，64 维的头在表示能力和计算效率之间达到最优。过大则多头数量不够，过小则单头受限。

    - 计算效率：这个配置在 8×V100 或单张 A100 上可以高效训练，最大序列长度 1024 时显存占用可控。

    - 下游迁移：类似配置的模型（如 BERT-base、GPT-2 Small）已证明在多种 NLP 任务上表现良好，可以作为基线。

    如果追求更紧凑的模型（如 50M 以下），可以减小层数至 6-8 层，d_model 降至 512，d_ff 降至 2048。


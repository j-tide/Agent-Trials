content:
  prompt: Encoder-Decoder 架构中，Decoder 是如何利用 Encoder 输出的？交叉注意力的 K、V 来自哪里？
answer:
  mode: rubric
  reference_answer: |-
    Decoder 通过交叉注意力（Cross-Attention） 机制来利用 Encoder 的输出。

    具体过程：

    - Encoder 处理完整个输入序列后，输出一个编码后的表示序列，形状为 (batch, src_len, d_model)，记作 encoder_output。

    - 在 Decoder 的每个层中，交叉注意力的 Q（Query）来自 Decoder 上一子层的输出（即掩码自注意力后的表示）。这个 Q 代表“我需要什么信息”，携带了目标序列当前位置的上下文特征。

    - 交叉注意力的 K（Key）和 V（Value）均来自 Encoder 的输出 encoder_output。K 代表“我能提供什么信息以供匹配”，V 代表“我实际携带的信息内容”。

    - 计算时，Decoder 的 Q 与 Encoder 的 K 做点积，得到注意力权重（shape: (tgt_len, src_len)），表示目标序列每个位置对源序列各位置的关注程度。然后用这些权重去加权 Encoder 的 V，得到聚合了源语言信息的表示。

    这种设计的意义：Decoder 的每一个位置都可以动态地关注 Encoder 输出中的所有位置，将源语言的信息有选择地融入到目标语言的生成中，解决了序列到序列的对齐问题。这就是 Transformer 在机器翻译等任务中表现优秀的核心原因。

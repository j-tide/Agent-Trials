content:
  prompt: 解释一下 T5 中的“Span Corruption”预训练目标，它与 BERT 的 MLM 有何不同？
answer:
  mode: rubric
  reference_answer: |-
    T5 的预训练目标被称为 Span Corruption（跨度破坏），其核心是随机遮盖连续的文本片段（span），并让模型生成被遮盖的内容。具体做法：

    - 从输入文本中随机选择若干连续 token 片段，每个片段用一个独特的哨兵 token（如 <X>, <Y>, ...）替换。

    - 片段的选择基于几何分布，平均跨度长度约为 3。

    - 模型的 Encoder 接收这个被破坏的序列，Decoder 则需要自回归地生成被替换的片段内容，每个片段后跟着该哨兵 token，直到生成完所有缺失内容。

    - 损失函数只计算被遮盖片段的生成部分。

    例如，输入文本 "The quick brown fox jumps over the lazy dog"，随机遮盖两个片段 "quick brown" 和 "the lazy"，得到："The <X> fox jumps over <Y> dog"。目标输出为："<X> quick brown <Y> the lazy"。模型需要根据 Encoder 给出的上下文，由 Decoder 生成这些被遮盖的片段。

    与 BERT MLM 的核心不同：

    [嵌入表格未展开]

    Span Corruption 的优势：

    - 更强的生成能力：模型预训练时学会了根据上下文连续生成多个 token，这与文本摘要、生成式问答、翻译等下游任务高度一致。模型学会了“写出缺失的内容”，而非仅仅“补全单个词”。

    - 长度灵活：模型必须预测片段的长度（何时输出哨兵 token），这教会模型何时停止生成，对生成完整句子或段落有帮助。

    - 语义连贯性：预测连续片段比孤立 token 更能理解文本的连贯性，有助于提升生成文本的流畅度。

    简言之，T5 的 Span Corruption 是一种面向生成的统一预训练策略，它将 MLM 扩展为序列到序列的生成任务，使模型在理解与生成之间架起了桥梁。


content:
  prompt: T5 如何将所有 NLP 任务统一为 Text-to-Text 格式？请举例说明。
answer:
  mode: rubric
  reference_answer: |-
    T5（Text-to-Text Transfer Transformer）的核心理念是：每一个 NLP 问题都可以用“文本输入，文本输出”的格式来表达。它采用 Encoder-Decoder 架构，Encoder 接收输入文本，Decoder 生成输出文本，训练目标是标准的自回归交叉熵损失（在目标端）。通过这种统一的框架，T5 将预训练和微调阶段的所有任务都转换为同一个形式，实现了模型和代码的完全统一。

    例子：

    - 翻译：输入 "translate English to German: That is good."，输出 "Das ist gut."

    - 文本摘要：输入 "summarize: [文档文本]"，输出 "[摘要文本]"

    - 情感分类：输入 "sentiment: This movie is a waste of time."，输出 "negative"

    - 问答：输入 "question: What is the capital of France? context: France is a country in Europe. Its capital is Paris."，输出 "Paris"

    - 自然语言推理：输入 "premise: I have a dog. hypothesis: I have a pet."，输出 "entailment"

    T5 统一的关键在于：

    - 任务前缀：在输入文本的开头加入一个简短的任务描述（如上例中的 "translate English to German:" 或 "summarize:"），告诉模型当前要执行哪种任务。这个前缀作为输入的一部分，被 Encoder 编码，Decoder 生成时可以根据这个指令调整输出。

    - 所有输出都被视为文本：即使是分类标签，也被当作普通的文本 token 来预测。模型不需要任何任务特定的输出层（比如 softmax 分类头），只需在词表上预测下一个 token。这让同一个模型可以在完全不同的任务上共享所有参数。

    这种 Text-to-Text 格式使得 T5 成为一个真正的多任务统一模型。在微调时，只需将不同任务的数据集都转换为文本对，混合在一起训练，就能得到一个能处理多种任务的多面手。


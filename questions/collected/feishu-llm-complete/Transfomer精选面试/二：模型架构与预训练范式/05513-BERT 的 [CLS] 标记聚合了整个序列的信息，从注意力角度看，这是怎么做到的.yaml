content:
  prompt: BERT 的 [CLS] 标记聚合了整个序列的信息，从注意力角度看，这是怎么做到的？
answer:
  mode: rubric
  reference_answer: |-
    BERT 在输入序列的最前端添加了一个特殊的 [CLS] 标记。经过多层 Transformer 编码后，[CLS] 的最终隐藏状态被用作整个序列的聚合表示，用于句子级分类任务。

    从注意力角度：
    在每一层自注意力中，[CLS] 作为查询（Query）可以与序列中的所有其他 token（包括自己）计算注意力权重。由于注意力是双向且全连接的，[CLS] 可以自由地关注序列中的任意位置。通过训练（尤其是 NSP 任务和 MLM 中间接影响），模型学会让 [CLS] 从所有 token 中提取对整体语义最有用的信息，融合成一个紧凑的序列级表示。具体来说：

    - 在底层，[CLS] 可能关注到一些关键内容词。

    - 在高层，[CLS] 整合了来自各个位置的重要语义特征，形成了全局语义向量。

    此外，自注意力的加权求和机制使得 [CLS] 可以自适应地聚合信息，而不像简单池化那样平等对待所有 token。因此，[CLS] 成为了一个可学习的、上下文相关的全局句子表示。

    补充说明：后来的研究表明，[CLS] 并非天生就自动聚合全局信息，而是通过预训练任务（特别是 NSP 和 MLM）的梯度信号，使得自注意力权重学习到这种聚合行为。如果去掉 NSP 或改变训练目标，[CLS] 的聚合效果可能减弱。这也是为什么 RoBERTa 等模型虽然保留了 [CLS]，但有时会使用平均池化等替代方案。不过，[CLS] 作为一种简单有效的聚合方式，在大多数场景下仍然表现良好。


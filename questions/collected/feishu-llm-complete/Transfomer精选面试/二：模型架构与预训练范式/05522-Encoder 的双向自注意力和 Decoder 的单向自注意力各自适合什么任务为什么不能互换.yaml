content:
  prompt: Encoder 的双向自注意力和 Decoder 的单向自注意力各自适合什么任务？为什么不能互换？
answer:
  mode: rubric
  reference_answer: |-
    双向自注意力（Encoder）适合的任务：

    - 文本理解：文本分类、情感分析、自然语言推理、命名实体识别、关系抽取等。这些任务需要综合整个句子的上下文来做出判断。

    - 序列标注：每个位置的标签可能依赖于前后文，双向信息至关重要。

    - 句子/文档编码：用于检索、语义相似度计算、句子嵌入等。

    单向自注意力（Decoder）适合的任务：

    - 文本生成：语言建模、对话生成、故事创作、代码生成等。生成过程必须遵守时间顺序，只能基于已生成内容预测下一个词。

    - 自回归生成：翻译、摘要等条件生成任务中，目标端需要按顺序逐个生成。

    为什么不能互换？

    - 如果用双向注意力去做生成，模型在预测第 t 个词时能看到未来的正确答案（信息泄露），训练出的模型无法用于实际生成——因为它依赖的未来信息在推理时根本不存在。

    - 如果用单向注意力去做理解任务，每个 token 的表示只包含左侧上下文，对于需要右向信息的任务（如理解一个代词指向前文还是后文），模型会丢失重要信号，性能显著下降。

    例外：有些理解任务（如文本分类）对方向性不敏感，单向模型也能取得不错效果，因为最终分类只需全局聚合信息，从左到右逐步聚合也能近似全局语义。但序列标注等细粒度任务对双向信息的需求更为刚性。

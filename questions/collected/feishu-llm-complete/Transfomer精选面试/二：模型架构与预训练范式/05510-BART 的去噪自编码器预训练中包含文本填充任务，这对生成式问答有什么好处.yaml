content:
  prompt: BART 的“去噪自编码器”预训练中包含文本填充任务，这对生成式问答有什么好处？
answer:
  mode: rubric
  reference_answer: |-
    BART 的文本填充任务（Text Infilling）要求模型恢复被替换为单个 [MASK] 标记的连续多个 token 的完整文本片段。这种训练方式对生成式问答（尤其是需要从上下文中抽取并重写答案的任务）有直接的促进作用：

    - 答案片段生成能力

    在生成式问答中，答案往往不是一个词，而是一个短语或句子（如从文章中抽取一个实体名、一个解释片段）。文本填充任务使模型学会了根据上下文生成任意长度的连贯文本片段，而不仅是填补单个词。这直接训练了模型“写出完整答案”的能力，确保答案自然、完整。

    - 长度预测与结束判断

    填充任务中，模型必须自主决定生成多少个 token，直到输出哨兵 token 表示片段结束。这等价于让模型学习何时停止生成——对于问答，就是何时答案已表述完整。这种隐式的长度控制对避免生成过长或截断的答案非常重要。

    - 上下文压缩与重组

    在填充时，模型需要根据被破坏的上下文（缺了一段）推理出缺失的内容，这类似于阅读理解和摘要中需要根据上下文推断出答案。模型必须提取关键信息，并以连贯的形式表达出来。这锻炼了模型理解文本、整合信息并生成凝练答案的能力。

    - 鲁棒性

    去噪自编码器迫使模型学习各种噪声条件下的文本还原，使得模型对输入中的噪声、不完整信息具有鲁棒性。在真实问答场景中，用户问题或提供的上下文可能不完美，这种鲁棒性至关重要。

    实验支持：BART 在 SQuAD 等生成式问答基准上表现优异，特别是在需要生成较长、重写形式答案的任务中，明显优于仅使用 MLM 的 BERT 或仅单向的 GPT。可以说，文本填充任务为 BART 提供了“根据片段线索生成完整语句”的核心能力，这正是生成式问答所需要的。


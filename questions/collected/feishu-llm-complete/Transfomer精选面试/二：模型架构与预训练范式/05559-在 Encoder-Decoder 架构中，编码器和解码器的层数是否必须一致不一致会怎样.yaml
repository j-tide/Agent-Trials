content:
  prompt: 在 Encoder-Decoder 架构中，编码器和解码器的层数是否必须一致？不一致会怎样？
answer:
  mode: rubric
  reference_answer: |-
    不必一致，且常见不一致。编码器和解码器的层数是独立配置的，可以根据任务需求灵活调整。

    常见配置：

    - 许多原始 Transformer 工作（如机器翻译）中，编码器和解码器通常设置为相同层数（如各 6 层），但这主要是出于对称美观和调参方便，并非必须。

    - 很多后续模型采用了非对称设计。例如，BART 的 base 版本 Encoder 6 层、Decoder 6 层；但也有一些任务中，Encoder 更深（理解任务需要深层双向编码），Decoder 较浅（生成简单文本时）。反之，某些需要强生成能力的任务可能 Decoder 更深。

    不一致的影响：

    - Encoder 更深：如果编码任务非常复杂（如理解长文档、多跳推理），增加 Encoder 层数可以提取更丰富的源端特征，给 Decoder 提供更高质量的上下文。Decoder 相对浅一些不会显著降低生成质量，因为生成有时更依赖于最后一层的表示。

    - Decoder 更深：当生成任务需要精细控制（如诗歌创作、长文本连贯生成）时，加深 Decoder 能增强目标端的建模能力。Encoder 只需提供基本源端信息，不需要太深。

    - 训练稳定性：层数不一致不会破坏训练，只要两个部分的输入输出维度一致（通过残差和归一化保证）。反向传播时，梯度会分别流过 Encoder 和 Decoder，各自更新参数，没有额外的耦合。

    - 性能：在总参数量固定下，如何分配层数取决于任务。实验表明，极端不对称（如 1 层 Encoder + 11 层 Decoder）可能效果不佳，因为源端表示太浅，无法为生成提供有效信息。一般建议保持一定的对称性，但不要求严格相等。

    实践：T5 中基础版 Encoder 和 Decoder 都是 12 层，但大模型可以不同。在适配特定下游任务时，可冻结部分层或微调时调整层数。


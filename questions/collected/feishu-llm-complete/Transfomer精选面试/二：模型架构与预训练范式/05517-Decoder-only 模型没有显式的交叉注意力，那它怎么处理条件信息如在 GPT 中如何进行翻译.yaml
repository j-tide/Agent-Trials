content:
  prompt: Decoder-only 模型没有显式的交叉注意力，那它怎么处理条件信息？如在 GPT 中如何进行翻译？
answer:
  mode: rubric
  reference_answer: |-
    Decoder-only 模型将条件信息（源语言文本）和待生成的目标语言文本拼接成一个统一的序列，通过自注意力完成条件到生成的映射。

    以 GPT 翻译为例：

    - 输入序列构造：[源语言句子] [分隔符] [目标语言句子前缀（如开始符）]。

    - 训练时，源语言部分不计算损失（或掩码掉），只计算目标语言部分的语言模型损失（预测下一个 token）。Decoder 的自注意力在源语言部分可以看到完整源语言（双向），因为源语言是已知给定的；在目标语言部分则是因果掩码，只能看到前文。

    - 生成时，给定 [源语言句子] [分隔符] [目标语言开始符]，模型自回归地逐词生成目标语言翻译，每生成一个词就拼接到序列末尾，直到输出结束符。

    这种做法的优势：

    - 架构统一：无需额外设计 Encoder 和交叉注意力，一个 Decoder 处理所有信息。

    - 灵活扩展：可以轻松添加更多条件信息，如翻译指令、示例（few-shot），全部通过拼接实现。

    - 自注意力全程参与：源语言和目标语言在同一个自注意力计算中交互，模型的每一层都能直接访问源语言信息，信息流动更自由。

    现代大语言模型（如 GPT-4、LLaMA）在多种条件生成任务中都采用了这种统一序列的方式，体现了 Decoder-only 架构的灵活性和强大扩展能力。

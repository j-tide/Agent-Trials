content:
  prompt: 全词掩码（Whole Word Masking）和字级别掩码对中文预训练的影响分别是什么？
answer:
  mode: rubric
  reference_answer: |-
    在中文预训练中，因为中文没有天然的空格分词边界，掩码策略对语义学习影响显著。

    - 字级别掩码（Character-level Masking）
    随机掩码单个汉字。这会迫使模型在恢复掩码字时依赖周围的字，甚至可能通过局部 n-gram 信息补全（例如“苹”后面经常跟“果”）。这可能导致模型学到过多局部共现，而忽略词级别的语义实体。对于一些需要词边界和实体理解的复杂任务，字级别掩码的语义信号较弱。

    - 全词掩码（Whole Word Masking, WWM）
    先对文本进行分词（如用 jieba 分词），然后在掩码时，如果一个词内的某个字被选中掩码，则该词内的所有字一起被掩码。这种策略使掩码粒度更符合语义单元，模型必须依靠更远的上下文或全局语义来预测整个词，而不是简单的字间搭配。实验表明，全词掩码在中文文本分类、阅读理解、命名实体识别等下游任务上一致优于字级别掩码，且提升幅度较为显著。

    原因：全词掩码促使模型学习更丰富的词级和上下文表示，减少模型对简单字面搭配的记忆。但它的分词依赖外部分词器，可能引入分词错误传播。然而总体收益远大于风险，因此现代中文预训练模型（如 BERT-wwm、ERNIE、RoBERTa-wwm-ext）广泛采用了全词掩码。

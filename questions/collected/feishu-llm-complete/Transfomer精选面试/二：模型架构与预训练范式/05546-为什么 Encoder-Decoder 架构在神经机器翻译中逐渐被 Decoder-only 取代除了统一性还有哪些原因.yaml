content:
  prompt: 为什么 Encoder-Decoder 架构在神经机器翻译中逐渐被 Decoder-only 取代？除了统一性还有哪些原因？
answer:
  mode: rubric
  reference_answer: |-
    统一性确实是重要原因——用一个模型处理所有任务，减少架构复杂性。但还有更深层的原因：

    - 数据和规模优势：Decoder-only 的预训练目标（下一个 token 预测）天然适合从海量无标注文本中学习。互联网上几乎有无穷无尽的自然文本可用于训练语言模型。而 Encoder-Decoder 需要成对的平行语料（如翻译对）进行监督训练，这种数据昂贵且稀缺。Decoder-only 可以先在海量单语数据上预训练强大的语言能力，再用少量平行数据微调，大幅降低了对标注数据的依赖。

    - 零样本/少样本的涌现能力：当 Decoder-only 模型足够大时，即使只在单语数据上训练，也能通过提示（prompt）展现出一定的翻译能力——这源于多语言文本在训练数据中的共现。Enc-Dec 没有这种涌现特性，必须显式在平行数据上训练。

    - 长序列的注意力效率：Decoder-only 的自回归生成时，源语言和目标语言在同一个自注意力中。源语言部分不需要生成，可以直接用双向注意力（通过掩码控制），目标语言部分用因果掩码。这种灵活掩码机制比 Enc-Dec 的 Encoder 双向 + 交叉注意力更高效，因为交叉注意力需要额外的 KV 缓存和计算。

    - 更适合多任务统一：在同一个序列中，Decoder-only 可以自然混合指令、示例、输入和输出。这催生了 In-Context Learning 和 Chain-of-Thought 等能力。Enc-Dec 很难自然融入这些范式。

    - 社区和生态的收敛：GPT 系列的成功证明了 Decoder-only 的大规模可扩展性，大量资源和优化工具（如 FlashAttention、vLLM）围绕这一架构展开，形成了强大的生态飞轮。

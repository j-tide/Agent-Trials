content:
  prompt: 为什么现在主流的 LLM 大多采用 Decoder-only 架构？Encoder-Decoder 架构有哪些劣势？
answer:
  mode: rubric
  reference_answer: |-
    Decoder-only 架构的优势（为何成为主流）：

    - 架构统一简单：只有一种 Transformer 块，所有信息（条件、上下文、生成内容）都通过统一的自注意力处理。无需分别设计 Encoder 和 Decoder，代码实现、优化和扩展都更简单。

    - 预训练目标与生成一致：下一个 token 预测的预训练任务与自回归生成天然一致，训练和推理的模式差异小（仅有曝光偏差）。Encoder-Decoder 需要在预训练时设计类似 Seq2Seq 的任务，训练效率和数据利用率相对较低。

    - 灵活的零样本/少样本能力：通过文本拼接可将任何任务转化为语言模型格式。例如翻译、问答、摘要只需在输入中提供指令和上下文，无需改变模型结构。这种“一切皆生成”的范式使得同一个模型可以处理极多样化的任务。

    - 易于扩展到极大规模：Decoder-only 的因果注意力在训练时可以利用 FlashAttention 等优化，且序列级别的自回归训练适合用教师强制做高效批量训练。Encoder-Decoder 的双向/交叉注意力增加了额外的计算复杂度和内存开销。

    - 更长的有效上下文：Decoder-only 的 KV 缓存机制在推理时较为直接，且容易结合 PagedAttention 等优化。Encoder-Decoder 还需要缓存 Encoder 的表示，且交叉注意力的 KV 缓存管理更复杂。

    Encoder-Decoder 的劣势：

    - 结构复杂：需要两组不同的 Transformer 块，参数量和训练开销更大。

    - 任务适配不灵活：新增任务通常需要设计特定的输入格式或微调策略，不像 Decoder-only 可通过 Prompt 统一处理。

    - 推理效率较低：生成时 Encoder 需要先处理整个输入，Decoder 再逐步生成，无法像 Decoder-only 那样可以在生成的同时对输入做增量处理。

    - 扩展性受限：在超大模型和超长文本场景下，Encoder 的双向注意力复杂度为 O(n2)，且与 Decoder 的交叉注意力也是 O(n2)，相比 Decoder-only 的因果注意力更难以用稀疏或线性注意力优化。

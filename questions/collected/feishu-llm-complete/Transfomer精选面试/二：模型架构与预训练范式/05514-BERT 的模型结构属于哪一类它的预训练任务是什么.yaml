content:
  prompt: BERT 的模型结构属于哪一类？它的预训练任务是什么？
answer:
  mode: rubric
  reference_answer: |-
    BERT（Bidirectional Encoder Representations from Transformers）的模型结构属于Encoder-only 架构。它只使用了原始 Transformer 模型中的编码器部分，没有解码器。具体来说，BERT-base 包含 12 层 Transformer 编码器，BERT-large 包含 24 层。每一层内部包含多头自注意力和前馈网络，并辅以残差连接和层归一化。这种结构使得 BERT 能够对输入序列中的每个 token 生成一个融合了全局上下文信息的表示向量。

    BERT 的预训练包含两个任务：

    任务一：掩码语言模型（Masked Language Model, MLM）
    在输入序列中随机选中 15% 的 token，对它们进行处理：其中 80% 被替换为特殊的 [MASK] 标记，10% 替换为随机词，10% 保持不变。模型需要根据上下文预测这些被选中位置的原始 token。这个任务迫使模型学习双向的上下文表示——要预测一个被掩码的词，必须同时理解它的左侧和右侧信息。与传统的单向语言模型不同，MLM 使得 BERT 能够捕捉到更深层的语义和句法依赖，这也是它在下游理解任务中表现优异的核心原因。

    任务二：下一句预测（Next Sentence Prediction, NSP）
    从语料中随机选取两个句子 A 和 B，50% 的情况下 B 是 A 的真实下一句，50% 的情况下 B 是随机抽取的其他句子。模型需要在 [CLS] token 的最终表示上判断 A 和 B 是否连贯。这个任务旨在让模型学习句子级别的语义关系和篇章连贯性。不过后来的研究（如 RoBERTa）发现 NSP 对下游任务的提升有限，甚至可能不如单纯使用 MLM 并增加数据量，因此后续的 Encoder 模型大多放弃了 NSP，仅保留 MLM 或改进它。

    BERT 这种 Encoder-only + MLM 的组合，使得它天然适合各种自然语言理解任务，如文本分类、序列标注、句子对关系判断、抽取式问答等。通过在预训练好的 BERT 上添加简单的任务特定头（如线性分类器），并在下游任务数据上微调，即可取得当时最先进的性能。


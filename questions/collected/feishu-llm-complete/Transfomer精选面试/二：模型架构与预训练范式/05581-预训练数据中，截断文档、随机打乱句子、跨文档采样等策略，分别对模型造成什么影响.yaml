content:
  prompt: 预训练数据中，截断文档、随机打乱句子、跨文档采样等策略，分别对模型造成什么影响？
answer:
  mode: rubric
  reference_answer: |-
    - 截断文档（Truncating）
    通常因最大长度限制，长文档被截断，导致文档剩余部分的信息丢失，且模型无法学习到跨整个文档的超长依赖。这可能使模型在需要长程上下文的任务（如长文本分类、长文档问答）上表现不佳。优点是简单，不增加序列长度负担。改进方法包括滑动窗口处理、后处理拼接，或使用递归记忆机制。

    - 随机打乱句子（Sentence Shuffling）
    若在预训练时随机打乱句子顺序（或部分打乱），会破坏文档的连贯性和篇章结构，使得模型难以学到句子间的逻辑关系（如因果、转折、时间顺序）。这会对自然语言推理、摘要等任务产生负面影响。但适当的句子打乱（如 ALBERT 的 SOP）可以作为训练目标，教会模型识别句子顺序，提升句子级推理能力。

    - 跨文档采样（Cross-document Sampling / Packing）
    将多个短文档拼接在一起，中间用特殊分隔符隔开，以填充序列长度。这能大幅提升计算效率（减少 padding 浪费），并让模型学到“文档边界”的概念（通过分隔符和注意力掩码）。但如果分隔符不统一或训练时没有使用正确的自注意力掩码阻止不同文档之间的注意力，则可能引入跨文档噪声，降低单文档理解性能。现代实践通常使用特殊 token 分隔并配合注意力掩码实现高效且无损的跨文档采样。

    总的来说，数据构造策略需要在效率、上下文长度和语义完整性之间权衡。RoBERTa 移除 NSP 后，采用跨文档采样并允许文档跨越样本边界，提升了效率且并未损害性能；但在很多情况下，保留文档内完整的句子顺序对下游生成和理解任务仍至关重要。

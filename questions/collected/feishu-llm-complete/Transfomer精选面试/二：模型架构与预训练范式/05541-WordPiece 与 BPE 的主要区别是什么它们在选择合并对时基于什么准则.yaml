content:
  prompt: WordPiece 与 BPE 的主要区别是什么？它们在选择合并对时基于什么准则？
answer:
  mode: rubric
  reference_answer: |-
    两者都是子词分词算法，核心区别在于选择合并对的准则。

    - BPE（Byte Pair Encoding）：基于频次。每次合并语料中出现次数最多的相邻符号对。它单纯根据统计频率做出决定，频率越高的对越先合并。

    - WordPiece：基于概率增益（或语言模型似然提升）。WordPiece 并不简单地选择出现频率最高的对，而是选择那个能最大程度增加训练数据似然概率的符号对。具体来说，它计算合并前后语言模型（通常假设一元模型）在训练数据上的对数似然变化，选择使似然增加最多的对。数学上，这等价于选择 (count(pair) / (count(first) * count(second))) 最大的对——即这对符号同时出现的实际概率与它们独立出现概率的比值最大。这个度量类似于点互信息，能够更好地判断两个符号是否真正构成有意义的子词单元，而非仅仅因为出现次数多。

    其他区别：

    - BPE 按顺序记录合并规则，编码时直接应用这些规则；WordPiece 的编码通常采用自左向右的最长匹配策略，但合并准则决定了词汇表的组成。

    - WordPiece 通常保留了对未登录词的处理方式：将词拆分为更小子词甚至字符，用特殊前缀（如 ##）标记非词首的子词片段。BPE 则使用词尾标记或直接的字符级合并。

    - 在训练时，BPE 需要维护整个语料的符号对计数，可离线进行；WordPiece 的似然计算稍复杂，但仍可高效实现。

    总结：BPE 选“最常见的组合”，WordPiece 选“最有意义的组合”（更符合语言模型的概率原则）。

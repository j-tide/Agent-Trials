content:
  prompt: 为什么 Decoder-only 架构更容易做多任务统一和指令微调？
answer:
  mode: rubric
  reference_answer: |-
    Decoder-only 架构（如 GPT）在多任务统一和指令微调方面具有天然优势，主要有以下几方面原因：

    - 统一的输入输出格式

    Decoder-only 模型只需要一种序列格式：输入文本（可以包含指令、上下文、示例）直接拼接输出文本。任何任务都可以通过构造合适的文本前缀来表述，模型只需要接着前缀续写即可。例如：

    - 翻译："翻译成英文：你好 -> Hello"

    - 分类："评论：这部电影很烂。 情感：消极"

    - 摘要："请总结： [文章] \n摘要： [摘要]"
    这种一致性使得同一个模型可以无缝处理不同任务，无需为每个任务设计不同的输入接口或添加任务特定层。

    - 自回归生成与训练目标一致

    Decoder-only 的预训练目标就是预测下一个 token。微调或指令微调时，只需将任务数据也转换成“给定前缀，续写后续”的形式，训练目标保持不变。模型不需要学习新的输出格式（如分类头），也不需要额外的损失函数。这种一致性降低了任务切换的代价，并且模型在预训练中积累的生成知识能直接迁移到下游任务。

    - 没有 Encoder 的限制

    在 Encoder-Decoder 架构中，Encoder 和 Decoder 各司其职，Encoder 负责理解输入，Decoder 负责生成输出。多任务统一需要模型能处理不同长度的源序列和目标序列，编码器和解码器的分离会增加序列管理的复杂度。而且，不同的任务可能需要不同的源-目标划分方式。Decoder-only 将所有信息都放在一个序列中，完全避开了这种显式划分，灵活性更强。

    - 上下文学习的涌现

    Decoder-only 模型通过在海量文本上预训练，自然地获得了上下文学习（In-Context Learning）能力。只需在输入前缀中提供几个示例（few-shot），模型就能在没有梯度更新的情况下执行新任务。这是 Decoder-only 架构特有的涌现能力，建立在自回归语言模型的强大序列模式学习之上。

    - 指令微调的高效性

    指令微调只需将自然语言指令作为前缀，模型继续生成回复。这种简洁的方式使得数据收集和模型训练变得非常经济。模型可以在大量多样化的指令数据上微调，学会遵循用户意图，展现出强大的零样本泛化能力。这种范式（如 GPT-3.5/4）已被证明是目前构建通用助手最有效的途径。

    综上所述，Decoder-only 的“一切皆序列续写”的统一范式，加上其强大的自回归预训练和零样本能力，使其成为多任务统一和指令微调的首选架构。


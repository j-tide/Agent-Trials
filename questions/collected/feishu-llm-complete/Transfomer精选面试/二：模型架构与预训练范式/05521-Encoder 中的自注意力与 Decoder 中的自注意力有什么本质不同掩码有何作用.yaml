content:
  prompt: Encoder 中的自注意力与 Decoder 中的自注意力有什么本质不同？掩码有何作用？
answer:
  mode: rubric
  reference_answer: |-
    本质不同：

    - Encoder 自注意力：是双向的。每个 token 可以看到序列中的所有 token（包括前后）。这允许模型在编码时充分利用全局上下文，对一个词的理解可以依赖于它左边和右边的全部信息。这种双向性对于理解任务（如文本分类、序列标注、语义相似度）至关重要，因为理解一个词的含义往往需要同时参考它的前后文。

    - Decoder 自注意力：是单向的（通常称为因果注意力或掩码自注意力）。每个 token 只能看到它前面的 token（包括自己），不能看到未来的 token。这是自回归生成的要求：在生成第 t 个词时，模型只能基于前 t-1 个已生成的词进行预测，而不能“偷看”未来。

    掩码的作用：

    掩码是一个上三角矩阵（通常填充为 -∞），加到注意力分数矩阵上。在 softmax 之前，将当前 token 对未来 token 的注意力分数设为负无穷，使得 softmax 后这些位置的权重为 0。这确保了：

    - 训练时，模型学到的预测模式符合自回归生成的因果约束，避免了信息泄露。尽管输入是完整的目标序列，掩码保证了每个位置的预测只依赖于历史上下文。

    - 推理时，模型可以逐 token 生成，每一步只基于已生成的部分，这是文本生成的基础。

content:
  prompt: GPT 系列为什么采用 Decoder-only？自回归语言模型的预训练目标是什么？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    其中 x<t表示前 t−1 个 token。模型通过因果自注意力（Causal Self-Attention）实现：每个 token 只能关注到它之前的 token，未来的信息被掩码掉。这种训练方式使得模型天然具备了逐 token 续写文本的能力，即生成能力。

    为什么 Decoder-only 是合理的？因为：

    - 生成是刚需：GPT 的最终目的是作为一个通用的文本生成引擎。自回归架构保证了每个时刻的预测只依赖已经生成的内容，与人类写作的过程一致。

    - 架构统一：不需要像 Encoder-Decoder 那样分别处理源序列和目标序列。任何任务（分类、翻译、问答）都可以被重构成一个“补全”任务——只需将输入文本拼接起来，让模型接着生成输出。这种统一性使得同一个模型可以处理五花八门的任务，极大降低了任务切换的成本。

    - 扩展性强：Decoder-only 的因果注意力在训练时可以利用教师强制，在推理时自然支持自回归生成。随着模型规模和数据量的增长，GPT 系列展示出了强大的涌现能力（如上下文学习），证明了这种简单架构的巨大潜力。

    因此，GPT 系列坚守 Decoder-only，是对“一切皆生成”理念的极致贯彻。


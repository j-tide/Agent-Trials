content:
  prompt: BART 的预训练目标是什么？它为什么适合生成式任务？
answer:
  mode: rubric
  reference_answer: |-
    BART（Bidirectional and Auto-Regressive Transformer）是一种去噪自编码器，采用标准的 Encoder-Decoder 架构。其预训练目标是：对原始文本施加各种噪声，然后训练模型重建出原始文本。具体来说，Encoder 接收被破坏后的文本，Decoder 自回归地生成原始的干净文本。这个重建过程让模型学会理解噪声文本并将其修正为流畅、合理的输出。

    BART 使用了多种噪声组合：

    - Token 掩码：随机掩码掉部分 token（类似 BERT 的 MLM）。

    - Token 删除：随机删除一些 token，模型必须学会恢复缺失的词。

    - 文本填充：随机选取一段连续文本（span），用一个 [MASK] 替代，模型需要生成被替换的整个片段（长度和内容）。

    - 句子重排：将文档中的句子顺序打乱，模型需要还原正确顺序。

    - 文档旋转：随机选择一个 token 作为文档的起点，将前面部分移到末尾，模型需要找到真正开头。

    BART 适合生成式任务的原因：

    - 自回归 Decoder：BART 的 Decoder 就是一个标准的自回归语言模型生成器，这使得它天然适合文本生成任务。预训练时 Decoder 已经学会了根据 Encoder 提供的上下文生成流畅文本。

    - Encoder 的双向理解：Encoder 是双向的，可以充分理解被破坏的文本，提取全局语义。这为 Decoder 的生成提供了高质量的上下文基础。

    - 文本填充预训练：这个特定噪声迫使模型学会生成连贯的多词片段，与摘要、问答等需要“根据上下文写出新文本”的任务高度一致。因此 BART 在文本摘要、生成式问答、对话生成等任务上表现尤为突出。

    - 灵活的条件生成：BART 的架构天然支持 Encoder 处理输入条件，Decoder 生成输出，非常适合翻译、摘要等 Seq2Seq 任务。

    概括来说，BART 可以看作“BERT 的双向理解 + GPT 的自回归生成”的结合体，通过去噪预训练将两者有机融合，在下游生成任务上具有天然优势。


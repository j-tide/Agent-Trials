content:
  prompt: Transformer 的深度对“局部模式”和“全局模式”的捕捉有什么不同影响？
answer:
  mode: rubric
  reference_answer: |-
    局部模式通常指邻近 token 之间的依赖关系，如短语结构、语法搭配、相邻词性约束等。全局模式指跨越长距离的依赖，如指代消解、段落主题一致性、全文逻辑结构等。

    深度的影响：

    - 浅层更擅长捕捉局部模式。注意力权重通常在浅层集中于对角线附近（每个 token 关注自己和左右几个 token），这是类似于卷积的局部特征提取。浅层的表示也更多保留词级和短语级的特征。

    - 随着层数加深，注意力范围逐渐扩大，全局模式开始涌现。深层通过多层自注意力的组合，每个 token 的感受野指数级扩大，能够关注到距离很远的语义相关 token。同时，深层 FFN 存储的“记忆”模式更多涉及高层语义和抽象概念。

    - 极深网络能捕捉极其复杂的全局依赖，但也可能出现“过度全局化”：所有 token 的表示趋于相似（表示坍缩），失去局部细节的辨别力。这解释了为什么很深的 Transformer 有时需要引入局部注意力窗口或额外的局部增强机制。

    实证：BERT 的可视化研究表明，浅层注意力有明确的局部模式（邻近关注），中间层开始出现句法结构（如关注同一短语的其他词），深层则关注语义相关但距离较远的词。因此，足够的深度是实现从局部到全局逐层抽象的关键。

content:
  prompt: 为什么现在很多模型（如 GPT-2）直接使用不带 [CLS] 和 [SEP] 的纯文本序列作为输入？
answer:
  mode: rubric
  reference_answer: |-
    原因：

    - 自回归语言模型不需要特殊标记：GPT 系列是 Decoder-only 架构，预训练任务是单向语言模型，输入就是自然连续的文本。模型只需根据前文预测下一个 token，不需要标记句子边界或区分两个句子。[CLS] 和 [SEP] 是 BERT 为 MLM 和 NSP 任务设计的，在 GPT 中毫无用处。

    - 简洁与统一：不插入特殊标记的纯文本序列使得训练数据完全保持原始形态，无需额外的预处理（如加入标记）。这简化了数据管道，也能更好地利用互联网上各种格式的原始文本。

    - 序列的完整性：没有分隔符，模型可以自由学习跨越任意长度的上下文依赖，不受人为句子边界限制。这对于生成长文本、代码等连贯内容很有益。

    - 多任务统一：当需要区分多个文本段时（如对话中的用户和助手），GPT 模型使用自然语言分隔符或特殊 token（如 <|user|>, <|assistant|>）来标记角色，而非固定的 [SEP]。这样更灵活，易于扩展到多种任务格式，且这些分隔符本身也是正常 token，被模型当作文本的一部分来理解和生成。

    - 避免预训练-微调不一致：BERT 中 [CLS], [SEP] 是预训练阶段使用的特殊符号，微调时如果任务不需要它们，就会产生不一致。GPT 无特殊标记，彻底避免了这种不一致。

    因此，现代生成式 LLM 普遍采用无特殊标记的纯文本流，依靠额外的控制 token（如用户、助手标记）来结构化对话，这些控制 token 被纳入通用词表，成为语言的一部分，而不是独立于内容的元符号。

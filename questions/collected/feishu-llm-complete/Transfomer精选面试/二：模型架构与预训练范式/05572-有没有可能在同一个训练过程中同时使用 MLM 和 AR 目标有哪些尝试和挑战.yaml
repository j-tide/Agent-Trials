content:
  prompt: 有没有可能在同一个训练过程中同时使用 MLM 和 AR 目标？有哪些尝试和挑战？
answer:
  mode: rubric
  reference_answer: |-
    可以，且已有成功尝试。将 MLM（掩码语言模型）和 AR（自回归语言模型）结合，目标是让一个模型同时具备双向理解能力和单向生成能力。

    代表性工作：

    - UniLM：通过灵活的注意力掩码，在预训练中交替使用双向（MLM）、单向（AR）和 Seq2Seq 掩码，实现联合训练。

    - GLM（General Language Model）：提出自回归空白填充（Autoregressive Blank Infilling），将 MLM 的掩码片段用自回归方式生成。训练时随机掩盖多个 span，模型在 span 内部自回归生成，非 span 部分保持双向上下文。这本质上是 MLM 与 AR 的有机融合。

    - CM3/ERNIE 3.0 等：在大规模预训练中混合多种目标。

    挑战：

    - 梯度冲突：MLM 和 AR 的优化方向可能不同。MLM 鼓励利用全局信息，AR 强调从左到右的预测模式。同时训练时，共享参数可能会在两个目标之间妥协，导致两者的效果都达不到最优。

    - 注意力掩码的管理：需要动态构建不同类型的掩码，增加计算图复杂度。

    - 数据格式不统一：MLM 需要对输入进行掩码，AR 需要因果序列。如何在一个 batch 内高效混合是个工程难题。

    - 收敛速度：两个目标的学习动态可能不同，需要精细调整损失权重或使用课程学习（先学 AR 再学 MLM，或反之）。

    尽管有挑战，实验表明，合理结合 MLM 和 AR 可以带来比单一目标更好的性能，尤其是在需要兼顾理解和生成的下游任务中。未来如果能在架构和训练策略上进一步突破，这种统一预训练范式可能会更常见。


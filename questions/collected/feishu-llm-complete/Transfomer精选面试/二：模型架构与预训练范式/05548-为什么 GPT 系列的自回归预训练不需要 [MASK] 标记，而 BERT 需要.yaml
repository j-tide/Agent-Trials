content:
  prompt: 为什么 GPT 系列的自回归预训练不需要 [MASK] 标记，而 BERT 需要？
answer:
  mode: rubric
  reference_answer: |-
    根本原因在于两者的预训练任务和架构方向性不同。

    BERT 采用 MLM，这是一个“完形填空”任务：需要从上下文中预测被挖掉的词。为了让模型知道“哪里需要预测”，必须引入一个特殊的 [MASK] 标记来占位。BERT 的 Encoder 在处理整个序列时是双向的，如果不放一个特殊标记，模型就不知道哪个位置是“空缺”的，也就无法输出对应的预测。因此 [MASK] 是 MLM 任务不可或缺的指令信号。

    GPT 采用 自回归语言模型，本质是“根据前文预测下一个词”。这个任务是天然对齐的：每个位置的目标就是序列中的下一个 token。模型不需要知道“哪里被挖掉了”，因为它没有空缺——所有位置都是已知的，只是预测时不能看后面的词。它通过因果掩码实现只看左边，所以对于每个输入 token，模型直接输出一个概率分布，目标是紧接着的那个真实 token。整个过程不需要任何特殊标记来指示预测位置。

    更深层的差异：

    - BERT 的 MLM 是破坏-重建任务：需要先破坏输入，再恢复。[MASK] 是破坏的标记。

    - GPT 的语言建模是自监督序列建模：输入即学习目标，不需要破坏。

    因此，[MASK] 是 MLM 任务的人工产物，而自回归语言模型天然没有这个需求。这也是为什么 GPT 的训练和推理更一致，而 BERT 存在预训练-微调不一致的问题。


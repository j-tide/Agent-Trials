content:
  prompt: 比较 BERT 和 GPT 在处理上下文时的方向性差异，这如何影响它们的应用场景？
answer:
  mode: rubric
  reference_answer: |-
    BERT 和 GPT 在上下文方向性上存在根本差异，这直接决定了它们的能力边界和适用场景。

    BERT（双向上下文）：

    - BERT 使用 双向自注意力，每个 token 可以同时看到其左侧和右侧的所有其他 token（除了被掩码的特殊位置）。这意味着在编码某个词时，模型利用了该词前后的完整上下文信息。

    - 这种双向性使得 BERT 对文本的理解非常深刻。例如，要判断一个代词指代的是前文还是后文的实体，双向信息至关重要。在词义消歧、句法分析、关系抽取等需要全局上下文的任务中，双向表示具有天然优势。

    - 应用场景：主要面向自然语言理解（NLU）任务——文本分类、情感分析、命名实体识别、语义相似度、自然语言推理等。这些任务通常不需要模型生成新文本，而是需要从已有文本中提取、归纳或分类信息。

    GPT（单向/因果上下文）：

    - GPT 使用因果自注意力，每个 token 只能关注它之前的 token，未来的信息被掩码不可见。这模拟了人类语言产出的过程：从左到右依次生成。

    - 这种单向性虽然牺牲了对“后文”信息的利用，但换来了连贯的文本生成能力。模型被训练为根据前文预测下一个词，因此它学会了续写、补全和创造新内容。

    - 应用场景：主要面向自然语言生成（NLG）任务——文本续写、对话系统、文章创作、机器翻译、代码生成等。在这些场景中，模型需要自主产生新的文字序列，因果约束是必需的。

    影响总结：BERT 因为能够看到全局信息，在需要“读懂”文本的任务上是王者；GPT 因为符合自回归生成范式，在需要“写出”文本的任务上是霸主。两者不可互换：用 BERT 做生成需要额外改造且效果不如原生生成模型；用 GPT 做理解任务（如分类）虽然在技术上可行（通过补全方式），但双向信息的缺失使其在一些需要精细理解的任务上（如序列标注）不如 BERT 精准。现代趋势是将两者的优势结合，如 Encoder-Decoder 架构，或是用 Decoder-only 模型通过大规模预训练来隐式地弥补单向的不足。


content:
  prompt: Encoder-Decoder 的优势场景是什么？请至少举三个典型任务。
answer:
  mode: rubric
  reference_answer: |-
    尽管 Decoder-only 大行其道，Encoder-Decoder 在以下场景仍有独特优势：

    - 机器翻译（特别是低资源语言对）：

    - Encoder 可以充分双向编码源语言，捕获完整的上下文信息。Decoder 通过交叉注意力显式地从源语言表示中提取信息，这种结构化的对齐机制在翻译时需要精确的源-目标映射，比 Decoder-only 的拼接方式更直接。在训练数据有限的情况下，Encoder-Decoder 往往能更高效地学习到翻译模式。

    - 长文本摘要：

    - 输入是一篇长文档，输出是简短摘要。Encoder 可以双向处理整个长文档，提取关键信息并压缩为密集表示。Decoder 通过交叉注意力有选择地关注文档的不同部分来生成摘要。双向编码能更好地理解文档的全局结构和要点，避免因果解码器可能发生的“长文档前部信息在生成时被淡忘”的问题。

    - 语音识别（ASR）或多模态理解：

    - 语音信号或图像特征经过编码器提取为高级表示，解码器（可能是自回归的）基于这些特征生成文本。Encoder 负责从连续信号中抽象出离散的语义信息，Decoder 负责将这些语义转化为流畅文本。这种感知-生成分离的结构天然适合这类任务。

    其他场景：代码生成（源语言为自然语言描述）、图像描述（图到文）、知识图谱到文本等，这些任务都具有“从结构化或非文本表示到文本”的转换特征，Encoder-Decoder 的分离设计更贴合。

content:
  prompt: 如果让你设计一个同时具备理解和生成能力的混合架构，你会怎么安排层的类型和比例？
answer:
  mode: rubric
  reference_answer: |-
    设计目标：结合双向理解的深度和单向生成的自然性。一种成熟的思路是非对称的 Encoder-Decoder 或 PrefixLM 变体。

    方案一：深层双向编码器 + 浅层自回归解码器

    - 前端：约 60%-70% 的层采用双向自注意力，负责对输入进行深度的全局理解，提取丰富的上下文表示。这部分类似 BERT 的 Encoder，可处理输入文本、图像特征等多模态信息。

    - 后端：约 30%-40% 的层采用因果掩码自注意力，负责基于前面的双向表示进行自回归生成。生成部分不设交叉注意力，而是直接从双向编码器的最后一层输出作为初始隐藏状态，或以残差方式注入生成层。

    - 理由：理解需要深度双向建模，生成则需要因果约束。将更多层分配给理解，可以建立强大的语义基础，生成部分在高质量表示之上仅需少量层即可完成流畅输出。

    方案二：混合层（PrefixLM 的层内切换）

    - 所有层共享，不区分编码器/解码器。在每一层内，根据 token 位置动态切换注意力掩码：前缀（条件/输入）部分使用双向注意力，后缀（待生成）部分使用因果注意力。

    - 比例控制：输入和输出的序列长度自然形成分工，无需固定层的比例。模型可以灵活处理任意长度的条件。

    - 理由：这种设计在 PaLM、GLM 中已被验证，兼顾理解和生成，且架构统一，训练高效。

    方案三：MoE 混合

    - 在每层引入两组专家 FFN：一组是“理解专家”，在双向特征上表现更好；另一组是“生成专家”，在因果特征上优化。路由机制根据 token 是前缀还是后缀来激活不同的专家。

    - 这可以增加模型容量而不显著增加计算量。

    权衡：混合架构的复杂度高于纯 Decoder-only，但如果应用场景明显区分理解与生成（如文档理解+问答生成），且对理解深度有刚性需求，那么非对称方案更具优势。纯 Decoder-only 因其极致的统一性和扩展性仍是当前主流。

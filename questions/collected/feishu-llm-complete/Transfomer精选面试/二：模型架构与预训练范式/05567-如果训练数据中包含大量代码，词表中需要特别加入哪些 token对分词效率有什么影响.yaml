content:
  prompt: 如果训练数据中包含大量代码，词表中需要特别加入哪些 token？对分词效率有什么影响？
answer:
  mode: rubric
  reference_answer: |-
    代码数据包含大量在自然文本中罕见的结构，需要在词表中做特殊处理：

    需要加入的特殊Token：

    - 缩进与空白的表示：代码中的缩进（空格或制表符）具有语法意义。分词器需要保留这些空白，最好能将连续的缩进（如4个空格）作为一个独立token，或将缩进级别编码为特殊token。

    - 常见关键字和运算符：如def, class, import, return等关键字，以及==, !=, >=, +=等复合运算符，应该作为完整token加入词表，避免被拆碎。

    - 括号与分隔符：(, ), {, }, [, ], :, ;, ,等。它们出现频率极高，且承载着语法结构信息。将它们保留为独立token有助于模型理解代码的语法树。

    - 字面量标记：数字、字符串通常被抽象化处理。有时会添加特殊token如<NUM>, <STR>来统一表示数字和字符串字面量，避免每个不同的数字都占用词表位置。但这会丢失具体值的信息，需要权衡。

    - 常见库和API名：如果数据集领域集中（如Python数据科学），可以将numpy, pandas, plt等高频库名加入词表。

    对分词效率的影响：

    - 序列长度显著缩短：代码比自然文本更具结构性和重复性。上述特殊token的加入避免了将关键字、运算符拆分为字符或子词片段，使得序列长度大幅减少。这直接降低了自注意力层O(L²)的计算开销。

    - 语义表示更紧凑：一个完整的运算符如==作为一个token，比拆成两个=更利于模型学习其语义。

    - 可能出现新的未登录词：虽然常见关键字被覆盖，但用户自定义的变量名、函数名仍然可能被拆分为子词。对于这类标识符，子词切分仍然有效。词表需要在覆盖面（大）和碎片化（小）之间权衡。

    总体而言，为代码优化词表可以显著提升模型在代码理解和生成任务上的效率和质量。

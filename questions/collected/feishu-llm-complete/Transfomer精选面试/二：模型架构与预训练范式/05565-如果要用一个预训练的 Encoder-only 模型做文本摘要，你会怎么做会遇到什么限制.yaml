content:
  prompt: 如果要用一个预训练的 Encoder-only 模型做文本摘要，你会怎么做？会遇到什么限制？
answer:
  mode: rubric
  reference_answer: |-
    怎么做：

    由于 Encoder-only 模型无法直接生成文本，需要将其改造为生成式架构。一种常见做法是在 Encoder 上添加一个随机初始化的 Decoder，形成一个 Encoder-Decoder 框架。预训练的 BERT 作为 Encoder，提供强大的文本理解能力；Decoder 使用标准 Transformer 解码器，通过交叉注意力利用 Encoder 的表示进行自回归生成。训练时，可以冻结 BERT 部分（或使用小学习率微调），重点训练 Decoder 和交叉注意力层。这实际上就是 BERT2BERT 或 BERT-gen 的做法。

    另一种方案是将摘要任务转化为抽取式摘要：在 Encoder 的输出上训练一个分类头，为每个句子预测是否应该被选入摘要。这不需要生成，完全在 Encoder-only 框架内完成，但只能做抽取式，不能做生成式摘要。

    限制：

    - 缺乏生成能力：Encoder-only 模型预训练时没有学过文本生成，添加的 Decoder 需要从头训练，需要大量摘要标注数据，且训练成本高。

    - Encoder 与 Decoder 不匹配：BERT 的表示是针对 MLM 和 NSP 优化的，与生成任务所需的表示可能不完全适配。直接使用可能需要较多的微调。

    - 序列长度受限：BERT 通常使用绝对位置编码，最大长度为 512。对于长文档摘要，无法直接输入完整文档，需要截断或分段处理，可能丢失关键信息。

    - 不是主流方案：相比直接用预训练的 Seq2Seq 模型（如 BART、T5）或 Decoder-only 大模型，使用 Encoder-only 做摘要的性价比和效果上限都较低。

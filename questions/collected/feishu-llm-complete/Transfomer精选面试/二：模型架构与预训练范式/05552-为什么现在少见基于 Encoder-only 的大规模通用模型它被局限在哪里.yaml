content:
  prompt: 为什么现在少见基于 Encoder-only 的大规模通用模型？它被局限在哪里？
answer:
  mode: rubric
  reference_answer: |-
    少见原因：Encoder-only 架构在大规模通用模型（作为基座模型）中的局限性日益明显，主要体现在：

    - 缺乏生成能力：这是最根本的限制。通用模型的核心竞争力在于不仅能理解，还能创造内容。Encoder-only 天生不能直接生成文本，必须外接解码器或改造，失去了统一性和简洁性。在对话、写作、编程等主流生成式 AI 场景中，Encoder-only 无法原生胜任。

    - 任务适配不灵活：Encoder-only 模型需要在预训练后，为每个下游任务添加任务特定的输出层并进行微调。这与当前“一个模型做所有事”的范式背道而驰。而 Decoder-only 可以通过 Prompt 零样本或少量样本处理新任务，无需额外训练。

    - 扩展性不足：将 Encoder-only 扩展到极大规模时，双向自注意力的计算复杂度为 O(n2)O(n2)，训练长文本时开销巨大。虽然 Decoder-only 也是 O(n2)O(n2)，但其因果掩码使得可以利用 KV 缓存和优化的注意力算法（如 FlashAttention）更高效地推理和训练。此外，Encoder 通常用于输出单个序列表示，不能自然支持长序列生成中的缓存机制。

    - 预训练目标单一：主流的 Encoder 预训练任务（MLM）主要关注 token 级或句子级的理解，难以学习到开放式文本生成的长期依赖和连贯性。尽管 MLM 学到了很好的上下文表示，但缺乏序列生成中的因果推理能力。

    - 数据利用率：自回归模型可以从海量未标注文本中高效学习，因为每个 token 都是预测目标。MLM 只对约 15% 的 token 进行预测，训练信号的密度较低。这使得 Decoder-only 在同等数据量下能学到更多的语言知识。

    Encoder-only 的出路：

    在一些细分领域，Encoder-only 仍是最优选择（如语义检索、文本分类、句子嵌入）。但要成为像 GPT-4 一样的通用基座，Encoder-only 必须结合 Decoder 或转变为 Decoder-only。因此，今天的大型通用模型清一色是 Decoder-only，Encoder-only 退居为专用模型。


content:
  prompt: 为什么 Encoder-only 模型适合理解任务，而 Decoder-only 适合生成任务？
answer:
  mode: rubric
  reference_answer: |-
    Encoder-only 模型（如 BERT）适合理解任务：

    - 双向上下文：Encoder 的自注意力可以看到整个序列的所有位置，能同时捕捉一个词的左右上下文，这对于理解句子语义、词义消歧、关系分类等任务至关重要。

    - 掩码语言模型预训练：Encoder-only 模型通常在 MLM 任务上预训练，学习的是“完形填空”式的理解能力，对文本的深层语义把握更强。微调时通常在 Encoder 输出之上加分类头，直接基于全局上下文做判断。

    - 无自回归生成：Encoder 本身不是为逐个生成 token 设计的，它一次性输出整个序列的表示，不能直接用于生成任务。

    Decoder-only 模型（如 GPT）适合生成任务：

    - 单向因果注意力：Decoder 的注意力只关注前文，天然符合自回归生成模式——从左到右逐 token 预测下一个词。

    - 语言模型预训练：Decoder-only 模型在下一个 token 预测任务上预训练，学会的是根据前文续写文本，这正是生成任务所需的核心能力。

    - 灵活的条件注入：通过将条件信息（如翻译的源语言、问答的上下文）与待生成内容拼接为统一序列，Decoder-only 可以灵活处理各种条件生成任务，无需额外的交叉注意力结构。

    - 训练和推理的一致性：训练时使用教师强制（Teacher Forcing），推理时自回归生成，两者在序列生成模式上一致（尽管有曝光偏差），更容易优化生成质量。

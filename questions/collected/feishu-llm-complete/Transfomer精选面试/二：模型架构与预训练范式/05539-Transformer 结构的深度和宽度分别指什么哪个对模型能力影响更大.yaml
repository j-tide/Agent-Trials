content:
  prompt: Transformer 结构的“深度”和“宽度”分别指什么？哪个对模型能力影响更大？
answer:
  mode: rubric
  reference_answer: |-
    深度：指 Transformer 的层数（即 Encoder 或 Decoder 的堆叠数量）。深度决定了模型能够进行多少次非线性变换和注意力聚合。更深的网络可以建模更复杂的层次化特征：浅层关注局部模式，中层组合为短语级表示，深层捕捉全局语义和复杂推理。

    宽度：指每层内部的维度大小，主要是 d_model（模型隐藏维度）和 d_ff（FFN 中间层维度）。宽度决定了每层能表示多少信息容量。更宽的网络每个位置可以存储更丰富的特征。

    哪个影响更大：

    - 在模型总参数量固定的情况下，深度往往比宽度更重要。研究表明，增加层数通常比增加宽度带来更显著的性能提升。深层网络可以逐步抽象化表示，每一层的增量可以叠加为强大的推理能力。而宽度增加仅提升了单层的容量，边际收益递减更快。

    - 然而，过深的网络训练困难（即使有残差连接和 Pre-Norm），会遭遇梯度消失、表示崩溃等问题。因此大模型通常会同时增加深度和宽度，但深度优先。例如 GPT-3 的 175B 模型有 96 层，而不是减少层数但把宽度做得很极端。

    - 近年也有研究关注深度与宽度的最优配比。对 Transformer 而言，在一定范围内，加深比加宽收益更大，但需要配合更优的归一化和初始化策略。

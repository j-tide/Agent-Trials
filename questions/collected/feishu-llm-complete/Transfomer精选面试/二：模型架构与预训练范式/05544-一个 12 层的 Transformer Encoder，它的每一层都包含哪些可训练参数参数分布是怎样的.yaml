content:
  prompt: 一个 12 层的 Transformer Encoder，它的每一层都包含哪些可训练参数？参数分布是怎样的？
answer:
  mode: rubric
  reference_answer: |-
    [图片内容未导入]

    - 两个 LayerNorm 层：

    - 每个 LayerNorm 包含缩放参数 γγ 和偏移参数 ββ，各 768 维

    - 两个 LayerNorm 总参数量：4×768=3,0724×768=3,072

    每层总参数量：约 2.36M + 4.72M + 约 0.003M ≈ 7.08M

    参数分布规律：

    - FFN 占主导：每层约 67% 的参数集中在 FFN 部分（4.72M / 7.08M）。

    - 注意力次之：注意力部分约占 33%。

    - 归一化层极轻量：LayerNorm 参数几乎可以忽略不计。

    12 层的 Encoder 总参数量（不计嵌入层）约为 12×7.08M≈85M12×7.08M≈85M。加上嵌入层（30k 词汇表 × 768 = 23M）、位置编码等，BERT-base 总参数量约为 110M。

    实现自适应 RAG 的架构：

    - 问题分析器：接受用户查询，输出问题的类别和特征（如是否包含数字、是否时效敏感、是否属于定义型等）。

    - 策略选择器：根据分析结果，动态调整检索管道的配置。例如：

    - 执行检索：使用选定的策略和参数进行检索。

    - 生成回答：基于检索结果生成最终答案。

    用一个比喻：自适应 RAG 就像一家餐厅的厨师，看到客人点餐后，先判断客人想要的是中餐、西餐还是甜点，然后去不同的备料区（检索器）取食材，再用不同的烹饪方法（检索策略）制作。而不是无论点什么菜都先跑进同一个大仓库翻一通。

    LangChain 中的实现思路：虽然 LangChain 没有叫“AdaptiveRAG”的单一类，但我们可以借助 RouterChain、MultiPromptChain 或自定义 Agent 来实现。例如，创建多个针对不同问题类型的专用链（一个用于事实型，一个用于概念型等），然后用 RouterChain 根据 LLM 对问题的判断自动路由到相应的链。


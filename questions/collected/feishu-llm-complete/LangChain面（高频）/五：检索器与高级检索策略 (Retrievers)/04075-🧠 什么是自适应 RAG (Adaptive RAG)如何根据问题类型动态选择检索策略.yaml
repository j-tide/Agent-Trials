content:
  prompt: "\U0001F9E0 什么是自适应 RAG (Adaptive RAG)？如何根据问题类型动态选择检索策略？"
answer:
  mode: rubric
  reference_answer: |-
    自适应 RAG（Adaptive RAG）是一种可以根据输入问题的特性和上下文，动态地选择或组合不同检索策略的智能检索增强生成框架。它打破了“一刀切”的检索模式，不再对所有问题使用同一种检索流水线（如总是向量检索→重排序→生成），而是让系统像一个有经验的图书管理员一样，能快速判断用户的意图，然后走最合适的“通道”。

    为什么需要自适应？

    不同类型的问题，最优的检索策略截然不同：

    - 事实型问题（如“2023年诺贝尔物理学奖得主是谁？”）：需要精确匹配，关键词检索（BM25）或结构化查询更高效。

    - 概念型问题（如“什么是量子纠缠？”）：更适合语义检索，向量相似度能很好地捕捉概念。

    - 多跳推理问题（如“《哈利波特》中哈利的教父的堂姐的女儿是谁？”）：需要多步检索，逐步挖掘。

    - 时效性问题（如“最新的苹果发布会有什么产品？”）：必须在检索时融入时间过滤。

    - 模糊或简短问题（如“那个东西怎么修？”）：可能需要查询扩展或 HyDE 来增强语义。
    如果对所有问题都用同一种策略，必然在某些场景下表现不佳。自适应 RAG 的目标就是 “根据问题，选择策略”。

    如何根据问题类型动态选择？

    这通常需要一个路由模块（Router），它负责分析问题，决定走哪条检索路径。路由模块可以是一个经过训练的轻量级分类器，也可以直接由 LLM 完成（通过特定的 Prompt）。


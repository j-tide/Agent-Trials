content:
  prompt: "\U0001F5DC️ 解释 ContextualCompressionRetriever 的工作流程：它由哪两部分组成？"
answer:
  mode: rubric
  reference_answer: |-
    ContextualCompressionRetriever 是一种先检索后压缩的检索器增强，旨在从检索到的文档中提取出与查询真正相关的片段，丢弃冗余信息，从而让 LLM 能更聚焦、更高效地生成答案。

    组成部分：

    - Base Retriever（基础检索器）：负责根据查询返回一个初步的文档列表。可以是任何实现了 BaseRetriever 的对象，如 VectorStoreRetriever。

    - Compressor（压缩器）：负责对基础检索器返回的文档进行“压缩”。压缩器可以是任何实现了 BaseDocumentCompressor 的对象。

    工作流程：

    - 用户查询传入。

    - 基础检索器根据查询获取一组相关文档（可能包含很多无关段落）。

    - 压缩器逐文档处理，对于每个文档，根据查询提取出相关的句子或片段，或者对整个文档进行过滤（如果完全无关则丢弃）。

    - 压缩后的文档（可能变短，也可能数量减少）被返回给用户。

    形象比喻：基础检索器像图书馆的管理员，帮你搬来一堆可能相关的书；压缩器则像研究助理，帮你从这些书中只复印下真正对你有用的段落。

    这种设计尤其适合长文档检索，可以避免把整个长文档塞进 LLM 上下文，从而节省 token 并提高答案准确性。


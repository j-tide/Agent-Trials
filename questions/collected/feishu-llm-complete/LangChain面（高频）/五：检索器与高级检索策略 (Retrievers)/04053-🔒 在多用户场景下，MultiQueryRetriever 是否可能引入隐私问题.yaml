content:
  prompt: "\U0001F512 在多用户场景下，MultiQueryRetriever 是否可能引入隐私问题？"
answer:
  mode: rubric
  reference_answer: |-
    是的，可能引入间接隐私风险。 核心问题不在于 MultiQueryRetriever 本身，而在于它利用 LLM 来改写查询。这个改写过程可能会泄露用户原始查询中的敏感信息，或者生成包含敏感推断的查询。

    具体风险包括：

    - 原始查询泄露给 LLM 供应商：如果使用外部 LLM（如 OpenAI）来生成多个查询，那么用户的原始查询就会被发送到云端 API。如果查询中包含个人身份信息（PII）、医疗健康信息、企业机密等，就违反了数据隐私合规（如 GDPR、HIPAA）。

    - 查询扩展可能暴露隐含信息：LLM 生成的查询可能包含对用户偏好的推断。例如，用户查询“便宜的离婚律师”，LLM 可能生成“低收入法律援助”，这间接推断出用户的经济状况。

    - 查询日志留存：多个改写后的查询可能比原始查询更具体，这些记录如果被保存或审计，可能增加用户画像的风险。

    如何缓解：

    - 使用本地 LLM：采用本地部署的开源模型（如 Llama 3）进行查询改写，数据不出域。

    - 脱敏处理：在将查询发送给 LLM 前，用正则或 NER 模型脱敏，替换掉人名、电话号码等敏感实体，生成查询后再映射回去（但这可能影响查询质量）。

    - 最小权限与审计：确保 LLM 供应商的 API 配置为不记录查询内容（例如 OpenAI API 的商业客户可申请零数据保留）。

    - 提示词约束：在 Prompt 中明确要求 LLM 只生成基于公开知识库的通用查询，避免生成包含任何个人信息的查询。

    总之，在涉及多用户和敏感数据时，要么使用本地模型，要么在进入 MultiQueryRetriever 前做好数据清洗。


content:
  prompt: "\U0001F3AF HyDE 在哪些场景下效果尤其明显？在哪些场景下可能无用甚至误导？"
answer:
  mode: rubric
  reference_answer: |-
    效果显著的场景

    - 查询短、模糊、口语化：例如，电商搜索“跑鞋轻便”，HyDE 能生成“这款跑鞋采用超轻EVA中底，提供卓越的缓震和回弹，非常适合长距离训练”，从而匹配商品详情页的描述。

    - 跨领域检索：用户使用非专业词汇提问，但文档用专业术语。如“怎么让电脑更快”，HyDE 生成“系统性能优化包括清理磁盘、增加内存等”，与文档“提升计算机运行速度的方法”匹配。

    - 问答式检索：用户以问句形式提问，而知识库是陈述句。HyDE 将问句转为陈述，提高召回。

    - 多语言场景：即使用不同语言，HyDE 生成的假答案可以用目标语言生成，从而弥合语言差异。

    可能无用或误导的场景

    - 精确匹配要求高：如搜索特定法律条文编号、产品型号、代码函数名。HyDE 生成的“假答案”可能用词不精确，导致检索到无关文档。例如，查询“RFC 6749”，HyDE 可能生成描述 OAuth 的文字，但无法准确匹配“RFC 6749”这个字符串。

    - 查询本身已经足够详细和准确：用户输入了非常完整的长文本，再生成假答案既浪费时间又可能偏离原意。

    - LLM 生成答案过于普遍或错误：如果 LLM 倾向于生成泛泛之谈，假答案可能缺乏领域特异性，反而降低检索精度。例如，在医学领域，LLM 可能生成不准确的医学描述，导致检索到错误文献。

    - 对延迟极度敏感的应用：每次检索都需要调用一次 LLM，增加了 1-3 秒的延迟，不适合需要毫秒级响应的实时服务。

    - 成本考虑：大量调用 LLM 产生 token 消耗，对于高频检索系统，成本可能难以承受。

    最佳实践：结合查询类型分类器，对模糊、简短的查询启用 HyDE，对精确查询直接检索，以达到效果与成本的平衡。

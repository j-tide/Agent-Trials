content:
  prompt: "\U0001F50D 在 RAG 中，为什么要先检索后压缩？压缩器会不会丢失重要信息？"
answer:
  mode: rubric
  reference_answer: "为什么要先检索后压缩？\n\nRAG 面临的核心矛盾是：我们希望 LLM 能基于尽可能多的相关上下文回答问题，但 LLM
    的上下文窗口有限且 token 有成本。检索器的任务是从海量文档中高召回地捞出一批候选文档（可能包含噪声），压缩器则负责精炼这些文档，只提取与当前问题相关的核心信息，从而在有限的窗口内注入更高的信息密度。\n\n如果反过来（先压缩后检索），就需要对全库文档进行压缩，这在计算上不可能。因此，“检索—压缩—生成”是一种高效的流水线：用廉价方法（向量检索）快速缩小范围，再用昂贵方法（LLM）精细过滤，实现成本与效果的帕累托最优。\n\n压缩器会不会丢失重要信息？\n\n会，这是压缩的本质代价。
    任何有损压缩都存在遗漏关键事实的风险，尤其是当 LLM 误解了查询意图或文档内容时。为了尽量降低风险，可以采取以下措施：\n\n- 保留高置信度文档的原貌：对得分极高（例如相似度
    > 0.9）的文档，可以选择不压缩，直接保留原文，避免误伤。\n\n- 多级压缩：先用 LLMChainFilter 确保文档与问题相关，再用 LLMChainExtractor
    抽取。Filter 的误判率更低，能减少后续 Extractor 的压力。\n\n- 引入验证机制：压缩后，可以再用一个轻量级 NLI 模型检查提取的句子是否忠实于原文，或者是否包含了回答问题的必要信息。\n\n-
    保留来源元数据：即使内容被压缩，也要保留文档的原始 ID 或链接，方便用户回查原文。\n\n- 调整压缩 Prompt：在 Prompt 中明确要求“保留所有数字、日期、人名等关键事实”，可以降低丢失风险。\n\n\U0001F4A1
    核心原则：压缩器的目标是提高信噪比，不是替代原文。 在关键任务中，可以将压缩后的内容与原始文档一同展示给用户，由人工判断。\n\n---"

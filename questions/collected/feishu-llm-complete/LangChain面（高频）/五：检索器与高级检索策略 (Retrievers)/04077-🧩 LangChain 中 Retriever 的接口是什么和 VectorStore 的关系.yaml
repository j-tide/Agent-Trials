content:
  prompt: "\U0001F9E9 LangChain 中 Retriever 的接口是什么？和 VectorStore 的关系？"
answer:
  mode: rubric
  reference_answer: |-
    Retriever 接口
    在 LangChain 中，Retriever 是一个抽象基类（BaseRetriever），定义了统一的文档检索规范。其核心接口非常简单：

    - get_relevant_documents(query: str) -> List[Document]：同步方法，接收一个查询字符串，返回与之相关的文档列表。

    - aget_relevant_documents(query: str) -> List[Document]：异步版本，用于并发场景。

    任何实现该接口的对象都可以作为一个 Retriever 被其他链或工具使用。这种设计符合依赖倒置原则，使得检索逻辑可以灵活替换，而调用方无需关心底层的具体实现（是向量搜索、BM25、还是混合搜索）。

    Retriever 与 VectorStore 的关系
    VectorStore 是 LangChain 中用于存储和检索向量（Embeddings）的组件，它本身并不直接暴露 Retriever 接口。但 VectorStore 提供了 as_retriever() 方法，该方法会返回一个 VectorStoreRetriever 实例。VectorStoreRetriever 内部封装了 VectorStore，并实现了 BaseRetriever 接口。

    所以关系是：VectorStore 是存储引擎，Retriever 是检索接口。VectorStore 通过 as_retriever() 将自己包装成一个 Retriever 供外部使用。 这种分层使得我们可以轻松地给向量检索器增加过滤、配置搜索参数等。

    ```text
    VectorStore (例如 Chroma, FAISS)
        └── as_retriever() → VectorStoreRetriever (实现了 BaseRetriever)
                                  └── get_relevant_documents(query)
    ```

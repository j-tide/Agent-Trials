content:
  prompt: "\U0001F4BE 父子文档检索中，小块和大块的映射关系如何存储？一般用什么数据库？"
answer:
  mode: rubric
  reference_answer: |-
    映射关系本质上是一个键值对：键为小块（子文档）的唯一标识符，值为对应父文档的 ID 或直接存储父文档对象。LangChain 使用 docstore 抽象来管理这种映射。

    存储方式：

    - 在 add_documents 时，每个父文档被切割为多个子文档。每个子文档生成一个唯一 ID（UUID），并在其 metadata 中记录父文档 ID。

    - 子文档（小块）被存入向量库，同时向量库返回的检索结果中包含了这些子文档对象，每个子文档对象可以通过其 ID 关联到父文档。

    - 父文档本身则存储在 docstore 中，以父文档 ID 为键。

    检索时的映射查找：

    - 向量检索返回前 k 个子文档。

    - 对于每个子文档，从 docstore 中查找其父文档 ID 对应的父文档（或直接通过子文档的 metadata["parent_id"]）。

    - 去重后，返回父文档列表。

    常用数据库：

    - InMemoryStore：开发和小规模场景，数据存储在内存中，重启后丢失。

    - RedisStore：高性能、支持持久化，适合生产环境。

    - ElasticsearchStore：如果已经用 Elasticsearch 作为向量库，可以直接利用其存储父文档，无需额外数据库。

    - SQLite/PostgreSQL：通过自定义 BaseStore 接口实现，但需要额外开发。

    选择建议：如果数据量不大且追求简单，用 InMemoryStore；生产环境推荐 Redis，因为其读写延迟极低，适合高频检索场景。


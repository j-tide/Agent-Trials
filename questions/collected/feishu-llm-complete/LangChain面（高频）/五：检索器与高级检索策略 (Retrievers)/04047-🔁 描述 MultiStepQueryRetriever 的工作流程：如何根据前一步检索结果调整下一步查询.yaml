content:
  prompt: "\U0001F501 描述 MultiStepQueryRetriever 的工作流程：如何根据前一步检索结果调整下一步查询？"
answer:
  mode: rubric
  reference_answer: |-
    其工作流程是一个循环迭代过程，直到达到停止条件。

    详细步骤：

    - 输入初始查询：用户提出一个问题或任务。

    - 第一轮检索：使用初始查询，调用基础检索器（如向量库）获取第一批文档。

    - 上下文分析：将当前轮检索到的文档内容与对话历史（如果有）一起，交给 LLM，并要求 LLM 执行两个动作：

    - 判断是否需要继续：如果已获取的信息足够回答问题，则输出“Final Answer”；否则，输出一个新的检索查询。

    - 生成下一步查询：LLM 需要基于已知信息缺失的部分，提出一个更聚焦、更深入的查询。比如，用户问“作者的生平”，第一轮检索到了作者名字和主要作品，LLM 可能生成下一步查询：“XX作者 出生日期 教育背景”。

    - 执行新查询：用新生成的查询再次检索，获取第二批文档。

    - 累积文档：将新检索到的文档追加到已有的文档集合中，形成不断增长的上下文。

    - 循环步骤3-5，直到达到最大步数，或者 LLM 判断已获得足够信息并输出“Final Answer”。

    - 返回最终答案：将累积的所有文档作为上下文，由 LLM 生成最终的回答。

    如何调整查询：LLM 通过阅读已检索到的文档，能发现还缺少哪些信息。比如一个文档提到了“此项研究基于史密斯等人的工作”，LLM 就会生成查询“史密斯等人 相关研究”，以挖掘深层引用。这种“阅读→识别缺口→生成针对性查询”的循环正是多步检索的核心智能。

    LangChain 实现：通常基于 MultiStepQueryRetriever 类，结合一个 LLM 和一个 BaseRetriever。它内部使用一个特殊的 Prompt，指导 LLM 生成结构化输出。


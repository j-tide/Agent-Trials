content:
  prompt: "⚖️ Self-RAG 和 ContextualCompressionRetriever 在思路上有何异同？"
answer:
  mode: rubric
  reference_answer: |-
    两者目标一致：从检索到的文档中提取出真正对生成答案有用的部分，滤除噪音。但在实现路径、粒度、智能程度上存在差异。

    相同点：

    - 都是后检索阶段的文档过滤/压缩技术。

    - 都试图解决“检索结果虽然相似但不一定相关”的问题。

    - 都可以作为检索管道中的一个中间组件。

    不同点：

    [嵌入表格未展开]

    类比：

    - ContextualCompressionRetriever 像一个图书管理员，你在借书前，他帮你把书中与你的问题无关的章节撕掉，只给你有用的几页。他独立于你完成这项工作。

    - Self-RAG 则像你自己在读书时，一边读一边在空白处做笔记，标注“这段话有用”、“那段是废话”，最后只根据标注过的内容写读书报告。整个评价过程与你的思考融为一体。

    结合使用：在实际系统中，两者可以互补。先用 ContextualCompressionRetriever 快速粗筛，去除大段无关内容；然后在生成答案时，再用 Self-RAG 的 Prompt 让 LLM 对剩下的内容进行精细评价和立场判断。这样既能利用压缩器降低 token 消耗，又能发挥 Self-RAG 的深度理解能力。


content:
  prompt: "\U0001F4CC 重排序模型一般放在检索管道的什么位置？是在混合检索之后吗？"
answer:
  mode: rubric
  reference_answer: "标准位置：在初步检索（和混合检索融合）之后，最终生成答案之前。\n\n更具体地说，典型的多阶段检索管道是：\n\n用户查询
    \n→ 多路检索（向量 + 关键词等） \n→ 结果融合（RRF 等）获得一个较大的候选文档集合（例如50-100个文档）\n→ 重排序模型（Cross-Encoder）对这些候选文档进行精细打分排序\n→
    截断为 top-k（例如 5 个）作为最终上下文\n→ 送入 LLM 生成答案\n\n为什么放在融合之后？\n\n- 重排序模型通常计算量较大（如交叉编码器），直接对全量文档（百万级）排序不现实。前面的检索阶段用快速但粗略的方法（embedding
    点积、BM25）大幅缩小候选集。\n\n- 混合检索融合后的列表已经综合了多路信号，但融合算法（如 RRF）是无监督的，可能不够精准。重排序模型可以学习复杂的相关性模式，给出最准确的排序。\n\n-
    放在最后能保证送入 LLM 的上下文信息密度最高，减少 token 浪费。\n\n能否放在混合检索之前？ 可以，但没必要。如果在每路检索后都加重排序，成本太高，而最终融合时又可能打乱顺序。通常是一次重排序，放在融合之后。\n\n一个反例：如果只使用单一路向量检索，重排序可直接放在向量检索之后，无需融合步骤。\n\n---"

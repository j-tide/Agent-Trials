content:
  prompt: "⏱️ 使用 ContextualCompressionRetriever 时，如果压缩步骤很耗时，你如何降低延迟？"
answer:
  mode: rubric
  reference_answer: |-
    压缩步骤耗时主要是因为对每个文档都要调用一次（或多次）LLM，这是典型的 IO 密集型等待。降低延迟的策略可以从算法、并发、缓存、模型选择四个维度展开。

    - 并发执行
    默认情况下，LangChain 的压缩器是串行处理文档的。我们可以通过实现异步压缩（acompress_documents）并使用 asyncio.gather 同时处理所有文档，将总延迟从 N * 单文档耗时 降为 max(单文档耗时)。

    ```python
    # 自定义异步压缩器，或者使用支持异步的 LLM
    async def acompress_documents(docs, query):
        tasks = [llm.acall(prompt) for doc in docs]
        results = await asyncio.gather(*tasks)
        # 后处理 results
    ```

    分层过滤，减少需要 LLM 处理的文档数量
    不直接对原始检索结果进行昂贵的 LLM 压缩。先使用速度极快的 EmbeddingsFilter（基于向量相似度）丢弃低分文档，只保留前 5-10 个送入 LLMChainExtractor。或者在检索阶段就设置严格的 score_threshold 和 k。

    - 模型降级与量化

    - 使用更小、更快的模型：对于压缩任务，gpt-3.5-turbo 通常足够，甚至可以用本地部署的 7B 模型（如 Llama-3-8B）经过量化后专门做压缩。

    - 批处理：如果使用 OpenAI API，可以将多个文档的压缩请求打包到一个批次中（如果自定义 Prompt 支持），减少网络往返。

    - 结果缓存

    对于重复的 (query, doc) 组合，利用缓存（如 Redis）存储压缩结果。LangChain 的 LLM 缓存可以部分实现这一点，但更精确的是自己实现一个文档级别的缓存。

    - 优化 Prompt
    压缩 Prompt 越简洁，LLM 生成越快。要求 LLM 直接输出“相关句子”，避免冗长的解释，并设置 max_tokens 限制。

    - 预计算与离线压缩

    如果知识库是静态的，可以预先用 LLM 对每个文档进行摘要或关键句提取，生成“压缩版文档”，并存入向量库。检索时直接命中压缩版，无需实时调用 LLM。这是将延迟从在线转移到离线的根本方法。


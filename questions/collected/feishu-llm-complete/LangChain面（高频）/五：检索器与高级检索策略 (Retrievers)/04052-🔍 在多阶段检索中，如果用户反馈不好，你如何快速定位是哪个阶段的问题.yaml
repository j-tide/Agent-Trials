  prompt: "\U0001F50D 在多阶段检索中，如果用户反馈不好，你如何快速定位是哪个阶段的问题？"
answer:
  mode: rubric
  reference_answer: |-
    当用户反馈“答案不对”或“搜不到相关内容”时，定位问题需要自上而下逐层排查，从最终答案回溯到原始检索。

    快速定位方法

    - 检查最终 LLM 生成（第三阶段压缩之后）

    - 检查压缩阶段的输出

    - 检查精排阶段的输出

    - 检查粗排阶段的输出

    - 检查检索查询的构建

    辅助工具

    - 日志系统：记录每个阶段的输入/输出、耗时、文档 ID。

    - 可视化工具：LangSmith 或自建平台，可以清晰展示链的每一步。

    - 人工抽样：定期随机抽查，建立反馈循环。


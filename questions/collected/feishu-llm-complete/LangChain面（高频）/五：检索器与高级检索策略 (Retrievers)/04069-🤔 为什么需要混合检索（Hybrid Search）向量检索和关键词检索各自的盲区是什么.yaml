content:
  prompt: "\U0001F914 为什么需要混合检索（Hybrid Search）？向量检索和关键词检索各自的盲区是什么？"
answer:
  mode: rubric
  reference_answer: "[图片内容未导入]\n\n混合检索是当前 RAG 系统中提升检索质量的关键手段。核心原因在于，向量检索和关键词检索是两种互补的检索范式，各自有明确的盲区，单独使用难以覆盖所有查询场景。\n\n\U0001F50D
    向量检索（语义检索）的盲区\n\n- 对专有名词、缩写、特定编号不敏感：如产品型号 \"XPS-15-9520\"，向量模型可能将其当作普通文本处理，无法精确匹配。而用户输入
    \"9520\" 时，向量可能检索出其他相似数字的文档，但漏掉准确的型号。\n\n- 对低频或新词知识缺失：如果嵌入模型在训练时没见过某个新出现的术语（如最新的病毒名称），它无法捕捉其语义，检索效果会很差。\n\n-
    对精确短语匹配要求高的场景乏力：比如法律条款、代码函数名、特定口号，向量检索可能返回意思相近但表述不同的内容，但用户要的是精确原文。\n\n- 对“否定”或“排除”含义理解弱：例如“不含咖啡因的饮料”，向量可能把“含咖啡因”和“不含”的文档都当作相似，因为它们在语义上都围绕咖啡因。\n\n\U0001F4DA
    关键词检索（如 BM25）的盲区\n\n- 无法理解同义词和语义变形：搜索“廉价手机”不会匹配“性价比高的智能机”，因为没出现相同的词。这是向量检索的强项。\n\n-
    无法处理复杂的上下文：例如“如何处理压力？”，BM25 只会寻找包含“处理”和“压力”的文档，但可能一篇讲述“放松技巧”的文章因为没有这两个词而排不上号。\n\n-
    无法跨语言检索：输入“apple”无法匹配到“苹果”。\n\n- 无法理解意图：关键词匹配纯粹基于词频和逆文档频率，不关心用户在找什么类型的答案。\n\n⚡
    为什么混合检索能取长补短？\n\n混合检索将两者结合，可以让结果既包含语义相关的文档，又包含精确命中关键词的文档。例如在医疗文献检索中，用户搜索“COVID-19
    疫苗副作用”，向量检索能找到讨论“新冠疫苗不良反应”的论文，关键词检索则能精确锁定包含“COVID-19”和“副作用”这两个词的具体段落，两者互补，极大提高召回率和精确率。\n\n在
    LangChain 中实现混合检索，可以视为一种多路召回+融合排序的策略。\n\n---"

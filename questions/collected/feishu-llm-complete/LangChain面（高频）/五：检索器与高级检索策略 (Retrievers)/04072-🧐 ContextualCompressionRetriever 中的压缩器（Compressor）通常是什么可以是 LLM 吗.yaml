content:
  prompt: "\U0001F9D0 ContextualCompressionRetriever 中的压缩器（Compressor）通常是什么？可以是 LLM
    吗？"
answer:
  mode: rubric
  reference_answer: |-
    常见的压缩器类型：

    - LLMChainExtractor：使用 LLM 从文档中抽取与查询相关的核心句子。它会调用 LLM，传入文档内容和查询，要求 LLM 输出提取后的内容。这是最强大但也最昂贵的压缩器。

    - LLMChainFilter：使用 LLM 判断文档是否与查询相关。返回“YES”或“NO”，从而过滤掉无关文档（只做筛选，不提取内容）。成本比 Extractor 稍低。

    - EmbeddingsFilter：基于嵌入向量计算文档与查询的相似度，保留相似度高于阈值的文档或片段。不需要调用 LLM，速度快，但可能不如 LLM 精准。

    - 自定义 Compressor：你可以实现 BaseDocumentCompressor 接口，例如结合一个轻量级的自然语言推理（NLI）模型来判断相关性，或使用规则进行过滤。

    可以是 LLM 吗？
    是的，LLMChainExtractor 和 LLMChainFilter 都是基于 LLM 的压缩器。它们通过构造 Prompt 让 LLM 完成压缩工作。因为 LLM 能理解语义，所以压缩质量往往很高，但缺点是会增加延迟和 API 费用。在实际项目中，常结合多种压缩器，例如先用 EmbeddingsFilter 快速粗筛，再用 LLMChainExtractor 精细提取，以达到成本和效果的平衡。


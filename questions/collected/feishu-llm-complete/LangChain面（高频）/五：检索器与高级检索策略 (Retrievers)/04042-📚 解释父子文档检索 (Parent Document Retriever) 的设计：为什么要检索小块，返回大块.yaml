  prompt: "\U0001F4DA 解释“父子文档检索” (Parent Document Retriever) 的设计：为什么要检索小块，返回大块？"
answer:
  mode: rubric
  reference_answer: |-
    核心矛盾：RAG 检索时，如果直接对完整的原始文档（如一个 PDF 章节）进行切分和嵌入，可能导致检索精度下降，因为长文档的嵌入向量通常更“泛化”，难以精准匹配短查询。但另一方面，回答问题时往往需要该文档的完整上下文，而不仅仅是某个被切出来的碎片。

    Parent Document Retriever 的设计：

    - 检索小块（Child）：将原始文档切分成较小的片段（例如每段 200 tokens），对这些小块生成嵌入向量并存入向量库。检索时，用查询找到最相关的小块。由于小块内容聚焦，嵌入向量能更精确地表征语义，从而提高检索的命中率和精确率。

    - 返回大块（Parent）：检索到小块后，不直接把这些小块交给 LLM，而是通过预先建立的映射关系，找到每个小块所属的“父文档”（即原始较大的文档或段落，例如整个章节或整个 PDF），然后将这些父文档（完整内容）作为上下文传递给 LLM。这样，LLM 获得的是完整、连贯的信息，而非碎片化文本。

    形象比喻：就像图书馆里，你通过目录（索引卡片）找到书的某一页（小块），但借阅时你拿到的是整本书（父文档）。卡片很小、检索精准，但读书需要完整的上下文。

    优势：

    - 保持检索精度：小块嵌入更准确。

    - 保证回答质量：LLM 看到完整上下文，减少断章取义。

    - 减少 token 浪费：不用把所有小块都喂给 LLM，而是用一个大块代替多个小块。


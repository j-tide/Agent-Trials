content:
  prompt: "\U0001F6E1️ 如果检索到 20 个文档，压缩后只保留 3 个相关片段，这个过程如何保证不丢失关键事实？"
answer:
  mode: rubric
  reference_answer: "这是一个典型的信息完整性保障问题。完全保证 100% 不丢失是不可能的，但可以通过冗余机制、多路召回、后验证来将风险降至可接受范围。\n\n-
    冗余压缩（多策略提取）\n\n不依赖单一的压缩器。可以同时运行两种压缩策略：一个用 LLM 提取关键句，另一个用简单的关键词匹配算法（如 Rake）提取高权重词所在的句子。将两者的结果并集合并，即使
    LLM 漏了，关键词算法可能命中。\n\n- 分块与去重\n\n检索到的 20 个文档可能包含重复信息。压缩前先进行语义去重，确保每个文档贡献独特的信息。压缩时，可以要求
    LLM 对每个文档输出包含的独特事实列表，然后进行事实级别的合并，保留所有不重复的事实。\n\n- 关键事实验证\n\n在压缩后，用原始查询和压缩后的片段，再向
    LLM 提问：“这些片段是否包含回答该问题所需的所有关键信息？如果没有，请指出缺失的部分。” 这是一种自我反思式验证，虽然增加一次调用，但能及时发现丢失。\n\n-
    保留原始文档的引用\n压缩后，不丢弃原始文档。将压缩后的内容作为“线索”提供给最终的生成链，同时在 Prompt 中附上完整的文档列表（或者文档编号）。要求
    LLM 在回答时，如果发现压缩内容不足以回答，则自行查阅原始文档。这正是 MapReduce 或 Refine 链的思路。\n\n- 设置保守的压缩率\n不要追求极致的压缩比。如果
    20 个文档总共 10K tokens，而你的 LLM 窗口有 32K，完全可以直接全部塞进去而不压缩。只在超限时才压缩。可以用 ContextualCompressionRetriever
    配合 LLMChainExtractor，但为 Extractor 设置 max_tokens 较大，允许输出较多内容。\n\n\U0001F511 最终防线：在生成答案后，使用检索到的完整文档作为“标准答案”，用另一个
    LLM 检查答案的事实性（Grounding）。这是最可靠的保证。\n\n---"

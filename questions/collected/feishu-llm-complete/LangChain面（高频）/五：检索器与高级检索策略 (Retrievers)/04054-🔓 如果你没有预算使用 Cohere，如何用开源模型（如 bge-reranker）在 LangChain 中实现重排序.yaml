content:
  prompt: "\U0001F513 如果你没有预算使用 Cohere，如何用开源模型（如 bge-reranker）在 LangChain 中实现重排序？"
answer:
  mode: rubric
  reference_answer: |-
    你可以通过自定义压缩器，将任何开源交叉编码器模型封装进 LangChain。这里以 bge-reranker-base（BAAI 发布）为例。

    步骤：

    - 安装 sentence-transformers 或其他推理库。

    - 创建自定义的 BaseDocumentCompressor 子类，在 compress_documents 中使用模型对文档打分，排序，返回 top-k。

    代码实现：

    from langchain.retrievers.document_compressors import BaseDocumentCompressor
    from langchain.schema import Document
    from sentence_transformers import CrossEncoder
    from typing import Sequence

    class BgeRerankCompressor(BaseDocumentCompressor):
        model_name: str = "BAAI/bge-reranker-base"
        top_n: int = 5
        _model: CrossEncoder = None

        def __init__(self, model_name=None, top_n=5):
            super().__init__(model_name=model_name or self.model_name, top_n=top_n)
            self._model = CrossEncoder(self.model_name, max_length=512)

        def compress_documents(self, documents: Sequence[Document], query: str) -> Sequence[Document]:
            if len(documents) == 0:
                return []
            # 构建 [query, doc] 对
            pairs = [[query, doc.page_content] for doc in documents]
            scores = self._model.predict(pairs)
            # 将分数附加到 metadata 中，并排序
            for i, doc in enumerate(documents):
                doc.metadata["rerank_score"] = float(scores[i])
            sorted_docs = sorted(documents, key=lambda d: d.metadata["rerank_score"], reverse=True)
            return sorted_docs[:self.top_n]

    使用：

    # 假设已经有一个基础检索器 base_retriever（例如从向量库拿到的 20 个文档）
    compressor = BgeRerankCompressor(top_n=5)
    compression_retriever = ContextualCompressionRetriever(
        base_compressor=compressor,
        base_retriever=base_retriever
    )
    docs = compression_retriever.get_relevant_documents(query)

    注意事项：

    - 交叉编码器每次只能处理一对，对大量文档（如50个）进行重排序会比较慢，但比调用在线 API 有延迟优势。

    - 可以通过微调 bge-reranker 更好地适配你的领域。

    - 需要 GPU 加速批量推理，否则会很慢。

    - 确保 max_length 适应你的文档长度，超出部分会被截断。


content:
  prompt: "\U0001F680 讨论一下检索增强生成 (RAG) 中的延迟问题，以及你在 LangChain 中的优化经验。"
answer:
  mode: rubric
  reference_answer: |-
    RAG 系统的延迟是影响用户体验的关键瓶颈，它由多个环节叠加而成：检索延迟 + 重排序延迟 + 压缩延迟 + LLM 生成延迟。一个未经优化的 RAG 流程可能耗时 5-10 秒，令人难以忍受。

    延迟来源分析：

    - 检索延迟：取决于向量数据库的性能和嵌入模型的推理速度。

    - 重排序延迟：交叉编码器（如 bge-reranker）通常需要 GPU 推理，每个文档对耗时约 10-30ms，50 个文档就是 500ms-1.5s。

    - 压缩延迟：如果使用 LLM 提取关键句，每次调用额外增加 1-3 秒。

    - 生成延迟：LLM 生成回答的时间，与上下文长度和生成 token 数正相关。

    优化经验（由易到难）：

    - 结果缓存——立竿见影

    - 检索缓存：对于重复查询，缓存检索结果，避免重复向量搜索和重排序。使用 Redis 或内存 LRU 缓存。

    - LLM 响应缓存：对于完全相同的 Prompt 和文档组合，直接返回缓存的答案。

    - 嵌入缓存：对于不变的文档库，嵌入向量只需计算一次，持久化存储。

    - 选择更快的模型和基础设施

    - 嵌入模型：使用轻量级嵌入模型（如 all-MiniLM-L6-v2 代替 text-embedding-ada-002），甚至将嵌入模型部署在本地 GPU 上加速。

    - 向量数据库：使用高性能向量数据库，如 Milvus、Weaviate，并确保索引类型适合你的数据规模（如 IVF_PQ 或 HNSW）。

    - 重排序：如果精度要求高，尽量用 GPU 加速重排序模型；如果延迟更敏感，可尝试更小的交叉编码器（如 ms-marco-MiniLM-L-6-v2）或直接用双塔模型的重排序（利用原始相似度分数），甚至跳过重排序。

    - 管道优化

    - 异步并行：将粗排的向量检索和关键词检索并行执行（asyncio.gather），而不是串行。

    - 早停策略：在重排序或压缩阶段，如果前几个文档的相关性评分已非常高，可以提前终止，不处理后续文档。

    - 流式处理：让 LLM 以流式方式生成答案，用户能立即看到第一个 token，降低感知延迟。

    - 减少不必要的步骤

    - 动态跳过重排序：如果粗排结果中第一名的相似度已经极高（比如 >0.95），可能不需要重排序，直接进入生成。

    - 省略压缩：如果检索到的文档本身很短（< 200 tokens），不需要再用 LLM 压缩，直接拼接。

    - 使用更短的 Prompt：每次调用 LLM 都消耗输入 token，精简 Prompt 能同时降低延迟和成本。

    - 预计算和离线处理

    - 离线生成 HyDE 假答案：对于热门查询，可以离线批量生成假答案并缓存其嵌入。

    - 预计算文档摘要：在入库时，为每个长文档生成摘要，检索时先匹配摘要，若相关再取全文。这样避免了在线压缩。

    实际案例：在一个客服问答系统中，原始 RAG 延迟为 4.2 秒。我们首先对重复查询加 Redis 缓存，命中率约 30%，延迟降到 2.8 秒（命中时）。接着，将重排序模型从 bge-reranker-large 替换为 bge-reranker-base 并 GPU 推理，延迟降至 1.9 秒。最后，优化 LLM 调用，采用流式输出和更简洁的 Prompt，最终达到平均 1.2 秒的端到端延迟。


content:
  prompt: "\U0001F4A1 在解决复杂推理问题时，多步检索能比单步检索带来多大提升？请举例。"
answer:
  mode: rubric
  reference_answer: |-
    多步检索在处理需要跨文档链接、多跳推理、信息补全的任务时，相比单步检索有质的飞跃。

    提升幅度：在如 HotpotQA（多跳问答数据集）等基准上，多步检索相对于单步检索通常能提升 10-30% 的 F1 值。关键原因是，单步检索假设所有必要信息都包含在与问题语义最相似的文档里，但多跳问题的答案往往需要融合来自多个不同文档的线索。

    举例：假设问题：“詹姆斯·卡梅隆执导的《阿凡达》的制片人是谁？”

    - 单步检索：查询“詹姆斯·卡梅隆 阿凡达 制片人”，向量库可能返回《阿凡达》的剧情介绍，里面提到了导演和主演，但可能没有直接列出制片人。或者返回一堆包含卡梅隆其他电影的文档，信噪比低。模型可能回答错误或遗漏。

    - 多步检索过程：

    - 初始查询：“詹姆斯·卡梅隆 阿凡达 制片人”。

    - 第一轮检索结果：得到《阿凡达》电影页面，内容提到“制片人：乔恩·兰多”。

    - LLM 分析：发现直接给出了制片人，可能立即返回“乔恩·兰多”。但如果第一轮结果只提到“由卡梅隆和兰多共同制作”，未明确谁是制片人，LLM 会生成下一步查询：“乔恩·兰多 电影制片”。

    - 第二轮检索：获得乔恩·兰多的信息，确认他是制片人。最终答案得以巩固。

    在更复杂的例子中，比如“赢得2023年奥斯卡最佳影片的电影的导演还导演过哪些电影？”，单步检索很难一次性拿到所有信息。多步检索会先找到最佳影片《瞬息全宇宙》，再提取导演“关家永与丹尼尔·施纳特”，最后检索这两位导演的作品集。这种链式推理能力是单步检索无法替代的。


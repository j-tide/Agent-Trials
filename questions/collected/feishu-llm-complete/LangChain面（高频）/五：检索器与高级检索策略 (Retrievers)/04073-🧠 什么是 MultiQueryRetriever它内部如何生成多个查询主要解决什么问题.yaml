content:
  prompt: "\U0001F9E0 什么是 MultiQueryRetriever？它内部如何生成多个查询？主要解决什么问题？"
answer:
  mode: rubric
  reference_answer: |-
    MultiQueryRetriever 是 LangChain 提供的一种高级检索器，它通过自动生成多个不同视角的查询，来克服单一查询可能因措辞不佳而导致的检索不全面问题。它本身不替代底层检索器，而是在其上增加了一个“查询增强”层。

    内部工作机制：

    - 接收用户原始查询。

    - 使用 LLM（默认用 ChatOpenAI 等）根据一个预设的 Prompt，生成若干个（默认3个）语义相似但表述不同的查询。

    - 将这多个查询分别发送给底层 Retriever，各自获取相关文档。

    - 将所有查询的结果进行合并去重，得到最终的文档集合。

    主要解决的问题：

    - 查询多样性不足：向量检索对查询的措辞敏感，单个查询可能遗漏重要信息。

    - 语义覆盖不足：用户问题可能包含模糊或抽象的表述，通过改写为多个具体查询，可以覆盖更多相关文档。

    - 检索召回率提升：尤其适用于长文档或专业领域，不同的提问角度能够激活不同的语义特征。

    简单比喻：就像你向图书馆员问同一个问题，但他会从不同角度（书名、关键词、作者）帮你搜索，然后把所有结果汇总给你。


content:
  prompt: "\U0001F3AF 如果用户的查询很模糊，向量检索和关键词检索结果都差，你怎么办？"
answer:
  mode: rubric
  reference_answer: |-
    当查询模糊（如“那个东西”、“上次说的那个”）或信息量极低时，检索系统普遍失效。此时需要采取查询增强和交互式检索策略。

    - 查询重写与扩展（离线优化）

    - 使用 MultiQueryRetriever：让 LLM 从不同角度生成多个更具体的查询，然后合并结果。这可以在检索前自动扩写模糊查询。

    - 历史上下文消歧：在对话场景中，通过 condense_question 将历史对话融入，把“那个东西”替换为之前提到的具体实体。

    - 同义词扩展：使用词典或大模型生成同义词、相关词，扩大检索范围。

    - 引导用户澄清（在线交互）

    - 如果置信度很低，系统可以主动反问：“您是指哪方面的气候变化？是政策、科学还是经济影响？” 这需要设计一个澄清对话流程。

    - 让 LLM 判断查询的明确性，若模糊，则生成一个澄清问题，等待用户回答后再检索。

    - 利用元数据和过滤

    - 如果系统记录了用户画像（偏好、领域），可以在检索时自动添加过滤条件，缩小范围。例如，默认检索“用户最近关注的领域”。

    - 降级策略

    - 如果实在检索不到相关文档，可以返回通用知识或直接承认不知道，避免胡编乱造。

    - 使用一个外部搜索引擎 API 作为后备，在私有知识库无结果时，搜索公网知识。

    - 迭代优化

    - 收集模糊查询的日志，分析其模式，有针对性地补充文档，或者训练更好的嵌入模型。

    - 对于反复出现的模糊查询，可以建立别名或 QA 对，直接匹配。

    - 混合检索的兜底

    - 虽然向量和关键词都差，但两者的结合（Ensemble）有时能通过互补稍微提升。如果还不够，考虑加入更多路的检索（如基于知识图谱、基于实体链接）。

    总之，模糊查询的解决不在检索器本身，而在于整个系统的交互设计和查询预处理。一个智能的 RAG 系统应当能够优雅地处理不确定性。

    - 基于向量相似度阈值：只保留相似度 > 某阈值的文档。

    - 基于 BM25 分数：如果混合检索之前有 BM25 分数，可以过滤掉 BM25 分数极低的文档。

    - 基于简单的句子长度或关键词命中过滤：快速剔除明显无关的。

    - NDCG（Normalized Discounted Cumulative Gain）：最核心的排序指标。它对排名靠前的结果给予更高权重，非常适合评估重排序是否将最相关的文档放在了前面。需要人工标注每个文档与查询的相关度分数（例如0-3分）。

    - MRR（Mean Reciprocal Rank）：第一个相关文档排名的倒数平均值。适合评估“找第一个正确答案”的能力。

    - MAP（Mean Average Precision）：在不同召回水平上的精确率平均值，综合考虑排序和召回。

    - Precision@K / Recall@K：例如 Precision@5，衡量重排序后前5个文档的精确率。计算时，需要知道文档真实的相关性标签。

    - 答案正确率：如果重排序服务于 RAG 问答，可以直接评测最终答案的准确性（如 Exact Match、F1）。

    - 引用准确性：检查 LLM 生成的答案是否引用了正确的文档（Citation Accuracy）。

    - 重排序延迟（Latency）：P50、P95 延迟。

    - 吞吐量（Throughput）：每秒能处理多少查询。

    - 用户行为指标：点击率（CTR）、停留时长、点赞/点踩比例。

    - 业务指标：转化率、任务完成率。

    - 性能指标：延迟、错误率。

    - 查看 LLM 的输入 Prompt，确认是否包含了与用户问题相关的上下文片段。

    - 如果 LLM 看到了相关片段但回答错误，问题在 LLM 本身（幻觉、理解偏差、Prompt 设计不佳）。

    - 如果 LLM 的输入中压根没有相关片段，问题在上游。

    - 取出压缩后的文档片段，与原始文档对比：压缩是否过度删除了关键信息？是否保留了源文档的核心事实？

    - 如果压缩后丢失了信息，问题在压缩器（提取 Prompt 不精确，或提取模型能力不足）。

    - 如果压缩后片段无关，问题可能在精排或粗排。

    - 获取重排序后的 top-K 文档（未压缩），人工判断这些文档是否与问题相关。

    - 如果多数文档无关，但前面的候选集中存在相关文档，则重排序模型出了问题（排序不准，可能过拟合或对领域适应性差）。

    - 如果精排后的文档大多相关，但压缩后变差，问题在压缩。

    - 如果重排序的输入候选集中相关文档很少，问题在粗排（召回不足）。

    - 查看粗排返回的 top-100 文档，统计有多少是真正相关的。

    - 如果相关文档数量极少（例如只有1-2条），则粗排的召回率不足，需要优化嵌入模型、检索参数或加入关键词检索增强。

    - 如果相关文档有一定数量但排名靠后，说明粗排的排序能力弱，可能需要调整嵌入模型或相似度算法。

    - 如果用户问题有歧义，或 ConversationalRetrievalChain 中生成的独立查询不准确，导致粗排从一开始就偏了。这是查询重写的问题，不是检索器本身的错。

    - query：用于语义检索的字符串。

    - filter：一个表示过滤条件的对象，例如 {"field": "year", "operator": "gte", "value": 2020}。

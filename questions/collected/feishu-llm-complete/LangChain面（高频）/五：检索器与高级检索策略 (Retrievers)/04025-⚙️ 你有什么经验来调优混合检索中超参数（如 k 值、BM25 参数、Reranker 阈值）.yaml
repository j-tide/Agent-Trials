content:
  prompt: "⚙️ 你有什么经验来调优混合检索中超参数（如 k 值、BM25 参数、Reranker 阈值）？"
answer:
  mode: rubric
  reference_answer: "调优混合检索超参数是一个经验科学和系统搜索相结合的过程。\n\n- k 值（各检索器返回数量）\n\n- 向量检索 k1：通常设得稍大（如
    20-50），因为向量检索覆盖面广，能够捞出“看起来相似”的文档，但其中很多可能不精确。更大的 k1 能提高召回率，但增加精排负担。\n\n- 关键词检索
    k2：可设小一些（如 10-20），因为 BM25 更倾向于精确匹配，返回的文档要么高度相关，要么完全无关。\n\n- 混合后送给重排序的 k：一般是 k1
    + k2 去重后的数量，再取 30-50 给重排序。\n\n- 调优方法：以召回率（Recall@K）为目标，逐步增大 k1 和 k2，直到召回率趋于稳定。比如，先固定
    k2=20，测试 k1=10,20,30...，找到转折点。\n\n- BM25 参数（k1 和 b）\n\n- BM25 有两个关键参数：k1（词频饱和度控制，默认1.2）和
    b（文档长度归一化，默认0.75）。\n\n- 对于长文档集合，可以稍微降低 b（如0.5），减少长文档被过度惩罚；对于短文档，b 设为0.75 即可。\n\n-
    k1 一般不做大幅调整。如果发现 BM25 对高频词过于敏感（如“the”），可以尝试降低 k1（如0.5），但通常默认值够用。\n\n- 调优可用网格搜索，在验证集上使用
    NDCG 评估。\n\n- 重排序阈值\n\n- 重排序后需要截断，决定最终送入 LLM 的文档数量 top_n。\n\n- 如果 LLM 窗口够大，top_n
    可以设为 5-10。窗口小则 3-5。\n\n- 如果重排序模型输出分数，可以设置一个分数阈值（如 >0.5），低于阈值的文档即使在前 top_n 也丢弃，避免引入噪音。但交叉编码器的分数分布因模型而异，阈值需要通过验证集校准。\n\n-
    融合权重\n\n- 静态权重：通过网格搜索 (w_vector 从 0.1 到 0.9) 在验证集上测试，选择 NDCG 最高的组合。\n\n- 动态权重：根据查询特征（长度、是否含数字等）制定规则，然后通过
    A/B 测试验证。\n\n- 系统性优化流程\n\n- 准备一个有标注的评估集（查询-相关文档对）。\n\n- 固定精排模型，先优化粗排的 k 值，以 Recall@100
    为目标。\n\n- 引入混合检索，调融合权重，以 NDCG@10 为目标。\n\n- 加入重排序，调 top_n 和可能的分数阈值，以 NDCG@5 为目标。\n\n-
    在线 A/B 测试微调，关注真实用户指标。\n\n\U0001F4A1 经验之谈：不要一次性调所有参数。像剥洋葱一样层层优化，并始终用同一个评估集衡量进步。另外，记录每次实验的参数和结果，形成“参数-效果”矩阵。\n\n---"

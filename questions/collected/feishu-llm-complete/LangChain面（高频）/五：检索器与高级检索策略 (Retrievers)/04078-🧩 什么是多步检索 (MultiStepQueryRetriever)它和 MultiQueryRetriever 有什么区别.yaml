content:
  prompt: "\U0001F9E9 什么是多步检索 (MultiStepQueryRetriever)？它和 MultiQueryRetriever 有什么区别？"
answer:
  mode: rubric
  reference_answer: |-
    MultiStepQueryRetriever 是一种能够执行多轮、迭代式检索的高级检索器。它不仅仅一次性搜索文档，而是先根据初始查询检索一批文档，然后分析这些文档的内容，从中提取新的关键词或子问题，再构造新的查询进行下一轮检索。这个过程可以重复多次，逐步逼近用户真正需要的信息，特别适合需要综合多个信息源、或者初始查询信息不足的复杂推理场景。

    MultiQueryRetriever 则是在单轮内生成多个语义相似但表述不同的查询，并行执行检索，最后合并结果。它的目的是通过查询多样性提升召回率，但仍然只做“一次检索”。

    [嵌入表格未展开]

    核心区别：MultiStepQueryRetriever 像侦探调查，从一条线索出发，不断搜集新线索直到破案；MultiQueryRetriever 则是向多个方向同时撒网，一网打尽。


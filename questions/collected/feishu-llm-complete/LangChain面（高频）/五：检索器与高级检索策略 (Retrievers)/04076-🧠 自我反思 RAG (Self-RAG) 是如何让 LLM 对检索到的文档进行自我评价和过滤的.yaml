content:
  prompt: "\U0001F9E0 自我反思 RAG (Self-RAG) 是如何让 LLM 对检索到的文档进行自我评价和过滤的？"
answer:
  mode: rubric
  reference_answer: |-
    Self-RAG 是一种让 LLM 在生成答案的过程中，主动评价和筛选检索到的文档的技术。它不仅仅是被动接收检索结果，而是像一个严谨的研究员，对每一篇找到的文献都问一句：“这篇文献对我的问题有用吗？它支持还是反驳我的观点？”

    Self-RAG 的典型工作流程：

    - 检索：根据用户查询，获取一批候选文档。

    - 文档评价：LLM 被要求对每个检索到的文档（或文档片段）进行打分或分类。它通常输出两个信号：

    - 过滤：基于 LLM 的评价，丢弃被标记为“无关”的文档，只保留“相关”的。

    - 生成答案：使用被过滤后的文档作为上下文，生成最终答案。同时，LLM 可以在答案中引用这些文档，表明其来源的可信度。

    - 自我反思（可选）：在生成答案后，模型还可能进行自我检查，例如“我生成的答案是否与提供的文档一致？”如果不一致，则进行修正。

    Self-RAG 如何实现？
    通常通过特殊训练的 LLM 或巧妙的 Prompt 工程来实现。Meta 等机构发布了专门的 Self-RAG 模型，这些模型在训练时就被教会了输出特殊的反思标记（reflection tokens），如 [Relevant]、[Irrelevant]、[Fully supported]、[Partially supported] 等。在推理时，模型在生成答案的同时输出这些标记，从而实现自我评价。

    如果使用通用 LLM（如 GPT-4），也可以通过精心设计的 Prompt 来模拟 Self-RAG 的行为。例如：

    你是一个批判性思考者。根据以下问题，判断每个文档片段的“相关性”（相关/无关）和“支持度”（支持/中立/反对）。然后，基于相关文档，给出最终答案。

    问题：{question}

    文档片段：
    {文档1}...
    {文档2}...

    请输出对每个文档的评价，然后给出答案。

    优势：

    - 减少无关文档的噪音，提高答案的事实一致性。

    - 增加透明度和可信度，用户可以知道答案基于哪些可靠来源。

    - 能够处理信息冲突：如果文档之间存在矛盾，Self-RAG 模型可以识别并采取更谨慎的回答策略。

    局限性：

    - 增加了推理步骤，因此延迟和成本显著增加。

    - 评价质量高度依赖 LLM 的能力，如果 LLM 本身判断力有限，可能会误删相关文档。


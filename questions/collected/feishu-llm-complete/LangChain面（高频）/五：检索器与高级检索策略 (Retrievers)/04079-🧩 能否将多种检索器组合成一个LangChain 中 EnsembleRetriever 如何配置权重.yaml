content:
  prompt: "\U0001F9E9 能否将多种检索器组合成一个？LangChain 中 EnsembleRetriever 如何配置权重？"
answer:
  mode: rubric
  reference_answer: |-
    可以，这正是 EnsembleRetriever 的用途。 它可以将多个不同类型的检索器（如向量检索、BM25、自定义检索器）的结果融合，统一返回。

    配置权重的方法：
    创建 EnsembleRetriever 时，可以通过 weights 参数为每个检索器指定权重。权重的高低会影响最终排序，但不会影响文档是否被返回（除非结合截断）。

    ```python
    from langchain.retrievers import EnsembleRetriever

    ensemble_retriever = EnsembleRetriever(
        retrievers=[vector_retriever, bm25_retriever],
        weights=[0.7, 0.3],   # 向量检索权重0.7，BM25权重0.3
    )
    ```

    权重的作用机制：

    EnsembleRetriever 默认使用 Reciprocal Rank Fusion (RRF) 算法进行融合。权重的配置在 LangChain 当前版本中，实际上是通过在 RRF 公式中引入加权因子来实现的。加权 RRF 公式为：

    [图片内容未导入]

    其中 wrwr 是第 rr 个检索器的权重，kk 是平滑常数（默认60），rankr(d)rankr(d) 是文档 dd 在检索器 rr 返回结果中的排名。权重越大，该检索器对最终得分的贡献越大。

    如果你不希望使用 RRF 而想自定义融合逻辑，可以重写 EnsembleRetriever 的 _get_relevant_documents 方法，例如简单地合并去重。


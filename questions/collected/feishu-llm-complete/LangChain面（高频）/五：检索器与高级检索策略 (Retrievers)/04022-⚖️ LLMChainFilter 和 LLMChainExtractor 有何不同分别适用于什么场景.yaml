content:
  prompt: "⚖️ LLMChainFilter 和 LLMChainExtractor 有何不同？分别适用于什么场景？"
answer:
  mode: rubric
  reference_answer: "两者都是 LangChain 中基于 LLM 的文档压缩器，但它们在处理粒度、输出内容、计算成本和应用场景上有本质区别。\n\n[嵌入表格未展开]\n\n\U0001F6E0️
    场景选择指南：\n\n- 使用 LLMChainFilter：当你的底层 LLM 窗口足够大，只是想快速丢弃无关文档以降低后续处理成本时。例如在问答题中，检索到
    20 个文档，只需过滤掉完全不沾边的，保留 5 个可能相关的，然后直接丢给生成链。\n\n- 使用 LLMChainExtractor：当你需要严格控制 token
    消耗，或者文档本身很长（如技术手册、论文），你想从中提取出直接回答问题所需的那两三句话。这在长文档问答中非常有效。\n\n\U0001F4A1 工程实践：常常组合使用。先用快速的
    EmbeddingsFilter 或 LLMChainFilter 粗筛，再用 LLMChainExtractor 对留下的少数文档精细提取，兼顾速度与精度。\n\n---"

content:
  prompt: "\U0001F4CA 你怎样评估重排序的效果？用什么指标，如何做 A/B 测试？"
answer:
  mode: rubric
  reference_answer: "重排序（Reranking）作为检索管道中的关键一环，其效果直接影响最终答案的质量。评估重排序需要从排序质量、端到端任务性能和用户体验三个层面进行。\n\n\U0001F4C8
    评估指标\n\n- 排序质量指标（离线评估）\n\n- 端到端任务指标\n\n- 效率指标\n\n\U0001F9EA A/B 测试方法\n\nA/B 测试用于在线环境，比较两个重排序策略（例如
    Cohere Rerank vs. bge-reranker）的真实效果。\n\n- 流量分割：将生产流量随机分成两组（A组和B组），确保样本同分布。\n\n-
    控制变量：两组除了重排序模型不同，其他组件（检索器、LLM、Prompt）完全相同。\n\n- 收集指标：\n\n- 统计显著性检验：收集足够样本后，使用
    t 检验或卡方检验判断差异是否显著。\n\n- 灰度发布：通过配置中心动态切换重排序模型，无需重启服务。\n\n\U0001F4A1 实操建议\n\n- 离线评估阶段，使用已有标注数据集（如
    MS MARCO、自己标注的数据）计算 NDCG 进行粗筛。\n\n- 在线 A/B 测试时，重点关注 CTR 和用户满意度，因为它们是最终商业价值的体现。\n\n-
    务必监控重排序带来的额外延迟，避免为了提升精度而牺牲用户体验。\n\n---"

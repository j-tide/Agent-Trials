content:
  prompt: "\U0001F9E0 什么是 SelfQueryRetriever？它将自然语言转化为什么形式来过滤？"
answer:
  mode: rubric
  reference_answer: |-
    SelfQueryRetriever 是 LangChain 中的一个高级检索器，它能够从用户的自然语言查询中自动提取出结构化的元数据过滤条件，并用这些条件对向量数据库进行过滤，同时仍进行语义检索。

    它将自然语言转化为两部分：

    - 查询字符串（query）：用于语义检索的纯文本，例如“气候变化报告”。

    - 过滤条件（filter）：一个结构化的元数据过滤字典，例如 {"year": {"$eq": 2023}}。

    工作原理：
    它依赖一个 LLM（通常是 OpenAI 的 GPT-3.5/4）解析用户输入，并按照指定的元数据字段定义，生成结构化输出。然后，调用底层向量存储的检索方法，同时传入 query 和 filter。

    优势：

    - 用户无需知道数据库中有哪些元数据字段，就能通过自然语言实现复杂过滤，例如“找出去年张三写的关于机器学习的文章”。

    - 支持多种比较操作符：等于、大于、小于、包含、日期范围等。

    核心组件：

    - SelfQueryRetriever 本身。

    - 一个定义了元数据字段及其类型的结构（AttributeInfo）。

    - 一个支持过滤的 VectorStore。

    - 一个 LLM。

    生成的过滤条件示例：

    用户输入：“show me documents about climate change from 2020 to 2023”

    LLM 可能会生成：

    {
      "query": "climate change",
      "filter": {
        "year": {"$gte": 2020, "$lte": 2023}
      }
    }

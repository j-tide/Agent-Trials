content:
  prompt: "\U0001F6E0️ 写一个 VectorStoreRetriever 的创建代码，设置 search_kwargs（如 k 值、score_threshold）。"
answer:
  mode: rubric
  reference_answer: |-
    下面以 Chroma 向量数据库为例，创建 VectorStoreRetriever 并通过 search_kwargs 设置返回文档数量 k 和相似度阈值 score_threshold。

    ```python
    from langchain.vectorstores import Chroma
    from langchain.embeddings import OpenAIEmbeddings

    # 假设已经构建好 embeddings 和 Chroma 实例
    embeddings = OpenAIEmbeddings()
    vectorstore = Chroma(
        collection_name="my_knowledge_base",
        embedding_function=embeddings,
        persist_directory="./chroma_db"
    )

    # 创建 Retriever，并设置搜索参数
    retriever = vectorstore.as_retriever(
        search_type="similarity_score_threshold",  # 搜索类型：带分数阈值
        search_kwargs={
            "k": 5,                     # 返回最相似的5个文档
            "score_threshold": 0.7      # 只返回相似度大于0.7的文档
        }
    )
    ```

    说明：

    - search_type 除了 "similarity_score_threshold"，还有 "similarity"（默认，返回 Top-K）和 "mmr"（最大边际相关性，用于增加多样性）。

    - search_kwargs 中的参数会根据不同的 VectorStore 后端略有差异，但 k 是通用的。部分后端（如 FAISS）还支持 fetch_k（MMR 中初始获取的数量）。

    - 如果不设置 score_threshold，则返回最相似的 k 个文档，不进行分数过滤。


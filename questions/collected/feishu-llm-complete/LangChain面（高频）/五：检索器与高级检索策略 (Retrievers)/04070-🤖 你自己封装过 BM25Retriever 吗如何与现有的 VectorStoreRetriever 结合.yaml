content:
  prompt: "\U0001F916 你自己封装过 BM25Retriever 吗？如何与现有的 VectorStoreRetriever 结合？"
answer:
  mode: rubric
  reference_answer: |-
    在 LangChain 的早期版本中，没有内置的 BM25Retriever，需要自己封装。现在的社区版已经提供，但了解其内部原理有助于自定义。

    自封装 BM25Retriever 的核心实现：

    from rank_bm25 import BM25Okapi
    from langchain.schema import BaseRetriever, Document
    from typing import List

    class MyBM25Retriever(BaseRetriever):
        documents: List[Document]
        bm25_index: BM25Okapi
        k: int = 4

        def __init__(self, documents: List[Document], k=4):
            super().__init__(documents=documents, k=k)
            # 对文档内容分词（中文可用jieba）
            tokenized_corpus = [doc.page_content.split() for doc in documents]
            self.bm25_index = BM25Okapi(tokenized_corpus)

        def _get_relevant_documents(self, query: str) -> List[Document]:
            tokenized_query = query.split()
            scores = self.bm25_index.get_scores(tokenized_query)
            best_indices = sorted(range(len(scores)), key=lambda i: scores[i], reverse=True)[:self.k]
            return [self.documents[i] for i in best_indices]

    对于中文，需要用 jieba 分词。

    与 VectorStoreRetriever 结合的方式：
    如前所述，直接使用 EnsembleRetriever，将自定义的 MyBM25Retriever 和 vectorstore.as_retriever() 传入即可。EnsembleRetriever 会自动处理并行调用和结果融合。

    更深度的结合：

    不仅仅是结果层面的融合，还可以将 BM25 的分数与向量相似度分数在文档级别进行线性加权：

    def _get_relevant_documents(self, query):
        vec_docs = self.vector_retriever.get_relevant_documents(query)  # 假设带分数
        bm25_docs = self.bm25_retriever.get_relevant_documents(query)  # 带分数
        combined_scores = {}
        # 对两个检索器的结果按权重累加分数
        for doc, score in vec_docs: combined_scores[doc.page_content] = 0.7 * score
        for doc, score in bm25_docs: combined_scores[doc.page_content] = combined_scores.get(doc.page_content, 0) + 0.3 * score
        sorted_docs = sorted(combined_scores.items(), key=lambda x: x[1], reverse=True)
        return [doc for doc, _ in sorted_docs]

    这需要检索器能返回原始的相似度分数（向量检索可通过 similarity_search_with_score 实现，BM25 直接有 get_scores）。这种方式比 RRF 更直接，但需要分数尺度对齐。

    实践中的坑：

    - BM25 对中文的分词依赖严重，分词不好效果差。

    - 如果文档库非常大，每次重新构建 BM25 索引不现实，需要将 BM25Okapi 对象序列化或使用专门的搜索引擎（如 Elasticsearch）。

    - 动态增加文档时，需要更新索引，自实现的 BM25 更新代价高，应使用支持增量索引的库。


content:
  prompt: "\U0001F517 EnsembleRetriever 内部如何对多个检索器的结果进行融合？默认是 RRF（倒数排名融合）吗？"
answer:
  mode: rubric
  reference_answer: |-
    是的，默认采用 RRF（Reciprocal Rank Fusion），但代码中实现的是加权 RRF。融合流程如下：

    - 并行调用：同时（或顺序）调用所有子检索器的 get_relevant_documents，获取各自的排序文档列表。

    - 计算 RRF 得分：

    - 按得分降序排序：所有文档按 RRF 得分从高到低排序。

    - 返回最终列表：返回排序后的文档列表（通常限制 total_k）。

    RRF 的优点是不需要各检索器输出原始的相似度分数（因为不同检索器的分数尺度不一致，无法直接比较），只依赖排名，因此非常通用。

    扩展：你也可以通过 c=60 参数调整 RRF 的平滑常数。更大的 c 使得排名靠后的文档得分衰减更慢，增加多样性。


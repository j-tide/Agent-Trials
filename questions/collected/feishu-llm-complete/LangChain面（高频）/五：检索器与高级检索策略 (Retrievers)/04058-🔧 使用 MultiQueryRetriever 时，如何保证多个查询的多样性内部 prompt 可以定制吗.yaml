content:
  prompt: "\U0001F527 使用 MultiQueryRetriever 时，如何保证多个查询的多样性？内部 prompt 可以定制吗？"
answer:
  mode: rubric
  reference_answer: |-
    保证多样性的关键在于 LLM 生成的查询是否足够发散。 MultiQueryRetriever 通过以下几点来保证：

    - Prompt 设计：默认的 Prompt 会明确要求 LLM 生成多个“不同角度”或“不同表述”的查询。例如，它会指示模型“生成3个不同版本的查询，以便从向量数据库中检索到更全面的文档”。

    - LLM 的温度（Temperature）：在调用 LLM 生成查询时，可以设置较高的温度（例如 0.7），以增加随机性和多样性。

    - 定制 Prompt：这是最直接的方法。你可以完全自定义 Prompt，加入领域特定的指令、示例（few-shot），或者要求生成包含同义词、相关概念的查询。

    自定义 Prompt 示例：

    ```python
    from langchain.retrievers.multi_query import MultiQueryRetriever
    from langchain.prompts import PromptTemplate

    # 自定义的查询生成Prompt
    custom_prompt = PromptTemplate.from_template(
        """你是一个专业的信息检索专家。请根据用户的问题，生成{num_queries}个不同角度、不同措辞的搜索查询，以便全面覆盖相关文档。
        要求：
        - 每个查询应与原始问题语义相关，但使用不同的表达方式、同义词或下位概念。
        - 输出为JSON列表，如：["查询1", "查询2", ...]

        用户问题：{question}

        生成的查询列表（JSON格式）："""
    )

    retriever_from_llm = MultiQueryRetriever.from_llm(
        retriever=base_retriever,
        llm=ChatOpenAI(temperature=0.7),
        prompt=custom_prompt,   # 传入自定义prompt
        num_queries=5           # 生成5个查询
    )
    ```

    通过这种方式，你可以精确控制查询的多样性和格式。


content:
  prompt: "\U0001F916 假设文档嵌入（HyDE）的工作原理是什么？为什么先生成假答案能提升检索效果？"
answer:
  mode: rubric
  reference_answer: |-
    HyDE（Hypothetical Document Embeddings） 是一种巧妙的零样本检索增强技术，特别适用于用户查询与文档之间的语言风格存在差异的场景。

    工作原理：

    - 用户提出查询问题。

    - 使用一个 LLM（如 GPT-3.5）根据该问题，生成一个假设的答案文档（一个虚构的、看起来像是从知识库中能找到的段落）。这个假答案可能包含事实错误，但重要的是它模拟了目标文档的语言风格、用词和结构。

    - 将这个生成的假答案（而不是原始查询）输入到 Embedding 模型，获得一个向量表示。

    - 用这个向量去检索知识库，找到与之最相似的文档。

    为什么能提升检索效果？

    - 弥合语义鸿沟：用户查询往往简洁、口语化，而知识库中的文档通常更正式、包含更多专业术语。例如，查询“怎么修漏水的水龙头？”与文档中“水龙头漏水常见原因及维修步骤”在词汇上重叠度低，但语义相关。假答案“要修理漏水的水龙头，你可以先关闭水源，然后...”使用了与文档更接近的措辞和结构，从而能检索到更相关的文档。

    - 增强查询表达力：短查询的信息量少，生成的假答案相当于自动进行了查询扩展，丰富了语义特征。

    - 利用 LLM 的世界知识：LLM 生成的假答案基于其预训练知识，能提供与目标文档相似的上下文背景，即使它不完全准确。

    一句话总结：HyDE 用 LLM 的“想象力”将查询转换为一个更贴近文档库风格的样本，以此作为检索的桥梁。


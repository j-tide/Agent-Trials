content:
  prompt: "\U0001F3AF CohereRerank 在 LangChain 中怎么用？它和普通重排序模型相比，强在哪？"
answer:
  mode: rubric
  reference_answer: |-
    Cohere 的 Rerank 服务是一个专门为重排序设计的 API。LangChain 通过 CohereRerank 压缩器封装了它，可以作为 ContextualCompressionRetriever 的压缩器使用。

    使用方法：

    from langchain.retrievers import ContextualCompressionRetriever
    from langchain.retrievers.document_compressors import CohereRerank
    from langchain.vectorstores import Chroma

    # 假设已有 base_retriever
    retriever = Chroma(...).as_retriever(search_kwargs={"k": 20})  # 多捞一些

    # 创建 Cohere Rerank 压缩器
    compressor = CohereRerank(cohere_api_key="your_key", model="rerank-english-v2.0", top_n=5)

    # 构建压缩检索器
    compression_retriever = ContextualCompressionRetriever(
        base_compressor=compressor,
        base_retriever=retriever
    )

    docs = compression_retriever.get_relevant_documents("what is quantum computing?")
    # 返回的 docs 已经被重排序，只保留 top_n=5

    Cohere Rerank 内部会调用 Cohere 的 API，将每个文档与查询进行匹配打分，然后按分数排序并截断。

    与普通重排序模型相比，Cohere Rerank 强在哪？

    - 高性能的交叉编码器：Cohere 的 rerank 模型基于大规模预训练和微调，其交叉编码器结构能够同时处理查询和文档，捕捉细粒度语义关系，重排序质量通常优于基于 embedding 的双塔模型。

    - 多语言支持：rerank-english-v2.0 支持英语，而 rerank-multilingual-v2.0 支持多语言。

    - 服务端托管，无需自部署：省去了模型部署和运维的麻烦，延迟稳定。

    - 专为长文档设计：它可以处理较长的文档（如 4k token），并输出精确的相关性分数。

    不过，它是付费 API，且有数据隐私风险（数据离开你的服务器）。但它提供了极佳的开箱即用体验。


content:
  prompt: "\U0001F527 在你的实际项目中，哪个高级链使用频率最高？你踩过哪些坑？"
answer:
  mode: rubric
  reference_answer: "在我参与过的几个项目中，ConversationalRetrievalChain 是使用频率最高的，几乎任何涉及“对话式知识库问答”的产品都会用到。\n\n✨
    为什么它最常用？\n\n- 它解决了真实应用中的两大痛点：记忆对话上下文和基于私有知识回答。\n\n- 用户希望像与人聊天一样连续提问，并能深入探讨文档内容。\n\n-
    开箱即用，可定制性强。\n\n\U0001F4A3 踩过的坑及解决方式：\n\n坑1：检索质量随时间下降\n\n- 现象：多轮对话后，condense_question_prompt
    生成的重写查询越来越模糊，导致检索出无关文档。\n\n- 原因：对话历史太长，LLM 在重写时丢失了早期关键信息，或产生了幻觉。\n\n- 解决：\n\n坑2：引用来源不准确\n\n-
    现象：模型回答看似合理，但指出的来源文档并不包含该信息。\n\n- 原因：LLM 在生成时混淆了多个文档片段，或自己编造了引用。\n\n- 解决：\n\n坑3：成本失控\n\n-
    现象：API 费用激增。\n\n- 原因：每次对话都调用 LLM 重写查询 + 最终问答，而历史很长时 token 消耗巨大。\n\n- 解决：\n\n坑4：链的初始化耗时\n\n-
    现象：服务启动慢。\n\n- 原因：ConversationalRetrievalChain 在初始化时需要加载多个 Prompt 和链。\n\n- 解决：在应用启动时预加载，以单例模式复用。\n\n---"

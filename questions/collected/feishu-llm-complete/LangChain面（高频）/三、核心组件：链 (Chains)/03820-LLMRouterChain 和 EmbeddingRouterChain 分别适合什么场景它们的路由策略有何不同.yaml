content:
  prompt: LLMRouterChain 和 EmbeddingRouterChain 分别适合什么场景？它们的路由策略有何不同？
answer:
  mode: rubric
  reference_answer: "\U0001F19A LLMRouterChain：\n\n- 路由策略：基于 LLM 的语义理解。将用户输入和候选目标描述一起发给
    LLM，LLM 推理出最合适的目标链。\n\n- 优点：极其灵活，能理解复杂、模糊的意图，无需预先为每个类别准备大量样本。\n\n- 缺点：每次路由需要额外调用
    LLM，增加延迟和成本；准确性依赖 LLM 自身能力；确定性较低。\n\n- 适用场景：意图类别动态变化、模糊语义理解、复杂条件路由；例如客服系统中的多级意图分发。\n\n\U0001F19A
    EmbeddingRouterChain：\n\n- 路由策略：基于向量嵌入相似度。预先为每个目标链的触发条件（如示例查询）计算嵌入向量，存入向量库。用户查询来时，计算其嵌入向量，通过向量相似度搜索找到最接近的预定义类别。\n\n-
    优点：速度快（无需额外 LLM 调用），成本低，结果可复现、确定性高。\n\n- 缺点：灵活性受限，难以处理语义差距大的表述；需要预先准备足够的示例。\n\n-
    适用场景：意图类别明确且固定、高吞吐量、低延迟、需要可复现结果的场景；例如简单的命令分类、FAQ 路由。\n\n\U0001F4CA 对比总结：\n\n[嵌入表格未展开]\n\n在实际应用中，可以根据场景组合使用，或者先用
    EmbeddingRouterChain 快速筛选，再用 LLMRouterChain 对模糊情况进行二次判断。"

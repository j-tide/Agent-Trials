    一个进阶用法：如果你需要批处理，但某些输入可能失败且不想中断整个批处理，可以传 config={"max_concurrency": 5} 并设置 return_exceptions=True（在 batch 的参数里），这样失败项对应的输出会是一个 Exception 对象，你可以在收集结果后统一处理。


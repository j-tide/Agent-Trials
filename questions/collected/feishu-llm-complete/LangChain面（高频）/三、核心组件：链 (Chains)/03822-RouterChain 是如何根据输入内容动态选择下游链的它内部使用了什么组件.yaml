content:
  prompt: RouterChain 是如何根据输入内容动态选择下游链的？它内部使用了什么组件？
answer:
  mode: rubric
  reference_answer: "RouterChain（路由链）解决了“根据用户意图将请求分发到不同处理链”的问题。它不是固定的线性流，而是动态条件路由。\n\n\U0001F9E9
    内部组件：\n\n- Router（路由器）：核心决策组件，负责分析输入并决定应该激活哪个下游链。可以是基于 LLM 的语义路由器，也可以是基于嵌入向量相似度的路由器。\n\n-
    Destination Chains（目标链）：一组预定义的子链，每个子链负责处理一类特定任务（如翻译链、摘要链、问答链）。\n\n- RouterOutputParser（路由输出解析器）：专门解析路由器
    LLM 的原始输出，提取出目标链的名称和下一步的输入。\n\n⚙️ 执行流程：\n\n- 输入分析：用户查询传入 RouterChain。\n\n- 路由决策：RouterChain
    调用内部 Router（可能是一个 LLM），分析用户意图。Router 返回一个决策结果（如 {\"destination\": \"translate_chain\",
    \"next_inputs\": {\"text\": \"你好世界\"}}）。\n\n- 解析路由结果：RouterOutputParser 解析 Router
    的原始输出，提取出目标链名称和传递参数。\n\n- 分发执行：RouterChain 根据解析出的目标链名称，从预定义的 Destination Chains
    中选取对应的链，并将参数传递过去。\n\n- 返回结果：目标链执行并返回最终结果。\n\n\U0001F4DC 代码示例：\n\n```python\nfrom
    langchain.chains.router import LLMRouterChain, RouterOutputParser\nfrom langchain.chains.router.multi_prompt
    import MultiPromptChain\nfrom langchain.prompts import PromptTemplate\n\n# 定义目标链的模板\ntranslate_template
    = \"将以下文本翻译成英文：{input}\"\nsummary_template = \"用一句话总结以下内容：{input}\"\n\n# 定义路由器的
    Prompt\nrouter_template = \"\"\"\n根据用户输入，选择下一步操作：\n- 如果用户要求翻译，输出：{{\"destination\":
    \"translate\", \"next_inputs\": {{\"input\": \"用户原文\"}}}}\n- 如果用户要求摘要，输出：{{\"destination\":
    \"summary\", \"next_inputs\": {{\"input\": \"用户原文\"}}}}\n用户输入：{input}\n\"\"\"\nrouter_prompt
    = PromptTemplate.from_template(router_template)\n\n# 创建路由器\nrouter = LLMRouterChain.from_llm(llm=model,
    prompt=router_prompt)\n\n# 创建目标链映射\ndestination_chains = {\n    \"translate\":
    translate_chain,\n    \"summary\": summary_chain,\n}\n\n# 创建 MultiPromptChain（一种
    RouterChain 实现）\nrouter_chain = MultiPromptChain(\n    router_chain=router,\n
    \   destination_chains=destination_chains,\n    default_chain=default_chain,\n
    \   verbose=True,\n)\n\nresult = router_chain.invoke({\"input\": \"你好世界，请翻译成英文\"})\n```\n\nMultiPromptChain
    是 RouterChain 的具体实现，它内部集成了 LLMRouterChain 和 RouterOutputParser，自动完成路由决策。"

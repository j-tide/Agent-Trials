content:
  prompt: 解释 RunnableBranch 的作用，它与一连串的 | 管道相比有什么优势？
answer:
  mode: rubric
  reference_answer: |-
    ### RunnableBranch 的作用

    RunnableBranch 实现了基于条件的动态路由。它接受一个由 (condition, runnable) 对组成的列表，按顺序评估条件，将输入传递给第一个满足条件的Runnable执行。如果所有条件都不满足，则执行一个默认Runnable。

    ### 与 | 管道的对比

    - 管道 (|)：表示固定的线性顺序。无论输入是什么，数据都必定依次流经A、B、C。它无法实现“根据内容选择不同处理路径”的逻辑。

    - RunnableBranch：实现了“if-elif-else”的逻辑，让链的拓扑能够根据输入动态变化。

    优势：

    - 表达力更强：一条链即可处理多种情况，无需在外部编写条件判断并手动组装不同的链。

    - 组件内聚：分支逻辑和对应的处理链封装在一起，代码更清晰。

    - 可组合：RunnableBranch本身也是一个Runnable，可以继续与其他Runnable通过管道组合。

    - 声明式：路由规则以列表形式声明，易于阅读和维护。

    示例：

    ```python
    from langchain_core.runnables import RunnableBranch

    branch = RunnableBranch(
        (lambda x: "翻译" in x["query"], translate_chain),
        (lambda x: "摘要" in x["query"], summary_chain),
        qa_chain  # 默认
    )
    ```

    相比之下，如果用管道，你需要先判断，然后选择不同的链对象调用，逻辑与链的定义分离，不利于复杂应用的维护。

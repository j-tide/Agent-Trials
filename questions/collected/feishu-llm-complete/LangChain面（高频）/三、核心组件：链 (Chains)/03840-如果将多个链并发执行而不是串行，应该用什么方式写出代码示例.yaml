content:
  prompt: 如果将多个链并发执行而不是串行，应该用什么方式？写出代码示例。
answer:
  mode: rubric
  reference_answer: |-
    使用 RunnableParallel（或 RunnableMap）可以实现多个链的并发执行。它接受一个字典，键为分支名称，值为一个Runnable。框架会利用线程池或异步协程同时执行所有分支，然后收集结果合并为一个字典输出。

    示例：并发调用多个模型，然后汇总答案。

    ```python
    from langchain_core.runnables import RunnableParallel

    # 假设有三个独立的链（或模型）
    translate_chain = prompt_translate | model
    summary_chain = prompt_summary | model
    qa_chain = prompt_qa | model

    # 并发执行
    parallel = RunnableParallel(
        translation=translate_chain,
        summary=summary_chain,
        qa=qa_chain
    )

    # 调用
    results = parallel.invoke({"input": "你好世界"})
    print(results["translation"])  # 翻译结果
    print(results["summary"])      # 摘要结果
    ```

    实现细节：

    - 在同步 invoke 中，RunnableParallel 默认使用线程池并发执行各分支。

    - 在异步 ainvoke 中，使用 asyncio.gather 并发。

    - 总耗时接近于最慢分支的耗时，大幅优于串行执行。

    应用场景：多模型集成、多工具调用、同时进行检索和生成等。

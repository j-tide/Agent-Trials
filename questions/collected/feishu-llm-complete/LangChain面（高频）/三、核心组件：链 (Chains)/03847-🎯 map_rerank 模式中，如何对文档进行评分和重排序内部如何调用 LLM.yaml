content:
  prompt: "\U0001F3AF map_rerank 模式中，如何对文档进行评分和重排序？内部如何调用 LLM？"
answer:
  mode: rubric
  reference_answer: "\U0001F50D 工作原理\nmap_rerank 链会对每一个检索到的文档独立调用 LLM，要求 LLM 不仅回答问题，还输出一个数值化的置信度/相关性评分。然后根据评分对文档排序，选择得分最高的文档对应的答案，或者再进一步处理。\n\n\U0001F527
    内部调用流程\n\n- 对于每个文档 doc，构造一个特殊的 Prompt 模板，该模板必须要求 LLM 在回答后附加一个明确的评分标记，例如 Score:
    85/100。\n\n- LangChain 使用 MapRerankDocumentsChain，其内部会调用 LLMChain 逐文档执行。\n\n-
    解析 LLM 输出：从回答中提取最后的数字作为该文档的得分。如果解析失败，该文档得分设为 0。\n\n- 所有文档处理完后，按得分降序排列。\n\n- 选择得分最高的文档，返回其对应的答案。\n\n\U0001F4DD
    关键 Prompt 设计\n\n一个典型的 map_rerank prompt 如下：\n\n请根据以下文档内容回答问题，并在回答的最后，用\"Score:
    [0-100]\"的格式给出该文档与问题的相关性评分。\n\n文档：\n{document}\n\n问题：\n{question}\n\n答案和评分：\n\nLLM
    的输出可能类似：这个文档讲述了...因此答案是... Score: 92。LangChain 默认使用正则 r\"Score:\\s*(\\d+)\" 提取评分。\n\n\U0001F4A1
    优点与局限\n\n- 优点：可以快速从多个文档中定位最相关的一个，适合单一答案场景。\n\n- 局限：\n\n\U0001F6E0️ 自定义增强\n你可以修改评分提取逻辑，或者使用
    MapRerankDocumentsChain 的 callback 记录每个文档的得分用于后续分析。如果希望最终答案也参考其他高分文档，可以在排序后取前
    2-3 个文档，用 stuff 链再回答一次。\n\n---"

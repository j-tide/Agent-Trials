content:
  prompt: 在 LCEL 中，如何使用 RunnableLambda 将自定义 Python 逻辑整合到链中？
answer:
  mode: rubric
  reference_answer: |-
    RunnableLambda 是连接自定义Python代码与LCEL管道的万能胶水。任何函数（同步或异步）包装后即可成为Runnable。

    ```python
    from langchain_core.runnables import RunnableLambda

    def validate_and_clean(input_data: str) -> str:
        # 去除首尾空白，替换特定敏感词等
        cleaned = input_data.strip().replace("敏感词", "***")
        if len(cleaned) < 2:
            raise ValueError("Input too short")
        return cleaned

    clean_runnable = RunnableLambda(validate_and_clean)

    chain支持异步：如果函数是 async，可以用 RunnableLambda(func, afunc=async_func) 指定异步版本。
    注意：RunnableLambda内部的函数输入和输出应该保持简单类型（如字符串、字典），因为这是链间数据交换的通用格式。
    9. 如果将多个链并发执行而不是串行，应该用什么方式？写出代码示例。
    使用 RunnableParallel（或 RunnableMap）可以实现多个链的并发执行。它接受一个字典，键为分支名称，值为一个Runnable。框架会利用线程池或异步协程同时执行所有分支，然后收集结果合并为一个字典输出。
    示例：并发调用多个模型，然后汇总答案。 = clean_runnable | prompt | model | parser
    ```


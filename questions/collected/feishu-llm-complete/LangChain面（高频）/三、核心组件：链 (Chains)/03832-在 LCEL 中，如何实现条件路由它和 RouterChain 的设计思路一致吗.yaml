content:
  prompt: 在 LCEL 中，如何实现条件路由？它和 RouterChain 的设计思路一致吗？
answer:
  mode: rubric
  reference_answer: "在 LCEL 中，我们使用 RunnableBranch（或 RunnableLambda）来实现条件路由，其设计思想与
    RouterChain 完全一致，但实现更简洁、灵活。\n\n\U0001F4DC 示例：根据用户查询类别路由到不同链\n\n```python\nfrom
    langchain_core.runnables import RunnableBranch, RunnableLambda\nfrom langchain_core.prompts
    import ChatPromptTemplate\n\n# 1. 定义分类函数\ndef classify(input_dict):\n    query
    = input_dict[\"query\"]\n    if \"翻译\" in query:\n        return \"translate\"\n
    \   elif \"摘要\" in query:\n        return \"summary\"\n    elif \"问答\" in query
    or \"?\" in query:\n        return \"qa\"\n    else:\n        return \"default\"\n\n#
    2. 定义各分支的处理链\ntranslate_chain = ChatPromptTemplate.from_template(\"翻译成英文：{query}\")
    | model\nsummary_chain = ChatPromptTemplate.from_template(\"总结：{query}\") | model\nqa_chain
    = ChatPromptTemplate.from_template(\"回答问题：{query}\") | model\ndefault_chain =
    ChatPromptTemplate.from_template(\"回答：{query}\") | model\n\n# 3. 使用 RunnableBranch
    实现路由\nbranch = RunnableBranch(\n    (lambda x: classify(x) == \"translate\", translate_chain),\n
    \   (lambda x: classify(x) == \"summary\", summary_chain),\n    (lambda x: classify(x)
    == \"qa\", qa_chain),\n    default_chain  # 默认分支\n)\n\n# 4. 调用\nresult = branch.invoke({\"query\":
    \"请把'你好世界'翻译成英文\"})\n```\n\n\U0001F500 更优雅的方式：使用路由 LLM\n\n```python\nrouter_prompt
    = ChatPromptTemplate.from_template(\"\"\"\n根据用户输入，输出一个操作类别（只输出类别名）：\n- translate：用户要求翻译\n-
    summary：用户要求摘要\n- qa：用户问问题\n\n用户输入：{query}\n类别：\"\"\")\n\nrouter_chain = router_prompt
    | model | StrOutputParser()\n\ndef route_to_chain(input_dict):\n    category =
    router_chain.invoke(input_dict)\n    if category == \"translate\":\n        return
    translate_chain.invoke(input_dict)\n    elif category == \"summary\":\n        return
    summary_chain.invoke(input_dict)\n    elif category == \"qa\":\n        return
    qa_chain.invoke(input_dict)\n    else:\n        return default_chain.invoke(input_dict)\n\nfull_chain
    = RunnableLambda(route_to_chain)\n```\n\n\U0001F517 设计思路对比：\n\n- 旧版 RouterChain：将路由逻辑封装在特定类中，通过配置文件或代码定义路由规则，组件化程度高但抽象层次多，代码量大。\n\n-
    LCEL RunnableBranch：将路由规则直接表达为“条件-分支”对，与 Python 的 if-elif-else 逻辑本质相同，学习成本低。所有的链都是标准
    Runnable，可任意组合、测试、复用。\n\n\U0001F6E0️ 结论：LCEL 的条件路由是 RouterChain 思想的现代化、轻量化实现，完美诠释了“可组合性”的设计哲学。推荐在项目中使用
    LCEL 分支来实现条件路由。"

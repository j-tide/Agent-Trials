content:
  prompt: "\U0001F4BB 解释“LLMBashChain”这种高级链：它怎样让 LLM 写出并执行 bash 命令？"
answer:
  mode: rubric
  reference_answer: "LLMBashChain 是一个实验性的、极具危险性的链，它允许 LLM 生成 Bash 命令并在你的系统上实际执行。它主要用于自动化服务器管理、数据分析等需要与操作系统交互的场景。\n\n\U0001F504
    工作流程：\n\n- 用户提出一个自然语言请求，如“列出当前目录下最大的5个文件”。\n\n- LLM 生成对应的 Bash 命令，例如 ls -lhS |
    tail -5。\n\n- 该命令被提交到系统 Shell 执行。\n\n- 执行结果（标准输出和错误）被捕获，返回给 LLM。\n\n- LLM 根据命令输出生成最终的自然语言回答，如“最大的5个文件是：...”。\n\n⚠️
    安全警告：这极其危险，因为 LLM 可能生成破坏性命令（rm -rf /），或者被注入恶意指令。绝对不要在未隔离的环境中使用。LangChain 文档强烈建议在沙箱（Docker容器）中运行，并设置严格的权限。\n\n\U0001F6E0️
    内部实现简析：\nLLMBashChain 内部使用了 BashProcess 工具（基于 subprocess），并通过 Agent 框架让 LLM 决定是否调用该工具。大致逻辑如下：\n\nfrom
    langchain.tools import Tool\nfrom langchain.utilities import BashProcess\n\nbash
    = BashProcess()\nbash_tool = Tool(name=\"Bash\", func=bash.run, description=\"执行Bash命令并返回输出\")\n\n#
    然后创建Agent，将bash_tool作为唯一工具。\n\nLLM 生成的命令会经过验证（可选），然后执行。你可以通过 BashProcess 的参数限制可执行命令，或使用
    return_err=True 捕获错误。\n\n✅ 适用场景：\n\n- 自动化运维（需严格审计）\n\n- 数据分析流水线\n\n- 教学演示\n\n\U0001F6E1️
    防护措施：\n\n- 始终在 Docker 容器内运行。\n\n- 限制可用的 Shell 命令（白名单）。\n\n- 要求用户确认（input(\"是否执行？(y/n)\")）。\n\n-
    审计所有命令日志。\n\n---"

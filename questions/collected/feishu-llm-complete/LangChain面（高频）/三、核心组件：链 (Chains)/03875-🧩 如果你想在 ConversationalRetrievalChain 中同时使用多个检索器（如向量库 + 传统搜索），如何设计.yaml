content:
  prompt: "\U0001F9E9 如果你想在 ConversationalRetrievalChain 中同时使用多个检索器（如向量库 + 传统搜索），如何设计？"
answer:
  mode: rubric
  reference_answer: |-
    要实现多检索器混合，核心思路是并行检索、合并去重、统一排序。LangChain 本身支持 EnsembleRetriever 组合多个检索器，但也可以自定义更复杂的融合逻辑。

    设计方案

    - 初始化多个检索器

    - 组合检索器

    from langchain.retrievers import EnsembleRetriever
    ensemble_retriever = EnsembleRetriever(
        retrievers=[vector_retriever, keyword_retriever],
        weights=[0.7, 0.3]   # 语义检索权重更高
    )

    - 嵌入 ConversationalRetrievalChain

    高级定制：分阶段检索

    如果希望更精细控制，比如先关键词检索缩小范围，再语义检索精排，或者对某些领域使用专用检索器，可以自定义一个 BaseRetriever 子类，在其中实现调度逻辑。

    设计注意事项

    - 去重：相同内容可能来自不同检索器，需要去除重复文档（EnsembleRetriever 默认处理）。

    - 延迟：多路检索增加了耗时，可考虑异步并发调用两个检索器，然后等待所有结果返回后合并。

    - 排序加权：根据实际业务调整各检索器的权重，必要时可通过评估集验证。


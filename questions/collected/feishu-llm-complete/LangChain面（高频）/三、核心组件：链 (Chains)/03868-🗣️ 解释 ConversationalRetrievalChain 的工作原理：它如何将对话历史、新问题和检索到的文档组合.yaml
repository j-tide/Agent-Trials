content:
  prompt: "\U0001F5E3️ 解释 ConversationalRetrievalChain 的工作原理：它如何将对话历史、新问题和检索到的文档组合？"
answer:
  mode: rubric
  reference_answer: |-
    ConversationalRetrievalChain 是 LangChain 中实现多轮对话式检索问答的核心链。它解决了普通检索问答不能记忆对话上下文的问题。

    工作流程

    [图片内容未导入]

    三部分组合逻辑

    - 对话历史：原始的用户-助手多轮对话文本。它保留在最终 QA 的 Prompt 中，让 LLM 知道讨论的来龙去脉，以便生成连贯的回答。

    - 新问题：当前用户的最新提问。它首先被用于生成检索查询，然后在最终 QA 中结合历史和文档给出答案。

    - 检索到的文档：由 Retriever 根据独立查询从知识库中搜索到的相关文本片段。它们作为背景知识注入 Prompt，使 LLM 能够基于事实给出有根据的回答。

    关键 Prompt 示例

    对话历史：
    {chat_history}

    根据以上对话历史，请将下面这个问题重写为一个独立的、完整的搜索查询：
    {question}

    搜索查询：

    通过这个“重写查询”的步骤，模型会将指代（“他”、“那个”、“上次说的”）消解为具体的实体，并将上下文融入查询中，从而极大地提高检索的准确性。

    图示：
    [History+Question] → (LLM) → Refined Query → Retriever → Docs
    ↓
    [History+Question+Docs] → (LLM) → Final Answer

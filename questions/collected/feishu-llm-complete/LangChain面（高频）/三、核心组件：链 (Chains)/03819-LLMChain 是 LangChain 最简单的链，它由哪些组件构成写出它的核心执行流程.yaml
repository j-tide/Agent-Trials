content:
  prompt: LLMChain 是 LangChain 最简单的链，它由哪些组件构成？写出它的核心执行流程。
answer:
  mode: rubric
  reference_answer: "LLMChain 是 LangChain 中最基础、最经典的链。虽然目前官方已推荐使用更简洁的 LCEL 表达式，但 LLMChain
    仍是理解链式调用思想的绝佳起点。\n\n\U0001F9E9 核心组件：\n\n一个标准的 LLMChain 由三个核心组件构成：\n\n- PromptTemplate（提示模板）：负责将用户输入或其他变量格式化为一个结构化的
    Prompt 字符串或消息列表。\n\n- LLM/ChatModel（语言模型）：接收 Prompt 并生成文本响应，可以是文本补全模型或聊天模型。\n\n-
    （可选）OutputParser（输出解析器）：对模型输出进行解析和结构化处理，将纯文本转换为程序可用的格式。\n\n⚙️ 核心执行流程：\n当调用 chain.invoke(input_dict)
    时，LLMChain 内部执行以下步骤：\n\n- Prompt 格式化：将传入的键值对字典（如 {\"topic\": \"量子计算\"}）传递给 PromptTemplate，根据模板中的占位符生成最终的
    Prompt 字符串或消息列表。\n\n- 模型调用：将格式化后的 Prompt 传递给 LLM/ChatModel，调用模型 API 并等待模型生成响应文本。\n\n-
    （可选）输出解析：如果配置了 OutputParser，将模型生成的原始文本传递给解析器，解析器按照预定义规则提取结构化数据。\n\n- 返回结果：将最终的响应（解析后的结构化数据或原始文本）返回给调用方。\n\n\U0001F4DC
    代码示例：\n\n```python\nfrom langchain.prompts import PromptTemplate\nfrom langchain_openai
    import ChatOpenAI\nfrom langchain.chains import LLMChain\n\nprompt = PromptTemplate.from_template(\"请用{language}写一段关于{topic}的介绍。\")\nmodel
    = ChatOpenAI(model=\"gpt-4o\", temperature=0.7)\n\nchain = LLMChain(prompt=prompt,
    llm=model)\nresult = chain.invoke({\"language\": \"中文\", \"topic\": \"机器学习\"})\n#
    等价于\n# chain = prompt | model\n```\n\n\U0001F4DD 内部伪代码：\n\n```python\nclass LLMChain:\n
    \   def __init__(self, prompt, llm, output_parser=None):\n        self.prompt
    = prompt\n        self.llm = llm\n        self.output_parser = output_parser\n\n
    \   def invoke(self, inputs):\n        formatted_prompt = self.prompt.format(**inputs)\n
    \       response = self.llm.invoke(formatted_prompt)\n        if self.output_parser:\n
    \           return self.output_parser.parse(response)\n        return response\n```\n\n虽然
    LLMChain 的实现很简单，但它清晰地体现了 LangChain 的核心思想：Prompt + Model + OutputParser 的组合模式，为更复杂的链打下了基础。"

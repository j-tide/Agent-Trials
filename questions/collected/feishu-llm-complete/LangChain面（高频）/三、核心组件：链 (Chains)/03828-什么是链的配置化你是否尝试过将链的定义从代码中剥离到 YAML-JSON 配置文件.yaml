content:
  prompt: 什么是“链的配置化”？你是否尝试过将链的定义从代码中剥离到 YAML/JSON 配置文件？
answer:
  mode: rubric
  reference_answer: |-
    链的配置化指将链的结构、Prompt模板、模型参数等从代码中分离，存储为外部配置文件（YAML、JSON），在运行时动态加载和组装。这实现了模板化和运维分离。

    ### 10.1 实现方式

    LangChain支持通过 load_prompt, load_chain 等函数加载YAML/JSON文件。你可以将所有Prompt定义在YAML中，链的组装逻辑也可以写成配置文件（例如，定义链的类型和依赖组件）。

    示例：prompts.yaml

    ```yaml
    translate_prompt:
      _type: chat
      input_variables: [text]
      messages:
        - role: system
          content: 你是一个翻译助手。
        - role: user
          content: "请将以下文本翻译成英文：{text}"
    ```

    加载：

    ```python
    from langchain_core.prompts import load_prompt
    prompt = load_prompt("prompts.yaml", "translate_prompt")
    ```

    对于完整的链，可以使用langchain.chains.load_chain或直接通过配置文件定义链的序列，但在LCEL时代，更推荐将链的组装逻辑保留在代码中，因为LCEL表达式本身简洁且类型安全，而将可变部分（如Prompt、模型参数、工具列表）剥离到配置文件。

    ### 10.2 好处

    - 非技术人员（如Prompt工程师）可独立修改提示词。

    - 不同环境（开发/测试/生产）使用不同的配置。

    - 版本控制与回滚更清晰。

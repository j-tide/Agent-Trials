content:
  prompt: "\U0001F501 在 ConversationalRetrievalChain 中，如果用户连续提问，如何把历史问题和回答作为新检索的上下文？"
answer:
  mode: rubric
  reference_answer: "ConversationalRetrievalChain 已经内置了将对话历史融入检索查询的机制——condense_question_prompt。这是解决“指代消解”和“上下文补充”的核心。\n\n\U0001F504
    其工作方式为：\n\n- 当用户提出新问题 question 时，链不会直接将 question 发送给检索器。\n\n- 它首先调用 LLM，使用 condense_question_prompt
    将对话历史 + question 重写为一个独立的、自包含的检索查询。\n\n- 然后，用这个重写后的查询去检索文档。\n\n- 最后，将原始对话历史、question
    和检索到的文档一并送入最终的回答链。\n\n\U0001F4DD 默认 Prompt 剖析\n\n给定以下对话和一个后续问题，请将后续问题重写为一个独立的、不需要上下文就能理解的问题。\n\n对话历史：\n{chat_history}\n\n后续问题：{question}\n\n独立问题：\n\nLLM
    会自动把 它、他、那个 等代词替换为历史中提到的实体，并补充省略的约束条件。\n\n\U0001F680 如果要更深度地利用历史\n你完全可以自定义这个 Prompt。例如，不仅消解指代，还提取历史中的关键约束（“我要便宜的”），或者将历史回答作为新的检索条件（“结合上次推荐的餐厅，再找类似风格的”）。只需修改
    condense_question_prompt 模板即可。\n\n代码示例（自定义更积极的查询重写）：\n\ncustom_condense_prompt
    = PromptTemplate.from_template(\n    \"根据以下对话历史，将用户的后续问题重写为一个详细的搜索查询，包含历史中提到的所有关键信息（如人名、地点、偏好等）。\"\n
    \   \"\\n\\n对话历史:\\n{chat_history}\\n\\n后续问题: {question}\\n\\n详细的搜索查询:\"\n)\nqa
    = ConversationalRetrievalChain.from_llm(\n    llm,\n    retriever,\n    condense_question_prompt=custom_condense_prompt,\n
    \   ...\n)\n\n这样检索时就能携带更多上下文，提高召回精度。\n\n---"

content:
  prompt: "\U0001F300 与 MapReduce 相比，RefineChain 的迭代式摘要有什么优缺点？"
answer:
  mode: rubric
  reference_answer: |-
    RefineChain 是一种顺序处理的摘要策略。它不是先并行处理所有块再合并，而是像“滚雪球”一样，每次读入一个新块，与前面已积累的摘要一起输入 LLM，逐步精炼成一个最终摘要。

    流程

    初始摘要 = 空
    for chunk in chunks:
        当前摘要 = LLM(当前摘要 + chunk)   // Refine
    最终摘要 = 当前摘要

    优点

    - 上下文连贯性强：每次精炼时，LLM 都能看到之前所有内容的摘要，因此能更好地捕捉文档的全局结构、故事线或逻辑链，不会因分块而丢失重要关联。

    - 信息融合深度高：迭代式地不断更新摘要，允许模型进行更复杂的推理和综合，往往能生成质量更高的摘要。

    - 适用于结构化文本：对于小说、论文等有内在逻辑连贯性的内容，Refine 能更好地保留情节和因果关系。

    缺点

    - 速度慢、无法并行：必须顺序处理每个块，总耗时等于所有块的处理时间之和，无法利用并发加速。对于大量文档来说极其缓慢。

    - API 调用次数多：假设有 N 个块，则需调用约 N 次（第一次生成初始摘要，后续每个块一次 Refine），与 MapReduce 的 (N+1) 次相当，但无法并行。

    - 误差累积风险：如果早期块的摘要出现偏差，这个错误可能会在后续迭代中被放大，因为每次精炼都是基于之前的摘要。

    对比 MapReduce

    [嵌入表格未展开]

    图标：Refine 像流水线：Chunk1 -> Summary1 -> +Chunk2 -> Summary2 -> ... -> Final Summary
    MapReduce：Chunk1,Chunk2,... -> 并行 Summaries -> Merge -> Final

content:
  prompt: 解释 SimpleSequentialChain 和 SequentialChain 的区别，以及各自的适用场景。
answer:
  mode: rubric
  reference_answer: "当我们需要将多个链串联，形成更复杂的处理流程时，就会用到 SequentialChain（顺序链）。LangChain 提供了两种顺序链。\n\n\U0001F517
    SimpleSequentialChain：\n\n- 最简单的顺序链，将多个子链首尾相连。\n\n- 数据传递规则：上一个链的单一输出，直接作为下一个链的唯一输入。\n\n-
    局限性：要求每个子链只有一个输入变量和一个输出变量，无法处理多变量传递。\n\n\U0001F517 SequentialChain：\n\n- 更强大、更灵活的顺序链。\n\n-
    数据传递规则：允许显式指定每个子链的输入变量和输出变量。可以组合多个变量，将前面链的多个输出和外部输入一起传递给后面的链。\n\n- 核心能力：解决了多变量传递和复杂输入输出映射问题。\n\n\U0001F4CA
    对比总结：\n\n[嵌入表格未展开]\n\n\U0001F3AF 适用场景：\n\n- SimpleSequentialChain：当整个流程是线性的，且上下游之间只有一种数据传递关系时使用。例如，输入主题→生成文章→翻译成英文。\n\n-
    SequentialChain：当需要从上游链提取多个输出，或需要将全局参数注入下游链时使用。例如，在合同分析中，先提取当事人信息，再结合“风险偏好”参数进行风险评估。\n\n⚠️
    注意：这两个类属于旧版 Chain API，在 LCEL 中可以通过 RunnableSequence 和 RunnableParallel 更优雅地实现类似功能。"

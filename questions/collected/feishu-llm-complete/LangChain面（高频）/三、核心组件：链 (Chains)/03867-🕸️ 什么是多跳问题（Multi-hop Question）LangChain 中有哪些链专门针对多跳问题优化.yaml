answer:
  mode: rubric
  reference_answer: "\U0001F578️ 多跳问题 是指需要综合多个不同信息源，经过多步推理才能回答的问题。例如：“《哈利波特》中，哈利的教父小天狼星布莱克，他的堂姐的女儿是谁？”
    回答需要：1）找到小天狼星布莱克；2）找到他的堂姐贝拉特里克斯；3）找到贝拉特里克斯的女儿戴尔菲。这需要多次检索和逻辑跳转。\n\nLangChain 中的优化链\n\nLangChain
    本身没有一个叫“MultiHopChain”的单一类，但提供了一些组合链和工具，可以构建多跳推理流程：\n\n- MultiPromptChain / RouterChain：将复杂问题路由到不同的专业链。例如，一个链负责提取实体，一个链负责查询关系。\n\n-
    SequentialChain：自定义多个步骤的链。如 Step1：提取问题中的实体；Step2：搜索该实体；Step3：从结果中提取下一个实体；Step4：再次搜索。\n\n-
    ConversationalRetrievalChain：结合历史进行检索，适合对话式多跳。\n\n- ReAct 模式：使用 Agent + Tools，让
    LLM 自主决定何时检索、检索什么，并观察结果后决定下一步。这是目前处理复杂推理最灵活的方式。\n\n- Self-Ask with Search：一种特殊的
    Agent，明确要求 LLM 分解问题为子问题，并对每个子问题执行搜索，最后合并答案。LangChain 中通过 create_self_ask_with_search_agent
    实现。\n\n\U0001F4A1 实战选择：\n\n- 如果问题可预测，用 SequentialChain 硬编码流程。\n\n- 如果问题多变，用 ReAct
    Agent 挂接检索工具，让 LLM 自己规划跳数。这是最通用、最强大的多跳解决方案。\n\n- 也可以结合 GraphCypherQAChain（如果数据在知识图谱中），天然支持多跳关系查询。\n\n---"

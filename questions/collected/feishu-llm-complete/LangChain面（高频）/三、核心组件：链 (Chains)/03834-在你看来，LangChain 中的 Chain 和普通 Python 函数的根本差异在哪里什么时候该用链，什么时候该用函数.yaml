answer:
  mode: rubric
  reference_answer: |-
    ### 根本差异

    [嵌入表格未展开]

    ### 何时用 Chain？

    - 当应用包含多个LLM调用或LLM+工具+检索的复杂流程时。

    - 需要生产级的监控、日志、容错时。

    - 需要动态路由、并行执行、流式输出等高级功能时。

    - 团队协作，希望复用标准化的组件。

    ### 何时用普通函数？

    - 逻辑极其简单，只是单次API调用 + 简单字符串处理。

    - 对性能有极致要求，不想引入任何框架开销。

    - 快速原型验证，尚未确定长期架构。

    - 核心逻辑与LLM无关的纯计算任务。

    最佳实践：用 Chain 编排高层业务流程（“做什么”），用 RunnableLambda 包裹的普通函数处理自定义的数据清洗、格式转换等细节（“怎么做”）。这样既能享受框架的强大功能，又不失灵活性。

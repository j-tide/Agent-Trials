content:
  prompt: 如果你有一个路由链，但下游链数量很多（上百个），怎样优化路由性能？
answer:
  mode: rubric
  reference_answer: |-
    当路由链下游挂载了上百个目标链时，传统的基于LLM的语义路由（LLMRouterChain）会成为性能瓶颈——每次路由需要一次LLM调用，延迟高且成本昂贵。优化方案从路由算法和系统架构两个维度展开。

    ### 1.1 使用基于嵌入的快速路由

    核心思想：预先为每个目标链计算其“触发条件”的文本嵌入（例如，每个链的典型用户查询样本），存入向量数据库。当真实查询到来时，计算其嵌入向量，通过向量相似度检索最匹配的目标链。

    ```python
    from langchain.chains.router import EmbeddingRouterChain
    from langchain_openai import OpenAIEmbeddings
    from langchain_chroma import Chroma

    # 为每个链准备示例查询
    chain_examples = {
        "translate_chain": ["翻译成英文", "用英语怎么说", "请翻译"],
        "summary_chain": ["总结", "摘要", "概括"],
        "qa_chain": ["什么是", "如何", "为什么"],
        # ... 上百个链
    }

    # 创建嵌入路由器
    router = EmbeddingRouterChain.from_names_and_descriptions(
        names_and_descriptions={name: " ".join(examples) for name, examples in chain_examples.items()},
        embedding=OpenAIEmbeddings(),
        vectorstore_cls=Chroma,
        top_k=1  # 选择最相似的一个
    )
    ```

    这种方案的延迟仅为向量检索时间（毫秒级），且不消耗LLM Token。

    ### 1.2 分层路由

    如果链数量极大，单一向量检索可能不够精确。可以设计两级路由：

    - 第一级：使用快速规则或小模型（如fastText）进行粗粒度分类，将查询分到某个“域”（如“客服”、“技术”、“销售”）。

    - 第二级：在域内使用向量检索或轻量LLM进行细粒度匹配。
    分层设计有效降低了单级路由的检索空间，提升了准确率和速度。

    ### 1.3 缓存路由决策

    对于相似的重复查询，可以缓存其路由结果。实现方式：

    - 使用内存缓存（如 functools.lru_cache）或在共享缓存（Redis）中存储 <query_hash, chain_name>。

    - 结合语义缓存：如果新查询与某个已缓存查询的语义相似度超过阈值，直接复用路由决策，避免重复计算。

    ### 1.4 使用轻量级分类模型替代LLM

    如果链的类别相对固定，可以训练一个轻量级文本分类器（如基于BERT的蒸馏模型、逻辑回归等），直接根据查询文本预测目标链。推理速度极快，成本几乎为零。这相当于把“路由”从LLM推理降级为传统模型推理。

    ### 1.5 在LCEL中动态路由

    LCEL本身不提供高级路由器，但可以通过 RunnableLambda 自定义动态路由逻辑，在其中集成向量检索或分类器，达到与上述方案相同的效果。

    ```python
    from langchain_core.runnables import RunnableLambda

    def dynamic_router(input_dict):
        query = input_dict["query"]
        # 调用向量检索，找到最佳链名
        best_chain_name = vector_search(query)  # 自己实现
        chain = chain_map[best_chain_name]
        return chain.invoke(input_dict)

    router_chain = RunnableLambda(dynamic_router)
    ```

    小结：优化路由性能的关键是减少或避免LLM调用，利用向量搜索、缓存、轻量模型等手段将路由决策成本降至最低。

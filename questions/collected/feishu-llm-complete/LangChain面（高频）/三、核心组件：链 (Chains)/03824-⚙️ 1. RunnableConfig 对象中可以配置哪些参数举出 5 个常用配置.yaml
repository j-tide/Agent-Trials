content:
  prompt: "⚙️ 1. RunnableConfig 对象中可以配置哪些参数？举出 5 个常用配置。"
answer:
  mode: rubric
  reference_answer: |-
    RunnableConfig 是 LangChain 里贯穿整个执行生命周期的“上下文口袋”，几乎所有你想对一条链或一个模型做的运行时控制，都可以塞进这个字典里。它不是固定的配置类，而是一个 TypedDict 风格的灵活结构，但有几个官方定义且被框架内部严格尊重的字段。下面是 5 个我每天都会打交道的配置项：

    ① callbacks
    这是最核心的配置。你可以传入一个 CallbackManager、BaseCallbackHandler 的列表，或者直接用 LangChainTracer 把执行轨迹发到 LangSmith。比如：

    ```python
    config = {"callbacks": [MyCustomHandler()]}
    chain.invoke(input, config)
    ```

    不管你的链多深，只要正确向下传递 config，所有子调用都会触发同样的回调，是实现全链路追踪的基础。

    ② tags
    给本次调用打上字符串标签，形如 ["production", "user-feedback"]。这些标签会随每个执行事件一起被发送到回调系统（包括 LangSmith）。后续在监控面板里，你可以按标签筛选、聚合，快速区分实验流量、生产流量、不同客户版本等。一个经常被忽略的用法：在 A/B 测试时，把实验分组作为 tag，就可以对比不同 prompt 或模型版本的性能。

    ③ metadata
    与 tags 类似，但它是键值对形式，适合承载结构化的上下文信息，比如 {"user_id": "123", "session_id": "abc", "source": "mobile_app"}。metadata 也会被传递给所有 callback 事件。在日志分析和成本核算时非常有用——你可以通过 metadata 把 LLM 调用归因到具体用户或业务线。

    ④ run_name
    给本次执行起一个人类可读的名字，例如 "translate-and-sentiment-pipeline"。这个名字会出现在 LangSmith trace 的根节点上，以及许多日志输出中，帮助你在大量 trace 中快速定位。如果不指定，LangChain 会自动生成类似 RunnableSequence_1 这种毫无意义的名字，排查问题时非常痛苦。

    ⑤ max_concurrency
    限制同一时刻对此 Runnable 的并发调用数量。对于有速率限制的 LLM API 或者资源有限的下游服务，这个配置就是保命符。比如你通过 batch 同时处理 100 个请求，但 LLM 只允许 10 个并发，设置 max_concurrency=10 就能避免 429 错误。后面会详细说它的调度机制。

    其他值得一提的还有 recursion_limit（防止死循环，默认 25）、configurable（给 Runnable 内部注入动态参数，比如 temperature）、timeout 等。所有这些配置通过 RunnableConfig 在一层层的 invoke/batch/stream 调用中传递，构建了 LangChain 可控可观测的运行时环境。


content:
  prompt: LangChain 的 @chain 装饰器能做什么？它如何将普通函数转为 Runnable？
answer:
  mode: rubric
  reference_answer: |-
    @chain 装饰器可以将一个普通的Python函数转换为Runnable，使该函数能直接使用 invoke, stream, batch 等标准接口，并能通过 | 与其他Runnable组合。

    ```python
    from langchain_core.runnables import chain

    @chain
    def my_custom_chain(inputs: dict) -> dict:
        query = inputs["query"]
        # 在此执行任意Python逻辑
        result = process_query(query)
        return {"output": result}

    # 现在 my_custom_chain 就是一个 Runnable
    chain = prompt | model | my_custom_chain | parser
    result = chain.invoke({"query": "你好"})
    ```

    本质：@chain 内部将函数包装为 RunnableLambda，并自动处理输入输出类型推断，使其符合Runnable协议。这使得开发者可以无缝地将现有业务逻辑融入LangChain的链式调用中。

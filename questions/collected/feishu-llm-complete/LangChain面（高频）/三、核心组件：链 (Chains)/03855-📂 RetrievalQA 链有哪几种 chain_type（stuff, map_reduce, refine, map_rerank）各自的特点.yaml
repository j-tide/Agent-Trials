content:
  prompt: "\U0001F4C2 RetrievalQA 链有哪几种 chain_type？（stuff, map_reduce, refine, map_rerank）各自的特点？"
answer:
  mode: rubric
  reference_answer: |-
    RetrievalQA 链是 LangChain 中实现检索增强生成（RAG）的经典链，它支持四种 chain_type，对应不同的文档组合策略。选择哪个取决于文档数量和 token 限制。

    四种链类型对比

    [嵌入表格未展开]

    详细特点

    - stuff：就像一个“全塞进去”的口袋。Prompt 里包含所有检索到的文档和用户问题。LLM 可以一次看到所有信息，因此能最好地捕捉文档间的联系。但一旦文档总 token 超限，就无法使用。

    - map_reduce：前面已详述。关键在于并行，但跨块信息容易丢失。

    - refine：前面已详述。串行精炼，质量高但慢。

    - map_rerank：这是一个特殊的链。它对每个检索文档调用 LLM，要求 LLM 不仅回答问题，还要输出一个置信度分数（如 0-100）。然后选择分数最高的那份回答作为最终答案。它不进行文档间的信息融合，只是“挑一个最好的”。

    如何选择？

    - 如果检索出的文档很少（<3 个片段，总 token < 窗口）→ stuff。

    - 如果文档非常多，且相对独立，对速度有要求 → map_reduce。

    - 如果文档有内在连贯性（如长文、书籍），追求高质量摘要/答案 → refine。

    - 如果只是想从一堆候选文章中找最相关的单一答案，且希望模型给出自信度 → map_rerank。

    图例：
    stuff: [Doc1, Doc2, Doc3] + Question → LLM → Answer
    map_reduce: [Doc1, Doc2, Doc3] → (Map) → [Partial Answers] → (Reduce) → Final Answer
    refine: Doc1 → Ans1 → +Doc2 → Ans2 → +Doc3 → Final Answer
    map_rerank: [Doc1, Doc2, Doc3] → 各自评分 → 选最高分的答案

content:
  prompt: "⚖️ 如果要做一个“法律文书摘要”的链，你会选择哪种链模式？为什么？"
answer:
  mode: rubric
  reference_answer: "法律文书（如判决书、起诉书）通常篇幅长、结构复杂、术语专业，且对信息的准确性和完整性要求极高。我会选择 混合链策略，核心是
    Recursive RefineChain 结合自定义预处理。\n\n\U0001F4DA 为什么不用 Stuff 或 MapReduce？\n\n- Stuff：法律文书轻易超过
    token 限制，不可能。\n\n- MapReduce：会将文书割裂成独立片段并行摘要，必然丢失案件逻辑链条（原告-被告-争议焦点-判决推理），导致摘要碎片化，遗漏关键因果关系。\n\n-
    Refine：虽然能保留逻辑连贯性，但对于极长文书（几百页），Refine 的串行速度过慢，且随着迭代，模型可能会“遗忘”或过度压缩早期信息。\n\n\U0001F6E0️
    推荐方案：分段总结 + 分层提炼\n\n- 智能切分：不按固定 token 切，而是利用法律文书的自然结构（按章、节、条款）或通过一个轻量级模型自动识别语义边界来切分。这样每个块保持相对完整的主题。\n\n-
    第一层：结构感知摘要：对每个块，使用定制 Prompt 进行摘要，要求提取特定要素（如“本段涉及当事人”、“核心争议”、“法律依据”），而不是泛泛总结。\n\n-
    第二层：分层融合：将第一层的要素摘要按逻辑分组（如将所有关于同一当事人的摘要合并），然后对这些组合使用 Refine 链生成当事人相关部分的概要。\n\n-
    第三层：全局 Refine：将第二层的各部分概要，按照法律文书的逻辑顺序（例如：引言→事实→理由→判决）拼接，最后用一次 Refine（或直接用 Stuff
    如果此时总长度允许）生成最终摘要，并要求 LLM 严格遵循输出格式。\n\n\U0001F4BB 示例 Prompt 片段（第一层）：\n\n你是一名专业法律助手。请阅读以下法律文书片段，并提取以下信息：\n-
    涉及的当事人（原告、被告等）\n- 核心法律争议点\n- 引用的关键法条\n- 判决结果（如有）\n如果某条信息未出现，写“无”。\n\n文本：{chunk}\n\n这种要素抽取+分层汇总的方法，比单纯让
    LLM 写连贯摘要更可控，也更容易后处理验证。\n\n\U0001F31F 最终效果：生成的摘要既保留了全局逻辑，又能准确提炼法律要素，且由于分层处理，可以并行加速部分阶段。\n\n---"

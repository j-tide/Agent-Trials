content:
  prompt: "\U0001F4DC MapReduceChain 是如何处理超长文本的？它分为哪两个阶段？"
answer:
  mode: rubric
  reference_answer: |-
    MapReduceChain 是 LangChain 中用于处理超长文本（超出 LLM 上下文窗口限制）的一种文档合并与问答链。核心思想借鉴了大数据领域的 MapReduce 计算模型——先将大问题拆成小问题并行解决（Map），再汇总结果（Reduce）。

    流程图示

    [图片内容未导入]

    Map 阶段

    - 将输入的全部文档或超长文本按照 LLM 的 max_tokens 限制自动分割成多个小块（chunks），保证每个 chunk 的 token 数不超出模型窗口。

    - 对每个 chunk 独立且并行地调用 LLM，使用用户指定的 Map Prompt。典型的 Prompt 是："请对以下文本进行总结：{text}"。Map 阶段的输出是各 chunk 的局部摘要或答案片段。

    Reduce 阶段

    - 将所有 Map 阶段输出的局部结果拼接在一起，作为 Reduce Prompt 的输入。

    - 再次调用 LLM 一次，使用用户指定的 Reduce Prompt。典型的 Prompt 是："以下是对不同部分内容的总结，请综合这些信息，给出一个完整的最终答案：{summaries}"。

    - 如果 Reduce 阶段的输入本身仍然超长，LangChain 支持递归 Reduce，即对局部结果也进行 MapReduce，直到能在一个窗口内完成。

    设计要点

    - 并发控制：Map 阶段可以充分利用并发来加速处理，尤其是对于大批量文档。

    - 信息损失：Map 阶段各自独立，可能导致跨块的上下文关联丢失。因此生成的摘要可能遗漏重要的全局关系。

    - 适用场景：适合对大量独立的文档集合做摘要、多文档问答、以及需要并行提速的场景。

    图标：长文本 -> [Chunk1, Chunk2, ..., ChunkN] -> (Map 并行) -> 局部结果 -> (Reduce) -> 最终结果

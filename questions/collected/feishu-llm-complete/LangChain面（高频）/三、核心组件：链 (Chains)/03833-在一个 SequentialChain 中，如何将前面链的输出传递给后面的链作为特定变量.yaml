content:
  prompt: 在一个 SequentialChain 中，如何将前面链的输出传递给后面的链作为特定变量？
answer:
  mode: rubric
  reference_answer: "在 SequentialChain 中，数据传递的关键在于显式声明 input_variables 和 output_variables。\n\n\U0001F4DC
    示例场景：\n\n- 链1：根据剧本生成影评（输出 review）。\n\n- 链2：将影评翻译成英文（输入 text，输出 translated）。\n\n-
    链3：提取英文影评中的情感关键词（输入 english_review，输出 keywords）。\n\n```python\nfrom langchain.chains
    import LLMChain, SequentialChain\nfrom langchain.prompts import PromptTemplate\n\n#
    链1：生成中文影评\nprompt1 = PromptTemplate.from_template(\"为电影《{movie}》写一段简短的影评。\")\nchain1
    = LLMChain(prompt=prompt1, llm=model, output_key=\"review\")\n\n# 链2：翻译成英文，注意输入变量是
    'text'\nprompt2 = PromptTemplate.from_template(\"将以下中文翻译成英文：{text}\")\nchain2
    = LLMChain(prompt=prompt2, llm=model, output_key=\"translated\")\n\n# 链3：提取关键词，输入变量需要和上级输出匹配\nprompt3
    = PromptTemplate.from_template(\"从以下英文影评中提取3个情感关键词：{english_review}\")\nchain3
    = LLMChain(prompt=prompt3, llm=model, output_key=\"keywords\")\n\n# 组装 SequentialChain\noverall_chain
    = SequentialChain(\n    chains=[chain1, chain2, chain3],\n    input_variables=[\"movie\"],
    \ # 初始输入变量\n    output_variables=[\"review\", \"translated\", \"keywords\"],  #
    最终输出变量\n    verbose=True\n)\nresult = overall_chain({\"movie\": \"流浪地球\"})\n```\n\n\U0001F527
    关键机制：\n\n- 链2 的 Prompt 模板中有占位符 {text}，SequentialChain 会自动将上游 chain1 的输出（键为 review）传递过来。变量名匹配是自动的，前提是上游的
    output_key 必须和下游 Prompt 中的占位符名称一致。如果名称不一致，可以通过中间变量重命名。\n\n- 链3 同理，Prompt 中的 {english_review}
    会自动匹配 chain2 的输出键 translated。\n\n⚙️ 传递多个变量：\n\n如果下游链需要多个输入（例如，既需要上游输出，也需要外部参数），只需在
    Prompt 中声明多个占位符，SequentialChain 会自动从已知变量中匹配。上游输出键和外部输入键会自动合并到可用变量池中。"

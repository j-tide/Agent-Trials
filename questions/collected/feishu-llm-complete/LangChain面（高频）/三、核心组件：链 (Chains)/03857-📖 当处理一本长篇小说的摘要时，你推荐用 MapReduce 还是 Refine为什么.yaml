content:
  prompt: "\U0001F4D6 当处理一本长篇小说的摘要时，你推荐用 MapReduce 还是 Refine？为什么？"
answer:
  mode: rubric
  reference_answer: |-
    强烈推荐 RefineChain。

    理由

    - 小说具有极强的叙事连贯性：人物、情节、伏笔、情感线索贯穿全文，不可割裂。MapReduce 的并行处理导致各块摘要独立生成，必然丢失这些关键关联。最终 Reduce 拼接成的摘要很可能像一堆情节片段的罗列，读起来支离破碎，丢失原著的文学魅力。

    - Refine 能够模拟“阅读-积累-更新”的认知过程：模型像一个读者，先读开头得到初始印象，再读后续章节，不断修正和丰富对整个故事的理解。这种方式产生的摘要能保留故事主线、人物发展和主题。

    - 质量优先于速度：对于单篇小说摘要，用户通常愿意等待更长时间来换取高质量的阅读体验。串行处理虽然在速度上吃亏，但最终摘要的质量远胜 MapReduce。

    如果有性能需求怎么办？

    如果小说极长（比如上百万字），且必须在短时间内完成，可以考虑改良的混合策略：

    - 先将小说按章节（自然分割点）切分，对每个章节独立使用 Refine 生成章节摘要。

    - 然后将这些章节摘要用 MapReduce 合并为整篇摘要。

    - 这样既能利用 Refine 保留章节内连贯性，又能借助 MapReduce 的并行性加速。但要注意，跨章信息仍可能丢失。

    推荐流程：
    小说 -> 按章节拆分 -> [各章 Refine] -> 章节摘要 -> (MapReduce 合并) -> 最终摘要

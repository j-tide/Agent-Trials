content:
  prompt: 你如何在链中插入一个“不改变数据，只做日志记录”的步骤？用 LCEL 怎么实现？
answer:
  mode: rubric
  reference_answer: |-
    这可以通过 RunnableLambda 包装一个原样返回输入的函数来实现。该函数内部完成日志记录。

    ```python
    from langchain_core.runnables import RunnableLambda
    import logging

    logger = logging.getLogger(__name__)

    def log_step(data):
        logger.info(f"Intermediate data: {data}")
        return data  # 关键：原样返回输入，不修改

    log_runnable = RunnableLambda(log_step)

    chain = prompt | model | log_runnable | parser
    ```

    log_runnable 被插入到管道中，接收上游输出，打印日志后将其透传给下游解析器，完全不影响数据流。

    更优雅的方式：使用 RunnablePassthrough 的 side_effect 功能（部分版本支持），专门用于执行副作用操作。

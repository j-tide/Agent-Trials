content:
  prompt: "\U0001F9E0 LangChain 中“Chain of Thought” (CoT) 一般如何通过 Prompt 实现？有没有现成的链？"
answer:
  mode: rubric
  reference_answer: "CoT 的本质是通过在 Prompt 中明确要求 LLM 展示推理步骤，从而激发其复杂推理能力。LangChain 中并没有一个叫
    CoTChain 的单独类，而是通过Prompt 模板和Agent 模式来实现。\n\n\U0001F4DD 通过 Prompt 实现 CoT 的几种方式：\n\n-
    零样本 CoT：在 Prompt 末尾加上 Let's think step by step。\n\nprompt = PromptTemplate.from_template(\n
    \   \"{question}\\n\\n请一步一步思考，详细写出你的推理过程，然后给出最终答案。\"\n)\n\n- 少样本 CoT：在 Prompt
    中提供几个带有完整推理步骤的示例。\n\n- 结构化 CoT：要求 LLM 输出 JSON 格式，包含 thought 和 action 字段，如 ReAct。\n\n\U0001F517
    现成的链或组件：\n\n- LLMChain：你只需传入自定义的 CoT Prompt 即可。\n\n- create_react_agent：内建的 ReAct
    Agent，实现了“思考-行动-观察”循环，这是 CoT 的一种具体应用。\n\n- create_structured_chat_agent：支持多步推理和工具调用，Prompt
    中强制要求输出 Thought, Action, Observation 等。\n\n- PlanAndExecute 代理：先规划步骤，再执行，天然带有
    CoT 属性。\n\n\U0001F4A1 实战建议：如果只是简单的推理问题，直接写一个 LLMChain 配合 CoT Prompt。如果涉及工具调用，用
    ReAct Agent。CoT 的 Prompt 设计至关重要，避免过于开放导致回答冗长。\n\n---"

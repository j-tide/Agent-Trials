content:
  prompt: "\U0001F50E ConversationalRetrievalChain 中的“condense_question_prompt”是用来做什么的？为什么需要它？"
answer:
  mode: rubric
  reference_answer: |-
    condense_question_prompt 是 ConversationalRetrievalChain 中一个至关重要的环节，它的任务是将用户的原始问题与对话历史融合，重写为一个独立、完整、适合检索的查询。

    为什么需要它？

    在多轮对话中，用户的问题往往充满省略和指代。比如：

    - 用户第一问：“帮我找一下关于量子计算的资料”

    - 助手回答：“量子计算是利用量子比特进行计算的技术…”

    - 用户第二问：“它有什么应用？”

    这里的“它”指的是“量子计算”。如果直接用“它有什么应用？”去向量数据库检索，结果会完全错误，因为向量模型无法从孤立句子中理解上下文。condense_question_prompt 的作用就是将“它有什么应用？”重写为“量子计算有什么应用？”，进而实现精准检索。

    具体流程

    - LLM 被调用，传入对话历史 + 用户新问题。

    - Prompt 模板示例：

    给定以下对话历史和一个后续问题，请将后续问题重写为一个独立的、不需要上下文就能理解的问题。

    对话历史：
    {chat_history}

    后续问题：{question}

    独立问题：

    - LLM 输出重写后的问题，例如：“量子计算有什么应用？”

    - 这个独立问题被发送给 Retriever，从而检索到相关文档。

    额外价值

    - 提取关键实体：LLM 能识别出历史中提到的关键概念，并将其补全到新问题中。

    - 统一查询风格：确保检索器的输入始终是清晰、完整的自然语言问题，充分发挥向量检索的语义理解能力。

    - 减少对话历史噪音：对话历史可能很长且包含无关信息，重写查询相当于自动做了关键信息抽取和问题重构。

    图示：对话历史 + 新问题 → [LLM 重写] → 独立完整的检索查询 → 向量数据库

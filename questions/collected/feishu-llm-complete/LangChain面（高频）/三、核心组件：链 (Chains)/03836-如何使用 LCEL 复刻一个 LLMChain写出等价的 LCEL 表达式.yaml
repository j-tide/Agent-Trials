content:
  prompt: 如何使用 LCEL 复刻一个 LLMChain？写出等价的 LCEL 表达式。
answer:
  mode: rubric
  reference_answer: "LCEL（LangChain Expression Language）是 LangChain 的新一代编程范式，使用 |
    管道操作符串联组件。用 LCEL 复刻 LLMChain 非常直观，能清晰表达数据流动。\n\n\U0001F4DC 等价的 LCEL 表达式：\n\n```python\nfrom
    langchain_core.prompts import ChatPromptTemplate\nfrom langchain_openai import
    ChatOpenAI\nfrom langchain_core.output_parsers import StrOutputParser\n\n# 1.
    定义 Prompt（使用消息模板更符合现代实践）\nprompt = ChatPromptTemplate.from_messages([\n    (\"system\",
    \"你是一个用{language}回答问题的助手。\"),\n    (\"human\", \"{topic}\")\n])\n\n# 2. 初始化模型\nmodel
    = ChatOpenAI(model=\"gpt-4o\", temperature=0.7)\n\n# 3. 初始化输出解析器（可选）\nparser =
    StrOutputParser()\n\n# 4. LCEL 表达式 = LLMChain 的完全等价形式\nchain = prompt | model
    | parser\n\n# 5. 调用\nresult = chain.invoke({\"language\": \"中文\", \"topic\": \"深度学习\"})\n```\n\n\U0001F50D
    与 LLMChain 的对比：\n\n[嵌入表格未展开]\n\n\U0001F4A1 LCEL 的优势：\n\n- 数据从左到右流动，直观清晰；\n\n-
    原生支持流式、异步、并行、回退等高级特性；\n\n- 链本身也是 Runnable，可无限嵌套组合。\n\n因此，所有新项目都应优先使用 LCEL 表达式，旧版
    LLMChain 主要用于理解基本原理和维护遗留代码。"

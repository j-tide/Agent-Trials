content:
  prompt: "⚡ 你如何对 RetrievalQA 链进行性能优化？（如缓存检索结果、缩短 prompt）"
answer:
  mode: rubric
  reference_answer: "优化 RetrievalQA 链主要从检索速度、LLM 调用成本、响应延迟三个方面着手。\n\n- 缓存检索结果\n\n-
    LangChain 内置缓存：from langchain.cache import InMemoryCache，设置 langchain.llm_cache
    = InMemoryCache()，可以缓存 LLM 的调用结果。对于相同的问题和文档组合，直接返回缓存答案。\n\n- 自定义缓存：使用 Redis 或磁盘缓存检索到的文档。在调用链之前，先检查缓存中是否有该问题的文档列表，避免重复检索。\n\n-
    多级缓存：先查内存缓存，再查向量数据库缓存（某些向量库支持查询结果缓存）。\n\n- 缩短 Prompt 和减少 Token 消耗\n\n- 精简 Prompt
    模板：去除不必要的废话，用简洁的指令。例如，不要写“请你作为一名专家…”，直接“根据以下文档回答问题”。\n\n- 文档压缩：使用 ContextualCompressionRetriever
    加 LLMChainExtractor，在文档进入 Prompt 前，用 LLM 提取出与问题最相关的句子，丢弃冗余。\n\n- 减少检索文档数量：调小 k
    值，或使用相似度阈值过滤掉低相关文档。\n\n- 只返回答案，不要求解释：在 Prompt 中明确指示只输出答案。\n\n- 加速检索\n\n- 混合检索：先用
    BM25 等快速算法粗筛，再用向量检索精排，减少向量检索的候选集。\n\n- 离线索引优化：使用 FAISS 的 IndexIVFPQ 等压缩索引，加速相似度搜索。\n\n-
    异步并行：对于 map_reduce 或 map_rerank，利用 asyncio 并发调用 LLM。\n\n- 降低 LLM 调用次数\n\n- 优先使用
    stuff 链（如果文档很短），它只调用一次 LLM。\n\n- 对于 refine，如果中间结果已经很完善，可以提前终止。\n\n- 使用更小、更快的模型进行初次过滤（如用
    embedding 模型对文档打分），再交给大模型回答。\n\n- 连接池与批处理\n\n- 使用 HttpClient 的持久连接，避免每次请求重建连接。\n\n-
    对于 map_reduce，可以将 Map 任务批量发送，利用 API 的批量接口（如果支持）。\n\n- 模型侧优化\n\n- 使用量化后的本地模型（如
    llama.cpp）降低推理延迟。\n\n- 对于重复问题，设置 temperature=0 并缓存结果。\n\n\U0001F6E0️ 一个综合缓存示例：\n\nfrom
    langchain.cache import RedisCache\nimport redis\nredis_client = redis.Redis(host='localhost',
    port=6379)\nlangchain.llm_cache = RedisCache(redis_client)\n\n# 同时对检索器使用磁盘缓存（需自定义）\nclass
    CachedRetriever(BaseRetriever):\n    def _get_relevant_documents(self, query):\n
    \       if query in self.cache:\n            return self.cache[query]\n        docs
    = self.base_retriever.get_relevant_documents(query)\n        self.cache[query]
    = docs\n        return docs\n\n结合多种策略，可以将 RetrievalQA 的端到端延迟降低 50% 以上。\n\n---"

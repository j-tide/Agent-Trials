content:
  prompt: "\U0001F3F7️ 你如何为工具的参数添加类型提示和描述？这有什么好处？"
answer:
  mode: rubric
  reference_answer: |-
    在 LangChain 中，为工具参数添加类型提示（Type Hints） 和文档字符串（Docstring） 是对工具进行声明式配置的最佳方式。

    如何添加：

    - 类型提示：直接使用 Python 标准类型（如 str, int, bool）或 typing 模块的类型（如 List[str]）。LangChain 会自动解析这些类型并生成 JSON Schema，供 OpenAI Functions Agent 等使用。

    - 参数描述：在函数的 docstring 中，使用 Args: 区块来描述每个参数的含义和格式。对于更复杂的 schema，还可以使用 Pydantic 的 Field 或 @tool 装饰器的 args_schema 参数来明确定义。

    示例：

    ```python
    from langchain.tools import tool

    @tool
    def send_email(to: str, subject: str, body: str, cc: list[str] = None) -> str:
        """发送邮件。
        Args:
            to: 收件人邮箱地址
            subject: 邮件主题
            body: 邮件正文
            cc: 抄送邮箱列表，可选
        """
        # 实际发送逻辑
        return "邮件发送成功"
    ```

    好处：

    - 精确指导 LLM：在 OpenAI Functions Agent 中，类型提示和描述会被转换为函数的 parameters schema，LLM 据此生成精确的 JSON 参数。这避免了 LLM 胡乱猜测参数格式。

    - 自动生成工具 Schema：LangChain 可以自动从这些信息生成 ToolInputSchema，省去手动编写繁琐的 Pydantic 模型。

    - 提升稳定性：类型提示让 Agent 知道参数是字符串还是整数，减少因类型错误导致的工具调用失败。

    - 更好的开发体验：IDE 能提供自动补全和类型检查，减少低级错误。

    ✅ 心得：对于复杂参数，我推荐使用 Pydantic 的 BaseModel 定义 args_schema，然后传入 @tool(args_schema=...)。这样既能享受 IDE 的强类型支持，又能生成完整的 JSON Schema，Agent 理解得最准确。


content:
  prompt: "\U0001F9F0 解释“Toolkit”的概念：如何将一组相关的工具打包成一个 Toolkit？"
answer:
  mode: rubric
  reference_answer: |-
    Toolkit 是 LangChain 中用于组织和管理一组相关工具的容器。它将具有共同上下文（如数据库连接、API 配置）的工具打包在一起，提供统一的初始化接口。

    为什么需要 Toolkit？

    - 共享资源：比如数据库连接池，多个工具（查询、更新、描述表）可以共享同一个连接，避免重复创建。

    - 简化配置：用户只需配置 Toolkit，而不必逐个创建和配置每个工具。

    - 逻辑内聚：将属于同一领域的工具放在一起，代码结构更清晰。

    如何实现一个 Toolkit：继承 BaseToolkit，在 get_tools() 方法中返回工具列表。通常在 init 中初始化共享资源。

    示例：一个简单的数学工具包。

    ```python
    from langchain.tools import BaseToolkit, BaseTool

    class MathToolkit(BaseToolkit):
        def get_tools(self) -> list[BaseTool]:
            return [
                add_tool,
                multiply_tool,
                sqrt_tool,
            ]
    ```

    在初始化时，可以传入共享的配置。例如 SQL 工具包会传入 db 连接对象，所有工具都使用它。

    与普通工具列表的区别：普通工具列表是扁平的，而 Toolkit 提供了封装。你可以将 Toolkit 的 get_tools() 结果与其他工具混合使用。

    ✅ 使用经验：当工具需要共享状态或配置时，我必定使用 Toolkit。这不仅让代码更整洁，也便于单元测试（只需 mock 一个 Toolkit 即可替换所有相关工具）。


content:
  prompt: "\U0001F6E0️ 在 LangChain 中，如何用 @tool 装饰器快速定义一个工具？写出示例。"
answer:
  mode: rubric
  reference_answer: |-
    在 LangChain 中，@tool 装饰器是将普通 Python 函数转化为 Agent 可调用工具的最快方式。只需在函数定义前加上 @tool，并提供一个清晰的文档字符串（docstring），LangChain 就能自动提取工具的名称和描述。

    核心代码示例：

    ```python
    from langchain.tools import tool

    @tool
    def search_weather(city: str) -> str:
        """查询指定城市的实时天气。输入城市名称，返回天气描述。"""
        # 模拟天气查询
        return f"{city}：晴，25摄氏度"

    @tool
    def calculate(expression: str) -> str:
        """执行数学计算。输入一个数学表达式（如 "2+2"），返回计算结果。"""
        try:
            result = eval(expression)
            return str(result)
        except Exception as e:
            return f"计算出错：{e}"
    ```

    关键说明：

    - 函数名（如 search_weather）自动成为工具的 name 属性。

    - 文档字符串（docstring）自动成为工具的 description 属性。这是 Agent 理解工具功能的唯一途径，必须清晰、准确。

    - 参数类型提示（如 city: str）会被 LangChain 解析，并用于生成工具的参数 schema，尤其在 OpenAI Functions Agent 中，它能帮助 LLM 生成正确的函数调用 JSON。

    高级用法：你也可以在 @tool 装饰器中显式指定名称或描述，以覆盖自动提取的值：

    ```python
    @tool(name="WeatherSearch", description="查询指定城市的天气，输入城市中文名称")
    def search_weather(city: str) -> str:
        ...
    ```

    但通常推荐直接写好函数名和 docstring，因为这样代码更简洁。

    ✅ 经验：我习惯将工具集中在一个 tools.py 文件中，每个工具函数只做一件事，docstring 以“做什么”开头，然后说明“输入什么，返回什么”。这样不仅 Agent 理解得好，同事维护起来也方便。


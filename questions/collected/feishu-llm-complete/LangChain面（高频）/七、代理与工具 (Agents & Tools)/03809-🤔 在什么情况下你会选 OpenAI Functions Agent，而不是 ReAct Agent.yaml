content:
  prompt: "\U0001F914 在什么情况下你会选 OpenAI Functions Agent，而不是 ReAct Agent？"
answer:
  mode: rubric
  reference_answer: |-
    选择取决于模型、任务复杂度、稳定性要求和可移植性需求。

    我会选 OpenAI Functions Agent 的情况：

    - 使用 OpenAI 的模型：这是首要条件。

    - 工具参数复杂：例如参数是嵌套对象、数组，或者需要可选参数。Function Calling 的 JSON Schema 可以完美定义这些，而 ReAct 的文本解析会非常痛苦。

    - 需要高稳定性的生产环境：Function Calling 的格式错误率极低，省去很多调试时间。

    - 需要并行调用多个函数：OpenAI 支持在单次响应中返回多个 tool_calls，Agent 可以同时执行多个独立操作，提高效率。ReAct 只能串行。

    - 希望 Prompt 更短：Functions Agent 的 Prompt 简洁，节省 token 成本。

    我会选 ReAct Agent 的情况：

    - 使用非 OpenAI 模型，如 Llama、Claude 等（虽然 Claude 也有 Tool Use，但 LangChain 的 ReAct 更通用）。

    - 需要极致的可解释性：ReAct 的 Thought 是显式的自然语言，可以完整看到模型的“心路历程”。这在安全审计或教育场景很有价值。

    - 对可移植性要求高：如果未来可能切换模型提供商，ReAct 更通用。

    - 简单的工具调用：如果只是简单的字符串输入输出，ReAct 也足够。

    ✅ 个人做法：我现在绝大多数项目都用 Functions Agent，因为稳定性带来的收益远超其他。只有在需要支持开源模型的时候，才切换到 ReAct。而且对于 ReAct，我也会尽量减少复杂参数，尽量让工具只接收一个字符串。


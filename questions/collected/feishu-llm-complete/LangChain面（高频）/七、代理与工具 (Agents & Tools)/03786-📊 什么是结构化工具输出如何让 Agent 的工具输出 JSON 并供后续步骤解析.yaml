content:
  prompt: "\U0001F4CA 什么是“结构化工具输出”？如何让 Agent 的工具输出 JSON 并供后续步骤解析？"
answer:
  mode: rubric
  reference_answer: |-
    结构化工具输出是指工具的返回值不是自然语言字符串，而是结构化的数据（如 JSON、YAML、XML），这样 Agent 或后续的链可以精确解析其中的字段，进行进一步处理。

    实现方式

    - 工具直接返回 JSON 字符串
    在工具函数内部，构造 JSON 并返回。然后在 Agent 的 Prompt 中说明这个工具返回的是 JSON，以便 Agent 知道可以从中提取字段。

    ```python
    import json
    @tool
    def get_user_profile(user_id: str) -> str:
        profile = {"name": "张三", "age": 30, "city": "北京"}
        return json.dumps(profile, ensure_ascii=False)
    ```

    - 使用 Pydantic 模型作为工具输出
    LangChain 支持用 Pydantic 定义工具的 args_schema（输入），但输出目前仍以字符串为主。你可以通过自定义输出解析器，在 Agent 外部将返回的 JSON 解析为 Pydantic 对象。

    - 在 Agent 的 Prompt 中要求解析
    告诉 LLM：“工具的返回值为 JSON 格式，你可以通过键名访问其中的数据”。LLM 能够理解并在 Thought 中引用这些键。

    - 结合 StructuredTool 和自定义解析
    如果你希望工具的输出能够被后续链直接使用，可以将工具包装在一个 Tool 中，并在 func 返回时做结构化标记。或者使用 LangChain 的 JsonOutputToolsParser 等解析 Agent 的 Action。


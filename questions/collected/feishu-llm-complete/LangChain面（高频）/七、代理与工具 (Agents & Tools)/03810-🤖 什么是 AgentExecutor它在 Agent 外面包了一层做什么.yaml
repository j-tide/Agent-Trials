content:
  prompt: "\U0001F916 什么是 AgentExecutor？它在 Agent 外面包了一层做什么？"
answer:
  mode: rubric
  reference_answer: |-
    AgentExecutor 是 LangChain 中负责运行 Agent 的“执行引擎”。它把 Agent（负责思考）和工具（负责行动）连接起来，并管理整个 ReAct 循环。

    AgentExecutor 的主要职责

    - 循环控制：不断调用 Agent 的 plan 方法，直到 Agent 输出 AgentFinish 或达到最大步数。

    - 工具执行：解析 Agent 返回的 AgentAction，调用对应的工具，并收集结果（Observation）。

    - 错误处理：捕获输出解析错误，并可以选择性地重试或返回错误信息。

    - 状态管理：维护 intermediate_steps（即 scratchpad），将所有 Thought/Action/Observation 记录并传递给下一轮。

    - 早停策略：当达到 max_iterations 时，根据 early_stopping_method 决定是抛出异常还是生成最终答案。

    - 回调触发：在合适的时机触发回调（如 on_agent_action, on_tool_end），方便外部监控。

    简单说：AgentExecutor = Agent的运行时环境。

    agent_executor = AgentExecutor(
        agent=agent,        # 决策核心
        tools=tools,        # 工具集
        max_iterations=5,
        early_stopping_method="generate",
        verbose=True,
        callbacks=[my_handler]
    )

    ✅ 理解：在没有 AgentExecutor 之前，你需要自己写循环和错误处理，非常繁琐。AgentExecutor 把这些通用逻辑封装起来，让你能专注于 Agent 的 Prompt 和工具设计。它是 Agent 框架中最不可或缺的部分。


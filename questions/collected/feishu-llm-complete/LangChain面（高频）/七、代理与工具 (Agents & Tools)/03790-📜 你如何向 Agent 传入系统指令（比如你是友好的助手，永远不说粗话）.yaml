content:
  prompt: "\U0001F4DC 你如何向 Agent 传入系统指令（比如“你是友好的助手，永远不说粗话”）？"
answer:
  mode: rubric
  reference_answer: |-
    向 Agent 传入系统指令有三种常见方式，取决于你使用的 Agent 类型和 Prompt 结构。

    方法一：在 Agent 的 Prompt 模板中直接添加

    大多数 Agent 的 Prompt 都包含一个前缀（Prefix），你可以在这里植入系统指令。例如 ReAct Agent：

    from langchain.agents import create_react_agent, AgentExecutor
    from langchain import hub

    prompt = hub.pull("hwchase17/react")
    # 修改 prompt 的 template，在开头加上系统指令
    prompt.template = "你是友好的助手，永远不说粗话。\n\n" + prompt.template

    对于 OpenAI Functions Agent，同样可以修改系统消息：

    from langchain.agents import create_openai_functions_agent
    from langchain.prompts import ChatPromptTemplate, MessagesPlaceholder

    prompt = ChatPromptTemplate.from_messages([
        ("system", "你是友好的助手，永远不说粗话。"),
        ("user", "{input}"),
        MessagesPlaceholder(variable_name="agent_scratchpad"),
    ])

    方法二：使用 extra_prompt_messages 参数（部分 Agent 支持）

    某些 Agent 的初始化方法接受额外的消息，可以方便地追加系统指令。

    方法三：在 Memory 中注入系统消息

    在 ConversationBufferMemory 中预先添加一条 SystemMessage，这样每次记忆加载时都会带上这条指令。

    方法四：通过 AgentExecutor 的 prefix 参数（已废弃）

    早期版本有 prefix，现在更推荐直接修改 Prompt。

    ✅ 最佳实践：我通常直接修改 Prompt 模板，因为这最灵活。如果需要在运行时根据不同用户或场景动态调整系统指令，我会在构建链之前，通过字符串替换或模板渲染来实现。


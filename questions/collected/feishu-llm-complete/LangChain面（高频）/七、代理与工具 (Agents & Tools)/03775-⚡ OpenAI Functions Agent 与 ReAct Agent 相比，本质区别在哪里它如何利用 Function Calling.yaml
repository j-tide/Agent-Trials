    ✅ 体验：Function Calling 让工具调用从“可能出错”变成了“基本不出错”。因为 LLM 不再需要去“猜”如何格式化输出，它天然就知道该如何构造 JSON。而且它支持复杂的参数类型（如数组、对象），这在 ReAct 里几乎不可能。不过它绑定了 OpenAI，对于需要多模型兼容的场景，可能要用别的方案（如 Anthropic 的 Tool Use）。


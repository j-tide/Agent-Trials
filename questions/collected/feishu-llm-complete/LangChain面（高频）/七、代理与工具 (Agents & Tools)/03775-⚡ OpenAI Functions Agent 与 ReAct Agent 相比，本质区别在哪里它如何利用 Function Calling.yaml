content:
  prompt: "⚡ OpenAI Functions Agent 与 ReAct Agent 相比，本质区别在哪里？它如何利用 Function Calling？"
answer:
  mode: rubric
  reference_answer: |-
    本质区别：ReAct Agent 依赖 LLM 生成自由格式的文本，然后由 LangChain 用正则解析出工具名和参数。而 OpenAI Functions Agent 则利用了 OpenAI 模型的 Function Calling 原生能力，LLM 直接输出结构化的 JSON 函数调用，不再需要文本解析。

    Function Calling 的工作原理：

    - 在调用 OpenAI API 时，我们可以定义一组 functions 参数，描述可用的函数及其参数 schema（JSON Schema）。

    - 当 LLM 认为需要调用某个函数时，它不会生成文本，而是返回一个 function_call 对象，里面包含函数名和参数（JSON 格式）。

    - LangChain 的 AgentExecutor 收到这个对象后，直接调用对应的工具，并将结果作为 FunctionMessage 再次发送给 LLM。

    - LLM 基于结果继续推理，或者最终生成自然语言回复。


content:
  prompt: "⏹️ 解释 Agent 的“early_stopping_method”参数，它可以设为哪些值？"
answer:
  mode: rubric
  reference_answer: |-
    early_stopping_method 是 AgentExecutor 的一个参数，决定当 Agent 达到 max_iterations 但尚未输出 Final Answer 时的行为。

    可选值：

    - "force"（默认）：直接返回一个 AgentFinish 对象，其 return_values 为空字典。这意味着 Agent 没有给出任何答案，通常会导致程序抛出异常或返回 None。在生产环境中，这会给用户带来不好的体验。

    - "generate"：在超过最大步数后，额外调用一次 LLM，要求它根据当前已收集的所有信息（所有的 Thought/Action/Observation）强制生成一个最终答案。这次调用会使用一个特殊的 Prompt，明确告诉 LLM “你已经完成了最大步数，现在必须给出一个回答，哪怕基于不完整的信息”。这样至少能返回一个结果给用户，而不是一个错误。

    选择建议：

    - 如果你希望 Agent 严格按预设步数执行，且对未完成的任务零容忍（例如金融交易），用 "force"，然后在外层捕获异常并做补偿处理。

    - 对于大多数对话式或信息查询类应用，强烈推荐 "generate"。它能显著提升用户体验，避免因偶发的死循环或复杂问题导致“无响应”。

    ✅ 实际效果：我曾在客服 Agent 中使用 "force"，结果用户经常在复杂问题上得到空白回复。改用 "generate" 后，虽然偶尔答案不够精确，但至少给出了一个尝试性的解答，用户满意度明显上升。


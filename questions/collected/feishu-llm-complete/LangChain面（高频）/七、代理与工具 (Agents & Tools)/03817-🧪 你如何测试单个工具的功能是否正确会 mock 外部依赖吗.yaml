content:
  prompt: "\U0001F9EA 你如何测试单个工具的功能是否正确？会 mock 外部依赖吗？"
answer:
  mode: rubric
  reference_answer: |-
    测试工具是保证 Agent 可靠性的基础。我会编写单元测试和集成测试，对于外部依赖一律采用 mock 手段。

    单元测试（推荐使用 pytest）：

    - 对于工具函数的核心逻辑（如数据处理、条件判断），直接调用函数并断言返回值。

    - 对于依赖外部资源的部分（数据库、API、文件系统），使用 unittest.mock 或 pytest-mock 来模拟，确保测试快速、可重复，不受外部环境影响。

    示例：测试一个调用外部 API 的天气工具。

    ```python
    from unittest.mock import patch, MagicMock

    def test_weather_tool_success():
        mock_response = MagicMock()
        mock_response.json.return_value = {"weather": "晴", "temp": 25}
        with patch('requests.get', return_value=mock_response):
            result = weather_tool("北京")
            assert "晴" in result
            assert "25" in result

    def test_weather_tool_timeout():
        with patch('requests.get', side_effect=requests.exceptions.Timeout):
            result = weather_tool("上海")
            assert "超时" in result  # 工具内部应捕获异常并返回友好信息
    ```

    集成测试：在隔离的测试环境中（如本地数据库、测试专用的 API Key）运行工具，验证真实交互。这不作为每次提交的必测项，但发布前必须执行。

    Mock 外部依赖的好处：

    - 速度快：不依赖网络和数据库，毫秒级完成。

    - 稳定：不会因外部服务故障导致测试失败。

    - 可控：可以模拟各种异常情况（超时、权限错误、返回数据异常），验证工具的健壮性。

    ✅ 我的习惯：所有涉及 I/O 的工具都必须有 100% 的单元测试覆盖，并且至少要包含成功、失败、超时三种场景的 mock。集成测试则放在 CI/CD 的晚间构建中。


content:
  prompt: "\U0001F5BC️ 工具可以返回图片、文件等非文本内容吗？LangChain 支持多模态工具吗？"
answer:
  mode: rubric
  reference_answer: |-
    工具返回值通常是字符串，因为 Agent 的推理过程以文本为基础。但是，我们可以通过一些技巧让工具“返回”图片、文件等非文本内容，LangChain 也在逐步扩展对多模态的支持。

    当前可行的实现方式：

    - 图片：工具可以将图片保存到临时存储（如云存储），然后返回图片的 URL 或 Base64 编码字符串。如果 LLM 是多模态的（如 GPT‑4V），Agent 可以通过 URL 或 Base64 在 Prompt 中直接引用图片内容。

    - 文件：工具生成文件后，返回一个下载链接或文件路径。Agent 可以告诉用户“文件已生成，可点击下载”。

    - 音频、视频：同理，返回资源的 URL 和元数据。

    LangChain 的多模态工具支持：

    - LangChain 的模型组件已支持多模态输入（如图像），但目前工具系统本身仍以文本为交互媒介。工具无法直接返回二进制流，但可以通过返回 URL 让 LLM 进行多模态理解。

    - 对于需要将图片直接作为工具输出并传递给 LLM 的场景，可以通过自定义 Agent 或修改 Prompt，在消息中直接插入 {"type": "image_url", "image_url": ...} 这样的内容块。

    未来趋势：随着多模态模型和 API 的发展，LangChain 很可能会引入原生的多模态工具返回类型，允许工具直接输出图像、文件等复杂对象。

    ✅ 当前建议：如果你的工具涉及图片生成，使用返回 URL 的方式最通用。对于需要多模态理解的场景，选择支持多模态的 LLM（如 gpt-4-vision-preview），并在 Agent 的 Prompt 中显式说明工具返回的是图片 URL。


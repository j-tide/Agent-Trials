content:
  prompt: "\U0001F91D 当多个 Agent 协作时，如何避免它们产生冲突或重复工作？"
answer:
  mode: rubric
  reference_answer: |-
    多 Agent 协作常见的冲突包括：重复执行相同操作、结果不一致、资源竞争。避免冲突需要从架构设计和通信机制两方面入手。

    预防措施

    - 明确职责边界：每个 Agent 的工具集和功能描述要有清晰界限，避免功能重叠。例如，一个 Agent 只能“读取”，另一个 Agent 只能“写入”。

    - 中央调度与状态管理：引入一个“协调者 Agent”或一个共享状态管理器（如 Redis），记录哪些任务已经被执行、谁在执行、进度如何。Agent 在执行前先检查状态，避免重复。

    - 任务分解与去重：在任务分解阶段，协调者就去除重复的子任务，并将任务唯一分配给特定 Agent。

    - 基于锁的并发控制：如果多个 Agent 可能修改同一资源，使用分布式锁（如 Redis Lock）确保同一时间只有一个 Agent 操作。

    - 日志与审计追踪：每个 Agent 的操作都记录到日志中，便于事后发现和解决冲突。

    - 让 Agent 之间“沟通”：Agent 可以向协调者报告自己正在处理的任务，协调者广播给其他 Agent，实现情报共享。


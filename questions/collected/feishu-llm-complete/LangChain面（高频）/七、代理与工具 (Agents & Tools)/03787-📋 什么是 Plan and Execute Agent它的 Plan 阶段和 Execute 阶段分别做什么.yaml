content:
  prompt: "\U0001F4CB 什么是 Plan and Execute Agent？它的 Plan 阶段和 Execute 阶段分别做什么？"
answer:
  mode: rubric
  reference_answer: |-
    Plan and Execute Agent 是一种将复杂任务先规划、后执行的 Agent 模式。它不象 ReAct Agent 那样一边想一边做，而是像一个项目经理：先制定详细计划，然后逐步执行计划中的每个步骤。

    两个阶段

    - Plan 阶段（规划阶段）

    - Execute 阶段（执行阶段）

    LangChain 中的实现

    LangChain 提供了 PlanAndExecute 系列组件，核心类包括 Planner 和 Executor。例如：

    ```python
    from langchain.experimental.plan_and_execute import PlanAndExecute, load_agent_executor, load_chat_planner
    planner = load_chat_planner(llm)
    executor = load_agent_executor(llm, tools)
    agent = PlanAndExecute(planner=planner, executor=executor)
    ```

    Planner 会生成类似：

    ```text
    Step 1: 搜索北京天气
    Step 2: 搜索北京室内活动
    Step 3: 根据天气推荐活动
    ```

    - Executor 会针对每个 Step 调用 Agent 来完成。


content:
  prompt: "\U0001F916 你怎样用 LangChain 搭建一个类似 AutoGPT 的自主智能体？核心组件有哪些？"
answer:
  mode: rubric
  reference_answer: |-
    AutoGPT 是一个能够自主设定目标、规划、执行、自我反思的智能体。使用 LangChain 搭建类似系统，核心在于循环控制、长期记忆、工具使用和自我反思。

    核心组件

    - 一个强大的 LLM：作为大脑，负责推理、规划和决策。推荐 gpt-4 或同等性能模型。

    - AgentExecutor + ReAct/OpenAI Functions Agent：作为执行引擎，支持多步推理和工具调用。

    - 长期记忆系统：

    - 丰富的工具集：

    - 自我反思机制：

    - 任务管理器：

    - 安全与终止机制：

    简易架构流程

    ```text
    用户目标 → Planner Agent (生成任务列表)
              → Executor Agent (循环执行任务)
                  ←→ Memory (检索相关记忆)
                  ←→ Tools (调用外部工具)
                  ←→ Self-Reflection (评估进展)
              → 输出最终结果
    ```

    - 继承 AgentExecutor，在每次工具执行后，额外调用一次 LLM 进行反思。这次反思的结果不作为 Action，而是追加到 scratchpad 中作为 Thought，指导后续推理。

    - LangChain 提供了 SelfRefineChain，它是在生成答案后，让 LLM 对自己的答案进行反馈和优化。你可以将 Agent 的最终输出作为 Self-Refine 的输入，实现“事后反思”。

    - 在 Agent 的输出中增加特殊的标记，如 [Relevant]、[Irrelevant]、[Correct]，让 LLM 在生成 Action 的同时评价工具结果。这需要修改 Prompt 和输出解析器。

    - 工具返回的错误信息如果足够详细，Agent 可以根据它调整行为，这是一种被动的反思。

    ✅ 实践：我在一个数据分析 Agent 中，自己在 Prompt 里加了一句：“如果连续两次工具调用返回相似的结果，请反思你是否陷入了死循环，并尝试改变查询方式。”效果立竿见影，Agent 的思维链变得更加清晰，不容易卡死。

    - 输入：用户的目标。

    - 输出：一个结构化的“计划”（Plan），通常是一个步骤列表，每个步骤描述一个子任务和需要调用的工具/参数。

    - 这个阶段完全由 LLM 完成，不调用任何外部工具。

    - 接收计划，然后按照顺序（或根据依赖）执行每个步骤。

    - 执行每个步骤时，可以调用相应的工具，获取结果。

    - 所有步骤执行完毕后，汇总结果，生成最终答案。

    ✅ 适用场景：任务步骤清晰、目标明确，且执行过程中不需要根据中间结果大幅调整计划的情况。对于探索性强、需要频繁调整策略的任务，ReAct 更灵活。

    ✅ 实践：我做过一个企业信息助手，主 Agent 负责理解问题，如果是IT支持就转给 IT 专家 Agent，如果是HR政策就转给 HR 专家 Agent。用 Tool 包装子 Agent 非常有效，代码也简洁。

    ✅ 经验：对于简单的链式协作，用 Tool 传参就够了。只有需要多个 Agent 并行、异步通信时，才考虑引入消息队列。不要过度设计。

    ✅ 应用：在一个金融分析 Agent 中，我让“数据查询”工具返回 JSON 数组，然后 Agent 在 Thought 中会写：“从结果中看，股价为 XX，涨跌幅为 YY”，这样后续的自然语言生成就非常精准。

    ✅ 现实类比：就像项目团队，每个成员有明确的职责描述，任务分配由项目经理（协调者）统一调度，避免两个人做同一件事。多 Agent 系统也需要这样一个“项目经理”。

    - VectorStoreRetrieverMemory：存储和检索历史对话、任务状态、知识片段。

    - ConversationSummaryBufferMemory：压缩对话历史，保持上下文连贯。

    - 网络搜索工具（Google/Bing API）

    - 文件读写工具

    - 代码执行工具（Python REPL）

    - 外部 API 工具

    - 修改 Prompt，加入定期反思指令。

    - 使用自定义 AgentExecutor，在特定步骤后插入反思调用。

    - 集成 Self-Refine 链。

    - 一个数据结构（如 JSON）存储任务列表、优先级、完成状态。

    - 一个工具让 Agent 能够读取和更新任务列表。

    - 严格限制 Agent 的步数和操作权限。

    - 人工审批工具（如删除文件前需要确认）。

    ✅ 实践感受：搭建 AutoGPT 类系统并不难，难的是如何控制成本和保证稳定性。我通常会给 Agent 设定一个“预算上限”（步数和 token 数），并且在执行危险操作时强制人工确认。另外，长期记忆用向量库非常关键，它能让 Agent 记住之前的推理和经验。

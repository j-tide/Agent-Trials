content:
  prompt: "\U0001F4E6 工具返回的结果如果很大（如整个网页的内容），你如何处理？"
answer:
  mode: rubric
  reference_answer: |-
    当工具返回的内容过大时，会引发 Prompt 超限、LLM 处理缓慢、成本飙升等一系列问题。处理原则是：永不将原始的大内容直接返回给 Agent，必须在工具内部进行压缩或分段。

    处理方法：

    - 提取摘要：使用 LLM 或规则对内容进行总结，只返回关键信息。例如，网页抓取工具只返回标题、前几段和重要链接。

    - 分页返回：对于数据库查询等，实施分页逻辑，每次只返回前 N 条记录，并提供“下一页”的指示。但 Agent 需要能够逐步请求。

    - 存储到外部，返回引用：将完整内容保存到文件系统、对象存储或向量数据库，然后只返回一个引用 ID 和简短描述。后续如需详细分析，Agent 可通过另一个工具传入 ID 获取详情。

    - 截断并给出提示：对结果字符串进行硬截断（如前 2000 字符），并在末尾添加 ...（内容已截断，完整内容长度XXXX字）。这样 Agent 知道信息不完整，可决定是否发起更具体的查询。

    - 使用 LangChain 的 Document 压缩器：在工具外部，可以借助 ContextualCompressionRetriever 对返回结果进行后处理，但这更多用于检索链。

    设计工具时就要考虑大小限制：在工具的描述中，可以写明“返回最多前 10 条结果”，或“返回摘要而非全文”，让 Agent 自身也知晓这一限制。

    ✅ 教训：我曾直接让一个网页抓取工具返回整个 HTML，结果 Agent 疯狂失败。后来改为只提取正文文本并限制 1500 字，Agent 才恢复正常。记住：Agent 的上下文窗口是稀缺资源，工具的返回值应像“电报”一样精炼。


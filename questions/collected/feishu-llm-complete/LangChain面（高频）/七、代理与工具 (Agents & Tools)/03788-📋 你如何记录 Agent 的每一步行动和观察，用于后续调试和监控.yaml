content:
  prompt: "\U0001F4CB 你如何记录 Agent 的每一步行动和观察，用于后续调试和监控？"
answer:
  mode: rubric
  reference_answer: |-
    记录 Agent 的每一步是调试复杂问题、监控成本和性能的基础。LangChain 提供了多种方式：

    开启 verbose=True

    最简单的方法，直接在控制台打印每一步的详细日志。适合本地开发。

    使用 LangSmith

    最强大的官方工具，自动追踪所有 Agent 运行，包括 Prompt、LLM 调用、工具调用和返回值。你可以在 UI 上回放每一步，非常适合团队协作和线上调试。

    自定义 Callback 处理器

    通过实现 BaseCallbackHandler 或 AsyncCallbackHandler，你可以精确控制日志的格式和存储位置。

    class AgentLogger(BaseCallbackHandler):
        def on_agent_action(self, action, **kwargs):
            logger.info(f"Step {self.step}: Action - {action.tool}({action.tool_input})")
        def on_tool_end(self, output, **kwargs):
            logger.info(f"Observation: {output}")
        def on_agent_finish(self, finish, **kwargs):
            logger.info(f"Final Answer: {finish.return_values}")

    保存到数据库或文件

    在回调中，将每一步的 run_id, timestamp, action, observation 写入数据库（如 PostgreSQL）或日志文件，后续可以分析 Agent 的行为模式。

    集成外部监控平台

    将日志发送到 Prometheus、Grafana 或 ELK，实时监控 Agent 的性能和错误率。

    ✅ 我常用的组合：开发阶段使用 verbose，测试环境使用 LangSmith，生产环境使用自定义回调将关键事件写入结构化日志并发送到监控系统。特别注意要记录 session_id 和 user_id，以便追踪单个用户会话。


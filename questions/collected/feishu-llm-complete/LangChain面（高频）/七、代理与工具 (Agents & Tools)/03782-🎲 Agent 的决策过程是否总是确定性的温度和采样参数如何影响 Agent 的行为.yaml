content:
  prompt: "\U0001F3B2 Agent 的决策过程是否总是确定性的？温度和采样参数如何影响 Agent 的行为？"
answer:
  mode: rubric
  reference_answer: |-
    Agent 的决策过程不是完全确定性的，它受 LLM 的采样参数（尤其是温度 temperature）和 top_p 的直接影响。

    确定性 vs 随机性

    - 当 temperature=0 时：LLM 几乎以贪心方式选择概率最高的 token，每次输出理论上一致（实际上由于 GPU 浮点运算的微小差异，可能略有不同，但基本确定）。此时 Agent 的行为也是高度可预测的，它会倾向于选择“最安全”的路径。这对需要稳定输出的任务（如数学计算）很有用，但可能使 Agent 在遇到困难时缺乏探索性，更容易陷入死循环。

    - 当 temperature>0（如 0.5-1.0）时：LLM 的输出带有随机性，Agent 可能会在相同的情况下选择不同的工具或采取不同的推理路径。这有助于 Agent 探索更优解，但也可能导致结果不稳定，甚至产生奇怪的 Action。

    其他参数的影响

    - top_p：与温度配合使用，限制采样池。较小的 top_p（如 0.1）会大幅减少多样性，增加确定性。

    - frequency_penalty 和 presence_penalty：影响重复用词，可以间接让 Agent 的思考更加简洁或避免重复调用同一个工具。

    如何控制 Agent 的行为

    - 对于需要精确工具调用（如转账），我通常设置 temperature=0，确保 Agent 稳定执行。

    - 对于创意类或需要多步探索的任务，我会设置 temperature=0.3-0.5，并配合 early_stopping_method 来容忍一定的不确定性。

    - 还可以使用 LangChain 的 LLMChain 的 model_kwargs 参数，或者在初始化 LLM 时统一配置。

    ✅ 个人经验：Agent 的行为不是单靠温度控制的，工具的描述清晰度和 Prompt 中的示例对确定性的影响更大。即使温度设为 0，如果工具描述模糊，Agent 还是会“不知所措”。我倾向于先用低温调试，确认工具和 Prompt 无误后，再按需提高温度。


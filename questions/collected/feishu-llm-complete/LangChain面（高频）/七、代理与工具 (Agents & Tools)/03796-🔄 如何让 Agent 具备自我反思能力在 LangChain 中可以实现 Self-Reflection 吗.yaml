content:
  prompt: "\U0001F504 如何让 Agent 具备“自我反思”能力？在 LangChain 中可以实现 Self-Reflection 吗？"
answer:
  mode: rubric
  reference_answer: |-
    自我反思（Self-Reflection）是指 Agent 在执行过程中，能够评估自己的行为、识别错误并调整策略。LangChain 本身没有内建一个“Self-Reflection Agent”类，但你可以通过以下方式实现。

    实现方法

    - 在 Prompt 中注入反思指令

    - 修改 Agent 的 Prompt，加入类似“每执行完一个工具，请思考：结果是否符合预期？如果不，你应该调整什么？”的指令。

    - 还可以加入一个专用的反思步骤，例如要求 Agent 每隔 N 步输出一次 Reflection:，评估进展。

    - 使用自定义的 AgentExecutor 循环

    - 结合 Self-Refine 链

    - 实现类似 Reflexion 的模式（Self-RAG 风格）

    - 利用工具反馈进行被动反思


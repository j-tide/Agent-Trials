content:
  prompt: "\U0001F50D 如果工具的 description 写得不清楚，Agent 会有什么表现？"
answer:
  mode: rubric
  reference_answer: |-
    工具描述模糊时，Agent 的表现会非常糟糕，典型的症状包括：

    - 完全忽略该工具：Agent 在推理过程中认为没有可用的工具能解决当前问题，即使答案就在那个工具的背后。例如，一个“查订单”的工具描述为“获取信息”，Agent 可能会去调用另一个更明确的“搜索FAQ”工具。

    - 错误地调用工具：Agent 可能会把本不属于该工具的任务交给它。比如，把“计算”工具的描述写成“处理数学”，当用户问“什么是勾股定理”时，Agent 可能也会调用它，期待工具能返回定义。

    - 调用时参数不正确：描述没说明参数格式，Agent 就会随意传入参数。例如工具期望数字 ID，Agent 却传入了整个问题字符串，导致工具返回错误。

    - 在循环中反复尝试：工具调用失败后，Agent 可能不认为是工具描述的问题，而是认为是自己的参数不对，于是不断改变参数重试，陷入死循环。

    - 输出不相关的结果：工具返回了数据，但因为 Agent 没用对，得到的结果是垃圾，它可能会基于这些垃圾数据继续推理，输出完全错误的答案。

    总结：工具描述是 Agent 理解外部世界的唯一说明书。描述模糊，Agent 就像蒙着眼睛找东西，效率极低。

    ✅ 调试技巧：如果发现 Agent 总是用错工具或参数，首先检查工具的 description。可以临时开启 verbose=True，观察 Agent 的“Thought”，看它想做什么，再对比工具的 description，往往就能发现不匹配之处。


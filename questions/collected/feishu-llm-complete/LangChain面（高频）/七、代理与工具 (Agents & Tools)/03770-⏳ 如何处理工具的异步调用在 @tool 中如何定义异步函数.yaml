content:
  prompt: "⏳ 如何处理工具的异步调用？在 @tool 中如何定义异步函数？"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 支持异步工具，这在需要并发调用多个 API、执行 I/O 密集型任务时能显著提升效率。

    定义异步工具：
    只需将工具函数定义为 async def，并使用 @tool 装饰器即可。LangChain 会自动识别并支持异步调用。

    ```python
    import aiohttp
    import asyncio

    @tool
    async def fetch_web_content(url: str) -> str:
        """异步获取网页内容。输入URL，返回网页文本。"""
        async with aiohttp.ClientSession() as session:
            async with session.get(url) as response:
                return await response.text()
    ```

    在 Agent 中使用异步工具：

    - 使用 AgentExecutor 的异步方法 arun 或 ainvoke，它会自动以异步方式调用工具。

    - 如果多个工具可并行执行（如在 OpenAI Functions Agent 中），Agent 会一次性发起多个工具调用，然后等待所有结果返回，这能大幅缩短总执行时间。

    注意事项：

    - 异步工具内部使用的库必须是异步兼容的（如 aiohttp 代替 requests，aiomysql 代替 mysql-connector）。

    - 如果工具是同步函数，Agent 会在默认线程池中执行它们，这可能成为并发瓶颈。因此对于 I/O 密集型工具，强烈建议实现为异步。

    - 调试异步工具时，可以使用 asyncio.run() 在同步环境中测试。

    ✅ 使用场景：我有一个竞品分析 Agent，需要同时抓取多个网站的价格信息。将所有抓取工具改为异步后，Agent 的执行时间从 8 秒降到了 1.5 秒，因为多个请求完全并行。


content:
  prompt: "\U0001F4DD 工具的 name 和 description 字段为什么极其重要？它如何影响 Agent 的推理？"
answer:
  mode: rubric
  reference_answer: |-
    在 Agent 的 Prompt 中，工具的描述是 LLM 决定何时调用、调用哪个工具的唯一参考信息。LLM 看不到工具的代码实现，只能靠文字描述来理解工具的能力和适用范围。

    name：是 Agent 在输出 Action 时使用的标识符。如果名称模糊（如 tool1），Agent 可能会选错或根本不知道该工具的存在。名称应该简洁、准确，通常是一个动词短语或名词，比如 Search、Calculator、WeatherQuery。

    description：是工具的灵魂。一个好的描述应该告诉 LLM：

    - 这个工具是干什么的？（核心功能）

    - 什么情况下应该使用它？（使用场景）

    - 输入参数是什么格式？（例如“输入城市的中文名称”）

    - 返回值是什么类型？（例如“返回天气描述字符串”）

    描述对推理的影响：

    - 描述不清楚，Agent 会犹豫不决，或者乱猜。例如，描述只写“查询天气”，Agent 可能以为它只能查本地天气，于是每次都传入空字符串或错误参数。

    - 如果描述误导，Agent 会错误地选择工具。例如，把“计算”工具的描述写成“处理数学问题”，Agent 可能在遇到文字应用题时也调用它，期待工具能理解自然语言。

    - 在 OpenAI Functions Agent 中，描述会被转换成函数 schema 的 description 字段，直接指导 LLM 生成正确的函数调用 JSON。如果描述不清晰，LLM 可能生成错误的参数名或类型，导致工具调用失败。

    最佳实践：

    - 描述中明确工具能做什么，以及不能做什么。

    - 给出具体的输入示例。

    - 避免模糊词汇（如“处理”、“操作”）。

    ✅ 踩坑案例：我曾写过一个检索知识库的工具，描述是“搜索知识库”，结果 Agent 总是把整个用户问题直接丢进去搜索，而不是先提取关键信息。后来我把描述改成“从知识库中检索与特定关键词相关的文档片段。输入为一个简短的查询关键词，返回相关文档列表。”，Agent 的行为就正常了。


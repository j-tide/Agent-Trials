content:
  prompt: "\U0001F9E0 如何定义多个工具并让 Agent 在运行时选择？Agent 是根据什么信息选择的？"
answer:
  mode: rubric
  reference_answer: |-
    定义多个工具：只需创建一个工具列表，然后传递给 Agent 的初始化函数或 AgentExecutor。例如：

    ```python
    tools = [search_weather, calculate, send_email]
    agent = create_openai_functions_agent(llm, tools, prompt)
    ```

    Agent 在运行时，会根据当前对话上下文和工具的描述来决策。具体来说，LangChain 会将所有工具的名称、描述和参数 schema 格式化后注入 Prompt。LLM 阅读用户的问题，然后决定是否需要调用工具、调用哪个工具、以及传入什么参数。

    Agent 的选择依据（按重要性排序）：

    - 工具的 description：告诉 LLM 该工具能解决什么问题。这是最关键的。

    - 用户当前的提问：LLM 会分析用户意图，与工具描述进行匹配。

    - 先前的交互历史（如果使用了 Memory）：Agent 可能根据之前的对话结果选择工具，比如“刚才查询了天气，现在需要推荐活动”。

    - 工具的参数 schema：LLM 会判断它是否能从用户问题或上下文中提取出正确的参数。如果参数缺失，它可能会主动向用户询问。

    示例：用户问“明天杭州天气如何？”，Agent 读到 search_weather 的描述“查询指定城市的实时天气”，而 calculate 的描述是“执行数学计算”，它会自然地选择前者。

    ✅ 技巧：如果 Agent 经常选错工具，问题通常出在工具的描述重叠。例如，两个工具都能“获取信息”，Agent 就会随机选。此时需要让描述更具区分度，比如“从数据库查询订单”和“从网页搜索新闻”。


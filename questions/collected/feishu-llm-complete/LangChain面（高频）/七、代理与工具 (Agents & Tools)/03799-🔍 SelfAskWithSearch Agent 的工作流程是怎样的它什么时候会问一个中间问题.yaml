content:
  prompt: "\U0001F50D SelfAskWithSearch Agent 的工作流程是怎样的？它什么时候会问一个中间问题？"
answer:
  mode: rubric
  reference_answer: |-
    SelfAskWithSearch Agent 是 LangChain 中专门为多步搜索设计的 Agent。它模拟了人类在查找复杂信息时的行为：当一个问题不能直接搜索到答案时，会先把它拆解成一个更简单的、可搜索的子问题，然后再根据结果逐步逼近最终答案。

    工作流程：

    - 用户提出一个需要多跳推理的问题，例如：“谁是《哈利波特》中哈利的教父的堂姐的女儿？”

    - Agent 首先判断无法直接搜索这个问题，于是生成一个中间问题：“哈利波特的教父是谁？”

    - 调用搜索工具，得到结果：“小天狼星布莱克”。

    - Agent 接着问：“小天狼星布莱克的堂姐是谁？”

    - 搜索得到：“贝拉特里克斯·莱斯特兰奇”。

    - Agent 再问：“贝拉特里克斯·莱斯特兰奇的女儿是谁？”

    - 搜索得到：“戴尔菲”。

    - Agent 整理信息，输出最终答案：“戴尔菲”。

    它什么时候会问一个中间问题？
    当 LLM 分析用户问题后，认为无法通过单次搜索获得答案，或者问题中包含了未知实体时，它会自动生成一个中间问题。这个决策是由 LLM 根据 Prompt 中的示例（Few-shot）做出的。LangChain 的 SelfAskWithSearchAgent 内置了处理这种多跳推理的 Prompt。

    特点：

    - 仅适用于搜索类任务，因为它依赖一个搜索工具（如 Google 搜索、向量库检索）。

    - 执行过程中会多次调用搜索工具，每次搜索一个简单问题。

    - Prompt 中包含了清晰的示例，让 LLM 学会何时分解问题。

    限制：它假设所有信息都可以通过搜索得到，如果中间问题本身需要推理（例如需要计算），它就无能为力了。另外，它不会使用其他类型的工具，只专注于搜索。

    ✅ 个人看法：这个 Agent 设计得很巧妙，但通用性太差。我更多是把它当成一个教学案例，实际业务中，我通常会用 ReAct 或 Functions Agent 配合自定义的搜索工具，效果更灵活。


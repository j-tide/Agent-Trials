content:
  prompt: "\U0001F4E1 在 LangChain 中，如何实现 Agent 之间的通信？你会用什么方式传递消息？"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 没有内建的 Agent 间通信协议，但你可以通过共享 Memory 或消息队列来模拟通信。

    常用方法

    - 通过共享 Memory 传递
    所有 Agent 使用同一个 ChatMessageHistory 实例（或同一个 Redis key）。一个 Agent 写入消息，另一个 Agent 读取。这是最直接的“黑板模式”。

    - 通过 Tool 的输入输出传递
    如分层 Agent 中，主管 Agent 调用子 Agent 时，通过工具的参数传递信息，子 Agent 的结果通过返回值传回。这是点对点通信。

    - 使用外部消息队列或数据库
    在复杂的多 Agent 系统中，可以使用 Redis Pub/Sub、Kafka 等消息中间件。每个 Agent 订阅特定频道，接收任务并发布结果。这种方式解耦性最好。

    - 利用 LangChain 的 Callbacks
    在 Agent 的关键节点（如工具调用前后），通过回调将消息写入共享存储，其他 Agent 可以监听这些变化。

    传递消息的格式：建议使用 JSON，包含 from, to, task, payload, timestamp 等字段，便于扩展和追踪。


content:
  prompt: "\U0001F4DA Agent 有哪几种主要类型？（ReAct, OpenAI Functions, StructuredChat 等）各自的特点。"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 支持多种 Agent 类型，它们的核心区别在于如何构造 Prompt 和如何解析 LLM 的输出。

    - ReAct Agent

    - 特点：经典模式，强调“Thought, Action, Observation”。Prompt 通常包含详细的示例（Few-shot），指导 LLM 按固定格式输出。

    - 适用场景：开源模型，或者对格式控制要求高的场景。

    - 优势：逻辑清晰，可解释性强，不依赖模型特定的 API。

    - 局限：输出格式有时不稳定，需要较长的 Prompt，会消耗更多 token。

    - OpenAI Functions Agent

    - 特点：专门为 OpenAI 的 Function Calling 能力设计。LLM 不再输出文本格式的 Action，而是直接生成一个函数调用 JSON。

    - 适用场景：使用 gpt-3.5-turbo-0613 或 gpt-4-0613 及以上版本。

    - 优势：稳定性极高，支持复杂参数结构，能一次调用多个函数。

    - 局限：强依赖 OpenAI API，其他模型不支持。

    - StructuredChat Agent

    - 特点：支持输出结构化的聊天消息，能够处理多参数、嵌套参数的工具。它使用 FunctionMessage 等消息类型。

    - 适用场景：需要复杂工具调用，但不想绑定 OpenAI 时（例如使用 Anthropic 模型）。

    - 优势：灵活，可以适配多种 LLM。

    - 局限：配置较复杂，Prompt 工程要求高。

    - SelfAskWithSearch Agent

    - 特点：专门为需要多步搜索的场景设计。它会先提出一个中间问题，然后搜索，再根据搜索结果继续提问。

    - 适用场景：需要多跳推理的事实性问题，例如“《哈利波特》中哈利的教父的堂姐的女儿是谁？”

    - 优势：非常适合逐步挖掘信息。

    - 局限：只适用于搜索类任务，通用性差。

    - Conversational Agent

    - 特点：为多轮对话优化，使用 ConversationalChatAgent，它能自动管理对话历史。

    - 适用场景：聊天机器人。

    - 优势：能结合上下文理解后续问题。

    - 局限：推理能力不如 ReAct 或 Functions Agent。

    - XML Agent

    - 特点：用 XML 标签解析 Agent 的输出，适合需要复杂嵌套结构的场景。

    ✅ 我的选择经验：如果使用 OpenAI 的模型，无脑上 OpenAI Functions Agent，它真的太稳了。如果模型不支持 Function Calling，或者需要极致的可解释性，就选 ReAct。StructuredChat 我通常只在有特殊输出结构需求时才用。


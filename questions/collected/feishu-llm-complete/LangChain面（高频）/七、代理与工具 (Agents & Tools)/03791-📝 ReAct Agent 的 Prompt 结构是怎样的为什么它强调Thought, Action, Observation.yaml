content:
  prompt: "\U0001F4DD ReAct Agent 的 Prompt 结构是怎样的？为什么它强调“Thought, Action, Observation”？"
answer:
  mode: rubric
  reference_answer: |-
    ReAct Agent 的 Prompt 是整个 Agent 行为的核心。它通常包含以下部分：

    - 系统指令/角色描述

    告诉 LLM 你是一个助手，可以使用工具，并说明如何输出。

    - 可用工具列表

    每个工具的名字、描述和参数。例如：

    You have access to the following tools:
    > Weather: 查询指定城市的天气，输入城市名称
    > Calculator: 计算数学表达式，输入表达式

    - 输出格式要求

    明确要求 LLM 按特定格式输出，通常是：

    Thought: [你的思考过程]
    Action: [工具名称]
    Action Input: [工具输入]
    Observation: [工具返回的结果]
    ... (重复)
    Final Answer: [最终答案]

    - 示例（Few-shot）

    这是关键部分。LangChain 内置了一些示例，展示如何一步步推理和调用工具。这些示例教会 LLM 如何拆解问题、何时应该使用工具。

    - 用户的问题

    为什么强调“Thought, Action, Observation”？

    这个结构源自认知科学中的“思考-行动-观察”循环。对于 LLM 来说，它有几个重要作用：

    - 分解复杂问题：强制 LLM 把推理过程写出来（Thought），这样它自己也能更清晰地规划下一步。

    - 结构化解耦：把“思考”（内部）和“行动”（外部）分开，让 LLM 知道何时该想、何时该做。

    - 可解释性：开发者可以阅读 Thought，理解 Agent 的决策逻辑，方便调试。

    - 错误恢复：如果 Observation 显示错误，Agent 可以根据 Thought 调整策略，而不是盲目重试。

    ✅ 实际感受：ReAct Prompt 就像教一个实习生如何工作。你不仅告诉他有什么工具，还给了他几个完整的例子，让他照着做。但这个 Prompt 非常长（轻松上千 token），成本不低。而且偶尔会出现格式错误，比如忘记写“Action:”，LangChain 的解析器就会报错。所以后来我基本都转向 Function Calling 了。


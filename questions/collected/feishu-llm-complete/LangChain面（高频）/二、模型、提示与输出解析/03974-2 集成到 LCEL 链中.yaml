answer:
  mode: rubric
  reference_answer: |-
    自定义解析器就像任何内置解析器一样，可以直接通过 | 操作符集成到你的链中。

    ```python
    # 初始化自定义解析器
    my_parser = NameAgeParser()

    # 使用 LCEL 组装链
    chain = prompt | model | my_parser

    # 调用链
    result = chain.invoke({"text": "请提取信息。"})
    print(result)  # 输出: {'姓名': '张三', '年龄': 25}
    ```

    自定义 Output Parser 的设计哲学在于，它将非标准化的输出处理逻辑封装在一个独立的、可复用的组件中，保持了代码的整洁和可维护性，同时完全保留了 LangChain 的流式、异步等高级功能。

    ### 在 LCEL 中，如何将 Output Parser 集成到链里？写出链的组装代码。

    LCEL（LangChain Expression Language）通过 | 管道操作符提供了极为优雅的链式组装方式。Output Parser 作为一个 Runnable，可以无缝串联在模型之后，自动接收模型输出并解析。

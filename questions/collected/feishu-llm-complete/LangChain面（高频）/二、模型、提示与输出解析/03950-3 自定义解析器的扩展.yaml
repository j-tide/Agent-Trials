  reference_answer: |-
    如果你需要解析非标准的 Agent 格式，可以继承 BaseOutputParser 并实现类似的逻辑，然后将其传递给 Agent 构造函数。这种灵活性使得 LangChain 的 Agent 框架可以适应各种提示词策略。

    ---

    ### 谈谈 LangChain 中 Output Parser 和 Prompt Template 的协作机制：格式说明是如何自动注入的？

    Output Parser 和 Prompt Template 的协作是 LangChain 中自动化程度最高的部分之一，它解决了“如何让模型知道并遵循输出格式”这一关键问题。其核心机制是：Output Parser 通过 get_format_instructions() 方法生成格式说明字符串，Prompt Template 通过变量占位符将其注入到提示词中。

answer:
  mode: rubric
  reference_answer: |-
    ReActSingleInputOutputParser 是 LangChain 中用于解析单轮 Agent 输出的解析器。它负责从 LLM 的文本输出中识别出 Action 和 Action Input 部分。

    其核心逻辑是：

    - 在 Prompt 中，我们已经要求 LLM 以 Thought/Action/Action Input/Observation 的格式输出。

    - ReActSingleInputOutputParser 内部使用正则表达式来匹配这些模式。

    - 如果匹配到 Action: 和 Action Input:，则返回一个 AgentAction 对象，包含工具名和输入。

    - 如果匹配到 Final Answer:，则返回一个 AgentFinish 对象，包含最终答案。

    - 如果两者都没匹配到，或者格式不完整，它会抛出 OutputParserException。

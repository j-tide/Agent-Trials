answer:
  mode: rubric
  reference_answer: |-
    PydanticOutputParser 使用 Pydantic 的 BaseModel 来定义数据结构，它提供了更强大的类型校验、默认值、复杂嵌套和自定义验证器等高级功能。

    ```python
    from pydantic import BaseModel, Field

    class AnswerWithSource(BaseModel):
        answer: str = Field(description="用户问题的回答")
        source: str = Field(description="回答所依据的参考来源")

    parser = PydanticOutputParser(pydantic_object=AnswerWithSource)
    ```

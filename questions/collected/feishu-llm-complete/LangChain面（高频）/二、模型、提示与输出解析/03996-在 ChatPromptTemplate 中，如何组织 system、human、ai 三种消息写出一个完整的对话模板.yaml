content:
  prompt: 在 ChatPromptTemplate 中，如何组织 system、human、ai 三种消息？写出一个完整的对话模板。
answer:
  mode: rubric
  reference_answer: "\U0001F4AC ChatPromptTemplate 使用 from_messages 方法定义消息序列，每条消息是一个
    (role, content) 元组。角色可以是 \"system\"、\"human\"（或 \"user\"）、\"ai\"（或 \"assistant\"）、\"function\"、\"tool\"。内容中可以包含
    {变量}。\n\n下面是一个完整的对话模板，包含系统指令、历史对话占位、当前用户输入：\n\n```python\nfrom langchain_core.prompts
    import ChatPromptTemplate, MessagesPlaceholder\n\n# 定义模板\ntemplate = ChatPromptTemplate.from_messages([\n
    \   (\"system\", \"你是一个{role}。请用{language}回答问题。\"),\n    MessagesPlaceholder(variable_name=\"history\"),
    \ # 用于插入多轮历史\n    (\"human\", \"{question}\")\n])\n\n# 准备输入数据\nfrom langchain_core.messages
    import HumanMessage, AIMessage\n\nhistory = [\n    HumanMessage(content=\"我叫小明\"),\n
    \   AIMessage(content=\"你好小明，有什么可以帮助你？\")\n]\n\n# 格式化\nmessages = template.invoke({\n
    \   \"role\": \"专业的烹饪顾问\",\n    \"language\": \"中文\",\n    \"question\": \"请推荐一道简单易做的家常菜。\",\n
    \   \"history\": history\n})\n\n# messages 现在是一个 List[BaseMessage]，可直接传给模型\nprint(messages)\n```\n\n\U0001F4CB
    输出结果：\n\n```text\n[\n  SystemMessage(content=\"你是一个专业的烹饪顾问。请用中文回答问题。\"),\n  HumanMessage(content=\"我叫小明\"),\n
    \ AIMessage(content=\"你好小明，有什么可以帮助你？\"),\n  HumanMessage(content=\"请推荐一道简单易做的家常菜。\")\n]\n```\n\n\U0001F527
    关键组件解释：\n\n- MessagesPlaceholder：用于在格式化时动态插入外部消息列表（如从记忆模块加载的历史对话），而不是在模板中硬编码。\n\n-
    角色别名：\"human\" 和 \"user\" 等价，\"ai\" 和 \"assistant\" 等价。\n\n- 变量传递：invoke 时传入的字典中的变量会替换所有模板中的
    {变量}，包括 \"system\" 和 \"human\" 中的部分。\n\n这种方式让对话模板既结构清晰又极其灵活，你可以随意调整系统指令、插入历史、接收用户输入，无需手动拼接字符串。"

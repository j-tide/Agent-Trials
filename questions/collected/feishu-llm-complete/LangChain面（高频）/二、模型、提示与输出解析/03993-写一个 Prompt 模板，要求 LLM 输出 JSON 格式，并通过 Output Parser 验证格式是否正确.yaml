content:
  prompt: 写一个 Prompt 模板，要求 LLM 输出 JSON 格式，并通过 Output Parser 验证格式是否正确。
answer:
  mode: rubric
  reference_answer: "让 LLM 输出可靠的结构化数据是 Prompt 工程的核心技巧。LangChain 的 PydanticOutputParser
    或 JsonOutputParser 可以自动生成格式指令，并解析验证输出。\n\n\U0001F4DC 示例：提取个人信息，要求输出包含 name、age
    和 skills 的 JSON。\n\n```python\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom
    langchain_core.output_parsers import PydanticOutputParser\nfrom pydantic import
    BaseModel, Field\nfrom typing import List\n\n# 1. 定义输出结构\nclass PersonInfo(BaseModel):\n
    \   name: str = Field(description=\"姓名\")\n    age: int = Field(description=\"年龄\")\n
    \   skills: List[str] = Field(description=\"技能列表\")\n\n# 2. 创建解析器，它会自动生成格式指令\nparser
    = PydanticOutputParser(pydantic_object=PersonInfo)\n\n# 3. 构建 Prompt，将格式指令注入系统消息\ntemplate
    = ChatPromptTemplate.from_messages([\n    (\"system\", \"你是一个信息提取助手。请按以下格式输出JSON：\\n{format_instructions}\"),\n
    \   (\"human\", \"请从以下文本中提取姓名、年龄和技能：\\n{text}\")\n])\n\n# 4. 组合链\nchain = template
    | model | parser\n\n# 5. 调用\nresult = chain.invoke({\n    \"text\": \"张三，30岁，擅长Python、机器学习和数据分析。\",\n
    \   \"format_instructions\": parser.get_format_instructions()\n})\nprint(result)\n#
    输出: PersonInfo(name='张三', age=30, skills=['Python', '机器学习', '数据分析'])\n```\n\n⚙️
    工作流程：\n\n- parser.get_format_instructions() 会生成一个包含 JSON Schema 的字符串，告诉模型期望的字段和类型。\n\n-
    模型返回原始 JSON 字符串后，PydanticOutputParser 会自动解析并验证。如果格式不符，会抛出 OutputParserException，可以捕获后重试或返回错误信息。\n\n\U0001F527
    容错处理：如果模型偶尔输出格式不完美的 JSON，可以使用 OutputFixingParser 包装，它会尝试用 LLM 自动修复。"

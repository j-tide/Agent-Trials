content:
  prompt: 怎样在 LangChain 中控制 LLM 的输出 token 数量？有哪些参数可以设置？
answer:
  mode: rubric
  reference_answer: "控制输出 token 数量对于成本控制和响应长度管理至关重要。LangChain 提供了多种方式：\n\n\U0001F39B️
    核心参数：\n\n- max_tokens（或 max_new_tokens）：限制生成的最大 token 数。在 ChatOpenAI 等模型中，可直接在初始化时传入。\n\n-
    temperature：控制输出的随机性。较低的温度（0.0~0.3）使输出更确定，token 使用更高效；较高的温度（0.7~1.0）使输出更多样，可能消耗更多
    token。\n\n- top_p：核采样，与 temperature 配合使用，控制输出的多样性。\n\n\U0001F4DC 示例：\n\nmodel
    = ChatOpenAI(\n    model=\"gpt-4o\",\n    max_tokens=256,      # 最多生成 256 个 token\n
    \   temperature=0.2,\n    top_p=0.9\n)\n\n⚙️ 在 Prompt 中约束：\n\n你可以在 System Prompt
    中明确要求模型“用不超过 50 个字回答”或“用一句话总结”。虽然模型不一定严格遵守，但能显著减少输出长度。\n\n\U0001F4CA 运行时监控：\n\n通过回调或
    LangSmith 追踪实际的 Token 消耗，如果发现超支，可以在应用层截断、替换为更短的模型响应，或者切换至更便宜的模型。"

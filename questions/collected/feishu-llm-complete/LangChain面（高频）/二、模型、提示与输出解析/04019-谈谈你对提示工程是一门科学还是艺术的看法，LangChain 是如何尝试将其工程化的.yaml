content:
  prompt: 谈谈你对“提示工程是一门科学还是艺术”的看法，LangChain 是如何尝试将其工程化的？
answer:
  mode: rubric
  reference_answer: "\U0001F9EA 提示工程兼具科学与艺术的双重属性。\n\n- 艺术性：设计出激发模型最佳性能的提示，往往依赖直觉、经验和大量试错。同一个任务，不同的措辞、示例顺序、温度设置可能导致天壤之别的效果，没有放之四海而皆准的公式。这种创造性和不确定性让它具有艺术特质。\n\n-
    科学性：它又有可复现、可测量的科学属性。通过控制变量、A/B 测试、自动评测（如使用 LangSmith 的 Evaluators），我们可以用数据量化不同提示的效果，找出最优配置。提示的格式（如
    JSON Schema 约束）和结构（如 Chain-of-Thought）是基于对模型底层原理的理解。\n\n\U0001F6E0️ LangChain
    如何将其工程化：\n\n- 声明式模板：PromptTemplate 和 ChatPromptTemplate 将提示结构化为可复用的组件，使得提示能够被版本化、共享和自动加载。\n\n-
    解析器与验证：OutputParser 确保输出符合预定义格式，将提示工程的“艺术”转化为可靠的工程实践。\n\n- 实验与评测：LangSmith 允许对多个提示版本运行批量测试，用预定义的指标（如准确性、一致性）自动评分，将主观感受转化为客观数据。\n\n-
    少样本示例选择器：ExampleSelector 自动选取相关示例，减少了人工挑选示例的“艺术性”负担。\n\n- LCEL 的组合性：提示可以像函数一样被组合、绑定、回退，增强了可维护性和鲁棒性。\n\n总之，LangChain
    没有消灭提示工程的艺术性，而是为它搭建了一个工程化的脚手架，让开发者能够更高效地探索、评估和部署提示。"

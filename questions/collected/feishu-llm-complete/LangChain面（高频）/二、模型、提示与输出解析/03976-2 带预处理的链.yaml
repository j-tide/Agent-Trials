answer:
  mode: rubric
  reference_answer: |-
    如果模型输出可能夹杂额外文本，可以在 model 和 parser 之间插入一个预处理步骤。RunnableLambda 可以将任意 Python 函数包装为 Runnable。

    ```python
    from langchain_core.runnables import RunnableLambda
    import re

    def extract_json(text: str) -> str:
        # 提取第一个完整 JSON 对象
        match = re.search(r'\{.*\}', text, re.DOTALL)
        if match:
            return match.group(0)
        raise ValueError("未找到有效JSON")

    # 链：prompt -> model -> 提取JSON -> parser
    chain = prompt | model | RunnableLambda(extract_json) | parser
    ```

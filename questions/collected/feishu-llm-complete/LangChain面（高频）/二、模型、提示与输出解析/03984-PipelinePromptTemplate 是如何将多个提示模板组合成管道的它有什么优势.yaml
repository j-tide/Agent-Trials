content:
  prompt: PipelinePromptTemplate 是如何将多个提示模板组合成管道的？它有什么优势？
answer:
  mode: rubric
  reference_answer: "\U0001F517 PipelinePromptTemplate 允许将多个提示模板按照顺序拼接成一个最终的提示，每个子模板的输出成为下一个子模板的一部分。它解决了复杂提示难以组织的问题，通过模块化提高了可维护性。\n\n\U0001F6E0️
    工作原理：PipelinePromptTemplate 接受一个 pipeline_prompts 列表，每个元素是一个 (name, prompt) 对。在
    invoke 时，它会依次调用每个子模板，并把前一个的输出注入到下一个的变量中。最终将所有子模板的输出拼接（通常用分隔符连接）成完整提示。\n\n\U0001F4DC
    示例：构建一个包含“背景知识”和“用户问题”的复杂提示：\n\n```python\nfrom langchain_core.prompts import
    PromptTemplate, PipelinePromptTemplate\n\n# 子模板1：提供背景\nbackground_prompt = PromptTemplate.from_template(\"背景知识：{context}\")\n#
    子模板2：用户指令\ninstruction_prompt = PromptTemplate.from_template(\"请根据背景回答：{question}\")\n#
    最终模板：拼接两者\nfinal_prompt = PromptTemplate.from_template(\"{background}\\n\\n{instruction}\")\n\npipeline
    = PipelinePromptTemplate(\n    final_prompt=final_prompt,\n    pipeline_prompts=[\n
    \       (\"background\", background_prompt),\n        (\"instruction\", instruction_prompt)\n
    \   ]\n)\n\n# 调用\nresult = pipeline.invoke({\n    \"context\": \"量子计算基于量子位...\",\n
    \   \"question\": \"量子计算有什么优势？\"\n})\nprint(result)\n```\n\n✅ 优势：\n\n- 模块化：每个子模板独立管理，可以单独测试和复用。\n\n-
    清晰的结构：复杂提示被拆解为逻辑片段，便于团队协作。\n\n- 灵活组合：可以根据条件动态选择不同的子模板，而不是使用大量 if-else。\n\n- 减少重复：共享的部分（如固定前缀）可以抽取为子模板。\n\n在
    RAG 系统中，常常需要将检索到的文档、用户问题、指令组合在一起，PipelinePromptTemplate 能优雅地完成这项任务。"

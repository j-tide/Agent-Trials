answer:
  mode: rubric
  reference_answer: |-
    ```python
    from langchain_core.output_parsers import PydanticOutputParser, OutputFixingParser
    from langchain_openai import ChatOpenAI

    # 1. 定义基础解析器
    base_parser = PydanticOutputParser(pydantic_object=Paper)

    # 2. 创建 OutputFixingParser
    # 它需要两个参数：被包装的解析器，和用于修复的 LLM
    fixing_parser = OutputFixingParser.from_llm(
        parser=base_parser,
        llm=ChatOpenAI(model="gpt-4o", temperature=0)
    )

    # 3. 将修复解析器集成到链中
    chain = template | model | fixing_parser

    # 当 model 输出 `"好的，这是提取的论文信息：\n{\"title\": ...}"` 时，
    # base_parser 解析失败，OutputFixingParser 会启动修复流程
    ```

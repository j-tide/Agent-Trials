answer:
  mode: rubric
  reference_answer: |-
    LangChain 提供了一些内置工具来处理不完整或混杂的 JSON。langchain_core.utils.json 中的 parse_partial_json 可以解析不完整的 JSON（适合流式场景），但它无法处理夹杂的非 JSON 文本。

    对于“文本+JSON”的情况，更好的方式是使用 langchain_core.output_parsers.json 中的 parse_json_markdown，它能从 Markdown 代码块中提取 JSON（例如 ```json ... ```）。

    ```python
    from langchain_core.output_parsers.json import parse_json_markdown

    def extract_json(text: str) -> str:
        try:
            return parse_json_markdown(text)
        except Exception:
            # 回退到自定义正则提取
            return extract_and_clean_json(text)
    ```

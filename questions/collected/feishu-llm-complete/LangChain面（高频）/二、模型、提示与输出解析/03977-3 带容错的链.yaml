answer:
  mode: rubric
  reference_answer: |-
    结合 OutputFixingParser 或 RetryWithErrorOutputParser，可以进一步提升链的鲁棒性。

    ```python
    from langchain_core.output_parsers import OutputFixingParser, RetryWithErrorOutputParser

    # 基础解析器
    base_parser = PydanticOutputParser(pydantic_object=Person)

    # 修复解析器
    fixing_parser = OutputFixingParser.from_llm(
        parser=base_parser,
        llm=ChatOpenAI(model="gpt-4o", temperature=0)
    )

    # 链：prompt -> model -> 修复解析器
    chain = prompt | model | fixing_parser
    ```

    或者使用重试解析器：

    ```python
    retry_parser = RetryWithErrorOutputParser.from_llm(
        parser=base_parser,
        llm=ChatOpenAI(model="gpt-4o", temperature=0)
    )
    chain = prompt | model | retry_parser
    ```

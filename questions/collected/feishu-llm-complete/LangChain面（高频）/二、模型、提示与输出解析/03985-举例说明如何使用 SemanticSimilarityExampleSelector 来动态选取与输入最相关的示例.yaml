content:
  prompt: 举例说明如何使用 SemanticSimilarityExampleSelector 来动态选取与输入最相关的示例。
answer:
  mode: rubric
  reference_answer: "\U0001F50D SemanticSimilarityExampleSelector 利用向量相似度来选取与用户问题最相似的示例，适合示例库庞大且需要高相关性的场景。\n\n\U0001F4DC
    代码示例：\n\n```python\nfrom langchain_core.example_selectors import SemanticSimilarityExampleSelector\nfrom
    langchain_openai import OpenAIEmbeddings\nfrom langchain_chroma import Chroma\n\n#
    1. 准备示例库\nexamples = [\n    {\"input\": \"你好\", \"output\": \"你好！有什么可以帮你的？\"},\n
    \   {\"input\": \"天气如何？\", \"output\": \"请告诉我你的城市。\"},\n    {\"input\": \"讲个笑话\",
    \"output\": \"为什么鸡过马路？...\"},\n    # ...更多示例\n]\n\n# 2. 创建选择器\nexample_selector
    = SemanticSimilarityExampleSelector.from_examples(\n    examples,\n    OpenAIEmbeddings(),
    \ # 嵌入模型\n    Chroma,             # 向量数据库\n    k=2                 # 每次选取最相似的2个示例\n)\n\n#
    3. 创建 FewShotPromptTemplate\nfrom langchain_core.prompts import FewShotPromptTemplate,
    PromptTemplate\n\nexample_prompt = PromptTemplate.from_template(\"用户：{input}\\n助手：{output}\")\n\nfew_shot_prompt
    = FewShotPromptTemplate(\n    example_selector=example_selector,\n    example_prompt=example_prompt,\n
    \   prefix=\"你是一个有帮助的助手。以下是对话示例：\",\n    suffix=\"用户：{query}\\n助手：\",\n    input_variables=[\"query\"]\n)\n\n#
    4. 使用\nquery = \"我心情不好，能给我讲个笑话吗？\"\nselected = few_shot_prompt.invoke({\"query\":
    query})\nprint(selected)\n```\n\n⚙️ 工作流程：\n\n- 用户输入 \"我心情不好，能给我讲个笑话吗？\"。\n\n-
    example_selector 将其向量化，在向量库中查找最相似的示例（这里可能会匹配到 \"讲个笑话\" 相关的示例）。\n\n- 选中的示例被格式化为
    \"用户：...\\n助手：...\" 并插入提示。\n\n- 最终的 Prompt 包含前缀、相关示例、后缀和用户当前问题。\n\n这种方式在客服、FAQ、翻译等任务中非常有效，能动态为模型提供最具参考价值的范例。"

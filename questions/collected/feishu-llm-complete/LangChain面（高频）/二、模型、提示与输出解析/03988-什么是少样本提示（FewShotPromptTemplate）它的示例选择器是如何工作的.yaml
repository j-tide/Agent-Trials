content:
  prompt: 什么是少样本提示（FewShotPromptTemplate）？它的示例选择器是如何工作的？
answer:
  mode: rubric
  reference_answer: "\U0001F4DA FewShotPromptTemplate 是一种特殊的提示模板，它在指令之后插入几个“示例”（输入-输出对），帮助模型更好地理解任务格式和期望答案。这对于那些需要特定输出格式（如分类、JSON输出）的任务尤其有用。\n\n\U0001F9E9
    核心组件：\n\n- examples：一个示例列表，每个示例是一个字典，包含输入变量和输出变量。\n\n- example_prompt：一个 PromptTemplate，定义如何将每个示例格式化为文本。\n\n-
    prefix：在示例之前的指令或背景信息。\n\n- suffix：在示例之后、用户输入之前的引导语。\n\n- example_selector：可选，一个选择器，根据用户输入动态选取最相关的示例（避免超过上下文长度或提高相关性）。\n\n⚙️
    示例选择器的工作原理：\n当用户输入到来时，example_selector 会根据一定策略（如语义相似度、长度、随机等）从 examples 池中选出最合适的少量示例。选择后，这些示例被格式化并拼接到提示中。\n\n常见的选择器：\n\n-
    SemanticSimilarityExampleSelector：基于嵌入向量相似度，选择与用户输入最相关的示例。\n\n- LengthBasedExampleSelector：根据示例长度和最大
    token 限制动态选择示例数量。\n\n- RandomExampleSelector：随机选择。\n\n使用选择器的优势是：在大型示例库中，既控制了 Prompt
    长度，又保证了示例的相关性，从而提升模型准确性。"

content:
  prompt: 解释 invoke、ainvoke、stream、astream 四个方法的调用时机和返回值差异。
answer:
  mode: rubric
  reference_answer: "这四个方法是 Runnable 接口的核心，定义了与组件的交互方式。它们都基于底层的 _generate 和 _stream
    实现。\n\n[嵌入表格未展开]\n\n\U0001F50D 细节差异：\n\n- stream/astream 返回的是 AIMessageChunk 的迭代器。每个
    Chunk 包含部分内容，最后可能需要通过 StrOutputParser 等解析器处理，也可以直接累加。\n\n- 在 LCEL 中，如果链中任何组件支持
    stream，且你调用链的 stream 方法，整个链会自动变为流式，数据逐级传递。\n\n- ainvoke 需要 Python 的 asyncio 环境。如果你的应用基于
    FastAPI，使用异步方法可以避免阻塞其他请求，提升并发。"

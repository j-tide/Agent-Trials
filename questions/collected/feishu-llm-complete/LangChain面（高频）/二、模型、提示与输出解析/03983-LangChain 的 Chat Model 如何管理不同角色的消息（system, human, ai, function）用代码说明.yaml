content:
  prompt: LangChain 的 Chat Model 如何管理不同角色的消息（system, human, ai, function）？用代码说明。
answer:
  mode: rubric
  reference_answer: "\U0001F4AC LangChain 使用 BaseMessage 的子类来区分消息角色，从而构建结构化的对话历史。这些消息类型构成了
    ChatPromptTemplate 和模型输入的基石。\n\n\U0001F4CB 核心消息类型：\n\n[嵌入表格未展开]\n\n\U0001F4DC
    在 Prompt 模板中使用：\n\nfrom langchain_core.prompts import ChatPromptTemplate, MessagesPlaceholder\n\nprompt
    = ChatPromptTemplate.from_messages([\n    (\"system\", \"你是一个{role}，用{language}回答。\"),\n
    \   MessagesPlaceholder(variable_name=\"history\"),  # 历史消息占位\n    (\"human\",
    \"{question}\")\n])\n\n# 构建消息列表\nfrom langchain_core.messages import SystemMessage,
    HumanMessage, AIMessage\n\nmessages = prompt.format_messages(\n    role=\"助手\",
    language=\"中文\", question=\"你好\",\n    history=[\n        HumanMessage(content=\"我叫小明\"),\n
    \       AIMessage(content=\"你好小明，有什么可以帮你？\")\n    ]\n)\n# messages 是一个 List[BaseMessage]，可直接传给
    model.invoke(messages)\n\n\U0001F504 模型如何处理：\n\n- ChatOpenAI 等内部会将 SystemMessage
    映射为 role: \"system\" 的字典。\n\n- HumanMessage → role: \"user\"。\n\n- AIMessage →
    role: \"assistant\"（如果包含 tool_calls，还会附带 tool_calls 字段）。\n\n- ToolMessage → role:
    \"tool\"，并附加 tool_call_id。\n\n这种设计使得对话历史可以跨模型提供商保持统一，开发者无需关心底层 API 的消息格式差异。\n\n\U0001F527
    动态管理消息：\n\n- 使用 trim_messages 可以自动裁剪历史消息，以适配模型的上下文窗口。\n\n- MessagesPlaceholder
    允许在 Prompt 模板中灵活插入可变长度的消息列表。"

answer:
  mode: rubric
  reference_answer: |-
    - 使用 Literal 约束类型：type 字段使用了 Literal["PERSON", "LOC", ...]，这会在生成的 JSON Schema 中限制类型必须是这几个枚举值之一。这能有效降低模型的“幻觉”，避免它创造出奇怪的实体类型。

    - 保留 mention 字段：mention 记录了实体在原文中的原始表述，这对于回溯和校验非常重要，因为模型可能会规范化实体名称（如将“小张”提取为“张伟”）。

    - 包装在列表对象中：直接要求模型输出一个 List[Entity] 有时不太稳定。像上面那样用一个 EntityExtraction 对象包裹 entities: List[Entity] 字段，结构更清晰，模型也更容易理解，符合 JSON 最佳实践。

    通过这种方式，我们就能可靠地将一段自由文本转化为一个包含丰富信息的实体对象列表，供下游应用使用。

    ### 如何自定义一个 Output Parser？需要继承哪个基类，实现哪些方法？

    当你的 LLM 输出格式非常特殊，既不是 JSON，也不是简单列表时，自定义 Output Parser 就派上了用场。例如，你要求模型输出一种自定义的标记语言。LangChain 让这个过程变得非常简单。

answer:
  mode: rubric
  reference_answer: "\U0001F516 Prompt 版本管理是 LLM 应用工程化的关键。当应用上线后，修改 Prompt 可能带来不可预知的行为变化，因此需要像管理代码一样管理
    Prompt。\n\n管理策略与工具链：\n\n- Git 版本控制 + YAML/JSON 文件\n\n- LangSmith 的 Prompt Hub\n\n-
    Prompt 版本命名规范\n\n- 与 CI/CD 集成\n\n- 运行时动态切换\n\n\U0001F4CA 经验之谈：我们团队在使用 LangSmith
    后，Prompt 迭代效率提升显著。过去修改 Prompt 要靠“感觉”，现在可以在 Web 界面直接运行测试、查看 Trace，并对比不同版本的效果，大大降低了盲目性。"

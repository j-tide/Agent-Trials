content:
  prompt: 在 LangChain 中，如何为模型调用设置超时时间？超过后如何处理？
answer:
  mode: rubric
  reference_answer: "⏱️ 设置超时可以防止因为网络延迟、模型过载等原因导致的无限等待。\n\n\U0001F6E0️ 方式一：在模型初始化时设置
    request_timeout 参数（适用于 ChatOpenAI 等）\n\nmodel = ChatOpenAI(model=\"gpt-4\", request_timeout=30)
    \ # 30秒超时\n\n这个参数会传递给底层 HTTP 客户端（如 httpx 或 requests），当响应时间超过设定值时抛出 ReadTimeout
    异常。\n\n\U0001F6E0️ 方式二：通过 model_kwargs 传递底层参数\n\n某些提供商的超时参数可能不同，可以通过 model_kwargs
    传递。\n\nmodel = ChatOpenAI(model=\"gpt-4\", model_kwargs={\"timeout\": 30, \"max_retries\":
    2})\n\n\U0001F6E0️ 方式三：使用 with_fallbacks 结合超时异常处理\n\n你可以自定义一个 Runnable，在其中捕获超时异常并尝试备用模型。\n\nfrom
    langchain_core.runnables import RunnableLambda\n\ndef call_with_timeout(input):\n
    \   try:\n        return model.invoke(input)\n    except (Timeout, ConnectionError):\n
    \       return fallback_model.invoke(input)\n\nrobust_chain = prompt | RunnableLambda(call_with_timeout)
    | parser\n\n\U0001F6E0️ 方式四：异步环境中的超时控制\n\n在异步代码中，可以使用 asyncio.wait_for 包裹 ainvoke，设置超时后抛出
    asyncio.TimeoutError。\n\nimport asyncio\n\ntry:\n    result = await asyncio.wait_for(model.ainvoke(messages),
    timeout=10.0)\nexcept asyncio.TimeoutError:\n    result = await fallback_model.ainvoke(messages)\n\n⚙️
    超过超时后的处理建议：\n\n- 重试（特别是网络抖动）：使用 max_retries 参数配合指数退避。\n\n- 降级（fallback）：切换至更快的模型或本地模型。\n\n-
    返回缓存结果：如果相同请求之前成功过，可以考虑返回缓存。\n\n- 上报告警：记录超时次数，用于监控和优化。"

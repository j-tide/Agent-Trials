content:
  prompt: ChatPromptTemplate 和普通的 PromptTemplate 在使用上有什么关键区别？
answer:
  mode: rubric
  reference_answer: "\U0001F4AC ChatPromptTemplate 是专门为对话模型设计的，而 PromptTemplate 是为文本补全模型设计的。它们的核心区别在于输出的数据类型和结构。\n\n-
    PromptTemplate：输出是一个单一的字符串。它适用于那些将整个提示当作一段文字输入的模型（如早期的 GPT-3、text-davinci-003）。你无法在里面区分“系统指令”、“用户消息”等角色，只能把所有内容拼成一段文本。\n\n-
    ChatPromptTemplate：输出是一个消息列表（List[BaseMessage]），包含 SystemMessage、HumanMessage、AIMessage
    等。这符合现代聊天模型（如 GPT-4、Claude、Llama 3）的 API 格式，天然支持多轮对话、角色扮演和工具调用。\n\n\U0001F4CA
    对比表：\n\n[嵌入表格未展开]\n\n\U0001F3AF 关键选择：只要你的模型支持聊天接口，一律使用 ChatPromptTemplate。即使你的任务看起来是单轮的，也可以用
    HumanMessage 包裹你的问题，因为聊天模型经过了指令微调，对角色信息更敏感。PromptTemplate 主要用于向后兼容或非常简单的文本生成场景。"

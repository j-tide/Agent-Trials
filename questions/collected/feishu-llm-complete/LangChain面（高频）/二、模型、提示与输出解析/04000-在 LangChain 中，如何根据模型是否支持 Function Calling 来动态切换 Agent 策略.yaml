content:
  prompt: 在 LangChain 中，如何根据模型是否支持 Function Calling 来动态切换 Agent 策略？
answer:
  mode: rubric
  reference_answer: "不同的模型对 Function Calling 的支持程度不同。例如 GPT-4 原生支持，而一些开源模型需要用 ReAct
    风格的 Prompt 模拟工具调用。LangChain 提供了灵活的机制来动态选择策略。\n\n\U0001F3AF 方案一：使用 bind_tools()
    判断\n对于支持 Function Calling 的模型，调用 bind_tools() 会生成正确的 API 参数。对于不支持的模型，bind_tools()
    可能只是将工具定义转换为 Prompt 文本。你可以通过检查模型的 supports_tool_calls 属性来判断。\n\n\U0001F4DC 示例：\n\nfrom
    langchain_openai import ChatOpenAI\nfrom langchain_ollama import ChatOllama\n\ndef
    create_agent(model, tools):\n    if hasattr(model, \"bind_tools\"):  # 支持 Function
    Calling\n        model_with_tools = model.bind_tools(tools)\n        # 使用 OpenAI
    Functions Agent\n        return create_openai_functions_agent(model_with_tools,
    tools)\n    else:\n        # 使用 ReAct Agent（通过 Prompt 模拟工具调用）\n        prompt
    = hub.pull(\"hwchase17/react\")\n        return create_react_agent(model, tools,
    prompt)\n\n\U0001F500 方案二：使用 RunnableBranch 动态路由\n在运行时根据模型类型选择不同的 Agent 执行路径：\n\nfrom
    langchain_core.runnables import RunnableBranch\n\ndef is_openai_model(model):\n
    \   return isinstance(model, ChatOpenAI)\n\nbranch = RunnableBranch(\n    (lambda
    x: is_openai_model(x[\"model\"]), openai_agent_chain),\n    react_agent_chain
    \ # 默认\n)\n\n这样，当部署环境切换模型时，Agent 策略自动适配，无需手动修改代码。"

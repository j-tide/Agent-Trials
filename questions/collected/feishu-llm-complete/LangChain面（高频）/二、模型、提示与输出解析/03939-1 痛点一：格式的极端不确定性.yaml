answer:
  mode: rubric
  reference_answer: |-
    即使我们在提示中明确要求“请用 JSON 格式输出”，模型也可能：

    - 在 JSON 前后添加“客套话”：例如，输出变成 “好的，根据您的要求，这是结果：\n{\"name\": \"张三\"}”。程序无法直接解析这个字符串。

    - 遗漏关键符号：如缺少闭合的引号、花括号或逗号，导致 JSON.parse 直接抛出异常。

    - 多语言符号混淆：中英文标点混用，如使用了中文分号；或中文引号“”，这些在标准 JSON 中是非法字符。

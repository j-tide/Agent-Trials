  reference_answer: |-
    对于嵌套列表，模型偶尔会遗漏某个字段。我们在自定义的解析逻辑中增加了一个后处理步骤，对于 Optional 字段自动填充默认值，避免下游因 None 值崩溃。这种“Pydantic + 自定义后处理”的组合拳在实际项目中非常有效。

    ---

    ### 在流式输出时，Output Parser 还能正常工作吗？会遇到什么问题？

    流式输出（Streaming）是提升用户体验的关键，但对 Output Parser 提出了挑战。

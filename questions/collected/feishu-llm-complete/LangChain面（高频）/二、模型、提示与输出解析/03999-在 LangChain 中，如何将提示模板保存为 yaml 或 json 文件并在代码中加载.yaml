content:
  prompt: 在 LangChain 中，如何将提示模板保存为 yaml 或 json 文件并在代码中加载？
answer:
  mode: rubric
  reference_answer: "\U0001F4C1 LangChain 提供了将 PromptTemplate、ChatPromptTemplate 等序列化为
    YAML/JSON 的方法，便于版本管理、团队共享和配置分离。\n\n\U0001F6E0️ 保存为 YAML：\n\n使用 save 方法（或 to_yaml）将模板写入文件。\n\n```python\nfrom
    langchain_core.prompts import ChatPromptTemplate\n\n# 创建模板\ntemplate = ChatPromptTemplate.from_messages([\n
    \   (\"system\", \"你是一个{role}。\"),\n    (\"human\", \"{question}\")\n])\n\n# 保存为
    YAML\ntemplate.save(\"my_prompt.yaml\")\n```\n\n生成的 my_prompt.yaml 文件内容类似：\n\n```yaml\n_type:
    chat\ninput_variables: [role, question]\nmessages:\n- role: system\n  content:
    '你是一个{role}。'\n- role: user\n  content: '{question}'\n```\n\n\U0001F6E0️ 保存为 JSON：使用
    save 并指定格式，或者直接调用 to_json() 方法。\n\n```python\ntemplate.save(\"my_prompt.json\",
    format=\"json\")\n```\n\n\U0001F504 从文件加载：\n\n使用 load_prompt 函数（需从 langchain_core.prompts
    导入）加载 YAML 或 JSON 文件。\n\n```python\nfrom langchain_core.prompts import load_prompt\n\nloaded_template
    = load_prompt(\"my_prompt.yaml\")\n# 现在可以正常使用\nmessages = loaded_template.invoke({\"role\":
    \"工程师\", \"question\": \"什么是CI/CD？\"})\n```\n\n\U0001F4E6 高级用法：\n\n- 你可以将多个模板放在一个目录下，通过
    load_prompt 支持递归加载。\n\n- 在 YAML/JSON 中，可以引用其他文件（使用 !include 标签），实现模板的组合。\n\n-
    配置管理工具（如 Hydra、OmegaConf）也可以与 LangChain 结合，将模板路径作为配置项。\n\n\U0001F4A1 最佳实践：\n\n-
    将提示模板与代码分离，方便非技术人员（如 Prompt 工程师）通过修改 YAML 文件调整提示。\n\n- 对关键模板进行版本控制（Git），结合 LangSmith
    实验对比不同版本的效果。\n\n- 敏感信息（如 API Key）不要放入模板文件，通过环境变量或秘密管理服务注入。\n\n通过这种方式，你可以像管理配置文件一样管理
    Prompt，让 LLM 应用更加工程化、可维护。"

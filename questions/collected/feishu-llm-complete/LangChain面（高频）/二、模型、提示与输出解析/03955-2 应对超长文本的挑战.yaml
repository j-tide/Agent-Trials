answer:
  mode: rubric
  reference_answer: |-
    合同文本很长，直接输入会超出模型的上下文窗口。我们采用 RunnableLambda 对文本进行分段处理，但解析器本身并不需要修改。关键技巧是在 Prompt 中利用 format_instructions 自动注入完整的 JSON Schema，让模型明白期望的复杂结构。

    ```python
    from langchain_core.runnables import RunnableLambda

    parser = PydanticOutputParser(pydantic_object=ContractExtraction)

    # 针对长文本，可以先用 LangChain 的 TextSplitter 分块，再逐块提取，最后合并
    def extract_from_long_text(text: str, chain) -> dict:
        # 这里是分块逻辑的示意
        chunks = split_text(text)
        results = []
        for chunk in chunks:
            res = chain.invoke({"text": chunk, "format_instructions": parser.get_format_instructions()})
            results.append(res)
        return merge_results(results)

    # 链定义
    prompt = ChatPromptTemplate.from_messages([
        ("system", "你是法律合同审查专家。请提取合同信息。{format_instructions}"),
        ("human", "{text}")
    ])
    chain = prompt | model | parser
    ```

  reference_answer: |-
    - 额外成本：修复流程会额外消耗一次 LLM 调用，这意味着更高的延迟和费用。

    - 最佳实践：不要将它作为常态依赖。首先应该通过优化 Prompt（如使用更清晰的指令、few-shot 示例）来提高 LLM 的首次输出成功率。OutputFixingParser 是最后一道“安全网”。

    ### RetryWithErrorOutputParser 的重试机制是怎样的？它如何将上次的错误信息反馈给 LLM？

    RetryWithErrorOutputParser 的核心理念与 OutputFixingParser 不同。它不是调用一个“修复专家”，而是让原模型进行“自我反省”并重试。

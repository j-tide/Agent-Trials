content:
  prompt: 谈谈 LangChain 对“模型回退”（fallback）的设计，例如 GPT-4 失败后切换 GPT-3.5。
answer:
  mode: rubric
  reference_answer: "\U0001F6E1️ LCEL 的 with_fallbacks 是实现模型回退的核心机制。它允许为一个 Runnable
    指定一个或多个备用 Runnable，当前者失败时自动尝试备用。\n\n\U0001F4DC 基础用法：\n\ngpt4 = ChatOpenAI(model=\"gpt-4o\")\ngpt35
    = ChatOpenAI(model=\"gpt-3.5-turbo\")\nrobust_model = gpt4.with_fallbacks([gpt35])\nchain
    = prompt | robust_model | parser\n\n⚙️ 执行逻辑：\n\n- 链首先使用 gpt4。\n\n- 如果 gpt4 抛出任何异常（如
    openai.APIError、openai.APITimeoutError、openai.RateLimitError），LangChain 会自动捕获并尝试
    gpt35。\n\n- 如果 gpt35 也失败，异常向上传播。\n\n\U0001F527 高级用法：\n\n- 可以为不同的异常类型指定不同的备用模型（例如，RateLimitError
    切换至另一个 API Key 的 gpt4，而不是降级模型）。\n\n- 可以嵌套回退，形成链条：gpt4.with_fallbacks([gpt35.with_fallbacks([local_model])])。\n\n-
    结合回调，在回退发生时发送告警通知。\n\n\U0001F329️ 局限性：\n\n- with_fallbacks 不重试原模型，直接切换。若需要同一模型的重试（如网络抖动），应在模型初始化时配置
    max_retries。\n\n- 回退时不会自动调整 Prompt，如果失败是上下文长度导致，降级模型可能仍会失败。需要配合上下文截断策略。"

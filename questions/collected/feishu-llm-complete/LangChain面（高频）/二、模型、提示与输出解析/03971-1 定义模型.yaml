  prompt: 6.1 定义模型
answer:
  mode: rubric
  reference_answer: |-
    首先，我们使用 Pydantic 来定义一个既包含列表、又包含嵌套对象的复杂数据模型。

    ```python
    from typing import List, Literal
    from pydantic import BaseModel, Field

    # 定义单个实体的结构
    class Entity(BaseModel):
        name: str = Field(description="实体名称")
        type: Literal["PERSON", "LOC", "ORG", "TIME", "EVENT"] = Field(description="实体类型")
        mention: str = Field(description="实体在文本中的原始表述")

    # 定义输出结构：一个包含实体的列表
    class EntityExtraction(BaseModel):
        entities: List[Entity] = Field(description="从文本中提取出的所有实体列表")

    # 创建解析器
    parser = PydanticOutputParser(pydantic_object=EntityExtraction)
    ```

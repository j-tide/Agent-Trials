    总结：PydanticOutputParser 是 StructuredOutputParser 的升级版和替代品。在几乎所有新项目中，如果你需要提取多个字段，都推荐直接使用 PydanticOutputParser，以获得更严格的保障和更清晰的代码。

    ---

    ### 12. 在 Agent 中，Output Parser 是如何解析 LLM 的“Action”和“Action Input”的？举例说明 ReAct 解析器。

    Agent 的核心是让 LLM 进行推理（Reasoning）和行动（Acting）。LangChain 中最经典的 Agent 范式之一是 ReAct（Reasoning + Acting）。LLM 被要求按照特定的格式输出，例如：

    ```text
    Thought: 我需要查询天气。
    Action: weather_api
    Action Input: 北京
    ```

    为了让程序能理解这个输出，就需要一个专门的 Output Parser 来提取 Action 和 Action Input。

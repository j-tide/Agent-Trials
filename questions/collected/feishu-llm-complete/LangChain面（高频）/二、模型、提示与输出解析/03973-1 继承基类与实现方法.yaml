answer:
  mode: rubric
  reference_answer: "你需要做的是：\n\n- 继承 BaseOutputParser 基类。\n\n- 实现三个核心方法：parse、get_format_instructions
    和 _type。\n\n下面我们实现一个解析“姓名：xxx，年龄：yyy”这种特定格式的解析器。\n\n```python\nfrom langchain_core.output_parsers
    import BaseOutputParser\nfrom typing import Dict, Any\n\nclass NameAgeParser(BaseOutputParser[Dict[str,
    Any]]):\n    \"\"\"一个用于解析 '姓名：张三，年龄：25' 这种自定义格式的解析器\"\"\"\n\n    # 核心解析逻辑\n    def
    parse(self, text: str) -> Dict[str, Any]:\n        # 1. 去除首尾空白\n        text =
    text.strip()\n        result = {}\n        \n        # 2. 按逗号分割字符串\n        parts
    = text.split(\"，\")\n        for part in parts:\n            # 3. 解析每个 \"键：值\"
    对\n            if \"：\" in part:\n                key, value = part.split(\"：\",
    1)\n                key = key.strip()\n                value = value.strip()\n
    \               # 4. 尝试类型转换，增强健壮性\n                if key == \"年龄\":\n                    try:\n
    \                       value = int(value)\n                    except ValueError:\n
    \                       raise ValueError(f\"年龄必须是数字，但得到: {value}\")\n                result[key]
    = value\n                \n        # 5. 验证必填字段\n        if \"姓名\" not in result
    or \"年龄\" not in result:\n            raise ValueError(f\"解析失败：缺少必填字段 '姓名' 或 '年龄'。解析的文本为:
    {text}\")\n            \n        return result\n\n    # 返回格式说明，会被注入到 Prompt 中引导模型\n
    \   def get_format_instructions(self) -> str:\n        return '请严格使用以下格式回答：\\n姓名：<名字>，年龄：<数字>'\n\n
    \   # 返回一个唯一标识，用于日志和序列化\n    @property\n    def _type(self) -> str:\n        return
    \"name_age_parser\"\n```"

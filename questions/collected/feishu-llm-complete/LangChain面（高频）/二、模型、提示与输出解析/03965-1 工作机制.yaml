answer:
  mode: rubric
  reference_answer: |-
    OutputFixingParser 的工作流程如下：

    - 尝试解析：它首先将 LLM 的原始输出传递给被包装的基础解析器（base_parser）进行解析。

    - 捕获异常：如果基础解析器解析失败，抛出了异常（例如 JSONDecodeError, ValidationError），OutputFixingParser 会捕获这个异常，而不是让程序崩溃。

    - 构建修复提示：它动态创建一个新的 Prompt，这个 Prompt 包含三部分关键信息：

    - 调用修复 LLM：将这个修复提示发送给另一个专门的 LLM（通常就是同一个模型实例，但可以配置），要求它根据错误信息修正原始输出。

    - 再次解析：OutputFixingParser 拿到修复 LLM 返回的文本后，再次调用基础解析器。如果成功，则返回最终结果；如果仍然失败，则会抛出异常。

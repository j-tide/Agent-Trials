    ---

    ### 什么是 StructuredOutputParser？它和 PydanticOutputParser 的区别在哪里？

    StructuredOutputParser 是 LangChain 中用于提取结构化数据的基础解析器，它允许你通过预定义的 Response Schema（响应模式）来告诉 LLM 你想要哪些字段以及字段的类型。而 PydanticOutputParser 是它的高级封装，利用 Pydantic 模型来定义 Schema。

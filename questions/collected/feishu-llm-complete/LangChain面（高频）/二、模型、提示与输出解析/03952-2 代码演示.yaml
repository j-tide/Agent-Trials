answer:
  mode: rubric
  reference_answer: |-
    ```python
    from langchain_core.output_parsers import PydanticOutputParser
    from langchain_core.prompts import ChatPromptTemplate
    from pydantic import BaseModel, Field

    # 1. 定义数据模型和解析器
    class BookInfo(BaseModel):
        title: str = Field(description="书名")
        author: str = Field(description="作者")

    parser = PydanticOutputParser(pydantic_object=BookInfo)

    # 2. 获取格式指令
    format_instructions = parser.get_format_instructions()
    print("生成的格式指令：\n", format_instructions)
    # 输出类似：
    # The output should be a JSON object with the following keys:
    # - "title": 书名
    # - "author": 作者

    # 3. 设计 Prompt，使用 {format_instructions} 占位符
    prompt = ChatPromptTemplate.from_messages([
        ("system", "你是一个图书信息提取助手。请严格按照以下JSON格式输出提取结果：\n{format_instructions}"),
        ("human", "请从以下文本中提取图书信息：\n{text}")
    ])

    # 4. 组装链并调用
    chain = prompt | model | parser
    result = chain.invoke({
        "text": "《三体》是刘慈欣创作的科幻小说。",
        "format_instructions": format_instructions  # 注入格式指令
    })
    print(result)  # BookInfo(title='三体', author='刘慈欣')
    ```

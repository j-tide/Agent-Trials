answer:
  mode: rubric
  reference_answer: |-
    - 定义 Output Parser：你创建一个解析器实例，例如 PydanticOutputParser。这个解析器内部封装了目标数据结构的完整知识。

    - 生成格式指令：当你调用 parser.get_format_instructions() 时，解析器会根据其类型（JSON、Pydantic等）动态生成一段人类可读、模型可理解的格式指令。例如，PydanticOutputParser 会生成包含 JSON Schema 的详细说明。

    - 设计 Prompt Template：在你的 ChatPromptTemplate 或 PromptTemplate 中，预留一个占位符（如 {format_instructions}）。

    - 注入格式指令：在调用链时，你显式地将 parser.get_format_instructions() 的返回值作为 format_instructions 变量的值传入。

    - 模型遵循指令：当 LLM 收到这个包含格式指令的完整 Prompt 后，它会根据指令的要求，尝试生成符合特定格式的文本。

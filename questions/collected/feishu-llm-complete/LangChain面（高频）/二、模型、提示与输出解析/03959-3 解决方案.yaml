answer:
  mode: rubric
  reference_answer: |-
    - 使用 parse_partial_json：LangChain 提供了 langchain_core.utils.json.parse_partial_json，可以解析不完整的 JSON 字符串，返回当前已成功解析的部分。你可以在流式回调中逐步更新解析结果。

    - 自定逐步解析器：继承 BaseOutputParser，重写 stream 方法，在内部维护一个缓冲区，每当收到新的 Token，尝试用 parse_partial_json 提取当前结果，并通过回调通知上层。

    - 在 Prompt 中强调格式完整性：虽然不能完全避免，但可以要求模型“输出紧凑的 JSON 且不要添加额外内容”，减少流式异常。

    ```python
    from langchain_core.utils.json import parse_partial_json

    class StreamingJsonParser(BaseOutputParser):
        def parse(self, text: str) -> Any:
            return json.loads(text)

        def stream(self, input: AsyncIterator[str]) -> AsyncIterator[Any]:
            buffer = ""
            async for chunk in input:
                buffer += chunk
                try:
                    # 尝试部分解析
                    partial = parse_partial_json(buffer)
                    yield partial
                except Exception:
                    pass  # 解析失败，等待更多数据
    ```

    ### 如何为 Output Parser 编写单元测试？你会 mock LLM 的输出吗？

    单元测试是保证解析器健壮性的基石。我们遵循“不依赖外部服务”的原则，一定会 mock LLM 的输出。

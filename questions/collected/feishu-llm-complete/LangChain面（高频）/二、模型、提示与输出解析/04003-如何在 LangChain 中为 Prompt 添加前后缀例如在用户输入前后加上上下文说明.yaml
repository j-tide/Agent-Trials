content:
  prompt: 如何在 LangChain 中为 Prompt 添加前后缀？例如在用户输入前后加上上下文说明。
answer:
  mode: rubric
  reference_answer: "\U0001F4DD 为 Prompt 添加固定前缀和后缀是常见的需求。在 PromptTemplate 中，直接在模板文本中写入即可。在
    ChatPromptTemplate 中，前缀通常通过 SystemMessage 实现，后缀通过模板末尾的 HumanMessage 实现。\n\n示例：为翻译任务添加上下文：\n\n```python\n#
    前缀说明 + 用户输入 + 后缀提醒\nprompt = ChatPromptTemplate.from_messages([\n    (\"system\",
    \"你是一个专业的翻译引擎。\"),\n    (\"human\", \"请将以下{source_lang}文本翻译成{target_lang}：\\n{text}\\n翻译结果：\")\n])\n```\n\n这种“前缀（system）+
    内容（human）+ 后缀（放在 human 末尾）”的模式既清晰又便于管理。\n\n如果需要在用户输入之后自动添加一个固定的结尾（如“请用 JSON 回答”），只需放在
    HumanMessage 的模板末尾即可。如果后缀是动态的，可以作为另一个变量。"

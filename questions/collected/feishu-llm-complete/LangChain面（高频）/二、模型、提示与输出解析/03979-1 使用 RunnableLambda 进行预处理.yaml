content:
  prompt: 9.1 使用 RunnableLambda 进行预处理
answer:
  mode: rubric
  reference_answer: |-
    最灵活的方法是利用 RunnableLambda 将自定义的清理函数嵌入到链中。清理函数的核心任务是提取出纯粹的 JSON 字符串。

    ```python
    from langchain_core.runnables import RunnableLambda
    import re
    import json

    def extract_and_clean_json(text: str) -> str:
        """
        从包含解释文字的文本中提取并修复 JSON 字符串。
        """
        # 1. 尝试直接解析，如果成功则返回原始文本（可能已经是纯 JSON）
        try:
            json.loads(text)
            return text
        except json.JSONDecodeError:
            pass

        # 2. 使用正则查找第一个 '{' 和最后一个 '}' 之间的内容
        start = text.find('{')
        end = text.rfind('}')
        if start != -1 and end != -1 and end > start:
            json_candidate = text[start:end+1]
            # 3. 可选：尝试修复常见的 JSON 错误
            # 例如替换中文引号等
            json_candidate = json_candidate.replace('“', '"').replace('”', '"')
            return json_candidate

        # 4. 如果仍然无法提取，抛出异常
        raise ValueError(f"无法从文本中提取JSON: {text}")

    # 将清理函数包装为 Runnable
    cleanup_runnable = RunnableLambda(extract_and_clean_json)

    # 集成到链中：prompt -> model -> cleanup -> parser
    chain = prompt | model | cleanup_runnable | parser
    ```

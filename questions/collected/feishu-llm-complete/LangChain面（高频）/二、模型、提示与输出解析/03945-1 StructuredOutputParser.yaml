  prompt: 11.1 StructuredOutputParser
answer:
  mode: rubric
  reference_answer: |-
    StructuredOutputParser 使用一个简单的 JSON Schema 字典来定义输出结构。例如：

    ```python
    from langchain_core.output_parsers import StructuredOutputParser, ResponseSchema

    # 定义字段
    response_schemas = [
        ResponseSchema(name="answer", description="用户问题的回答"),
        ResponseSchema(name="source", description="回答所依据的参考来源"),
    ]

    # 创建解析器
    parser = StructuredOutputParser.from_response_schemas(response_schemas)

    # 自动生成格式指令
    format_instructions = parser.get_format_instructions()
    # 输出类似：Your response should be a JSON object with the following keys:
    # - "answer": 用户问题的回答
    # - "source": 回答所依据的参考来源
    ```

    它的 parse 方法会将模型输出解析为一个 Python 字典，键就是 ResponseSchema 中定义的 name。

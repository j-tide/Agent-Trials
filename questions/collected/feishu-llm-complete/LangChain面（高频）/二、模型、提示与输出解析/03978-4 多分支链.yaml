answer:
  mode: rubric
  reference_answer: |-
    在更复杂的场景中，可能需要根据条件选择不同的解析器。RunnableBranch 可以实现这一点。

    ```python
    from langchain_core.runnables import RunnableBranch

    # 假设有两种可能的输出格式
    parser_type1 = PydanticOutputParser(pydantic_object=Person)
    parser_type2 = PydanticOutputParser(pydantic_object=Paper)  # 另一个 Pydantic 类

    # 根据输入中的 "type" 字段进行路由
    branch = RunnableBranch(
        (lambda x: x["type"] == "person", parser_type1),
        (lambda x: x["type"] == "paper", parser_type2),
    )

    chain = prompt | model | branch
    ```

    通过 LCEL，Output Parser 的集成变得非常直观，同时保留了链的可组合性、可测试性和流式支持。

    ---

    ### 当 LLM 输出不是纯 JSON，而是“解释文本 + JSON”时，你如何预处理再解析？

    这是一个非常常见的问题：模型可能在返回的 JSON 前后附加一些自然语言解释，例如 “好的，这是您要的数据：\n{\"name\": \"张三\"}”。直接将其传递给 JSON 解析器会引发异常。解决方法是在解析前对输出进行预处理。

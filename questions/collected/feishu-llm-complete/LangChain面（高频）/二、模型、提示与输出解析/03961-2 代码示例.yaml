    ```python
    import pytest
    from unittest.mock import patch, MagicMock
    from langchain_core.messages import AIMessage
    from your_parser_module import NameAgeParser

    # 单元测试：直接测试解析逻辑
    def test_parse_valid():
        parser = NameAgeParser()
        result = parser.parse("姓名：张三，年龄：25")
        assert result == {"姓名": "张三", "年龄": 25}

    def test_parse_missing_field_raises():
        parser = NameAgeParser()
        with pytest.raises(ValueError, match="缺少必填字段"):
            parser.parse("姓名：张三")

    # 集成测试：mock 模型输出
    @patch('your_module.ChatOpenAI.invoke')
    def test_chain_with_mock(mock_invoke):
        # 准备模拟的 AI 消息
        mock_response = AIMessage(content="姓名：李四，年龄：30")
        mock_invoke.return_value = mock_response

        chain = build_chain()  # 返回 prompt | model | parser
        result = chain.invoke({"text": "无关输入"})

        assert result == {"姓名": "李四", "年龄": 30}
        mock_invoke.assert_called_once()
    ```

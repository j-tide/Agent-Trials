content:
  prompt: 在微服务中，你倾向于将 LangChain 模型调用放在同步还是异步环境？为什么？
answer:
  mode: rubric
  reference_answer: "⚡ 强烈推荐异步环境。原因如下：\n\n- 高并发 I/O 密集型：LLM 调用本质上是网络 I/O 等待（等待 API
    响应）。同步模式下，每个请求会占用一个线程，线程切换和内存开销大，且容易受限于线程池大小。异步模式下，协程在等待网络 I/O 时主动让出控制权，单线程即可处理上千并发连接，资源利用率极高。\n\n-
    与 FastAPI/Starlette 天然契合：现代 Python Web 框架几乎都基于 asyncio。使用异步 LangChain（ainvoke、astream）可以避免阻塞事件循环，最大化服务吞吐量。\n\n-
    流式输出：异步流式（astream）能更高效地实现 Server-Sent Events (SSE) 推送，避免线程阻塞，支持大量客户端同时接收实时数据。\n\n\U0001F9E9
    何时可能用同步？\n\n- 简单的离线批处理脚本。\n\n- 内部工具的短调用。\n\n- 当使用的某些库不支持异步且无法替换时（但此时可以通过 asyncio.to_thread
    将同步代码桥接到异步环境）。\n\n\U0001F4E6 微服务架构示例：\n\nfrom fastapi import FastAPI\nimport asyncio\n\napp
    = FastAPI()\n\n@app.post(\"/ask\")\nasync def ask_question(question: str):\n    #
    异步调用链\n    result = await chain.ainvoke({\"question\": question})\n    return
    {\"answer\": result}\n\n\U0001F4A1 最佳实践：在构建 LangChain 服务时，始终使用异步方法（ainvoke, astream），并配置
    asyncio 的事件循环策略为 uvloop 以获得额外性能提升。"

  mode: rubric
  reference_answer: 当链以 stream 方式调用时，LangChain 会检查每个组件的流式能力。大多数 BaseOutputParser 本身不支持“逐
    Token”解析，因为它们需要完整的输出字符串才能进行 JSON 解析或正则匹配。因此，默认行为是等待模型流式输出完成，拼接成完整字符串后，再一次性调用 parser.parse()。

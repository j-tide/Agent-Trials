content:
  prompt: 你如何为 Prompt 中的示例设置格式？比如输入输出有复杂 JSON 结构时。
answer:
  mode: rubric
  reference_answer: "当示例的输入或输出包含复杂结构（如 JSON、列表）时，不能简单地用字符串拼接，因为模型可能无法正确解析。我们需要在 example_prompt
    中显式定义格式化逻辑，确保示例以模型可理解的方式呈现。\n\n\U0001F4DD 策略：\n\n- 在 example_prompt 中使用 json.dumps
    或自定义模板：将复杂对象转换为格式化的字符串。\n\n- 在指令（prefix）中说明输出格式：告诉模型期望的输出是 JSON，并可以提供一个 Schema。\n\n-
    使用 PromptTemplate 的 template_format 或 jinja2 支持：对于更复杂的循环、条件，可以使用 Jinja2 模板引擎。\n\n\U0001F4DC
    示例：输入是一个句子，输出是情感分类和关键词列表（JSON）：\n\n```python\nfrom langchain_core.prompts import
    PromptTemplate, FewShotPromptTemplate\n\n# 定义示例的格式化模板\nexample_prompt = PromptTemplate.from_template(\n
    \   \"句子：{sentence}\\n\"\n    \"结果：{{\\\"sentiment\\\": \\\"{sentiment}\\\", \\\"keywords\\\":
    {keywords}}}\"\n)\n\nexamples = [\n    {\n        \"sentence\": \"我非常喜欢这个产品！\",\n
    \       \"sentiment\": \"positive\",\n        \"keywords\": '[\"产品\", \"喜欢\"]'\n
    \   },\n    {\n        \"sentence\": \"服务太差了，很失望。\",\n        \"sentiment\": \"negative\",\n
    \       \"keywords\": '[\"服务\", \"失望\"]'\n    }\n]\n\nfew_shot = FewShotPromptTemplate(\n
    \   examples=examples,\n    example_prompt=example_prompt,\n    prefix=\"分析以下句子的情感，并提取关键词。以
    JSON 格式输出。\",\n    suffix=\"句子：{input}\\n结果：\",\n    input_variables=[\"input\"]\n)\n```\n\n\U0001F4CA
    输出效果：\n\n```text\n分析以下句子的情感，并提取关键词。以 JSON 格式输出。\n\n句子：我非常喜欢这个产品！\n结果：{\"sentiment\":
    \"positive\", \"keywords\": [\"产品\", \"喜欢\"]}\n\n句子：服务太差了，很失望。\n结果：{\"sentiment\":
    \"negative\", \"keywords\": [\"服务\", \"失望\"]}\n\n句子：这本书内容很棒，物流也快。\n结果：\n```\n\n这样，模型看到的一致格式会促使它生成合法的
    JSON。如果输出更复杂，你可以使用 Pydantic 模型定义 Schema，并在模板中引用。"

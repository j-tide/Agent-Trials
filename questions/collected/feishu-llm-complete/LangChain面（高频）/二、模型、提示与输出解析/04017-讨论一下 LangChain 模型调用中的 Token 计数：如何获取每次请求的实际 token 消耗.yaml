content:
  prompt: 讨论一下 LangChain 模型调用中的 Token 计数：如何获取每次请求的实际 token 消耗？
answer:
  mode: rubric
  reference_answer: "\U0001F4B0 Token 计数是成本控制和配额管理的核心指标。LangChain 提供了多种方式获取每次 LLM
    调用的实际 Token 消耗。\n\n\U0001F4CA 方式一：通过 LLMResult 或 AIMessage.response_metadata\n\n在模型返回的结果中，底层
    API 通常包含 token_usage 字段。LangChain 会将其提取到 AIMessage 的 response_metadata 中。\n\nresponse
    = model.invoke(messages)\nprint(response.response_metadata.get(\"token_usage\"))\n#
    输出: {'prompt_tokens': 150, 'completion_tokens': 80, 'total_tokens': 230}\n\n对于非聊天模型，LLMResult.llm_output
    中也包含 token_usage。\n\n\U0001F4CA 方式二：通过回调（Callback）记录\n\n自定义一个 BaseCallbackHandler，在
    on_llm_end 中提取 Token 用量并记录到日志或数据库。\n\nfrom langchain_core.callbacks import BaseCallbackHandler\n\nclass
    TokenCounterCallback(BaseCallbackHandler):\n    def on_llm_end(self, response,
    **kwargs):\n        usage = response.llm_output.get(\"token_usage\", {})\n        print(f\"本次调用消耗
    Token: {usage}\")\n\n\U0001F4CA 方式三：LangSmith 自动统计\n\n当启用 LangSmith 追踪时，每次调用的
    Token 用量和成本会被自动记录，可以在 Web 界面中查看聚合统计。\n\n\U0001F4CA 方式四：使用 get_num_tokens 预测\n\n对于需要提前限制输入长度的场景，可以使用模型的
    get_num_tokens(text) 方法，调用底层 Tokenizer 估算 Token 数。但注意这仅是估算，实际消耗可能因格式包装而略有偏差。\n\n⚠️
    注意：并非所有模型都返回 Token 用量（尤其是一些本地模型），此时需要自己实现 Token 计数逻辑。"

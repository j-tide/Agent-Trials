answer:
  mode: rubric
  reference_answer: |-
    即使经过了预处理，JSON 可能仍然不合法。此时，OutputFixingParser 可以作为最后的保险。它会在内部调用修复 LLM，根据错误信息重新生成合法的 JSON。

    ```python
    from langchain_core.output_parsers import OutputFixingParser

    # 基础解析器
    base_parser = PydanticOutputParser(pydantic_object=Person)

    # 修复解析器
    fixing_parser = OutputFixingParser.from_llm(
        parser=base_parser,
        llm=ChatOpenAI(model="gpt-4o", temperature=0)
    )

    # 链：prompt -> model -> 预处理 -> 修复解析器
    chain = prompt | model | RunnableLambda(extract_and_clean_json) | fixing_parser
    ```

    这样，我们就构建了一个三层防护：Prompt 指令 → 预处理提取 → 修复解析，确保即使模型输出混杂了额外文本，也能得到正确的结构化数据。

    ---

    ### 你如何测试 Output Parser 的健壮性？如果 LLM 反复输出错误格式，怎么办？

    在生产环境中，Output Parser 的健壮性直接决定了应用的可靠性。我们需要构建一套完善的测试体系，并制定应对反复出错的策略。

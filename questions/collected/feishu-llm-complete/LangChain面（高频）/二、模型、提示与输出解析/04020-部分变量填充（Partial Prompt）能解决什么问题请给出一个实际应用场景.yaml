content:
  prompt: 部分变量填充（Partial Prompt）能解决什么问题？请给出一个实际应用场景。
answer:
  mode: rubric
  reference_answer: "\U0001F9E9 部分变量填充（Partial Prompt） 允许你在创建提示模板时，预先填充一部分变量，生成一个新的模板，后续调用时只需要提供剩余的变量。这解决了变量复用、配置分离和动态构建的问题。\n\n\U0001F4A1
    实际应用场景：\n\n场景一：系统指令的复用\n假设你的应用中有多个功能（翻译、摘要、问答），它们使用相同的系统指令（\"你是一个专业的AI助手\"），但用户输入不同。你可以创建一个基础模板，将系统角色部分填充，然后每个功能模块基于这个模板添加自己的用户提示。\n\n```python\nbase_template
    = ChatPromptTemplate.from_messages([\n    (\"system\", \"你是一个专业的{role}。\"),\n
    \   (\"human\", \"{question}\")\n])\n\n# 部分填充 role 变量，生成一个专门用于翻译的模板\ntranslator_template
    = base_template.partial(role=\"翻译专家\")\n# 后续只需传入 question\nmessages = translator_template.invoke({\"question\":
    \"翻译：Hello, world!\"})\n```\n\n场景二：配置分离\n在生产环境中，temperature、max_tokens 等模型参数可能因环境不同而变化。你可以将模型配置作为部分变量填充，避免在每个链调用时传递。\n\n```python\nmodel_config
    = {\"temperature\": 0.3, \"max_tokens\": 256}\nmodel = ChatOpenAI(**model_config)\n#
    或者将模型本身作为部分变量\nchain = prompt | model | parser\n# 但更常见的是将模型参数填充到 Prompt 中（如果 Prompt
    需要这些参数），不过不太典型。\n```\n\n场景三：动态构建用户引导\n在对话开始时，你可以预先填充对话历史中的系统消息，然后每次用户输入时，只需要填充
    human 部分。\n\npartial 方法返回一个新的模板对象，原模板不变，符合函数式编程的不可变性原则，便于组合和复用。"

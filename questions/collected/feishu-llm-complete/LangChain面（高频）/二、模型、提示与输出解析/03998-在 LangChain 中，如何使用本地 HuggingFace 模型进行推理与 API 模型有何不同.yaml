content:
  prompt: 在 LangChain 中，如何使用本地 HuggingFace 模型进行推理？与 API 模型有何不同？
answer:
  mode: rubric
  reference_answer: "\U0001F5A5️ 使用本地模型的核心优势：数据隐私、零 API 成本、离线可用、可完全定制。\n\n\U0001F4E6
    集成方式：\n\n- 通过 HuggingFacePipeline（适合本地服务器）\n\nfrom transformers import pipeline,
    AutoModelForCausalLM, AutoTokenizer\nfrom langchain_huggingface import HuggingFacePipeline\n\nmodel
    = AutoModelForCausalLM.from_pretrained(\"gpt2\")\ntokenizer = AutoTokenizer.from_pretrained(\"gpt2\")\npipe
    = pipeline(\"text-generation\", model=model, tokenizer=tokenizer, max_new_tokens=256)\nllm
    = HuggingFacePipeline(pipeline=pipe)\nchain = llm | StrOutputParser()\n\n- 通过
    HuggingFaceEndpoint（适合 HuggingFace Hub 上的推理端点）\n不需要本地 GPU，调用 HuggingFace 的在线推理服务。\n\n-
    通过 Ollama 或 vLLM 的 OpenAI 兼容接口\n启动 vLLM 后，使用 ChatOpenAI 并指定 base_url 指向本地服务，完全兼容
    OpenAI 的调用方式。\n\n\U0001F19A 与 API 模型的差异：\n\n[嵌入表格未展开]\n\n⚖️ 建议：开发调试阶段用 API 模型快速迭代，对隐私敏感或需要高频调用的场景，部署本地模型进行推理。可以结合
    LangChain 的回退机制，在本地模型忙时自动切换云端 API。"

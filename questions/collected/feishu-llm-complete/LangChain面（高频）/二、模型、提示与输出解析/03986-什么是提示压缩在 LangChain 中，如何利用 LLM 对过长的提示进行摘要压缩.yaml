content:
  prompt: 什么是“提示压缩”？在 LangChain 中，如何利用 LLM 对过长的提示进行摘要压缩？
answer:
  mode: rubric
  reference_answer: "\U0001F4DD 提示压缩是指当输入文本（如长文档、多轮对话历史）超出模型上下文窗口时，使用 LLM 自身或轻量级模型对文本进行摘要或关键信息提取，将压缩后的文本作为
    Prompt 的一部分。\n\n应用场景：\n\n- 长文档问答：用户上传了一篇 50 页的 PDF，需要先压缩再提问。\n\n- 多轮对话：记忆模块中历史消息过多，需要压缩成摘要以保留上下文。\n\n-
    成本控制：减少输入 Token 数量，降低 API 调用费用。\n\nLangChain 中的实现：\n\n- ConversationSummaryMemory\n\n-
    trim_messages 工具（新版本）\n\n- 自定义压缩链\n\n```python\nsummary_prompt = PromptTemplate.from_template(\"请用最多{max_words}字总结以下内容：\\n{text}\")\ncompress_chain
    = summary_prompt | model | StrOutputParser()\ncompressed = compress_chain.invoke({\"text\":
    long_text, \"max_words\": 200})\n```\n\n- ContextualCompressionRetriever\n\n\U0001F4A1
    提示压缩的权衡：压缩可以节省 Token 和提升响应速度，但可能丢失细节。需要根据任务对精度的要求选择压缩比率。"

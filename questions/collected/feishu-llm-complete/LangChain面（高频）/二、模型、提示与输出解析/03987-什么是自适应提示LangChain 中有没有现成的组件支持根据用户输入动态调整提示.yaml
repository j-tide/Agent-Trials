content:
  prompt: 什么是“自适应提示”？LangChain 中有没有现成的组件支持根据用户输入动态调整提示？
answer:
  mode: rubric
  reference_answer: "\U0001F3AF 自适应提示是指 Prompt 的内容、结构或示例能够根据输入数据或上下文动态变化，而不是一个静态模板。\n\nLangChain
    中的支持组件：\n\n- FewShotPromptTemplate + ExampleSelector：最直接的自适应提示。根据用户输入，动态选取最相关的少样本示例插入
    Prompt。例如，使用 SemanticSimilarityExampleSelector。\n\n- PipelinePromptTemplate：可以将多个子模板组合，根据条件选取不同的子模板（结合条件路由）。\n\n-
    ChatPromptTemplate 的 partial 方法：可以在运行时部分填充变量，实现模板的“子类化”。\n\n- RunnableBranch /
    RunnableLambda：完全自定义逻辑，根据输入动态构建任意提示链。\n\n\U0001F4DC 示例：根据用户语言动态设置系统语言：\n\n```python\ndef
    get_prompt_for_lang(lang):\n    if lang == \"en\":\n        return ChatPromptTemplate.from_template(\"You
    are a helpful assistant. Question: {q}\")\n    else:\n        return ChatPromptTemplate.from_template(\"你是一个有用的助手。问题：{q}\")\n\ndynamic_chain
    = RunnableLambda(lambda x: get_prompt_for_lang(x[\"lang\"]).invoke(x)) | model\n```\n\n虽然
    LangChain 没有提供一个叫做“AdaptivePrompt”的单一类，但上述组件的组合已经提供了强大的自适应能力。"

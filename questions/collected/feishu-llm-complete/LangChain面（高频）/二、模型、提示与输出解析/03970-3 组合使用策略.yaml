answer:
  mode: rubric
  reference_answer: |-
    在实际工程中，可以将两者结合起来，实现更强大的容错链：

    - 首先使用 RetryWithErrorOutputParser 让模型自省重试 1-2 次。

    - 如果仍然失败，再使用 OutputFixingParser 作为最后的兜底修复。
    这种分层容错的设计，能在保证成功率的同时，最大限度地利用模型的自我修正能力。

    ### 比较 Output Parser 和 OpenAI 原生 Function Calling，各自的优劣和适用场景。

    这是 LLM 应用架构中的一个核心选型问题。两者都能实现结构化输出，但原理和侧重点完全不同。

    [嵌入表格未展开]

    选型建议：

    - 优先使用 Function Calling：如果你的应用只使用 OpenAI 或 Claude 等支持该功能的模型，并且需要极高的格式可靠性（如金融、医疗数据提取），这是首选。

    - 使用 Output Parser：当你需要兼容多种模型（特别是本地部署的开源模型），或者你的输出结构非常特异，或者你正在快速原型设计阶段，需要频繁调整输出结构。

    两者并非完全互斥。一个混合策略是：使用 Function Calling 来定义顶层的工具调用，而在工具内部的详细参数提取中，使用 Output Parser 来处理更复杂的自由文本。

    ### 如果你需要提取一段文本中的多个实体（如人名、地名、时间），应该用哪种 Output Parser？

    对于命名实体识别（NER） 式的多实体提取任务，我们需要的是一个能够输出实体列表的解析器，每个实体最好还带有类别、原文等属性。显然，只能输出简单字符串列表的 CommaSeparatedListOutputParser 不够用。PydanticOutputParser 是处理这类复杂嵌套结构的最佳选择。

  reference_answer: |-
    LangChain 提供了 FakeChatModel，可以预置一系列响应，非常适合测试。

    ```python
    from langchain_core.language_models.fake import FakeChatModel

    fake_model = FakeChatModel(responses=[
        AIMessage(content="姓名：李四，年龄：30"),
        AIMessage(content="Invalid JSON"),
    ])

    # 测试成功和失败路径
    ```


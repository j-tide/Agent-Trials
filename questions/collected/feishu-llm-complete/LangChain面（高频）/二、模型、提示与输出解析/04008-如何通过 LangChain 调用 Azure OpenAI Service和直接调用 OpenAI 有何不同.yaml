content:
  prompt: 如何通过 LangChain 调用 Azure OpenAI Service？和直接调用 OpenAI 有何不同？
answer:
  mode: rubric
  reference_answer: "☁️ Azure OpenAI Service 是微软提供的企业级 OpenAI 模型服务，与原生 OpenAI API
    的主要区别在于：\n\n- 认证方式：使用 API Key 或 Azure Active Directory 认证。\n\n- 端点定制：每个部署的资源有自己的基础
    URL（https://{your-resource-name}.openai.azure.com）。\n\n- 模型部署名称：模型通过“部署”来管理，API
    调用时使用部署名而非模型名（如 gpt-4-deployment）。\n\n- API 版本控制：需要在请求中指定 API 版本（如 2024-02-01）。\n\n-
    内容过滤：默认启用 Azure 的内容安全过滤。\n\n- 企业功能：支持 VNet/Private Link、托管身份、合规认证等。\n\n\U0001F50C
    在 LangChain 中使用 Azure OpenAI：\n\nLangChain 提供了专用的 AzureChatOpenAI 类（在 langchain-openai
    包中），封装了上述差异。\n\nfrom langchain_openai import AzureChatOpenAI\n\nmodel = AzureChatOpenAI(\n
    \   azure_deployment=\"gpt-4-deployment\",           # 你的部署名\n    api_version=\"2024-02-01\",
    \                     # API 版本\n    azure_endpoint=\"https://my-resource.openai.azure.com\",
    \ # 你的端点\n    api_key=\"YOUR_API_KEY\",                        # 或者使用 azure_ad_token\n
    \   temperature=0.3\n)\n\n或者使用环境变量：\n\nexport AZURE_OPENAI_API_KEY=\"...\"\nexport
    AZURE_OPENAI_ENDPOINT=\"https://my-resource.openai.azure.com\"\nexport OPENAI_API_VERSION=\"2024-02-01\"\n\n然后代码中仅需指定部署名：\n\nmodel
    = AzureChatOpenAI(deployment_name=\"gpt-4-deployment\")\n\n\U0001F9E9 与直接调用 OpenAI
    的代码差异：\n\n[嵌入表格未展开]\n\n⚙️ 注意事项：\n\n- Azure OpenAI 的速率限制是按部署和区域分配的，与 OpenAI 的全局限制不同。\n\n-
    当使用 with_fallbacks 时，可以将 Azure 和 OpenAI 的实例组合，实现跨云容灾。\n\n- 如果使用自托管模型，Azure 还提供吞吐量预配（PTU），适合生产环境。"

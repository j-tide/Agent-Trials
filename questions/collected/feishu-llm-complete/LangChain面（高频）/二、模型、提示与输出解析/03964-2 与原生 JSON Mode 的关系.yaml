answer:
  mode: rubric
  reference_answer: |-
    OpenAI、Claude 等推出的原生 JSON Mode 通过在 API 层面约束输出，显著降低了格式错误率。但我认为 Output Parser 不会被完全取代，理由如下：

    - 多模型兼容性：开源模型、本地模型可能不支持 JSON Mode，而 Output Parser 是通用的。

    - 复杂逻辑处理：Parser 可以包含自定义的清洗、验证、转换逻辑，而 JSON Mode 只能限制输出格式，无法进行业务规则校验。

    - 向后兼容：大量现有应用基于 Prompt 工程，迁移成本高。

    - 混合模式：未来趋势可能是“原生 JSON Mode + Output Parser”结合，前者保证格式，后者进行语义级验证和转换。

    ---

    ### 总结一下：设计一个健壮的 LLM 输出管道，Prompt + Parser 应遵循哪些最佳实践？

    结合上述所有经验，一个生产级的输出管道应遵循以下实践：

    - 明确的角色与格式隔离：使用 SystemMessage 强调格式要求，HumanMessage 承载业务数据。格式指令放在 System 末尾或 Human 开头，确保模型“看到”。

    - 用 Pydantic 定义严格的 Schema：利用 BaseModel、Field(description=...)、Literal、Optional 等特性，让模型理解字段的语义和约束。

    - Few-Shot 示例必不可少：在 Prompt 中提供 1-3 个格式完全正确的示例，尤其对于复杂嵌套结构，能极大幅度提升准确性。

    - 预处理与后处理双保险：

    - 分层容错机制：先尝试 RetryWithErrorOutputParser 让模型自省，失败再用 OutputFixingParser 修复，最后应用层兜底（如返回默认错误响应）。

    - 编写完善的单元测试：Mock LLM 输出，覆盖正常、异常、边界场景，确保解析器自身的逻辑无懈可击。

    - 流式场景特殊处理：使用 parse_partial_json 或自定义流式解析器，避免因等待完整输出而丢失流式优势。

    - 持续监控与迭代：通过 LangSmith 等工具追踪解析失败率，当失败率异常时及时优化 Prompt 或升级模型。

    遵循这些实践，你将能构建一个既灵活又坚如磐石的 LLM 输出管道，让大模型真正成为可靠的“结构化数据生成器”。

    - 原始格式指令：提醒 LLM 应该遵循的正确格式。

    - LLM 的原始输出：也就是那个不合法的文本。

    - 详细的错误信息：例如 JSONDecodeError 中的具体位置和原因（Expecting property name enclosed in double quotes）。

    - LLM 上一次生成的（错误）输出。

    - 解析失败的具体错误信息（例如 JSONDecodeError 的 traceback）。
    这种设计的意图是让模型“看到”自己犯的错误以及程序给出的反馈，就像老师批改作业一样。

    - 使用更清晰、更具体的指令，明确要求“只输出 JSON，不要任何解释”。

    - 提供 Few-Shot 示例，展示正确的输出格式。

    - 将格式指令放在 Prompt 的末尾，因为模型对靠近生成位置的指令更敏感。

    - 使用 ChatPromptTemplate 的 SystemMessage 强调格式要求。

    - 使用前面提到的 extract_and_clean_json 函数，增强正则表达式的鲁棒性，覆盖更多边界情况。

    - 结合 json.loads 的异常信息，尝试自动修复简单的错误（如缺少引号、多余逗号等）。

    - 使用 RetryWithErrorOutputParser 让模型自我纠正。

    - 使用 OutputFixingParser 调用修复 LLM 进行二次修正。

    - 如果所有解析都失败，应用层应设计降级逻辑。例如，返回一个默认的错误响应，或将原始文本记录到日志中供人工审核，避免系统崩溃。

    - 可以尝试使用更简单的解析方法（如正则）作为最后的回退手段。

    - 使用 LangSmith 或自定义回调追踪解析失败率。当失败率超过设定阈值时，自动触发告警，提示开发者检查模型版本、Prompt 有效性或 API 服务状态。

    - 预处理：用 RunnableLambda 清洗 Markdown 标记、提取 JSON 块。

    - 后处理：在 parse 方法中增加默认值填充、类型强制转换等容错逻辑。

  reference_answer: |-
    - 输出被截断：如果流式传输中断或模型生成了不完整的 JSON（例如最后一个 } 缺失），解析器会失败。

    - 延迟反馈：用户在前端看到文字逐个打出，但最终解析却要等到最后，可能会感觉到“卡顿”。

    - 无法处理部分 JSON：标准 JSON 解析器不能处理不完整的 JSON 片段。例如 {"name": "张三", "age": 3 还未闭合，json.loads 会报错。

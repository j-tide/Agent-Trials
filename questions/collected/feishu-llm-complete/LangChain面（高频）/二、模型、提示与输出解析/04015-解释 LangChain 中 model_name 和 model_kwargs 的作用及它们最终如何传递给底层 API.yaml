content:
  prompt: 解释 LangChain 中 model_name 和 model_kwargs 的作用及它们最终如何传递给底层 API。
answer:
  mode: rubric
  reference_answer: "\U0001F3F7️ model_name 是 BaseChatModel 或 BaseLLM 的必填参数，用于指定底层具体的模型标识。例如
    \"gpt-4o\"、\"claude-3-opus\"。当构建 ChatOpenAI(model=\"gpt-4o\") 时，这个字符串会被原样传递给 OpenAI
    SDK 的 model 参数，告诉 API 使用哪个模型版本。对于 HuggingFace 本地模型，model_name 则对应 Hub 上的仓库 ID（如
    \"meta-llama/Llama-2-7b-chat-hf\"）。\n\n⚙️ model_kwargs 是一个字典，用于传递超出 LangChain
    标准参数之外的额外参数。LangChain 的标准参数（如 temperature、max_tokens、top_p）会被显式声明为 Pydantic 字段，而任何底层
    API 支持但 LangChain 未封装的参数，都可以通过 model_kwargs 传递。\n\n例如，OpenAI 的 logit_bias 可以控制特定
    token 的出现概率，LangChain 并未提供直接的 Pydantic 字段。此时你可以：\n\nmodel = ChatOpenAI(\n    model=\"gpt-4\",\n
    \   temperature=0.3,\n    model_kwargs={\"logit_bias\": {1234: 100}, \"user\":
    \"abc\"}\n)\n\n在 ChatOpenAI 内部，这些 model_kwargs 最终会被合并到发给 OpenAI API 的请求体 **kwargs
    中。\n\n\U0001F4E6 传递机制：LangChain 在调用底层 SDK 时，会将 Pydantic 字段（如 temperature）和 model_kwargs
    合并为一个字典，并过滤掉 None 值，然后解包传给 SDK 的 create 方法。例如，OpenAI 的调用最终等价于：\n\nclient.chat.completions.create(\n
    \   model=\"gpt-4\",\n    temperature=0.3,\n    logit_bias={1234: 100},\n    user=\"abc\",\n
    \   messages=[...]\n)\n\n⚠️ 注意事项：\n\n- model_kwargs 中的参数会覆盖同名的标准参数，可能导致意外行为，需谨慎使用。\n\n-
    不同提供商的 SDK 支持的额外参数不同，使用前需查阅对应文档。\n\n- 如果你需要动态改变 model_name 或 model_kwargs，可以在运行时通过
    bind() 方法或重新创建模型实例实现。"

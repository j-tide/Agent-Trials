answer:
  mode: rubric
  reference_answer: |-
    模型可能会“擅自发挥”，导致数据不完整或不准确：

    - 遗漏必填字段：提示要求输出姓名和年龄，但模型可能只返回了姓名。

    - 数据类型不匹配：要求年龄是数字，模型却输出了字符串 “二十五” 或者 “25岁”。

    - 结构嵌套错误：对于复杂的嵌套对象或列表，模型可能弄错层级关系。

content:
  prompt: 8.1 基础集成
answer:
  mode: rubric
  reference_answer: |-
    最基本的集成模式是：prompt | model | parser。数据流如下：

    - prompt 接收用户输入，生成 ChatPromptValue 或字符串。

    - model 接收 Prompt 的输出，生成 AIMessage 或字符串。

    - parser 接收模型的输出，调用其 parse 方法，将文本转换为目标对象（如 Pydantic 实例、字典、列表等）。

    ```python
    from langchain_core.prompts import ChatPromptTemplate
    from langchain_openai import ChatOpenAI
    from langchain_core.output_parsers import PydanticOutputParser
    from pydantic import BaseModel, Field

    # 1. 定义数据结构
    class Person(BaseModel):
        name: str = Field(description="姓名")
        age: int = Field(description="年龄")

    # 2. 创建解析器
    parser = PydanticOutputParser(pydantic_object=Person)

    # 3. 构建 Prompt，注入格式指令
    prompt = ChatPromptTemplate.from_messages([
        ("system", "你是一个信息提取助手。{format_instructions}"),
        ("human", "从以下文本提取信息：{text}")
    ])

    # 4. 模型
    model = ChatOpenAI(model="gpt-4o", temperature=0)

    # 5. LCEL 链：使用管道符串联
    chain = prompt | model | parser

    # 6. 调用
    result = chain.invoke({
        "text": "我叫张三，今年28岁。",
        "format_instructions": parser.get_format_instructions()
    })
    print(result)  # Person(name='张三', age=28)
    ```

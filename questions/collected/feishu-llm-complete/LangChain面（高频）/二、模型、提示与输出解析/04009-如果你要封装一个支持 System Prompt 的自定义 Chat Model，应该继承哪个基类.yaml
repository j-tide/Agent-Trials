content:
  prompt: 如果你要封装一个支持 System Prompt 的自定义 Chat Model，应该继承哪个基类？
answer:
  mode: rubric
  reference_answer: "\U0001F9EC 应该继承 BaseChatModel。\n\n理由：\n\n- BaseChatModel 原生支持消息列表作为输入，其中
    SystemMessage 就是消息列表的一部分。\n\n- 它内部处理了消息格式转换、工具调用绑定、流式支持等，开发者只需实现 _generate 和（可选的）_stream。\n\n-
    不需要去处理 SystemMessage 的特殊逻辑，因为它只是 messages 参数中的一个元素。你只需将整个消息列表转发给底层模型 API 即可。\n\n\U0001F4DC
    示例：\n\nfrom langchain_core.language_models.chat_models import BaseChatModel\nfrom
    langchain_core.messages import AIMessage\nfrom langchain_core.outputs import ChatResult,
    ChatGeneration\n\nclass MySystemPromptModel(BaseChatModel):\n    model_name: str
    = \"my-model\"\n    api_url: str = \"http://localhost:8000/chat\"\n\n    def _generate(self,
    messages, stop=None, run_manager=None, **kwargs):\n        # messages 中已包含 SystemMessage,
    HumanMessage 等，直接转发\n        payload = self._convert_messages(messages)\n        response
    = requests.post(self.api_url, json=payload)\n        text = response.json()[\"content\"]\n
    \       return ChatResult(generations=[ChatGeneration(message=AIMessage(content=text))])\n\n
    \   @property\n    def _llm_type(self):\n        return \"my-system-prompt-model\"\n\n\U0001F4A1
    注意事项：\n\n- 如果你的底层 API 不支持 System Prompt 或需要将其放在特定位置，你可以在 _generate 内部对 messages
    进行重排或合并。\n\n- 如果模型需要将 System Prompt 作为单独参数（如某些开源模型的 system_prompt 字段），你可以覆盖 _generate，从
    messages 中提取 SystemMessage，然后单独处理。"

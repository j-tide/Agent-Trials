  prompt: 13.3 这种设计模式的优点
answer:
  mode: rubric
  reference_answer: |-
    - 解耦：Prompt 模板不需要知道输出格式的细节，它只负责留出位置。解析器不需要知道 Prompt 长什么样，只负责提供指令和解析。两者可以独立开发和修改。

    - 自动化：开发者无需手动为每个任务编写冗长的格式说明，解析器会自动完成，减少了错误和不一致。

    - 动态性：你可以根据不同的解析器在运行时动态生成不同的格式指令，同一个 Prompt 模板可以适配多种输出格式。

    - 可扩展：自定义的解析器只需实现 get_format_instructions 方法，就可以无缝地融入这个协作体系。

    通过这种精巧的协作，LangChain 将“引导模型输出”这一复杂过程标准化和自动化了，让开发者可以专注于业务逻辑，而非 Prompt 字符串的拼接。

    ### 介绍一种你在项目中使用过的复杂输出解析方式，比如嵌套 JSON 或列表。

    在一个智能合同审查项目中，我们需要从一份长达数十页的租赁合同中提取结构化的关键条款信息。目标输出结构包括合同基本信息、租赁双方详情、以及一个包含多个条款的列表，每个条款下面又有子字段（如条款内容、风险等级、相关法律依据等）。这是一个典型的“列表嵌套对象”结构，使用 Pydantic 配合 PydanticOutputParser 可以精准定义并提取。

content:
  prompt: 写一个 PromptTemplate 的示例，包含多个变量，并说明如何使用 invoke 替换。
answer:
  mode: rubric
  reference_answer: "\U0001F4DD PromptTemplate 是 LangChain 中最基础的提示工具，它使用 Python 的
    str.format 语法来定义带有占位符的模板。当调用 invoke 时，传入的字典会自动填充占位符，生成最终的提示字符串。\n\n下面是一个包含三个变量的例子：\n\n```python\nfrom
    langchain_core.prompts import PromptTemplate\n\ntemplate = PromptTemplate.from_template(\n
    \   \"请写一篇关于{topic}的文章，风格是{style}，字数大约{word_count}字。\"\n)\n\n# 使用 invoke 替换变量\nfinal_prompt
    = template.invoke({\n    \"topic\": \"量子计算\",\n    \"style\": \"科普\",\n    \"word_count\":
    \"500\"\n})\nprint(final_prompt)\n# 输出: \"请写一篇关于量子计算的文章，风格是科普，字数大约500字。\"\n```\n\n\U0001F4A1
    invoke 方法的本质：它接收一个字典，将字典中的键映射到模板中的 {变量}，然后返回一个 StringPromptValue 对象（可以通过 .to_string()
    转为纯文本，或者直接传给模型）。在 LCEL 中，通常将 PromptTemplate 与模型直接串联：prompt | model，LangChain 会自动调用
    invoke 并传递上游的输出字典。\n\n\U0001F527 更复杂的用法：\n\n- 部分变量：如果某些变量是固定的，可以在创建模板时使用 partial
    方法预先填充，比如 template.partial(style=\"科普\")，后续只需传入 topic 和 word_count。\n\n- 验证：PromptTemplate
    默认会在 invoke 时检查是否所有变量都提供了值，防止遗漏。"

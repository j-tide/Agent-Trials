content:
  prompt: 14.1 定义多层嵌套的 Pydantic 模型
answer:
  mode: rubric
  reference_answer: |-
    我们首先用 Pydantic 定义一个可以递归嵌套的模型，清晰表达业务逻辑。

    ```python
    from pydantic import BaseModel, Field
    from typing import List, Optional, Literal

    class LegalReference(BaseModel):
        """法律依据"""
        law: str = Field(description="法律名称，如'合同法'")
        article: str = Field(description="条款编号，如'第13条'")
        description: str = Field(description="相关法律内容摘要")

    class ContractClause(BaseModel):
        """单个合同条款"""
        clause_id: str = Field(description="条款编号，如'3.2'")
        title: str = Field(description="条款标题")
        content: str = Field(description="条款原文摘要")
        risk_level: Literal["高", "中", "低"] = Field(description="风险等级")
        suggestion: Optional[str] = Field(description="修改建议")
        legal_refs: Optional[List[LegalReference]] = Field(description="涉及的法律依据列表")

    class ContractInfo(BaseModel):
        """合同主体信息"""
        contract_name: str = Field(description="合同名称")
        party_a: str = Field(description="甲方全称")
        party_b: str = Field(description="乙方全称")
        start_date: str = Field(description="合同生效日期")
        end_date: str = Field(description="合同终止日期")

    class ContractExtraction(BaseModel):
        """最终提取结果"""
        basic_info: ContractInfo
        clauses: List[ContractClause] = Field(description="提取的所有条款")
        overall_risk: Literal["高", "中", "低"] = Field(description="整体风险评级")
        summary: str = Field(description="合同摘要")
    ```

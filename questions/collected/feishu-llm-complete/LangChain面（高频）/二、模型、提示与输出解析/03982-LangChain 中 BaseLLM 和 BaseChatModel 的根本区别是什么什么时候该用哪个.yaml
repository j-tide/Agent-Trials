content:
  prompt: LangChain 中 BaseLLM 和 BaseChatModel 的根本区别是什么？什么时候该用哪个？
answer:
  mode: rubric
  reference_answer: "LangChain 将语言模型分为两大抽象：BaseLLM 和 BaseChatModel。它们底层都继承自 BaseLanguageModel，但面向的交互范式截然不同。\n\n\U0001F4DC
    BaseLLM：面向传统的“文本补全”模型（如 GPT-3、text-davinci-003、早期的 Cohere Generate API）。\n\n-
    输入和输出都是纯字符串。\n\n- 你的 Prompt 直接是一个字符串，模型返回一个字符串。\n\n- 没有内置的对话角色管理（如 system、user、assistant
    分离）。\n\n- 典型使用场景：单轮文本生成（摘要、翻译、代码补全）、批量处理无上下文的任务。\n\n\U0001F4AC BaseChatModel：面向现代的“对话”模型（如
    GPT-3.5-Turbo、GPT-4、Claude、Llama 3）。\n\n- 输入是一个 List[BaseMessage]，包含 SystemMessage、HumanMessage、AIMessage
    等。\n\n- 输出是一个 BaseMessage（通常是 AIMessage），支持 content 和 tool_calls 等字段。\n\n- 原生支持多轮对话、角色扮演、工具调用（Function
    Calling）。\n\n- 典型使用场景：聊天机器人、Agent、任何需要多轮交互的复杂应用。\n\n\U0001F9ED 什么时候该用哪个？\n\n-
    如果你的任务很简单，且模型只支持文本补全 API（如某些开源模型），可以使用 BaseLLM。\n\n- 几乎所有现代 LLM 都提供 Chat API，因此新项目应默认使用
    BaseChatModel。\n\n- 即使你的任务是单轮问答，也可以使用 BaseChatModel，在 Prompt 中只放一条 HumanMessage，效果通常比文本补全更好，因为对话模型经过了指令微调。\n\n-
    BaseLLM 在新版 LangChain 中逐渐边缘化，官方重心在 BaseChatModel 上。\n\n\U0001F4A1 设计差异的本质：BaseChatModel
    是 BaseLLM 的超集，它通过消息结构携带了更丰富的语义信息（角色、工具调用），使得模型能理解更复杂的指令。LangChain 选择将两者分开，是为了向后兼容历史模型，同时为新一代模型提供更清晰的接口。"

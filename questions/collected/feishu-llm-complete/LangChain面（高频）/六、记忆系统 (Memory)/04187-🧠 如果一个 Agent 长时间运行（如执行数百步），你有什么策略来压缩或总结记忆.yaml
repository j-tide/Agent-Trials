content:
  prompt: "\U0001F9E0 如果一个 Agent 长时间运行（如执行数百步），你有什么策略来压缩或总结记忆？"
answer:
  mode: rubric
  reference_answer: |-
    数百步的执行中，Agent 会产生大量中间步骤，记忆膨胀极快。此时，需要主动“遗忘”和“总结”。

    策略一：分层摘要

    - 将 Agent 的推理过程分成阶段。每完成一个子任务，就调用 LLM 生成该阶段的摘要，并丢弃该阶段的详细 scratchpad，只保留摘要。

    - 最终 Prompt 由“全局目标 + 多个阶段摘要 + 当前阶段的详细步骤”组成。

    策略二：结构化状态追踪

    - 不让 LLM 记忆所有细节，而是让 Agent 维护一个结构化的“任务状态对象”（例如 JSON），记录已完成的任务、待办事项、关键数据等。

    - 每次推理时，只将这个状态对象的最新版本注入 Prompt，而不是全部历史。

    策略三：利用外部存储作为“外脑”

    - 将重要的中间结果（如“已经处理了37个文件”）写入 Redis 或数据库。

    - Agent 可以调用一个 read_state 工具来读取这些信息，避免将所有数据保留在内存中。

    策略四：滑动窗口与遗忘

    - 对于长对话，只保留最近的 K 轮完整对话，早期的对话直接丢弃或用一句摘要替代。

    - 可以对记忆设置“遗忘曲线”，距离当前越远的事件，其权重越低，最终从 Prompt 中移除。

    实践反思：真正的智能体不应依赖无限的上下文窗口，而应像人类一样，将信息编码到外部知识结构中（笔记本、数据库），并在需要时精准检索。LangChain 目前缺乏这方面的内置支持，需要自己造轮子。


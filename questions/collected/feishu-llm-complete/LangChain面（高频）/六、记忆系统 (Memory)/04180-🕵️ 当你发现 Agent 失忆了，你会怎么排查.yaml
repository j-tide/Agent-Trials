content:
  prompt: "\U0001F575️ 当你发现 Agent “失忆”了，你会怎么排查？"
answer:
  mode: rubric
  reference_answer: |-
    Agent “失忆”（忘记了之前的对话内容或指令）是常见问题，排查可从“信息有没有存入”、“有没有正确加载”、“有没有被截断”三方面入手。

    排查流程

    - 确认记忆是否被正确保存

    - 检查记忆加载逻辑

    - 检查是否被截断或压缩

    - 检查 Agent 的 scratchpad 影响

    - 隔离测试

    - 利用 LangSmith 追踪

    预防措施：在 Prompt 中要求模型在不确定时主动询问，同时监控 token_count，确保未超出限制。我通常会在 Agent 的 Prompt 中加一句：“如果记不清之前的信息，请让用户复述。”


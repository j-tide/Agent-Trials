content:
  prompt: "\U0001F50D 如何使用 LangSmith 观察记忆的读取和写入操作？"
answer:
  mode: rubric
  reference_answer: |-
    LangSmith 是 LangChain 的官方可观测性平台，它能让你像调试普通代码一样调试 LLM 应用。观察记忆的读写是它的强项。

    步骤

    - 设置环境变量：注册 LangSmith，获取 API Key，设置环境变量，确保你的链运行会被自动追踪。

    - 运行你的链：进行一次或多次对话。

    - 在 LangSmith UI 中查看 Trace：

    - 对比与调试：如果你怀疑记忆丢失，可以对比第 N 轮对话的“读取”输出和第 N-1 轮对话的“写入”输入，看信息是否完整传递。

    高级技巧：

    - 你可以为 Memory 操作添加自定义的 run_name，例如 "Load User Session History"，让 Trace 更易读。

    - 利用 LangSmith 的“数据集”和“评估”功能，构建一组包含预期的记忆行为的测试用例，自动评估你的链是否正确处理了记忆。

    - LangSmith 还能显示每一步的 token 消耗，帮助你判断记忆是否过长导致 Prompt 超限。

    个人感受：没有 LangSmith 时，查记忆问题就像盲人摸象。有了它，你能直观地看到每一轮对话给 LLM 发送的完整 Prompt，以及记忆在其中的位置。这是排查“失忆”问题的最佳工具。


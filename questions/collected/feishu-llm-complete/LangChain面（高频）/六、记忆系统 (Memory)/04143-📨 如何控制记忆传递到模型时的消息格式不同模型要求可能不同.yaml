content:
  prompt: "9. \U0001F4E8 如何控制记忆传递到模型时的消息格式？不同模型要求可能不同。"
answer:
  mode: rubric
  reference_answer: |-
    不同 LLM 提供商对 Prompt 中历史消息的格式要求不同。OpenAI 的聊天模型（gpt-4）期望 [{"role": "user", "content": "..."}, ...]，而一些文本模型则期望 Human: ...\nAI: ...。LangChain 的 Memory 可以通过配置和自定义方法来适应这些差异。

    1. 使用消息格式（推荐）
    将 Memory 的 return_messages=True。这样 load_memory_variables 返回的是 List[BaseMessage]。LangChain 的聊天模型会自动处理这些消息，将其转换为提供商需要的 API 格式。这是最简单且最现代的方式。

    2. 自定义消息模板
    如果使用字符串 Prompt，你可以通过 Memory 的 human_prefix 和 ai_prefix 参数来控制输出格式。

    ```python
    memory = ConversationBufferMemory(
        human_prefix="User",
        ai_prefix="Assistant",
        memory_key="history"
    )
    # 输出格式：
    # User: 你好
    # Assistant: 你好！有什么可以帮你的？
    ```

    对于更复杂的需求，可以继承 Memory 类并重写 get_buffer_string 方法，或者直接处理消息列表，手动拼接成你需要的字符串。

    - 处理不同模型角色的映射
    LangChain 的消息类型（HumanMessage, AIMessage）在传递给不同模型时，会被自动转换。例如，ChatOpenAI 会将 HumanMessage 映射为 role: "user"。如果你使用的模型需要特殊的角色名称（如 "user" 映射为 "participant"），你可以自定义转换逻辑，在将消息传递给模型之前进行映射。

    - 避免格式错误

    - 当 Prompt 模板同时混用字符串和消息数组时，很容易出错。务必保持一致性。

    - 如果你在使用 ConversationChain，它内部已经做了格式适配。如果是自定义链，确保 PromptTemplate 的类型与 Memory 返回的格式兼容。

    实践建议：新项目一律使用 return_messages=True，并结合聊天模型。这能最大限度地利用 LangChain 的自动适配能力，减少格式转换的错误。如果需要支持传统文本模型，再考虑自定义格式化。


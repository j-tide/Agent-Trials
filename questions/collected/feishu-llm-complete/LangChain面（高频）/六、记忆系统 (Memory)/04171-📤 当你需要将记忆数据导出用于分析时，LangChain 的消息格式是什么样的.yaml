content:
  prompt: "\U0001F4E4 当你需要将记忆数据导出用于分析时，LangChain 的消息格式是什么样的？"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 使用一套标准化的消息格式来表示对话历史，即 BaseMessage 的子类：

    - HumanMessage：用户消息。

    - AIMessage：AI 回复。

    - SystemMessage：系统指令。

    - FunctionMessage：工具/函数调用结果。

    - ToolMessage：工具执行结果。

    这些消息对象都有 content 属性（文本内容）和 additional_kwargs（额外元数据）。当 Memory 的 return_messages=True 时，它返回的是一个消息列表。

    导出为可分析格式：
    最通用的方式是导出为 JSON。LangChain 的消息对象内置了 .json() 方法和 .dict() 方法，可以直接序列化。

    示例导出代码：

    ```python
    import json
    from langchain.memory import ConversationBufferMemory

    # 假设这是你的 memory
    memory = ConversationBufferMemory(memory_key="chat_history", return_messages=True)
    # ... 进行一些对话 ...

    # 导出所有消息为 JSON 字符串
    messages = memory.chat_memory.messages
    export_data = [msg.dict() for msg in messages]
    with open("chat_history.json", "w") as f:
        json.dump(export_data, f, indent=2, ensure_ascii=False)
    ```

    导出的 JSON 结构示例：

    ```json
    [
      {
        "type": "human",
        "content": "你好，我叫小明",
        "additional_kwargs": {}
      },
      {
        "type": "ai",
        "content": "你好小明，有什么可以帮助你的？",
        "additional_kwargs": {}
      }
    ]
    ```

    这种结构非常清晰，便于后续用 Pandas 或其他工具进行分析。


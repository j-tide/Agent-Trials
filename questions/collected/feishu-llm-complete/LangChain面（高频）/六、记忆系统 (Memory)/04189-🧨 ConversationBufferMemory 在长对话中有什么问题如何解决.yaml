content:
  prompt: "\U0001F9E8 ConversationBufferMemory 在长对话中有什么问题？如何解决？"
answer:
  mode: rubric
  reference_answer: |-
    ConversationBufferMemory 最致命的缺陷是：它会无限地存储对话历史。

    问题表现：

    - Token 爆炸，成本失控：每次请求都要把整个历史发送给 LLM。对话 100 轮后，Prompt 的 token 数可能达到数万，不仅 API 费用飙升，而且很容易超出模型的上下文窗口限制（如 4096），导致请求失败。

    - 延迟剧增：更大的 Prompt 意味着更长的处理时间，用户体验变差。

    - 模型迷失：过长的历史可能让模型注意力分散，难以聚焦于最近的对话，甚至“遗忘”早期的关键信息。

    解决方案：

    根据场景不同，有以下几种 Memory 替代方案：

    - 基于窗口的 Memory (ConversationBufferWindowMemory)：只保留最近 K 轮对话，旧对话直接丢弃。适合实时对话，对近期上下文敏感的场景。

    - 基于摘要的 Memory (ConversationSummaryMemory)：使用 LLM 对历史对话进行摘要，只保留摘要。适合需要长期记忆但不需要完整细节的场景。

    - 混合策略 (ConversationSummaryBufferMemory)：结合窗口和摘要。保留最近几轮完整对话，同时将更早的对话压缩为摘要。这是最推荐的生产级方案，兼顾了近期细节和长期上下文。

    - 基于 Token 的 Memory (ConversationTokenBufferMemory)：根据 token 数量限制，而不是轮次，更精确地控制上下文长度。

    选择哪种方案取决于你对“细节”和“总长度”的权衡。


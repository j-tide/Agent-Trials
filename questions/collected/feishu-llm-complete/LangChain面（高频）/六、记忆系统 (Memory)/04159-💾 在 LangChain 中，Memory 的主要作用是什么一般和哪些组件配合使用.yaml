content:
  prompt: "\U0001F4BE 在 LangChain 中，Memory 的主要作用是什么？一般和哪些组件配合使用？"
answer:
  mode: rubric
  reference_answer: |-
    Memory 在 LangChain 中的角色就像是一个会话的记事本。它负责在多次独立的链调用（或 Agent 执行）之间，持久化地存储和传递关键信息，让无状态的 LLM 能够“记住”之前的对话内容、用户的偏好或是任务进展。

    主要作用：

    - 维护对话历史：记录用户和 AI 之间的所有交流，让模型能根据上下文来理解新问题（比如指代消解：“他后来怎么样了？”中的“他”是谁）。

    - 存储上下文状态：在更复杂的链中，保存中间计算结果、提取的实体、用户的意图等。

    - 实现长期交互：让对话不仅限于单轮，而是构建一个连续、连贯的多轮交互体验。

    一般配合的组件：

    - LLMChain / ConversationChain：这是 Memory 最经典的搭档。Memory 负责存储对话历史，链在每次生成新回答时，会将历史记录注入 Prompt，从而使回答基于整个对话的上下文。

    - ConversationalRetrievalChain：Memory 在这里除了记录对话，还用于生成独立的检索查询。它会利用对话历史将“它有什么副作用？”改写为“布洛芬有什么副作用？”，从而提高检索精度。

    - Agent：Memory 让 Agent 能够记住多步推理的中间结果、调用了哪些工具、获得了什么信息，从而规划下一步行动。

    - 自定义链：开发者可以在任何需要“状态保持”的链中集成 Memory。

    工作流程示例：

    - 用户提出问题“我想买一辆适合家用的SUV”。

    - 链执行，生成回答。这次交互的 HumanMessage 和 AIMessage 被追加到 Memory 中。

    - 用户接着问“它的油耗高吗？”。

    - 链将 Memory 中的历史消息与新问题一同加载到 Prompt，LLM 能理解“它”指的是前面提到的SUV，从而给出正确回答。


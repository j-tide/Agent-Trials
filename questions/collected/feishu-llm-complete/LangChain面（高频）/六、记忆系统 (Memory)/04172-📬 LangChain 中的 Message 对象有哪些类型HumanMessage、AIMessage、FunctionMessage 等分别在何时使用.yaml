content:
  prompt: "\U0001F4EC LangChain 中的 Message 对象有哪些类型？HumanMessage、AIMessage、FunctionMessage
    等分别在何时使用？"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 的消息系统为多角色对话提供了丰富的类型。这些类型帮助 LLM 区分不同来源的信息，从而更准确地理解上下文。

    [嵌入表格未展开]

    何时使用：

    - 在对话链中，框架自动创建 HumanMessage 和 AIMessage。

    - 当你在构建 Prompt 模板时，可以手动创建 SystemMessage 来设定规则。

    - 在使用 Agent 或工具时，会用到 ToolMessage / FunctionMessage 来传递工具执行结果。

    - ChatMessage 提供了最大的灵活性，你可以自定义角色，但通常不建议滥用，因为 LLM 可能无法理解自定义角色。

    这些消息类型确保了 LangChain 与不同 LLM 提供商（OpenAI、Anthropic等）之间的兼容性，LangChain 会在底层将它们转换为对应 API 需要的格式。


content:
  prompt: "\U0001F504 服务重启后，之前存储在内存中的记忆会丢失吗？如何避免？"
answer:
  mode: rubric
  reference_answer: |-
    如果使用基于内存的 ChatMessageHistory（如默认的 ChatMessageHistory 或 InMemoryStore），服务重启后所有对话历史将完全丢失。因为数据只存在于进程内存中。

    避免丢失的方法：使用持久化的 ChatMessageHistory 后端。

    LangChain 提供了多种持久化后端，你可以根据需求选择：

    - 数据库：PostgresChatMessageHistory, SQLChatMessageHistory。数据存储在磁盘，重启后依然存在。

    - 缓存/消息队列：RedisChatMessageHistory。Redis 支持持久化（RDB/AOF），重启后数据可以恢复，但取决于配置。

    - 云服务：DynamoDBChatMessageHistory (AWS), CosmosDBChatMessageHistory (Azure) 等。

    示例：切换到 Redis

    ```python
    from langchain.memory.chat_message_histories import RedisChatMessageHistory

    history = RedisChatMessageHistory(session_id="...", url="redis://localhost:6379")
    memory = ConversationBufferMemory(chat_memory=history)
    ```

    这样即使服务重启，对话历史仍然存储在 Redis 中，不会丢失。

    如果必须使用内存（比如开发环境），可以考虑使用外部会话粘性（Sticky Sessions）和共享内存，但这在生产中不推荐。

    注意：如果你的链使用了 ConversationSummaryMemory 等包含摘要的记忆，摘要数据本身也存储在 ChatMessageHistory 中，因此持久化后一并保存。


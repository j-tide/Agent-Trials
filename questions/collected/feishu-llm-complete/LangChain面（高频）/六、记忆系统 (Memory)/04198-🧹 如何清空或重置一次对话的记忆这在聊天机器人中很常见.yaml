content:
  prompt: "\U0001F9F9 如何清空或重置一次对话的记忆？这在聊天机器人中很常见。"
answer:
  mode: rubric
  reference_answer: |-
    清空记忆非常简单，所有 Memory 类都提供了 clear() 方法。

    - 对于单一 Memory：直接调用 memory.clear()。它会删除内部存储的所有历史消息。

    - 对于持久化存储（如 Redis）：clear() 会删除 Redis 中对应的键。

    常见场景：

    - 用户点击“新对话”按钮。

    - 用户输入“重置对话”或“忘记之前”等指令。

    实现示例：

    ```python
    from langchain.memory import ConversationBufferMemory
    from langchain.chains import ConversationChain

    memory = ConversationBufferMemory()
    conversation = ConversationChain(llm=llm, memory=memory)

    def start_new_chat():
        memory.clear()
        # 可选：重新设置系统提示或默认上下文
    ```

    如果你的应用需要同时管理多个对话，可以为每个对话分配独立的 session_id，并创建对应的 Memory 实例。当用户需要清除某个对话时，只需用该 session_id 初始化 Memory 并调用 clear()。

    对于 ConversationSummaryBufferMemory 等包含摘要的 Memory，clear() 也会同时清除摘要和消息历史，完全重置。


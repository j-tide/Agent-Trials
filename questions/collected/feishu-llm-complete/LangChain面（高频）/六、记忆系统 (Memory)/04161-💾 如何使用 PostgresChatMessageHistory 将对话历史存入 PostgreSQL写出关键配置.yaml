content:
  prompt: "\U0001F4BE 如何使用 PostgresChatMessageHistory 将对话历史存入 PostgreSQL？写出关键配置。"
answer:
  mode: rubric
  reference_answer: |-
    要将对话历史持久化到 PostgreSQL，LangChain 提供了开箱即用的 PostgresChatMessageHistory。它基于 psycopg2 或 asyncpg，将每一条聊天消息作为一行数据存储在数据库表中。

    关键步骤与配置：

    - 安装依赖
    需要安装 langchain-community 以及 PostgreSQL 驱动（通常为 psycopg2-binary）。

    ```bash
    pip install langchain-community psycopg2-binary
    ```

    - 准备数据库表

    LangChain 不会自动创建表，你需要预先执行以下 SQL：

    ```sql
    CREATE TABLE chat_history (
        id SERIAL PRIMARY KEY,
        session_id VARCHAR(255) NOT NULL,
        message JSONB,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    CREATE INDEX idx_session_id ON chat_history(session_id);
    ```

    表结构可以根据需要调整，但 session_id 和 message 是必须的。message 字段存储 LangChain 消息对象的 JSON 序列化形式。

    - 配置连接
    使用连接字符串（DSN）创建 PostgresChatMessageHistory 实例。

    ```python
    from langchain_community.chat_message_histories import PostgresChatMessageHistory

    history = PostgresChatMessageHistory(
        connection_string="postgresql://user:password@localhost:5432/mydb",
        session_id="user_123_session_001",
        table_name="chat_history"
    )
    ```

    - 集成到 Memory 中
    将 history 对象传递给 ConversationBufferMemory 等记忆组件。

    高级配置与技巧：

    - 自定义表名：通过 table_name 参数指定。

    - 使用异步驱动：如果使用 asyncpg，可以换成 PostgresChatMessageHistory 的异步版本（或直接使用 AsyncPostgresChatMessageHistory，具体取决于版本）。

    - 处理连接池：在高并发下，建议使用连接池（如 SQLAlchemy 配合 QueuePool）来管理数据库连接，而不是每次创建新的 psycopg2 连接。你可以通过自定义引擎传入：

    ```python
    from sqlalchemy import create_engine
    engine = create_engine("postgresql://...", pool_size=10)
    history = PostgresChatMessageHistory(engine=engine, session_id="...")
    ```

    - 从 LangChain 0.0.30+ 开始支持直接传入 SQLAlchemy 引擎。

    - 索引优化：确保 session_id 上有索引，因为每次加载记忆都是按 session_id 查询。

    内部实现细节：
    add_message 方法会将 LangChain 的消息对象（如 HumanMessage）序列化成 JSON 格式存入 message 列。加载时，它执行 SELECT * FROM chat_history WHERE session_id = %s ORDER BY id，然后反序列化 JSON 得到消息列表。

    踩过的坑：

    - 如果消息中包含特殊字符，JSON 序列化可能会失败？LangChain 的消息对象都实现了 .json() 方法，一般没问题。

    - 在高并发下，多个请求可能同时写入同一个 session，需要确保数据库的隔离级别和连接管理得当，避免死锁。


content:
  prompt: "\U0001F4DD 写出 ConversationBufferWindowMemory 的配置示例，并说明它如何影响 prompt。"
answer:
  mode: rubric
  reference_answer: |-
    ```python
    from langchain.memory import ConversationBufferWindowMemory
    from langchain.chains import ConversationChain
    from langchain.llms import OpenAI

    # 创建只保留最近2轮对话的窗口记忆
    memory = ConversationBufferWindowMemory(k=2)

    # 创建对话链
    conversation = ConversationChain(
        llm=OpenAI(temperature=0),
        memory=memory,
        verbose=True
    )

    # 模拟多轮对话
    conversation.predict(input="你好，我是小明")       # 轮次1
    conversation.predict(input="帮我查一下天气")        # 轮次2
    conversation.predict(input="刚才我说我叫什么名字？")  # 轮次3
    ```

    如何影响 Prompt：
    在第三轮时，Memory 只会包含最近两轮（即第2和第3轮）的完整对话。Prompt 中 {history} 部分会被填充为：

    ```text
    Human: 帮我查一下天气
    AI: 好的，请问您想查询哪个城市的天气？
    Human: 刚才我说我叫什么名字？
    AI:
    ```

    由于第一轮对话（包含“我是小明”的信息）已被移出窗口，LLM 完全无法得知用户的名字，因此无法正确回答。其影响就是：早期上下文丢失，导致记忆缺失。

    这就是窗口记忆的典型行为和局限性：严格控制资源消耗，但牺牲长期记忆。


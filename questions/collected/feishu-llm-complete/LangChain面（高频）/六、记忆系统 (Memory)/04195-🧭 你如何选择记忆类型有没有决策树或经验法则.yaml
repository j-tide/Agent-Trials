content:
  prompt: "\U0001F9ED 你如何选择记忆类型？有没有决策树或经验法则？"
answer:
  mode: rubric
  reference_answer: |-
    选择记忆类型的关键在于平衡长期上下文需求、细节保留程度、延迟与成本。以下是经验性的决策路径：

    - 第一步：是否需要长期记忆？

    - 第二步：对近期细节和远期脉络的要求如何？

    - 第三步：是否需要精确的近期原话？

    - 第四步：是否需要精确控制 token 数量，且不希望有任何额外 LLM 开销？

    经验法则：

    - 极简场景：ConversationBufferWindowMemory(k=3)

    - 生产级通用方案：ConversationSummaryBufferMemory，配合合理的 max_token_limit。

    - 如果用户在对话中经常跳回早期话题：ConversationSummaryMemory 或 SummaryBuffer。

    - 多用户、需要持久化：所有 Memory 都可搭配 RedisChatMessageHistory 等后端，实现持久化和隔离。

    图表决策树：

    ```text
    需要长期记忆？
    ├── 否 → ConversationBufferMemory 或不用记忆
    └── 是
        ├── 只需最近几轮完整对话？
        │   └── ConversationBufferWindowMemory
        └── 需要全局脉络？
            ├── 需要精确近期原话？
            │   └── ConversationSummaryBufferMemory
            └── 不需要精确原话？
                └── ConversationSummaryMemory
    ```

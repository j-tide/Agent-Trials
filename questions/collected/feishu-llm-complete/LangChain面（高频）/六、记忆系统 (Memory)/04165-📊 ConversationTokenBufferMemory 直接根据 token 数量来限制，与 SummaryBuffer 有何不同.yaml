content:
  prompt: "\U0001F4CA ConversationTokenBufferMemory 直接根据 token 数量来限制，与 SummaryBuffer
    有何不同？"
answer:
  mode: rubric
  reference_answer: |-
    两者的目标都是控制上下文长度，但控制方式和信息保留策略截然不同。

    [嵌入表格未展开]

    具体区别示例：
    假设你设定两者均为 max_token_limit=200。

    - ConversationTokenBufferMemory：当对话进行到 200 token 时，早期的消息（比如用户问候、介绍）会被直接删除，不留任何痕迹。如果后面用户问“我刚才说我叫什么名字？”，模型只能回答“不知道”。

    - ConversationSummaryBufferMemory：当达到阈值时，它会将早期对话总结为“用户叫小明，想了解天气预报”，并将其存入 summary。当用户问名字时，模型虽然不记得原话，但能从摘要中获取关键信息，正确回答。

    选择建议：

    如果你需要一个完全无状态，严格受控的短时记忆，用 TokenBuffer。如果希望拥有持久但有损的长时记忆，且不在乎额外的 LLM 开销，用 SummaryBuffer。对于大多数产品，SummaryBuffer 是更好的选择，因为它更接近人类的记忆模式——我们不会完全忘记早些时候的对话，只是无法逐字复述。

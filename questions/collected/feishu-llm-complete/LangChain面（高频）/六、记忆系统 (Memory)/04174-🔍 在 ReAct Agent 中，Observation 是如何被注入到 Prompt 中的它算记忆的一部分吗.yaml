content:
  prompt: "\U0001F50D 在 ReAct Agent 中，Observation 是如何被注入到 Prompt 中的？它算记忆的一部分吗？"
answer:
  mode: rubric
  reference_answer: |-
    Observation 的注入过程：
    在 ReAct Agent 的执行循环中，每当 Agent 执行完一个工具（Action），工具返回的结果会被包装成 Observation。这个 Observation 紧接着会被格式化并追加到当前 scratchpad 中。然后，更新后的 scratchpad（包含所有历史 Thought/Action/Observation）与原始 Prompt 模板一起，重新发送给 LLM，用于下一轮推理。

    具体流程：

    - LLM 输出 Thought: ... Action: ... Action Input: ...

    - AgentExecutor 执行 Action，得到结果（即 Observation）。

    - 将本次的 Thought, Action, Action Input, Observation 作为一个整体，追加到 scratchpad 字符串（或消息列表）中。

    - 下一次调用 LLM 时，Prompt 中包含完整的 scratchpad，LLM 就能“看到”刚才发生了什么。

    它算记忆的一部分吗？
    不完全是。 Observation 是短期工作记忆，仅在当前任务闭环中存在。它不会被保存到 ConversationBufferMemory 等长期 Memory 中（除非 Agent 最终输出显式地复述了它）。如果把 Agent 比作一个人：

    - Memory 是人的长期记忆（记得昨天聊了什么）。

    - Scratchpad（包含 Observation）是人在解决当前问题时使用的草稿纸（写满了计算步骤，用完就扔）。

    实际影响：

    由于 Observation 不会进入 Memory，当下次对话再开启时，Agent 不记得之前调用工具的结果。如果需要在后续对话中引用这些结果，必须在应用层显式地将 Observation 写入 Memory 或长期知识库。


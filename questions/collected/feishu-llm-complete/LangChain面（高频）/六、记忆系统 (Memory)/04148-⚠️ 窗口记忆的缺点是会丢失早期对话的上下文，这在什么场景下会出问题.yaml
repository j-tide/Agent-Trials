content:
  prompt: "⚠️ 窗口记忆的缺点是会丢失早期对话的上下文，这在什么场景下会出问题？"
answer:
  mode: rubric
  reference_answer: |-
    窗口记忆（ConversationBufferWindowMemory）通过丢弃旧对话来限制长度，这在许多需要长期记忆或全局理解的场景中会造成严重问题。

    容易出问题的场景：

    - 多轮信息收集与确认
    例如，旅行社客服为用户预订机票。对话可能涉及：

    - 用户指令的“锚定”
    用户可能在对话一开始就设定了一个全局指令，例如：“用简单的中文跟我说话，避免专业术语”。如果这个指令在窗口之外，AI 就会恢复默认风格，开始大谈专业术语。

    - 深度咨询与教育辅导
    在一场数学辅导中，AI 需要记住学生暴露出哪些知识点薄弱（如分式运算），以便后续针对性出题。这些薄弱点可能在整个辅导过程中被多次提及，如果被窗口遗忘，AI 就失去了“因材施教”的能力。

    - 角色扮演或故事创作
    在合作编故事时，用户和 AI 共同构建了复杂的人物关系、世界背景、情节伏笔。窗口记忆一旦遗忘早期设定，后续的情节就会出现逻辑漏洞或人物崩坏。

    - 复杂问题的多步推理
    一些问题的解决可能需要跨越较长的对话轮次，比如分步调试代码。如果遗忘早期调试步骤的结果，AI 就无法准确判断错误根源。

    在这些场景中，摘要记忆（ConversationSummaryMemory）或其与窗口记忆的结合体（ConversationSummaryBufferMemory）是更好的选择，因为它们能以压缩形式保留全局脉络。


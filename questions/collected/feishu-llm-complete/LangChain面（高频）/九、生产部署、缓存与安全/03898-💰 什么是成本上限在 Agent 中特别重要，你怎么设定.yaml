content:
  prompt: "\U0001F4B0 什么是“成本上限”？在 Agent 中特别重要，你怎么设定？"
answer:
  mode: rubric
  reference_answer: |-
    成本上限是在单次或周期性任务中允许消耗的最大资源额度，通常体现为最大调用次数、最大Token数或最大金额。对Agent而言，由于其具备多步推理和工具循环的特性，单次任务可能无限制地调用LLM，成本极易失控。因此设定成本上限是生产级Agent的必备安全机制。

    在实际工程中，我通常从三个维度设定成本上限：

    - 步数上限：通过 AgentExecutor 的 max_iterations 限制Agent最多执行多少轮思考-行动循环。这是最直接的物理限制，能有效防止死循环或过度探索。通常设为5-10步，视任务复杂度而定。

    - Token上限：利用回调监控累积消耗的Token数（Prompt + Completion），当超过阈值时强制终止当前任务，并返回友好提示（如“任务超出预算，已中止”）。阈值设定可参考：免费用户单次任务不超过2000 Token，付费用户不超过10000 Token。

    - 金额上限：将Token消耗实时换算为成本（基于模型定价表），在每次LLM调用前检查是否超出剩余预算。若超出，则提前终止并降级处理（切换更便宜的模型或返回默认回复）。

    设定策略上，成本上限应支持动态配置（如通过配置中心或环境变量），并与用户套餐绑定。同时要给予用户清晰的超限提示，避免“静默失败”。我们曾为某个数据分析Agent设定单次任务最多10步、总Token不超过8000，并在回调中记录每一步的Token消耗。一旦超限，Agent会主动告知用户“分析任务过于复杂，已为您提取关键结论”，并将中间结果返回，而非直接报错。

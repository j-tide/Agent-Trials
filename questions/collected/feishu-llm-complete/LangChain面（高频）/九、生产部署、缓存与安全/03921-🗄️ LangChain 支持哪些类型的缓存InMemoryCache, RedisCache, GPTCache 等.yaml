content:
  prompt: "\U0001F5C4️ LangChain 支持哪些类型的缓存？InMemoryCache, RedisCache, GPTCache 等。"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 为了降低 LLM 调用成本、提升响应速度，提供了一套灵活的缓存抽象。核心接口是 BaseCache，开发者可以选用不同的后端实现，也可以自定义。目前官方和社区支持的主流缓存类型如下：

    - InMemoryCache：基于 Python 字典的内存缓存。读写极快，适合开发调试或单进程低负载场景。重启后数据丢失，无法跨进程共享。

    - RedisCache / RedisSemanticCache：基于 Redis 的分布式缓存。前者使用 Prompt 字符串的哈希作为 Key，进行精确匹配；后者利用向量相似度进行语义匹配（将查询转换为向量，搜索历史相似查询并返回缓存结果）。Redis 支持持久化、高可用、跨进程/跨实例共享，是生产环境首选。

    - SQLiteCache：基于 SQLite 的轻量级磁盘缓存。不需要额外服务，持久化，适合单机小规模应用，但并发能力弱。

    - GPTCache：由 GPTcache 社区提供的第三方缓存库，功能极为强大。它支持精确匹配、相似度匹配（基于向量）、多级缓存（热/温/冷）、缓存预加载、缓存刷新策略等。与 LangChain 的集成通过 GPTCache 的 LangChainCache 适配器实现。适合对缓存有精细控制需求的生产场景。

    - AstraDBCache：基于 DataStax AstraDB 的缓存，适合在 AstraDB 上构建的云原生应用。

    - MomentoCache：基于 Momento 的无服务器缓存，特点是低延迟、自动扩缩、无需管理基础设施，适合现代云架构。

    选用原则：开发时用 InMemoryCache；单机持久化用 SQLiteCache；分布式、高可用、多进程共享用 RedisCache；需要语义缓存或精细化控制用 GPTCache。


content:
  prompt: "\U0001F517 如何在 LCEL 链中为特定组件（如 Embedding）单独配置缓存？"
answer:
  mode: rubric
  reference_answer: |-
    LCEL 链本身没有“链级缓存”的概念，缓存通常是针对 LLM 或 Embedding 等底层组件单独配置的。你可以为不同的组件创建独立的缓存实例。

    为 Embedding 缓存：LangChain 的 CacheBackedEmbeddings 就是专门为 Embedding 设计的缓存层。它内部使用一个 BaseStore 来缓存文本的 Embedding 向量。

    ```python
    from langchain.embeddings import CacheBackedEmbeddings
    from langchain.storage import LocalFileStore
    from langchain_openai import OpenAIEmbeddings

    store = LocalFileStore("./cache/")
    embeddings = OpenAIEmbeddings()
    cached_embeddings = CacheBackedEmbeddings.from_bytes_store(embeddings, store)
    ```

    对于 LLM，在链外创建带有缓存的 LLM 实例，然后传入链中。不同 LLM 实例可以指向不同的缓存后端。例如，关键业务链用 RedisCache，非关键链用 InMemoryCache。

    ```python
    important_llm = ChatOpenAI(model="gpt-4", cache=RedisCache(...))
    normal_llm = ChatOpenAI(model="gpt-3.5-turbo", cache=InMemoryCache())
    chain1 = prompt1 | important_llm
    chain2 = prompt2 | normal_llm
    ```

    注意：Embedding 模型和 LLM 的缓存 Key 生成策略不同，Embedding 是文本本身，LLM 是 Prompt + 模型参数，它们互不冲突。


content:
  prompt: "⚖️ 如何为 LangChain 应用实施速率限制？可以在哪些层面做？"
answer:
  mode: rubric
  reference_answer: "速率限制是保护 LLM 应用免受过载、控制成本、保证公平性的核心手段。在 LangChain 应用中，可以在多个层面实施速率限制，形成纵深防御。\n\n\U0001F4E1
    层面一：API 网关或反向代理层（最外层）\n这是最推荐的首道防线，对应用无侵入。常见的如 Nginx、Kong、Envoy 或云服务商的 API 网关。你可以基于
    IP、API Key、路径等进行限流。例如，Nginx 使用 limit_req_zone 和 limit_req 指令，限制每 IP 每秒请求数。超过限制返回
    429 Too Many Requests。优点是不占用应用资源，且能保护整个服务。适合限制 HTTP 请求频率。\n\n\U0001F9E9 层面二：Web
    框架中间件层（应用入口）\n在 FastAPI 等框架中，可以通过中间件或依赖注入实现限流。常用库如 slowapi（基于 limits 库），它能轻松为特定路由添加令牌桶或固定窗口限流。也可以直接使用
    fastapi-limiter，它基于 Redis，支持分布式限流。这个层面可以更细粒度地控制，比如对不同的端点（/invoke vs /stream）设置不同的速率。\n\n\U0001F9E0
    层面三：LangChain 回调或包装器（应用逻辑层）\n这是最贴近 LLM 调用的控制点。你可以实现自定义的 BaseCallbackHandler，在
    on_llm_start 中检查速率限制（例如通过 Redis 计数器）。或者，将 LLM 实例包装在一个代理类中，在调用 generate 或 stream
    前先获取令牌。这种方式的优点是可以针对 LLM 调用本身限流（而非所有 HTTP 请求），并且可以结合业务逻辑（比如对不同用户、不同模型实施不同限制）。\n\n⚙️
    层面四：LLM Provider 侧（外部）\n\nOpenAI 等服务商本身提供 Rate Limit，但这不在我们控制范围内。我们只能适应它。当触发服务商限制时，LangChain
    默认会抛出异常，我们需要在应用中捕获并实现重试逻辑（如指数退避），或者通过前面层面的限流来避免触发。\n\n\U0001F3D7️ 组合策略：实际生产环境通常会组合使用。例如，在
    Nginx 层面限制每 IP 每秒 10 个请求（防止恶意刷量）；在 FastAPI 中间件层面限制用户每日 API 调用总次数（按订阅套餐）；在 LangChain
    回调层面限制 LLM 模型的每分钟 Token 消耗（RPM/TPM），确保不超过 OpenAI 的配额。多层限流各司其职，既保证了系统稳定，也控制了成本。\n\n示例：使用
    slowapi + FastAPI 为 LangServe 路由限流\n\n```python\nfrom fastapi import FastAPI\nfrom
    slowapi import Limiter, _rate_limit_exceeded_handler\nfrom slowapi.util import
    get_remote_address\nfrom langserve import add_routes\n\nlimiter = Limiter(key_func=get_remote_address)\napp
    = FastAPI()\napp.state.limiter = limiter\napp.add_exception_handler(429, _rate_limit_exceeded_handler)\n\n#
    为特定路由添加限流\n@app.post(\"/chat/invoke\")\n@limiter.limit(\"5/minute\")\nasync def
    chat_invoke(request: Request):\n    ...\n```\n\n实践案例：我们曾遇到一个客户，其前端 bug 导致短时间内发送了数千次相同请求，瞬间打满
    LLM 配额。后来我们在 Nginx 层设置了单 IP 每秒 20 次的限制，并在回调中监控 LLM 调用频率，超过阈值自动告警，问题得到根治。\n\n---"

content:
  prompt: "✅ 总结一下：构建安全、合规的 LangChain 应用的 checklist。"
answer:
  mode: rubric
  reference_answer: |-
    这是一个系统化的检查清单，覆盖从开发到运维的全生命周期：

    - 输入与输出安全

    - 权限与隔离

    - 合规与隐私

    - 审计与监控

    - 运维与依赖

    最后：安全不是一蹴而就的，而是持续迭代的过程。将这个清单融入你的 CI/CD 流程，定期评审和更新，才能让 LangChain 应用在稳健的轨道上运行。

    - 注入探测：检测 Prompt 中是否出现“忽略”、“系统指令”、“DAN”等关键词。

    - 滥用检测：同一用户短时间内 Token 消耗异常飙升，或者大量重复相同 Prompt。

    - 数据泄露检测：检查响应中是否包含邮箱、电话等 PII 模式。

    - 模型拒绝率：如果模型突然频繁返回“我无法回答”，可能遇到了攻击。

    - 解决：在 System Prompt 中增加免责声明，明确告知用户信息仅供参考，不能替代医生。并增加规则：如果用户询问“我该吃什么药”，模型必须拒绝并建议就医。同时接入了 OpenAI Moderation API 作为输入输出防线。

    - 解决：在 Prompt 中加入了公平雇佣的指导原则，并用关键字检测输出内容，一旦命中歧视性词汇，自动替换为中性词，并告警。后期使用 RLHF 对齐的模型也有效减少了这类问题。

    - 用户输入是否经过脱敏处理？（PII、特殊字符）

    - 是否对用户输入和 LLM 输出进行了内容安全审核？

    - 输出是否包含代码？若有，是否安全处理（沙箱、转义）？

    - 是否防范了 Prompt 注入（直接和间接）？是否有角色隔离和输入清洗？

    - Agent 工具是否遵循最小权限原则？是否有沙箱？

    - 向量数据库是否实现了租户/用户数据隔离？

    - 对话记忆是否隔离？用户是否能访问他人数据？

    - 系统提示词是否安全，不会泄露？

    - 是否遵守 GDPR / 个人信息保护法等法规？是否有用户同意和删除机制？

    - 数据存储位置是否符合要求？与 LLM 提供商是否签署 DPA？

    - 应用是否包含免责声明？是否对生成内容进行了 AI 标识？

    - 是否记录了所有 LLM 调用的审计日志？

    - 是否建立了异常检测规则和告警？（注入、滥用、数据泄露）

    - 是否定期审查日志和生成报告？

    - 所有第三方库是否定期更新，修复安全漏洞？

    - 是否配置了速率限制和自动熔断，防止资源耗尽？

    - 是否对敏感配置（API Key）进行了安全管理（环境变量、密钥管理服务）？

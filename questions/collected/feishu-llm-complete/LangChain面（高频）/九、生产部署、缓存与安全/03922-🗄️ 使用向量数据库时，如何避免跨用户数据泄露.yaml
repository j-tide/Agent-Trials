content:
  prompt: "\U0001F5C4️ 使用向量数据库时，如何避免跨用户数据泄露？"
answer:
  mode: rubric
  reference_answer: |-
    多租户环境中，用户的数据必须严格隔离。

    - 物理隔离：为每个租户创建独立的向量数据库实例或 Collection（如 Chroma 的 collection_name 带上 tenant_id）。这最彻底，但开销稍大。

    - 逻辑隔离：所有数据存入同一个 Collection，但每条记录的 metadata 中包含 user_id 或 tenant_id。在检索时，强制在 search_kwargs 中加入 filter={"user_id": current_user_id}。关键是这个过滤条件必须由服务端根据认证信息自动添加，绝不能信任客户端传递的 user_id。

    - 使用 SelfQueryRetriever 的加强：确保 SelfQueryRetriever 生成的过滤条件不会绕过服务端注入的强制过滤。最好自己包装 Retriever，在 get_relevant_documents 中硬性叠加过滤条件。

    - 权限校验：在将检索结果传给 LLM 前，可再次检查每个文档的元数据，确保与当前用户匹配。

    案例：我们早期的一个应用只依赖客户端传来的 user_id 过滤，结果被用户篡改请求头访问了其他用户的文档。修复后，所有过滤条件都在服务端根据 JWT Token 自动附加，客户端无法干预。


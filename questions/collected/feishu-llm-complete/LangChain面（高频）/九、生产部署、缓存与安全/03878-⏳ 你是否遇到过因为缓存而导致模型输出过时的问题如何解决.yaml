content:
  prompt: "⏳ 你是否遇到过因为缓存而导致模型输出过时的问题？如何解决？"
answer:
  mode: rubric
  reference_answer: |-
    遇到过。典型场景是：系统 Prompt 中包含“当前日期”或“最新新闻”，这些信息每天变化，但由于 Prompt 的主体部分（问题）未变，缓存一直命中，导致用户连续几天看到过时的回复。

    解决方案：

    - 为时效性强的 Prompt 设置短 TTL：例如新闻类查询缓存 10 分钟，天气缓存 1 小时。

    - 在 Prompt 中显式加入时间戳或唯一标识：强迫缓存 Key 变化。比如在 System Prompt 中加入 {current_date} 变量，每次请求都会变化，自然不会命中旧缓存。

    - 标记不可缓存：对于必须实时生成的查询，通过自定义缓存逻辑，匹配到某些关键词（如“今天”、“最新”）时跳过缓存。

    - 使用语义缓存时严格设置相似度阈值：避免因为微小差异而命中不准确的旧缓存。

    - 事件驱动缓存失效：当新闻源或数据库更新时，通过消息队列通知缓存服务清除相关的 Key。

    - 分层缓存 + 主动刷新：对于知识库类型，设置较长的 TTL，但后台定期刷新热点 Key。

    实践：我们开发的财务助手有一个“今日大盘”功能，用户输入“今天大盘怎么样”，最初总是返回昨天的结果。后来我们在 Prompt 中加入了 datetime.now().strftime("%Y-%m-%d")，并且将缓存 TTL 设为 5 分钟，问题解决。

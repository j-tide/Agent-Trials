content:
  prompt: "\U0001F310 你是否使用过 LiteLLM 等代理来统一管理多个 LLM 的成本和限速？如何与 LangChain 集成？"
answer:
  mode: rubric
  reference_answer: |-
    是的，LiteLLM是一个优秀的LLM代理，它提供统一的接口来管理多个LLM提供商（OpenAI、Anthropic、Cohere、Azure等），并集成了成本追踪、速率限制、负载均衡、模型降级等强大功能。

    与LangChain集成极为简单：LiteLLM实现了OpenAI兼容的API，你只需将LangChain的 ChatOpenAI 的 base_url 指向LiteLLM服务器，并提供虚拟的API Key即可。

    ```python
    from langchain_openai import ChatOpenAI

    llm = ChatOpenAI(
        model="gpt-4",  # 虚拟模型名，或直接用实际模型
        api_key="sk-your-liteLLM-key",
        base_url="http://liteLLM-host:4000"
    )
    ```

    在 LiteLLM 的配置中，你可以定义多个模型、各自的速率限制、成本系数、降级策略等。例如：

    ```yaml
    model_list:
      - model_name: gpt-4
        litellm_params:
          model: openai/gpt-4
          api_key: os.environ/OPENAI_API_KEY
        tpm: 100000
        rpm: 1000
      - model_name: gpt-3.5-turbo
        litellm_params:
          model: openai/gpt-3.5-turbo
          api_key: os.environ/OPENAI_API_KEY
    ```

    LiteLLM会自动处理请求路由、速率限制，并在达到限制时返回429，LangChain侧再配合重试即可。

    成本统一管理：LiteLLM内置了详细的日志和成本计算，可以通过其/metrics暴露Prometheus指标，或用/spend/logs查询每个API Key的费用。这样一来，LangChain应用无需自己维护复杂的计费逻辑，只需将不同用户或租户映射为不同的LiteLLM API Key即可。

    独特优势：

    - 多模型负载均衡与Fallback：当一个模型达到速率限制或不可用时，自动切换到备用模型，保证高可用。

    - 动态配置：无需重启LangChain应用，即可调整模型配置、限流策略。

    - 细粒度访问控制：可以为不同LangChain实例或租户分配不同权限。

    我们在一个多租户SaaS产品中，使用LiteLLM作为统一LLM网关，所有LangChain服务都通过它调用模型。上线后，模型切换、成本统计、限流熔断全部在LiteLLM层完成，业务代码非常干净，运维效率大幅提升。

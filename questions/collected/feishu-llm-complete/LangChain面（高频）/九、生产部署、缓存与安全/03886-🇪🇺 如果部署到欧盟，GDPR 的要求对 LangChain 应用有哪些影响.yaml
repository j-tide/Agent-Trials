content:
  prompt: "\U0001F1EA\U0001F1FA 如果部署到欧盟，GDPR 的要求对 LangChain 应用有哪些影响？"
answer:
  mode: rubric
  reference_answer: |-
    GDPR（通用数据保护条例）对数据处理有严格要求，涉及 LangChain 应用的方面：

    - 数据处理合法性：收集用户数据（包括对话内容）必须有合法依据（如用户同意、合同必要）。在应用中需明确告知数据用途，并获取用户同意。

    - 数据最小化：只收集必要的用户输入。对 Prompt 进行脱敏，避免将个人身份信息（PII）发送给 LLM。如果必须使用，需进行匿名化处理。

    - 数据存储位置：使用符合 GDPR 的 LLM API（如 OpenAI 提供数据保护协议，可选择欧盟服务器处理）。自建模型则数据存储在欧盟境内的服务器上。

    - 数据主体权利：提供用户数据导出和删除功能。对话历史应支持用户自主删除，并在后台彻底清除相关日志和向量数据库中的记录。LangChain 的 Memory 需要支持清除指定会话。

    - 数据保护影响评估 (DPIA)：如果应用涉及大规模处理敏感数据或自动化决策，需要开展 DPIA。

    - 供应商管理：与 LLM 提供商（如 OpenAI）签署数据处理协议 (DPA)，确保他们不会将你的数据用于训练。

    - 日志安全：审计日志中不应记录用户 PII，或进行加密和访问控制。

    实践：我们在为欧洲客户部署时，将 LLM 调用全部切换至 Azure OpenAI（支持欧盟地区），并启用了 Azure 的合规保证。在应用中加入了隐私声明同意弹窗，同时开发了“删除我的数据”API，一键清除用户的所有对话和文档。


content:
  prompt: "\U0001F4DC 你是否在使用 LangChain 应用时遇到过内容安全合规问题？如何解决的？"
answer:
  mode: rubric
  reference_answer: |-
    遇到过，主要是在生成的内容中出现了不准确的医疗建议和带有偏见表述。

    - 问题一：一个健康咨询助手，根据用户症状给出了具体的用药建议，这属于医疗建议，存在法律风险。

    - 问题二：一个招聘文案生成工具，生成的内容中出现了“只招35岁以下”、“男性优先”等歧视性表述。

    - 合规遵循：遵守所在地法规，如中国的《生成式人工智能服务管理暂行办法》，要求进行算法备案，并在输出中标识 AI 生成。我们在所有回复末尾加上了“内容由AI生成，仅供参考”。

    核心手段：定义清晰的内容政策 → 融入 Prompt 设计 → 实施实时检测（回调 + 独立审核服务） → 人工抽检反馈 → 迭代优化。


content:
  prompt: "✍️ 你如何实现一个“免责声明”自动追加到所有 LLM 回复的末尾？"
answer:
  mode: rubric
  reference_answer: |-
    最简单可靠的方式是后处理追加，而不是依赖 LLM 自己生成。

    - 方式一：使用 RunnableLambda 后处理（推荐）

    ```python
    def append_disclaimer(text: str) -> str:
        return text + "\n\n---\n*本回复由AI生成，仅供参考，不构成任何专业建议。*"

    chain = prompt | llm | StrOutputParser() | RunnableLambda(append_disclaimer)
    ```

    这样无论 LLM 输出什么，末尾都会强制追加声明。对流式输出也适用，可以在流结束后添加。

    - 方式二：在 System Prompt 中要求 LLM 自行添加
    在系统指令中加入：“在每次回复的末尾，请加上‘...’”。但 LLM 可能忘记，且不适用于所有情况。

    - 方式三：前端添加
    在展示层统一追加，后端不做处理。优点是后端无感，缺点是如果 API 被直接调用，第三方可能漏掉声明。通常后端追加更稳妥。

    注意：免责声明应根据应用场景量身定制，必要时咨询法务。如果应用生成医疗建议，免责声明必须显著且明确。


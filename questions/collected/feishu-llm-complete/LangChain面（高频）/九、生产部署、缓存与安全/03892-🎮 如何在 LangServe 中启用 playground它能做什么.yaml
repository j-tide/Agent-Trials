content:
  prompt: "\U0001F3AE 如何在 LangServe 中启用 playground？它能做什么？"
answer:
  mode: rubric
  reference_answer: |-
    启用 playground 非常简单，只需在 add_routes 中设置 playground=True：

    ```python
    add_routes(app, chain, path="/chat", playground=True)
    ```

    然后访问 http://localhost:8000/chat/playground/ 即可看到一个交互式 Web 界面。Playground 默认提供一个类似聊天窗口的布局，但它的能力远超一个简单的聊天框。

    Playground 能做什么？

    - 实时测试链：开发者可以在浏览器中直接输入测试数据，立即查看链的输出，而无需编写任何前端代码。这是调试链逻辑最快捷的方式。

    - 查看流式输出：如果链支持流式，Playground 会自动以打字机效果展示生成的 token，让你直观感受流式响应的效果。

    - 修改运行配置：可以在界面中动态设置 config 参数，例如传入 metadata、tags、或者调整模型参数（如 temperature），并观察不同配置下的输出变化。

    - 查看中间步骤：如果你的链包含多个步骤（例如 Agent 的中间推理），Playground 可以展示 stream_log 的输出，让你清晰地看到每一步的输入输出，这对于调试复杂的多步链非常有帮助。

    - 查看 API 文档：Playground 页面通常还集成了 Swagger UI 的链接，方便直接跳转到 /docs 查看详细的 API 定义。

    - 即时的反馈循环：对于非技术人员（如产品经理），Playground 提供了一个无代码环境来体验 LLM 功能，有助于需求对齐和早期验证。

    注意事项：Playground 默认是开发工具，不建议在生产环境暴露（除非有适当的安全措施），因为它可以执行任意链调用，可能消耗大量 API 额度。在安全方面，你可以通过 FastAPI 的依赖注入或中间件为 Playground 添加认证，确保只有授权用户能访问。


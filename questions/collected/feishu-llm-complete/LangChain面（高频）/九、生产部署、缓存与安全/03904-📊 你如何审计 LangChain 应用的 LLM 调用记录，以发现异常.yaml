content:
  prompt: "\U0001F4CA 你如何审计 LangChain 应用的 LLM 调用记录，以发现异常？"
answer:
  mode: rubric
  reference_answer: |-
    审计是发现安全事件和成本异常的眼睛。

    - 记录什么：每次 LLM 调用的时间戳、用户 ID、会话 ID、请求的 Prompt 摘要、响应摘要、Token 数、模型名称、延迟、是否命中缓存、是否报错。通过自定义回调处理器，将这些信息以结构化 JSON 写入日志系统（如 ELK）或数据库。

    - 异常检测规则：

    - 告警与自动响应：将异常事件接入告警系统（如钉钉、PagerDuty）。对于高风险异常（如疑似 Prompt 注入），可临时禁用该用户或 API Key。

    - 定期生成审计报告：每周统计最活跃用户、最消耗成本的 Prompt、错误率趋势等，与安全团队分享。

    实践：我们搭建了基于 ELK 的审计管道，回调处理器异步发送日志到 Kafka，再由 Logstash 写入 Elasticsearch。在 Kibana 中制作了安全审计看板，可以实时监控异常，并设置了几条 Watcher 告警。上个月，我们通过异常检测发现了一个内部测试脚本陷入了死循环，及时阻止了几千美元的浪费。


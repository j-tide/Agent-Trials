content:
  prompt: "\U0001F511 缓存的 key 是怎么生成的？默认策略是什么？"
answer:
  mode: rubric
  reference_answer: |-
    默认情况下，LangChain 使用 Prompt 字符串的哈希值 作为缓存的 key。具体策略是：

    - 将传入的 Prompt（messages 或字符串）标准化为字符串表示。

    - 结合 LLM 的 model_name（或标识）和 Prompt 字符串，计算 SHA256 哈希。

    - 这个哈希值作为 Redis / 内存字典的 Key，对应的 Value 是序列化后的 LLMResult（包含生成文本、token 使用量等）。

    默认 Key 生成源码逻辑（简化）：

    ```python
    def _key(self, prompt: str, llm_string: str) -> str:
        return hashlib.sha256(f"{prompt}:{llm_string}".encode()).hexdigest()
    ```

    这里的 llm_string 是一个能唯一标识模型和其关键参数的字符串（包含模型名、temperature、max_tokens 等），由 LLM._get_identifying_params() 生成。这意味着，只有当 Prompt 和模型参数完全一致时，缓存才会命中。如果 temperature 不同，llm_string 就不同，Key 也不同，因此不会命中。这正是问题 4 的答案。

    局限性：默认哈希策略只支持精确匹配，无法处理同义改写或微小差异。此时需要使用 RedisSemanticCache 或 GPTCache 这类支持语义匹配的缓存。


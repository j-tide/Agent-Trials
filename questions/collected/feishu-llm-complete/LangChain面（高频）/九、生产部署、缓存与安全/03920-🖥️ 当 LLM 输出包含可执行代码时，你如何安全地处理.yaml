content:
  prompt: "\U0001F5A5️ 当 LLM 输出包含可执行代码时，你如何安全地处理？"
answer:
  mode: rubric
  reference_answer: |-
    LLM 输出代码是常见场景（如代码助手），但直接在浏览器或后端执行会带来 XSS、命令注入等风险。

    多层防御：

    - 输出清洗：对 LLM 返回的文本进行 HTML 实体转义，避免浏览器将其渲染为可执行脚本。使用 bleach 或 markupsafe 库。

    - 前端安全渲染：如果必须在页面展示代码，使用 <pre><code> 标签，并启用 Content Security Policy (CSP) 禁止内联脚本。绝不要用 innerHTML 直接插入 LLM 输出。

    - 沙箱执行：若业务需要执行代码（如在线 Python 环境），务必在隔离的 Docker 容器或 WebAssembly 沙箱中运行，严格限制网络、文件系统、CPU 和内存。使用 exec 或 eval 是绝对禁止的。

    - 代码审查与静态分析：在执行前，用 Bandit、ESLint 等工具扫描代码，检查危险模式（如 os.system）。

    - 用户确认：对不可见的代码（如自动生成的脚本），可以先展示给用户，经确认后再执行。

    在 LangChain 中的应用：我们有一个自动生成 SQL 并执行查询的工具。生成的 SQL 会先进行语法解析（用 sqlparse），检查是否包含 DROP, DELETE 等危险操作，并在只读数据库账户上执行。执行结果返回前，还会检查是否泄漏了敏感字段。


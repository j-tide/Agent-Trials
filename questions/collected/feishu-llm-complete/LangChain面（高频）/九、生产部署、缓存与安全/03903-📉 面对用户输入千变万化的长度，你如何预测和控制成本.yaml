content:
  prompt: "\U0001F4C9 面对用户输入千变万化的长度，你如何预测和控制成本？"
answer:
  mode: rubric
  reference_answer: |-
    用户输入长度不可控，但可以通过预计算和运行时限制来预测和控制成本。

    - 预计算Prompt长度：在调用LLM前，用tokenizer（如tiktoken）快速计算Prompt的Token数。这几乎是零成本，可实时完成。

    - 预估生成长度：生成Token数通常难以精确预测，但可以根据任务类型粗略估计。例如，摘要任务可设定生成长度为输入长度的30%；翻译任务设为等长；开放性问答可设定上限。

    - 动态调整max_tokens：根据用户套餐或系统负载，动态设置模型API的 max_tokens 参数。例如，普通用户限制输出不超过200 Token，VIP用户不超过1000 Token。这样即使Prompt很长，生成部分成本依然可控。

    - 分层处理：对于特别长的输入，先由轻量模型（如GPT-3.5）进行压缩或提炼，再将精简后的内容交给强模型处理。或使用Map-Reduce链分块处理，每块限制Token数，避免一次性传入超大上下文。

    - 监控与反馈：在应用中显示预估成本或已消耗额度，让用户自行调整输入长度。我们在一个翻译服务中加入了实时Token计数，当用户输入超长文本时，前端会提示“当前输入将消耗XX Token，建议精简”，有效降低了长尾请求的平均长度。

    通过这些方法，成本不仅可控，而且是可预见的，使商业模式健康运转。

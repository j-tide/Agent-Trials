content:
  prompt: "✂️ 有没有办法在 Prompt 中动态控制生成内容的长度以降低成本？"
answer:
  mode: rubric
  reference_answer: |-
    有，而且是非常有效的成本控制手段。生成 Token 的费用通常远高于 Prompt Token，因此控制输出长度能直接省钱。

    方式一：在 Prompt 中添加显式指令

    这是最简单直接的方法。你可以要求 LLM “用不超过 50 个字回答”、“用一句话总结”、“给出要点列表”等。然而，LLM 并不总是严格遵守字数限制，尤其对于中文。

    方式二：利用模型 API 的 max_tokens 参数
    几乎所有 LLM 都支持 max_tokens，它强制限制生成的最大 Token 数。这是最可靠的长度控制。你可以根据用户套餐或当前系统负载动态设置这个值。

    ```python
    llm = ChatOpenAI(model="gpt-4", max_tokens=100)  # 强制限制
    ```

    方式三：根据预算动态调整 max_tokens
    在应用层，根据用户余额或系统预算，动态设置 max_tokens。例如，免费用户 max_tokens=100，付费用户 max_tokens=2000。这可以通过 RunnableLambda 在调用 LLM 前修改 config 实现，或者创建多个不同 max_tokens 的 LLM 实例，通过路由选择。

    方式四：使用 Output Parser 提前终止

    如果输出是结构化 JSON，你可以在流式输出时解析 JSON，一旦发现核心字段已经完整，即可主动中止生成（通过抛出特殊异常或关闭流）。这种方法更激进，但对非结构化文本效果有限。

    方式五：微调模型或使用专用小模型

    对于某些特定任务（如分类、实体抽取），可以用微调的小模型替代通用大模型，既降低成本又提升速度。

    综合运用：我们有一个文章总结功能，最初每次生成约 500 token。后来我们将 Prompt 改为“用 3 个要点总结，每个要点不超过 20 字”，同时设置 max_tokens=150，成本降至原来的 1/5，但信息量并未明显减少。

    注意：过度限制长度可能导致回答不完整或质量下降。需要在成本和用户体验间权衡。可以通过 A/B 测试确定最佳长度阈值。

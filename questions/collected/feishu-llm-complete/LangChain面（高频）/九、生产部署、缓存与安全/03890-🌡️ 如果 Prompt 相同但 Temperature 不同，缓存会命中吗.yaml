content:
  prompt: "\U0001F321️ 如果 Prompt 相同但 Temperature 不同，缓存会命中吗？"
answer:
  mode: rubric
  reference_answer: |-
    不会。 如前所述，LangChain 在生成缓存 Key 时，不仅使用了 Prompt 字符串，还拼接了 llm_string。llm_string 中包含了模型的关键参数，其中就有 temperature。因此，Prompt 相同但 temperature 不同，生成的两个 Key 不同，缓存无法命中。这是合理的，因为 temperature 直接影响输出的随机性，必须视为不同的调用。

    如果你想忽略 temperature 差异，可以自定义缓存 Key 生成逻辑。你可以继承 RedisCache 并重写 _key 方法，或者使用 GPTCache 等支持更灵活匹配策略的缓存。但通常不建议这么做，因为缓存的初衷就是加速“完全相同的请求”，改变参数理应生成新结果。


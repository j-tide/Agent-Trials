content:
  prompt: "\U0001F680 使用 GPTCache 时，它和 LangChain 的集成是如何实现的？有什么独特优势？"
answer:
  mode: rubric
  reference_answer: |-
    集成方式：GPTCache 提供了 LangChainCache 适配器，该适配器实现了 LangChain 的 BaseCache 接口。初始化 GPTCache 后，通过 set_llm_cache 将其设置为全局缓存即可。

    ```python
    from gptcache import cache
    from gptcache.manager import get_data_manager, CacheBase, VectorBase
    from gptcache.adapter.langchain_models import LangChainCache

    # 配置GPTCache的数据存储和向量存储
    data_manager = get_data_manager(CacheBase("sqlite"), VectorBase("faiss", dimension=...))
    cache.init(data_manager=data_manager, pre_embedding_func=...)
    langchain_cache = LangChainCache()
    set_llm_cache(langchain_cache)
    ```

    独特优势：

    - 多级缓存：支持精确匹配和语义匹配两级。先用精确匹配（Prompt 哈希），未命中则用向量相似度搜索历史查询，返回相似度高于阈值的缓存结果。这极大提高了命中率。

    - 灵活的存储后端：缓存数据可以存 SQLite、MySQL、PostgreSQL；向量可以存 FAISS、Milvus、Chroma 等。

    - 预加载与预热：可以将高频 Prompt 提前导入缓存，服务启动即可用。

    - 缓存刷新：支持基于时间、计数、LLM 返回内容过滤等策略自动刷新缓存。

    - 详细的监控和统计：内置命中率、延迟等指标。

    - 跨 LLM 共享：GPTCache 是独立的缓存层，可以被多种 LLM 客户端共享，不限于 LangChain。

    使用场景：当你有大量相似但不完全相同的用户查询（如客服、FAQ），GPTCache 的语义匹配能显著提高缓存命中率。我们之前在一个法律咨询系统中，使用 GPTCache + Milvus，将缓存命中率从 30%（精确匹配）提升到 70%，节省了大量 GPT-4 费用。


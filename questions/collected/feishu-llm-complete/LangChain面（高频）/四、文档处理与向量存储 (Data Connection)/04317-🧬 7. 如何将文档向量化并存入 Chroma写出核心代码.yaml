content:
  prompt: "\U0001F9EC 7. 如何将文档向量化并存入 Chroma？写出核心代码。"
answer:
  mode: rubric
  reference_answer: |-
    ```python
    from langchain_community.document_loaders import TextLoader
    from langchain.text_splitter import RecursiveCharacterTextSplitter
    from langchain_openai import OpenAIEmbeddings
    from langchain_community.vectorstores import Chroma

    # 1. 加载文档
    loader = TextLoader("knowledge.txt", encoding="utf-8")
    documents = loader.load()

    # 2. 分割文档
    splitter = RecursiveCharacterTextSplitter(
        chunk_size=500,
        chunk_overlap=50,
        separators=["\n\n", "\n", "。", "，", " ", ""],
    )
    chunks = splitter.split_documents(documents)

    # 3. 初始化 Embedding 模型
    embeddings = OpenAIEmbeddings(model="text-embedding-3-small")

    # 4. 向量化并存入 Chroma（自动完成 embedding + 存储）
    vectorstore = Chroma.from_documents(
        documents=chunks,
        embedding=embeddings,
        persist_directory="./chroma_db",  # 持久化目录，不指定则为内存模式
        collection_name="my_knowledge_base",
    )

    print(f"已存入 {vectorstore._collection.count()} 个文档块")
    ```

    后续查询：

    ```python
    # 相似度搜索
    results = vectorstore.similarity_search("什么是 RAG？", k=3)
    for doc in results:
        print(doc.page_content[:100], doc.metadata)

    # 带分数搜索
    results_with_scores = vectorstore.similarity_search_with_score("什么是 RAG？", k=3)
    for doc, score in results_with_scores:
        print(f"分数: {score:.4f} | {doc.page_content[:80]}")
    ```

    关键点说明：

    - Chroma.from_documents 内部会调用 embeddings.embed_documents 对所有 chunks 做向量化，然后存入 Chroma 的集合中。

    - 如果已有向量库，想继续添加文档，可以复用已持久化的实例：vectorstore = Chroma(persist_directory="./chroma_db", embedding_function=embeddings)，然后用 add_documents 追加。

    - Chroma 的 collection_name 很重要，可以在同一数据库里隔离不同的知识库。

    - persist_directory 指定后，Chroma 会在磁盘上创建持久化文件，服务重启后数据不丢失。


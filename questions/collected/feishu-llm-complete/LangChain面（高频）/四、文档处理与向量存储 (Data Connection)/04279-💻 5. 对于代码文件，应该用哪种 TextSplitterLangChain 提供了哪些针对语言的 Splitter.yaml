content:
  prompt: "\U0001F4BB 5. 对于代码文件，应该用哪种 TextSplitter？LangChain 提供了哪些针对语言的 Splitter？"
answer:
  mode: rubric
  reference_answer: |-
    代码和自然语言最大的不同在于：代码的缩进、括号、关键字本身就有很强的结构信号，随意按换行或空格切分极易破坏语法结构，导致模型难以理解。因此 LangChain 提供了一系列语言感知（language-aware）的分割器，它们继承自 RecursiveCharacterTextSplitter，但使用的分隔符列表是针对每种编程语言精心设计的，能优先在函数定义、类定义、注释等“高语义”边界处切分。

    LangChain 提供的语言专用 Splitter（都在 langchain.text_splitter 下）：

    [嵌入表格未展开]

    使用示例：

    ```python
    from langchain.text_splitter import PythonCodeTextSplitter

    splitter = PythonCodeTextSplitter(chunk_size=500, chunk_overlap=50)
    docs = splitter.create_documents([code_text])
    ```

    底层原理：
    它们本质上是 RecursiveCharacterTextSplitter 的子类，只不过预定义了适合该语言的分隔符优先级。比如 Python 的分隔符大致是：

    ```python
    [
        "\nclass ", "\ndef ", "\n\tdef ",
        "\n\n", "\n", " ", ""
    ]
    ```

    它会在 class 和 def 关键字前切分，尽量不把函数体或类定义拦腰截断。同样，Markdown 分割器会优先按标题（#、##）分割。

    我的使用建议：

    - 对于代码检索（如内部代码库问答），务必使用对应的语言分割器。效果比通用分割器好很多。

    - 如果语言没有现成的 Splitter，可以参考已有的，自定义 separators 列表，比如加入 \nfunction、\nprocedure 等关键词。

    - 代码文档（如 Markdown 写的教程）用 MarkdownTextSplitter 或 RecursiveCharacterTextSplitter + 标题级分隔符。

    - 注意代码块可能包含大量空格和缩进，chunk_size 用 token 计数更准确，避免因为缩进导致 token 超限。


content:
  prompt: "\U0001F5C2️ 11. 如果向量库中已有大量数据，如何进行增量更新而不重建整个索引？"
answer:
  mode: rubric
  reference_answer: |-
    增量更新是维持一个健康知识库的基本操作。你不可能因为新增了一份文档就重来一遍数十万向量的全量嵌入，那时间和金钱成本都难以接受。常见的增量策略有：

    ① 利用向量库原生的 upsert 机制
    多数向量数据库都支持 add_documents 或 add_texts 方法，背后实际是插入或更新（upsert）操作。如果你为每个 Document 预先分配了唯一的 id（比如用 UUID 或 {source}#{chunk_index}），再次添加相同 ID 的文档时会覆盖旧向量。

    ```python
    # 新文档或修改后的文档
    new_chunks = [...]

    # 直接添加，Chroma/Pinecone 等会按 ID 自动 upsert
    vectorstore.add_documents(new_chunks, ids=[doc.metadata["id"] for doc in new_chunks])
    ```

    ② 使用 LangChain 的 Indexing API + RecordManager
    这是 LangChain 推荐的可用于生产环境的增量索引方案。它由一个 RecordManager（记录文档的 hash 和写入时间）配合向量库工作：

    - 对每个 Document 计算内容哈希。

    - 与 RecordManager 中的历史记录对比，将文档分为三类：新增 (new)、修改 (changed)、删除 (orphaned)。

    - 对新增和修改的文档调用 add_documents（upsert），对删除的文档调用 delete。

    ```python
    from langchain.indexes import SQLRecordManager, index

    record_manager = SQLRecordManager(namespace="my_kb", db_url="sqlite:///record_manager.db")
    record_manager.create_schema()

    # 增量索引函数
    index(
        docs_source=iter(new_documents),  # 可以是生成器，流式处理
        record_manager=record_manager,
        vector_store=vectorstore,
        cleanup="incremental",  # 增量模式，只处理变化部分
        source_id_key="source",  # 用于标识同一来源文档的 metadata key
    )
    ```

    这样做的好处是完全自动化，不会重复嵌入，也支持清理已删除的源文档。

    ③ 分区索引 + 时间戳/版本

    对于按时间累积的文档（如日志、新闻），可以按时间段创建分区（例如 Pinecone 的 namespace 或 Milvus 的 partition），定期为新时间段建立索引，旧数据保持不变。检索时根据问题的时间范围选择搜索分区，或跨分区合并结果。

    ④ 基于消息队列的事件驱动架构

    在实时性要求高的场景，文档的上传、修改、删除操作通过 Kafka/Redis Stream 发布事件，下游消费者解析事件、加载文档、分割并增量写入向量库。这样就把增量更新完全嵌入了业务工作流，成为一项持续服务。

    我的建议：

    - 原型期用 add_documents 直接覆盖就行，简单有效。

    - 进入生产后，强烈建议引入 Indexing API + RecordManager，它不仅处理增量，还自动解决数据源删除后向量库中对应文档的清理问题。我踩过的坑：手动管理删除逻辑容易遗漏，最终向量库里一堆“幽灵文档”，影响检索质量。


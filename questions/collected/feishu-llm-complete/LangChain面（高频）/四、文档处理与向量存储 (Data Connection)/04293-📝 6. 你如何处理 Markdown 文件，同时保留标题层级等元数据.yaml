content:
  prompt: "\U0001F4DD 6. 你如何处理 Markdown 文件，同时保留标题层级等元数据？"
answer:
  mode: rubric
  reference_answer: |-
    UnstructuredMarkdownLoader 就是为这个场景设计的。它不仅能解析 Markdown，还能识别标题、列表、代码块等元素，并把标题作为元数据保留下来。

    ```python
    from langchain_community.document_loaders import UnstructuredMarkdownLoader

    loader = UnstructuredMarkdownLoader("doc.md", mode="elements")
    docs = loader.load()

    for doc in docs:
        print(doc.page_content)
        print("元数据:", doc.metadata)
        # 输出中可能包含：
        # 'category': 'Title', 'category_depth': 1 表示一级标题
    ```

    在 mode="elements" 模式下，每个文档元素（如一段文字、一个标题）会成为一个独立的 Document 对象。其 metadata 中会有：

    - category: 元素类型，如 Title, NarrativeText, ListItem, CodeBlock 等。

    - category_depth: 标题层级（仅当 category 为 Title 时出现），一级标题深度为 1，二级为 2，以此类推。

    - source: 文件路径。

    - languages: 语言检测结果（可配置）。

    如果只想要保留标题层级但对文档进行分割，可以在后续使用 MarkdownHeaderTextSplitter 这种分割器，它能够根据标题层级切割文档，并把标题路径（如 # 标题1 > ## 标题2）注入到每个子文档的 metadata 中，这样既保证了上下文，又方便检索。


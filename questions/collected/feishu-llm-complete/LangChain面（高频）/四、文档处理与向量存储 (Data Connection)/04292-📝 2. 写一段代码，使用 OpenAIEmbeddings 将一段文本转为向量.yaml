content:
  prompt: "\U0001F4DD 2. 写一段代码，使用 OpenAIEmbeddings 将一段文本转为向量。"
answer:
  mode: rubric
  reference_answer: |-
    ```python
    import os
    from langchain_openai import OpenAIEmbeddings

    # 确保已设置环境变量 OPENAI_API_KEY，或直接传入
    # os.environ["OPENAI_API_KEY"] = "sk-..."

    # 初始化嵌入模型
    embeddings = OpenAIEmbeddings(
        model="text-embedding-3-small",   # 性价比高，512维
        # model="text-embedding-3-large", # 更精准，3072维
        dimensions=512,  # 可选，small 模型默认 512，可指定更小维度节省存储
    )

    # 单条查询向量化
    text = "人工智能正在重塑软件工程的未来"
    query_vector = embeddings.embed_query(text)
    print(f"向量维度: {len(query_vector)}")
    print(f"前5个值: {query_vector[:5]}")

    # 批量文档向量化（索引时使用）
    documents = [
        "LangChain 是一个强大的 LLM 应用框架",
        "向量数据库支持高效的语义搜索",
        "嵌入模型将文本映射到高维空间",
    ]
    doc_vectors = embeddings.embed_documents(documents)
    print(f"文档数量: {len(doc_vectors)}，每个向量维度: {len(doc_vectors[0])}")
    ```

    实际使用中的几点注意：

    - embed_documents 内部会自动分批处理，OpenAIEmbeddings 默认 chunk_size=1000，避免一次性发送太多文本触发 API 限制。

    - 如果遇到速率限制（RateLimitError），可以在初始化时设置 max_retries 和 request_timeout，或搭配 LangChain 的 tenacity 重试机制。

    - 对于超长文本，需要自行截断或使用文本分割器预处理，因为 OpenAI 的 embedding 模型有最大输入 token 限制（如 8191 token）。


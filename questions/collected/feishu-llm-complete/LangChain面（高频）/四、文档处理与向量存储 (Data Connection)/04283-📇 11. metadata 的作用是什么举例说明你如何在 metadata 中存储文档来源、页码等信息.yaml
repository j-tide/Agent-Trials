content:
  prompt: "\U0001F4C7 11. metadata 的作用是什么？举例说明你如何在 metadata 中存储文档来源、页码等信息。"
answer:
  mode: rubric
  reference_answer: |-
    metadata 是 Document 对象的第二个核心属性（一个普通字典），它的存在让文档从“一坨文本”变成了“带身份证的内容块”。说三个最核心的作用：

    ① 溯源 (Provenance)
    当 LLM 根据检索到的文档生成答案时，我们需要知道这句话出自哪个文件的第几页。metadata 中的 source、page、chunk_id 就是用于这种“引证”的。例如在 RAG 应用里，前端展示的“参考来源”链接，全靠 metadata。

    ② 过滤与路由 (Filtering & Routing)

    向量数据库（如 Pinecone、Weaviate、Milvus）可以利用 metadata 字段做预过滤，比如“只检索来自 2024 年财报的片段”、“只召回技术文档”。这样检索效率和精度都能大幅提升。

    ③ 上下文管理

    把文档的作者、创建时间、语言、版本号等信息带在身上，后续处理（如按时间排序、去重、聚合）就很方便。

    存储示例：

    ```python
    from langchain_core.documents import Document

    doc = Document(
        page_content="人工智能在医疗领域的应用日益广泛...",
        metadata={
            "source": "reports/medical_ai_2025.pdf",
            "page": 3,
            "author": "张三",
            "created_date": "2025-03-15",
            "language": "zh",
            "category": "研究报告"
        }
    )
    ```

    这个 document 被分割后，子文档也会继承父文档的 metadata（或者由分割器增添 start_index 等字段）。我在构建知识库时会设计一套 metadata 规范，比如要求所有文档都必须有 source 和 doc_id，然后用 Pydantic 模型做校验，防止错传。


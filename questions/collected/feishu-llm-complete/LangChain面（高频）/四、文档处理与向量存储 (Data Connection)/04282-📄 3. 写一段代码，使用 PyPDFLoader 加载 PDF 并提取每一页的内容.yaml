content:
  prompt: "\U0001F4C4 3. 写一段代码，使用 PyPDFLoader 加载 PDF 并提取每一页的内容。"
answer:
  mode: rubric
  reference_answer: |-
    ```python
    from langchain_community.document_loaders import PyPDFLoader

    # 初始化加载器，传入 PDF 文件路径
    loader = PyPDFLoader("example.pdf")

    # 方式一：load() 一次性加载所有页，返回 Document 列表
    documents = loader.load()
    print(f"总页数: {len(documents)}")
    for i, doc in enumerate(documents):
        print(f"--- 第 {i+1} 页 ---")
        print(doc.page_content[:200])  # 预览前200字符
        print(f"元数据: {doc.metadata}")

    # 方式二：lazy_load() 延迟加载，适合大文件
    for doc in loader.lazy_load():
        print(doc.page_content)
    ```

    实战里的一些细节：

    - PyPDFLoader 默认会把每页作为一个独立的 Document，metadata 里会有 {'source': 'example.pdf', 'page': 0}（页码从 0 开始），后续可以方便地根据页码回溯原文。

    - 如果 PDF 是加密的，PyPDFLoader 也支持传入密码：PyPDFLoader("encrypted.pdf", password="1234")。

    - 性能方面，PyPDFLoader 很快，但文本提取质量一般。遇到双栏排版时，它可能把左栏和右栏的文字交错提取，读起来像乱码。对这种 PDF，应换成 UnstructuredPDFLoader 并设置 strategy="hi_res"。


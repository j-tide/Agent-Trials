content:
  prompt: "⚖️ 6. FAISS、Chroma、Pinecone 分别适合什么场景？在单机开发、生产集群部署方面有何差异？"
answer:
  mode: rubric
  reference_answer: |-
    这三种向量库分别代表了三种典型的部署和使用模式，我个人根据项目规模和需求经常切换。

    [嵌入表格未展开]

    我的选择经验：

    - 原型阶段、学习、单机工具 → Chroma。一条命令启动，Pythonic API，几分钟就能跑通 RAG 流程。

    - 需要极致检索速度、无网络环境、或研究对比不同索引算法 → FAISS。我通常在 Colab 或本地 Jupyter 中用它，结合 InMemoryDocstore 实现轻量级 RAG。

    - 正式产品、团队协作、弹性需求 → Pinecone 或 Zilliz Cloud（Milvus 云服务）。我们一个项目上线时，从 Chroma 迁移到 Pinecone，自动扩缩容和监控省去了大量运维成本。

    混合策略：开发时用 Chroma 或 FAISS 快速验证，生产通过环境变量切换到 Pinecone。得益于 LangChain 的 VectorStore 抽象，切换对代码几乎无感。


content:
  prompt: "\U0001F4E6 10. LangChain 的 Document 对象包含哪些主要属性？（page_content, metadata）"
answer:
  mode: rubric
  reference_answer: |-
    Document 是 LangChain 数据流转的基本单元，理解它的属性是入门和排错的关键。

    ```python
    from langchain_core.documents import Document

    doc = Document(
        page_content="这是一段文本内容",
        metadata={"source": "example.txt", "author": "zhangsan", "page": 1},
    )
    ```

    核心属性：

    - page_content: str
    文档的主要内容，也就是将来被向量化、嵌入、输送给 LLM 的文本。默认是空字符串。

    - metadata: Dict[str, Any]
    存储文档的附属信息，如来源（source）、页码、作者、日期、标题等。字典中的值可以是简单类型（str, int, float, bool），也可以是复杂的对象，但为了序列化安全，建议使用基本类型。很多检索器会依赖 metadata 进行过滤，所以结构要规范。

    其他值得注意的属性和方法（源自 Pydantic 基类）：

    - id：可选的唯一标识，在 LangChain 新版本中 Document 支持 id 字段，便于去重和更新。

    - type：字符串，默认为 "Document"，可以用于区分不同类型的文档。

    - model_dump() / json()：序列化成字典或 JSON，便于存储和传输。

    我的一些实践习惯：

    - 始终确保 metadata["source"] 存在且有意义，它是召回后引用原文的最重要依据。

    - 尽量不要把 page_content 的全文复制到 metadata 里，浪费内存和存储。

    - 当用分割器生成小块时，分割器会自动添加 start_index 等 metadata，我会保留它们，用于后续合并溯源。

    - 在把 Document 存入向量库时，有些向量库对 metadata 的过滤有索引要求，我会提前规划哪些元数据字段需要建立过滤索引。

    掌握 Document 的属性，就相当于掌握了 LangChain 数据模型的“通用语言”，所有加载器、分割器、检索器都在围绕它工作。

content:
  prompt: "\U0001F4C4 15. 在分割过程中，如果你还想保留原始文档的页码或段落信息，应该怎么做？"
answer:
  mode: rubric
  reference_answer: "关键在于使用 split_documents 而不是 split_text。split_documents 会克隆原始 Document
    对象的 metadata 到每一个切分出的子块中，这是传递页码、段落、标题等信息的最可靠方式。\n\n步骤示例：\n\n```python\nfrom langchain.document_loaders
    import PyPDFLoader\nfrom langchain.text_splitter import RecursiveCharacterTextSplitter\n\nloader
    = PyPDFLoader(\"report.pdf\")\npages = loader.load()  # 每个 page 的 metadata 包含
    'source' 和 'page'\n\nsplitter = RecursiveCharacterTextSplitter(chunk_size=500,
    chunk_overlap=50)\nchunks = splitter.split_documents(pages)\n\nfor chunk in chunks[:3]:\n
    \   print(chunk.metadata)  \n    # 输出: {'source': 'report.pdf', 'page': 0} 等\n```\n\n页码和
    source 自动继承。如果文档加载时还附加了自定义 metadata（例如作者、日期），也会一并传递。\n\n保留段落信息：\n如果加载时使用了 UnstructuredPDFLoader(mode=\"elements\")，每个元素可能对应一个段落或标题，其
    metadata 包含 category 等字段。分割时这些字段同样会延续。你还可以在加载阶段为每个段落元素手工添加一个自增的 paragraph_id，分割后就能知道子块属于哪个段落。\n\n自定义
    metadata 增强：\n在分割后，可以通过子块的 start_index 等字段反向定位到原始文档中的位置，从而补充更细粒度的位置信息（如列号、行号）。但更简单的方式是：在分块之前，利用
    Document 的 metadata 里存一个 doc_id，然后将原始文档全文和元数据存入一个外部存储（如 docstore 或数据库），分块后的 metadata
    只保留 doc_id 和 chunk_index，需要完整信息时再通过 ID 查询。这种“瘦 metadata + 外部映射”能有效避免向量库 metadata
    膨胀。\n\n---"

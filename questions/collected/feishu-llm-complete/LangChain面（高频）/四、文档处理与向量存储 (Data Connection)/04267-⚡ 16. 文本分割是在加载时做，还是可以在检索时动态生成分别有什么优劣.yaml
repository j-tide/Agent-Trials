content:
  prompt: "⚡ 16. 文本分割是在加载时做，还是可以在检索时动态生成？分别有什么优劣？"
answer:
  mode: rubric
  reference_answer: |-
    这是一个经典的预计算 vs 在线计算的权衡。

    [嵌入表格未展开]

    典型实践是“预分块 + 动态扩展”混合：

    - 在入库时，将文档切成小粒度（如句子级）并生成 embedding 索引。

    - 检索时，快速召回小粒度块，然后使用 ParentDocumentRetriever 或根据 metadata 的位移信息，从原始文档存储中动态扩展出更大的上下文窗口。这样既保持了检索的实时效率，又能根据查询类型动态调整上下文大小（比如简单问答用小窗口，总结任务用大窗口）。

    场景举例：

    - 法律合同库（千万级）：必须预分块。

    - 用户上传的临时文档（几百页）：可以在请求中实时分块，避免存储压力。

    - 聊天机器人：使用滑动窗口动态分块历史对话，不需要预索引。

    我现在的标准架构是：文档上传 → 加载器解析 → 生成“原子块”（句子）+ 父文档索引 → 原子块入库。检索时用原子块匹配，再动态组装父文档片段作为上下文。 这样取两家之长。


content:
  prompt: "\U0001F3E0 3. 如果你需要使用本地 HuggingFace 的 Embedding 模型，怎么配置？"
answer:
  mode: rubric
  reference_answer: |-
    本地模型的优势在于数据不出域、零调用成本、可离线运行，非常适合敏感场景或开发调试。

    最推荐的方式是使用 langchain_huggingface 包中的 HuggingFaceEmbeddings，它封装了 sentence-transformers 库。

    ```python
    from langchain_huggingface import HuggingFaceEmbeddings

    # 基础用法：自动下载并加载模型
    embeddings = HuggingFaceEmbeddings(
        model_name="BAAI/bge-small-zh-v1.5",   # 中文表现优秀，维度 512
        # model_name="sentence-transformers/all-MiniLM-L6-v2",  # 英文常用
        model_kwargs={"device": "cuda"},        # 使用 GPU 加速，没有则用 "cpu"
        encode_kwargs={
            "normalize_embeddings": True,       # 归一化，余弦相似度计算更准确
            "batch_size": 64,                   # 批处理大小，根据显存调整
        },
    )
    ```

    常见调优配置：

    - device: "cuda" 或 "cpu"，如果有多个 GPU，可以指定 "cuda:1"。

    - normalize_embeddings: 强烈建议设为 True，归一化后向量点积等于余弦相似度，且许多向量库（如 FAISS、Chroma）在归一化向量上检索更快。

    - batch_size: 显存大就设大些，能显著加快批量索引速度。

    - model_kwargs: 可以直接传递 torch.float16 等参数降低显存占用。

    高级玩法：手动加载以提高启动速度
    如果你的服务需要反复启动（如 serverless），每次下载模型会很慢。可以先将模型下载到本地目录，然后通过 model_name 指定本地路径：

    ```python
    # 先执行一次，模型会自动缓存到 ~/.cache/huggingface/
    # 或手动 git clone 模型到本地 /models/bge-small
    embeddings = HuggingFaceEmbeddings(
        model_name="/models/bge-small",
        model_kwargs={"device": "cpu"},
    )
    ```

    其他本地方案：

    - OllamaEmbeddings：如果已部署 Ollama，可直接调用其 embedding 接口。

    - LlamaCppEmbeddings：用于量化模型，资源消耗极低。

    踩过的坑：

    - 本地模型的输入长度限制通常为 512 token，超长文本需提前截断或分割。

    - 第一次加载模型会下载几百 MB 的文件，务必确保网络通畅或预先缓存。

    - 多进程环境下（如用 Gunicorn 启动服务）加载模型可能导致内存爆炸，建议在父进程中加载一次，或使用 embedding_model 单例。


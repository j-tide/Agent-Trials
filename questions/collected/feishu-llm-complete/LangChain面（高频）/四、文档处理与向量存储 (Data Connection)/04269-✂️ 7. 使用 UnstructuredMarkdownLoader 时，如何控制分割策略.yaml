content:
  prompt: "✂️ 7. 使用 UnstructuredMarkdownLoader 时，如何控制分割策略？"
answer:
  mode: rubric
  reference_answer: |-
    UnstructuredMarkdownLoader 本身并不直接做语义分割，它只是按 Markdown 元素（段落、标题等）拆分。如果我们需要更大的“块”而不是每个元素独立，需要结合 LangChain 的文本分割器 来控制粒度。但 UnstructuredMarkdownLoader 提供了一些参数来调整元素的聚合行为：

    - mode 参数：

    - strategy 参数：

    - post_processors 参数：可以传入元素后处理函数，比如合并相邻的列表项、删除空元素等。

    真正的分割策略控制是在后处理。加载得到小元素后，我用 RecursiveCharacterTextSplitter 或专门为 Markdown 设计的 MarkdownTextSplitter 进行重组，确保每个 chunk 不超过 token 限制。例如：

    ```python
    from langchain.text_splitter import MarkdownHeaderTextSplitter

    headers_to_split_on = [
        ("#", "Header 1"),
        ("##", "Header 2"),
        ("###", "Header 3"),
    ]
    splitter = MarkdownHeaderTextSplitter(headers_to_split_on=headers_to_split_on)
    # 直接对 Markdown 文本进行分割
    documents = splitter.split_text(markdown_text)
    ```

    这样生成的文档会自动把当前所属的所有标题层级作为 metadata（如 Header 1: 项目介绍, Header 2: 架构设计），这是一种非常有效的结构保持策略。你也可先用 UnstructuredMarkdownLoader 加载为元素，再根据需要合并、分割，完全自定义。


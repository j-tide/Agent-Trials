    我选择的实践经验：除非我处理的文本非常规整（例如数据库导出的一行一条记录），否则一律用 RecursiveCharacterTextSplitter。因为它能在不增加多少复杂度的情况下，明显减少“把一个词拦腰斩断”的惨案，而后者对向量的语义表示伤害很大。


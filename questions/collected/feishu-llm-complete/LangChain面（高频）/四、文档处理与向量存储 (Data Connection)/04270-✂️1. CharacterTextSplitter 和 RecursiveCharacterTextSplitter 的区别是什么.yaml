content:
  prompt: "✂️1. CharacterTextSplitter 和 RecursiveCharacterTextSplitter 的区别是什么？"
answer:
  mode: rubric
  reference_answer: |-
    这两个是 LangChain 最基础也是最常用的文本分割器，理解它们的差异是做好后续检索的第一步。

    CharacterTextSplitter
    它的逻辑非常简单：只使用单一一个分隔符（默认是两个换行 \n\n）来切分文本。它会先按这个分隔符把文本拆成很多小段，然后尝试把这些小段合并成长度不超过 chunk_size 的块。如果合并后仍然有单段长度超过 chunk_size，它就会直接按字符数硬截断。
    特点就是：快，简单，但不够聪明。适合已经分段很好的文本，比如本身就按段落分开的纯文本，或者你明确知道只有一个分隔符的场景。

    RecursiveCharacterTextSplitter
    它是 CharacterTextSplitter 的升级版，最大的区别在于使用了一组分隔符，而不是一个。它会从一个“最粗粒度”的分隔符开始尝试切分，如果切出来的块还是太长，就换一个“更细粒度”的分隔符继续切，层层递归，直到所有的块都不超过 chunk_size，或者连字符都拆开也无法满足时才硬截断。
    可以理解为：CharacterTextSplitter 是一刀切，RecursiveCharacterTextSplitter 是一套组合刀，从大刀换到小刀，最大限度地保持了语义边界。


answer:
  mode: rubric
  reference_answer: |-
    所有向量数据库在 LangChain 中都统一在 VectorStore 这个抽象基类之下（位于 langchain_core.vectorstores）。它定义了向量库所需的最少方法集合，让不同的向量数据库实现能够平滑互换，就像 JDBC 对于关系数据库一样。


    设计要点：

    - VectorStore 是一个抽象类，具体的数据库（Chroma、FAISS、Pinecone 等）只需实现上述方法，用户使用完全相同的 API。

    - 所有方法都支持同步和异步两种版本（如 asimilarity_search），适合异步 Web 服务。

    - add_texts 内部会自动调用 Embeddings.embed_documents，实现从文本到向量的无缝转换，业务代码无需手动调用 embedding。

    - 通过 Retriever 接口 还可以进一步解耦：vectorstore.as_retriever() 返回一个 VectorStoreRetriever，可以设置 search_type（"similarity", "mmr", "similarity_score_threshold"）和 search_kwargs 来灵活控制检索行为。

    这种设计让我们可以在不同阶段轻易替换向量库：开发用 Chroma，生产切到 Pinecone 或自建 Milvus 集群，只需要改一行初始化代码。


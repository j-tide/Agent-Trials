    LangChain 的文档加载器生态极其丰富，几乎覆盖了你能接触到的所有非结构化或半结构化数据源。我这里分享 5 个我在项目里经常接触的，外加它们的适用文件类型和一些实践心得：

    [嵌入表格未展开]

    除了这些，还有 S3FileLoader、GCSFileLoader、NotionDBLoader 等平台专属加载器。实战中我总结了两条原则：

    - 能 Unstructured 就别用基础加载器。Unstructured 系列对版面分析的支持远超 PyPDF 等老派工具，尤其在处理复杂的 PDF、PPT、图片（配合 OCR）时优势明显。

    - 永远在加载后检查 metadata。加载器会自动填充 source、page 等元数据，这些字段后面检索时会非常有用，别让它们悄悄溜走。


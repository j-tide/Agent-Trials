content:
  prompt: "\U0001F4A1 在构建数据密集型应用（如知识库问答）时，你会选 LangChain 还是 LlamaIndex？理由。"
answer:
  mode: rubric
  reference_answer: |-
    我会毫不犹豫地选择LlamaIndex作为核心索引和检索引擎，并辅以LangChain进行业务编排。纯知识库问答场景下，LlamaIndex的专业性远超LangChain。

    理由如下：

    - 索引结构丰富：LlamaIndex提供了VectorStoreIndex、SummaryIndex、TreeIndex、KeywordTableIndex等多种索引类型，能根据数据类型和查询模式选择最优索引。LangChain的索引基本只有向量检索一种。

    - 数据连接器成熟：LlamaIndex内置了上百种数据加载器（LlamaHub），从PDF、Notion、Slack到数据库，开箱即用。LangChain虽然也有文档加载器，但覆盖面和深度不如LlamaIndex。

    - 检索策略精细：LlamaIndex支持递归检索、路由检索、子问题分解等高级检索模式，能自动判断查询类型并选择最佳检索策略。LangChain的检索相对简单，需要手动组装。

    - 响应合成优化：LlamaIndex提供了多种响应合成模式（如compact、refine、tree_summarize），能根据文档数量和长度自动选择最合适的处理方式，LangChain需要手动编写这些逻辑。

    - 数据连接器丰富：如果你的知识库涉及多种数据格式和来源，LlamaIndex的LlamaHub生态能节省大量数据预处理时间。

    何时选LangChain：如果问答系统需要复杂的多轮对话管理、工具调用（如根据用户问题动态查询外部API）、或者需要与其他非检索组件深度集成，LangChain的Agent和Chain编排能力更强。实际上，我倾向于将LlamaIndex的检索器包装成LangChain的Tool，在Agent中使用——这样既享受了LlamaIndex的检索专业性，又保留了LangChain的编排灵活性。


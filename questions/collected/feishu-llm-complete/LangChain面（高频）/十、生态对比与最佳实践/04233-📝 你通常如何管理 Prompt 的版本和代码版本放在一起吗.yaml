content:
  prompt: "\U0001F4DD 你通常如何管理 Prompt 的版本？和代码版本放在一起吗？"
answer:
  mode: rubric
  reference_answer: |-
    Prompt 是 LLM 应用的“灵魂”，其迭代速度远快于代码。我采用 Prompt 与代码分离，独立版本控制 的策略。

    具体做法：

    - 存储方式：Prompt 以 YAML 文件形式存储在 config/prompts/ 目录下，每个文件代表一个业务场景，内部包含多个版本。

    ```yaml
    # customer_service.yaml
    prompts:
      v1:
        template: |
          You are a helpful customer service agent.
          Context: {context}
          Question: {question}
        input_variables: ["context", "question"]
        metadata:
          author: "zhangsan"
          date: "2024-01-15"
          description: "Initial version"
      v2:
        template: |
          You are a professional and friendly customer service agent...
        input_variables: ["context", "question"]
        metadata:
          author: "lisi"
          date: "2024-02-20"
          description: "Improved tone"
    ```

    - 版本控制：这些 YAML 文件和代码一起存放在同一个 Git 仓库中。但与代码不同，Prompt 的变更不需要完整的 CI/CD 流程。我们使用 Git 来追踪变更历史，通过 Pull Request 来审查 Prompt 修改。

    - 运行时加载：代码中通过一个 PromptLoader 类动态加载指定版本的 Prompt。可以在配置中心（或环境变量）中指定当前使用的版本号，实现快速切换和回滚。

    - A/B 测试：可以同时部署两个版本（如 v1 和 v2），通过路由规则将部分流量导向新版本，收集用户反馈后决定是否全量切换。

    - 独立发布：对于紧急的 Prompt 修复（如安全漏洞），可以通过配置中心热更新，而不需要重启整个服务。

    与代码版本的关系：Prompt 的版本和代码版本是弱关联的。代码版本保证系统功能的稳定性，Prompt 版本保证对话质量的优化。两者独立演进，通过明确的接口（输入变量）契约来保证兼容性。


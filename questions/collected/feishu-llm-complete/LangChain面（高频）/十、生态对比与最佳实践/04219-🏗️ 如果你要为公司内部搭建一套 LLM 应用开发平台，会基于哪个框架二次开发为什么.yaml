content:
  prompt: "\U0001F3D7️ 如果你要为公司内部搭建一套 LLM 应用开发平台，会基于哪个框架二次开发？为什么？"
answer:
  mode: rubric
  reference_answer: |-
    我会基于 LangChain + FastAPI + LangServe 构建核心框架，同时集成 LlamaIndex 用于数据密集型场景。理由如下：

    - LangChain 作为编排核心：

    - Runnable 接口的统一抽象：所有组件（LLM、Retriever、Tool）都遵循同一个接口，这让构建、组合、测试变得极其方便。我可以轻松地为平台构建一个可视化的“拖拽式链编辑器”，因为所有组件都是可序列化、可配置的。

    - Agent 与工具生态：平台需要支持业务方自主创建 Agent，LangChain 的工具注册机制和 AgentExecutor 可以直接拿来用，节省大量自研时间。

    - LCEL 的灵活性：我可以定义标准的 Prompt 模板库、工具库，让业务方像搭积木一样组装自己的应用，而无需编写代码。

    - 回调系统的可观测性：我可以基于回调系统构建全平台的 LLM 调用审计、成本统计、性能监控，无需侵入业务链。

    - FastAPI + LangServe 作为服务层：

    - 快速部署：LangServe 的 add_routes 可以一键将链发布为 API，极大简化了平台的服务化工作。

    - 原生流式支持：流式输出是现代 LLM 应用的标配，LangServe 已经内置。

    - 与 FastAPI 生态集成：可以利用 FastAPI 的中间件、依赖注入、认证系统，构建企业级 API 网关。

    - LlamaIndex 作为数据索引引擎：

    - 知识库场景的王者：对于需要处理大量非结构化文档、构建复杂索引的需求，LlamaIndex 的专业性无可替代。我会将 LlamaIndex 的 QueryEngine 封装为 LangChain 的 Tool，让平台用户可以在 Agent 中调用。

    - 自研部分：

    - 统一的 Prompt 管理平台：提供一个 Web UI，让业务人员可以编写、测试、版本管理 Prompt 模板。

    - 模型路由与成本控制：构建一个模型网关，实现基于预算、用户等级的模型动态切换，集成 LiteLLM 或自研。

    - 多租户隔离与权限管理：在平台层实现严格的租户数据隔离（向量库、对话记忆、文件存储），LangChain 本身不提供，需要我自研。

    为什么不自研一切？ 因为 LangChain 已经提供了 80% 的基础设施，自研的代价太高。二次开发不是重新造轮子，而是在巨人的肩膀上构建定制化功能。LangChain 的模块化设计让它非常适合作为平台底座。


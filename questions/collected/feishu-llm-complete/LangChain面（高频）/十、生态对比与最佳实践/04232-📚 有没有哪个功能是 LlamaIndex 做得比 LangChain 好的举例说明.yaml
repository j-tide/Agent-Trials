content:
  prompt: "\U0001F4DA 有没有哪个功能是 LlamaIndex 做得比 LangChain 好的？举例说明。"
answer:
  mode: rubric
  reference_answer: |-
    LlamaIndex 在数据索引的精细度和检索策略的智能化方面，远超LangChain。最典型的例子是递归检索和子问题分解。

    递归检索：

    - 场景：你有大量文档，需要先找到相关文档，再在文档内部找到最相关的具体段落。

    - LlamaIndex的做法：它原生支持构建两阶段索引——先对文档建立索引（Document Index），再对每个文档内部的段落建立索引（Vector Index）。查询时，先从文档索引中找到相关文档，再在这些文档的段落索引中精细检索。这个过程是框架内建的，几行代码即可配置。

    - LangChain的做法：你需要手动构建两个Retriever，通过自定义Chain或Agent将它们串联起来，编写大量样板代码。虽然也能实现，但远不如LlamaIndex优雅和高效。

    子问题分解：

    - 场景：用户问“对比苹果和谷歌的商业模式”，模型需要先分别检索两家公司的资料，再综合对比。

    - LlamaIndex的做法：通过 SubQuestionQueryEngine 自动将复杂查询分解为多个子查询（“苹果的商业模式是什么？”、“谷歌的商业模式是什么？”），并行检索，最后合并生成回答。整个过程框架自动完成，开发者几乎不需要额外工作。

    - LangChain的做法：需要手动设计Prompt让LLM分解问题，再通过 MultiQueryRetriever 或 RunnableParallel 手动并行化，最后还要手动合并结果。虽然灵活，但工程量大，容易出错。

    总结：LlamaIndex在RAG领域的深耕，使得它在“自动化的检索优化”方面遥遥领先。它把复杂的检索策略封装成了可直接调用的“引擎”，而LangChain则把同样的灵活性交给了开发者去组装。对于数据密集型应用，这种开箱即用的智能检索是巨大的生产力提升。


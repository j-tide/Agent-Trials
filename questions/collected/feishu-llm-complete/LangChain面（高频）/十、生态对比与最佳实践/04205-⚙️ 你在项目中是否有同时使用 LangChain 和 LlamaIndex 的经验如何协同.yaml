content:
  prompt: "⚙️ 你在项目中是否有同时使用 LangChain 和 LlamaIndex 的经验？如何协同？"
answer:
  mode: rubric
  reference_answer: "有，而且这是我认为最理想的组合方式：用LlamaIndex构建数据索引和检索引擎，用LangChain编排业务逻辑和Agent行为。它们各司其职，配合默契。\n\n协同架构：\n\n用户输入
    \n  ↓\nLangChain Agent（负责决策：需要检索吗？需要调用工具吗？）\n  ↓\nLlamaIndex QueryEngine（负责执行精细检索）\n
    \ ↓\n检索结果返回给Agent\n  ↓\nLangChain Chain（负责处理结果、生成回答、调用其他工具）\n  ↓\n最终输出\n\n具体做法：\n\n-
    将LlamaIndex的QueryEngine包装为LangChain Tool：\n\nfrom langchain.tools import Tool\nfrom
    llama_index import VectorStoreIndex\n\nindex = VectorStoreIndex.from_documents(documents)\nquery_engine
    = index.as_query_engine()\n\ndef query_knowledge_base(query: str) -> str:\n    return
    str(query_engine.query(query))\n\nretrieval_tool = Tool(\n    name=\"KnowledgeBase\",\n
    \   func=query_knowledge_base,\n    description=\"用于查询内部知识库，输入为自然语言问题\"\n)\n\nagent
    = initialize_agent([retrieval_tool], llm, agent=AgentType.OPENAI_FUNCTIONS)\n\n-
    利用LangChain的Memory管理对话上下文，让LlamaIndex专注于无状态的检索。\n\n- 在LangChain中处理多轮交互、条件分支，而LlamaIndex只负责单次检索的质量。\n\n-
    使用LangChain的回调系统监控整个流程，包括LlamaIndex的检索性能。\n\n优势：\n\n- 检索质量有保证（LlamaIndex专业能力）\n\n-
    业务逻辑灵活（LangChain编排能力）\n\n- 各自独立升级，互不干扰\n\n- 团队分工明确：数据工程师优化LlamaIndex索引，算法工程师迭代LangChain
    Agent\n\n实践案例：我们的智能客服系统就是这种架构。LlamaIndex负责从产品手册、FAQ文档中检索相关内容，LangChain Agent负责理解用户意图、管理对话状态、决定是否调用人工客服。上线后，问答准确率和用户满意度都显著提升。\n\n---"

content:
  prompt: "\U0001F4D6 如果你需要处理大量非结构化文档并构建复杂索引，哪个框架更合适？"
answer:
  mode: rubric
  reference_answer: |-
    LlamaIndex 是更合适的选择。原因如下：

    - 数据处理能力强：LlamaIndex内置了丰富的文档解析器（PDF、Markdown、HTML、Notion等），且支持自动识别文档结构（标题、表格、列表），能智能地将文档拆分为适合检索的节点。LangChain也有文档加载器，但对复杂文档结构的理解和解析不如LlamaIndex精细。

    - 索引类型丰富：面对大量非结构化文档，单一向量索引往往不够。LlamaIndex支持向量索引、摘要索引、关键词表索引、树形索引等，并能将它们组合为复合索引。你可以对文档建立摘要索引用于粗略筛选，再用向量索引进行精细检索。LangChain的索引能力相对单一。

    - 增量索引与更新：大规模文档频繁更新时，全量重建索引成本极高。LlamaIndex支持增量插入、删除、更新节点，并提供 index.refresh() 机制。LangChain的向量库更新需要手动管理。

    - 结构化数据提取：非结构化文档中常包含结构化信息（如合同中的金额、日期）。LlamaIndex能结合LLM自动提取结构化数据，并存为元数据供过滤检索。LangChain实现类似功能需要更复杂的链设计。

    - 性能优化：LlamaIndex针对大规模索引提供了异步索引构建、分布式处理、缓存优化等特性，在生产环境中更可靠。

    实践案例：我曾处理一个包含10万份PDF合同的项目，需要支持按条款内容、签约日期、金额范围等多维度查询。我们用LlamaIndex构建了双层索引：先对合同元数据建立关键词索引，再对合同正文建立向量索引，同时利用LLM提取关键条款结构化信息。最终实现了亚秒级的混合检索，这种工程复杂性是LangChain难以轻松应对的。


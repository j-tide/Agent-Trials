content:
  prompt: "✉️ 如果让你给 LangChain 官方提一个改进建议，你会提什么？"
answer:
  mode: rubric
  reference_answer: |-
    我会提：请提供一套“零抽象”的核心 API，让开发者可以在不需要理解框架概念的情况下，直接使用 LangChain 的集成生态。

    具体来说，LangChain 目前强制开发者通过 ChatOpenAI、LLMChain、AgentExecutor 等抽象来使用 LLM 和工具。但很多开发者只是想要一个统一的、轻量级的、无框架感的工具箱，让他们能够：

    - 直接调用 LLM，并获得标准化的响应：不需要 PromptTemplate，不需要 OutputParser，只需要一个函数 call_llm(model, messages, tools) 返回结构化的结果。

    - 轻松切换模型提供商：不需要改变代码，只需改一行配置就能从 OpenAI 切换到 Anthropic 或 Cohere。这是 LangChain 生态的最大价值，但目前这个能力被绑在了沉重的抽象上。

    - 独立使用 LangChain 的集成：比如我只想用 langchain_community 的文档加载器、文本分割器，而不想引入整个 langchain 核心。目前虽然可以通过安装子包实现，但文档和最佳实践不够清晰。

    我的愿景：LangChain 可以像 requests 库那样，提供一个 langchain.api 模块，里面是纯函数式的、零抽象的 API。开发者用这些 API 可以快速上手，不需要学习 Chain、Agent、Memory 的概念。当他们需要更高级的编排能力时，再去使用 langchain.chains 和 langchain.agents。这种“分层”设计能大大降低初学者的门槛，也能让高级用户按需选择，避免“一刀切”的复杂。

    总结：LangChain 需要一次“减负”，把核心能力下沉为简单、稳定的 API，把高级抽象作为可选层。这样才能真正实现“从简单到复杂”的无缝过渡，而不是让简单场景为复杂场景买单。

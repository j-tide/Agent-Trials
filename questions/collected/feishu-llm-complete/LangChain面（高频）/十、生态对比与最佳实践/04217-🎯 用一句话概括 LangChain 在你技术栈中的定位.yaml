content:
  prompt: "\U0001F3AF 用一句话概括 LangChain 在你技术栈中的定位。"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 是我构建 LLM 应用时的“编排引擎和生态基座”——我依赖它来统一管理 Prompt、模型、工具、记忆和检索组件，通过其灵活的 Agent 和 Chain 机制快速实现复杂业务逻辑，同时借助其丰富的生态集成避免重复造轮子；但我也始终保持对底层 API 的理解，在简单场景下果断绕过它，在它力所不及的地方引入 LlamaIndex、LiteLLM 等专业工具来补齐。

    它不是我的全部，但它是连接一切的中枢。

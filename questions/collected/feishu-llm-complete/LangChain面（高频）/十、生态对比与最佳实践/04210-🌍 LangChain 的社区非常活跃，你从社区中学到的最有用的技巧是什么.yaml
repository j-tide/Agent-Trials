content:
  prompt: "\U0001F30D LangChain 的社区非常活跃，你从社区中学到的最有用的技巧是什么？"
answer:
  mode: rubric
  reference_answer: |-
    从LangChain社区中，我学到了无数书上没有的实战技巧。最让我获益匪浅的几个核心技巧包括：

    - “强制Agent输出结构化JSON并自我纠正”模式：社区贡献者分享了一种模式，不是简单让ReAct Agent输出自由文本Thought，而是要求它在每次决策时输出一个JSON对象，包含reasoning（推理过程）、action（要调用的工具）、confidence（对当前决策的置信度，0-1）。当 confidence 低于0.7时，Agent不会立即执行，而是进入一个反思状态，回顾之前的观察，尝试找到不确定的根源。这种模式在我的一个复杂数据分析Agent中，将任务成功率从65%提升到了85%。这个技巧的精髓在于利用了LLM的自我评估能力来弥补Agent执行器的机械性。

    - “利用 RunnableParallel 构建非确定性探索流水线”：通常我们写链是线性的，但在某些创意任务（如头脑风暴、广告文案生成）中，我们需要同时尝试多种不同的Prompt策略。社区展示了如何使用 RunnableParallel 同时调用多个不同Prompt版本的链，然后将结果用 RunnableLambda 收集，再由一个“评委”LLM选出最佳或进行融合。这种“并行探索-集中评估”的模式大大提升了创意类任务的输出多样性。

    - “回调监听器实现实时工具状态广播”：在一个需要用户等待的Agent场景中，社区成员使用 BaseCallbackHandler 的 on_tool_start 和 on_tool_end，将当前执行的工具名称和状态通过WebSocket实时推送到前端。用户能看到“正在搜索数据库...”、“正在分析文档...”的动态进度，这极大地改善了等待体验。这个技巧让我认识到，回调系统不仅仅是日志工具，更是连接后端推理和前端交互的桥梁。

    - “Prompt模板的深度嵌套和复用”：在构建大型聊天机器人时，社区有人分享了一种巧妙的做法：将通用的角色设定（如“你是一个友好的客服”）、安全准则（“绝不谈论政治”）、以及输出格式要求（“用JSON格式回复”），分别定义为独立的PromptTemplate片段。然后通过 ChatPromptTemplate.from_messages 将它们组合在一起。这样修改任一模块（比如更新安全准则）都不影响其他模块，极大提高了Prompt的可维护性。


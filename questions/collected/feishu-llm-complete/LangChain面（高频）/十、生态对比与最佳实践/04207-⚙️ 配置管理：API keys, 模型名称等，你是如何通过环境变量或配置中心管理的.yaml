content:
  prompt: "⚙️ 配置管理：API keys, 模型名称等，你是如何通过环境变量或配置中心管理的？"
answer:
  mode: rubric
  reference_answer: |-
    遵循12-Factor App的原则，将配置与代码严格分离。

    环境变量：

    - 所有敏感信息（API Key、数据库密码）和可变配置（模型名称、max_tokens 默认值）都通过环境变量注入。

    - 使用 .env 文件用于本地开发，但绝不提交到 Git。.env.example 提交，作为模板。

    - 在代码中，使用 os.getenv("OPENAI_API_KEY") 或 Pydantic 的 BaseSettings 类来集中读取所有环境变量，并在应用启动时进行校验。这提供了一个强类型的配置对象，并在缺失必填配置时立即报错。

    配置中心：

    - 对于需要动态调整、不希望重启服务的配置（如 Prompt 版本、限流阈值、模型切换开关），使用集中式配置中心（如 Consul、Nacos、AWS AppConfig）。

    - 应用启动时拉取完整配置，并定期（如每 30 秒）监听配置变更。收到变更事件后，更新内存中的配置对象，但不重建已存在的链实例（除非设计为可热更新）。

    - 模型切换：一个典型的例子是“模型降级”。当检测到成本超限时，通过配置中心将 model_name 从 gpt-4 改为 gpt-3.5-turbo，应用读取新配置，后续请求自动使用新模型。

    LangChain 特定配置：

    - verbose：通过环境变量控制，开发环境为 True，生产环境为 False。

    - max_iterations：Agent 的最大步数，通过配置中心动态调整，以应对突发流量。

    - 回调处理器列表：通过配置文件指定要启用的回调类名，由工厂函数根据配置动态实例化。

    安全实践：API Key 绝不出现在代码或日志中。使用密钥管理服务（如 AWS Secrets Manager）来存储，应用启动时安全地获取。


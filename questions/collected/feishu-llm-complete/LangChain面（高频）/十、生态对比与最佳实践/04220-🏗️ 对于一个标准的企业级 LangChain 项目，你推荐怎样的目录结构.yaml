content:
  prompt: "\U0001F3D7️ 对于一个标准的企业级 LangChain 项目，你推荐怎样的目录结构？"
answer:
  mode: rubric
  reference_answer: |-
    企业级项目需要兼顾可维护性、可测试性和可扩展性。我推荐的目录结构遵循领域驱动设计（DDD）的原则，将业务逻辑与基础设施分离，同时保持LangChain组件的独立性。

    ```text
    project_root/
    ├── src/
    │   ├── __init__.py
    │   ├── main.py                     # FastAPI / LangServe 应用入口
    │   ├── config/
    │   │   ├── __init__.py
    │   │   ├── settings.py             # 配置管理（环境变量、模型参数）
    │   │   └── prompts/                # Prompt 模板集中管理
    │   │       ├── __init__.py
    │   │       ├── chat_prompts.yaml   # 按领域分类的 Prompt
    │   │       └── legal_prompts.yaml
    │   ├── chains/                     # 业务链组装
    │   │   ├── __init__.py
    │   │   ├── base.py                 # 链的抽象基类和公共工厂函数
    │   │   ├── qa_chain.py             # 问答链
    │   │   └── summarization_chain.py  # 摘要链
    │   ├── agents/                     # Agent 相关
    │   │   ├── __init__.py
    │   │   ├── base_agent.py           # Agent 创建工厂
    │   │   └── tools/                  # 工具定义
    │   │       ├── __init__.py
    │   │       ├── search_tool.py
    │   │       └── database_tool.py
    │   ├── retrievers/                 # 检索器
    │   │   ├── __init__.py
    │   │   ├── vector_retriever.py
    │   │   └── hybrid_retriever.py
    │   ├── memory/                     # 记忆管理
    │   │   ├── __init__.py
    │   │   └── session_memory.py
    │   ├── models/                     # 领域模型和 Pydantic Schema
    │   │   ├── __init__.py
    │   │   ├── chat.py
    │   │   └── document.py
    │   ├── services/                   # 业务服务层（调用链和Agent）
    │   │   ├── __init__.py
    │   │   ├── chat_service.py
    │   │   └── document_service.py
    │   └── utils/                      # 工具函数
    │       ├── __init__.py
    │       ├── token_counter.py
    │       └── security.py
    ├── tests/                          # 测试目录，镜像 src 结构
    │   ├── unit/
    │   │   ├── chains/
    │   │   ├── agents/
    │   │   └── retrievers/
    │   ├── integration/
    │   └── fixtures/                   # 测试数据
    ├── docker/
    │   ├── Dockerfile
    │   └── docker-compose.yml
    ├── .env.example                    # 环境变量模板
    ├── pyproject.toml                  # 项目依赖管理（Poetry）
    └── README.md
    ```

    设计原则：

    - chains/ 和 agents/：只负责组装，不包含业务逻辑。它们从 services/ 被调用。

    - services/：业务编排层，一个服务方法可能调用多个链或Agent，处理异常和降级。

    - config/prompts/：Prompt 与代码分离，用 YAML 管理，方便非开发人员调整。

    - retrievers/ 和 memory/：独立模块，因为它们可能被多个链和Agent复用。

    - models/：定义 Pydantic 模型，用于API输入输出和内部数据传递，保证类型安全。

    - utils/：纯函数工具，不依赖 LangChain，可独立测试。

    这种结构让团队可以并行开发：负责检索的成员修改 retrievers/，负责对话的成员修改 chains/ 和 services/，不会产生冲突。


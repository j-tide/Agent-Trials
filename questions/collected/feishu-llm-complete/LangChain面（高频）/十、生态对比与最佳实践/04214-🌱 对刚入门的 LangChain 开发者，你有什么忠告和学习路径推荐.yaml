content:
  prompt: "\U0001F331 对刚入门的 LangChain 开发者，你有什么忠告和学习路径推荐？"
answer:
  mode: rubric
  reference_answer: |-
    忠告：

    - 先理解 LLM 本身，再学框架。如果你不知道 Prompt Engineering、Token 限制、Temperature 的作用，直接用 LangChain 只会让你更困惑。先用原生 OpenAI SDK 写几个小应用，感受一下 LLM 的能力和局限。

    - 别想一口气吃成胖子。LangChain 很庞大，从 ChatPromptTemplate 和 StrOutputParser 开始，用 LCEL 写最简单的链。不要一开始就看 Agent、Memory、各种高级 Chain。

    - 源码是你最好的老师。当你对某个组件的行为感到困惑时，直接去看它的源码（langchain-core 和 langchain-community）。LangChain 的文档可能滞后，但源码不会骗你。

    - 避免过度工程。不要为了用 LangChain 而用 LangChain。如果一个简单的 requests 调用就能解决，就不要引入 LangChain 的 Tool 抽象。保持简单，直到复杂度成为瓶颈。

    - 建立你自己的评估集。从第一天开始，就收集一些你认为“好”的回答和“坏”的回答。这是你优化 Prompt 和链的唯一客观标准。

    - 版本管理一切。Prompt、链的配置、工具定义，都应该像代码一样进行版本控制。未来你会感谢现在这样做的自己。

    推荐学习路径：

    - 第1-2周：LLM 基础。学习 Token、Prompt Engineering、Temperature、Top-p 等概念。用 OpenAI Playground 或原生 SDK 做实验。

    - 第3-4周：LangChain 核心。掌握 ChatPromptTemplate、LCEL（Runnable 接口）、StrOutputParser、ChatOpenAI。能搭建简单的问答链和对话链。

    - 第5-6周：数据与检索。学习 Document Loader、Text Splitter、VectorStore、Retriever。能够构建一个基础的 RAG 应用。

    - 第7-8周：Agent 与工具。理解 ReAct Agent 的工作原理，学会使用 create_openai_functions_agent 和自定义 Tool。能够构建一个简单的工具调用 Agent。

    - 第9-10周：生产化。学习 LangServe、回调系统、Memory 管理、错误处理、成本控制。能够将你的应用部署为 API，并添加基本的监控。

    - 持续学习：关注 LangChain 官方博客、GitHub Discussions、以及 LangSmith 的 Cookbook。阅读其他优秀开源项目（如 OpenGPTs、AutoGPT）的源码，看看别人是如何使用 LangChain 的。

    记住，LangChain 是一个工具，不是目的。你的目标是构建出色的 LLM 应用，框架只是帮助你更快到达那里的手段。保持对底层原理的好奇心，不要成为框架的奴隶。

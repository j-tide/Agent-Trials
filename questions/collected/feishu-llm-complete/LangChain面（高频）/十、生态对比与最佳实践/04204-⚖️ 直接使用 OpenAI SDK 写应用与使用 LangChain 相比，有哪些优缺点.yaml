content:
  prompt: "⚖️ 直接使用 OpenAI SDK 写应用与使用 LangChain 相比，有哪些优缺点？"
answer:
  mode: rubric
  reference_answer: |-
    直接使用 OpenAI SDK 的优点：

    - 透明可控：代码逻辑一目了然，没有框架的“魔法”，调试简单

    - 轻量无依赖：不引入额外的框架依赖，应用体积小，启动快

    - 性能直接：避免了LangChain的序列化、回调链等开销

    - 学习成本低：只需理解API文档，无需学习框架的抽象概念

    - 适合简单场景：对于单轮问答、简单总结等，直接调用API最高效

    直接使用 OpenAI SDK 的缺点：

    - 重复造轮子：Prompt模板管理、对话记忆、多步推理、流式输出等都需要自己实现

    - 缺乏生态集成：没有现成的文档加载器、向量库集成、工具调用框架

    - 扩展性差：当应用复杂时，自建代码容易变成意大利面条式，难以维护

    - 缺少生产级特性：回调、日志、缓存、错误重试等需要手动构建

    - 工具调用繁琐：Function Calling的请求解析、多步调用循环需要自己编写

    LangChain 的优势：

    - 开发效率高：预制组件丰富，能快速搭建复杂应用

    - 生态丰富：支持多种LLM、向量库、文档格式，切换成本低

    - 生产特性完善：流式输出、缓存、回调、错误处理等开箱即用

    - 社区活跃：遇到问题容易找到解决方案和最佳实践

    个人建议：

    - 如果你的应用是简单的一次性问答、单轮翻译或摘要，直接用OpenAI SDK，不要引入LangChain

    - 如果你的应用涉及多轮对话、复杂工具调用、多步推理、需要频繁切换模型或组件，LangChain的抽象会帮你节省大量时间

    - 不要为了用框架而用框架——评估一下LangChain为你节省的开发时间和它带来的调试成本，哪个更大


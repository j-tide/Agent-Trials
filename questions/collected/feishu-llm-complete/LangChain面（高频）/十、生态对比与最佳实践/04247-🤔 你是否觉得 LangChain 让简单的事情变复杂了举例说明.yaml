content:
  prompt: "\U0001F914 你是否觉得 LangChain 让简单的事情变复杂了？举例说明。"
answer:
  mode: rubric
  reference_answer: |-
    是的，这是 LangChain 最被诟病的一点。它能让复杂的事情变简单，但也能让简单的事情变得极其复杂。典型例子是简单的对话应用。

    原生 OpenAI SDK 实现（约 30 行）：

    ```python
    import openai
    messages = [{"role": "system", "content": "You are helpful."}]
    while True:
        user_input = input("User: ")
        messages.append({"role": "user", "content": user_input})
        response = openai.ChatCompletion.create(model="gpt-3.5-turbo", messages=messages)
        assistant_msg = response.choices[0].message.content
        print(f"AI: {assistant_msg}")
        messages.append({"role": "assistant", "content": assistant_msg})
    ```

    LangChain 实现：你需要理解 ConversationChain、ConversationBufferMemory、PromptTemplate、LLMChain 等多个概念，阅读文档，处理它们的配置，最后写出的代码并不比原生少，但心智负担大得多。如果遇到问题，调试的难度也更高。

    另一个例子是简单的流式输出。原生 SDK 只需在 create 中设置 stream=True，然后遍历响应。LangChain 需要理解 StreamingStdOutCallbackHandler 或 stream 方法，并在链的组装时正确传递。概念上更重。

    LangChain 的辩护：当你需要添加记忆、切换模型、集成工具、处理多步推理时，LangChain 的统一抽象开始显现价值。问题是，很多项目一开始很简单，后来才变复杂。如果一开始就上了 LangChain，可能还没到复杂阶段，就已经被框架的复杂性拖累。

    我的平衡之道：从原生开始，当复杂度达到临界点时再引入 LangChain。 这个临界点包括：需要管理多种记忆类型、需要链式组合多个 LLM 调用、需要构建 Agent 调用工具。在此之前，保持简单，不要过度设计。


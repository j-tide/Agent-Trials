content:
  prompt: "\U0001F9EE 如果一条链中某个环节是 CPU 密集型的，你会怎么做？把它放到线程池还是用异步？"
answer:
  mode: rubric
  reference_answer: |-
    对于 CPU 密集型任务，由于 Python GIL 的存在，多线程并不能实现真正的并行计算，甚至可能因为线程切换开销而变慢。因此，绝对不能用 asyncio.to_thread 或 ThreadPoolExecutor 来处理 CPU 密集型任务。正确的做法是使用 ProcessPoolExecutor。

    具体做法：

    - 将 CPU 密集型任务封装成一个独立的函数。

    - 在 RunnableLambda 或自定义工具中，使用 loop.run_in_executor(ProcessPoolExecutor(), cpu_heavy_func, input_data) 将任务提交到进程池中执行。

    - 对于多个独立的 CPU 任务，可以使用 asyncio.gather 并发提交到进程池，充分利用多核 CPU。

    关键注意事项：

    - 序列化开销：进程间传递数据需要序列化（pickle），如果输入数据量很大，这个开销可能超过计算本身。此时应考虑将数据预加载到共享内存（如 multiprocessing.Array）中，或使用专门的计算框架（如 Ray）。

    - 模型部署：如果你的“CPU 密集型任务”是运行一个本地模型（如 Embedding 模型、句子分类器），更好的做法是将它部署为一个独立的微服务（如用 vLLM 或 Triton），通过 HTTP/gRPC 异步调用。这样既能解耦，又能独立扩缩容，不受 Python GIL 和进程池的限制。

    - 避免在异步主循环中直接阻塞：即使用 ProcessPoolExecutor，也要用 await loop.run_in_executor(...) 来包装，确保事件循环不被阻塞。

    实例：我们有一个文档分析链，其中需要对大量文本进行关键词提取（基于 TF-IDF + 自定义算法，这是一个 CPU 密集计算）。最初在 asyncio.to_thread 中执行，高并发下 CPU 利用率为单核 100%，其他核空闲，处理极慢。后改为 ProcessPoolExecutor，并限制最大进程数为 CPU 核数-1，将任务拆分为多个小任务并发提交到进程池，CPU 利用率达到 80%，吞吐量提升 5 倍。更极致的做法是将关键词提取服务独立部署，通过 gRPC 调用，彻底解耦。

    反思：识别任务的类型（I/O 密集 vs CPU 密集）是选择正确并发策略的前提。对于 CPU 密集任务，进程池是基础方案，独立服务是终极方案。不要在异步编程中因为方便而随意使用线程池，那只会掩盖问题，不会解决问题。

content:
  prompt: "\U0001F41B 当 LangChain 的集成库（如某个向量库）有 bug 时，你的处理流程是什么？"
answer:
  mode: rubric
  reference_answer: |-
    遇到这种情况，首先需要明确的是：这是 LangChain 封装层的问题，还是底层库本身的问题。我的处理流程如下：

    第一步：最小化复现。我会写一个尽可能简短的脚本，跳过 LangChain，直接调用底层库的 Python API，看是否能复现。如果底层库正常，那问题在 LangChain 的封装；如果底层库也有同样的问题，那直接去该库的 GitHub 提 Issue。

    第二步：降级 / 替换。如果是 LangChain 封装的问题，且等不及官方修复，我通常会采取以下行动之一：

    - 降级 LangChain 版本：回退到上一个稳定工作的版本。

    - 替换为另一个集成：LangChain 通常支持多种向量库，如果 FAISS 有问题，临时切换到 Chroma 或 Qdrant，成本很低，因为都是通过 BaseRetriever 接口交互的。

    - 自行修复并打补丁：如果问题明确且修复简单，我会 fork 仓库，本地修复，然后在项目中使用 fork 版本，同时向上游提交 PR。

    第三步：隔离影响。无论如何修复，我都会在受影响的模块外面包一层 try/catch，并降级处理（例如，如果向量检索失败，回退到关键词检索或返回默认结果），确保整个服务不会因为这一个组件的问题而崩溃。

    案例：有一次，LangChain 的 Chroma 集成在 similarity_search_with_score 中返回的 Document 对象的 metadata 丢失了自定义字段。排查后发现是 LangChain 内部在序列化时做了不必要的过滤。在等待官方修复的期间，我写了一个自定义的 Retriever 子类，重写了 _get_relevant_documents 方法，直接调用 Chroma 的原生 API 获取结果，绕过了 LangChain 的封装。同时向 LangChain 提交了 Issue 和修复 PR。

    反思：对关键路径上的集成，一定要有降级方案。LangChain 的价值在于它提供了“统一接口”，所以替换成本低。善用这个优势，不要被任何一个具体的集成绑定。


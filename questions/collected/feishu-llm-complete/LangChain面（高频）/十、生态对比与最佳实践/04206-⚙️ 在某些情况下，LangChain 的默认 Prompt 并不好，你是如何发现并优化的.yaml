content:
  prompt: "⚙️ 在某些情况下，LangChain 的默认 Prompt 并不好，你是如何发现并优化的？"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 的很多内置链（如 ConversationalRetrievalChain、ReAct Agent）都有默认的 Prompt，但这些 Prompt 是通用的，不一定适合你的场景。它们通常过于冗长、包含不必要的示例，或者没有针对你的领域语言进行优化。

    发现默认 Prompt 不好的途径：

    - 直接阅读 Prompt 源码：LangChain 的 Prompt 通常存放在 langchain.chains 或 langchain.agents 下的 prompts.py 文件中。我会把默认 Prompt 打印出来，逐行分析。很多时候会发现，Prompt 中包含了大量 Few-shot 示例，这些示例对我的任务完全没有帮助，反而消耗了大量 Token。

    - 观察 Agent 的行为：如果 Agent 总是输出不必要的 Thought、反复确认某个信息、或者容易误解用户的意图，八成是 Prompt 的问题。比如，ReAct Agent 的默认 Prompt 强调“一步步思考”，导致 Agent 在简单任务上也写出了长篇大论的推理过程，浪费 Token。

    - 对比 LangSmith 的 Trace：查看每一步的 Prompt 和输出，如果发现 LLM 的某些输出与期望偏离，追溯到 Prompt，看是否是指令不够清晰。

    优化方法：

    - 精简 Prompt：我删除了默认 Prompt 中所有不必要的 Few-shot 示例，只保留核心指令。对于 ReAct Agent，我重写了 Prompt，强调“只在必要时使用工具”，并加入了“如果用户的请求很明确，直接回答，不需要调用工具”的指令。

    - 领域化定制：对于法律问答场景，我在 Prompt 中加入了领域特定的术语表和回答格式要求（如“必须引用具体法条”），显著提升了回答的准确性和可读性。

    - A/B 测试 Prompt：我会构造一个小型测试集（20-30 个问题），分别用默认 Prompt 和优化后的 Prompt 运行，人工评估输出质量。LangSmith 的 Dataset 功能可以自动化这个过程。

    反思：永远不要信任默认 Prompt。框架提供的是“能用”的基线，而不是“最优”的方案。把 Prompt 当作代码一样进行版本管理、测试和迭代，是 LLM 应用开发的核心工作之一。


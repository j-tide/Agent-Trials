content:
  prompt: "\U0001F300 如何处理 LangChain 中“Python 递归深度限制”的问题？比如链很深或嵌套。"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 链本身通常不会造成递归深度问题，因为它本质上是顺序执行或并行执行，而不是递归。真正可能触发递归深度限制的场景是：

    - Agent 的 ReAct 循环在自定义实现中使用了递归调用。

    - 某些链的 transform 方法内部使用了递归来处理嵌套结构。

    - 复杂的 RunnableLambda 相互调用形成了间接递归。

    解决方案：

    - 避免递归，使用迭代：无论是 Agent 循环还是链的组合，都应该使用 while 循环或 for 循环，而不是函数递归。LangChain 的 AgentExecutor 就是使用 while 循环，不会产生递归栈。

    - 设置 sys.setrecursionlimit()：如果确实需要更深的调用栈（比如处理非常长的文本时，某些递归分割器可能触发），可以临时调高递归限制。但这是治标不治本，更大的限制可能导致 C 栈溢出，进程崩溃。

    - 使用尾递归优化或 Trampoline 模式：在 Python 中实现尾递归并不容易，但可以通过将递归改写为生成器或使用回调来实现“蹦床”效果，避免栈增长。

    实践：我曾在自定义一个复杂的多步推理链时，因为偷懒写了递归调用，导致在 Agent 步数超过 10 时抛出了 RecursionError。后来我将其改为一个显式的迭代循环，维护一个状态字典，每次循环根据状态决定下一步操作，问题解决。

    反思：Python 不是一门适合深度递归的语言。在设计任何循环或嵌套逻辑时，默认使用迭代而不是递归。 LangChain 的设计本身已经很好地规避了这个问题，但自定义组件时仍需注意。


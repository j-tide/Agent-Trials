content:
  prompt: "\U0001F9EA 你是否评估过 DSPy？它和 LangChain 在构建 LLM 流水线方面的思路差异。"
answer:
  mode: rubric
  reference_answer: |-
    评估过。DSPy（Declarative Self-improving Python）是一种全新的 LLM 编程范式，它与 LangChain 的设计哲学截然不同，甚至可以说是对 LangChain 的“降维打击”。

    DSPy 的核心思路：

    - 声明式编程：DSPy 将 LLM 应用抽象为“模块”（Module）和“签名”（Signature）。你不需要手动设计 Prompt，而是声明“输入是什么、输出是什么”，DSPy 会自动生成 Prompt。

    - 自动优化（Compile）：DSPy 的核心创新是“编译器”。你提供少量的训练数据（输入-输出示例），DSPy 可以自动优化 Prompt、选择示例（Few-shot）、甚至微调模型，整个过程全自动。

    - 模块化与可组合性：DSPy 的模块（ChainOfThought、ReAct 等）可以像神经网络层一样组合，构建复杂流水线。

    与 LangChain 的差异：


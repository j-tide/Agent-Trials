content:
  prompt: "\U0001F91D 在团队协作开发 LangChain 应用时，如何分工并保证一致性？"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 应用的团队协作需要兼顾软件工程的通用原则和 AI 应用的特殊性。

    分工建议：

    - Prompt 工程师：负责 Prompt 的编写、测试、优化和版本管理。他们不需要深入理解 LangChain 的代码，但需要懂业务领域。

    - 算法/数据工程师：负责检索器（RAG）的构建、Embedding 模型选择、向量库优化、文档处理流水线。

    - 后端/平台工程师：负责 LangChain 链和 Agent 的组装、服务化（FastAPI/LangServe）、性能优化、CI/CD、监控。

    - 产品/QA：负责构建评估数据集，进行端到端测试，确保模型输出的质量和安全性。

    保证一致性的手段：

    - 统一开发环境：使用 Dev Containers 或 Poetry 锁定依赖版本，确保所有人在相同的 Python 环境和 LangChain 版本下开发。

    - 组件接口标准化：定义清晰的内部接口。例如，所有 Retriever 都必须实现 BaseRetriever，所有 Tool 都使用 @tool 装饰器，所有 Prompt 模板都必须声明 input_variables。

    - 单元测试与集成测试：要求每个组件（Retriever、Tool、Chain）都有对应的单元测试。使用 FakeLLM 或 Mock 来隔离外部依赖。在 CI 中强制运行测试，不通过不能合并。

    - 代码审查与设计评审：对链的组装和 Agent 的设计进行代码审查。对于复杂的 Prompt 和工具，进行集体评审，避免“一个人拍脑袋”。

    - 集中式配置管理：所有模型名称、API Key、参数等敏感或可变配置，统一通过环境变量或配置中心管理，禁止硬编码在代码中。

    - Prompt 合约：Prompt 的输入输出变量作为合约，一旦定义好，不应该随意修改。任何修改都需要同步更新相关的代码和测试。

    - 文档化：维护一个“决策日志”（ADR），记录为什么选择某种链结构、某个工具的实现方式、某个模型的参数。这对于新加入的成员非常重要。


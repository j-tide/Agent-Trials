content:
  prompt: "\U0001F680 在生产环境部署 LangChain 应用时，你的 CI/CD 流程是怎样的？"
answer:
  mode: rubric
  reference_answer: |-
    CI/CD 流程需要确保 LLM 应用在快速迭代的同时保持稳定性和质量。

    CI 流水线（每次 Pull Request）：

    - 代码质量检查：ruff 或 black 格式化，mypy 类型检查，bandit 安全扫描。

    - 依赖漏洞扫描：pip-audit 或 safety 检查依赖库是否有已知漏洞。

    - 单元测试：使用 pytest 运行所有单元测试，Mock 所有外部依赖（LLM、向量库）。测试覆盖率需超过 80%。

    - 链的集成测试：在 CI 环境中启动一个最小的 Redis 和 Chroma 实例，测试关键链的端到端流程（使用 FakeLLM）。

    - Prompt 验证：运行一个脚本，检查所有 Prompt 模板的变量是否与代码中使用的一致，防止拼写错误。

    - 评估（可选）：对于关键链，使用 LangSmith 或自定义评估集，用真实 LLM 运行少量测试，检查输出质量的基本指标（如格式正确性）。这可以放在夜间构建中，PR 阶段只做快速检查。

    CD 流水线（合并到主分支后）：

    - 构建镜像：使用 Docker 构建应用镜像，将模型权重（如果有）或配置打包。使用多阶段构建减小镜像体积。

    - 推送镜像：推送到私有镜像仓库（如 Harbor、ECR）。

    - 部署到预发布环境：自动部署到 Staging 环境，并运行冒烟测试（发送几个真实的 API 请求，验证核心功能）。

    - 评估与批准：在 Staging 环境运行完整的离线评估集，并与当前生产版本进行对比。如果关键指标（如回答准确率、安全率）未显著下降，自动批准；否则阻止部署。

    - 生产部署：使用滚动更新策略部署到生产环境。在 Kubernetes 中，使用 kubectl rollout 或 Helm 进行。

    - 监控与回滚：部署后，密切关注监控面板（延迟、错误率、Token 消耗）。如果出现异常，立即回滚。

    关键实践：

    - 蓝绿部署或金丝雀发布：对于重大变更（如模型切换），先部署金丝雀实例，将 5% 流量导向新版本，观察一段时间再全量切换。

    - 配置和代码分离：Prompt 和配置文件的变更可以走更轻量的发布流程，不一定需要完整的 CI/CD。

    - 回滚策略：确保上一个版本的 Docker 镜像和配置完整保留，可以在几分钟内回滚。


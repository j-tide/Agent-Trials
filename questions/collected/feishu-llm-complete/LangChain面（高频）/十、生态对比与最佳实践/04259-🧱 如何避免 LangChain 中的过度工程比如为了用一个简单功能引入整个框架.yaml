content:
  prompt: "\U0001F9F1 如何避免 LangChain 中的“过度工程”？比如为了用一个简单功能引入整个框架。"
answer:
  mode: rubric
  reference_answer: |-
    过度工程是使用框架时最容易犯的错误。我的原则是：LangChain 是一个工具，不是信仰。 在决定引入 LangChain 之前，先问自己三个问题：

    - 这个功能需要多少行原生代码？ 如果直接用 openai 库 50 行就能写出来，引入 LangChain 可能反而需要 100 行配置和理解抽象，得不偿失。

    - 未来是否会有复杂编排需求？ 如果只是简单的单轮问答、翻译或摘要，没有多步推理、工具调用、对话记忆等需求，LangChain 的抽象就是负担。

    - 团队是否熟悉 LangChain？ 如果团队大多数人不熟悉 LangChain，为了一个小功能引入框架会拉高全员的学习成本。

    避免过度工程的具体做法：

    - 拥抱 LCEL，但不要强迫：LCEL 很强大，但不是每个逻辑都必须用 LCEL 表达。如果一个步骤就是简单的 Python 函数，就用 RunnableLambda 包装它，而不是硬要把它拆成多个 Runnable 再组合。保持代码的自然感。

    - 避免为简单 Prompt 使用 PromptTemplate：如果你的 Prompt 就是固定的字符串拼接，直接 f-string 或 ChatPromptTemplate.from_messages 即可，不要引入 FewShotPromptTemplate 或 PipelinePromptTemplate。

    - 链式调用 vs 显式编排：对于流程固定的任务（如先检索再生成），用 LCEL 的一行链非常优雅。但对于有分支、循环、条件判断的复杂逻辑，我更倾向于写一个显式的 Python 函数，在函数内部调用各个组件，而不是用 RunnableBranch 和 RunnableLambda 嵌套。显式编排更容易调试和理解。

    - 不迷信框架的默认实现：LangChain 的 ConversationChain 看起来很方便，但它把 Memory、Prompt、Chain 耦合在一起。如果你需要更灵活的对话管理，直接用一个循环，手动管理消息列表，反而更清晰。

    一个反面案例：我见过一个项目，开发者为了调用一个简单的 API，用了 LLMChain、SimpleSequentialChain、ConversationBufferMemory 三个组件。而实际上，那个功能就是“用户输入 → 调用 LLM → 返回结果”，没有任何记忆或分支需求。直接用 OpenAI SDK 10 行代码就能搞定。后来这个项目重构时，我们去掉了 LangChain，代码量减少了 60%，性能提升了 20%。

    反思：“杀鸡焉用牛刀”。LangChain 最适合的场景是复杂编排、多步推理、工具调用、需要频繁切换模型或组件的应用。对于简单功能，保持克制，不要让框架成为主角。


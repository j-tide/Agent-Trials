content:
  prompt: "\U0001F9E9 异步环境下，LangChain 的回调系统是否能正常工作？需要注意什么？"
answer:
  mode: rubric
  reference_answer: |-
    回调系统在异步环境下可以正常工作，但需要注意同步/异步处理器的选择。

    - 如果你的回调处理器继承自 AsyncCallbackHandler，那么它的所有 on_* 方法都是协程，LangChain 会 await 它们，不会阻塞事件循环。

    - 如果使用同步的 BaseCallbackHandler，LangChain 会通过 run_in_executor 在线程池中执行，这可能导致回调执行顺序无法保证，且引入线程切换开销。

    注意事项：

    - 避免在异步回调中做重 CPU 计算：这仍会阻塞事件循环，应使用 loop.run_in_executor。

    - 回调的异常隔离：在异步回调中抛出的异常如果不被捕获，会导致当前任务取消。建议每个回调方法内部 try/except，并使用 raise_error=False。

    - 上下文传播：run_id, parent_run_id 等会正确传递，但如果你在回调中使用了 contextvars，需要注意协程上下文是隔离的。

    - LangSmith 集成：LangChain 自带的 LangSmith 回调已经是异步安全的，建议启用。

    最佳实践：在异步应用中，所有回调都应实现为异步版本，保证一致性。如果必须使用同步回调，限制其数量，并监控线程池的负载。


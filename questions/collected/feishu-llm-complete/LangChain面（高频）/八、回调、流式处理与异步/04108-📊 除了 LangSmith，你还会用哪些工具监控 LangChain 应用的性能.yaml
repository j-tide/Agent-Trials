content:
  prompt: "\U0001F4CA 除了 LangSmith，你还会用哪些工具监控 LangChain 应用的性能？"
answer:
  mode: rubric
  reference_answer: |-
    LangSmith 是官方首选，但它的成本不低，且依赖外网。在实际生产环境中，我通常会搭配自建监控栈，以达到更灵活、低延迟、低成本的监控。

    主要工具组合：

    - OpenTelemetry + Jaeger / Grafana Tempo：用于全链路分布式追踪。LangChain 官方支持 OpenTelemetry，只需配置环境变量即可自动埋点。它能记录每个 LLM 调用、链执行、Retriever 的 Trace，并在 Jaeger 中以瀑布图展示每一步的耗时，直观定位瓶颈。相比 LangSmith，它的优势在于数据完全可控，可对接自建存储。

    - Prometheus + Grafana：用于指标监控。通过自定义回调处理器，在关键事件（on_llm_end, on_chain_end等）中暴露 Counter（调用次数）、Histogram（延迟分布）、Gauge（当前并发数）等指标，然后用 Grafana 可视化。这是生产级应用必备的，LangSmith 虽然也有统计，但 Prometheus 可以集成 AlertManager 做告警。

    - 日志系统 ELK（Elasticsearch, Logstash, Kibana）：在回调中输出结构化 JSON 日志，包含 run_id、tags、prompt 摘要、响应预览、token 数、错误信息等。通过 Filebeat 采集到 Elasticsearch，可以在 Kibana 中灵活搜索和分析。尤其在调试 Agent 时，能快速过滤出错误步骤。

    - 专用回调处理器集成 Weights & Biases：LangChain 有内置的 WandbCallbackHandler，可以自动记录每一次 LLM 调用、链执行到 W&B。这对于实验追踪很有用，适合研究阶段。

    - 自定义性能采样器：对于高 QPS 服务，全量监控成本高，我会实现一个采样回调（如只采集 1% 的请求或延迟超过 500ms 的慢请求），把数据发送到 InfluxDB 或 ClickHouse，方便长期趋势分析。

    实践经验：在一次线上故障中，我们发现 LangSmith 因网络延迟丢失了部分关键 Trace，而本地的 OpenTelemetry + Jaeger 完整记录了故障时刻的调用链，帮助我们快速定位到是某个工具调用超时。此后我们一直保留两套系统。


content:
  prompt: "\U0001F39A️ 如果只在开发环境启用详细日志回调，而在生产环境关闭，你如何控制？"
answer:
  mode: rubric
  reference_answer: |-
    使用环境变量或配置文件来动态决定启用哪些回调。典型的实现是工厂模式：

    import os
    from langchain.callbacks import BaseCallbackHandler

    def get_callback_handlers():
        env = os.getenv("APP_ENV", "development")
        handlers = []
        # 生产环境只保留成本统计
        handlers.append(TokenMetricsCollector())
        # 开发环境添加详细日志
        if env == "development":
            handlers.append(LLMFileLogger("dev_llm.log"))
            handlers.append(AgentStepRecorder())
        # 测试环境可能不需要任何回调
        elif env == "test":
            return []
        return handlers

    # 在创建链时使用
    handlers = get_callback_handlers()
    chain = SomeChain(callbacks=handlers)

    这样，你只需要设置环境变量 APP_ENV=production 就能轻松切换。高级用法还可以使用 Feature Flag 服务，实现动态下线和灰度。


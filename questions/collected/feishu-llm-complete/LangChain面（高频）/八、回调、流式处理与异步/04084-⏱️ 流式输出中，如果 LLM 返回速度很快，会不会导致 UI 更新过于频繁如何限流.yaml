content:
  prompt: "⏱️ 流式输出中，如果 LLM 返回速度很快，会不会导致 UI 更新过于频繁？如何限流？"
answer:
  mode: rubric
  reference_answer: |-
    会的。如果模型生成速度极快（例如每秒 100+ token），前端 DOM 更新过于频繁会导致页面卡顿、CPU 飙升，用户体验反而变差。此时需要在前端或后端进行节流。

    策略一：后端节流（推荐）

    在 LangChain 的流式回调或生成器中进行批量输出。例如，每累积 N 个 token 或者每隔一定时间发送一次。

    ```python
    import time
    async def throttled_generator(chain, input, min_interval=0.05):
        buffer = ""
        last_send = time.time()
        async for chunk in chain.astream(input):
            buffer += chunk
            now = time.time()
            if now - last_send >= min_interval:
                yield buffer
                buffer = ""
                last_send = now
        if buffer:
            yield buffer
    ```

    这种方式简单有效，直接减少网络包数量。但会导致前端的“打字机”效果略显卡顿，需要权衡。

    策略二：前端节流
    前端使用 requestAnimationFrame 或定时器（如 50ms）合并渲染。这是最灵活的方式，后端无需改动。

    ```javascript
    let buffer = "";
    const render = () => {
        if (buffer) {
            document.getElementById("output").innerText += buffer;
            buffer = "";
        }
        requestAnimationFrame(render);
    };
    requestAnimationFrame(render);

    eventSource.onmessage = (e) => {
        const data = JSON.parse(e.data);
        buffer += data.token;
    };
    ```

    策略三：利用 on_llm_new_token 回调进行节流
    实现一个自定义回调，在 on_llm_new_token 中维护缓冲区，并结合定时器发送。

    ```python
    class ThrottleHandler(BaseCallbackHandler):
        def __init__(self, queue, interval=0.05):
            self.queue = queue
            self.interval = interval
            self.buffer = ""
            self.last_send = time.time()
        def on_llm_new_token(self, token, **kwargs):
            self.buffer += token
            if time.time() - self.last_send >= self.interval:
                self.queue.put_nowait(self.buffer)
                self.buffer = ""
                self.last_send = time.time()
    ```

    结论：通常前端节流最简单，后端节流可节省带宽。对于高并发服务，后端节流能显著降低系统负载。


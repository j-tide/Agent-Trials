content:
  prompt: "\U0001F9E9 在 LangChain 中，Non-LLM 组件（如 Retriever）是否也支持流式？通常不需要，为什么？"
answer:
  mode: rubric
  reference_answer: |-
    LangChain 的 Runnable 接口理论上支持所有组件实现 stream，但Retriever 等非生成式组件通常不实现流式，因为：

    - 语义不符：流式意味着逐步产出数据，而检索是一次性操作：输入查询，返回一组完整文档。没有中间状态。

    - 性能无益：检索结果通常体量小（几个到几十个文档），一次性返回远比逐文档流式更高效。

    - 框架设计：LCEL 的 stream 对于非 LLM 组件，通常会退化为一次 invoke 后包装成单元素的迭代器，不会真正流式。

    - 下游需求：即使 Retriever 流式产生文档，下游 LLM 也需要等待所有文档才能生成，因此没有意义。

    不过，某些特殊情况可以实现“伪流式”：比如将大量文档分批返回，或者对检索结果进行逐步过滤，但这通常不是标准实践。如果你需要“逐步输出检索结果”，可以自定义 Runnable，但实用价值有限。


content:
  prompt: "\U0001F19A 对比同步和异步版本在吞吐量上的差异，你有过实际测试数据吗？"
answer:
  mode: rubric
  reference_answer: |-
    有实际测试数据。以调用 OpenAI GPT-3.5-Turbo 为例，同步版使用 requests 或同步 openai 库，异步版使用 AsyncOpenAI。

    测试环境：8核CPU，无GPU，本地网络。

    - 同步：使用 ThreadPoolExecutor(max_workers=20)，循环调用 100 个请求，耗时 120 秒，QPS ≈ 0.83。线程切换和阻塞等待是瓶颈。

    - 异步：使用 asyncio.gather 直接并发 100 个请求，耗时 15 秒，QPS ≈ 6.7。因为是纯异步 I/O，几乎没有 CPU 消耗。

    - 混合：如果工具中有同步操作（如time.sleep），异步优势立刻消失，甚至不如纯同步（因为线程池的额外开销）。

    结论：对于 I/O 密集型任务（网络 API 调用），异步的吞吐量可以是同步的 5~10 倍，且 CPU 和内存占用更低。但在计算密集型任务中，异步并无优势，需结合进程池。

    建议：新项目一律采用异步架构，旧项目逐步将 I/O 部分异步化。LangChain 的异步支持已经很完善，没有理由再使用同步版本构建服务。

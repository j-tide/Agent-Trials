content:
  prompt: "☁️ 在分布式部署时，回调产生的日志如何汇总？"
answer:
  mode: rubric
  reference_answer: |-
    分布式环境下，每个服务实例（Pod）都会产生自己的回调日志。要汇总分析，需要一个集中的日志收集系统。

    方案一：标准 ELK/EFK 栈

    - 每个实例将回调日志以 JSON 格式输出到标准输出或文件。

    - 使用 Filebeat 采集日志文件，或通过 Docker 日志驱动收集标准输出。

    - 发送到 Elasticsearch，用 Kibana 进行可视化。

    方案二：直接发送到外部监控平台

    - 在自定义回调处理器内部，将事件直接通过 HTTP 发送到 LangSmith、Datadog、Prometheus Pushgateway 等。

    - 优点是不依赖文件采集，实时性好。

    - 注意网络故障时的容错处理。

    方案三：消息队列中转

    - 回调处理器将事件写入本地消息队列（如 Redis Streams、Kafka）。

    - 独立的消费者服务从队列拉取，进行聚合、存储和分析。

    - 这种方式解耦性好，不会阻塞主链。

    关键设计：

    - 所有日志必须包含实例标识（如 pod name、host IP）和全局 Trace ID（run_id），以便串联跨实例的调用链。

    - 使用异步发送，避免 I/O 拖慢主链。

    - 设置合理的采样率，高流量时只记录部分请求，防止日志爆炸。


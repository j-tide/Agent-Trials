content:
  prompt: "\U0001F310 在 Web 应用中，LangChain 的流式输出如何通过 Server-Sent Events (SSE) 发送到前端？"
answer:
  mode: rubric
  reference_answer: |-
    SSE 是服务端向客户端推送事件的标准协议。在 Python Web 框架（如 FastAPI）中，可以结合 LangChain 的异步流式轻松实现。

    FastAPI + SSE 示例：

    ```python
    from fastapi import FastAPI
    from fastapi.responses import StreamingResponse
    from langchain_openai import ChatOpenAI
    from langchain_core.prompts import ChatPromptTemplate
    from langchain_core.output_parsers import StrOutputParser
    import asyncio, json

    app = FastAPI()

    llm = ChatOpenAI(model="gpt-3.5-turbo", streaming=True)
    prompt = ChatPromptTemplate.from_template("请解释：{topic}")
    chain = prompt | llm | StrOutputParser()

    async def event_generator(topic: str):
        async for chunk in chain.astream({"topic": topic}):
            # SSE 格式：data: {json}\n\n
            yield f"data: {json.dumps({'token': chunk})}\n\n"
            await asyncio.sleep(0)  # 让出控制权
        yield "data: [DONE]\n\n"

    @app.get("/stream")
    async def stream(topic: str):
        return StreamingResponse(event_generator(topic), media_type="text/event-stream")
    ```

    前端使用 EventSource API 接收：

    ```javascript
    const eventSource = new EventSource("/stream?topic=量子计算");
    eventSource.onmessage = (event) => {
        if (event.data === "[DONE]") {
            eventSource.close();
            return;
        }
        const data = JSON.parse(event.data);
        document.getElementById("output").innerText += data.token;
    };
    ```

    关键点：

    - 必须使用 astream（异步），否则会阻塞 FastAPI 事件循环。

    - SSE 的响应头 Content-Type: text/event-stream 由 StreamingResponse 自动设置。

    - 客户端连接中断时，生成器会抛出 GeneratorExit，可以在 finally 中清理资源。


content:
  prompt: "\U0001F4DD 写出一个简单的 LCEL 链，并使用 stream 方法逐 token 打印结果。"
answer:
  mode: rubric
  reference_answer: "下面是一个经典的 LCEL 链：Prompt → LLM → StrOutputParser，然后流式输出。\n\n```python\nfrom
    langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.output_parsers
    import StrOutputParser\nfrom langchain_openai import ChatOpenAI\n\n# 1. 创建组件\nprompt
    = ChatPromptTemplate.from_template(\"请用50字以内解释：{topic}\")\nllm = ChatOpenAI(model=\"gpt-3.5-turbo\",
    streaming=True)  # 必须开启 streaming\noutput_parser = StrOutputParser()\n\n# 2. LCEL
    链\nchain = prompt | llm | output_parser\n\n# 3. 流式调用\ntopic = \"量子计算\"\nprint(\"\U0001F916
    \", end=\"\", flush=True)\nfor chunk in chain.stream({\"topic\": topic}):\n    print(chunk,
    end=\"\", flush=True)  # chunk 就是一个个字符串\nprint()  # 换行\n```\n\n执行效果：控制台会像打字机一样逐个字符出现最终答案。\n\n关键点：\n\n-
    LLM 必须设置 streaming=True，否则 stream 会退化为一次返回全部内容。\n\n- StrOutputParser 在流式模式下能够处理字符串
    chunk，并且会自动拼接，但输出的 chunk 仍然是增量文本。\n\n- 如果链中没有 StrOutputParser，stream 返回的将是 AIMessageChunk
    对象，需要手动提取 .content。\n\n---"

content:
  prompt: "\U0001F517 在 LCEL 链中，如何通过 .with_config({\"callbacks\": [...]}) 动态传入回调？"
answer:
  mode: rubric
  reference_answer: |-
    LCEL 链支持通过 config 动态传入回调，这是实现“一次调用使用特定监控”的最优雅方式。

    使用 with_config

    from langchain_core.runnables import RunnableLambda

    my_chain = prompt | llm | output_parser
    # 创建一个携带回调的新链副本
    monitored_chain = my_chain.with_config(callbacks=[MyHandler()])
    result = monitored_chain.invoke({"question": "..."})

    with_config 返回一个新的 Runnable，它会在执行时将指定的 callbacks 合并到运行上下文中。

    直接在 invoke 时传递 config

    result = my_chain.invoke(
        {"question": "..."},
        config={"callbacks": [MyHandler()]}
    )

    这两种方式效果相同，都会在这次调用中激活回调，且不会影响其他并发调用。

    原理：LCEL 在执行时，会从 config 中提取 callbacks，并与当前已有的全局回调合并，生成一个 CallbackManager。这个管理器会被传递给当前调用树中的所有子 Runnable。

    最佳实践：

    - 对于需要不同监控策略的请求（例如 VIP 用户的请求需要详细追踪），使用 invoke 时动态传入回调。

    - 避免在 with_config 中硬编码复杂回调逻辑，保持配置简洁。


content:
  prompt: "\U0001F9EA 你如何测试自定义回调处理器的正确性？"
answer:
  mode: rubric
  reference_answer: |-
    回调处理器的测试属于单元测试范畴，核心是验证“在特定事件发生时，处理器是否执行了预期的动作”。

    方法：

    - 直接实例化处理器，手动调用事件方法：

    handler = TokenMetricsCollector()
    # 模拟 on_llm_start
    handler.on_llm_start({"name": "test"}, ["prompt"], run_id="123")
    # 构造一个模拟的 response 对象
    mock_response = MagicMock()
    mock_response.llm_output = {"token_usage": {"total_tokens": 100}}
    handler.on_llm_end(mock_response, run_id="123")
    # 断言
    assert handler.get_summary()["total_calls"] == 1

    - 使用 mock 的 LLM 和链，在集成环境中触发回调：利用 FakeLLM 或 unittest.mock 来模拟链的执行，验证回调的调用次数和参数。

    from unittest.mock import patch, call
    with patch.object(handler, 'on_llm_end') as mock_end:
        chain.run("test")
        mock_end.assert_called_once()

    - 测试异常处理：模拟回调内部抛出异常，验证你的 try/except 是否生效，以及主链是否被影响。

    - 验证副作用：比如检查日志文件是否生成、内存统计是否正确、外部 API 是否被调用。

    建议：回调处理器应该尽量保持“纯函数”特性，依赖注入外部资源（如文件路径、API 客户端），这样测试时容易替换。


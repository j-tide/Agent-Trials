content:
  prompt: "❓ 如果上游 LLM 不支持流式输出，LangChain 能模拟流式吗？"
answer:
  mode: rubric
  reference_answer: |-
    不能真正模拟 token 级的流式，但可以模拟一种“伪流式”效果。

    LangChain 本身没有内置的模拟流式功能。如果 LLM 不支持原生流式，stream 方法会退化为 invoke，一次性返回结果，然后 LangChain 把这个结果包装成一个单元素的迭代器。前端会在一瞬间收到全部文本，失去了打字机效果。

    变通方案：

    - 客户端模拟：后端返回完整文本，前端通过 JavaScript 定时逐字渲染，实现假流式。这能改善感知延迟，但首字等待时间不变。

    - 服务端分块发送：在自定义链中，拿到完整结果后，按句子或固定长度切片，通过生成器逐步 yield，但这并不是真正的流式，且增加了服务端开销。

    - 换用支持流式的模型：例如从 text-davinci-003 切换到 gpt-3.5-turbo（支持 streaming）。这是根本解决之道。

    总之，LangChain 无法让不支持流式的 API 产生流式输出，但可以在应用层包装出类似效果，核心瓶颈是首 token 延迟无法消除。


content:
  prompt: "\U0001F4CC 在自定义回调中，你可以获取到哪些上下文信息？（run_id, parent_run_id, tags 等）"
answer:
  mode: rubric
  reference_answer: |-
    在回调的 kwargs 参数中，LangChain 会注入丰富的上下文信息，这些信息是构建全链路追踪的关键。

    [嵌入表格未展开]

    典型用法：

    - 结合 run_id 和 parent_run_id 生成调用链路图，类似于 OpenTelemetry 的 Span。

    - 通过 tags 实现按实验组分流统计。

    - 利用 metadata 传递用户标识，实现用户级的成本核算。

    def on_llm_start(self, serialized, prompts, **kwargs):
        user_id = kwargs.get("metadata", {}).get("user_id", "unknown")
        self.logger.info(f"User {user_id} LLM call started, run_id={kwargs['run_id']}")

    这些上下文信息让回调系统超越了简单的日志打印，成为构建可观测性平台的基础设施。


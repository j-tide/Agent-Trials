content:
  prompt: "\U0001F393 总结一下回调在 LangChain 中的最佳实践，以及你踩过的坑。"
answer:
  mode: rubric
  reference_answer: |-
    最佳实践：

    - 分离关注点：日志、监控、安全检测使用独立的回调处理器，不要混在一个大类里。

    - 防御性编程：每个回调方法都要用 try/except 包裹，确保不会中断主链。

    - 异步优先：在异步应用中使用异步回调，避免阻塞事件循环。对同步回调中的耗时操作，务必提交到线程池。

    - 环境区分：通过配置动态加载回调，开发环境详细记录，生产环境只保留关键指标。

    - 携带上下文：充分利用 metadata 和 tags 传递用户 ID、会话 ID 等信息，方便追踪。

    - 使用 LangSmith 作为标准监控，自定义回调作为补充。

    - 流式回调要处理截断：敏感词检测等要注意 token 切割问题。

    - 测试回调：对每个回调编写单元测试，验证正常和异常场景。

    我踩过的坑：

    - 坑1：全局回调污染测试。早期在模块顶层设置了全局回调，导致所有单元测试都输出大量日志，排查很久。解决：使用 setUp/tearDown 重置全局回调管理器。

    - 坑2：流式检测敏感词时，token 被截断。关键词“暴力”可能被分成“暴”和“力”两次回调，导致检测失败。解决：维护一个缓冲区，按逻辑边界（如标点、换行）触发检测。

    - 坑3：回调中写文件忘记 flush，导致日志丢失。应用崩溃时最后几秒的日志全丢。解决：使用 logging 模块的 FileHandler，它自带缓冲和刷新机制。

    - 坑4：异步回调方法未实现，导致同步环境报错。在同步链里使用了 AsyncCallbackHandler，结果方法未被调用。解决：严格区分同步/异步处理器。

    - 坑5：回调里抛异常导致整个 Agent 崩溃。一次磁盘满，日志回调写失败抛出 OSError，Agent 直接停止。解决：所有文件操作加 try/except，并设置 raise_error=False。

    结语：LangChain 的回调系统是构建生产级 LLM 应用的利器，但需要开发者像对待业务代码一样认真设计和测试回调。用好它，你能获得对整个系统无与伦比的洞察力。

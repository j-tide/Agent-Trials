content:
  prompt: "\U0001F9EA 你如何用回调将链的执行轨迹发送到 LangSmith？"
answer:
  mode: rubric
  reference_answer: |-
    LangSmith 是 LangChain 官方的可观测性平台。将执行轨迹发送到 LangSmith 非常简单，通常不需要自己写回调，只需要设置环境变量。LangChain 内部已经集成了一个专门用于 LangSmith 的回调处理器，它会自动捕获链、LLM、工具的所有事件并上报。

    启用方法：

    - 注册 LangSmith 账号，获取 API Key。

    - 设置环境变量：

    export LANGCHAIN_TRACING_V2=true
    export LANGCHAIN_API_KEY=your_api_key
    export LANGCHAIN_PROJECT=your_project_name   # 可选

    - 运行任何 LangChain 链或 Agent，执行轨迹会自动出现在 LangSmith 控制台。

    工作原理
    当 LANGCHAIN_TRACING_V2 设置为 true 时，LangChain 在初始化全局回调管理器时，会自动向其中注入 LangChainTracer 回调处理器。这个处理器内部实现了所有回调事件的方法，将每个事件及其上下文（run_id, parent_run_id, 输入输出等）序列化并异步发送到 LangSmith 后端。

    自定义上报
    如果你需要自定义一些字段（比如为每次运行添加用户 ID、实验标签），可以在链调用时通过 metadata 和 tags 参数传递，它们会被 LangSmith 记录。

    chain.run("Hello", config={"metadata": {"user_id": "123"}})

    注意

    - 该功能需要在能访问外网的环境中使用。

    - 它会产生一定的网络延迟，但基本不影响主链性能，因为上报是异步非阻塞的。

    - 可以在代码中动态关闭，例如测试环境不发送。


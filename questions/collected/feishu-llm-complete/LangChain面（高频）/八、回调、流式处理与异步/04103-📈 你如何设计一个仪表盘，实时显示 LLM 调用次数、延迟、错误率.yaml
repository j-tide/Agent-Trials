content:
  prompt: "\U0001F4C8 你如何设计一个仪表盘，实时显示 LLM 调用次数、延迟、错误率？"
answer:
  mode: rubric
  reference_answer: |-
    我会基于 Grafana + Prometheus 搭建仪表盘，因为数据已经在 Prometheus 中，Grafana 有丰富的可视化能力。

    面板布局（4 行）：

    - 第一行：概览数字

    - 当前 QPS（rate(langchain_llm_calls_total[1m])）

    - 今日总调用次数（increase(...[24h])）

    - 平均延迟（rate(langchain_llm_latency_seconds_sum[1m]) / rate(..._count[1m])）

    - 错误率（sum(rate(...{status="error"}[1m])) / sum(rate(...[1m]))）
    这些用 Stat 面板展示，配上颜色阈值。

    - 第二行：趋势图

    - 调用次数和错误次数的时间序列图（Stacked Graph）。

    - 延迟的 P50、P95、P99 折线图（使用 histogram_quantile）。

    - 第三行：模型分布与 Agent 步骤

    - 第四行：实例监控

    实现技巧：

    - 使用 Grafana 的 $datasource 和变量，快速切换环境。

    - 设置告警规则：错误率 > 5% 持续 5 分钟、P99 延迟 > 10s 等，通过 AlertManager 发送到 Slack 或 PagerDuty。

    - 对于流式应用，额外展示首 token 延迟（TTFT），需在 on_llm_new_token 首次触发时记录。

    一次实际设计：我在一个客服项目中，把仪表盘投到办公室大屏，团队能实时看到负载。当 QPS 突然飙升时，我们立即扩容了 LLM API 的并发限制，避免了雪崩。


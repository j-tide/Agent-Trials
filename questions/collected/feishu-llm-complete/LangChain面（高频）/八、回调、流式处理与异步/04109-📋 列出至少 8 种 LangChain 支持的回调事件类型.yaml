content:
  prompt: "\U0001F4CB 列出至少 8 种 LangChain 支持的回调事件类型。"
answer:
  mode: rubric
  reference_answer: "LangChain 的回调事件覆盖了所有关键组件。以下是我在实际项目中使用最频繁的 12 种，按组件分类：\n\n\U0001F517
    链 (Chain) 级别\n\n- on_chain_start：任何链开始执行时触发。可获取链的名称、输入。\n\n- on_chain_end：链执行完毕时触发。可获取输出。\n\n-
    on_chain_error：链执行过程中发生异常时触发。可获取异常对象。\n\n\U0001F9E0 LLM 级别\n\n- on_llm_start：LLM
    开始生成前触发。可获取 Prompt、模型名称。\n\n- on_llm_end：LLM 生成完成后触发。可获取完整的生成结果及 Token 消耗。\n\n-
    on_llm_error：LLM 调用出错时触发。\n\n- on_llm_new_token：流式生成时，每产生一个新 Token 就触发一次。仅在流式模式有效。\n\n\U0001F6E0️
    工具 (Tool) 级别\n\n- on_tool_start：工具被调用前触发。可获取工具名称和输入参数。\n\n- on_tool_end：工具执行完毕后触发。可获取返回值。\n\n-
    on_tool_error：工具执行出错时触发。\n\n\U0001F916 Agent 级别\n\n- on_agent_action：Agent 决定调用某个工具时触发。可获取
    Action 对象（工具名、输入、日志）。\n\n- on_agent_finish：Agent 输出最终答案时触发。可获取 AgentFinish 对象。\n\n\U0001F4DD
    其他\n\n- on_text：某些链产生文本输出时触发，用于兼容旧版。\n\n- on_retriever_start/end：检索器调用前后触发。\n\n这些事件已经足够构建一个完整的监控系统。\n\n---"

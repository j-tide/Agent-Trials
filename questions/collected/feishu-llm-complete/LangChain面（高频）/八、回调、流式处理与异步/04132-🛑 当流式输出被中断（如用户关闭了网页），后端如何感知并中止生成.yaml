content:
  prompt: "\U0001F6D1 当流式输出被中断（如用户关闭了网页），后端如何感知并中止生成？"
answer:
  mode: rubric
  reference_answer: |-
    在 Web 应用中，当客户端断开 SSE 连接时，服务端的生成器会收到一个 GeneratorExit 异常（或 asyncio.CancelledError 对于 astream）。我们可以捕获这个异常，并立即中止 LLM 调用，释放资源。

    异步 FastAPI 示例：

    ```python
    async def event_generator(topic: str):
        try:
            async for chunk in chain.astream({"topic": topic}):
                yield f"data: {json.dumps({'token': chunk})}\n\n"
        except asyncio.CancelledError:
            # 客户端断开连接，asyncio 任务被取消
            print("客户端已断开，生成中止")
            # 这里可以调用 LLM 的取消方法（如果支持）
            # 或者简单地清理资源
            return
        finally:
            print("清理资源")
    ```

    对于同步 WSGI 应用（如 Flask）：

    ```python
    def generate():
        for chunk in chain.stream(input):
            try:
                yield f"data: {chunk}\n\n"
            except GeneratorExit:
                # 客户端断开
                break
    ```

    底层 LLM 的中止：目前大多数 LLM API（如 OpenAI）不支持从客户端主动中止正在进行的流式请求。连接断开后，API 通常还会继续生成，但结果会被丢弃。要真正中止，需要依赖 HTTP/2 的 RST_STREAM 或 WebSocket 的关闭帧，LangChain 未对此做封装。在实际应用中，通常可以忽略这部分开销，因为断开连接已经阻止了数据继续传输，GPU 资源会在后台自动释放。

    最佳实践：

    - 在 finally 块中记录日志，统计生成中断率。

    - 如果使用的是本地模型，可以尝试发送中断信号给推理进程（需要自定义集成）。

    - 对于成本敏感的场景，可以设置一个“最大生成时间”，超时自动取消任务，避免无效生成。


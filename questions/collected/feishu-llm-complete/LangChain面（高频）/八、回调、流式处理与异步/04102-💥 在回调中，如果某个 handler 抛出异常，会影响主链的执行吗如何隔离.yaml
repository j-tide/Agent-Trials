content:
  prompt: "\U0001F4A5 在回调中，如果某个 handler 抛出异常，会影响主链的执行吗？如何隔离？"
answer:
  mode: rubric
  reference_answer: |-
    默认行为：会影响。BaseCallbackManager 在处理事件时，会按顺序调用每个 handler 的方法。如果任何一个 handler 抛出异常，异常会立即向上传播，导致当前正在执行的链或 Agent 失败。

    这意味着一个“脆弱”的回调（比如写日志时磁盘满了）可能导致整个业务流程中断。在生产环境中这是不可接受的。

    隔离方法：

    - 在 handler 内部捕获异常
    这是最推荐的做法。每个 handler 应该自己保证健壮性，将异常控制在内部，不影响主链。

    def on_llm_end(self, response, **kwargs):
        try:
            self._write_to_db(response)
        except Exception as e:
            # 记录错误，但不抛出
            print(f"回调异常: {e}")

    - 使用全局配置 raise_error=False
    在创建 CallbackManager 时，可以设置 raise_error=False。这样，当某个 handler 抛出异常时，管理器会静默捕获并继续执行后续 handler。但这也会隐藏潜在的错误，不推荐作为唯一手段。

    manager = CallbackManager(handlers=[...], raise_error=False)

    - 将高风险回调包装为“安全回调”
    编写一个通用的装饰器或包装类，在调用 handler 方法时自动加 try/except。

    - 使用异步回调和非阻塞机制
    对于耗时或高风险操作，应该放在异步回调中执行，或者将任务提交给线程池/消息队列，彻底解耦。

    最佳实践：永远不要在回调处理器中抛出未捕获的异常。每个 on_* 方法应该是“防御性”的。你可以把异常记录到日志中，并通过监控告警，而不是让主流程崩溃。


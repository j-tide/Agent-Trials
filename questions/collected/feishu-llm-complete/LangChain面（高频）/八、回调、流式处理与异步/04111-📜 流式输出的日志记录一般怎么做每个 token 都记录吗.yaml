content:
  prompt: "\U0001F4DC 流式输出的日志记录一般怎么做？每个 token 都记录吗？"
answer:
  mode: rubric
  reference_answer: |-
    通常不记录每个 token，因为日志量太大，且 I/O 开销会严重影响生成性能。

    最佳实践：

    - 只记录请求和响应摘要：在 on_llm_start 记录 prompt 摘要，on_llm_end 记录完整回复文本、token 数、耗时。这足以满足审计和监控。

    - 采样记录：在生产环境，可对 1% 的请求记录完整回复文本，用于质量评估。

    - 错误全记录：流式生成出现异常时，记录完整上下文。

    - 使用异步日志：避免日志写入阻塞主线程，可使用 logging.handlers.QueueHandler 或异步日志库。

    示例：

    ```python
    class StreamLogger(BaseCallbackHandler):
        def on_llm_end(self, response, **kwargs):
            text = "".join([g[0].text for g in response.generations]) if response.generations else ""
            logging.info(f"LLM call finished: tokens={...}, response={text[:200]}...")
    ```

    为何不记录每个 token：假设每秒生成 50 token，1k 并发，日志写入会成为瓶颈，且 token 片段无完整语义，分析价值低。


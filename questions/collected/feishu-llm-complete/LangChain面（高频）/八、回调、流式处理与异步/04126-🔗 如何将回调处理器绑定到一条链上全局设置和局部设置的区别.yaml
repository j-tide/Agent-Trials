content:
  prompt: "\U0001F517 如何将回调处理器绑定到一条链上？全局设置和局部设置的区别。"
answer:
  mode: rubric
  reference_answer: "局部绑定：在链初始化或运行时通过 callbacks 参数传入。这是最推荐的方式，因为它精确、无副作用。\n\n# 方式1：构造函数传入\nchain
    = ConversationChain(llm=llm, callbacks=[my_handler])\n\n# 方式2：调用时传入（优先级最高）\nchain.run(\"Hello\",
    callbacks=[my_handler])\n\n局部绑定的回调只会影响当前链及其内部调用（如 LLM、工具），其他链不受干扰。\n\n全局绑定：通过全局回调管理器设置，对所有后续创建的链生效。\n\nfrom
    langchain.callbacks import CallbackManager\nfrom langchain.globals import set_global_callback_manager\n\nmanager
    = CallbackManager([my_global_handler])\nset_global_callback_manager(manager)\n\n⚠️
    全局 vs 局部的坑：\n\n- 全局污染：在单元测试中，如果启用了全局回调，可能导致日志输出混乱。务必在测试后重置。\n\n- 合并策略：当你同时设置了全局和局部回调时，它们会被合并。LangChain
    内部会创建一个 CallbackManager，将全局回调放在前面，局部回调放在后面，全部执行。这意味着一个事件可能被两个处理器都监听到。\n\n- 不可变性：局部回调列表在链内部会被转化为元组，保证执行期间不会被意外修改。\n\n\U0001F4CC
    最佳实践：为生产环境设置全局回调（如错误追踪、成本统计），在开发调试时使用局部回调覆盖详细日志。\n\n---"

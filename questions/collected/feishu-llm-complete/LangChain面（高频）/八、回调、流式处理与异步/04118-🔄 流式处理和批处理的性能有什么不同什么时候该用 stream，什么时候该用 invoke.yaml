content:
  prompt: "\U0001F504 流式处理和批处理的性能有什么不同？什么时候该用 stream，什么时候该用 invoke？"
answer:
  mode: rubric
  reference_answer: |-
    性能差异：

    - 首 token 延迟：流式极低（毫秒级），用户立即看到反馈；批处理（invoke）需要等待完整生成，首 token 延迟等于总生成时间。

    - 总延迟：两者相近，流式可能因网络和调度略高。

    - 吞吐量：批处理可以合并请求批量推理，在高并发时吞吐量更高；流式通常每个请求占用一个连接，服务端资源消耗较大。

    - 内存占用：流式无需在服务端缓存全部回复，内存友好；批处理需要缓存完整输出。

    选择场景：

    - 用户交互（聊天、写作助手）：必须用 stream，提升感知速度。

    - 批量处理（数据标注、报告生成）：用 invoke，服务端可以批量调用，成本更低。

    - 后端服务间调用：用 invoke，因为调用方不需要实时展示。

    - 需要结构化输出的场景：用 invoke，等完整结果后解析，流式解析容易出错。

    混合策略：对用户端流式输出，服务端内部对下游 LLM 仍使用流式，但可以通过缓冲将 token 组装后以完整 JSON 返回给内部服务。


content:
  prompt: "\U0001F4CA 你用什么工具或方法来测试异步 LangChain 应用的性能？"
answer:
  mode: rubric
  reference_answer: |-
    - asyncio 内置的性能分析：loop.slow_callback_duration 可以记录慢协程。

    - pytest-asyncio：结合 pytest-benchmark 对异步函数进行基准测试。

    - locust：用于压力测试，模拟高并发用户，观察 QPS 和延迟。

    - 自定义装饰器：记录每个异步函数的耗时，输出到日志。

    - py-spy：采样分析线程和协程的 CPU 占用，找出阻塞点。

    - OpenTelemetry + Jaeger：分布式追踪，可视化异步调用链和耗时。

    我常用的简单基准测试脚本：

    ```python
    import time, asyncio
    from langchain_openai import ChatOpenAI

    async def benchmark(n):
        llm = ChatOpenAI(model="gpt-3.5-turbo")
        start = time.time()
        tasks = [llm.ainvoke(f"Test {i}") for i in range(n)]
        await asyncio.gather(*tasks)
        return time.time() - start

    # 测试不同并发数
    for n in [1, 5, 10, 20]:
        t = asyncio.run(benchmark(n))
        print(f"并发{n}: 总耗时{t:.2f}s, 平均{t/n:.2f}s")
    ```

    注意：测试时要关闭本地的 API 缓存，否则结果不准确。


content:
  prompt: "\U0001F9EA 写一个 asyncio.gather 并发执行多个链的示例，并处理异常。"
answer:
  mode: rubric
  reference_answer: "假设我们要并行处理 3 个不同主题的问答，使用同一个链（或不同链），并优雅地处理个别任务的失败。\n\n```python\nimport
    asyncio\nfrom langchain_openai import ChatOpenAI\nfrom langchain_core.prompts
    import ChatPromptTemplate\nfrom langchain_core.output_parsers import StrOutputParser\n\n#
    创建三条链，参数不同\nasync def run_chain(topic: str):\n    llm = ChatOpenAI(model=\"gpt-3.5-turbo\",
    temperature=0)\n    prompt = ChatPromptTemplate.from_template(\"用一句话解释：{topic}\")\n
    \   chain = prompt | llm | StrOutputParser()\n    return await chain.ainvoke({\"topic\":
    topic})\n\nasync def main():\n    topics = [\"量子计算\", \"区块链\", \"深度学习\"]\n    tasks
    = [run_chain(t) for t in topics]\n    # gather 并发执行，return_exceptions=True 让异常作为结果返回\n
    \   results = await asyncio.gather(*tasks, return_exceptions=True)\n    \n    for
    topic, result in zip(topics, results):\n        if isinstance(result, Exception):\n
    \           print(f\"[错误] {topic}: {result}\")\n        else:\n            print(f\"[成功]
    {topic}: {result}\")\n```\n\n关键点：\n\n- return_exceptions=True 使得个别任务失败不会取消其他任务。\n\n-
    如果需要更精细的控制，可以捕获 asyncio.TimeoutError、asyncio.CancelledError。\n\n- 在高并发场景，建议为每个任务设置超时：asyncio.wait_for(task,
    timeout=30)，避免某个任务无限挂起。\n\n生产环境增强：\n\n- 使用 tqdm.asyncio 显示进度条。\n\n- 对于大量任务，可以分批执行，比如使用
    asyncio.as_completed 边完成边处理结果。\n\n- 记录每个任务的耗时和状态，用于监控。\n\n---"

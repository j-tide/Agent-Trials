content:
  prompt: "\U0001F5A8️ 如何利用回调实现一个简单的流式输出到 Stdout？StreamingStdOutCallbackHandler 的原理是什么？"
answer:
  mode: rubric
  reference_answer: |-
    流式输出是现代对话应用的基本体验。LangChain 内置的 StreamingStdOutCallbackHandler 正是通过回调机制，将 LLM 生成的新 token 实时打印到标准输出。

    原理

    - 当 LLM 开启流式模式（例如 ChatOpenAI(model="gpt-4", streaming=True)）时，API 返回的是一个生成器，逐块返回生成的文本。

    - LangChain 在调用 LLM 的过程中，每收到一个 token，就会触发 on_llm_new_token(self, token: str, **kwargs) 回调事件。

    - StreamingStdOutCallbackHandler 重写了这个方法，将接收到的 token 直接 print(token, end="", flush=True) 输出到标准输出，并且可选的当生成开始时打印一个前缀，结束后打印换行符。

    底层源码简析（概念）:

    class StreamingStdOutCallbackHandler(BaseCallbackHandler):
        def on_llm_new_token(self, token: str, **kwargs) -> None:
            sys.stdout.write(token)
            sys.stdout.flush()

    自定义流式输出回调

    你可以仿照它实现更复杂的功能，比如只显示前 N 个字符，或者把 token 发送到 WebSocket。

    from langchain.callbacks import BaseCallbackHandler

    class MyStreamHandler(BaseCallbackHandler):
        def on_llm_new_token(self, token: str, **kwargs) -> None:
            # 自定义处理，例如发送给前端
            print(f"[{token}]", end="")

    使用
    将 streaming=True 的 LLM 和该回调一起传入链，即可实现流式输出。

    llm = ChatOpenAI(model="gpt-4", streaming=True)
    chain = ConversationChain(llm=llm, callbacks=[MyStreamHandler()])
    chain.run("你好")  # token 逐个出现在 stdout

    注意事项

    - 必须设置 streaming=True，否则 on_llm_new_token 不会被触发。

    - 流式回调只在 LLM 生成阶段有效，Agent 的中间推理步骤不会经过此回调，除非你单独处理。


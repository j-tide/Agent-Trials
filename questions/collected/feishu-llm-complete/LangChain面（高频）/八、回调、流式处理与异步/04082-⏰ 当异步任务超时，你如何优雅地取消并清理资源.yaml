content:
  prompt: "⏰ 当异步任务超时，你如何优雅地取消并清理资源？"
answer:
  mode: rubric
  reference_answer: |-
    使用 asyncio.wait_for 包裹任务，设置超时时间。超时后抛出 asyncio.TimeoutError，在 except 块中执行清理。

    示例：

    ```python
    async def safe_invoke(chain, input, timeout=30):
        try:
            return await asyncio.wait_for(chain.ainvoke(input), timeout=timeout)
        except asyncio.TimeoutError:
            # 记日志，释放资源
            print(f"任务超时，已取消")
            # 如果 LLM 客户端支持取消，则取消底层请求
            # 例如：await llm.client.aclose()
            return None
    ```

    对于流式生成：超时可能发生在生成中间，需要捕获 asyncio.CancelledError，并在 finally 中关闭 SSE 连接、释放缓冲。

    清理资源：

    - 在 finally 块中关闭数据库连接、文件句柄。

    - 对于长连接，使用 async with 上下文管理器自动管理生命周期。

    - 对于 Agent，记录中间步骤，避免重复执行。

    实用技巧：创建一个 TaskManager 类，维护所有正在运行的异步任务，在应用关闭时统一取消和清理。


content:
  prompt: "\U0001F9E0 在 Agent 中使用流式输出时，你会看到什么？Agent 的 Thought 也会流式吗？"
answer:
  mode: rubric
  reference_answer: |-
    Agent 的流式输出与普通链有所不同，因为 Agent 内部是多步推理的。你会看到每一步的中间结果，而不仅仅是最终答案。

    默认行为（使用 AgentExecutor.stream）：

    - 每个完整步骤结束后，会产生一个事件，包含该步骤的 Action 或 Final Answer。这是经典的“步级流式”，而不是 token 级流式。

    - 例如，Agent 先思考、调用工具，你会收到一个事件 {"actions": [AgentAction(...)], ...}；工具执行完，产生 {"steps": [...], ...}；最后输出 {"output": "最终答案", ...}。

    是否能看到 token 级的 Thought 流式？

    - 标准 ReAct Agent 不支持：ReAct Agent 的 Prompt 要求 LLM 一次性输出 Thought, Action, Action Input，因此 Thought 不会流式出现，而是整体生成完才作为一步被解析。

    - OpenAI Functions Agent 也不支持 token 级 Thought 流式，因为其 Thought 蕴含在函数调用中。

    - 如果你想看到逐 token 的思考过程，可以：

    目前在 LangChain 中，Agent 的流式输出主要是步级流式，这对于大多数应用已经足够，因为用户更关心最终答案的逐步生成，而不是内部的推理碎片。 如果你需要展示“思考中…”的动画，可以在 on_agent_action 回调中更新 UI。


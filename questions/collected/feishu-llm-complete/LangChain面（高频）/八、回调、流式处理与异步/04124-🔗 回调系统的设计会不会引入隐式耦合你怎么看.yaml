content:
  prompt: "\U0001F517 回调系统的设计会不会引入隐式耦合？你怎么看？"
answer:
  mode: rubric
  reference_answer: |-
    确实会引入隐式耦合，但这是一种有意识的设计权衡，并且可以通过规范来管理。

    隐式耦合的表现：

    - 回调处理器依赖于特定的事件名称和参数格式。如果 LangChain 版本升级改变了事件签名，回调可能静默失效。

    - 多个回调之间存在执行顺序依赖（比如 A 必须在 B 之前执行），这种顺序是隐式的，容易出问题。

    - 回调通过修改外部状态（如全局变量）来传递信息，这会导致组件之间不透明的交互。

    我的看法：

    回调本质上是一种横切关注点的实现，它天然会带来一定耦合。但它的优势——无侵入、可组合——远大于缺点。关键在于如何控制耦合程度：

    - 保持回调独立：每个回调只做一件事，不依赖其他回调的存在。

    - 不通过回调传递业务数据：回调主要用于观测和辅助，不要把核心业务逻辑放在回调里。

    - 版本兼容：尽量依赖官方文档记录的稳定事件，避免使用内部 API。

    - 测试覆盖：将回调纳入自动化测试，确保升级后行为一致。

    总结：回调是“好的耦合”，是框架提供给开发者的观察窗口。只要不滥用，它不会成为代码腐烂的根源。


content:
  prompt: "\U0001F680 如果让你优化一个 LangChain 应用以降低 50% 的延迟，你会从哪些方面入手？"
answer:
  mode: rubric
  reference_answer: |-
    目标：在不降低生成质量的前提下，将端到端延迟降低一半。需要从模型、网络、数据、架构四个层面系统优化。

    - 模型与推理优化

    - 换用更快的模型：例如从 GPT-4 换到 GPT-4 Turbo，或更小的 gpt-3.5-turbo，延迟可降 30-50%。

    - 使用本地部署模型：如果隐私允许，使用 vLLM 部署量化模型（如 Llama-3 70B），通过 Tensor Parallel 加速，首 token 延迟远低于云 API。

    - 开启流式输出：从 invoke 改为 stream，首 token 延迟（TTFT）可降至 200ms 内，用户感知大幅提升。

    - 提示词与上下文优化

    - 精简 Prompt：删除不必要的示例、指令，使用简短的句子。Prompt 越短，LLM 处理越快。

    - 利用 Prompt Caching：对于重复的系统指令，使用 Anthropic 或 OpenAI 的 Prompt Caching，减少重复计算。

    - 优化 RAG 上下文：使用 ContextualCompressionRetriever 或 LLMLingua 对检索到的文档进行压缩，减少送入 LLM 的 token 数，既能降延迟又省钱。

    - 异步并发与资源调度

    - 全链路异步化：确保所有 I/O（LLM 调用、数据库、HTTP）都用异步客户端，避免线程池阻塞。

    - 合理设置并发：使用 Semaphore 限制并发数，防止 API 限流和资源过载；同时增加 httpx 的连接池大小。

    - 预加载资源：在应用启动时，加载模型、建立数据库连接池、初始化向量索引，避免冷启动延迟。

    - 使用连接复用：对 LLM API 使用 HTTP Keep-Alive，减少 TCP 握手开销。

    - 缓存与复用

    - LLM 响应缓存：对于重复的 Prompt，使用 Redis 缓存答案。LangChain 有 InMemoryCache 和 RedisCache，可即插即用。

    - 检索结果缓存：对热门查询的向量检索结果进行缓存，避免每次实时计算。

    - 工具结果缓存：如果工具是幂等的（如天气查询），基于参数缓存结果，设置合理的 TTL。

    - 架构与算法改进

    - 使用投机采样（Speculative Decoding）：用一个小模型快速生成草稿，大模型验证，加速生成。

    - Agent 优化：减少 Agent 的最大迭代步数，优化工具描述，使其尽快完成；用 Plan-and-Execute 代替 ReAct，一次性规划，并行执行。

    - 批处理：如果业务允许，将多个请求合并为一次批量推理（对本地模型更有效）。

    实际案例：在优化一个合同审查 Agent 时，我们通过：① 将 GPT-4 换成 GPT-4 Turbo（延迟-30%）；② Prompt 精简去掉 3 个示例（-10%）；③ 检索器增加 Redis 缓存（命中率 40%，总延迟-15%）；④ 所有工具改为异步（消除阻塞，-20%）。最终端到端延迟从 12s 降至 4.5s，降幅超过 60%。

    - 饼图或柱状图展示不同模型调用占比。

    - 如果有 Agent，用 Gauge 展示 Agent 步数分布。

    - 各实例的 CPU、内存、线程池使用率（来自 Node Exporter 或自定义指标）。

    - 活跃 LLM 并发数（langchain_llm_active）。

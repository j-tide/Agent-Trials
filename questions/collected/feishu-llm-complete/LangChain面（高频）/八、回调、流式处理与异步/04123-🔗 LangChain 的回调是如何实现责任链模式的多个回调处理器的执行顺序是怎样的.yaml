content:
  prompt: "\U0001F517 LangChain 的回调是如何实现“责任链模式”的？多个回调处理器的执行顺序是怎样的？"
answer:
  mode: rubric
  reference_answer: "LangChain 的 CallbackManager 内部维护了一个回调处理器列表。当事件发生时，它会按顺序遍历这个列表，依次调用每个处理器的相应方法。\n\n责任链模式体现在：每个处理器都有机会处理事件，但不能中断后续处理器的执行（除非抛出异常）。这与经典的责任链（可终止）略有不同，更类似于“广播”模式。\n\n执行顺序：\n\n-
    全局回调（global_callbacks）排在前面。\n\n- 局部回调（local_callbacks）排在后面。\n\n- 在同一个列表内部，按照注册的顺序执行。\n\n如果某个处理器的方法抛出异常，默认行为是停止执行后续处理器，并将异常向上传播。你可以通过
    CallbackManager.configure(raise_error=False) 来改变这一行为，让异常被静默吞掉，但这通常不推荐，因为它会掩盖问题。\n\n\U0001F4A1
    注意：异步回调的执行顺序同样遵循上述规则，但由于异步并发，同一个处理器的不同事件方法可能在时间线上是交错的。\n\n---"

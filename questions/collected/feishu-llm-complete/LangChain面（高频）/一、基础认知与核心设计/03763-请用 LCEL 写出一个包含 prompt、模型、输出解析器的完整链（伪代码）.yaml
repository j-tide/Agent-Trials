content:
  prompt: 请用 LCEL 写出一个包含 prompt、模型、输出解析器的完整链（伪代码）。
answer:
  mode: rubric
  reference_answer: "```python\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom
    langchain_openai import ChatOpenAI\nfrom langchain_core.output_parsers import
    StrOutputParser\n\n# 1. 定义 Prompt 模板\nprompt = ChatPromptTemplate.from_messages([\n
    \   (\"system\", \"你是一个{role}，请用{language}回答用户的问题。\"),\n    (\"user\", \"{question}\")\n])\n\n#
    2. 初始化模型\nmodel = ChatOpenAI(\n    model=\"gpt-4o\",\n    temperature=0.7,\n    streaming=True
    \ # 开启流式输出\n)\n\n# 3. 定义输出解析器\nparser = StrOutputParser()  # 将 ChatMessage 转换为纯字符串\n\n#
    4. 用 LCEL 组合链\nchain = prompt | model | parser\n\n# 5. 调用链\nresult = chain.invoke({\n
    \   \"role\": \"资深Python工程师\",\n    \"language\": \"中文\",\n    \"question\": \"解释一下GIL是什么？\"\n})\n\n#
    6. 流式调用\nfor chunk in chain.stream({\n    \"role\": \"资深Python工程师\",\n    \"language\":
    \"中文\",\n    \"question\": \"解释一下GIL是什么？\"\n}):\n    print(chunk, end=\"\", flush=True)\n```\n\n\U0001F517
    这条链的数据流是：\nprompt 接收字典输入 → 生成 ChatPromptValue → model 生成 AIMessage → parser 转换为
    str。"

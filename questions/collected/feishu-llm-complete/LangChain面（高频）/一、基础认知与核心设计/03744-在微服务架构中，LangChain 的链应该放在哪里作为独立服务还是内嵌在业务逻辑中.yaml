content:
  prompt: 在微服务架构中，LangChain 的链应该放在哪里？作为独立服务还是内嵌在业务逻辑中？
answer:
  mode: rubric
  reference_answer: "\U0001F3DB️ 推荐模式：独立部署为 AI 服务。\n\n- 独立 AI 服务：将 LangChain 链包装为独立的微服务（通过
    FastAPI + LangServe 或自建 gRPC），对外提供语义化 API。业务后端通过 HTTP 或消息队列调用该服务。\n\n- 内嵌模式：在业务服务中直接调用
    LangChain 代码，链与业务逻辑混合在同一进程中。\n\n\U0001F4CA 对比分析：\n\n[嵌入表格未展开]\n\n✅ 建议：对于生产环境、多团队协作或需要弹性伸缩的场景，优先采用独立
    AI 服务。初期原型或简单应用可以内嵌，但应预留拆分为独立服务的接口（通过依赖注入和抽象层）。"

content:
  prompt: 你一般把 LangChain 的链定义在代码的哪一层？是服务层还是业务逻辑层？
answer:
  mode: rubric
  reference_answer: "\U0001F3D7️ 推荐分层架构：\n\n- 业务逻辑层（Service Layer）：定义具体的链（Chain）。每条链代表一个完整的业务能力，如“法律文档摘要”、“智能客服问答”、“代码审查”。这一层负责编排
    Prompt、模型、工具、输出解析器的组合。\n\n- 服务层（Application/API Layer）：使用 FastAPI、Flask 等框架暴露
    REST 或 GraphQL 接口，接收 HTTP 请求，调用业务逻辑层的链，并返回响应。这一层处理认证、参数校验、日志、租户解析等横切关注点。\n\n-
    基础设施层（Infrastructure Layer）：管理模型实例的创建、向量数据库连接、缓存、回调系统等。业务逻辑层的链通过依赖注入获取这些组件，而不是直接创建。\n\n\U0001F4E6
    项目结构示例：\n\napp/\n  services/\n    qa_service.py          # 定义问答链\n    summarization_service.py\n
    \ api/\n    routes.py              # FastAPI 路由，调用 service\n  models/\n    tenant.py
    \             # 租户模型\n  core/\n    config.py              # 配置管理\n    dependencies.py
    \       # 依赖注入（模型、向量库等）\n\n\U0001F9E9 为什么这样分层？\n\n- 单一职责：链的定义只关心“如何用 LLM 解决问题”，不关心
    HTTP 请求格式、数据库连接等。\n\n- 可测试性：可以单独测试链的逻辑，无需启动 Web 服务器。\n\n- 可替换性：如果将来从 REST API
    改为 gRPC 或消息队列，只需修改服务层，业务逻辑层的链完全复用。\n\n- 团队协作：AI 工程师专注优化链，后端工程师专注 API 和高可用部署，互不干扰。"

content:
  prompt: 在项目中，你如何管理 LangChain 的各种依赖（如 openai, chromadb, tiktoken）？
answer:
  mode: rubric
  reference_answer: "管理 LangChain 项目依赖的核心是 “显式声明” 和 “版本锁定”。\n\n\U0001F6E0️ 具体策略：\n\n-
    使用 pyproject.toml 或 requirements.txt 显式声明：明确列出项目直接依赖的包及其版本范围。例如：\n\nlangchain-core>=0.2.0,<0.3.0\nlangchain-openai>=0.1.0\nchromadb>=0.4.0\ntiktoken>=0.7.0\n\n-
    利用 pipenv 或 poetry 管理依赖树：这些工具会自动生成锁文件（Pipfile.lock、poetry.lock），记录所有直接和传递依赖的精确版本，确保开发、测试和生产环境的一致性。\n\n-
    隔离环境：为每个项目创建独立的虚拟环境（venv、conda），避免全局安装污染。\n\n- 定期更新与审计：制定依赖更新周期（如每月一次），使用 pip
    list --outdated 或 poetry show -o 查看可更新包，阅读变更日志后分批升级。使用 pip-audit 检查已知漏洞。\n\n-
    处理传递依赖冲突：当两个集成依赖同一个包的不同版本时，pip 会尝试解析。如果失败，可以手动指定统一版本或使用 constraints.txt 限制版本范围。\n\n-
    Docker 镜像优化：在 Dockerfile 中，先复制 requirements.txt 并安装依赖（利用 Docker 构建缓存），再复制项目代码。这样可以避免每次代码变动都重新安装所有依赖。"

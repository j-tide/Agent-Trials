content:
  prompt: 在 LangChain 中，回调（Callbacks）是如何贯彻“横切关注点”设计的？
answer:
  mode: rubric
  reference_answer: "\U0001F3AF 横切关注点 是软件架构中那些跨越多个模块的通用功能，如日志记录、性能监控、安全检查、事务管理等。如果每个模块都各自实现这些功能，会导致代码重复和高度耦合。\n\n\U0001F514
    LangChain 的回调系统 完美体现了这一设计思想。它提供了一套事件驱动的钩子（Hooks），允许开发者在 不修改核心业务逻辑 的前提下，在链的执行过程中注入自定义行为。\n\n\U0001F4E1
    回调的实现机制：\n\n- 所有 Runnable 组件在执行关键操作（如 LLM 调用开始、结束、出错、Token 生成）时，都会触发预定义的事件。\n\n-
    开发者只需创建 BaseCallbackHandler 的子类，重写感兴趣的事件方法（如 on_llm_start, on_llm_end, on_llm_error,
    on_chain_start, on_chain_end 等），然后将处理器附加到链的 config 中。\n\n\U0001F6E0️ 典型应用场景：\n\n-
    \U0001F4CA Token 计量与成本监控：在 on_llm_end 中提取 token_usage，记录每次调用的费用。\n\n- \U0001F50D
    全链路追踪：为每个请求生成唯一的 run_id，在回调中记录每个步骤的输入、输出和耗时，构建调用树。\n\n- ⚠️ 异常告警：在 on_llm_error
    中发送钉钉/邮件/微信通知。\n\n- \U0001F4DD 审计日志：将用户输入和模型输出写入数据库，用于合规审查。\n\n- \U0001F9EA 调试与
    LangSmith 集成：LangSmith 本身就是通过回调来捕获整个调用链的 Trace。\n\n\U0001F4A1 优势：\n\n- 业务逻辑与基础设施解耦：修改监控策略无需改动链代码。\n\n-
    可组合性：可以同时附加多个回调处理器（一个用于日志，一个用于告警，一个用于缓存）。\n\n- 运行时动态配置：通过 config 参数在每次调用时决定启用哪些回调。"

content:
  prompt: 如何在 LangChain 中实现自定义的 Runnable 组件？需要实现哪些方法？
answer:
  mode: rubric
  reference_answer: "\U0001F6E0️ 要实现一个自定义 Runnable，只需继承 Runnable 并重写核心方法。最常用的是 invoke
    和 stream（异步版本对应 ainvoke 和 astream）。\n\n基础模板：\n\n```python\nfrom langchain_core.runnables
    import Runnable\nfrom typing import Any, Iterator\n\nclass MyCustomRunnable(Runnable):\n
    \   def invoke(self, input: Any, config=None) -> Any:\n        # 核心逻辑：单个输入 → 单个输出\n
    \       return processed_output\n\n    def stream(self, input: Any, config=None)
    -> Iterator[Any]:\n        # 流式处理：逐个产出中间结果\n        yield chunk\n```\n\n必须实现的方法：\n\n-
    invoke(input, config=None) → output：同步单次调用。这是组件最核心的执行逻辑。\n\n- stream(input, config=None)
    → Iterator[output]：流式执行，逐步产出结果。不强制要求所有组件都支持流式，但如果支持，LCEL 会自动在整个链中传播流式行为。\n\n-
    ainvoke / astream：异步版本，实现后可以让链支持异步调用，提升并发性能。\n\n可选实现：\n\n- batch(inputs, config=None)
    → outputs：批量处理，框架会利用线程池或异步自动并行。如果组件内部有更高效的批处理逻辑（如调用批量 API），可以重写此方法以优化性能。\n\n-
    bind(**kwargs) → Runnable：返回一个新 Runnable，其内部逻辑与当前相同，但绑定了额外参数。用于实现动态配置。\n\n\U0001F9EA
    最佳实践：尽量让你的自定义组件只做一件事（单一职责），这样更容易测试和复用。如果逻辑复杂，可以组合多个 RunnableLambda 或更小的自定义 Runnable。"

content:
  prompt: LangSmith 是 LangChain 的配套平台，它的主要功能是什么？在开发和生产中分别怎么用？
answer:
  mode: rubric
  reference_answer: "\U0001F50D LangSmith 是 LangChain 的官方可观测性、调试、测试和评估平台。它像 LLM 应用的“Datadog”。\n\n核心功能：\n\n-
    \U0001F4C8 全链路追踪：自动记录链中每一步的输入、输出、耗时、Token 用量、工具调用参数。形成一棵调用树，方便定位瓶颈或错误。\n\n- \U0001F41E
    调试模式：可以在 Web 界面查看某次调用的完整上下文，修改 Prompt 并重新运行，快速迭代。\n\n- \U0001F4CA 评估与测试：创建测试集，定义评估指标（正确性、相关性、有害性），自动运行并生成报告。支持人工标注和
    AI 裁判。\n\n- \U0001F9EA 实验管理：对比不同 Prompt、模型、链配置的效果，跟踪版本迭代。\n\n- \U0001F4DD 数据标注：对用户反馈或模型输出进行标注，用于微调或评估。\n\n在开发阶段：\n\n-
    启动 LANGCHAIN_TRACING_V2=true 并设置 API Key，所有链调用自动上传至 LangSmith。\n\n- 通过 Trace 查看中间步骤，迅速定位“为什么模型给出了错误答案”。\n\n-
    在 Playground 中实时调整 Prompt 并查看效果。\n\n在生产阶段：\n\n- 持续监控错误率、延迟和 Token 成本。\n\n- 通过
    Sampling 降低 Trace 数据量，只记录一定比例的请求。\n\n- 利用 Programmable Evaluation 自动检测有害输出或幻觉。\n\n-
    建立反馈回路：将用户点踩的数据发送到 LangSmith 数据集，用于后续模型微调或 Prompt 优化。\n\nLangSmith 让 LLM 应用从“黑盒”变为“透明”，是
    LangChain 生产化的关键拼图。"

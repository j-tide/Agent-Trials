content:
  prompt: 从架构层面，LangChain 的核心抽象有哪些？画出它们之间的关系图。
answer:
  mode: rubric
  reference_answer: |-
    LangChain 的架构可以抽象为几个核心概念，它们之间的关系如下：

    [图片内容未导入]

    - Model（模型）：封装 LLM 或聊天模型的统一接口。提供 invoke、stream 等方法。

    - Prompt（提示词）：管理模板、变量、示例选择器。将用户输入和系统指令组合成最终发送给模型的文本。

    - Retriever（检索器）：从外部知识库（如向量数据库）中检索相关文档。是 RAG 的核心组件。

    - Memory（记忆）：在多次交互中保持对话上下文。自动管理历史消息的存储和裁剪。

    - Tools（工具）：让 LLM 可以调用外部 API（搜索引擎、计算器、数据库）。Agent 通过工具与外部世界交互。

    - Chain / LCEL（编排层）：将上述组件串联起来，定义数据处理流程。可以是线性管道，也可以包含条件分支和循环。

    - Callbacks（回调）：横切关注点，在组件执行前后触发自定义逻辑，用于日志、监控、流式输出等。

    这些抽象都实现了 Runnable 接口，因此可以像乐高积木一样组合。

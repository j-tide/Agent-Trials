content:
  prompt: LangChain 强调“可组合性”，这是如何体现的？请用 Prompt + LLM + OutputParser 举例。
answer:
  mode: rubric
  reference_answer: "\U0001F9E9 可组合性是 LangChain 的基因，它意味着将复杂任务拆解为独立的“乐高积木”，然后通过标准接口（Runnable）像搭积木一样拼装起来。每个积木只做一件事，做好后把结果交给下一个积木。\n\n以最简单的“问答链”为例，假设我们要实现：用户输入问题
    → 用模板包装成 Prompt → 调用 LLM → 解析输出为纯字符串。\n\n在传统代码里，我们会这样写：\n\n```python\nimport openai\nquestion
    = \"什么是LangChain？\"\nprompt = f\"请用中文回答：{question}\"\nresponse = openai.ChatCompletion.create(\n
    \   model=\"gpt-4\",\n    messages=[{\"role\": \"user\", \"content\": prompt}]\n)\nanswer
    = response['choices'][0]['message']['content']\n```\n\n这段代码混杂了 Prompt 构造、API 调用
    和 结果提取，三者高度耦合。一旦需要切换模型、修改模板、或解析结构化输出，就得改核心逻辑。\n\n在 LangChain 中，同样的事情被拆成三个独立的 Runnable
    组件，然后用 | 管道符串联：\n\n```python\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom
    langchain_openai import ChatOpenAI\nfrom langchain_core.output_parsers import
    StrOutputParser\n\n# 1. Prompt 组件：负责将变量包装为模型可接收的消息格式\nprompt = ChatPromptTemplate.from_messages([\n
    \   (\"system\", \"你是一个有帮助的助手，请用{language}回答。\"),\n    (\"user\", \"{question}\")\n])\n\n#
    2. Model 组件：负责与 LLM 通信，返回消息对象\nmodel = ChatOpenAI(model=\"gpt-4\", temperature=0)\n\n#
    3. OutputParser 组件：负责将模型输出转换为纯字符串\nparser = StrOutputParser()\n\n# 4. 组合：数据从左到右流动\nchain
    = prompt | model | parser\n\n# 调用\nresult = chain.invoke({\"language\": \"中文\",
    \"question\": \"什么是LangChain？\"})\n```\n\n\U0001F9F1 可组合性体现：\n\n- 每个组件只关心自己的职责：prompt
    不关心谁来回答，model 不关心问题怎么来的，parser 不关心模型怎么回答。\n\n- 组件可替换：要换模型？把 ChatOpenAI 换成 ChatAnthropic。要输出
    JSON 而非字符串？把 StrOutputParser 换成 PydanticOutputParser。其他组件完全不动。\n\n- 组件可复用：同一个
    prompt 可以用于不同的模型，同一个 parser 可以用在不同的链中。\n\n- 组件可独立测试：你可以单独测试 prompt 是否生成了正确的 ChatPromptValue，单独测试
    model 对特定输入的响应，单独测试 parser 的解析逻辑。这极大提升了代码的可维护性。\n\n这就是 LangChain 的“可组合性”——不是预先打包好的“万能链”，而是一套能让你自己搭出任何链条的接口规范。"

content:
  prompt: 解释 LangChain 中的“Chain”到底是什么，它和我们普通写的 Python 函数有什么区别？
answer:
  mode: rubric
  reference_answer: "\U0001F517 Chain 本质上是一个可组合的执行单元，你可以把它理解为一个“加强版的 Python 函数”，但它在以下几个方面超越了普通函数：\n\n\U0001F4CB
    普通 Python 函数的局限：\n\n- 逻辑硬编码，修改需要改代码、重部署。\n\n- 输入输出格式固定，难以灵活组合。\n\n- 无法自动处理异步调用、流式输出、错误重试。\n\n-
    缺乏运行时元数据（如 Token 消耗、执行耗时、中间步骤）。\n\n⚛️ Chain 的增强特性：\n\n- 声明式组合：通过 LCEL 可以用 | 运算符将多个组件串联，数据自动流转。例如
    prompt | model | output_parser 就是一条链。\n\n- 自动批量处理：Chain 原生支持批处理，可以并行处理多个输入。\n\n-
    流式支持：Chain 自动处理组件间的流式传递，支持 Token 级别的实时输出。\n\n- 生命周期管理：Chain 提供 invoke、batch、stream、astream
    等标准接口，统一的调用方式。\n\n- 回调集成：可以绑定回调，对链的每一步进行日志记录、Token 统计、性能监控。\n\n- 配置化：可以在运行时动态切换内部的模型、prompt
    等组件，不需要修改链的结构。\n\n\U0001F3AF 本质差异：Python 函数是“过程式”的，Chain 是“声明式”的。函数侧重于“如何执行”，Chain
    侧重于“如何组合”。Chain 让开发者专注于定义数据流和组件关系，而框架负责调度、优化和可观测性。"

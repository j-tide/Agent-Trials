content:
  prompt: 谈谈 LangChain 对函数式编程思想的借鉴，比如不可变性、组合、高阶函数等。
answer:
  mode: rubric
  reference_answer: "\U0001F9EC LangChain 的 LCEL 深受函数式编程（FP）影响，主要体现在：\n\n- \U0001F512
    不可变性（Immutability）：Runnable 的 invoke 不会修改原始输入，而是返回新的输出。bind 方法不是修改原 Runnable，而是返回一个绑定了新参数的新
    Runnable。这避免了共享状态引发的并发 bug。\n\n- \U0001F517 组合（Composition）：| 管道符本质就是函数组合（compose）。RunnableParallel
    是多个函数并行执行后合并结果。RunnablePassthrough 类似恒等函数（identity）。\n\n- \U0001F39B️ 高阶函数（Higher-Order
    Functions）：RunnableLambda 将普通函数包装为 Runnable，bind 实现部分应用（partial application），with_fallbacks
    实现函数级容错。\n\n- \U0001F4E6 纯函数理念：虽然 LLM 调用有副作用，但 LCEL 鼓励组件保持纯净（同样的输入永远得到同样的输出），这为缓存、测试和并行提供了基础。\n\n这种设计使得链像数学公式一样可推导、可组合，极大降低了心智负担。"

content:
  prompt: 你怎样在 LangChain 应用中集成日志系统（如 structlog）来记录每次 LLM 调用的输入输出？
answer:
  mode: rubric
  reference_answer: "\U0001F4DD 集成步骤：\n\n- 创建自定义 Callback Handler\n继承 BaseCallbackHandler，重写
    on_llm_start 和 on_llm_end（或其他需要记录的事件）。在这些方法中，使用 structlog 输出结构化日志。\n\nfrom langchain_core.callbacks
    import BaseCallbackHandler\nimport structlog\n\nlogger = structlog.get_logger()\n\nclass
    StructlogCallback(BaseCallbackHandler):\n    def on_llm_start(self, serialized,
    prompts, **kwargs):\n        logger.info(\"llm_call_start\", prompts=prompts,
    metadata=kwargs.get(\"metadata\", {}))\n\n    def on_llm_end(self, response, **kwargs):\n
    \       logger.info(\"llm_call_end\", content=response.generations[0][0].text,
    token_usage=response.llm_output.get(\"token_usage\"))\n\n- 将回调绑定到链\n在每次调用链时，通过
    config 参数传入回调实例，或者设置为全局回调。\n\ncallback = StructlogCallback()\nchain.invoke({\"question\":
    \"你好\"}, config={\"callbacks\": [callback]})\n\n- 结构化日志的价值\n使用 structlog 可以将日志输出为
    JSON 格式，方便后续采集到 ELK、Loki 等日志平台进行分析。记录的信息可包括：\n\n⚠️ 隐私注意：避免在日志中记录完整的用户个人信息或敏感数据，必要时进行脱敏处理。"

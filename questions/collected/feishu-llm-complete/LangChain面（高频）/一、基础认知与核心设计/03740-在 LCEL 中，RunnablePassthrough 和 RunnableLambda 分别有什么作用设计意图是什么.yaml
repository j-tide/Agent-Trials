content:
  prompt: 在 LCEL 中，RunnablePassthrough 和 RunnableLambda 分别有什么作用？设计意图是什么？
answer:
  mode: rubric
  reference_answer: "\U0001F9E9 RunnablePassthrough：顾名思义，它的作用就是让数据“透传”——接收输入，原样返回输出。看似简单，但在链式调用中至关重要。\n\n设计意图：\n\n-
    数据占位与透传：在 RunnableParallel 中，有时需要把原始输入保持不变地传递到下游，同时对其他分支进行加工。例如，你需要调用一个 API 获取数据，同时保留原始用户问题用于后续提示。此时
    RunnablePassthrough 就充当了“数据保险箱”。\n\n- 可选的数据注入：RunnablePassthrough.assign() 可以在不修改原数据的前提下，动态添加新字段。例如，在
    RAG 链中，先检索文档，将检索结果作为 context 注入到原有的 question 字典中，传给下一步。\n\n\U0001F4DC 示例：\n\n```python\nfrom
    langchain_core.runnables import RunnablePassthrough\n\n# 原样传递\nchain = RunnablePassthrough()\n\n#
    动态注入字段\nchain = RunnablePassthrough.assign(\n    context=lambda x: retrieve(x[\"question\"])
    \ # 检索文档，注入 context 字段\n)\n```\n\n此时输入 {\"question\": \"什么是LangChain？\"}，经过 assign
    后，输出变为 {\"question\": \"什么是LangChain？\", \"context\": \"LangChain是...\"}，原始字段未被修改。\n\n\U0001F527
    RunnableLambda：它的作用是将任意 Python 函数包装成一个 Runnable。这意味着你可以把任何现有的函数（同步或异步）无缝集成到 LCEL
    链中，而不需要修改函数签名。\n\n设计意图：\n\n- 桥接普通代码与 LangChain 生态：你可能有现成的数据处理函数、API 调用函数、验证函数等，通过
    RunnableLambda 可以直接塞进链里。\n\n- 自定义逻辑的“粘合剂”：当标准组件无法满足需求时，你可以写一个普通函数处理，然后继续用管道符连接后续组件。\n\n\U0001F4DC
    示例：\n\n```python\nfrom langchain_core.runnables import RunnableLambda\n\ndef add_word_count(text:
    str) -> dict:\n    return {\"original\": text, \"word_count\": len(text.split())}\n\nlambda_chain
    = RunnableLambda(add_word_count)\n# 可以和其他组件串联\nchain = some_prompt | model | RunnableLambda(add_word_count)
    | ...\n```\n\n两者结合，构成了 LCEL 数据加工 和 流程控制 的基础。"

content:
  prompt: langchain-core 中包含哪些核心抽象？为什么要把它们单独拆出来？
answer:
  mode: rubric
  reference_answer: "langchain-core 是 LangChain 生态的“宪法”，包含了所有最基础、最稳定的接口与类型定义。这些抽象不依赖任何具体的模型提供商、向量数据库或第三方工具，是整个框架的基石。\n\n\U0001F9F1
    核心抽象组成：\n\n- Runnable 系列：这是 LangChain 的执行协议。包括 Runnable 基类、RunnableSequence（管道）、RunnableParallel（并行）、RunnablePassthrough（透传）、RunnableLambda（函数包装）、RunnableBranch（条件路由）等。任何组件只要实现了
    invoke、stream、batch 等方法，就自动获得了组合、流式、异步、批量、回退等能力。\n\n- 模型抽象：BaseLanguageModel、BaseChatModel、BaseLLM。定义了大语言模型的统一接口，包括生成、流式、工具调用、Token
    计数等方法。\n\n- 消息与提示模板：BaseMessage（及 HumanMessage、AIMessage、SystemMessage）、BasePromptTemplate、ChatPromptTemplate、MessagesPlaceholder
    等。标准化了对话消息的格式与提示词的构建方式。\n\n- 文档与索引基础：Document、BaseRetriever、BaseDocumentLoader。定义了文本块和检索器的基本行为。\n\n-
    输出解析器：BaseOutputParser、StrOutputParser、PydanticOutputParser 等。负责将模型输出转换为结构化数据。\n\n-
    回调系统：BaseCallbackHandler、CallbackManager。提供事件钩子，用于日志、监控、流式输出等横切关注点。\n\n- 工具抽象：BaseTool、StructuredTool。定义了
    LLM 可调用的外部工具接口。\n\n- 配置与类型：RunnableConfig、各种 TypedDict 定义、错误处理类型等。\n\n\U0001F527
    为什么单独拆出来？\n\n- 稳定的 API 契约：这些抽象定义了 LangChain 的“语言基础”。它们变化极慢，向后兼容性强。第三方开发者可以依赖这些抽象构建自己的组件，而不必担心频繁更新破坏代码。\n\n-
    轻量级依赖：langchain-core 不依赖任何重量级 SDK（如 openai、pinecone），只依赖 pydantic 和 pyyaml。这意味着你可以在边缘设备或敏感环境中只安装核心库，用于定义和测试链，而无需拉取整个生态系统。\n\n-
    减少依赖污染与版本冲突：将核心抽象与具体实现解耦后，langchain-openai、langchain-pinecone 等集成包可以独立更新，不会因为某个提供商
    API 变更而导致核心库版本号跳跃。\n\n- 提升框架的长期可维护性：LangChain 团队可以集中精力维护这套稳定接口，社区贡献者则可以在 langchain-community
    和各自的提供商包中自由实验，形成“核心稳定、社区活跃”的健康生态。"

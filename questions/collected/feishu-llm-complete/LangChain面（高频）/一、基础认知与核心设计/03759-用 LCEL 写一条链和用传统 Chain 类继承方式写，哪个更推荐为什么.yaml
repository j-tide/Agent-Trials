content:
  prompt: 用 LCEL 写一条链和用传统 Chain 类继承方式写，哪个更推荐？为什么？
answer:
  mode: rubric
  reference_answer: "\U0001F3C6 强烈推荐 LCEL。这是 LangChain 从 0.1.x 到 0.2.x 最核心的设计转变。\n\n传统
    Chain 类的缺点：\n\n- 需要创建自定义类，重写 _call 或 _acall 方法，样板代码多。\n\n- 手动管理输入输出键（input_keys,
    output_keys），容易出错。\n\n- 组合链时需要使用 SequentialChain 等特殊类，多层嵌套时非常不灵活。\n\n- 不支持自动流式、自动批处理，需要自己实现。\n\n-
    难以在运行时动态修改链的结构。\n\nLCEL 的优势：\n\n- 极简语法：chain = prompt | model | parser 一行搞定。\n\n-
    自动推断输入输出：框架自动根据组件的输入输出类型完成数据传递，无需声明键。\n\n- 原生流式支持：链上任意节点支持流式，整个链路自动流式化。\n\n- 原生并行支持：batch
    方法自动并行处理。\n\n- 动态配置：可以在运行时绑定参数、添加回调、配置重试/回退，而无需修改链的结构。\n\n- 可测试性强：每个组件可以单独测试，链本身也可以像函数一样直接调用。\n\n\U0001F4CC
    结论：对于新项目，应该完全使用 LCEL。传统的 Chain 类在新版 LangChain 中已逐渐被废弃。"

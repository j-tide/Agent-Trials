content:
  prompt: 在 LangChain 中，什么是 Runnable 接口？为什么几乎所有组件都实现了它？
answer:
  mode: rubric
  reference_answer: "\U0001F50C Runnable 是 LangChain 中最基础的协议，定义了一个统一的可执行单元。任何实现了 invoke、batch、stream
    等方法的对象，都是一个 Runnable。\n\n核心方法：\n\n- invoke(input): 同步调用，单个输入 → 单个输出。\n\n- batch(inputs):
    批量调用，多个输入 → 多个输出，内部自动并行处理。\n\n- stream(input): 流式调用，返回一个生成器，逐步产出中间结果。\n\n- ainvoke/abatch/astream:
    异步版本。\n\n- bind(**kwargs): 绑定额外参数，返回一个新的 Runnable（类似函数柯里化）。\n\n- with_config(config):
    附加运行时配置（如回调、标签、元数据）。\n\n为什么几乎所有组件都实现了它？\n\n\U0001F3D7️ 统一的“积木接口”：LCEL 的核心就是通过
    | 运算符串联 Runnable。只有所有组件都遵循同一套接口，才能无缝拼接。比如 prompt | model | parser，prompt 的输出正好是
    model 的输入，model 的输出正好是 parser 的输入，因为它们在 Runnable 协议上都定义了输入输出类型。\n\n\U0001F504
    可组合性：Runnable 可以嵌套。一条链本身也是一个 Runnable，所以可以像普通组件一样被嵌入到更大的链中。\n\n⚙️ 框架能力增强：因为所有组件都实现了
    Runnable，框架可以统一提供缓存、限流、重试、回调、流式传递等高级特性，无需每个组件单独实现。\n\n\U0001F4CA 可观测性：所有 Runnable
    的执行过程都可以通过回调进行追踪，生成调用链的 Trace，极大方便调试和性能分析。"

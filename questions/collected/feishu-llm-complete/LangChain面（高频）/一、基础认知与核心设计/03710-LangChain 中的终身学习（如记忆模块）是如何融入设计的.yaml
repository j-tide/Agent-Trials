content:
  prompt: LangChain 中的“终身学习”（如记忆模块）是如何融入设计的？
answer:
  mode: rubric
  reference_answer: "\U0001F9E0 LangChain 的“记忆”（Memory）不是让模型参数持续更新（那是微调），而是在对话过程中动态维护上下文信息，让模型能“记住”之前说过的话。\n\n\U0001F5C4️
    记忆的类型：\n\n- ConversationBufferMemory：最基础，存储原始对话历史列表。简单但会无限增长，最终超出上下文窗口。\n\n- ConversationBufferWindowMemory：只保留最近
    K 轮对话，用滑动窗口控制长度。\n\n- ConversationSummaryMemory：用 LLM 对历史对话进行摘要，压缩信息密度。\n\n- ConversationSummaryBufferMemory：结合窗口和摘要，近期对话保留原始，远期压缩为摘要。\n\n-
    VectorStoreRetrieverMemory：将历史对话存入向量数据库，检索最相关的部分，支持无限长记忆。\n\n\U0001F9E9 融入设计的方式：记忆模块作为
    Runnable 被集成到链中。通常有两个关键步骤：\n\n- 加载历史：在链的开头，从记忆存储中读取历史消息，注入到 Prompt 模板的 history
    变量。\n\n- 保存新对话：在链的结尾，将本轮的用户输入和模型输出写回记忆存储。\n\n通过 LCEL，这个流程可以写成：\n\n```python\nchain
    = (\n    RunnablePassthrough.assign(history=memory.load_memory)  # 注入历史\n    |
    prompt\n    | model\n    | RunnableLambda(save_to_memory)  # 保存新对话\n)\n```\n\n这种设计让记忆成为可插拔的组件，与业务逻辑解耦。"

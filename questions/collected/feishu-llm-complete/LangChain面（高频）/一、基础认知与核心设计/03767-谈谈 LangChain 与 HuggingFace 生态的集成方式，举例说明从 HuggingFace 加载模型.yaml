content:
  prompt: 谈谈 LangChain 与 HuggingFace 生态的集成方式，举例说明从 HuggingFace 加载模型。
answer:
  mode: rubric
  reference_answer: "\U0001F917 集成方式：LangChain 通过 langchain-huggingface 包与 HuggingFace
    生态无缝连接。主要提供两大类集成：\n\n- 模型集成：通过 HuggingFaceEndpoint 或 HuggingFacePipeline 加载 HuggingFace
    Hub 上的模型或本地模型，并适配为 LangChain 的 BaseChatModel 或 BaseLLM 接口。\n\n- 嵌入模型集成：通过 HuggingFaceEmbeddings
    加载 HuggingFace 的句子嵌入模型，用于文本向量化和语义搜索。\n\n- 数据集与文档：HuggingFaceDatasetLoader 可以加载
    HuggingFace Datasets 库中的数据作为文档。\n\n\U0001F4DC 举例：加载本地 LLM 进行对话：\n\nfrom langchain_huggingface
    import HuggingFacePipeline, HuggingFaceEmbeddings\nfrom transformers import AutoModelForCausalLM,
    AutoTokenizer, pipeline\nfrom langchain_core.prompts import PromptTemplate\n\n#
    1. 加载模型和分词器\nmodel_name = \"meta-llama/Llama-2-7b-chat-hf\"\ntokenizer = AutoTokenizer.from_pretrained(model_name)\nmodel
    = AutoModelForCausalLM.from_pretrained(model_name, device_map=\"auto\")\n\n# 2.
    构建 Transformers pipeline\npipe = pipeline(\n    \"text-generation\",\n    model=model,\n
    \   tokenizer=tokenizer,\n    max_new_tokens=256,\n    temperature=0.7,\n)\n\n#
    3. 包装为 LangChain 模型\nllm = HuggingFacePipeline(pipeline=pipe)\n\n# 4. 构建链\nprompt
    = PromptTemplate.from_template(\"问题：{question}\\n回答：\")\nchain = prompt | llm\nresult
    = chain.invoke({\"question\": \"法国的首都是哪里？\"})\n\n对于嵌入模型：\n\nfrom langchain_huggingface
    import HuggingFaceEmbeddings\nembeddings = HuggingFaceEmbeddings(model_name=\"sentence-transformers/all-MiniLM-L6-v2\")\nvectors
    = embeddings.embed_documents([\"测试文本\"])\n\n这种方式让 LangChain 可以利用 HuggingFace 上数万个预训练模型，无需依赖外部
    API，适合数据隐私敏感的场景。"

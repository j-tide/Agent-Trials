content:
  prompt: 如何将一个基于 LangChain 的应用打包成 Docker 镜像？需要注意哪些环境变量？
answer:
  mode: rubric
  reference_answer: "\U0001F4E6 打包成 Docker 镜像的核心步骤：\n\n- 编写 Dockerfile，选择轻量的 Python
    基础镜像（如 python:3.11-slim）。\n\n- 设置工作目录，复制 requirements.txt 并安装依赖。\n\n- 复制项目代码。\n\n-
    设置启动命令（如 uvicorn main:app --host 0.0.0.0 --port 8000）。\n\n\U0001F5C2️ 示例 Dockerfile：\n\nFROM
    python:3.11-slim\n\nWORKDIR /app\n\n# 安装依赖\nCOPY requirements.txt .\nRUN pip install
    --no-cache-dir -r requirements.txt\n\n# 复制项目\nCOPY . .\n\n# 暴露端口\nEXPOSE 8000\n\n#
    启动命令\nCMD [\"uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n\n⚠️
    必须注意的环境变量：\n\n- API 密钥：所有模型提供商（OpenAI、Anthropic）和工具（Pinecone、SerpAPI）的密钥。通过 -e
    参数或 --env-file 注入，绝对不能写入镜像。\n\n- LangChain 配置：LANGCHAIN_TRACING_V2（是否启用 LangSmith
    追踪）、LANGCHAIN_API_KEY（LangSmith API 密钥）、LANGCHAIN_PROJECT（项目名）。\n\n- 代理设置：如果运行在受限网络，需设置
    HTTP_PROXY、HTTPS_PROXY。\n\n- Python 环境：PYTHONUNBUFFERED=1 确保日志实时输出。\n\n- OpenAI
    特定：OPENAI_API_VERSION、OPENAI_ORGANIZATION 等。\n\n- 运行时配置：如 PORT、LOG_LEVEL 等应用自定义变量。\n\n\U0001F680
    构建与运行：\n\ndocker build -t my-langchain-app .\ndocker run -d -p 8000:8000 --env-file
    .env my-langchain-app"

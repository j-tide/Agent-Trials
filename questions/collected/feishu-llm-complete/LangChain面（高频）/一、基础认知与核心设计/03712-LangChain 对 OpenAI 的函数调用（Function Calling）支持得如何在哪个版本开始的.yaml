content:
  prompt: LangChain 对 OpenAI 的函数调用（Function Calling）支持得如何？在哪个版本开始的？
answer:
  mode: rubric
  reference_answer: "\U0001F4DE 支持程度：LangChain 对 OpenAI 的函数调用提供了深度、完善的支持。它不仅仅简单封装了
    OpenAI 的 function_call 参数，还提供了一整套工具抽象和 Agent 循环，让 LLM 能够自主决定何时调用工具、如何解析参数、如何处理工具返回的结果。\n\n⚙️
    核心机制：\n\n- bind_tools() 方法：ChatOpenAI 提供了 bind_tools() 方法，接受一个工具列表（LangChain 的
    BaseTool 对象），自动生成 JSON Schema 并传递给 API。\n\n- ToolMessage 消息类型：当模型返回 tool_calls
    时，LangChain 会生成 AIMessage 并包含 tool_calls。开发者将工具执行结果封装为 ToolMessage，与之前的消息合并，继续发送给模型。\n\n-
    Agent 封装：create_openai_functions_agent 和 AgentExecutor 将上述手工循环自动化，支持错误重试、推理循环等。\n\n\U0001F4C5
    版本起始：对 OpenAI Function Calling 的支持始于 LangChain 0.0.300 版本（约2023年8月），并在后续版本中不断优化，最终在
    LCEL 中得到原生支持。\n\n\U0001F4DC 示例：\n\nfrom langchain_openai import ChatOpenAI\nfrom
    langchain_core.tools import tool\n\n@tool\ndef get_weather(city: str) -> str:\n
    \   \"\"\"获取指定城市的天气\"\"\"\n    return f\"{city}：晴天，25°C\"\n\nmodel = ChatOpenAI(model=\"gpt-4o\").bind_tools([get_weather])\nresponse
    = model.invoke(\"北京今天天气如何？\")\n# response.tool_calls 包含函数调用信息"

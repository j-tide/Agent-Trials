content:
  prompt: 为什么 LangChain 要把索引、检索、生成分离成不同的抽象？
answer:
  mode: rubric
  reference_answer: "\U0001F4DA RAG（检索增强生成） 将 LLM 的知识从静态参数中解放出来，连接到外部知识库。LangChain
    将其拆解为三个阶段：\n\n- \U0001F5C2️ 索引（Indexing）：将非结构化文档（PDF、网页）转化为可查询的格式。包括文档加载、文本分割、嵌入生成、向量存储。抽象为
    DocumentLoader、TextSplitter、Embeddings、VectorStore。\n\n- \U0001F50D 检索（Retrieval）：根据用户问题从索引中找出最相关的文档。抽象为
    Retriever，它封装了查询向量化、相似度搜索、过滤、重排序等逻辑。\n\n- \U0001F9E0 生成（Generation）：将检索到的文档作为上下文，结合用户问题，由
    LLM 生成答案。抽象为 Chain 或 Runnable。\n\n\U0001F3AF 分离的好处：\n\n- 独立优化：分割策略改变不影响检索逻辑，向量库切换不影响生成
    Prompt。\n\n- 可测试性：可以单独测试检索器的召回率、精确率。\n\n- 组件复用：同一个检索器可以用于多个不同的生成链（摘要、翻译、QA）。\n\n-
    架构清晰：开发者只需关注每一层自己的职责，符合“关注点分离”原则。"

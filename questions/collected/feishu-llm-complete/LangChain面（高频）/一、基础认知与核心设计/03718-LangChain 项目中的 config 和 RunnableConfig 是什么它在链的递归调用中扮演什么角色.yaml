content:
  prompt: LangChain 项目中的 config 和 RunnableConfig 是什么？它在链的递归调用中扮演什么角色？
answer:
  mode: rubric
  reference_answer: "⚙️ RunnableConfig 是一个字典对象，在链的调用过程中携带运行时配置和上下文信息。它通常通过 chain.invoke(input,
    config=...) 传入，并自动传播到链中的所有子组件。\n\n\U0001F4CB 包含的常见字段：\n\n- callbacks：回调处理器列表，用于日志、监控、Token
    计数。\n\n- tags：标签，用于标识本次调用（如 \"production\", \"test\"）。\n\n- metadata：自定义元数据，可包含用户
    ID、会话 ID 等。\n\n- max_concurrency：最大并发数。\n\n- configurable：可配置的参数，供链内部条件逻辑使用。\n\n\U0001F504
    在递归调用中的作用：\nLangChain 的 Agent 或 Chain 常常递归调用自身（如 AgentExecutor 在思考-行动-观察循环中多次调用
    LLM）。RunnableConfig 会沿着调用链自动传递，保证：\n\n- 所有子调用共享同一套回调，产生的 Trace 可以串联成完整的调用树。\n\n-
    配置中的 recursion_limit 限制递归深度，防止无限循环。\n\n- 提供 run_id 等标识，用于链路追踪。\n\n- 在某些场景下，config
    可以作为“隐式上下文”，避免显式传递全局参数。\n\n例如，在自定义工具中，可以通过 RunnableConfig 访问当前会话 ID，从而读取特定用户的记忆数据。"

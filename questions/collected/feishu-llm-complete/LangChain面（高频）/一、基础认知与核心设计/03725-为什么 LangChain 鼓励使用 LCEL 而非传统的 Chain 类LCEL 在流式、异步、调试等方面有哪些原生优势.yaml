content:
  prompt: 为什么 LangChain 鼓励使用 LCEL 而非传统的 Chain 类？LCEL 在流式、异步、调试等方面有哪些原生优势？
answer:
  mode: rubric
  reference_answer: "\U0001F680 LCEL 是 LangChain 的第二代核心抽象，旨在解决旧 Chain 类的固有问题。\n\n旧
    Chain 类的痛点：\n\n- 需要继承 Chain 并重写 _call 方法，样板代码多。\n\n- 手动管理 input_keys 和 output_keys，容易出错且不灵活。\n\n-
    组合链需要 SequentialChain 等特殊类，多层嵌套时代码混乱。\n\n- 不支持自动流式传递和异步并发。\n\n- 调试困难，中间结果不易获取。\n\nLCEL
    的原生优势：\n\n- \U0001F4DC 极简语法：chain = prompt | model | parser 一行定义链，自文档化。\n\n- \U0001F30A
    自动流式传播：如果链中某个组件支持 stream，则整个链自动变成流式的，下游组件逐个处理上游的流式输出。无需手动管理生成器。\n\n- ⚡ 原生异步支持：所有
    LCEL 组件都支持 ainvoke/astream，框架自动处理异步并发，性能远优于同步 Chain。\n\n- \U0001F500 自动批处理：batch
    方法自动并行处理多个输入，无需手动编写多线程代码。\n\n- \U0001F9EA 调试与可观测性：通过 with_config(callbacks=...)
    或 LangSmith，可以追踪链中每一步的输入输出、耗时和 Token 用量，调试体验极大提升。\n\n- \U0001F6E1️ 动态配置：with_fallbacks、bind
    等方法可以在运行时修改链的行为，而无需修改链的定义。\n\n因此，LCEL 不仅仅是语法糖，它是整个 LangChain 执行引擎的重新设计。官方已明确表示旧
    Chain 类将逐步废弃，所有新功能都基于 LCEL 构建。"

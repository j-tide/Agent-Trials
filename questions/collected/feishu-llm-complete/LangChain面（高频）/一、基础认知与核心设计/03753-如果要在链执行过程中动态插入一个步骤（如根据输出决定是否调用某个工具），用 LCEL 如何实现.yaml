content:
  prompt: 如果要在链执行过程中动态插入一个步骤（如根据输出决定是否调用某个工具），用 LCEL 如何实现？
answer:
  mode: rubric
  reference_answer: "\U0001F500 在 LCEL 中，动态路由和条件分支通过 RunnableBranch 或 RunnableLambda
    实现。\n\n场景：用户提问，模型判断问题类型。如果是简单问题直接回答，如果是复杂问题则需要调用搜索引擎获取额外信息后再回答。\n\n实现方案：\n\n-
    使用 RunnableBranch 进行条件路由：\n\n```python\nfrom langchain_core.runnables import RunnableBranch\n\n#
    分类函数：判断问题类型\ndef is_complex(input):\n    return \"复杂\" in input[\"type\"]\n\nbranch
    = RunnableBranch(\n    (lambda x: is_complex(x), search_tool | prompt | model
    | parser),  # 复杂问题走搜索分支\n    prompt | model | parser  # 默认分支（简单问题）\n)\n```\n\n-
    使用 RunnableLambda 实现更灵活的逻辑：\n\n```python\ndef dynamic_step(input):\n    if needs_tool(input):\n
    \       tool_result = tool.invoke(input)\n        return process_with_tool(tool_result)\n
    \   else:\n        return model.invoke(input)\n\nchain = prompt | RunnableLambda(dynamic_step)
    | parser\n```\n\n在 Agent 中的实现：ReAct Agent 的核心循环本质上就是一个动态路由——根据上一步的观察决定下一步是继续调用工具还是给出最终答案。LangGraph
    让这种循环更加可视化。"

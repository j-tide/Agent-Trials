content:
  prompt: LangChain 项目中常见的配置项有哪些？你用什么方式管理（环境变量、yaml、pydantic settings）？
answer:
  mode: rubric
  reference_answer: "\U0001F4CB 常见配置项：\n\n- \U0001F511 API 密钥：OpenAI、Anthropic、Cohere、Pinecone
    等提供商的密钥。\n\n- \U0001F39B️ 模型参数：模型名称（gpt-4o）、温度（temperature）、最大 token 数（max_tokens）、top_p
    等。\n\n- \U0001F517 服务端点：对于自部署模型（vLLM、Ollama），需要 base_url；对于代理，需要 proxy 设置。\n\n-
    \U0001F5C4️ 向量数据库连接：PINECONE_API_KEY、PINECONE_ENV、CHROMA_HOST 等。\n\n- \U0001F4CA
    回调与监控：LANGCHAIN_TRACING_V2、LANGCHAIN_API_KEY、LANGCHAIN_PROJECT（用于 LangSmith）。\n\n-
    \U0001F9E0 记忆配置：会话记忆的存储后端（Redis、Postgres）、窗口大小。\n\n- ⏱️ 超时与重试：request_timeout、max_retries。\n\n-
    ⚙️ 运行时行为：LANGCHAIN_VERBOSE（调试日志）、LANGCHAIN_HANDLER（自定义回调）。\n\n\U0001F39B️ 管理方式的选型与组合：\n\n[嵌入表格未展开]\n\n✅
    推荐实践：\n\n- 使用 pydantic-settings 定义配置类，自动从环境变量读取，并支持 .env 文件。例如：\n\nfrom pydantic_settings
    import BaseSettings\nclass Settings(BaseSettings):\n    openai_api_key: str\n
    \   model_name: str = \"gpt-4o\"\n    temperature: float = 0.7\n    max_tokens:
    int = 1024\n    langsmith_api_key: Optional[str] = None\n    class Config:\n        env_file
    = \".env\"\n\n- 复杂结构（如多模型配置）可以用 YAML 文件存储，通过 yaml.safe_load 加载，再与 Pydantic 模型结合验证。\n\n-
    所有密钥、端点等敏感信息通过环境变量注入，YAML 中只保留非敏感参数。\n\n这样既保证了安全，又获得了类型提示和自动补全，极大减少配置错误。"

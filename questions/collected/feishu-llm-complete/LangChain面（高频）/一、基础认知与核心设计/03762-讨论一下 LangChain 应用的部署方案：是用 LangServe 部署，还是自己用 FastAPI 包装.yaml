content:
  prompt: 讨论一下 LangChain 应用的部署方案：是用 LangServe 部署，还是自己用 FastAPI 包装？
answer:
  mode: rubric
  reference_answer: "\U0001F680 LangServe：LangChain 官方提供的部署库，能自动将 LCEL 链转换为 REST API。\n\n-
    ✅ 优点：一行命令 langchain serve 即可启动；自动生成 OpenAPI 文档和 /playground 调试页面；内置流式支持、中间件、验证。\n\n-
    ❌ 缺点：灵活性有限，不易定制认证逻辑、请求/响应格式；依赖 LangChain 生态，与 FastAPI 深度绑定。\n\n\U0001F6E0️ 自己用
    FastAPI 包装：手动创建 FastAPI 路由，在端点中调用链。\n\n- ✅ 优点：完全掌控请求生命周期，可集成任意认证、限流、日志中间件；可以自定义请求体和响应结构，方便与现有系统对接。\n\n-
    ❌ 缺点：需要手动处理流式响应、错误转换、输入验证等模板代码。\n\n\U0001F3AF 决策建议：\n\n- 如果是内部工具、快速验证，用 LangServe
    最快。\n\n- 如果是面向客户的生产 API，建议自己包装 FastAPI，以获得最大的定制性和可维护性。\n\n- 也可以结合两者：用 LangServe
    快速暴露原型，后续重构为自定义 FastAPI 服务。"

content:
  prompt: 如何在不改变原有链逻辑的情况下，给链增加缓存和限流？在 LCEL 中怎么配置？
answer:
  mode: rubric
  reference_answer: |-
    LCEL 提供了 with_config() 和 with_fallbacks() 等方法来非侵入式地增强链的功能。

    增加缓存：

    ```python
    from langchain_core.caches import InMemoryCache
    from langchain_core.runnables import RunnableConfig

    # 启用全局缓存（对整个应用生效）
    from langchain.globals import set_llm_cache
    set_llm_cache(InMemoryCache())

    # 对特定调用启用缓存
    chain.with_config(config={"cache_key": "my_unique_key"})
    ```

    也可以使用更强大的 SQLiteCache 或 RedisCache 进行持久化缓存，避免重启丢失。

    增加限流：

    ```python
    from langchain_core.runnables import RunnableLambda

    def rate_limit(input):
        # 自定义限流逻辑，例如调用API限流库
        return input

    limited_chain = chain | RunnableLambda(rate_limit)
    ```

    在 LCEL 中，你还可以为链的特定步骤绑定配置：

    ```python
    chain = (
        prompt
        | model.with_config({"tags": ["gpt4", "production"]})  # 标签用于监控
        | parser
    )
    ```

    增加回退（故障转移）：

    ```python
    fallback_model = ChatAnthropic(model="claude-3-sonnet")
    robust_chain = model.with_fallbacks([fallback_model])

    # 整个链的回退
    chain_with_fallback = prompt | robust_chain | parser
    ```

    这样主模型不可用时，会自动切换备用模型，调用方无感知。

    所有增强都通过 with_* 方法链式调用，完全不影响原有链逻辑。

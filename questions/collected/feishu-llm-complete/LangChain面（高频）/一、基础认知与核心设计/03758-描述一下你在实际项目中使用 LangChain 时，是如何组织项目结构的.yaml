content:
  prompt: 描述一下你在实际项目中使用 LangChain 时，是如何组织项目结构的。
answer:
  mode: rubric
  reference_answer: "\U0001F4C2 推荐一种基于“领域驱动”和“分层架构”的项目结构：\n\n```text\nproject/\n├──
    config/                 # 配置文件（YAML）\n│   ├── dev.yaml\n│   └── prod.yaml\n├──
    chains/                 # 链定义（按业务领域）\n│   ├── __init__.py\n│   ├── qa_chain.py
    \        # 问答链\n│   ├── summarization.py    # 摘要链\n│   └── agent.py            #
    Agent 链\n├── prompts/                # Prompt 模板（独立管理）\n│   ├── __init__.py\n│
    \  ├── qa_prompt.py\n│   └── system_messages.py\n├── tools/                  #
    自定义工具\n│   ├── __init__.py\n│   ├── search_tool.py\n│   └── calculator.py\n├──
    retrievers/             # 检索器（向量库等）\n│   └── vector_retriever.py\n├── models/
    \                # 模型初始化（统一配置）\n│   └── load_models.py\n├── callbacks/              #
    回调处理器\n│   ├── logging_callback.py\n│   └── cost_callback.py\n├── memory/                 #
    记忆管理\n│   └── session_memory.py\n├── utils/                  # 工具函数\n├── tests/
    \                 # 单元测试和集成测试\n├── main.py                 # 服务入口（FastAPI/Slack
    bot）\n└── requirements.txt\n```\n\n\U0001F3F7️ 设计原则：\n\n- 配置与代码分离：环境变量和 YAML 管理超参数。\n\n-
    链与业务解耦：每条链封装在一个文件中，只暴露 invoke 接口。\n\n- 组件可替换：通过依赖注入切换模型提供商或检索器。\n\n- 独立测试：每个链、工具、解析器都可以独立测试。"

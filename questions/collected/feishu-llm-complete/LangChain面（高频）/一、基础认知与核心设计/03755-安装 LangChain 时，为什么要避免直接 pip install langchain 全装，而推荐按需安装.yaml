content:
  prompt: 安装 LangChain 时，为什么要避免直接 pip install langchain 全装，而推荐按需安装？
answer:
  mode: rubric
  reference_answer: "langchain 是一个“元包”（meta-package），它会自动拉取 langchain-core、langchain-community
    以及许多流行的集成。这种“全家桶”式安装在过去带来了严重的工程问题。\n\n⚠️ 全量安装的弊端：\n\n- 依赖爆炸：一次性安装可能引入 50+ 个第三方库（openai、pinecone-client、chromadb、tiktoken、bs4、pypdf
    等），导致 Docker 镜像体积膨胀数 GB，部署启动缓慢。\n\n- 版本冲突风险：不同集成可能依赖同一个底层库（如 numpy）的不同版本，全量安装极易触发依赖解析冲突，导致安装失败或运行时行为异常。\n\n-
    安全审计困难：庞大的依赖树增加了受攻击面。安全团队需要审计每个间接依赖，而很多你可能根本用不到。\n\n- 更新耦合：如果只想升级 langchain-core，但
    langchain 元包的版本约束可能阻止你单独升级，迫你同时升级所有集成。\n\n✅ 按需安装的正确姿势：\n\n# 基础核心（必装）\npip install
    langchain-core\n\n# 根据实际使用的模型和服务安装\npip install langchain-openai        # 如果用
    OpenAI\npip install langchain-anthropic     # 如果用 Anthropic\npip install langchain-pinecone
    \     # 如果用 Pinecone 向量库\npip install langchain-community     # 如果需要社区中的某个集成\n\n#
    保持最小化安装，只加你真正使用的\n\n\U0001F4E6 实践中的策略：\n\n- 在 requirements.txt 或 pyproject.toml
    中，明确列出所需的提供商包，而非笼统的 langchain。\n\n- 使用工具（如 pipdeptree）定期审查依赖树，移除未使用的集成。\n\n- 对于容器化部署，构建多阶段
    Dockerfile，只将最终运行时需要的包复制进镜像。"

content:
  prompt: 使用 LangChain 时，如何进行单元测试和集成测试？有哪些 mock 技巧？
answer:
  mode: rubric
  reference_answer: "\U0001F9EA 测试策略：\n\n- 单元测试：测试单个组件（Prompt 模板、输出解析器、自定义函数）的纯逻辑，不涉及真正的
    LLM 调用。\n\n- 集成测试：测试完整的链执行流程，但使用模拟的 LLM 响应（mock），验证组件间的数据传递和逻辑分支。\n\n- 端到端测试：在预发布环境中使用真实的模型（或固定的测试模型）进行少量调用，验证整体行为。\n\n\U0001F3AD
    Mock 技巧：\n\n- Mock ChatOpenAI.invoke（或 ainvoke）\n使用 unittest.mock.patch 替换模型的方法，返回预设的
    AIMessage。例如：\n\nfrom unittest.mock import patch, MagicMock\ndef test_qa_chain():\n
    \   mock_response = AIMessage(content=\"答案是42\")\n    with patch.object(ChatOpenAI,
    \"invoke\", return_value=mock_response):\n        chain = qa_chain()\n        result
    = chain.invoke({\"question\": \"生命的意义是什么？\"})\n        assert \"42\" in result\n\n-
    使用 Fake LLM\nLangChain 提供了 FakeLLM 和 FakeChatModel，它们直接返回预设的文本或消息，适合单元测试中不关心模型调用细节的场景。\n\nfrom
    langchain_core.language_models.fake import FakeChatModel\nfake_model = FakeChatModel(responses=[AIMessage(content=\"测试输出\")])\nchain
    = prompt | fake_model | parser\n\n- Mock 工具和检索器\n对于工具调用，可以 mock tool.invoke；对于
    RAG 检索器，可以 mock retriever.get_relevant_documents，返回预定义的文档列表。\n\n- 使用 pytest 和
    pytest-asyncio 测试异步链\n对于 ainvoke、astream 等方法，使用 @pytest.mark.asyncio 标记异步测试函数，并用
    AsyncMock 替换异步模型调用。\n\n- 集成测试中的快照测试\n将链的输入和期望输出保存为 JSON 文件，每次测试时用真实（但可能廉价的）模型运行，对比输出是否在可接受范围内。适合回归测试。\n\n\U0001F4A1
    最佳实践：单元测试应覆盖所有分支和错误处理逻辑，运行速度极快（秒级），在 CI 中强制通过。集成测试可以使用真实的 API（但使用最小 Token 数），每天定时运行，监控模型行为漂移。"

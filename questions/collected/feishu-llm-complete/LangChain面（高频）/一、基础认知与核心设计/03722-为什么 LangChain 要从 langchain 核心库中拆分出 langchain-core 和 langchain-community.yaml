content:
  prompt: 为什么 LangChain 要从 langchain 核心库中拆分出 langchain-core 和 langchain-community？
answer:
  mode: rubric
  reference_answer: "\U0001F527 解耦核心抽象与具体实现\n最初 langchain 库包罗万象，所有组件（模型、工具、文档加载器、向量存储）都在同一个包中，导致核心逻辑和第三方集成紧耦合。一旦某个集成（如
    Pinecone）升级 API，整个 langchain 都要更新版本，用户被迫升级可能不相关的依赖。拆分后：\n\n- langchain-core 只包含
    BaseChatModel、Chain、Runnable、PromptTemplate 等核心抽象，不依赖任何第三方 SDK。它定义了框架的“宪法”，版本稳定，API
    变化极慢。\n\n- langchain-community 承载所有第三方集成，更新频繁，但不会影响核心抽象。用户可以根据需要单独安装社区包，未使用的集成不会引入额外的依赖。\n\n\U0001F4E6
    减少依赖污染\n以前安装 langchain 会拉取 50+ 个第三方库（如各种向量数据库 SDK、文档解析器），导致 Docker 镜像体积膨胀、依赖冲突风险高。现在用户只安装所需的提供商包（如
    langchain-openai、langchain-pinecone），实现了按需加载。\n\n\U0001F680 提升迭代速度与社区贡献\n社区贡献者只需在
    langchain-community 中添加集成，而不必担心破坏核心抽象。核心团队可以独立发布 langchain-core 的稳定版本，而社区包可以灵活发布实验性功能。\n\n⚖️
    版本管理与语义化\nlangchain-core 遵循严格的语义化版本，保证向后兼容。当开发者锁定核心版本后，可以放心升级社区包。这种分离的版本节奏使得生产环境更稳定。\n\n\U0001F50C
    轻量化部署\n在边缘设备或云函数中，只需 langchain-core + 必要的提供商包，不必携带庞大的集成库，减小部署体积。"

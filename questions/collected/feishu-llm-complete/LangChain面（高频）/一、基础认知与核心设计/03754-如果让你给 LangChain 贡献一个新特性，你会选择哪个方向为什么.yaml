content:
  prompt: 如果让你给 LangChain 贡献一个新特性，你会选择哪个方向？为什么？
answer:
  mode: rubric
  reference_answer: "\U0001F916 我会选择增强 Agent 的可控性与安全性，具体是为 Agent 提供细粒度的权限管理和沙箱执行环境。\n\n\U0001F9E0
    原因：\n\n- Agent 是目前 LLM 应用的最高价值形态，但也是风险最大的。一旦 Agent 拥有了文件读写、网络访问、代码执行等能力，恶意 Prompt
    或模型幻觉就可能造成真实损害。\n\n- 当前 LangChain 的工具调用缺乏完善的权限控制：工具要么全开要么全关，无法细粒度控制“这个 Agent 只能读这个目录，不能访问网络”。\n\n-
    增加一个 “权限中间层” 和 “沙箱执行器”，让开发者为每个工具指定所需权限（如 FileReadPermission(\"/data/*\")），并在执行前由框架拦截校验。这类似
    Android 的权限模型。\n\n\U0001F527 技术设计：\n\n- 定义 Permission 抽象类，支持文件、网络、数据库等权限。\n\n-
    在 Tool 的 invoke 前，自动检查当前 Agent 是否持有所需权限。\n\n- 集成 nsjail 或 gVisor 等沙箱技术，让高风险工具在隔离环境中运行。\n\n-
    在 LangSmith 中可视化展示每次工具调用的权限使用情况。\n\n这将极大提升 LangChain 在企业级应用中的信任度，让 Agent 从“玩具”走向“生产力”。"

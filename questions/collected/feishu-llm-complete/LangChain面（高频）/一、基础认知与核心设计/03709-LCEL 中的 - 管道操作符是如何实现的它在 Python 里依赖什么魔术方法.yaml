content:
  prompt: LCEL 中的 | 管道操作符是如何实现的？它在 Python 里依赖什么魔术方法？
answer:
  mode: rubric
  reference_answer: "\U0001F52E | 操作符在 Python 中由 or 魔术方法实现。在 LangChain 的 Runnable
    基类中，重写了 or 方法，使得两个 Runnable 对象可以通过 | 组合成一个新的 RunnableSequence。\n\n大致原理：\n\n```python\nclass
    Runnable:\n    def __or__(self, other: Runnable) -> RunnableSequence:\n        return
    RunnableSequence(self, other)\n```\n\n当你写 prompt | model | parser 时，Python 实际执行的是：\n\n```python\ntemp
    = prompt.__or__(model)  # 返回 RunnableSequence(prompt, model)\nchain = temp.__or__(parser)
    \ # 返回 RunnableSequence(temp, parser)\n```\n\n最终得到一个 RunnableSequence 对象，它内部保存了组件列表
    [prompt, model, parser]。\n\n当调用 chain.invoke(input) 时，RunnableSequence 会依次调用每个组件的
    invoke，并将上一个组件的输出作为下一个组件的输入，实现数据流水线。\n\n\U0001F4CC 设计优势：\n\n- 语法糖使得代码高度可读，像 Unix
    管道一样直观。\n\n- 由于 | 返回的仍然是 Runnable，所以链可以无限嵌套，一个链可以作为另一个链的组件。\n\n- 框架可以在运行时自动推断输入输出类型，并在组件不匹配时给出清晰的错误提示。"

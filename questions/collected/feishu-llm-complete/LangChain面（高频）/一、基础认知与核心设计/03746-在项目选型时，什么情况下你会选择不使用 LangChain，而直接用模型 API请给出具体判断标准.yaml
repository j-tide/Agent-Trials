content:
  prompt: 在项目选型时，什么情况下你会选择不使用 LangChain，而直接用模型 API？请给出具体判断标准。
answer:
  mode: rubric
  reference_answer: "\U0001F4CB 简单直接的一次性任务\n如果应用只是单次调用 LLM 获取答案，没有多步推理、工具调用或复杂状态管理，LangChain
    的抽象反而成为累赘。例如，写一个脚本对 CSV 中每条记录生成简短摘要，openai.ChatCompletion.create 足以胜任。此时引入 LangChain
    如同“用大炮打蚊子”。\n\n\U0001F39B️ 需要精细控制模型行为\nLangChain 的 ChatOpenAI 封装了很多底层参数，但有时不够灵活。当需要直接操作底层
    API（如使用 OpenAI 的 logit_bias 精确控制 token 概率，或利用某些模型特有的采样参数）时，直接使用 SDK 更直接。LangChain
    的抽象可能会屏蔽这些高级特性。\n\n⚡ 极致性能与低延迟场景\n\nLangChain 的组件化和回调机制会带来额外的序列化/反序列化和函数调用开销。对于高并发、低延迟的推理服务，直接使用异步
    HTTP 客户端调用 API 并手写极简的 prompt 拼接，能消除框架开销。如果每次调用延迟增加 10ms，在百万级请求下就是巨大的资源浪费。\n\n\U0001F512
    需要绝对的环境控制与最小依赖\n\n某些安全敏感环境（如金融、军事）要求最小化第三方依赖，审计每一行代码。LangChain 庞大的依赖树可能无法通过安全审查。直接使用官方
    SDK 可以确保依赖链透明且最小。\n\n\U0001F4DA 学习曲线与团队接受度\n\n如果团队成员对 LangChain 不熟悉，且项目时间紧张，强制引入框架反而降低效率。对于一次性原型，学会
    LangChain 的时间可能足够写完整个应用。判断标准：如果 LCEL 链的复杂度远大于手写函数，就放弃框架。\n\n\U0001F504 需要频繁切换模型提供商但又不希望学习新框架\n虽然
    LangChain 解决了模型切换问题，但如果项目已经有一套自己的模型抽象层（例如使用 litellm 或自研网关），就不必再引入 LangChain。\n\n\U0001F6A6
    判断决策树：\n\n- 应用是否需要多步推理、工具调用、多轮对话记忆？ → 是 → 考虑 LangChain\n\n- 是否需要与向量数据库、文档处理等集成？
    → 是 → 考虑 LangChain\n\n- 项目周期、团队熟悉度、性能要求是否允许框架开销？ → 否 → 直接 API\n\n- 是否只需要一个模型提供商且无复杂逻辑？
    → 是 → 直接 API"

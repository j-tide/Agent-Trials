content:
  prompt: 请解释 RunnableParallel 和 RunnableMap 的区别及各自的使用场景。
answer:
  mode: rubric
  reference_answer: "\U0001F5FA️ RunnableMap：本质上是将一个字典的各个值通过不同的 Runnable 分别处理，然后将结果重新组装成字典。它是
    RunnableParallel 的底层实现。通常不直接使用 RunnableMap，而是通过 RunnableParallel 的构造语法来间接调用。\n\n\U0001F3D7️
    RunnableParallel：是 RunnableMap 的声明式封装，用于并行执行多个 Runnable。它接收一个字典，键是输出字段名，值是一个 Runnable。当
    invoke 被调用时，它会并行（异步）执行字典中的所有 Runnable，并将结果收集为一个字典输出。\n\n使用场景：\n\n- 同时调用多个模型进行对比：\n\n```python\nfrom
    langchain_core.runnables import RunnableParallel\nparallel_models = RunnableParallel(\n
    \   gpt=ChatOpenAI(model=\"gpt-4\"),\n    claude=ChatAnthropic(model=\"claude-3-sonnet\")\n)\nresult
    = parallel_models.invoke(\"什么是LangChain？\")\n# result = {\"gpt\": AIMessage(...),
    \"claude\": AIMessage(...)}\n```\n\n- 同时进行检索和保留原始问题：\n\n```python\nchain = RunnableParallel(\n
    \   context=retriever,\n    question=RunnablePassthrough()\n)\n```\n\n- 多工具并行调用：Agent
    需要同时查询天气和股票，可以并行执行两个工具调用。\n\n区别：\n\n- RunnableMap 是底层实现类，RunnableParallel 是对它的高层封装，推荐使用后者。\n\n-
    RunnableParallel 可以通过 | 与其他 Runnable 自然组合，而 RunnableMap 通常只在内部使用。"

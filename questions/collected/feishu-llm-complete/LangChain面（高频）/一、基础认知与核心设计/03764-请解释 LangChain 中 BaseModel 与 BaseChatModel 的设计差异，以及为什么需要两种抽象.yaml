content:
  prompt: 请解释 LangChain 中 BaseModel 与 BaseChatModel 的设计差异，以及为什么需要两种抽象？
answer:
  mode: rubric
  reference_answer: "\U0001F916 BaseModel：继承自 BaseLLM，用于文本补全模型（如 GPT-3、text-davinci-003、早期的
    Cohere Generate API）。输入和输出都是纯字符串。它处理的是原始的文本提示（Prompt），直接发送给模型并返回文本。这种模式适用于单轮文本生成任务（摘要、翻译、代码生成等），但没有内置的对话角色管理。\n\n\U0001F4AC
    BaseChatModel：用于对话模型（如 GPT-3.5-Turbo、GPT-4、Claude、Llama Chat）。它理解消息的概念，输入是一个 List[BaseMessage]，包含
    SystemMessage、HumanMessage、AIMessage 等，输出也是消息对象。这符合现代 LLM 的对话 API 格式，原生支持多轮对话、角色扮演和工具调用。\n\n\U0001F3AF
    为什么需要两种抽象？\n\n- \U0001F4DC 历史原因：早期语言模型（2020-2022）主要提供文本补全 API。ChatGPT 面世后，对话格式成为主流。LangChain
    最初设计 BaseModel 来统一补全接口，后来增加了 BaseChatModel 以适应新范式。\n\n- \U0001F9E9 接口清晰度：纯文本任务不需要消息结构，强制使用
    ChatModel 会让代码冗余（例如需要手动包装 HumanMessage）。反之，多轮对话必须保持角色区分，使用 BaseModel 会丢失信息。\n\n-
    \U0001F500 Prompt 模板处理不同：BaseModel 配合 PromptTemplate 生成最终文本字符串；BaseChatModel 配合
    ChatPromptTemplate 生成消息列表。两者在模板逻辑、变量绑定上差异较大，分开抽象更清晰。\n\n- \U0001F527 可扩展性：BaseChatModel
    支持工具调用（Function Calling）、多模态输入等高级特性，这些难以在 BaseModel 中表达。独立抽象可以避免 BaseModel 被过度复杂化。\n\n在实际使用中，绝大多数新应用都应选择
    BaseChatModel，因为它是当前 LLM 的标准接口。BaseModel 主要为了向后兼容。"

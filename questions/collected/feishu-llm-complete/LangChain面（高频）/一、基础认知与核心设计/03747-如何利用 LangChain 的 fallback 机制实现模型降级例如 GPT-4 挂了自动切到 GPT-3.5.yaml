content:
  prompt: 如何利用 LangChain 的 fallback 机制实现模型降级？例如 GPT-4 挂了自动切到 GPT-3.5。
answer:
  mode: rubric
  reference_answer: "\U0001F6E1️ LCEL 的 with_fallbacks() 是实现模型降级的利器。它允许为一个 Runnable
    指定一个或多个备用 Runnable，当主 Runnable 执行失败时，自动尝试备用。\n\n\U0001F4DC 示例：\n\nfrom langchain_openai
    import ChatOpenAI\n\n# 主模型\ngpt4 = ChatOpenAI(model=\"gpt-4o\", temperature=0)\n#
    备用模型\ngpt35 = ChatOpenAI(model=\"gpt-3.5-turbo\", temperature=0)\n\n# 创建带降级的模型\nrobust_model
    = gpt4.with_fallbacks([gpt35])\n\nchain = prompt | robust_model | parser\n\n⚡
    执行逻辑：\n\n- 链首先使用 gpt4 调用。\n\n- 如果 gpt4 因为网络超时、API 返回 5xx 错误、Rate Limit 等原因抛出异常，LangChain
    会捕获异常并自动尝试 gpt35。\n\n- 如果所有备用模型都失败，则抛出最终异常。\n\n\U0001F9E9 更复杂的降级策略：\n\n- 可以为不同的异常类型指定不同的备用模型（例如，认证错误不降级，直接抛出）。\n\n-
    可以嵌套 fallback，例如 gpt4.with_fallbacks([gpt35.with_fallbacks([local_model])])。\n\n-
    结合回调系统，在降级发生时发送告警通知。\n\n这种机制在不改变业务逻辑代码的前提下，极大提升了 LLM 应用的可用性。"

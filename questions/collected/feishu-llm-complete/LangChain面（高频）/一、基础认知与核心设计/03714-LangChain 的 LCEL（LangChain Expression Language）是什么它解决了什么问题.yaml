content:
  prompt: LangChain 的 LCEL（LangChain Expression Language）是什么？它解决了什么问题？
answer:
  mode: rubric
  reference_answer: "\U0001F3AF LCEL 是 LangChain 的领域特定语言，让你可以用声明式的运算符（主要是 |）来组合 Runnable
    组件，构建出复杂的数据处理管道。\n\n它解决的问题：\n\n\U0001F517 管道组合的直观化：传统 Chain 类需要继承、重写方法，代码冗长且不直观。LCEL
    让你像写 Unix 管道一样串联步骤：step1 | step2 | step3，数据从左到右流动，一目了然。\n\n\U0001F9E9 自动流式传递：在
    LCEL 链中，如果一个组件支持流式输出，其下游组件会自动以流式方式处理，无需手动管理生成器。比如 prompt | model | parser，模型输出流式
    Token，parser 也会逐个 Token 解析。\n\n⚡ 自动批处理：LCEL 链默认支持批处理，框架自动将多个输入并行分发到各步骤。\n\n\U0001F6E1️
    错误传递与回退：LCEL 提供 with_fallbacks() 方法，可以为链配置备用模型或处理逻辑。当主模型不可用时，自动切换到备用方案，对上层调用者透明。\n\n\U0001F4CA
    运行时配置与可观测性：通过 with_config() 可以动态设置回调、标签、元数据，轻松接入监控系统。\n\n\U0001F4E6 代码极简：相比继承
    Chain 类，LCEL 只需要几行代码就能定义一个完整的 RAG 流程，可读性极高，维护成本极低。"

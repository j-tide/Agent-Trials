content:
  prompt: 为什么需要 LangChain 这样的框架？直接用 OpenAI SDK 写应用有什么局限？
answer:
  mode: rubric
  reference_answer: "直接用 OpenAI SDK 的局限：\n\n\U0001F50C 单一模型绑定：OpenAI SDK 仅封装了 OpenAI
    的 API 调用，代码中写死了 openai.ChatCompletion.create。一旦需要切换模型（如换成 Anthropic、本地 Llama、或者混合使用多个模型），就得逐个修改函数签名、参数名、响应解析逻辑。不同厂商的
    API 在输入格式、输出结构、计费方式上差异极大，直接导致代码耦合严重。\n\n\U0001F9E9 缺乏流程编排能力：LLM 应用很少是“一问一答”的简单模式。典型场景包括
    RAG（检索增强生成）、多步推理（Chain of Thought）、工具调用（Function Calling）、多轮对话记忆管理等。用原生 SDK 实现这些，需要手动管理
    prompt 拼接、上下文窗口裁剪、中间结果传递、错误重试等逻辑，代码会迅速膨胀成难以维护的意大利面条。\n\n\U0001F4E6 缺少现成的组件抽象：比如向量数据库的连接、文档加载器、文本分割器、输出解析器（让模型输出结构化
    JSON 而非自由文本），这些都需要自己造轮子。即使造出来，也往往是针对特定模型的临时方案，缺乏通用性。\n\n\U0001F504 状态管理困难：多轮对话需要维护对话历史，长文本需要分块处理，这些状态的持久化、序列化、跨会话恢复都需要额外开发。\n\n⚡
    生产化需求缺失：缓存、限流、日志、监控、A/B 测试、回退策略等生产环境必需的能力，原生 SDK 完全没提供，需要从零搭建。\n\nLangChain 带来的改变：\n\nLangChain
    本质上是 LLM 应用开发的“Spring Boot”——它提供了一套标准化的组件接口和编排机制，让开发者可以像搭积木一样组合模型、工具、记忆、检索等模块，而无需关心底层实现细节。它把“用
    SDK 写死一个模型”升级为“用框架定义一条可插拔的处理流水线”。"

content:
  prompt: 你如何在 LangChain 中使用本地模型（如通过 Ollama 或 vLLM 部署的服务）？
answer:
  mode: rubric
  reference_answer: "\U0001F5A5️ 使用本地模型 可以保护数据隐私、降低 API 成本，并能对模型进行完全控制。LangChain 通过统一的接口支持多种本地模型服务方式。\n\n方式一：通过
    Ollama\n\nOllama 是一个极简的本地模型运行工具。安装并启动 Ollama 后（ollama run llama3），在 LangChain
    中如下调用：\n\nfrom langchain_ollama import ChatOllama\n\nmodel = ChatOllama(model=\"llama3\",
    temperature=0)\nchain = prompt | model | parser\n# 支持流式、异步、函数调用等所有标准功能\n\n方式二：通过
    vLLM 部署的兼容 OpenAI 的服务\n\nvLLM 可以部署一个与 OpenAI API 兼容的服务。启动 vLLM 后（例如在 http://localhost:8000/v1），LangChain
    可以将其视为一个自定义的 OpenAI 服务：\n\nfrom langchain_openai import ChatOpenAI\n\nmodel =
    ChatOpenAI(\n    model=\"local-model\",  # vLLM 中的模型名\n    base_url=\"http://localhost:8000/v1\",\n
    \   api_key=\"not-needed\",  # vLLM 默认不需要验证\n)\n# 使用方式与 OpenAI 完全一致\n\n方式三：通过
    HuggingFace 本地管道\n\n如第6题所述，使用 HuggingFacePipeline 加载 Transformers 模型。\n\n关键考量：\n\n-
    性能：本地模型推理速度通常比云端 API 慢，需要评估延迟是否满足业务要求。vLLM 能提供更好的吞吐和并发。\n\n- 显存：大模型需要足够的 GPU 显存。使用量化（如
    GGUF）可以降低资源消耗。\n\n- 兼容性：并非所有本地模型都支持 Function Calling 或复杂的指令遵循，选择模型时需验证其能力。\n\n通过
    LangChain 的统一接口，你可以在开发阶段使用本地小模型快速迭代，部署到生产时无缝切换至云端大模型，实现灵活的模型策略。"

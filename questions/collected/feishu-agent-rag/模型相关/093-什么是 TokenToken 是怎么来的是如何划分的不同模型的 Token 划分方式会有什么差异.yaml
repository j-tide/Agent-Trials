content:
  prompt: 什么是 Token？Token 是怎么来的？是如何划分的？不同模型的 Token 划分方式会有什么差异？
answer:
  mode: rubric
  reference_answer: "Token 的本质：Token 是 LLM 处理文本的最小单元。模型不直接处理字符或单词，而是将文本拆分为 Token 序列，每个
    Token 映射到一个整数 ID。\n\nToken 的产生过程（Tokenization）：\n\n```text\n原始文本 → Tokenizer →
    Token 序列 → Token ID 序列 → 模型处理\n\n示例：\"I love programming\" \n  → [\"I\", \" love\",
    \" program\", \"ming\"]  (4个Token)\n  → [40, 3567, 15234, 2468]              (4个ID)\n```\n\n主流
    Tokenization 算法：\n\n不同模型的差异：\n\n- 词汇表大小：GPT-4 约 10 万，Llama 约 3.2 万，Claude 约 10
    万\n\n- 中文处理：早期 GPT 模型 1 个汉字可能 2-3 个 Token；新模型优化后通常 1 个汉字 ≈ 1-1.5 个 Token\n\n-
    代码处理：专门优化过的模型（如 Codex）会将常见代码模式作为单个 Token\n\n- 数字处理：有些模型将每个数字作为独立 Token，有些会合并连续数字\n\n实际影响：\n\n-
    Token 划分方式直接影响上下文窗口的实际容量（同样 200K Token，不同 Tokenizer 能装的文本量不同）\n\n- 中文文本在多数模型中的
    Token 效率低于英文（同样内容需要更多 Token）\n\n- 1000 个英文 Token ≈ 750 个单词 ≈ 约 500 个中文字\n\n---"

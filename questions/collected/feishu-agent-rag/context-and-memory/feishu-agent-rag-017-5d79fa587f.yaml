content:
  prompt: 如何设计一个高效的 Agent 上下文维护方案？
answer:
  mode: rubric
  reference_answer: |-
    上下文维护是 Agent 工程化的核心挑战之一。一个高效的方案需要分层设计：

    第一层：即时上下文（Immediate Context）

    - 当前对话的完整消息历史

    - System Prompt + 用户最新输入 + 工具调用结果

    - 管理策略：滑动窗口 + 重要消息优先保留

    第二层：会话级上下文（Session Context）

    - 当前会话的关键信息摘要

    - 已完成的任务步骤和中间结果

    - 管理策略：达到 Token 阈值时触发压缩，保留结构化摘要

    第三层：用户级上下文（User Context）

    - 用户画像、偏好、历史交互模式

    - 跨会话持久化，存储在向量数据库或 KV 存储中

    - 管理策略：基于向量相似度检索相关记忆

    第四层：系统级上下文（System Context）

    - 工具定义、知识库索引、全局配置

    - 相对静态，变化频率低

    工程实现要点：

    - Token 预算分配：System Prompt（10-15%）+ 长期记忆检索（15-20%）+ 对话历史（40-50%）+ 工具结果（15-20%）+ 生成预留（10-15%）

    - 动态裁剪：根据当前任务动态调整各层的 Token 分配

    - 优先级队列：为不同类型的上下文信息赋予优先级，空间不足时优先丢弃低优先级内容

    - 增量更新：不要每次全量重建上下文，而是增量更新变化的部分

    ---

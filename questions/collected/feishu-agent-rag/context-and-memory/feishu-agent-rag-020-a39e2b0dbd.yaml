content:
  prompt: 什么样的信息应该放在长期记忆，什么样的信息放在短期记忆？
answer:
  mode: rubric
  reference_answer: |-
    短期记忆（上下文窗口）适合存放：

    - 当前对话的完整消息历史

    - 当前任务的详细指令和约束

    - 工具调用的原始返回结果

    - 正在进行的推理链和中间步骤

    - 临时性、一次性的信息（如"帮我查一下今天的天气"的结果）

    长期记忆适合存放：

    - 用户画像和偏好（"用户偏好 Python 而非 Java"、"用户是初级开发者"）

    - 重要的历史决策和结论（"上次讨论后决定使用 PostgreSQL"）

    - 项目级知识（架构设计、技术选型、关键约束）

    - 交互模式（用户的沟通风格、常见需求模式）

    - 实体关系（用户提到的人、项目、工具之间的关系）

    - 错误和经验教训（"上次尝试 X 方案失败了，原因是 Y"）

    判断标准：

    - 时效性：几分钟内失效 → 短期；可能在未来会话中有用 → 长期

    - 通用性：只对当前任务有用 → 短期；对未来多个任务有用 → 长期

    - 重要性：细节性、临时性信息 → 短期；高层次、决策性信息 → 长期

    - 频率：反复出现的信息 → 应该固化到长期记忆


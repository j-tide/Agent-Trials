content:
  prompt: 上下文管理是怎么做的，如何进行记忆？
answer:
  mode: rubric
  reference_answer: |-
    这道题与上题有重叠，但侧重点在"管理策略"，需要回答一个完整的管理流程：

    上下文管理的完整流程：

    - 上下文构建（Context Assembly）

    ```text
    final_context = [
        system_prompt,           # 固定部分：角色定义、行为约束
        long_term_memories,      # 动态检索：从向量库检索相关记忆
        conversation_summary,    # 压缩部分：历史对话摘要
        recent_messages[-K:],    # 原文部分：最近 K 轮对话
        tool_results,            # 临时部分：最新工具调用结果
        current_query            # 当前输入
    ]
    ```

    - Token 预算管理

    - 设定每个部分的 Token 上限

    - 实时监控总 Token 消耗

    - 动态调整：如当前任务工具结果多，则压缩对话历史部分

    - 记忆写入策略

    - 实时写入：每轮对话即时更新短期记忆

    - 批量写入：会话结束时批量写入长期记忆

    - 事件驱动写入：关键决策、重要信息变更时触发

    - 记忆读取策略

    - 会话开始时：加载用户画像 + 最近交互摘要

    - 每轮对话时：基于当前查询检索相关长期记忆

    - 任务切换时：重新检索与新任务相关的记忆

    - 记忆维护策略

    - 定期清理过期记忆

    - 合并重复记忆

    - 解决冲突记忆（以最新为准）


  reference_answer: |-
    按优先级排列：

    - 用户身份与偏好：姓名、角色、技术栈偏好、沟通风格、语言偏好

    - 关键决策记录：讨论过的方案、最终选择、选择原因

    - 项目上下文：正在进行的项目名称、技术架构、关键约束

    - 实体关系图：用户提及的人物、系统、工具之间的关系

    - 任务历史摘要：完成过什么任务、结果如何、遇到过什么问题

    - 经验教训：失败的尝试和原因、成功的模式

    - 待办事项：未完成的任务和后续计划

    - 交互元数据：最后交互时间、交互频率、常见话题


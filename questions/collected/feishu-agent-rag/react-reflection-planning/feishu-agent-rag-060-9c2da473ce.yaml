content:
  prompt: 什么是 Agent 的反思机制？
answer:
  mode: rubric
  reference_answer: "反思机制（Reflection） 是让 Agent 在生成输出后进行自我审视和改进的能力。\n\n实现方式：\n\n```python\n#
    两阶段反思\ndef generate_with_reflection(query, context):\n    # 阶段一：生成初始回答\n    initial_response
    = llm.call(f\"请回答：{query}\", context=context)\n    \n    # 阶段二：反思审查\n    reflection
    = llm.call(f\"\"\"\n    请审查以下回答的质量：\n    \n    用户问题：{query}\n    初始回答：{initial_response}\n
    \   \n    检查维度：\n    1. 事实准确性：回答中是否有明显错误？\n    2. 完整性：是否遗漏了重要信息？\n    3. 语气适当性：语气是否专业、温和、得体？\n
    \   4. 逻辑一致性：回答是否自相矛盾？\n    \n    如果发现问题，请输出改进后的版本。\n    如果没有问题，输出\"APPROVED\"。\n
    \   \"\"\")\n    \n    if \"APPROVED\" in reflection:\n        return initial_response\n
    \   else:\n        return reflection  # 改进后的版本\n```\n\n心理咨询 Agent 中的语气检查：\n\n```python\nTONE_CHECK_PROMPT
    = \"\"\"\n你是心理咨询质控专家。请审查以下回复是否符合专业标准：\n\n回复内容：{response}\n\n检查要点：\n1. 是否使用了共情性语言（如\"我理解你的感受\"）？\n2.
    是否避免了评判性词汇（如\"你不应该\"、\"你错了\"）？\n3. 是否保持了温暖但专业的距离？\n4. 是否避免了给出简单化的建议（如\"想开点\"）？\n5.
    是否注意到了潜在的危险信号需要进一步追问？\n\n输出：{\"passed\": true/false, \"issues\": [...], \"revised_response\":
    \"...\"}\n\"\"\"\n```\n\n---"

content:
  prompt: 如何保证 Workflow 和 Agent 的成功率？
answer:
  mode: rubric
  reference_answer: |-
    Workflow 成功率保障：

    - 节点级保障：每个节点配备输入校验、输出校验和 fallback 逻辑

    - Prompt 工程：对每个 LLM 调用节点做充分的 Prompt 优化和测试

    - 结构化输出：使用 JSON Schema / Pydantic 等强制输出格式

    - 重试机制：对可恢复的错误进行自动重试（指数退避）

    - 监控告警：每个节点的成功率、延迟、Token 消耗实时监控

    - A/B 测试：通过灰度发布逐步验证新版本

    Agent 成功率保障：

    - 约束 Agent 行为空间：限制可用工具集、设置最大迭代次数、限制 Token 预算

    - Guardrails（护栏）：输入过滤 + 输出审核，防止异常行为

    - Few-shot 示例：在 System Prompt 中提供成功执行的范例

    - Self-Check 机制：在关键步骤后加入验证环节

    - Human-in-the-Loop：高风险决策前要求人工确认

    - 可观测性：详细记录每步推理和行动，便于事后分析

    - 评测体系：构建自动化评测集，对 Agent 定期回归测试

    - 模型选择：关键路径使用最强模型（如 Claude Opus / GPT-5），非关键路径使用轻量模型降本

    量化指标：任务完成率、端到端延迟 P95、平均推理步数、Token 消耗、异常率。


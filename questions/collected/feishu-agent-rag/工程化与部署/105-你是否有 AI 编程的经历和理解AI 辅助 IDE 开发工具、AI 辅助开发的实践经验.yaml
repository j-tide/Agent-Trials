    主流 AI 编码工具体验：

    实践经验总结：

    - AI 适合做的事：样板代码、单元测试、重构、文档生成、bug 修复

    - AI 不适合做的事：架构设计决策、复杂业务逻辑、安全审计

    - 最佳实践：先用自然语言描述需求 → AI 生成初版 → 人工审查修改 → AI 生成测试

    - Context 是关键：给 AI 足够的上下文（相关文件、需求描述、约束条件）比用更强的模型更有效


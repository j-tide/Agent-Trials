    系统化解决方案：

    - 停下来，手动分析错误：不要让 AI 持续在同一个方向上挣扎。阅读错误信息，理解根本原因。

    - 提供更精确的上下文：

    - 缩小问题范围：

    - 切换策略：

    - 重新开始对话：Cursor 的长对话会累积上下文噪声，新开一个 Chat 往往更有效

    - 检查 Memory Bank / Rules：确认 .cursor/rules/ 中是否有与当前问题相关的规则

    - 查官方文档：AI 可能使用了过时的 API，手动查阅最新文档确认正确用法


answer:
  mode: rubric
  reference_answer: |-
    代码理解的技术原理（以 Cursor/GitHub Copilot 为例）：

    （1）代码索引

    ```text
    项目文件 → AST 解析 → 符号提取（函数、类、变量）
             → 代码嵌入（向量化）→ 向量索引
    ```

    - 构建项目的代码符号表和语义索引

    - 支持按语义相似度检索相关代码片段

    （2）上下文收集

    ```text
    当前光标位置 → 收集上下文：
      - 当前文件内容
      - import 的模块
      - 同目录的相关文件
      - 符号的定义和引用（通过 LSP）
      - 最近编辑的文件
    ```

    （3）检索增强

    - 用当前代码的语义向量检索项目中最相关的代码片段

    - 类似 RAG，但数据源是代码库而非文档

    （4）Prompt 构建

    ```text
    System Prompt + 项目上下文（架构、技术栈）
    + 相关代码片段（检索得到）
    + 当前文件内容
    + 用户指令
    → LLM → 代码生成/修改
    ```


content:
  prompt: 如何处理异常情况？比如路由到了一个错误的任务，用户说不对，Agent 会不会纠正自己的行为？
answer:
  mode: rubric
  reference_answer: "是的，成熟的 Agent 系统必须支持用户反馈驱动的自我纠正。\n\n```python\nclass SelfCorrectingAgent:\n
    \   def handle_user_feedback(self, feedback):\n        if self.detect_correction(feedback):\n
    \           # 1. 承认错误\n            response = \"抱歉理解有误。\"\n            \n            #
    2. 分析错误原因\n            error_analysis = self.llm.call(f\"\"\"\n            用户原始请求：{self.original_query}\n
    \           我的理解：{self.last_routing_decision}\n            用户反馈：{feedback}\n            \n
    \           分析我理解错误的原因，并重新判断用户的真正意图。\n            \"\"\")\n            \n            #
    3. 重新路由\n            new_route = self.re_route(self.original_query, feedback,
    error_analysis)\n            \n            # 4. 记录错误案例（用于改进）\n            self.error_log.append({\n
    \               \"query\": self.original_query,\n                \"wrong_route\":
    self.last_routing_decision,\n                \"correct_route\": new_route,\n                \"user_feedback\":
    feedback\n            })\n            \n            return self.execute(new_route)\n```\n\n其他异常处理策略：\n\n-
    超时：设置每步超时，超时后用 fallback 响应\n\n- 工具调用失败：重试 → 换工具 → 降级处理\n\n- 模型输出格式错误：解析失败时自动重试，并在
    Prompt 中强调格式要求\n\n- 死循环检测：连续 3 次相同操作触发退出\n\n---"

content:
  prompt: 如何维护 Agent 生成的证据链，怎么确保不会出现幻觉？
answer:
  mode: rubric
  reference_answer: "证据链维护：\n\n```python\nclass EvidenceChain:\n    def __init__(self):\n
    \       self.chain = []\n    \n    def add_evidence(self, claim, source, confidence):\n
    \       self.chain.append({\n            \"claim\": claim,\n            \"source\":
    source,          # 工具返回/数据库记录/文档段落\n            \"source_type\": \"tool_result\",
    \ # tool_result / rag_retrieval / user_input\n            \"confidence\": confidence,\n
    \           \"timestamp\": now()\n        })\n    \n    def verify_response(self,
    response):\n        \"\"\"检查回答中的每个事实声称是否有证据支持\"\"\"\n        claims = extract_claims(response)\n
    \       for claim in claims:\n            evidence = self.find_supporting_evidence(claim)\n
    \           if not evidence:\n                claim.mark_as(\"unverified\")  #
    标记为未验证\n```\n\n减少幻觉的综合方案：\n\n- RAG 增强：回答基于检索到的真实文档\n\n- 强制引用：要求模型在回答中引用信息来源\n\n-
    事后验证：用另一个 LLM 检验回答的事实准确性\n\n- 置信度标注：对不确定的信息标注\"未经验证\"\n\n- 人工审核：高风险输出需要人工确认"

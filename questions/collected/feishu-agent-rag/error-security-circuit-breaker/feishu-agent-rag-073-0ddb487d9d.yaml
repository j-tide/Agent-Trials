answer:
  mode: rubric
  reference_answer: |-
    前端层面的防御重点在于不信任任何用户输入：

    - 输入清洗：移除特殊字符、控制字符、不可见 Unicode 字符

    - 长度限制：限制单次输入的最大长度

    - 频率限制：单位时间内的请求次数限制

    - 内容安全分类器：调用安全分类模型（如 OpenAI Moderation API）前置过滤

    - 明确的输入边界：用结构化格式区分用户输入和系统指令


content:
  prompt: 真实智能体上线前如何构造数据集进行准确性测试？
answer:
  mode: rubric
  reference_answer: |-
    数据集构造方法论：

    （1）真实数据采集

    - 从历史客服记录、用户日志中提取真实查询

    - 脱敏处理后用作测试用例

    - 优点：最接近真实分布

    （2）专家构造

    - 领域专家编写覆盖核心场景的测试用例

    - 包括：正常情况 + 边界情况 + 异常情况

    - 每个用例标注期望结果和评分标准

    （3）LLM 辅助生成

    ```python
    test_cases = llm.call("""
    基于以下场景描述，生成 20 个测试用例，覆盖正常、边界和异常情况：
    场景：客户查询订单状态
    每个用例包含：
    - input: 用户输入
    - expected_agent: 应路由到的 Agent
    - expected_tools: 应调用的工具
    - expected_output_keywords: 回答中应包含的关键信息
    - difficulty: easy/medium/hard
    """)
    ```

    （4）对抗样本生成

    - 模糊表述、错别字、多意图混合

    - Prompt Injection 测试样本

    - 超长输入、特殊字符

    数据集管理：

    - 版本化管理（每次迭代增加新用例，不删除旧用例）

    - 按场景和难度分层

    - 定期更新（业务变化时同步更新测试用例）


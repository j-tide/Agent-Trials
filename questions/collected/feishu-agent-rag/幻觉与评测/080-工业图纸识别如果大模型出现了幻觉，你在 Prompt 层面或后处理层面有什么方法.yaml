content:
  prompt: 工业图纸识别如果大模型出现了幻觉，你在 Prompt 层面或后处理层面有什么方法？
answer:
  mode: rubric
  reference_answer: |-
    Prompt 层面：

    ```text
    你是一个专业的工业图纸分析师。请严格按照以下规则工作：
    1. 只描述你在图纸中实际看到的内容，不要推测或补充
    2. 对于模糊或不清晰的部分，标注为"无法识别"而非猜测
    3. 尺寸标注必须与图纸中的数字完全一致，不要进行单位换算除非明确要求
    4. 如果对某个符号不确定，列出可能的含义并标注置信度
    5. 输出结构化 JSON，每个识别项附带置信度分数
    ```

    后处理层面：

    - 规则校验：检查识别结果是否符合工程规范（如尺寸范围、公差标准）

    - 交叉验证：同一图纸用多个模型/多次识别，对比结果一致性

    - 模板匹配：将识别结果与已知的标准件库对比

    - 人工审核节点：关键尺寸和公差标注必须经人工确认

    - 历史比对：与同系列历史图纸对比，检测异常偏差


  prompt: 错误检测与回滚机制的作用是什么？
answer:
  mode: rubric
  reference_answer: |-
    作用：

    - 保证数据一致性：避免"做了一半"的不完整状态

    - 提升系统可靠性：自动恢复能力减少人工干预

    - 用户体验保障：对用户透明地处理错误，而非返回技术错误信息

    - 成本控制：及时中止无效操作，避免浪费更多资源

    - 可观测性：错误检测记录提供问题诊断的数据基础


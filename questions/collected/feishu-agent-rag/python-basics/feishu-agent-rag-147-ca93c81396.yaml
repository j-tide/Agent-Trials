content:
  prompt: Python 的 subprocess 库是什么？什么是进程？什么是协程？
answer:
  mode: rubric
  reference_answer: |-
    ### 一、subprocess 库

    subprocess 是 Python 标准库，用于创建和管理子进程——即从 Python 程序中启动一个独立的外部程序（如 shell 命令、其他可执行文件），并与其进行交互（传入 stdin、获取 stdout/stderr、等待退出码）。

    ```python
    import subprocess

    # 最常用：run() — 执行命令并等待完成
    result = subprocess.run(
        ["python", "train.py", "--epochs", "10"],
        capture_output=True,    # 捕获 stdout/stderr
        text=True,              # 输出为字符串而非 bytes
        timeout=3600,           # 超时限制
        check=True,             # 非零退出码自动抛异常
    )
    print(result.stdout)

    # 需要流式交互：Popen — 更底层的控制
    proc = subprocess.Popen(
        ["ffmpeg", "-i", "input.mp4", "output.mp3"],
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
    )
    stdout, stderr = proc.communicate()  # 等待完成并获取输出
    ```

    在 AI 工程中的典型应用：调用 ffmpeg 处理音视频、启动模型训练脚本、执行 git 命令管理代码仓库、调用系统命令（如 nvidia-smi）监控 GPU 状态、启动 MinerU 等文档解析工具。

    ### 二、进程（Process）

    进程是操作系统进行资源分配和调度的基本单位。每个进程拥有独立的内存空间（代码段、数据段、堆、栈）、文件描述符表和系统资源。进程之间相互隔离，一个进程崩溃不会影响其他进程。进程间通信（IPC）需要通过管道、消息队列、共享内存、Socket 等机制。

    关键特性：独立内存空间（安全隔离）、创建/销毁开销大（需要复制页表等）、上下文切换开销大（需要切换虚拟地址空间）、可以利用多核 CPU 真正并行。

    ### 三、协程（Coroutine）

    （详见第 7 题的深入解析）

    协程是用户态的轻量级并发单元，在单线程内通过协作式调度实现并发。关键区别：进程是 OS 管理的，开销大但隔离性好；协程是用户程序管理的，开销极小但只在单线程内运行。


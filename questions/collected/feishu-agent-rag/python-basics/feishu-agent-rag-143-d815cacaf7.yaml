content:
  prompt: 什么是协程，它和线程有什么区别？
answer:
  mode: rubric
  reference_answer: |-
    ### 一、协程的定义

    协程（Coroutine）是一种用户态的轻量级并发单元，它可以在执行过程中主动让出（await/yield）控制权，稍后从暂停处恢复执行。与线程不同，协程的切换完全在用户态完成，不涉及操作系统内核的上下文切换。

    Python 中通过 async def 定义协程函数，通过 await 暂停执行：

    ```python
    import asyncio

    async def fetch_data(url):
        async with aiohttp.ClientSession() as session:
            async with session.get(url) as resp:
                return await resp.json()  # await 处让出控制权

    async def main():
        results = await asyncio.gather(
            fetch_data("https://api1.com"),
            fetch_data("https://api2.com"),
        )
    ```


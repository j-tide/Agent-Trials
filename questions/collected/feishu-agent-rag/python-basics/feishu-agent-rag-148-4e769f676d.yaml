    - 构建标注数据集：{query, expected_route} × N 条

    - 指标：准确率、Top-3 召回率、混淆矩阵

    - 重点关注相似意图的区分度（如"退款"应路由到"billing"而非"support"）

    - 用户纠正率：用户说"不对"后重新路由的比例

    - 路由后的任务完成率：正确路由 → 任务完成率高

    - 平均路由延迟

    - 对比不同路由策略（语义路由 vs 规则路由 vs LLM 路由）

    - 观察端到端任务完成率和用户满意度


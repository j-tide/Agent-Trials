    - 打开相关文件让 Cursor 能"看到"依赖关系

    - 在 Chat 中明确说明："这个错误是因为 X 依赖在 Y 版本中 API 变了"

    - 粘贴完整的报错信息和相关代码

    - 不要让 AI 一次性改大块代码

    - 将问题拆解为更小的独立子问题

    - "先只修复这个函数的类型错误"

    - 从"修复代码"切换到"解释问题"：让 AI 先分析为什么报错

    - 从自动修复切换到手动修改：根据 AI 的分析自己改


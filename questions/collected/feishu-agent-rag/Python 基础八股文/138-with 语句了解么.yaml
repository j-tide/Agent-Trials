content:
  prompt: with 语句了解么？
answer:
  mode: rubric
  reference_answer: "### 一、本质：上下文管理器协议\n\nwith 语句是 Python 的上下文管理器（Context Manager）语法糖，用于管理资源的获取和释放。它确保即使代码块中发生异常，资源也能被正确清理——本质上是
    try...finally 的优雅封装。\n\n### 二、底层协议\n\nwith 语句依赖两个魔术方法：\n\n```python\nclass MyContextManager:\n
    \   def __enter__(self):\n        # 进入上下文时执行，返回值赋给 as 后的变量\n        print(\"获取资源\")\n
    \       return self  # 或返回其他对象\n    \n    def __exit__(self, exc_type, exc_val,
    exc_tb):\n        # 退出上下文时执行（无论是否异常）\n        print(\"释放资源\")\n        # 返回 True
    表示吞掉异常，返回 False/None 表示继续抛出\n        return False\n```\n\n执行流程：\n\n- 调用 enter()，返回值绑定到
    as 变量\n\n- 执行 with 代码块\n\n- 无论是否异常，调用 exit()\n\n- 如果有异常，exc_type/exc_val/exc_tb
    为异常信息；如果 exit 返回 True，异常被抑制\n\n### 三、contextlib 简化写法\n\n```python\nfrom contextlib
    import contextmanager\n\n@contextmanager\ndef open_file(path):\n    f = open(path,
    'r')\n    try:\n        yield f        # yield 之前 = __enter__，yield 的值 = as 变量\n
    \   finally:\n        f.close()      # yield 之后 = __exit__\n\nwith open_file('data.txt')
    as f:\n    content = f.read()\n```\n\n### 四、典型应用场景\n\n文件操作：with open('file.txt')
    as f — 自动关闭文件句柄，防止泄漏。\n\n数据库连接/事务：with db.session() as session — 自动提交或回滚事务，释放连接。\n\n线程锁：with
    threading.Lock() as lock — 自动获取和释放锁，避免死锁。\n\n临时修改状态：如 torch.no_grad()、decimal.localcontext()
    — 退出时自动恢复原状态。\n\n异步上下文管理器（async with）：使用 aenter 和 aexit，用于异步资源管理（如 aiohttp.ClientSession）。\n\n###
    五、面试追问：多个上下文管理器\n\n```python\n# Python 3.10+ 支持括号分组\nwith (\n    open('input.txt')
    as fin,\n    open('output.txt', 'w') as fout,\n):\n    fout.write(fin.read())\n```\n\n或使用
    contextlib.ExitStack 动态管理多个上下文管理器。\n\n---"

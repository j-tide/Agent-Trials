content:
  prompt: 装饰器知道吗？介绍一下 Python 中的装饰器及其应用场景
answer:
  mode: rubric
  reference_answer: "### 一、本质\n\n装饰器是一个接受函数作为参数、返回新函数的高阶函数。它利用 Python 的「函数是一等公民」特性，在不修改原函数代码的前提下，为函数添加额外功能。本质上是闭包
    + 函数替换。\n\n```python\n@decorator\ndef func():\n    pass\n\n# 等价于：\nfunc = decorator(func)\n```\n\n###
    二、基本实现\n\n```python\nimport functools\n\ndef timer(func):\n    @functools.wraps(func)
    \ # 保留原函数的 __name__、__doc__ 等元信息\n    def wrapper(*args, **kwargs):\n        start
    = time.time()\n        result = func(*args, **kwargs)\n        print(f\"{func.__name__}
    耗时: {time.time() - start:.4f}s\")\n        return result\n    return wrapper\n\n@timer\ndef
    train_model(epochs):\n    ...\n```\n\nfunctools.wraps 是关键细节——不加的话，被装饰函数的 name
    会变成 wrapper，影响调试和文档生成。面试中提到这个是加分项。\n\n### 三、带参数的装饰器（三层嵌套）\n\n```python\ndef retry(max_retries=3,
    delay=1):\n    def decorator(func):\n        @functools.wraps(func)\n        def
    wrapper(*args, **kwargs):\n            for attempt in range(max_retries):\n                try:\n
    \                   return func(*args, **kwargs)\n                except Exception
    as e:\n                    if attempt == max_retries - 1:\n                        raise\n
    \                   time.sleep(delay)\n        return wrapper\n    return decorator\n\n@retry(max_retries=5,
    delay=2)\ndef call_llm_api(prompt):\n    ...\n```\n\n### 四、类装饰器\n\n```python\nclass
    CacheResult:\n    def __init__(self, func):\n        self.func = func\n        self.cache
    = {}\n    \n    def __call__(self, *args):\n        if args not in self.cache:\n
    \           self.cache[args] = self.func(*args)\n        return self.cache[args]\n\n@CacheResult\ndef
    expensive_embedding(text):\n    ...\n```\n\n### 五、核心应用场景\n\n日志记录：自动记录函数调用参数、返回值、耗时，在大模型推理服务中用于
    trace 追踪。\n\n权限校验：FastAPI 的依赖注入和 Flask 的 @login_required 本质上都是装饰器模式。\n\n缓存/记忆化：@functools.lru_cache、@functools.cache
    用于缓存函数返回值，在 RAG 系统中缓存 Embedding 计算结果。\n\n重试机制：对 LLM API 调用自动重试，处理限流和超时。\n\n类型检查/参数校验：Pydantic
    的 @validator、FastAPI 的参数注解背后都是装饰器。\n\n注册机制：Flask 的 @app.route()、PyTorch 的 @torch.no_grad()
    等。\n\n---"

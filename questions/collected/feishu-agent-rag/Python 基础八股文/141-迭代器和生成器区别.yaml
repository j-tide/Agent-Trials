content:
  prompt: 迭代器和生成器区别？
answer:
  mode: rubric
  reference_answer: "### 一、迭代器（Iterator）\n\n迭代器是实现了迭代器协议的对象，即同时实现了 iter() 和 next()
    方法。iter() 返回自身，next() 返回下一个元素，当没有更多元素时抛出 StopIteration 异常。\n\n```python\nclass
    CountDown:\n    def __init__(self, start):\n        self.current = start\n    \n
    \   def __iter__(self):\n        return self\n    \n    def __next__(self):\n
    \       if self.current <= 0:\n            raise StopIteration\n        self.current
    -= 1\n        return self.current + 1\n```\n\n### 二、生成器（Generator）\n\n生成器是创建迭代器的简洁语法——使用
    yield 关键字的函数会自动成为生成器函数，调用后返回一个生成器对象（天然就是迭代器）。\n\n```python\ndef countdown(start):\n
    \   while start > 0:\n        yield start\n        start -= 1\n\ngen = countdown(5)
    \ # 返回生成器对象，不立即执行\nnext(gen)           # 5 — 执行到 yield 暂停\nnext(gen)           #
    4 — 从上次暂停处继续\n```\n\n### 三、核心区别\n\n[嵌入表格未展开]\n\n### 四、生成器的核心优势——惰性求值\n\n```python\n#
    列表：一次性加载到内存，10GB 文件直接 OOM\nlines = [line for line in open('huge_file.txt')]\n\n#
    生成器：逐行读取，内存占用恒定\nlines = (line for line in open('huge_file.txt'))\n```\n\n在 AI
    工程中，生成器广泛应用于：流式处理大规模训练数据、LLM 推理的流式输出（yield token）、分批加载 Embedding 计算结果等。\n\n###
    五、yield from 与 send()\n\n```python\n# yield from：委托给子生成器\ndef chain(*iterables):\n
    \   for it in iterables:\n        yield from it\n\n# send()：向生成器内部发送数据\ndef accumulator():\n
    \   total = 0\n    while True:\n        value = yield total\n        total +=
    value\n```\n\n---"

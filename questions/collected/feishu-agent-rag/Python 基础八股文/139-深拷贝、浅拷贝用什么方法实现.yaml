content:
  prompt: 深拷贝、浅拷贝？用什么方法实现？
answer:
  mode: rubric
  reference_answer: |-
    ### 一、核心区别

    赋值（=）：不创建新对象，只是新建一个引用指向同一个对象。修改任何一个引用都会影响到另一个。

    浅拷贝（Shallow Copy）：创建一个新的容器对象，但容器内部的元素仍然是原始对象的引用。只拷贝了「一层」。

    深拷贝（Deep Copy）：递归地创建所有层级的新对象，完全独立于原始对象。修改拷贝不会影响原始对象，反之亦然。

    ### 二、图示理解

    ```python
    import copy

    original = [[1, 2, 3], [4, 5, 6]]

    shallow = copy.copy(original)       # 浅拷贝
    deep    = copy.deepcopy(original)   # 深拷贝

    original[0][0] = 999

    print(shallow[0][0])  # 999 — 浅拷贝的内层列表是同一个对象
    print(deep[0][0])      # 1   — 深拷贝完全独立
    ```


    ### 五、面试加分点

    Python 3.13 引入了实验性的 free-threading 模式（PEP 703），通过偏向引用计数（biased reference counting）、延迟引用计数和分代 GC 改造等技术，在不严重影响单线程性能的前提下移除了 GIL。这是 Python 社区二十多年来最重大的架构变化，预计将在 3.14/3.15 逐步稳定。面试中提到这一点会展现你对 Python 生态前沿的关注。


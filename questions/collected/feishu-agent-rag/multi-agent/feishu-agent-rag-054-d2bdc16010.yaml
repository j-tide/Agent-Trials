content:
  prompt: 多 Agent 怎么实现，之间如何完成通信？怎么协作？
answer:
  mode: rubric
  reference_answer: "实现方式：\n\n（1）共享状态图（Shared State Graph）— 推荐\n\n```python\n# LangGraph
    实现\nfrom langgraph.graph import StateGraph\n\nclass TeamState(TypedDict):\n    task:
    str\n    plan: list\n    research_results: str\n    draft: str\n    review: str\n
    \   final_output: str\n\ngraph = StateGraph(TeamState)\ngraph.add_node(\"planner\",
    planner_agent)\ngraph.add_node(\"researcher\", researcher_agent)\ngraph.add_node(\"writer\",
    writer_agent)\ngraph.add_node(\"reviewer\", reviewer_agent)\n\ngraph.add_edge(\"planner\",
    \"researcher\")\ngraph.add_edge(\"researcher\", \"writer\")\ngraph.add_edge(\"writer\",
    \"reviewer\")\ngraph.add_conditional_edges(\"reviewer\", \n    lambda state: \"writer\"
    if state[\"review\"] == \"needs_revision\" else END)\n```\n\n（2）消息传递（Message Passing）\n\n```python\n#
    Agent 之间通过消息队列通信\nclass AgentMessage:\n    sender: str\n    receiver: str\n    content:
    str\n    metadata: dict\n\n# 使用事件总线\nevent_bus.publish(AgentMessage(\n    sender=\"researcher\",\n
    \   receiver=\"writer\",\n    content=\"调研完成，以下是关键发现...\",\n    metadata={\"task_id\":
    \"123\"}\n))\n```\n\n（3）黑板模式（Blackboard Pattern）\n\n- 共享的\"黑板\"数据结构，所有 Agent 可读可写\n\n-
    适合需要多个 Agent 对同一问题贡献信息的场景\n\n协作模式：\n\n- 串行管道：Agent A → Agent B → Agent C，适合流水线式任务\n\n-
    并行执行：多个 Agent 同时处理不同子任务，结果汇总\n\n- 层级调度：Orchestrator Agent 负责分配和协调\n\n- 辩论/评审：多个
    Agent 对同一问题给出不同方案，由评审 Agent 择优\n\n- 投票共识：多个 Agent 投票决定最终方案\n\n---"

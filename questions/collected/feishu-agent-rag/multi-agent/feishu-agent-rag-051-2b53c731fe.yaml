content:
  prompt: 聊一下 Multi-Agent，你是怎么做意图识别的？
answer:
  mode: rubric
  reference_answer: "Multi-Agent 系统概述：\n\nMulti-Agent 系统通过多个专业化 Agent 的协作来解决复杂问题。核心挑战之一就是意图识别——准确理解用户意图并路由到正确的
    Agent。\n\n意图识别的实现方式：\n\n方案一：LLM Router（主流方案）\n\n```python\nROUTER_PROMPT = \"\"\"你是一个意图路由器。根据用户输入，判断应该由哪个
    Agent 处理。\n\n可用 Agent：\n1. code_agent: 处理代码编写、调试、代码审查相关任务\n2. data_agent: 处理数据分析、可视化、报表生成相关任务\n3.
    research_agent: 处理信息检索、调研、资料整理相关任务\n4. writing_agent: 处理文案撰写、文档编辑、翻译相关任务\n\n输出
    JSON: {\"agent\": \"agent_name\", \"confidence\": 0.0-1.0, \"reasoning\": \"...\"}\n\"\"\"\n\ndef
    route(user_input):\n    result = llm.call(ROUTER_PROMPT + f\"\\n\\n用户输入：{user_input}\")\n
    \   routing = json.loads(result)\n    if routing[\"confidence\"] < 0.7:\n        return
    fallback_agent  # 低置信度走兜底\n    return get_agent(routing[\"agent\"])\n```\n\n方案二：嵌入相似度
    + 分类器（低延迟方案）\n\n```python\n# 预处理：为每个 Agent 的能力描述生成嵌入\nagent_embeddings = {\n    \"code_agent\":
    embed(\"代码编写 调试 审查 编程 bug修复\"),\n    \"data_agent\": embed(\"数据分析 可视化 图表 报表 统计\"),\n
    \   # ...\n}\n\n# 运行时\nuser_embedding = embed(user_input)\nscores = {name: cosine_similarity(user_embedding,
    emb) \n          for name, emb in agent_embeddings.items()}\nbest_agent = max(scores,
    key=scores.get)\n```\n\n方案三：关键词 + 规则引擎（确定性方案）\n\n- 适合领域明确、意图有限的场景\n\n- 正则匹配 +
    关键词词典 + 规则优先级\n\n- 优点：零延迟、100% 可预测\n\n实际项目推荐：规则兜底 + LLM Router 组合。先用规则匹配高确定性意图，匹配不上再走
    LLM Router。\n\n---"

  prompt: 对 Manus 技术特点的理解及其多智能体方案的判断依据
answer:
  mode: rubric
  reference_answer: |-
    Manus 技术特点：

    Manus 是 2025 年 3 月由中国公司 Butterfly Effect（Monica）发布的首个通用自主 Agent 平台，后被 Meta 收购。

    核心技术架构：

    - 三层 Agent 架构：Planner（规划）+ Executor（执行）+ Verifier（验证）

    - 多模型混合：集成 Claude、Qwen 微调版本等多个 LLM，根据任务类型选择最优模型

    - CodeAct 范式：Agent 的"行动"是生成并执行 Python 代码，而非固定格式的 tool_call。灵活性极高，可以在一段代码中组合多个工具。

    - 云端沙箱执行：每个任务在独立的云端虚拟机中执行，异步处理，用户可以离线等待

    - Wide Research：多个通用 Agent 实例并行工作，不是角色分工模式，而是"同质化并行"

    多智能体方案的判断依据：

    - 任务本身涉及多个独立子领域（如旅行规划 = 机票+酒店+行程+预算）→ 需要多 Agent

    - 任务需要规划-执行-验证的完整流程 → 需要多 Agent（至少 3 个角色）

    - 单 Agent 的上下文窗口不足以承载所有信息 → 拆分 Agent 各持部分上下文

    - 需要提高可靠性（验证 Agent 检查执行 Agent 的输出）→ 多 Agent 互检

    Manus 的局限（面试中可以提到以示客观）：

    - 幻觉问题仍然存在

    - 复杂任务可能运行数小时

    - 成本较高（密集调用多个大模型 API）

    - 实际评测中有些任务（如实时预订）仍然失败率较高


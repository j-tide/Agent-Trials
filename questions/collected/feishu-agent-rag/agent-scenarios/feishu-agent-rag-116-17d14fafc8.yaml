content:
  prompt: 上线后还有什么问题需要解决的？
answer:
  mode: rubric
  reference_answer: |-
    上线后的持续性挑战：

    - 长尾问题：总有预料之外的用户输入，需要持续收集 bad case 并优化

    - 模型漂移：API 模型更新可能导致行为变化，需要回归测试监控

    - 成本优化：监控 Token 消耗趋势，识别优化点（缓存、Prompt 精简、模型降级）

    - 知识库更新：RAG 知识库需要定期更新，保持信息时效性

    - 用户反馈闭环：建立"反馈→分析→改进→验证"的持续优化循环

    - 安全对抗：Prompt Injection 攻击手段不断演进，安全策略需要持续更新

    - 可观测性完善：根据线上问题补充监控指标和告警规则

    - 合规审计：定期审查 Agent 行为是否符合业务合规要求


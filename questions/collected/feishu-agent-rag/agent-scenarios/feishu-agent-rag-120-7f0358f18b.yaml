answer:
  mode: rubric
  reference_answer: "当需要生成超出模型单次输出限制（如 4K-64K Token）的长文本时：\n\n方案一：分段生成 + 拼接\n\n```python\ndef
    generate_long_text(outline):\n    sections = []\n    for section in outline:\n
    \       prompt = f\"\"\"\n        文章整体大纲：{outline}\n        已生成的内容摘要：{summarize(sections)}\n
    \       \n        请生成以下章节的完整内容：\n        {section.title}\n        {section.requirements}\n
    \       \n        注意与前文的衔接和一致性。\n        \"\"\"\n        content = llm.generate(prompt)\n
    \       sections.append(content)\n    return \"\\n\\n\".join(sections)\n```\n\n方案二：大纲→扩展→润色三阶段\n\n```text\nStage
    1: 生成详细大纲（含每节的要点和字数要求）\nStage 2: 逐节扩展为完整内容\nStage 3: 全局润色（检查一致性、修正衔接）\n```\n\n方案三：利用长输出模型\n\n-
    Claude Opus 4.6 支持 64K 输出 Token（约 5 万中文字）\n\n- GPT-5.2 支持 128K 输出 Token\n\n- 对于长度在模型输出限制内的文本，可以一次性生成\n\n关键挑战：\n\n-
    前后一致性：分段生成时每段需要\"看到\"前文的摘要\n\n- 风格统一：不同段落的语气和风格可能不一致\n\n- 结构完整：确保总分总结构，不遗漏章节\n\n推荐方案：大纲驱动
    + 分段生成 + 全局审校。这是目前最稳定的长文本生成方案。"

  prompt: 如果设计的全流程要先发行一版，你准备保留哪些重要的功能（节点）？
answer:
  mode: rubric
  reference_answer: |-
    MVP 版本保留的核心节点：

    - 编剧 Agent（必须保留）：故事的灵魂，没有好的剧本其他都无意义

    - 分镜描述（必须保留）：将剧本转化为可执行的画面指令

    - 画面生成（必须保留）：核心产出

    - 基础排版（简化保留）：对话框+分格，用模板化方案

    可以暂时去掉的：

    - 角色设计 Agent → MVP 阶段用固定的角色设定手动准备

    - 审核 Agent → MVP 阶段由人工审核

    - 分发 Agent → MVP 阶段手动发布

    核心原则：先跑通"故事→画面→排版"的最短链路，验证核心体验。


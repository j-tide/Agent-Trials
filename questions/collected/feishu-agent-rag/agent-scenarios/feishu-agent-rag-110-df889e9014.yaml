content:
  prompt: 如果要你做一个 Agent，获取爆款内容，生成图片，该怎么做？
answer:
  mode: rubric
  reference_answer: |-
    系统设计：

    ```text
    ┌─────────────────────────────────────────────────────┐
    │                 Content Agent System                  │
    ├──────────┬──────────┬──────────┬──────────┬──────────┤
    │ 热点监测  │ 内容分析  │ 文案生成  │ 图片生成  │ 分发管理  │
    │ Agent    │ Agent    │ Agent    │ Agent    │ Agent    │
    └──────────┴──────────┴──────────┴──────────┴──────────┘
    ```

    详细流程：

    Step 1 - 热点监测 Agent：

    - 工具：社交媒体 API（微博热搜/抖音/小红书）、Google Trends API

    - 任务：每小时扫描热门话题，筛选与目标领域相关的爆款内容

    - 输出：热点主题列表 + 热度分数 + 参考内容链接

    Step 2 - 内容分析 Agent：

    - 工具：Web Scraper、内容分析 LLM

    - 任务：分析爆款内容的特征（标题模式、情感基调、视觉风格）

    - 输出：内容策略 brief（风格、调性、关键元素）

    Step 3 - 文案生成 Agent：

    - 工具：LLM + 文案模板库

    - 任务：根据分析结果生成多版本文案

    - 输出：3-5 个候选文案

    Step 4 - 图片生成 Agent：

    - 工具：DALL-E / Midjourney / Stable Diffusion API

    - 任务：根据文案和视觉策略生成配图

    - 关键 Prompt 设计：将文案的核心意象转化为图像生成 Prompt

    - 输出：每个文案配 2-3 张候选图片

    Step 5 - 分发管理 Agent：

    - 工具：各平台 API

    - 任务：根据平台特性调整格式，定时发布


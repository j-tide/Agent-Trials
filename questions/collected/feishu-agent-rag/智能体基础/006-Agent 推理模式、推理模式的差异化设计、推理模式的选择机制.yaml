  prompt: Agent 推理模式、推理模式的差异化设计、推理模式的选择机制
answer:
  mode: rubric
  reference_answer: |-
    主流推理模式对比：

    差异化设计要点：

    - 推理深度：Direct < CoT < ReAct < Plan-and-Solve < ToT

    - 工具依赖：Direct/CoT 不需要工具，ReAct 强依赖工具，Plan-and-Solve 适度依赖

    - 计算开销：与推理深度正相关，需要权衡效果与成本

    - 容错机制：ReAct 通过观察修正，Reflexion 通过显式自我批评修正

    选择机制（决策树）：

    - 任务是否需要外部信息？否 → CoT / Direct；是 → 进入下一判断

    - 任务步骤是否明确？是 → Plan-and-Solve；否 → 进入下一判断

    - 任务是否需要动态适应？是 → ReAct；否 → 进入下一判断

    - 任务是否对准确性有极高要求？是 → Reflexion / ToT

    - 实际项目中通常采用混合模式：用 Plan-and-Solve 做全局规划，每个子任务内部用 ReAct 执行


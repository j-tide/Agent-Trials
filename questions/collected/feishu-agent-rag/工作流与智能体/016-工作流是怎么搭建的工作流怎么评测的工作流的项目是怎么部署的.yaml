    评测方法：

    - 节点级评测：每个 LLM 节点单独构建 test set，评估准确率、格式一致性

    - 端到端评测：用真实用例跑完整流程，评估最终输出质量

    - 指标体系：

    - 回归测试：每次 Prompt 或流程变更后执行自动化回归

    部署架构：

    - 中小规模：单体应用 + FastAPI 足够，部署在 Docker 容器中

    - 大规模生产：微服务架构

    - 推荐实践：从单体开始，当某个节点成为瓶颈时再拆分为微服务（避免过早微服务化带来的运维复杂度）

  prompt: 如何看 data+ai，例如在金融行业智能 Agent 检测到风险时实时邮件通知等应用场景
answer:
  mode: rubric
  reference_answer: |-
    Data + AI 的核心理念：AI Agent 不是独立运行的，而是深度嵌入到企业的数据流中，实现"感知数据变化 → 智能分析 → 自动行动"的闭环。

    金融风控 Agent 的设计：

    ```text
    数据源层：
      实时行情数据 → Kafka 流
      交易数据 → 数据库 CDC
      新闻舆情 → Web Crawler

    感知层（Trigger Agent）：
      规则引擎：价格波动 > 5% → 触发分析
      异常检测模型：交易模式异常 → 触发分析

    分析层（Analysis Agent）：
      工具：金融数据API、历史数据库、新闻搜索
      任务：综合多维度信息，评估风险等级和影响范围

    行动层（Action Agent）：
      风险等级=高 → 邮件+短信通知风控团队 + 自动暂停相关策略
      风险等级=中 → 邮件通知 + 生成分析报告
      风险等级=低 → 记录日志 + 每日汇总
    ```

    关键挑战：实时性（延迟要求秒级）、准确性（金融领域误报成本极高）、合规性（操作审计追踪）。


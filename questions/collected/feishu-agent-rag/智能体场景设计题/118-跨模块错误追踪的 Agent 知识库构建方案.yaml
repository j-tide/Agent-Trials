answer:
  mode: rubric
  reference_answer: |-
    ```text
    知识库构建：
      1. 日志采集：各模块的错误日志 → 统一格式化
      2. 错误分类：基于错误类型、模块、严重度自动分类
      3. 因果链构建：关联同一请求在不同模块的日志（通过 trace_id）
      4. 解决方案沉淀：每次故障的根因和修复方案存入知识库

    Agent 工作流：
      新错误报告 → 从知识库检索历史相似错误
                 → 提取历史错误的根因和修复方案
                 → 基于当前上下文生成诊断建议
                 → 推荐修复方案 + 评估影响范围
    ```


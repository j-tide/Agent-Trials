content:
  prompt: NL2SQL 场景下的 SQL 安全防护
answer:
  mode: rubric
  reference_answer: |-
    核心安全风险：LLM 生成的 SQL 可能包含危险操作（DROP、DELETE、数据泄露查询等）。

    多层防护：

    ```text
    Layer 1 - Prompt 层约束：
      "你只能生成 SELECT 查询。禁止 INSERT/UPDATE/DELETE/DROP/ALTER。
       禁止访问以下表：users_auth, payment_info。"

    Layer 2 - SQL 静态分析：
      解析生成的 SQL AST
      检查禁止的操作类型
      检查禁止的表名
      检查 WHERE 子句（防止全表扫描）

    Layer 3 - 数据库层防护：
      使用只读数据库账户
      设置查询超时（如 30 秒）
      设置结果集行数限制（如 1000 行）
      数据库级别的行级安全（Row-Level Security）

    Layer 4 - 结果过滤：
      对查询结果做 PII 脱敏
      日志审计所有执行的 SQL
    ```


content:
  prompt: 什么是 CoT（Chain of Thought）？为什么它能提高模型处理复杂任务的能力？
answer:
  mode: rubric
  reference_answer: |-
    CoT（思维链） 是一种让 LLM 在给出最终答案前先展示推理步骤的技术。

    基本形式：

    ```text
    问题：小明有 5 个苹果，给了小红 2 个，又买了 3 个，现在有几个？

    Without CoT：6个（可能直接给错误答案）

    With CoT：
    Step 1: 小明初始有 5 个苹果
    Step 2: 给了小红 2 个，剩余 5-2=3 个
    Step 3: 又买了 3 个，最终 3+3=6 个
    答案：6个
    ```

    为什么 CoT 有效：

    - 分解复杂问题：将一个多步推理问题拆分为多个简单步骤，每步的推理负担更小

    - 激活中间状态：强制模型生成中间推理结果，这些结果成为后续推理的"工作记忆"

    - 自我校验：中间步骤使得模型有机会发现并纠正前面的错误

    - 减少跳跃推理：防止模型从问题直接"跳到"答案，跳过关键推理步骤

    CoT 的变体：

    工程实践注意事项：

    - CoT 会增加输出 Token（推理过程也是 Token），增加成本

    - 对于简单任务，CoT 反而可能降低效率

    - 部分模型内置了思考模式（如 Claude 的 extended thinking），无需在 Prompt 中显式要求


answer:
  mode: rubric
  reference_answer: |-
    原因分析：

    - 训练数据问题：训练集中包含错误信息或矛盾信息，模型学到了错误知识

    - 知识截止：模型的训练数据有截止时间，对新信息不了解但可能"自信地编造"

    - 概率采样：LLM 本质是概率模型，生成的是"最可能的下一个 Token"而非"最正确的答案"

    - 过度泛化：模型将训练中见过的模式过度泛化到新场景

    - 长上下文退化：上下文太长时，模型对中间信息的"注意力"下降，可能混淆信息

    - 指令跟随过度：模型为了"满足用户"而编造看似合理的答案


answer:
  mode: rubric
  reference_answer: |-
    拆解评估法：

    ```text
    复杂任务整体准确率 = P(规划正确) × P(每步执行正确) × P(结果汇总正确)
    ```

    逐层评估：

    - 规划评估：人工评审计划的合理性

    - 步骤评估：每个子任务独立评测

    - 集成评估：子任务结果组合后的整体质量

    - 找出最弱环节，定向优化


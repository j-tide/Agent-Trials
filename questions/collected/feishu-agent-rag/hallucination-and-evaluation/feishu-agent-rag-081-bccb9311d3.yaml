content:
  prompt: Agent 如何评估，有什么指标，数据集哪里来？
answer:
  mode: rubric
  reference_answer: |-
    评估指标体系：

    功能指标：

    - 任务完成率（Task Completion Rate）

    - 输出质量分（人工评分 1-5 分 或 LLM-as-Judge）

    - 工具调用准确率（选对了工具的比例）

    - 意图识别准确率

    效率指标：

    - 平均推理步数（越少越好）

    - 端到端延迟 P50/P95/P99

    - Token 消耗量

    - API 调用次数

    可靠性指标：

    - 异常率（工具调用失败、格式错误等）

    - 死循环率

    - 幻觉率（通过事实校验评估）

    用户体验指标：

    - 用户满意度（CSAT）

    - 重新生成率（用户点击"重新生成"的比例）

    - 对话轮数（完成任务需要的交互轮数）

    数据集来源：

    - 公开基准：GAIA、HumanEval、SWE-Bench、WebArena、ToolBench

    - 业务日志：从生产环境的真实对话中提取并标注

    - 人工构造：领域专家手动编写测试用例

    - 对抗样本：模拟边界情况和异常输入

    - 用户反馈：将用户的负面反馈转化为回归测试用例


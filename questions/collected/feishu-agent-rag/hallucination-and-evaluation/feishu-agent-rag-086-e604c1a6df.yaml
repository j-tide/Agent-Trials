  reference_answer: |-
    分层测试：

    - 单 Agent 测试：每个 Agent 独立测试其核心能力

    - 路由测试：测试意图识别和 Agent 切换的准确性

    - 集成测试：多 Agent 协作的完整流程测试

    - 边界测试：测试 Agent 间状态传递的边界情况

    Coze 平台特有策略：

    - 利用 Coze 的"调试"功能逐步执行 Workflow

    - 为每个 Plugin/Tool 编写独立的测试用例

    - 利用 Coze 的日志功能追踪 Agent 的决策路径

    - 构建标准化的测试 Prompt 集，每次变更后回归执行


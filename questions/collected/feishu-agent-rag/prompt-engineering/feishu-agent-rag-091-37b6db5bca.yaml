content:
  prompt: 如何优化 Prompt Engineering 以减少前端请求的 Token 消耗？
answer:
  mode: rubric
  reference_answer: "Token 消耗直接影响成本和延迟，以下是系统化的优化策略：\n\n（1）System Prompt 精简\n\n```text\n优化前（800
    tokens）：\n\"你是一个非常专业的、经验丰富的、在人工智能领域有深入研究的数据分析师，\n 你擅长使用Python语言编写代码，同时也精通SQL查询语言...（冗长描述）\"\n\n优化后（200
    tokens）：\n\"角色：资深数据分析师。技能：Python, SQL, 可视化。风格：简洁、数据驱动。\"\n```\n\n- 去除冗余修饰词，保留核心信息\n\n-
    实测：精简后效果几乎不变，但 Token 减少 60-70%\n\n（2）动态 Prompt 组装\n\n```python\ndef build_prompt(task_type,
    user_input):\n    base = load_base_prompt()  # 通用部分（200 tokens）\n    \n    # 仅加载当前任务需要的部分\n
    \   if task_type == \"code_review\":\n        base += load_module(\"code_review_rules\")
    \ # 150 tokens\n    elif task_type == \"data_analysis\":\n        base += load_module(\"data_analysis_rules\")
    \ # 120 tokens\n    \n    # 而非一次性加载所有模块（800+ tokens）\n    return base\n```\n\n（3）Few-shot
    示例优化\n\n- 只保留 1-2 个最典型的示例（而非 5-10 个）\n\n- 使用最短的能说明问题的示例\n\n- 对于格式简单的任务，用格式说明替代示例\n\n（4）上下文窗口管理\n\n-
    历史消息压缩（前文已述）\n\n- 工具返回结果截断（只保留关键数据）\n\n- RAG 结果精简（只注入最相关的 Top-3 段落）\n\n（5）输出约束\n\n```text\n\"请用不超过
    100 字回答\" → 直接减少输出 Token\n\"输出 JSON，不要解释\" → 避免冗长的说明性文字\n```\n\n（6）Prompt 缓存\n\n-
    利用模型的 Prompt Caching 功能（如 Anthropic 的 Prompt Caching）\n\n- 静态 System Prompt 部分只计费一次\n\n-
    对于高频相似请求，显著降低成本\n\n---"

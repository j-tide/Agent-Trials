    长期记忆压缩方案：

    - 实体-关系提取：从对话中提取结构化的实体和关系，以知识图谱形式存储

    - 主题聚合：将多次对话中关于同一主题的记忆合并为一条统一的记录

    - 重要性衰减：随时间降低记忆的权重，低权重记忆被更高层的摘要替代

    - 分层摘要：原始记忆 → 日级摘要 → 周级摘要 → 月级摘要


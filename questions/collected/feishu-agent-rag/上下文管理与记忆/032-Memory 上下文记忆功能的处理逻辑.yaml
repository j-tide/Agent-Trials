content:
  prompt: Memory 上下文记忆功能的处理逻辑
answer:
  mode: rubric
  reference_answer: "系统化回答三种模式：\n\n（1）长期记忆 → RAG 方案\n\n```text\n写入：对话结束 → LLM 提取关键信息
    → 嵌入模型生成向量 → 写入向量数据库\n读取：新对话 → 用户输入生成查询向量 → 向量库检索 Top-K → 注入 System Prompt\n\n适合：用户偏好、历史决策、项目知识等需要跨会话持久化的信息\n```\n\n（2）短期记忆
    → 上下文压缩方案\n\n```text\n实时：每轮对话追加到 messages 列表\n压缩触发：当 messages 总 Token > 阈值（通常
    70-80% 窗口容量）\n压缩方式：\n  - 保留最近 K 轮原文\n  - 将更早的对话用 LLM 压缩为摘要\n  - 摘要作为 context_summary
    注入到上下文开头\n  \n适合：当前会话内的对话历史管理\n```\n\n（3）智能模式 vs 机械模式\n\n- 机械模式：\n\n- 智能模式：\n\n推荐实践：生产环境中通常两者结合
    —— 用机械模式做基础管理（保证性能和成本可控），在关键节点用智能模式做精细化管理（保证质量）。\n\n---"

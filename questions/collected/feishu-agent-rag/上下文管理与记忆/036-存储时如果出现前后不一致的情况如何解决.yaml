content:
  prompt: 存储时如果出现前后不一致的情况如何解决？
answer:
  mode: rubric
  reference_answer: "这是一个数据一致性问题，在分布式记忆系统中非常重要：\n\n不一致的类型：\n\n- 时序不一致：用户先说\"我用 Python\"，后说\"我转到
    Go 了\"\n\n- 事实矛盾：记忆中存储\"项目使用 MySQL\"，但新对话中说\"我们用的是 PostgreSQL\"\n\n- 并发写入冲突：多个
    Agent 同时更新同一用户的记忆\n\n解决策略：\n\n（1）时间戳优先策略（Last Write Wins）\n\n```python\ndef resolve_conflict(old_memory,
    new_memory):\n    if new_memory.timestamp > old_memory.timestamp:\n        return
    new_memory  # 新信息覆盖旧信息\n    return old_memory\n```\n\n- 最简单有效，适合大部分场景\n\n（2）LLM
    智能合并\n\n```python\ndef smart_merge(old_memory, new_memory):\n    result = llm.call(f\"\"\"\n
    \   已有记忆：{old_memory}\n    新信息：{new_memory}\n    \n    判断：\n    1. 新信息是对已有记忆的更新/修正？→
    保留新信息\n    2. 新信息与已有记忆描述不同方面？→ 合并两者\n    3. 新信息与已有记忆矛盾且无法判断？→ 标记为待确认\n    \n    输出合并后的记忆。\n
    \   \"\"\")\n    return result\n```\n\n（3）置信度评分机制\n\n- 每条记忆附带置信度分数\n\n- 多次提及 →
    置信度上升\n\n- 出现矛盾 → 降低旧记忆置信度\n\n- 查询时按置信度加权\n\n（4）向用户确认\n\n- 当检测到关键信息矛盾时，主动向用户确认\n\n-
    \"我记得您之前提到使用 MySQL，但刚才您说用的是 PostgreSQL，请问哪个是正确的？\"\n\n（5）多版本共存 + 上下文决定\n\n- 同一主题保留多个版本\n\n-
    在具体使用时根据当前上下文选择最相关的版本\n\n---"

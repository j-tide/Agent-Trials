answer:
  mode: rubric
  reference_answer: "用户画像更新机制：\n\n增量更新策略（而非全量重建）：\n\n```python\ndef update_user_profile(user_id,
    new_conversation):\n    # 1. 从新对话中提取偏好变化\n    changes = llm.extract(\"\"\"\n        分析这段对话，识别用户偏好的变化：\n
    \       - 新发现的偏好\n        - 已有偏好的变化（如从 Java 转向 Python）\n        - 偏好的强化确认\n        输出格式：{\"new\":
    [...], \"changed\": [...], \"confirmed\": [...]}\n    \"\"\", new_conversation)\n
    \   \n    # 2. 获取现有画像\n    current_profile = vector_db.get(f\"profile:{user_id}\")\n
    \   \n    # 3. 合并更新（冲突解决：新信息覆盖旧信息）\n    for pref in changes[\"new\"]:\n        vector_db.upsert(\n
    \           id=f\"profile:{user_id}:{pref.key}\",\n            vector=embed(pref.description),\n
    \           payload={\n                \"value\": pref.value,\n                \"confidence\":
    0.6,  # 初始置信度\n                \"first_seen\": now(),\n                \"last_seen\":
    now(),\n                \"mention_count\": 1\n            }\n        )\n    \n
    \   for pref in changes[\"confirmed\"]:\n        existing = vector_db.get(f\"profile:{user_id}:{pref.key}\")\n
    \       existing.confidence = min(existing.confidence + 0.1, 1.0)\n        existing.last_seen
    = now()\n        existing.mention_count += 1\n        vector_db.upsert(existing)\n```\n\n短期记忆
    vs 长期记忆的区分机制：\n\n转化机制：短期记忆在会话结束时，经过筛选和压缩后\"沉淀\"为长期记忆。\n\n---"

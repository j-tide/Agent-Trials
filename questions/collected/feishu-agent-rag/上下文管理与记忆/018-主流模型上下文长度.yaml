answer:
  mode: rubric
  reference_answer: |-
    截至 2026 年 3 月的最新数据：

    关键洞察：

    - 标称窗口 ≠ 有效窗口：大多数模型在达到标称长度前就开始性能下降

    - "Lost in the Middle" 现象普遍：首尾信息召回 85-95%，中间部分降至 76-82%

    - Claude Opus 4.6 在 1M 上下文中表现最稳定，Gemini 和 GPT-5.x 在超 256K 后明显退化

    - 长上下文定价差异大：Anthropic 对 Claude 4.6 取消了长上下文附加费


content:
  prompt: 讲讲一些不常见的设计模式，你是怎么理解和使用的？
answer:
  mode: rubric
  reference_answer: "在 Agent 系统中特别有用的设计模式：\n\n（1）责任链模式（Chain of Responsibility）\n\n-
    用途：多层安全检查、多级意图路由\n\n```python\nclass InputFilter:\n    def __init__(self, next_filter=None):\n
    \       self.next = next_filter\n    \n    def handle(self, input):\n        if
    self.can_handle(input):\n            return self.process(input)\n        elif
    self.next:\n            return self.next.handle(input)\n\n# 安全检查 → 意图识别 → Agent
    路由 → 执行\npipeline = SafetyFilter(IntentClassifier(AgentRouter(Executor())))\n```\n\n（2）策略模式（Strategy）\n\n-
    用途：动态选择推理策略（ReAct/Plan-and-Solve/Direct）\n\n```python\nclass Agent:\n    def set_strategy(self,
    strategy: ReasoningStrategy):\n        self.strategy = strategy\n    \n    def
    execute(self, task):\n        return self.strategy.execute(task)\n```\n\n（3）观察者模式（Observer）\n\n-
    用途：Agent 事件监控和可观测性\n\n- Agent 执行的每一步发布事件，监控系统订阅并记录\n\n（4）装饰器模式（Decorator）\n\n-
    用途：为工具调用添加重试、日志、计时等横切关注点\n\n```python\n@retry(max_attempts=3)\n@log_execution\n@timeout(30)\ndef
    call_tool(name, args):\n    return tool_registry[name](**args)\n```\n\n（5）中介者模式（Mediator）\n\n-
    用途：Multi-Agent 的 Orchestrator，协调多个 Agent 间的通信\n\n- Agent 之间不直接通信，而是通过 Mediator
    中转\n\n---"

answer:
  mode: rubric
  reference_answer: "核心思路：根据任务特征动态选择最优的执行策略。\n\n```python\nclass StrategySelector:\n
    \   def select_strategy(self, task):\n        complexity = self.assess_complexity(task)\n
    \       time_sensitivity = self.assess_urgency(task)\n        subtask_dependency
    = self.analyze_dependencies(task)\n        \n        if complexity == \"low\"
    and len(task.subtasks) <= 2:\n            return SingleAgentStrategy()  # 简单任务单
    Agent 处理\n        \n        elif subtask_dependency == \"independent\":\n            return
    ParallelStrategy()  # 子任务独立→并行执行\n        \n        elif subtask_dependency ==
    \"sequential\":\n            return PipelineStrategy()  # 子任务有顺序→流水线\n        \n
    \       elif complexity == \"high\" and time_sensitivity == \"low\":\n            return
    DebateStrategy()  # 复杂+不紧急→多Agent辩论\n        \n        else:\n            return
    HierarchicalStrategy()  # 默认层级调度\n```\n\n切换机制：\n\n- 运行中检测到某个策略效果不佳（如单 Agent 处理超时），自动切换到多
    Agent 并行\n\n- 错误率超过阈值时，从自动模式切换到 Human-in-the-Loop 模式\n\n- 基于历史任务数据训练策略选择模型，持续优化\n\n---"

content:
  prompt: 你设计的 Agent 是怎么实现 ReAct 模式的？
answer:
  mode: rubric
  reference_answer: "实现架构：\n\n```python\nclass ReActAgent:\n    def __init__(self,
    llm, tools, max_iterations=10):\n        self.llm = llm\n        self.tools =
    {t.name: t for t in tools}\n        self.max_iterations = max_iterations\n    \n
    \   def run(self, query):\n        messages = [{\"role\": \"system\", \"content\":
    self.system_prompt}]\n        messages.append({\"role\": \"user\", \"content\":
    query})\n        \n        for i in range(self.max_iterations):\n            #
    1. Think - LLM 推理\n            response = self.llm.call(messages, tools=list(self.tools.values()))\n
    \           \n            # 2. 检查是否为最终回答\n            if not response.tool_calls:\n
    \               return response.content  # 最终答案\n            \n            # 3.
    Act - 执行工具\n            messages.append(response.message)  # 记录 assistant 的 tool_call\n
    \           \n            for tool_call in response.tool_calls:\n                try:\n
    \                   result = self.tools[tool_call.name].execute(tool_call.args)\n
    \               except Exception as e:\n                    result = f\"工具执行失败:
    {str(e)}\"\n                \n                # 4. Observe - 注入观察结果\n                messages.append({\n
    \                   \"role\": \"tool\",\n                    \"tool_call_id\":
    tool_call.id,\n                    \"content\": str(result)\n                })\n
    \       \n        return \"达到最大迭代次数，以下是目前收集的信息：...\" + self._summarize(messages)\n```\n\n关键设计决策：\n\n-
    System Prompt 中的 ReAct 指令：明确要求模型先思考（Thought），再决定行动（Action），观察结果后再思考\n\n- 工具描述质量：每个工具的
    description 是 Agent 准确选择的关键\n\n- 错误恢复：工具失败时不终止，而是将错误信息返回给模型，让模型自行决定换工具或换策略\n\n-
    循环退出：除最大迭代次数外，还可以检测连续相同工具调用（死循环检测）\n\n---"

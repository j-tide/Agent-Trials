content:
  prompt: 任务分解后，会根据任务执行结果调整任务列表吗？
answer:
  mode: rubric
  reference_answer: "是的，好的 Agent 必须支持动态调整计划。 这是 AdaPlanner（自适应规划）的核心思想。\n\n```python\nclass
    AdaptivePlanner:\n    def execute_plan(self, task):\n        plan = self.create_plan(task)
    \ # 初始计划\n        \n        for i, step in enumerate(plan.steps):\n            result
    = self.execute_step(step)\n            \n            # 检查执行结果是否符合预期\n            evaluation
    = self.evaluate_step_result(step, result)\n            \n            if evaluation.status
    == \"success\":\n                plan.update_context(step, result)  # 更新后续步骤的上下文\n
    \               \n            elif evaluation.status == \"partial_success\":\n
    \               # 调整后续步骤以适应部分结果\n                remaining_steps = plan.steps[i+1:]\n
    \               plan.steps[i+1:] = self.revise_plan(remaining_steps, result)\n
    \               \n            elif evaluation.status == \"failure\":\n                #
    重大调整：可能需要重新规划\n                if evaluation.is_recoverable:\n                    plan.insert_recovery_step(i+1,
    evaluation.recovery_action)\n                else:\n                    plan =
    self.replan(task, completed=plan.steps[:i], failure=result)\n```\n\n调整时机：\n\n-
    某个步骤执行失败 → 插入恢复步骤或跳过\n\n- 步骤返回意外结果（如搜索无结果）→ 调整后续查询策略\n\n- 发现新信息改变了问题本质 → 全局重新规划\n\n-
    中间步骤发现任务已经可以提前完成 → 跳过剩余步骤\n\n---"

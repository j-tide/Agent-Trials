  prompt: 复杂任务怎么去拆解任务，以及如何更好地调用工具？
answer:
  mode: rubric
  reference_answer: |-
    任务拆解方法论：

    ```python
    DECOMPOSITION_PROMPT = """
    将以下复杂任务拆解为可执行的子任务：

    任务：{task}

    要求：
    1. 每个子任务应该是原子操作（单一、明确、可验证）
    2. 标注子任务之间的依赖关系（哪些可以并行，哪些必须串行）
    3. 为每个子任务推荐最合适的工具
    4. 估计每个子任务的难度（low/medium/high）

    输出格式：
    {
      "subtasks": [
        {"id": 1, "description": "...", "depends_on": [], "tools": ["..."], "difficulty": "low"},
        {"id": 2, "description": "...", "depends_on": [1], "tools": ["..."], "difficulty": "medium"}
      ],
      "execution_order": [[1,3], [2,4], [5]]  // 第一组并行，第二组并行，第三组串行
    }
    """
    ```

    更好地调用工具的策略：

    - 工具选择精准化：为每个子任务匹配最合适的工具，而非让模型自由选择

    - 参数预填充：利用上下文信息预填充工具参数

    - 结果验证：每次工具调用后验证结果是否合理

    - Fallback 链：主工具失败时自动切换到备选工具

    - 批量调用：独立的工具调用并行执行


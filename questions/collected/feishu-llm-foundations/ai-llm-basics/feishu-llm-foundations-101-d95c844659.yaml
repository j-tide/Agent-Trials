    - Python类型注解的重要性：

    - Dict：用于注解字典类型，如Dict[str, str]表示键值都是字符串的字典

    - Tuple：用于注解固定长度和类型的元组，如坐标点Tuple[float, float]

    - Set：用于注解集合类型，适用于去重数据

    - Union：用于表示多种可能的类型，如Union[int, str]

    - Optional：表示可选类型，等价于Union[Type, None]

    - Any：表示任意类型，但应该谨慎使用

    - Literal：用于限定具体的字面量值


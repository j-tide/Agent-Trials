    - 面试官关注：能否结合实际项目分析微调流程的优化点。

    - 实际项目应用：能否举例说明微调带来的性能提升。

    - 关键环节：数据清洗与标注、样本均衡、超参数选择（学习率、batch size）、正则化、训练监控、早停机制、模型评估与对比。

    - 优化方法：数据增强、迁移学习、混合精度训练、分布式训练、自动调参。

    - 评估指标：准确率、召回率、F1、BLEU、ROUGE等。

    - 实际案例：医疗问答系统微调后专业术语识别率提升15%。


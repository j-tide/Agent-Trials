    - 表现形式：虚构事实、错误推理、过度泛化、矛盾内容

    - 影响：误导用户、降低可信度、暴露技术局限

    - 特点：难以完全避免，需要多方面缓解

    - 幻觉问题的基本概念：

    - 数据噪声和质量问题


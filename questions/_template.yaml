# Copy this file and rename it to <stable-question-id>.yaml
schema_version: 1

id: replace-with-stable-id
version: 1

# single_choice | multiple_choice | true_false | fill_blank |
# short_answer | coding | agent_task | composite
type: single_choice
status: draft
language: zh-CN

title: 题目标题
summary: 题目要考察的核心能力
difficulty: 2
estimated_minutes: 8

skills:
  - id: agent-basics
    name: Agent 基础
    weight: 1.0

tags:
  - replace-with-tag

content:
  prompt: |
    在这里填写题目描述。

  # single_choice / multiple_choice / true_false 使用 options。
  options:
    - id: A
      text: 选项 A
    - id: B
      text: 选项 B

  # coding 可使用以下字段：
  # language: python
  # starter_code: |
  #   def solution():
  #       pass

  # agent_task 可使用以下字段：
  # objective: 完成一个可验证的 Agent 任务
  # tools:
  #   - search
  #   - ask_user
  # constraints:
  #   - 不得编造事实

answer:
  # exact | rubric | hidden_tests | trajectory
  mode: exact
  value: B

  # short_answer 可改为：
  # reference_answer: |
  #   参考答案
  # key_points:
  #   - 关键点一
  #   - 关键点二

evaluation:
  # choice | text_match | llm_judge | unit_test | trajectory | multi_stage
  plugin: choice
  config:
    score: 100
    wrong_score: 0

feedback:
  correct: |
    答对后的解释。
  wrong: |
    答错后的解释。

hints:
  - 第一个提示
  - 第二个提示

learning:
  concepts:
    - replace-with-concept
  scheduler:
    initial_interval_days: 1
    max_interval_days: 30

references:
  - title: 参考资料标题
    url: https://example.com
